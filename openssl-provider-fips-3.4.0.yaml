# Status: Draft Tested [Submitted]
# Draft: updates and changes are allowed
# Tested: upgrades should be done only upon request from AtSec
# Submitted: freeze build, fork a new source package, no more updates
package:
  name: openssl-provider-fips-3.4.0
  version: 3.4.0
  epoch: 4
  description: "the OpenSSL cryptography suite (FIPS provider module)"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - binutils=2.44-r0
      - build-base=1-r8
      - busybox=1.37.0-r30
      - ca-certificates-bundle=20241121-r1
      - cyrus-sasl=2.1.28-r7
      - gcc=14.2.0-r10
      - gdbm=1.24-r3
      - git=2.48.1-r1
      - glibc-dev=2.40-r22
      - glibc-locale-posix=2.40-r22
      - glibc=2.40-r22
      - gmp=6.3.0-r4
      - heimdal-libs=7.8.0-r9
      - isl=0.27-r0
      - jitterentropy-library-dev=3.5.0-r0
      - jitterentropy-library=3.5.0-r0
      - keyutils-libs=1.6.3-r30
      - krb5-conf=1.0-r4
      - krb5-libs=1.21.3-r2
      - ld-linux=2.40-r22
      - libatomic=14.2.0-r10
      - libbrotlicommon1=1.1.0-r4
      - libbrotlidec1=1.1.0-r4
      - libbz2-1=1.0.8-r11
      - libcom_err=1.47.2-r20
      - libcrypt1=2.40-r22
      - libcrypto3=3.4.1-r0
      - libcurl-openssl4=8.12.1-r0
      - libevent=2.1.12-r6
      - libexpat1=2.6.4-r2
      - libgcc=14.2.0-r10
      - libgo=14.2.0-r10
      - libgomp=14.2.0-r10
      - libidn2=2.3.7-r3
      - libldap=2.6.9-r0
      - libnghttp2-14=1.64.0-r1
      - libpcre2-8-0=10.45-r0
      - libpsl=0.21.5-r4
      - libquadmath=14.2.0-r10
      - libssl3=3.4.1-r0
      - libstdc++-dev=14.2.0-r10
      - libstdc++=14.2.0-r10
      - libunistring=1.3-r1
      - libverto=0.3.2-r4
      - libxcrypt-dev=4.4.38-r1
      - libxcrypt=4.4.38-r1
      - libzstd1=1.5.7-r0
      - linux-headers=6.13.5-r0
      - make=4.4.1-r4
      - mpc=1.3.1-r5
      - mpfr=4.2.1-r5
      - ncurses-terminfo-base=6.5_p20241228-r1
      - ncurses=6.5_p20241228-r1
      - nss-db=2.40-r22
      - nss-hesiod=2.40-r22
      - oldglibc-2.34=2.34-r2
      - openssf-compiler-options=20240627-r12
      - perl=5.40.1-r0
      - pkgconf=2.4.1-r0
      - posix-cc-wrappers=1-r4
      - readline=8.2.13-r1
      - scanelf=1.3.8-r2
      - sqlite-libs=3.49.1-r0
      - wolfi-baselayout=20230201-r18
      - zlib=1.3.1-r5
  environment:
    # To support automatic discovery of source code in debug symbols
    # packaged in openssl-dbg, build with debug symbols &
    # file-prefix-map. Also see "Create dbg sourcecode" and
    # split/debug.
    CFLAGS: "-g -ffile-prefix-map=/home/build=/usr/src/${{package.name}}"
    GCC_SPEC_FILE: "openssf-melange.spec"

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/openssl

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/openssl
      tag: ${{package.full-version}}
      expected-commit: 94879bf0b61c50c50315614df8eb5df612d09dc5

  - name: Configure and build
    runs: |
      echo FIPS_VENDOR=Chainguard >> VERSION.dat
      version=${{package.version}}
      fullversion=${{package.full-version}}
      suffix=${fullversion##$version-}
      sed -i "s|\(PRE_RELEASE_TAG=.*\)|\1$suffix|" VERSION.dat

      perl ./Configure \
         linux-${{build.arch}} \
         --prefix=/usr \
         --libdir=lib \
         --openssldir=/etc/ssl \
         enable-fips \
         enable-fips-pedanticonly \
         disable-fips186-4-ffc \
         enable-fips-jitter \
         enable-ktls \
         enable-jitter \
         shared \
         no-dsa \
         no-des \
         no-zlib \
         no-async \
         no-comp \
         no-idea \
         no-mdc2 \
         no-rc5 \
         no-ec2m \
         no-sm2 \
         no-sm4 \
         no-ssl3 \
         no-seed \
         no-weak-ssl-ciphers \
         -Wa,--noexecstack --debug
      perl configdata.pm --dump
      make build_all_generated

      # Create source tree after VERSION.dat tweaks and generated code
      # Otherwise one cannot use gdb on .c.in code
      SRCDIR=$(mktemp -d)
      cp -r . $SRCDIR/
      mkdir -p ${{targets.destdir}}-dbg/usr/src/
      mv $SRCDIR ${{targets.destdir}}-dbg/usr/src/${{package.name}}
      # Note that mktemp -d created it as 700, whilst the contents
      # inside is 644 for files and 755 for dirs, without this gdb
      # doesn't work for non-root user, fix this up.
      chmod 755 ${{targets.destdir}}-dbg/usr/src/${{package.name}}

      make -j$(nproc)
      make tests HARNESS_JOBS=10 || true

  - runs: |
      make install_fips DESTDIR="${{targets.destdir}}"

subpackages:
  - name: "${{package.name}}-dbg"
    description: "${{package.name}} debug symbols"
    pipeline:
      - uses: split/debug
      # Regenerate fipsmodule.cnf last, after strip or split/debug
      - runs: |
          rm -f ${{targets.destdir}}/etc/ssl/fipsmodule.cnf
          ./util/wrap.pl ./apps/openssl fipsinstall \
          -pedantic \
          -module ${{targets.destdir}}/usr/lib/ossl-modules/fips.so \
          -out ${{targets.destdir}}/etc/ssl/fipsmodule.cnf

update:
  # Can update, until the build is tested and submitted
  # Flip to frozen, and fork a new source package
  enabled: false
  exclude-reason: |
    Can only upgrade once there is a new submission with atsec.
