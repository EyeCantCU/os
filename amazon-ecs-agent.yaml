package:
  name: amazon-ecs-agent
  version: "1.98.0"
  epoch: 0
  description: Amazon ECS Container Agent
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - amazon-ecs-cni-plugins
      - amazon-ssm-agent
      - amazon-vpc-cni-plugins
      - docker
      - iptables
      - systemd

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/amazon-ecs-agent
      tag: v${{package.version}}
      expected-commit: 7d5ec06fbcec75a802453e921ab65c6704a26857

  - uses: go/build
    with:
      ldflags: -X agent/version.Version=${{package.version}} -X agent/version.GitShortHash=$(git rev-parse --short=8 HEAD)
      modroot: ./agent
      tidy: true
      vendor: true
      output: amazon-ecs-agent
      packages: ./

  - uses: go/build
    with:
      ldflags: -X ecs-init/version.Version=${{package.version}} -X ecs-init/version.GitShortHash=$(git rev-parse --short=8 HEAD)
      modroot: ./ecs-init
      tidy: true
      vendor: true
      output: amazon-ecs-init
      packages: ./

# TODO this will require systemd configs
test:
  pipeline:
    - runs: |
        amazon-ecs-agent -version
        amazon-ecs-init -version

update:
  enabled: true
  github:
    identifier: aws/amazon-ecs-agent
    strip-prefix: v
    tag-filter: v
