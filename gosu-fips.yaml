package:
  name: gosu-fips
  version: "1.19"
  epoch: 0 # CVE-2025-47907
  description: Simple Go-based setuid+setgid+setgroups+exec
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tianon/gosu
      tag: ${{package.version}}
      expected-commit: 6456aaa0f3c854d199d0f037f068eb97515b7513

  - uses: go/build
    with:
      packages: .
      output: gosu
      go-package: go-fips

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        gosu --version
        gosu --help
        gosu 0:0 echo "Hello Wolfi"

update:
  enabled: true
  github:
    identifier: tianon/gosu
    use-tag: true
