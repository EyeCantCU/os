package:
  name: gosu-fips
  version: "1.18"
  epoch: 0 # CVE-2025-47907
  description: Simple Go-based setuid+setgid+setgroups+exec
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tianon/gosu
      tag: ${{package.version}}
      expected-commit: b1d0abd88f1d0944e6096cc597b32b73215333e5

  - uses: go/build
    with:
      packages: .
      output: gosu
      go-package: go-fips

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        gosu --version
        gosu --help
        gosu 0:0 echo "Hello Wolfi"

update:
  enabled: true
  github:
    identifier: tianon/gosu
    use-tag: true
