package:
  name: envoy-fips-1.33
  version: "1.33.3"
  epoch: 1
  description: Cloud-native high-performance edge/middle/service proxy
  copyright:
    - license: Apache-2.0
  resources:
    cpu: 30
    memory: 60Gi
  dependencies:
    provides:
      - envoy-fips=${{package.full-version}}
    runtime:
      - boringssl-fips-static-${{vars.boringssl}}-tools

environment:
  contents:
    packages:
      - bash
      - bazel-6
      - binutils
      - boringssl-fips-static-${{vars.boringssl}}-compat
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang~15
      - cmake
      - coreutils
      # We need to stick to gcc 12 for now, envoy doesn't build with gcc >= 13
      - gcc-12-default
      - git
      - libtool
      - llvm-libcxx-15
      - llvm-libcxx-15-dev
      - llvm-libcxxabi-15
      - llvm-lld-15
      - llvm15
      - llvm15-cmake-default
      - llvm15-dev
      - llvm15-tools
      - ncurses~6.4_p20230722
      - openjdk-11
      - patch
      - python3-dev<3.13
      - samurai
      - wolfi-baselayout

vars:
  boringssl: "2023042800"

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: envoy-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/envoyproxy/envoy
      tag: v${{package.version}}
      expected-commit: dfe02b93e0e43a08fa0d838bb9e4c2c9f44d3586
      destination: envoy

  - uses: patch
    working-directory: envoy
    with:
      patches: ../0001-version-Print-FIPS-module-version.patch ../6faf29988bc4e7fe85af56ff382e2b4321424569.patch

  - runs: |
      export JAVA_HOME=/usr/lib/jvm/java-11-openjdk
      mkdir -p .cache/bazel/_bazel_root

      cd envoy
      # The Python interpreter complains about being run as root, there's a flag to pass to disable that warning.
      sed -i 's/envoy_dependencies_extra()/envoy_dependencies_extra(ignore_root_user_error=True)/g' WORKSPACE

      ./bazel/setup_clang.sh /usr
      echo "build --config=libc++" >> user.bazelrc

      # Choose boringssl-fips
      # See https://github.com/envoyproxy/envoy/blob/v1.27.0/bazel/BUILD#L475
      echo "build --define=boringssl=fips" >> user.bazelrc

      # Use our pre-built boringssl-fips-static
      echo "build --override_repository=boringssl_fips=/usr/lib/boringssl-fips-static" >> user.bazelrc

      bazel build --verbose_failures -c opt envoy

      mkdir -p ${{targets.destdir}}/usr/bin/
      cp bazel-bin/source/exe/envoy-static ${{targets.destdir}}/usr/bin/envoy

      # We no longer need this cache dir, which has some writable files.
      rm -rf ../.cache/bazel/_bazel_root

  - uses: strip

subpackages:
  - name: envoy-fips-oci-entrypoint-${{vars.envoy-version}}
    description: Entrypoint for using Envoy in OCI containers
    dependencies:
      provides:
        - envoy-fips-oci-entrypoint=${{package.full-version}}
      runtime:
        - busybox
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/var/lib/envoy/init
          cp envoy/ci/docker-entrypoint.sh ${{targets.subpkgdir}}/var/lib/envoy/init/envoy-entrypoint.sh
          chmod +x ${{targets.subpkgdir}}/var/lib/envoy/init/envoy-entrypoint.sh

  - name: envoy-fips-config-${{vars.envoy-version}}
    description: Default Envoy configuration
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/etc/envoy
          cp envoy/configs/envoyproxy_io_proxy.yaml ${{targets.subpkgdir}}/etc/envoy/envoy.yaml
    dependencies:
      provides:
        - envoy-fips-config=${{package.full-version}}

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.33.

test:
  pipeline:
    - runs: envoy --version
    - runs: |
        envoy_version=$(envoy --version | sed -n 's|.*/BoringSSL-FIPS-\(.*\)|\1|p')
        [ "$envoy_version" = "${{vars.boringssl}}" ]
        /usr/bin/bssl-test_fips
        bssl_version=$(/usr/bin/bssl-test_fips | sed -n 's|^Module version: \(.*\)|\1|p')
        [ "$bssl_version" = "${{vars.boringssl}}" ]
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 4953
        software-version: ${{vars.boringssl}}
