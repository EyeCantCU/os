package:
  name: chart-iamguarded-elasticsearch
  version: "22.0.9"
  epoch: 1
  description: Elasticsearch iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common
      - chart-iamguarded-kibana

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: elasticsearch/${{package.version}}
      expected-commit: de3a1700f9dfd25356d9450993b95337cf61cf23

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/elasticsearch

  - uses: charts/package
    with:
      chart-path: iamguarded/elasticsearch

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: elasticsearch/
    use-tag: true
    tag-filter-prefix: elasticsearch/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /elasticsearch
