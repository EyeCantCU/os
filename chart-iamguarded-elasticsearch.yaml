package:
  name: chart-iamguarded-elasticsearch
  version: "22.0.3"
  epoch: 5
  description: Elasticsearch iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common
      - chart-iamguarded-kibana

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: elasticsearch/${{package.version}}
      expected-commit: 338e18a44389a547e16154e0c74abee522a68e77

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/elasticsearch

  - uses: charts/package
    with:
      chart-path: iamguarded/elasticsearch

update:
  enabled: false
  manual: true
  schedule:
    period: daily
    reason: Update automation doesn't yet support automating from private repos.
  git:

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /elasticsearch
