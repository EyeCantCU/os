package:
  name: vault-secrets-operator
  version: 0.9.1
  epoch: 0
  description: The Vault Secrets Operator (VSO) allows Pods to consume Vault secrets natively from Kubernetes Secrets.
  copyright:
    - license: MPL-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/vault-secrets-operator
      tag: v${{package.version}}
      expected-commit: eb49549f8a70c81a4a662e171f78644dac52d071

  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.33.0
      modroot: .

  - uses: go/build
    with:
      packages: .
      modroot: .
      output: vault-secrets-operator
      ldflags: '$(bash ./scripts/ldflags-version.sh)'


subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/bin
          ln -sf /usr/bin/vault-secrets-operator ${{targets.contextdir}}/bin/vault-secrets-operator

update:
  enabled: true
  github:
    identifier: hashicorp/vault-secrets-operator
    strip-prefix: v

test:
  pipeline:
    - runs: |
        vault-secrets-operator --help
        vault-secrets-operator --version
