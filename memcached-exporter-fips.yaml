package:
  name: memcached-exporter-fips
  version: 0.14.4
  epoch: 0
  description: Exports metrics from memcached servers for consumption by Prometheus.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/memcached_exporter
      tag: v${{package.version}}
      expected-commit: 277c78894347b087cae7fa34a2f550b677f8e383

  - uses: go/build
    with:
      packages: ./cmd/memcached_exporter
      output: memcached_exporter
      go-package: go-fips

  - uses: strip

subpackages:
  - name: ${{package.name}}-bitnami-compat
    description: "compat package with bitnami/memcached-exporter fips image"
    pipeline:
      - uses: bitnami/compat
        with:
          image: memcached-exporter
          version-path: 0/debian-12
    test:
      pipeline:
        - runs: |
            run-script --version
            run-script --help

update:
  enabled: true
  github:
    identifier: prometheus/memcached_exporter
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    # AUTOGENERATED
    - uses: test/go-fips-check
    - runs: |
        memcached_exporter --version
        memcached_exporter --help
