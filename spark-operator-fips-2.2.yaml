# This package exists as a temporary stop gap for this escalation: https://github.com/chainguard-dev/internal-dev/issues/15474
# Please dont upgrade to a v2.3 or higher.
package:
  name: spark-operator-fips-2.2
  version: "2.2.1"
  epoch: 3
  description: Kubernetes operator for managing the lifecycle of Apache Spark applications on Kubernetes.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - procps
    provides:
      - spark-operator-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubeflow/spark-operator
      tag: v${{package.version}}
      expected-commit: c2a5e60080f07b63d5fd86dbaa62e560a4a20834

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        github.com/go-viper/mapstructure/v2@v2.3.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/operator
      output: spark-operator
      ldflags: |
        -X github.com/kubeflow/spark-operator/v2.version=$(cat VERSION | sed "s/^v//")
        -X github.com/kubeflow/spark-operator/v2.buildDate=$(date -u +"%Y-%m-%dT%H:%M:%S%:z")
        -X github.com/kubeflow/spark-operator/v2.gitCommit=$(git rev-parse HEAD)
        -X github.com/kubeflow/spark-operator/v2.gitTreeState=$(if [ -z "`git status --porcelain`" ]; then git describe --exact-match --tags HEAD 2>/dev/null; fi)

update:
  enabled: true
  github:
    identifier: kubeflow/spark-operator
    tag-filter-prefix: v2.2.
    strip-prefix: v
    use-tag: true
  ignore-regex-patterns:
    - spark-operator-chart-.* # Not the relevant tags

test:
  environment:
    contents:
      packages:
        - sparkctl-fips
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        spark-operator version | grep ${{package.version}}
        spark-operator --help
        sparkctl --version
        sparkctl --help
