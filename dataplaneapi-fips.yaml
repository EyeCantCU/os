package:
  name: dataplaneapi-fips
  version: "3.2.0"
  epoch: 1
  description: HAProxy Data Plane API
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/haproxytech/dataplaneapi
      tag: v${{package.version}}
      expected-commit: d5e775cc073ffa2e0a49e3c38c265cf9299d860d

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/dataplaneapi
      output: dataplaneapi
      ldflags: |
        -X main.BuildTime=$(date -d@${SOURCE_DATE_EPOCH} +%FT%T%z)
        -X main.GitRepo=https://github.com/haproxytech/dataplaneapi
        -X main.GitCommit=$(git rev-parse --short HEAD)
        -X main.GitTag=v${{package.version}}

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: haproxytech/dataplaneapi
    strip-prefix: v
