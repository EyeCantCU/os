package:
  name: nri-discovery-kubernetes-fips
  version: "1.13.6"
  epoch: 0
  description: New Relic Infrastructure discovery-kubernetes Integration (FIPS)
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-discovery-kubernetes
      expected-commit: 6b8f78b51e416a09f113dca6027c33b1da987c9c
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/discovery/
      output: nri-discovery-kubernetes
      go-package: go-fips
      ldflags: |
        -X github.com/newrelic/nri-discovery-kubernetes/discovery/main.Version=${{package.version}}

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/var/db/newrelic-infra
          ln -sf /usr/bin/nri-discovery-kubernetes ${{targets.subpkgdir}}/var/db/newrelic-infra/nri-discovery-kubernetes
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-discovery-kubernetes
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-discovery-kubernetes
    # We need a k8s cluster to do any more testing than this
    - name: "Test binary execution"
      uses: test/daemon-check-output
      with:
        start: |
          nri-discovery-kubernetes
        expected_output: |
          failed read the configuration: cluster name is not set
        error_strings: |
          "FAIL"
          "Traceback.*most.recent.call"
