package:
  name: tigera-operator-fips
  version: 1.35.1
  epoch: 0
  description: Kubernetes operator for installing Calico and Calico Enterprise
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # for fips config & fips-provider
      - openssl-config-fipshardened
      # either melange SCA should provide these
      # or we should make go-fips shared link on these
      - so:libcrypto.so.3
      - so:libssl.so.3

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 43944ed42ece2e3e69fc9f2a2aa29da8d8f83483
      repository: https://github.com/tigera/operator
      tag: v${{package.version}}

  - uses: go/build
    with:
      packages: .
      output: operator
      ldflags: -X github.com/tigera/operator/version.VERSION=v${{package.version}}
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: tigera/operator
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - runs: |
        operator --version
        operator --help
