#nolint:valid-pipeline-git-checkout-tag
package:
  name: py3-apache-tvm-ffi
  version: 0.1.0.14
  epoch: 0
  description: TVM Foreign Function Interface (FFI) for Python bindings
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: apache-tvm-ffi
  module-name: tvm_ffi

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - cython
      - py3-supported-build-base-dev
      - py3-supported-cython
      - py3-supported-pip
      - py3-supported-scikit-build-core
      - samurai
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/tvm-ffi
      branch: main # No tags or branches
      expected-commit: b64b46f32e845b650850d73a5828a2d3f07d3406
      recurse-submodules: "true"

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    options:
      # Prevent auto-detecting tvm-ffi-config command to avoid conflicts
      # between different python versions (py3.10 vs py3.11, etc.)
      no-provides: true
    dependencies:
      runtime:
        - py${{range.key}}-typing-extensions
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.module-name}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: false
  manual: true
  exclude-reason: "Does not use tags or releases, just a version specifier in pyproject.toml"
