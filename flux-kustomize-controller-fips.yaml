package:
  name: flux-kustomize-controller-fips
  version: "1.7.3"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: The GitOps Toolkit Kustomize reconciler
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - git
      - gnupg-fips
      - gnupg-fips-gpgconf
      - gnupg-fips-utils
      - gnupg-fips-wks-client
      - gpg-fips
      - gpg-fips-agent
      - gpg-fips-wks-server
      - gpgsm-fips
      - gpgv-fips
      - openssh-client
      - openssl-config-fipshardened
      - tzdata

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 090c49bdb679f827353d1658a7ab60a168dbb3a5
      repository: https://github.com/fluxcd/kustomize-controller
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      ldflags: -X main.Version=${{package.version}}
      output: kustomize-controller
      packages: .
      go-package: go-fips

  - uses: strip

update:
  ignore-regex-patterns:
    - api/
  enabled: true
  github:
    identifier: fluxcd/kustomize-controller
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/kwok/cluster
    - name: Verify kustomize-controller installation
      runs: |
        kubectl apply -f https://github.com/fluxcd/flux2/releases/latest/download/install.yaml
        kubectl wait --for=condition=Ready nodes --all
        kustomize-controller --health-addr :9441 --metrics-addr :8081 > /dev/null 2>&1 & \
        sleep 5; curl -s localhost:8081/metrics  | grep rest_client_requests_total
    - uses: test/go-fips-check
