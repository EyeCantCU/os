package:
  name: oldglibc-2.28
  version: 2.28
  epoch: 0
  description: "the GNU C library"
  copyright:
    - license: GPL-3.0-or-later
  options:
    no-provides: true
  dependencies:
    runtime:
      - linux-headers
    provides:
      - oldglibc=${{package.full-version}}

environment:
  contents:
    packages:
      - bison
      - make-4.3
      - gcc
      - binutils
      - linux-headers
      - busybox
      - ca-certificates-bundle
      - flex
      - gawk
      - grep
      - python3
      - rdfind
      - texinfo
      - wolfi-baselayout
      - zlib
  environment:
    CFLAGS: -fcommon -DENABLE_CET

pipeline:
  - uses: fetch
    with:
      uri: http://ftp.gnu.org/gnu/libc/glibc-${{package.version}}.tar.xz
      expected-sha256: b1900051afad76f7a4f73e71413df4826dce085ef8ddb785a945b66d7d513082

  - name: 'Set up build directory'
    runs: |
      mkdir build

  - name: 'Configure glibc'
    runs: |
      cd build

      ../configure \
        --prefix=/usr/lib/oldglibc \
        --host=${{host.triplet.gnu}} \
        --build=${{host.triplet.gnu}} \
        --disable-werror \
        --enable-cet \
        libc_cv_cxx_link_ok=no \
        --enable-kernel=4.9

  - runs: |
      make -C build -j$(nproc)

  - runs: |
      make -C build -j$(nproc) install DESTDIR="${{targets.destdir}}"

  - name: 'Clean up'
    runs: |
      cd ${{targets.destdir}}/usr/lib/oldglibc
      rm -rf bin sbin etc libexec share var lib/*.o

  - uses: strip

update:
  enabled: false
  exclude-reason: |
    oldglibc-2.28 is a fixed old version of glibc. The version here is
    picked to result in most backwards compatible binaries for
    manylinux wheels. It is glibc supported by Debian Bullseye, Ubuntu
    20.04, RHEL 8.
