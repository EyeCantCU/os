package:
  name: torchvision-cuda12
  version: 0.17.1
  epoch: 1
  description: Datasets, Transforms and Models specific to Computer Vision
  copyright:
    - license: BSD-3-Clause
  target-architecture:
    - x86_64
  options:
    no-depends: true
  dependencies:
    runtime:
      # For some reason this isn't detected
      - libgomp
      - openmp-17-dev
      - libjpeg-turbo

environment:
  contents:
    packages:
      - patchelf
      - build-base
      - bash
      - busybox
      - ca-certificates-bundle
      - cmake
      - py3.11-installer
      - py3.11-pip
      - python-3.11
      - python-3.11-dev
      - samurai
      - clang-15-dev
      - clang-15
      - libffi-dev
      - libjpeg-dev
      - libpng-dev
      - libjpeg-turbo-dev
      - llvm15
      - llvm15-dev
      - llvm-lld-15
      - clang-15-default
      - openmp-17-dev
      - posix-libc-utils
      - gcc-12-default
      - git
      - coreutils
      - libgomp
      # Cuda
      - nvidia-driver
      - nvidia-libcusparse-12
      - nvidia-cuda-cccl-12
      - nvidia-cuda-cudart-12
      - nvidia-cuda-nvcc-12
      - nvidia-cuda-nvml-dev-12
      - nvidia-cuda-nvrtc-12
      - nvidia-cuda-nvtx-12
      - nvidia-cuda-profiler-api-12
      - nvidia-libcublas-12
      - nvidia-libcufft-12
      - nvidia-libcurand-12
      - nvidia-libcusolver-12
      - nvidia-libcusparse-12
      - nvidia-libnvjitlink-12
      - nvidia-cudnn-8
      - nvidia-cudnn-8-cuda-12
      - pytorch-cuda12
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/vision.git
      tag: v${{package.version}}
      expected-commit: 4fd856bfbcf59a4da3a91f0e12515c7ef0709777

  - name: Python Build
    runs: |
      export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:/usr/local/cuda-12.1/lib:/usr/local/cudann-8.9"
      export PATH="$PATH:/usr/local/cuda-12.3/bin"
      export CMAKE_CUDA_ARCHITECTURES=all
      export USE_CUDA=1
      export FORCE_CUDA=1
      export USE_CUDNN=1
      export TORCH_CUDA_ARCH_LIST="5.2 6.0 6.1 7.0+PTX 8.0 8.6 8.7 8.9 9.0"
      export TORCH_NVCC_FLAGS="-Xfatbin -compress-all"

      # Disable some warnings
      export CFLAGS="$CFLAGS -Wno-error=nonnull -Wno-nonnull"
      export CXXFLAGS="$CXXFLAGS -Wno-error=nonnull -Wno-nonnull"

      export CUDA_VERSION="12.3"
      export CUDA_HOME="/usr/local/cuda-12.3"

      export BUILD_VERSION="${{package.version}}+cu121"

      /usr/share/pytorch/.venv/bin/pip install --upgrade pip setuptools==65.5.1
      /usr/share/pytorch/.venv/bin/pip install wheel

      /usr/share/pytorch/.venv/bin/python setup.py bdist_wheel
      /usr/share/pytorch/.venv/bin/pip install dist/*.whl

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/torchvision
      mv /usr/share/pytorch/.venv ${{targets.destdir}}/usr/share/torchvision/

      # edit the venv paths
      sed -i "s|/usr/share/pytorch|/usr/share/torchvision|g" ${{targets.destdir}}/usr/share/torchvision/.venv/bin/*

      # allow site-packages
      sed -i "s|include-system-site-packages = false|include-system-site-packages = true|g" ${{targets.destdir}}/usr/share/torchvision/.venv/pyvenv.cfg

update:
  enabled: true
  github:
    identifier: pytorch/vision
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - wolfi-base
        - busybox

  pipeline:
    - runs: |
        export PATH=/usr/share/torchvision/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        python3 -c "import torch"
        python3 -c "import torchvision"
        python3 ./quickstart.py > output.out 2>&1
        grep -E "ERROR|None" output.out && exit 1
