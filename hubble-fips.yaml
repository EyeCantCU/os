package:
  name: hubble-fips
  version: "1.18.3"
  epoch: 2 # GHSA-38pp-6gcp-rqvm
  description: hubble is a command to list and diagnose Go processes currently running on your system.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - git
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cilium/hubble
      tag: v${{package.version}}
      expected-commit: c56853984214cbbe55e5b02b590bfe1b4d5d8302

  - uses: go/bump
    with:
      deps: |-
        github.com/cilium/cilium@v1.18.4

  # We need to disable the "-s" ldflags and CGO_ENABLED=0 for the build to be FIPS.
  - uses: go/remove-cgo-enabled-0
    with:
      seds: |
        s,CGO_ENABLED=0[ ]*,,g
        s,-w -s,-w,g

  - runs: |
      DESTDIR=${{targets.destdir}} BINDIR=/usr/bin make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility package for hubble
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -sf /usr/bin/hubble ${{targets.subpkgdir}}/usr/local/bin/hubble
      - uses: strip

update:
  enabled: true
  github:
    identifier: cilium/hubble
    strip-prefix: v

test:
  pipeline:
    - runs: |
        hubble --version
        hubble --help
    - uses: test/go-fips-check
