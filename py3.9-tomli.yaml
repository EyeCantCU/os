#nolint:git-checkout-must-use-github-updates
package:
  name: py3.9-tomli
  version: 2.0.1
  epoch: 0
  description: "TOML parser"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.9

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3.9-pip
      - python-3.9
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hukkin/tomli.git
      tag: ${{package.version}}
      expected-commit: 36ef51d6a5a55e0eca077b58695390d041061bd4

  - runs: |
      python3.9 -m pip install --prefix=/usr --root="${{targets.contextdir}}" .

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        import: tomli

update:
  enabled: true
  release-monitor:
    identifier: 207408
