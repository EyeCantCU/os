package:
  name: consul-k8s-1.6
  version: "1.6.6"
  epoch: 1
  description: The consul-k8s includes first-class integrations between Consul and Kubernetes.
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - go-discover
    provides:
      - consul-k8s=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/consul-k8s
      expected-commit: e4c67ac617f56d59b9566b16a1993caef2cb3137
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        helm.sh/helm/v3@v3.18.4
      replaces: |-
        github.com/envoyproxy/go-control-plane=github.com/envoyproxy/go-control-plane@v0.12.0
        github.com/envoyproxy/go-control-plane/contrib=github.com/envoyproxy/go-control-plane/contrib@v0.12.0
      modroot: cli

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v3@v3.0.4
      modroot: ./acceptance

  - uses: go/build
    with:
      deps: |-
        golang.org/x/net@v0.38.0
      modroot: ./control-plane/cni
      output: consul-cni
      packages: .

  - uses: go/build
    with:
      deps: |-
        golang.org/x/net@v0.38.0
      modroot: ./control-plane
      output: consul-k8s-control-plane
      packages: .

subpackages:
  - name: ${{package.name}}-cli
    description: "CLI for interacting with Consul on Kubernetes"
    pipeline:
      - uses: go/build
        with:
          modroot: ./cli
          output: consul-k8s
          packages: .
    test:
      pipeline:
        - name: Verify help
          runs: |
            consul-k8s --help

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.6.

test:
  pipeline:
    - name: Verify help
      runs: |
        consul-cni --help
        consul-k8s-control-plane --help
        consul-cni --version
        consul-k8s-control-plane --version
