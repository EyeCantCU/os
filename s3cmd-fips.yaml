package:
  name: s3cmd-fips
  version: 2.4.0
  epoch: 0
  description: Command-line tool for managing Amazon S3 and CloudFront services
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - openssl-config-fipshardened
      - py3-dateutil
      - py3-magic
      - python3

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-setuptools
      - python-3.12

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/s3tools/s3cmd
      tag: v${{package.version}}
      expected-commit: 9d17075b77e933cf9d7916435c426d38ab5bca5e

  - runs: |
      python3 setup.py build

  - runs: |
      python3 setup.py install --root="${{targets.destdir}}" --skip-build

  - uses: strip

update:
  enabled: true
  github:
    identifier: s3tools/s3cmd
    strip-prefix: v

test:
  pipeline:
    - name: Verify s3cmd installation
      runs: |
        s3cmd --version || exit 1
