package:
  name: sox-ng
  version: 14.6.0.4
  epoch: 0
  description: sox_ng is another Swiss Army Knife of sound processing utilities
  copyright:
    - license: GPL-2.0-only

environment:
  contents:
    packages:
      - build-base
      - busybox
      - libtool
      - opus-dev
      - pkgconf-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://codeberg.org/sox_ng/sox_ng.git
      tag: sox_ng-${{package.version}}
      expected-commit: 3b5dd42c676f77a15fbc72c63ca84dfcebeb191c

  - uses: autoconf/configure
    with:
      opts: |
        --enable-replace \
        --with-distro="Wolfi" \
        --with-ffmpeg

  - uses: autoconf/make
    with:
      opts: all README

  - uses: autoconf/make-install

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - "-rc"
  git:
    strip-prefix: sox_ng-

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/pkgconf

  - name: ${{package.name}}-static
    description: ${{package.name}} static libraries
    pipeline:
      - uses: split/static

test:
  pipeline:
    - uses: test/tw/ldd-check
