package:
  name: bridge-utils
  version: 1.7.1
  epoch: 1
  description: A utility for manipulating bridge devices
  copyright:
    - license: GPL-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.kernel.org/pub/scm/network/bridge/bridge-utils.git
      tag: v${{package.version}}
      expected-commit: 75d949b9fae9718201422f0bd3d1103e67dd597c

  - uses: autoconf/configure
    with:
      opts: |
        --sbindir=/usr/bin

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    description: "${{package.name}} manpages"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 217

test:
  pipeline:
    - runs: brctl --help
    - uses: test/tw/ldd-check
