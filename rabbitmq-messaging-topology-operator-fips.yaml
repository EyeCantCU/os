package:
  name: rabbitmq-messaging-topology-operator-fips
  version: "1.16.0"
  epoch: 1
  description: Open source RabbitMQ cluster operator. Kubernetes operator to deploy and manage RabbitMQ clusters.
  copyright:
    - license: MPL-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - git
  environment:
    GO111MODULE: on

pipeline:
  - uses: git-checkout
    with:
      expected-commit: eaf18b8a867b2866ef5a2921a802bb469bca20a0
      repository: https://github.com/rabbitmq/messaging-topology-operator
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v4@v4.0.5

  - uses: go/build
    with:
      output: manager
      packages: .
      tags: timetzdata
      go-package: go-fips

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        manager --help

update:
  enabled: true
  github:
    identifier: rabbitmq/messaging-topology-operator
    strip-prefix: v
