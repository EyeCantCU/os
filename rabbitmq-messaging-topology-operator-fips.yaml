package:
  name: rabbitmq-messaging-topology-operator-fips
  version: 1.14.2
  epoch: 1
  description: Open source RabbitMQ cluster operator. Kubernetes operator to deploy and manage RabbitMQ clusters.
  copyright:
    - license: MPL-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - git
  environment:
    GO111MODULE: on

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 781b70ffa9348a180ecc552342e4bb6c391ff28a
      repository: https://github.com/rabbitmq/messaging-topology-operator
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: github.com/hashicorp/go-retryablehttp@v0.7.7

  - uses: go/build
    with:
      output: manager
      packages: .
      tags: timetzdata
      go-package: go-fips

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: rabbitmq/messaging-topology-operator
    strip-prefix: v
