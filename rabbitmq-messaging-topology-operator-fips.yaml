package:
  name: rabbitmq-messaging-topology-operator-fips
  version: "1.17.3"
  epoch: 0
  description: Open source RabbitMQ cluster operator. Kubernetes operator to deploy and manage RabbitMQ clusters.
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - tzdata
  resources:
    cpu: 16
    memory: 32Gi

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 50e26209c12d081e5122e424b5ec0da111a34489
      repository: https://github.com/rabbitmq/messaging-topology-operator
      tag: v${{package.version}}

  - uses: go/build
    with:
      output: manager
      packages: .
      tags: timetzdata
      go-package: go-fips

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        manager --help

update:
  enabled: true
  github:
    identifier: rabbitmq/messaging-topology-operator
    strip-prefix: v
