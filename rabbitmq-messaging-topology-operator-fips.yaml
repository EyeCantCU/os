package:
  name: rabbitmq-messaging-topology-operator-fips
  version: "1.16.0"
  epoch: 7
  description: Open source RabbitMQ cluster operator. Kubernetes operator to deploy and manage RabbitMQ clusters.
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - tzdata
  resources:
    cpu: 16
    memory: 32Gi

pipeline:
  - uses: git-checkout
    with:
      expected-commit: eaf18b8a867b2866ef5a2921a802bb469bca20a0
      repository: https://github.com/rabbitmq/messaging-topology-operator
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v4@v4.0.5
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      output: manager
      packages: .
      tags: timetzdata
      go-package: go-fips

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        manager --help

update:
  enabled: true
  github:
    identifier: rabbitmq/messaging-topology-operator
    strip-prefix: v
