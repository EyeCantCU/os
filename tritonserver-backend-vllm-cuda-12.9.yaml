#nolint:git-checkout-must-use-github-updates,valid-pipeline-git-checkout-tag
package:
  name: tritonserver-backend-vllm-cuda-12.9
  version: 25.7.1_git20250821
  epoch: 3
  description: NVIDIA Triton Inference Server with vllm backend
  copyright:
    - license: BSD-3-Clause
  target-architecture:
    - x86_64
  resources:
    cpu: 128
    memory: 256Gi
  dependencies:
    provides:
      - tritonserver-backend-vllm = ${{package.full-version}}
    runtime:
      - cuda-toolkit-${{vars.cuda-version}}
      - py${{vars.python-version}}-aiohttp
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-cloudpickle
      - py${{vars.python-version}}-filelock
      - py${{vars.python-version}}-huggingface-hub
      - py${{vars.python-version}}-importlib-metadata
      - py${{vars.python-version}}-jsonschema
      - py${{vars.python-version}}-numpy-2.2
      - py${{vars.python-version}}-openai
      - py${{vars.python-version}}-pandas
      - py${{vars.python-version}}-pillow
      - py${{vars.python-version}}-prometheus-client
      - py${{vars.python-version}}-protobuf
      - py${{vars.python-version}}-psutil
      - py${{vars.python-version}}-pydantic
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-pyzmq
      - py${{vars.python-version}}-regex
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-sentencepiece
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-six
      - py${{vars.python-version}}-starlette
      - py${{vars.python-version}}-sympy
      - py${{vars.python-version}}-torch-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-torchvision-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-tqdm
      - py${{vars.python-version}}-typing-extensions
      - py${{vars.python-version}}-xformers-cuda-${{vars.cuda-version}}
      - tritonserver-cuda-${{vars.cuda-version}}
  options:
    # https://github.com/chainguard-dev/internal-dev/issues/7609
    no-depends: true

vars:
  cuda-version: 12.9
  cudnn-version: 9
  gcc-version: 14
  import: vllm
  python-version: 3.12
  tensorrt-version: 8.6.3
  triton-repo-tag: r25.07
  vllm-version: 0.10.2
  vllm-expected-commit: e017120ed146cc3069d18428322d67881cb95e67
  torch-version: 2.7
  torchvision-version: 0.22

var-transforms:
  - from: ${{vars.cuda-version}}
    match: '(\d+)\.\d+$'
    replace: '$1'
    to: cuda-major-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - gcc-${{vars.gcc-version}}
      - gperftools-dev
      - ninja-build
      - numactl-dev
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - nvidia-cuda-nvml-dev-${{vars.cuda-version}}
      - nvidia-cuda-profiler-api-${{vars.cuda-version}}
      - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}-dev
      - nvidia-nccl-cuda-${{vars.cuda-version}}-dev
      - py${{vars.python-version}}-aiohttp
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-filelock
      - py${{vars.python-version}}-huggingface-hub
      - py${{vars.python-version}}-importlib-metadata
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-numpy-2.2
      - py${{vars.python-version}}-openai
      - py${{vars.python-version}}-pandas
      - py${{vars.python-version}}-pillow
      - py${{vars.python-version}}-prometheus-client
      - py${{vars.python-version}}-protobuf
      - py${{vars.python-version}}-psutil
      - py${{vars.python-version}}-pydantic
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-pyzmq
      - py${{vars.python-version}}-regex
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-sentencepiece
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-setuptools-scm
      - py${{vars.python-version}}-six
      - py${{vars.python-version}}-sympy
      - py${{vars.python-version}}-torch-cuda-${{vars.cuda-version}}-dev
      - py${{vars.python-version}}-tqdm
      - py${{vars.python-version}}-typing-extensions
      - samurai
      - sccache
      - tcmalloc-minimal
      - uv
      - wolfi-base
  environment:
    MAX_JOBS: 64
    NVCC_APPEND_FLAGS: -ccbin gcc-${{vars.gcc-version}}
    TORCH_CUDA_ARCH_LIST: "7.0 7.2 7.5 8.0 8.6 8.7 8.9 9.0 9.0a"
    GCC_SPEC_FILE: no-hardening.spec # https://github.com/chainguard-dev/internal-dev/issues/14995

pipeline:
  - uses: git-checkout
    working-directory: /home/build/vllm_backend
    with:
      expected-commit: 8c28d97b9756623ebe701d4b92b97625a5223ea1
      repository: https://github.com/triton-inference-server/vllm_backend.git
      branch: r25.07
      recurse-submodules: true

  - working-directory: /home/build/vllm_backend
    runs: |
      mkdir -p ${{targets.destdir}}/opt/tritonserver/backends/vllm
      cp -r src/* ${{targets.destdir}}/opt/tritonserver/backends/vllm

  - working-directory: /home/build/vllm
    pipeline:
      - uses: git-checkout
        working-directory: vllm
        with:
          repository: https://github.com/vllm-project/vllm.git
          tag: v${{vars.vllm-version}}
          expected-commit: ${{vars.vllm-expected-commit}}
      - uses: patch
        with:
          patches: ../nvtx.patch ../xgrammar-GHSA-9q5r-wfvf-rr7f-fix.patch
      - runs: |
          # Build a version of vllm for the cuda version for this version of tritonserver
          # Setup the virtualenv for vllm to get correct interpreters
          uv venv -p python${{vars.python-version}} --link-mode copy --system-site-packages /opt/tritonserver/venv
          source /opt/tritonserver/venv/bin/activate

          export PATH=/usr/local/cuda-${{vars.cuda-version}}/bin:$PATH

          # Install build dependencies that are needed before building
          pip${{vars.python-version}} install regex jinja2

          # Install specific setuptools version required by vllm
          pip${{vars.python-version}} install "setuptools>=77.0.3,<80.0.0"

          pip3.12 install cmake ninja
          # cd ..
          # git clone https://github.com/NVIDIA/NVTX.git
          # cd NVTX
          # mkdir -p build && cd build
          # cmake ..
          # make install
          # cd ../../vllm


          python${{vars.python-version}} use_existing_torch.py
          python${{vars.python-version}} -m build -n
          deactivate
      - runs: |
          # Install to venv destination
          source /opt/tritonserver/venv/bin/activate
          mkdir -p ${{targets.destdir}}/opt/tritonserver/venv

          pip${{vars.python-version}} install --verbose \
            --no-index --no-build-isolation --no-deps \
            --force-reinstall --no-compile --prefix="/opt/tritonserver/venv" --root=${{targets.contextdir}} dist/vllm-*.whl
          pip${{vars.python-version}} install --verbose \
            --requirement=requirements/cuda.txt --force-reinstall --no-deps \
            --prefix=/opt/tritonserver/venv --root="${{targets.contextdir}}"
          # Addt'l deps found by iterating on the `python -c "import vllm"` test
          pip${{vars.python-version}} install --verbose --no-deps --force-reinstall \
            --prefix=/opt/tritonserver/venv --root="${{targets.contextdir}}" \
            safetensors triton

          # Remediate GHSA-9hjg-9r4m-mvj7
          pip${{vars.python-version}} install --verbose --upgrade \
            --prefix=/opt/tritonserver/venv --root="${{targets.contextdir}}" \
            "requests>=2.32.4"

          # Remediate GHSA-xg8h-j46f-w952
          pip${{vars.python-version}} install --verbose --upgrade \
            --prefix=/opt/tritonserver/venv --root="${{targets.contextdir}}" \
            "pillow==11.3.0"

          python${{vars.python-version}} -m compileall --invalidation-mode=unchecked-hash -r100 ${{targets.contextdir}}/opt/tritonserver/venv
          deactivate

          mkdir -p ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages
          echo /opt/tritonserver/venv/lib/python${{vars.python-version}}/site-packages > \
          ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/${{package.name}}.pth
      - name: Remove psutil test code that triggers malware scan failures
        runs: |
          dir="${{targets.contextdir}}/opt/tritonserver/venv/lib/python${{vars.python-version}}/site-packages/psutil/tests"
          # Confirm it is still present
          test -d "$dir"
          rm -rf "$dir"
      - uses: strip

subpackages:
  - name: tritonserver-backend-vllm-meta-cuda-${{vars.cuda-version}}
    description: Meta package for tritonserver image with vLLM backend for CUDA ${{vars.cuda-version}}
    dependencies:
      provides:
        - tritonserver-backend-vllm-meta=${{package.full-version}}
      runtime:
        - tritonserver-backend-vllm-cuda-${{vars.cuda-version}}
        - tritonserver-backend-python-cuda-${{vars.cuda-version}}
        - tritonserver-cuda-${{vars.cuda-version}}
        - python-${{vars.python-version}}

test:
  pipeline:
    - name: Verify vllm installation
      uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}

update:
  enabled: true
  git: {}
  schedule:
    period: monthly
    reason: |
      Monthly checks ensure we don't miss updates while avoiding excessive build triggers.
      The upstream project does not publish tags, they have branches that correspond to monthly releases.
      While updating, update version to the corresponding monthly release.
      Also, check on the latest version of CUDA being shipped with tritonserver image and update this manifest accordingly.
