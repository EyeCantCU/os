package:
  name: longhorn-ui-1.9
  version: "1.9.2"
  epoch: 1
  description: ui component for Longhorn, a cloud-native distributed block storage system for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - longhorn-ui=${{package.full-version}}
    runtime:
      - gettext
      - iproute2
      - nginx

environment:
  contents:
    packages:
      - bash
      - busybox
      - gettext
      - nodejs-22
      - npm
  environment:
    VERSION: "v${{package.version}}"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/longhorn/longhorn-ui.git
      tag: v${{package.version}}
      expected-commit: 06a290532827a801b015d895aafe1be73949b563

  - name: build
    runs: |
      npm ci
      npm install terser-webpack-plugin@4 --save-dev
      envsubst '${VERSION}' < src/utils/config.js > src/utils/config.js.subst
      mv src/utils/config.js.subst src/utils/config.js
      npm run build

  - name: install
    runs: |
      mkdir -p ${{targets.destdir}}/web
      mkdir -p ${{targets.destdir}}/etc/nginx
      cp -r dist ${{targets.destdir}}/web/
      install -Dm644 nginx.conf.template ${{targets.destdir}}/etc/nginx/nginx.conf.template

  - name: copy script
    runs: |
      # Longhorn UI uses a long chained command to start the container prior to version 1.10
      # In longhorn-ui-1.10, the chained command was moved to a script.
      # https://github.com/longhorn/longhorn-ui/blob/v1.9.2/Dockerfile#L37
      mkdir -p ${{targets.destdir}}/usr/local/bin
      install -Dm755 start-nginx.sh ${{targets.destdir}}/usr/local/bin/

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.9
  ignore-regex-patterns:
    - .*-rc[0-9]$ # Ignore RC tags like v1.9.1-rc1
    - .*dev.* # Ignore dev tags like v1.10.0-dev-20250713

test:
  environment:
    contents:
      packages:
        - curl
        - nodejs-22
        - npm
        - wait-for-it
        - shadow
    environment:
      LONGHORN_MANAGER_IP: "http://localhost"
      LONGHORN_UI_PORT: 8080
  pipeline:
    - name: "Test Longhorn UI"
      uses: test/daemon-check-output
      with:
        start: "npx http-server /web/dist -p 8080"
        timeout: 60
        expected_output: |
          serving
          Available on
        post: |
          wait-for-it -t 10 --strict localhost:8080 -- echo "Server is up"
          curl -f http://localhost:8080/index.html | grep "DOCTYPE html" # dynamically loads content with react, so we just check that something exists
    - runs: stat /usr/local/bin/start-nginx.sh
    - name: "Test entrypoint script"
      uses: test/daemon-check-output
      with:
        setup: |
          useradd nginx
        start: "start-nginx.sh"
        timeout: 60
        expected_output: |
          No IPv6 address detected
          running in IPv4-only mode
        post: |
          wait-for-it -t 10 --strict localhost:8080 -- echo "Server is up"
          curl -f http://localhost:8080/index.html | grep "DOCTYPE html" # dynamically loads content with react, so we just check that something exists
    - runs: stat /usr/local/bin/start-nginx.sh
