# Creates meta-packages used in building nvidia/cuda images; provides base, runtime and devel packages
package:
  name: cuda-12.3
  version: 12.3
  # version of the the cuda-toolkit and the run-time dependencies are tracked referencing NVIDIA's toolkit versions
  epoch: 2
  description: Meta-packages for providing CUDA runtime and devel packages
  copyright:
    - license: PROPRIETARY
  target-architecture:
    - x86_64

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

subpackages:
  - name: cuda-base-${{vars.cuda-version}}
    description: Meta-package for providing cuda-base-${{vars.cuda-version}} packages
    dependencies:
      runtime:
        - nvidia-cuda-cudart-${{vars.cuda-version}}
        - nvidia-cuda-compat-${{vars.cuda-version}}

  - name: cuda-libraries-${{vars.cuda-version}}
    description: Meta-package for providing cuda-${{vars.cuda-version}} libraries
    dependencies:
      runtime:
        - nvidia-cuda-cudart-${{vars.cuda-version}}
        - nvidia-cuda-nvrtc-${{vars.cuda-version}}
        - nvidia-cuda-opencl-${{vars.cuda-version}}
        - nvidia-libcublas-${{vars.cuda-version}}
        - nvidia-libcufft-${{vars.cuda-version}}
        - nvidia-libcufile-${{vars.cuda-version}}
        - nvidia-libcurand-${{vars.cuda-version}}
        - nvidia-libcusolver-${{vars.cuda-version}}
        - nvidia-libcusparse-${{vars.cuda-version}}
        - nvidia-libnpp-${{vars.cuda-version}}
        - nvidia-libnvjitlink-${{vars.cuda-version}}
        - nvidia-libnvjpeg-${{vars.cuda-version}}

  - name: cuda-runtime-${{vars.cuda-version}}
    description: Meta-package for providing cuda-runtime-${{vars.cuda-version}}-packages
    dependencies:
      runtime:
        - cuda-base-${{vars.cuda-version}}
        - nvidia-cuda-nvtx-${{vars.cuda-version}}
        - nvidia-libnpp-${{vars.cuda-version}}
        - nvidia-libcusparse-${{vars.cuda-version}}
        - nvidia-libcublas-${{vars.cuda-version}}
        - nvidia-nccl-cuda-${{vars.cuda-version}}
        - cuda-libraries-${{vars.cuda-version}}

  - name: cuda-runtime-${{vars.cuda-version}}-cudnn-8
    description: Meta-package for providing cuda-runtime-${{vars.cuda-version}} and cudnn-8 packages
    dependencies:
      runtime:
        - cuda-runtime-${{vars.cuda-version}}
        - nvidia-cudnn-8-cuda-12

  - name: cuda-runtime-${{vars.cuda-version}}-cudnn-9
    description: Meta-package for providing cuda-runtime-${{vars.cuda-version}} and cudnn-9 packages
    dependencies:
      runtime:
        - cuda-runtime-${{vars.cuda-version}}
        - nvidia-cudnn-9-cuda-12

  - name: cuda-libraries-${{vars.cuda-version}}-dev
    description: Meta-package for providing cuda-${{vars.cuda-version}}-dev libraries
    dependencies:
      runtime:
        - nvidia-cuda-cudart-${{vars.cuda-version}}
        - nvidia-cuda-cccl-${{vars.cuda-version}}
        - nvidia-cuda-profiler-api-${{vars.cuda-version}}
        - nvidia-libcuda
        - nvidia-cuda-nvrtc-${{vars.cuda-version}}-dev
        - nvidia-cuda-opencl-${{vars.cuda-version}}-dev
        - nvidia-libcublas-${{vars.cuda-version}}-dev
        - nvidia-libcufft-${{vars.cuda-version}}-dev
        - nvidia-libcufile-${{vars.cuda-version}}-dev
        - nvidia-libcurand-${{vars.cuda-version}}-dev
        - nvidia-libcusolver-${{vars.cuda-version}}-dev
        - nvidia-libcusparse-${{vars.cuda-version}}-dev
        - nvidia-libnpp-${{vars.cuda-version}}-dev
        - nvidia-libnvjitlink-${{vars.cuda-version}}-dev
        - nvidia-libnvjpeg-${{vars.cuda-version}}-dev

  - name: cuda-compiler-${{vars.cuda-version}}
    description: Meta-package for providing cuda-compiler-${{vars.cuda-version}} packages
    dependencies:
      runtime:
        - nvidia-cuda-cuobjdump-${{vars.cuda-version}}
        - nvidia-cuda-cuxxfilt-${{vars.cuda-version}}
        - nvidia-cuda-nvcc-${{vars.cuda-version}}
        - nvidia-cuda-nvprune-${{vars.cuda-version}}

  - name: cuda-minimal-build-${{vars.cuda-version}}
    description: Meta-package for providing cuda-minimal-build-${{vars.cuda-version}} packages
    dependencies:
      runtime:
        - cuda-compiler-${{vars.cuda-version}}
        - nvidia-cuda-cudart-${{vars.cuda-version}}-dev
        - nvidia-cuda-cccl-${{vars.cuda-version}}
        - nvidia-cuda-profiler-api-${{vars.cuda-version}}

  - name: cuda-command-line-tools-${{vars.cuda-version}}
    description: Meta-package for providing cuda-command-line-tools-${{vars.cuda-version}} packages
    dependencies:
      runtime:
        - nvidia-cuda-cupti-${{vars.cuda-version}}-dev
        - nvidia-cuda-gdb-${{vars.cuda-version}}
        - nvidia-cuda-gdb-${{vars.cuda-version}}-extras
        - nvidia-cuda-nvdisasm-${{vars.cuda-version}}
        - nvidia-cuda-nvprof-${{vars.cuda-version}}
        - nvidia-cuda-nvtx-${{vars.cuda-version}}
        - nvidia-cuda-sanitizer-api-${{vars.cuda-version}}

  - name: cuda-devel-${{vars.cuda-version}}
    description: Meta-package for providing cuda-devel-${{vars.cuda-version}} packages
    dependencies:
      runtime:
        - nvidia-cuda-cudart-${{vars.cuda-version}}-dev
        - nvidia-cuda-nvml-dev-${{vars.cuda-version}}
        - nvidia-libcusparse-${{vars.cuda-version}}-dev
        - nvidia-libnpp-${{vars.cuda-version}}-dev
        - nvidia-libcublas-${{vars.cuda-version}}-dev
        - nvidia-nsight-compute-${{vars.cuda-version}}
        - nvidia-cuda-nvprof-${{vars.cuda-version}}
        - nvidia-nccl-cuda-${{vars.cuda-version}}-dev
        - cuda-command-line-tools-${{vars.cuda-version}}
        - cuda-minimal-build-${{vars.cuda-version}}
        - cuda-compiler-${{vars.cuda-version}}
        - cuda-libraries-${{vars.cuda-version}}-dev
        - cuda-runtime-${{vars.cuda-version}}

  - name: cuda-devel-${{vars.cuda-version}}-cudnn-8
    description: Meta-package for providing cuda-devel-${{vars.cuda-version}} and cudnn8 packages
    dependencies:
      runtime:
        - nvidia-cudnn-8-cuda-12-dev
        - cuda-runtime-${{vars.cuda-version}}-cudnn-8
        - cuda-devel-${{vars.cuda-version}}

  - name: cuda-devel-${{vars.cuda-version}}-cudnn-9
    description: Meta-package for providing cuda-devel-${{vars.cuda-version}} and cudnn9 packages
    dependencies:
      runtime:
        - nvidia-cudnn-9-cuda-12-dev
        - cuda-runtime-${{vars.cuda-version}}-cudnn-9
        - cuda-devel-${{vars.cuda-version}}

update:
  enabled: false
