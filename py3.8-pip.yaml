# Generated from https://pypi.org/project/pip/
package:
  name: py3.8-pip
  version: "25.0.1"
  epoch: 0
  description: The PyPA recommended tool for installing Python packages.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.8
      - py3.8-setuptools

environment:
  contents:
    packages:
      - ca-certificates-bundle
      - wolfi-base
      - busybox
      - build-base
      - python-3.8
      - py3.8-setuptools

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/pip
      expected-commit: bc7c88cb3de9c9af769c51517833ea48bbe70d9a
      tag: ${{package.version}}

  - uses: py/pip-build-install-bootstrap
    with:
      python: python3.8
      dest: ${{targets.destdir}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - 'b'
  shared: true
  github:
    identifier: pypa/pip
    use-tag: true

test:
  pipeline:
    - runs: |
        set -o pipefail
        pip --version | grep "${{package.version}}"
        pip --help
        pip3 --version
        pip3 --help
        pip3.8 --version
        pip3.8 --help
