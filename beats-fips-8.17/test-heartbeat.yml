heartbeat.monitors:
  - type: http
    id: nginx
    name: nginx
    service.name: sampleapp
    hosts: ["http://127.0.0.1:80/test.html"]
    check.response.status: [200]
    schedule: '@every 1s'
  - type: http
    id: nginx-tls
    name: nginx-tls
    service.name: sampleapp-tls
    hosts: ["https://127.0.0.1:443/test-tls.html"]
    check.response.status: [200]
    schedule: '@every 1s'
    ssl:
      verification_mode: none
output.elasticsearch:
  enabled: false  # Disable Elasticsearch output

output.file:
  path: "/usr/share/heartbeat/output"   # Define the output path in the container
  filename: "metricbeat"
  rotate_every_kb: 10000
  number_of_files: 7
