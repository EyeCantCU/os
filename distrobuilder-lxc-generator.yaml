#nolint:valid-pipeline-git-checkout-tag
package:
  name: distrobuilder-lxc-generator
  version: "0_git20260108"
  epoch: 0
  description: LXC generator from distrobuilder
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - grep

environment:
  contents:
    packages:
      - busybox
      - shellcheck

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/lxc/distrobuilder
      expected-commit: 5c63598a5924a96501173cd36f29080cd16e8910
      branch: main

  - runs: |
      shellcheck --shell busybox -S warning distrobuilder/lxc.generator
      install -D distrobuilder/lxc.generator ${{targets.contextdir}}/usr/lib/systemd/system-generators/lxc.generator

test:
  pipeline:
    - runs: |
        /usr/lib/systemd/system-generators/lxc.generator

update:
  enabled: true
  git: {}
  schedule:
    period: daily
    reason: Need latest fixes for systemd, until next tag
