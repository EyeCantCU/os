package:
  name: py3-netaddr
  version: 1.3.0
  epoch: 0
  description: Python library for representing and manipulating network addresses.
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: netaddr

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/netaddr/netaddr.git
      tag: ${{package.version}}
      expected-commit: 85a7b25304732785ddee31be3a644a77a243a978

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | grep -E -e "4" -e "6"
            from netaddr import IPAddress
            print(IPAddress('192.168.0.1').version)
            print(IPAddress('::1').version)
            EOF

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
