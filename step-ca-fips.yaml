package:
  name: step-ca-fips
  version: 0.26.2
  epoch: 3
  description: A private certificate authority (X.509 & SSH) & ACME server for secure automated certificate management, so you can use TLS everywhere & SSO for SSH.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/smallstep/certificates
      tag: v${{package.version}}
      expected-commit: d6973c979edac1ca22d5774becabef782f096e50

  - uses: go/bump
    with:
      deps: github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/hashicorp/go-retryablehttp@v0.7.7

  - uses: go/build
    with:
      modroot: ./cmd/step-ca
      packages: .
      output: step-ca
      ldflags: -X main.Version=${{package.version}}
      tags: noyubikey
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: smallstep/certificates
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - step-fips
  pipeline:
    - name: Verify step-ca installation
      runs: |
        step-ca --version
    - name: Start step-ca server
      runs: |
        cat <<EOF > password.txt
        $RANDOM
        EOF
        step ca init --name "Example Inc." \
          --dns localhost \
          --address 127.0.0.1:8443 \
          --provisioner=bob@example.com \
          --password-file=password.txt

        step-ca $(step path)/config/ca.json --password-file password.txt &
        sleep 2
    - name: Test step-ca server
      runs: |
        step ca health

        # Create a certificate
        step ca certificate svc.example.com svc.crt svc.key --password-file password.txt
        [ -f svc.crt ]
        [ -f svc.key ]

        # Verify the provisioner
        step certificate inspect svc.crt --short | grep "bob@example.com"

        step ca revoke --cert svc.crt --key svc.key
    - name: Cleanup
      runs: |
        rm -f password.txt svc.crt svc.key
        pkill step-ca
