package:
  name: gdrcopy
  version: 2.4.2
  epoch: 0
  description: A fast GPU memory copy library based on NVIDIA GPUDirect RDMA technology
  copyright:
    - license: MIT
  target-architecture:
    - x86_64
  dependencies:
    runtime:
      - cuda-toolkit-12.3

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - cmake
      - gcc-12-default
      - bash
      # cuda
      - nvidia-driver
      - cuda-toolkit-12.3
      - cuda-toolkit-12.3-dev
      - nvidia-cudnn-8
      - nvidia-cudnn-8-cuda-12-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/gdrcopy.git
      tag: v${{package.version}}
      expected-commit: 46cda629e0b26b7f5b887dc44162792f024e8026

  - runs: |
      export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:/usr/local/cuda-12.3/lib:/usr/local/cudnn-8"
      export PATH="$PATH:/usr/local/cuda-12.3/bin"
      export CUDA_HOME=/usr/local/cuda-12.3
      make CUDA=/usr/local/cuda-12.3 install

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/local
      mkdir -p "${{targets.destdir}}"/usr/local/bin
      mkdir -p "${{targets.destdir}}"/usr/local/lib
      mkdir -p "${{targets.destdir}}"/usr/local/include

  - runs: |
      cp ./src/libgdrapi.so* "${{targets.destdir}}"/usr/local/lib/
      cp ./include/* "${{targets.destdir}}"/usr/local/include
      cp ./tests/gdrcopy_* "${{targets.destdir}}"/usr/local/bin

      cd "${{targets.destdir}}"/usr/local/bin
      ln -sf gdrcopy_apiperf apiperf
      ln -sf gdrcopy_copylat copylat
      ln -sf gdrcopy_sanity sanity
      ln -sf gdrcopy_copybw copybw

  - uses: strip

update:
  enabled: true
  github:
    identifier: NVIDIA/gdrcopy
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - wolfi-base
        - busybox
  pipeline:
    - runs: |
        [ -f /usr/local/include/gdrapi.h ] && [ -f /usr/local/include/gdrconfig.h ] && exit 0 || exit 1
