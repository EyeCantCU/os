package:
  name: gdrcopy
  version: 2.4.1
  epoch: 0
  description: A fast GPU memory copy library based on NVIDIA GPUDirect RDMA technology
  copyright:
    - license: MIT
  target-architecture:
    - x86_64
  dependencies:
    runtime:
      - nvidia-libcuda
environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - cmake
      - gcc-12-default
      - bash
      # cuda
      - nvidia-driver
      - nvidia-libcusparse-12
      - nvidia-cuda-cccl-12
      - nvidia-cuda-cudart-12
      - nvidia-cuda-nvcc-12
      - nvidia-cuda-nvml-dev-12
      - nvidia-cuda-nvrtc-12
      - nvidia-cuda-nvtx-12
      - nvidia-cuda-profiler-api-12
      - nvidia-libcublas-12
      - nvidia-libcufft-12
      - nvidia-libcurand-12
      - nvidia-libcusolver-12
      - nvidia-libcusparse-12
      - nvidia-libnvjitlink-12
      - nvidia-cudnn-8
      - nvidia-cudnn-8-cuda-12
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/gdrcopy.git
      tag: v${{package.version}}
      expected-commit: 3ab6776e63e2905d1c5f407deb6f71dcb741aa11
  - runs: |
      export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:/usr/local/cuda-12.3/lib:/usr/local/cudnn-8.9"
      export PATH="$PATH:/usr/local/cuda-12.3/bin"
      export CUDA_HOME=/usr/local/cuda-12.3
      make CUDA=/usr/local/cuda-12.3 install
  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/local
      mkdir -p "${{targets.destdir}}"/usr/local/bin
      mkdir -p "${{targets.destdir}}"/usr/local/lib
      mkdir -p "${{targets.destdir}}"/usr/local/include
  - runs: |
      cp ./src/libgdrapi.so* "${{targets.destdir}}"/usr/local/lib/
      cp ./include/* "${{targets.destdir}}"/usr/local/include
      cp ./tests/gdrcopy_* "${{targets.destdir}}"/usr/local/bin

      cd "${{targets.destdir}}"/usr/local/bin
      ln -sf gdrcopy_apiperf apiperf
      ln -sf gdrcopy_copylat copylat
      ln -sf gdrcopy_sanity sanity
      ln -sf gdrcopy_copybw copybw
  - uses: strip
update:
  enabled: true
  github:
    identifier: NVIDIA/gdrcopy
    strip-prefix: v
    tag-filter: v
    use-tag: true
test:
  environment:
    contents:
      packages:
        - wolfi-base
        - busybox
  pipeline:
    - runs: |
        [ -f /usr/local/include/gdrapi.h ] && [ -f /usr/local/include/gdrconfig.h ] && exit 0 || exit 1
