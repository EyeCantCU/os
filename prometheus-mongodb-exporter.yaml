package:
  name: prometheus-mongodb-exporter
  version: 0.43.1
  epoch: 4
  description: A Prometheus exporter for MongoDB including sharding, replication and storage engines
  copyright:
    - license: MIT
  dependencies:
    # REMOVE_POST_USRMERGE - https://github.com/orgs/wolfi-dev/discussions/40270
    provides:
     - prometheus-mongodb-exporter-bitnami-compat

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/percona/mongodb_exporter
      expected-commit: 2b2cccca21104c2a00cb53bd0d785b3d656fe803
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: golang.org/x/crypto@v0.31.0 golang.org/x/net@v0.33.0

  - runs: |
      make build
      mkdir -p ${{targets.destdir}}/usr/bin
      mv mongodb_exporter ${{targets.destdir}}/usr/bin/

  - uses: strip

update:
  enabled: true
  github:
    identifier: percona/mongodb_exporter
    strip-prefix: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        mongodb_exporter --version
        mongodb_exporter --help
