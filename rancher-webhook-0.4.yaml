package:
  name: rancher-webhook-0.4
  version: "0.4.18"
  epoch: 3
  description: Rancher webhook for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-webhook=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f102dbe61696469b224fcb909a6ad3af64c169e7
      repository: https://github.com/rancher/webhook
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: upgrade-k8s.io-packages.patch

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.46.0
        go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.44.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.21.0
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
      modroot: .

  - uses: go/build
    with:
      modroot: .
      output: webhook
      packages: .

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v0.4.

test:
  pipeline:
    - runs: |
        /usr/bin/webhook &
        export WH=$!
        sleep 2
        kill -9 $WH
