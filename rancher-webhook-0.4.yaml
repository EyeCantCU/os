package:
  name: rancher-webhook-0.4
  version: "0.4.15"
  epoch: 1
  description: Rancher webhook for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-webhook=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: cd9e3e8ff8684416eb893d962e11c5c1195a939d
      repository: https://github.com/rancher/webhook
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        k8s.io/kubernetes@v1.28.12
        k8s.io/apiserver@v0.28.12
        go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.46.0
        github.com/rancher/norman@v0.0.0-20240207153100-3bb70b772b52
        go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.44.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.21.0
      modroot: .

  - uses: go/build
    with:
      modroot: .
      output: webhook
      packages: .

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v0.4.

test:
  pipeline:
    - runs: |
        /usr/bin/webhook &
        export WH=$!
        sleep 2
        kill -9 $WH
