package:
  name: rancher-webhook-0.4
  version: 0.4.9
  epoch: 0
  description: Rancher webhook for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-webhook=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 04b013f825cd5d8e41d6f23668a7f79c540ebf82
      repository: https://github.com/rancher/webhook
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      output: webhook
      packages: .

update:
  enabled: true
  github:
    identifier: rancher/webhook
    strip-prefix: v
    tag-filter-prefix: v0.4.
