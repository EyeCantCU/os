package:
  name: rancher-webhook-0.4
  version: "0.4.18"
  epoch: 0
  description: Rancher webhook for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-webhook=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f102dbe61696469b224fcb909a6ad3af64c169e7
      repository: https://github.com/rancher/webhook
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.46.0
        go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.44.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.21.0
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
      modroot: .

  - name: Hack update all k8s deps in replace
    runs: |
      # The upstream go.mod file includes a replace block that pins all k8s.io/* dependencies to specific versions.
      # Updating them individually using go/bump replace is not ideal, as there are over 30+ k8s.io/* dependencies.
      #
      # To remediate GHSA-vv39-3w5q-974q, GHSA-jgfp-53c3-624w, GHSA-27wf-5967-98gx and more, we are using sed to update all k8s.io/* dependencies
      # to version v0.28.14 in one step.
      #
      # This is a temporary workaround. Once the upstream go.mod is updated to a more recent version,
      # Even if we miss to removed this, it will not match the regex and will have no effect.
      sed -i 's|k8s.io/kubernetes v1.28.\([6-9]\|1[0-3]\)|k8s.io/kubernetes v1.28.14|g' go.mod
      sed -i 's/\(k8s.io.*\)v0.28.\([6-9]\|1[0-3]\)/\1v0.28.14/g' go.mod
      go mod tidy

  - uses: go/build
    with:
      modroot: .
      output: webhook
      packages: .

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v0.4.

test:
  pipeline:
    - runs: |
        /usr/bin/webhook &
        export WH=$!
        sleep 2
        kill -9 $WH
