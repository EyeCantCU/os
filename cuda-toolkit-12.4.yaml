package:
  name: cuda-toolkit-12.4
  version: 12.4
  # version of the the cuda-toolkit and the run-time dependencies are tracked referencing NVIDIA's toolkit versions
  epoch: 1
  description: Meta-package for providing CUDA-toolkit packages
  copyright:
    - license: PROPRIETARY
  dependencies:
    runtime:
      - nvidia-cuda-cudart-12.4
      - nvidia-cuda-nvcc-12.4
      - nvidia-cuda-nvml-dev-12.4
      - nvidia-cuda-nvrtc-12.4
      - nvidia-cuda-nvtx-12.4
      - nvidia-libcublas-12.4
      - nvidia-libcufft-12.4
      - nvidia-libcurand-12.4
      - nvidia-libcusolver-12.4
      - nvidia-libcusparse-12.4
      - nvidia-libnvjitlink-12.4
      - nvidia-cudnn-9.1.1

subpackages:
  - name: ${{package.name}}-dev
    description: Meta-package for providing CUDA-toolkit development packages
    dependencies:
      runtime:
        - cuda-toolkit-12.4
        - nvidia-cuda-cudart-12.4-dev
        - nvidia-cuda-nvcc-12.4-dev
        - nvidia-cuda-nvrtc-12.4-dev
        - nvidia-cuda-nvtx-12.4-dev
        - nvidia-libcublas-12.4-dev
        - nvidia-libcufft-12.4-dev
        - nvidia-libcurand-12.4-dev
        - nvidia-libcusolver-12.4-dev
        - nvidia-libcusparse-12.4-dev
        - nvidia-libnvjitlink-12.4-dev

update:
  enabled: false
