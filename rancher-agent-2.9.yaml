package:
  name: rancher-agent-2.9
  version: "2.9.8"
  epoch: 2
  description: Complete container management platform - agent
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-agent=${{package.full-version}}
    runtime:
      - acl-dev
      - bash
      - busybox # nsenter
      - busybox
      - curl
      - gawk
      - gzip
      - iproute2
      - jq
      - kubectl
      - mount
      - net-tools
      - openssh-client
      - openssl
      - posix-libc-utils
      - rancher-charts-${{vars.major-minor-version}}
      - rancher-helm3-charts
      - rancher-kontainer-driver-metadata-${{vars.major-minor-version}}
      - rancher-loglevel
      - rancher-partner-charts
      - rancher-rke2-charts
      - rancher-system-charts-${{vars.major-minor-version}}
      - sysstat
      - tini
      - umount
      - util-linux-dev
      - util-linux-misc # unshare
      - vim

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rancher/rancher
      tag: v${{package.version}}
      expected-commit: 887911671e61169f90df0e1229044e01861f382f

  # Due to the unusual structure of the upstream go.mod, we can't currently use
  # go/bump to manage these dependencies. Issue filed: https://github.com/chainguard-dev/gobump/issues/38.
  # At the time of writing (9/15/24), we can't bump the below deps to newer major versions.
  - name: Patch dependencies
    runs: |
      sed -i 's/github.com\/containerd\/containerd v1.6.27/github.com\/containerd\/containerd v1.6.38/' go.mod

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v3@v3.0.4
        golang.org/x/oauth2@v0.27.0
        golang.org/x/crypto@v0.35.0
        github.com/golang-jwt/jwt/v4@v4.5.2
        github.com/golang-jwt/jwt/v5@v5.2.2
        golang.org/x/net@v0.38.0

  - name: Hack update all k8s deps in replace
    runs: |
      # The upstream go.mod file includes a replace block that pins all k8s.io/* dependencies to specific versions.
      # Updating them individually using go/bump replace is not ideal, as there are over 30+ k8s.io/* dependencies.
      #
      # To remediate GHSA-27wf-5967-98gx and GHSA-82m2-cv7p-4m75, we are using sed to update all k8s.io/* dependencies
      # to version v1.30.3 in one step.
      #
      # This is a temporary workaround. Once the upstream go.mod is updated to a more recent version,
      # Even if we miss to removed this, it will not match the regex and will have no effect.

      sed -i 's|k8s.io/kubernetes v1.30.[12]|k8s.io/kubernetes v1.30.3|g' go.mod
      sed -i 's/\(k8s.io.*\)v0.30.[12]/\1v0.30.3/g' go.mod

      go mod tidy

  - uses: go/build
    with:
      packages: ./cmd/agent
      output: agent
      ldflags: |
        -X main.VERSION=${{package.version}}
      tags: k8s

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      install -Dm755 package/run.sh ${{targets.contextdir}}/usr/bin/
      install -Dm755 package/kubectl-shell.sh ${{targets.contextdir}}/usr/bin/
      install -Dm755 package/shell-setup.sh ${{targets.contextdir}}/usr/bin/

test:
  pipeline:
    - runs: |
        agent | grep "Rancher agent version ${{package.version}}"

update:
  enabled: true
  github:
    identifier: rancher/rancher
    strip-prefix: v
    use-tag: true
    tag-filter: v2.9.
