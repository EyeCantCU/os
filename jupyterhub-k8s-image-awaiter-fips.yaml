package:
  name: jupyterhub-k8s-image-awaiter-fips
  version: "4.3.2"
  epoch: 0 # CVE-2025-61729
  description: JupyterHub Kubernetes Image Awaiter - waits for container images to be pulled across all nodes
  copyright:
    - license: BSD-3-Clause
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyterhub/zero-to-jupyterhub-k8s
      tag: ${{package.version}}
      expected-commit: 9dba5197ea8cdb6bcc662fd037f57f0e73f2aa3e

  - uses: go/build
    with:
      packages: .
      output: image-awaiter
      modroot: ./images/image-awaiter
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: jupyterhub/zero-to-jupyterhub-k8s
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - runs: |
        image-awaiter --help
        # requires a running Kubernetes cluster
        image-awaiter 2>&1 | grep "open /var/run/secrets/kubernetes.io/serviceaccount/ca.crt: no such file or directory"
    - uses: test/go-fips-check
