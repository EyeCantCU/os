package:
  name: cert-manager-fips-1.14
  # See https://cert-manager.io/docs/installation/supported-releases/ for upstream-supported versions
  version: 1.14.7
  epoch: 4
  description: Automatically provision and manage TLS certificates in Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - cert-manager-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 636559655f1efa8eff236981edb950b4ef40b253
      repository: https://github.com/cert-manager/cert-manager
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: github.com/docker/docker@v24.0.9
      replaces: k8s.io/apimachinery=github.com/kubernetes/apimachinery@v0.30.0
      modroot: cmd/ctl

  - uses: go/bump
    with:
      deps: github.com/hashicorp/go-retryablehttp@v0.7.7
      modroot: cmd/controller

  # This is needed because the go bumps above affect these packages
  - runs: |
      for mod in cainjector acmesolver controller webhook; do
        cd cmd/$mod
        go mod tidy
        cd ../..
      done

  # ldflags comes from:
  # https://github.com/cert-manager/cert-manager/blob/master/make/00_mod.mk#L54
  - uses: go/build
    with:
      go-package: go-fips
      modroot: cmd/controller
      packages: main.go
      output: controller-linux-${{build.goarch}}
      ldflags: -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=$(git describe --tags --always --match='v*' --abbrev=14 --dirty) -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=$(git rev-parse HEAD)

  - uses: go/build
    with:
      go-package: go-fips
      modroot: cmd/acmesolver
      packages: main.go
      output: acmesolver-linux-${{build.goarch}}
      ldflags: -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=$(git describe --tags --always --match='v*' --abbrev=14 --dirty) -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=$(git rev-parse HEAD)

  - uses: go/build
    with:
      go-package: go-fips
      modroot: cmd/cainjector
      packages: main.go
      output: cainjector-linux-${{build.goarch}}
      ldflags: -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=$(git describe --tags --always --match='v*' --abbrev=14 --dirty) -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=$(git rev-parse HEAD)

  - uses: go/build
    with:
      go-package: go-fips
      modroot: cmd/webhook
      packages: main.go
      output: webhook-linux-${{build.goarch}}
      ldflags: -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=$(git describe --tags --always --match='v*' --abbrev=14 --dirty) -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=$(git rev-parse HEAD)

subpackages:
  - name: ${{package.name}}-controller
    pipeline:
      - runs: |
          install -Dm755 ${{targets.destdir}}/usr/bin/controller-linux-$(go env GOARCH) ${{targets.subpkgdir}}/usr/bin/controller
    dependencies:
      provides:
        - cert-manager-controller-fips=${{package.full-version}}

  - name: ${{package.name}}-webhook
    pipeline:
      - runs: |
          install -Dm755 ${{targets.destdir}}/usr/bin/webhook-linux-$(go env GOARCH) ${{targets.subpkgdir}}/usr/bin/webhook
    dependencies:
      provides:
        - cert-manager-webhook-fips=${{package.full-version}}

  - name: ${{package.name}}-cainjector
    pipeline:
      - runs: |
          install -Dm755 ${{targets.destdir}}/usr/bin/cainjector-linux-$(go env GOARCH) ${{targets.subpkgdir}}/usr/bin/cainjector
    dependencies:
      provides:
        - cert-manager-cainjector-fips=${{package.full-version}}

  - name: ${{package.name}}-acmesolver
    pipeline:
      - runs: |
          install -Dm755 ${{targets.destdir}}/usr/bin/acmesolver-linux-$(go env GOARCH) ${{targets.subpkgdir}}/usr/bin/acmesolver
    dependencies:
      provides:
        - cert-manager-acmesolver-fips=${{package.full-version}}

  - name: cmctl-1.14-fips
    dependencies:
      provides:
        - cmctl-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          modroot: cmd/ctl
          packages: main.go
          output: cmctl
          ldflags: -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=$(git describe --tags --always --match='v*' --abbrev=14 --dirty) -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=$(git rev-parse HEAD)
    test:
      environment:
        contents:
          packages:
            - go-fips
            - wolfi-base
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: cmctl
        - runs: |
            cmctl -h

update:
  enabled: true
  github:
    identifier: cert-manager/cert-manager
    strip-prefix: v
    tag-filter: v1.14.
    use-tag: true

test:
  environment:
    contents:
      packages:
        - go-fips
        - wolfi-base
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        acmesolver-linux-$(go env GOARCH) -h
        cainjector-linux-$(go env GOARCH) -h
        controller-linux-$(go env GOARCH) -h
        webhook-linux-$(go env GOARCH) -h
