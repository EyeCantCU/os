package:
  name: perl-test-inter
  version: "1.12"
  epoch: 0
  description: framework for more readable interactive test scripts
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/S/SB/SBECK/Test-Inter-${{package.version}}.tar.gz
      expected-sha256: f2b1987ecef9f6c9223e8fba2e8e48854333896650aabea81bdc30e0c9656b63

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 3397

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Smoke test
      runs: |
        set -euo pipefail
        perl -e 'use Test::Inter; print "Test::Inter version: $Test::Inter::VERSION\n"'
    - name: Basic functionality
      runs: |
        set -euo pipefail
        perl <<'EOF'
        use Test::Inter;
        my $ti = new Test::Inter 'test';
        die "Failed to create Test::Inter object" unless defined $ti;
        # Test the framework's core functionality - running tests
        $ti->tests(
            tests  => '1 + 1',
            func   => sub { my $a = shift; return $a + 1; },
            expected => [2]
        );
        # Finalize testing - this outputs TAP format
        $ti->done_testing();
        # If we got here without dying, the test framework works
        print "Test::Inter functional tests passed\n";
        EOF
