package:
  name: passt
  version: "2025.12.23"
  epoch: 0
  description: A container for deploying bootable container images.
  copyright:
    - license: BSD-3-Clause AND GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - coreutils
      - posix-libc-utils

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: _
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      # Find the current tag via the target version + the commit of the tag
      repository: https://passt.top/passt
      tag: ${{vars.mangled-package-version}}.2ba9fd5
      expected-commit: 2ba9fd58183cd1d6e01c9b95a1fd433f2e7da42a

  - name: build
    runs: make

  - uses: autoconf/make-install

subpackages:
  - name: ${{package.name}}-doc
    description: paast doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Version Check
      runs: |
        set -o pipefail
        # package version is YYYY.MM.DD, built in version is YYYY_MM_DD.<hash>
        expver=$(echo "${{package.version}}" | tr '.' '_')
        passt --version | grep -F -e "$expver" ||
           { echo "FATAL: passt --version output did not include '$expver'"; exit 1; }
        passt --help

update:
  enabled: true
  version-transform:
    # strip the git hash.  Tags are of format YYYY_MM_DD.hash. Turn that to YYYY.MM.DD
    - match: "[.][0-9a-f]+$"
      replace: ""
    - match: "_"
      replace: "."
  release-monitor:
    identifier: 372091
