package:
  name: py3-flask-login
  version: "0.6.3"
  epoch: 0
  description: Flask user session management
  copyright:
    - license: MIT

vars:
  pypi-package: flask-login
  import: flask_login

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/maxcountryman/flask-login
      tag: ${{package.version}}
      expected-commit: 88eca62d4f87a36b1339ea8fe5a8b7ad878cf3ef

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-flask
        - py${{range.key}}-werkzeug
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import flask_login
            from flask_login import UserMixin, LoginManager

            assert hasattr(flask_login, 'login_user')
            assert hasattr(flask_login, 'logout_user')
            assert hasattr(flask_login, 'current_user')
            assert hasattr(flask_login, 'login_required')

            login_manager = LoginManager()
            assert login_manager is not None

            class User(UserMixin):
                pass

            user = User()
            assert user is not None
            assert hasattr(user, 'is_authenticated')
            assert hasattr(user, 'is_active')
            assert hasattr(user, 'is_anonymous')
            assert hasattr(user, 'get_id')
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: maxcountryman/flask-login
    strip-prefix: v
