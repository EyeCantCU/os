package:
  name: k8ssandra-operator-fips
  version: 1.13.0
  epoch: 1
  description: The Kubernetes operator for K8ssandra
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - wolfi-baselayout
      - busybox
      - build-base
      - ca-certificates-bundle
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/k8ssandra/k8ssandra-operator
      tag: v${{package.version}}
      expected-commit: 6ad0ed0d8316d7353fd75c7f64460defb3b9bd7c

  - uses: go/build
    with:
      modroot: .
      packages: .
      output: ${{package.name}}-manager
      # CVE-2023-3978, CVE-2023-39325 and CVE-2023-44487
      deps: golang.org/x/net@v0.17.0 google.golang.org/grpc@v1.58.3
      go-package: go-fips

  - uses: strip

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/bin"
          ln -sf /usr/bin/${{package.name}}-manager ${{targets.subpkgdir}}/usr/bin/manager
          ln -sf /usr/bin/${{package.name}}-manager ${{targets.subpkgdir}}/manager

update:
  enabled: true
  github:
    identifier: k8ssandra/k8ssandra-operator
    strip-prefix: v
