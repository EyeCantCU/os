package:
  name: knative-eventing-fips-1.17
  version: "1.17.6"
  epoch: 5 # GHSA-j5w8-q4qc-rx2x
  description: Event-driven application platform for Kubernetes.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - knative-eventing-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: fd24f8a5a7748f78ab76b652f7e9b75408da3d26
      repository: https://github.com/knative/eventing
      tag: knative-v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v3@v3.0.4
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        golang.org/x/crypto@v0.45.0

subpackages:
  - name: ${{package.name}}-filter
    description: "Filter component for Knative eventing"
    dependencies:
      provides:
        - knative-eventing-filter-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          output: filter
          packages: ./cmd/broker/filter
          go-package: go-fips-md5
    test:
      environment:
        environment:
          NAMESPACE: default
          POD_NAME: test-filter
          CONTAINER_NAME: filter
      pipeline:
        - uses: test/go-fips-check
        - uses: test/kwok/cluster
        - uses: test/daemon-check-output
          with:
            start: /usr/bin/filter
            timeout: 30
            expected_output: |
              Starting
              Registering

  - name: ${{package.name}}-ingress
    description: "Ingress component for Knative eventing"
    dependencies:
      provides:
        - knative-eventing-ingress-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          output: ingress
          packages: ./cmd/broker/ingress
          go-package: go-fips
    test:
      environment:
        environment:
          NAMESPACE: default
          POD_NAME: test-ingress
          CONTAINER_NAME: ingress
      pipeline:
        - uses: test/go-fips-check
        - uses: test/kwok/cluster
        - uses: test/daemon-check-output
          with:
            start: /usr/bin/ingress
            timeout: 30
            expected_output: |
              Starting the Broker Ingress
              Starting informers

  - name: ${{package.name}}-controller
    description: "Controller component for Knative eventing"
    dependencies:
      provides:
        - knative-eventing-controller-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          output: controller
          packages: ./cmd/controller
          go-package: go-fips
    test:
      environment:
        environment:
          APISERVER_RA_IMAGE: dummy-image
          NAMESPACE: default
          POD_NAME: test-controller
          CONTAINER_NAME: controller
      pipeline:
        - uses: test/go-fips-check
        - uses: test/kwok/cluster
        - uses: test/daemon-check-output
          with:
            start: /usr/bin/controller
            timeout: 30
            expected_output: |
              Registering

  - name: ${{package.name}}-channel-controller
    description: "channel_controller component for Knative eventing"
    dependencies:
      provides:
        - knative-eventing-channel-controller-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          output: channel_controller
          packages: ./cmd/in_memory/channel_controller
          go-package: go-fips
    test:
      environment:
        environment:
          NAMESPACE: default
          POD_NAME: test-channel-controller
          CONTAINER_NAME: channel_controller
          WEBHOOK_NAME: webhook
          DISPATCHER_IMAGE: dummy-dispatcher-image
      pipeline:
        - uses: test/go-fips-check
        - uses: test/kwok/cluster
        - uses: test/daemon-check-output
          with:
            start: /usr/bin/channel_controller
            timeout: 30
            expected_output: |
              Registering

  - name: ${{package.name}}-channel-dispatcher
    description: "channel_dispatcher component for Knative eventing"
    dependencies:
      provides:
        - knative-eventing-channel-dispatcher-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          output: channel_dispatcher
          packages: ./cmd/in_memory/channel_dispatcher
          go-package: go-fips
    test:
      environment:
        environment:
          NAMESPACE: default
          POD_NAME: test-channel-dispatcher
          CONTAINER_NAME: channel_dispatcher
          MAX_IDLE_CONNS: "100"
          MAX_IDLE_CONNS_PER_HOST: "100"
      pipeline:
        - uses: test/go-fips-check
        - uses: test/kwok/cluster
        - uses: test/daemon-check-output
          with:
            start: /usr/bin/channel_dispatcher
            timeout: 30
            expected_output: |
              Registering
            # Ignore ERROR keyword, since it is expected.
            error_strings: |
              FAIL
              FATAL

  - name: ${{package.name}}-jobsink
    description: "jobsink component for Knative eventing"
    dependencies:
      provides:
        - knative-eventing-jobsink-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          output: jobsink
          packages: ./cmd/jobsink
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/kwok/cluster
        - uses: test/daemon-check-output
          with:
            start: /usr/bin/jobsink
            timeout: 30
            expected_output: |
              Starting the JobSink Ingress

  - name: ${{package.name}}-mtchannel-broker
    description: "mtchannel_broker component for Knative eventing"
    dependencies:
      provides:
        - knative-eventing-mtchannel-broker-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          output: mtchannel_broker
          packages: ./cmd/mtchannel_broker
          go-package: go-fips
    test:
      environment:
        environment:
          NAMESPACE: default
          POD_NAME: test-mtchannel-broker
          CONTAINER_NAME: mtchannel_broker
      pipeline:
        - uses: test/go-fips-check
        - uses: test/kwok/cluster
        - uses: test/daemon-check-output
          with:
            start: /usr/bin/mtchannel_broker
            timeout: 30
            expected_output: |
              Registering

  - name: ${{package.name}}-webhook
    description: "webhook component for Knative eventing"
    dependencies:
      provides:
        - knative-eventing-webhook-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          output: webhook
          packages: ./cmd/webhook
          go-package: go-fips
    test:
      environment:
        environment:
          NAMESPACE: default
          POD_NAME: test-webhook
          CONTAINER_NAME: webhook
          WEBHOOK_NAME: webhook
      pipeline:
        - uses: test/go-fips-check
        - uses: test/kwok/cluster
        - uses: test/daemon-check-output
          with:
            start: /usr/bin/webhook
            timeout: 30
            expected_output: |
              Registering

update:
  enabled: true
  github:
    identifier: knative/eventing
    strip-prefix: knative-v
    tag-filter: knative-v1.17.

# This origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is not longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
