package:
  name: k6-fips
  version: "1.0.0"
  epoch: 0
  description: A modern load testing tool, using Go and JavaScript (FIPS compliant version)
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    runtime:
      - bash-binsh
      - coreutils
      - curl
      - grep

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips-md5
  environment:
    CGO_ENABLED: "1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/k6
      tag: v${{package.version}}
      expected-commit: 41b4984b7594a8828bfa724ae32b49c15c76b13d

  - uses: go/build
    with:
      packages: .
      output: k6-fips
      go-package: go-fips-md5

  - uses: strip

update:
  enabled: true
  github:
    identifier: grafana/k6
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - name: "test out k6-fips version"
      runs: |
        k6-fips version
        k6-fips --version
        k6-fips --help
    - name: "run a demo test"
      runs: |
        k6-fips new
        k6-fips run script.js --duration=1.5s
