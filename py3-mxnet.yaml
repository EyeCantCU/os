package:
  name: py3-mxnet
  version: 1.9.1
  epoch: 1
  description: Apache MXNet is a deep learning framework designed for both efficiency and flexibility.
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: mxnet
  import: mxnet
  cuda-version: 12.9

environment:
  environment:
    CFLAGS: -w
    CXXFLAGS: -w
  contents:
    packages:
      - gcc-14-default
      - gfortran
      - openblas-dev
      # - cuda-toolkit-${{vars.cuda-version}}-dev
      # - nvidia-cuda-nvcc-gcc-${{vars.cuda-version}}
      # - openmp-19-dev
      # - hwloc-cuda-${{vars.cuda-version}}
      - opencv-dev
      # - nvidia-nccl-cuda-${{vars.cuda-version}}
      # - nvidia-libcublas-${{vars.cuda-version}}-dev
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/mxnet.git
      tag: ${{package.version}}
      expected-commit: 3f8f3be9987e259491ddc5a78aa9c6903e0b21e3
      recurse-submodules: true

  - environment:
      CFLAGS: -w
      CXXFLAGS: -w
    uses: cmake/configure
    with:
      opts: |
        -DUSE_CUDA=false \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5

  - uses: cmake/build

  - uses: cmake/install

  - runs: cp output/libmxnet.so ./libmxnet.so

  - uses: strip

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
