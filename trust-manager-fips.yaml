package:
  name: trust-manager-fips
  version: 0.11.1
  epoch: 0
  description: trust-manager is an operator for distributing trust bundles across a Kubernetes cluster.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
      - wolfi-baselayout
      - curl
      - docker
      - rsync
  environment:
    CGO_ENABLED: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/trust-manager
      tag: v${{package.version}}
      expected-commit: ef5428c07feaf8a2fdb5b79dc8d945beb22fdb1d
      destination: trust-manager

  - runs: |
      cd trust-manager
      mkdir ./bin
      go build -o ./bin/trust-manager ./cmd/trust-manager
      mkdir -p ${{targets.destdir}}/usr/bin
      install -Dm755 ./bin/trust-manager ${{targets.destdir}}/usr/bin/trust-manager

  - uses: strip

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
  pipeline:
    - runs: trust-manager --help
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: cert-manager/trust-manager
    strip-prefix: v
    tag-filter: v
