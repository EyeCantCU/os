package:
  name: trust-manager-fips
  version: "0.16.0"
  epoch: 5
  description: trust-manager is an operator for distributing trust bundles across a Kubernetes cluster.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - docker
      - go-fips
      - rsync
      - wolfi-baselayout
  environment:
    CGO_ENABLED: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/trust-manager
      tag: v${{package.version}}
      expected-commit: d2c4e3f06f3f9839b1b907d3fb2ec7651794eea4

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/crypto@v0.35.0
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      packages: ./cmd/trust-manager
      output: trust-manager
      go-package: go-fips

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
  pipeline:
    - runs: |
        trust-manager --help
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: cert-manager/trust-manager
    strip-prefix: v
    tag-filter: v
