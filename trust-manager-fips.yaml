package:
  name: trust-manager-fips
  version: "0.17.0"
  epoch: 0
  description: trust-manager is an operator for distributing trust bundles across a Kubernetes cluster.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - docker
      - go-fips
      - rsync
      - wolfi-baselayout
  environment:
    CGO_ENABLED: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/trust-manager
      tag: v${{package.version}}
      expected-commit: 71ab6fd215b74fd2a1435c69f80c100da1a544fa

  - uses: go/build
    with:
      packages: ./cmd/trust-manager
      output: trust-manager
      go-package: go-fips

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
  pipeline:
    - runs: |
        trust-manager --help
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: cert-manager/trust-manager
    strip-prefix: v
    tag-filter: v
