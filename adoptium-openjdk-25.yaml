# need to use release monitor as tags are cut before the release
#nolint:git-checkout-must-use-github-updates
package:
  name: adoptium-openjdk-25
  version: "25.0.0.36" # TODO(jason): on version bump ensure to update downstream projects that are pinned to a specific prerelease version, i.e. https://github.com/chainguard-images/images/tree/main/images
  epoch: 0
  description: "Adoptium OpenJDK ${{vars.java-version}}"
  copyright:
    - license: GPL-2.0-with-classpath-exception
  dependencies:
    runtime:
      - adoptium-openjdk-${{vars.java-version}}-jre

environment:
  contents:
    packages:
      - alsa-lib-dev
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cups-dev
      - file
      - fontconfig-dev
      - freetype-dev
      - giflib-dev
      - lcms2-dev
      - libffi-dev
      - libjpeg-turbo-dev
      - libx11-dev
      - libxext-dev
      - libxi-dev
      - libxrandr-dev
      - libxrender-dev
      - libxt-dev
      - libxtst-dev
      - openjdk-${{vars.java-version}}-default-jdk
      - zip
  environment:
    # This is needed to work around the error date 1970-01-01T00:00:00Z is not within the valid range 1980-01-01T00:00:02Z to 2099-12-31T23:59:59Z
    SOURCE_DATE_EPOCH: 315532900

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+\.\d+)\.(\d+)$
    replace: $1+$2
    to: mangled-package-version
  - from: ${{vars.mangled-package-version}}
    match: ^(\d+)\.0\.0\+(\d+)$
    replace: $1+$2
    to: mangled-package-version
  - from: ${{package.name}}
    match: adoptium-openjdk-(\d+)
    replace: $1
    to: java-version

pipeline:
  - uses: git-checkout
    with:
      # When upstream releases the jdk25u repository at some future
      # point in time, this pipeline should be updated to use it.
      repository: https://github.com/adoptium/jdk.git
      tag: jdk-${{vars.mangled-package-version}}_adopt
      expected-commit: ef82ae72355176d49f857b2ef14c99f8c1a8682e

  - name: Fetch googletest
    working-directory: /home/build/googletest
    pipeline:
      - uses: fetch
        with:
          uri: https://github.com/google/googletest/archive/v1.15.2.tar.gz
          expected-sha512: 9046841044a2bf7edfd96854ad9c44ffae4fcb9fb59a075b367507c0762a98eb32cb6968d46663228272e26321e96f4dd287c95baa22c6af9bad902b8b6ede4e

  - runs: chmod +x configure

  # Note that despite using --with-extra-cflags, --with-extra-cxxflags, and
  # --with-extra-ldflags, the configure still produces warnings like:
  # https://github.com/wolfi-dev/os/issues/18747
  - uses: autoconf/configure
    with:
      opts: |
        --with-extra-cflags="$CFLAGS" \
        --with-extra-cxxflags="$CXXFLAGS" \
        --with-extra-ldflags="$LDFLAGS" \
        --with-boot-jdk=/usr/lib/jvm/java-${{vars.java-version}}-openjdk \
        --prefix=/usr/lib/jvm/java-${{vars.java-version}}-adoptium \
        --with-vendor-name=wolfi \
        --with-vendor-url=https://wolfi.dev \
        --with-vendor-bug-url=https://github.com/wolfi-dev/os/issues \
        --with-version-opt="wolfi-r${{package.epoch}}" \
        --disable-warnings-as-errors \
        --disable-precompiled-headers \
        --enable-dtrace=no \
        --with-zlib=system \
        --with-debug-level=release \
        --with-native-debug-symbols=internal \
        --with-jvm-variants=server \
        --with-jtreg=no  \
        --with-libpng=system \
        --with-jvm-variants=server \
        --with-libjpeg=system \
        --with-giflib=system \
        --with-lcms=system \
        --with-gtest="/home/build/googletest" \
        --with-version-pre="no" \
        --with-version-string=""

  - runs: make jdk-image

  # Check we built something valid
  - runs: |
      _java_bin="./build/*-server-release/images/jdk/bin"

      $_java_bin/javac -d . HelloWorld.java
      $_java_bin/java HelloWorld

      # NOTE: Disable flakey tests for now as we're seeing builds hang on aarch64
      # # run the gtest unittest suites
      # make test-hotspot-gtest

  - runs: |
      _java_home="usr/lib/jvm/java-${{vars.java-version}}-adoptium"

      mkdir -p "${{targets.destdir}}"/$_java_home
      cp -r build/*-server-release/images/jdk/* "${{targets.destdir}}"/$_java_home
      rm "${{targets.destdir}}"/$_java_home/lib/src.zip

subpackages:
  - name: "${{package.name}}-dbg"
    description: "OpenJDK ${{vars.java-version}} Java Debug Symbols"
    pipeline:
      - uses: split/debug
    dependencies:
      runtime:
        - adoptium-openjdk-${{vars.java-version}}

  - name: "${{package.name}}-jre"
    description: "OpenJDK ${{vars.java-version}} Java Runtime Environment"
    dependencies:
      runtime:
        - alsa-lib
        - freetype
        - giflib
        - lcms2
        - libfontconfig1
        - libjpeg-turbo
        - libxi
        - libxext
        - libxi
        - libxrender
        - libxtst
        - adoptium-openjdk-${{vars.java-version}}-jre-base
    pipeline:
      - runs: |
          _java_home="usr/lib/jvm/java-${{vars.java-version}}-adoptium"

          mkdir -p "${{targets.subpkgdir}}"/$_java_home/lib
          mv "${{targets.destdir}}"/$_java_home/lib/libawt_xawt.so \
              "${{targets.destdir}}"/$_java_home/lib/libfontmanager.so \
              "${{targets.destdir}}"/$_java_home/lib/libjavajpeg.so \
              "${{targets.destdir}}"/$_java_home/lib/libjawt.so \
              "${{targets.destdir}}"/$_java_home/lib/libjsound.so \
              "${{targets.destdir}}"/$_java_home/lib/liblcms.so \
              "${{targets.destdir}}"/$_java_home/lib/libsplashscreen.so \
              "${{targets.subpkgdir}}"/$_java_home/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check
          with:
            extra-library-paths: "/usr/lib/jvm/java-${{vars.java-version}}-adoptium/lib/:/usr/lib/jvm/java-${{vars.java-version}}-adoptium/lib/server/"

  - name: "${{package.name}}-jre-base"
    description: "OpenJDK ${{vars.java-version}} Java Runtime Environment (headless)"
    dependencies:
      runtime:
        - java-common
        - java-cacerts
    pipeline:
      - runs: |
          _java_home="usr/lib/jvm/java-${{vars.java-version}}-adoptium"

          mkdir -p "${{targets.subpkgdir}}"/$_java_home
          mv "${{targets.destdir}}"/$_java_home/lib \
             "${{targets.subpkgdir}}"/$_java_home

          mkdir -p "${{targets.subpkgdir}}"/$_java_home/bin
          for i in java \
                    jfr \
                    jrunscript \
                    keytool \
                    rmiregistry; do
            mv "${{targets.destdir}}"/$_java_home/bin/$i "${{targets.subpkgdir}}"/$_java_home/bin/$i
          done

          mv "${{targets.destdir}}"/$_java_home/legal "${{targets.subpkgdir}}"/$_java_home
          mv "${{targets.destdir}}"/$_java_home/conf "${{targets.subpkgdir}}"/$_java_home
          mv "${{targets.destdir}}"/$_java_home/release "${{targets.subpkgdir}}"/$_java_home
          cp ASSEMBLY_EXCEPTION \
              LICENSE \
              README.md \
             "${{targets.subpkgdir}}"/$_java_home

          # symlink to shared java cacerts store
          rm -f "${{targets.subpkgdir}}"/$_java_home/lib/security/cacerts
          ln -sf /etc/ssl/certs/java/cacerts \
            "${{targets.subpkgdir}}"/$_java_home/lib/security/cacerts

          # symlink for `java-common` to work (which expects jre in $_java_home/jre)
          ln -sf . "${{targets.subpkgdir}}/$_java_home/jre"

  - name: "${{package.name}}-jmods"
    description: "OpenJDK ${{vars.java-version}} jmods"
    dependencies:
      provides:
        - adoptium-openjdk-jmods=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/jvm/java-${{vars.java-version}}-adoptium
          mv "${{targets.destdir}}"/usr/lib/jvm/java-${{vars.java-version}}-adoptium/jmods \
             "${{targets.subpkgdir}}"/usr/lib/jvm/java-${{vars.java-version}}-adoptium
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: adoptium-openjdk-jmods
            real-pkg-name: ${{subpkg.name}}

  - name: "${{package.name}}-demos"
    description: "OpenJDK ${{vars.java-version}} Demos"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/jvm/java-${{vars.java-version}}-adoptium
          mv "${{targets.destdir}}"/usr/lib/jvm/java-${{vars.java-version}}-adoptium/demo \
             "${{targets.subpkgdir}}"/usr/lib/jvm/java-${{vars.java-version}}-adoptium

  - name: "${{package.name}}-default-jvm"
    description: "Use the adoptium-openjdk-${{vars.java-version}} JVM as the default JVM"
    dependencies:
      runtime:
        - adoptium-openjdk-${{vars.java-version}}-jre
      provides:
        - default-jvm=1.25
        - default-jvm-lts=1.25
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/jvm
          ln -sf java-${{vars.java-version}}-adoptium "${{targets.subpkgdir}}"/usr/lib/jvm/default-jvm
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: default-jvm
            real-pkg-name: ${{subpkg.name}}
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: default-jvm-lts
            real-pkg-name: ${{subpkg.name}}

  - name: "${{package.name}}-default-jdk"
    description: "Use the adoptium-openjdk-${{vars.java-version}} JVM as the default JVM with the JDK installed"
    dependencies:
      runtime:
        - adoptium-openjdk-${{vars.java-version}}-default-jvm
        - adoptium-openjdk-${{vars.java-version}}
      provides:
        - default-jdk=1.25
        - default-jdk-lts=1.25
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: default-jdk
            real-pkg-name: ${{subpkg.name}}
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: default-jdk-lts
            real-pkg-name: ${{subpkg.name}}

update:
  enabled: true
  version-transform:
    - match: ^(\d+)\+(\d+)$
      replace: $1.0.0.$2
    - match: ^(\d+\.\d+\.\d+)\+(\d+)$
      replace: $1.$2
  release-monitor:
    identifier: 371025
    version-filter-prefix: 25
    strip-suffix: '-LTS'

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-default-jdk
        - ${{package.name}}-jmods
    environment:
      JAVA_HOME: usr/lib/jvm/java-${{vars.java-version}}-adoptium
  pipeline:
    # Test a basic Hello World
    - working-directory: basic
      runs: |
        javac HelloWorld.java
        java HelloWorld | grep -qi "Hello World!"
    # Test a basic HTTP connection
    - working-directory: basic
      runs: |
        javac RequestTest.java
        java RequestTest | grep -qi "Successfully connected to example.org"
    # Test modules
    - working-directory: advanced/module-project
      runs: |
        mkdir output
        javac -d output --module-source-path modules $(find modules -name "*.java")

        # Create a jar with the compiled classes
        jar --verbose --create --file app.jar \
          --main-class dev.chainguard.module.main.Main \
          --module-version 1.0 \
          -C output/test.modules . \
          -C output/main.app .

        # Test the jar
        java -jar app.jar

        # Test jlink
        jlink --verbose --module-path "app.jar:$JAVA_HOME/jmods" \
          --add-modules test.modules \
          --output test-project-jre

        # Test custom JRE
        test-project-jre/bin/java -jar app.jar
