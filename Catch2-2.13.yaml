package:
  name: Catch2-2.13
  version: 2.13.10
  epoch: 1
  description: "A modern, C++-native, test framework"
  copyright:
    - license: 'BSL-1.0'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - python3-dev
  environment:
    CXXFLAGS: -Wno-conversion

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/catchorg/Catch2
      tag: v${{package.version}}
      expected-commit: 182c910b4b63ff587a3440e08f84f70497e49a81

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-static
    description: "A modern, C++-native, test framework - static libraries"
    pipeline:
      - uses: split/static
    # this test was added automatically. The APK was empty when it was checked,
    # which may not be true forever. If this test fails in the future, please
    # replace it with a more accurate test.
    test:
      pipeline:
        - uses: test/emptypackage

  - name: ${{package.name}}-dev
    description: "A modern, C++-native, test framework - development headers"
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf

update:
  enabled: true
  git:
    tag-filter-prefix: v2.13.
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - Catch2-2.13-dev
        - gcc
        - glibc-dev
  pipeline:
    - runs: |
        cat << EOF > test_Catch2.cpp
        #define CATCH_CONFIG_MAIN
        #include <catch2/catch.hpp>

        TEST_CASE("Test Catch2", "[example]") {
            REQUIRE(1 + 1 == 2);
        }
        EOF
        g++ test_Catch2.cpp -o test_Catch2
        ./test_Catch2 |grep "All tests passed"
