package:
  name: bank-vaults-fips
  version: 1.20.4
  epoch: 14
  description: A Vault swiss-army knife. A CLI tool to init, unseal and configure Vault (auth methods, secret engines).
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bank-vaults/bank-vaults
      tag: ${{package.version}}
      expected-commit: f566a9f8a840688fb73a30cf43554e8cffb715cb

  - uses: go/bump
    with:
      deps: google.golang.org/grpc@v1.56.3 github.com/go-jose/go-jose/v3@v3.0.3 google.golang.org/protobuf@v1.33.0 golang.org/x/net@v0.23.0 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/hashicorp/go-retryablehttp@v0.7.7
      modroot: .

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/bank-vaults
      output: bank-vaults
      go-package: go-fips

  - uses: strip

subpackages:
  - name: bank-vaults-template-fips
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: ./cmd/template
          output: template
          go-package: go-fips

update:
  enabled: true
  github:
    identifier: bank-vaults/bank-vaults
    use-tag: true
    # There are some charts/ tags, ignore those.
    tag-filter: 1
