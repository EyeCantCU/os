package:
  name: esbuild-fips
  version: "0.25.6"
  epoch: 0
  description: An extremely fast bundler for the web
  copyright:
    - license: MIT
  dependencies:
    # Prevent apk add esbuild installing esbuild-fips
    provider-priority: 0
    # Yet still allow to directly install esbuild-fips to satisfy
    # esbuild dependencies
    provides:
      - esbuild=${{package.full-version}}

environment:
  contents:
    packages:
      - nodejs

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/evanw/esbuild
      tag: v${{package.version}}
      expected-commit: d38c1f0bc580b4a8a93f23559d0cd9085d7ba31f

  - runs: |
      node scripts/esbuild.js --update-version-go

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/esbuild
      output: esbuild

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        esbuild --version
        esbuild --help

update:
  enabled: true
  github:
    identifier: evanw/esbuild
    strip-prefix: v
