package:
  name: hubble-ui-backend-fips
  version: 0.13.1
  epoch: 4
  description: "Observability & troubleshooting for Kubernetes services"
  copyright:
    - license: "Apache-2.0"
  dependencies:
    runtime:
      - ca-certificates-bundle
      - gops

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cilium/hubble-ui
      tag: v${{package.version}}
      destination: hubble-ui
      expected-commit: a06e19ba65299c63a58034a360aeedde9266ec01

  - uses: go/bump
    with:
      deps: github.com/cilium/cilium@v1.15.6 google.golang.org/grpc@v1.64.1
      modroot: hubble-ui/backend

  - uses: go/build
    with:
      packages: .
      output: backend
      modroot: hubble-ui/backend
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: cilium/hubble-ui
    strip-prefix: v
