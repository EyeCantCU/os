package:
  name: hubble-ui-backend-fips
  version: 0.13.0
  epoch: 2
  description: "Observability & troubleshooting for Kubernetes services"
  copyright:
    - license: "Apache-2.0"
  dependencies:
    runtime:
      - ca-certificates-bundle
      - gops-fips

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - git
      - go-fips
      - openssl
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cilium/hubble-ui
      tag: v${{package.version}}
      destination: hubble-ui
      expected-commit: 0ffa10324c1e609b8a3620f41c73692c209045f0

  - uses: go/bump
    with:
      deps: google.golang.org/protobuf@v1.33.0

  - runs: |
      cd hubble-ui/backend
      # Override explicit patch version of cilium (1.13.0) in vendor/modules.txt
      CGO_ENABLED=0 go build -mod=mod -ldflags "-w" -o "${{targets.destdir}}"/usr/bin/backend .

  - uses: strip

update:
  enabled: true
  github:
    identifier: cilium/hubble-ui
    strip-prefix: v
