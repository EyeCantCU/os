package:
  name: nvidia-cudnn-9
  version: 9.3.0.75
  epoch: 8
  description: CUDA Deep Neural Network Libraries
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-cudnn=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+.\d+$
    replace: "$1"
    to: major-minor-version
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+\.\d+$
    replace: "$1"
    to: major-version

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: true

subpackages:
  - name: ${{package.name}}-cuda-12
    description: CUDA Deep Neural Network Libraries ${{vars.major-minor-version}} for CUDA 12
    dependencies:
      provides:
        - nvidia-cudnn-9.1.1=${{package.full-version}}
      runtime:
        # Provide for compat with intent to remove in future
        - ${{package.name}}-compat
    pipeline:
      - assertions:
          required-steps: 1
        pipeline:
          - if: ${{build.arch}} == 'aarch64'
            uses: fetch
            with:
              # SBSA = ARM Server Base System Architecture (now called SystemReady)
              uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-sbsa/cudnn-linux-sbsa-${{package.version}}_cuda12-archive.tar.xz"
              expected-sha256: "1226dd9b989c898638552963d000a3cfbb8a0a0cb9baf8cb09e6abd77ed7d639"
              timeout: 120
          - if: ${{build.arch}} == 'x86_64'
            uses: fetch
            with:
              uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-${{package.version}}_cuda12-archive.tar.xz"
              expected-sha256: "3d6ef10aa06dc9339a477e2b057e085ff8500bbdee79e42c7e13655c9eff2c26"
              timeout: 120
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/cudnn-${{vars.major-version}}/
          mv include ${{targets.contextdir}}/usr/local/cudnn-${{vars.major-version}}/
          mv lib ${{targets.contextdir}}/usr/local/cudnn-${{vars.major-version}}/lib64
          mv LICENSE ${{targets.contextdir}}/usr/local/cudnn-${{vars.major-version}}/${{package.name}}.LICENSE
    test:
      pipeline:
        - runs: |
            # Check for library
            stat /usr/local/cudnn-${{vars.major-version}}/lib64/libcudnn.so

  - name: ${{package.name}}-cuda-12-dev
    description: CUDA Deep Neural Network Libraries ${{vars.major-minor-version}} for CUDA 12 - development headers
    dependencies:
      runtime:
        - ${{package.name}}-cuda-12
    pipeline:
      - uses: split/dev
        with:
          package: ${{package.name}}-cuda-12
    test:
      pipeline:
        - runs: |
            # Check for header
            stat /usr/local/cudnn-${{vars.major-version}}/include/cudnn.h

  - name: ${{package.name}}-cuda-11
    description: CUDA Deep Neural Network Libraries ${{vars.major-minor-version}} for CUDA 11
    dependencies:
      provides:
        - nvidia-cudnn-9.2-11.8=${{package.full-version}}
        - nvidia-cudnn-9.2-cuda-11.8=${{package.full-version}}
      runtime:
        # Provide for compat with intent to remove in future
        - ${{package.name}}-compat
    pipeline:
      - assertions:
          required-steps: 1
        pipeline:
          - if: ${{build.arch}} == 'aarch64'
            uses: fetch
            with:
              # SBSA = ARM Server Base System Architecture (now called SystemReady)
              uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-sbsa/cudnn-linux-sbsa-${{package.version}}_cuda11-archive.tar.xz"
              expected-sha256: "04b56fbf7bee15c24e339c2ba94d17aa88b9e334d0cd19e75853dc5452794bf7"
              timeout: 120
          - if: ${{build.arch}} == 'x86_64'
            uses: fetch
            with:
              uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-${{package.version}}_cuda11-archive.tar.xz"
              expected-sha256: "069da084cd368f39fb830d4c4e931803064fb65e766f4cf7df2da4a346a2ba9f"
              timeout: 120
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/cudnn-${{vars.major-version}}/
          mv include ${{targets.contextdir}}/usr/local/cudnn-${{vars.major-version}}/
          mv lib ${{targets.contextdir}}/usr/local/cudnn-${{vars.major-version}}/lib64
          mv LICENSE ${{targets.contextdir}}/usr/local/cudnn-${{vars.major-version}}/${{package.name}}.LICENSE
    test:
      pipeline:
        - runs: |
            # Check for library
            stat /usr/local/cudnn-${{vars.major-version}}/lib64/libcudnn.so

  - name: ${{package.name}}-cuda-11-dev
    description: CUDA Deep Neural Network Libraries ${{vars.major-minor-version}} for CUDA 11 - development headers
    dependencies:
      runtime:
        - ${{package.name}}-cuda-11
    pipeline:
      - uses: split/dev
        with:
          package: ${{package.name}}-cuda-11
    test:
      pipeline:
        - runs: |
            # Check for header 
            stat /usr/local/cudnn-${{vars.major-version}}/include/cudnn.h

  - name: ${{package.name}}-compat
    description: Compat package for CUDA Deep Neural Network Libraries ${{vars.major-minor-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/local/
          ln -sf /usr/local/cudnn-${{vars.major-version}} ${{targets.contextdir}}/usr/local/cudnn-${{vars.major-minor-version}}

update:
  enabled: true
  manual: true
  release-monitor:
    identifier: 373965
