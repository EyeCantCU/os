package:
  name: nvidia-cudnn-9
  version: "9.10.0.56"
  epoch: 0
  description: CUDA Deep Neural Network Libraries
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-cudnn=${{package.full-version}}

var-transforms:
  # It's unclear why we chose this prefix. Upstream's debs have the libs
  # directly under /usr/lib/<triplet> and the headers directly under
  # /usr/include/<triplet>. Let's rethink this for the next major version,
  # which would also allow us to drop the -ld-config subpackage.
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+\.\d+$
    replace: /usr/local/cudnn-"$1"
    to: install-prefix
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+.\d+$
    replace: "$1"
    to: major-minor-version
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+\.\d+$
    replace: "$1"
    to: major-version

vars:
  libsubdir: lib64

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: true

subpackages:
  - name: ${{package.name}}-cuda-12
    description: CUDA Deep Neural Network Libraries ${{vars.major-minor-version}} for CUDA 12
    dependencies:
      provides:
        - nvidia-cudnn-9.1.1=${{package.full-version}}
      runtime:
        # Provide for compat with intent to remove in future
        - ${{package.name}}-compat
        - ${{package.name}}-ld-config
    pipeline:
      - assertions:
          required-steps: 1
        pipeline:
          - if: ${{build.arch}} == 'aarch64'
            uses: fetch
            with:
              # SBSA = ARM Server Base System Architecture (now called SystemReady)
              uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-sbsa/cudnn-linux-sbsa-${{package.version}}_cuda12-archive.tar.xz"
              expected-sha256: "83ccb2a039f266e3aedc4ac6b186ded5f49d1be67e82b445f595eb2ec3cc17eb"
              timeout: 120
          - if: ${{build.arch}} == 'x86_64'
            uses: fetch
            with:
              uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-${{package.version}}_cuda12-archive.tar.xz"
              expected-sha256: "cc0ad9eaaf6ef6569b20250111f9df0569816c17076c58aad8aea1661e2fc781"
              timeout: 120
      - runs: |
          mkdir -p ${{targets.contextdir}}${{vars.install-prefix}}/
          mv include ${{targets.contextdir}}${{vars.install-prefix}}/
          mv lib ${{targets.contextdir}}${{vars.install-prefix}}/${{vars.libsubdir}}
          mv LICENSE ${{targets.contextdir}}${{vars.install-prefix}}/${{package.name}}.LICENSE
    test:
      pipeline:
        - runs: |
            # Check for library
            stat ${{vars.install-prefix}}/${{vars.libsubdir}}/libcudnn.so
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-cuda-12-dev
    description: CUDA Deep Neural Network Libraries ${{vars.major-minor-version}} for CUDA 12 - development headers
    dependencies:
      runtime:
        - ${{package.name}}-cuda-12
    pipeline:
      - uses: split/dev
        with:
          package: ${{package.name}}-cuda-12
    test:
      pipeline:
        - runs: |
            # Check for header
            stat ${{vars.install-prefix}}/include/cudnn.h
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-cuda-11
    description: CUDA Deep Neural Network Libraries ${{vars.major-minor-version}} for CUDA 11
    dependencies:
      provides:
        - nvidia-cudnn-9.2-11.8=${{package.full-version}}
        - nvidia-cudnn-9.2-cuda-11.8=${{package.full-version}}
      runtime:
        # Provide for compat with intent to remove in future
        - ${{package.name}}-compat
        - ${{package.name}}-ld-config
    pipeline:
      - assertions:
          required-steps: 1
        pipeline:
          - if: ${{build.arch}} == 'aarch64'
            uses: fetch
            with:
              # SBSA = ARM Server Base System Architecture (now called SystemReady)
              uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-sbsa/cudnn-linux-sbsa-${{package.version}}_cuda11-archive.tar.xz"
              expected-sha256: "b1a5cfd60c96ce8a09d0c7dc5c5427d874e08cc8813f5bad29755d674c8b0374"
              timeout: 120
          - if: ${{build.arch}} == 'x86_64'
            uses: fetch
            with:
              uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-${{package.version}}_cuda11-archive.tar.xz"
              expected-sha256: "a0579702b538378243795328c186bb37199618494b498f1b74a5b61304861733"
              timeout: 120
      - runs: |
          mkdir -p ${{targets.contextdir}}${{vars.install-prefix}}/
          mv include ${{targets.contextdir}}${{vars.install-prefix}}/
          mv lib ${{targets.contextdir}}${{vars.install-prefix}}/${{vars.libsubdir}}
          mv LICENSE ${{targets.contextdir}}${{vars.install-prefix}}/${{package.name}}.LICENSE
    test:
      pipeline:
        - runs: |
            # Check for library
            stat ${{vars.install-prefix}}/${{vars.libsubdir}}/libcudnn.so

  - name: ${{package.name}}-cuda-11-dev
    description: CUDA Deep Neural Network Libraries ${{vars.major-minor-version}} for CUDA 11 - development headers
    dependencies:
      runtime:
        - ${{package.name}}-cuda-11
    pipeline:
      - uses: split/dev
        with:
          package: ${{package.name}}-cuda-11
    test:
      pipeline:
        - runs: "# Check for header \nstat ${{vars.install-prefix}}/include/cudnn.h\n"

  - name: ${{package.name}}-compat
    description: Compat package for CUDA Deep Neural Network Libraries ${{vars.major-minor-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/local/
          ln -sf ${{vars.install-prefix}} ${{targets.contextdir}}/usr/local/cudnn-${{vars.major-minor-version}}

  - name: ${{package.name}}-ld-config
    description: Runtime linker configuration for CUDA Deep Neural Network Libraries ${{vars.major-minor-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/etc/ld.so.conf.d
          echo "${{vars.install-prefix}}/${{vars.libsubdir}}" > \
            "${{targets.contextdir}}"/etc/ld.so.conf.d/${{package.name}}.conf

update:
  enabled: true
  release-monitor:
    identifier: 373965
