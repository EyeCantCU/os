package:
  name: tekton-pipelines-fips
  version: 0.60.2
  epoch: 2
  description: A cloud-native Pipeline resource.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - oldglibc
  environment:
    CGO_CFLAGS: -I/usr/lib/oldglibc/include
    CGO_LDFLAGS: -L/usr/lib/oldglibc/lib

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tektoncd/pipeline
      tag: v${{package.version}}
      expected-commit: ee3af64bed9f2762034fc10d38d9531224b9df9a

  - uses: go/bump
    with:
      deps: github.com/docker/docker@v26.0.2 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/hashicorp/go-retryablehttp@v0.7.7

  - uses: go/build
    with:
      packages: ./cmd/controller
      output: tekton-pipelines-controller
      go-package: go-fips

test:
  pipeline:
    - uses: test/go-fips-check

data:
  - name: cmds
    items:
      # NB: The entrypoint binary is copied into unknown containers at runtime,
      # so it must be built with oldglibc for maximum compatibility.
      entrypoint: entrypoint
      events: events
      nop: nop
      resolvers: resolvers
      sidecarlogresults: sidecarlogresults
      webhook: webhook
      workingdirinit: workingdirinit

subpackages:
  - range: cmds
    name: tekton-pipelines-${{range.key}}-fips
    description: tekton pipelines ${{range.key}} fips
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/${{range.key}}
          output: tekton-pipelines-${{range.key}}
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: tektoncd/pipeline
    strip-prefix: v
