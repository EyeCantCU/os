package:
  name: py3-gssapi
  version: 1.10.0
  epoch: 0
  description: Low-level and high level wrappers around the GSSAPI C libraries
  copyright:
    - license: ISC

vars:
  pypi-package: gssapi

environment:
  contents:
    packages:
      - krb5-dev
      - py3-supported-build-base-dev
      - py3-supported-cython

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pythongssapi/python-gssapi.git
      tag: v${{package.version}}
      expected-commit: d792186a8b80e4906773b2d39a9815371ce1499c

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-decorator
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: gssapi

update:
  enabled: true
  git:
    strip-prefix: v
