#nolint:valid-pipeline-git-checkout-tag
package:
  name: systemd-ephemeral
  version: "0.0.4"
  epoch: 0
  description: Configuration for ephemeral system state on immutable root filesystems
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - systemd

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/lib/systemd/system/
      mkdir -p ${{targets.contextdir}}/usr/lib/systemd/system/sysinit.target.wants/
      mkdir -p ${{targets.contextdir}}/usr/lib/tmpfiles.d/

      install -Dm644 overlay-dirs.conf ${{targets.contextdir}}/usr/lib/tmpfiles.d/
      install -Dm644 etc.mount ${{targets.contextdir}}/usr/lib/systemd/system/
      install -Dm644 home.mount ${{targets.contextdir}}/usr/lib/systemd/system/
      install -Dm644 root.mount ${{targets.contextdir}}/usr/lib/systemd/system/
      install -Dm644 var.mount ${{targets.contextdir}}/usr/lib/systemd/system/
      install -Dm644 var-overlay-prepare.service ${{targets.contextdir}}/usr/lib/systemd/system/
      install -Dm644 etc-machine-id.service ${{targets.contextdir}}/usr/lib/systemd/system/

      ln -s ../etc.mount ${{targets.contextdir}}/usr/lib/systemd/system/sysinit.target.wants/etc.mount
      ln -s ../home.mount ${{targets.contextdir}}/usr/lib/systemd/system/sysinit.target.wants/home.mount
      ln -s ../root.mount ${{targets.contextdir}}/usr/lib/systemd/system/sysinit.target.wants/root.mount
      ln -s ../var.mount ${{targets.contextdir}}/usr/lib/systemd/system/sysinit.target.wants/var.mount
      ln -s ../etc-machine-id.service ${{targets.contextdir}}/usr/lib/systemd/system/sysinit.target.wants/etc-machine-id.service
      ln -s ../var-overlay-prepare.service ${{targets.contextdir}}/usr/lib/systemd/system/sysinit.target.wants/var-overlay-prepare.service

      mkdir -p ${{targets.contextdir}}/etc/cloud/cloud.cfg.d/
      install -Dm644 99-disable-resize.cfg ${{targets.contextdir}}/etc/cloud/cloud.cfg.d/99-disable-resize.cfg

update:
  enabled: false
  exclude-reason: |
    This is the upstream for this package
