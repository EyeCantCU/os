# see awspub-config.mapping file for parameters
awspub:
  source:
    path: "../output/x86_64/aws-ec2/disk.vmdk"
    architecture: "x86_64"
  s3:
    bucket_name: "xnox-vms"
  images:
    "$employee-chainguard-base-$serial.vmdk":
      description: "$employee-chainguard-base-$serial.vmdk"
      boot_mode: "uefi"
      # Actually default, but just in case
      public: false
      tpm_support: "v2.0"
      imds_support: "v2.0"
      # Only publish to one region, rather than all of them
      regions:
        - "us-east-1"
    "$employee-chainguard-base-$serial-debug.vmdk":
      description: "$employee-chainguard-base-$serial-debug.vmdk"
      boot_mode: "uefi"
      # Actually default, but just in case
      public: false
      tpm_support: "v2.0"
      imds_support: "v2.0"
      uefi_data: "../uefivars/LoaderConfigTimeout-menu-force.aws"
      # Only publish to one region, rather than all of them
      regions:
        - "us-east-1"
  tags:
    employee: "$employee"
