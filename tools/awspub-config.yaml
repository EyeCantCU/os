# see awspub-config.mapping file for parameters
awspub:
  source:
    path: "../output/aws-ec2/disk-debug.vmdk"
    architecture: "x86_64"
  s3:
    bucket_name: "xnox-vms"
  images:
    "xnox-disk-debug.vmdk":
      description: "xnox-disk-debug.vmdk"
      boot_mode: "uefi"
      # Actually default, but just in case
      public: false
      tpm_support: "v2.0"
      imds_support: "v2.0"
      # Only publish to one region, rather than all of them
      regions:
        - "us-east-1"
  tags:
    employee: "xnox"
