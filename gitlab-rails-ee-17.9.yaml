package:
  name: gitlab-rails-ee-17.9
  version: "17.9.6"
  epoch: 2
  description: "GitLab's core webapp, built with Ruby on Rails"
  resources:
    cpu: 64
    memory: 128Gi
  copyright:
    # GitLab Enterprise Edition license bundled with package
    - license: MIT
  dependencies:
    provides:
      - gitlab-rails-ee=${{package.full-version}}
    runtime:
      - exiftool
      - gitlab-rails-ee-assets-${{vars.major-minor-version}}
      - gitlab-rails-ee-doc-${{vars.major-minor-version}}
      - graphicsmagick
      - icu-dev
      - krb5-dev
      - libffi-dev
      - libpq
      - posix-libc-utils
      - ruby-3.2
      - ruby3.2-bundler
      - tzdata

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang
      - cmake
      - git
      - glibc-dev
      - go
      - gpgme-dev
      - icu-dev
      - krb5-dev
      - libffi-dev
      - libpq
      - node-gyp
      - nodejs-20
      - pkgconf
      - posix-libc-utils
      - postgresql-dev
      - python3
      - rsync # to install everything from /srv/gitlab to targetdir.
      - ruby-3.2
      - ruby-3.2-dev
      - ruby3.2-bundler
      - tzdata
      - yarn
      - zlib-dev
  environment:
    CC: clang
    CXX: clang++
    CXXFLAGS: "-std=c++17 -fPIC"
    LDSHARED: "clang++-18 -shared"
    TZINFO_DATA: /usr/share/zoneinfo
    RAILS_ENV: production
    NODE_ENV: production
    USE_DB: false
    SKIP_STORAGE_VALIDATION: true
    GITLAB_USER: git
    RUBY_VERSION: $(ruby -e 'print RUBY_VERSION')
    NODE_OPTIONS: "--max_old_space_size=16384"
    RUBY_GPGME_USE_SYSTEM_LIBRARIES: "true" # Don't build gpgme from source

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c0e18dece4cf66b9a6983af84ccc72dd3370add2
      repository: https://gitlab.com/gitlab-org/gitlab.git
      tag: v${{package.version}}-ee
      destination: /srv/gitlab

  - working-directory: /srv/gitlab
    runs: |
      # Use local path /srv/gitlab/vendor/bundle/ for ruby-magic gem.
      # See: https://gitlab.com/gitlab-org/build/CNG/-/merge_requests/697/diffs
      bundle config set --local path /srv/gitlab/vendor/bundle/
      bundle config set --local clean 'true'
      bundle config set --local deployment 'true'
      bundle config set --local without 'development test mysql aws'
      bundle config build.static_holmes --with-cflags="-fPIC" --with-cxxflags="-std=c++17 -fPIC" --with-ldflags="-shared -lstdc++"
      bundle install --jobs 4 --retry 5

      # Create GitLab datadir
      export DATADIR=/var/opt/gitlab
      mkdir -p ${DATADIR}

      cp config/gitlab.yml.example config/gitlab.yml
      cp config/resque.yml.example config/resque.yml
      cp config/secrets.yml.example config/secrets.yml
      cp config/database.yml.postgresql config/database.yml

      sed --in-place "/host: localhost/d" config/gitlab.yml
      sed --in-place "/port: 80/d" config/gitlab.yml
      sed --in-place "s/# user:.*/user: ${GITLAB_USER}/" config/gitlab.yml
      sed --in-place "s:/home/git/repositories:${DATADIR}/repo:" config/gitlab.yml

      yarn install --production --pure-lockfile
      bundle exec rake gettext:compile
      bundle exec rake gitlab:assets:compile
      mkdir -p /assets/licenses
      cp LICENSE /assets/licenses/GitLab.txt

      # Some more directories that are needed in image
      mkdir -p /home/git/gitlab-shell
      ln -sf /srv/gitlab/GITLAB_SHELL_VERSION /home/git/gitlab-shell/VERSION

      bundle config unset --local path

      # Cleanup
      rm -rf node_modules/ tmp/ spec/ ee/spec/ qa/ rubocop/ tooling/ .git/ .gitlab/ \
             .github/ docker/ changelogs/ danger/ Dangerfile
      # Remove git directories
      find /srv/gitlab -name "*.git" -exec rm -rf '{}' +
      # TODO: Create gitlab-cng-ee-rails-buildscripts packagee

      # Exclude additional files from specific gems.
      # These result in detected deps on ld-linux.so.2 which it shouldn't pull in.
      ruby_dir="vendor/bundle/ruby"
      rm -rf ${ruby_dir}/*/gems/grpc-*/bin

      # Remove spec file which triggers malware check failure
      rm /srv/gitlab/gems/csv_builder/spec/csv_builder_spec.rb

      # Don't run, removes critical gems
      #/home/build/build-scripts/cleanup-gems

      # Rebuild devfile gem with Go
      cd ./vendor/bundle/ruby/*/gems/*devfile*/ext
      # Mitigate CVEs
      go get golang.org/x/net@v0.38.0 github.com/docker/docker@v26.1.5 github.com/go-git/go-git/v5@v5.13.0 golang.org/x/oauth2@v0.27.0 golang.org/x/crypto@v0.35.0 github.com/containerd/containerd@v1.7.27
      go mod tidy
      rm ../bin/devfile
      go build \
        -o ../bin/devfile \
        -tags "netgo,osusergo" \
        -ldflags "-w" \
        -trimpath .
      cd /srv/gitlab

  - name: Install /srv/gitlab, /var/opt/gitlab, /assets/licenses, and /home/git/gitlab-shell
    runs: |
      mkdir -p \
        ${{targets.contextdir}}/srv/gitlab \
        ${{targets.contextdir}}/var/opt/gitlab \
        ${{targets.contextdir}}/assets/licenses \
        ${{targets.contextdir}}/home/git/gitlab-shell
      rsync -avz /srv/gitlab/ ${{targets.contextdir}}/srv/gitlab/
      rsync -avz /var/opt/gitlab/ ${{targets.contextdir}}/var/opt/gitlab/
      rsync -avz /assets/licenses/ ${{targets.contextdir}}/assets/licenses/
      rsync -avz /home/git/gitlab-shell/ ${{targets.contextdir}}/home/git/gitlab-shell/

subpackages:
  - name: gitlab-rails-ee-assets-${{vars.major-minor-version}}
    description: GitLab ${{vars.major-minor-version}} assets
    dependencies:
      provides:
        - gitlab-rails-ee-assets=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/srv/gitlab
          mv ${{targets.destdir}}/srv/gitlab/public ${{targets.subpkgdir}}/srv/gitlab/

  - name: gitlab-rails-ee-doc-${{vars.major-minor-version}}
    description: GitLab ${{vars.major-minor-version}} documentation
    dependencies:
      provides:
        - gitlab-rails-ee-doc=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/srv/gitlab
          mv ${{targets.destdir}}/srv/gitlab/doc ${{targets.subpkgdir}}/srv/gitlab/

test:
  environment:
    contents:
      packages:
        - bash
        - git
        - ruby-3.2-dev
        - libmagic
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test magic
      working-directory: /srv/gitlab
      runs: |
        touch testfile
        cat <<"EOF" >test.rb
        require 'magic'

        begin
          # Open a file as an IO object
          file_path = 'testfile'
          io = File.open(file_path, 'rb')

          # Use Magic to determine the MIME type
          mime_type = Magic.open(Magic::MIME_TYPE) { |m| m.file(io.path) }

          puts "Magic library is working! MIME type of #{file_path}: #{mime_type}"
        rescue Magic::MagicError => e
          puts "Error: #{e.message}"
          puts "ruby-magic or libmagic might not be installed correctly."
          exit(1)
        ensure
          io.close if io
        end
        EOF
        bundle exec ruby test.rb

update:
  enabled: true
  git:
    strip-prefix: v
    strip-suffix: -ee
    tag-filter-prefix: v17.9
  ignore-regex-patterns:
    - '-rc*'
