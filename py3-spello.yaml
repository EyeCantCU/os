package:
  name: py3-spello
  version: 1.3.0
  epoch: 1
  description: Fast and accurate spell correction library
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python3
      - py3-nltk

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-setuptools
      - py3-wheel
      - python3-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hellohaptik/spello
      tag: ${{package.version}}
      expected-commit: a001583ff8d66d73ba8dfcf91beef0df54b25a39

  - name: Python Build
    runs: python setup.py build

  - name: Python Install
    runs: python setup.py install --prefix=/usr --root="${{targets.destdir}}"

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - 'post'
  github:
    identifier: hellohaptik/spello
    use-tag: true
