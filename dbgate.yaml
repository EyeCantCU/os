package:
  name: dbgate
  version: 6.4.0
  epoch: 0
  description: Multi-database management tool with web interface
  copyright:
    - license: GPL-3.0-only

environment:
  contents:
    packages:
      - build-base
      - nodejs-22
      - yarn
      - python3

vars:
  dbgate-home: /usr/share/dbgate

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dbgate/dbgate
      tag: v${{package.version}}
      expected-commit: 73e7043e8b4f8a23454b3ed32b1f29b8ec5b8b40

  - name: Install dependencies and build
    runs: |
      set -o pipefail
      
      yarn install --frozen-lockfile
      
      # Build core components (no Docker-specific steps)
      yarn build:lib
      yarn plugins:copydist
      yarn build:web
      yarn build:api

  - name: Install application
    runs: |
      set -o pipefail
      
      # Create application directory structure
      mkdir -p ${{targets.destdir}}${{vars.dbgate-home}}
      
      # Copy built application components
      cp packages/api/dist/bundle.js ${{targets.destdir}}${{vars.dbgate-home}}/
      cp -r packages/web/public ${{targets.destdir}}${{vars.dbgate-home}}/
      cp -r plugins/dist ${{targets.destdir}}${{vars.dbgate-home}}/plugins
      
      # Copy production node_modules (install production only)
      rm -rf node_modules
      yarn install --frozen-lockfile --production=true
      cp -r node_modules ${{targets.destdir}}${{vars.dbgate-home}}/
      cp package.json yarn.lock ${{targets.destdir}}${{vars.dbgate-home}}/
      
      # Copy upstream entrypoint script
      cp docker/entrypoint.sh ${{targets.destdir}}${{vars.dbgate-home}}/

  - name: Create symlink to upstream entrypoint
    runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      ln -sf ${{vars.dbgate-home}}/entrypoint.sh ${{targets.destdir}}/usr/bin/dbgate
`
  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    dependencies:
      runtime:
        - ${{package.name}}
    description: Compatibility package to provide binary at expected upstream location
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}${{vars.dbgate-home}}
          ln -sf /usr/bin/dbgate ${{targets.subpkgdir}}${{vars.dbgate-home}}/dbgate
    test:
      pipeline:
        - runs: |
            set -o pipefail
            [ "$(readlink -f ${{vars.dbgate-home}}/dbgate)" = "/usr/bin/dbgate" ]

update:
  enabled: true
  github:
    identifier: dbgate/dbgate
    strip-prefix: v
    tag-filter: v
    ignore-regex-patterns:
      - ".*beta.*"
      - ".*alpha.*"
      - ".*rc.*"
      - ".*premium.*"

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
        - nodejs-22
        - jq
    environment:
      # Ports for testing
      DBGATE_PORT: "3000"
      # Node.js configuration
      NODE_ENV: "production"
  pipeline:
    - name: Check basic functionality
      runs: |
        set -o pipefail
        
        # Test that the binary exists and is executable
        which dbgate
        
        # Test basic startup (should exit gracefully)
        timeout 5 dbgate --help || echo "Help command completed"
    
    - name: Test dbgate web server startup
      uses: test/daemon-check-output
      with:
        start: dbgate
        timeout: 30
        expected_output: |
          Server started
          Listening on port
        error_strings: |
          panic
          fatal
          Error:
          EADDRINUSE
        post: |
          set -o pipefail
          
          # Wait for web server to be ready
          wait-for-it "localhost:${DBGATE_PORT}" -t 30
          
          # Test basic web interface
          curl -sf "localhost:${DBGATE_PORT}/" | grep -q -E "dbgate|DbGate|Database"
          
          # Test API endpoints if they exist
          if curl -sf "localhost:${DBGATE_PORT}/api/config" 2>/dev/null; then
            curl -sf "localhost:${DBGATE_PORT}/api/config" | jq -e 'type == "object"'
          fi
          
          if curl -sf "localhost:${DBGATE_PORT}/api/connections" 2>/dev/null; then
            curl -sf "localhost:${DBGATE_PORT}/api/connections" | jq -e 'type == "array"'
          fi
          
          # Test static assets serving
          curl -sf "localhost:${DBGATE_PORT}/" | head -c 500
    
    - name: Test application structure
      runs: |
        set -o pipefail
        
        # Verify application files are in place
        [ -f "${{vars.dbgate-home}}/bundle.js" ]
        [ -d "${{vars.dbgate-home}}/public" ]
        [ -d "${{vars.dbgate-home}}/plugins" ]
        [ -d "${{vars.dbgate-home}}/node_modules" ]
        [ -f "${{vars.dbgate-home}}/package.json" ]
        
        # Test that main entry point is executable
        [ -f "${{vars.dbgate-home}}/bundle.js" ]
        
        # Verify Node.js can load the application bundle
        cd ${{vars.dbgate-home}}
        timeout 5 node -e "console.log('Node.js can load application bundle')" || true