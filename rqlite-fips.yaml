package:
  name: rqlite-fips
  version: "8.39.1"
  epoch: 1
  description: The lightweight, distributed relational database built on SQLite
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rqlite/rqlite
      tag: v${{package.version}}
      expected-commit: 07809edf71594d27710ff9858a5207d4f911a8e1

  - uses: go/build
    with:
      packages: ./cmd/rqlite
      tags: sqlite_omit_load_extension,fipsstrict
      output: rqlite
      go-package: go-fips
      strip: ""
      ldflags: |
        -X github.com/rqlite/rqlite/v8/cmd.CompilerCommand=$(go env CC || echo gcc)
        -X github.com/rqlite/rqlite/v8/cmd.Version=${{package.version}}
        -X github.com/rqlite/rqlite/v8/cmd.Branch=$(git rev-parse --abbrev-ref HEAD)
        -X github.com/rqlite/rqlite/v8/cmd.Commit=$(git rev-parse HEAD)
        -X github.com/rqlite/rqlite/v8/cmd.Buildtime=$(date +%Y-%m-%dT%T%z)

  - uses: go/build
    with:
      packages: ./cmd/rqlited
      tags: sqlite_omit_load_extension,fipsstrict
      output: rqlited
      go-package: go-fips
      strip: ""
      ldflags: |
        -X github.com/rqlite/rqlite/v8/cmd.CompilerCommand=$(go env CC || echo gcc)
        -X github.com/rqlite/rqlite/v8/cmd.Version=${{package.version}}
        -X github.com/rqlite/rqlite/v8/cmd.Branch=$(git rev-parse --abbrev-ref HEAD)
        -X github.com/rqlite/rqlite/v8/cmd.Commit=$(git rev-parse HEAD)
        -X github.com/rqlite/rqlite/v8/cmd.Buildtime=$(date +%Y-%m-%dT%T%z)

subpackages:
  - name: ${{package.name}}-oci-entrypoint
    description: "Entrypoint for using rqlite in OCI containers"
    pipeline:
      - runs: |
          sed -i "s|RQLITED=/bin/rqlited|RQLITED=/usr/bin/rqlited|g" docker-entrypoint.sh
      - runs: |
          install -Dm755 docker-entrypoint.sh ${{targets.subpkgdir}}/usr/bin/docker-entrypoint.sh
    dependencies:
      runtime:
        - ${{package.name}}
        - dash-binsh

test:
  environment:
    contents:
      packages:
        - curl
        - jq
  pipeline:
    - uses: test/go-fips-check
    - name: Check flags
      runs: |
        rqlite --version 2>&1 | grep ${{package.version}}
        rqlite --help
        rqlited --version 2>&1 | grep ${{package.version}}
        rqlited --help
    - name: "Test server startup and functionality"
      uses: test/daemon-check-output
      with:
        start: rqlited ~/node.1
        timeout: 10
        expected_output: |
          rqlited starting
          service listening on
          is now Leader
        post: |
          curl --retry-all-errors --retry 3 -s "http://localhost:4001/readyz" | grep "ok"

update:
  enabled: true
  github:
    identifier: rqlite/rqlite
    strip-prefix: v
