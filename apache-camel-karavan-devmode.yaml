package:
  name: apache-camel-karavan-devmode
  version: "4.14.2"
  epoch: 0
  description: "Apache Camel Karavan a Low-code Data Integration Platform powered by Apache Camel"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - jbang
      - maven
      - openjdk-${{vars.JAVA_VERSION}}-jre

vars:
  JAVA_VERSION: 17

environment:
  contents:
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - git
      - jbang
      - maven
      - openjdk-${{vars.JAVA_VERSION}}-default-jdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/camel-karavan
      tag: ${{package.version}}
      expected-commit: 5175973d2e326e840b547a5951e2b61d49fd897a

  - name: Install Camel CLI using JBang
    runs: |
      jbang trust add https://github.com/apache/camel
      jbang app install camel@apache/camel
      jbang config set cache-evict never

      mkdir -p "${{targets.destdir}}/usr/share/jbang/bin"
      mkdir -p "${{targets.destdir}}/usr/share/jbang/apps"
      cp ~/.jbang/bin/* "${{targets.destdir}}/usr/share/jbang/bin/"
      cp -r ~/.jbang/cache "${{targets.destdir}}/usr/share/jbang/"
      cp ~/.jbang/jbang.properties "${{targets.destdir}}/usr/share/jbang/"

      # Create camel wrapper script
      mkdir -p "${{targets.destdir}}/usr/bin"
      tee "${{targets.destdir}}/usr/bin/camel" <<EOF
      #!/bin/bash
      set -e
      export JBANG_DIR="\${JBANG_DIR:-/usr/share/jbang}"
      export CAMEL_VERSION="\${CAMEL_VERSION:-${{package.version}}}"
      export CAMEL_KAMELETS_VERSION="\${CAMEL_KAMELETS_VERSION:-${{package.version}}}"
      exec jbang -Dcamel.jbang.version="\${CAMEL_VERSION}" -Dcamel.jbang.kameletsVersion="\${CAMEL_KAMELETS_VERSION}" camel@apache/camel "\$@"
      EOF
      chmod +x "${{targets.destdir}}/usr/bin/camel"

  - name: Create runtime directories
    runs: |
      mkdir -p "${{targets.destdir}}/karavan/code"
      mkdir -p "${{targets.destdir}}/karavan/builder"
      mkdir -p "${{targets.destdir}}/karavan/kamelets"

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for ${{package.name}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/karavan/.jbang"
          ln -sf /usr/share/jbang "${{targets.subpkgdir}}/karavan/.jbang/"
    test:
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  git: {}

test:
  environment:
    contents:
      packages:
        - openjdk-${{vars.JAVA_VERSION}}-default-jdk
    environment:
      JAVA_HOME: /usr/lib/jvm/java-${{vars.JAVA_VERSION}}-openjdk
      JBANG_DIR: /usr/share/jbang
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: camel
    - uses: test/tw/ver-check
      with:
        bins: camel
    - name: Test Karavan devmode runtime command
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /karavan/code
          tee /karavan/code/test-route.yaml <<'EOF'
          - route:
              from:
                uri: "timer:tick?period=1000"
                steps:
                  - log:
                      message: "Karavan devmode test successful!"
          EOF
        start: jbang -Dcamel.jbang.version=${{package.version}} -Dcamel.jbang.kameletsVersion=${{package.version}} camel@apache/camel run --source-dir=/karavan/code --console
        timeout: 90
        expected_output: |
          Karavan devmode test successful!
