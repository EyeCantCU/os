package:
  name: py3-diskcache
  version: 5.6.3
  epoch: 0
  description: Disk Cache -- Disk and file backed persistent cache
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: diskcache
  import: diskcache

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-wheel

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grantjenks/python-diskcache
      tag: v${{package.version}}
      expected-commit: 323787f507a6456c56cce213156a78b17073fe00

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import diskcache

            # Test basic cache functionality
            cache = diskcache.Cache('/tmp/test-cache')

            # Test cache set/get operations
            cache['key'] = 'value'
            assert cache['key'] == 'value'

            # Test cache methods
            cache.set('test', 42)
            assert cache.get('test') == 42

            # Test size and clear
            assert len(cache) > 0
            cache.clear()
            assert len(cache) == 0

            print("All tests passed!")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  git:
    strip-prefix: v
