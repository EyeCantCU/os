package:
  name: cluster-autoscaler-1.30
  version: "1.30.4"
  epoch: 5
  description: Autoscaling components for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - cluster-autoscaler=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go
  environment:
    CGO_ENABLED: 0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/autoscaler
      tag: cluster-autoscaler-${{package.version}}
      expected-commit: 44eaccd5637c5ae437ffab0e9bf50510db265fa4

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0
      modroot: cluster-autoscaler/cloudprovider/azure/test

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0
      modroot: cluster-autoscaler/apis

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0
      modroot: vertical-pod-autoscaler/e2e

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0
      modroot: vertical-pod-autoscaler

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0
      modroot: balancer

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.21.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.21.0
        github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0
        golang.org/x/oauth2@v0.27.0
        github.com/golang-jwt/jwt/v4@v4.5.2
        github.com/golang-jwt/jwt/v5@v5.2.2
        golang.org/x/net@v0.38.0
      replaces: k8s.io/cloud-provider-aws=k8s.io/cloud-provider-aws@v1.29.2
      modroot: cluster-autoscaler

  - uses: go/build
    with:
      modroot: cluster-autoscaler
      packages: .
      output: cluster-autoscaler
      vendor: true

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}
          # The upstream helm chart assumes the binary is in /.
          ln -sf /usr/bin/cluster-autoscaler ${{targets.subpkgdir}}/cluster-autoscaler
    dependencies:
      provides:
        - cluster-autoscaler-compat=${{package.full-version}}

test:
  pipeline:
    - runs: |
        test -x /usr/bin/cluster-autoscaler
        # the binaries do not have --help/--version
        cluster-autoscaler 2>&1 | grep -qi "unable to load in-cluster configuration"

update:
  enabled: true
  github:
    identifier: kubernetes/autoscaler
    strip-prefix: cluster-autoscaler-
    use-tag: true
    # There are other tags like "cluster-autoscaler-chart-FOO"
    tag-filter: cluster-autoscaler-1.30.
