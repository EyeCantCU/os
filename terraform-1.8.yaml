package:
  name: terraform-1.8
  version: 1.8.5
  epoch: 7
  copyright:
    - license: BUSL-1.1
  dependencies:
    provides:
      - terraform=${{package.full-version}}

environment:
  environment:
    CGO_ENABLED: 0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/terraform
      tag: v${{package.version}}
      expected-commit: 8f2d640b719872f9661d46deb628d1f14d0fc135

  - uses: go/bump
    with:
      deps: google.golang.org/protobuf@v1.33.0 github.com/hashicorp/go-retryablehttp@v0.7.7 github.com/hashicorp/go-getter@v1.7.5 github.com/golang-jwt/jwt/v4@v4.5.1 golang.org/x/crypto@v0.31.0

  - uses: go/build
    with:
      packages: .
      output: terraform
      ldflags: -s -w -X github.com/hashicorp/terraform/version.dev="no"

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for terraform
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/terraform "${{targets.subpkgdir}}"/usr/local/bin

  - name: ${{package.name}}-local-provider-config
    description: Configure Terraform to use local providers
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/terraform/provider-mirror
          cat > "${{targets.subpkgdir}}"/terraform/.terraformrc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "/terraform/provider-mirror"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.8

test:
  pipeline:
    - runs: |
        terraform --version
