package:
  name: py3-nvidia-nvshmem-cuda-12.9
  version: 3.3.9
  epoch: 3
  description: NVSHMEM creates a global address space that provides efficient and scalable communication for NVIDIA GPU clusters
  copyright:
    - license: Linux-OpenIB AND BSD-2-Clause AND BSD-3-Clause
      license-path: nvshmem4py-cuda-12/LICENSE

vars:
  pypi-package: nvidia-nvshmem
  import: nvshmem.core

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\..*'
    replace: '$1'
    to: cuda-major-version

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - nvidia-libnvshmem-${{vars.cuda-version}}-dev=${{package.version}}
      - nvshmem4py-cuda-${{vars.cuda-major-version}}
      - py3-supported-build-base-dev
      - py3-supported-cython
  environment:
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
    CXXFLAGS: -I/usr/local/cuda-${{vars.cuda-version}}/include
    SETUPTOOLS_SCM_PRETEND_VERSION: ${{package.version}}

pipeline:
  - runs: |
      cp -a "/usr/src/nvshmem4py-cuda-${{vars.cuda-major-version}}" .

  - name: rename package to match pypi
    working-directory: nvshmem4py-cuda-${{vars.cuda-major-version}}
    runs: |
      cutag="cu${{vars.cuda-major-version}}"
      # Upstream also does this, but via cmake/buildWheel.cmake
      sed -i -e "s/^name = \"nvshmem4py-${cutag}\"/name = \"${{vars.pypi-package}}-${cutag}\"/" pyproject.toml

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - nvidia-libnvshmem-${{vars.cuda-version}}-dev
        - py${{range.key}}-cuda-core-cuda-${{vars.cuda-version}}
        - py${{range.key}}-cuda-python-cuda-${{vars.cuda-version}}
        - py${{range.key}}-numpy-1.26
    pipeline:
      - working-directory: nvshmem4py-cuda-12
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - py${{range.key}}-pip
      pipeline:
        - uses: test/tw/pip-check
        - uses: test/tw/ldd-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Make sure our package rename worked
          runs: |
            cutag="cu${{vars.cuda-major-version}}"
            python${{range.key}} -m pip list | grep "^nvidia-nvshmem-${cutag} "

  - name: py3-supported-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.11-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.12-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.13-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: false
  exclude-reason: "The actual source is in nvshmem4py-cuda-12, but it has different versioning"

test:
  pipeline:
    - uses: test/emptypackage
