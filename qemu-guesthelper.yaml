package:
  name: qemu-guesthelper
  version: 0.0.1
  epoch: 3
  description: "small guest helper for qemu"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - go

pipeline:
  - name: build
    runs: |
      go build -o qemu-guesthelper -ldflags="-s -w" ./

  - name: install
    runs: |
      destd="${{targets.contextdir}}"
      mkdir -p "$destd"
      install -Dm755 ./qemu-guesthelper "$destd/usr/bin/qemu-guesthelper"

subpackages:
  - name: "${{package.name}}-authorized-keys-command"
    description: "Install ssh authorized-keys config snippet"
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          destd="${{targets.contextdir}}"
          mkdir -p "$destd"
          install -Dm644 ./40-qemu-ssh-keys-fetcher.conf \
              "$destd/etc/ssh/sshd_config.d/40-qemu-ssh-keys-fetcher.conf"
    test:
      environment:
        contents:
          packages:
            - openssh
      pipeline:
        - runs: |
            ssh-keygen -A -q -N ""
            sshd -T
        - runs: |
            qemu-guesthelper fetch-keys --help
        - runs: |
            [ -f /etc/ssh/sshd_config.d/40-qemu-ssh-keys-fetcher.conf ]

test:
  pipeline:
    - runs: |
        qemu-guesthelper --help

update:
  enabled: false
  exclude-reason: |
    This is the upstream for this package
