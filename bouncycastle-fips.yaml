package:
  name: bouncycastle-fips
  version: 1.0.2.5
  epoch: 2
  description: BouncyCastle FIPS APIs
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - bouncycastle-pkix-fips
      - bouncycastle-tls-fips

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://downloads.bouncycastle.org/fips-java/bc-fips-${{package.version}}.jar
      expected-sha512: 11d59d54f37a3db5cc25063632e564538c107738d895dc8602a79574222cbbf58c15f2347131d3edcb65a5651232ed16906f0152884cec5115aee313a026961e
      extract: false

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/java/bouncycastle-fips
      cp bc-fips-${{package.version}}.jar ${{targets.destdir}}/usr/share/java/bouncycastle-fips/bc-fips.jar

# We don't build these packages from source due to signing and licensing issues.
# Therefore, we cannot automatically upgrade them based on GitHub tags/releases
# and/or release-monitoring.org
# Before upgrading this package to a newer version, you must verify whether the version was
# certified. You can do it by looking which versions are certified in the following
# website: https://csrc.nist.gov/projects/cryptographic-module-validation-program/validated-modules/.
update:
  manual: true
