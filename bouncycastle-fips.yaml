package:
  name: bouncycastle-fips
  # renovate: datasource=maven depName=org.bouncycastle:bc-fips versioning=maven
  version: "2.1.1"
  epoch: 3
  description: BouncyCastle FIPS APIs
  copyright:
    - license: MIT
  dependencies:
    provides:
      - bouncycastle-fips-${{vars.bcfips-release}}=${{package.full-version}}
    runtime:
      - bouncycastle-mail-fips~${{vars.bcfips-release}}
      - bouncycastle-pg-fips~${{vars.bcfips-release}}
      - bouncycastle-pkix-fips~${{vars.bcfips-release}}
      - bouncycastle-rng-jent
      - bouncycastle-tls-fips~${{vars.bcfips-release}}
      - bouncycastle-util-fips~${{vars.bcfips-release}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.(\d+).*
    replace: ${1}.${2}
    to: bcfips-release

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://repo1.maven.org/maven2/org/bouncycastle/bc-fips/${{package.version}}/bc-fips-${{package.version}}.jar
      expected-sha512: ba541648867983fc8f758d48508943c10d2b5f08a19d1e310c48a9c9a32ec0d5c4a2971e479114233093cffd79d66481f6b9d9d22404f5a8d23963124309fd7b
      extract: false

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/java/bouncycastle-fips
      cp bc-fips-${{package.version}}.jar ${{targets.destdir}}/usr/share/java/bouncycastle-fips/bc-fips.jar

test:
  pipeline:
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 4943
        # Currently CMVP cert says 2.1.0
        software-version: 2.1.0
    - uses: test/cavp-fips-certification-check
      with:
        product: 16824
        name: BC-FJA (Bouncy Castle FIPS Java API)
        # But its CAVP says 2.1.1, it used to be 2.1.0
        software-version: ${{package.version}}
        validation: 36880
        cavp-number: A4270

update:
  manual: true
  exclude-reason: |
    # *** DO NOT INCREMENT THIS VERSION ***
    # It has to be pinned to v2.1.0, as this is the current (latest) FIPS validated version.
    # This can ONLY be incremented when BouncyCastle have re-certified the later version, and
    # issued an updated FIPS certificate. See:
    #   - https://csrc.nist.gov/projects/cryptographic-module-validation-program/Certificate/4943
    #   - https://www.bouncycastle.org/download/bouncy-castle-java-fips/#latest
    # Advisories will have to be filed for any CVEs as a result.
    #
    # We don't build these packages from source due to signing and licensing issues.
    # Therefore, we cannot automatically upgrade them based on GitHub tags/releases
    # and/or release-monitoring.org
    #
    # Before upgrading this package to a newer version, you must verify whether the version was
    # certified. See the above check.
