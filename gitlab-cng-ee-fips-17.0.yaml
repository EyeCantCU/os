package:
  name: gitlab-cng-ee-fips-17.0
  version: 17.0.4
  epoch: 1
  description: Cloud Native container images per component of GitLab
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - openssl-config-fipshardened
    provides:
      - gitlab-cng-ee-fips=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/gitlab-org/build/CNG.git
      tag: v${{package.version}}-ee
      expected-commit: b050aea474a7ba33a0d81f8235a8393fb034618e

subpackages:
  - name: "${{package.name}}-base"
    pipeline:
      - runs: |
          cd ./gitlab-base
          for x in $(find scripts/ -type f); do
            mkdir -p ${{targets.subpkgdir}}/$(dirname $x)
            cp -r $x ${{targets.subpkgdir}}/$x
          done
    dependencies:
      runtime:
        - openssl-config-fipshardened
        - bash
        - busybox
        - ca-certificates-bundle
        - curl
        - gitlab-cng-fips-${{vars.major-minor-version}}-gitlab-logger
        - gomplate-fips
        - procps
        - xtail

update:
  enabled: true
  release-monitor:
    identifier: 373187
