package:
  name: aws-crt-cpp-fips
  version: "0.33.1"
  epoch: 0
  description: "C++ wrapper around the aws-c-* libraries. Provides Cross-Platform Transport Protocols and SSL/TLS implementations for C++ (FIPS)"
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - aws-crt-cpp=${{package.full-version}}
    provider-priority: 20

environment:
  contents:
    packages:
      - aws-c-auth-fips-dev
      - aws-c-cal-fips-dev
      - aws-c-common-dev
      - aws-c-compression-dev
      - aws-c-event-stream-fips-dev
      - aws-c-http-fips-dev
      - aws-c-io-fips-dev
      - aws-c-mqtt-fips-dev
      - aws-c-s3-fips-dev
      - aws-c-sdkutils-dev
      - aws-checksums-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - s2n-tls-fips-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/awslabs/aws-crt-cpp
      tag: v${{package.version}}
      expected-commit: bb5c46b51d7a1192e84d0bb3ad402f02339c2436

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_DEPS=OFF \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-crt-cpp-fips-dev
    description: aws-crt-cpp-fips dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-crt-cpp-fips
        - aws-c-auth-fips-dev
        - aws-c-cal-fips-dev
        - aws-c-common-dev
        - aws-c-compression-dev
        - aws-c-event-stream-fips-dev
        - aws-c-http-fips-dev
        - aws-c-io-fips-dev
        - aws-c-mqtt-fips-dev
        - aws-c-s3-fips-dev
        - aws-c-sdkutils-dev
        - aws-checksums-dev
        - s2n-tls-fips-dev
      provides:
        - aws-crt-cpp-dev=${{package.full-version}}
      provider-priority: 20

update:
  enabled: true
  github:
    identifier: awslabs/aws-crt-cpp
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
