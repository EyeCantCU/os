package:
  name: prometheus-mysqld-exporter
  # When bumping this version you can remove the `go get` line in the build script
  version: "0.18.0"
  epoch: 2 # GHSA-j5w8-q4qc-rx2x
  description: Prometheus Exporter for MySQL server metrics
  copyright:
    - license: Apache-2.0
    - license: LicenseRef-NOTICE
      license-path: NOTICE
  dependencies:
    runtime:
      - merged-bin
      - merged-usrsbin
      - wolfi-baselayout

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/mysqld_exporter
      tag: v${{package.version}}
      expected-commit: 4df239645fa28c4ed811fd697e42f7178d81e999

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: .
      output: mysqld_exporter

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    description: "compat package for iamguarded"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: ${{package.name}}
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /opt/iamguarded/mysqld-exporter/bin/
          chmod g+rwX /opt/iamguarded
          ln -sf /usr/bin/mysqld_exporter /opt/iamguarded/mysqld-exporter/bin/mysqld_exporter
      - uses: iamguarded/finalize-compat
        with:
          package: ${{package.name}}
          version: ${{vars.major-version}}
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: ${{package.name}}
            version: ${{vars.major-version}}
        - runs: |
            run-script --version
            run-script --help
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

update:
  enabled: true
  github:
    identifier: prometheus/mysqld_exporter
    strip-prefix: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        mysqld_exporter --version
        mysqld_exporter --help
