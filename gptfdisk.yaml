# Adapted from https://gitlab.alpinelinux.org/alpine/aports/-/blob/master/main/gptfdisk/APKBUILD
package:
  name: gptfdisk
  version: "1.0.10"
  epoch: 0
  description: Command-line GUID partition table (GPT) manipulator
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - e2fsprogs-dev
      - ncurses-dev
      - popt-dev

pipeline:
  - uses: fetch
    with:
      uri: https://downloads.sourceforge.net/project/gptfdisk/gptfdisk/${{package.version}}/gptfdisk-${{package.version}}.tar.gz
      expected-sha256: 2abed61bc6d2b9ec498973c0440b8b804b7a72d7144069b5a9209b2ad693a282

  - uses: patch
    with:
      patches: fix-wrong-include.patch

  - uses: autoconf/make
    with:
      opts: |
        LDFLAGS="-lncurses -lncursesw" \

  - runs: |
      install -Dm0644 -t ${{targets.destdir}}/usr/share/man/man8 ./*.8
      install -Dm0755 -t ${{targets.destdir}}/usr/bin gdisk cgdisk sgdisk fixparts

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    description: ${{package.name}} dev

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 885

test:
  pipeline:
    - runs: |
        echo "" | gdisk
        echo "" | cgdisk
        sgdisk --help
        echo "" | fixparts
    - uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
