package:
  name: py3.8-build
  version: 1.2.1
  epoch: 1
  description: A simple, correct Python build frontend
  copyright:
    - license: MIT
  options:
    no-provides: true
  dependencies:
    runtime:
      - py3.8-packaging
      - py3.8-tomli
      - py3.8-pyproject-hooks
      - python-3.8

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3.8-flit-core
      - py3.8-gpep517
      - py3.8-installer
      - py3.8-pip
      - py3.8-setuptools
      - python-3.8
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/build
      tag: ${{package.version}}
      expected-commit: 1e67c062e9d1b1a6d5ffed621f4b29902bb764e5

  - runs: |
      python3.8 -m gpep517 build-wheel --wheel-dir dist --output-fd 1
      python3.8 -m installer -d "${{targets.destdir}}" dist/*.whl
      find ${{targets.destdir}} -name "*.pyc" -exec rm -rf '{}' +

  - uses: strip

update:
  enabled: true
  github:
    identifier: pypa/build
    use-tag: true
    strip-suffix: .post1

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.8
        import: build
