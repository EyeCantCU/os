#nolint:valid-pipeline-git-checkout-tag
package:
  name: triton-inference-server-common
  version: "25.11"
  epoch: 0
  description:
  copyright:
    - license: BSD-3-Clause
      license-path: common.git/LICENSE

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/triton-inference-server/common
      branch: r${{package.version}}
      expected-commit: c09e98a47d721fea51913eb3737d37a45d34b431
      destination: common.git

  # git-checkout branch will attempt to reset to the expected-commit
  # if the branch doesn't match. Here we want to fail the build
  # so we can validate and switch to the new commit.
  - name: check if git-checkout had to reset to expected-commit
    working-directory: common.git
    runs: |
      [ "$(git rev-parse origin/r${{package.version}})" = "$(git rev-parse HEAD)" ]

  - runs: |
      mkdir -p "${{targets.contextdir}}/usr/src/triton-inference-server"
      cp -a common.git "${{targets.contextdir}}/usr/src/triton-inference-server"

update:
  enabled: false
  exclude-reason: No support for untagged release branches yet
