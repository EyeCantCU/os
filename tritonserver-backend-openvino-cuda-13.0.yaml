#nolint:valid-pipeline-git-checkout-tag
package:
  name: tritonserver-backend-openvino-cuda-13.0
  version: "25.11"
  epoch: 0
  description: OpenVINO backend for Triton
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - openvino-dev
      - python3
      - rapidjson-dev
      - triton-inference-server-backend=${{package.version}}
      - triton-inference-server-common=${{package.version}}
      - triton-inference-server-core=${{package.version}}

vars:
  # Arbitrary output dir so installing the backend doesn't need to be hardcoded
  output-dir: output

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/triton-inference-server/openvino_backend.git
      branch: r${{package.version}}
      expected-commit: c50915b8bc77304711f6bfcbfd62085f80611619
      recurse-submodules: true

  # The backend _requires_ docker to build because it builds openvino within a dockerfile _inline_ with cmake
  - uses: patch
    with:
      patches: nodocker.patch

  - runs: |
      # We need to do some juggling here so it'll recognize the system wide openvino as the one it would build
      mkdir -p openvino/lib output/openvino/lib
      ln -s /usr/lib/libopenvino.so openvino/lib/openvino.so
      ln -s /usr/include openvino/include

  - uses: cmake/configure
    with:
      opts: |
        -DTRITON_COMMON_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/common.git && git branch --show-current) \
        -DTRITON_CORE_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/core.git && git branch --show-current) \
        -DTRITON_BACKEND_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/backend.git && git branch --show-current) \
        -DCMAKE_INSTALL_PREFIX:PATH=/opt/tritonserver \
        -DTRITON_OPENVINO_INCLUDE_PATHS=/usr/include/openvino \
        -DTRITON_OPENVINO_LIB_PATHS=/usr/lib \
        -DPython_EXECUTABLE=/usr/bin/python3

  - uses: cmake/build
    with:
      output-dir: ${{vars.output-dir}}

  # By default this backend builds tritonserver + stub libraries that conflict with `tritonserver` and other backends
  - runs: |
      DESTDIR=${{vars.output-dir}} cmake --install ${{vars.output-dir}}
      install -Dpm0755 -t ${{targets.destdir}}/opt/tritonserver/backends/openvino/ ${{vars.output-dir}}/opt/tritonserver/backends/openvino/*

update:
  enabled: false
  exclude-reason: "Upstream does not maintain tags or releases, instead, it uses branches as releases"

test:
  environment:
    environment:
      TRITON_HTTP_PORT: 8080
      TRITON_GRPC_PORT: 8081
      MODELS_PATH: /tmp/models
      SAMPLE_MODEL_NAME: samplevino
    contents:
      packages:
        - curl
        - wait-for-it
        - tritonserver-cuda-${{vars.cuda-version}}
  pipeline:
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/opt/tritonserver/lib"
    - uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p "${MODELS_PATH}/${SAMPLE_MODEL_NAME}/1"
          tee ${MODELS_PATH}/${SAMPLE_MODEL_NAME}/config.pbtxt <<EOF
          name: "${SAMPLE_MODEL_NAME}"
          backend: "openvino"
          input: [
            {
              name: "gpu_0/data_0"
              data_type: TYPE_FP32
              dims: [ -1, 3, 224, 224]
            }
          ]
          parameters: [
          {
             key: "NUM_STREAMS"
             value: {
               string_value: "1"
             }
          },
          {
             key: "PERFORMANCE_HINT"
             value: {
               string_value: "LATENCY"
             }
          }
          ]
          default_model_filename: "model.onnx"
          EOF

          curl -fSLo "${MODELS_PATH}/${SAMPLE_MODEL_NAME}/1/model.onnx" "https://github.com/onnx/models/raw/main/validated/vision/classification/resnet/model/resnet50-caffe2-v1-9.onnx"
        start: |
          /opt/tritonserver/bin/tritonserver \
            --model-repository=${MODELS_PATH} \
            --http-port="${TRITON_HTTP_PORT}" \
            --grpc-port="${TRITON_GRPC_PORT}" \
            --http-address="0.0.0.0"
        expected_output: |
          DCGM unable to get device info and count, GPU metrics will not be available
          Collecting CPU metrics
          TRITONBACKEND_ModelInitialize:
          /opt/tritonserver/backends/openvino/libtriton_openvino.so
          (CPU)
          Started HTTPService at 0.0.0.0
        timeout: 60
        post: curl localhost:${TRITON_HTTP_PORT} | grep -F -i -e "error" -e "not found"
