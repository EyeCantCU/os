package:
  name: py3-duplicity
  version: 3.0.7
  epoch: 0
  description: Encrypted backup using rsync algorithm
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    provider-priority: 0

vars:
  pypi-package: duplicity
  import: duplicity

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - gettext-dev
      - librsync-dev
      - py3-supported-build-base-dev
      - py3-supported-pip
      - py3-supported-setuptools

pipeline:
  - uses: git-checkout
    with:
      expected-commit: dd97b414794b458b72f3c8006bff3f13da985922
      repository: https://gitlab.com/duplicity/duplicity.git
      tag: rel.${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    options:
      # Prevent from auto-detecting duplicity commands to avoid conflicts
      # between different python versions (py3.10-duplicity vs py3.11-duplicity, etc.)
      no-provides: true
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - gnupg
        - librsync
        - py${{range.key}}-fasteners
        - py${{range.key}}-pexpect
        - py${{range.key}}-setuptools
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - gpg
      pipeline:
        - uses: test/tw/ldd-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test librsync integration
          runs: |
            python${{range.key}} -c "from duplicity import librsync; print('librsync module loaded successfully')"
        - name: Verify duplicity commands
          runs: |
            set -o pipefail
            duplicity --version | grep -F "duplicity"
            duplicity --help | grep -F "duplicity"
        - name: Test backup and restore operations
          runs: |
            set -o pipefail
            mkdir -p /tmp/source /tmp/backup_for_source /tmp/source/data
            echo "sample file 1" > /tmp/source/data/file1.txt
            echo "sample file 2" > /tmp/source/data/file2.txt

            # Full backup
            duplicity --no-encryption --allow-source-mismatch --copy-links --skip-if-no-change full /tmp/source file:///tmp/backup_for_source
            echo "new data" > /tmp/source/data/file3.txt

            # Dry-run incremental
            duplicity --no-encryption --allow-source-mismatch --copy-links --skip-if-no-change incremental /tmp/source file:///tmp/backup_for_source --dry-run
            duplicity --no-encryption --allow-source-mismatch --copy-links --skip-if-no-change incremental /tmp/source file:///tmp/backup_for_source

            # Collection status
            duplicity collection-status --no-encryption file:///tmp/backup_for_source

            # Restore
            rm -rf /tmp/source
            duplicity restore --allow-source-mismatch --no-encryption --copy-links file:///tmp/backup_for_source /tmp/source
            stat /tmp/source/data/file1.txt
            stat /tmp/source/data/file2.txt
            stat /tmp/source/data/file3.txt
            [ "$(cat /tmp/source/data/file1.txt)" = "sample file 1" ]
            [ "$(cat /tmp/source/data/file2.txt)" = "sample file 2" ]
            [ "$(cat /tmp/source/data/file3.txt)" = "new data" ]

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/tw/byproductpackage

update:
  enabled: true
  git:
    strip-prefix: rel.
    tag-filter-prefix: rel.
