package:
  name: kapp-fips
  version: "0.65.0"
  epoch: 2 # GHSA-r6j8-c6r2-37rr
  description: kapp is a simple deployment tool focused on the concept of "Kubernetes application" — a set of resources with the same label
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 074089993071aeb39bf338126603fa62709dd9b1
      repository: https://github.com/carvel-dev/kapp
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        k8s.io/kubernetes@v1.32.10
      replaces: |-
        k8s.io/controller-manager=k8s.io/controller-manager@v0.32.10

  - uses: go/build
    with:
      go-package: go-fips-md5
      packages: ./cmd/kapp
      output: kapp
      ldflags: -X carvel.dev/kapp/pkg/kapp/version.Version=v${{package.version}}

update:
  enabled: true
  github:
    identifier: carvel-dev/kapp
    strip-prefix: v

test:
  pipeline:
    - name: version check
      runs: kapp version | grep ${{package.version}}
    - uses: test/kwok/cluster
    - uses: test/go-fips-check
    - name: demo application
      runs: |
        cat <<'EOF' > app.yaml
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: nginx-deployment
        spec:
          replicas: 3
          selector:
            matchLabels:
              app: nginx
          template:
            metadata:
              labels:
                app: nginx
            spec:
              containers:
              - name: nginx
                image: cgr.dev/chainguard/nginx:latest
                ports:
                - containerPort: 80
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: nginx-service
        spec:
          type: ClusterIP
          ports:
          - port: 80
            targetPort: 80
          selector:
            app: nginx
        EOF
        kapp --yes deploy --app simple-app --file app.yaml
        kapp list
        kapp inspect --app simple-app --tree
