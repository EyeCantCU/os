# Please note the last release of this package was 2.5 years ago, and seems to be complete and has no CVEs
# this package is needed as runtime dep for celery
package:
  name: py3-click-repl
  version: "0.3.0"
  epoch: 0
  description: REPL plugin for Click
  copyright:
    - license: MIT

vars:
  pypi-package: click-repl
  import: click_repl

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-python-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/click-contrib/click-repl
      tag: ${{package.version}}
      expected-commit: 34f5267f4bedf9bf9aeef6201635429d26b42cbf

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-click
        - py${{range.key}}-prompt-toolkit
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import click_repl

            # Test basic imports and functions
            assert hasattr(click_repl, 'register_repl'), "register_repl function not found"
            assert callable(click_repl.register_repl), "register_repl is not callable"

            # Test repl function
            assert hasattr(click_repl, 'repl'), "repl function not found"
            assert callable(click_repl.repl), "repl is not callable"
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: click-contrib/click-repl
    strip-prefix: v
