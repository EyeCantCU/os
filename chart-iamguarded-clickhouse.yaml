package:
  name: chart-iamguarded-clickhouse
  version: "9.3.10"
  epoch: 0
  description: clickhouse iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: clickhouse/${{package.version}}
      expected-commit: ea52daef3837825321b6851f06dc945f6e5a3f91

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/clickhouse

  - uses: charts/package
    with:
      chart-path: iamguarded/clickhouse

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: clickhouse/
    use-tag: true
    tag-filter-prefix: clickhouse/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /clickhouse
