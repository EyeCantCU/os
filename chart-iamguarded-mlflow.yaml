package:
  name: chart-iamguarded-mlflow
  version: "3.0.7"
  epoch: 1
  description: Mlflow iamguarded chart
  copyright:
    - license: Apache-2.0
environment:
  contents:
    packages:
      - chart-iamguarded-common
      - chart-iamguarded-minio
      - chart-iamguarded-postgresql
pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts
  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: mlflow/${{package.version}}
      expected-commit: 4811de95c73f55338b0211b7ba9707906ff5faca
  - uses: patch
    with:
      patches: iamguarded.patch
  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/mlflow
  - uses: charts/package
    with:
      chart-path: iamguarded/mlflow
test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /mlflow
