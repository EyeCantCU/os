package:
  name: libfabric
  version: "2.3.0"
  epoch: 0
  description: framework focused on exporting high-performance networking services to applications
  copyright:
    - license: GPL-2.0 AND BSD-2-Clause AND MIT
      license-path: COPYING
  dependencies:
    runtime:
      - libfabric-bin

environment:
  contents:
    packages:
      - build-base
      - busybox
      - libtool
      - rdma-core-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ofiwg/libfabric
      tag: v${{package.version}}
      expected-commit: ea52cb54cf0313f165a8015e6b93c9248721a15d

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: libfabric-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libfabric1
    description: libfabric dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: libfabric-doc
    pipeline:
      - uses: split/manpages
    description: libfabric manpages
    test:
      pipeline:
        - uses: test/docs

  - name: libfabric1
    description: framework focused on exporting high-performance networking services to applications
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr"
          mv "${{targets.destdir}}/usr/lib" "${{targets.contextdir}}/usr"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: libfabric-bin
    description: libfabric utilities
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - runs: |
            fi_info --help 2>&1 | grep "Usage:"
            fi_info --version
            fi_mon_sampler 2>&1 | grep "Usage:"
            fi_pingpong --help 2>&1 | grep "Usage:"
            fi_strerror --help 2>&1 | grep "Usage:"
        - runs: |
            fi_pingpong &
            pid="$!"
            for i in $(seq 5); do
              if fi_pingpong localhost; then
                exit 0 # server will exit
              fi
              sleep 1
            done
            kill "$pid" || true
            exit 1

update:
  enabled: true
  github:
    identifier: ofiwg/libfabric
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
