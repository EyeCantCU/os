package:
  name: stampdalf
  version: 0.0.3
  epoch: 0
  description: "small helper to run commands in a reproducible way"
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/89luca89/stampdalf
      tag: v${{package.version}}
      expected-commit: c7995fc33fd727ca646e8355dee8353fca06e16e

  - uses: go/build
    with:
      packages: .
      output: stampdalf

update:
  enabled: true
  github:
    identifier: 89luca89/stampdalf
    strip-prefix: v
