version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    exclude-paths:
      - "scanner-test-npm-vulnerability-unfixed"
      - "scanner-test-npm-vulnerability-fixed"
      - "scanner-test-golang-vulnerability-unfixed"
      - "scanner-test-golang-vulnerability-fixed"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      actions:
        update-types:
          - "minor"
          - "patch"
