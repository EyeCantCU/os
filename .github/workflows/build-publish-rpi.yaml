name: "Build Raspberry Pi Images and Upload to GCS and Vercel"

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      notify-slack:
        type: boolean
        required: false
        default: false
        description: Notify slack when the workflow finishes.
      notify-slack-success:
        type: boolean
        required: false
        default: true
        description: Send notifications on success as well as failure.

permissions: {}

# Allow only one workflow run at a time
concurrency:
  group: 'rpi-build-gcs'
  cancel-in-progress: false

jobs:
  init:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-latest
    outputs:
      BUILD_TIMESTAMP: ${{ steps.timestamp.outputs.BUILD_TIMESTAMP }}
    steps:
      - id: timestamp
        run: |
          echo BUILD_TIMESTAMP=$(date --utc "+%Y%m%d-%H%M%S") >> "$GITHUB_OUTPUT"

  rpi-build-upload:
    runs-on: ubuntu-8-core
    needs:
      - init

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    env:
      BUILD_TIMESTAMP: ${{ needs.init.outputs.BUILD_TIMESTAMP }}
      VM_CLOUD: "rpi"

    steps:
      - uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@3e8a2a226fad9e1ecbf2d359b8a7697554a4ac6d # v1.5.10

      - name: Checkout source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build vms disks
        uses: './.github/actions/build-disks'
        with:
          cg_identity: "ce2d1984a010471142503340d670612d63ffb9f6/381a2db906b88c20"
          vm_group: "rpi"
          arch: 'aarch64'

      # Publish to the registry
      - name: Publish RPI images to the registry
        continue-on-error: true
        run: |
          arch="${{ env.VM_ARCH }}"
          make -j$(nproc) --output-sync=recurse publish-registry-rpi ARCH=aarch64

      # Get the secret for our rpi upload token
      # This is provisioned here: https://github.com/chainguard-dev/secrets/blob/main/wolfi-vm.tf
      - name: "Set identity for github secrets"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: step-security/google-github-auth@f0e5c257a9534a30b5df12f43329c1eb7b85a5be # v3.0.0
        with:
          workload_identity_provider: "projects/12758742386/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "wolfi-vm@chainguard-github-secrets.iam.gserviceaccount.com"

      - name: "Set github secrets project"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: "chainguard-github-secrets"

      - name: "Get RPI upload secret"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        id: rpi-secret
        with:
          secrets: |-
            token:chainguard-github-secrets/wolfi-vm-rpi-upload-secret

      # Reset gcloud for GCS publishing now that we have our secret
      - name: "Set identity for GCS Publishing"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: step-security/google-github-auth@f0e5c257a9534a30b5df12f43329c1eb7b85a5be # v3.0.0
        with:
          workload_identity_provider: 'projects/212178706475/locations/global/workloadIdentityPools/ci-pool/providers/ci-provider'
          service_account: 'github-ci@wolfi-vm.iam.gserviceaccount.com'

      - name: "Set GCP project to wolfi-vm"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: wolfi-vm

      - name: "Configure gcloud parallel uploads"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          gcloud config set storage/parallel_composite_upload_enabled True

      - name: "Publish rpi images to GCS and Vercel"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          make -j$(nproc) --output-sync=recurse publish-rpi PREFIX=chainguard PUBLISH_TARGET=staging ARCH=aarch64 RPI_UPLOAD_SECRET=${{ steps.rpi-secret.outputs.token }}

      - uses: './.github/actions/notify-slack'
        if: ${{ (inputs.notify-slack-success || !success()) && (github.event_name == 'schedule' || inputs.notify-slack) }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_INPUT }}
          title: ${{ github.workflow }} ${{ job.status }}
          message-color: ${{ job.status == 'success' && '#3fb950' || '#f85149'}}
          text: |
            For detailed logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Or run ./hack/fetch-test-result -c ${{ env.VM_CLOUD }} -r ${{ github.run_id }} -a ${{matrix.arch}}
          unfurl-links: true
