name: "Pre-submit check"

on:
  pull_request_target:
    branches:
      - "main"

permissions: {}

jobs:
  build:

    permissions:
      contents: read # read the repo
      id-token: write # to get a token for the chainguard identity

    strategy:
      matrix:
        arch:
          - x86_64
          - aarch64
        cloud:
          - aws
          - azure
          - gcp
          - qemu

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      # use public chainguard provider.
      - uses: chainguard-dev/setup-chainctl@2302a56a61228140753b428d1018cb0d0addbec6 # v0.3.0
        with:
            identity: "ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849"

      - name: Get apk.cgr.dev token
        run: |
          chainctl auth login --identity "ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849" --audience apk.cgr.dev
          cred=$(chainctl auth token --audience apk.cgr.dev)
          echo "HTTP_AUTH=basic:apk.cgr.dev:user:$cred" >> $GITHUB_ENV

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: stable

      - name: Install deps
        run: |
          make install-deps

      - name: make clean
        run: |
          make clean

      - name: make apkoaas
        run: |
          make apkoaas

      - name: make builder
        run: |
          make builder

      - name: make disks
        run: |
          make ARCH=${{ matrix.arch }} disks-${{ matrix.cloud }}
