name: "Pre-submit check"

on:
  pull_request_target:
    branches: [ "main" ]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      issues: write
      id-token: write
      actions: read
    strategy:
      matrix:
        arch: [ x86_64, aarch64 ]
        cloud: [ aws, azure, gcp, qemu ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

# FIXME: Update this token once it is set up and uncomment
#      # use public chainguard provider.
#      - uses: chainguard-dev/setup-chainctl@2302a56a61228140753b428d1018cb0d0addbec6 # v0.3.0
#        with:
#            identity: "ce2d1984a010471142503340d670612d63ffb9f6/XXXXXXXXXXXXXXXX"
#
#      - name: Get apk.cgr.dev token
#        run: |
#          chainctl auth login --identity "ce2d1984a010471142503340d670612d63ffb9f6/XXXXXXXXXXXXXXXX" --audience apk.cgr.dev
#          cred=$(chainctl auth token --audience apk.cgr.dev)
#          echo "HTTP_AUTH=basic:apk.cgr.dev:user:$cred" >> $GITHUB_ENV

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: stable

      - name: Install deps
        run: |
          # install deps
          sudo apt-get --quiet --assume-yes \
            --option=Dpkg::Options::=--force-confold \
            --option=Dpkg::options::=--force-unsafe-io \
            install \
            qemu-system-x86

      - name: make clean
        run: |
          make clean

      - name: make apkoaas
        run: |
          make apkoaas

