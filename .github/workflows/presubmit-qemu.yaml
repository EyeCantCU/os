name: "QEMU Pre-submit check"

on:
  pull_request_target:
    branches:
      - "main"

permissions: {}

jobs:
  qemu-check:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@b84fe5f9e5f9144c970b29aaf83ea851a6768e25 # v1.2.0

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: './.github/actions/build-disks'
        with:
          cg_identity: "ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849"
          cloud_provider: "qemu"
          arch: '${{ matrix.arch }}'

      - name: make firmware
        run: |
          make "builder/ovmf-${{ matrix.arch }}.fd"

      - uses: './.github/actions/vms-test'
        with:
          cloud_provider: "qemu"
          arch: '${{ matrix.arch }}'
