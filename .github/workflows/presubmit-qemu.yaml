name: "QEMU Pre-submit check"

on:
  pull_request_target:
    branches:
      - "main"

permissions: {}

jobs:
  qemu-check:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@94249a4828defae94ef3eaeaafaff2f95f1b446f # v1.5.6

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: './.github/actions/build-disks'
        with:
          cg_identity: "ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849"
          vm_group: "qemu"
          arch: '${{ matrix.arch }}'

      - name: make firmware
        run: |
          make "builder/ovmf-${{ matrix.arch }}.fd"

      - name: "Skip -rc images in testing"
        run: |
          names=$(make list-qemu-nonrc | tr "\n" " ")
          [ -n "$names" ] || { echo "make list-qemu-nonrc produced empty output"; exit 1; }
          echo "QEMU_VMS=$names" >> "$GITHUB_ENV"

      - uses: './.github/actions/vms-test'
        with:
          cloud_provider: "qemu"
          vm_group: "qemu"
          arch: '${{ matrix.arch }}'

      - name: "Test generic-rc, ignoring result"
        run: |
          rm -rf ./test-results # Drop existing test results
          make ARCH='${{ matrix.arch }}' test-generic-rc || echo "::warning title=test-generic-rc-failure::make test-generic-rc failed vms-test. See logs for results."

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.arch }}-generic-rc
          path: ./test-results/
        if: ${{ !cancelled() }}
