name: "QEMU Pre-submit check"

on:
  pull_request_target:
    branches:
      - "main"

permissions: {}

jobs:
  qemu-check:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@b479012116eacde7f895586c17b598f7ba0ee700 # v1.5.9

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: './.github/actions/build-disks'
        with:
          cg_identity: "ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849"
          vm_group: "qemu"
          arch: '${{ matrix.arch }}'

      - name: make firmware
        run: |
          make "builder/ovmf-${{ matrix.arch }}.fd"

      - name: "Skip -rc images in testing"
        run: |
          names=$(make list-qemu-nonrc | tr "\n" " ")
          [ -n "$names" ] || { echo "make list-qemu-nonrc produced empty output"; exit 1; }
          echo "QEMU_VMS=$names" >> "$GITHUB_ENV"

      - uses: './.github/actions/vms-test'
        with:
          cloud_provider: "qemu"
          vm_group: "qemu"
          arch: '${{ matrix.arch }}'

      - name: "Test qemu-base-rc-slim, ignoring result"
        run: |
          rm -rf ./test-results # Drop existing test results
          make ARCH='${{ matrix.arch }}' test-qemu-base-rc-slim || echo "::warning title=test-qemu-rc-failure::make test-qemu-base-rc-slim failed vms-test. See logs for results."

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: test-results-${{ matrix.arch }}-qemu-base-rc-slim
          path: ./test-results/
        if: ${{ !cancelled() }}
