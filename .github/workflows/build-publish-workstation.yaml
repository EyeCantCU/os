name: "Build and push GCP Workstation images"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

# Allow only one workflow run at a time
concurrency:
  group: 'release-workstation'
  cancel-in-progress: false

jobs:
  init:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core
    outputs:
      BUILD_TIMESTAMP: ${{ steps.timestamp.outputs.BUILD_TIMESTAMP }}
    steps:
      - id: timestamp
        run: |
          echo BUILD_TIMESTAMP=$(date --utc "+%Y%m%d-%H%M") >> "$GITHUB_OUTPUT"

  workstation-build-push:
    runs-on: ubuntu-8-core
    needs:
      - init

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    env:
      BUILD_TIMESTAMP: ${{ needs.init.outputs.BUILD_TIMESTAMP }}
      VM_ARCH: ${{ matrix.arch }}
      VM_CLOUD: "workstation"

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@430f14e303ffa7ef62e72f0d1758b9166cb1799a # v1.0.5

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build vms disks
        uses: './.github/actions/build-disks'
        with:
          cg_identity: "ce2d1984a010471142503340d670612d63ffb9f6/381a2db906b88c20"
          cloud_provider: "workstation"
          arch: '${{ matrix.arch }}'

      - name: Scan disks
        uses: './.github/actions/scan-disks'
        with:
          cloud_provider: "workstation"
          arch: '${{ matrix.arch }}'

      - name: add HOME/bin to PATH
        run: |
          # ensure HOME/bin is in PATH
          d="$HOME/bin"
          mkdir -p "$d"
          p="$PATH"
          echo "original-path: $p"
          p="$d:$PATH"
          echo "new-path: $p"
          echo "PATH=$p" >> "$GITHUB_ENV"

      - name: "Install GCP Deps"
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4
        with:
          project_id: wolfi-vm

      - name: "Setup GCP Creds"
        id: 'auth'
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          # No configuration for now as we dont need
          workload_identity_provider: 'projects/212178706475/locations/global/workloadIdentityPools/ci-pool/providers/ci-provider'
          service_account: 'github-ci@wolfi-vm.iam.gserviceaccount.com'

      - name: "Configure gcloud"
        run: |
          gcloud config set storage/parallel_composite_upload_enabled True

      - name: "Publish GCP Images"
        run: |
          arch="${{ env.VM_ARCH }}"
          names=$(make list-workstation)
          [ -n "$names" ] || { echo "make list-workstation produced empty output"; exit 1; }

          [ "$arch" = "x86_64" ] && garch=amd64 || garch=arm64

          echo "publishing $names to wolfi-vm. arch=$arch garch=$garch timestamp=${BUILD_TIMESTAMP}"
          for name in $names; do
              ./tools/google-image-upload --family="chainguard-${name#workstation-}-$garch" \
                --name="chainguard-${name#workstation-}-$garch-${BUILD_TIMESTAMP}" \
                --arch="$garch" \
                output/$arch/$name/disk.raw wolfi-vm-images-workloads
          done
