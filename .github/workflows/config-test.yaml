name: Config Tests

on:
  # This workflow is intentionally very small, so that it is
  # as obviously correct as possible.  Add complexity to it
  # at your peril!
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  config-valid-test:
    runs-on: ubuntu-8-core

    permissions:
      contents: read

    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@94249a4828defae94ef3eaeaafaff2f95f1b446f # v1.5.6

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: './go.mod'

      # Add a block like this in a separate PR *before* landing tests in a new module.
      - name: Install apko
        run: |
          GOBIN=/usr/local/bin go install chainguard.dev/apko@latest

      - name: Check apko configs
        shell: bash
        run: |
          for i in configs/*/build.yaml; do
            echo "Validating $i ..."
            /usr/local/bin/apko show-config $i 2>/tmp/out
            if [ "$?" -ne 0 ]; then
              echo "Error validating $i"
              cat /tmp/out
              break
            fi
          done
