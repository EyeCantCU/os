name: Config Tests

on:
  # This workflow is intentionally very small, so that it is
  # as obviously correct as possible.  Add complexity to it
  # at your peril!
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  config-valid-test:
    runs-on: ubuntu-8-core

    permissions:
      contents: read

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v3.0.0
        with:
          go-version: '1.24'
          check-latest: true
          cache: false

      # Add a block like this in a separate PR *before* landing tests in a new module.
      - name: Install apko
        run: |
          GOBIN=/usr/local/bin go install chainguard.dev/apko@latest

      - name: Check apko configs
        shell: bash
        run: |
          for i in configs/*.yaml; do
            echo "Validating $i ..."
            /usr/local/bin/apko show-config $i 2>/tmp/out
            if [ "$?" -ne 0 ]; then
              echo "Error validating $i"
              cat /tmp/out
              break
            fi
          done
