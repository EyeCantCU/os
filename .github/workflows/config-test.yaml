name: Config Tests

on:
  # This workflow is intentionally very small, so that it is
  # as obviously correct as possible.  Add complexity to it
  # at your peril!
  pull_request_target:
    branches: [ "main" ]

jobs:
  go-auth-test:
    runs-on: ubuntu-8-core

    permissions:
      contents: read
      id-token: write # To support federating to assume chainguard identity

    steps:
      - uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v3.0.0
        with:
          check-latest: true

      # Add a block like this in a separate PR *before* landing tests in a new module.
      - name: Install apko
        run: |
          GOBIN=/usr/local/bin go install chainguard.dev/apko@latest

      - name: Check apko configs
        run: |
          for i in configs/*.yaml; do
            echo "Validating $i ..."
            /usr/local/bin/apko show-config $i 2>/tmp/out
            if [ "$?" -ne 0 ]; then
              echo "Error validating $i"
              cat /tmp/out
              break
            fi
          done
