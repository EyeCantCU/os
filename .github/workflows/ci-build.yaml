name: Enterprise - build

on:
  push:
    branches:
      - gh-readonly-queue/main/**
  pull_request:
    branches:
      - main

jobs:
  changes:
    permissions:
      contents: read

    name: Determine packages to test building
    runs-on: ubuntu-latest
    outputs:
      packages: ${{steps.package-list.outputs.packages}}

    steps:
      - name: Free up runner disk space
        run: |
          set -x
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
      - uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Look for changed files
        id: changes
        uses: tj-actions/changed-files@c3a1bb2c992d77180ae65be6ae6c166cf40f857c #tj-actions/changed-files@v45.0.3
        with:
          files_yaml: |
            melange:
              - ./*.yaml # Only top level files without structure
              - ./*/*/*.melange.yaml # Support recursive melange files with the new naming convention.

      # this need to point to main to always get the latest
      - uses: wolfi-dev/actions/install-wolfictl@main # main

      # Assuming that we have a list of changed files such as `foo.yaml` and `bar.yaml`, this
      # strips the list down into `foo` and `bar`.
      - name: Build package list
        id: package-list
        run: |
          wolfictl text -t name --pipeline-dir=./pipelines/ \
              -r https://packages.wolfi.dev/os \
              -k https://packages.wolfi.dev/os/wolfi-signing.rsa.pub \
              -r https://packages.cgr.dev/extras \
              -k https://packages.cgr.dev/extras/chainguard-extras.rsa.pub \
              -r https://packages.wolfi.dev/bootstrap/stage3 \
              -k https://packages.wolfi.dev/bootstrap/stage3/wolfi-signing.rsa.pub \
              > all-packages-list

          set +f # disable pathname expansion
          echo "all-packages-list has $(wc -l < all-packages-list)"
          n=0
          for f in ${{ steps.changes.outputs.melange_all_changed_files }}; do
              # filter anything not .yaml
              case "$f" in
                  */pipelines/*) continue;;
                  *.yaml) :;;
                  *) continue;;
              esac
              pkg=${f##*/}
              pkg=${pkg%.yaml}
              pkg=${pkg%.melange.yaml}
              n=$((n+1))
              echo "$pkg"
          done > changed-packages-list
          echo "changed-packages-list has $n"
          rc=0
          grep --fixed-strings --line-regexp \
              --file=changed-packages-list all-packages-list \
              > packages-to-build || rc=$?
          tobuild=$(wc -l < packages-to-build)
          if [ $rc -eq 0 ]; then
              echo "build these $tobuild packages in order"
              sed 's/^/> /' packages-to-build
              set -- $(cat packages-to-build)
          elif [ $rc -eq 1 ]; then
              echo "packages-to-build is empty - did not find any changed packages"
              set --
          else
              echo "ERROR: unexpected error $rc from grep"
              exit 1
          fi
          printf "packages=%s\n" "$*" > "$GITHUB_OUTPUT"

  build:
    name: Test building of packages
    runs-on:
      group: cgi-builder-${{ matrix.arch }}
    timeout-minutes: 600 # default is 360

    strategy:
      matrix:
        arch: ["x86_64", "aarch64"]
      fail-fast: false
    needs: changes

    container:
      image: ghcr.io/wolfi-dev/sdk:latest@sha256:186b105938420fa0056a123876b9d1230bb934c88a32be900a59d242fe26459b
      # TODO: Deprivilege
      options: |
        --cap-add NET_ADMIN --cap-add SYS_ADMIN --device /dev/fuse --security-opt seccomp=unconfined --security-opt apparmor:unconfined
      volumes:
        # GHA assumes we mount /var/run/docker.sock for dind, which means we're
        # working with host bind mounts, so we need a volume on the host that
        # we can leverage for other bind mounts created by melange commands
        # using the docker runner.
        #
        # This is named `temp` on purpose so we don't interfere with the host's
        # /tmp or the inner containers /tmp.
        - "/temp:/temp"

    permissions:
      packages: read
      contents: read
      pull-requests: read
      id-token: write # Needed to federate with Google

    env:
      PROJECT: prod-images-c6e5
      FQ_SERVICE_ACCOUNT: prod-images-ci@prod-images-c6e5.iam.gserviceaccount.com

    outputs:
      packages_were_built: ${{ steps.file_check.outputs.exists }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: "Trust the github workspace"
        run: |
          # This is to avoid fatal errors about "dubious ownership" because we are
          # running inside of a container action with the workspace mounted in.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate snapshot date
        id: snapshot-date
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: google-github-actions/auth@8254fb75a33b976a221574d287e93919e6a36f70 # v2.1.6
        with:
          workload_identity_provider: "projects/618116202522/locations/global/workloadIdentityPools/prod-shared-e350/providers/prod-shared-gha"
          service_account: ${{ env.FQ_SERVICE_ACCOUNT }}

      - uses: chainguard-dev/setup-chainctl@598499528905f95b94e62e4831cf42035e768933 # v0.2.3
        with:
          identity: ce2d1984a010471142503340d670612d63ffb9f6/8eac5b220e2f4a38
      - run: |
          set -euxo pipefail
          chainctl auth login --identity ce2d1984a010471142503340d670612d63ffb9f6/8eac5b220e2f4a38 --audience apk.cgr.dev
          echo "HTTP_AUTH=basic:apk.cgr.dev:user:$(chainctl auth token --audience apk.cgr.dev)" >> $GITHUB_ENV

      - name: "Generate local signing key"
        run: |
          make MELANGE="melange" local-melange-enterprise.rsa

          # Touch it with the epoch date to convince `make` that we don't need to
          # rebuild the targets that depend on this (all)
          touch -d @0 local-melange-enterprise.rsa

      - name: "Build Enterprise Packages"
        run: |
          # Setup the melange cache dir on the host so we can use that in subsequent builds
          mkdir ../.melangecache
          for package in ${{needs.changes.outputs.packages}}; do
            make MELANGE_EXTRA_OPTS="--create-build-log --cache-dir=$(pwd)/../.melangecache" REPO="$GITHUB_WORKSPACE/packages" package/$package -j1
            TMPDIR="/temp" make REPO="$GITHUB_WORKSPACE/packages" MELANGE_EXTRA_OPTS="--runner docker" test/$package -j1
          done

      - name: Check for file
        id: file_check
        run: |
          if test -f "packages.log"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Identify newly built packages
        id: list_built_packages
        if: ${{ steps.file_check.outputs.exists == 'true'}}
        run: |
          {
            echo 'files_to_upload<<EOF'

            awk -F'|' '{ printf "./packages/%s/%s-%s.apk\n", $1, $3, $4}' < packages.log

            echo EOF
          } >> "$GITHUB_OUTPUT"

      # Re-authenticate for `apk add` in case building everything took more than an hour.
      - uses: chainguard-dev/setup-chainctl@598499528905f95b94e62e4831cf42035e768933 # v0.2.3
        with:
          identity: ce2d1984a010471142503340d670612d63ffb9f6/8eac5b220e2f4a38
      - run: |
          set -euxo pipefail
          chainctl auth login --identity ce2d1984a010471142503340d670612d63ffb9f6/8eac5b220e2f4a38 --audience apk.cgr.dev
          echo "HTTP_AUTH=basic:apk.cgr.dev:user:$(chainctl auth token --audience apk.cgr.dev)" >> $GITHUB_ENV

      - name: "Check that packages can be installed with apk add"
        run: |
          # Create a fake linux fs under /tmp/emptyroot to pass to `apk --root`.
          mkdir -p /tmp/emptyroot/etc/apk
          cp -r /etc/apk/* /tmp/emptyroot/etc/apk/
          cat /dev/null > /tmp/emptyroot/etc/apk/world

          # Add the extra-packages repo
          mkdir -p /tmp/emptyroot/etc/apk/keys/
          curl -sL https://packages.cgr.dev/extras/chainguard-extras.rsa.pub > /tmp/emptyroot/etc/apk/keys/chainguard-extras.rsa.pub
          echo "https://packages.cgr.dev/extras" >> /tmp/emptyroot/etc/apk/repositories

          cat /tmp/emptyroot/etc/apk/repositories
          ls -lh /tmp/emptyroot/etc/apk/keys

          # Add private repo and key
          echo "https://apk.cgr.dev/chainguard-private" >> /tmp/emptyroot/etc/apk/repositories
          curl --fail \
              --user "user:$(chainctl auth token --audience apk.cgr.dev)" \
              -o /tmp/emptyroot/etc/apk/keys/chainguard-7fb528a64a862d44bbea6069093f1fec29fa864ba7e9754828eeceed3f487239.rsa.pub \
              https://apk.cgr.dev/chainguard-private/chainguard-7fb528a64a862d44bbea6069093f1fec29fa864ba7e9754828eeceed3f487239.rsa.pub

          cat /tmp/emptyroot/etc/apk/repositories
          ls -lh /tmp/emptyroot/etc/apk/keys

          mkdir -p /tmp/emptyroot/lib/apk/db
          touch /tmp/emptyroot/lib/apk/db/{installed,lock,scripts.tar,triggers}

          mkdir -p /tmp/emptyroot/var/cache/apk
          apk update --root /tmp/emptyroot

          # Find .apk files and add them to the string
          for f in $(echo "${{ steps.list_built_packages.outputs.files_to_upload }}"); do
              tar -Oxf $f .PKGINFO
              apk add --root /tmp/emptyroot --repository ./packages --allow-untrusted --simulate $f
          done

      - name: Check diff
        if: ${{ steps.file_check.outputs.exists == 'true'}}
        # Let's not fail the whole job if this step fails as it is for improved UX rather than an enforced check
        continue-on-error: true
        run: |
          wolfictl check diff

      - name: "Upload built packages to GitHub artifacts"
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          path: |
            ${{ steps.list_built_packages.outputs.files_to_upload }}
            ./packages.log
          name: packages-${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: warn

  so_check:
    permissions:
      contents: read

    name: "ABI Compatibility check"
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.packages_were_built == 'true'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: "Retrieve x86_64 packages"
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: packages-x86_64
          path: /tmp/artifacts-1/
        continue-on-error: true

      - name: "Retrieve aarch64 packages"
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: packages-aarch64
          path: /tmp/artifacts-2/
        continue-on-error: true

      - name: "Check if artifacts were downloaded"
        run: |
          x86_exists=false
          aarch64_exists=false

          if [ -d "/tmp/artifacts-1/" ]; then
            x86_exists=true
          fi

          if [ -d "/tmp/artifacts-2/" ]; then
            aarch64_exists=true
          fi

          if [ "$x86_exists" = false ] && [ "$aarch64_exists" = false ]; then
            echo "Both artifacts are missing. Failing the build."
            exit 1
          fi

      - name: "Collect packages from all architectures into one place"
        run: |
          cd /tmp/artifacts-1

          # Put the packages into one place (if aarch64 logs exist)
          if test -f "/tmp/artifacts-2/packages"; then
            mv /tmp/artifacts-2/packages/* ./packages/
            # Merge the build log ("packages.log") files
            cat /tmp/artifacts-2/packages.log >> ./packages.log
          fi

      # this need to point to main to always get the latest action
      - uses: wolfi-dev/actions/install-wolfictl@main # main

      - name: Soname check
        run: |
          wolfictl check so-name --packages-dir /tmp/artifacts-1/packages --package-list-file /tmp/artifacts-1/packages.log

  scan:
    name: "Scan packages for CVEs"
    runs-on: ubuntu-latest

    needs: build
    if: needs.build.outputs.packages_were_built == 'true'

    permissions:
      contents: read # Needed to clone the repository
      id-token: write # Needed to federate with octo-sts

    steps:
      - uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - name: "Retrieve x86_64 packages"
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: packages-x86_64
          path: /tmp/artifacts-1/
        continue-on-error: true

      - name: "Retrieve aarch64 packages"
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: packages-aarch64
          path: /tmp/artifacts-2/
        continue-on-error: true

      - name: "Check if artifacts were downloaded"
        run: |
          x86_exists=false
          aarch64_exists=false

          if [ -d "/tmp/artifacts-1/" ]; then
            x86_exists=true
          fi

          if [ -d "/tmp/artifacts-2/" ]; then
            aarch64_exists=true
          fi

          if [ "$x86_exists" = false ] && [ "$aarch64_exists" = false ]; then
            echo "Both artifacts are missing. Failing the build."
            exit 1
          fi

      - name: "Collect packages from all architectures into one place"
        run: |
          cd /tmp/artifacts-1

          # Put the packages into one place (if aarch64 logs exist)
          if test -f "/tmp/artifacts-2/packages"; then
            mv /tmp/artifacts-2/packages/* ./packages/
            # Merge the build log ("packages.log") files
            cat /tmp/artifacts-2/packages.log >> ./packages.log
          fi

      - uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
        id: octo-sts
        with:
          scope: chainguard-dev
          identity: enterprise-presubmit-build

      - name: "Retrieve enterprise advisory data"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "chainguard-dev/enterprise-advisories"
          path: "data/enterprise-advisories"
          ref: "main"
          token: ${{ steps.octo-sts.outputs.token }}

      # this need to point to main to always get the latest action
      - uses: wolfi-dev/actions/install-wolfictl@main # main

      - name: Scan for CVEs
        run: |
          wolfictl scan \
            --build-log \
            --advisories-repo-dir 'data/enterprise-advisories' \
            --advisory-filter 'resolved' \
            --require-zero \
            /tmp/artifacts-1 \
            2> /dev/null # The error message renders strangely on GitHub Actions, and the important information is already being sent to stdout.
