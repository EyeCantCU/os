name: "Reproducible builds Pre-submit check"

on:
  pull_request_target:
    branches:
      - "main"

permissions: {}

jobs:
  reproducible-check:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: step-security/harden-runner@002fdce3c6a235733a90a27c80493a3241e56863 # v2.12.1
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@4f7ad4fd63a4e1c8c11fdb16d543a3eb651036ca # v1.4.2

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: chainguard-dev/setup-chainctl@2302a56a61228140753b428d1018cb0d0addbec6 # v0.3.0
        with:
          identity: ${{ inputs.cg_identity }}

      - name: Get apk.cgr.dev token
        shell: bash
        run: |
          chainctl auth login --headless --identity=${CG_IDENTITY} --audience=apk.cgr.dev
          cred=$(chainctl auth token --audience=apk.cgr.dev)
          echo "HTTP_AUTH=basic:apk.cgr.dev:user:$cred" >> $GITHUB_ENV
        env:
          CG_IDENTITY: ${{ inputs.cg_identity }}

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: stable
          check-latest: true

      - name: Install deps
        shell: bash
        run: |
          make install-deps

      - name: make clean
        shell: bash
        run: |
          make clean

      - name: make apkoaas
        shell: bash
        run: |
          make apkoaas

      - name: make builder
        shell: bash
        run: |
          make builder

      - name: make disk 1/2
        shell: bash
        run: |
          mkdir run1
          cd run1 && ../apkoaas build --builder-cpio ../builder/initrd-x86_64 --kernel ../builder/kernel-x86_64 ../configs/test/reproducible/build.yaml
          cd ..

      - name: save old output
        shell: bash
        run: |
          mv output output-old

      - name: make disk 2/2
        shell: bash
        run: |
          mkdir run2
          cd run2 && ../apkoaas build --builder-cpio ../builder/initrd-x86_64 --kernel ../builder/kernel-x86_64 ../configs/test/reproducible/build.yaml
          cd ..

      - name: compare artifacts
        shell: bash
        run: |
          cmp run*/apko-x86_64.tar.gz || exit 1
          cmp run*/disk.raw || exit 1
