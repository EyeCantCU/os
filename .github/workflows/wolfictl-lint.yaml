name: Extra - lint

on:
  push:
    branches:
      - gh-readonly-queue/main/**
  pull_request:
    branches:
      - 'main'
    paths:
      - "*.yaml"
      - "Makefile"

jobs:
  lint:
    name: Wolfictl Lint
    runs-on: ubuntu-latest

    if: github.repository == 'chainguard-dev/extra-packages'

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608 # v4.1.0

      - uses: wolfi-dev/actions/wolfictl-lint@main
