name: "Azure Pre-submit check"

on:
  pull_request_target:
    branches:
      - "main"

permissions: {}

jobs:
  azure-check:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@708219d4822f33611ac1a2653815cc10e1ab54a6 # v1.4.7

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: './.github/actions/build-disks'
        with:
          cg_identity: "ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849"
          vm_group: "azure"
          arch: '${{ matrix.arch }}'
