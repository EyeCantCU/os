name: "Test Harness Pre-submit checks"

on:
  pull_request_target:
    branches:
      - "main"
  push:

permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read # read repo

    strategy:
      fail-fast: true
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: './go.mod'

      - name: Install deps
        working-directory: ./vms-test
        run: |
          ./helpers/install-deps --test-arch="$arch"

      - name: shellcheck
        run: |
          make shellcheck

      - name: lint
        working-directory: ./vms-test
        run: |
          make gofmt

      - name: make runners
        working-directory: ./vms-test
        run: |
          make runners

      - name: make tests
        working-directory: ./vms-test
        run: |
          make tests

      - name: make unit-test
        working-directory: ./vms-test
        run: |
          make unit-test
