name: Test AWS EKS Node

on:
  workflow_dispatch:
    inputs:
      ami:
        type: string
        required: true
        description: AWS AMI to use for the VM

      region:
        type: string
        description: the aws region to use
        default: us-west-1

      cluster-name:
        type: string
        description: Name of the k8s cluster to create.
        default: test-vm-k8s-cluster

permissions: {}

jobs:
  test-k8s-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Setup AWS Creds"
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          # AWS account chainguard-vms
          role-to-assume: arn:aws:iam::235494789672:role/wolfi-vms-github-postsubmit-role
          aws-region: ${{ github.event.inputs.region }}

      - name: Install deps
        run: |
          sudo apt-get install petname
          petname

        # TODO: (cpanato) move this to a reusable action
      - name: "Install eksctl"
        run: |
          # install eksctl
          m=$(uname -m)
          case "$m" in
            x86_64) arch=amd64;;
            aarch64) arch=arm64;;
            *) echo "FATAL: unknown output for 'uname -m' : '$m'";;
          esac
          uname_s=$(uname -s)
          platform="${uname_s}_${arch}"
          fname="eksctl_${platform}.tar.gz"
          url="https://github.com/eksctl-io/eksctl/releases/latest/download"
          echo "download eksctl for ${uname_s}/$arch platform from $url/$fname"
          curl -sL "$url/$fname" > "$fname" ||
             { echo "FATAL: download failed $url"; exit 1; }
          mkdir -p /usr/local/bin

          echo "extract to /usr/local/bin"
          tar -C /usr/local/bin -xvf "$fname"
          rm "$fname"

          echo '$ eksctl info'
          eksctl info

      - name: Validate ami-id and region
        env:
          AMI: ${{ github.event.inputs.ami }}
          AWS_REGION: ${{ github.event.inputs.region }}
        run: |
          out=$(aws --region="$AWS_REGION" ec2 describe-images --output=json --image-id="$AMI") ||
             {
               echo "Checking for ami '$AMI' in region '$AWS_REGION' failed $?";
               exit 1;
             }
          name=$(echo "$out" | jq -r .Images[0].Name) ||
             { echo "parsing output of describe-images with jq failed"; exit 1; }
          case "$name" in
             *-eks-*) echo "Using ami $AMI in region $AWS_REGION. name=$name";;
             *) echo "Refusing to use $AMI in region $AWS_REGION due to name=$name";;
          esac

      - name: Test EKS cluster
        env:
          # test-eks reads AWS_REGION
          AWS_REGION: ${{ github.event.inputs.region }}
          AMI: ${{ github.event.inputs.ami }}
          CLUSTER: ${{ github.event.inputs.cluster-name }}
        run: |
          ngname=$(petname)
          ./vms-test/helpers/test-eks run-test \
              --cluster-name="$CLUSTER" --ami="$AMI" \
              --nodegroup-name="$ngname" test-results/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: test-results
