name: Approve PR from approver-bot

on:
  pull_request:
    types:
      - labeled

permissions: {}

jobs:
  approve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    if: |
      github.event.label.name == 'approver-bot/approve' &&
      github.event.sender.type == 'Bot' &&
      github.event.sender.login == 'octo-sts[bot]'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit
      - name: Get octo-sts token
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: approver-bot
      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
      - name: Review PR
        run: |
          curl \
            -o review_output.json \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.octo-sts.outputs.token }}" \
              https://api.github.com/repos/"${{ github.repository }}"/pulls/"${{ github.event.pull_request.number}}"/reviews
      - name: Approve PR
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
              /repos/"${{ github.repository }}"/pulls/"${{ github.event.pull_request.number}}"/reviews/"$(jq -r '.id' review_output.json)"/events \
            -f event='APPROVE'
