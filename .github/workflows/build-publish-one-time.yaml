name: "One-Time VM Image Builder"
on:
  workflow_dispatch:
    inputs:
      cloud_platform:
        type: choice
        required: true
        description: "Cloud platform to build for"
        options:
          - aws
          - gcp
          - azure
          - qemu
          - vmware
          - rpi
      image_name:
        type: string
        required: true
        description: "Image name to build (e.g., 'gcp-base-slim', 'vmware-docker-full', 'aws-eks-1.33-full')"
      architectures:
        type: choice
        required: true
        default: "both"
        description: "Target architecture(s)"
        options:
          - both
          - x86_64
          - aarch64
      run_tests:
        type: boolean
        required: false
        default: true
        description: "Run integration tests in staging environment"
      with_compliance_scan:
        type: boolean
        required: false
        default: false
        description: "Generate reports for CIS and STIG compliance"
      publish_to_production:
        type: boolean
        required: false
        default: false
        description: "Publish to production/eap after staging validation"
      notify_slack:
        type: boolean
        required: false
        default: false
        description: "Send Slack notification when workflow completes"
      notify_slack_success:
        type: boolean
        required: false
        default: true
        description: "Send Slack notification on success (only if notify_slack is enabled)"

permissions: {}
# Use a separate concurrency group for one-time builds
# This allows them to run in parallel with scheduled builds
concurrency:
  group: 'one-time-${{ inputs.cloud_platform }}-${{ inputs.image_name }}'
  cancel-in-progress: false

jobs:
  init:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}
    runs-on: ubuntu-8-core
    outputs:
      BUILD_TIMESTAMP: ${{ steps.timestamp.outputs.BUILD_TIMESTAMP }}
      matrix_arch: ${{ steps.matrix.outputs.arch }}
    steps:
      - id: timestamp
        run: |
          echo BUILD_TIMESTAMP=$(date --utc "+%Y%m%d-%H%M") >> "$GITHUB_OUTPUT"
      - id: matrix
        run: |
          if [[ "${{ inputs.architectures }}" == "both" ]]; then
            echo 'arch=["x86_64","aarch64"]' >> "$GITHUB_OUTPUT"
          else
            echo 'arch=["${{ inputs.architectures }}"]' >> "$GITHUB_OUTPUT"
          fi

  build-test-publish:
    runs-on: ubuntu-8-core
    needs:
      - init
    permissions:
      id-token: write # federated identity
      contents: read # read repo
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJson(needs.init.outputs.matrix_arch) }}
    env:
      BUILD_TIMESTAMP: ${{ needs.init.outputs.BUILD_TIMESTAMP }}
      VM_ARCH: ${{ matrix.arch }}
      VM_CLOUD: ${{ inputs.cloud_platform }}
      VM_IMAGE: ${{ inputs.image_name }}
      WITH_COMPLIANCE_SCAN: ${{ inputs.with_compliance_scan }}

    steps:
      - uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit
      - uses: chainguard-dev/actions/apt-faster@b479012116eacde7f895586c17b598f7ba0ee700 # v1.5.9
      - name: Checkout source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Setup Chainguard authentication
      - uses: chainguard-dev/setup-chainctl@be0acd273acf04bfdf91f51198327e719f6af978 # v0.4.0
        with:
          identity: "ce2d1984a010471142503340d670612d63ffb9f6/381a2db906b88c20"
      - name: Get apk.cgr.dev token
        run: |
          chainctl auth login --identity=ce2d1984a010471142503340d670612d63ffb9f6/381a2db906b88c20 --audience=apk.cgr.dev
          cred=$(chainctl auth token --audience=apk.cgr.dev)
          echo "HTTP_AUTH=basic:apk.cgr.dev:user:$cred" >> $GITHUB_ENV
      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: './go.mod'
      - uses: chainguard-dev/actions/setup-melange@b479012116eacde7f895586c17b598f7ba0ee700 # v1.5.9
      - name: Install deps
        run: |
          make install-deps

      # Enable KVM and Vhost
      - name: Grant kvm/vhost perms
        run: |
          set -x
          sudo tee /etc/udev/rules.d/99-kvm4all.rules <<"EOF"
          KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"
          EOF
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/vhost* /dev/kvm* || :
          sudo sh -c 'for p in kvm vhost-net vhost-vsock; do \
            d=/dev/$p; [ -e "$d" ] || { echo "no $d"; continue; } ; \
            chmod ugo+rw $d && ls -l $d || exit; done'
          kvm-ok
          groups || :

      # Setup
      - name: make clean
        run: |
          make clean
      - name: make apkoaas
        run: |
          make apkoaas
      - name: make builder
        run: |
          make builder

      - name: Get octo-sts token
        id: octo-sts
        uses: octo-sts/action@d6c70ad3b9ac85df6da6b9749014d7283987cfec # v1.0.3
        with:
          scope: chainguard-images/images-private
          identity: wolfi-vm

      - name: Configure Git for private repository access
        shell: bash
        run: |
          git config --global url."https://x-access-token:${{ steps.octo-sts.outputs.token }}@github.com/".insteadOf "https://github.com/"

      # Build disk
      - name: Build disk image
        run: |
          df -h || true
          echo "Building disk image: ${{ env.VM_IMAGE }}"
          make SKIP_IMAGES="" ARCH="${VM_ARCH}" "disk-${VM_IMAGE}"
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Scan disk
        uses: './.github/actions/scan-disks'
        with:
          vm_group: ${{ inputs.cloud_platform }}
          arch: ${{ matrix.arch }}
      - name: add HOME/bin to PATH
        run: |
          # ensure HOME/bin is in PATH
          d="$HOME/bin"
          mkdir -p "$d"
          p="$PATH"
          echo "original-path: $p"
          p="$d:$PATH"
          echo "new-path: $p"
          echo "PATH=$p" >> "$GITHUB_ENV"

      # QEMU: Build firmware
      - name: make firmware
        if: inputs.cloud_platform == 'qemu'
        run: |
          make "builder/ovmf-${{ matrix.arch }}.fd"

      # QEMU: Create qcow2 image
      - name: Create qcow2 image (QEMU only)
        if: inputs.cloud_platform == 'qemu'
        run: |
          echo "Creating qcow2 for ${{ env.VM_IMAGE }}"
          make "qcow-${{ env.VM_IMAGE }}"

      # VMware: Install open-vmdk tools
      - name: Install open-vmdk
        if: inputs.cloud_platform == 'vmware'
        run: |
          git clone --revision=7cbf0bb9ba8b69b8930907c8d44ec6eb2439bf91 --depth=1 \
            https://github.com/vmware/open-vmdk.git
          cd open-vmdk
          make
          sudo make install

      # VMware: Create OVA image
      - name: Create OVA image
        if: inputs.cloud_platform == 'vmware'
        run: |
          echo "Creating OVA for ${{ env.VM_IMAGE }}"
          make "ova-${{ env.VM_IMAGE }}"

      # AWS: Install awspub tool
      - name: Install awspub
        if: inputs.cloud_platform == 'aws'
        run: |
          python3 -m venv ~/.venvs/awspub
          ~/.venvs/awspub/bin/pip install awspub
          echo "$HOME/.venvs/awspub/bin" >> "$GITHUB_PATH"

      # AWS: Create AMI
      - name: Configure AWS credentials for AMI creation
        if: inputs.cloud_platform == 'aws'
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: "arn:aws:iam::607334848609:role/wolfi-vms-github-postsubmit-role"
          role-session-name: "wolfi-vm-one-time-create-${{ github.run_id }}"
          aws-region: "us-east-1"
          role-duration-seconds: 7200
      - name: Create AWS AMI
        if: inputs.cloud_platform == 'aws'
        run: |
          arch="${{ env.VM_ARCH }}"
          echo "Creating AMI for ${{ env.VM_IMAGE }}"
          make SKIP_IMAGES="" "aws-image-create-${{ env.VM_IMAGE }}" ARCH=$arch BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }} PREFIX=chainguard

      # AWS: Publish to the registry
      - name: Publish AWS image to registry
        if: inputs.cloud_platform == 'aws'
        run: |
          arch="${{ env.VM_ARCH }}"
          make SKIP_IMAGES="" "publish-registry-${{ env.VM_IMAGE }}" ARCH=$arch

      # AWS Testing
      - name: Configure AWS credentials for testing
        if: inputs.run_tests && inputs.cloud_platform == 'aws'
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: "arn:aws:iam::677043465004:role/cg-test-vms-postsubmit-role"
          role-session-name: "wolfi-vm-one-time-test-${{ github.run_id }}"
          aws-region: "us-east-1"
          role-duration-seconds: 7200
      - name: Test AWS image
        if: inputs.run_tests && inputs.cloud_platform == 'aws'
        uses: './.github/actions/vms-test'
        with:
          cloud_provider: "aws"
          vm_group: "aws"
          arch: ${{ matrix.arch }}
          opts: |
            -- --launch-group=wolfi-vm-test \
            --awspub-inputs=./output/${{ matrix.arch }}/awspub/create/ \
            --region=us-east-1
          with-compliance-scan: ${{ env.WITH_COMPLIANCE_SCAN }}

      # AWS ECS/EKS: Refresh credentials
      - name: Refresh AWS credentials for ECS/EKS tests
        if: inputs.run_tests && inputs.cloud_platform == 'aws' && (contains(inputs.image_name, 'aws-ecs') || contains(inputs.image_name, 'aws-eks'))
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: "arn:aws:iam::677043465004:role/cg-test-vms-postsubmit-role"
          role-session-name: "wolfi-vm-one-time-test-${{ github.run_id }}"
          aws-region: "us-east-1"
          role-duration-seconds: 7200

      # AWS ECS: Container instance testing
      - name: Test ECS container instance
        if: inputs.run_tests && inputs.cloud_platform == 'aws' && contains(inputs.image_name, 'aws-ecs')
        uses: './.github/actions/test-ecs-container-instance'
        with:
          aws-region: us-east-1
          artifact-suffix: "-${{ matrix.arch }}-one-time"
          awspub-inputs-dir: ./output/${{ matrix.arch }}/awspub/create

      # AWS EKS: Node testing
      - name: Test EKS node
        if: inputs.run_tests && inputs.cloud_platform == 'aws' && contains(inputs.image_name, 'aws-eks')
        uses: './.github/actions/test-eks-node'
        with:
          aws-region: us-east-1
          artifact-suffix: "-${{ matrix.arch }}-one-time"
          awspub-inputs-dir: ./output/${{ matrix.arch }}/awspub/create

      # AWS: Publish to marketplace and share with users
      - name: Configure AWS credentials for marketplace publishing
        if: inputs.publish_to_production && inputs.cloud_platform == 'aws'
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: "arn:aws:iam::607334848609:role/wolfi-vms-github-postsubmit-role"
          role-session-name: "wolfi-vm-one-time-publish-${{ github.run_id }}"
          aws-region: "us-east-1"
          role-duration-seconds: 7200

      - name: Share AWS Images
        if: inputs.publish_to_production && inputs.cloud_platform == 'aws'
        run: |
          arch="${{ env.VM_ARCH }}"
          make "aws-image-share-${{ env.VM_IMAGE }}" ARCH=$arch BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }} PREFIX=chainguard
      - name: Publish AWS image to marketplace
        if: inputs.publish_to_production && inputs.cloud_platform == 'aws'
        run: |
          arch="${{ env.VM_ARCH }}"
          echo "Publishing ${{ env.VM_IMAGE }} to AWS Marketplace"
          make SKIP_IMAGES="" "aws-image-publish-${{ env.VM_IMAGE }}" ARCH=$arch BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }} PREFIX=chainguard

      # AWS ECS: ONA S3 Publishing
      - name: Configure AWS credentials for ONA S3
        if: inputs.publish_to_production && inputs.cloud_platform == 'aws' && (contains(inputs.image_name, 'ecs-full-request-6943') || contains(inputs.image_name, 'ecs-full-immutable'))
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: "arn:aws:iam::607334848609:role/chainguard-ona-publication"
          role-session-name: "wolfi-vm-one-time-ona-${{ github.run_id }}"
          aws-region: "us-east-1"

      - name: Publish ONA image to S3
        if: inputs.publish_to_production && inputs.cloud_platform == 'aws' && (contains(inputs.image_name, 'ecs-full-request-6943') || contains(inputs.image_name, 'ecs-full-immutable'))
        run: |
          arch="${{ env.VM_ARCH }}"
          echo "Publishing ${{ env.VM_IMAGE }} to ONA S3"

          # Determine which image to publish based on the image name
          if [[ "${{ env.VM_IMAGE }}" == *"ecs-full-request-6943"* ]]; then
            make SKIP_IMAGES="" bespoke-publish-s3-aws-ecs-request-6943-full \
              PREFIX=chainguard \
              BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }} \
              ARCH=$arch \
              PUBLISH_TARGET=ona
          elif [[ "${{ env.VM_IMAGE }}" == *"ecs-full-immutable"* ]]; then
            make SKIP_IMAGES="" bespoke-publish-s3-aws-ecs-immutable-full \
              PREFIX=chainguard \
              BUILD_TIMESTAMP=${{ env.BUILD_TIMESTAMP }} \
              ARCH=$arch \
              PUBLISH_TARGET=ona
          fi

      # GCP, QEMU & VMware: Publish to staging
      - name: Setup GCP for staging
        if: inputs.cloud_platform == 'gcp' || inputs.cloud_platform == 'qemu' || inputs.cloud_platform == 'vmware'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/674489516262/locations/global/workloadIdentityPools/staging-wolfi-vm/providers/github-provider'
          service_account: 'staging-vms-post@staging-vms-h8zx.iam.gserviceaccount.com'
      - name: Configure gcloud for staging
        if: inputs.cloud_platform == 'gcp' || inputs.cloud_platform == 'qemu' || inputs.cloud_platform == 'vmware'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: staging-vms-h8zx
      - name: Enable GCS parallel uploads
        if: inputs.cloud_platform == 'gcp' || inputs.cloud_platform == 'qemu' || inputs.cloud_platform == 'vmware'
        run: |
          gcloud config set storage/parallel_composite_upload_enabled True

      - name: Publish GCP image to staging
        if: inputs.cloud_platform == 'gcp'
        run: |
          arch="${{ env.VM_ARCH }}"
          make SKIP_IMAGES="" "publish-${{ env.VM_IMAGE }}" PREFIX=chainguard PUBLISH_TARGET=staging ARCH=$arch

      # GCP: Publish to the registry
      - name: Publish GCP image to the registry
        if: inputs.cloud_platform == 'gcp'
        run: |
          arch="${{ env.VM_ARCH }}"
          make SKIP_IMAGES="" "publish-registry-${{ env.VM_IMAGE }}" ARCH=$arch

      - name: Publish QEMU image to staging
        if: inputs.cloud_platform == 'qemu'
        run: |
          arch="${{ env.VM_ARCH }}"
          make SKIP_IMAGES="" "publish-${{ env.VM_IMAGE }}" PREFIX=chainguard PUBLISH_TARGET=staging ARCH=$arch

      # QEMU: Publish to the registry
      - name: Publish QEMU image to registry
        if: inputs.cloud_platform == 'qemu'
        run: |
          arch="${{ env.VM_ARCH }}"
          make SKIP_IMAGES="" "publish-registry-${{ env.VM_IMAGE }}" ARCH=$arch

      # QEMU: Test in staging
      - name: Test QEMU image
        if: inputs.run_tests && inputs.cloud_platform == 'qemu'
        uses: './.github/actions/vms-test'
        with:
          cloud_provider: "qemu"
          vm_group: "qemu"
          arch: ${{ matrix.arch }}
          with-compliance-scan: ${{ env.WITH_COMPLIANCE_SCAN }}

      # GCP: Test in staging
      - name: Test GCP image in staging
        if: inputs.run_tests && inputs.cloud_platform == 'gcp'
        uses: './.github/actions/vms-test'
        with:
          cloud_provider: "gcp"
          vm_group: "gcp"
          arch: ${{ matrix.arch }}
          opts: |
            -- --project="staging-vms-h8zx" --service-account="default" \
            --zone="us-central1-a" \
            --gcp-inputs="./output" --gcp-input-filename="publish.staging.yaml"
          with-compliance-scan: ${{ env.WITH_COMPLIANCE_SCAN }}

      # GCP: Publish to EAP
      - name: Setup GCP for production
        if: inputs.publish_to_production && inputs.cloud_platform == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/212178706475/locations/global/workloadIdentityPools/ci-pool/providers/ci-provider'
          service_account: 'github-ci@wolfi-vm.iam.gserviceaccount.com'
      - name: Configure gcloud for production
        if: inputs.publish_to_production && inputs.cloud_platform == 'gcp'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: wolfi-vm
      - name: Enable GCS parallel uploads for production
        if: inputs.publish_to_production && inputs.cloud_platform == 'gcp'
        run: |
          gcloud config set storage/parallel_composite_upload_enabled True
      - name: Publish GCP image to production (EAP)
        if: inputs.publish_to_production && inputs.cloud_platform == 'gcp'
        run: |
          arch="${{ env.VM_ARCH }}"
          make SKIP_IMAGES="" "publish-${{ env.VM_IMAGE }}" PRFEIX=chainguard PUBLISH_TARGET=eap ARCH=$arch

      # QEMU: Publish to EAP
      - name: Publish QEMU image to EAP
        if: inputs.publish_to_production && inputs.cloud_platform == 'qemu' && (contains(inputs.image_name, 'agents-docker-dev') || contains(inputs.image_name, 'docker-dev'))
        run: |
          arch="${{ env.VM_ARCH }}"
          make SKIP_IMAGES="" "publish-${{ env.VM_IMAGE }}" PREFIX=chainguard PUBLISH_TARGET=eap ARCH=$arch

      # Azure & VMware: Publish to staging
      - name: Setup Azure credentials for staging
        if: inputs.cloud_platform == 'azure' || inputs.cloud_platform == 'vmware'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: '0aaf95fb-9de7-4dbd-8cc6-93c603e9cf15'
          tenant-id: "32b8c550-a021-45aa-b9ba-66ccba087fea"
          subscription-id: 'a81bc84d-0ce3-447c-9b7d-89e8aab51e3b'

      - name: Publish Azure image to staging
        if: inputs.cloud_platform == 'azure'
        run: |
          arch="${{ env.VM_ARCH }}"
          make SKIP_IMAGES="" "publish-${{ env.VM_IMAGE }}" PREFIX=chainguard PUBLISH_TARGET=staging ARCH=$arch

      # Azure: Publish to the registry
      - name: Publish Azure image to registry
        if: inputs.cloud_platform == 'azure'
        run: |
          arch="${{ env.VM_ARCH }}"
          make SKIP_IMAGES="" "publish-registry-${{ env.VM_IMAGE }}" ARCH=$arch

      # Azure: Test in staging
      - name: Test Azure image in staging
        if: inputs.run_tests && inputs.cloud_platform == 'azure'
        uses: './.github/actions/vms-test'
        with:
          cloud_provider: "azure"
          vm_group: "azure"
          arch: ${{ matrix.arch }}
          opts: |
            -- --subscription-id="a81bc84d-0ce3-447c-9b7d-89e8aab51e3b" \
            --resource-group="some-resource-group" \
            --azure-inputs="./output"
          with-compliance-scan: ${{ env.WITH_COMPLIANCE_SCAN }}

      # Azure & VMware: Publish to EAP
      - name: Setup Azure credentials for production
        if: inputs.publish_to_production && (inputs.cloud_platform == 'azure' || inputs.cloud_platform == 'vmware')
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: 'c5a91a71-f2b4-48b8-8604-dedfc7a258b2'
          tenant-id: "32b8c550-a021-45aa-b9ba-66ccba087fea"
          subscription-id: 'ad60e736-b0ce-432e-b77c-4b8218f452ae'

      - name: Publish Azure image to EAP
        if: inputs.publish_to_production && inputs.cloud_platform == 'azure'
        run: |
          arch="${{ env.VM_ARCH }}"
          make SKIP_IMAGES="" "publish-${{ env.VM_IMAGE }}" PREFIX=chainguard PUBLISH_TARGET=eap ARCH=$arch

      # Azure: Marketplace publishing
      - name: Setup Azure credentials for marketplace
        if: inputs.publish_to_production && inputs.cloud_platform == 'azure' && inputs.image_name == 'azure-eap-full'
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: 'aac166ff-e6b3-4963-a22e-713d12d1c0f9'
          tenant-id: "32b8c550-a021-45aa-b9ba-66ccba087fea"
          subscription-id: 'ad60e736-b0ce-432e-b77c-4b8218f452ae'

      - name: Update Azure Marketplace technical configuration
        if: inputs.publish_to_production && inputs.cloud_platform == 'azure' && inputs.image_name == 'azure-eap-full'
        run: |
          # Extract the image suffix to determine the correct marketplace configuration
          # For example: azure-eap-full -> eap-full
          image_suffix="${{ env.VM_IMAGE }}"
          image_suffix="${image_suffix#azure-}"

          echo "Updating Azure Marketplace for image: ${{ env.VM_IMAGE }} (suffix: ${image_suffix})"
          make SKIP_IMAGES="" "azure-marketplace-update-technical-plan-${image_suffix}" \
            AZRESOURCEGROUP="chainguard-vms-prod" \
            AZGALLERY="eap_chainguard_vms" \
            AZMARKETPLACE_PLAN=eap \
            AZMARKETPLACE_OFFER=chainguard_vm_eap_standardboot \
            AZNAME="chainguard-${image_suffix}"

      # VMware: Publish to staging (nothing useful to do except to download for local testing right now)
      - name: Publish VMware image to staging
        if: inputs.cloud_platform == 'vmware'
        run: |
          arch="${{ env.VM_ARCH }}"
          echo "Publishing VMware image to staging: ${{ env.VM_IMAGE }}"
          make SKIP_IMAGES="" "publish-${{ env.VM_IMAGE }}" PREFIX=chainguard PUBLISH_TARGET=staging ARCH=$arch

      # VMware: Publish to the registry
      - name: Publish VMware image to registry
        if: inputs.cloud_platform == 'vmware'
        run: |
          arch="${{ env.VM_ARCH }}"
          make SKIP_IMAGES="" "publish-registry-${{ env.VM_IMAGE }}" ARCH=$arch

      # VMware: Publish to EAP
      - name: Publish VMware image to EAP
        if: inputs.publish_to_production && inputs.cloud_platform == 'vmware'
        run: |
          arch="${{ env.VM_ARCH }}"
          echo "Publishing VMware image to EAP: ${{ env.VM_IMAGE }}"
          make SKIP_IMAGES="" "publish-${{ env.VM_IMAGE }}" PREFIX=chainguard PUBLISH_TARGET=eap ARCH=$arch

      - uses: './.github/actions/notify-slack'
        if: ${{ (inputs.notify_slack_success || !success()) && inputs.notify_slack }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_INPUT }}
          title: ${{ github.workflow }} - ${{ inputs.image_name }} (${{ matrix.arch }}) ${{ job.status }}
          message-color: ${{ job.status == 'success' && '#3fb950' || '#f85149'}}
          text: |
            Image: ${{ inputs.image_name }}
            Cloud: ${{ inputs.cloud_platform }}
            Architecture: ${{ matrix.arch }}
            Published to staging: Always (for testing)
            Published to production: ${{ inputs.publish_to_production }}

            For detailed logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          unfurl-links: true
