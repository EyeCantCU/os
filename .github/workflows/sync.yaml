name: Sync submodules

on:
  schedule:
    - cron: '0 * * * *' # every hour
  workflow_dispatch:

jobs:
  sync:
    name: Sync submodules
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Update wolfi-dev/os
      - name: update wolfi-dev/os
        run: git submodule update --init --remote ./os

      # Auth and update enterprise-packages
      - uses: octo-sts/action@main
        id: octo-sts-enterprise
        with:
          scope: chainguard-dev/enterprise-packages
          identity: stereo-sync
      - name: update enterprise-packages
        run: |
          git config --global url.https://${{github.actor}}:${{ steps.octo-sts-enterprise.outputs.token }}@github.com/.insteadOf https://github.com/
          git submodule update --init --remote ./enterprise-packages

      # Auth and update extra-packages
      #- uses: octo-sts/action@main
      #  id: octo-sts-extra
      #  with:
      #    scope: chainguard-dev/extra-packages
      #    identity: stereo-sync
      #- name: update extra-packages
      #  run: |
      #    git config --global url.https://${{github.actor}}:${{ steps.octo-sts-extra.outputs.token }}@github.com/.insteadOf https://github.com/
      #    git submodule update --init --remote ./extra-packages

      # Assume an octo-sts identity that can open PRs and trigger actions
      - uses: octo-sts/action@main
        id: octo-sts-stereo
        with:
          scope: chainguard-dev/stereo
          identity: stereo-sync
      - uses: chainguard-dev/actions/setup-gitsign@19f50ca62fcb3e94c768f5fcffb4b14fcdc6c5ed # main
      - name: update submodules
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts-stereo.outputs.token }}
        run: ./hack/sync-submodules.sh
