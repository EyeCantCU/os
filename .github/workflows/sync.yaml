name: Sync subtrees

on:
  schedule:
    - cron: '0 * * * *' # every hour
  workflow_dispatch:

jobs:
  sync:
    name: Sync subtrees
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Need full history to avoid "refusing to merge unrelated histories"

      - name: checkout branch
        run: git checkout -b sync-subtrees

      # Update wolfi-dev/os
      - name: update wolfi-dev/os
        run: git subtree pull -m "sync wolfi" --prefix os https://github.com/wolfi-dev/os main

      # Auth and update enterprise-packages
      - uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
        id: octo-sts-enterprise
        with:
          scope: chainguard-dev/enterprise-packages
          identity: stereo-sync
      - name: update enterprise-packages
        run: |
          git config --global url.https://${{github.actor}}:${{ steps.octo-sts-enterprise.outputs.token }}@github.com/.insteadOf https://github.com/
          git subtree pull -m "sync enterprise" --prefix enterprise-packages https://github.com/chainguard-dev/enterprise-packages main

      # Auth and update extra-packages
      - uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
        id: octo-sts-extra
        with:
          scope: chainguard-dev/extra-packages
          identity: stereo-sync
      - name: update extra-packages
        run: |
          git config --global url.https://${{github.actor}}:${{ steps.octo-sts-extra.outputs.token }}@github.com/.insteadOf https://github.com/
          git subtree pull -m "sync extras" --prefix extra-packages https://github.com/chainguard-dev/extra-packages main

      # TODO: Add an octo-sts policy for chainguard-dev/wolfi-vm

      # Assume an octo-sts identity that can open PRs and trigger actions
      - uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
        id: octo-sts-stereo
        with:
          scope: chainguard-dev/stereo
          identity: stereo-sync
      - uses: chainguard-dev/actions/setup-gitsign@19f50ca62fcb3e94c768f5fcffb4b14fcdc6c5ed # main
      - name: create PR
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts-stereo.outputs.token }}
        run: |
          # If there are any changes, proceed
          if [[ -n $(git --no-pager diff --exit-code main) ]]; then
              git push origin sync-subtrees --force

              # Get PR number for this branch
              pr_number=$(gh pr list --state open --base main --head sync-subtrees | grep sync-subtrees | awk '{print $1}')
              if [[ -n $pr_number ]]; then
                  echo "Updated branch for PR #$pr_number"
              else
                  echo "Creating new PR"
                  gh pr create --title "update subtrees" --body "update subtrees" --base main
              fi
              git checkout -
          else
              echo "No changes to subtrees, nothing to do"
          fi
