name: Bundle Build Extras Packages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "**.txt"
  schedule:
    # Deploy at 4:10 AM (PST) every day.
    - cron:  "10 12 * * *"
  workflow_dispatch:

# Only run one build at a time to prevent out of sync signatures.
concurrency: bundle-build

permissions:
  contents: read

jobs:
  build:
    name: Build packages
    if: github.repository == 'chainguard-dev/extra-packages'

    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a4aa98b93cab29d9b1101a6143fb8bce00e2eac4 # v2.7.1
        with:
          egress-policy: audit

      - uses: actions/checkout@44c2b7a8a4ea60a981eaca3cf939b5f4305c123b # v4.1.5

      - name: Authenticate to Google Cloud
        uses: 'google-github-actions/auth@55bd3a7c6e2ae7cf1877fd1ccb9d54c0503c457c' # v2.1.2
        with:
          workload_identity_provider: 'projects/567187841907/locations/global/workloadIdentityPools/staging-shared-9bd2/providers/staging-shared-gha'
          service_account: 'bundle-runner-post-extras@staging-images-183e.iam.gserviceaccount.com'
      - name: Setup G Cloud SDK
        uses: 'google-github-actions/setup-gcloud@98ddc00a17442e89a24bbf282954a3b65ce6d200' # v2.0.11
      - name: Print gcloud info
        shell: bash
        run: 'gcloud info'

      - name: Connect to cluster
        uses: 'google-github-actions/get-gke-credentials@c02be8662df01db62234e9b9cff0765d1c1827ae' # v2.1.0
        with:
          cluster_name: 'bundle-runner-a'
          location: 'us-central1'
          project_id: 'staging-images-183e'

      - name: kubectl test
        shell: bash
        run: |
          kubectl get namespaces

  postrun:
    name: Notify Slack
    runs-on: ubuntu-latest
    if: failure() && false # TODO(kleung): remove `&& false` when ready to slack
    needs: [build]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a4aa98b93cab29d9b1101a6143fb8bce00e2eac4 # v2.7.1
        with:
          egress-policy: audit

      - uses: rtCamp/action-slack-notify@4e5fb42d249be6a45a298f3c9543b111b02f7907 # v2.3.0
        env:
          SLACK_ICON: http://github.com/chainguard-dev.png?size=48
          SLACK_USERNAME: guardian
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: chainguard-images-alerts
          SLACK_MSG_AUTHOR: wolfi-bot
          SLACK_COLOR: "#8E1600"
          MSG_MINIMAL: "true"
          SLACK_TITLE: "[bundle build extras] failure: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SLACK_MESSAGE: |
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
