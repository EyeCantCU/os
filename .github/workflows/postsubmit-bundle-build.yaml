name: Bundle Build Enterprise Packages

on:
  schedule:
    # Deploy at 12:44 AM (PST) every day.
    - cron: "44 8 * * *"
  workflow_dispatch:
    inputs:
      cluster_name:
        required: false
        type: choice
        default: "bundle-runner-a"
        description: "name of cluster to run build on."
        options:
          - "bundle-runner-a"
          - "bundle-a-nap"
      package_names:
        required: false
        type: string
        default: ""
        description: "comma separated list of package names to build. If empty, build all packages."

# Only run one build at a time to prevent out of sync signatures.
concurrency: ${{ github.event.inputs.cluster_name || 'bundle-runner-a' }}

permissions:
  contents: read

jobs:
  build:
    name: Build packages
    if: github.repository == 'chainguard-dev/enterprise-packages'

    runs-on: ubuntu-latest
    container:
      image: ghcr.io/wolfi-dev/sdk:latest@sha256:0b42f12333ae9234a6cf949346173d7f348657fea14b88fbf6fe7e832cfab6dd

    permissions:
      id-token: write
      contents: read

    env:
      CLUSTER_NAME: ${{ github.event.inputs.cluster_name || 'bundle-runner-a' }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
        with:
          fetch-depth: 0

      - name: 'Trust the github workspace'
        run: |
          # This is to avoid fatal errors about "dubious ownership" because we are
          # running inside of a container action with the workspace mounted in.
          git config --global --add safe.directory "$(pwd)"

      - name: Authenticate to Google Cloud
        uses: "google-github-actions/auth@8254fb75a33b976a221574d287e93919e6a36f70" # v2.1.6
        with:
          workload_identity_provider: "projects/567187841907/locations/global/workloadIdentityPools/bundle-post-enterprise/providers/github-provider"
          service_account: "bundle-runner-post-enterprise@staging-images-183e.iam.gserviceaccount.com"
      - name: Setup G Cloud SDK
        uses: "google-github-actions/setup-gcloud@f0990588f1e5b5af6827153b93673613abdc6ec7" # v2.0.11
        with:
          install_components: 'gke-gcloud-auth-plugin'
      - name: Print gcloud info
        shell: bash
        run: "gcloud info"
      - name: Configure GCR auth
        shell: bash
        run: gcloud auth configure-docker
      - name: Configure AR auth
        shell: bash
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Install sudo for gke-auth
        shell: bash
        run: apk add cmd:sudo

      - name: Make parent dir for gke-auth
        shell: bash
        run: mkdir -p /usr/local/bin

      - name: Connect to cluster
        uses: "imjasonh/gke-auth@31f5c5f16489a15037d46b08903d983889c46ddf" # v0.2.0
        with:
          cluster: ${{ env.CLUSTER_NAME }}
          location: "us-central1"
          project: "staging-images-183e"

      - name: kubectl test
        shell: bash
        run: |
          apk add kubectl
          kubectl get namespaces

      - name: "Generate local signing key"
        run: |
          make local-melange-enterprise.rsa

      - name: "bundle build"
        shell: bash
        env:
          BUNDLE_REPO: us-central1-docker.pkg.dev/staging-images-183e/bundles
          BUCKET: "chainguard-staging-enterprise-registry-destination/${{ github.run_id }}"
        run: |
          set -x
          set -v

          gsutil cp local-melange-enterprise.rsa.pub gs://${BUCKET}/local-melange-enterprise.rsa.pub

          COMMON_FLAGS=$(cat <<-END
            --keyring-append https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
            --repository-append https://packages.wolfi.dev/os
            --repository-append https://packages.cgr.dev/extras
            --keyring-append https://packages.cgr.dev/extras/chainguard-extras.rsa.pub
          END
          )

          BUNDLE=$(wolfictl bundle \
            --bundle-base ghcr.io/wolfi-dev/sdk:latest@sha256:0b42f12333ae9234a6cf949346173d7f348657fea14b88fbf6fe7e832cfab6dd \
            --bundle-repo "${BUNDLE_REPO}" \
            ${COMMON_FLAGS} \
            --runner bubblewrap \
            --gcsfuse chainguard-enterprise-registry-destination/os:/gcsfuse/enterprise-registry \
            --repository-append /gcsfuse/enterprise-registry \
            --keyring-append /gcsfuse/enterprise-registry/chainguard-enterprise.rsa.pub \
            --gcsfuse "${BUCKET}:/gcsfuse/output" \
            --repository-append /gcsfuse/output \
            --keyring-append /gcsfuse/output/local-melange-enterprise.rsa.pub \
            --keyring-append ./local-melange.rsa.pub \
            --pipeline-dir ./pipelines \
            ${{ github.event.inputs.package_names }}
            )
          wolfictl build \
            --jobs 64 \
            --bucket "${BUCKET}" \
            --destination-bucket "${BUCKET}" \
            --keyring-append https://raw.githubusercontent.com/wolfi-dev/os/main/chainguard-keys/chainguard-enterprise.rsa.pub \
            --repository-append https://packages.cgr.dev/os \
            ${COMMON_FLAGS} \
            --signing-key ./local-melange-enterprise.rsa \
            --k8s-namespace post-enterprise \
            --service-account post-enterprise \
            --trace /tmp/trace.json \
            --bundle "${BUNDLE}"

      - if: ${{ always() }}
        name: 'Upload trace to GitHub Artifacts'
        uses: actions/upload-artifact@604373da6381bf24206979c74d06a550515601b9 # v4.4.1
        with:
          name: trace-build.json
          path: /tmp/trace.json
          if-no-files-found: warn

  postrun:
    name: Notify Slack
    runs-on: ubuntu-latest
    if: failure() && false # TODO(kleung): remove `&& false` when ready to slack
    needs: [build]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@91182cccc01eb5e619899d80e4e971d6181294a7 # v2.10.1
        with:
          egress-policy: audit

      - uses: rtCamp/action-slack-notify@4e5fb42d249be6a45a298f3c9543b111b02f7907 # v2.3.0
        env:
          SLACK_ICON: http://github.com/chainguard-dev.png?size=48
          SLACK_USERNAME: guardian
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: chainguard-images-alerts
          SLACK_MSG_AUTHOR: wolfi-bot
          SLACK_COLOR: "#8E1600"
          MSG_MINIMAL: "true"
          SLACK_TITLE: "[bundle build enterprise] failure: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SLACK_MESSAGE: |
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
