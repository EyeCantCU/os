name: Publish to Public

on:
  workflow_call:
    inputs:
      staging_repo:
        description: 'Staging repository (e.g., "chainguard-dev/wolfi-staging")'
        required: true
        type: string
      public_repo:
        description: 'Public repository (e.g., "wolfi-dev/os")'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'chainguard-dev' }}
    permissions:
      id-token: write
    steps:
      - uses: step-security/harden-runner@5ef0c079ce82195b2a36a210272d6b661572d83e # v2.14.2
        with:
          egress-policy: audit
      # Get credentials
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: staging-sts
        with:
          scope: ${{ inputs.staging_repo }}
          identity: stereo
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: public-sts
        with:
          scope: ${{ inputs.public_repo }}
          identity: stereo
      - name: Publish staging to public
        env:
          STAGING_REPO: ${{ inputs.staging_repo }}
          PUBLIC_REPO: ${{ inputs.public_repo }}
          STAGING_TOKEN: ${{ steps.staging-sts.outputs.token }}
          PUBLIC_TOKEN: ${{ steps.public-sts.outputs.token }}
        run: |
          set -x

          # Manually clone instead of using actions/checkout since actions/checkout will
          # set a single credential for all of github.com.
          git clone "https://x-access-token:${PUBLIC_TOKEN}@github.com/${PUBLIC_REPO}.git" .
          git remote add staging "https://x-access-token:${STAGING_TOKEN}@github.com/${STAGING_REPO}.git"

          # Debug git config
          git config --list

          # Fetch the main branch from the staging repository and fast-forward merge.
          git pull --ff-only staging main

          # Push the updated main branch to the public repository.
          git push -u origin main:main
