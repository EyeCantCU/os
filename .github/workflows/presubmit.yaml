name: "Pre-submit check"

on:
  pull_request_target:
    branches:
      - "main"
  push:

permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read # read repo

    strategy:
      fail-fast: true
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: stable

      - name: Install deps
        run: |
          ./helpers/install-deps --test-arch="$arch"

      - name: lint
        run: |
          make gofmt

      - name: make runners
        run: |
          make runners

      - name: make tests
        run: |
          make tests

      - name: make unit-test
        run: |
          make unit-test
