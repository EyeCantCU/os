name: Withdraw enterprise packages

on:
  workflow_dispatch:

# Don't withdraw during builds, to prevent out of sync signatures.
concurrency: build

jobs:
  withdraw:
    name: Withdraw packages
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # We want the full history for uploading withdrawn-packages.txt to GCS. If this takes too long, we look at merging both files.

      # this need to point to main to always get the latest action
      - name: "Install wolfictl onto PATH"
        uses: wolfi-dev/actions/install-wolfictl@main

      # This is managed here: https://github.com/chainguard-dev/secrets/blob/main/enterprise-packages.tf
      - uses: google-github-actions/auth@8254fb75a33b976a221574d287e93919e6a36f70 # v2.1.6
        id: auth
        with:
          workload_identity_provider: "projects/12758742386/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "enterprise-packages@chainguard-github-secrets.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@f0990588f1e5b5af6827153b93673613abdc6ec7 # v2.1.1
        with:
          project_id: "chainguard-github-secrets"
      - uses: 'google-github-actions/get-secretmanager-secrets@95a0b09b8348ef3d02c68c6ba5662a037e78d713' # v2.1.4
        id: secrets
        with:
          secrets: |-
            token:chainguard-github-secrets/enterprise-packages-signing-key

      - run: echo "${{ steps.secrets.outputs.token }}" > ./chainguard-enterprise.rsa
      - run: |
          sudo mkdir -p /etc/apk/keys
          sudo cp ./chainguard-enterprise.rsa.pub /etc/apk/keys/chainguard-enterprise.rsa.pub

      # We use a different GSA for our interaction with GCS.
      - uses: google-github-actions/auth@8254fb75a33b976a221574d287e93919e6a36f70 # v2.1.6
        with:
          workload_identity_provider: "projects/618116202522/locations/global/workloadIdentityPools/prod-shared-e350/providers/prod-shared-gha"
          service_account: "prod-images-ci@prod-images-c6e5.iam.gserviceaccount.com"

      - uses: google-github-actions/setup-gcloud@f0990588f1e5b5af6827153b93673613abdc6ec7 # v2.1.1
        with:
          project_id: "prod-images-c6e5"

      - name: Withdraw from index
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            mkdir -p $arch

            curl -v -H "Authorization: Bearer $(gcloud auth print-access-token)" https://packages.cgr.dev/os/$arch/APKINDEX.tar.gz 2>verbose | wolfictl withdraw $(grep -v '\#' withdrawn-packages.txt) --signing-key="${{ env.SIGNING_KEY }}" > $arch/APKINDEX.tar.gz

            # Parse the object generation from the -v output.
            GEN=$(grep "x-goog-generation" verbose | cut -d' ' -f3)
            echo "APKINDEX.tar.gz object generation for ${arch} was ${GEN}"

            # This will fail if the APKINDEX is modified between when we download it and when we upload the modified version.
            # That's totally fine, just re-run the withdrawl workflow.
            # This is a bit of a hack until we drop this APKINDEX entirely.
            gcloud storage cp --if-generation-match="${GEN}" --cache-control="no-store" $arch/APKINDEX.tar.gz gs://chainguard-enterprise-registry-destination/os/$arch/APKINDEX.tar.gz
          done
        env:
          SIGNING_KEY: "${{ github.workspace }}/chainguard-enterprise.rsa"

      - name: Delete withdrawn packages
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            for pkg in $(grep -v '\#' withdrawn-packages.txt); do
              echo "=> $pkg"
              gsutil -m rm -f gs://chainguard-enterprise-registry-destination/os/$arch/$pkg || true
            done
          done

      - name: Upload full withdrawn packages list
        run: |
          set -euxo pipefail
          git log -p -- withdrawn-packages.txt | grep "^+" | grep ".apk$" | cut -c2- | sort | uniq > all-withdrawn-packages.txt
          gsutil cp -a "public-read" \
            all-withdrawn-packages.txt \
            gs://chainguard-enterprise-registry-destination/os/withdrawn-packages.txt

      - name: Delete sbom packages from the lifecycle automation
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            for pkg in $(grep -v '\#' withdrawn-packages.txt); do
              echo "=> $pkg"
              gsutil -m rm -f gs://insights-apk-sbom-prod/chainguard-enterprise-registry-destination/os/$arch/$pkg.sbom.json || true
            done
          done

      # use public chainguard provider.
      - uses: chainguard-dev/setup-chainctl@598499528905f95b94e62e4831cf42035e768933 # v0.2.3
        with:
          # Managed here:
          # https://github.com/chainguard-dev/mono/blob/main/env/chainguard-images/iac/enterprise-packages-pusher.tf
          identity: "ce2d1984a010471142503340d670612d63ffb9f6/7706928ca9a11c7c"

      - name: 'Withdraw packages from apk.cgr.dev'
        run: |
          set -e
          # Populate the token here, since chainctl auth token
          # doesn't support all of the options we need.
          chainctl auth login --audience apk.cgr.dev \
            --identity "ce2d1984a010471142503340d670612d63ffb9f6/7706928ca9a11c7c"
          echo "::add-mask::$(chainctl auth token --audience apk.cgr.dev)"

          for arch in "aarch64" "x86_64"; do
            while IFS= read -r pkg; do
              curl -X DELETE \
                  --user "user:$(chainctl auth token --audience apk.cgr.dev)" \
                  "https://apk.cgr.dev/chainguard-private/${arch}/${pkg}" || true
            done < <(grep -v -e '^$' -v '\#' withdrawn-packages.txt | cut -d':' -f2) # Ignore empty lines and comments
          done

      - uses: rtCamp/action-slack-notify@c33737706dea87cd7784c687dadc9adf1be59990 # v2.3.2
        if: failure()
        env:
          SLACK_ICON: http://github.com/chainguard-dev.png?size=48
          SLACK_USERNAME: guardian
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: chainguard-images-alerts
          SLACK_COLOR: '#8E1600'
          MSG_MINIMAL: 'true'
          SLACK_TITLE: '[withdraw-packages-enterprise] failure: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          SLACK_MESSAGE: |
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
