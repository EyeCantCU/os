name: Backfill enterprise packages to apk.cgr.dev

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backfill-packages.txt"

jobs:
  backfill:
    name: Backfill packages
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: google-github-actions/auth@b7593ed2efd1c1617e1b0254da33b86225adb2a5 # v2.1.12
        with:
          workload_identity_provider: "projects/618116202522/locations/global/workloadIdentityPools/prod-shared-e350/providers/prod-shared-gha"
          service_account: "prod-images-ci@prod-images-c6e5.iam.gserviceaccount.com"
      - uses: google-github-actions/setup-gcloud@6a7c903a70c8625ed6700fa299f5ddb4ca6022e9 # v2.1.5
        with:
          project_id: "prod-images-c6e5"
      # use public chainguard provider.
      - uses: chainguard-dev/setup-chainctl@f4ed65b781b048c44d4f033ae854c025c5531c19 # v0.3.2
        with:
          # Managed here:
          # https://github.com/chainguard-dev/mono/blob/main/env/chainguard-images/iac/enterprise-packages-pusher.tf
          identity: "ce2d1984a010471142503340d670612d63ffb9f6/7706928ca9a11c7c"
      - name: 'Backfill packages to apk.cgr.dev'
        run: |
          set -e
          # Populate the token here, since chainctl auth token
          # doesn't support all of the options we need.
          chainctl auth login --audience apk.cgr.dev \
            --identity "ce2d1984a010471142503340d670612d63ffb9f6/7706928ca9a11c7c"
          echo "::add-mask::$(chainctl auth token --audience apk.cgr.dev)"

          for arch in "aarch64" "x86_64"; do
            echo "Processing ${arch}"
            while IFS= read -r pkg; do
              # Ignore empty lines and comments
              if [[ -z "${pkg}" ]]; then
                continue
              fi
              if [[ "${pkg}" == \#* ]]; then
                continue
              fi

              tok=$(chainctl auth token --audience apk.cgr.dev)
              tmp=$(mktemp -d)

              # Check if package already exists in apk.cgr.dev
              code=$(curl -s -o /dev/null --head -w "%{http_code}" --user "user:${tok}" "https://apk.cgr.dev/chainguard-private/${arch}/${pkg}")
              if [ $code == "303" ]; then
                echo "Package already exists: ${pkg}"
                continue
              elif [ $code != "404" ]; then
                echo "Unexpected response code: $code"
                exit 1
              fi

              # Get package from GCS, continue if it doesn't exist (e.g., not in enterprise)
              echo "Downloading ${pkg} from GCS"
              gsutil cp gs://chainguard-enterprise-registry-destination/os/${arch}/${pkg} ${tmp}/ > /dev/null 2>&1 || continue
              echo "Downloaded ${pkg} from GCS"

              echo "Uploading ${pkg} to apk.cgr.dev"
              curl --fail -X POST \
                --user "user:${tok}" \
                -T ${tmp}/${pkg} \
                "https://apk.cgr.dev/chainguard-private/${arch}/${pkg}"
              echo "Uploaded ${pkg} to apk.cgr.dev"
              rm ${tmp}/${pkg}
            done < backfill-packages.txt
          done
      - uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
      - uses: rtCamp/action-slack-notify@e31e87e03dd19038e411e38ae27cbad084a90661 # v2.3.3
        if: failure()
        env:
          SLACK_ICON: http://github.com/chainguard-dev.png?size=48
          SLACK_USERNAME: guardian
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: chainguard-images-alerts
          SLACK_COLOR: '#8E1600'
          MSG_MINIMAL: 'true'
          SLACK_TITLE: '[backfill-packages-enterprise] failure: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          SLACK_MESSAGE: |
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
