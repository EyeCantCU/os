name: Lint PRs

on:
  pull_request_target:
    branches: ['main']

jobs:
  lint:
    name: Lint PRs
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Update wolfi-dev/os
      - name: update wolfi-dev/os
        run: git submodule update --init --remote ./os

      # Auth and update enterprise-packages
      - uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
        id: octo-sts-enterprise
        with:
          scope: chainguard-dev/enterprise-packages
          identity: stereo-sync
      - name: update enterprise-packages
        run: |
          git submodule set-url enterprise-packages "https://${{github.actor}}:${{ steps.octo-sts-enterprise.outputs.token }}@github.com/chainguard-dev/enterprise-packages"
          git submodule update --init --remote ./enterprise-packages
          git submodule set-url enterprise-packages "https://github.com/chainguard-dev/enterprise-packages"

      # Auth and update extra-packages
      - uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
        id: octo-sts-extra
        with:
          scope: chainguard-dev/extra-packages
          identity: stereo-sync
      - name: update extra-packages
        run: |
          git submodule set-url extra-packages "https://${{github.actor}}:${{ steps.octo-sts-extra.outputs.token }}@github.com/chainguard-dev/extra-packages"
          git submodule update --init --remote ./extra-packages
          git submodule set-url extra-packages "https://github.com/chainguard-dev/extra-packages"

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: stable

      - run: go install ./cmd/stereo

      - run: stereo lint
