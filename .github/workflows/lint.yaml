name: Lint PRs

on:
  pull_request_target:
    branches: ['main']

jobs:
  lint:
    name: Lint PRs
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: step-security/harden-runner@4d991eb9b905ef189e4c376166672c3f2f230481 # v2.11.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: stable

      - run: go install ./cmd/stereo

      # This allows chainguard-dev/stereo to resolve packages from apk.cgr.dev/chainguard-private
      - uses: chainguard-dev/setup-chainctl@8d93dcbef466d3cf3533f67084f52eb74ef9d262 # v0.2.4
        with:
          identity: "ce2d1984a010471142503340d670612d63ffb9f6/3bd54d737839b737"

      - run: |
          stereo lint
          stereo unguarded
