name: "Build and push vm images"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      BUILD_TIMESTAMP: ${{ steps.timestamp.outputs.BUILD_TIMESTAMP }}
    steps:
      - id: timestamp
        run: |
          echo BUILD_TIMESTAMP=$(date --utc "+%Y%m%d-%H%M") >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest-16-cores
    needs: init
    env:
      BUILD_TIMESTAMP: ${{ needs.init.outputs.BUILD_TIMESTAMP }}

    permissions:
      contents: read
      issues: write
      id-token: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64
        cloud:
          - aws
          - azure
          - gcp
          - qemu

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # use public chainguard provider.
      - uses: chainguard-dev/setup-chainctl@2302a56a61228140753b428d1018cb0d0addbec6 # v0.3.0
        with:
            identity: "ce2d1984a010471142503340d670612d63ffb9f6/381a2db906b88c20"

      - name: Get apk.cgr.dev token
        run: |
          chainctl auth login --identity "ce2d1984a010471142503340d670612d63ffb9f6/381a2db906b88c20" --audience apk.cgr.dev
          cred=$(chainctl auth token --audience apk.cgr.dev)
          echo "HTTP_AUTH=basic:apk.cgr.dev:user:$cred" >> $GITHUB_ENV

      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: stable

      # Add a block like this in a separate PR *before* landing tests in a new module.
      - name: Install grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Install deps
        run: |
          make install-deps

      - name: make clean
        run: |
          make clean

      - name: make apkoaas
        run: |
          make apkoaas

      - name: make builder
        run: |
          make builder

      - name: make disks
        run: |
          make ARCH=${{ matrix.arch }} disks-${{ matrix.cloud }}

      - name: scan disks
        run: |
          echo "scanning ${{ matrix.arch }} disks-${{ matrix.cloud }}"
          # Scan for CVEs, fail early
          for disk in output/${{ matrix.arch }}/*; do
            grype sbom:${disk}/syft.sbom.json > ${disk}/$(basename $disk)-${{ matrix.arch }}-${{ matrix.cloud }}-${{ env.BUILD_TIMESTAMP }}-grype.output || true
            mv ${disk}/syft.sbom.json ${disk}/$(basename $disk)-${{ matrix.arch }}-${{ matrix.cloud }}-${{ env.BUILD_TIMESTAMP }}-syft.sbom.json
          done

      - name: upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.cloud }}-${{ matrix.arch }}-${{ env.BUILD_TIMESTAMP }}
          path: output/${{ matrix.arch }}/*/*-${{ matrix.arch }}-${{ matrix.cloud }}-${{ env.BUILD_TIMESTAMP }}-syft.sbom.json

      - name: upload grype scan output artifact
        uses: actions/upload-artifact@v4
        with:
          name: grype-${{ matrix.cloud }}-${{ matrix.arch }}-${{ env.BUILD_TIMESTAMP }}
          path: output/${{ matrix.arch }}/*/*-${{ matrix.arch }}-${{ matrix.cloud }}-${{ env.BUILD_TIMESTAMP }}-grype.output

      - name: add HOME/bin to PATH
        run: |
          # ensure HOME/bin is in PATH
          d="$HOME/bin"
          mkdir -p "$d"
          p="$PATH"
          echo "original-path: $p"
          p="$d:$PATH"
          echo "new-path: $p"
          echo "PATH=$p" >> "$GITHUB_ENV"

      ## AWS
      - name: "[AWS] Setup Creds"
        if: matrix.cloud == 'aws'
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          # the secret used is the marketplace AWS account id
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/wolfi-vms-github-postsubmit-role
          aws-region: us-east-1

      - name: "[AWS] Install Deps"
        if: matrix.cloud == 'aws'
        run: |
          if out=$(command -v aws); then
              echo "already had aws: $out"
          else
              curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip awscliv2.zip
              ./aws/install --install-dir $HOME/aws-cli --bin-dir $HOME/bin
          fi
          aws --version

          if ! dpkg-query --show | grep python3-venv ; then
              sudo apt-get install --assume-yes python3-venv
          fi
          mkdir -p $HOME/venvs
          python3 -m venv $HOME/venvs/awspub

          $HOME/venvs/awspub/bin/pip install awspub
          $HOME/venvs/awspub/bin/pip show awspub

          ln -s $HOME/venvs/awspub/bin/awspub $HOME/bin/

      - name: "[AWS] Publish images"
        if: matrix.cloud == 'aws'
        run: |
          arch=${{ matrix.arch }}
          bucket=${{ secrets.AWS_BUCKET_NAME }}
          export REGIONS="us-east-1 us-west-2"
          names=$(make list-aws)
          shares="891377301584" # fips-contact for certification
          shares="$shares 607334848609" # kim_chainguard for marketplace
          shares="$shares 452336408843" # Dev for engineering
          shares="$shares 235494789672" # chainguard-vms account

          echo "publishing $names to aws. arch=$arch awsarch=$awsarch timestamp=${BUILD_TIMESTAMP}"
          make -j`nproc` --output-sync=recurse awspub PREFIX=chainguard BUILD_TIMESTAMP=${BUILD_TIMESTAMP} ARCH=${{ matrix.arch }} SSM=yes SHARE="$shares" BUCKET=$bucket

          echo "attempt new publication"
          make -j`nproc` --output-sync=recurse prodawspub BUILD_TIMESTAMP=${BUILD_TIMESTAMP} ARCH=${{ matrix.arch }}

      ## AZURE
      - name: "[AZURE] Install Deps"
        if: matrix.cloud == 'azure'
        run: |
          # Install the azure cli
          # The script sets up the key, repos and then installs the package
          # https://learn.microsoft.com/en-us/cli/azure/install-azure-cli-linux?pivots=apt
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: "[AZURE] Login"
        if: matrix.cloud == 'azure'
        uses: azure/login@v2
        with:
          # These credentials were generated on March 20 2025
          # They are good for 365 days. They belong to 'VM Image Uploader'
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: "[AZURE] Publish images"
        if: matrix.cloud == 'azure'
        run: |
          arch="${{ matrix.arch }}"
          names=$(make list-azure)
          [ -n "$names" ] || { echo "make list-azure produced empty output"; exit 1; }
          [ "$arch" = "x86_64" ] && az_arch=x64 || az_arch=arm64

          echo "publishing $names to azure. arch=$arch az_arch=$az_arch timestamp=${BUILD_TIMESTAMP}"
          for name in $names; do
              ./tools/azure-image-upload  --arch $az_arch \
              --gallery vmtesting \
              --name "chainguard-${name#azure}-${az_arch}" \
              --disk-name "chainguard-${name#azure}-${az_arch}-${BUILD_TIMESTAMP}" \
              --image-version ${BUILD_TIMESTAMP%-*}.0.0 output/$arch/$name/disk.raw
          done
          exit 0

      ## GCP
      - name: "[GCP] Install Deps"
        if: matrix.cloud == 'gcp'
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4
        with:
          project_id: wolfi-vm

      - name: "[GCP] Setup Creds"
        if: matrix.cloud == 'gcp'
        id: 'auth'
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: 'projects/212178706475/locations/global/workloadIdentityPools/ci-pool/providers/ci-provider'
          service_account: 'github-ci@wolfi-vm.iam.gserviceaccount.com'

      - name: "[GCP] configure gcloud"
        if: matrix.cloud == 'gcp'
        run: |
          gcloud config set storage/parallel_composite_upload_enabled True

      - name: "[GCP] Publish images"
        if: matrix.cloud == 'gcp'
        run: |
          arch="${{ matrix.arch }}"
          names=$(make list-gcp)
          [ -n "$names" ] || { echo "make list-gcp produced empty output"; exit 1; }

          [ "$arch" = "x86_64" ] && garch=amd64 || garch=arm64

          echo "publishing $names to wolfi-vm. arch=$arch garch=$garch timestamp=${BUILD_TIMESTAMP}"
          for name in $names; do
              ./tools/google-image-upload --family="chainguard-${name#gcp-}-$garch" \
                --name="chainguard-${name#gcp-}-$garch-${BUILD_TIMESTAMP}" \
                --arch="$garch" \
                output/$arch/$name/disk.raw wolfi-vm-images-workloads
          done
          # TODO Need test runs here!
          echo "publishing docker-dev to chainguard-vms-eap. arch=$arch garch=$garch timestamp=${BUILD_TIMESTAMP}"
          for name in $names; do
              # Only add docker-dev images to chainguard-vms-eap.
              if [ ${name} == "gcp-docker-dev" ]; then
                GCP_PROJECT="chainguard-vms-eap" ./tools/google-image-upload \
                  --family="chainguard-${name#gcp-}-$garch" \
                  --name="chainguard-${name#gcp-}-$garch-${BUILD_TIMESTAMP}" \
                  --arch="$garch" \
                  output/$arch/$name/disk.raw wolfi-vm-images-workloads
              fi
          done

      ## QEMU
      - name: "[QEMU] Publish images"
        if: matrix.cloud == 'qemu'
        run: |
          arch="${{ matrix.arch }}"
          names=$(make list-qemu)
          [ -n "$names" ] || { echo "make list-qemu produced empty output"; exit 1; }

          echo "publishing $names to qemu. arch=$arch timestamp=${BUILD_TIMESTAMP}"
          find output/$arch/ -type f | xargs ls -l
          exit 0
