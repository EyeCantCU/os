name: "Build and push generic images"

on:
  pull_request_target:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      issues: write
      id-token: write
      actions: read
    runs-on: ubuntu-latest-16-cores
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: chainguard-dev/setup-chainctl@8d93dcbef466d3cf3533f67084f52eb74ef9d262 # v0.2.4
        with:
          identity: "ce2d1984a010471142503340d670612d63ffb9f6/381a2db906b88c20"
          env-auth: true

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: stable
      - run: go install chainguard.dev/apko@latest

      - name: Install deps
        run: |
          sudo apt-get install -y qemu-system-x86

      - name: Build disks
        run: |
          make clean

      - name: Builder setup
        run: |
          make builder

      - name: Disks x86_64
        run: |
          make ARCH=x86_64 disks

      - name: Disks aarch64
        run: |
          make ARCH=aarch64 disks

      - uses: 'actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08' # v4.6.0
        with:
          name: 'disks'
          path: 'output'

      # TODO: Define this and any other required resources in Terraform.
      # gcloud iam service-accounts create github-ci --project=wolfi-vm --display-name="GitHub Actions Service Account" --description="Service account for GitHub Actions workflows"
      # gcloud projects add-iam-policy-binding wolfi-vm --member=serviceAccount:github-ci@wolfi-vm.iam.gserviceaccount.com --role=roles/storage.objectAdmin
      # gcloud projects add-iam-policy-binding wolfi-vm --member=serviceAccount:github-ci@wolfi-vm.iam.gserviceaccount.com --role=roles/iam.serviceAccountTokenCreator
      # gcloud projects add-iam-policy-binding wolfi-vm --member=serviceAccount:github-ci@wolfi-vm.iam.gserviceaccount.com --role=roles/compute.storageAdmin
      # gcloud iam workload-identity-pools create "ci-pool"   --project="wolfi-vm"   --location="global"   --display-name="Github pool"
      # gcloud iam workload-identity-pools providers create-oidc "ci-provider"   --project="wolfi-vm"   --location="global"   --workload-identity-pool="ci-pool"   --display-name="Github provider"   --attribute-mapping="google.subject=assertion.sub,attribute.actor=assertion.actor,attribute.aud=assertion.aud"   --issuer-uri="https://token.actions.githubusercontent.com" --attribute-mapping="google.subject=assertion.sub,attribute.repository=assertion.repository" --attribute-condition="assertion.repository_owner=='chainguard-dev' && assertion.ref=='refs/heads/main'"
      # gcloud iam service-accounts add-iam-policy-binding github-ci@wolfi-vm.iam.gserviceaccount.com  --role=roles/iam.workloadIdentityUser   --member="principalSet://iam.googleapis.com/projects/212178706475/locations/global/workloadIdentityPools/ci-pool/attribute.repository/chainguard-dev/wolfi-vm"
      # gcloud storage buckets add-iam-policy-binding  gs://wolfi-vm-images-workloads     --role=roles/storage.objectCreator     --member="principal://iam.googleapis.com/projects/212178706475/locations/global/workloadIdentityPools/ci-pool/subject/ci-provider"
      - name: Setup Google auth
        if: github.ref == 'refs/heads/main'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/212178706475/locations/global/workloadIdentityPools/ci-pool/providers/ci-provider'
          service_account: 'github-ci@wolfi-vm.iam.gserviceaccount.com'
      - name: Publish Google images
        if: github.ref == 'refs/heads/main'
        run: |
          export GCP_PROJECT=wolfi-vm
          now=$(date --utc "+%Y%m%d-%H%M")
          for name in generic google workstation; do
            for arch in x86_64 aarch64; do
              [ "$arch" = "x86_64" ] && garch=amd64 || garch=arm64
              ./tools/google-image-upload --family="chainguard-$name-$garch" \
                --name="chainguard-$name-$garch-$now" \
                output/$arch/$name/disk.raw wolfi-vm-images-workloads
            done
          done
