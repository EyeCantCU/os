name: Delete old branches

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup_old_branches:
    runs-on: ubuntu-latest

    if: github.repository == 'chainguard-dev/enterprise-packages'

    permissions:
      id-token: write

    steps:
      - uses: step-security/harden-runner@446798f8213ac2e75931c1b0769676d927801858 # v2.10.0
        with:
          egress-policy: audit

      - uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: delete-branches

      # this need to point to main to always get the latest action
      - uses: wolfi-dev/actions/install-wolfictl@main # main

      - name: Delete Branches that matches wolfictl-
        run: |
          wolfictl gh gc branch https://github.com/chainguard-dev/enterprise-packages --match "wolfictl-"
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}

      - name: Delete Branches that matches cve-
        run: |
          wolfictl gh gc branch https://github.com/chainguard-dev/enterprise-packages --match "cve-"
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
