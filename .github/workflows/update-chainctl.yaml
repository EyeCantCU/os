name: Update chainctl

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Triggers the workflow every day

permissions:
  contents: read
  id-token: write

env:
  GIT_AUTHOR_NAME: wolfi-bot
  GIT_AUTHOR_EMAIL: 121097084+wolfi-bot@users.noreply.github.com

jobs:
  update:
    name: Update chainctl
    if: github.repository == 'chainguard-dev/extra-packages'
    runs-on: ubuntu-latest

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@0080882f6c36860b6ba35c610c98ce87d4e2f26f # v2.10.2
      with:
        egress-policy: audit

    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - uses: chainguard-dev/actions/setup-gitsign@7e52f7c320c50ffc61b5720ab5b05470b2dc0c29 # main

    - uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
      id: octo-sts
      with:
        scope: ${{ github.repository }}
        identity: update-chainctl

    - uses: chainguard-dev/actions/setup-chainctl@7e52f7c320c50ffc61b5720ab5b05470b2dc0c29 # main
    - uses: chainguard-dev/actions/setup-melange@7e52f7c320c50ffc61b5720ab5b05470b2dc0c29 # main
    - id: bump
      run: |
        echo "version=0" >> "$GITHUB_OUTPUT"
        version=$(chainctl version -ojson | jq -r .gitVersion)
        if [[ $version == $(yq -r .package.version chainctl.yaml) ]]; then
          echo "No new version available"
          exit 0
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        melange bump chainctl.yaml $version

    - uses: peter-evans/create-pull-request@5e914681df9dc83aa4e4905692ca88beb2f9e91f # v7.0.5
      if: steps.bump.outputs.version != 0
      with:
        token: ${{ steps.octo-sts.outputs.token }}
        commit-message: "chainctl/${{ steps.bump.outputs.version }} package update"
        title: "chainctl/${{ steps.bump.outputs.version }} package update"
        branch: update-chainctl
        base: main
        labels: |
          request-version-update
          automated pr
