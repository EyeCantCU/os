name: Update chainctl

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *" # Triggers the workflow every day

permissions:
  contents: read
  id-token: write

env:
  GIT_AUTHOR_NAME: wolfi-bot
  GIT_AUTHOR_EMAIL: 121097084+wolfi-bot@users.noreply.github.com

jobs:
  update:
    name: Update chainctl
    if: github.repository == 'chainguard-dev/extra-packages'
    runs-on: ubuntu-latest

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@63c24ba6bd7ba022e95695ff85de572c04a18142 # v2.7.0
      with:
        egress-policy: audit

    - uses: actions/checkout@1d96c772d19495a3b5c517cd2bc0cb401ea0529f # v4.1.3

    - uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
      id: octo-sts
      with:
        scope: ${{ github.repository }}
        identity: update-chainctl

    - uses: chainguard-dev/actions/setup-chainctl@7e52f7c320c50ffc61b5720ab5b05470b2dc0c29 # main
    - uses: chainguard-dev/actions/setup-melange@7e52f7c320c50ffc61b5720ab5b05470b2dc0c29 # main
    - run: |
        version=$(chainctl version -ojson | jq -r .gitVersion)
        echo "version=${version}" >> $GITHUB_ENV
        melange bump chainctl.yaml $version

    - uses: peter-evans/create-pull-request@9153d834b60caba6d51c9b9510b087acf9f33f83 # v6.0.4
      with:
        token: ${{ steps.octo-sts.outputs.token }}
        commit-message: "chainctl/${version} package update"
        title: "chainctl/${env.version} package update"
        branch: update-chainctl
        base: main
        labels: request-version-update
