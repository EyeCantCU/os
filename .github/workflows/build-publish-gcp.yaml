name: "Build and push GCP VMs images"

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      notify-slack:
        type: boolean
        required: false
        default: false
        description: Notify slack when the workflow finishes.
      notify-slack-success:
        type: boolean
        required: false
        default: true
        description: Send notifications on success as well as failure.
      with-compliance-scan:
        type: boolean
        required: true
        description: Generate reports for CIS and STIG compliance

permissions: {}

# Allow only one workflow run at a time
concurrency:
  group: 'release-gcp'
  cancel-in-progress: false

jobs:
  init:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core
    outputs:
      BUILD_TIMESTAMP: ${{ steps.timestamp.outputs.BUILD_TIMESTAMP }}
    steps:
      - id: timestamp
        run: |
          echo BUILD_TIMESTAMP=$(date --utc "+%Y%m%d-%H%M") >> "$GITHUB_OUTPUT"

  gcp-build-push:
    runs-on: ubuntu-8-core
    needs:
      - init

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    env:
      BUILD_TIMESTAMP: ${{ needs.init.outputs.BUILD_TIMESTAMP }}
      VM_ARCH: ${{ matrix.arch }}
      VM_CLOUD: "gcp"
      WITH_COMPLIANCE_SCAN: ${{ github.event.inputs.with-compliance-scan || 'true' }}

    steps:
      - uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@3e8a2a226fad9e1ecbf2d359b8a7697554a4ac6d # v1.5.10

      - name: Checkout source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build vms disks
        uses: './.github/actions/build-disks'
        with:
          cg_identity: "ce2d1984a010471142503340d670612d63ffb9f6/381a2db906b88c20"
          vm_group: "gcp"
          arch: '${{ matrix.arch }}'

      - name: Scan disks
        uses: './.github/actions/scan-disks'
        with:
          vm_group: "gcp"
          arch: '${{ matrix.arch }}'

      - name: add HOME/bin to PATH
        run: |
          # ensure HOME/bin is in PATH
          d="$HOME/bin"
          mkdir -p "$d"
          p="$PATH"
          echo "original-path: $p"
          p="$d:$PATH"
          echo "new-path: $p"
          echo "PATH=$p" >> "$GITHUB_ENV"

      - name: "Setup GCP Creds"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/674489516262/locations/global/workloadIdentityPools/staging-wolfi-vm/providers/github-provider'
          service_account: 'staging-vms-post@staging-vms-h8zx.iam.gserviceaccount.com'

      - name: "Install GCP Deps"
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: staging-vms-h8zx

      - name: "Configure gcloud"
        run: |
          gcloud config set storage/parallel_composite_upload_enabled True

      - name: "Publish GCP Images to staging"
        run: |
          arch="${{ env.VM_ARCH }}"
          names=$(make list-gcp)
          [ -n "$names" ] || { echo "make list-gcp produced empty output"; exit 1; }

          make -j$(nproc) --output-sync=recurse publish-gcp PREFIX=chainguard PUBLISH_TARGET=staging ARCH=$arch

      - name: "Test GCP Images in staging"
        uses: './.github/actions/vms-test'
        with:
          cloud_provider: "gcp"
          vm_group: "gcp"
          arch: '${{ matrix.arch }}'
          opts: |
            -- --project="staging-vms-h8zx" --service-account="default" \
            --zone="us-central1-a" \
            --gcp-inputs="./output" --gcp-input-filename="publish.staging.yaml"
          with-compliance-scan: '${{ env.WITH_COMPLIANCE_SCAN }}'

      # Publish to the registry
      - name: Publish GCP images to the registry
        continue-on-error: true
        run: |
          arch="${{ env.VM_ARCH }}"
          make -j$(nproc) --output-sync=recurse publish-registry-gcp ARCH=$arch

      # Setup GCP for the wolfi-vm gcp project (prod)
      # after testing in staging
      - name: "Setup GCP Creds"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/212178706475/locations/global/workloadIdentityPools/ci-pool/providers/ci-provider'
          service_account: 'github-ci@wolfi-vm.iam.gserviceaccount.com'

      - name: "Install GCP Deps"
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: wolfi-vm

      - name: "Configure gcloud"
        run: |
          gcloud config set storage/parallel_composite_upload_enabled True

      - name: "Publish GCP Internal and Workstation tested images"
        run: |
          arch="${{ env.VM_ARCH }}"
          names=$(make list-gcp)
          [ -n "$names" ] || { echo "make list-gcp produced empty output"; exit 1; }

          make -j$(nproc) --output-sync=recurse publish-gcp PREFIX=chainguard PUBLISH_TARGET=production ARCH=$arch

      - name: "Publish GCP Images to eap"
        run: |
          arch="${{ env.VM_ARCH }}"

          make -j$(nproc) --output-sync=recurse publish-gcp-docker-slim publish-gcp-docker-full PREFIX=chainguard PUBLISH_TARGET=eap ARCH=$arch

      - uses: './.github/actions/notify-slack'
        if: ${{ (inputs.notify-slack-success || !success()) && (github.event_name == 'schedule' || inputs.notify-slack) }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_INPUT }}
          title: ${{ github.workflow }} (${{ matrix.arch }}) ${{ job.status }}
          message-color: ${{ job.status == 'success' && '#3fb950' || '#f85149'}}
          text: |
            For detailed logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Or run ./hack/fetch-test-result -c ${{ env.VM_CLOUD }} -r ${{ github.run_id }} -a ${{ matrix.arch }}
          unfurl-links: true
