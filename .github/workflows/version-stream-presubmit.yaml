name: Version Stream Presubmit Lint

on:
  pull_request_target:
    branches: ['main']

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  validate:
    permissions:
      contents: read
      id-token: write
      pull-requests: read

    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2 # v2.13.3
        with:
          egress-policy: audit

      - name: Check out version-streams
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: chainguard-dev/mono
          identity: version-stream-presubmit

      - name: Checkout chainguard-dev/mono
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: chainguard-dev/mono
          token: ${{ steps.octo-sts.outputs.token }}
          ref: main
          path: mono

      - name: Build linter
        working-directory: ./mono/bots/version-reconciler/cmd/linter
        run: |
          go build -o ~/linter .

      - name: Validate version streams
        run: |
          git log
          ~/linter validate --base-commit ${{ github.event.pull_request.base.sha || github.sha }}
