name: Docs - lint

on:
  push:
    branches:
      - gh-readonly-queue/main/**
  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.yaml"
      - "*.env"
      - "Makefile"
      - ".github/workflows/dag-push-enterprise.yaml"

permissions:
  contents: read

jobs:
  lint:
    name: Wolfictl Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@5c7944e73c4c2a096b17a9cb74d65b6c2bbafbde # v2.9.1
        with:
          egress-policy: audit

      - run: 'echo "No lint required"'
