name: Docs - lint

on:
  push:
    branches:
      - gh-readonly-queue/main/**
  pull_request:
    branches:
      - main
    paths-ignore:
      - "*.yaml"
      - "*.env"
      - "Makefile"
      - ".github/workflows/dag-push-enterprise.yaml"

permissions:
  contents: read

jobs:
  lint:
    name: Wolfictl Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@17d0e2bd7d51742c71671bd19fa12bdc9d40a3d6 # v2.8.1
        with:
          egress-policy: audit

      - run: 'echo "No lint required"'
