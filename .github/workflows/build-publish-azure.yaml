name: "Build and push AZURE VMs images"

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      notify-slack:
        type: boolean
        required: false
        default: false
        description: Notify slack when the workflow finishes.
      notify-slack-success:
        type: boolean
        required: false
        default: true
        description: Send notifications on success as well as failure.
      with-compliance-scan:
        type: boolean
        required: true
        description: Run CIS Benchmarks compliance scanning and generate a report

permissions: {}

# Allow only one workflow run at a time
concurrency:
  group: 'release-azure'
  cancel-in-progress: false

jobs:
  init:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core
    outputs:
      BUILD_TIMESTAMP: ${{ steps.timestamp.outputs.BUILD_TIMESTAMP }}
    steps:
      - id: timestamp
        run: |
          echo BUILD_TIMESTAMP=$(date --utc "+%Y%m%d-%H%M") >> "$GITHUB_OUTPUT"

  azure-build-push:
    runs-on: ubuntu-8-core
    needs:
      - init

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    env:
      BUILD_TIMESTAMP: ${{ needs.init.outputs.BUILD_TIMESTAMP }}
      VM_ARCH: ${{ matrix.arch }}
      VM_CLOUD: "azure"
      WITH_COMPLIANCE_SCAN: ${{ github.event.inputs.with-compliance-scan || 'false' }}

    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@8e97c1fc72515d627456cb0b92e9c9f299356375 # v1.5.2

      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build vms disks
        uses: './.github/actions/build-disks'
        with:
          cg_identity: "ce2d1984a010471142503340d670612d63ffb9f6/381a2db906b88c20"
          vm_group: "azure"
          arch: '${{ matrix.arch }}'

      - name: Scan disks
        uses: './.github/actions/scan-disks'
        with:
          cloud_provider: "azure"
          arch: '${{ matrix.arch }}'

      - name: Setup environment variables
        run: |
          # ensure HOME/bin is in PATH
          d="$HOME/bin"
          mkdir -p "$d"
          p="$PATH"
          echo "original-path: $p"
          p="$d:$PATH"
          echo "new-path: $p"
          echo "PATH=$p" >> "$GITHUB_ENV"

      - name: "Install Azure Deps"
        run: |
          # Install the azure cli
          # The script sets up the key, repos and then installs the package
          # https://learn.microsoft.com/en-us/cli/azure/install-azure-cli-linux?pivots=apt
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Login to Azure staging
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          # generated in mono https://github.com/chainguard-dev/mono/tree/main/env/azure/chainguard-vms-staging/iac/200-infra
          client-id: "c0acffef-1388-4428-be1c-dd84b8cbb070"
          tenant-id: "32b8c550-a021-45aa-b9ba-66ccba087fea"
          subscription-id: "ad60e736-b0ce-432e-b77c-4b8218f452ae"

      # Token expires after 5 minutes, and we need it to re-auth in the background
      # we can run tests for longer than 60 minutes. Every 4 minutes, refresh the
      # token and use it to login again.
      - name: Fetch staging OID token every 4 mins
        shell: bash
        run: |
          while true; do
            test -f .stop-refreshing-staging-token >/dev/null 2>&1 && break
            token_request=$ACTIONS_ID_TOKEN_REQUEST_TOKEN
            token_uri=$ACTIONS_ID_TOKEN_REQUEST_URL
            token=$(curl -H "Authorization: bearer $token_request" "${token_uri}&audience=api://AzureADTokenExchange" | jq .value -r)
            az login --service-principal -u "c0acffef-1388-4428-be1c-dd84b8cbb070" -t "32b8c550-a021-45aa-b9ba-66ccba087fea" --federated-token $token --output none
            # Sleep for 4 minutes
            sleep 240
          done &

      - name: "Publish Azure Images to staging"
        run: |
          make publish-azure -j$(nproc) --output-sync=recurse ARCH="${{ env.VM_ARCH }}" PUBLISH_TARGET=staging PREFIX=chainguard

      - name: "Test Azure Images in staging"
        uses: "./.github/actions/vms-test"
        with:
          cloud_provider: "azure"
          vm_group: "azure"
          arch: "${{ matrix.arch }}"
          opts: |
            -- --subscription-id="ad60e736-b0ce-432e-b77c-4b8218f452ae" \
            --resource-group=chainguard-vms-staging \
            --azure-inputs="./output" --azure-input-filename="publish.staging.json"
          with-compliance-scan: '${{ env.WITH_COMPLIANCE_SCAN }}'

      - name: Stop refreshing staging OID token
        run: touch .stop-refreshing-staging-token

      - name: Login to Azure prod
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          # generated in mono https://github.com/chainguard-dev/mono/tree/main/env/azure/chainguard-vms-prod/iac/200-infra
          client-id: "c5a91a71-f2b4-48b8-8604-dedfc7a258b2"
          tenant-id: "32b8c550-a021-45aa-b9ba-66ccba087fea"
          subscription-id: "ad60e736-b0ce-432e-b77c-4b8218f452ae"

      - name: "Publish Azure Images to EAP"
        run: |
          make publish-azure-docker-dev publish-azure-eap-dev ARCH="${{ env.VM_ARCH }}" PUBLISH_TARGET=eap PREFIX=chainguard

      - uses: './.github/actions/notify-slack'
        if: ${{ (inputs.notify-slack-success || failure()) && (github.event_name == 'schedule' || inputs.notify-slack) }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_INPUT }}
          title: ${{ github.workflow }} (${{ matrix.arch }}) ${{ job.status }}
          message-color: ${{ job.status == 'success' && '#3fb950' || '#f85149'}}
          text: |
            For detailed logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Or run ./hack/fetch-test-result -c ${{ env.VM_CLOUD }} -r ${{ github.run_id }}
          unfurl-links: true

  azure-partnercenter-marketplace-update:
    runs-on: ubuntu-8-core
    needs:
      - azure-build-push
      - init

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    env:
      VM_CLOUD: "azure"
      BUILD_TIMESTAMP: ${{ needs.init.outputs.BUILD_TIMESTAMP }}

    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@8e97c1fc72515d627456cb0b92e9c9f299356375 # v1.5.2

      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: "Install Azure Deps"
        run: |
          # Install the azure cli
          # The script sets up the key, repos and then installs the package
          # https://learn.microsoft.com/en-us/cli/azure/install-azure-cli-linux?pivots=apt
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: Login to Azure prod
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          # https://github.com/chainguard-dev/mono/blob/main/env/azure/chainguard-vms-prod/iac/200-infra/oidc-postsubmit-partnercenter.tf
          client-id: "80c3b8c4-ac4a-4fbb-9965-26175528fdf8"
          tenant-id: "32b8c550-a021-45aa-b9ba-66ccba087fea"
          subscription-id: "ad60e736-b0ce-432e-b77c-4b8218f452ae"

      - name: "Update Marketplace Technical Configuration"
        run: |
          # Update to my test offer for now
          make azure-marketplace-update-technical-plan-eap-dev \
          AZRESOURCEGROUP="chainguard-vms-prod" \
          AZGALLERY="eap_chainguard_vms" \
          AZMARKETPLACE_PLAN=eap \
          AZMARKETPLACE_OFFER=chainguard_eap \
          AZNAME="chainguard-eap-dev"

      - uses: './.github/actions/notify-slack'
        if: ${{ (inputs.notify-slack-success || failure()) && (github.event_name == 'schedule' || inputs.notify-slack) }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_INPUT }}
          title: ${{ github.workflow }} (azure-partnercenter-marketplace-update) ${{ job.status }}
          message-color: ${{ job.status == 'success' && '#3fb950' || '#f85149'}}
          text: |
            For detailed logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Or run ./hack/fetch-test-result -c ${{ env.VM_CLOUD }} -r ${{ github.run_id }} -a ${{ matrix.arch }}
          unfurl-links: true
