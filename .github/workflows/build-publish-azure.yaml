name: "Build and push AZURE VMs images"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

# Allow only one workflow run at a time
concurrency:
  group: 'release-azure'
  cancel-in-progress: false

jobs:
  init:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core
    outputs:
      BUILD_TIMESTAMP: ${{ steps.timestamp.outputs.BUILD_TIMESTAMP }}
    steps:
      - id: timestamp
        run: |
          echo BUILD_TIMESTAMP=$(date --utc "+%Y%m%d-%H%M") >> "$GITHUB_OUTPUT"

  azure-build-push:
    runs-on: ubuntu-8-core
    needs:
      - init

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    env:
      BUILD_TIMESTAMP: ${{ needs.init.outputs.BUILD_TIMESTAMP }}
      VM_ARCH: ${{ matrix.arch }}
      VM_CLOUD: "azure"

    steps:
      - uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@d9b7e22c19086f609cfeaea6d3b3e34f7ecc7266 # v1.0.6

      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build vms disks
        uses: './.github/actions/build-disks'
        with:
          cg_identity: "ce2d1984a010471142503340d670612d63ffb9f6/381a2db906b88c20"
          cloud_provider: "azure"
          arch: '${{ matrix.arch }}'

      - name: Scan disks
        uses: './.github/actions/scan-disks'
        with:
          cloud_provider: "azure"
          arch: '${{ matrix.arch }}'

      - name: Setup environment variables
        run: |
          # ensure HOME/bin is in PATH
          d="$HOME/bin"
          mkdir -p "$d"
          p="$PATH"
          echo "original-path: $p"
          p="$d:$PATH"
          echo "new-path: $p"
          echo "PATH=$p" >> "$GITHUB_ENV"
          # set az_arch
          [ "${{ env.VM_ARCH }}" = "x86_64" ] && az_arch=x64 || az_arch=arm64
          echo "az_arch=$az_arch" >> "$GITHUB_ENV"
          [ "${{ env.VM_ARCH }}" = "x86_64" ] && test_vm_size="Standard_F2s_v2" || test_vm_size="Standard_D2ps_v6"
          echo "test_vm_size=$test_vm_size" >> "$GITHUB_ENV"

      - name: "Install Azure Deps"
        run: |
          # Install the azure cli
          # The script sets up the key, repos and then installs the package
          # https://learn.microsoft.com/en-us/cli/azure/install-azure-cli-linux?pivots=apt
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      - name: "Azure Login"
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          # generated in mono https://github.com/chainguard-dev/mono/tree/main/env/azure/chainguard-vms/iac/200-infra
          client-id: "9097cd23-3633-4e75-a7a4-213b1f89a0d5"
          tenant-id: "32b8c550-a021-45aa-b9ba-66ccba087fea"
          subscription-id: "ad60e736-b0ce-432e-b77c-4b8218f452ae"

      - name: "Publish Azure Images to staging"
        run: |
          arch="${{ env.VM_ARCH }}"
          names=$(make list-azure)
          [ -n "$names" ] || { echo "make list-azure produced empty output"; exit 1; }
          az_arch="${{ env.az_arch }}"

          commit=$(git rev-parse HEAD)
          export arch
          export az_arch
          export commit

          pnames=$(echo $names)
          echo "publishing $pnames to vmtesting in azure. arch=$arch az_arch=$az_arch timestamp=${BUILD_TIMESTAMP}"
          echo "$names" | parallel -j$(nproc) --no-run-if-empty 'name={};
             $DEBUG ./tools/azure-image-upload --arch=$az_arch \
                 --gallery=vmtesting \
                 --name="chainguard${name#azure}-${az_arch}" \
                 --disk-name="chainguard${name#azure}-${az_arch}-${BUILD_TIMESTAMP}" \
                 --image-version=${BUILD_TIMESTAMP%-*}.${BUILD_TIMESTAMP#*-}.0 \
                 --tags="env=staging commit=$commit" \
                 output/$arch/$name/disk.raw'
          exit 0

      - name: "Test Azure Images in staging"
        uses: './.github/actions/vms-test'
        with:
          cloud_provider: "azure"
          arch: '${{ matrix.arch }}'
          opts: |
            -- --subscription-id="ad60e736-b0ce-432e-b77c-4b8218f452ae" \
            --resource-group=chainguard-vms --image-name="chainguard-eap-dev-${{ env.az_arch }}" \
            --image-gallery=vmtesting --resource-basename="${BUILD_TIMESTAMP}-${{env.az_arch}}" \
            --region="eastus" --image-version="${BUILD_TIMESTAMP%-*}.${BUILD_TIMESTAMP#*-}.0" \
            --image-resource-group=chainguard-vms --image-subscription-id="ad60e736-b0ce-432e-b77c-4b8218f452ae" \
            --vm-size="${{ env.test_vm_size }}"

      - name: "Publish Azure Images to EAP"
        run: |
          arch="${{ env.VM_ARCH }}"
          names=$(make list-azure)
          [ -n "$names" ] || { echo "make list-azure produced empty output"; exit 1; }
          az_arch="${{ env.az_arch }}"

          for name in $names; do
            # Create image in EAP image gallery as well.
            echo "publishing $name to chainguard_vms_eap in azure. arch=$arch az_arch=$az_arch timestamp=${BUILD_TIMESTAMP}"
            if [ "$name" == "azure-eap-dev" ]; then
              # Create image in EAP image gallery as well.
              ./tools/azure-image-upload --arch $az_arch \
              --gallery chainguard_vms_eap \
              --name "chainguard${name#azure}-${az_arch}" \
              --disk-name "chainguard${name#azure}-${az_arch}-${BUILD_TIMESTAMP}" \
              --existing-disk \
              --image-version ${BUILD_TIMESTAMP%-*}.${BUILD_TIMESTAMP#*-}.0 \
              --tags "env=eap commit=$(git rev-parse HEAD)" \
              output/$arch/$name/disk.raw
            fi
          done
          exit 0
