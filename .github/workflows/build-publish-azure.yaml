name: "Build and push AZURE VMs images"

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions: {}

# Allow only one workflow run at a time
concurrency:
  group: 'release-azure'
  cancel-in-progress: false

jobs:
  azure-build-push:

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      matrix:
        arch:
          - x86_64
          - aarch64

    uses: ./.github/workflows/.build.yaml
    with:
      cg_identity: "ce2d1984a010471142503340d670612d63ffb9f6/381a2db906b88c20"
      checkout_ref: ${{ github.sha }}
      cloud_provider: "azure"
      arch: ${{ matrix.arch }}
      push_vms: true
    secrets:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
