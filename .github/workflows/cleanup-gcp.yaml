name: "Cleanup unneeded resources in GCP"

# Run ~3 hours after build-publish to hopefully catch
# resources from the previous day's build-publish run
# as soon as they turn old enough to delete.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      notify-slack:
        type: boolean
        required: false
        default: false
        description: Notify slack when the workflow finishes.
      notify-slack-success:
        type: boolean
        required: false
        default: true
        description: Send notifications on success as well as failure.

permissions: {}

# Allow only one workflow run at a time
concurrency:
  group: 'cleanup-gcp'
  cancel-in-progress: false

jobs:
  cleanup-gcp:
    runs-on: ubuntu-8-core

    permissions:
      id-token: write # federated identity
      contents: read # checkout source

    strategy:
      fail-fast: false

    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          check-latest: true

      - name: Make cleanerupper
        run: |
          make tools/gcp-cleanup

      - name: "Setup GCP Creds"
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: 'projects/674489516262/locations/global/workloadIdentityPools/staging-wolfi-vm/providers/github-provider'
          service_account: 'staging-vms-post@staging-vms-h8zx.iam.gserviceaccount.com'

      - name: Cleanup Test Resources in GCP Staging
        run: |
          ./tools/gcp-cleanup --project=staging-vms-h8zx \
              --max-age=12h \
              --protection-tag=do-not-delete \
              --exclude-name-pattern='.*do-not-delete.*' \
              --resource-types=disks,instances,networks \
              --verbose \
              --dry-run # TODO: remove this flag when we confirm output is sane.

      - name: Cleanup Images in GCP Staging
        # Keep images around for 2 weeks for debugging
        run: |
          ./tools/gcp-cleanup --project=staging-vms-h8zx \
              --max-age=336h \
              --protection-tag=do-not-delete \
              --exclude-name-pattern='.*do-not-delete.*' \
              --resource-types=images \
              --verbose \
              --dry-run # TODO: remove this flag when we confirm output is sane.

      - uses: './.github/actions/notify-slack'
        if: ${{ (inputs.notify-slack-success || failure()) && (github.event_name == 'schedule' || inputs.notify-slack) }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_INPUT }}
          title: ${{ github.workflow }} ${{ job.status }}
          message-color: ${{ job.status == 'success' && '#3fb950' || '#f85149'}}
          text: |
            For detailed logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          unfurl-links: true
