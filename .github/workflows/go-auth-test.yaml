name: Authenticated Go Tests

on:
  # This workflow is intentionally very small, so that it is
  # as obviously correct as possible.  Add complexity to it
  # at your peril!
  pull_request_target:
    branches: [ "main" ]

jobs:
  go-auth-test:
    runs-on: ubuntu-8-core

    permissions:
      contents: read
      id-token: write # To support federating to assume chainguard identity

    steps:
      - uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - run: |
          make install-deps

      # Enable KVM
      # ref: https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          kvm-ok

      - uses: chainguard-dev/setup-chainctl@2302a56a61228140753b428d1018cb0d0addbec6 # v0.3.0
        with:
          # This is the wolfi-vm-presubmits identity maintained in:
          # env/chainguard-images/iac/wolfi-vm-presubmit.tf
          identity: ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849

      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v3.0.0
        with:
          go-version-file: './go.mod'
          check-latest: true

      # Add a block like this in a separate PR *before* landing tests in a new module.
      - name: Run apkoaas Tests
        run: |
          TMPDIR=$HOME go test -tags withauth ./...
