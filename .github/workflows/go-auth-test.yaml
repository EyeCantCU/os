name: Authenticated Go Tests

on:
  # This workflow is intentionally very small, so that it is
  # as obviously correct as possible.  Add complexity to it
  # at your peril!
  pull_request_target:
    branches:
      - "main"

permissions: {}

jobs:
  go-auth-test:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core

    permissions:
      contents: read
      id-token: write # To support federating to assume chainguard identity

    steps:
      - uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit
      - uses: chainguard-dev/actions/apt-faster@3e8a2a226fad9e1ecbf2d359b8a7697554a4ac6d # v1.5.10


      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - uses: chainguard-dev/actions/setup-melange@3e8a2a226fad9e1ecbf2d359b8a7697554a4ac6d # v1.5.10

      - run: |
          make install-deps

      # Enable KVM and Vhost
      # ref: https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
      - name: Grant kvm/vhost perms
        run: |
          set -x
          sudo tee /etc/udev/rules.d/99-kvm4all.rules <<"EOF"
          KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"
          EOF
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/vhost* /dev/kvm* || :
          sudo sh -c 'for p in kvm vhost-net vhost-vsock; do \
              d=/dev/$$p; [ -e "$$d" ] || { echo "no $$d"; continue; } ; \
              chmod ugo+rw $$d && ls -l $$d || exit; done'
          kvm-ok
          groups || :

      - uses: chainguard-dev/setup-chainctl@be0acd273acf04bfdf91f51198327e719f6af978 # v0.4.0
        with:
          # This is the wolfi-vm-presubmits identity maintained in:
          # env/chainguard-images/iac/wolfi-vm-presubmit.tf
          identity: ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849

      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: './go.mod'

      - name: Build cgr-install apk
        run: |
          make cgr-install-apk

      # Add a block like this in a separate PR *before* landing tests in a new module.
      - name: Run go tests
        run: |
          TMPDIR=$HOME make test-gotest
