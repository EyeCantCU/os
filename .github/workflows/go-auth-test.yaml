name: Authenticated Go Tests

on:
  # This workflow is intentionally very small, so that it is
  # as obviously correct as possible.  Add complexity to it
  # at your peril!
  pull_request_target:
    branches:
      - "main"

permissions: {}

jobs:
  go-auth-test:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core

    permissions:
      contents: read
      id-token: write # To support federating to assume chainguard identity

    steps:
      - uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit
      - uses: chainguard-dev/actions/apt-faster@6f4f4de7549514e7b659741b30f6476f245600dd # v1.5.3


      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - run: |
          make install-deps

      # Enable KVM
      # ref: https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          kvm-ok

      - uses: chainguard-dev/setup-chainctl@be0acd273acf04bfdf91f51198327e719f6af978 # v0.4.0
        with:
          # This is the wolfi-vm-presubmits identity maintained in:
          # env/chainguard-images/iac/wolfi-vm-presubmit.tf
          identity: ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849

      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v3.0.0
        with:
          go-version-file: './go.mod'
          check-latest: true

      # Add a block like this in a separate PR *before* landing tests in a new module.
      - name: Run go tests
        run: |
          TMPDIR=$HOME make test-gotest
