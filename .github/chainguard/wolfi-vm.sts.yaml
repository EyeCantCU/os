# Allow access in chainguard-dev/wolfi-vm CI from 
#  presubmit and build-publish workflows (presubmit-<cloud>, build-publish-<cloud>)
# This explicitly allows pull requests to federate with this trust policy
# to allow for presubmit validation, hence the .* for subject_pattern and job_workflow_ref
issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:chainguard-dev/wolfi-vm:.*
claim_pattern:
  job_workflow_ref: chainguard-dev/wolfi-vm/.github/workflows/(presubmit|build-publish)-.*.yaml@.*
permissions:
  contents: read
