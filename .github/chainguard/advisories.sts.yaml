issuer: https://token.actions.githubusercontent.com

# This explicitly allows pull requests to federate with this trust policy
# to allow for presubmit validation.
subject_pattern: repo:chainguard-dev/extra-advisories:.*

claim_pattern:
  job_workflow_ref: chainguard-dev/extra-advisories/.github/workflows/validate.yaml@.*

# to be able to clone the repo
permissions:
  contents: read
