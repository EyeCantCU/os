name: "Docker run"
description: "Run a command in a docker container"

inputs:
  run:
    type: string
    required: true
    description: Command to run
  container:
    type: string
    default: cgr.dev/chainguard/wolfi-base:latest
    required: true
  sh:
    type: string
    required: false
    default: sh

runs:
  using: docker
  image: ${{inputs.image}}
  steps:
    - if: ${{ always() }}
      shell: ${{inputs.shell}}
      run: ${{inputs.run}}
