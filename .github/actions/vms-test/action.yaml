name: "vms-test setup"
description: "Checkout and build vms-test"
inputs:
  arch:
    required: true
    default: ""
    description: "Which architecture to build tests for"
  cloud_provider:
    required: true
    default: ""
    description: "which cloud provider tests to run"
  vm_group:
    required: true
    default: ""
    description: "the group of vms - relevant for upload artifact name"
  wait_ssh_timeout:
    required: false
    default: 10m
    description: "timeout from launch to ssh available"
  metric-tags:
    required: false
    default: ""
    description: "tags to apply to test metric data. autoset tags: cloud, env, job id, commit sha & arch"
  opts:
    required: false
    default: ""
    description: "extra opts for helper script"
  with-compliance-scan:
    required: false
    default: "false"
    description: "Run CIS Benchmarks compliance scanning and generate a report"

runs:
  using: composite
  steps:
    - uses: octo-sts/action@6177b4481c00308b3839969c3eca88c96a91775f # v1.0.0
      id: octo-sts
      with:
        scope: chainguard-dev/complianceascode-content
        identity: wolfi-vm-test
      if: ${{ inputs.with-compliance-scan == 'true' }}

    - name: Clone ComplianceAsCode content repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: chainguard-dev/complianceascode-content
        fetch-depth: 1
        ref: wolfi-vm
        path: ./complianceascode-content
        token: ${{ steps.octo-sts.outputs.token }}
      if: ${{ inputs.with-compliance-scan == 'true' }}

    - name: Install dependencies for building the ComplianceAsCode content
      shell: bash
      working-directory: ./complianceascode-content
      run: |
        set -e
        sudo apt update
        sudo apt install -y \
          cmake \
          gzip \
          libxml2-utils \
          make \
          openscap-scanner \
          python3-venv \
          xsltproc
        python3 -mvenv venv
        source venv/bin/activate
        pip3 install -r requirements.txt
        cd build
        cmake ..
      if: ${{ inputs.with-compliance-scan == 'true' }}

    - name: Install dependencies for vms-test
      shell: bash
      working-directory: ./vms-test
      run: |
        ./helpers/install-deps --test-arch="$TEST_ARCHES"
      env:
        TEST_ARCHES: ${{ inputs.arch }}

    - name: Build ComplianceAsCode content
      shell: bash
      working-directory: ./complianceascode-content
      run: |
        set -e
        source venv/bin/activate
        cd build
        make chainguard
      if: ${{ inputs.with-compliance-scan == 'true' }}

    - name: Arm compliance reporting test
      shell: bash
      working-directory: ./vms-test
      run: |
        ssg_in=../complianceascode-content/build/ssg-chainguard-ds.xml
        ssg_out=pkg/test/compliance/reports/ssg/ssg-chainguard-ds.xml.gz
        gzip <"${ssg_in}" >"${ssg_out}"
      if: ${{ inputs.with-compliance-scan == 'true' }}

    - name: Build vms-test
      shell: bash
      working-directory: ./vms-test
      run: |
        make TEST_ARCHES="$TEST_ARCHES" runner/$CLOUD tests
      env:
        CLOUD: ${{ inputs.cloud_provider }}
        TEST_ARCHES: ${{ inputs.arch }}

    - name: Run vms-test tests
      shell: bash
      run: |
        mkdir ./test-results
        ./vms-test/helpers/test-wolfi-vm \
            --test-arch="$TEST_ARCHES" \
            --wolfi-vm="$PWD" "$CLOUD" "$PWD/test-results" ${{ inputs.opts }}

      env:
        CLOUD: ${{ inputs.cloud_provider }}
        TEST_ARCHES: ${{ inputs.arch }}
        WAIT_SSH_TIMEOUT: ${{ inputs.wait_ssh_timeout }}
        METRIC_TAGS: "env:staging,${{ inputs.metric-tags}}"

    - name: Extract compliance reporting artifacts
      shell: bash
      if: ${{ !cancelled() && inputs.with-compliance-scan == 'true' }}
      run: |
        mkdir compliance-reports
        cp complianceascode-content/build/ssg-chainguard-ds.xml compliance-reports/

        # e.g. "./test-results-x86_64-aws-noneks/x86_64/chainguard-agents-docker-dev/t3.medium/"
        for dir in ./test-results/*/*/*; do
          IFS=/ read -r _ _ arch image instance_type <<<"${dir}"

          artifacts="${dir}/compliance-reports-artifacts.json"
          if ! [[ -s "${artifacts}" ]]; then
            echo "Image ${image} does not have compliance reports artifacts, skipping."
            continue
          fi

          prefix="report-${image}-"
          ./tools/extract-compliance-reports \
            --output-dir compliance-reports \
            --output-prefix "${prefix}" \
            "${artifacts}"
        done

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: test-results-${{ inputs.arch }}-${{ inputs.vm_group }}
        path: ./test-results/
      if: ${{ !cancelled() }}

    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: compliance-reports-${{ inputs.arch }}-${{ inputs.vm_group }}
        path: ./compliance-reports
      if: ${{ !cancelled() && inputs.with-compliance-scan == 'true' }}
