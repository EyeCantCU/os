package:
  name: chart-iamguarded-mongodb
  version: "16.5.25"
  epoch: 1
  description: mongodb iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: mongodb/${{package.version}}
      expected-commit: 4c67ae956cc4bad055007e3ee446c4e33a7e2e96

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/mongodb

  - uses: charts/package
    with:
      chart-path: iamguarded/mongodb

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: mongodb/
    use-tag: true
    tag-filter-prefix: mongodb/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /mongodb
