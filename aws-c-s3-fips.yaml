package:
  name: aws-c-s3-fips
  version: "0.8.6"
  epoch: 0
  description: "AWS C99 library implementation for communicating with the S3 service (FIPS)"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - aws-c-auth-fips
      - aws-c-cal-fips
      - aws-c-common
      - aws-c-http-fips
      - aws-c-io-fips
      - aws-checksums
    provides:
      - aws-c-s3=${{package.full-version}}
    provider-priority: 20

environment:
  contents:
    packages:
      - aws-c-auth-fips-dev
      - aws-c-cal-fips-dev
      - aws-c-common-dev
      - aws-c-compression-dev
      - aws-c-http-fips-dev
      - aws-c-io-fips-dev
      - aws-c-sdkutils-dev
      - aws-checksums-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - s2n-tls-fips-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 36e2c3717a65ada2049602e147553999babdac4d
      repository: https://github.com/awslabs/aws-c-s3
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-s3-fips-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-s3-fips
      provides:
        - aws-c-s3-dev=${{package.full-version}}
      provider-priority: 20
    description: aws-c-s3-fips dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-s3
    strip-prefix: v
    use-tag: true
