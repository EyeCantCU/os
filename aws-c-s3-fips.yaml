package:
  name: aws-c-s3-fips
  version: "0.11.2"
  epoch: 0
  description: "AWS C99 library implementation for communicating with the S3 service (FIPS)"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - aws-c-auth-fips
      - aws-c-cal-fips
      - aws-c-common
      - aws-c-http-fips
      - aws-c-io-fips
      - aws-checksums
      - s2n-tls-fips

vars:
  aws-lc-lib-dir: /usr/lib/aws-lc
  aws-lc-include-dir: /usr/include/aws-lc
  aws-lc-crypto-lib: /usr/lib/aws-lc/libcrypto.so

environment:
  contents:
    packages:
      - aws-c-auth-fips-dev
      - aws-c-cal-fips-dev
      - aws-c-common-dev
      - aws-c-compression-dev
      - aws-c-http-fips-dev
      - aws-c-io-fips-dev
      - aws-c-sdkutils-dev
      - aws-checksums-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - s2n-tls-fips-dev
      - samurai
  environment:
    CMAKE_PREFIX_PATH: ${{vars.aws-lc-lib-dir}}
    CFLAGS: "-I${{vars.aws-lc-include-dir}}"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 4782ecb44b650a1aa3122c40f03a97cfb8c0ccb5
      repository: https://github.com/awslabs/aws-c-s3
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_PREFIX_PATH=/usr \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_INSTALL_RPATH=${{vars.aws-lc-lib-dir}} \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux \
        -Dcrypto_INCLUDE_DIR=${{vars.aws-lc-include-dir}} \
        -Dcrypto_SHARED_LIBRARY=${{vars.aws-lc-crypto-lib}}

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-s3-fips-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-s3-fips
    description: aws-c-s3-fips dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-s3
    strip-prefix: v
    use-tag: true
