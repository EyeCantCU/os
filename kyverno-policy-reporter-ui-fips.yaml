package:
  name: kyverno-policy-reporter-ui-fips
  version: 1.9.2
  epoch: 1
  description: Policy Reporter UI
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - git
      - go-fips-1.22
      - node-gyp
      - nodejs-18
      - npm
      - openssl
      - python3
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kyverno/policy-reporter-ui
      tag: v${{package.version}}
      expected-commit: 5b03edd71958dca47dd13bca7de95294a332817c

  - uses: go/bump
    with:
      modroot: ./server
      deps: golang.org/x/net@v0.23.0 google.golang.org/protobuf@v1.33.0

  - runs: |
      export NODE_OPTIONS=--openssl-legacy-provider
      npm install
      npm run generate

      mkdir -p ${{targets.destdir}}/app
      cp -R ./dist ${{targets.destdir}}/app/dist

  - uses: go/build
    with:
      go-package: go-fips
      output: policyreporter-ui
      modroot: ./server
      packages: .

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        policyreporter-ui --help

subpackages:
  - name: kyverno-policy-reporter-ui-fips-compat
    description: compatibility symlinks package for policyreporter-ui Dockerfile
    pipeline:
      - runs: |
          # Symlink the binary from usr/bin to /app/
          mkdir -p ${{targets.subpkgdir}}/app
          ln -sf /usr/bin/policyreporter-ui ${{targets.subpkgdir}}/app/policyreporter-ui

update:
  enabled: true
  github:
    identifier: kyverno/policy-reporter-ui
    strip-prefix: v
    tag-filter: v1
    use-tag: true
