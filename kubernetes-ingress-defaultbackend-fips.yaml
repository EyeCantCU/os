package:
  name: kubernetes-ingress-defaultbackend-fips
  version: "1.37.3"
  epoch: 2 # CVE-2025-61729
  description: 'A simple web server that respond 404 common used in kubernetes ingress, serve pages 404 at root and 200 at /healthz'
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/ingress-gce
      tag: v${{package.version}}
      expected-commit: 89b9465ca5f661849dec0b4d81c2ca68b1eb5a14

  - uses: go/build
    with:
      packages: ./cmd/404-server
      output: defaultbackend
      ldflags: -w
      vendor: true
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: kubernetes/ingress-gce
    use-tag: true
    strip-prefix: v
  ignore-regex-patterns:
    - "1000.1.0" # Bad version

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        defaultbackend --help
