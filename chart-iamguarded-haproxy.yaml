package:
  name: chart-iamguarded-haproxy
  version: "2.2.34"
  epoch: 2
  description: Haproxy iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: haproxy/${{package.version}}
      expected-commit: 88590a857b3aa4ad3c6038053f82c337e9226505

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/haproxy

  - uses: charts/package
    with:
      chart-path: iamguarded/haproxy

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: haproxy/
    use-tag: true
    tag-filter-prefix: haproxy/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /haproxy
