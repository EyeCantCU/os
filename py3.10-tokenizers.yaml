package:
  name: py${{vars.py-version}}-tokenizers
  version: 0.21.0
  epoch: 0
  description: Fast and customizable tokenizers for Natural Language Processing pipelines
  copyright:
    - license: Apache-2.0

vars:
  py-version: 3.10

environment:
  contents:
    packages:
      - build-base
      - busybox
      - maturin
      - py${{vars.py-version}}-build
      - py${{vars.py-version}}-installer
      - py${{vars.py-version}}-maturin
      - py${{vars.py-version}}-pip
      - py${{vars.py-version}}-wheel
      - python-${{vars.py-version}}

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/20/41/c2be10975ca37f6ec40d7abd7e98a5213bb04f284b869c1a24e6504fd94d/tokenizers-${{package.version}}.tar.gz
      expected-sha512: 61cef70f63b9193be6e5e2c8962e424d1ebed29ff9be6a6bd2f58d5266f4da83d93ec2f3ca5c7b222628e80c4ec8f6003d8bbaddc4a13ef2758ffd8478edfa24

  - uses: py/pip-build-install
    with:
      python: python${{vars.py-version}}
      dest: ${{targets.contextdir}}

  - uses: strip

test:
  environment:
    contents:
      packages:
        - python-${{vars.py-version}}
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.py-version}}
        import: tokenizers
    - name: verify installation
      runs: |
        echo "
        from tokenizers import Tokenizer
        from tokenizers.models import BPE
        from tokenizers.trainers import BpeTrainer
        from tokenizers.pre_tokenizers import Whitespace

        tokenizer = Tokenizer(BPE())

        tokenizer.pre_tokenizer = Whitespace()

        trainer = BpeTrainer(vocab_size=5000, min_frequency=2)
        tokenizer.train_from_iterator([\"Hello, world! This is a test sentence.\", \"Another example sentence.\"], trainer)

        output = tokenizer.encode(\"Hello, world! This is a test sentence.\")
        print(\"Encoded tokens:\", output.ids)
        print(\"Decoded text:\", tokenizer.decode(output.ids))
        " | python

update:
  enabled: true
  release-monitor:
    identifier: 36792
