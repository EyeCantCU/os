package:
  name: py3-termcolor
  version: 3.1.0
  epoch: 0
  description: ANSI color formatting for output in terminal
  copyright:
    - license: MIT

vars:
  pypi-package: termcolor

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-hatch-vcs
      - py3-supported-hatchling

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/termcolor/termcolor.git
      tag: ${{package.version}}
      expected-commit: 1e0ae11ba804f391c1d843c2512b37e8744b0ada

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' 2>&1 | grep -F -e "Attention!"
            import sys

            from termcolor import colored, cprint

            text = colored("Hello, World!", "red", attrs=["reverse", "blink"])
            print(text)
            cprint("Hello, World!", "green", "on_red")

            print_red_on_cyan = lambda x: cprint(x, "red", "on_cyan")
            print_red_on_cyan("Hello, World!")
            print_red_on_cyan("Hello, Universe!")

            for i in range(10):
                cprint(i, "magenta", end=" ")

            cprint("Attention!", "red", attrs=["bold"], file=sys.stderr)

            # You can also specify 0-255 RGB ints via a tuple
            cprint("Both foreground and background can use tuples", (100, 150, 250), (50, 60, 70))
            EOF

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        import: ${{vars.pypi-package}}
