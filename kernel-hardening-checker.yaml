package:
  name: kernel-hardening-checker
  version: "0.6.10.2"
  epoch: 1
  description: "A tool for checking the security hardening options of the Linux kernel "
  copyright:
    - license: GPL-3.0

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/a13xp0p0v/kernel-hardening-checker
      tag: v${{package.version}}
      expected-commit: 0ebece346f187e7d3589883cc1d194fcd1c3cda8

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{package.name}}
    description: ${{package.name}} for python${{range.key}}
    dependencies:
      provides:
        - py3-${{package.name}}
        - ${{package.name}}
      provider-priority: ${{range.value}}
    pipeline:
      - name: "Build ${{package.name}} for python${{range.key}}"
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: "Strip ${{package.name}} for python${{range.key}}"
        uses: strip

test:
  environment:
    contents:
      packages:
        - linux
  pipeline:
    - name: Verify installation
      runs: |
        kernel-hardening-checker --version 2>&1 | grep -q ${{package.version}}
        kernel-hardening-checker -h 2>&1 | grep -q "A tool for checking the security hardening options of the Linux kernel"
    - name: Run against Chainguard's kernel
      runs: |
        for config in /boot/config-*; do
          kernel-hardening-checker -c $config
        done

update:
  enabled: true
  github:
    identifier: a13xp0p0v/kernel-hardening-checker
    use-tag: true
    strip-prefix: v
