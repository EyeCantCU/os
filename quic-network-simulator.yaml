#nolint:valid-pipeline-git-checkout-tag
package:
  name: quic-network-simulator
  version: "0_git20251110"
  epoch: 0
  description: ns3-based network simulator for QUIC testing
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - coreutils
      - ethtool
      - hostname
      - iperf
      - iproute2
      - iputils
      - net-tools
      - tcpdump
      - wait-for-it
      - wget

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/quic-interop/quic-network-simulator.git
      branch: master
      expected-commit: 777f2518f0a5e606e910db46d84eb222a194df73

  - runs: |
      install -Dpm0755 -t ${{targets.destdir}}/usr/libexec/quic-network-simulator/ ./endpoint/run_endpoint.sh
      install -Dpm0755 -t ${{targets.destdir}}/usr/libexec/quic-network-simulator/ ./endpoint/setup.sh

subpackages:
  - name: quic-network-simulator-compat
    description: Compatibility subpackage for upstream image
    dependencies:
      runtime:
        - quic-network-simulator
    pipeline:
      - runs: |
          install -dpm0755 ${{targets.subpkgdir}}
          ln -s ./usr/libexec/quic-network-simulator/setup.sh ${{targets.subpkgdir}}/setup.sh
          ln -s ./usr/libexec/quic-network-simulator/run_endpoint.sh ${{targets.subpkgdir}}/run_endpoint.sh
          ln -s ./usr/bin/wait-for-it ${{targets.subpkgdir}}/wait-for-it.sh
    test:
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - quic-network-simulator-compat
        - netcat-openbsd
  pipeline:
    - uses: test/daemon-check-output
      with:
        setup: |
          echo "127.0.0.1 sim" >> /etc/hosts
        start: |
          nc -l sim 57832 &
          /run_endpoint.sh > log.txt
        expected_output: |
          IPv4 address is
