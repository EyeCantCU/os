package:
  name: flux-source-controller-fips
  version: "1.7.0"
  epoch: 0 # GHSA-2464-8j7c-4cjm
  description: The GitOps Toolkit source management component
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-16
      - gcc
      - go-fips
      - lld-16

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 39b9314d479ab0cc5aa554dab3525b9bfb80d099
      repository: https://github.com/fluxcd/source-controller
      tag: v${{package.version}}

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/bin
      CGO_ENABLED=1 CGO_LDFLAGS="-fuse-ld=lld" go build \
        -tags 'netgo,osusergo,static_build' \
        -trimpath -o "${{targets.destdir}}"/usr/bin/source-controller .

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - api/
  github:
    identifier: fluxcd/source-controller
    strip-prefix: v
    tag-filter: v

test:
  environment:
    contents:
      packages:
        - ${{package.name}}
  pipeline:
    - runs: |
        source-controller -h > output.txt 2>&1
        cat output.txt | grep "Usage of source-controller"
    - uses: test/go-fips-check
