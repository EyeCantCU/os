package:
  name: flux-source-controller-fips
  version: "1.6.1"
  epoch: 1
  description: The GitOps Toolkit source management component
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-16
      - gcc
      - go-fips
      - llvm-lld-16

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 968eb2b7241930ebbe4dfb5e0af8c1f24280dd01
      repository: https://github.com/fluxcd/source-controller
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        oras.land/oras-go@v1.2.6

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/bin
      CGO_ENABLED=1 CGO_LDFLAGS="-fuse-ld=lld" go build \
        -tags 'netgo,osusergo,static_build' \
        -trimpath -o "${{targets.destdir}}"/usr/bin/source-controller .

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - api/
  github:
    identifier: fluxcd/source-controller
    strip-prefix: v
    tag-filter: v

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    description: "compat package for iamguarded"
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p /opt/iamguarded/flux-source-controller/bin/
          ln -sf /usr/bin/source-controller /opt/iamguarded/flux-source-controller/bin/source-controller
      - uses: iamguarded/build-compat
        with:
          package: flux-source-controller
          version: ${{vars.major-version}}
      - uses: iamguarded/finalize-compat
        with:
          package: flux-source-controller
          version: ${{vars.major-version}}
    test:
      pipeline:
        - runs: |
            stat /opt/iamguarded/flux-source-controller/bin/source-controller
        - uses: iamguarded/test-compat
          with:
            package: flux-source-controller
            version: ${{vars.major-version}}

test:
  environment:
    contents:
      packages:
        - ${{package.name}}
  pipeline:
    # the source-controller when passing the -h flag exit with error code 2
    - runs: |
        set +e
        source-controller -h
        if [ $? -ne 2 ]; then
          echo "expected 2, got $?"
          exit 1
        fi
    - uses: test/go-fips-check
