package:
  name: flux-source-controller-fips
  version: "1.6.2"
  epoch: 7 # GHSA-2464-8j7c-4cjm
  description: The GitOps Toolkit source management component
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-16
      - gcc
      - go-fips
      - lld-16

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 254ef2ec92b4855d2a09bf61a1a6e8b1ac34d4a5
      repository: https://github.com/fluxcd/source-controller
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        helm.sh/helm/v3@v3.18.5
        github.com/go-viper/mapstructure/v2@v2.4.0

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/bin
      CGO_ENABLED=1 CGO_LDFLAGS="-fuse-ld=lld" go build \
        -tags 'netgo,osusergo,static_build' \
        -trimpath -o "${{targets.destdir}}"/usr/bin/source-controller .

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - api/
  github:
    identifier: fluxcd/source-controller
    strip-prefix: v
    tag-filter: v

test:
  environment:
    contents:
      packages:
        - ${{package.name}}
  pipeline:
    # the source-controller when passing the -h flag exit with error code 2
    - runs: |
        set +e
        source-controller -h
        if [ $? -ne 2 ]; then
          echo "expected 2, got $?"
          exit 1
        fi
    - uses: test/go-fips-check
