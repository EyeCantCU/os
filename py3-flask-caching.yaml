package:
  name: py3-flask-caching
  version: "2.3.1"
  epoch: 0
  description: A caching extension for Flask
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: flask-caching
  import: flask_caching

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pallets-eco/flask-caching
      tag: v${{package.version}}
      expected-commit: e59bc040cd47cd2b43e501d636d43d442c50b3ff

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-flask
        - py${{range.key}}-werkzeug
        - py${{range.key}}-cachelib
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            from flask import Flask
            from flask_caching import Cache
            import time

            assert hasattr(Cache, '__call__')
            assert callable(Cache)
            assert hasattr(Cache, 'memoize')

            app = Flask(__name__)
            app.config.from_mapping({
              "CACHE_TYPE": "SimpleCache",
              "CACHE_DEFAULT_TIMEOUT": 1  # short timeout for testing
            })
            cache = Cache(app)
            assert cache is not None

            @cache.memoize()
            def double(x):
                return x * 2

            assert double(2) == 4
            assert double(2) == 4

            time.sleep(1.1)
            assert double(2) == 4
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: pallets-eco/flask-caching
    strip-prefix: v
