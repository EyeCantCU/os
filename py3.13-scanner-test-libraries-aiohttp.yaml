package:
  name: py3.13-scanner-test-libraries-aiohttp
  version: 0.0.1
  epoch: 0
  description: A test package to be used with Chainguard Libraries.

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-numpy
      - py${{vars.python-version}}-openvino-telemetry
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}
      - python-${{vars.python-version}}-dev

var-transforms:
  - from: ${{package.name}}
    match: 'py(\d+\.\d+)-.*'
    replace: "$1"
    to: python-version

pipeline:
  - runs: |
      pip install --verbose \
          --no-index --no-build-isolation --no-deps \
          --force-reinstall --no-compile --prefix=/usr "--root=${{targets.contextdir}}" aiohttp-3.9.1+cgr.2-cp313-cp313-manylinux_2_39_${{build.arch}}.whl

  - uses: strip

update:
  enabled: false
  exclude-reason: This is a test package and shouldn't be updated automatically.
