package:
  name: nvidia-nccl-cuda-12.9
  version: "2.27.5"
  epoch: 0
  description: Optimized primitives for collective multi-GPU communication
  copyright:
    - license: LicenseRef-NVIDIA-nccl-BSD-3-Clause
      license-path: LICENSE.txt
  resources:
    cpu: 16
    memory: 32Gi

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*-(\d+)\.\d+$'
    replace: '$1'
    to: cuda-major-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - coreutils # for fmt
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - gcc-12-default
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - python3
  environment:
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/nccl
      tag: v${{package.version}}-1
      expected-commit: 3ea7eedf3b9b94f1d9f99f4e55536dfcbd23c1ca

  - runs: |
      # default CUDA_HOME is /usr/local/cuda, hence explicit declaration
      make -j$(nproc) src.build

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/lib
      mkdir -p ${{targets.destdir}}/usr/include
      mv ./build/lib/* ${{targets.destdir}}/usr/lib
      mv ./build/include/* ${{targets.destdir}}/usr/include

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development files
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
    test:
      environment:
        environment:
          CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
          HOME: /home/build
        contents:
          packages:
            - bash
            - build-base
            - gcc-12-default
            - nvidia-cuda-cccl-${{vars.cuda-version}}
            - cuda-toolkit-${{vars.cuda-version}}-dev
      pipeline:
        - uses: git-checkout
          with:
            repository: https://github.com/NVIDIA/nccl-tests
            tag: v2.15.0
            expected-commit: 501a149d575fa62b7d8bea5b2bd20304dba55025
        - runs: |
            # We are not actually running the tests, but just compiling them. Running the tests requires GPU's
            make
        - uses: test/pkgconf

update:
  enabled: true
  github:
    identifier: NVIDIA/nccl
    strip-prefix: v
    strip-suffix: "-1"
    use-tag: true
    tag-filter: v2

test:
  pipeline:
    - uses: test/tw/ldd-check
