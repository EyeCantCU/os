package:
  name: argo-events-fips
  version: "1.9.7"
  epoch: 5
  description: Event-driven Automation Framework for Kubernetes.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c695dbf57162e04e7d30b2134d4724feccf878a3
      repository: https://github.com/argoproj/argo-events
      tag: v${{package.version}}

  - name: Downgrade Go to 1.23 for FIPS
    runs: |
      # we are using go 1.23 because go-fips-1.24 is not available yet
      sed -i 's/go 1\.24\(\.[0-9]*\)\?/go 1.23/' go.mod
      go mod tidy

  - uses: go/bump
    with:
      deps: |-
        github.com/go-viper/mapstructure/v2@v2.4.0
      replaces: |-
        github.com/whilp/git-urls=github.com/chainguard-dev/git-urls@v1.0.2

  - uses: go/build
    with:
      ldflags: |
        -X github.com/argoproj/argo-events.version=${{package.version}}
        -X github.com/argoproj/argo-events.gitCommit=$(git rev-parse --short=8 HEAD)
        -X github.com/argoproj/argo-events.buildDate=$(date -u -d "@${SOURCE_DATE_EPOCH:-$(date +%s)}" "+%Y-%m-%dT%H:%M:%SZ")
        -X github.com/argoproj/argo-events.gitTreeState=clean
      output: argo-events
      packages: ./cmd
      go-package: go-fips

subpackages:
  - name: argo-events-fips-compat
    pipeline:
      - runs: |
          # Symlink the binary from usr/bin to /
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/argo-events ${{targets.subpkgdir}}/argo-events
    # test added by a robot (compat)
    test:
      pipeline:
        - runs: |
            readlink -v /argo-events

update:
  enabled: true
  github:
    identifier: argoproj/argo-events
    strip-prefix: v

test:
  pipeline:
    - name: "Verify Installation"
      runs: |
        /usr/bin/argo-events --help
    - uses: test/go-fips-check
