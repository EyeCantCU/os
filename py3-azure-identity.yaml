package:
  name: py3-azure-identity
  version: 1.17.1
  epoch: 1
  description: Microsoft Azure Identity Library for Python
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py3-azure-core
      - py3-msal

environment:
  contents:
    packages:
      - ca-certificates-bundle
      - wolfi-base
      - busybox
      - build-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 4defbc741f24f808242ea306c65cd46c5912643c
      repository: https://github.com/Azure/azure-sdk-for-python
      tag: azure-identity_${{package.version}}
      destination: ./azure-sdk-for-python

  - runs: |
      mv ./azure-sdk-for-python/sdk/identity/azure-identity/* .

  - name: Python Build
    uses: python/build-wheel

  - uses: strip

test:
  environment:
    contents:
      packages:
        - openssl-provider-legacy # needed for 'import azure.identity'
  pipeline:
    - uses: python/import
      with:
        imports: |
          import azure.identity

update:
  # The azure repo has some tags that have a bN suffix, which
  # is not a valid version, so ignore those.
  ignore-regex-patterns:
    - b
  enabled: true
  github:
    identifier: Azure/azure-sdk-for-python
    tag-filter-contains: azure-identity_
    strip-prefix: azure-identity_
    use-tag: true
