package:
  name: py3-pulp
  version: "3.2.2"
  epoch: 0
  description: PuLP is an linear and mixed integer programming modeler written in Python
  copyright:
    - license: MIT

vars:
  pypi-package: pulp
  import: pulp

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/coin-or/pulp
      tag: ${{package.version}}
      expected-commit: c17d253d5ee4d6f6c3f15a35aa6ff0745296a43c

  - name: remove precompiled cbc binaries
    runs: |
      find pulp/solverdir/cbc -type d -mindepth 1 -maxdepth 1 -exec rm -rf {} \;

  - uses: patch
    with:
      patches: remove-precompiled-binaries.patch

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - cbc
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          case "${{build.arch}}" in
            x86_64)  pulparch="i64";;
            aarch64) pulparch="arm64";;
            *) echo "ERROR: Unknown build.arch: ${{build.arch}}"; exit 1;;
          esac
          cbcdir="${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/pulp/solverdir/cbc/linux/$pulparch"
          mkdir -p "$cbcdir"
          ln -s /usr/bin/cbc "$cbcdir/cbc"
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
      - runs: |
          # the only binary this ships is pulptest, which needs these examples
          mkdir -p ${{targets.contextdir}}//usr/share/doc/${{package.name}}
          cp -a examples ${{targets.contextdir}}//usr/share/doc/${{package.name}}
    test:
      pipeline:
        - runs: |
            ln -sf /usr/share/doc/${{package.name}}/examples \
              /usr/lib/python${{range.key}}/site-packages/examples
            pulptest

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: coin-or/pulp
