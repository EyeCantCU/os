package:
  name: eks-distro-kubernetes-csi-node-driver-registrar-2.10
  version: 2.10.0 # eks-distro v1-25-eks-38: https://github.com/aws/eks-distro/releases/tag/v1-25-eks-38
  epoch: 8
  description: Sidecar container that registers a CSI driver with the kubelet using the kubelet plugin registration mechanism.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - eks-distro-kubernetes-csi-node-driver-registrar=${{package.full-version}}

vars:
  eks-project: kubernetes-csi/node-driver-registrar
  eks-package-version: 1-25-eks-38

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-distro
      tag: v${{vars.eks-package-version}}
      expected-commit: eaa252c665ca550c2ef04b79436597955da6552f

  - uses: eks-distro/build
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      # CVE-2023-47108 (otel)
      deps: go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.46.0 go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.46.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.20.0 google.golang.org/protobuf@v1.33.0 github.com/golang/protobuf@v1.5.4 golang.org/x/net@v0.23.0

  - uses: eks-distro/install
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      binary-target: csi-node-driver-registrar

  - uses: strip

update:
  manual: true
