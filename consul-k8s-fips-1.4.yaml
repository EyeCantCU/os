package:
  name: consul-k8s-fips-1.4
  version: "1.4.10"
  epoch: 0
  description: The consul-k8s includes first-class integrations between Consul and Kubernetes.
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - go-discover-fips
    provides:
      - consul-k8s-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - oldglibc~2.28

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/consul-k8s
      expected-commit: 52ab9eca1c457a402f464dcc2d2da02186d34719
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v3@v3.0.4
      modroot: ./acceptance

  - uses: go/bump
    with:
      deps: |-
        helm.sh/helm/v3@v3.17.3
      modroot: ./cli

  - uses: go/build
    with:
      go-package: go-fips
      modroot: ./control-plane/cni
      output: consul-cni
      packages: .

  - uses: go/build
    with:
      go-package: go-fips
      modroot: ./control-plane
      output: consul-k8s-control-plane
      packages: .

subpackages:
  - name: ${{package.name}}-cli
    description: "CLI for interacting with Consul on Kubernetes"
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          modroot: ./cli
          output: consul-k8s
          packages: .
    test:
      pipeline:
        - name: Verify help
          runs: |
            consul-k8s --help

update:
  enabled: true
  github:
    identifier: hashicorp/consul-k8s
    strip-prefix: v
    tag-filter-prefix: v1.4.

test:
  pipeline:
    - name: Verify help
      runs: |
        consul-cni --help
        consul-k8s-control-plane --help
        consul-cni --version
        consul-k8s-control-plane --version
    - uses: test/go-fips-check
