package:
  name: aws-ebs-csi-driver-1.19
  version: 1.19.0
  epoch: 16
  description: CSI driver for Amazon EBS.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - blkid
      - blockdev
      - e2fsprogs
      - e2fsprogs-extra
      - lsblk
      - mount
      - xfsprogs
    provides:
      - aws-ebs-csi-driver=1.19

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go
      - mount
      - umount
      - wolfi-baselayout

pipeline:
  # We can't use go/install because this requires specific ldflags to set the version
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/aws-ebs-csi-driver
      tag: v${{package.version}}
      expected-commit: a0ec0da261f9d24aecdec98448c63a38e7ae2cf3

  - runs: |
      # GHSA-pxhw-596r-rwq5 remove requirement using v1.22.0, it gets downgraded to v0.26.0 in a replace block in the upstream code.
      go mod edit -droprequire=k8s.io/client-go

  - uses: go/bump
    with:
      deps: google.golang.org/protobuf@v1.33.0 github.com/golang/protobuf@v1.5.4 golang.org/x/net@v0.23.0 k8s.io/kubernetes@v1.27.13
      replaces: k8s.io/kms=k8s.io/kms@v0.27.1 k8s.io/apiserver=k8s.io/apiserver@v0.27.13 k8s.io/client-go=k8s.io/client-go@v0.27.13 k8s.io/api=k8s.io/api@v0.27.13 k8s.io/apimachinery=k8s.io/apimachinery@v0.27.13

  - runs: |
      # Our global LDFLAGS conflict with a Makefile parameter
      unset LDFLAGS
      make ARCH=$(go env GOARCH)
      mkdir -p ${{targets.destdir}}/usr/bin
      cp bin/aws-ebs-csi-driver ${{targets.destdir}}/usr/bin/

  - uses: strip

update:
  enabled: false
