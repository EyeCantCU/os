package:
  name: py3-cachelib
  version: "0.13.0"
  epoch: 0
  description: A collection of cache libraries in the same API interface. Extracted from Werkzeug.
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: cachelib
  import: cachelib

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pallets/cachelib
      tag: ${{package.version}}
      expected-commit: 8949ab086bc8c41bd6a64e53d9b5653d85a90928

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import cachelib
            from cachelib import SimpleCache

            assert hasattr(cachelib, 'SimpleCache')
            assert hasattr(cachelib, 'FileSystemCache')
            assert hasattr(cachelib, 'NullCache')

            cache = SimpleCache()
            assert cache is not None

            assert hasattr(cache, 'get')
            assert hasattr(cache, 'set')
            assert hasattr(cache, 'delete')
            assert hasattr(cache, 'clear')

            cache.set('test_key', 'test_value')
            cached_value = cache.get('test_key')
            assert cached_value == 'test_value'
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: pallets/cachelib
    strip-prefix: v
