package:
  name: py3-language-tags
  version: 1.2.0
  epoch: 0
  description: Dealing with IANA language tags in Python
  copyright:
    - license: MIT

vars:
  pypi-package: language-tags
  import: language_tags

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/OnroerendErfgoed/language-tags
      tag: ${{package.version}}
      expected-commit: 4e27424a2458cb0b3584fdad791e6f91e964a46c

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-pylatexenc
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
