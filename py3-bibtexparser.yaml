package:
  name: py3-bibtexparser
  version: 2.0.0.8
  epoch: 0
  description: Python 3 library to parse bibtex files.
  copyright:
    - license: MIT

vars:
  pypi-package: bibtexparser

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+\.\d+)\.(\d+)$
    replace: "${1}b${2}"
    to: mangled-package-version

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sciunto-org/python-bibtexparser.git
      tag: v${{vars.mangled-package-version}}
      expected-commit: b379599b1796d5bd327634dd688647a62bf8b1ed

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-pylatexenc
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
