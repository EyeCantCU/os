package:
  name: py3-bibtexparser
  version: 2.0.0.8
  epoch: 0
  description: Python 3 library to parse bibtex files.
  copyright:
    - license: MIT

vars:
  pypi-package: bibtexparser

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+\.\d+)\.(\d+)$
    replace: "${1}b${2}"
    to: mangled-package-version

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sciunto-org/python-bibtexparser.git
      tag: v${{vars.mangled-package-version}}
      expected-commit: b379599b1796d5bd327634dd688647a62bf8b1ed

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-pylatexenc
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' 2>&1 | tee output.txt
            import bibtexparser
            from bibtexparser.middlewares.names import SeparateCoAuthors
            from bibtexparser.middlewares.names import SplitNameParts
            from bibtexparser.middlewares.names import MergeNameParts
            from bibtexparser.middlewares.names import MergeCoAuthors

            bibtex_string = '''
            @article{einstein1935,
              title={Can quantum-mechanical description of physical reality be considered complete?},
              author={Einstein, Albert and Podolsky, Boris and Rosen, Nathan},
              journal={Physical review},
              volume={47},
              number={10},
              pages={777--780},
              year={1935},
              publisher={APS}
            }
            '''

            bib_database = bibtexparser.parse_string(bibtex_string,
                # Middleware layers to transform parsed entries.
                # Here, we split multiple authors from each other and then extract first name, last name, ... for each
                append_middleware=[SeparateCoAuthors(), SplitNameParts()],
            )

            print(bib_database.entries[0].entry_type)
            print(bib_database.entries[0].fields[0])
            print(bib_database.entries[0].fields[1])
            print(bib_database.entries[0].fields[2])
            print(bib_database.entries[0].fields[3])
            EOF
            get_line() {
              cat output.txt | sed -n "${1}p" | grep -E -e "${2}"
            }

            get_line 1 "article"
            get_line 2 "Can quantum-mechanical description"
            get_line 3 "Albert.*Einstein"
            get_line 4 "Physical review"
            get_line 5 "volume.*47"

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
