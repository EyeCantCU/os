package:
  name: nvidia-apex-12.3
  version: 24.04.01
  epoch: 1
  description: "A PyTorch Extension for NVIDIA APEX"
  target-architecture:
    - x86_64
  options:
    no-depends: true
  resources:
    cpu: 64
    memory: 192Gi
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - openmp-17
      - cuda-toolkit-12.3
      - nvidia-nccl-cuda-12.3

environment:
  contents:
    packages:
      - build-base
      - busybox
      - python-3.11
      - python-3.11-dev
      - gcc-12-default
      - cuda-toolkit-12.3
      - cuda-toolkit-12.3-dev
      - nvidia-driver
      - nvidia-cuda-cccl-12.3
      - nvidia-cuda-profiler-api-12.3
      - nvidia-cudnn-8-cuda-12-dev
      - nvidia-nccl-cuda-12.3
      - pytorch-cuda12

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/apex.git
      tag: ${{package.version}}
      expected-commit: 4138d31ff0acf4071d1dc001ccb7cd6e00800324

  - runs: |
      export TORCH_CUDA_ARCH_LIST="5.2 6.0 6.1 7.0+PTX 8.0 8.6 8.7 8.9 9.0"
      export CUDA_HOME=/usr/local/cuda-12.3
      export PATH=/usr/local/cuda-12.3/bin:$PATH

      source /usr/share/pytorch/.venv/bin/activate
      pip install -r requirements.txt

      # to build wheel
      pip install wheel

      # build Apex wheel with CUDA extension
      pip wheel --no-build-isolation --disable-pip-version-check --no-cache-dir \
        --config-settings "--build-option=--cpp_ext --cuda_ext --fast_layer_norm \
        --distributed_adam --deprecated_fused_adam" ./

      pip install apex*.whl

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/apex
      mv /usr/share/pytorch/.venv ${{targets.destdir}}/usr/share/apex/

      # edit the venv paths
      sed -i "s|/usr/share/pytorch|/usr/share/apex|g" ${{targets.destdir}}/usr/share/apex/.venv/bin/*

      # allow site-packages
      sed -i "s|include-system-site-packages = false|include-system-site-packages = true|g" ${{targets.destdir}}/usr/share/apex/.venv/pyvenv.cfg

subpackages:
  - name: ${{package.name}}-wheel
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share/apex-wheel
          cp apex*.whl ${{targets.subpkgdir}}/usr/share/apex-wheel

update:
  enabled: false

test:
  environment:
    contents:
      packages:
        - wolfi-base
        - busybox
        - build-base
        - python-3.11
        - python-3.11-dev        
  pipeline:
    - runs: |
        export PATH=/usr/share/apex/.venv/bin:$PATH
        python -c "import apex"
