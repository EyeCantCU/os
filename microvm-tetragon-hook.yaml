package:
  name: microvm-tetragon-hook
  version: 0.0.1
  epoch: 0
  description: Init.d hook to start tetragon daemon during microvm-init
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - tetragon

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      mkdir -p ${{targets.destdir}}/opt/melange/init.d
      cat > ${{targets.destdir}}/opt/melange/init.d/50-tetragon.sh <<'TETRAGON_HOOK_EOF'
      #!/bin/sh
      # Tetragon daemon startup hook for microvm-init
      # This script is sourced by microvm-init before chroot

      echo "[INIT.D] Starting tetragon hook (50-tetragon.sh)..." > /dev/console

      # Mount eBPF filesystems if not already mounted (required for tetragon)
      if ! grep -q debugfs /proc/mounts; then
          mount -t debugfs none /sys/kernel/debug 2>/dev/null && \
              echo "[INIT.D] ✓ debugfs mounted" > /dev/console || \
              echo "[INIT.D] ✗ debugfs mount failed" > /dev/console
      fi

      if ! grep -q tracefs /proc/mounts; then
          mount -t tracefs none /sys/kernel/tracing 2>/dev/null && \
              echo "[INIT.D] ✓ tracefs mounted" > /dev/console || \
              echo "[INIT.D] ✗ tracefs mount failed" > /dev/console
      fi

      if ! grep -q bpf /proc/mounts; then
          mount -t bpf none /sys/fs/bpf 2>/dev/null && \
              echo "[INIT.D] ✓ bpf mounted" > /dev/console || \
              echo "[INIT.D] ✗ bpf mount failed" > /dev/console
      fi

      # Create directory for tetragon events
      mkdir -p /tmp/tetragon
      chmod 0777 /tmp/tetragon

      # Start tetragon daemon in background
      echo "[INIT.D] Launching tetragon with export to /tmp/tetragon/events.log" > /dev/console

      (
          tetragon \
              --export-filename /tmp/tetragon/events.log \
              --log-format json \
              --log-level info \
              >/dev/null 2>&1
      ) &

      TETRAGON_PID=$!
      echo "[INIT.D] Tetragon started with PID: $TETRAGON_PID" > /dev/console

      # Start console streamer in background
      (
          # Wait for events file to be created (up to 3 seconds)
          for i in $(seq 1 30); do
              if [ -f /tmp/tetragon/events.log ]; then
                  break
              fi
              sleep 0.1
          done

          # Stream events to console
          if [ -f /tmp/tetragon/events.log ]; then
              echo "[INIT.D] Starting tetragon event stream to console" > /dev/console
              chmod 0666 /tmp/tetragon/events.log

              # Use tail -f to stream events, prefix with [TETRAGON], send to console
              tail -f /tmp/tetragon/events.log 2>/dev/null | while IFS= read -r line; do
                  echo "[TETRAGON] $line" > /dev/console 2>/dev/null || true
              done
          else
              echo "[INIT.D] Warning: Tetragon events file not created" > /dev/console
          fi
      ) </dev/null >/dev/null 2>&1 &

      STREAMER_PID=$!
      echo "[INIT.D] Tetragon console streamer started with PID: $STREAMER_PID" > /dev/console

      # Brief pause to let tetragon initialize
      sleep 1

      echo "[INIT.D] Tetragon hook completed successfully" > /dev/console
      TETRAGON_HOOK_EOF

      chmod +x ${{targets.destdir}}/opt/melange/init.d/50-tetragon.sh

update:
  enabled: false
  exclude-reason: |
    This is a custom hook for microvm-init tetragon integration
