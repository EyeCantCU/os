package:
  name: microvm-tetragon-hook
  version: 0.0.1
  epoch: 0
  description: Init.d hook to start tetragon daemon during microvm-init
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - tetragon

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      mkdir -p ${{targets.destdir}}/opt/melange/init.d
      cp 50-tetragon.sh ${{targets.destdir}}/opt/melange/init.d/50-tetragon.sh
      chmod +x ${{targets.destdir}}/opt/melange/init.d/50-tetragon.sh

test:
  environment: {}
  pipeline:
    - runs: |
        test -f /opt/melange/init.d/50-tetragon.sh
        test -x /opt/melange/init.d/50-tetragon.sh

update:
  enabled: false
  exclude-reason: |
    This is a custom hook for microvm-init tetragon integration
