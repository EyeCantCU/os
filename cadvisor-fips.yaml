package:
  name: cadvisor-fips
  version: "0.52.1"
  epoch: 4
  description: Analyzes resource usage and performance characteristics of running containers.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
  environment:
    CGO_ENABLED: "1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google/cadvisor
      tag: v${{package.version}}
      expected-commit: 0b675defd46277198f7c15c1053301421a4b733e

  - uses: go/bump
    with:
      deps: |-
        github.com/docker/docker@v26.1.5
        golang.org/x/net@v0.38.0

  - uses: go/bump
    with:
      deps: |-
        github.com/docker/docker@v26.1.5
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
      modroot: cmd

  - runs: |
      ./build/build.sh

  - runs: |
      install -Dm755 _output/cadvisor "${{targets.destdir}}"/usr/bin/cadvisor

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        cadvisor --help
    - runs: cadvisor --version

update:
  enabled: true
  github:
    identifier: google/cadvisor
    strip-prefix: v
    tag-filter: v
