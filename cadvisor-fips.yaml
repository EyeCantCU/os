package:
  name: cadvisor-fips
  version: "0.53.0"
  epoch: 8 # GHSA-j5w8-q4qc-rx2x
  description: Analyzes resource usage and performance characteristics of running containers.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
  environment:
    CGO_ENABLED: "1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google/cadvisor
      tag: v${{package.version}}
      expected-commit: 85d18c6139a3f1fd48120c49ae44eac5aa352d86

  - uses: go/bump
    with:
      deps: |-
        github.com/docker/docker@v28.3.3
        github.com/opencontainers/runc@v1.3.3
        golang.org/x/crypto@v0.45.0
      modroot: cmd

  - uses: go/bump
    with:
      deps: |-
        github.com/docker/docker@v28.3.3
        github.com/opencontainers/runc@v1.3.3

  - runs: |
      ./build/build.sh

  - runs: |
      install -Dm755 _output/cadvisor "${{targets.destdir}}"/usr/bin/cadvisor

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: cadvisor
    - uses: test/tw/ver-check
      with:
        bins: cadvisor

update:
  enabled: true
  github:
    identifier: google/cadvisor
    strip-prefix: v
    tag-filter: v
