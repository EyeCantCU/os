package:
  name: py3-tensorrt-cuda-12
  version: 10.12.0
  epoch: 6

vars:
  # It's versioned for the latest minor version it supports, but is backwards compatible.
  cuda-version: 12.9
  pypi-package: tensorrt
  import: tensorrt

var-transforms:
  - from: ${{package.version}}
    match: '(\d+\.\d+)\.\d+\.\d+'
    replace: '$1'
    to: major-minor
  - from: ${{package.name}}
    match: '.*cuda-(\d+)(?:\.\d+)?'
    replace: '$1'
    to: cuda-major-version

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  environment:
    CUDA_ROOT: "/usr/local/cuda-${{vars.cuda-version}}"
    TENSORRT_MODULE: "tensorrt"
    TRT_OSSPATH: "/home/build/TensorRT"
    CPLUS_INCLUDE_PATH: "/home/build/TensorRT/parsers/"
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - cmake-3
      - nvidia-cuda-cudart-${{vars.cuda-version}}-dev
      - nvidia-cuda-nvcc-${{vars.cuda-version}}-dev
      - py3-supported-pybind11
      - py3-supported-build-base-dev
      - tensorrt-cuda-${{vars.cuda-major-version}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/TensorRT
      destination: TensorRT/
      tag: v${{package.version}}
      expected-commit: 6d178ce8c736c4397317b24205fb4333218e5c89
      recurse-submodules: true

  - uses: patch
    with:
      patches: remove-bindings-wheel.patch

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-major-version}}
    description: python${{range.key}} version of ${{vars.pypi-package}} built for CUDA ${{vars.cuda-major-version}}
    options:
      no-depends: true # avoid sca deps on incorrect tensorrt libs
    dependencies:
      runtime:
        - python-${{range.key}}-base
        - libnvinfer-cuda-${{vars.cuda-major-version}}
        - libnvinfer-plugin-cuda-${{vars.cuda-major-version}}
        - libnvonnxparser-cuda-${{vars.cuda-major-version}}
    pipeline:
      - name: build
        working-directory: TensorRT/python
        runs: |
          PYVER=${{range.key}}
          PYMAJOR=$(echo "$PYVER" | cut -d. -f1)
          PYMINOR=$(echo "$PYVER" | cut -d. -f2)
          export PYTHON_MAJOR_VERSION=$PYMAJOR
          export PYTHON_MINOR_VERSION=$PYMINOR
          export TARGET_ARCHITECTURE=${{build.arch}}

          export TRT_LIBS="/usr/local/tensorrt/targets/${{build.arch}}-linux-gnu/lib"
          export LIBRARY_PATH="$TRT_LIBS"

          export PYBIND11_DIR="/usr/lib/python${PYVER}/site-packages/pybind11/include"
          export CPLUS_INCLUDE_PATH="${PYBIND11_DIR}:${CPLUS_INCLUDE_PATH}"

          chmod +x build.sh
          bash ./build.sh
      - name: install bindings
        uses: py/pip-build-install
        working-directory: TensorRT/python/build/bindings_wheel
        with:
          python: python${{range.key}}
      - name: clean
        working-directory: TensorRT/python
        runs: |
          rm -rf build/ dist/ tensorrt.egg-info __pycache__
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: test/tw/ldd-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}-cuda-${{vars.cuda-major-version}}
    description: meta package providing ${{vars.pypi-package}} built for CUDA ${{vars.cuda-major-version}} for supported python versions
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-cuda-${{vars.cuda-major-version}}
        - py3.11-${{vars.pypi-package}}-cuda-${{vars.cuda-major-version}}
        - py3.12-${{vars.pypi-package}}-cuda-${{vars.cuda-major-version}}
        - py3.13-${{vars.pypi-package}}-cuda-${{vars.cuda-major-version}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: NVIDIA/TensorRT
    tag-filter-prefix: v
    strip-prefix: v
