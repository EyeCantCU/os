package:
  name: py3-cloudevents
  version: 1.12.0
  epoch: 0
  description: Python SDK for CloudEvents
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-wheel
      - wolfi-base

data:
  - name: py-versions
    items:
      "3.10": "310"
      "3.11": "311"
      "3.12": "312"
      "3.13": "313"

vars:
  pypi-package: cloudevents

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cloudevents/sdk-python
      tag: ${{package.version}}
      expected-commit: a38933d7ab0fa9827cd23be9b8e7c118436457fe

  - uses: strip

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-deprecation
        - py${{range.key}}-typing-extensions
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import cloudevents

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import cloudevents

update:
  enabled: true
  github:
    identifier: cloudevents/sdk-python
    strip-prefix: v
    use-tag: true
