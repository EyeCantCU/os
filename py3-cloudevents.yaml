package:
  name: py3-cloudevents
  version: 1.12.0
  epoch: 0
  description: Python SDK for CloudEvents
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-wheel

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

vars:
  pypi-package: cloudevents

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cloudevents/sdk-python
      tag: ${{package.version}}
      expected-commit: a38933d7ab0fa9827cd23be9b8e7c118436457fe

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-deprecation
        - py${{range.key}}-typing-extensions
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import cloudevents

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: cloudevents/sdk-python
    strip-prefix: v
    use-tag: true
