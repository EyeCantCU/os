name: Rust build tree check (as rust-audit-info is inaccurate)

needs:
  packages:
    - binutils
    - rustfilt

inputs:
  allowed-crates:
    description: |
      list of allowed crates in the build tree
    required: true
  blocked-crates:
    description: |
      list of blocked crates in the build tree
    required: true
  allowed-symbols:
    description: |
      list of allowed symbols in the built binary
    required: true
  blocked-symbols:
    description: |
      list of blocked symbols in the built binary
    required: true
  binary:
    description: |
      path to binary under test
    required: true

pipeline:
  - runs: |
      # Note these checks are highly specific to each project
      # There are no universal settings
      # This doesn't check which features are enabled in a given crate
      symbolsfile=$(mktemp)
      rmetafile=$(mktemp)
      nm --format=just-symbols ${{inputs.binary}} | rustfilt >$symbolsfile
      find . -name '*.rmeta' | xargs -I{} basename {} .rmeta | cut -d- -f1 >$rmetafile
      echo ... checking allowed crates
      for crate in ${{inputs.allowed-crates}}; do
        grep -x $crate $rmetafile
      done
      echo ... checking blocked crates
      for crate in ${{inputs.blocked-crates}}; do
        grep -x $crate $rmetafile && exit 1
      done
      echo ... checking allowed symbols
      for symbol in ${{inputs.allowed-symbols}}; do
        grep -x $symbol $symbolsfile
      done
      echo ... checking blocked symbols
      for symbol in ${{inputs.blocked-symbols}}; do
        grep -x $symbol $symbolsfile && exit 1
      done
