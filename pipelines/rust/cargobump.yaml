name: Bump Rust dependencies to specified versions

# Backwards-compatible wrapper for cargobump using omnibump
# This pipeline provides the same interface as the legacy rust/cargobump pipeline
# but uses omnibump under the hood for unified dependency management

# Leave go off here, some packages pin to an older version.
# Let's just assume this gets injected elsewhere.
needs:
  packages:
    - git
    - omnibump

inputs:
  cargoroot:
    description: The root of the Cargo.lock file
    default: .
  bump-file:
    description: |
      Patches file to use for updating the Cargo.lock file (e.g., cargobump-deps.yaml)
    default: ./cargobump-deps.yaml
  packages:
    description: |
      Packages to be used for updating the Cargo.lock file via command line flag
      (space-separated, format: package@version)
    default: ""
  show-dependency-graph:
    default: false
    description: Display a tree visualization of a dependency graph
  update:
    default: false
    description: Run 'cargo update' command before the bump

pipeline:
  - runs: |
      set -euo pipefail

      cd "${{inputs.cargoroot}}"

      # Show dependency graph if requested
      if [ "${{inputs.show-dependency-graph}}" = "true" ]; then
        cargo tree
      fi

      # Build omnibump command
      OMNIBUMP_CMD="omnibump --language rust"

      # Handle inline packages or bump-file
      if [ -n "${{inputs.packages}}" ]; then
        OMNIBUMP_CMD="${OMNIBUMP_CMD} --packages \"${{inputs.packages}}\""
      elif [ -f "${{inputs.bump-file}}" ]; then
        OMNIBUMP_CMD="${OMNIBUMP_CMD} --deps ${{inputs.bump-file}}"
      fi

      # Add tidy flag if update is enabled (cargo update equivalent)
      if [ "${{inputs.update}}" = "true" ]; then
        OMNIBUMP_CMD="${OMNIBUMP_CMD} --tidy"
      fi

      # Note: We already cd'd to cargoroot, so omnibump should use current directory
      # Don't pass --dir again as that would make it look in cargoroot/cargoroot

      # Execute omnibump
      eval "${OMNIBUMP_CMD}"
