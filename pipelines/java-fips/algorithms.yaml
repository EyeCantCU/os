name: Runs tests for ciphers, digests, ssl & tls providers for java fips

# Pull in the specific java version and fips policy
needs:
  packages:
    - bash
    - ${{inputs.java-distro}}-${{inputs.java-version}}
    - ${{inputs.java-distro}}-bcfips-policy-${{inputs.fips-compliance-version}}-j${{inputs.java-version}}

inputs:
  java-distro:
    description: "The java distribution to use for the test"
    default: "openjdk"
  java-version:
    description: "The java version to use for the test"
    default: "11"
  fips-compliance-version:
    description: "The version of the fips compliance to test"
    default: "140-2"
  classpath:
    description: "Override the default classpath"
    default: ""

## Note the test files are provided by the bcfips-policy package
pipeline:
  - name: Test openjdk algorithm
    runs: |
      cd $(mktemp -d)
      cp /usr/lib/bcfips-policy-${{inputs.fips-compliance-version}}/* .

      _java_home="/usr/lib/jvm/java-${{inputs.java-version}}-${{inputs.java-distro}}"
      # openjdk may be used in the distro name, but not the path so try omitting it if not found
      if [[ ! -d "$_java_home" ]]; then
        _java_home="${_java_home/-openjdk/}"
      fi
      JAVA_HOME="$_java_home" CLASSPATH=${{inputs.classpath}} ./test.sh
