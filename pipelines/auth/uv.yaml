name: Configure uv to fetch Chainguard Libraries dependencies.

needs:
  packages:
    - busybox
    - curl
    - jq
    - uv

inputs:
  identity:
    description: the identity to use for Chainguard Libraries
    default: "ce2d1984a010471142503340d670612d63ffb9f6/368543f65e2b1f6f"
  group:
    description: the group to use for Chainguard Libraries
    default: "ce2d1984a010471142503340d670612d63ffb9f6"
  allow-unsafe-indexes:
    description: |
      use Chainguard Libraries with fallback to other Python package indexes
      enabled, like PyPI. Only disable this toggle if necessary for legacy
      Python applications or debug. Nothing newly introduced should ever
      disable this toggle
    default: "false"

pipeline:
  - name: Setup uv credentials
    runs: |
      set -euo pipefail

      # If libraries token exists in melange's cache, use that.
      # Fetch the token with: make lib-token
      if [ -f /var/cache/melange/.libraries_token.txt ]; then
        cgtoken=$(cat /var/cache/melange/.libraries_token.txt)
      else
        idtoken=$(curl --fail-with-body -sSL -H "Metadata-Flavor: Google" http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=issuer.enforce.dev)
        cgtoken=$(curl --fail-with-body -sSL -H "Authorization: Bearer ${idtoken}" 'https://issuer.enforce.dev/sts/exchange?aud=libraries.cgr.dev&scope=${{inputs.group}}&identity=${{inputs.identity}}' | jq -r '.token')
      fi

      python_index="python"
      if [ "${{inputs.allow-unsafe-indexes}}" = "true" ]; then
        python_index="python-all"
      fi

      echo "Creating uv config..."
      mkdir -p /etc/uv
      cat > /etc/uv/uv.toml <<EOF
      [[index]]
      url = "https://user:$cgtoken@libraries.cgr.dev/$python_index/simple/"
      default = true
      EOF
