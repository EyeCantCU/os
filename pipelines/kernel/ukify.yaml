name: Ukifiy a kernel and initramfs

needs:
  packages:
    - systemd-ukify

inputs:
  kernel:
    description: "Kernel to use"
    required: false
    default: ${{targets.destdir}}/boot/vmlinuz
  version-flavor:
    description: "version-flavor"
    required: true
  initrd:
    description: "Initramfs to use"
    required: true
  output:
    description: "Where to write the unified kernel image"
    required: true

pipeline:
  - runs: |
      ukify build \
        --measure \
        --linux=${{inputs.kernel}} \
        --initrd=${{inputs.initrd}} \
        --output=${{inputs.output}}
