name: Install kernel headers for out of tree modules

needs:
  packages:
    - busybox
    - rsync

inputs:
  version-flavor:
    description: "The version-flavor of the headers dir"
    required: true

pipeline:
  - name: Add build symlink
    runs: |
      mkdir -p ${{targets.subpkgdir}}/usr/lib/modules/${{inputs.version-flavor}}
      ln -s ../../../src/${{inputs.version-flavor}} ${{targets.subpkgdir}}/usr/lib/modules/${{inputs.version-flavor}}/build

  - name: Drop other architectures
    runs: |
      arch=""
      case "${{build.arch}}" in
        'x86_64') arch='x86';;
        'aarch64') arch='arm64' ;;
        *) echo "unkown build arch ${{build.arch}}"; exit 1 ;;
      esac

      for a in arch/*; do
        case "$a" in
          arch/"$arch"*) ;;
          *) rm -rf "$a" ;;
        esac
      done

  - name: Install scripts and tools
    runs: |
      mkdir -p ${{targets.contextdir}}/usr/src/${{inputs.version-flavor}}/
      cp -r scripts ${{targets.contextdir}}/usr/src/${{inputs.version-flavor}}/
      install -Dm0755 tools/bpf/resolve_btfids/resolve_btfids ${{targets.contextdir}}/usr/src/${{inputs.version-flavor}}/tools/bpf/resolve_btfids/resolve_btfids
      if [ "${{build.arch}}" = 'x86_64' ]; then
        install -Dm0755 tools/objtool/objtool ${{targets.contextdir}}/usr/src/${{inputs.version-flavor}}/tools/objtool/objtool
      fi

  - name: Install config
    runs: |
      install -Dm0644 .config ${{targets.contextdir}}/usr/src/${{inputs.version-flavor}}/

  - name: Install Kbuild infrastructure
    runs: |
      for i in Makefile Kbuild Kconfig; do
        find . -name "$i"'*' -exec install -Dm0644 {} ${{targets.contextdir}}/usr/src/${{inputs.version-flavor}}/{} ';'
      done
      # vmlinux needed for BTF info for oot modules
      install -Dm0644 Module.symvers System.map vmlinux ${{targets.contextdir}}/usr/src/${{inputs.version-flavor}}/

  - name: Install headers
    runs: |
      rsync -mrl --include='*/' --include='*\.h' --exclude='*' \
        . ${{targets.contextdir}}/usr/src/${{inputs.version-flavor}}/
      rsync -mrl include ${{targets.contextdir}}/usr/src/${{inputs.version-flavor}}/
