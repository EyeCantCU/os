name: Test that a kernel config includes required options for systemd support

inputs:
  config:
    default: "auto"
    description: "Path to kernel config. Default is to find ^boot/config-* in the package under test."

pipeline:
  - uses: kernel/test/kconfig
    with:
      config-path: ${{inputs.config}}
      config-options: |
        # See https://github.com/systemd/systemd/blob/main/README
        # Last commit to README is 385024b75df7dbbf236a79d3706600007a7ab6bd
        CONFIG_DEVTMPFS
        CONFIG_CGROUPS
        CONFIG_INOTIFY_USER
        CONFIG_SIGNALFD
        CONFIG_TIMERFD
        CONFIG_EPOLL
        CONFIG_UNIX
        CONFIG_NET
        CONFIG_SYSFS
        CONFIG_PROC_FS
        CONFIG_FHANDLE
        # udev will fail to work with the legacy sysfs layout:
        # TODO: ENABLE CONFIG_SYSFS_DEPRECATED=n
        # Legacy hotplug slows down the system and confuses udev:
        # TODO: ENABLE CONFIG_UEVENT_HELPER_PATH=""
        # Userspace firmware loading is not supported and should be disabled in
        # the kernel:
        # TODO: ENABLE CONFIG_FW_LOADER_USER_HELPER=n
        # Some udev rules and virtualization detection relies on it:
        CONFIG_DMIID
        # Support for some SCSI devices serial number retrieval, to create
        # additional symlinks in /dev/disk/ and /dev/tape:
        CONFIG_BLK_DEV_BSG
        # Required for PrivateNetwork= in service units:
        CONFIG_NET_NS
        # Note that systemd-localed.service and other systemd units use
        # PrivateNetwork so this is effectively required.
        # Required for PrivateUsers= in service units:
        CONFIG_USER_NS
        # Optional but strongly recommended:
        CONFIG_IPV6
        CONFIG_AUTOFS_FS
        CONFIG_TMPFS_XATTR
        # CONFIG_TMPFS,EXT4_FS,XFS,BTRFS_FS,...}_POSIX_ACL
        CONFIG_TMPFS_POSIX_ACL
        # TODO: check what other filesystems we need to support
        # TODO: ENABLE CONFIG_EXT4_FS_POSIX_ACL
        CONFIG_XFS_POSIX_ACL
        CONFIG_SECCOMP
        # Required for seccomp support:
        CONFIG_SECCOMP_FILTER
        # (for the kcmp() syscall, used to be under
        # CONFIG_CHECKPOINT_RESTORE before ~5.12):
        CONFIG_KCMP
        CONFIG_NET_SCHED
        CONFIG_NET_SCH_FQ_CODEL
        # Required for CPUShares= in resource control unit settings:
        CONFIG_CGROUP_SCHED
        CONFIG_FAIR_GROUP_SCHED
        # Required for CPUQuota= in resource control unit settings:
        CONFIG_CFS_BANDWIDTH
        # Required for IPAddressDeny=, IPAddressAllow=, IPIngressFilterPath=,
        # IPEgressFilterPath= in resource control unit settings unit settings:
        CONFIG_BPF
        CONFIG_BPF_SYSCALL
        CONFIG_BPF_JIT
        CONFIG_HAVE_EBPF_JIT
        CONFIG_CGROUP_BPF
        # Required for SocketBind{Allow|Deny}=, RestrictNetworkInterfaces= in
        # resource control unit settings:
        CONFIG_BPF
        CONFIG_BPF_SYSCALL
        CONFIG_BPF_JIT
        CONFIG_HAVE_EBPF_JIT
        CONFIG_CGROUP_BPF
        # For UEFI systems:
        CONFIG_EFIVAR_FS
        CONFIG_EFI_PARTITION
        # Required for signed Verity images support:
        # TODO: ENABLE CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG
        # Required to verify signed Verity images using keys enrolled in the MOK
        # (Machine-Owner Key) and DB UEFI certificate stores:
        # TODO: ENABLE CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG_SECONDARY_KEYRING
        # TODO: ENABLE CONFIG_DM_VERITY_VERIFY_ROOTHASH_SIG_PLATFORM_KEYRING
        # TODO: ENABLE CONFIG_IMA_ARCH_POLICY
        # TODO: ENABLE CONFIG_INTEGRITY_MACHINE_KEYRING
        # Required for reading credentials from SMBIOS:
        CONFIG_DMI
        # TODO: ENABLE CONFIG_DMI_SYSFS
        # Required for RestrictFileSystems= in service units:
        CONFIG_BPF
        CONFIG_BPF_SYSCALL
        # TODO: ENABLE CONFIG_BPF_LSM
        # TODO: ENABLE CONFIG_DEBUG_INFO_BTF
        # CONFIG_LSM="...,bpf" or kernel booted with lsm="...,bpf".
        CONFIG_LSM=.*,?bpf,?.*
        # We recommend to turn off Real-Time group scheduling in the kernel when
        # using systemd. RT group scheduling effectively makes RT scheduling
        # unavailable for most userspace, since it requires explicit assignment of
        # RT budgets to each unit whose processes making use of RT. As there's no
        # sensible way to assign these budgets automatically this cannot really be
        # fixed, and it's best to disable group scheduling hence:
        # TODO: look into whether we should set CONFIG_RT_GROUP_SCHED=n
        # Required for systemd-oomd:
        CONFIG_PSI
        CONFIG_MEMCG
        # Note that kernel auditing is broken when used with systemd's container
        # code. When using systemd in conjunction with containers, please make
        # sure to either turn off auditing at runtime using the kernel command
        # line option "audit=0", or turn it off at kernel compile time using:
        # TODO: set CONFIG_AUDIT=n
