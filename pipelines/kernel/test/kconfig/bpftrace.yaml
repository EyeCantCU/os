name: Test that a kernel config includes required options for bpftrace support

inputs:
  config:
    default: "auto"
    description: "Path to kernel config. Default is to find ^boot/config-* in the package under test."

pipeline:
  - uses: kernel/test/kconfig
    with:
      config-path: ${{inputs.config}}
      config-options: |
        # See https://github.com/bpftrace/bpftrace/blob/master/INSTALL.md
        # Last commit to INSTALL.md is 8b6953201724af30c80102b5eab76f3ae073d5c1
        CONFIG_BPF
        CONFIG_BPF_SYSCALL
        CONFIG_BPF_JIT
        CONFIG_HAVE_EBPF_JIT
        CONFIG_BPF_EVENTS
        CONFIG_FTRACE_SYSCALLS
        CONFIG_FUNCTION_TRACER
        CONFIG_HAVE_DYNAMIC_FTRACE
        CONFIG_DYNAMIC_FTRACE
        CONFIG_HAVE_KPROBES
        CONFIG_KPROBES
        CONFIG_KPROBE_EVENTS
        CONFIG_ARCH_SUPPORTS_UPROBES
        CONFIG_UPROBES
        CONFIG_UPROBE_EVENTS
        CONFIG_DEBUG_FS
