name: console_grep

needs:
  packages:
    - qemu
    - grep

inputs:
  string:
    description: String to search for
    required: true

pipeline:
  - name: Check for string in boot output
    runs: |
      set -x

      qemu-img create -f raw nvme.img 1G

      # just a dumb test for now...see if we have a file at /boot/vmlinuz
      [ -e /boot/vmlinuz ]
      # launch qemu, point to our kernel, put kernel boot console on standard out, exit on panic,
      # don't reboot, and make sure we get to the step where we're trying to mount a rootfs
      # todo: we could go even further if we built an initrd and maybe ran the ltp...
      arch=$(uname -m)
      case "$arch" in
        x86_64)
          qemu-system-x86_64 -kernel /boot/vmlinuz -m 1G -nographic -append "console=ttyS0 panic=1" -drive file=./nvme.img,if=none,id=nvm,format=raw -device nvme,serial=deadbeef,drive=nvm -no-reboot |  grep -q "${{inputs.string}}"
        ;;
        aarch64)
          qemu-system-aarch64 -kernel /boot/vmlinuz -m 1G -cpu max -machine virt -nographic -no-reboot -append "panic=1" -drive file=./nvme.img,if=none,id=nvm,format=raw -device nvme,serial=deadbeef,drive=nvm  | grep -q "${{inputs.string}}"
        ;;
      esac
