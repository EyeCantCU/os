name: random_quality

# This is an OK test of random number generation. The average test
# is more likely to catch bugs in glue code than RNG issues, but is
# ok enough to make sure that it is at least random enough to not be
# obviously wrong. The BSSL tests are much better and much more robust,
# see https://boringssl.googlesource.com/boringssl/+/master/crypto/fipsmodule/FIPS.md#rng-design
# An even better test would be running whatever NIST uses.
#
# Note that this test often results on kernel soft-lockups when three things
# are true
# 1. default sample count is used
# 2. hw acceleration is unavailable
# 3. something that needs to be reseeded (such as jitterentropy) is backing
#    urandom & getrandom
# This is always true on ARM64 elastic-builds everywhere we run this at time of
# writing. This is expected behavior, we are collecting enough entropy to force
# the system to reseed whatever is backing urandom & getrandom, which can easily
# lock up the system on a low-entropy system like a pure userspace vm.
# This does not affect test results.
needs:
  packages:
    - qemu
    - busybox-full
    - python3
    - boringssl-fips-static-2023042800-tools
    - posix-libc-utils

inputs:
  sample_count:
    description: Number of random samples to collect from each source
    required: false
    default: 4096
  upper_bound:
    description: Upper bound for average random value (0-1)
    required: false
    default: 0.55
  lower_bound:
    description: Lower bound for average random value (0-1)
    required: false
    default: 0.45
  args:
    description: Kernel cmdline args
    required: false

pipeline:
  - name: Test random number quality in microvm
    runs: |
      set +x

      arch=$(uname -m)

      # Function to copy binary and its dependencies to initrd
      copy_binary_with_deps() {
        local binary="$1"
        local target_dir="$2"

        mkdir -p "$target_dir"
        cp "$binary" "$target_dir/"

        ldd "$binary" 2>/dev/null | while read line; do
          if echo "$line" | grep -q "=>"; then
            # Format: "libname.so => /path/to/lib (0x...)"
            lib_path=$(echo "$line" | sed 's/.*=> \([^ ]*\).*/\1/')
          elif echo "$line" | grep -q "^[[:space:]]*/"; then
            # Format: "/lib64/ld-linux-x86-64.so.2 (0x...)"
            lib_path=$(echo "$line" | awk '{print $1}')
          else
            continue
          fi

          if [ ! -f "$lib_path" ]; then
            continue
          fi

          lib_dir=$(dirname "$lib_path")
          mkdir -p "initrd_root$lib_dir"

          cp "$lib_path" "initrd_root$lib_dir/"
        done
      }

      echo "Creating initrd scripts"

      # Create test script for random quality testing
      cat > random_test.py << 'EOF'
      #!/usr/bin/python3
      import os
      import sys
      import struct
      def test_urandom(sample_count):
          """Test /dev/urandom quality"""
          print(f"Testing /dev/urandom with {sample_count} samples...")
          try:
              with open('/dev/urandom', 'rb') as f:
                  data = f.read(sample_count)
                  # Convert to 0-1 value
              values = [b / 255.0 for b in data]
              average = sum(values) / len(values)
              print(f"URANDOM_AVERAGE: {average:.6f}")
              return average
          except Exception as e:
              print(f"ERROR: Failed to test /dev/urandom: {e}")
          return None
      def test_getrandom(sample_count):
          """Test getrandom() system call quality"""
          print(f"Testing getrandom() with {sample_count} samples...")
          try:
              data = os.getrandom(sample_count)
              # Convert to 0-1 value
              values = [b / 255.0 for b in data]
              average = sum(values) / len(values)
              print(f"GETRANDOM_AVERAGE: {average:.6f}")
              return average
          except Exception as e:
              print(f"ERROR: Failed to test getrandom(): {e}")
          return None
      def main():
          sample_count = int("${{inputs.sample_count}}")
          lower_bound = float("${{inputs.lower_bound}}")
          upper_bound = float("${{inputs.upper_bound}}")
          print(f"Random quality test - samples: {sample_count}, bounds: [{lower_bound}, {upper_bound}]")
          # Test both random sources
          urandom_avg = test_urandom(sample_count)
          getrandom_avg = test_getrandom(sample_count)
          # Check bounds
          success = True
          if urandom_avg is not None:
              if lower_bound <= urandom_avg <= upper_bound:
                  print(f"URANDOM_RESULT: PASS")
              else:
                  print(f"URANDOM_RESULT: FAIL - average {urandom_avg:.6f} outside bounds [{lower_bound}, {upper_bound}]")
                  success = False
          else:
              print(f"URANDOM_RESULT: FAIL - test failed")
              success = False
          if getrandom_avg is not None:
              if lower_bound <= getrandom_avg <= upper_bound:
                  print(f"GETRANDOM_RESULT: PASS")
              else:
                  print(f"GETRANDOM_RESULT: FAIL - average {getrandom_avg:.6f} outside bounds [{lower_bound}, {upper_bound}]")
                  success = False
          else:
              print(f"GETRANDOM_RESULT: FAIL - test failed")
              success = False
          if success:
              print("RANDOM_QUALITY_TEST: PASS")
              sys.exit(0)
          else:
              print("RANDOM_QUALITY_TEST: FAIL")
              sys.exit(1)
      if __name__ == "__main__":
          main()
      EOF

      # Create init script
      cat > init << 'EOF'
      #!/usr/bin/sh
      echo "Preparing for random quality testing."
      # Mount essential filesystems
      mount -t proc proc /proc
      mount -t sysfs sysfs /sys
      mount -t devtmpfs devtmpfs /dev
      # Run the test
      echo "Starting bssl test."
      /usr/bin/bssl genrsa || echo "FAIL bssl genrsa"
      /usr/bin/bssl rand -hex 10240 || echo "FAIL bssl rand"
      echo "Finished bssl test."
      echo "Starting average test."
      /usr/bin/python3 /usr/bin/random_test.py
      echo "Finished average test."
      echo "Finished random quality testing."
      echo s > /proc/sysrq-trigger
      echo o > /proc/sysrq-trigger
      sleep 5
      EOF

      echo "Building initrd baselayout"
      mkdir -p initrd_root/usr/bin
      ln -s usr/bin initrd_root/bin
      ln -s usr/bin initrd_root/sbin
      ln -s bin initrd_root/usr/sbin
      mkdir -p initrd_root/usr/lib
      ln -s usr/lib initrd_root/lib64
      ln -s usr/lib initrd_root/lib
      ln -s lib initrd_root/usr/lib64
      mkdir -p initrd_root/proc
      mkdir -p initrd_root/sys
      mkdir -p initrd_root/dev
      mkdir -p initrd_root/tmp
      echo "Copying binaries and scripts to initrd"
      # Copy binaries and their dependencies
      mv init initrd_root/
      chmod +x initrd_root/init
      mv random_test.py initrd_root/usr/bin/
      chmod +x initrd_root/usr/bin/random_test.py
      copy_binary_with_deps /usr/bin/python3 initrd_root/usr/bin
      copy_binary_with_deps /usr/bin/bssl initrd_root/usr/bin
      copy_binary_with_deps /usr/bin/busybox initrd_root/usr/bin
      /usr/bin/busybox --install -s initrd_root/usr/bin
      for i in /usr/lib/python3*; do
        target=initrd_root/"$i"
        mkdir -p "$(dirname $target)"
        cp -r "$i" "$target"
      done

      echo "Zipping up initrd"
      # Create the initrd
      cd initrd_root
      find . | cpio -o -H newc | gzip > ../test_initrd.gz
      cd ..
      echo "Running microvm"
      case "$arch" in
          x86_64)
            timeout 300 qemu-system-x86_64 \
                -kernel /boot/vmlinuz -m 1G -cpu max -machine q35 \
                -nographic -append "console=ttyS0 init=/init panic=1 ${{inputs.args}}" -initrd test_initrd.gz \
                -no-reboot > qemu_output.log
          ;;
          aarch64)
            timeout 300 qemu-system-aarch64 \
                -kernel /boot/vmlinuz -m 1G -cpu max -machine virt \
                -nographic -append "init=/init panic=1 ${{inputs.args}}" -initrd test_initrd.gz \
                -no-reboot > qemu_output.log
          ;;
      esac
      awk '/Preparing for random quality test/,/Finished random quality test/' qemu_output.log
      if grep -q "FAIL" qemu_output.log; then
        exit 1
      elif ! grep -q "Finished random quality test" qemu_output.log; then
        cat qemu_output.log
        exit 1
      fi
