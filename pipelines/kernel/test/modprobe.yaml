name: modprobe

needs:
  packages:
    - bash
    - busybox-full
    - kmod
    - posix-libc-utils
    - qemu

inputs:
  modprobe:
    description: Name or alias of module to load
    required: true
  modname:
    description: Canonical name of module to load
    required: false
  args:
    description: Kernel cmdline args
    required: false
    default: module.sig_enforce=1

pipeline:
  - name: Test kernel boot and modprobe in microvm
    runs: |
      initrd_root=$(mktemp -t initrd_root.XXXXXXXX -d)
      initrd_image=$(mktemp -t initrd_image.XXXXXXXX)
      arch=$(uname -m)

      # Test script for modprobe testing
      cat > modprobe_test << 'EOF'
      #!/bin/sh
      set -e

      echo "Starting modprobe test."
      trap 'echo "Finished modprobe test."' EXIT

      modprobe="${{inputs.modprobe}}"
      modname="${{inputs.modname}}"
      [ -z "$modname" ] && modname="$modprobe"

      echo "Testing modprobe of: $modprobe"
      echo "Checking that: $modname is loaded"

      if modprobe "$modprobe"; then
          echo "MODPROBE_LOAD: PASS"
      else
          echo "MODPROBE_LOAD: FAIL"
          exit 1
      fi

      # Verify the module is loaded
      if lsmod | grep -q "^$modname"; then
          echo "MODULE_LOADED: PASS"
      else
          echo "MODULE_LOADED: FAIL"
          echo "lsmod: $(lsmod)"
          exit 1
      fi

      # Test unloading the module
      echo "Unloading module: $modprobe"
      if modprobe -r "$modprobe"; then
          echo "MODPROBE_UNLOAD: PASS"
      else
          echo "MODPROBE_UNLOAD: FAIL"
          exit 1
      fi

      # Verify the module is unloaded
      if ! lsmod | grep -q "^$modname"; then
          echo "MODULE_UNLOADED: PASS"
      else
          echo "MODULE_UNLOADED: FAIL"
          echo "lsmod: $(lsmod)"
          exit 1
      fi

      echo "MODPROBE_TEST: PASS"
      EOF
      chmod +x modprobe_test

      ./make-busybox-initramfs make-root "$initrd_root"

      ./make-busybox-initramfs add-modules "$initrd_root"

      ./make-busybox-initramfs make-init "$initrd_root" modprobe_test

      ./make-busybox-initramfs make-image "$initrd_root" "$initrd_image"

      case "$arch" in
          x86_64)
            timeout 300 qemu-system-x86_64 \
                -kernel /boot/vmlinuz -m 1G -cpu max -machine q35 \
                -nographic -append "console=ttyS0 panic=-1 ${{inputs.args}}" -initrd "$initrd_image" \
                -no-reboot > qemu_output.log
          ;;
          aarch64)
            timeout 300 qemu-system-aarch64 \
                -kernel /boot/vmlinuz -m 1G -cpu max -machine virt \
                -nographic -append "panic=-1 ${{inputs.args}}" -initrd "$initrd_image" \
                -no-reboot > qemu_output.log
          ;;
      esac
      awk '/Starting modprobe test/,/Finished modprobe test/' qemu_output.log
      if grep -q "FAIL" qemu_output.log; then
        echo "Test failed - output:"
        cat qemu_output.log
        exit 1
      elif ! grep -q "Finished modprobe test" qemu_output.log; then
        echo "Test did not complete - output:"
        cat qemu_output.log
        exit 1
      fi
