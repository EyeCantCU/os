name: Install kernel modules

needs:
  packages:
    - busybox
    - kmod

inputs:
  version-flavor:
    description: "The version-flavor of the modules dir"
    required: true

pipeline:
  - runs: |
      make -j $(nproc) modules
      # Doesn't really install any modules, what we really care about is modules.builtin.*
      # so things like modprobe and modinfo work.
      make modules_install INSTALL_MOD_PATH=${{targets.subpkgdir}}
      find ${{targets.subpkgdir}}/lib/modules/ -mindepth 2 -maxdepth 2 -name build -type l \
        -delete \
        -exec ln -sf /dev/null {} ';' \
        -quit
