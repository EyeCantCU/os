name: Install kernel modules

needs:
  packages:
    - busybox
    - kmod

inputs:
  version-flavor:
    description: "The version-flavor of the modules dir"
    required: true

pipeline:
  - runs: |
      make -j $(nproc) modules LOCALVERSION=""
      make modules_install INSTALL_MOD_PATH=${{targets.subpkgdir}}/usr ZSTD="zstd -19" INSTALL_MOD_STRIP=1
      rm -f ${{targets.subpkgdir}}/usr/lib/modules/${{inputs.version-flavor}}/build
