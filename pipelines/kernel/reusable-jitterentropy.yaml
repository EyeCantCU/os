name: Use precompiled jitterentropy object for the kernel

needs:
  packages:
    - busybox
    - grep
    - apk-tools
    - linux-jitterentropy~${{inputs.version}}

inputs:
  version:
    description: "Version of linux-jitterentropy"
    required: true
  kernel-version:
    description: "Version of the kernel being compiled"
    required: true

pipeline:
  - name: "Merge jitterentropy kernel config options"
    runs: |
      config=$(apk info -qL "linux-jitterentropy" | grep -E 'config$')
      scripts/kconfig/merge_config.sh -m -r .config /"$config"

  - name: "Copy prebuilt jitterentropy artifacts to local build"
    runs: |
      objects=$(apk info -qL "linux-jitterentropy" | grep -E '[.](o|cmd|c|h)$')
      for i in $objects; do
          target=${i#*/linux-jitterentropy-*/}
          cp /"$i" "$target"
      done

  - name: "Patch kernel build system to accept prebuilt jitterentropy objects"
    uses: patch
    with:
      patches: 0003-crypto-reusable-jitterentropy-${{inputs.kernel-version}}.patch
