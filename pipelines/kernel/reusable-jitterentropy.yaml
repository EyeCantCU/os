name: Use precompiled jitterentropy object for the kernel

needs:
  packages:
    - busybox
    - grep
    - apk-tools
    - ${{inputs.package}}=${{inputs.version}}

inputs:
  package:
    description: "Jitterentropy package to build with."
    required: true
  version:
    description: "Jitterentropy version to build with."
    required: true
  kernel-version:
    description: "Version of the kernel being compiled"
    required: true

pipeline:
  - name: "Merge jitterentropy kernel config options"
    runs: |
      config=$(apk info -qL "${{inputs.package}}" | grep -E 'config$')
      scripts/kconfig/merge_config.sh -m -r .config /"$config"

  - name: "Copy prebuilt jitterentropy artifacts to local build"
    runs: |
      objects=$(apk info -qL "${{inputs.package}}" | grep -E '[.](o|cmd|c|h)$')
      for i in $objects; do
          target=${i#*/${{inputs.package}}*/}
          cp /"$i" "$target"
      done

  - name: "Patch kernel build system to accept prebuilt jitterentropy objects"
    uses: patch
    with:
      patches: patches/${{inputs.kernel-version}}/0004-crypto-reusable-jitterentropy.patch
