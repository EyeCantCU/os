name: Create kernel config

inputs:
  flavor:
    description: "Flavor config to start with"
  make-targets:
    description: "The config make targets to run"
  config-snippets:
    description: "Additional config snippets to apply"
  version-flavor:
    description: "version-flavor of the modules dir"
    required: true

pipeline:
  - name: Initial config flavor
    runs: |
      # To maintain the arch specific configs, copy one of .config-x86 or .config-arm to .config
      # and run 'make menuconfig'. Then copy the resulting .config over the original arch specific config. For example:
      if [ -n "${{inputs.flavor}}" ]; then
        case "${{build.arch}}" in
          x86_64)
            cp config-${{inputs.flavor}}-x86 .config
            ;;
          aarch64)
            cp config-${{inputs.flavor}}-arm .config
            ;;
        esac
      fi

  - name: Executing make-targets
    runs: |
      if [ -n "${{inputs.make-targets}}" ]; then
        make ${{inputs.make-targets}}
      fi

  - name: Setting branding and version
    runs: |
      cat config-branding >> .config
      version=${{package.version}}
      versionflavor=${{inputs.version-flavor}}
      epochflavor=${versionflavor##$version}
      sed -i 's/^.*CONFIG_LOCALVERSION_AUTO.*$/# CONFIG_LOCALVERSION_AUTO is not set/' .config
      sed -i 's/^.*CONFIG_LOCALVERSION=.*$/CONFIG_LOCALVERSION="'$epochflavor'"/' .config

  - name: Additional config snippets
    runs: |
      if [ -n "${{inputs.config-snippets}}" ]; then
        cat ${{inputs.config-snippets}} >> .config
      fi

  - name: Default config snippets
    runs: |
      # Enable fuse and overlayfs stuff for dockerd to work
      cat config-fuse >> .config
      # Enable networking
      cat config-networking >> .config
      # Enable XFS
      cat config-xfs >> .config
      # Enable Systemd kernel requirements
      cat config-systemd >> .config
      # Remove early warnings for missing /etc/target
      sed -i 's|CONFIG_TARGET_CORE=y|# CONFIG_TARGET_CORE is not set|g' .config
