name: Validate an iamguarded chart

needs:
  packages:
    - bash
    - helm
    - ripgrep
    - yq

inputs:
  chart-name:
    description: |
      The name of the chart to validate

pipeline:
  - name: Fetch tools
    uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      branch: tools
      expected-commit: 443c923ccefdbe7d7b0aab1f18351aa6a97e9e25
      destination: ./.iamguarded-tools

  - name: Validate
    runs: |
      ./.iamguarded-tools/hack/validate.sh ${{inputs.chart-name}}
