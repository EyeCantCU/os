name: Prepare a target Chart

needs:
  packages:
    - bash
    - ripgrep
    - sed

inputs:
  chart-path:
    description: |
      The path to the chart to prepare for packaging

pipeline:
  - name: Fetch tools
    pipeline:
      - uses: auth/github
        with:
          repo: chainguard-dev/iamguarded-tools
      - uses: git-checkout
        with:
          repository: https://github.com/chainguard-dev/iamguarded-tools
          branch: main
          destination: ./.iamguarded-tools

  - name: Prepare
    runs: |
      ./.iamguarded-tools/chart/prepare.sh ${{inputs.chart-path}}
