name: Bump Maven dependencies to specified versions

# Backwards-compatible wrapper for pombump using omnibump
# This pipeline provides the same interface as the legacy pombump tool
# but uses omnibump under the hood for unified dependency management

needs:
  packages:
    - git
    - omnibump

inputs:
  patch-file:
    description: "Dependency patch file (e.g., pombump-deps.yaml)"
    default: ""
  properties-file:
    description: "Properties file for Maven properties (e.g., pombump-properties.yaml)"
    default: ""
  pom:
    description: "Path to specific pom.xml file (defaults to root pom.xml)"
    default: ""
  packages:
    description: "Inline package list (space-separated, Maven format: groupId@artifactId@version)"
    default: ""
  show-diff:
    description: "Show the diff of changes made to pom.xml"
    default: false

pipeline:
  - runs: |
      set -euo pipefail

      # Determine working directory based on pom input
      WORKING_DIR="."
      if [ -n "${{inputs.pom}}" ]; then
        # If pom is specified, work in its directory
        WORKING_DIR=$(dirname "${{inputs.pom}}")
      fi

      cd "${WORKING_DIR}"

      # Build omnibump command
      OMNIBUMP_CMD="omnibump --language java"

      # Add deps file if specified
      if [ -n "${{inputs.patch-file}}" ]; then
        OMNIBUMP_CMD="${OMNIBUMP_CMD} --deps ${{inputs.patch-file}}"
      fi

      # Add properties file if specified
      if [ -n "${{inputs.properties-file}}" ]; then
        OMNIBUMP_CMD="${OMNIBUMP_CMD} --properties ${{inputs.properties-file}}"
      fi

      # Add inline packages if specified
      if [ -n "${{inputs.packages}}" ]; then
        OMNIBUMP_CMD="${OMNIBUMP_CMD} --packages \"${{inputs.packages}}\""
      fi

      # Add show-diff flag if enabled
      if [ "${{inputs.show-diff}}" = "true" ]; then
        OMNIBUMP_CMD="${OMNIBUMP_CMD} --show-diff"
      fi

      # If no parameters provided, try default files
      if [ -z "${{inputs.patch-file}}" ] && [ -z "${{inputs.properties-file}}" ] && [ -z "${{inputs.packages}}" ]; then
        # Check for default pombump files
        if [ -f "pombump-deps.yaml" ]; then
          OMNIBUMP_CMD="${OMNIBUMP_CMD} --deps pombump-deps.yaml"
        fi
        if [ -f "pombump-properties.yaml" ]; then
          OMNIBUMP_CMD="${OMNIBUMP_CMD} --properties pombump-properties.yaml"
        fi
      fi

      # Execute omnibump
      eval "${OMNIBUMP_CMD}"
