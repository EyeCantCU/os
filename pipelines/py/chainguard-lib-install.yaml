name: Installs a Python package via Chainguard Libraries with uv

needs:
  packages:
    - busybox
    - uv

inputs:
  package:
    description: "Name of package to install."
    default: ""
  python:
    description: "Python version, executable, or executable path to use."
    required: true

pipeline:
  # Every library we install on an individual basis must come from us
  # anyway so enforce use of our libraries
  - uses: auth/uv

  - runs: |
      # Set SOURCE_DATE_EPOCH to 1980-01-01 to appease ZIP
      # It's possible to run into:
      # - "ZIP does not support timestamps before 1980"
      # When libraries are provided as zips. We can work
      # around this by setting the SDE to 1980-01-01. I
      # imagine this is a bug though given we set the
      # SDE inline with the current date and time
      export SOURCE_DATE_EPOCH=315532800

      # Set Python version
      export "UV_PYTHON=${{inputs.python}}"

      # Default to package.name, if package not specified
      package="${{inputs.package}}"
      if [ -z "$package" ]; then
        # Remove py3- prefix from package name, if present
        package_name="${{package.name}}"
        package="${package_name#py3-}"
      fi

      # Install package
      mkdir -p "${{targets.contextdir}}"
      uv pip install \
        --config-file /etc/uv/uv.toml --no-deps \
        --system --prefix "${{targets.contextdir}}/usr" \
        "$package==${{package.version}}"

      # Remove lockfile
      rm "${{targets.contextdir}}/usr/.lock"
