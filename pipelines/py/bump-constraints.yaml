name: Bump Python constraint pins

inputs:
  constraints-file:
    description: Path to the constraints file to update
    default: constraints.txt
  packages:
    description: List of package==version pairs to update (space or newline separated)
    required: true

pipeline:
  - name: "bump constraint pins"
    runs: |
      set -euo pipefail

      constraints_file="${{inputs.constraints-file}}"
      packages="${{inputs.packages}}"

      if [ ! -f "$constraints_file" ]; then
        echo "ERROR: Constraints file '$constraints_file' not found" 1>&2
        exit 1
      fi

      echo "Updating constraints in: $constraints_file"

      # Create backup
      cp "$constraints_file" "${constraints_file}.bak"
      echo "Created backup: ${constraints_file}.bak"

      # Convert newline-separated to space-separated and handle both formats
      # This allows both space-separated and YAML multiline | format
      packages_list=$(echo "$packages" | tr '\n' ' ')

      echo "Packages to update:"
      for pkg_spec in $packages_list; do
        [ -n "$pkg_spec" ] && echo "  - $pkg_spec"
      done
      echo ""

      # Process each package update
      for pkg_spec in $packages_list; do
        # Skip empty entries
        [ -z "$pkg_spec" ] && continue
        # Parse package name and version
        if [[ "$pkg_spec" =~ ^([a-zA-Z0-9_.-]+)==([0-9.]+.*)$ ]]; then
          pkg_name="${BASH_REMATCH[1]}"
          new_version="${BASH_REMATCH[2]}"
        else
          echo "ERROR: Invalid package specification '$pkg_spec'. Use format: package==version" 1>&2
          exit 1
        fi

        echo "Processing: $pkg_name -> $new_version"

        # Check if package exists in constraints file
        if grep -q "^${pkg_name}[=<>!~]" "$constraints_file"; then
          # Update existing constraint
          old_line=$(grep "^${pkg_name}[=<>!~]" "$constraints_file")
          # Extract the operator (==, >=, <=, etc.)
          operator=$(echo "$old_line" | sed -n "s/^${pkg_name}\([=<>!~]*\).*/\1/p")
          # If no operator found or it's just a single =, use ==
          if [ -z "$operator" ] || [ "$operator" = "=" ]; then
            operator="=="
          fi

          # Update the line preserving any comments or markers
          sed -i "s|^${pkg_name}[=<>!~][^;#]*|${pkg_name}${operator}${new_version}|" "$constraints_file"

          echo "  Updated: $old_line -> ${pkg_name}${operator}${new_version}"
        else
          # Add new constraint
          echo "${pkg_name}==${new_version}" >> "$constraints_file"
          echo "  Added: ${pkg_name}==${new_version}"
        fi
      done

      echo ""
      echo "Successfully updated $constraints_file"

      # Show diff if available
      if command -v diff >/dev/null 2>&1; then
        echo ""
        echo "Changes made:"
        diff -u "${constraints_file}.bak" "$constraints_file" || true
      fi
