name: Remove CGO_ENABLED=0 from files

# Leave go off here, some packages pin to an older version. Let's just assume this gets injected elsewhere.
needs:
  packages:
    - busybox

inputs:
  files:
    description: "The files to operate on. Space separated."
    required: false
    default: "Makefile"
  seds:
    description: "Sed strings (-e) to use. newline separated."
    required: false
    default: "s,CGO_ENABLED=0[ ]*,,g"

pipeline:
  - runs: |
      fail() { echo "$@" 1>&2; exit 1; }

      td=$(mktemp -d) || fail "failed mktemp"
      cat > "$td/seds" <<"EOF"
      ${{inputs.seds}}
      EOF

      set --
      while read line ; do
          [ -n "$line" ] || continue
          set -- "$@" "-e" "$line"
      done <"$td/seds"

      trap "rm -Rf '$td'" EXIT
      for f in ${{inputs.files}} ; do
          [ -f "$f" ] || fail "$f: not a file"
          bk="$td/${f##*/}"
          cp "$f" "$bk" || fail "failed backup of $f"
          sed -i "$@" -- "$f" ||
              fail "failed sed-editing $f"
          if diff -u "$bk" "$f" > "$td/diff"; then
              fail "editing '$f' did not make a change with sed $*"
          fi
          echo "updated $f as follows"
          sed 's,^,>,' "$td/diff"
      done
