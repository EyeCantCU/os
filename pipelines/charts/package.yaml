name: Package a target Chart

needs:
  packages:
    - bash
    - busybox
    - helm
    - helm-docs
    - yq

inputs:
  chart-path:
    description: |
      The path to the chart to package

pipeline:
  - name: Package the target chart
    working-directory: ${{inputs.chart-path}}
    runs: |
      # resolve any dependencies
      # TODO: This goes away when we vendor our own
      helm dependency update

      # regenerate the helm docs
      helm-docs

      # package the chart (use a tgz round trip since "helm package" enforces a correct chart structure)
      ptmp=$(mktemp -d)
      helm package . --destination=$ptmp \
        --version=${{package.version}}

      # unpackage the chart to the ${{targets.contextdir}} directory
      tar -xf $ptmp/*.tgz -C ${{targets.contextdir}}

      # Attempt to template it if its not a library chart
      cname=$(yq -e '.name' Chart.yaml)
      if [ "$(yq -e '.type == "library"' Chart.yaml)" != "true" ]; then
        helm template ${{targets.contextdir}}/$cname
      fi
