name: Package a target Chart

needs:
  packages:
    - bash
    - busybox
    - helm
    - helm-docs
    - jq
    - yq

inputs:
  chart-path:
    description: |
      The path to the chart to package
  images:
    description: |
      Optional. YAML defining named images and their value mappings.
      Each image declares its Helm values with simple markers.

      Available markers (from #ImageRef):
        ${registry}       - Registry hostname (e.g., cgr.dev)
        ${repo}           - Repository path (e.g., chainguard/nginx)
        ${registry_repo}  - Combined registry/repo
        ${digest}         - Image digest (sha256:...)
        ${pseudo_tag}     - Tag for digest refs (unused@sha256:...)
        ${ref}            - Full image reference

      Example:
        images: |
          main:
            values:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${pseudo_tag}
                sha: ${digest}
          sidecar:
            values:
              sidecar:
                image:
                  repository: ${registry_repo}
  test:
    description: |
      Optional. YAML defining test configuration for chart validation.
      Contains values to merge (e.g., pull secrets) and test cases.

      Example:
        test: |
          values:
            imagePullSecrets:
              - name: my-pull-secret
          cases:
            - name: default
            - name: with-sidecar
              values:
                sidecar:
                  enabled: true

pipeline:
  - name: Package the target chart
    working-directory: ${{inputs.chart-path}}
    runs: |
      # Remove any leftover .orig files from applying the iamguarded.patch
      find -name '*.orig' -exec rm -f {} \;

      # Vendor any local dependencies
      # NOTE: This is a two step process, and relies on the dependent charts
      # ALREADY being packaged as an apk and manually specified as a dependency
      # in the build environment.
      # NOTE: We vendor the dependencies instead of fetching the remote chart
      # to avoid needing to plumb cgr.dev auth into the package build
      # environment. From a helm perspective, the result is identical since the
      # `helm package` below will fetch the dependent charts and package it all
      # together anyways. The only thing this changes is the appearance of
      # Chart.yaml, which will show a `file://` dependency instead of an
      # `oci://` dependency. At `helm install` time, none of this matters
      # because the dependent charts are already vendored.
      if yq -e '.dependencies' Chart.yaml > /dev/null 2>&1; then
        # Process each dependency using yq
        for dep_name in $(yq -e '.dependencies[].name' Chart.yaml); do
          # Update the repository for this dependency to use file:///name format
          yq -i ".dependencies[] |= select(.name == \"$dep_name\") |= .repository = \"file:///$dep_name\"" Chart.yaml

          echo "Vendoring dependency: $dep_name with repository: file:///$dep_name"
        done
      fi

      # regenerate the Chart.lock with the newly vendored dependencies
      helm dependency update
      helm dependency build

      # regenerate the helm docs
      helm-docs

      # package the chart (use a tgz round trip since "helm package" enforces a correct chart structure)
      ptmp=$(mktemp -d)
      helm package . --destination=$ptmp \
        --version=${{package.version}}

      # unpackage the chart to the ${{targets.contextdir}} directory
      tar -xf $ptmp/*.tgz -C ${{targets.contextdir}}

      # Attempt to template it if its not a library chart
      cname=$(yq -e '.name' Chart.yaml)
      if [ "$(yq -e '.type == "library"' Chart.yaml)" != "true" ]; then
        helm template ${{targets.contextdir}}/$cname
      fi

  - name: Write values.images.json
    runs: |
      set -eu

      images_input='${{inputs.images}}'
      test_input='${{inputs.test}}'

      if [ -z "$images_input" ]; then
        echo "No images input, skipping values.images.json"
        exit 0
      fi

      cname=$(yq -e '.name' ${{inputs.chart-path}}/Chart.yaml)
      output_file="${{targets.contextdir}}/$cname/values.images.json"

      # Transform ${field} strings to {"$ref": "field"} objects
      images_json=$(echo "$images_input" | yq -o=json | jq 'walk(
        if type == "string" and test("^\\$\\{[a-z_]+\\}$") then
          {"$ref": (ltrimstr("${") | rtrimstr("}"))}
        else . end
      )')

      # Default test config if not provided
      test_json=$(echo "${test_input:-"{}"}" | yq -o=json)
      if [ "$test_json" = "{}" ]; then
        test_json='{"values": {}, "cases": [{"name": "default"}]}'
      fi

      # Build final schema
      jq -n \
        --argjson images "$images_json" \
        --argjson test "$test_json" \
        '{version: "1", images: $images, test: $test}' \
        | tee "$output_file"
