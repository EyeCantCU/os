name: oldlibstdc++

needs:
  packages:
    - binutils
    - gawk
    - posix-libc-utils

inputs:
  oldlib:
    description: |
      Path to a libstdc++.so which provides the target ABI
    required: true
  newlib:
    description: |
      Path to a libstdc++.so that contains symbols beyond the target ABI
    required: true
  nonsharedlib:
    description: |
      Path to a libstdc++_nonshared.a, which provides the ABI delta between oldlib and newlib
    required: true
  cc:
    description: |
      Path to the compiler to use to run the test
    required: false
    default: gcc
  cc-prefix-dir:
    description: |
      Path to the compiler's install prefix
    required: false
    default: ""

pipeline:
  - name: "check that the nonshared lib contains the symbol delta"
    runs: |
      # cargo-culted from https://git.almalinux.org/rpms/gcc-toolset-14-gcc/src/commit/62cb63d4a3ddb6b77a5a69794f2b8f76c3a25ad1/SPECS/gcc.spec#L1149
      tmpdir="$(mktemp -d)"
      readelf -Ws "${{inputs.oldlib}}" | sed -n '/\.symtab/,$d;/ UND /d;/@GLIBC_PRIVATE/d;/\(GLOBAL\|WEAK\|UNIQUE\)/p' | awk '{ if ($4 == "OBJECT") { printf "%s %s %s %s %s\n", $8, $4, $5, $6, $3 } else { printf "%s %s %s %s\n", $8, $4, $5, $6 }}' | sed 's/ UNIQUE / GLOBAL /;s/ WEAK / GLOBAL /;s/@@GLIBCXX_\(LDBL_\)\?[0-9.]*//;s/@@CXXABI_TM_[0-9.]*//;s/@@CXXABI_FLOAT128//;s/@@CXXABI_\(LDBL_\)\?[0-9.]*//' | LC_ALL=C sort -u > "$tmpdir/system.abilist"
      readelf -Ws "${{inputs.newlib}}" | sed -n '/\.symtab/,$d;/ UND /d;/@GLIBC_PRIVATE/d;/\(GLOBAL\|WEAK\|UNIQUE\)/p' | awk '{ if ($4 == "OBJECT") { printf "%s %s %s %s %s\n", $8, $4, $5, $6, $3 } else { printf "%s %s %s %s\n", $8, $4, $5, $6 }}' | sed 's/ UNIQUE / GLOBAL /;s/ WEAK / GLOBAL /;s/@@GLIBCXX_\(LDBL_\)\?[0-9.]*//;s/@@CXXABI_TM_[0-9.]*//;s/@@CXXABI_FLOAT128//;s/@@CXXABI_\(LDBL_\)\?[0-9.]*//' | LC_ALL=C sort -u > "$tmpdir/vanilla.abilist"
      diff -up "$tmpdir/system.abilist" "$tmpdir/vanilla.abilist" | awk '/^\+\+\+/{next}/^\+/{print gensub(/^+(.*)$/,"\\1","1",$0)}' > "$tmpdir/system2vanilla.abilist.diff"
      if [ -n "${{inputs.cc-prefix-dir}}" ]; then
        prefix_arg="-B ${{inputs.cc-prefix-dir}}"
      else
        prefix_arg=""
      fi
      GCC_SPEC_FILE=/dev/null "${{inputs.cc}}" $prefix_arg -shared -o "$tmpdir/libstdc++_nonshared.so" -Wl,--whole-archive "${{inputs.nonsharedlib}}" -Wl,--no-whole-archive "${{inputs.oldlib}}"
      readelf -Ws "$tmpdir/libstdc++_nonshared.so" | sed -n '/\.symtab/,$d;/ UND /d;/@GLIBC_PRIVATE/d;/\(GLOBAL\|WEAK\|UNIQUE\)/p' | awk '{ if ($4 == "OBJECT") { printf "%s %s %s %s %s\n", $8, $4, $5, $6, $3 } else { printf "%s %s %s %s\n", $8, $4, $5, $6 }}' | sed 's/ UNIQUE / GLOBAL /;s/ WEAK / GLOBAL /;s/@@GLIBCXX_\(LDBL_\)\?[0-9.]*//;s/@@CXXABI_TM_[0-9.]*//;s/@@CXXABI_FLOAT128//;s/@@CXXABI_\(LDBL_\)\?[0-9.]*//' | LC_ALL=C sort -u > "$tmpdir/nonshared.abilist"
      echo ====================NONSHARED=========================
      ldd -d -r "$tmpdir/libstdc++_nonshared.so"
      ldd -u "$tmpdir/libstdc++_nonshared.so"
      # FIXME: We should check that the expected CXXABI and GLIBCXX vars are present,
      # and make sure the delta for other symbols only goes down.
      diff -up "$tmpdir/system2vanilla.abilist.diff" "$tmpdir/nonshared.abilist" || :
      readelf -Ws "${{inputs.nonsharedlib}}" | grep HIDDEN.*UND | grep -v __dso_handle || exit 0
      echo ====================NONSHARED END=====================
