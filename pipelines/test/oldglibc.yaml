name: oldglibc

needs:
  packages:
    - binutils

inputs:
  files:
    description: |
      The files to run oldglibc check
    required: true
  version:
    description: |
      The maximum allowed version from: 2.26, 2.28, 2.34
    default: 2.26

pipeline:
  - name: "check to ensure binary uses oldglibc abi"
    runs: |
      for file in ${{inputs.files}}
      do
        [ -f $file ]
        case ${{inputs.version}} in
        2.26)
          [ -z "$(readelf --version-info --wide $file | grep -e 'GLIBC_2.2[7-9]' -e 'GLIBC_2.[3-9][0-9]')" ]
          ;;
        2.28)
          [ -z "$(readelf --version-info --wide $file | grep -e 'GLIBC_2.29' -e 'GLIBC_2.[3-9][0-9]')" ]
          ;;
        2.34)
          [ -z "$(readelf --version-info --wide $file | grep -e 'GLIBC_2.3[5-9]' -e 'GLIBC_2.[4-9][0-9]')" ]
          ;;
        *)
          echo unknown version, please edit pipeline patterns
          exit 1
          ;;
        esac
      done
