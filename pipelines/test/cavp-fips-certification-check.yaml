name: Check NIST CAVP algorithm test results

needs:
  packages:
    - busybox
    - wget

inputs:
  product:
    description: |
      CAVP product id, url of the product page
    required: true
  name:
    description: |
      Expected Implementation Name, string
    required: true
  software-version:
    description: |
      Expected software version, string
    required: true
  validation:
    description: |
      Expected validation id, url of the cavp-number
    required: true
  cavp-number:
    description: |
      Expected A### number of the validation
    required: true

pipeline:
  - name: "check NIST CAVP product page"
    runs: |
      # Downloading cavp certificate
      wget -q -O cavp.html 'https://csrc.nist.gov/projects/Cryptographic-Algorithm-Validation-Program/details?product=${{inputs.product}}'
      # Scrape details
      grep '<a href="details?product=${{inputs.product}}" id="product-name">${{inputs.name}}</a>' cavp.html
      grep 'id="product-version">${{inputs.software-version}}</div>' cavp.html
      grep '<a href="details?validation=${{inputs.validation}}">${{inputs.cavp-number}}</a>' cavp.html
