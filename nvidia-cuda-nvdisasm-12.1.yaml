package:
  name: nvidia-cuda-nvdisasm-12.1
  version: 12.1.55
  epoch: 1
  description: CUDA nvdisasm
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-cuda-nvdisasm=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvdisasm/linux-sbsa/cuda_nvdisasm-linux-sbsa-12.1.55-archive.tar.xz"
          expected-sha256: "e29fe6120021619f0a5e051bee3d3b4b457c5512d1c40dc23d51a1aa054357a7"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvdisasm/linux-x86_64/cuda_nvdisasm-linux-x86_64-12.1.55-archive.tar.xz"
          expected-sha256: "5fbc8f2b12b212aecaaf4594405f878dabd10b3e647bc904d8494c3c44c5b9be"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.1/
      mv bin ${{targets.destdir}}/usr/local/cuda-12.1/
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.1/${{package.name}}.LICENSE

update:
  enabled: false
