package:
  name: libmad
  version: 0.15.1b
  epoch: 0
  description:
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox

vars:
  soversion: "0"

pipeline:
  - uses: fetch
    with:
      uri: ftp://ftp.mars.org/pub/mpeg/${{package.name}}-${{package.version}}.tar.gz
      expected-sha512: "2cad30347fb310dc605c46bacd9da117f447a5cabedd8fefdb24ab5de641429e5ec5ce8af7aefa6a75a3f545d3adfa255e3fa0a2d50971f76bc0c4fc0400cc45"

  - uses: patch
    with:
      patches: optimize.diff amd64-64bit.diff

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-${{vars.soversion}}
    pipeline:
      - uses: split/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-dev
    dependencies:
      runtime:
        - ${{package.name}}-${{vars.soversion}}==${{package.full-version}}
    pipeline:
      - uses: split/dev
      - runs: |
          rmdir "${{targets.destdir}}/usr/lib"
          rmdir "${{targets.destdir}}/usr"

update:
  enabled: true
  release-monitor:
    identifier: 21487

test:
  pipeline:
    - uses: test/emptypackage
