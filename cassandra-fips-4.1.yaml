#nolint:valid-pipeline-git-checkout-tag
package:
  name: cassandra-fips-4.1
  version: 4.1.7
  epoch: 6
  description: Open Source NoSQL Database
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - bcfips-policy-140-3-j${{vars.java-version}}
      - coreutils
      - jemalloc
      - openjdk-${{vars.java-version}}-default-jvm
      - python-${{vars.python-version}} # needed for cqlsh
    provides:
      - cassandra-fips=${{package.full-version}}

vars:
  python-version: 3.11
  java-version: 11

environment:
  contents:
    packages:
      - ant
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - gh
      - git
      - openjdk-${{vars.java-version}}-default-jdk
      - python-${{vars.python-version}}
  environment:
    JAVA_HOME: /usr/lib/jvm/java-${{vars.java-version}}-openjdk
    CASSANDRA_USE_JDK11: true

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/ecosystems-cassandra

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/ecosystems-cassandra
      expected-commit: 19fb9cfb3820577d6b196f9ab1e76882165953c8
      branch: fips-${{package.version}}

  - uses: patch
    with:
      # Bumps snakeyaml, jackson-databind and commons-lang3 to mitigate a bunch of CVEs
      patches: bumpdeps.patch

  - runs: |
      ant artifacts -Dversion=${{package.version}}

      # Install cassandra from the tarball in build/dist into the destdir in /usr/share/java/cassandra
      mkdir -p "${{targets.destdir}}"/usr/share/java/cassandra
      tar --strip-components 1 -C "${{targets.destdir}}"/usr/share/java/cassandra -xzf build/apache-cassandra-${{package.version}}-bin.tar.gz

      # Remove pre-built binaries for architectures we don't support.
      find . -name "libsigar*" | grep -vE '(amd64|arm64|x86)-linux' | xargs rm -f

      # Symlink everything in the cassandra bin directory into /usr/bin
      mkdir -p "${{targets.destdir}}"/usr/bin/

      for f in /home/build/build/dist/bin/*; do
        filename=$(basename "$f")
        ln -sf  /usr/share/java/cassandra/bin/"$filename" "${{targets.destdir}}"/usr/bin/"$filename"
      done

      mkdir -p ${{targets.destdir}}/var/lib/cassandra
      mkdir -p ${{targets.destdir}}/var/log/cassandra

      ln -sT /var/lib/cassandra/ "${{targets.destdir}}"/usr/share/java/cassandra/data
      ln -sT /var/log/cassandra/ "${{targets.destdir}}"/usr/share/java/cassandra/logs

      # Configure FIPS mode in cassandra-env.sh
      if [ -f "${{targets.destdir}}"/usr/share/java/cassandra/conf/cassandra-env.sh ]; then
        cat >>"${{targets.destdir}}"/usr/share/java/cassandra/conf/cassandra-env.sh <<'EOF'

      # FIPS Configuration
      JVM_OPTS="$JVM_OPTS -Djava.security.egd=file:/dev/urandom"
      JVM_OPTS="$JVM_OPTS -Djavax.net.ssl.trustStoreType=FIPS"
      CLASSPATH="/usr/share/java/bouncycastle-fips/*:$CLASSPATH"
      EOF
      fi

subpackages:
  - name: ${{package.name}}-compat
    dependencies:
      provides:
        - cassandra-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/etc
          ln -s /opt/cassandra/conf ${{targets.subpkgdir}}/etc/cassandra
          mkdir -p ${{targets.subpkgdir}}/opt
          ln -s /usr/share/java/cassandra ${{targets.subpkgdir}}/opt/cassandra
    # test added by a robot (compat)
    test:
      pipeline:
        - runs: |
            readlink -v /etc/cassandra
            readlink -v /opt/cassandra

update:
  enabled: false
  manual: true
  schedule:
    period: daily
    reason: Currently we maintain single branch. And 'cg' tool doesn't support to access private repos as of now. See, https://github.com/chainguard-dev/internal-dev/issues/9318.
  git: {}

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-compat
        - openjdk-${{vars.java-version}}-default-jdk
    environment:
      LANG: en_US.UTF-8
      CASSANDRA_HOME: /opt/cassandra
      CASSANDRA_CONF: /opt/cassandra/conf
      CASSANDRA_LOGS_DIR: /opt/cassandra/logs
      PATH: /usr/sbin:/sbin:/usr/bin:/bin:/opt/cassandra/bin/
      JDK_JAVA_OPTIONS: "-Djavax.net.ssl.trustStoreType=FIPS"
  pipeline:
    - runs: apk fix openjdk-${{vars.java-version}} # FIXME: Band-aid for "Module jdk.compiler not found" issue when running "java-fips/algorithms" pipeline.
    - uses: java-fips/algorithms
      with:
        java-version: ${{vars.java-version}}
    - runs: |
        cqlsh --version
        cqlsh --help
        cqlsh.py --version
        cqlsh.py --help
        stop-server -h
    - name: "Test Cassandra server startup"
      uses: test/daemon-check-output
      with:
        start: |
          cassandra -R -f
        timeout: 120
        expected_output: |
          Startup complete
        post: |
          # Basic connectivity test
          nodetool status | grep -q "UN"

          # Run CQL operations
          cqlsh -e "CREATE KEYSPACE IF NOT EXISTS test_ks
            WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"

          cqlsh -e "CREATE TABLE IF NOT EXISTS test_ks.test_table
            (id uuid PRIMARY KEY, value text);"

          cqlsh -e "INSERT INTO test_ks.test_table (id, value)
            VALUES (uuid(), 'test_value');"

          # Verify data
          cqlsh -e "SELECT value FROM test_ks.test_table;" | grep -q "test_value"

          # Check node tools
          nodetool info | grep -q "Native Transport active"
