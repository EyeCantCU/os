package:
  name: minify-fips
  version: 2.20.37
  epoch: 1
  description: "Go minifiers for web formats"
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tdewolff/minify
      tag: v${{package.version}}
      expected-commit: f50b46a5dc82eccfc4b49980c64a4886e084cf8b

  - uses: go/build
    with:
      packages: ./cmd/minify
      output: minify
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: tdewolff/minify
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        minify --version
