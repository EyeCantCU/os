package:
  name: minify-fips
  version: "2.22.3"
  epoch: 0
  description: "Go minifiers for web formats"
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tdewolff/minify
      tag: v${{package.version}}
      expected-commit: d4af2424789b325427f37f6ac9593c60bad9b689

  - uses: go/build
    with:
      packages: ./cmd/minify
      output: minify
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: tdewolff/minify
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        minify --help
    - runs: |
        minify --version
