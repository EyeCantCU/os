package:
  name: minify-fips
  version: "2.24.6"
  epoch: 0
  description: "Go minifiers for web formats"
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tdewolff/minify
      tag: v${{package.version}}
      expected-commit: be173cd73af6c09e00d0e9b4a7d8c5d7e0eb52aa

  - uses: go/build
    with:
      packages: ./cmd/minify
      output: minify
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: tdewolff/minify
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        minify --help
    - runs: |
        minify --version
