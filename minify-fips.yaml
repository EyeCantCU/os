package:
  name: minify-fips
  version: "2.24.5"
  epoch: 1
  description: "Go minifiers for web formats"
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tdewolff/minify
      tag: v${{package.version}}
      expected-commit: 7575c4330b32891e1c7316a5a038c70a283eedb2

  - uses: go/build
    with:
      packages: ./cmd/minify
      output: minify
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: tdewolff/minify
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        minify --help
    - runs: |
        minify --version
