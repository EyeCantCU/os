package:
  name: jsonnet-bundler
  version: 0.6.0
  epoch: 10 # CVE-2025-61725
  description: The jsonnet-bundler is a package manager for Jsonnet.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jsonnet-bundler/jsonnet-bundler
      tag: v${{package.version}}
      expected-commit: ddded59c7066658f3d5abc7fcfc6be2220c92cad

  - uses: go/build
    with:
      packages: ./cmd/jb/
      output: jb
      ldflags: -X "main.Version=${{package.version}}"

update:
  enabled: true
  github:
    identifier: jsonnet-bundler/jsonnet-bundler
    strip-prefix: v

test:
  pipeline:
    - runs: |
        jb --version
        jb --help
