package:
  name: hugo-fips
  version: "0.150.0"
  epoch: 0 # CVE-2025-47907
  description: The world's fastest framework for building websites.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gohugoio/hugo
      tag: v${{package.version}}
      expected-commit: 3f5473b7d4e7377e807290c3acc89feeef1aaa71

  - uses: go/build
    with:
      packages: .
      output: hugo
      tags: extended
      go-package: go-fips-md5

update:
  enabled: true
  github:
    identifier: gohugoio/hugo
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - name: Hugo help/version check
      runs: |
        hugo help
        hugo version | grep ${{package.version}}
    - name: Create a new Hugo site
      runs: hugo new site test-site
    - uses: test/daemon-check-output
      working-directory: test-site
      with:
        start: /usr/bin/hugo serve
        expected_output: "Web Server is available at"
        timeout: 10
