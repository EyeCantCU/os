package:
  name: ko-fips
  version: 0.16.0
  epoch: 6
  description: Simple, fast container image builder for Go applications.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # for fips config & fips-provider
      - openssl-config-fipshardened
      # either melange SCA should provide these
      # or we should make go-fips shared link on these
      - so:libcrypto.so.3
      - so:libssl.so.3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ko-build/ko
      tag: v${{package.version}}
      expected-commit: 0dcace336cc5f723150d77487dbaf56f849cc361
      destination: ko

  - uses: go/bump
    with:
      deps: github.com/docker/docker@v26.1.5
      modroot: ko

  - uses: go/build
    with:
      packages: .
      output: ko
      modroot: ko
      ldflags: -X github.com/google/ko/pkg/commands.Version=${{package.version}}
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: ko-build/ko
    strip-prefix: v
