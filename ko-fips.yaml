package:
  name: ko-fips
  version: 0.15.2
  epoch: 0
  description: Simple, fast container image builder for Go applications.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ko-build/ko
      tag: v${{package.version}}
      expected-commit: 348ca2d9731d3c19da9c785f06aac590954a7e27
      destination: ko

  - uses: go/bump
    with:
      deps: gopkg.in/go-jose/go-jose.v2@v2.6.3
      modroot: ko

  - uses: go/build
    with:
      packages: .
      output: ko
      modroot: ko
      ldflags: -w -X github.com/google/ko/pkg/commands.Version=${{package.version}}
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: ko-build/ko
    strip-prefix: v
