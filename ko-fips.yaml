package:
  name: ko-fips
  version: 0.17.0
  epoch: 0
  description: Simple, fast container image builder for Go applications.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # for fips config & fips-provider
      - openssl-config-fipshardened
      # either melange SCA should provide these
      # or we should make go-fips shared link on these
      - so:libcrypto.so.3
      - so:libssl.so.3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ko-build/ko
      tag: v${{package.version}}
      expected-commit: ac22328979cdb74b20efd8e7fd8d749d2794e1b0
      destination: ko

  - uses: go/build
    with:
      packages: .
      output: ko
      modroot: ko
      ldflags: -X github.com/google/ko/pkg/commands.Version=${{package.version}}
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: ko-build/ko
    strip-prefix: v

test:
  pipeline:
    - runs: |
        ko version
        ko --help
