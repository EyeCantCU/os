package:
  name: cockroach-24.2
  version: "24.2.10"
  description: "CockroachDB — the cloud native, distributed SQL database designed for high availability, effortless scale, and control over data placement"
  epoch: 2
  dependencies:
    provides:
      - cockroach=${{package.full-version}}
  copyright:
    - license: LicenseRef-CockroachDB-Software-License
      license-path: LICENSE

environment:
  contents:
    packages:
      - bazel-6 # https://github.com/bazelbuild/bazel/issues/19132 (incomptible, only bump when bazel rules are updated.)
      - busybox
      - ca-certificates-bundle
      - gnutar
      - go
      - openjdk-21
      - patch
  environment:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk
    USER: wolfi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cockroachdb/cockroach.git
      tag: v${{package.version}}
      expected-commit: 046116ac37efed5175dd59aaaadf91d1f7c12010

  - if: ${{build.arch}} == "x86_64"
    runs: |
      bazel build pkg/cmd/cockroach --config=crosslinux --sandbox_debug

  - if: ${{build.arch}} == "aarch64"
    runs: |
      bazel build //pkg/cmd/cockroach:cockroach -s --config=crosslinuxarm --sandbox_debug

  - runs: |
      mkdir -p ${{targets.destdir}}/licenses
      mkdir -p ${{targets.destdir}}/cockroach
      mv _bazel/bin/pkg/cmd/cockroach/cockroach_/cockroach ${{targets.destdir}}/cockroach
      mv build/deploy/cockroach.sh ${{targets.destdir}}/cockroach/
      cp licenses/* ${{targets.destdir}}/licenses/

subpackages:
  - name: ${{package.name}}-entrypoint
    dependencies:
      runtime:
        - geos-dev
        - bash
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/lib/cockroach
          mkdir -p ${{targets.subpkgdir}}/docker-entrypoint-initdb.d
          ln -sf /usr/lib/libgeos.so ${{targets.subpkgdir}}/usr/local/lib/cockroach/libgeos.so
          ln -sf /usr/lib/libgeos_c.so ${{targets.subpkgdir}}/usr/local/lib/cockroach/libgeos_c.so
    test:
      pipeline:
        - uses: test/tw/ldd-check

update:
  enabled: true
  ignore-regex-patterns:
    - '-rc'
    - '-alpha'
    - '-beta'
  github:
    identifier: cockroachdb/cockroach
    strip-prefix: v
    use-tag: true
    tag-filter: v24.2

test:
  pipeline:
    - name: version check
      runs: |
        /cockroach/cockroach --version
