package:
  name: nvidia-cuda-nvprof-12.1
  version: 12.1.55
  epoch: 1
  description: CUDA nvprof
  copyright:
    - license: PROPRIETARY
  target-architecture:
    - x86_64
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-cuda-nvprof=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvprof/linux-x86_64/cuda_nvprof-linux-x86_64-12.1.55-archive.tar.xz"
          expected-sha256: "490aa1a406d8d04ffbec5746bd4fcf79548c4782bf4edbb52cebbe118931c317"

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.1/
      mv bin ${{targets.destdir}}/usr/local/cuda-12.1/
      mv lib ${{targets.destdir}}/usr/local/cuda-12.1/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.1/${{package.name}}.LICENSE

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/pkgconfig/
      mv pkg-config/* ${{targets.destdir}}/usr/share/pkgconfig/
      sed -i 's|targets/.*-linux/||g' ${{targets.destdir}}/usr/share/pkgconfig/*

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - nvidia-cuda-nvprof-12.1

update:
  enabled: false
