package:
  name: nvidia-nccl-cuda-12.8
  version: 2.22.3
  epoch: 0
  description: Optimized primitives for collective multi-GPU communication
  copyright:
    - license: LicenseRef-NVIDIA-nccl-BSD-3-Clause
      license-path: LICENSE.txt
  target-architecture:
    - x86_64
  resources:
    cpu: 16
    memory: 32Gi
  dependencies:
    provides:
      - ${{package.name}}-dev=${{package.full-version}}

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*-(\d+)\.\d+$'
    replace: '$1'
    to: cuda-major-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - coreutils
      - gcc-12-default
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - nvidia-cuda-cudart-${{vars.cuda-version}}
      - nvidia-cuda-cudart-${{vars.cuda-version}}-dev
      - nvidia-cuda-nvcc-${{vars.cuda-version}}
      - nvidia-cuda-nvcc-${{vars.cuda-version}}-dev
      - nvidia-cuda-nvrtc-${{vars.cuda-version}}
      - nvidia-cuda-nvrtc-${{vars.cuda-version}}-dev
      - nvidia-cuda-nvtx-${{vars.cuda-version}}
      - nvidia-cuda-nvtx-${{vars.cuda-version}}-dev
      - nvidia-cuda-profiler-api-${{vars.cuda-version}}
      - nvidia-cudnn-9-cuda-${{vars.cuda-major-version}}
      # Cuda
      - nvidia-driver
      - nvidia-libcublas-${{vars.cuda-version}}
      - nvidia-libcublas-${{vars.cuda-version}}-dev
      - nvidia-libcufft-${{vars.cuda-version}}
      - nvidia-libcufft-${{vars.cuda-version}}-dev
      - nvidia-libcurand-${{vars.cuda-version}}
      - nvidia-libcurand-${{vars.cuda-version}}-dev
      - nvidia-libcusolver-${{vars.cuda-version}}
      - nvidia-libcusolver-${{vars.cuda-version}}-dev
      - nvidia-libcusparse-${{vars.cuda-version}}
      - nvidia-libcusparse-${{vars.cuda-version}}-dev
      - nvidia-libnvjitlink-${{vars.cuda-version}}
      - nvidia-libnvjitlink-${{vars.cuda-version}}-dev
      # python 3.12 had isssues with many CUDA builds, so using python-3.11
      - python-3.11

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/nccl
      tag: v${{package.version}}-1
      expected-commit: 178b6b759074597777ce13438efb0e0ba625e429

  - runs: |
      # default CUDA_HOME is /usr/local/cuda, hence explicit declaration
      make -j$nproc src.build CUDA_HOME=/usr/local/cuda-${{vars.cuda-version}}

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/lib
      mkdir -p ${{targets.destdir}}/usr/include
      mv ./build/lib/* ${{targets.destdir}}/usr/lib
      mv ./build/include/* ${{targets.destdir}}/usr/include

update:
  enabled: false
  github:
    identifier: NVIDIA/nccl
    strip-prefix: v
    strip-suffix: "-1"
    use-tag: true
    tag-filter: v2

test:
  environment:
    environment:
      HOME: /home/build
    contents:
      packages:
        - bash
        - build-base
        - ca-certificates-bundle
        - cmake
        - gcc-12-default
        - python-3.11-dev
        # Cuda
        - nvidia-driver
        - nvidia-cuda-cccl-${{vars.cuda-version}}
        - nvidia-cuda-profiler-api-${{vars.cuda-version}}
        - nvidia-cudnn-9-cuda-${{vars.cuda-major-version}}
        - cuda-toolkit-${{vars.cuda-version}}-dev
  pipeline:
    - uses: git-checkout
      with:
        repository: https://github.com/NVIDIA/nccl-tests
        tag: v2.13.9
        expected-commit: c6afef0b6f76ffc55d4172d971be6cf5a08a73a4
    - runs: |
        # We are not actually running the tests, but just compiling them. Running the tests requires GPU's
        make CUDA_HOME=/usr/local/cuda-${{vars.cuda-version}}
    - uses: test/tw/ldd-check
