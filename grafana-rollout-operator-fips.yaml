package:
  name: grafana-rollout-operator-fips
  version: "0.31.1"
  epoch: 0 # CVE-2025-47907
  description: Kubernetes Rollout Operator
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - go-fips-1.25

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/rollout-operator
      tag: v${{package.version}}
      expected-commit: 418a760ab6ab9032c056b5b80ecbf5f0e97f8028

  - uses: go/build
    with:
      packages: ./cmd/rollout-operator
      output: rollout-operator
      go-package: go-fips

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        rollout-operator --help

update:
  enabled: true
  github:
    identifier: grafana/rollout-operator
    strip-prefix: v
