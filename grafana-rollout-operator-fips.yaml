package:
  name: grafana-rollout-operator-fips
  version: "0.25.0"
  epoch: 0
  description: Kubernetes Rollout Operator
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/rollout-operator
      tag: v${{package.version}}
      expected-commit: 47ecc8cde03089e78e481b2fa0276fef2299daca

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0

  - uses: go/build
    with:
      packages: ./cmd/rollout-operator
      output: rollout-operator
      go-package: go-fips

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        rollout-operator --help

update:
  enabled: true
  github:
    identifier: grafana/rollout-operator
    strip-prefix: v
