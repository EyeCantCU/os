package:
  name: influxd-1
  version: "1.12.2"
  epoch: 0
  description: Scalable datastore for metrics, events, and real-time analytics
  copyright:
    - license: MIT
  dependencies:
    provides:
      - influxd=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - go
      - rust-1.88

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/influxdata/influxdb
      tag: v${{package.version}}
      expected-commit: 95e86be3f4a18bf9b4a2a63b660109bc291b0775

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/crypto@v0.45.0
        github.com/eclipse/paho.mqtt.golang@v1.5.1

  # docs: https://github.com/influxdata/influxdb/blob/master-1.x/CONTRIBUTING.md
  - name: "build as documented upstream"
    runs: |
      export PKG_CONFIG="$(git rev-parse --show-toplevel)/pkg-config.sh"
      go install -ldflags="-X main.version=${{package.version}}" ./...

      mkdir -p ${{targets.destdir}}/usr/bin
      mv $GOPATH/bin/influxd ${{targets.destdir}}/usr/bin

  - uses: strip

update:
  enabled: true
  github:
    identifier: influxdata/influxdb
    strip-prefix: v
    tag-filter: v1.

test:
  pipeline:
    - uses: test/tw/virtualpackage
      with:
        virtual-pkg-name: influxd
    - runs: |
        influxd --help
        influxd version
