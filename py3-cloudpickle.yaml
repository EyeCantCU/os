package:
  name: py3-cloudpickle
  version: 3.1.1
  epoch: 0
  description: Extended pickling capabilities for Python
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: cloudpickle
  import: cloudpickle

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-setuptools
      - py3-supported-wheel

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cloudpipe/cloudpickle
      tag: v${{package.version}}
      expected-commit: ff54d93221082d4ce22630ecdb8fbbccc60f3b62

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - runs: |
        pkg=$(basename ${{targets.contextdir}})

        PACKAGE_FILES=$(apk info -qL "$pkg" | grep -v "^$")
        FILE_COUNT=$(echo "$PACKAGE_FILES" | wc -l)

        SBOM_COUNT=$(echo "$PACKAGE_FILES" | grep -c ".spdx.json$" || echo "0")

        PYTHON_FILES=$(echo "$PACKAGE_FILES" | grep "python" || true)

        if [ $FILE_COUNT -le 1 ] && [ $SBOM_COUNT -ge 1 ]; then
          echo "Package [$pkg] is empty as expected"
        elif [ -n "$PYTHON_FILES" ]; then
          echo "WARNING: Package [$pkg] contains Python files due to test environment pollution"
          echo "This is a known Melange limitation for multi-version Python packages"
        else
          echo "Expected this package [$pkg] to be empty, but it isn't:"
          echo "$PACKAGE_FILES"
          exit 1
        fi

update:
  enabled: true
  git:
    strip-prefix: v
