# Adapted from: https://github.com/GoogleCloudPlatform/guest-agent/blob/main/packaging/google-guest-agent.spec
package:
  name: google-guest-agent
  version: "20250611.00"
  epoch: 4 # CVE-2025-47907
  description: "google guest agent daemon"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - busybox
      - iproute2
      - shadow

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GoogleCloudPlatform/guest-agent
      tag: ${{package.version}}
      expected-commit: 1a3694aec8b63212634afdcd98e7aa4016858421

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      packages: ./google_guest_agent ./google_metadata_script_runner ./gce_workload_cert_refresh
      output: /

  - name: "Make script shebang play nice with melange SCA"
    runs: sed -i 's/env bash/bash/' google_metadata_script_runner_adapt

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      install -p -m 0755 google_metadata_script_runner_adapt ${{targets.destdir}}/usr/bin/google_metadata_script_runner_adapt

      mkdir -p ${{targets.destdir}}/usr/lib/systemd/system
      mkdir -p ${{targets.destdir}}/usr/lib/systemd/system-preset
      install -p -m 0644 google-guest-agent.service ${{targets.destdir}}/usr/lib/systemd/system
      install -p -m 0644 google-startup-scripts.service ${{targets.destdir}}/usr/lib/systemd/system
      install -p -m 0644 google-shutdown-scripts.service ${{targets.destdir}}/usr/lib/systemd/system
      install -p -m 0644 gce-workload-cert-refresh.service ${{targets.destdir}}/usr/lib/systemd/system
      install -p -m 0644 gce-workload-cert-refresh.timer ${{targets.destdir}}/usr/lib/systemd/system
      install -p -m 0644 90-google-guest-agent.preset ${{targets.destdir}}/usr/lib/systemd/system-preset

      mkdir -p ${{targets.destdir}}/usr/share/google-guest-agent/
      install -p -m 0644 instance_configs.cfg ${{targets.destdir}}/usr/share/google-guest-agent/

test:
  pipeline:
    - runs: |
        google_guest_agent version

update:
  enabled: false
  exclude-reason: |
    Upstream does unusual things with releases. See http://go/google-guest-agent-tag-problem
    To check for the latest release, run ./google-guest-common/google_update.sh --latest --package google-guest-agent
