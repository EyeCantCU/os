package:
  name: gatekeeper-fips-3.21
  version: "3.21.0"
  epoch: 0 # GHSA-j5w8-q4qc-rx2x
  description: Gatekeeper - Policy Controller for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - gatekeeper-fips=${{package.full-version}}

pipeline:
  # We can't use go/install because this requires specific ldflags to set the version
  - uses: git-checkout
    with:
      repository: https://github.com/open-policy-agent/gatekeeper
      tag: v${{package.version}}
      expected-commit: f7ac75f7ef5455ea2954e05668b1f93fc69b2b66

  - uses: go/build
    with:
      packages: .
      output: manager
      ldflags: |
        -X github.com/open-policy-agent/gatekeeper/pkg/version.Version=v${{package.version}}
        -X main.frameworksVersion=$(go list -f '{{ .Version }}' -m github.com/open-policy-agent/frameworks/constraint)
        -X main.opaVersion=$(go list -f '{{ .Version }}' -m github.com/open-policy-agent/opa)
      go-package: go-fips

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}
          ln -sf /usr/bin/manager ${{targets.subpkgdir}}/manager
    dependencies:
      provides:
        - gatekeeper-fips-compat=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: gatekeeper-fips-compat
            real-pkg-name: ${{subpkg.name}}

update:
  enabled: true
  github:
    identifier: open-policy-agent/gatekeeper
    strip-prefix: v
    use-tag: true
    tag-filter: v3.21.

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        manager --help
