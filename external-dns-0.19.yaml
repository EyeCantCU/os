package:
  name: external-dns-0.19
  version: "0.19.0"
  epoch: 5 # GHSA-j5w8-q4qc-rx2x
  description: Configure external DNS servers (AWS Route53, Google CloudDNS and others) for Kubernetes Ingresses and Services.
  copyright:
    - paths:
        - '*'
      license: Apache-2.0
  dependencies:
    provides:
      - external-dns=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+$
    replace: "$1"
    to: major-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: git-checkout
    with:
      expected-commit: eafce22825a6565c5f228e49bcfc117b128786a9
      repository: https://github.com/kubernetes-sigs/external-dns
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - runs: |
      # Our global LDFLAGS conflict with a Makefile parameter
      unset LDFLAGS
      make build
      mkdir -p ${{targets.destdir}}/usr/bin
      mv build/external-dns ${{targets.destdir}}/usr/bin/

  - uses: strip

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: external-dns
          version: ${{vars.major-version}}
      - name: Create symlinks
        runs: |
          mkdir -p /opt/iamguarded/external-dns/bin
          ln -s /usr/bin/external-dns /opt/iamguarded/external-dns/bin/external-dns
      - uses: iamguarded/finalize-compat
        with:
          package: external-dns
          version: ${{vars.major-version}}
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            /opt/iamguarded/external-dns/bin/external-dns --version
            /opt/iamguarded/external-dns/bin/external-dns --help
        - uses: iamguarded/test-compat
          with:
            package: external-dns
            version: ${{vars.major-version}}

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/external-dns
    strip-prefix: v
    tag-filter: v0.19.

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: external-dns
    - uses: test/tw/help-check
      with:
        bins: external-dns
    - name: Test configuration parsing with valid provider config
      runs: |
        # Test that external-dns can parse valid provider flag
        # The inmemory provider is a built-in test provider that doesn't require external services
        external-dns --provider=inmemory --help | grep -i "provider"

        # Verify the binary understands key configuration flags
        external-dns --help 2>&1 | grep -q "source"
        external-dns --help 2>&1 | grep -q "provider"
        external-dns --help 2>&1 | grep -q "registry"
    - name: Test configuration error detection with invalid provider
      runs: |
        # Test that external-dns correctly rejects an invalid/unknown provider
        # The binary should fail to start with an unknown provider
        if external-dns --provider=invalid-provider-that-does-not-exist --once --dry-run 2>&1; then
          echo "ERROR: external-dns should reject unknown provider"
          exit 1
        fi
        echo "Correctly rejected invalid provider"
    - name: Test basic startup initialization with dry-run
      runs: |
        # Test startup with inmemory provider (no external deps) in once/dry-run mode
        # This validates the binary can initialize, parse configs, and run the main loop
        # The --once flag makes it run one iteration then exit
        # The --dry-run flag prevents actual DNS changes
        # We use timeout to ensure it doesn't hang indefinitely
        # Note: It may fail because no Kubernetes cluster is available, but that's expected
        # The key is that it initializes and attempts to start
        timeout 5 external-dns \
          --provider=inmemory \
          --source=service \
          --once \
          --dry-run \
          --log-level=debug 2>&1 || true

        echo "Binary startup initialization test completed"
