package:
  name: py3.8-pyyaml
  version: 6.0.1
  epoch: 0
  description: "Python3 bindings for YAML"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.8

vars:
  pypi-package: pyyaml

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3.8-cython-0.29
      - py3.8-installer
      - py3.8-pip
      - py3.8-setuptools
      - py3.8-wheel
      - python-3.8-dev
      - yaml-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/yaml/pyyaml
      tag: ${{package.version}}
      expected-commit: c42fa3bff1eabdb64763bb1526d9ea1ccb708479

  - uses: py/pip-build-install
    with:
      python: python3.8
      dest: ${{targets.contextdir}}

update:
  enabled: true
  ignore-regex-patterns:
    - dec-*
  github:
    identifier: yaml/pyyaml
    use-tag: true
