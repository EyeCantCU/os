package:
  name: nri-couchbase-fips
  version: "2.8.3"
  epoch: 0
  description: New Relic Infrastructure couchbase Integration (FIPS)
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-couchbase
      expected-commit: 2ad6dae37c7c231192a3d290df54db471cd37282
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-couchbase
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-couchbase ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-couchbase
          install -Dm644 legacy/couchbase-definition.yml ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/couchbase-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-couchbase
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-couchbase
    - uses: test/tw/ver-check
      with:
        bins: nri-couchbase
        version-flag: "-show_version"
    - name: "Test binary execution"
      uses: test/daemon-check-output
      with:
        start: |
          nri-couchbase
        expected_output: |
          connect: connection refused
        error_strings: |
          "FAIL"
          "Traceback.*most.recent.call"
