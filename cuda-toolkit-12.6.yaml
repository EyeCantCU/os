package:
  name: cuda-toolkit-12.6
  version: 12.6
  # version of the the cuda-toolkit and the run-time dependencies are tracked referencing NVIDIA's toolkit versions
  epoch: 3
  description: Meta-package for providing CUDA-toolkit packages
  copyright:
    - license: LicenseRef-NVIDIA-CUDA
      license-path: LICENSE
  dependencies:
    runtime:
      - nvidia-cuda-cudart-12.6
      - nvidia-cuda-nvcc-12.6
      - nvidia-cuda-nvml-dev-12.6
      - nvidia-cuda-nvrtc-12.6
      - nvidia-cuda-nvtx-12.6
      - nvidia-libcublas-12.6
      - nvidia-libcufft-12.6
      - nvidia-libcurand-12.6
      - nvidia-libcusolver-12.6
      - nvidia-libcusparse-12.6
      - nvidia-libnvjitlink-12.6

subpackages:
  - name: ${{package.name}}-dev
    description: Meta-package for providing CUDA-toolkit development packages
    dependencies:
      runtime:
        - nvidia-cuda-cudart-12.6-dev
        - nvidia-cuda-nvcc-12.6-dev
        - nvidia-cuda-nvrtc-12.6-dev
        - nvidia-cuda-nvml-dev-12.6
        - nvidia-cuda-nvtx-12.6-dev
        - nvidia-libcublas-12.6-dev
        - nvidia-libcufft-12.6-dev
        - nvidia-libcurand-12.6-dev
        - nvidia-libcusolver-12.6-dev
        - nvidia-libcusparse-12.6-dev
        - nvidia-libnvjitlink-12.6-dev

update:
  enabled: false
  exclude-reason: meta-package
