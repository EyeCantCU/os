# Status: Draft [Tested Submitted]
# Draft: updates and changes are allowed
# Tested: upgrades should be done only upon request from AtSec
# Submitted: freeze build, fork a new source package, no more updates
package:
  name: libgcrypt-fips
  version: "1.11.1"
  epoch: 0
  description: General purpose crypto library based on the code used in GnuPG
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    provides:
      - libgcrypt=${{package.full-version}}

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - jitterentropy-library-dev=3.5.0-r0
      - jitterentropy-library=3.5.0-r0
      - libgpg-error-dev
      - texinfo

vars:
  # libgcrypt FIPS variant limits the available digests to only the ones compatible with FIPS 140-3
  digests: "crc gostr3411-94 md4 md5 rmd160 sha1 sha256 sha512 sha3 tiger whirlpool stribog blake2"
  ciphers: "arcfour blowfish cast5 des aes twofish serpent rfc2268 seed camellia idea salsa20 gost28147 chacha20"
  module-version: "Chainguard libgcrypt"

pipeline:
  - uses: fetch
    with:
      expected-sha256: 24e91c9123a46c54e8371f3a3a2502f1198f2893fbfbf59af95bc1c21499b00e
      uri: https://www.gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-${{package.version}}.tar.bz2

  # We patch libgcrypt to add two things:
  # 1) Patching out the internal copy of jitterentropy, forcing libgcrypt to
  #    use an externally linked version
  # 2) Adding the --enable-jent-only mode, forcing use of jitterentropy for
  #    all entropy
  - uses: patch
    with:
      patches: only-external-jitterentropy.patch

  - runs: |
      ./autogen.sh

  - uses: autoconf/configure
    with:
      opts: |
        CFLAGS="$CFLAGS -O0" \
        CPPFLAGS="$CPPFLAGS -O0" \
        CXXFLAGS="$CXXLAGS -O0" \
        --disable-static \
        --enable-jent-only \
        --enable-digests="${{vars.digests}}" \
        --enable-ciphers="${{vars.ciphers}}" \
        --with-fips-module-version="${{vars.module-version}} ${{package.version}}"

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      rm -f "${{targets.destdir}}"/usr/share/info/dir

  - name: Run upstream unit tests
    runs: |
      # We only run in mocked FIPS mode, since this is what we'll be running
      # on the target system.
      LIBGCRYPT_FORCE_FIPS_MODE=1 make check

  - name: Enable FIPS mode
    runs: |
      mkdir -p "${{targets.destdir}}/etc/gcrypt"
      touch "${{targets.destdir}}/etc/gcrypt/fips_enabled"

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin/
          cp -f ./src/libgcrypt-config "${{targets.subpkgdir}}"/usr/bin/
    dependencies:
      runtime:
        - ${{package.name}}
        - libgpg-error-dev
    description: ${{package.name}} dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 1623

test:
  environment:
    contents:
      packages:
        - strace
        - gpg
        - gpg-agent
        - pinentry
        - pkgconf
        - ${{package.name}}-dev
  pipeline:
    - runs: |
        echo "Raw message" >test
        # Test if basic encryption/decryption works.
        strace gpg --batch --yes --passphrase="pw" --pinentry-mode loopback -c test 2>strace.log
        gpg --batch --passphrase="pw" --pinentry-mode loopback -d test.gpg >decrypted
        cmp test decrypted
        # At the same time, make sure we're not using kernel entropy.
        # strace should only show one getrandom() call (outside of the crypto boundary).
        count=$(grep -c "\(getrandom\|/dev/u\?random\)" strace.log || true)
        test $count -le 1
    - runs: |
        libgcrypt-config --version
        dumpsexp --version
        dumpsexp --help
        hmac256 --version
        hmac256 --help
        mpicalc --version
        mpicalc --help
    - uses: test/tw/ldd-check
