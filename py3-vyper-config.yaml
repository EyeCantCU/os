# Please note that the last release of this package was in Oct 2023 over pypy
# This project is small and looks complete and has no CVEs as of date
# So we can keep it as it is since it's an requirement for spamcheck image
package:
  name: py3-vyper-config
  version: 1.2.1
  epoch: 0
  description: Python configuration with fangs - complete configuration solution for Python applications
  copyright:
    - license: MIT

vars:
  pypi-package: vyper-config
  import: vyper

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-pip
      - py3-supported-python-dev
      - py3-supported-setuptools
      - py3-supported-wheel

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/alexferl/vyper
      tag: v${{package.version}}
      expected-commit: b84ab1866d40245e136a1a495149ac86ce40fa8b

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-distconfig3
        - py${{range.key}}-pyyaml
        - py${{range.key}}-toml
        - py${{range.key}}-watchdog
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<'EOF'
            import sys
            try:
                import vyper
                v = vyper.Vyper()

                # Test setting and getting values
                v.set('test_key', 'test_value')
                assert v.get('test_key') == 'test_value', "set/get failed"

                # Test defaults
                v.set_default('default_key', 'default_value')
                assert v.get('default_key') == 'default_value', "default failed"

                print("All vyper-config tests passed!")
            except Exception as e:
                print(f"Test failed: {e}")
                import traceback
                traceback.print_exc()
                sys.exit(1)
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: alexferl/vyper
    strip-prefix: v
