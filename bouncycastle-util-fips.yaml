package:
  name: bouncycastle-util-fips
  version: 2.0.2
  epoch: 0
  description: BouncyCastle FIPS Utils dependencies for bcpkix, bcpg, and other auxiliar jars
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://repo1.maven.org/maven2/org/bouncycastle/bcutil-fips/${{package.version}}/bcutil-fips-${{package.version}}.jar
      expected-sha512: faa9c2ec3a163e4315c7f9ba43215324cf816dfcc008b6797e4379b108697d14e6a9c8612dd132413d10ef10098a0ccaf54e13379fc75ee5bf5182163e3dcdd0
      extract: false

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/java/bouncycastle-fips
      cp bcutil-fips-${{package.version}}.jar ${{targets.destdir}}/usr/share/java/bouncycastle-fips/bcutil-fips.jar

update:
  enabled: false
  exclude-reason: |
    # We don't build these packages from source due to signing and licensing issues.
    # Therefore, we cannot automatically upgrade them based on GitHub tags/releases
    # and/or release-monitoring.org
