# The torchaudio project maintains an s3 repository comprising
# pre-built versions of specific FFmpeg releases. torchaudio
# wheels build against these, but do not redistribute them.
# This package mimics the contents and layout of that repository,
# so we just have to change the base_url to point to the local
# filesystem. See:
# https://github.com/pytorch/audio/blob/v2.8.0/third_party/ffmpeg/multi/CMakeLists.txt
# This is a build-time dependency-only - it requires no CVE remediation.
package:
  name: torchaudio-ffmpeg-tarballs
  version: "1"
  epoch: 0
  description: pre-built ffmpeg tarballs used during the torchaudio python library build
  copyright:
    - license: GPL-2.0-or-later AND LGPL-2.1-or-later
  dependencies:
    runtime:
      - ${{package.name}}-4.4.4==${{package.full-version}}
      - ${{package.name}}-5.0.3==${{package.full-version}}
      - ${{package.name}}-6.0==${{package.full-version}}

data:
  # version to expected-commit mapping
  - name: ffmpeg-versions
    items:
      4.4.4: "71fb6132637a2a430375c24afc381fff8b854fe7"
      5.0.3: "0e15444aceca0e78f99f3d67758eb79d11b86599"
      6.0: "ea3d24bbe3c58b171e55fe2151fc7ffaca3ab3d2"

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - name: empty

test:
  pipeline:
    - uses: test/emptypackage

subpackages:
  - range: ffmpeg-versions
    name: ${{package.name}}-${{range.key}}
    pipeline:
      - working-directory: ${{range.key}}-build
        uses: git-checkout
        with:
          repository: https://github.com/FFmpeg/FFmpeg
          tag: n${{range.key}}
          expected-commit: ${{range.value}}
      - working-directory: ${{range.key}}-build
        # configure parameters are from https://github.com/pytorch/audio/blob/6e1c7fe9ff6d82b8665d0a46d859d3357d2ebaaa/.github/scripts/ffmpeg/build.sh#L44
        runs: |
          ./configure \
            --prefix="$PWD/../${{range.key}}-install/ffmpeg" \
            --disable-all \
            --disable-everything \
            --disable-programs \
            --disable-doc \
            --disable-debug \
            --disable-autodetect \
            --disable-x86asm \
            --disable-iconv \
            --disable-encoders \
            --disable-decoders \
            --disable-hwaccels \
            --disable-muxers \
            --disable-demuxers \
            --disable-parsers \
            --disable-bsfs \
            --disable-protocols \
            --disable-devices \
            --disable-filters \
            --disable-asm \
            --disable-static \
            --enable-shared \
            --enable-rpath \
            --enable-pic \
            --enable-avcodec \
            --enable-avdevice \
            --enable-avfilter \
            --enable-avformat \
            --enable-avutil
      - working-directory: ${{range.key}}-build
        uses: autoconf/make
      - working-directory: ${{range.key}}-build
        runs: |
          make install
      - name: "use the same date-based sub directories as upstream"
        runs: |
          case "${{range.key}}" in
            "4.4.4")
              echo "2023-08-14" > date
              ;;
            "5.0.3"|"6.0")
              echo "2023-07-06" > date
              ;;
            *)
              echo "Unknown version ${{range.key}}" 1>&2
              exit 1
              ;;
          esac
      - working-directory: ${{range.key}}-install
        runs: |
          dest="${{targets.contextdir}}/usr/share/${{package.name}}/$(cat ../date)/linux_${{build.arch}}"
          mkdir -p "${dest}"
          tar -cvz ffmpeg/include ffmpeg/lib > "${dest}/${{range.key}}.tar.gz"
    test:
      pipeline:
        - if: ${{build.arch}} == "x86_64" && "${{range.key}}" == "4.4.4"
          uses: fetch
          with:
            uri: "https://pytorch.s3.amazonaws.com/torchaudio/ffmpeg/2023-08-14/linux_${{build.arch}}/${{range.key}}.tar.gz"
            expected-sha256: "9b87eeba9b6975e25f28ba12163bd713228ed84f4c2b3721bc5ebe92055edb51"
        - if: ${{build.arch}} == "aarch64" && "${{range.key}}" == "4.4.4"
          uses: fetch
          with:
            uri: "https://pytorch.s3.amazonaws.com/torchaudio/ffmpeg/2023-08-14/linux_${{build.arch}}/${{range.key}}.tar.gz"
            expected-sha256: "6f00437d13a3b3812ebe81c6e6f3a84a58f260d946a1995df87ba09aae234504"
        - if: ${{build.arch}} == "x86_64" && "${{range.key}}" == "5.0.3"
          uses: fetch
          with:
            uri: "https://pytorch.s3.amazonaws.com/torchaudio/ffmpeg/2023-07-06/linux_${{build.arch}}/${{range.key}}.tar.gz"
            expected-sha256: "de3c75c99b9ce33de7efdc144566804ae5880457ce71e185b3f592dc452edce7"
        - if: ${{build.arch}} == "aarch64" && "${{range.key}}" == "5.0.3"
          uses: fetch
          with:
            uri: "https://pytorch.s3.amazonaws.com/torchaudio/ffmpeg/2023-07-06/linux_${{build.arch}}/${{range.key}}.tar.gz"
            expected-sha256: "65c663206982ee3f0ff88436d8869d191b46061e01e753518c77ecc13ea0236d"
        - if: ${{build.arch}} == "x86_64" && "${{range.key}}" == "6.0"
          uses: fetch
          with:
            uri: "https://pytorch.s3.amazonaws.com/torchaudio/ffmpeg/2023-07-06/linux_${{build.arch}}/${{range.key}}.tar.gz"
            expected-sha256: "04d3916404bab5efadd29f68361b7d13ea71e6242c6473edcb747a41a9fb97a6"
        - if: ${{build.arch}} == "aarch64" && "${{range.key}}" == "6.0"
          uses: fetch
          with:
            uri: "https://pytorch.s3.amazonaws.com/torchaudio/ffmpeg/2023-07-06/linux_${{build.arch}}/${{range.key}}.tar.gz"
            expected-sha256: "ec762fd41ea7b8d9ad4f810f53fd78a565f2bc6f680afe56d555c80f3d35adef"
        - name: "Validate that our tarballs contain exactly the same filenames as the upstream tarballs"
          runs: |
            tar tf ${{range.key}}.tar.gz | sort > ${{range.key}}-upstream.lst
            tar tf /usr/share/${{package.name}}/*/linux_${{build.arch}}/${{range.key}}.tar.gz | sort > ${{range.key}}-local.lst
            diff -urpN ${{range.key}}-upstream.lst ${{range.key}}-local.lst

update:
  enabled: false
  exclude-reason: |
    "These are pre-built tarballs of specific FFmpeg releases which are only used at build-time"
