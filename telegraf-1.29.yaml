package:
  name: telegraf-1.29
  version: 1.29.5
  epoch: 10
  description: Telegraf is an agent for collecting, processing, aggregating, and writing metric
  copyright:
    - license: MIT
  dependencies:
    provides:
      - telegraf=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - gnutar
      - go

pipeline:
  - uses: git-checkout
    with:
      tag: v${{package.version}}
      expected-commit: 138d0d54add1e3dcd70592d069bed4218bae2bd2
      repository: https://github.com/influxdata/telegraf

  - uses: go/bump
    with:
      deps: github.com/cloudevents/sdk-go/v2@v2.15.2 github.com/jackc/pgproto3/v2@v2.3.3 github.com/jackc/pgx/v4@v4.18.2 google.golang.org/protobuf@v1.33.0 github.com/docker/docker@v25.0.5 golang.org/x/net@v0.23.0 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0

  - if: ${{build.arch}} == 'x86_64'
    runs: |
      make package include_packages="linux_amd64.tar.gz"

  - if: ${{build.arch}} == 'aarch64'
    runs: |
      make package include_packages="linux_arm64.tar.gz"

  - runs: |
      tar -xf build/dist/telegraf-${{package.version}}*.tar.gz
      mkdir -p ${{targets.destdir}}/etc/
      mv telegraf-${{package.version}}/etc/* ${{targets.destdir}}/etc/

      mkdir -p ${{targets.destdir}}/usr/
      mv telegraf-${{package.version}}/usr/* ${{targets.destdir}}/usr

      mkdir -p ${{targets.destdir}}/var
      mv telegraf-${{package.version}}/var/* ${{targets.destdir}}/var

  - uses: strip

update:
  enabled: true
  github:
    identifier: influxdata/telegraf
    strip-prefix: v
    tag-filter: v1.29.
    use-tag: true
