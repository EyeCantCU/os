patches:
  # Fix CVE-2025-48924: commons-lang3 3.17.0 -> 3.18.0
  - groupId: org.apache.commons
    artifactId: commons-lang3
    version: 3.18.0
  # Fix CVE-2025-9340, CVE-2025-9341, CVE-2025-9092: bouncycastle-fips components
  # NOTE: bc-fips:2.1.1 requires compatible bcpkix-fips:2.1.10 and bcutil-fips:2.1.5
  # CVE-2025-12194 requires bc-fips:2.1.2, but it's pending CMVP validation.
  # TODO: upgrade to bc-fips:2.1.2 when CMVP validated, ref:
  # https://github.com/chainguard-dev/enterprise-advisories/blob/main/bouncycastle-fips.advisories.yaml#L7-L31
  - groupId: org.bouncycastle
    artifactId: bc-fips
    version: 2.1.1
    scope: compile
  - groupId: org.bouncycastle
    artifactId: bcpkix-fips
    version: 2.1.10
    scope: compile
  - groupId: org.bouncycastle
    artifactId: bcutil-fips
    version: 2.1.5
    scope: compile
