package:
  name: etcd-3.4
  version: "3.4.37"
  epoch: 4
  description: A highly-available key value store for shared configuration and service discovery.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - glibc
      - merged-usrsbin
      - wolfi-baselayout
    provides:
      - etcd=${{package.full-version}}

environment:
  contents:
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - git
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/etcd-io/etcd
      tag: v${{package.version}}
      expected-commit: 1a36b4853952a113eb98ca79cddc9a466faeec4f

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0

  - runs: |
      # Starting from go1.24  the go build command now sets the main module’s version
      # in the compiled binary based on the version control system tag and/or commit.
      # A +dirty suffix will be appended if there are uncommitted changes.
      # Use the -buildvcs=false flag to omit version control information from
      # the binary.
      # Reference: https://tip.golang.org/doc/go1.24#go-command
      export GO_BUILD_FLAGS="$GO_BUILD_FLAGS -buildvcs=false"
      export GO_LDFLAGS="$GO_LDFLAGS -X main.VERSION=${{package.version}}"
      export GO_LDFLAGS="$GO_LDFLAGS -X go.etcd.io/etcd/version.Version=${{package.version}}"
      bash -x ./build
      mkdir -p "${{targets.destdir}}"/var/lib/${{package.name}}
      chmod 700 "${{targets.destdir}}"/var/lib/${{package.name}}
      install -Dm755 bin/etcd "${{targets.destdir}}"/usr/bin/etcd
      install -Dm755 bin/etcdctl "${{targets.destdir}}"/usr/bin/etcdctl
      # removed etcdutl since it does not exist in 3.4.x

  - uses: strip

subpackages:
  - name: ${{package.name}}-bitnami-compat
    description: "compat package with bitnami/etcd image"
    dependencies:
      runtime:
        - bash
        - coreutils
        - findutils
        - gawk
        - grep
        - posix-libc-utils
        - procps
        - sed
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - uses: bitnami/compat
        with:
          image: etcd
          version-path: 3.4/debian-12
          commit: a336536c333b0b546447c562d7c9cb57b743a968
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/opt/bitnami/etcd/bin/
          chmod g+rwX ${{targets.subpkgdir}}/opt/bitnami
          ln -sf /usr/bin/etcd ${{targets.subpkgdir}}/opt/bitnami/etcd/bin/etcd
          ln -sf /usr/bin/etcdctl ${{targets.subpkgdir}}/opt/bitnami/etcd/bin/etcdctl
          ln -sf /usr/bin/etcdutl ${{targets.subpkgdir}}/opt/bitnami/etcd/bin/etcdutl
          cp LICENSE ${{targets.subpkgdir}}/opt/bitnami/licenses/LICENSE
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            run-script --version
            run-script --help
        - uses: bitnami/validate-welcome-message
          with:
            app-name: etcd

update:
  enabled: true
  github:
    identifier: etcd-io/etcd
    strip-prefix: v
    tag-filter-prefix: v3.4
    use-tag: true

test:
  environment:
    environment:
      # etcd v3.4.x has "Experimental" support for arm64
      # See: https://etcd.io/docs/v3.4/op-guide/supported-platform/#current-support
      ETCD_UNSUPPORTED_ARCH: "arm64"
  pipeline:
    - name: Verify etcd version
      runs: |
        etcd --version | grep "etcd Version: 3.4"
        etcd --help
        etcdctl version
        etcdctl --help
    - name: Start etcd server and perform health check
      runs: |
        # Start etcd in the background
        etcd &
        ETCD_PID=$!
        sleep 5 # Wait for etcd to start
        # Perform a health check
        etcdctl endpoint health
        kill $ETCD_PID
    - name: Set and get a key-value pair
      runs: |
        etcd &
        ETCD_PID=$!
        sleep 5 # Wait for etcd to start
        # Set a key-value pair
        etcdctl put mykey "Hello, etcd"
        # Get the value
        etcdctl get mykey | grep -q "Hello, etcd"
        kill $ETCD_PID
