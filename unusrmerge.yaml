package:
  name: unusrmerge
  version: 1
  epoch: 0
  description: "trick systemd into supporting unusrmerge"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox

pipeline:
  - name: Make systemd launch all units with un-merge-usr PATH
    runs: |
      mkdir -p ${{targets.destdir}}/usr/lib/systemd/system.d/
      cat >${{targets.destdir}}/usr/lib/systemd/system.d/90-unusrmerge.conf <<EOF
      [Service]
      Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      EOF

update:
  enabled: false
  exclude-reason: |
    This package is a temporary solution until we have usr-merge
