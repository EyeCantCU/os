package:
  name: mdp
  version: 1.0.18
  epoch: 0
  description:
  copyright:
    - license: GPL-3.0-or-later

environment:
  contents:
    packages:
      - build-base
      - ncurses-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/visit1985/mdp
      tag: ${{package.version}}
      expected-commit: 2a7446b844192261cdb7ccb4beaf8f86499590d6

  - name: build
    runs: |
      make LDLIBS="-lncursesw -ltinfo"

  - name: install
    runs: |
      make install PREFIX=/usr DESTDIR=${{targets.destdir}}

  - uses: strip

subpackages:
  - name: "${{package.name}}-doc"
    description: "${{package.name}} documentation"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: mdp

update:
  enabled: true
  github:
    identifier: visit1985/mdp
    use-tag: true
