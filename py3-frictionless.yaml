package:
  name: py3-frictionless
  version: 5.18.1
  epoch: 0
  description: Data management framework for Python that provides functionality to describe, extract, validate, and transform tabular data
  copyright:
    - license: MIT

vars:
  pypi-package: frictionless

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-hatchling

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/frictionlessdata/frictionless-py.git
      tag: v${{package.version}}
      expected-commit: c48cc794e0285284c8c9ab1ff15511a93f8da233

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-attrs
        - py${{range.key}}-chardet
        - py${{range.key}}-humanize
        - py${{range.key}}-isodate
        - py${{range.key}}-jinja2
        - py${{range.key}}-jsonschema
        - py${{range.key}}-marko
        - py${{range.key}}-petl
        - py${{range.key}}-pydantic
        - py${{range.key}}-python-dateutil
        - py${{range.key}}-python-slugify
        - py${{range.key}}-pyyaml
        - py${{range.key}}-requests
        - py${{range.key}}-rfc3986
        - py${{range.key}}-simpleeval
        - py${{range.key}}-tabulate
        - py${{range.key}}-typer
        - py${{range.key}}-typing-extensions
        - py${{range.key}}-validators
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            frictionless --help

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
