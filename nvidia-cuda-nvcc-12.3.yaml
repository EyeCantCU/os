package:
  name: nvidia-cuda-nvcc-12.3
  version: 12.3.107
  epoch: 1
  description: CUDA NVCC
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-cuda-nvcc=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/linux-sbsa/cuda_nvcc-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "4c0e6a79a67fb86489be9e0976cc22127ca2ae160b1ad22ac4742d52f0ebe32d"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/linux-x86_64/cuda_nvcc-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "65dba017ed1dbbe819a6ccc1841a4add4dfbc652603aa89be773888e82a5629e"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.3/
      mv include ${{targets.destdir}}/usr/local/cuda-12.3/
      mv lib ${{targets.destdir}}/usr/local/cuda-12.3/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.3/${{package.name}}.LICENSE
      mv bin ${{targets.destdir}}/usr/local/cuda-12.3/
      mv nvvm ${{targets.destdir}}/usr/local/cuda-12.3/

  - runs: |
      # Symlink the binaries onto the normal path
      mkdir -p ${{targets.destdir}}/usr/bin/
      for i in ${{targets.destdir}}/usr/local/cuda-12.3/nvcc/bin/*; do
        [ -f "$i" ] && [ -x "$i" ] && ln -sf /usr/local/cuda-12.3/nvcc/bin/$(basename "$i") ${{targets.destdir}}/usr/bin/
      done

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - nvidia-cuda-nvcc-12.3

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
