package:
  name: py3-systemd
  version: "235"
  epoch: 0
  description: Python wrappers for systemd functionality
  copyright:
    - license: MIT

vars:
  pypi-package: systemd
  import: systemd

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/systemd/python-systemd
      tag: v${{package.version}}
      expected-commit: dc1dae2eaa00e2369c366f80f9bcd3f729b7abca

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - openssl
            - systemd
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - runs: |
            /usr/lib/systemd/systemd-journald &
            JOURNAL_PID=$!
            trap 'kill -9 "${JOURNAL_PID}"' EXIT
            RANDOM_DATA="$(openssl rand -hex 5)"
            GREP_DATA="${RANDOM_DATA} hello, world!"

            python${{range.key}} <<EOF
            from systemd import journal
            journal.send("${GREP_DATA}")
            EOF

            journalctl -g "${GREP_DATA}" | grep -e ".*python${{range.key}}.*: ${GREP_DATA}"

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  git:
    strip-prefix: v
