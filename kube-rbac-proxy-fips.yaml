package:
  name: kube-rbac-proxy-fips
  version: 0.18.0
  epoch: 0
  description: Kubernetes RBAC authorizing HTTP proxy for a single upstream.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/brancz/kube-rbac-proxy
      tag: v${{package.version}}
      expected-commit: e29dd733e317b71e4c8065e4f5bcb4cfc0a59bed

  - uses: go/bump
    with:
      deps: google.golang.org/protobuf@v1.34.1 go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.51.0 go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.46.1 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.21.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/kube-rbac-proxy
      output: kube-rbac-proxy
      ldflags: -X k8s.io/component-base/version.gitVersion=v${{package.version}} -X k8s.io/component-base/version.gitCommit=$(git rev-parse HEAD) -X k8s.io/component-base/version/verflag.programName=kube-rbac-proxy

update:
  enabled: true
  github:
    identifier: brancz/kube-rbac-proxy
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
