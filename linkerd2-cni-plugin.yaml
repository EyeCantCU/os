package:
  name: linkerd2-cni-plugin
  version: 1.6.4
  epoch: 0
  description: linkerd2 cni-plugin package (linkerd/linkerd2-proxy-init)
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d679fe99fe5a39615ee45400035c0281fa6eff5c
      repository: https://github.com/linkerd/linkerd2-proxy-init
      tag: cni-plugin/v${{package.version}}

  - uses: go/build
    with:
      packages: ./cni-plugin
      output: linkerd-cni-plugin

  - uses: strip

subpackages:
  - name: linkerd2-cni-repair-controller
    description: Linkerd2 utility to scan & evict pods that failed to aquire a network configuration
    pipeline:
      - uses: cargo/build
        with:
          modroot: ./cni-repair-controller
          output: linkerd-cni-repair-controller
    test:
      pipeline:
        - name: version / help check
          runs: |
            # Test version output
            linkerd-cni-repair-controller --version

            # Test help output
            linkerd-cni-repair-controller --help

  - name: ${{package.name}}-compat
    description: Compatibility files for ${{package.name}}
    pipeline:
      - runs: |
          # Linkerd directory for supporting files
          mkdir -p -m 0755 ${{targets.subpkgdir}}/linkerd
          install -Dm755 LICENSE ${{targets.subpkgdir}}/linkerd/LICENSE
          install -Dm755 cni-plugin/deployment/scripts/filter.jq ${{targets.subpkgdir}}/linkerd/filter.jq
          install -Dm755 cni-plugin/deployment/scripts/install-cni.sh ${{targets.subpkgdir}}/linkerd/install-cni.sh

          # CONTAINER_MOUNT_PREFIX defaults to /host; files get copied between directories
          mkdir -p -m 0755 ${{targets.subpkgdir}}/opt/cni/bin
          mkdir -p -m 0755 ${{targets.subpkgdir}}/host/opt/cni/bin
          mkdir -p -m 0755 ${{targets.subpkgdir}}/host/etc/cni
          ln -s /usr/bin/linkerd-cni-plugin ${{targets.subpkgdir}}/opt/cni/bin/linkerd-cni
    test:
      pipeline:
        - name: Verify files are present
          runs: |
            stat /linkerd/filter.jq
            stat /linkerd/install-cni.sh
            stat /linkerd/LICENSE
        - name: Verify successful symlink creation
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

  - name: linkerd2-cni-repair-controller-compat
    description: Compatibility files for linkerd2-cni-repair-controller
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/linkerd
          ln -s /usr/bin/linkerd-cni-repair-controller ${{targets.subpkgdir}}/usr/lib/linkerd/linkerd-cni-repair-controller
    test:
      environment:
        contents:
          packages:
            - linkerd2-cni-repair-controller
      pipeline:
        - name: Verify successful symlink creation
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: linkerd/linkerd2-proxy-init
    tag-filter: cni-plugin
    strip-prefix: cni-plugin/v

test:
  environment:
    contents:
      packages:
        - bash
        - ${{package.name}}-compat
        - inotify-tools
        - jq
        - procps
  pipeline:
    - uses: test/tw/ldd-check
    - name: CNI plugin functionality test
      runs: |
        # Test CNI plugin recognizes proper CNI environment
        CNI_COMMAND=VERSION linkerd-cni-plugin 2>&1 | grep '"cniVersion"'

        # Test CNI plugin fails appropriately without env vars
        linkerd-cni-plugin --help 2>&1 | grep -q "required env variables.*CNI_COMMAND.*missing"
    - name: Script and filter functionality test
      runs: |
        # Test jq filter script can be executed
        echo '{"plugins": []}' | jq -f /linkerd/filter.jq --argjson CNI_TMP_CONF_DATA '{"type": "linkerd-cni"}' | grep "linkerd-cni"

        # Script to install Linkerd CNI on a Kubernetes host.
        # - Expects the host CNI binary path to be mounted at /host/opt/cni/bin
        # - Expects the host CNI network config path to be mounted at /host/etc/cni/net.d
        # - Expects the desired CNI config in the CNI_NETWORK_CONFIG env variable
        exec /linkerd/install-cni.sh 2>&1 | grep "/host/etc/cni/net.d: No such file or directory"

        # Test filter.jq exists and install script is executable
        stat /linkerd/filter.jq
        test -x /linkerd/install-cni.sh
