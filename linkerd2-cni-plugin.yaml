package:
  name: linkerd2-cni-plugin
  version: 1.6.4
  epoch: 0
  description: linkerd2 cni-plugin package (linkerd/linkerd2-proxy-init)
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d679fe99fe5a39615ee45400035c0281fa6eff5c
      repository: https://github.com/linkerd/linkerd2-proxy-init
      tag: cni-plugin/v${{package.version}}

  - uses: go/build
    with:
      packages: ./cni-plugin
      output: linkerd-cni-plugin

subpackages:
  - name: linkerd2-cni-repair-controller
    pipeline:
      - uses: cargo/build
        with:
          modroot: ./cni-repair-controller
          output: linkerd-cni-repair-controller
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - name: version check
          runs: |
            linkerd-cni-repair-controller --version

update:
  enabled: true
  github:
    identifier: linkerd/linkerd2-proxy-init
    tag-filter: cni-plugin
    strip-prefix: cni-plugin v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: version test
      runs: |
        linkerd-cni-plugin --help
