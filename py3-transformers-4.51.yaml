package:
  name: py3-transformers-4.51
  version: "4.51.3"
  epoch: 1
  description: State-of-the-art Machine Learning for PyTorch, TensorFlow, and JAX
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: transformers
  module-name: transformers

var-transforms:
  - from: ${{package.name}}
    match: 'py3-transformers-(\d+\.\d+).*'
    replace: '$1'
    to: transformers-version

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/huggingface/transformers
      tag: v${{package.version}}
      expected-commit: 5f4ecf2d9f867a1255131d2461d75793c0cf1db2

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-${{vars.transformers-version}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-certifi
        - py${{range.key}}-charset-normalizer
        - py${{range.key}}-filelock
        - py${{range.key}}-fsspec
        - py${{range.key}}-huggingface-hub
        - py${{range.key}}-idna
        - py${{range.key}}-numpy<2.0
        - py${{range.key}}-packaging
        - py${{range.key}}-pyyaml
        - py${{range.key}}-regex
        - py${{range.key}}-requests
        - py${{range.key}}-safetensors
        - py${{range.key}}-tokenizers<0.22
        - py${{range.key}}-tqdm
        - py${{range.key}}-typing-extensions
        - py${{range.key}}-urllib3
      provides:
        - py${{range.key}}-${{vars.pypi-package}}=${{package.version}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.module-name}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-${{vars.transformers-version}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}-${{vars.transformers-version}}
      provides:
        - py${{range.key}}-${{vars.pypi-package}}-bin=${{package.version}}
    pipeline:
      - uses: split/bin

  - name: py3-supported-${{vars.pypi-package}}-${{vars.transformers-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-${{vars.transformers-version}}
        - py3.11-${{vars.pypi-package}}-${{vars.transformers-version}}
        - py3.12-${{vars.pypi-package}}-${{vars.transformers-version}}
        - py3.13-${{vars.pypi-package}}-${{vars.transformers-version}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v4.51.
  ignore-regex-patterns:
    - .*\.r.*
    - ^localattn.*
    - ^list$
