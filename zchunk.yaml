package:
  name: zchunk
  version: 1.5.1
  epoch: 2
  description: A file format designed for highly efficient deltas while maintaining good compression
  copyright:
    - license: BSD-2-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - curl-dev
      - meson
      - openssl-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/zchunk/zchunk.git
      tag: ${{package.version}}
      expected-commit: 69dd7d6764e333413dd12848607d72cab310e406

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - name: test/pkgconf
        - name: test/tw/ldd-check

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: zchunk/zchunk
    use-tag: true
