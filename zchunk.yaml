package:
  name: zchunk
  version: "1.5.3"
  epoch: 1
  description: A file format designed for highly efficient deltas while maintaining good compression
  copyright:
    - license: BSD-2-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - curl-dev
      - meson
      - openssl-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/zchunk/zchunk.git
      tag: ${{package.version}}
      expected-commit: 366cf22e725fc273abe0e082c707753cce76c453

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: |-
          zck
          unzck
          zck_read_header
          zck_delta_size
    - uses: test/tw/help-check
      with:
        bins: |-
          zck
          unzck
          zck_read_header
          zck_delta_size
    - name: Test compression and decompression roundtrip
      runs: |
        # Create test file with known content
        echo 'This is a test file for zchunk compression and decompression' > /tmp/original.txt
        echo 'Line 2: Testing zchunk functionality' >> /tmp/original.txt
        echo 'Line 3: Verifying roundtrip integrity' >> /tmp/original.txt

        # Compress the file with zck
        zck /tmp/original.txt -o /tmp/compressed.zck

        # Verify compressed file was created
        if [ ! -f /tmp/compressed.zck ]; then
          echo 'FAIL: Compression failed - compressed file not created'
          exit 1
        fi

        # Decompress with unzck
        unzck -c /tmp/compressed.zck > /tmp/decompressed.txt

        # Verify decompressed file was created
        if [ ! -f /tmp/decompressed.txt ]; then
          echo 'FAIL: Decompression failed - decompressed file not created'
          exit 1
        fi

        # Verify roundtrip produces identical output
        if ! cmp -s /tmp/original.txt /tmp/decompressed.txt; then
          echo 'FAIL: Roundtrip verification failed - files differ'
          echo 'Original:'
          cat /tmp/original.txt
          echo 'Decompressed:'
          cat /tmp/decompressed.txt
          exit 1
        fi

        echo 'SUCCESS: Compression/decompression roundtrip verified'
    - name: Test zck_read_header utility
      runs: |
        # Create and compress a test file
        echo 'Test data for header reading' > /tmp/test.txt
        zck /tmp/test.txt -o /tmp/test.zck

        # Read header information from compressed file
        header_output=$(zck_read_header /tmp/test.zck)

        # Verify header output contains expected information
        if [ -z "$header_output" ]; then
          echo 'FAIL: zck_read_header produced no output'
          exit 1
        fi

        echo 'SUCCESS: zck_read_header utility works correctly'
        echo "Header output: $header_output"
    - name: Test zck_delta_size utility
      runs: |
        # Create two similar files for delta testing
        echo 'Original content line 1' > /tmp/file1.txt
        echo 'Original content line 2' >> /tmp/file1.txt

        echo 'Original content line 1' > /tmp/file2.txt
        echo 'Modified content line 2' >> /tmp/file2.txt

        # Compress both files
        zck /tmp/file1.txt -o /tmp/file1.zck
        zck /tmp/file2.txt -o /tmp/file2.zck

        # Calculate delta size between the two compressed files
        delta_output=$(zck_delta_size /tmp/file1.zck /tmp/file2.zck)

        # Verify delta_size produced output
        if [ -z "$delta_output" ]; then
          echo 'FAIL: zck_delta_size produced no output'
          exit 1
        fi

        echo 'SUCCESS: zck_delta_size utility works correctly'
        echo "Delta size output: $delta_output"

update:
  enabled: true
  github:
    identifier: zchunk/zchunk
    use-tag: true
