package:
  name: py3-torchdata-cuda-12.9
  # Take note before updating https://github.com/pytorch/data#version-compatibility
  version: 0.11.0
  epoch: 0
  description: A PyTorch repo for data loading and utilities to be shared by the PyTorch domain libraries
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: torchdata

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: "$1"
    to: cuda-version

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/data.git
      tag: v${{package.version}}
      expected-commit: 377e64c1be69a9be6649d14c9e3664070323e464

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-requests
        - py${{range.key}}-torch-cuda-${{vars.cuda-version}}
        - py${{range.key}}-urllib3
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | grep -F -e "${{package.version}}"
            import torchdata
            print(torchdata.__version__)
            EOF
            python${{range.key}} <<'EOF' | grep -F -e "[0, 1, 4, 9, 16, 25, 36, 49, 64, 81]"
            from torchdata.nodes import IterableWrapper, ParallelMapper, Loader

            node = IterableWrapper(range(10))
            node = ParallelMapper(node, map_fn=lambda x: x**2, num_workers=3, method="thread")
            loader = Loader(node)
            result = list(loader)
            print(result)
            EOF

  - name: py3-supported-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.11-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.12-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.13-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
