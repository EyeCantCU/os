package:
  name: kepler
  version: "0.11.2"
  epoch: 0 # CVE-2025-47907
  description: Prometheus exporter that measures energy consumption
  copyright:
    # https://github.com/sustainable-computing-io/kepler/tree/main/LICENSES
    - license: Apache-2.0 AND GPL-2.0-or-later AND BSD-2-Clause

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sustainable-computing-io/kepler.git
      tag: v${{package.version}}
      expected-commit: 99d843131bffb993e6a30d831b0af2d3dea8a119

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      packages: ./cmd/kepler
      output: kepler
      ldflags: |
        -X github.com/sustainable-computing-io/kepler/internal/version.version=${{package.version}}
        -X github.com/sustainable-computing-io/kepler/internal/version.buildTime=$(date -u -d "@${SOURCE_DATE_EPOCH:-$(date +%s)}" "+%Y-%m-%dT%H:%M:%SZ")
        -X github.com/sustainable-computing-io/kepler/internal/version.gitBranch=$(git rev-parse --abbrev-ref HEAD)
        -X github.com/sustainable-computing-io/kepler/internal/version.gitCommit=$(git rev-parse HEAD)

update:
  enabled: true
  github:
    identifier: sustainable-computing-io/kepler
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: kepler --help 2>&1 | grep -F -e "Power consumption monitoring exporter for Prometheus"
    # This is expected to fail as Kepler requires bare metal support to get information for `rapl` (`/sys/class/powercap`)
    - name: "Test Kepler startup"
      uses: test/daemon-check-output
      with:
        start: kepler
        timeout: 30
        expected_output: |
          Initializing service
          ${{package.version}}
          Shutting down initialized services
          failed to initialize services
        error_strings: "nothing"
