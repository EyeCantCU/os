package:
  name: eks-distro-kubernetes-csi-external-snapshotter-6.3
  version: 6.3.0 # eks-distro v1-23-eks-33: https://github.com/aws/eks-distro/releases/tag/v1-23-eks-33
  epoch: 0
  description: Sidecar container that watches Kubernetes Snapshot CRD objects and triggers CreateSnapshot/DeleteSnapshot against a CSI endpoint.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - eks-distro-kubernetes-csi-external-snapshotter=${{package.full-version}}

vars:
  eks-project: kubernetes-csi/external-snapshotter
  eks-package-version: 1-23-eks-33

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-distro
      tag: v${{vars.eks-package-version}}
      expected-commit: a200cc89c4a4b8579602fad959065f51baf714d3

  - uses: eks-distro/build
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      # # Mitigate CVE-2023-39325 / CVE-2023-44487 (grpc)
      deps: golang.org/x/net@v0.17.0 google.golang.org/grpc@v1.58.3

  - uses: eks-distro/install
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      binary-target: csi-snapshotter

  - uses: strip

subpackages:
  - name: eks-distro-kubernetes-csi-external-snapshot-controller-1.23
    pipeline:
      - uses: eks-distro/install
        with:
          eks-project: ${{vars.eks-project}}
          eks-package-version: ${{vars.eks-package-version}}
          binary-target: snapshot-controller
    dependencies:
      provides:
        - eks-distro-kubernetes-csi-external-snapshot-controller=1.23

  - name: eks-distro-kubernetes-csi-external-snapshot-validation-webhook-1.23
    pipeline:
      - uses: eks-distro/install
        with:
          eks-project: ${{vars.eks-project}}
          eks-package-version: ${{vars.eks-package-version}}
          binary-target: snapshot-validation-webhook
    dependencies:
      provides:
        - eks-distro-kubernetes-csi-external-snapshot-validation-webhook=1.23

update:
  manual: true
