package:
  name: py3-llvmlite
  version: 0.45.1
  epoch: 0
  description: A lightweight Python LLVM binding for writing JIT compilers
  copyright:
    - license: BSD-2-Clause

vars:
  pypi-package: llvmlite
  import: llvmlite
  # Verify https://github.com/numba/llvmlite#compatibility when bumping LLVM versions
  llvm-version: 20

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - llvm-${{vars.llvm-version}}-dev
      - py3-supported-build-base-dev
      - zlib-dev
  environment:
    CXXFLAGS: -I/usr/lib/llvm-${{vars.llvm-version}}/include

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/numba/llvmlite.git
      tag: v${{package.version}}
      expected-commit: acabcfb1f0d3968249290d8e93a382edcac02b7c

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - libLLVM-${{vars.llvm-version}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import llvmlite
            import llvmlite.binding as llvm

            # Test version information
            version = llvm.llvm_version_info
            assert isinstance(version, tuple), f"Expected tuple, got {type(version)}"
            assert len(version) >= 3, f"Expected version tuple with at least 3 elements, got {len(version)}"

            # Test creating a module
            from llvmlite import ir
            module = ir.Module(name="test_module")
            assert module.name == "test_module"

            print("All tests passed!")
            EOF

            # Ensure version reported by LLVM binding is not bogus
            python${{range.key}} <<'EOF' | grep -F -e "${{vars.llvm-version}}"
            import llvmlite.binding as llvm
            print(llvm.llvm_version_info[0])
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  ignore-regex-patterns:
    - .*b\d*
    - .*rc\d*
    - .*dev\d*
  github:
    identifier: numba/llvmlite
    strip-prefix: v
    use-tag: true
