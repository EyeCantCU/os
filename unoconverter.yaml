package:
  name: unoconverter
  version: 0.0.1
  epoch: 0
  description: "URL retrieval utility and library"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python3
      - libreoffice

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gotenberg/unoconverter
      tag: v${{package.version}}
      expected-commit: 75831562112ae3f676a67c1bb2935490aaa7bc26

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      mv unoconv ${{targets.destdir}}/usr/bin
      chmod +x ${{targets.destdir}}/usr/bin/unoconv

update:
  enabled: true
  github:
    identifier: gotenberg/unoconverter
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - wolfi-base
  pipeline:
    - runs: |
        unoconv --version
