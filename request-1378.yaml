package:
  name: request-1378
  version: 0.0.0
  epoch: 1
  description: Custom entrypoint for RStudio
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - request-1379=${{package.full-version}}
    runtime:
      - rstudio

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      install -Dm755 entrypoint.sh ${{targets.contextdir}}/usr/bin/start-rstudio

test:
  pipeline:
    - runs: |
        [[ -x /usr/bin/start-rstudio ]]

update:
  manual: true
