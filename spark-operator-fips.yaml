package:
  name: spark-operator-fips
  version: "2.1.1"
  epoch: 0
  description: Kubernetes operator for managing the lifecycle of Apache Spark applications on Kubernetes.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - procps

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubeflow/spark-operator
      tag: v${{package.version}}
      expected-commit: 1905be6e1dbd0917168ad5cf4054e081014f84f8

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/operator
      output: spark-operator

subpackages:
  - name: "sparkctl-fips"
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          packages: ./cmd/sparkctl
          output: sparkctl

update:
  enabled: true
  github:
    identifier: kubeflow/spark-operator
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - sparkctl-fips
  pipeline:
    - uses: test/go-fips-check
    # AUTOGENERATED
    - runs: |
        spark-operator --help
        sparkctl --version
        sparkctl --help
