package:
  name: chart-iamguarded-redis-cluster
  version: "12.0.1"
  epoch: 1
  description: redis-cluster iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: redis-cluster/${{package.version}}
      expected-commit: cdadc03d3d4c232253c2a9ae0d5148a3d1c4a64e

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/redis-cluster

  - uses: charts/package
    with:
      chart-path: iamguarded/redis-cluster

update:
  enabled: false
  manual: true
  schedule:
    period: daily
    reason: Update automation doesn't yet support automating from private repos.
  git:

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /redis-cluster
