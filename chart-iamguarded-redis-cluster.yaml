package:
  name: chart-iamguarded-redis-cluster
  version: "12.0.10"
  epoch: 1
  description: redis-cluster iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: redis-cluster/${{package.version}}
      expected-commit: 3860720b370fcf295d9ce82356d04f2c30f28c33

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/redis-cluster

  - uses: charts/package
    with:
      chart-path: iamguarded/redis-cluster

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: redis-cluster/
    use-tag: true
    tag-filter-prefix: redis-cluster/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /redis-cluster
