package:
  name: dcgm-exporter
  version: 3.5.0
  epoch: 0
  description: NVIDIA GPU metrics exporter for Prometheus leveraging DCGM
  copyright:
    - license: Apache-2.0
  target-architecture:
    - x86_64
  dependencies:
    runtime:
      - DCGM

vars:
  dcgm-version: 3.3.7

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6d499c68a93677e8ccafe857427b09d4617ebfae
      repository: https://github.com/NVIDIA/dcgm-exporter
      tag: ${{vars.dcgm-version}}-${{package.version}}

  - runs: |
      make generate update-version

  - uses: go/bump
    with:
      deps: google.golang.org/grpc@v1.64.1

  - uses: go/build
    with:
      ldflags: -X main.BuildVersion=${{vars.dcgm-version}}-${{package.version}}
      output: dcgm-exporter
      packages: ./cmd/dcgm-exporter

  - runs: |
      mkdir -p ${{targets.contextdir}}/etc
      cp -r etc ${{targets.contextdir}}/etc/dcgm-exporter
      mkdir -p ${{targets.contextdir}}/usr/local/dcgm
      cp docker/dcgm-exporter-entrypoint.sh ${{targets.contextdir}}/usr/local/dcgm/dcgm-exporter-entrypoint.sh
      chmod +x ${{targets.contextdir}}/usr/local/dcgm/dcgm-exporter-entrypoint.sh

update:
  enabled: true
  github:
    identifier: NVIDIA/dcgm-exporter
    strip-prefix: 3.3.7-
    tag-filter: 3.3.7-
