package:
  name: gitlab-runner-fips-17.1
  version: 17.1.1
  epoch: 0
  description: GitLab Runner is the open source project that is used to run your CI/CD jobs and send the results back to GitLab
  copyright:
    - license: MIT
  dependencies:
    provides:
      - gitlab-runner-fips=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: short-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/gitlab-org/gitlab-runner
      tag: v${{package.version}}
      expected-commit: 211277355cdd2d3cb6d09b4372f26773f4ba83a2

  - uses: go/bump
    with:
      deps: github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/hashicorp/go-retryablehttp@v0.7.7 google.golang.org/grpc@v1.64.1

  - uses: go/build
    with:
      packages: .
      output: gitlab-runner
      ldflags: -X gitlab.com/gitlab-org/gitlab-runner/common.NAME=${{package.name}} -X gitlab.com/gitlab-org/gitlab-runner/common.VERSION=v${{package.version}}
      go-package: go-fips

subpackages:
  - name: gitlab-runner-helper-fips-${{vars.short-package-version}}
    description: GitLab Runner Helper
    dependencies:
      provides:
        - gitlab-runner-helper-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./apps/gitlab-runner-helper
          output: gitlab-runner-helper
          ldflags: -X gitlab.com/gitlab-org/gitlab-runner/common.NAME=${{package.name}} -X gitlab.com/gitlab-org/gitlab-runner/common.VERSION=v${{package.version}}
          go-package: go-fips

update:
  enabled: true
  github:
    identifier: gitlabhq/gitlab-runner
    strip-prefix: v
    use-tag: true
    tag-filter: v17.1

test:
  environment:
    contents:
      packages:
        - gitlab-runner-helper-fips=${{package.full-version}}
  pipeline:
    - runs: |
        gitlab-runner --help
        gitlab-runner-helper --help
    - uses: test/go-fips-check
