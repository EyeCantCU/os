package:
  name: syncthing
  version: 2.0.2
  epoch: 0
  description: "Open Source Continuous File Synchronization"
  copyright:
    - license: MPL-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/syncthing/syncthing
      tag: v${{package.version}}
      expected-commit: 755daaa7b7c0cdf39b246e5590d0b615a73becc4

  - runs: |
      go generate ./...

  - uses: go/build
    with:
      ldflags: |
        -X github.com/syncthing/syncthing/lib/build.Version=v${{package.version}}
      packages: ./cmd/syncthing
      output: syncthing

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/bin
          ln -sf /usr/bin/syncthing ${{targets.subpkgdir}}/bin/syncthing
    test:
      pipeline:
        - runs: |
            test "$(readlink /bin/syncthing)" = "/bin/syncthing"

update:
  enabled: true
  github:
    identifier: syncthing/syncthing
    strip-prefix: v
    use-tag: true
  ignore-regex-patterns:
    - "-rc"
    - "-beta"

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - runs: |
        syncthing version | grep "${{package.version}}"
        syncthing --help | grep 'syncthing'
    - runs: |
        set -euo pipefail
        syncthing generate | grep 'Generating key and certificate'
        syncthing paths | grep 'Configuration file'
    - name: "Test serve"
      uses: test/daemon-check-output
      with:
        start: syncthing serve
        timeout: 10
        expected_output: |
          TCP listener starting
          QUIC listener starting
        post: |
          curl -fsSL http://127.0.0.1:8384/ | grep 'syncthing'
