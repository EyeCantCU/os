package:
  name: syncthing
  version: 2.0.2
  epoch: 0
  description: "Open Source Continuous File Synchronization"
  copyright:
    - license: MPL-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/syncthing/syncthing
      tag: v${{package.version}}
      expected-commit: 755daaa7b7c0cdf39b246e5590d0b615a73becc4

  - uses: go/build
    with:
      ldflags: |
        -X github.com/syncthing/syncthing/lib/build.Version=v${{package.version}}
      packages: ./cmd/syncthing
      output: syncthing

test:
  pipeline:
    - runs: |
        set -euo pipefail
        syncthing --version | grep "${{package.version}}"
        syncthing --help | grep -qi 'syncthing'
    - runs: |
        set -euo pipefail
        syncthing -generate /tmp/syncthing-config
        test -d /tmp/syncthing-config