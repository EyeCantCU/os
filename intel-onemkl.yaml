  - name: intel-oneapi-mkl-core-dev
    description: Intel® oneAPI Math Kernel Library for core development
    dependencies:
      runtime:
        - intel-oneapi-mkl-cg=${{package.full-version}}
        - intel-oneapi-mkl-core=${{package.full-version}}
        - intel-oneapi-mkl-classic-include=${{package.full-version}}
        - intel-oneapi-common-vars=${{package.full-version}}
        - intel-oneapi-common-licensing=${{package.full-version}}
        - intel-oneapi-common-oneapi-vars=${{package.full-version}}
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        runs: |
          src="unpack/mkl/${{vars.mangled-version}}"
          dest="${{targets.contextdir}}/opt/intel/oneapi/mkl/${{vars.mangled-version}}"
          mkdir -p "$dest"

          mkdir -p "$dest/bin"
          mv "$src/bin/mkl_link_tool" "$dest"
          # will fail if unexpected files exist
          rmdir "$src/bin"

          srclib="$src/lib"
          destlib="$dest/lib"
          mkdir -p "$destlib"
          mv \
            "$srclib"/libmkl_blas95_*.a    \
            "$srclib/libmkl_core.a"        \
            "$srclib/"libmkl_gf_*.a        \
            "$srclib"/libmkl_gnu_thread.a  \
            "$srclib"/libmkl_intel_*.a     \
            "$srclib"/libmkl_lapack95_*.a  \
            "$srclib"/libmkl_sequential.a  \
            "$srclib"/libmkl_tbb_thread.a  \
            "$srclib"/cmake                \
            "$srclib"/pkgconfig            \
            "$destlib"

          mkdir -p "$dest"/share/mkl
          mv "$src/share/mkl/interfaces" "$dest"/share/mkl
    test:
      environment:
        contents:
          packages:
            - build-base
        environment:
          C_INCLUDE_PATH: "/opt/intel/oneapi/mkl/latest/include"
          LIBRARY_PATH: "/opt/intel/oneapi/mkl/latest/lib"
      pipeline:
        - if: ${{build.arch}} == 'x86_64'
          uses: test/tw/ldd-check
        - if: ${{build.arch}} == 'x86_64'
          runs: |
            set -o pipefail
            cat > app.c <<EOF
            #include <stdio.h>
            #include "mkl.h"

            int main()
            {
              MKLVersion mkl_version;
              mkl_get_version(&mkl_version);

              printf("You are using oneMKL %d.%d\n", mkl_version.MajorVersion, mkl_version.UpdateVersion);

              return 0;
            }
            EOF
            gcc app.c -o app -lmkl_rt
            ./app | grep -w '${{vars.mangled-version}}'
        - if: ${{build.arch}} != 'x86_64'
          uses: test/emptypackage

  - name: intel-oneapi-mkl-cg
    description: MKL integration files for Chainguard OS
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        runs: |
          dest="${{targets.contextdir}}/opt/intel/oneapi/mkl"
          mkdir -p "$dest"
          ln -s "${{vars.mangled-version}}" "$dest/latest"

          mkdir -p "${{targets.contextdir}}/etc/ld.so.conf.d"
          echo "/opt/intel/oneapi/mkl/${{vars.mangled-version}}/lib" > \
            ${{targets.contextdir}}/etc/ld.so.conf.d/${{context.name}}.conf

  - name: intel-oneapi-mkl-core
    description: Intel® oneAPI Math Kernel Library for core
    dependencies:
      runtime:
        - intel-oneapi-mkl-cg=${{package.full-version}}
        - intel-oneapi-openmp=${{package.full-version}}
        - intel-oneapi-common-vars=${{package.full-version}}
        - intel-oneapi-common-licensing=${{package.full-version}}
        - intel-oneapi-common-oneapi-vars=${{package.full-version}}
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        runs: |
          src="unpack/mkl/${{vars.mangled-version}}"
          dest="${{targets.contextdir}}/opt/intel/oneapi/mkl/${{vars.mangled-version}}"
          mkdir -p "$dest"

          mv "$src/etc" "$dest"
          srclib="$src/lib"
          destlib="$dest/lib"
          mkdir -p "$destlib"
          mv \
            "$srclib"/libmkl_avx*.so* \
            "$srclib"/libmkl_core.so* \
            "$srclib"/libmkl_def.so* \
            "$srclib"/libmkl_gf_*.so* \
            "$srclib"/libmkl_gnu_thread.so* \
            "$srclib"/libmkl_intel_*.so* \
            "$srclib"/libmkl_mc3.so* \
            "$srclib"/libmkl_rt.so* \
            "$srclib"/libmkl_sequential.so* \
            "$srclib"/libmkl_tbb_thread.so* \
            "$srclib"/libmkl_*vml_*.so* \
            "$destlib"
    test:
      pipeline:
        - if: ${{build.arch}} == 'x86_64'
          uses: test/tw/ldd-check
        - if: ${{build.arch}} != 'x86_64'
          uses: test/emptypackage

