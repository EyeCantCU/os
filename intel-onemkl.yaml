package:
  name: intel-onemkl
  version: "2025.2.0.629"
  epoch: 1
  description: Intel® oneAPI Math Kernel Library
  copyright:
    - license: PROPRIETARY

environment:
  contents:
    packages:
      - busybox
      - coreutils # sha384sum is used by the self-extracting archive
      - gnutar
      - libstdc++ # self-extracting archive runtime
      - libtbb-dev # used by melange to generate so: deps
      - libumf0-dev # used by melange to generate so: deps

var-transforms:
  - from: ${{package.version}}
    match: '(\d+\.\d+).*'
    replace: '$1'
    to: mangled-version

pipeline:
  # This is a self-extracting archive that contains the mkl libs and headers,
  # as well as a number of other things, all in binary form. Some of those
  # things are open source projects, so we don't generate packages for them
  # here and instead depend on our own packages.
  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/47c7d946-fca1-441a-b0df-b094e3f045ea/${{package.name}}-${{package.version}}_offline.sh
      expected-sha512: 60e0b86b2e63da1becb527db0d912d19e2a664671e1e6cf54ac6fad35ced3bb791e490d4b7d1a555231a0b553a32652d1c6c41869222c88f30e17fee5c436cd3
      extract: false

  - if: ${{build.arch}} == 'x86_64'
    runs: |
      mkdir -p unpack
      sh ${{package.name}}-${{package.version}}_offline.sh \
        -a --cli --silent --eula accept --install-dir unpack

test:
  pipeline:
    - uses: test/emptypackage

subpackages:
  # The subpackage layout is based on the upstream .deb packages
  # Many packages are commented out because we don't need them (yet)
  - name: intel-oneapi-common-licensing
    description: oneAPI Common License
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        runs: |
          src="unpack/licensing/${{vars.mangled-version}}"
          dest="${{targets.contextdir}}/opt/intel/oneapi/"
          mkdir -p "$dest"

          mv "$src/licensing" "$dest/"

  - name: intel-oneapi-common-oneapi-vars
    description: oneAPI Common Toolkit Environment Script
    dependencies:
      runtime:
        - bash
        - intel-oneapi-common-oneapi-vars=${{package.full-version}}
        - procps
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        runs: |
          src="unpack"
          dest="${{targets.contextdir}}/opt/intel/oneapi"
          mkdir -p "$dest"

          mv "$src"/common "$dest"
    test:
      pipeline:
        - if: ${{build.arch}} == 'x86_64'
          runs: |
            bash -c '. /opt/intel/oneapi/common/latest/oneapi-vars.sh && env'
        - if: ${{build.arch}} != 'x86_64'
          uses: test/emptypackage

  - name: intel-oneapi-common-vars
    description: oneAPI Common Environment Scripts
    dependencies:
      runtime:
        - bash
        - intel-oneapi-common-licensing=${{package.full-version}}
        - intel-oneapi-common-oneapi-vars=${{package.full-version}}
        - procps
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        runs: |
          src="unpack"
          dest="${{targets.contextdir}}/opt/intel/oneapi"
          mkdir -p "$dest"

          mv \
            "$src/modulefiles-setup.sh" \
            "$src/setvars.sh"           \
            "$src/support.txt"          \
            "$dest"

