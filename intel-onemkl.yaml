  - name: intel-oneapi-mkl-classic-include
    dependencies:
      runtime:
        - intel-oneapi-common-vars=${{package.full-version}}
        - intel-oneapi-common-licensing=${{package.full-version}}
        - intel-oneapi-common-oneapi-vars=${{package.full-version}}
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        runs: |
          src="unpack/mkl/${{vars.mangled-version}}"
          dest="${{targets.contextdir}}/opt/intel/oneapi/mkl/${{vars.mangled-version}}"
          mkdir -p "$dest/include"
          for inc in "$src/include/"*; do
            if [ "$inc" = "$src/include/oneapi" ]; then
              continue
            fi
            mv "$inc" "$dest/include"
          done

