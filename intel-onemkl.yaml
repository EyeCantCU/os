  - name: intel-oneapi-compiler-shared-runtime
    description: Intel® oneAPI DPC++/C++ Compiler runtime
    dependencies:
      runtime:
        - intel-oneapi-openmp=${{package.full-version}}
        - intel-oneapi-common-vars=${{package.full-version}}
        - intel-oneapi-common-licensing=${{package.full-version}}
        - intel-oneapi-common-oneapi-vars=${{package.full-version}}
        - libtbb
        - libstdc++
    options:
      # Avoid generating deps on libs that are in this package,
      # but for which we generate no provides.
      no-depends: true
      # This package provides binary-only shlibs that may overlap
      # with things we build from source. We don't want this to
      # be used as a dependency for anything that hasn't explicitly
      # opted-in to it.
      no-provides: true
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        runs: |
          src="unpack/compiler/${{vars.mangled-version}}"
          dest="${{targets.contextdir}}/opt/intel/oneapi/compiler/${{vars.mangled-version}}"
          mkdir -p "$dest"

          srclib="$src/lib"
          destlib="$dest/lib"
          mkdir -p "$destlib"

          mv \
            "$srclib/cl.cfg"               \
            "$srclib"/cl*.rtl              \
            "$srclib/icx-lto.so"           \
            "$srclib"/libOpenCL.so.*       \
            "$srclib"/libcommon_clang.so.* \
            "$srclib/libimf.so"            \
            "$srclib"/libintelocl.so*      \
            "$srclib"/libintlc.so*         \
            "$srclib/libirc.so"            \
            "$srclib/libirng.so"           \
            "$srclib/libistrconv.so"       \
            "$srclib"/libocl_svml_*.so     \
            "$srclib/libqkmalloc.so"       \
            "$srclib/libsvml.so"           \
            "$srclib/libxptifw.so"         \
            "$destlib"

          mkdir -p ${{targets.contextdir}}/etc/ld.so.conf.d
          echo "/opt/intel/oneapi/compiler/${{vars.mangled-version}}/lib" > \
            ${{targets.contextdir}}/etc/ld.so.conf.d/${{context.name}}.conf
    test:
      pipeline:
        - if: ${{build.arch}} == 'x86_64'
          uses: test/tw/ldd-check
        - if: ${{build.arch}} != 'x86_64'
          uses: test/emptypackage

