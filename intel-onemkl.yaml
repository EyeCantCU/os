  - name: intel-oneapi-openmp
    description: Intel® OpenMP* Runtime Library
    options:
      # uses libs from intel-oneapi-compiler-shared-runtime, but that package
      # doesn't provide them because they live in a non-standard path
      no-depends: true
      # This package provides binary-only shlibs that may overlap
      # with things we build from source. We don't want this to
      # be used as a dependency for anything that hasn't explicitly
      # opted-in to it.
      no-provides: true
    dependencies:
      runtime:
        - intel-oneapi-compiler-shared-runtime
        - intel-oneapi-common-vars=${{package.full-version}}
        - intel-oneapi-common-licensing=${{package.full-version}}
        - intel-oneapi-common-oneapi-vars=${{package.full-version}}
        - intel-oneapi-openmp-common
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        runs: |
          src="unpack/compiler/${{vars.mangled-version}}"
          dest="${{targets.contextdir}}/opt/intel/oneapi/compiler/${{vars.mangled-version}}"
          mkdir -p "$dest"

          mv "$src/bin" "$dest"

          srclib="$src/lib"
          destlib="$dest/lib"
          mkdir -p "$destlib"
          mv \
            "$srclib"/clang           \
            "$srclib/libarcher.so"    \
            "$srclib"/libiomp*        \
            "$srclib"/libomp*         \
            "$srclib"/libonnxruntime* \
            "$srclib"/pkgconfig       \
            "$destlib"

          mv "$src/opt" "$dest"
          mkdir -p "$dest/share"
          mv "$src/share/clang" "$dest/share"

  - name: intel-oneapi-openmp-common
    description: Intel® OpenMP* Runtime Library common
    dependencies:
      runtime:
        - intel-oneapi-common-vars=${{package.full-version}}
        - intel-oneapi-common-licensing=${{package.full-version}}
        - intel-oneapi-common-oneapi-vars=${{package.full-version}}
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        runs: |
          src="unpack/compiler/${{vars.mangled-version}}"
          dest="${{targets.contextdir}}/opt/intel/oneapi/compiler/${{vars.mangled-version}}"
          mkdir -p "$dest"
          ln -s "${{vars.mangled-version}}" "$dest/latest"

          mv "$src/env" "$dest"
          mv "$src/etc" "$dest"

update:
  # We use the pypi release as a proxy for when a new upstream release
  # is available. The self-extracting archive we're using has an additional
  # version component (2025.2.0.629 vs pypi's 2025.2.0). Looking up that
  # version is currently manual.
  enabled: true
  manual: true
  release-monitor:
    identifier: 184490
