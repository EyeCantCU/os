package:
  name: py3.9-pyproject-hooks
  version: 1.1.0
  epoch: 1
  description: A low-level library for calling build-backends in `pyproject.toml`-based project
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.9

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3.9-flit-core
      - py3.9-gpep517
      - py3.9-installer
      - py3.9-pip
      - py3.9-setuptools
      - python-3.9
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/pyproject-hooks
      tag: v${{package.version}}
      expected-commit: 903ad919c7857a7321dee080e708e13afb2bd4d5

  - runs: |
      python3.9 -m gpep517 build-wheel --wheel-dir dist --output-fd 1
      python3.9 -m installer -d "${{targets.destdir}}" dist/*.whl
      find ${{targets.destdir}} -name "*.pyc" -exec rm -rf '{}' +

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: pyproject_hooks

update:
  enabled: true
  github:
    identifier: pypa/pyproject-hooks
    use-tag: true
    strip-prefix: v
