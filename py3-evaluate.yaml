package:
  name: py3-evaluate
  version: "0.4.5"
  epoch: 1
  description: Run your *raw* PyTorch training script on any kind of device
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: evaluate
  import: evaluate

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/huggingface/evaluate
      tag: v${{package.version}}
      expected-commit: 53b332458f2dec5c7b11c641d3270add252b5a67

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-datasets
        - py${{range.key}}-dill<0.3.9
        - py${{range.key}}-fsspec
        - py${{range.key}}-huggingface-hub
        - py${{range.key}}-multiprocess
        - py${{range.key}}-numpy
        - py${{range.key}}-packaging
        - py${{range.key}}-pandas
        - py${{range.key}}-requests
        - py${{range.key}}-tqdm
        - py${{range.key}}-xxhash
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
        - py${{range.key}}-cookiecutter
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            evaluate-cli --help

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: huggingface/evaluate
    strip-prefix: v
