package:
  name: py3-pylatexenc
  version: 2.10
  epoch: 0
  description: Simple LaTeX parser providing latex-to-unicode and unicode-to-latex conversion
  copyright:
    - license: MIT

vars:
  pypi-package: pylatexenc

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/phfaist/pylatexenc.git
      tag: v${{package.version}}
      expected-commit: 4acd5adbe634b8b51f71cb6d09680e6eb4df638a

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-pyparsing
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | grep -F -e "ζ= x + i y"
            from pylatexenc.latex2text import LatexNodes2Text
            data = '''
            \zeta = x + i y
            '''
            print(LatexNodes2Text().latex_to_text(data))
            EOF

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      environment:
        contents:
          packages:
            - jq
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: latex2text latexencode latexwalker
        - uses: test/tw/ver-check
          with:
            bins: latex2text latexencode latexwalker
        - runs: |
            set -o pipefail
            echo "\zeta" | latex2text | grep -F -e "ζ"
            echo "ζ" | latexencode | grep -F -e "\ensuremath{\zeta}"
            echo "\ensuremath{\zeta}" | latexwalker --output-format json | jq -rc ".nodelist[].nodetype" | grep -F -e "LatexCharsNode"

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
