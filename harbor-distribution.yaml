package:
  name: harbor-distribution
  version: 2.8.3
  epoch: 0
  description: Harbor's Fork of Distribution toolkit
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go
  environment:
    CGO_ENABLED: "0"
    PKG: "github.com/docker/distribution"
    DISTRIBUTION_DIR: "/usr/lib/go/src/github.com/docker/distribution"
    GO111MODULE: "auto"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/goharbor/distribution
      tag: v${{package.version}}
      expected-commit: 4772604ae973031ab32dd9805a4bccf61d94909f

  - runs: |
      # Adds source modules to $GOPATH
      mkdir -p "${DISTRIBUTION_DIR}"
      cp -rf . "${DISTRIBUTION_DIR}"

  - runs: |
      set -eux
      # GOPATH-style build
      # We can't use melange's go/build pipeline because it primarily requires go.mod file which does not exist in source code for Distribution v2.8.3
      install_dir="${{targets.contextdir}}/usr/bin"
      mkdir -p "${install_dir}"

      go build \
        -tags "include_oss,include_gcs" \
        -ldflags "-w -X ${DISTRIBUTION_DIR}/version.Version=${{package.version}} -X ${DISTRIBUTION_DIR}/version.Revision=$(git rev-parse --short HEAD) -X ${DISTRIBUTION_DIR}/version.Package=${PKG}" \
        -o "${install_dir}/harbor-registry" \
        ./cmd/registry

  - uses: strip

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      mkdir -p ${{targets.destdir}}/etc/registry

      # Create compatibility symlink for legacy registry binary name
      ln -sf /usr/bin/harbor-registry ${{targets.destdir}}/usr/bin/registry_DO_NOT_USE_GC
      # Use example config as registry config
      cp ./cmd/registry/config-example.yml ${{targets.destdir}}/etc/registry/config.yml

test:
  environment:
    contents:
      packages:
        - curl
        - procps
        - wait-for-it
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: harbor-registry registry_DO_NOT_USE_GC
    - uses: test/tw/ver-check
      with:
        bins: harbor-registry registry_DO_NOT_USE_GC
    - uses: test/daemon-check-output
      with:
        start: "harbor-registry serve /etc/registry/config.yml"
        expected_output: |
          level=info
          service=registry
          listening on
        post: |
          set -o pipefail
          wait-for-it localhost:5000 -t 10
          curl -fsSL -I localhost:5000 | grep -q "HTTP/1.1 200"

update:
  enabled: true
  github:
    identifier: goharbor/distribution
    strip-prefix: v
  ignore-regex-patterns:
    - ".*alpha.*"
    - ".*beta.*"
    - ".*rc.*"
