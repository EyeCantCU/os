package:
  name: py3.9-pyparsing
  version: "3.2.5"
  epoch: 0
  description: "simple packaging tool for simple packages (core)"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.9

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3.9-flit-core
      - py3.9-gpep517
      - py3.9-installer
      - python-3.9
      - wolfi-base

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/p/pyparsing/pyparsing-${{package.version}}.tar.gz
      expected-sha256: 2df8d5b7b2802ef88e8d016a2eb9c7aeaa923529cd251ed0fe4608275d4105b6

  - runs: |
      mkdir -p dist
      backend="$(python3 -m gpep517 get-backend)"
      python3.9 -m gpep517 build-wheel --wheel-dir dist --backend "$backend" --output-fd 1

  - runs: |
      python3.9 -m installer -d "${{targets.destdir}}" dist/pyparsing-${{package.version}}-py3-none-any.whl

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: pyparsing

update:
  enabled: true
  release-monitor:
    identifier: 3756
