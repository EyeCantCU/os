package:
  name: nvidia-cudnn-8-cuda-11
  version: 8.9.7.29
  epoch: 0
  description: CUDA Deep Neural Network Libraries
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-sbsa/cudnn-linux-sbsa-8.9.7.29_cuda11-archive.tar.xz"
          expected-sha256: "91c37cfb458f541419e98510f13aaf5975c0232c613e18b776385490074eea17"
          timeout: 120
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-8.9.7.29_cuda11-archive.tar.xz"
          expected-sha256: "a3e2509028cecda0117ce5a0f42106346e82e86d390f4bb9475afc976c77402e"
          timeout: 120

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cudnn-8.9/
      mv include ${{targets.destdir}}/usr/local/cudnn-8.9/
      mv lib ${{targets.destdir}}/usr/local/cudnn-8.9/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cudnn-8.9/${{package.name}}.LICENSE

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/local/cuda-11/lib64
      mkdir -p ${{targets.contextdir}}/usr/local/cuda-11/include
      for f in ${{targets.destdir}}/usr/local/cudnn-8.9/lib64/*; do
      ln -sf /usr/local/cudnn-8.9/lib64/$(basename $f) ${{targets.contextdir}}/usr/local/cuda-11/lib64/$(basename $f)
      done
      for f in ${{targets.destdir}}/usr/local/cudnn-8.9/include/*; do
      ln -sf /usr/local/cudnn-8.9/include/$(basename $f) ${{targets.contextdir}}/usr/local/cuda-11/include/$(basename $f)
      done

update:
  enabled: false

test:
  environment:
    contents:
      packages:
        - wolfi-base
        - nvidia-cudnn-8-cuda-11
  pipeline:
    - runs: |
        # Make sure they're symlinked into the right place for the cuda-12 subpackage.
        stat /usr/local/cuda-11/include/cudnn.h
        stat /usr/local/cuda-11/lib64/libcudnn.so
