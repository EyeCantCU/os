package:
  name: kuma-2.6
  version: 2.6.9
  epoch: 0
  description: A multi-zone service mesh for containers, Kubernetes and VMs.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kumahq/kuma
      tag: ${{package.version}}
      expected-commit: e28b7339e6392afaefa372e02cd9a158ddeb2f39

subpackages:
  - name: kuma-cp-2.6
    pipeline:
      - uses: go/build
        with:
          packages: ./app/kuma-cp
          output: kuma-cp
      - uses: strip
    test:
      pipeline:
        - name: Verify kuma-cp
          runs: |
            kuma-cp --help

update:
  enabled: true
  github:
    identifier: kumahq/kuma
    tag-filter: 2.6
    use-tag: true
