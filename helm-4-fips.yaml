package:
  name: helm-4-fips
  version: "4.0.1"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: The Kubernetes Package Manager
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - helm-fips=${{package.full-version}}
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/helm/helm
      tag: v${{package.version}}
      expected-commit: 12500dd401faa7629f30ba5d5bff36287f3e94d3

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - runs: |
      make build CGO_ENABLED=1 LDFLAGS=-w TAGS=netgo,osusergo
      install -Dm755 ./bin/helm "${{targets.destdir}}/usr/bin/helm"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - name: Setup Helm
      runs: |
        helm repo add stable https://charts.helm.sh/stable
        helm repo update
        helm --help
    - name: Verify Helm Version
      runs: |
        helm version | grep "version.BuildInfo" || exit 1
    - name: Search Helm Chart
      runs: |
        helm search repo nginx | grep "nginx" || exit 1
    - name: Helm Lint
      runs: |
        helm create lint-test
        helm lint lint-test || exit 1
        rm -rf lint-test
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: helm/helm
    strip-prefix: v
    tag-filter-prefix: v4
