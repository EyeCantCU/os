package:
  name: py3-weasyprint
  version: "67.0"
  epoch: 0
  description: The Awesome Document Factory - visual rendering engine for HTML and CSS that can export to PDF
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0

vars:
  pypi-package: weasyprint
  module-name: weasyprint

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-wheel
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Kozea/WeasyPrint
      tag: v${{package.version}}
      expected-commit: 94af598020ad030bb015166d94524cc681603ff3

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-pydyf
        - py${{range.key}}-cffi
        - py${{range.key}}-tinyhtml5
        - py${{range.key}}-tinycss2
        - py${{range.key}}-cssselect2
        - py${{range.key}}-pyphen
        - py${{range.key}}-pillow
        - py${{range.key}}-fonttools
        # System libraries required by WeasyPrint
        - glib
        - pango
        - harfbuzz
        - gdk-pixbuf
        - cairo
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - fontconfig
            - ttf-dejavu
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.module-name}}
        - runs: |
            set -euo pipefail

            # Test that the weasyprint command works
            python${{range.key}} -m weasyprint --help | grep -F "usage:"

            # Test basic HTML to PDF conversion
            tee test.html << 'EOF'
            <!DOCTYPE html>
            <html>
              <head>
                <style>
                  body { font-family: sans-serif; }
                  h1 { color: blue; }
                </style>
              </head>
              <body>
                <h1>WeasyPrint Test</h1>
                <p>This is a test document to verify WeasyPrint works correctly.</p>
              </body>
            </html>
            EOF

            # Convert HTML to PDF
            python${{range.key}} -m weasyprint test.html test.pdf

            # Verify PDF was created and is a valid PDF
            test -f test.pdf
            # Check PDF magic bytes
            head -c 4 test.pdf | grep -F "%PDF"

            # Test Python API
            python${{range.key}} <<'PYTEST'
            from weasyprint import HTML, CSS

            # Test basic HTML rendering
            html = HTML(string='<h1>Hello, World!</h1>')
            pdf_bytes = html.write_pdf()

            # Verify we got PDF content
            assert pdf_bytes.startswith(b'%PDF'), "Output should be a PDF"
            assert len(pdf_bytes) > 100, "PDF should have content"

            print("WeasyPrint API test passed successfully!")
            PYTEST

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: weasyprint
        - uses: test/tw/ver-check
          with:
            bins: weasyprint

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: python/import
      with:
        import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v
