package:
  name: chart-iamguarded-etcd
  version: "12.0.11"
  epoch: 0
  description: Etcd iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: etcd/${{package.version}}
      expected-commit: 3d49e70015e2dd434b4e77643b1dc530803a6ef9

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/etcd

  - uses: charts/package
    with:
      chart-path: iamguarded/etcd

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: etcd/
    use-tag: true
    tag-filter-prefix: etcd/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /etcd
