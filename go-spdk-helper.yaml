package:
  name: go-spdk-helper
  version: 0.2.0
  epoch: 1
  description: Helper functions for Storage Performance Development Kit (SPDK)
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - blockdev
      - busybox
      - device-mapper # For dmsetup
      - lsblk
      - nvme-cli # For NVMe device management
      - util-linux

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/longhorn/go-spdk-helper.git
      tag: v${{package.version}}
      expected-commit: 6d075880c7a2a07fe69f4c69676262673a5a97f6

  - uses: go/build
    with:
      packages: .
      output: go-spdk-helper
      vendor: true

update:
  enabled: true
  github:
    identifier: longhorn/go-spdk-helper
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: go-spdk-helper
    - uses: test/tw/ldd-check
    - runs: |
        go-spdk-helper dmsetup --help
        go-spdk-helper nvmecli --help
        go-spdk-helper bdev --help
        go-spdk-helper device --help
    - name: Sanity check to ensure all needed runtime dependencies are present
      runs: |
        command -v dmsetup
        command -v nvme
        command -v lsblk
        command -v blockdev
