#
# This file controls the configuration of the audit daemon
#

# Define how frequent to rotate log files (in seconds)
local_events = yes
write_logs = yes
log_file = /var/log/audit/audit.log
log_group = root
log_format = ENRICHED
freq = 50
max_log_file = 6
num_logs = 5
priority_boost = 4
name_format = hostname
##name = mydomain

# Define amount of megabytes left when admin_space_left_action triggers
max_log_file_action = rotate

# Define the action to take when the system has detected that it is low on disk space.
# Valid values are: ignore, syslog, rotate, email, exec, suspend, single, halt
space_left = 25%
space_left_action = email
action_mail_acct = root
admin_space_left = 5%
admin_space_left_action = single

# Define disk full action when no space left on logging partition
# Valid values are: ignore, syslog, rotate, exec, suspend, single, halt
disk_full_action = HALT

# Define disk error action when errors detected writing to disk
# Valid values are: ignore, syslog, exec, suspend, single, halt
disk_error_action = SYSLOG

# Determine when to switch log files based on size (max_log_file)
# or by time (freq)
flush = incremental_async

# If the daemon should make a suggestion to the kernel to use
# a specific value for maximum audit backlog wait time.
# Only used for --backlog_wait_time server cmdline option
##backlog_wait_time = 60000

# Define overflow action when internal queue is full
# Valid values are: ignore, syslog, suspend, single, halt
overflow_action = SYSLOG

# Auditd priority
priority_boost = 4

# Audit dispatcher configuration (for remote logging)
disp_qos = lossy
dispatcher = /sbin/audispd
name_format = hostname
##name = mydomain
max_log_file_action = rotate

# Enable/disable syscall auditing
##enable_krb5 = no

# How computer name is inserted into audit event
# Valid values are: none, hostname, fqd, numeric, user
name_format = hostname

# Max number of outstanding audit buffers
# 0 means don't change the current value
##q_depth = 600

# Determine how often to send a list of plugins to auditd
plugin_dir = /etc/audit/plugins.d
