package:
  name: py3.9-packaging
  version: "24.1"
  epoch: 0
  description: "core utilities for python3 packaging"
  copyright:
    - license: Apache-2.0 AND BSD-2-Clause
  dependencies:
    runtime:
      - py3.9-pyparsing
      - python-3.9

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3.9-pyparsing
      - py3.9-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/packaging.git
      tag: ${{package.version}}
      expected-commit: 85442b8032cb7bae72866dfd7782234a98dd2fb7

  - runs: python3.9 -m pip install . --prefix=/usr --root=${{targets.destdir}}

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: packaging

update:
  enabled: true
  github:
    identifier: pypa/packaging
