package:
  name: haproxy-2.2
  version: 2.2.34
  epoch: 5
  description: "A TCP/HTTP reverse proxy for high availability environments"
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - libgcc
      - merged-usrsbin
      - wolfi-baselayout
    provides:
      - haproxy=${{package.full-version}}

# creates a new var that contains only the major and minor version to be used in the fetch URL
# e.g. 2.6.11 will create a new var mangled-package-version=2.6
var-transforms:
  - from: ${{package.version}}
    match: (\d+\.\d+)\.\d+
    replace: $1
    to: mangled-package-version
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - libcap-utils
      - linux-headers
      - lua5.3-dev
      - openssl-dev
      - pcre2-dev

# We have to use fetch, as there are issues cloning from: 'https://git.haproxy.org/git/haproxy-<version>.git'.
# Namely: 'failed to validate pipeline git-checkout: failed to list refs for https://git.haproxy.org/git/haproxy-<version>.git/: pkt-line 1: invalid hash text: encoding/hex: invalid byte'
pipeline:
  - uses: fetch
    with:
      uri: https://www.haproxy.org/download/${{vars.mangled-package-version}}/src/haproxy-${{package.version}}.tar.gz
      expected-sha256: 0fb78d1f296c45c7546a9a3167d595fb1af9eaf9e9c16a9324f36c55fbf2f323

  - uses: autoconf/make
    with:
      opts: |
        TARGET=linux-glibc \
        USE_THREAD=1 \
        USE_PCRE2=1 \
        USE_PCRE2_JIT=1 \
        USE_OPENSSL=1 \
        USE_LUA=1 \
        USE_NS=1 \
        USE_PROMEX=1 \
        LUA_LIB=/usr/lib/lua5.3 \
        LUA_INC=/usr/include/lua5.3 \
        USE_GETADDRINFO=1

  - runs: |
      make install DESTDIR="${{targets.destdir}}" PREFIX=/usr DOCDIR=/usr/share/doc/haproxy SBINDIR=/usr/bin
      install -d "${{targets.destdir}}"/var/lib/haproxy

  - uses: strip

  # This MUST run after strip, which strips capabilities too!
  - runs: setcap cap_net_bind_service=+eip "${{targets.destdir}}/usr/bin/haproxy"

subpackages:
  - name: "${{package.name}}-doc"
    description: "haproxy documentation"
    pipeline:
      - uses: split/manpages
    dependencies:
      provides:
        - haproxy-doc=${{package.full-version}}
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    test:
      pipeline:
        - uses: test/docs

  - name: ${{package.name}}-oci-entrypoint
    description: Entrypoint for using HAProxy in OCI containers
    dependencies:
      runtime:
        - busybox
        - merged-usrsbin
        - posix-libc-utils # `getent` is required for certain helm chart startups
        - wolfi-baselayout
      provides:
        - haproxy-oci-entrypoint=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin/
          cp docker-entrypoint.sh ${{targets.subpkgdir}}/usr/local/bin/
          chmod +x ${{targets.subpkgdir}}/usr/local/bin/docker-entrypoint.sh
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: haproxy-oci-entrypoint
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-iamguarded-compat
    dependencies:
      provides:
        - haproxy-iamguarded-compat=${{package.full-version}}
      runtime:
        - ${{package.name}}
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: haproxy
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /iamguarded/haproxy/conf

          mkdir -p /opt/iamguarded/haproxy/bin
          mkdir -p /opt/iamguarded/haproxy-dataplaneapi/bin
          mkdir -p /opt/iamguarded/lua/bin
          chmod g+rwX /opt/iamguarded

          ln -s /usr/bin/haproxy /opt/iamguarded/haproxy/bin/haproxy
          ln -s /usr/bin/dataplaneapi /opt/iamguarded/haproxy-dataplaneapi/bin/dataplaneapi
      - uses: iamguarded/finalize-compat
        with:
          package: haproxy
          version: ${{vars.major-version}}
    test:
      environment:
        contents:
          packages:
            - dataplaneapi
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: haproxy
            version: ${{vars.major-version}}
        - runs: |
            /opt/iamguarded/haproxy/bin/haproxy -v
            /opt/iamguarded/haproxy-dataplaneapi/bin/dataplaneapi --version

update:
  enabled: false
  exclude-reason: |
    we disabled the update here due to limitations around release-monitor and older version streams. We also can't configure to use upstream git repo, as we get errors trying to pull from it, that can't be resolved.

test:
  pipeline:
    - runs: |
        haproxy -v
