package:
  name: aws-cfn-bootstrap
  version: "2.0.33"
  epoch: 0
  description: CloudFormation helper scripts
  dependencies:
    runtime:
      - py${{vars.py-version}}-setuptools
  copyright:
    - license: Apache-2.0

vars:
  py-version: 3.13

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+.\d+)\.(\d+)$
    replace: $1-$2
    to: "fixed-ver"

environment:
  contents:
    packages:
      - py${{vars.py-version}}-build-base

pipeline:
  - uses: fetch
    with:
      uri: https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-${{vars.fixed-ver}}.tar.gz
      expected-sha512: 64637ac4166ec18d0744f651b21fae1ead152191e0c5eb34b8b477cc6a30b3d0a795f6d5bd69a4a035d910443d730af141b6a21018095172134571e137d518fc
      extract: true

  - uses: py/pip-build-install

  - uses: strip

update:
  enabled: true
  version-transform:
    - match: ^(.+)\-(\d+)$
      replace: $1.$2
  release-monitor:
    identifier: 359771

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        cfn-elect-cmd-leader --help
        cfn-get-metadata --help
        cfn-hup --help
        cfn-init --help
        cfn-send-cmd-event --help
        cfn-send-cmd-result --help
