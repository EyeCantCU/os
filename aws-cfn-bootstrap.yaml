package:
  name: aws-cfn-bootstrap
  version: "2.0.34"
  epoch: 1
  description: CloudFormation helper scripts
  dependencies:
    runtime:
      - py${{vars.py-version}}-setuptools
  copyright:
    - license: Apache-2.0

vars:
  py-version: 3.13

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+.\d+)\.(\d+)$
    replace: $1-$2
    to: "fixed-ver"

environment:
  contents:
    packages:
      - py${{vars.py-version}}-build-base

pipeline:
  - uses: fetch
    with:
      uri: https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-${{vars.fixed-ver}}.tar.gz
      expected-sha512: b9e638350c003b3913235c6c51cabb989cef739368d88cdbf2c7760fa3fe6e5facafddd3ff1da29f84bbe833a0f25e32f3d11359af3068bc7cc5e1545254a0bf
      extract: true

  - uses: py/pip-build-install

  - uses: strip

update:
  enabled: true
  version-transform:
    - match: ^(.+)\-(\d+)$
      replace: $1.$2
  release-monitor:
    identifier: 359771

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        cfn-elect-cmd-leader --help
        cfn-get-metadata --help
        cfn-hup --help
        cfn-init --help
        cfn-send-cmd-event --help
        cfn-send-cmd-result --help
