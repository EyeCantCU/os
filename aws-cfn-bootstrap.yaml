package:
  name: aws-cfn-bootstrap
  version: "2.0.36"
  epoch: 0
  description: CloudFormation helper scripts
  dependencies:
    runtime:
      - py${{vars.python-version}}-setuptools
  copyright:
    - license: Apache-2.0

vars:
  python-version: 3.13

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+.\d+)\.(\d+)$
    replace: $1-$2
    to: "fixed-ver"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: fetch
    with:
      uri: https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-${{vars.fixed-ver}}.tar.gz
      expected-sha512: e3cb0f0bc80b5b2d4487bf76c4e1400e7da3f0d56468bde094f4695f78e5695c3bb6888fc75fd2da4295b521a37bc86b1b46ef675146d82667fa8c52dbcc47e8
      extract: true

  - uses: py/pip-build-install

  - uses: strip

update:
  enabled: true
  version-transform:
    - match: ^(.+)\-(\d+)$
      replace: $1.$2
  release-monitor:
    identifier: 359771

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        cfn-elect-cmd-leader --help
        cfn-get-metadata --help
        cfn-hup --help
        cfn-init --help
        cfn-send-cmd-event --help
        cfn-send-cmd-result --help
