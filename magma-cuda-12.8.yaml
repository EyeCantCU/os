package:
  name: magma-cuda-12.8
  version: "2.9.0"
  epoch: 2
  description: Matrix Algebra on GPU and Multi-core Architectures (MAGMA) is a collection of next-generation linear algebra libraries for heterogeneous computing
  copyright:
    - license: BSD-3-Clause
  options:
    no-depends: true
  dependencies:
    runtime:
      - intel-oneapi-mkl-core
      - libgomp
      - nvidia-cuda-cudart-${{vars.cuda-version}}
      - nvidia-libcublas-${{vars.cuda-version}}
      - nvidia-libcusparse-${{vars.cuda-version}}
  resources:
    memory: 64Gi

vars:
  nvcc-gcc-version: 13
  py-version: 3.13 # pin to a known compatible version

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ct-manylinux-2.28-gcc-${{vars.nvcc-gcc-version}}
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - gcc-${{vars.nvcc-gcc-version}}
      - gcc-14-default # mimic ecosystems-wheel-rebuilder
      - gfortran
      - intel-oneapi-mkl-core-dev
      - libgomp
      - nvidia-cuda-profiler-api-${{vars.cuda-version}}
      - oldglibc-2.28 # mimic ecosystems-wheel-rebuilder
      - openblas-dev
      - perl
      - python-${{vars.py-version}} # build scripts use `python3`
  environment:
    CUDADIR: "/usr/local/cuda-${{vars.cuda-version}}"
    GPU_TARGET: "Volta Turing Ampere Hopper"
    MKLROOT: "/opt/intel/oneapi/mkl/latest"
    LIBRARY_PATH: "/opt/intel/oneapi/mkl/latest/lib"
    NVCC_APPEND_FLAGS: "-ccbin gcc-${{vars.nvcc-gcc-version}}"

pipeline:
  - if: ${{build.arch}} == 'x86_64'
    uses: git-checkout
    with:
      repository: https://github.com/icl-utk-edu/magma
      tag: v${{package.version}}
      expected-commit: 48a32d79517cc6f1522aa190cdec4b1d1babcf53

  - if: ${{build.arch}} == 'x86_64'
    runs: |
      # users are required to provide a make.inc. Currently, the example
      # mkl-gcc one works fine for us with some minor tweaks
      cp make.inc-examples/make.inc.mkl-gcc make.inc

  - if: ${{build.arch}} == 'x86_64'
    name: "oldglibc builds should statically link libstdc++"
    runs: |
      test -d /usr/lib/oldglibc || exit 0
      cp make.inc make.inc.orig
      sed -i 's/ -lstdc++//' make.inc
      # Make sure we actually changed something
      diff -u make.inc.orig make.inc && exit 1
      rm make.inc.orig

  - if: ${{build.arch}} == 'x86_64'
    runs: |
      export PATH="${PATH}:${CUDADIR}/bin"
      make -j$(nproc) lib shared
      make -j$(nproc) install prefix=/usr DESTDIR="${{targets.contextdir}}"

subpackages:
  - name: ${{package.name}}-dev
    description: MAGMA dev files
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        uses: split/dev
    test:
      pipeline:
        - if: ${{build.arch}} == 'x86_64'
          uses: test/tw/ldd-check
        - if: ${{build.arch}} == 'x86_64'
          uses: test/pkgconf

test:
  environment:
    contents:
      packages:
        - nvidia-cuda-cudart-${{vars.cuda-version}}
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: icl-utk-edu/magma
    strip-prefix: v
