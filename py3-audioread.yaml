package:
  name: py3-audioread
  version: 3.0.1
  epoch: 0
  description: cross-library audio decoding for Python
  copyright:
    - license: MIT

vars:
  pypi-package: audioread

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-flit-core

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/beetbox/audioread.git
      tag: v${{package.version}}
      expected-commit: 724b884c0083edb753a3d473164922d75d7d3beb

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
