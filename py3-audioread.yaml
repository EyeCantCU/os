package:
  name: py3-audioread
  version: 3.0.1
  epoch: 0
  description: cross-library audio decoding for Python
  copyright:
    - license: MIT

vars:
  pypi-package: audioread

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-flit-core

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/beetbox/audioread.git
      tag: v${{package.version}}
      expected-commit: 724b884c0083edb753a3d473164922d75d7d3beb

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-standard-aifc
        - py${{range.key}}-standard-sunau
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - ffmpeg
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            ffmpeg -f lavfi -i "sine=f=1000:d=2" output.wav

            python${{range.key}} <<'EOF' | grep -F -e "1 44100 2.0"
            import audioread

            with audioread.audio_open("output.wav") as f:
              print(f.channels, f.samplerate, f.duration)
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.pypi-package}}

update:
  enabled: true
  ignore-regex-patterns:
    - .*a\d*
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
