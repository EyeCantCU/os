package:
  name: bcc
  version: "0.35.0"
  epoch: 2
  description: A toolkit for creating efficient kernel tracing and manipulation programs
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libLLVM-16

vars:
  # 18 is unsuitable due to missing openmp-18
  # 17 is unsuitable due to https://github.com/llvm/llvm-project/issues/78691
  llvm-version: 16
  python-version: 3.13 # For scripts & tools

data:
  - name: py-versions # For bindings
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - clang-${{vars.llvm-version}}
      - clang-${{vars.llvm-version}}-extras
      - elfutils-dev
      - flex-dev
      - libbpf-dev
      - libxml2-dev
      - linux-headers
      - llvm-${{vars.llvm-version}}-dev
      - openmp-${{vars.llvm-version}}
      - openmp-${{vars.llvm-version}}-dev
      - py3-supported-build-base
      - py3-supported-setuptools
      - samurai
      - zip
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c31a1ca305f787ba53e001ead45ebf65233a32cf
      repository: https://github.com/iovisor/bcc
      tag: v${{package.version}}

  - runs: |
      # Hack around the fact that bcc doesn't really respect LLVM_ROOT
      # and cmake always finds llvm in /usr/include.
      for dir in /usr/lib/llvm-${{vars.llvm-version}}/include/*; do
        ln -s $dir /usr/include/$(basename $dir)
      done

  - uses: cmake/configure
    environment:
      KERNELHEADERS_DIR: "/usr"
    with:
      opts: |
        -DCMAKE_USE_LIBBPF_PACKAGE=ON \
        -DENABLE_LLVM_SHARED=1 \
        -DPYTHON_CMD=python${{vars.python-version}} \
        -DLLVM_ROOT=$(llvm-config --prefix) \

  - uses: cmake/build

  - uses: cmake/install

  - runs: |
      # Drop bindings from main package
      rm -rf ${{targets.destdir}}/usr/lib/python*
      # Fix manpage location for split pipeline
      mv ${{targets.destdir}}/usr/share/bcc/man ${{targets.destdir}}/usr/share/

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

  - range: py-versions
    name: py${{range.key}}-${{package.name}}
    description: python${{range.key}} bindings for ${{package.name}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - uses: cmake/configure
        with:
          opts: |
            -DPYTHON_CMD=python${{range.key}} \
      - working-directory: output/src/python/bcc-python${{range.key}}/
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{package.name}}

  - name: py3-supported-${{package.name}}
    description: meta package providing ${{package.name}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{package.name}}
        - py3.11-${{package.name}}
        - py3.12-${{package.name}}
        - py3.13-${{package.name}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{package.name}}

  - name: ${{package.name}}-tools
    dependencies:
      runtime:
        - audit
        - bash
        - py${{vars.python-version}}-pyelftools
        - py${{vars.python-version}}-${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share/bcc
          mv ${{targets.destdir}}/usr/share/bcc/tools ${{targets.subpkgdir}}/usr/share/bcc

          fix_python() {
            for f in $1/*; do
              if [ -d $f ]; then
                fix_python $f
              elif [ -f $f ]; then
                sed -i 's#/usr/bin/python#/usr/bin/python${{vars.python-version}}#' $f
                sed -i 's#/usr/bin/env python#/usr/bin/env python${{vars.python-version}}#' $f
              fi
            done
          }
          fix_python ${{targets.subpkgdir}}/usr/share/bcc/tools
    test:
      pipeline:
        - runs: |
            /usr/share/bcc/tools/perlstat --help >/dev/null
            /usr/share/bcc/tools/rdmaucma --help >/dev/null
            /usr/share/bcc/tools/memleak --help >/dev/null
            /usr/share/bcc/tools/pythonstat --help >/dev/null
            test -x /usr/share/bcc/tools/perlcalls # ausyscall fails in test environment
            /usr/share/bcc/tools/ext4dist --help >/dev/null
            /usr/share/bcc/tools/offwaketime --help >/dev/null
            /usr/share/bcc/tools/javagc --help >/dev/null
            /usr/share/bcc/tools/nodestat --help >/dev/null
            /usr/share/bcc/tools/filetop --help >/dev/null
            /usr/share/bcc/tools/biolatency --help >/dev/null
            /usr/share/bcc/tools/tcpretrans --help >/dev/null
            /usr/share/bcc/tools/biosnoop --help >/dev/null
            /usr/share/bcc/tools/drsnoop --help >/dev/null
            /usr/share/bcc/tools/pythongc --help >/dev/null
            /usr/share/bcc/tools/sslsniff --help >/dev/null
            /usr/share/bcc/tools/readahead --help >/dev/null
            /usr/share/bcc/tools/tcpsynbl --help >/dev/null
            /usr/share/bcc/tools/sofdsnoop --help >/dev/null
            /usr/share/bcc/tools/profile --help >/dev/null
            test -x /usr/share/bcc/tools/ppchcalls # ausyscall fails in test environment
            /usr/share/bcc/tools/gethostlatency --help >/dev/null
