package:
  name: fnm
  version: 1.38.1
  epoch: 6 # GHSA-rr8g-9fpq-6wmg
  description: Node.js version manager, built in Rust
  copyright:
    - license: GPL-3.0-only
  dependencies:
    runtime:
      # Required by any node version downloaded by this
      - libstdc++

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Schniz/fnm
      tag: v${{package.version}}
      expected-commit: ceee448c81556d4753ad869f5914938c97fbf2e8

  - uses: patch
    with:
      patches: GHSA-94vh-gphv-8pm8-GHSA-h97m-ww89-6jmq.patch

  - uses: rust/cargobump

  - uses: cargo/build
    with:
      output: fnm

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - bash
  pipeline:
    - name: Smoke tests
      runs: |
        set -o pipefail
        fnm --help | grep -F -e "A fast and simple Node.js manager"
        fnm --version | grep -F -e "${{package.version}}"
    - name: Ensure management functionality works
      runs: |
        NODE_VERSION="$(fnm list-remote | tail -n 1)"

        fnm list | grep -F -e "* system"
        fnm install "${NODE_VERSION}"
        echo "${NODE_VERSION}" | tee ".node-version"
        bash -c "
        set -xeuo pipefail
        eval $(fnm env --shell bash)
        fnm use
        node --help" | grep -F -e "Documentation can be found at https://nodejs.org/"
