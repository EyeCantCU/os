package:
  name: eks-distro-coredns-1.9
  version: 1.9.3
  epoch: 9
  description: CoreDNS is a DNS server that chains plugins
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - eks-distro-coredns=${{package.full-version}}

vars:
  eks-package-version: 1-25-eks-38

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go
      - libcap-utils

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-distro
      tag: v${{vars.eks-package-version}}
      expected-commit: eaa252c665ca550c2ef04b79436597955da6552f

  - runs: |
      export BINARY_PLATFORMS=$(go env GOOS)/$(go env GOARCH)
      export RELEASE_BRANCH=$(echo ${{vars.eks-package-version}} | grep -oE '[0-9]+-[0-9]+')
      export RELEASE_ENVIRONMENT=production

      make makes-binaries-coredns_coredns
      mkdir -p "${{targets.destdir}}"/usr/bin

  - uses: go/bump
    with:
      deps: golang.org/x/crypto@v0.17.0 golang.org/x/net@v0.23.0 google.golang.org/protobuf@v1.33.0
      modroot: projects/coredns/coredns/coredns/

  - working-directory: projects/coredns/coredns/coredns
    runs: |
      GIT_COMMIT=$(git rev-parse HEAD) && \
      go build -trimpath -a -ldflags "-s -w -buildid= -extldflags -static -X github.com/coredns/coredns/coremain.GitCommit=${GIT_COMMIT}" -o "${{targets.destdir}}"/usr/bin .

  - uses: strip

  # This MUST run after strip, which strips capabilities too!
  - runs: setcap cap_net_bind_service=+ep "${{targets.destdir}}/usr/bin/coredns"

update:
  manual: true # we need to manually update because melange bump doesn't yet handle pipeline mutations for var transforms
