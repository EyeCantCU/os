package:
  name: nss_wrapper
  version: 1.1.16
  epoch: 2
  description: Lightweight C++ command line option parser as a header only library
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.samba.org/nss_wrapper.git
      tag: nss_wrapper-${{package.version}}
      expected-commit: 2270a7cda76de28c554a7ed1167e49ce19a0fc2f

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 384541

test:
  environment:
    contents:
      packages:
        - gcc
  pipeline:
    - uses: test/tw/ldd-check
    - name: "Test nss_wrapper with getpwnam()"
      runs: |
        set -euo pipefail
        # Create a simple test program
        cat > test.c <<'EOF'
        #include <pwd.h>
        #include <stdio.h>
        int main(void) {
          struct passwd *pw = getpwnam("testuser");
          if (!pw) {
            fprintf(stderr, "getpwnam failed\n");
            return 1;
          }
          printf("Found user: %s (uid=%d, gid=%d)\n", pw->pw_name, pw->pw_uid, pw->pw_gid);
          return 0;
        }
        EOF
        # Compile the test program
        gcc -o test test.c
        # Create mock passwd and group files
        echo 'testuser:x:1000:1000:Test User:/home/testuser:/bin/sh' > passwd
        echo 'testgroup:x:1000:' > group
        # Set up nss_wrapper environment and run test
        export NSS_WRAPPER_PASSWD="$PWD/passwd"
        export NSS_WRAPPER_GROUP="$PWD/group"
        export LD_PRELOAD="/usr/lib/libnss_wrapper.so.0"
        # Run the test
        ./test
