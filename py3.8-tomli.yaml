#nolint:git-checkout-must-use-github-updates
package:
  name: py3.8-tomli
  version: 2.0.2
  epoch: 0
  description: "TOML parser"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.8

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3.8-pip
      - python-3.8
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hukkin/tomli.git
      tag: ${{package.version}}
      expected-commit: 3ec6775b118f2ae030d5b12c90939c7f65668e7e

  - runs: |
      python3.8 -m pip install --prefix=/usr --root="${{targets.contextdir}}" .

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        import: tomli

update:
  enabled: true
  release-monitor:
    identifier: 207408
