package:
  name: linkerd2-proxy-init
  version: 1.0.0
  epoch: 0
  description: linkerd2 packages used to set up the iptables rules to forward traffic into the Linkerd2 sidecar proxy
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ba0964997774216d9bcb5195d5e5804df3800e72
      repository: https://github.com/linkerd/linkerd2-proxy-init
      tag: v${{package.version}}

update:
  enabled: true
  github:
    identifier: linkerd/linkerd2-proxy-init
  version-transform:
    - match: '^cni-plugin v'
      replace: ''
    - match: '^proxy-init v'
      replace: ''
    - match: '^validator v'
      replace: ''
  ignore-regex-patterns:
    - ^release-test

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: version test
      runs: |
        linkerd2-proxy-init --version
