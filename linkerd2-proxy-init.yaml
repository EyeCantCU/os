package:
  name: linkerd2-proxy-init
  version: 2.4.3
  epoch: 0
  description: linkerd2 proxy-init package (linkerd/linkerd2-proxy-init)
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6f4267919c48096a2c741b3e06eda946d8966fe6
      repository: https://github.com/linkerd/linkerd2-proxy-init
      tag: proxy-init/v${{package.version}}

  - uses: go/build
    with:
      packages: ./proxy-init
      output: linkerd-proxy-init

update:
  enabled: true
  github:
    identifier: linkerd/linkerd2-proxy-init
    tag-filter: proxy-init
    strip-prefix: proxy-init v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: version test
      runs: |
        linkerd-proxy-init --help
