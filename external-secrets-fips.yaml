package:
  name: external-secrets-fips
  version: 0.9.20
  epoch: 0
  description: Integrate external secret management systems with Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/external-secrets/external-secrets
      tag: v${{package.version}}
      expected-commit: 4e444ce150303a190594ba21ad1991d60c62ed46

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      output: external-secrets

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: external-secrets/external-secrets
    strip-prefix: v
    tag-filter: v
