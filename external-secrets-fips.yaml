package:
  name: external-secrets-fips
  version: 0.9.18
  epoch: 1
  description: Integrate external secret management systems with Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/external-secrets/external-secrets
      tag: v${{package.version}}
      expected-commit: 90266e35d8f1dc518c1b9fa7a80eba34dc4c1d94

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      output: external-secrets

update:
  enabled: true
  github:
    identifier: external-secrets/external-secrets
    strip-prefix: v
    tag-filter: v
