package:
  name: external-secrets-fips
  version: 0.9.19
  epoch: 3
  description: Integrate external secret management systems with Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/external-secrets/external-secrets
      tag: v${{package.version}}
      expected-commit: 542f3a6a083dc3a368ffb22f7809a2fe1095bf91

  - uses: go/bump
    with:
      deps: github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      output: external-secrets

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: external-secrets/external-secrets
    strip-prefix: v
    tag-filter: v
