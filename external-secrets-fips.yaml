package:
  name: external-secrets-fips
  version: "0.15.1"
  epoch: 2
  description: Integrate external secret management systems with Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/external-secrets/external-secrets
      tag: v${{package.version}}
      expected-commit: 99a99393636db952fb5df0e9e23aff75fa86814b

  - name: Downgrade Go to 1.23 for FIPS
    runs: |
      # we are using go 1.23 because go-fips-1.24 is not available yet
      sed -i 's/go 1\.24\(\.[0-9]*\)\?/go 1.23/' go.mod
      go mod tidy

  - uses: go/bump
    with:
      deps: |-
        github.com/golang-jwt/jwt/v4@v4.5.2
        github.com/golang-jwt/jwt/v5@v5.2.2
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      go-package: go-fips-md5~1.23
      packages: .
      output: external-secrets

  - uses: strip

test:
  environment:
    contents:
      packages:
        - git
        - curl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/kwok/cluster
    - name: Fetch the testdata from the source repo
      runs: |
        git clone --depth=1 https://github.com/external-secrets/external-secrets
    - name: Run a simple test of the external secrets operator against the testdata
      working-directory: external-secrets/deploy/crds
      runs: |
        kubectl apply -f bundle.yaml

        # Start the operator
        external-secrets &
        sleep 5

        curl localhost:8080/metrics | grep secretstore

update:
  enabled: true
  github:
    identifier: external-secrets/external-secrets
    strip-prefix: v
    tag-filter: v
