package:
  name: external-secrets-fips
  version: 0.10.0
  epoch: 1
  description: Integrate external secret management systems with Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/external-secrets/external-secrets
      tag: v${{package.version}}
      expected-commit: eae808d8510ffe945dc1b3dfef3c76ac7f968198

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      output: external-secrets

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: external-secrets/external-secrets
    strip-prefix: v
    tag-filter: v
