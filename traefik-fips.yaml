package:
  name: traefik-fips
  version: 3.0.2
  epoch: 1
  description: The Cloud Native Application Proxy
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8ea339816ab2c8b60e1642d772d669548584db96
      repository: https://github.com/traefik/traefik
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0
      modroot: .

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/traefik
      output: traefik
      ldflags: |
        -X github.com/traefik/traefik/v3/pkg/version.Version=${{package.version}}
        -X github.com/traefik/traefik/v3/pkg/version.BuildDate=$(date -u '+%Y-%m-%d_%I:%M:%S%p')
        -X github.com/traefik/traefik/v3/pkg/version.Codename=$CODENAME
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: traefik/traefik
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
  pipeline:
    - runs: |
        set -o pipefail
        traefik version | grep ${{package.version}}
