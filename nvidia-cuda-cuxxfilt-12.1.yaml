package:
  name: nvidia-cuda-cuxxfilt-12.1
  version: 12.1.55
  epoch: 3
  description: CUDA cuxxfilt (demangler)
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-cuda-cuxxfilt=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cuxxfilt/linux-sbsa/cuda_cuxxfilt-linux-sbsa-12.1.55-archive.tar.xz"
          expected-sha256: "deffff51efc58cb0935312b956944c4860a51eabf9d86a9136f7039b2a6cf01a"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cuxxfilt/linux-x86_64/cuda_cuxxfilt-linux-x86_64-12.1.55-archive.tar.xz"
          expected-sha256: "9f92af653b35b9b8a521413ec51554ee6d4af4c6ac2a89f5611ca31d2f8b2c88"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.1/
      mv include ${{targets.destdir}}/usr/local/cuda-12.1/
      mv lib ${{targets.destdir}}/usr/local/cuda-12.1/lib64
      mv bin ${{targets.destdir}}/usr/local/cuda-12.1/
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.1/${{package.name}}.LICENSE

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - nvidia-cuda-cuxxfilt-12.1

update:
  enabled: false
