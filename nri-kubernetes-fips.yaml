package:
  name: nri-kubernetes-fips
  version: "3.47.0"
  epoch: 0
  description: New Relic integration for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bind-tools
      - curl
      - dash-binsh
      - tini

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-kubernetes
      tag: v${{package.version}}
      expected-commit: f853380ee51b032935f78b2bbabaa83b1f282fda

  - uses: go/build
    with:
      packages: ./cmd/nri-kubernetes
      output: nri-kubernetes
      ldflags: |
        -X main.integrationVersion="${{package.version}}"
        -X main.gitCommit="$(git rev-parse HEAD)"
        -X main.buildDate="$(date -d@$SOURCE_DATE_EPOCH +%Y%m%d-%H:%M:%S)"
      go-package: go-fips

test:
  environment:
    contents:
      packages:
        - curl
        - python3
        - wait-for-it
    environment:
      AGENT_PORT: "8001"
  pipeline:
    - uses: test/go-fips-check
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - uses: test/daemon-check-output
      with:
        setup: |
          set -o pipefail

          python3 mock_agent.py > /tmp/agent.log 2>&1 &
          AGENT_PID=$!
          echo "${AGENT_PID}" > /tmp/agent.pid

          # Wait for mock agent to be ready₹
          wait-for-it "localhost:${AGENT_PORT}" -t 30

          curl -sf "http://localhost:${AGENT_PORT}/" | grep -F "ready"

          mkdir -p /etc/newrelic-infra
          cp test-configs/nri-kubernetes-config.yml /etc/newrelic-infra/nri-kubernetes.yml
        start: nri-kubernetes
        timeout: 30
        expected_output: |
          New Relic Kubernetes integration Version
          collecting in cluster config
          using local kube config
        post: |
          set -o pipefail

          # Kill the mock agent
          kill -9 "$(cat /tmp/agent.pid)" 2>/dev/null || true
          grep -F "Mock agent listening" /tmp/agent.log

update:
  enabled: true
  github:
    identifier: newrelic/nri-kubernetes
    strip-prefix: v
    tag-filter: v
    use-tag: true
  ignore-regex-patterns:
    - 'newrelic-infrastructure-'
    - 'e2e-resources-'
