package:
  name: nemo
  version: 2.2.0
  epoch: 0
  description: A scalable generative AI framework built for researchers and developers working on Large Language Models, Multimodal, and Speech AI
  copyright:
    - license: Apache-2.0
  target-architecture:
    - x86_64
  options:
    no-depends: true
  dependencies:
    runtime:
      - python-3.11-base

vars:
  cuda-version: '12.6'
  cudnn-version: '9'
  py-version: '3.11'
  cuda-major-version: '12'

environment:
  environment:
    CAUSAL_CONV_TAG: 'v1.2.2.post1'
    NEMO_RUN_TAG: "34259bd3e752fef94045a9a019e4aaf62bd11ce2"
    TE_TAG: "7d576ed25266a17a7b651f2c12e8498f67e0baea"
    MODELOPT_VERSION: "0.19.0"
    MCORE_TAG: "core_r0.10.0"
    APEX_TAG: "810ffae374a2b9cb4b5c5e28eaeca7d7998fca0c"
    PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/cuda-${{vars.cuda-version}}/bin:/usr/local/cudnn-${{vars.cudnn-version}}/bin
    LD_LIBRARY_PATH: /usr/local/cuda-${{vars.cuda-version}}/lib64:/usr/local/cudnn-9/lib64
    CUDNN_INCLUDE_DIR: /usr/local/cudnn-${{vars.cudnn-version}}/include/
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
    CUDNN_HOME: /usr/local/cudnn-${{vars.cudnn-version}}
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - ffmpeg-cuda-dev
      - freetype-dev
      - gcc-12-default
      - go
      - libsndfile-dev
      - openmp-17
      - py${{vars.py-version}}-cython
      - py${{vars.py-version}}-hatchling
      - py${{vars.py-version}}-installer
      - py${{vars.py-version}}-packaging
      - py${{vars.py-version}}-pip
      - py${{vars.py-version}}-setuptools
      - py${{vars.py-version}}-setuptools-scm
      - py${{vars.py-version}}-typing-extensions
      - py${{vars.py-version}}-wheel
      - python-${{vars.py-version}}
      - python-${{vars.py-version}}-dev
      - rust
      - rustup
      - samurai
      - swig
      - uv
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - nvidia-nccl-cuda-${{vars.cuda-version}}
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - ninja-build
      - nvidia-cuda-cupti-${{vars.cuda-version}}-dev
      - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}-dev

pipeline:
  - working-directory: /home/build/nemo.git
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/NVIDIA/NeMo.git
          tag: v${{package.version}}
          expected-commit: 7192a2c944c48ab253f3f711ee52fe2dc986a3bb
      - runs: git submodule update --init --recursive

  - runs: |
      export PATH="$PATH:/usr/local/cuda-${{vars.cuda-version}}/bin"

      # Setup the virtualenv
      mkdir -p /usr/share/nemo
      cd /usr/share/nemo
      uv venv .venv --system-site-packages
      source .venv/bin/activate

      uv pip install --upgrade pybind11
      uv pip install "numpy>=1.26.4,<2.0.0"
      uv pip install torch torchvision

  - runs: |
      # within venv
      source /usr/share/nemo/.venv/bin/activate
      git clone --depth 1 --branch ${CAUSAL_CONV_TAG} https://github.com/Dao-AILab/causal-conv1d
      cd causal-conv1d
      uv pip install --no-build-isolation .
      cd ..

      uv pip install hatchling
      uv pip install nemo_run@git+https://github.com/NVIDIA/NeMo-Run.git@${NEMO_RUN_TAG}
      uv pip install --no-cache-dir --no-build-isolation --extra-index-url https://pypi.nvidia.com transformer-engine
      uv pip install --no-cache-dir --no-build-isolation --extra-index-url https://pypi.nvidia.com megatron_core@git+https://github.com/NVIDIA/Megatron-LM.git@${MCORE_TAG}
      uv pip install --no-build-isolation --extra-index-url https://pypi.nvidia.com nvidia-modelopt[torch]~=${MODELOPT_VERSION}
      uv pip install --no-build-isolation --extra-index-url https://pypi.nvidia.com apex@git+https://github.com/NVIDIA/apex.git@${APEX_TAG}
      uv pip install --no-build-isolation --extra-index-url https://pypi.nvidia.com  unstructured==0.14.9
      uv pip install --no-build-isolation --extra-index-url https://pypi.nvidia.com llama-index==0.10.43
      uv pip install --no-build-isolation --extra-index-url https://pypi.nvidia.com onnxscript@git+https://github.com/microsoft/onnxscript

      cd nemo.git
      uv pip install --no-build-isolation --extra-index-url https://pypi.nvidia.com num2words
      uv pip install  --extra-index-url https://pypi.nvidia.com pip setuptools wheel
      uv pip install  --extra-index-url https://pypi.nvidia.com numpy pybind11
      pip install "numpy<1.24"
      pip install --no-build-isolation --extra-index-url https://pypi.nvidia.com ctc_segmentation==1.7.1
      uv pip install --no-build-isolation --extra-index-url https://pypi.nvidia.com ".[all]"

  - working-directory: /home/build/megatron-lm
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/NVIDIA/Megatron-LM.git
      - runs: |
          git checkout ${MCORE_TAG}
          cd megatron/core/datasets
          export CXXFLAGS="${CXXFLAGS} -Wno-maybe-uninitialized"
          make

  - runs: |
      source /usr/share/nemo/.venv/bin/activate

      uv pip install --no-cache-dir nvidia-resiliency-ext

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/nemo
      mv .venv ${{targets.destdir}}/usr/share/nemo
      rm -rf ${{targets.destdir}}/usr/share/nemo/.venv/bin/__pycache*
      # allow site-packages
      sed -i "s|include-system-site-packages = false|include-system-site-packages = true|g" ${{targets.destdir}}/usr/share/nemo/.venv/pyvenv.cfg

update:
  enabled: true
  github:
    identifier: NVIDIA/NeMo
    tag-filter: v
    strip-prefix: v

test:
  pipeline:
    - runs: |
        export PATH=/usr/share/nemo/.venv/bin:$PATH
        TEST_SCRIPT=nemo_quickstart.py
