package:
  name: nemo
  version: 1.23.0
  epoch: 12
  description: conversational AI toolkit built for researchers working on ASR, TTS, LLMs, and NLP.
  copyright:
    - license: Apache-2.0
  target-architecture:
    - x86_64
  options:
    no-depends: true
  dependencies:
    runtime:
      - alsa-lib-dev
      - bash
      - busybox
      - ffmpeg-cuda-dev
      - libgomp
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - nvidia-cuda-cudart-${{vars.cuda-version}}
      - nvidia-cuda-nvcc-${{vars.cuda-version}}
      - nvidia-cuda-nvml-dev-${{vars.cuda-version}}
      - nvidia-cuda-nvrtc-${{vars.cuda-version}}
      - nvidia-cuda-nvtx-${{vars.cuda-version}}
      - nvidia-cuda-profiler-api-${{vars.cuda-version}}
      - nvidia-cudnn-${{vars.cudnn-version}}-cuda-12
      - nvidia-libcublas-${{vars.cuda-version}}
      - nvidia-libcufft-${{vars.cuda-version}}
      - nvidia-libcurand-${{vars.cuda-version}}
      - nvidia-libcusolver-${{vars.cuda-version}}
      - nvidia-libcusparse-${{vars.cuda-version}}
      - nvidia-libnvjitlink-${{vars.cuda-version}}
      - nvidia-nccl-cuda-${{vars.cuda-version}}
      - openmp-17
      - py${{vars.py-version}}-cython
      - py${{vars.py-version}}-packaging
      - py${{vars.py-version}}-typing-extensions
      - torchvision-cuda12

vars:
  cuda-version: '12.3'
  cudnn-version: '8'
  py-version: '3.11'

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - ffmpeg-cuda-dev
      - freetype-dev
      - gcc-12-default
      - go
      - libsndfile-dev
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - nvidia-cuda-cudart-${{vars.cuda-version}}
      - nvidia-cuda-nvcc-${{vars.cuda-version}}
      - nvidia-cuda-nvml-dev-${{vars.cuda-version}}
      - nvidia-cuda-nvrtc-${{vars.cuda-version}}
      - nvidia-cuda-nvtx-${{vars.cuda-version}}
      - nvidia-cuda-profiler-api-${{vars.cuda-version}}
      - nvidia-cudnn-${{vars.cudnn-version}}
      - nvidia-cudnn-${{vars.cudnn-version}}-cuda-12-dev
      # Cuda
      - nvidia-driver
      - nvidia-libcublas-${{vars.cuda-version}}
      - nvidia-libcufft-${{vars.cuda-version}}
      - nvidia-libcurand-${{vars.cuda-version}}
      - nvidia-libcusolver-${{vars.cuda-version}}
      - nvidia-libcusparse-${{vars.cuda-version}}
      - nvidia-libnvjitlink-${{vars.cuda-version}}
      - openmp-17
      - py${{vars.py-version}}-cython
      - py${{vars.py-version}}-hatchling
      - py${{vars.py-version}}-installer
      - py${{vars.py-version}}-packaging
      - py${{vars.py-version}}-pip
      - py${{vars.py-version}}-pytorch-cuda-${{vars.cuda-version}}
      - py${{vars.py-version}}-setuptools
      - py${{vars.py-version}}-setuptools-scm
      - py${{vars.py-version}}-typing-extensions
      - py${{vars.py-version}}-wheel
      - py${{vars.py-version}}-wheels-torch-cuda-${{vars.cuda-version}}
      - py${{vars.py-version}}-wheels-torchvision-cuda-${{vars.cuda-version}}
      - python-${{vars.py-version}}
      - python-${{vars.py-version}}-dev
      - rust
      - rustup
      - samurai
      - swig
      - uv

pipeline:
  - working-directory: /home/build/nemo.git
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/NVIDIA/NeMo.git
          tag: v${{package.version}}
          expected-commit: d2283e3620cd7f99dbe29fdf079757ab9f6cdf01
      - uses: patch
        with:
          patches: /home/build/transformers-cve-fix.patch
      - runs: git submodule update --init --recursive

  - runs: |
      # Setup the virtualenv
      uv venv .venv --system-site-packages
      source .venv/bin/activate

      export PATH="$PATH:/usr/local/cuda-${{vars.cuda-version}}/bin"

      # Install torch and torchvision from wheel apks
      # TODO(pnasrat): Install fewer of nemo's dependencies from pypi
      uv pip install --upgrade pybind11
      uv pip install "numpy>=1.26.4,<2.0.0"
      uv pip install -f /usr/share/wheels torch torchvision

  - working-directory: /home/build/megatron-lm
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/NVIDIA/Megatron-LM.git
      - runs: |
          git fetch origin 27cbe46714a50c43ed290f1b1472db8d2780c55c
          git checkout FETCH_HEAD
          source /home/build/.venv/bin/activate
          export PATH="$PATH:/usr/local/cuda-${{vars.cuda-version}}/bin"
          uv pip install --no-build-isolation .

  - working-directory: /home/build/fastText
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/facebookresearch/fastText
          tag: v0.9.2
          expected-commit: 5b5943c118b0ec5fb9cd8d20587de2b2d3966dfe
      - uses: patch
        with:
          patches: /home/build/fastText-compile-gcc-13.patch
      - runs: |
          source /home/build/.venv/bin/activate
          uv pip install --no-build-isolation .

  - working-directory: /home/build/wandb
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/wandb/wandb.git
          tag: v0.19.8
          expected-commit: 637bddf198525810add5804059001b1b319d6ad1
      - runs: |
          export SOURCE_DATE_EPOCH=315532800
          source /home/build/.venv/bin/activate
          uv pip install pip
          ../.venv/bin/pip wheel -w dist --no-deps .
          ../.venv/bin/pip install dist/*.whl

  - working-directory: /home/build/nemo.git
    pipeline:
      - runs: |
          export PATH="$PATH:/usr/local/cuda-${{vars.cuda-version}}/bin"

          export CUDA_HOME="/usr/local/cuda-${{vars.cuda-version}}"
          source /home/build/.venv/bin/activate

          uv pip install -f /usr/share/wheels torch torchvision
          uv pip install --no-build-isolation flash-attn numba>=0.57.1
          uv pip install --no-build-isolation "."
          for extra in core asr nlp tts multimodal; do
            uv pip install --no-build-isolation ".[${extra}]"
          done
          # https://github.com/NVIDIA/NeMo/issues/9318
          uv pip install transformers==4.48.3
          # https://github.com/NVIDIA/NeMo/issues/9793
          uv pip install  huggingface_hub==0.22.0

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/nemo
      mv .venv ${{targets.destdir}}/usr/share/nemo
      # sed command causes errors trying to edit .pyc files in pycache
      rm -rf ${{targets.destdir}}/usr/share/nemo/.venv/bin/__pycache*
      sed -i "s|/home/build|/usr/share/nemo|g" ${{targets.destdir}}/usr/share/nemo/.venv/bin/*
      # allow site-packages
      sed -i "s|include-system-site-packages = false|include-system-site-packages = true|g" ${{targets.destdir}}/usr/share/nemo/.venv/pyvenv.cfg

update:
  enabled: true
  github:
    identifier: NVIDIA/NeMo
    tag-filter: v
    strip-prefix: v

test:
  pipeline:
    - runs: |
        export PATH=/usr/share/nemo/.venv/bin:$PATH
        TEST_SCRIPT=nemo_quickstart.py
