package:
  name: nemo
  version: 1.23.0
  epoch: 5
  description: conversational AI toolkit built for researchers working on ASR, TTS, LLMs, and NLP.
  copyright:
    - license: Apache-2.0
  target-architecture:
    - x86_64
  options:
    no-depends: true
  dependencies:
    runtime:
      - libgomp
      - ffmpeg-dev
      - alsa-lib-dev
      - openmp-17
      - py3.11-cython
      - py3.11-packaging
      - py3.11-typing-extensions
      - nvidia-libcusparse-12.3
      - nvidia-nccl-cuda-12.3
      - nvidia-cuda-cccl-12.3
      - nvidia-cuda-cudart-12.3
      - nvidia-cuda-nvcc-12.3
      - nvidia-cuda-nvml-dev-12.3
      - nvidia-cuda-nvrtc-12.3
      - nvidia-cuda-nvtx-12.3
      - nvidia-cuda-profiler-api-12.3
      - nvidia-libcublas-12.3
      - nvidia-libcufft-12.3
      - nvidia-libcurand-12.3
      - nvidia-libcusolver-12.3
      - nvidia-libcusparse-12.3
      - nvidia-libnvjitlink-12.3
      - nvidia-cudnn-8-cuda-12

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - ffmpeg-dev
      - go-1.23
      - libsndfile-dev
      - libavdevice60
      - freetype-dev
      - gcc-12-default
      - swig
      - openmp-17
      - py3.11-cython
      - py3.11-hatchling
      - py3.11-installer
      - py3.11-pip
      - py3.11-packaging
      - py3.11-setuptools
      - py3.11-setuptools-scm
      - py3.11-typing-extensions
      - py3.11-wheel
      - python-3.11
      - python-3.11-dev
      - rust
      - rustup
      - samurai
      - uv
      # Cuda
      - nvidia-driver
      - nvidia-libcusparse-12.3
      - nvidia-cuda-cccl-12.3
      - nvidia-cuda-cudart-12.3
      - nvidia-cuda-nvcc-12.3
      - nvidia-cuda-nvml-dev-12.3
      - nvidia-cuda-nvrtc-12.3
      - nvidia-cuda-nvtx-12.3
      - nvidia-cuda-profiler-api-12.3
      - nvidia-libcublas-12.3
      - nvidia-libcufft-12.3
      - nvidia-libcurand-12.3
      - nvidia-libcusolver-12.3
      - nvidia-libcusparse-12.3
      - nvidia-libnvjitlink-12.3
      - nvidia-cudnn-8
      - nvidia-cudnn-8-cuda-12-dev
      - py3.11-pytorch-cuda-12.3
      - py3.11-wheels-torch-cuda-12.3
      - py3.11-wheels-torchvision-cuda-12.3

pipeline:
  - uses: git-checkout
    working-directory: /home/build/nemo.git
    with:
      repository: https://github.com/NVIDIA/NeMo.git
      tag: v${{package.version}}
      expected-commit: d2283e3620cd7f99dbe29fdf079757ab9f6cdf01
    pipeline:
      - runs: git submodule update --init --recursive

  - runs: |
      # Setup the virtualenv
      uv venv .venv --system-site-packages
      source .venv/bin/activate

      export PATH="$PATH:/usr/local/cuda-12.3/bin"

      # Install torch and torchvision from wheel apks
      # TODO(pnasrat): Install fewer of nemo's dependencies from pypi
      uv pip install --upgrade pybind11
      uv pip install numpy==1.26.4 scipy==1.12.0  scikit-learn==1.5.* nltk==3.8.2
      uv pip install -f /usr/share/wheels torch torchvision

  - working-directory: /home/build/megatron-lm
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/NVIDIA/Megatron-LM.git
      - runs: |
          git fetch origin 27cbe46714a50c43ed290f1b1472db8d2780c55c
          git checkout FETCH_HEAD
          source /home/build/.venv/bin/activate
          export PATH="$PATH:/usr/local/cuda-12.3/bin"
          uv pip install --no-build-isolation .

  - working-directory: /home/build/fastText
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/facebookresearch/fastText
          tag: v0.9.2
          expected-commit: 5b5943c118b0ec5fb9cd8d20587de2b2d3966dfe
      - uses: patch
        with:
          patches: /home/build/fastText-compile-gcc-13.patch
      - runs: |
          source /home/build/.venv/bin/activate
          uv pip install --no-build-isolation .

  - working-directory: /home/build/wandb
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/wandb/wandb.git
          tag: v0.19.1
          expected-commit: 4ffe3172050f32ae46d6476f00554d1d0349735e
      - runs: |
          export SOURCE_DATE_EPOCH=315532800
          source /home/build/.venv/bin/activate
          uv pip install pip
          ../.venv/bin/pip wheel -w dist --no-deps .
          ../.venv/bin/pip install dist/*.whl

  - working-directory: /home/build/nemo.git
    pipeline:
      - runs: |
          export PATH="$PATH:/usr/local/cuda-12.3/bin"

          export CUDA_HOME="/usr/local/cuda-12.3"
          source /home/build/.venv/bin/activate

          uv pip install -f /usr/share/wheels torch torchvision
          uv pip install --no-build-isolation flash-attn numba>=0.57.1
          uv pip install --no-build-isolation "."
          for extra in core asr nlp tts multimodal; do
            uv pip install --no-build-isolation ".[${extra}]"
          done
          # https://github.com/NVIDIA/NeMo/issues/9318
          uv pip install transformers==4.40.2
          # https://github.com/NVIDIA/NeMo/issues/9793
          uv pip install  huggingface_hub==0.22.0

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/nemo
      mv .venv ${{targets.destdir}}/usr/share/nemo
      # sed command causes errors trying to edit .pyc files in pycache
      rm -rf ${{targets.destdir}}/usr/share/nemo/.venv/bin/__pycache*
      sed -i "s|/home/build|/usr/share/nemo|g" ${{targets.destdir}}/usr/share/nemo/.venv/bin/*
      # allow site-packages
      sed -i "s|include-system-site-packages = false|include-system-site-packages = true|g" ${{targets.destdir}}/usr/share/nemo/.venv/pyvenv.cfg

update:
  enabled: true
  github:
    identifier: NVIDIA/NeMo
    tag-filter: v
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - libgomp
        - openmp-17
        - ffmpeg-dev
        - alsa-lib-dev
  pipeline:
    - runs: |
        export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:/usr/local/cuda-12.1/lib:/usr/local/cudann-8.9"
        export PATH=/usr/share/nemo/.venv/bin:$PATH
        TEST_SCRIPT=nemo_quickstart.py
        if ! python $TEST_SCRIPT > output.out 2>&1; then
            echo "Failed to run '$TEST_SCRIPT'."
            cat output.out
            exit 1
        else
            echo "Script tested successfully."
            exit 0
        fi
