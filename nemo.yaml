package:
  name: nemo
  version: 1.23.0
  epoch: 1
  description: conversational AI toolkit built for researchers working on ASR, TTS, LLMs, and NLP.
  copyright:
    - license: Apache-2.0
  target-architecture:
    - x86_64
  options:
    no-depends: true
  dependencies:
    runtime:
      - libgomp
      - torchvision-cuda12
      - ffmpeg-dev
      - alsa-lib-dev
      - isl
      - mpc
      - py3.11-cython
      - py3.11-numpy
      - py3.11-packaging

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - ffmpeg-dev
      - go-1.22
      - isl-dev
      - libsndfile-dev
      - libavdevice60
      - mpc-dev
      - freetype-dev
      - gcc-12-default
      - swig
      - py3.11-cython
      - py3.11-installer
      - py3.11-numpy
      - py3.11-pip
      - py3.11-packaging
      - py3.11-setuptools
      - python-3.11
      - python-3.11-dev
      - samurai
      # Cuda
      - nvidia-driver
      - nvidia-libcusparse-12
      - nvidia-cuda-cccl-12
      - nvidia-cuda-cudart-12
      - nvidia-cuda-nvcc-12
      - nvidia-cuda-nvml-dev-12
      - nvidia-cuda-nvrtc-12
      - nvidia-cuda-nvtx-12
      - nvidia-cuda-profiler-api-12
      - nvidia-libcublas-12
      - nvidia-libcufft-12
      - nvidia-libcurand-12
      - nvidia-libcusolver-12
      - nvidia-libcusparse-12
      - nvidia-libnvjitlink-12
      - nvidia-cudnn-8
      - nvidia-cudnn-8-cuda-12
      - torchvision-cuda12

pipeline:
  - uses: git-checkout
    working-directory: /home/build/nemo.git
    with:
      repository: https://github.com/NVIDIA/NeMo.git
      tag: v${{package.version}}
      expected-commit: d2283e3620cd7f99dbe29fdf079757ab9f6cdf01
    pipeline:
      - runs: git submodule update --init --recursive

  - runs: |
      # Setup the virtualenv
      python -m venv .venv --system-site-packages

      export PATH="$PATH:/usr/local/cuda-12.3/bin"

      # this venv needs to extend torchvision venv so that packages in it see torch and torchvision installed.
      # https://stackoverflow.com/questions/39409380
      pkdir=/usr/share/torchvision/.venv/lib/python3.11/site-packages
      echo "$pkdir" > /home/build/.venv/lib/python3.11/site-packages/pytorch.pth

      .venv/bin/pip install --upgrade wheel pip setuptools==65.5.1
      .venv/bin/pip install Cython

  - working-directory: /home/build/megatron-lm
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/NVIDIA/Megatron-LM.git
      - runs: |
          git fetch origin 27cbe46714a50c43ed290f1b1472db8d2780c55c
          git checkout FETCH_HEAD
          ../.venv/bin/pip install .

          export PATH="$PATH:/usr/local/cuda-12.3/bin"

          pkdir=/usr/share/torchvision/.venv/lib/python3.11/site-packages
          echo "$pkdir" > /home/build/.venv/lib/python3.11/site-packages/pytorch.pth

          ../.venv/bin/pip install --upgrade wheel pip==23.3.2 setuptools==65.5.1
          ../.venv/bin/pip install Cython
          ../.venv/bin/pip install .

  - working-directory: /home/build/fastText
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/facebookresearch/fastText
          tag: v0.9.2
          expected-commit: 5b5943c118b0ec5fb9cd8d20587de2b2d3966dfe
      - uses: patch
        with:
          patches: /home/build/fastText-compile-gcc-13.patch
      - runs: |
          /home/build/.venv/bin/pip install .

  - working-directory: /home/build/wandb
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/wandb/wandb.git
          tag: v0.17.4
          expected-commit: e574b95cd99788081777b8fe6884d7c23b55cbf8
      - runs: |
          ../.venv/bin/pip wheel -w dist --no-deps .
          ../.venv/bin/pip install dist/*.whl

  - working-directory: /home/build/nemo.git
    pipeline:
      - runs: |
          export PATH="$PATH:/usr/local/cuda-12.3/bin"

          pkdir=/usr/share/torchvision/.venv/lib/python3.11/site-packages
          echo "$pkdir" > /home/build/.venv/lib/python3.11/site-packages/pytorch.pth

          export CUDA_HOME="/usr/local/cuda-12.3"

          ../.venv/bin/pip install flash-attn
          ../.venv/bin/pip install numba>=0.57.1
          ../.venv/bin/pip install "."
          for extra in core asr nlp tts multimodal audio; do
          ../.venv/bin/pip install ".[${extra}]"
          done
          # https://github.com/NVIDIA/NeMo/issues/9318
          ../.venv/bin/pip install transformers==4.40.2

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/nemo
      mv .venv ${{targets.destdir}}/usr/share/nemo
      # sed command causes errors trying to edit .pyc files in pycache
      rm -rf ${{targets.destdir}}/usr/share/nemo/.venv/bin/__pycache*
      sed -i "s|/home/build|/usr/share/nemo|g" ${{targets.destdir}}/usr/share/nemo/.venv/bin/*
      # allow site-packages
      sed -i "s|include-system-site-packages = false|include-system-site-packages = true|g" ${{targets.destdir}}/usr/share/nemo/.venv/pyvenv.cfg

update:
  enabled: true
  github:
    identifier: NVIDIA/NeMo
    tag-filter: v
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - wolfi-base
        - libgomp
        - torchvision-cuda12
        - ffmpeg-dev
        - alsa-lib-dev
  pipeline:
    - runs: |
        export PATH=/usr/share/nemo/.venv/bin:$PATH
        TEST_SCRIPT=nemo_quickstart.py
        if ! python $TEST_SCRIPT > output.out 2>&1; then
            echo "Failed to run '$TEST_SCRIPT'."
            cat output.out
            exit 1
        else
            echo "Script tested successfully."
            exit 0
        fi
