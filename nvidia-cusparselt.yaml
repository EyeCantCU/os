package:
  name: nvidia-cusparselt
  version: 0.5.2
  epoch: 1
  description: A High-Performance CUDA Library for Sparse Matrix-Matrix Multiplication
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cusparselt/redist/libcusparse_lt/linux-sbsa/libcusparse_lt-linux-sbsa-0.5.2.1-archive.tar.xz"
          expected-sha256: "389167df60404fe9d49f5975239bd095c440328d951152082d8603f8bdac1a97"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cusparselt/redist/libcusparse_lt/linux-x86_64/libcusparse_lt-linux-x86_64-0.5.2.1-archive.tar.xz"
          expected-sha256: "d6cd9ffc0838d2e25453358ca160c1bed34e2f7b5dc155c428d22ba7fc3d8334"
          timeout: 30

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cusparselt
      mv include ${{targets.destdir}}/usr/local/cusparselt/
      mv lib ${{targets.destdir}}/usr/local/cusparselt/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cusparselt/${{package.name}}.LICENSE

subpackages:
  - name: nvidia-cusparselt-cuda-12
    description: configures cusparselt with cuda-12
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/cuda-12/lib64
          mkdir -p ${{targets.subpkgdir}}/usr/local/cuda-12/include
          for f in ${{targets.destdir}}/usr/local/cusparselt/lib64/*; do
            ln -sf /usr/local/cusparselt/lib64/$(basename $f) ${{targets.subpkgdir}}/usr/local/cuda-12/lib64/$(basename $f)
          done
          for f in ${{targets.destdir}}/usr/local/cusparselt/include/*; do
            ln -sf /usr/local/cusparselt/include/$(basename $f) ${{targets.subpkgdir}}/usr/local/cuda-12/include/$(basename $f)
          done

update:
  enabled: false
