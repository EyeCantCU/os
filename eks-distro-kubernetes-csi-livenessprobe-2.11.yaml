package:
  name: eks-distro-kubernetes-csi-livenessprobe-2.11
  version: 2.11.0 # eks-distro v1-23-eks-33: https://github.com/aws/eks-distro/releases/tag/v1-23-eks-33
  epoch: 7
  description: A sidecar container that can be included in a CSI plugin pod to enable integration with Kubernetes Liveness Probe.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - eks-distro-kubernetes-csi-livenessprobe=${{package.full-version}}

vars:
  eks-project: kubernetes-csi/livenessprobe
  eks-package-version: 1-23-eks-33

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-distro
      tag: v${{vars.eks-package-version}}
      expected-commit: a200cc89c4a4b8579602fad959065f51baf714d3

  - uses: eks-distro/build
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      # Mitigate CVE-2023-3978, CVE-2023-39325 / CVE-2023-44487 (grpc)
      deps: golang.org/x/net@v0.23.0 google.golang.org/grpc@v1.56.3 google.golang.org/protobuf@v1.33.0 github.com/golang/protobuf@v1.5.4

  - uses: eks-distro/install
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      binary-target: livenessprobe

  - uses: strip

update:
  manual: true
