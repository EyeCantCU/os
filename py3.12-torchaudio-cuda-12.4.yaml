package:
  name: py3.12-torchaudio-cuda-12.4
  version: 2.6.0
  epoch: 0
  description: Data manipulation and transformation for audio signal processing, powered by PyTorch
  copyright:
    - license: BSD-2-Clause
  target-architecture:
    - x86_64
  resources:
    cpu: 16
    memory: 16Gi
  options:
    no-depends: true
  dependencies:
    runtime:
      - cuda-toolkit-${{vars.cuda-version}}
      # For some reason this isn't detected
      - libgomp
      - libjpeg-turbo
      - libpng
      - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}
      - nvidia-nccl-cuda-${{vars.cuda-version}}
      - openmp-17-dev
      - py${{vars.py-version}}-numpy
      - py${{vars.py-version}}-pillow
      - py${{vars.py-version}}-pyyaml
      - py${{vars.py-version}}-torch-${{vars.torch-version}}-cuda-${{vars.cuda-version}}
      - py${{vars.py-version}}-typing-extensions

vars:
  cudnn-version: 8
  gcc-version: 12
  torch-version: 2.6

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.\d+$'
    replace: '$1'
    to: cuda-major-version
  - from: ${{package.name}}
    match: '^py(\d+\.\d+)-.*'
    replace: '$1'
    to: py-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-15
      - clang-15-default
      - clang-15-dev
      - cmake
      - coreutils
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - gcc-${{vars.gcc-version}}-default
      - git
      - libffi-dev
      - libgomp
      - libjpeg-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libpng-utils
      - llvm-lld-15
      - llvm15
      - llvm15-dev
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - nvidia-cuda-profiler-api-${{vars.cuda-version}}
      - nvidia-driver
      - nvidia-nccl-cuda-${{vars.cuda-version}}-dev
      - openmp-17-dev
      - patchelf
      - posix-libc-utils
      - py${{vars.py-version}}-installer
      - py${{vars.py-version}}-numpy
      - py${{vars.py-version}}-pip
      - py${{vars.py-version}}-setuptools
      - py${{vars.py-version}}-torch-${{vars.torch-version}}-cuda-${{vars.cuda-version}}
      - py${{vars.py-version}}-wheel
      - python-${{vars.py-version}}
      - python-${{vars.py-version}}-dev
      - samurai
  environment:
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
    LIBRARY_PATH: /usr/local/cuda-${{vars.cuda-version}}/lib64/stubs
    PATH: "$PATH:/usr/local/cuda-12.4/bin"
    MAX_JOBS: 16
    USE_CUDA: 1
    FORCE_CUDA: 1
    USE_CUDNN: 1
    TORCH_CUDA_ARCH_LIST: "5.2 6.0 6.1 7.0+PTX 8.0 8.6 8.7 8.9 9.0"
    TORCH_NVCC_FLAGS: "-Xfatbin -compress-all"
    CFLAGS: "$CFLAGS -Wno-error=nonnull -Wno-nonnull"
    CXXFLAGS: "$CXXFLAGS -Wno-error=nonnull -Wno-nonnull"
    CUDA_VERSION: "12.4"
    CUDAToolkit_ROOT: "/usr/local/cuda-12.4"
    BUILD_VERSION: "${{package.version}}+cu124"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/audio
      tag: v${{package.version}}
      expected-commit: d8831425203385077a03c1d92cfbbe3bf2106008

  - runs: |
      python setup.py bdist_wheel
      python${{vars.py-version}} -m pip install --verbose \
        --no-index --no-build-isolation --no-deps \
        --force-reinstall --no-compile --prefix=/usr "--root=${{targets.contextdir}}" dist/*.whl
      sitepkgd=$(python${{vars.py-version}} -c 'import site; print(site.getsitepackages()[0])')
      python${{vars.py-version}} -m compileall --invalidation-mode=unchecked-hash -r100 ${{targets.contextdir}}/$sitepkgd

update:
  enabled: true
  github:
    identifier: pytorch/audio
    strip-prefix: v
    tag-filter: v2.6.

test:
  environment:
    environment:
      CUDNN_HOME: "/usr/local/cudnn-${{vars.cudnn-version}}"
      CUDA_HOME: "/usr/local/cuda-${{vars.cuda-version}"
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.py-version}}
        import: torch
    - uses: python/import
      with:
        python: python${{vars.py-version}}
        import: torchaudio
