package:
  name: aws-c-io-fips
  version: "0.21.2"
  epoch: 0
  description: Module for the AWS SDK for C handling all IO and TLS work for application protocols (FIPS)
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - aws-c-io=${{package.full-version}}
    provider-priority: 20

environment:
  contents:
    packages:
      - aws-c-cal-fips-dev
      - aws-c-common-dev
      - aws-lc-fips-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - s2n-tls-fips-dev
      - samurai
  environment:
    CMAKE_PREFIX_PATH: /usr/lib/aws-lc
    CFLAGS: "-I/usr/include/aws-lc"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9c7f98dcb083bd705eeb323e77868b1e2c9d4e73
      repository: https://github.com/awslabs/aws-c-io
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DUNSAFE_TREAT_WARNINGS_AS_ERRORS=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux \
        -Dcrypto_INCLUDE_DIR=/usr/include/aws-lc

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-common-dev
        - aws-c-cal-fips-dev
        - aws-lc-fips-dev
        - s2n-tls-fips-dev
        - aws-c-io-fips
      provides:
        - aws-c-io-dev=${{package.full-version}}
      provider-priority: 20
    description: aws-c-io-fips dev
    test:
      pipeline:
        - uses: test/tw/ldd-check
          with:
            packages: aws-c-io-fips-dev

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-io
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - aws-c-io-fips-dev
        - bash
        - build-base
        - gcc
  pipeline:
    - name: "Check aws-c-io-fips Installation"
      runs: |
        echo "Verifying aws-c-io-fips installation..."
        find /usr /usr/local -name 'libaws-c-io.so' || (echo "aws-c-io-fips library not found!" && exit 1)
    - uses: test/tw/ldd-check
    - name: "Compile and Run aws-c-io-fips Test Program"
      runs: |
        echo "Testing aws-c-io-fips functionality..."
        cat <<EOF > test_io.c
        #include <aws/io/io.h>
        #include <aws/common/common.h>
        #include <stdio.h>

        int main() {
            struct aws_allocator *allocator = aws_default_allocator();
            aws_io_library_init(allocator);
            printf("AWS IO library initialized successfully\\n");
            aws_io_library_clean_up();
            return 0;
        }
        EOF
        gcc test_io.c -o test_io -laws-c-io -laws-c-common
        ./test_io || (echo "aws-c-io-fips test failed!" && exit 1)
