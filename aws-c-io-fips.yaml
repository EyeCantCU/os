package:
  name: aws-c-io-fips
  version: "0.26.0"
  epoch: 0
  description: Module for the AWS SDK for C handling all IO and TLS work for application protocols (FIPS)
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - aws-c-cal-fips
      - aws-lc-fips
      - s2n-tls-fips

vars:
  aws-lc-lib-dir: /usr/lib/aws-lc
  aws-lc-include-dir: /usr/include/aws-lc
  aws-lc-crypto-lib: /usr/lib/aws-lc/libcrypto.so

environment:
  contents:
    packages:
      - aws-c-cal-fips-dev
      - aws-c-common-dev
      - aws-lc-fips-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - s2n-tls-fips-dev
      - samurai
  environment:
    CMAKE_PREFIX_PATH: ${{vars.aws-lc-lib-dir}}
    CFLAGS: "-I${{vars.aws-lc-include-dir}}"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d5ad01cef5d027f65c6f5b460972bae0a469779d
      repository: https://github.com/awslabs/aws-c-io
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_PREFIX_PATH=/usr \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_INSTALL_RPATH=${{vars.aws-lc-lib-dir}} \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DUNSAFE_TREAT_WARNINGS_AS_ERRORS=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux \
        -Dcrypto_INCLUDE_DIR=${{vars.aws-lc-include-dir}} \
        -Dcrypto_SHARED_LIBRARY=${{vars.aws-lc-crypto-lib}}

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-common-dev
        - aws-c-cal-fips-dev
        - aws-lc-fips-dev
        - s2n-tls-fips-dev
        - aws-c-io-fips
    description: aws-c-io-fips dev
    test:
      pipeline:
        - uses: test/tw/ldd-check
          with:
            packages: aws-c-io-fips-dev

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-io
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - aws-c-io-fips-dev
        - bash
        - build-base
        - gcc
  pipeline:
    - name: "Check aws-c-io-fips Installation"
      runs: |
        echo "Verifying aws-c-io-fips installation..."
        find /usr /usr/local -name 'libaws-c-io.so' || (echo "aws-c-io-fips library not found!" && exit 1)
    - uses: test/tw/ldd-check
    - name: "Compile and Run aws-c-io-fips Test Program"
      runs: |
        echo "Testing aws-c-io-fips functionality..."
        cat <<EOF > test_io.c
        #include <aws/io/io.h>
        #include <aws/common/common.h>
        #include <stdio.h>

        int main() {
            struct aws_allocator *allocator = aws_default_allocator();
            aws_io_library_init(allocator);
            printf("AWS IO library initialized successfully\\n");
            aws_io_library_clean_up();
            return 0;
        }
        EOF
        gcc test_io.c -o test_io -laws-c-io -laws-c-common
        ./test_io || (echo "aws-c-io-fips test failed!" && exit 1)
