package:
  name: py3.11-torch-2.6-cuda-12.3
  version: "2.6.0"
  epoch: 4
  description: Tensors and Dynamic neural networks in Python with strong GPU acceleration
  copyright:
    - license: BSD-3-Clause
  target-architecture:
    - x86_64
  resources:
    cpu: 64
    memory: 192Gi
  options:
    no-depends: true
  dependencies:
    runtime:
      - cuda-toolkit-${{vars.cuda-version}}
      - libgomp
      - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}
      - nvidia-nccl-cuda-${{vars.cuda-version}}
      - openmp-17
      - py${{vars.python-version}}-astunparse
      - py${{vars.python-version}}-filelock
      - py${{vars.python-version}}-fsspec
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-markupsafe
      - py${{vars.python-version}}-mpmath
      - py${{vars.python-version}}-networkx
      - py${{vars.python-version}}-numpy-2.2
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-sympy
      - py${{vars.python-version}}-typing-extensions
    provides:
      - py${{vars.python-version}}-torch-cuda-${{vars.cuda-version}}

vars:
  cudnn-version: 9
  gcc-version: 12

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.\d+$'
    replace: '$1'
    to: cuda-major-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.(\d+)$'
    replace: 'cu$1$2'
    to: cuda-pyvariant
  - from: ${{package.name}}
    match: 'py(\d+\.\d+)-.*'
    replace: '$1'
    to: python-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake-3
      - coreutils
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - gcc-${{vars.gcc-version}}-default
      - git
      - glibc-dev
      - libffi-dev
      - libgomp
      - libjpeg-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - nvidia-cuda-profiler-api-${{vars.cuda-version}}
      - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}-dev
      # Cuda
      - nvidia-driver
      - nvidia-nccl-cuda-${{vars.cuda-version}}-dev
      - openmp-17-dev
      - openssl-dev
      - patchelf
      - posix-libc-utils
      - py${{vars.python-version}}-astunparse
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-installer
      - py${{vars.python-version}}-numpy-2.2
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-pyyaml
      - py${{vars.python-version}}-requests
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-typing-extensions
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}
      - python-${{vars.python-version}}-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/pytorch.git
      tag: v${{package.version}}
      expected-commit: 1eba9b3aa3c43f86f4a2c807ac8e12c4a7767340
      recurse-submodules: true

  - uses: patch
    with:
      patches: cstdint.patch pytorch-2.6-remove-cmake-ninja.patch

  - name: Python Build
    runs: |
      export PYTORCH_BUILD_VERSION="${{package.version}}+${{vars.cuda-pyvariant}}"
      export PYTORCH_BUILD_NUMBER=0
      export CC=/usr/bin/gcc-${{vars.gcc-version}}
      export CXX=/usr/bin/g++-${{vars.gcc-version}}
      export CUDA_HOME=/usr/local/cuda-${{vars.cuda-version}}
      export CUDA_NVCC_EXECUTABLE=/usr/local/cuda-${{vars.cuda-version}}/bin/nvcc
      export PATH="$PATH:/usr/local/cuda-${{vars.cuda-version}}/bin"
      export CMAKE_CUDA_ARCHITECTURES=all
      export USE_CUDA=1
      export USE_CUDNN=1
      export USE_SYSTEM_NCCL=1
      export NCCL_LIB_DIR=/usr/lib
      export NCCL_INCLUDE_DIR=/usr/include
      export CUDNN_HOME="/usr/local/cudnn-${{vars.cudnn-version}}"
      export CUDNN_LIBRARY="/usr/local/cudnn-${{vars.cudnn-version}}/lib64"
      export CUDNN_INCLUDE_DIR="/usr/local/cudnn-${{vars.cudnn-version}}/include"
      export TORCH_CUDA_ARCH_LIST="5.2 6.0 6.1 7.0+PTX 8.0 8.6 8.7 8.9 9.0"
      export TORCH_NVCC_FLAGS="-Xfatbin -compress-all"
      export CUDA_VERSION="${{vars.cuda-version}}"
      export MAX_JOBS="32"

      # see pytorch doc on GLIBCXX_USE_CXX11_ABI at
      # https://github.com/pytorch/pytorch/blob/b4b1480b0634a5fb7e116053464301d192e2583a/README.md?plain=1#L236
      # and https://gcc.gnu.org/onlinedocs/libstdc++/manual/using_dual_abi.html
      export _GLIBCXX_USE_CXX11_ABI=1

      # Disable some warnings
      export CFLAGS="$CFLAGS -Wno-error=nonnull -Wno-nonnull"
      export CXXFLAGS="$CXXFLAGS -Wno-error=nonnull -Wno-nonnull"

      python${{vars.python-version}} -m build --no-isolation
      python${{vars.python-version}} -m pip install --verbose \
        --no-index --no-build-isolation --no-deps \
        --force-reinstall --no-compile --prefix=/usr "--root=${{targets.contextdir}}" dist/*.whl
      sitepkgd=$(python${{vars.python-version}} -c 'import site; print(site.getsitepackages()[0])')
      python${{vars.python-version}} -m compileall --invalidation-mode=unchecked-hash -r100 ${{targets.contextdir}}/$sitepkgd

update:
  enabled: true
  github:
    identifier: pytorch/pytorch
    strip-prefix: v
    tag-filter: v2.6.

test:
  environment:
    environment:
      CUDNN_HOME: "/usr/local/cudnn-${{vars.cudnn-version}}"
      CUDA_HOME: "/usr/local/cuda-${{vars.cuda-version}"
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: torch
