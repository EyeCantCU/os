package:
  name: chart-iamguarded-superset
  version: "5.0.0"
  epoch: 2
  description: superset iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common
      - chart-iamguarded-postgresql
      - chart-iamguarded-redis

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: superset/${{package.version}}
      expected-commit: 1f58a6a77077836a7ae6771b44bcf7448d392f0d

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/superset

  - uses: charts/package
    with:
      chart-path: iamguarded/superset

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: superset/
    use-tag: true
    tag-filter-prefix: superset/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /superset
