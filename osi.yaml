package:
  name: osi
  version: "0.108.11"
  epoch: 1
  description: Osi (Open Solver Interface) provides an abstract base class to a generic linear programming (LP) solver, along with derived classes for specific solvers
  copyright:
    - license: EPL-2.0
  dependencies:
    runtime:
      - lib${{package.name}}${{vars.abi}}

vars:
  abi: 1

environment:
  contents:
    packages:
      - build-base
      - busybox
      - coinutils-dev
      - gfortran

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/coin-or/Osi
      tag: releases/${{package.version}}
      expected-commit: d979b7b890a32a7e69c53920bb39eef17bd599b8

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      mkdir docs
      (cd "${{targets.destdir}}" && tar -c usr/share/coin/doc) > docs.save
      rm -rf ${{targets.destdir}}/usr/share/coin/doc
      # remove one by one so we fail if upstream adds other content
      rmdir ${{targets.destdir}}/usr/share/coin
      rmdir ${{targets.destdir}}/usr/share

  - runs: |
      # Currently fails due to missing test files
      # make test

  - uses: strip

subpackages:
  - name: lib${{package.name}}${{vars.abi}}
    description: lib${{package.name}} library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libOsi.so.${{vars.abi}} \
            "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libOsi.so.${{vars.abi}}.* \
            "${{targets.contextdir}}/usr/lib"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: lib${{package.name}}commontests${{vars.abi}}
    description: lib${{package.name}} library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libOsiCommonTests.so.${{vars.abi}} \
            "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libOsiCommonTests.so.${{vars.abi}}.* \
            "${{targets.contextdir}}/usr/lib"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-dev
    description: ${{package.name}} development files
    dependencies:
      runtime:
        - lib${{package.name}}${{vars.abi}}=${{package.full-version}}
        - lib${{package.name}}commontests${{vars.abi}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: ${{package.name}} docs
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"
          (cd "${{targets.contextdir}}" && tar xv) < docs.save
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: coin-or/Osi
    strip-prefix: releases/
