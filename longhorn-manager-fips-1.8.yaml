package:
  name: longhorn-manager-fips-1.8
  version: 1.8.2
  epoch: 0
  description: Manager for Longhorn.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - longhorn-manager=${{package.full-version}}
    runtime:
      # - bind-utils
      - cifs-utils
      - e2fsprogs
      - iproute2
      - iputils
      - kmod
      - nfs-client
      - unzip
      - xfsprogs
      - zip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/longhorn/longhorn-manager.git
      tag: v${{package.version}}
      expected-commit: 5859e849c445b6144e8ab12db1472e26dc1ad4bd

  - uses: go/build
    with:
      packages: .
      output: longhorn-manager
      ldflags: |
        -X github.com/longhorn/longhorn-manager/meta.Version=${{package.version}}
        -X github.com/longhorn/longhorn-manager/meta.GitCommit=$(git rev-parse HEAD)
        -X github.com/longhorn/longhorn-manager/meta.BuildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for ${{package.name}}
    dependencies:
      provides:
        - longhorn-manager-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/local/sbin
          ln -s /usr/bin/longhorn-manager "${{targets.contextdir}}"/usr/local/sbin/longhorn-manager
          cp ./package/launch-manager "${{targets.contextdir}}"/usr/local/sbin
          cp ./package/nsmounter "${{targets.contextdir}}"/usr/local/sbin
    test:
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-dangling: true

test:
  environment:
    contents:
      packages:
        - grpc-health-probe
    environment:
      FAST_FAILOVER: false
      LEASE_LIFETIME: 60
      GRACE_PERIOD: 30
  pipeline:
    - uses: test/go-fips-check
    - name: "Test binary help"
      uses: test/tw/help-check
      with:
        bins: longhorn-manager

update:
  enabled: true
  github:
    identifier: longhorn/longhorn-manager
    tag-filter-prefix: v1.8
    strip-prefix: v
    use-tag: true
  ignore-regex-patterns:
    - '.*-rc\d+$'
    - ".*-dev-.*"
    - ".*-hotfix-.*"
