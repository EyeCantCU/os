package:
  name: mono
  version: 6.14.1
  epoch: 0
  description: Framework Mono is a software platform designed to allow developers to easily create cross platform applications.
  copyright:
    - license: Apache-2.0
    - license: MIT
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - python3

environment:
  environment:
    CFLAGS: "-Wno-int-conversion -DMONO_ARCH_NOMAP32BIT" # See: https://gitlab.winehq.org/mono/mono/-/blob/mono-6.14.1/mono/mini/tramp-amd64.c?ref_type=tags#L599
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - cmake
      - gettext
      - krb5
      - libtool
      - python3
      - wget

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.winehq.org/mono/mono.git
      tag: mono-${{package.version}}
      expected-commit: bc83d1455532a6d9359e5215aae56d5a6e83edac

  - runs: |
      PATH=/usr/lib/mono/bin:$PATH
      mkdir -p /usr/lib/mono
      chown -R $(whoami) /usr/lib/mono
      ./autogen.sh --prefix=/usr/lib/mono

  - uses: autoconf/make

  - uses: autoconf/make-install

  - working-directory: /usr/lib/mono
    pipeline:
      - runs: |
          mkdir -p "${{targets.destdir}}"/usr/bin
          ln -s /usr/lib/mono/bin/mcs "${{targets.destdir}}"/usr/bin/
          ln -s /usr/lib/mono/bin/mono "${{targets.destdir}}"/usr/bin/

update:
  enabled: true
  release-monitor:
    identifier: 6360

test:
  pipeline:
    - name: Basic mono command test
      runs: |
        mono --version
    - name: Compile and run a simple .NET application
      runs: |
        cat <<'EOF' > HelloWorld.cs
        using System;

        class Program
        {
            static void Main()
            {
                Console.WriteLine("Hello, World!");
            }
        }
        EOF
        mcs HelloWorld.cs
        mono HelloWorld.exe
    - name: Compile and run a .NET application with arguments
      runs: |
        cat <<'EOF' > ArgumentEcho.cs
        using System;

        class Program
        {
            static void Main(string[] args)
            {
                Console.WriteLine("Arguments: " + String.Join(", ", args));
            }
        }
        EOF
        mcs ArgumentEcho.cs
        mono ArgumentEcho.exe arg1 arg2 arg3
    - uses: test/tw/ldd-check
