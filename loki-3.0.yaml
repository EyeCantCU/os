package:
  name: loki-3.0
  version: 3.0.1
  epoch: 0
  description: Like Prometheus, but for logs.
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    provides:
      - loki=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e13011d91a77501ca4f659df9cf33f23085d3a35
      repository: https://github.com/grafana/loki
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: github.com/docker/docker@v26.1.5
      replaces: go.etcd.io/bbolt=go.etcd.io/bbolt@v1.3.6 github.com/opencontainers/runc=github.com/opencontainers/runc@v1.1.14
      show-diff: true

  # fix compilation with go-1.23
  # https://github.com/grafana/pyroscope-go/releases/tag/godeltaprof%2Fv0.1.8
  - uses: go/bump
    with:
      deps: github.com/grafana/pyroscope-go/godeltaprof@v0.1.8

  - uses: autoconf/make

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      mv cmd/loki/loki ${{targets.contextdir}}/usr/bin/loki

      # Add the default config
      mkdir -p ${{targets.contextdir}}/etc/loki
      mv cmd/loki/loki-local-config.yaml ${{targets.contextdir}}/etc/loki/local-config.yaml

  - uses: strip

subpackages:
  - name: ${{package.name}}-logcli
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mv cmd/logcli/logcli ${{targets.contextdir}}/usr/bin/logcli
    dependencies:
      provides:
        - logcli=${{package.full-version}}
    test:
      pipeline:
        - runs: |
            logcli --version

  - name: ${{package.name}}-promtail
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mv clients/cmd/promtail/promtail ${{targets.contextdir}}/usr/bin/promtail

          mkdir -p ${{targets.contextdir}}/etc/promtail
          mv clients/cmd/promtail/promtail-local-config.yaml ${{targets.contextdir}}/etc/promtail/config.yml
    dependencies:
      provides:
        - promtail=${{package.full-version}}
    test:
      pipeline:
        - runs: |
            promtail --version

  - name: ${{package.name}}-loki-canary
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mv cmd/loki-canary/loki-canary ${{targets.contextdir}}/usr/bin/loki-canary
    dependencies:
      provides:
        - loki-canary=${{package.full-version}}
    test:
      pipeline:
        - runs: |
            loki-canary --version

update:
  enabled: true
  github:
    identifier: grafana/loki
    strip-prefix: v
    tag-filter: v3.0

test:
  pipeline:
    - runs: |
        loki --version
