package:
  name: opentelemetry-auto-instrumentations-node
  description: OpenTelemetry instrumentation for JavaScript modules - auto-instrumentations-node component
  version: 0.67.2
  epoch: 0
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - node-gyp
      - nodejs
      - npm
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}

vars:
  python-version: 3.13

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-js-contrib
      tag: auto-instrumentations-node-v${{package.version}}
      expected-commit: 1a967b490331dd36482424efb9290e23454895c2

  - runs: |
      npm install ./packages/auto-instrumentations-node @opentelemetry/api
      DESTDIR=${{targets.destdir}}/usr/share/${{package.name}}
      mkdir -p "$DESTDIR"
      cp -rf ./packages/auto-instrumentations-node/src/** "${DESTDIR}"
      cp -rf ./node_modules package.json "${DESTDIR}"
      npm -C "${DESTDIR}" prune --omit=dev --no-package-lock
      chmod -R go+r "${DESTDIR}"
      cp -rf "${DESTDIR}/node_modules/@opentelemetry/auto-instrumentations-node/build/src"/. "${DESTDIR}"
      ln -s "register.js" "${DESTDIR}/autoinstrumentation.js"

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility subpackage for ${{package.name}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -s ./usr/share/${{package.name}} "${{targets.subpkgdir}}/autoinstrumentation"
    test:
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-js-contrib
    tag-filter: auto-instrumentations-node-v
    strip-prefix: auto-instrumentations-node-v

test:
  pipeline:
    - uses: test/tw/symlink-check
