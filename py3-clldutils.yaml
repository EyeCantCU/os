package:
  name: py3-clldutils
  version: 3.24.2
  epoch: 0
  description: Utilities for programmatic data curation
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: clldutils

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/clld/clldutils.git
      tag: v${{package.version}}
      expected-commit: 78bac98c76082274aa7e16243cc8929bf9866b63

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-attrs
        - py${{range.key}}-bibtexparser
        - py${{range.key}}-colorlog
        - py${{range.key}}-lxml
        - py${{range.key}}-markdown
        - py${{range.key}}-markupsafe
        - py${{range.key}}-pylatexenc
        - py${{range.key}}-python-dateutil
        - py${{range.key}}-tabulate
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
