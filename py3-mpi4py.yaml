package:
  name: py3-mpi4py
  version: "4.1.1"
  epoch: 1
  description: Python bindings for MPI
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0

vars:
  import: mpi4py
  pypi-package: mpi4py

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - openmpi-cuda-12.9-dev
      - openpmix-dev
      - prrte-dev
      - py3-supported-build-base-dev
      - py3-supported-cython
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5e2fbc62b177763400f7cfbc8fbe1d9f7e8abccf
      repository: https://github.com/mpi4py/mpi4py
      tag: ${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    pipeline:
      - name: Python Build
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - runs: |
            mpiexec --allow-run-as-root -n 5 python${{range.key}} -m mpi4py.bench helloworld

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  manual: false
  github:
    identifier: mpi4py/mpi4py

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
