#nolint:git-checkout-must-use-github-updates,valid-pipeline-git-checkout-tag
package:
  name: tritonserver-cuda-13.1
  version: "25.12"
  epoch: 0
  description: NVIDIA Triton Inference Server with CUDA 13 support
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: 64
    memory: 128Gi
  dependencies:
    runtime:
      - DCGM-cuda-${{vars.cuda-version}}
      - c-ares
      - crc32c
      - cuda-toolkit-${{vars.cuda-version}}
      - libb64-1.2
      - libgomp
      - libpsl
      - numactl
      - nvidia-cuda-cudart-${{vars.cuda-version}}
      - nvidia-nccl-cuda-${{vars.cuda-version}}
      - openmp-17-dev
      - prometheus-cpp-core
      - py${{vars.python-version}}-numpy-2.3
  options:
    no-depends: true

# These need to be updated based upon the upstream release
vars:
  build-dir: /home/build/tritonserver/build
  install-dir: /tmp/tritonbuild/tritonserver/install
  cudnn-version: 9
  python-version: 3.12

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{vars.cuda-version}}
    match: (\d+)\.\d+
    replace: $1
    to: cuda-major-version

environment:
  contents:
    packages:
      - DCGM-cuda-${{vars.cuda-version}}-dev
      - abseil-cpp-dev
      - bash
      - boost-dev
      - busybox
      - c-ares-dev
      - cmake-3
      - crane
      - crc32c-dev
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - curl-dev
      - file
      - gperf
      - icu-dev
      - jq
      - libb64-1.2-dev
      - libcurl-openssl4
      - numactl-dev
      - nvcc-${{vars.cuda-version}}-gcc-default
      - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}-dev
      - nvidia-nccl-cuda-${{vars.cuda-version}}
      - openssl-dev
      - prometheus-cpp-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-requests
      - python-${{vars.python-version}}
      - rapidjson-dev
      - re2-dev
      - triton-inference-server-backend=${{package.version}}
      - triton-inference-server-common=${{package.version}}
      - triton-inference-server-core=${{package.version}}
      - triton-inference-server-third-party=${{package.version}}
      - zlib-dev
  environment:
    CXXFLAGS: -I/usr/include/datacenter-gpu-manager-4 -Wno-maybe-uninitialized
    CMAKE_PREFIX_PATH: ${{vars.build-dir}}/third-party/absl:${{vars.build-dir}}/third-party/cares:${{vars.build-dir}}/third-party/curl:${{vars.build-dir}}/third-party/cnmem:${{vars.build-dir}}/third-party/googletest:${{vars.build-dir}}/third-party/google-cloud-cpp:${{vars.build-dir}}/third-party/grpc:${{vars.build-dir}}/third-party/nlohmann_json:${{vars.build-dir}}/third-party/opentelemetry-cpp:${{vars.build-dir}}/third-party/protobuf:${{vars.build-dir}}/third-party/re2:${{vars.build-dir}}/third-party/aws-sdk-cpp:${{vars.build-dir}}/third-party/curl
    CUDA_TOOLKIT_ROOT: /usr/local/cuda-${{vars.cuda-version}}
    CUDACXX: /usr/local/cuda-${{vars.cuda-version}}/bin/nvcc

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f6d01881f53a23541fec034e68a9e4b2a744e319
      repository: https://github.com/triton-inference-server/server
      branch: r${{package.version}}
      destination: server

  - name: Check Python version
    working-directory: server
    runs: |
      # We want to ensure that the version of Python we use with our packages
      # aligns with the version used by NVIDIA in the upstream images. We can
      # do that by parsing the Python version in the build script
      package_python_version="${{vars.python-version}}"
      image_python_version=$(grep '^ARG PYVER=' build.py | awk -F '=' '{print $2}')

      if [ "$package_python_version" != "$image_python_version" ]; then
        echo "Please update the Python version!"
        echo "Package Python version: $package_python_version"
        echo "Image Python version: $image_python_version"
        echo "Tritonserver r${{package.version}} uses Python $image_python_version."
        exit 1
      fi

  - name: Check CUDA version
    runs: |
      # If the version of CUDA doesn't align with the version included in the Tritonserver
      # release, hold the version back. Tritonserver releases ship with specific versions
      # of CUDA, and we want to align with the version shipped in the upstream image
      package_cuda_version="${{vars.cuda-version}}"
      image_cuda_version=$(\
        crane config nvcr.io/nvidia/tritonserver:${{package.version}}-py3 \
          | jq -r '.config.Env[]
          | select(startswith("CUDA_VERSION="))
          | split("=")[1] # Split away CUDA version
          | split(".")[:2] # Split major and minor version
          | join(".")
      ')

      if [ "$package_cuda_version" != "$image_cuda_version" ]; then
        echo "Please update the CUDA version!"
        echo "Package CUDA version: $package_cuda_version"
        echo "Image CUDA version: $image_cuda_version"
        echo "Tritonserver r${{package.version}} uses CUDA $image_cuda_version."
        exit 1
      fi

  - runs: |
      mkdir -p "${{vars.build-dir}}"

  - working-directory: ${{vars.build-dir}}
    runs: |
      # The cmake option flags were the result of one build.py run using python3 build.py --enable-gpu.
      cmake \
        "-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE}" \
        "-DVCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET}" \
        "-DCMAKE_BUILD_TYPE=Release" \
        "-DCMAKE_INSTALL_PREFIX:PATH=${{vars.install-dir}}" \
        "-DTRITON_VERSION:STRING=${{package.version}}" \
        "-DTRITON_REPO_ORGANIZATION:STRING=file:///usr/src/triton-inference-server" \
        "-DTRITON_COMMON_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/common.git && git branch --show-current)" \
        "-DTRITON_CORE_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/core.git && git branch --show-current)" \
        "-DTRITON_BACKEND_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/backend.git && git branch --show-current)" \
        "-DTRITON_THIRD_PARTY_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/third_party.git && git branch --show-current)" \
        "-DTRITON_ENABLE_LOGGING:BOOL=ON" \
        "-DTRITON_ENABLE_STATS:BOOL=ON" \
        "-DTRITON_ENABLE_METRICS:BOOL=ON" \
        "-DTRITON_ENABLE_METRICS_GPU:BOOL=ON" \
        "-DTRITON_ENABLE_METRICS_CPU:BOOL=ON" \
        "-DTRITON_ENABLE_TRACING:BOOL=ON" \
        "-DTRITON_ENABLE_NVTX:BOOL=OFF" \
        "-DTRITON_ENABLE_GPU:BOOL=ON" \
        "-DTRITON_MIN_COMPUTE_CAPABILITY=6.0" \
        "-DTRITON_ENABLE_MALI_GPU:BOOL=OFF" \
        "-DTRITON_ENABLE_GRPC:BOOL=ON" \
        "-DTRITON_ENABLE_HTTP:BOOL=ON" \
        "-DTRITON_ENABLE_SAGEMAKER:BOOL=ON" \
        "-DTRITON_ENABLE_VERTEX_AI:BOOL=OFF" \
        "-DTRITON_ENABLE_GCS:BOOL=ON" \
        "-DTRITON_ENABLE_S3:BOOL=ON" \
        "-DTRITON_ENABLE_AZURE_STORAGE:BOOL=OFF" \
        "-DTRITON_ENABLE_ENSEMBLE:BOOL=ON" \
        "-DTRITON_ENABLE_TENSORRT:BOOL=OFF" \
        "-DEVENT__HAVE_ARC4RANDOM=0" \
        "-DEVENT__HAVE_ARC4RANDOM_BUF=0" \
        "-DCMAKE_CXX_FLAGS=\"-Wno-error\"" \
        /home/build/server

  # Fedora 43 (circa 2025-11) is shipping cmake 3.31, so this probably isn't
  # as bad as it might seem.
  - name: Test if we can now stop pinning cmake to cmake-3
    runs: |
      find . -name CMakeLists.txt | xargs grep -E 'cmake_minimum_required *\(VERSION 3\.'

  - working-directory: ${{vars.build-dir}}
    runs: |
      # Run the build using the generated files
      cmake --build . --config Release -j$(nproc) -t install

  - runs: |
      destdir="${{targets.contextdir}}/opt/tritonserver/"
      mkdir -p "$destdir/bin"
      cp ${{vars.install-dir}}/bin/tritonserver "$destdir/bin"
      mkdir -p "$destdir/lib"
      cp ${{vars.install-dir}}/lib64/libtritonserver.so "$destdir/lib"
      mkdir -p "$destdir/include/triton"
      cp -r ${{vars.install-dir}}/include/triton/core "$destdir/include/triton/core"
      cp server/LICENSE ${{vars.install-dir}}
      cp server/TRITON_VERSION ${{vars.install-dir}}

  - runs: |
      # Install the wheel.
      # Important: We use no-deps because its dependencies should not get installed. Without it numpy was getting installed.
      sitepkgd=$(python${{vars.python-version}} -c 'import site; print(site.getsitepackages()[0])')
      sitepkgd=${sitepkgd#/}
      pip${{vars.python-version}} install --no-deps --no-compile --prefix=/usr --root=${{targets.contextdir}} ${{vars.install-dir}}/python/tritonserver*.whl
      python${{vars.python-version}}  -m compileall --invalidation-mode=unchecked-hash -r100 "${{targets.contextdir}}"/$sitepkgd

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/daemon-check-output
      with:
        start: |
          /opt/tritonserver/bin/tritonserver
        timeout: 60
        expected_output: |
          DCGM unable to get device info and count, GPU metrics will not be available
          Collecting CPU metrics
          ${{package.version}}
          No server context available. Exiting immediately
    - runs: |
        /opt/tritonserver/bin/tritonserver 2>&1 | grep -F -e "${{package.version}}"
        /opt/tritonserver/bin/tritonserver --help 2>&1 | grep -F -e "Usage: tritonserver"
    - name: "Confirm sagemaker support - https://github.com/chainguard-dev/customer-issues/issues/2918"
      runs: |
        /opt/tritonserver/bin/tritonserver --help 2>&1 | grep '^Sagemaker:$'

update:
  enabled: true
  git:
    strip-prefix: r
    tag-filter-prefix: r
