package:
  name: ghc-stage0
  version: "9.6.6"
  epoch: 0
  description: "Bootstrap package for GHC"
  copyright:
    - license: "BSD-3-Clause"
  dependencies:
    runtime:
      - gmp-dev
      - numactl-dev
    provides:
      - ghc=9.6.6

environment:
  contents:
    packages:
      - build-base
      - busybox
      - dpkg

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://snapshot.debian.org/archive/debian/20250217T144403Z/pool/main/g/ghc/ghc_9.6.6-4_amd64.deb"
          expected-sha256: "1465e84916a376f71d6752ed9f182b97eff235c78e51f95da3d5905c0b2b44a0"
          extract: false
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          uri: "https://snapshot.debian.org/archive/debian/20250217T144403Z/pool/main/g/ghc/ghc_9.6.6-4_arm64.deb"
          expected-sha256: "6f47c85fdb72a1b8e7b654592e5014dbfb2b32915893704fa3bf1a1c7cac56c4"
          extract: false

  - runs: dpkg-deb -x *.deb "${{targets.destdir}}"

  - runs: |
      rm -rf \
        "${{targets.destdir}}/usr/lib/debug" \
        "${{targets.destdir}}/usr/share"

  # Bodge compiler settings for slightly different naming between Debian and
  # Wolfi.  This is unpleasant, but it'll be sorted out properly when the
  # bootstrap is complete.
  - runs: |
      sed -i \
        -e 's/x86_64-linux-gnu/x86_64-pc-linux-gnu/' \
        -e 's/aarch64-linux-gnu/aarch64-unknown-linux-gnu/' \
        -e 's/"[^"]*-linux-gnu-ar"/"ar"/' \
        -e 's/"[^"]*-linux-gnu-ld"/"ld"/' \
        -e 's/"[^"]*-linux-gnu-ranlib"/"ranlib"/' \
        "${{targets.destdir}}/usr/lib/ghc/lib/settings"

  - uses: strip

update:
  enabled: false
  exclude-reason: "don't auto update stage 0 packages"

test:
  pipeline:
    - runs: |
        ghc --version
        ghc-pkg --version
        ghci --version
        haddock --version
        hpc help
        hsc2hs --version
        runghc --version
    - uses: test/tw/ldd-check
