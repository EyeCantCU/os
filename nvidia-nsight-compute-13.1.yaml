package:
  name: nvidia-nsight-compute-13.1
  version: "2025.4.0.12"
  epoch: 0 # CVE-2025-47906
  description: Nsight Compute
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-nsight-compute=${{package.full-version}}
    runtime:
      - nvidia-cuda-ld-config-${{vars.cuda-version}}

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/nsight_compute/linux-sbsa/nsight_compute-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "e6d378cc697de0733ce9f62fd137233bfc525f5365337e5fd44ac831fe785a5e"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/nsight_compute/linux-x86_64/nsight_compute-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "75fca7c10a73f76cec6e5d97dd48cd480806c9222632f5df5f53b19154c75e0e"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/nsight-compute
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE
      mv docs ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/nsight-compute/
      mv extras ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/nsight-compute/
      mv host ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/nsight-compute/
      mv ncu* ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/nsight-compute/
      mv sections ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/nsight-compute/
      mv target ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/nsight-compute/

test:
  environment:
    contents:
      packages:
        - bash
  pipeline:
    - name: Verify installation and binaries
      runs: |
        test -x /usr/local/cuda-${{vars.cuda-version}}/nsight-compute/ncu
        test -x /usr/local/cuda-${{vars.cuda-version}}/nsight-compute/ncu-ui
    - name: Test binary functionality
      runs: |
        # Create symlinks for the nsight-compute version
        ln -s /usr/local/cuda-${{vars.cuda-version}}/nsight-compute/2025.2.1 /usr/local/cuda-${{vars.cuda-version}}/nsight-compute-2025.2.1

        /usr/local/cuda-${{vars.cuda-version}}/nsight-compute/ncu --version
        /usr/local/cuda-${{vars.cuda-version}}/nsight-compute/ncu --list-sections
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: nvidia-nsight-compute
        real-pkg-name: ${{package.name}}

update:
  enabled: false
