spec:
  authorities:
    - keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - subjectRegExp: .+@chainguard.dev$
            issuer: https://github.com/login/oauth
          - subjectRegExp: .+@chainguard.dev$
            issuer: https://accounts.google.com
          # The cve remediation bot for prod images.
          - issuer: https://accounts.google.com
            subject: cve-remediation-sa@prod-enforce-fabc.iam.gserviceaccount.com
          # The staging update-bot manages os/
          - issuer: https://accounts.google.com
            subject: update-bot-str@staging-enforce-cd1e.iam.gserviceaccount.com
          # The production update-bot manages enterprise-packages/ and extra-packages/.
          - issuer: https://accounts.google.com
            subject: update-bot-stereo@prod-enforce-fabc.iam.gserviceaccount.com
          # The staging vpa-bot manages os/
          - issuer: https://accounts.google.com
            subject: vpa-bot@staging-enforce-cd1e.iam.gserviceaccount.com
          # The production vpa-bot manages enterprise-packages/ and extra-packages/.
          - issuer: https://accounts.google.com
            subject: vpa-bot@prod-enforce-fabc.iam.gserviceaccount.com
          # The production version-reconciler manages version_data/.
          - issuer: https://accounts.google.com
            subject: version-reconciler@prod-enforce-fabc.iam.gserviceaccount.com
          # The production version-stream reconciler manages package version streams.
          - issuer: https://accounts.google.com
            subject: version-stream@prod-enforce-fabc.iam.gserviceaccount.com
          # The production ftbfs reconciler manages FTBFS packages in os/, enterprise-packages/ and extra-packages/.
          - issuer: https://accounts.google.com
            subject: ftbfs-bot@prod-enforce-fabc.iam.gserviceaccount.com
          # The production cve remediation reconciler creates CVE remediations for packages.
          - issuer: https://accounts.google.com
            subject: cve-remediation-bot@prod-enforce-fabc.iam.gserviceaccount.com
          # The production eol-deleter service to delete EOL packages
          - issuer: https://accounts.google.com
            subject: lifecycle-eol-deleter@prod-images-c6e5.iam.gserviceaccount.com
          # workstation service accounts
          - issuer: https://accounts.google.com
            subjectRegExp: ".*-work-v2@chainguard-workstations\\.iam\\.gserviceaccount\\.com"
            # qackage-improve bot account, this is currently running in dev while we run some more workloads before getting to staging.
            # This is purely for improving tests, all generated PRs will be reviewed by humans before merging.
          - issuer: https://accounts.google.com
            subject: qackage-improve@jrawlings2-chainguard-dev.iam.gserviceaccount.com
          # The staging manifest-gen bot
          - issuer: https://accounts.google.com
            subject: manifest-gen@staging-enforce-cd1e.iam.gserviceaccount.com
      ctlog:
        url: https://rekor.sigstore.dev
    - key:
        # Allow commits signed by GitHub.
        kms: https://github.com/web-flow.gpg
