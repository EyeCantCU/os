spec:
  authorities:
    - keyless:
        # allow commits signed by users using GitHub or Google OIDC
        identities:
          - issuer: https://github.com/login/oauth
          - subjectRegExp: .+@chainguard\.dev$
            issuer: https://accounts.google.com
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/chainguard-dev/extra-packages/.github/workflows/digestabot.yaml@refs/heads/main
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/chainguard-dev/extra-packages/.github/workflows/wolfictl-update-gh.yaml@refs/heads/main
          # lifecycle-automation cve detection service
          - subject: cve-detection-sa@prod-images-c6e5.iam.gserviceaccount.com
            issuer: https://accounts.google.com
          # lifecycle-automation cve fix service
          - subject: cve-fix-sa@prod-images-c6e5.iam.gserviceaccount.com
            issuer: https://accounts.google.com
    - key:
        # allow commits signed by GitHub, e.g. the UI
        kms: https://github.com/web-flow.gpg
