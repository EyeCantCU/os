spec:
  authorities:
    - keyless:
        url: https://fulcio.sigstore.dev
        identities:
          - subjectRegExp: .+@chainguard.dev$
            issuer: https://github.com/login/oauth
          - subjectRegExp: .+@chainguard.dev$
            issuer: https://accounts.google.com
          # The staging update-bot manages os/ packages.
          - issuer: https://accounts.google.com
            subject: update-bot-str@staging-enforce-cd1e.iam.gserviceaccount.com
          # The production update-bot manages enterprise-packages/ and extra-packages/.
          - issuer: https://accounts.google.com
            subject: update-bot-stereo@prod-enforce-fabc.iam.gserviceaccount.com
          # The production version-reconciler manager version_data/.
          - issuer: https://accounts.google.com
            subject: version-reconciler@prod-enforce-fabc.iam.gserviceaccount.com
      ctlog:
        url: https://rekor.sigstore.dev
    - key:
        # Allow commits signed by GitHub.
        kms: https://github.com/web-flow.gpg
