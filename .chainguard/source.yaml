spec:
  authorities:
    - keyless:
        # allow commits signed by users using GitHub or Google OIDC
        identities:
          - issuer: https://github.com/login/oauth
          - subjectRegExp: .+@chainguard\.dev$
            issuer: https://accounts.google.com
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/chainguard-dev/extra-packages/.github/workflows/digestabot.yaml@refs/heads/main
          # chainctl updater signed commits
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/chainguard-dev/extra-packages/.github/workflows/update-chainctl.yaml@refs/heads/main
          # lifecycle-automation versions stream creator service
          - subject: lifecycle-vs-creator@prod-images-c6e5.iam.gserviceaccount.com
            issuer: https://accounts.google.com
          # lifecycle-automation cve remediation service
          - subject: cve-remediation-sa@prod-images-c6e5.iam.gserviceaccount.com
            issuer: https://accounts.google.com
          # Workstation signed commits
          - subject: workstation-work@chainguard-workstations.iam.gserviceaccount.com
            issuer: https://accounts.google.com
          - subjectRegExp: ".*-work-v2@chainguard-workstations\\.iam\\.gserviceaccount\\.com"
            issuer: https://accounts.google.com
          # Updatebot signed commits
          - subject: lc-update-bot@prod-enforce-fabc.iam.gserviceaccount.com
            issuer: https://accounts.google.com
    - key:
        # allow commits signed by GitHub, e.g. the UI
        kms: https://github.com/web-flow.gpg
