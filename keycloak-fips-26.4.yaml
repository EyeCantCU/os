package:
  name: keycloak-fips-26.4
  version: "26.4.7"
  epoch: 12 # GHSA-m494-w24q-6f7w
  description: Open Source Identity and Access Management For Modern Applications and Services
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash # Keycloak helper scripts require bash, aren't compatible with busybox.
      - bcfips-policy-140-3-j${{vars.java-version}}
      - merged-usrsbin
      - openjdk-${{vars.java-version}}-default-jvm
      - wolfi-baselayout
    provides:
      - keycloak-fips-policy-140-3=${{package.full-version}}
      - keycloak-fips=${{package.full-version}}

vars:
  java-version: 21

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - bash
      - bouncycastle-fips
      - build-base
      - busybox
      - gcc-14-default
      - openjdk-${{vars.java-version}}-default-jdk
      - unzip
  environment:
    LANG: en_US.UTF-8

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/keycloak/keycloak
      tag: ${{package.version}}
      expected-commit: 38c38721ad4c1303fa2a1bc24ccece4799a8a242

  - uses: patch
    with:
      # Disables a redundant FIPS host check in Keycloak which expects the
      # underlying host to be RHEL and running a RHEL patched version of JDK.
      # We use vanilla JDK with bcfips, so this is not applicable.
      # While classpath-script.patch patches kcadm.sh and kcreg.sh to use the CLASSPATH env variable
      patches: |
        disable-rhel-fips-check.patch
        classpath-script.patch
        kc.sh-misc-FIPS-related-fixes.patch
        default-FIPS-mode-to-on.patch
        pom-fips-provider-fixes.patch

  - uses: maven/pombump
    with:
      patch-file: pombump-deps.yaml
      properties-file: pombump-properties.yaml

  - runs: |
      gcc napi-static-assert.c -o /tmp/preload.so -fPIC -shared -ldl

  - runs: |
      # Keycloak installation. Note we use the maven wrapper as configured in
      # the source repo to build - ensures the correct maven version for
      # building the project, preventing issues such as CI hangs.

      # Build keycloak-server. Depends on `keycloak-js-adapter-jar`.
      # Gross hack to work around broken NAPI ast-grep module that has
      # undefined symbol: static_assert
      export LD_PRELOAD=/tmp/preload.so
      export KC_FEATURES=fips
      ./mvnw clean install -DskipTests -Dmaven.test.skip=true -DskipITs -DskipProtoLock=true -Pdistribution -Dkc.features=fips
      ./mvnw clean install -DskipTests -Dmaven.test.skip=true -DskipITs -DskipProtoLock=true -Pdistribution -pl crypto/fips1402
      unset LD_PRELOAD

      mkdir -p ${{targets.destdir}}/usr/share/java
      unzip -d ${{targets.destdir}}/usr/share/java quarkus/dist/target/keycloak-*.zip
      mv ${{targets.destdir}}/usr/share/java/keycloak-* ${{targets.destdir}}/usr/share/java/keycloak

      # Create an empty data directory for keycloak. Required by the UI to store some data.
      mkdir -p ${{targets.destdir}}/usr/share/java/keycloak/data

      mkdir -p ${{targets.destdir}}/usr/bin
      for i in kc.sh kcadm.sh kcreg.sh; do
        ln -sf /usr/share/java/keycloak/bin/$i ${{targets.destdir}}/usr/bin/$i
      done

      # Actually remove any non-FIPS bcprov JARs dynamically across all possible locations
      find ${{targets.destdir}} -type f \( \
          -name "*bcprov-jdk*.jar" -o \
          -name "*bcpkix-jdk*.jar" -o \
          -name "*bcutil-jdk*.jar" \) -delete

      # Fips fips1402 provider, aka bcfips wrapper
      # Symlink keycloak-crypto-fips1402 into all classpath locations
      mkdir -p ${{targets.contextdir}}/usr/share/java/keycloak/providers
      cp ./crypto/fips1402/target/keycloak-crypto-fips1402-${{package.version}}.jar ${{targets.contextdir}}/usr/share/java/keycloak/providers/keycloak-crypto-fips1402.jar

      ln -s /usr/share/java/bouncycastle-fips/*.jar ${{targets.contextdir}}/usr/share/java/keycloak/providers/

      mkdir -p ${{targets.contextdir}}/usr/share/java/keycloak/bin/client/lib
      ln -s /usr/share/java/bouncycastle-fips/*.jar ${{targets.contextdir}}/usr/share/java/keycloak/bin/client/lib/
      ln -s ../../../providers/keycloak-crypto-fips1402.jar ${{targets.contextdir}}/usr/share/java/keycloak/bin/client/lib/

      mkdir -p ${{targets.contextdir}}/usr/share/java/keycloak/lib/lib/main
      ln -s /usr/share/java/bouncycastle-fips/*.jar ${{targets.contextdir}}/usr/share/java/keycloak/lib/lib/main/
      ln -s ../../../providers/keycloak-crypto-fips1402.jar ${{targets.contextdir}}/usr/share/java/keycloak/lib/lib/main/

      # Replace vendored BC FIPS jars with relative symlinks to system libraries (without version numbers)
      # Keeps vendored naming (org.bouncycastle.*.jar) to satisfy Quarkus metadata
      cd ${{targets.contextdir}}/usr/share/java/keycloak/lib/lib/main
      for vendored_jar in org.bouncycastle.bc*-fips-*.jar; do
        [ -f "$vendored_jar" ] || continue
        # Extract base name: org.bouncycastle.bc-fips-2.0.0.jar -> bc-fips
        base_name=$(echo "$vendored_jar" | sed 's/org\.bouncycastle\.\(.*\)-fips-.*/\1/')
        system_jar="${base_name}-fips.jar"
        [ -f "$system_jar" ] && rm -f "$vendored_jar" && ln -s "$system_jar" "$vendored_jar"
      done
      cd -

      # CRITICAL: Regenerate Quarkus metadata with FIPS enabled
      # This ensures that the Quarkus classloader knows to ignore non-FIPS bcprov artifacts
      # and only load the FIPS-compliant ones we've installed above.
      cd ${{targets.contextdir}}/usr/share/java/keycloak
      KC_DB=postgres KC_BOOTSTRAP_ADMIN_USERNAME=temp KC_BOOTSTRAP_ADMIN_PASSWORD=temp \
        ./bin/kc.sh build --features=fips --db=postgres
      cd -

subpackages:
  - name: ${{package.name}}-operator
    dependencies:
      runtime:
        - openjdk-${{vars.java-version}}-default-jdk
      provides:
        - keycloak-operator-fips=${{package.full-version}}
    pipeline:
      - name: "build and install files"
        runs: |
          cd operator
          ../mvnw clean package
          # NOTE: the maven build has created a .zip with the app
          # but the zip has an embedded path component we want to get rid of, something like
          # 'usr/share/java/keycloak-operator-26.4.0/'. We will unpack the zip then rename
          # the 'keycloak-operator-26.4.0' directory to 'quarkus-app'
          # this is because previous versions of the package may use this path in images or other components
          destdir="${{targets.subpkgdir}}/usr/share/java"
          mkdir -p "$destdir"
          maven_name="keycloak-operator-${{package.version}}"
          unzip "target/${maven_name}.zip" -d "$destdir"
          mv "${destdir}/${maven_name}" "${destdir}/quarkus-app"
          ls -lr "$destdir"
    test:
      pipeline:
        - name: "expected initialization error test"
          runs: |
            # This only runs in k8s but make sure it errors correctly
            java -Djava.util.logging.manager=org.jboss.logmanager.LogManager \
              -jar /usr/share/java/quarkus-app/quarkus-run.jar 2>&1 | grep "Couldn't retrieve the currently connected namespace"
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: keycloak-operator-fips
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-operator-compat
    dependencies:
      provides:
        - keycloak-operator-fips-compat=${{package.full-version}}
    pipeline:
      - name: "install files"
        runs: |
          mkdir -p "${{targets.subpkgdir}}"/opt/
          ln -s /usr/share/java/quarkus-app/ "${{targets.subpkgdir}}"/opt/keycloak
    test:
      pipeline:
        - name: "verify expected link exists"
          runs: readlink /opt/keycloak
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: keycloak-operator-fips-compat
            real-pkg-name: ${{subpkg.name}}

  # NOTE: This is forked from the non-FIPS keycloak-iamguarded-compat package so that
  # the steps copying Keycloak binaries to the expected path include the required
  # BC FIPS Jars
  - name: ${{package.name}}-iamguarded-fips
    description: "compat package for using FIPS with iamguarded/keycloak image"
    dependencies:
      # Remove this once the image has moved over
      provides:
        - keycloak-fips-iamguarded-compat=${{package.full-version}}
      runtime:
        - bcfips-policy-140-3-j${{vars.java-version}}
        - bash # Keycloak helper scripts require bash, aren't compatible with busybox.
        - coreutils # Keycloak Helm Chart scripts require coreutils, aren't compatible with busybox. (i.e., `cp` with `--preserve` option)
        - krb5
        - libaio
        - merged-usrsbin
        - net-tools
        - openjdk-${{vars.java-version}}-default-jvm
        - posix-libc-utils
        - procps
        - su-exec
        - wait-for-port
        - wolfi-baselayout
        - zlib
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: keycloak
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /iamguarded/keycloak
          mkdir -p /opt/iamguarded/keycloak
          mkdir -p ${{targets.contextdir}}/docker-entrypoint-initdb.d

          for dir in bin conf conf.default lib providers themes; do
            mkdir -p /opt/iamguarded/keycloak/$dir
          done

          chmod g+rwX /opt/iamguarded

          # Copy keycloak files to /opt/iamguarded/keycloak for compatibility with
          # their Helm Chart, which copies the directories into an emptyDir in
          # an initContainer
          cp -r ${{targets.destdir}}/usr/share/java/keycloak/* /opt/iamguarded/keycloak

          # Replace the incorrect Java paths in the iamguarded scripts
          sed -i 's/JAVA_HOME="\/opt\/iamguarded\/java"/JAVA_HOME="\/usr\/lib\/jvm\/java-${{vars.java-version}}-openjdk"/g' /opt/iamguarded/scripts/keycloak-env.sh
          sed -i 's/\/opt\/iamguarded\/java\/lib\/security/\/usr\/lib\/jvm\/java-${{vars.java-version}}-openjdk\/conf\/security/g' /opt/iamguarded/scripts/java/postunpack.sh

          # Disable some commands used in iamguarded scripts. These commands more likely fail in this since this image take non root approach
          sed -i 's/chown -R "$KEYCLOAK_DAEMON_USER" "$dir"/# chown -R "$KEYCLOAK_DAEMON_USER" "$dir"/g' /opt/iamguarded/scripts/keycloak/postunpack.sh
          sed -i 's/ensure_user_exists/# ensure_user_exists/g' /opt/iamguarded/scripts/keycloak/postunpack.sh
          sed -i 's/am_i_root/# am_i_root/g' /opt/iamguarded/scripts/keycloak/setup.sh
          sed -i 's/hostname --fqdn/hostname -f/g' /opt/iamguarded/scripts/keycloak-env.sh
          sed -i 's/am_i_root/false/g' /opt/iamguarded/scripts/keycloak/run.sh

          # The `--userspec`` flag belongs to GNU's chroot, whereas we are use BusyBox's. As a workaround, use `su-exec` instead.
          sed -i 's|exec chroot --userspec="$userspec" /|exec chroot / su-exec "$userspec"|' /opt/iamguarded/scripts/libos.sh
          sed -i 's|chroot --userspec="$userspec" /|chroot / su-exec "$userspec"|' /opt/iamguarded/scripts/libos.sh

          # Use package path while unpacking
          /opt/iamguarded/scripts/keycloak/postunpack.sh || true

          # Link binaries used by iamguarded config
          ln -sf /opt/iamguarded/scripts/keycloak/entrypoint.sh ${{targets.contextdir}}/entrypoint.sh
          ln -sf /opt/iamguarded/scripts/keycloak/run.sh ${{targets.contextdir}}/run.sh
      - uses: iamguarded/finalize-compat
        with:
          package: keycloak
          version: ${{vars.major-version}}
    test:
      environment:
        contents:
          packages:
            - curl
            - postgresql
            - postgresql-client
            - glibc-locale-posix # Adding locales to prevent test failure on aarch64
            - shadow
            - sudo-rs
            - jq
        accounts:
          groups:
            - groupname: bn_keycloak
              gid: 65532
          users:
            - username: bn_keycloak
              gid: 65532
              uid: 65532
          run-as: 0
        environment:
          PGDATA: /tmp/test_db
          PGUSER: bn_keycloak
          PGDB: iamguarded_keycloak
          ALLOW_EMPTY_PASS: true
          LANG: C.UTF-8 # Adding locales to prevent test failure on aarch64
          LC_ALL: C.UTF-8 # Adding locales to prevent test failure on aarch64
          KC_CACHE: ispn
          KC_CACHE_CONFIG_FILE: cache-ispn.xml
          KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-}
          KC_BOOTSTRAP_ADMIN_PASSWORD: $KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD
          KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
          KEYCLOAK_DAEMON_USER: root
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: keycloak
            version: ${{vars.major-version}}
        - working-directory: /tmp
          pipeline:
            - name: "Test database creation"
              with:
                setup: echo "127.0.0.1 postgresql" >> /etc/hosts
              runs: |
                sudo -u $PGUSER initdb -D $PGDATA
                sudo -u $PGUSER pg_ctl -D $PGDATA -l /tmp/logfile start
                sudo -u $PGUSER createdb $PGDB
                sudo -u $PGUSER psql -lqt | cut -d \| -f 1 | grep -qw $PGDB
            - name: "start daemon on localhost"
              uses: test/daemon-check-output
              with:
                setup: |
                  #!/bin/sh -e
                  echo "127.0.0.1 postgresql" >> /etc/hosts
                  echo "$(hostname) postgresql" >> /etc/hosts
                start: |
                  env "IAMGUARDED_APP_NAME=keycloak" \
                    "APP_VERSION=${{package.version}}" \
                    "PATH=/opt/iamguarded/keycloak/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
                    "KEYCLOAK_ADMIN=admin" \
                    "KEYCLOAK_ADMIN_PASSWORD=PASSWORD-FOR-ADMIN-USER" \
                    "KEYCLOAK_EXTRA_ARGS=--features=fips --fips-mode=non-strict --https-key-store-password=LongKeystorePassword" \
                    "KEYCLOAK_ENABLE_HEALTH_ENDPOINTS=true" \
                    /opt/iamguarded/scripts/keycloak/entrypoint.sh \
                    /opt/iamguarded/scripts/keycloak/run.sh
                timeout: 120
                # NOTE: We ignore spurious ERROR logs here that stem from the
                # additional complexity fully configuring Keycloak for BCFIPS.
                # There is additional coverage in the image test + a stricter
                # version of this test for the non-FIPS iamguarded keycloak
                # package.
                error_strings: |
                  FATAL
                  FAIL
                expected_output: |
                  Welcome to the Iamguarded image for Keycloak
                  keycloak setup finished!
                  server listening on
                  Keycloak ${{package.version}}
                  Profile dev activated.
                post: |
                  #!/bin/sh -e
                  url=http://localhost:9000/health/ready
                  response=$(curl -fsS --connect-timeout 5 --max-time 10 --retry 5 --retry-delay 0 --retry-max-time 40 "$url") || {
                    echo "curl ${url} failed $?"
                    exit 1
                  }
                  echo "$response" | jq .status | grep -q UP || {
                    echo "response from $url did not contain \"UP\""
                    echo "response: $response"
                    exit 1
                  }
                  echo "$url had expected output: $response"

test:
  pipeline:
    - uses: java-fips/algorithms
      with:
        java-version: ${{vars.java-version}}
        classpath: /usr/share/java/keycloak/providers/*:.

update:
  # The upstream repos releases contains a 'nightly' release. Which we want to
  # exclude from discovery.
  ignore-regex-patterns:
    - '.*nightly.*'
  enabled: true
  github:
    identifier: keycloak/keycloak
    tag-filter: 26.4.
