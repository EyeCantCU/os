package:
  name: grype-db
  version: "0.29.0"
  epoch: 1
  description: Application to create a Grype vulnerability database from upstream vulnerability data sources.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/anchore/grype-db
      tag: v${{package.version}}
      expected-commit: f8b4e3f1b414c3dbb6540b0a17d1696d49a194da

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.35.0

  - uses: go/build
    with:
      ldflags: -X main.version=${{package.version}}
      output: grype-db
      packages: ./cmd/grype-db

update:
  enabled: true
  github:
    identifier: anchore/grype-db
    strip-prefix: v

test:
  # grype-db pull needs a local copy of vunnel. Just choose one of the
  # supported python versions. They get tested more thoroughly in the
  # vunnel package tests.
  environment:
    contents:
      packages:
        - py3.12-vunnel-bin
  pipeline:
    - runs: |
        cd /tmp
        # We have to create the 'local' vunnel provider, or it will expect
        # to run docker container with vunnel.
        cat <<EOF >> .grype-db.yaml
        provider:
          vunnel:
            executor: local
            generate-configs: true
        EOF
        cat .grype-db.yaml
        grype-db --version
        grype-db --help
        grype-db pull -g -p wolfi
