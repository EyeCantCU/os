package:
  name: grype-db
  version: "0.40.0"
  epoch: 2 # GHSA-jc7w-c686-c4v9
  description: Application to create a Grype vulnerability database from upstream vulnerability data sources.
  copyright:
    - license: Apache-2.0

vars:
  py-version: 3.13

environment:
  contents:
    packages:
      - busybox
      - py${{vars.py-version}}-hatchling
      - py${{vars.py-version}}-pip
      - py${{vars.py-version}}-uv-dynamic-versioning
      - python-${{vars.py-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/anchore/grype-db
      tag: v${{package.version}}
      expected-commit: 0a5e456e85885754701f0272223be3d2de824ec6

  - uses: go/build
    with:
      ldflags: -X main.version=${{package.version}}
      output: grype-db
      packages: ./cmd/grype-db

subpackages:
  - name: ${{package.name}}-manager
    description: Python manager component for Grype vulnerability database
    dependencies:
      runtime:
        - tzdata
        - git
        - libmagic
        - py${{vars.py-version}}-boto3
        - py${{vars.py-version}}-click
        - py${{vars.py-version}}-colorlog
        - py${{vars.py-version}}-dataclass-wizard
        - py${{vars.py-version}}-iso8601
        - py${{vars.py-version}}-mergedeep
        - py${{vars.py-version}}-magic
        - py${{vars.py-version}}-pyyaml
        - py${{vars.py-version}}-pyyaml-include
        - py${{vars.py-version}}-requests
        - py${{vars.py-version}}-semver
        - py${{vars.py-version}}-tabulate
        - py${{vars.py-version}}-yardstick
        - py${{vars.py-version}}-zstandard
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{vars.py-version}}
      - uses: strip
    test:
      pipeline:
        - runs: |
            grype-db-manager --help
            grype-db-manager --version

update:
  enabled: true
  git:
    strip-prefix: v

test:
  # grype-db pull needs a local copy of vunnel. Just choose one of the
  # supported python versions. They get tested more thoroughly in the
  # vunnel package tests.
  environment:
    contents:
      packages:
        - py3.12-vunnel-bin
  pipeline:
    - runs: |
        set -euxo pipefail
        cat <<EOF >> .grype-db.yaml
        provider:
          vunnel:
            executor: local
            generate-configs: true
        EOF
        cat .grype-db.yaml
        grype-db --version
        grype-db --help
        grype-db pull -g -p wolfi
