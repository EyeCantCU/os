package:
  name: onednn
  version: "3.10.1"
  epoch: 0
  description: oneAPI Deep Neural Network Library (oneDNN) is an open-source cross-platform performance library of basic building blocks for deep learning applications
  copyright:
    - license: Apache-2.0
  resources:
    memory: 64Gi

vars:
  abi: 3
  python-version: 3.13

environment:
  contents:
    packages:
      - arm-compute-library-dev
      - build-base
      - busybox
      - cmake
      - py${{vars.python-version}}-build-base
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/uxlfoundation/oneDNN
      tag: v${{package.version}}
      expected-commit: abbdd859b6129f946ddd8896b3e9cd489bad7d06

  - if: ${{build.arch}} != 'aarch64'
    uses: cmake/configure

  - if: ${{build.arch}} == 'aarch64'
    uses: cmake/configure
    with:
      opts: -DONEDNN_AARCH64_USE_ACL=ON

  - uses: cmake/build

  - uses: cmake/install

test:
  pipeline:
    - uses: test/emptypackage

subpackages:
  - name: libdnnl${{vars.abi}}
    description: oneAPI Deep Neural Network Library (oneDNN) is an open-source cross-platform performance library of basic building blocks for deep learning applications
    dependencies:
      runtime:
        - arm-compute-library
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr
          mv ${{targets.destdir}}/usr/lib ${{targets.contextdir}}/usr
          mv ${{targets.destdir}}/usr/include ${{targets.contextdir}}/usr
      - name: empty out main package
        runs: |
          # explicitly remove only the things we expect to be left over.
          # this way, if anything new gets added, test/emptypackage will
          # fail and alert us.
          rm -rf ${{targets.destdir}}/usr/share/doc
          rmdir ${{targets.destdir}}/usr/share
          rmdir ${{targets.destdir}}/usr
      - name: Check that ABI has not changed
        runs: |
          test -e ${{targets.contextdir}}/usr/lib/libdnnl.so.${{vars.abi}}
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: libdnnl-dev
    description: libdnnl dev
    dependencies:
      runtime:
        - libdnnl${{vars.abi}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
        with:
          package: libdnnl${{vars.abi}}
    test:
      pipeline:
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: uxlfoundation/oneDNN
    strip-prefix: v
