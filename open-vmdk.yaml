package:
  name: open-vmdk
  version: "0.3.12"
  epoch: 0
  description: "Open VMDK is an assistant tool for creating Open Virtual Appliance (OVA)"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.python-version}}-lxml
      - py${{vars.python-version}}-pyyaml
      - zlib

vars:
  python-version: "3.13"

environment:
  contents:
    packages:
      - build-base
      - wolfi-base
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/vmware/open-vmdk
      tag: v${{package.version}}
      expected-commit: 7cbf0bb9ba8b69b8930907c8d44ec6eb2439bf91

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      # Remove junk we don't use
      rm -r ${{targets.destdir}}/etc
      rm ${{targets.destdir}}/usr/bin/mkova.sh
      rm ${{targets.destdir}}/usr/bin/ovfenv

  - uses: strip

update:
  enabled: true
  github:
    identifier: vmware/open-vmdk

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: vmdk-convert
        expect-contains: "Usage"
    - uses: test/tw/help-check
      with:
        bins: ova-compose
        help-flag: -h
