package:
  name: py3-distconfig3
  version: "1.0.1"
  epoch: 0
  description: Library to manage distributed configuration using ZooKeeper, Etcd, or Consul
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

vars:
  pypi-package: distconfig3

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip
      - python3
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/alexferl/distconfig
      tag: v${{package.version}}
      expected-commit: 50ce2236b776f7791e6e71a4980c313464ebfd60

  - name: Python Build
    uses: python/build-wheel

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        import: distconfig

update:
  enabled: true
  github:
    identifier: alexferl/distconfig3
    strip-prefix: v
    use-tag: true
