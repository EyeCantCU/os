package:
  name: py3.10-vllm-cuda-11.8
  version: 0.6.5
  epoch: 1
  description: A high-throughput and memory-efficient inference and serving engine for LLMs
  copyright:
    - license: Apache-2.0
  resources:
    cpu: 16
    memory: 16Gi
  target-architecture:
    - x86_64
  options:
    no-depends: true
  dependencies:
    runtime:
      - python-3.10

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - gcc-11-default
      - samurai
      - ninja-build
      - numactl-dev
      - tcmalloc-minimal
      - gperftools-dev
      - python-3.10-dev
      - py3.10-pip
      - sccache
      - nvidia-cuda-cudart-11.8
      - nvidia-cuda-nvcc-11.8
      - nvidia-cuda-nvrtc-11.8
      - nvidia-cuda-nvtx-11.8
      - nvidia-libcublas-11.8
      - nvidia-libcufft-11.8
      - nvidia-libcurand-11.8
      - nvidia-libcusolver-11.8
      - nvidia-libcusparse-11.8
      - nvidia-cuda-nvml-dev-11.8
      - nvidia-cudnn-9-cuda-11
      - nvidia-cuda-cudart-11.8-dev
      - nvidia-cuda-nvcc-11.8-dev
      - nvidia-cuda-nvrtc-11.8-dev
      - nvidia-cuda-nvtx-11.8-dev
      - nvidia-libcublas-11.8-dev
      - nvidia-libcufft-11.8-dev
      - nvidia-libcurand-11.8-dev
      - nvidia-libcusolver-11.8-dev
      - nvidia-libcusparse-11.8-dev
      - nvidia-driver
      - nvidia-libnvidia-ml
      - nvidia-cuda-cccl-11.8

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/vllm-project/vllm.git
      tag: v${{package.version}}
      expected-commit: 2d1b9baa8f57fc59912c7bcd07fd630fb9d72c9d

  - runs: |
      ln -sf /usr/local/cuda-11.8 /usr/local/cuda
      export PATH=/usr/local/cuda/bin:$PATH
      export LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
      export TORCH_CUDA_ARCH_LIST='7.0 7.5 8.0 8.6 8.9 9.0+PTX'
      export MAX_JOBS=16

      python -m venv .venv --system-site-packages
      source .venv/bin/activate
      pip install -r requirements-cuda.txt
      # GHSA-27mf-ghqm-j3j8 fix
      pip install build wheel packaging aiohttp==3.10.11
      pip install -r requirements-build.txt

      python3 setup.py bdist_wheel
      python setup.py build_ext --inplace
      pip install dist/vllm-*.whl

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/vllm
      mv .venv ${{targets.destdir}}/usr/share/vllm/

      rm -rf ${{targets.destdir}}/usr/share/vllm/.venv/bin/__pycache*
      sed -i "s|/home/build|/usr/share/vllm|g" ${{targets.destdir}}/usr/share/vllm/.venv/bin/*
      sed -i "s|include-system-site-packages = false|include-system-site-packages = true|g" ${{targets.destdir}}/usr/share/vllm/.venv/pyvenv.cfg

  - uses: strip

subpackages:
  - name: py3.10-wheels-vllm-cuda-11.8
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/wheels
          cp dist/*.whl ${{targets.contextdir}}/usr/share/wheels

update:
  enabled: true
  ignore-regex-patterns:
    - post
    - test
    - submission
  github:
    identifier: vllm-project/vllm
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - name: Verify vllm installation
      runs: |
        export PATH=/usr/share/vllm/.venv/bin:$PATH
        python -c "import vllm"
