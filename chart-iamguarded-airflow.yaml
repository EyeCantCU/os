package:
  name: chart-iamguarded-airflow
  version: "24.2.2"
  epoch: 0
  description: Airflow iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common
      - chart-iamguarded-postgresql
      - chart-iamguarded-redis

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: airflow/${{package.version}}
      expected-commit: 7a30b329dcd9ee666d0ea4f1c87080d67094aede

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/airflow

  - uses: charts/package
    with:
      chart-path: iamguarded/airflow

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: airflow/
    use-tag: true
    tag-filter-prefix: airflow/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /airflow
