package:
  name: systemtap
  version: "5.3"
  epoch: 2
  description: a linux trace/probe tool
  copyright:
    - license: GPL-2.0
  dependencies:
    runtime:
      - bash
      - libnss
      - libssl3
      - py${{vars.py-version}}-pip
      - python-${{vars.py-version}}

vars:
  py-version: 3.13

environment:
  contents:
    packages:
      - avahi-dev
      - bash
      - bash-binsh # Bash-isms in Makefile.
      - boost-dev
      - build-base
      - cpio
      - elfutils-dev
      - gettext
      - json-c-dev
      - libnss-dev
      - libselinux-dev
      - libxml2-dev
      - linux-headers
      - openssl-dev
      - pkgconf-dev
      - py${{vars.py-version}}-setuptools
      - python-${{vars.py-version}}-dev
      - xmlto

pipeline:
  - uses: git-checkout
    with:
      repository: https://sourceware.org/git/systemtap.git
      tag: release-${{package.version}}
      expected-commit: c4fc655170b534478a6b131292b987630c7c0865

  - uses: autoconf/configure
    with:
      opts: |
        --with-preferred-python=python${{vars.py-version}}

  - uses: autoconf/make

  - uses: autoconf/make-install

  - name: "Fix python version being ignored"
    runs: |
      for i in ${{targets.destdir}}/usr/bin/*; do
        grep -E '^#!/usr/s?bin/python3$' $i || continue
        sed -i -E 's,#!/usr/s?bin/python3$,#!/usr/bin/python${{vars.py-version}},' $i
        grep -E '^#!/usr/bin/python${{vars.py-version}}$' $i
      done

  - name: Move binaries to /usr/bin
    runs: |
      mv ${{targets.destdir}}/usr/sbin/* ${{targets.destdir}}/usr/bin/
      rm -rf ${{targets.destdir}}/usr/sbin

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: "${{package.name}} headers"
    pipeline:
      - uses: split/dev
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/include
          cp -r includes/* ${{targets.subpkgdir}}/include

  - name: ${{package.name}}-doc
    description: "${{package.name}} manpages"
    # test/docs is broken due to malformed manpages
    pipeline:
      - uses: split/manpages

  - name: ${{package.name}}-examples
    description: "${{package.name}} stp tracing examples"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share/systemtap/
          mv ${{targets.destdir}}/usr/share/systemtap/examples ${{targets.subpkgdir}}/usr/share/systemtap/

update:
  enabled: true
  git:
    tag-filter-prefix: release-
    strip-prefix: release-

test:
  pipeline:
    - runs: |
        test -x $(which dtrace)
        stap --help
        test -x $(which stap-jupyter-container)
        test -x $(which stap-jupyter-install)
        test -x $(which stap-merge)
        stap-prep --help
        test -x $(which stap-profile-annotate)
        stap-report > /dev/null
        test -x $(which stap-server)
        stapbpf --help
        staprun -V
        echo "" | stapsh
        stap-exporter --help
    - uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
