package:
  name: py3-pyctcdecode
  version: 0.5.0
  epoch: 0
  description: A fast and feature-rich CTC beam search decoder for speech recognition
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: pyctcdecode

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kensho-technologies/pyctcdecode.git
      tag: v${{package.version}}
      expected-commit: 0ca5ccc213dd26b7950a86d67938f8937b9c4486

  - runs: sed -i "/numpy/d ; s@dependencies \= \[@&\n\ \ \ \ \"numpy\"\,@" ./pyproject.toml

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-hypothesis
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-pygtrie
        - py${{range.key}}-kenlm
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - curl
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            curl -fsSLo logits.json "https://raw.githubusercontent.com/kensho-technologies/pyctcdecode/afecb67622c1395b85b6a55d2902a780c0c927d4/pyctcdecode/tests/sample_data/libri_logits.json"

            python${{range.key}} <<'EOF' | grep -F -e "i have a good deal of will you remember and what i have set my mind upon no doubt i shall some day achieve"
            import json
            import kenlm
            import numpy as np
            from pyctcdecode import build_ctcdecoder

            with open("logits.json") as f:
                logits = np.array(json.load(f))

            labels = [
                " ",
                "a", "b", "c", "d", "e", "f", "g", "h", "i", "j", "k", "l", "m",
                "n", "o", "p", "q", "r", "s", "t", "u", "v", "w", "x", "y", "z",
                "'",
            ]

            decoder = build_ctcdecoder(labels)
            print(decoder.decode(logits))
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
