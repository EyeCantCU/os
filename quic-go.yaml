package:
  name: quic-go
  version: 0.55.0
  epoch: 0
  description: A production-ready QUIC implementation in pure Go
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/quic-go/quic-go.git
      expected-commit: 7c1ce0efe280e4d82acad43b8cd8284596361103
      tag: v${{package.version}}

  - runs: |
      install -dm0755 "${{targets.destdir}}/usr/share/quic-go"
      git rev-parse HEAD | tee "${{targets.destdir}}/usr/share/quic-go/commit.txt"
      install -Dpm0755 -t "${{targets.destdir}}/usr/libexec/quic-go/" interop/run_endpoint.sh

subpackages:
  - name: quic-go-server
    description: Server binary for quic-go
    pipeline:
      - uses: go/build
        with:
          packages: ./interop/server/main.go
          output: server
          ldflags: -X github.com/quic-go/quic-go/qlog.quicGoVersion=$(git describe --always --long --dirty)
    test:
      pipeline:
        - runs: |
            mkdir -p /logs
        - uses: test/tw/help-check
          with:
            bins: server
            expect-contains: unsupported test case

  - name: quic-go-client
    description: Client binary for quic-go
    pipeline:
      - uses: go/build
        with:
          packages: ./interop/client/main.go
          output: client
          ldflags: -X github.com/quic-go/quic-go/qlog.quicGoVersion=$(git describe --always --long --dirty)
    test:
      pipeline:
        - runs: mkdir -p /logs
        - uses: test/tw/help-check
          with:
            bins: client
            expect-contains: Usage of

  - name: quic-go-compat
    description: Compatibility subpackage for upstream image
    dependencies:
      runtime:
        - quic-go-client
        - quic-go-server
        - quic-network-simulator # Need this for the `setup.sh` and others
        - quic-network-simulator-compat # /wait-for-it.sh
    pipeline:
      - runs: |
          mkdir -p ${{targets.destdir}}/quic-go
          ln -s /usr/share/quic-go/commit.txt ${{targets.destdir}}/quic-go/commit.txt
          ln -s /usr/bin/server ${{targets.destdir}}/quic-go/server
          ln -s /usr/bin/client ${{targets.destdir}}/quic-go/client
          ln -s /usr/libexec/quic-go/run_endpoint.sh ${{targets.destdir}}/quic-go/run_endpoint.sh
    test:
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - quic-go-compat
        - mkcert
  pipeline:
    - runs: |
        stat /usr/share/quic-go/commit.txt | grep 0644

        mkdir -p /certs
        cd /certs
        mkcert localhost
        mv localhost.pem cert.pem
        mv localhost-key.pem priv.key

        cd /quic-go
        exit 1
        TESTCASE="http3" ./run_endpoint.sh
