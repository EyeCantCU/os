package:
  name: opentelemetry-collector-contrib-fips
  version: 0.104.0
  epoch: 2
  description: Contrib repository for the OpenTelemetry Collector
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-collector-contrib
      tag: v${{package.version}}
      expected-commit: 38f97b6b5bfcd67edb92d4a1c5b35d93e09d4e5b

  - uses: go/bump
    with:
      deps: github.com/opencontainers/runc@v1.2.0-rc.1 github.com/hashicorp/go-retryablehttp@v0.7.7 google.golang.org/grpc@v1.64.1
      modroot: ./cmd/otelcontribcol

  - uses: go/build
    with:
      modroot: ./cmd/otelcontribcol
      packages: .
      output: otelcol-contrib
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-collector-contrib
    strip-prefix: v
