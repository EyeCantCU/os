package:
  name: opentelemetry-collector-contrib-fips
  version: 0.102.0
  epoch: 2
  description: Contrib repository for the OpenTelemetry Collector
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-collector-contrib
      tag: v${{package.version}}
      expected-commit: 6b1d3dd2c0c0812ebf5d973cda27f3817c68d038

  - uses: go/bump
    with:
      deps: github.com/opencontainers/runc@v1.2.0-rc.1 go.opentelemetry.io/collector/config/confighttp@v0.102.0 go.opentelemetry.io/collector/config/configgrpc@v0.102.1 github.com/mostynb/go-grpc-compression@v1.2.3 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/hashicorp/go-retryablehttp@v0.7.7
      modroot: ./cmd/otelcontribcol

  - uses: go/build
    with:
      modroot: ./cmd/otelcontribcol
      packages: .
      output: otelcol-contrib
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-collector-contrib
    strip-prefix: v
