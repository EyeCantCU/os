package:
  name: opentelemetry-collector-contrib-fips
  version: 0.103.0
  epoch: 0
  description: Contrib repository for the OpenTelemetry Collector
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-collector-contrib
      tag: v${{package.version}}
      expected-commit: 6dd3baea75a38706ff2611659d3ae8ad92720df1

  - uses: go/bump
    with:
      deps: github.com/opencontainers/runc@v1.2.0-rc.1 github.com/hashicorp/go-retryablehttp@v0.7.7
      modroot: ./cmd/otelcontribcol

  - uses: go/build
    with:
      modroot: ./cmd/otelcontribcol
      packages: .
      output: otelcol-contrib
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-collector-contrib
    strip-prefix: v
