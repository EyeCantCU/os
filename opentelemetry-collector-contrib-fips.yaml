package:
  name: opentelemetry-collector-contrib-fips
  version: 0.100.0
  epoch: 1
  description: Contrib repository for the OpenTelemetry Collector
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-collector-contrib
      tag: v${{package.version}}
      expected-commit: e85e670ca2e564e871ae5f4987c85d3d531d4684

  - uses: go/bump
    with:
      deps: github.com/opencontainers/runc@v1.2.0-rc.1
      modroot: ./cmd/otelcontribcol

  - uses: go/build
    with:
      modroot: ./cmd/otelcontribcol
      packages: .
      output: otelcol-contrib
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-collector-contrib
    strip-prefix: v
