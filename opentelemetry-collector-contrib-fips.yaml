package:
  name: opentelemetry-collector-contrib-fips
  version: 0.109.0
  epoch: 0
  description: Contrib repository for the OpenTelemetry Collector
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-collector-contrib
      tag: v${{package.version}}
      expected-commit: bd98b9d9b4226430744ccdbfe2ec202cd3237c72

  - uses: go/bump
    with:
      deps: github.com/opencontainers/runc@v1.2.0-rc.3
      modroot: ./cmd/otelcontribcol

  - uses: go/build
    with:
      modroot: ./cmd/otelcontribcol
      packages: .
      output: otelcol-contrib
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-collector-contrib
    strip-prefix: v
