package:
  name: py3.8-trove-classifiers
  version: 2024.10.12
  epoch: 0
  description: Canonical source for classifiers on PyPI (pypi.org).
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3.8-build
      - py3.8-installer
      - py3.8-pip
      - py3.8-wheel
      - python-3.8

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/trove-classifiers
      expected-commit: b6baa60d0d3a63c4471e74f5751b30b08e6a5fcb
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python3.8
      dest: ${{targets.contextdir}}

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.8
        import: trove_classifiers

update:
  enabled: true
  github:
    identifier: pypa/trove-classifiers
