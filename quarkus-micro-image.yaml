package:
  name: quarkus-micro-image
  version: "2.0"
  epoch: 0
  description: Minimal base image to run Quarkus native applications compiled with GraalVM
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # Runtime dependencies for GraalVM native executables
      - libgcc
      - libstdc++
      - zlib

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - libgcc
      - libstdc++
      - maven
      - openjdk-11-default-jdk
      - zlib

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/quarkusio/quarkus-images
      tag: 2.0
      expected-commit: 9e790e7c36112ff90508b656a611f2112dd691c7

  - working-directory: quarkus-micro-base-image
    runs: |
      # Build using Maven as per upstream instructions
      # Pre-reqs: Maven ≥ 3.6, JDK 11+
      # This generates Dockerfiles under target/docker/
      mvn install -DskipTests


update:
  enabled: true
  github:
    identifier: quarkusio/quarkus-images
    use-tag: true
    tag-filter-prefix: "2."
