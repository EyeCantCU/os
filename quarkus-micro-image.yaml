package:
  name: quarkus-micro-image
  # https://github.com/quarkusio/quarkus-images/blob/d3fc1440150668bd490472e4ca07d94e94f1b562/quarkus-micro-base-image/pom.xml#L37
  version: "2.0"
  epoch: 0
  description: Minimal base image to run Quarkus native applications compiled with GraalVM
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libgcc
      - libstdc++
      - zlib

environment:
  contents:
    packages:
      - busybox
      - wolfi-baselayout

update:
  enabled: false
  exclude-reason: No releases or tags
  schedule:
    period: daily
    reason: Upstream does not maintain tags or releases
  github:
    identifier: quarkusio/quarkus-images

test:
  pipeline:
    - runs: |
        ldconfig -p | grep libgcc_s.so
        ldconfig -p | grep libstdc++.so
        ldconfig -p | grep libz.so
