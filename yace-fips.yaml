package:
  name: yace-fips
  version: 0.62.1
  epoch: 1
  description: Prometheus exporter for AWS CloudWatch.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/yet-another-cloudwatch-exporter
      tag: v${{package.version}}
      expected-commit: 292db29c1537af84a5e831b007bc9ff501708eaa

  - uses: go/build
    with:
      packages: ./cmd/yace
      ldflags: -buildid= -X main.version=${{package.version}}
      output: yace
      go-package: go-fips

  - runs: |
      mkdir -p ${{targets.destdir}}/etc/yace
      mv examples/ec2.yml ${{targets.destdir}}/etc/yace/config.yml

update:
  enabled: true
  github:
    identifier: prometheus-community/yet-another-cloudwatch-exporter
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - name: Verify yace installation
      runs: |
        yace version
        yace --version
        yace --help
    - name: Verify Sample config file
      runs: |
        test -s "../../etc/yace/config.yml"
