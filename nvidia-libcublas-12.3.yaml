package:
  name: nvidia-libcublas-12.3
  version: 12.3.4.1
  epoch: 3
  description: CUDA cuBLAS
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-libcublas=${{package.full-version}}
      - nvidia-libcublas-12=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/libcublas/linux-sbsa/libcublas-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "063f0e1a130b35ff662d21c2e05613122146bec2eab4818139eaee5a1c4d94bd"
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/libcublas/linux-x86_64/libcublas-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "2cb5c340f89d9bad6e0f1fb2a93a8a4962fe106eeb96d8887abd25c1552bd219"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.3/
      mv include ${{targets.destdir}}/usr/local/cuda-12.3/
      mv lib ${{targets.destdir}}/usr/local/cuda-12.3/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.3/${{package.name}}.LICENSE

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/pkgconfig/
      mv pkg-config/* ${{targets.destdir}}/usr/share/pkgconfig/
      sed -i 's|targets/.*-linux/||g' ${{targets.destdir}}/usr/share/pkgconfig/*

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - nvidia-libcublas-12.3=${{package.full-version}}

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
