package:
  name: py3-python-socketio
  version: "5.13.0"
  epoch: 0
  description: Python Socket.IO server and client
  copyright:
    - license: MIT

vars:
  pypi-package: python-socketio
  import: socketio

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/miguelgrinberg/python-socketio
      tag: v${{package.version}}
      expected-commit: 80e77170eaf73c3b14e2a899bc8627c0f119da12

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-python-engineio
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import socketio
            from socketio import Client, Server

            # Test basic python-socketio functionality
            assert hasattr(socketio, 'Client')
            assert hasattr(socketio, 'Server')
            assert hasattr(socketio, 'AsyncClient')
            assert hasattr(socketio, 'AsyncServer')

            # Test that we can create Client and Server instances
            client = Client()
            assert client is not None
            assert hasattr(client, 'connect')
            assert hasattr(client, 'emit')
            assert hasattr(client, 'wait')

            server = Server()
            assert server is not None
            assert hasattr(server, 'event')
            assert hasattr(server, 'emit')
            assert hasattr(server, 'send')

            # Test AsyncClient and AsyncServer
            async_client = socketio.AsyncClient()
            assert async_client is not None
            assert hasattr(async_client, 'connect')
            assert hasattr(async_client, 'emit')
            assert hasattr(async_client, 'wait')

            async_server = socketio.AsyncServer()
            assert async_server is not None
            assert hasattr(async_server, 'event')
            assert hasattr(async_server, 'emit')
            assert hasattr(async_server, 'send')
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: miguelgrinberg/python-socketio
    strip-prefix: v
