package:
  name: nri-rabbitmq-fips
  version: "2.15.4"
  epoch: 0
  description: New Relic Infrastructure rabbitmq Integration (FIPS)
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-rabbitmq
      expected-commit: 891270cfc7b61a1fb02f644ca04cd9c60129767f
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-rabbitmq
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-rabbitmq ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-rabbitmq
          install -Dm644 legacy/rabbitmq-definition.yml ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/rabbitmq-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-rabbitmq
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-rabbitmq
    - uses: test/tw/ver-check
      with:
        bins: nri-rabbitmq
        version-flag: "-show_version"
    - name: Test binary execution
      uses: test/daemon-check-output
      with:
        start: |
          nri-rabbitmq
        expected_output: |
          connect: connection refused
        error_strings: |
          FAIL
          Traceback.*most.recent.call
