package:
  name: coinutils
  version: "2.11.12"
  epoch: 1
  description: Cbc (Coin-or branch and cut) is an open-source mixed integer linear programming solver written in C++
  copyright:
    - license: EPL-2.0

vars:
  abi: 3

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gfortran

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/coin-or/CoinUtils
      tag: releases/${{package.version}}
      expected-commit: cc644574ef1899f14b7318e6cdb7f460bbee5212

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      mkdir docs
      (cd "${{targets.destdir}}" && tar -c usr/share/coin/doc) > docs.save
      rm -rf ${{targets.destdir}}/usr/share/coin/doc
      # remove one by one so we fail if upstream adds other content
      rmdir ${{targets.destdir}}/usr/share/coin
      rmdir ${{targets.destdir}}/usr/share

  - runs: |
      make -j$(nproc) test

  - uses: strip

subpackages:
  - name: lib${{package.name}}${{vars.abi}}
    description: lib${{package.name}} library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libCoinUtils.so.${{vars.abi}} \
            "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libCoinUtils.so.${{vars.abi}}.* \
            "${{targets.contextdir}}/usr/lib"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-dev
    description: lib${{package.name}} development files
    dependencies:
      runtime:
        - lib${{package.name}}${{vars.abi}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: ${{package.name}} docs
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"
          (cd "${{targets.contextdir}}" && tar xv) < docs.save
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: coin-or/CoinUtils
    strip-prefix: releases/
