package:
  name: pytorch-cuda12
  version: 2.3.1
  epoch: 0
  description: Tensors and Dynamic neural networks in Python with strong GPU acceleration
  copyright:
    - license: BSD-3-Clause
  target-architecture:
    - x86_64
  resources:
    cpu: 64
    memory: 192Gi
  options:
    no-depends: true
  dependencies:
    runtime:
      # For some reason this isn't detected
      - libgomp
      - openmp-17-dev
      - cuda-toolkit-12.3
      - nvidia-nccl-cuda-12.3

environment:
  contents:
    packages:
      - patchelf
      - gcc-12-default
      - build-base
      - bash
      - busybox
      - ca-certificates-bundle
      - cmake
      - py3.11-installer
      - py3.11-pip
      - python-3.11
      - python-3.11-dev
      - samurai
      - libffi-dev
      - libjpeg-dev
      - libpng-dev
      - libjpeg-turbo-dev
      - openmp-17-dev
      - posix-libc-utils
      - openssl-dev
      - git
      - coreutils
      - libgomp
      # Cuda
      - nvidia-driver
      - nvidia-cuda-cccl-12
      - nvidia-cuda-profiler-api-12
      - nvidia-cudnn-8-cuda-12
      - nvidia-nccl-cuda-12.3-dev
      - cuda-toolkit-12.3-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/pytorch.git
      tag: v${{package.version}}
      expected-commit: 63d5e9221bedd1546b7d364b5ce4171547db12a9

  - uses: patch
    with:
      patches: cstdint.patch

  - name: Python Build
    runs: |
      export PYTORCH_BUILD_VERSION="${{package.version}}+cu121"
      export PYTORCH_BUILD_NUMBER=0
      export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:/usr/local/cuda-12.3/lib:/usr/local/cudnn-8.9"
      export PATH="$PATH:/usr/local/cuda-12.3/bin"
      export CMAKE_CUDA_ARCHITECTURES=all
      export USE_CUDA=1
      export USE_CUDNN=1
      export USE_SYSTEM_NCCL=1
      export NCCL_LIB_DIR=/usr/lib
      export NCCL_INCLUDE_DIR=/usr/include
      export CUDNN_HOME="/usr/local/cudnn-8.9"
      export CUDNN_LIBRARY="/usr/local/cudnn-8.9/lib64"
      export CUDNN_INCLUDE_DIR="/usr/local/cudnn-8.9/include"
      export TORCH_CUDA_ARCH_LIST="5.2 6.0 6.1 7.0+PTX 8.0 8.6 8.7 8.9 9.0"
      export TORCH_NVCC_FLAGS="-Xfatbin -compress-all"
      export CUDA_VERSION="12.3"
      export MAX_JOBS="$(nproc --ignore=2)"

      # see pytorch doc on GLIBCXX_USE_CXX11_ABI at
      # https://github.com/pytorch/pytorch/blob/b4b1480b0634a5fb7e116053464301d192e2583a/README.md?plain=1#L236
      # and https://gcc.gnu.org/onlinedocs/libstdc++/manual/using_dual_abi.html
      export _GLIBCXX_USE_CXX11_ABI=1

      # Disable some warnings
      export CFLAGS="$CFLAGS -Wno-error=nonnull -Wno-nonnull"
      export CXXFLAGS="$CXXFLAGS -Wno-error=nonnull -Wno-nonnull"

      pip install -r requirements.txt

      pip install build
      git submodule update --init --recursive
      python3 -m build

  - runs: |
      # Setup the virtualenv
      python -m venv .venv --system-site-packages

      # Remediate  CVE-2022-40897, GHSA-r9hx-vwmv-q579
      .venv/bin/pip install --upgrade setuptools==65.5.1

      .venv/bin/pip install --ignore-installed --no-compile dist/*.whl

      # For some reason numpy isn't installed by default but is required.
      .venv/bin/pip install --ignore-installed --no-compile requests numpy==1.26.2

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/pytorch
      mv .venv ${{targets.destdir}}/usr/share/pytorch/

      # edit the venv paths
      sed -i "s|/home/build|/usr/share/pytorch|g" ${{targets.destdir}}/usr/share/pytorch/.venv/bin/*

      # allow site-packages
      sed -i "s|include-system-site-packages = false|include-system-site-packages = true|g" ${{targets.destdir}}/usr/share/pytorch/.venv/pyvenv.cfg

subpackages:
  # This is a version of pytorch installed by itself into site-packages
  - name: py3.11-pytorch-cuda12
    options:
      no-depends: true
    pipeline:
      - runs: |
          python -m installer -d ${{targets.subpkgdir}}/ dist/*.whl
          find ${{targets.subpkgdir}} -name "*.pyc" -exec rm -rf '{}' +

update:
  enabled: true
  github:
    identifier: pytorch/pytorch
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - wolfi-base
        - busybox
  pipeline:
    - runs: |
        export PATH=/usr/share/pytorch/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

        python3 -c "import torch"
