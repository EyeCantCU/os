package:
  name: linux
  version: 6.9.6
  epoch: 0
  description: "the linux kernel"
  copyright:
    - license: GPL-2.0

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - elfutils
      - elfutils-dev
      - findutils
      - flex
      - openssl-dev
      - perl
      - python3
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gregkh/linux
      tag: v${{package.version}}
      expected-commit: 9c5a72fbc90d829ffb761da64a73c23cd4e0503f

  - runs: |
      set -x
      # Make a kernel
      # TODO: Much work to be done, tailoring a kernel config (or, more likely, a set of kernel configs)
      # TODO: But as a starting point, let's start with the default config, plus kvm_guest, plus hardening options
      make defconfig
      make kvm_guest.config
      make hardening.config
      #echo CONFIG_VERSION_SIGNATURE=\"Chainguard Wolfi Linux $(uname -m)-${{package.version}}-${{package.epoch}}\" >> .config
      # Build the Linux Kernel
      make -j $(nproc)
      mkdir -p ${{targets.destdir}}/boot
      cp -a .config ${{targets.destdir}}/boot/config-$(uname -m)-${{package.version}}-${{package.epoch}}
      chmod 644 ${{targets.destdir}}/boot/config-$(uname -m)-${{package.version}}-${{package.epoch}}
      cp -a $(find . -type f \( -name bzImage -or -name Image.gz \) -print -quit) ${{targets.destdir}}/boot/vmlinuz-$(uname -m)-${{package.version}}-${{package.epoch}}
      chmod 600 ${{targets.destdir}}/boot/vmlinuz-$(uname -m)-${{package.version}}-${{package.epoch}}
      ( cd ${{targets.destdir}}/boot && ln -sf vmlinuz-$(uname -m)-${{package.version}}-${{package.epoch}} vmlinuz )

test:
  pipeline:
    - runs: |
        # Just a dumb test for now...see if we have a file at /boot/vmlinuz
        [ -e /boot/vmlinuz ]
        # TODO: once we merge our qemu package, we could actually boot a kernel and run the LTP

update:
  enabled: true
  github:
    identifier: gregkh/linux
    use-tag: true
    strip-prefix: v
    tag-filter: v
