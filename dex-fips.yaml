package:
  name: dex-fips
  version: "2.42.1"
  epoch: 1
  description: "OpenID Connect (OIDC) identity and OAuth 2.0 provider with pluggable connectors"
  copyright:
    - license: Apache-2.0

pipeline:
  # We can't use go/install because this requires a specific go version
  - uses: git-checkout
    with:
      repository: https://github.com/dexidp/dex
      tag: v${{package.version}}
      expected-commit: 4c3e83b90135339575b66d7cf878fb1a6326c243

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v4@v4.0.5
        golang.org/x/oauth2@v0.27.0
        golang.org/x/crypto@v0.35.0
        golang.org/x/net@v0.38.0
      modroot: .

  - uses: go/build
    with:
      go-package: go-fips
      modroot: .
      output: "dex"
      packages: ./cmd/dex
      ldflags: "-X main.version=v${{package.version}}"

  - uses: go/build
    with:
      go-package: go-fips
      modroot: .
      output: "docker-entrypoint"
      packages: ./cmd/docker-entrypoint
      ldflags: "-X main.version=v${{package.version}}"

  - runs: |
      mkdir -p ${{targets.destdir}}/srv/dex
      mkdir -p ${{targets.destdir}}/etc/dex
      mkdir -p ${{targets.destdir}}/var/dex

      mv web ${{targets.destdir}}/srv/dex/
      mv config.docker.yaml ${{targets.destdir}}/etc/dex/

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        dex version
        dex --help

update:
  enabled: true
  github:
    identifier: dexidp/dex
    strip-prefix: v
    tag-filter: v
