package:
  name: aws-c-cal-fips
  version: "0.9.3"
  epoch: 0
  description: "AWS Crypto Abstraction Layer: Cross-Platform, C99 wrapper for cryptography primitives (FIPS)"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - aws-lc-fips
    provider-priority: 20

vars:
  aws-lc-lib-dir: /usr/lib/aws-lc
  aws-lc-include-dir: /usr/include/aws-lc
  aws-lc-crypto-lib: /usr/lib/aws-lc/libcrypto.so

environment:
  contents:
    packages:
      - aws-c-common-dev
      - aws-lc-fips-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - samurai
  environment:
    CMAKE_PREFIX_PATH: ${{vars.aws-lc-lib-dir}}
    CFLAGS: "-I${{vars.aws-lc-include-dir}}"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: cdd052bf0ac38d72177d6376ea668755fca13df4
      repository: https://github.com/awslabs/aws-c-cal
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: |
        aws-lc-fips-compat.patch

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_PREFIX_PATH=/usr \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_INSTALL_RPATH=${{vars.aws-lc-lib-dir}} \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DUSE_OPENSSL=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux \

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-cal-fips
      provider-priority: 20
    description: aws-c-cal-fips dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-cal
    strip-prefix: v
    use-tag: true
