#nolint:git-checkout-must-use-github-updates
package:
  name: ffnvcodec
  version: "13.0.19.0"
  epoch: 1
  description: ffmpeg nvidia codec sdk wrapper
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - nvidia-codec-sdk
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.videolan.org/git/ffmpeg/nv-codec-headers.git
      expected-commit: e844e5b26f46bb77479f063029595293aa8f812d
      tag: n${{package.version}}
      depth: 1

  - runs: |
      make install PREFIX=/usr DESTDIR="${{targets.destdir}}"

  - uses: strip

test:
  pipeline:
    - uses: test/pkgconf

update:
  enabled: true
  release-monitor:
    identifier: 223796
