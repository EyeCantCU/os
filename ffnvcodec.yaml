package:
  name: ffnvcodec
  version: 12.1.14.0
  epoch: 0
  description: ffmpeg nvidia codec sdk wrapper
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - wolfi-base
      - build-base
      - nvidia-codec-sdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.videolan.org/git/ffmpeg/nv-codec-headers.git
      expected-commit: 1889e62e2d35ff7aa9baca2bceb14f053785e6f1
      tag: n${{package.version}}
      depth: 1

  - runs: |
      make install PREFIX=/usr DESTDIR="${{targets.destdir}}"

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 223796
