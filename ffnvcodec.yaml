#nolint:git-checkout-must-use-github-updates
package:
  name: ffnvcodec
  version: 12.2.72.0
  epoch: 0
  description: ffmpeg nvidia codec sdk wrapper
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - wolfi-base
      - build-base
      - nvidia-codec-sdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.videolan.org/git/ffmpeg/nv-codec-headers.git
      expected-commit: c69278340ab1d5559c7d7bf0edf615dc33ddbba7
      tag: n${{package.version}}
      depth: 1

  - runs: |
      make install PREFIX=/usr DESTDIR="${{targets.destdir}}"

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 223796
