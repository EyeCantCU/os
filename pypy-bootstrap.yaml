package:
  name: pypy-bootstrap
  epoch: 0
  version: 7.3.18
  copyright:
    - license: Apache-2.0
  options:
    no-depends: true
    no-provides: true
  dependencies:
    runtime:
      - bzip2-dev
      - ncurses

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - bzip2-dev
      - expat-dev
      - gdbm-dev
      - linux-headers
      - ncurses-dev
      - openssl-dev>3
      - perl
      - posix-libc-utils
      - readline-dev
      - rpcgen
      - rsync
      - sqlite-dev
      - tk-dev
      - util-linux-misc
      - wget
      - xz-dev
      - zlib-dev
      - libx11-dev
      - libffi-a
      - tcl-dev

pipeline:
  - uses: git-checkout
    working-directory: python
    with:
      repository: https://github.com/python/cpython.git
      tag: v2.7.18
      expected-commit: 8d21aa21f2cbc6d50aab3f420bb23be1d081dac4

  - runs: rm -r python/Modules/expat python/Modules/_ctypes/libffi* python/Modules/zlib

  - uses: autoconf/configure
    working-directory: python
    with:
      opts: |
        --enable-ipv6 \
        --enable-shared \
        --enable-unicode=ucs4 \
        --with-system-expat \
        --with-system-ffi \
        --with-system-zlib \
        --with-threads

  - working-directory: python
    runs: make LD_RUN_PATH="${{targets.destdir}}/usr/lib"

  - uses: autoconf/make-install
    working-directory: python

  - uses: git-checkout
    working-directory: pycparser
    with:
      repository: https://github.com/eliben/pycparser.git
      ## v2.21 is the last version of pycparser with python2.7 compatibility. v2.22 expects python3
      tag: release_v2.21
      expected-commit: 3cf6bf5eb16f5eadd4a058e41596145c407a79ad

  - working-directory: pycparser
    runs: |
      export LD_LIBRARY_PATH=${{targets.destdir}}/usr/lib:$LD_LIBRARY_PATH
      ${{targets.destdir}}/usr/bin/python setup.py install

  - uses: git-checkout
    with:
      repository: https://github.com/pypy/pypy.git
      tag: release-pypy2.7-v${{package.version}}
      expected-commit: 639309b2bd147c86b8907350f38a37d7d3f49703

  - uses: patch
    with:
      patches: 0001-fix-correct-type-casting-in-vmp_stack.c-and-add-PATH.patch 0001-fix-update-type-casting-for-result-in-vmp_walk_and_r.patch

  - working-directory: pypy/goal
    runs: |
      ${{targets.destdir}}/usr/bin/python ../../rpython/bin/rpython --opt=jit --shared targetpypystandalone

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/lib/pypy/bin/pypy-c
      mkdir -p ${{targets.contextdir}}/usr/lib/pypy/lib_pypy
      cp pypy/goal/pypy3.11-c "${{targets.contextdir}}"/usr/lib/pypy/bin/
      cp pypy/goal/libpypy3.11-c.so "${{targets.contextdir}}"/usr/lib/pypy/bin/

      rsync -r --exclude='__pycache__' --exclude='test' --exclude='tests' lib-python/ "${{targets.contextdir}}"/usr/lib/pypy/lib-python/
      rsync -r --exclude='__pycache__' --exclude='*.c' --exclude '*.o' lib_pypy/ "${{targets.contextdir}}"/usr/lib/pypy/lib_pypy/
      rsync -r --include='*.h' -f 'hide,! */' include/ "${{targets.contextdir}}"/usr/lib/pypy/include/

      # Install symlinks
      ln -s "${{targets.destdir}}"/usr/lib/pypy/bin/pypy3.11-c ${{targets.contextdir}}/usr/bin/pypy
      ln -s "${{targets.destdir}}"/usr/lib/pypy/bin/libpypy3.11-c.so ${{targets.contextdir}}/usr/lib/pypy/bin/libpypy-c.so

update:
  enabled: true
  github:
    identifier: pypy/pypy
    strip-prefix: v
    tag-filter-prefix: release-pypy3.11-v

test:
  pipeline:
    - runs: pypy --version
