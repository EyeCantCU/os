package:
  name: py3-soxr
  version: 0.5.0
  epoch: 0
  description: High quality, one-dimensional sample-rate conversion library for Python.
  copyright:
    - license: LGPL-2.1-only

vars:
  pypi-package: soxr

environment:
  contents:
    packages:
      - cmake
      - py3-supported-build-base-dev
      - py3-supported-nanobind
      - py3-supported-scikit-build-core

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dofuuz/python-soxr.git
      tag: v${{package.version}}
      expected-commit: 9046710d249c008ad0cf764eaeff80e08bad9e58
      recurse-submodules: true

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-numpy-2.2
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | grep -F -e "resampled: (625, 2)"
            import numpy as np
            import soxr

            SOURCE_RATE = 2400
            TARGET_RATE = 1500
            LEN = 1000

            # generate source signal
            ch1 = np.sin(np.pi / 120 * np.arange(LEN))
            ch2 = np.sin(np.pi / 180 * np.arange(LEN))
            x = np.asarray([ch1, ch2]).T
            print(f'source: {x.shape}')

            # Resample signal
            y = soxr.resample(x, SOURCE_RATE, TARGET_RATE)
            print(f'resampled: {y.shape}')
            EOF

update:
  enabled: true
  ignore-regex-patterns:
    - -b
    - -a
    - -post
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
