package:
  name: py3-pooch
  version: 1.8.2
  epoch: 0
  description: Python library that can manage data by downloading files from a server
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: pooch

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fatiando/pooch.git
      tag: v${{package.version}}
      expected-commit: dfc69386753e3793b6960301a00c90b71656bf6f

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-packaging
        - py${{range.key}}-platformdirs
        - py${{range.key}}-requests
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            # Just for the example
            - py${{range.key}}-pandas
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | grep -F -e "['survey_id', 'latitude', 'longitude', 'depth_m']"
            import pooch
            import pandas as pd

            # Download a file and save it locally, returning the path to it.
            # Running this again will not cause a download. Pooch will check the hash
            # (checksum) of the downloaded file against the given value to make sure
            # it's the right file (not corrupted or outdated).
            fname_bathymetry = pooch.retrieve(
                url="https://github.com/fatiando-data/caribbean-bathymetry/releases/download/v1/caribbean-bathymetry.csv.xz",
                known_hash="md5:a7332aa6e69c77d49d7fb54b764caa82",
            )

            # Load the data with Pandas
            print(pd.read_csv(fname_bathymetry).columns.tolist())
            EOF

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
