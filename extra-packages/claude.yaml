package:
  name: claude
  version: "2.1.25"
  epoch: 0
  description: Claude Code Installer
  copyright:
    - license: PROPRIETARY
  dependencies:
    runtime:
      - bash
      - busybox
      - coreutils
      - curl
      - git
      - nodejs-23
      - npm
      - openssh-client
      - python3
      - ripgrep

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - runs: |
      # Install the binary, proprietary claude-code from npm
      # into ~/.claude/local as happens if you did a `-g` install and then
      # ran `/migrate-installer`
      # Each user gets their own claude installation,
      # which is how claude wants it.
      fpath="${{targets.destdir}}/usr/bin/claude"
      mkdir -p "$(dirname "$fpath")"

      cat >"$fpath" <<"EOF"
      #!/bin/bash
      # shellcheck disable=SC2064,SC3043
      set -e
      version="${{package.version}}"
      bdir="$HOME/.local/bin"
      exe="$bdir/claude"

      fail() { msg "FATAL:" "$@"; exit 1; }
      msg() { echo "[$0]" "$@" 1>&2; }

      _install() {
          local ver=${1:-stable} tmpf="" url="https://claude.ai/install.sh"
          tmpf=$(mktemp "${TMPDIR:-/tmp}/${0##*/}.XXXXXX") ||
              fail "failed to create tmpdir"
          trap "rm -f '$tmpf'" EXIT
          curl -fsSL "$url" > "$tmpf" ||
              fail "download failed (curl -fsSL $url)"
          msg "installing claude from $url at version $ver"
          bash "$tmpf" "$ver" || fail "installation failed"
          [ -x "$exe" ] ||
              fail "installation of $url at $ver did not produce $exe"
      }

      export PATH="$bdir:$PATH"
      if [ ! -x "$exe" ]; then
          _install "$version"
      fi

      exec "$exe" "$@"
      EOF
      chmod 755 "$fpath"

update:
  enabled: true
  release-monitor:
    identifier: 377805

test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: claude
        help-flag: "--help"
        expect-contains: "Claude Code"
    - uses: test/tw/ver-check
      with:
        bins: claude
        version-flag: "--version"
