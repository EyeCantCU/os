package:
  name: vault-secrets-operator
  version: "1.0.1"
  epoch: 3 # GHSA-j5w8-q4qc-rx2x
  description: The Vault Secrets Operator (VSO) allows Pods to consume Vault secrets natively from Kubernetes Secrets.
  copyright:
    - license: BUSL-1.1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/vault-secrets-operator
      tag: v${{package.version}}
      expected-commit: b9a325c2ca8fbf24d15cb450ab11a01d2c023e56

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: .
      modroot: .
      output: vault-secrets-operator
      ldflags: '$(bash ./scripts/ldflags-version.sh)'

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"
          ln -sf /usr/bin/vault-secrets-operator "${{targets.contextdir}}"/vault-secrets-operator
          mkdir "${{targets.contextdir}}"/scripts
          cp -r chart/crds "${{targets.contextdir}}"/scripts/
          ln -s /vault-secrets-operator "${{targets.contextdir}}"/scripts/upgrade-crds
          mkdir "${{targets.contextdir}}"/licenses
          cp LICENSE "${{targets.contextdir}}"/licenses/copyright.txt
          mkdir -p "${{targets.contextdir}}"/usr/share/doc/${{package.name}}
          cp LICENSE "${{targets.contextdir}}"/usr/share/doc/${{package.name}}/LICENSE.txt

update:
  enabled: true
  github:
    identifier: hashicorp/vault-secrets-operator
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - jq
        - curl
        - vault
        - vault-secrets-operator-compat
    environment:
      VAULT_TOKEN: root
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: http://127.0.0.1:8200
  pipeline:
    - uses: test/kwok/cluster
    - name: Install, configure, and add a secret to vault
      runs: |
        vault server -dev -dev-root-token-id $VAULT_TOKEN -dev-listen-address="0.0.0.0:8200" > {{package.name}}.log 2>&1 &
        sleep 3s # vault startup
        vault auth enable approle
        vault secrets enable -path=kvv2 kv-v2
        vault policy write webapp - <<EOF
        path "kvv2/data/webapp/config" {
          capabilities = ["read", "list", "update", "create"]
        }
        EOF
        vault write auth/approle/role/role1 \
          policies=webapp \
          ttl=24h
        vault kv put kvv2/webapp/config username="static-user" password="static-password" > {{package.name}}.log 2>&1
    - name: Setup resources needed by vault-secrets-operator
      runs: |
        kubectl create ns vault-secrets-operator
        kubectl create -f /scripts/crds/
        export ROLE_ID=$(curl -s --header "X-Vault-Token: $VAULT_TOKEN" $VAULT_ADDR/v1/auth/approle/role/role1/role-id | jq -r .data.role_id)
        export SECRET_ID=$(curl -s --header "X-Vault-Token: $VAULT_TOKEN" --request POST  $VAULT_ADDR/v1/auth/approle/role/role1/secret-id | jq -r .data.secret_id)
        kubectl create secret -n default generic role-secret --from-literal=id=$SECRET_ID
        cat <<-EOF > /tmp/vault-kv-app.yaml
        apiVersion: secrets.hashicorp.com/v1beta1
        kind: VaultStaticSecret
        metadata:
          name: vault-kv-app
          namespace: default
        spec:
          type: kv-v2
          mount: kvv2
          path: webapp/config
          destination:
            name: secretkv
            create: true
          refreshAfter: 1s
          vaultAuthRef: static-auth
        EOF
        kubectl apply -f /tmp/vault-kv-app.yaml
        cat <<-EOF > /tmp/vaultconnection-default.yaml
        apiVersion: secrets.hashicorp.com/v1beta1
        kind: VaultConnection
        metadata:
          name: default
          namespace: default
        spec:
          address: $VAULT_ADDR
          skipTLSVerify: true
        EOF
        kubectl apply -f /tmp/vaultconnection-default.yaml
        cat <<-EOF > /tmp/vaultauth-static-auth.yaml
        apiVersion: secrets.hashicorp.com/v1beta1
        kind: VaultAuth
        metadata:
          name: static-auth
          namespace: default
        spec:
          method: appRole
          appRole:
            roleId: $ROLE_ID
            secretRef: role-secret
          vaultConnectionRef: default
          mount: approle
        EOF
        kubectl apply -f /tmp/vaultauth-static-auth.yaml
    - name: Run vault-secrets-operator and verify operation
      runs: |
        /vault-secrets-operator -kubeconfig $HOME/.kube/config -leader-elect=false > {{package.name}}.log 2>&1 &
        sleep 3s # vault-secrets-operator startup and secret syncing
        username=$(kubectl get secret secretkv -n default -o jsonpath='{.data.username}' | base64 -d)
        password=$(kubectl get secret secretkv -n default -o jsonpath='{.data.password}' | base64 -d)

        if [[ "$username" == "static-user" && "$password" == "static-password" ]]; then
          echo "Secret found! Test is successful"
          exit 0
        else
          echo "Secret values do not match. Test failed."
          exit 1
        fi
