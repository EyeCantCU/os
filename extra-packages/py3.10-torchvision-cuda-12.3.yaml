package:
  name: py3.10-torchvision-cuda-12.3
  version: 0.18.1
  epoch: 9
  description: Datasets, Transforms and Models specific to Computer Vision
  copyright:
    - license: BSD-3-Clause
  target-architecture:
    - x86_64
  resources:
    cpu: 16
    memory: 16Gi
  options:
    no-depends: true
  dependencies:
    provides:
      - torchvision-cuda-12.3=${{package.version}}
      - torchvision-cuda-12=${{package.version}}
    runtime:
      - cuda-toolkit-12.3
      # For some reason this isn't detected
      - libgomp
      - libjpeg-turbo
      - libpng
      - nvidia-cuda-cudart-12.3
      - nvidia-cuda-cupti-12.3
      - nvidia-cuda-nvrtc-12.3
      - nvidia-cuda-nvtx-12.3
      - nvidia-cudnn-8-cuda-12
      - nvidia-libcublas-12.3
      - nvidia-libcufft-12.3
      - nvidia-libcurand-12.3
      - nvidia-libcusolver-12.3
      - nvidia-libcusparse-12.3
      - nvidia-libnvjitlink-12.3
      - nvidia-nccl-cuda-12.3
      - openmp-17-dev
      - py3.10-numpy
      - py3.10-pyyaml
      - py3.10-typing-extensions

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-15
      - cmake-3
      - coreutils
      - cuda-toolkit-12.3-dev
      - gcc-12-default
      - git
      - libffi-dev
      - libgomp
      - libjpeg-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libpng-utils
      - lld-15
      - llvm-15
      - llvm-15-dev
      - nvidia-cuda-cccl-12.3
      - nvidia-cuda-profiler-api-12.3
      - nvidia-cudnn-8-cuda-12
      - nvidia-nccl-cuda-12.3-dev
      - openmp-17-dev
      - patchelf
      - posix-libc-utils
      - py3.10-installer
      - py3.10-numpy
      - py3.10-pip
      - py3.10-pytorch-cuda-12.3
      - py3.10-setuptools
      - py3.10-wheel
      - python-3.10
      - python-3.10-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/vision.git
      tag: v${{package.version}}
      expected-commit: 126fc22ce33e6c2426edcf9ed540810c178fe9ce

  - name: Python Build
    runs: |
      export CUDA_VERSION="12.3"
      export CUDA_HOME="/usr/local/cuda-${CUDA_VERSION}"
      export PATH="$PATH:${CUDA_HOME}/bin"
      export CMAKE_CUDA_ARCHITECTURES=all
      export USE_CUDA=1
      export FORCE_CUDA=1
      export USE_CUDNN=1
      export TORCH_CUDA_ARCH_LIST="5.2 6.0 6.1 7.0+PTX 8.0 8.6 8.7 8.9 9.0"
      export TORCH_NVCC_FLAGS="-Xfatbin -compress-all"

      [ -d "$CUDA_HOME" ] || { echo "CUDA_HOME ($CUDA_HOME) is not a dir"; exit 1; }

      # Disable some warnings
      export CFLAGS="$CFLAGS -Wno-error=nonnull -Wno-nonnull"
      export CXXFLAGS="$CXXFLAGS -Wno-error=nonnull -Wno-nonnull"

      export BUILD_VERSION="${{package.version}}+cu123"
      /usr/share/pytorch/.venv/bin/pip uninstall -y setuptools

      /usr/share/pytorch/.venv/bin/python setup.py bdist_wheel
      /usr/share/pytorch/.venv/bin/pip install dist/*.whl

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/torchvision
      mv /usr/share/pytorch/.venv ${{targets.destdir}}/usr/share/torchvision/

      # edit the venv paths
      sed -i "s|/usr/share/pytorch|/usr/share/torchvision|g" ${{targets.destdir}}/usr/share/torchvision/.venv/bin/*

      # allow site-packages
      sed -i "s|include-system-sitepackages = false|include-system-site-packages = true|g" ${{targets.destdir}}/usr/share/torchvision/.venv/pyvenv.cfg

subpackages:
  - name: py3.10-wheels-torchvision-cuda-12.3
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/wheels
          cp dist/*.whl ${{targets.contextdir}}/usr/share/wheels

update:
  enabled: true
  github:
    identifier: pytorch/vision
    strip-prefix: v
    tag-filter: v0.18.

test:
  pipeline:
    - runs: |
        export PATH=/usr/share/torchvision/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        python3 -c "import torch"
        python3 -c "import torchvision"
        python3 ./quickstart.py > output.out 2>&1
        grep -E "ERROR|None" output.out && exit 1
