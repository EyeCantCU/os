package:
  name: tensorflow-gpu-jupyter
  version: "2.20.0"
  epoch: 2
  description: tensorflow-gpu
  copyright:
    - license: Apache-2.0
  target-architecture:
    - x86_64
  options:
    # We're creating a virtual environment.
    # Don't pull in other packages if dependencies are already vendored.
    no-depends: true
    # Don't install if something is vendored that another package depends on.
    no-provides: true
  dependencies:
    runtime:
      - bash
      - build-base
      - busybox
      - cuda-toolkit-${{vars.cuda-version}}
      - curl
      - nvidia-cudnn-9-cuda-12
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}
      - unzip

vars:
  python-version: 3.11
  shared: /usr/share/tensorflow
  cuda-version: 12.3

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.python-version}}-pip
      - python-${{vars.python-version}}
  environment:
    SOURCE_DATE_EPOCH: 315532800
    LANG: C.UTF-8

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tensorflow/tensorflow
      tag: v${{package.version}}
      expected-commit: 72fbba3d20f4616d7312b5e2b7f79daf6e82f2fa

  - runs: |
      git clone --depth=1 https://github.com/tensorflow/build tensorflow-build

  - working-directory: tensorflow-build/tensorflow_runtime_dockerfiles
    pipeline:
      - name: Check latest supported Python version
        runs: |
          PYTHON_VERSION=$(grep -E "^ARG PYTHON_VERSION" cpu.Dockerfile | cut -d '=' -f2 | sed 's|python||g')
          test "${{vars.python-version}}" == "${PYTHON_VERSION}" || \
            { echo "error: Python version does not match the latest supported version: want: ${{vars.python-version}} got: ${PYTHON_VERSION} from $(grep -H -n -E '^ARG PYTHON_VERSION' cpu.Dockerfile)" && exit 1; }
      - name: Create virtual environment
        runs: |
          python -m venv .venv
      - name: Install gpu requirements
        runs: |
          source .venv/bin/activate
          pip install \
            --no-cache-dir \
            -r gpu.requirements.txt
      - name: Install Tensorflow
        runs: |
          source .venv/bin/activate
          pip install 'tensorflow[and-cuda]'
      - name: Install jupyter requirements
        runs: |
          source .venv/bin/activate
          pip install \
            --no-cache-dir \
            -r jupyter.requirements.txt \
            -U
          # remediate GHSA-xg8h-j46f-w952
          pip install --upgrade pillow==11.3.0
          # remediate GHSA-36rr-ww3j-vrjv
          pip install --upgrade keras==3.11.3
      - name: Cleanup the virtual environment
        runs: |
          find .venv -name "*.pyc" -delete
          find .venv -name "__pycache__" -exec rm -rf {} +
          find .venv -type d -name "tests" -exec rm -rf {} +
      - name: Install the virtual environment
        runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.shared}}
          mv .venv/* ${{targets.contextdir}}/${{vars.shared}}
          sed -i "s|/home/build/tensorflow-build/tensorflow_runtime_dockerfiles/.venv|${{vars.shared}}|g" ${{targets.contextdir}}/${{vars.shared}}/bin/*
      - name: Install bashrc
        runs: |
          mkdir -p ${{targets.contextdir}}/etc
          cp bashrc ${{targets.contextdir}}/etc/bash.bashrc
      - name: Copy files
        runs: |
          cp gpu.requirements.txt ${{targets.contextdir}}/gpu.requirements.txt
          cp gpu.packages.txt ${{targets.contextdir}}/gpu.packages.txt
          cp setup.cuda.sh ${{targets.contextdir}}/setup.cuda.sh
          cp setup.packages.sh ${{targets.contextdir}}/setup.packages.sh
          cp setup.python.sh  ${{targets.contextdir}}/setup.python.sh
          cp setup.sources.sh ${{targets.contextdir}}/setup.sources.sh

test:
  environment:
    contents:
      packages:
        - curl
    environment:
      PYTHONPATH: ${{vars.shared}}/lib/python${{vars.python-version}}/site-packages
  pipeline:
    - name: Test import of IPython kernel for Jupyter
      runs: |
        python3 -m ipykernel.kernelspec
    - name: Test Tensorflow library
      runs: |
        cat <<"EOF" >test.py
        import tensorflow as tf
        import numpy as np
        from tensorflow.keras import layers, models, datasets

        (x_train, y_train), (x_test, y_test) = datasets.cifar10.load_data()
        x_train, y_train = x_train[:500], y_train[:500]
        x_test, y_test = x_test[:100], y_test[:100]

        x_train, x_test = x_train / 255.0, x_test / 255.0

        x_train = np.array(x_train, dtype=np.float32)
        x_test = np.array(x_test, dtype=np.float32)
        y_train = np.array(y_train, dtype=np.int64).reshape(-1)
        y_test = np.array(y_test, dtype=np.int64).reshape(-1)

        model = models.Sequential([
            layers.Flatten(input_shape=(32, 32, 3)),
            layers.Dense(10, activation='softmax')
        ])

        model.compile(optimizer='adam',
                      loss='sparse_categorical_crossentropy',
                      metrics=['accuracy'])

        print("Training the model on GPU...")
        with tf.device('/GPU:0'):
            history = model.fit(x_train, y_train, epochs=1, batch_size=16)

        test_loss, test_acc = model.evaluate(x_test, y_test, verbose=2)
        print(f"\nTest accuracy: {test_acc * 100:.2f}%")
        EOF
        python test.py
    - name: Test Jupyter notebook run
      uses: test/daemon-check-output
      with:
        start: |
          ${{vars.shared}}/bin/jupyter notebook --notebook-dir=/ --ip 0.0.0.0 --no-browser --allow-root
        post: |
          curl --fail --location --request GET --head --silent localhost:8888
        expected_output: "is running at:"
        timeout: 10

update:
  enabled: true
  github:
    identifier: tensorflow/tensorflow
    use-tag: true
    strip-prefix: v
    tag-filter: v
