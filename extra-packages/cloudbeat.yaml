package:
  name: cloudbeat
  version: "9.1.5"
  epoch: 0 # GHSA-jc7w-c686-c4v9
  description: Cloudbeat is a cloud-native security and compliance monitoring tool for real-time threat detection and policy enforcement across cloud environments.
  copyright:
    - license: Elastic-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/elastic/cloudbeat
      tag: v${{package.version}}
      expected-commit: df4c063179d913610aa3844e0c7c9bb5e70330a4

  - uses: go/bump
    with:
      deps: |-
        helm.sh/helm/v3@v3.18.5
        github.com/hashicorp/go-getter@v1.7.9
        github.com/go-viper/mapstructure/v2@v2.4.0
        github.com/ulikunitz/xz@v0.5.14

  - uses: go/build
    with:
      packages: .
      output: cloudbeat
      ldflags: -X 'github.com/elastic/cloudbeat/build.Version=${{package.version}}' -X 'github.com/elastic/cloudbeat/build.CommitSHA=$(git rev-parse HEAD)'

  - uses: strip

  - name: copy cloudbeat.yml
    runs: |
      mkdir -p ${{targets.destdir}}/usr/share/cloudbeat
      cp cloudbeat.yml ${{targets.destdir}}/usr/share/cloudbeat/cloudbeat.yml

update:
  enabled: true
  github:
    strip-prefix: v
    identifier: elastic/cloudbeat
    use-tag: true

test:
  environment:
    accounts:
      users:
        - username: elasticsearch
          uid: 1000
          gid: 0
      run-as: 0
    contents:
      packages:
        - bash
        - curl
        - elasticsearch-8
        - jq
        - kibana-8
        - sudo
        - wait-for-it
    environment:
      ELASTICSEARCH_HOSTS: localhost:9200
      ES_JAVA_HOME: /usr/lib/jvm/java-17-openjdk
  pipeline:
    - name: Test cloudbeat setup
      runs: |
        chown -R elasticsearch:root /usr/share/elasticsearch
        sudo -E -u elasticsearch /usr/share/elasticsearch/bin/elasticsearch -d \
          -Ediscovery.type=single-node \
          -Expack.security.enabled=false \
          -p /tmp/elasticsearch.pid > /dev/null 2>&1 &
        wait-for-it localhost:9200 --timeout=60
        # Confirm Elasticsearch status before continuing
        es_status=$(curl -s -X GET "http://localhost:9200/_cluster/health?pretty" | jq -r '.status')
        echo "Elasticsearch status: $es_status"
        timer_start=$(date +%s)
        while [ $es_status != "green" ]
        do
          timer_now=$(date +%s)
          es_status=$(curl -s -X GET "http://localhost:9200/_cluster/health?pretty" | jq -r '.status')
          echo "Elasticsearch status: $es_status"
          if [ $(( timer_now - timer_start )) -gt 60 ]
          then
            echo "Timed out waiting for Elasticsearch!"
            exit 1
          fi
          sleep 2
        done
        # Run Kibana
        echo -e "elasticsearch.hosts: [\"http://localhost:9200\"]" > kibana.yml
        (
          /usr/share/kibana/bin/kibana --config kibana.yml --allow-root 2>&1 > tee kibana.log 2>&1 &
        ) &
        wait-for-it localhost:5601 --timeout=60

        export KUBERNETES_MASTER="https://127.0.0.1:32764"
        export NODE_NAME="node-000000"
        export KUBECONFIG="/root/.kube/config"
        curl -o cloudbeat.yml https://raw.githubusercontent.com/elastic/cloudbeat/refs/heads/main/cloudbeat.yml
        sleep 1

        cloudbeat > /dev/null 2>&1 &
        sleep 60
        grep -E '"name":"cloudbeat"|\"version\":\"${{package.version}}\"' logs/cloudbeat-*
