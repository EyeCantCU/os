package:
  name: nvidia-cuda-opencl-12.8
  version: "12.8.90"
  epoch: 5 # go/extras-rsc/nvidia-cuda-opencl-12.8
  description: CUDA OpenCL
  copyright:
    - license: LicenseRef-NVIDIA-CUDA-opencl
      license-path: LICENSE
  target-architecture:
    - x86_64
  dependencies:
    provides:
      - nvidia-cuda-opencl=${{package.full-version}}
    runtime:
      - nvidia-cuda-ld-config-${{vars.cuda-version}}
  resources:
    cpu: "3"
    memory: 13Gi

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_opencl/linux-x86_64/cuda_opencl-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "093c1264b9f3fb9a53b78b76ab8c1babd2aab8872149d968b58d642170a62bde"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv include ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv lib ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/lib64
      cp LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/pkgconfig/
      mv pkg-config/* ${{targets.destdir}}/usr/share/pkgconfig/
      sed -i 's|targets/.*-linux/||g' ${{targets.destdir}}/usr/share/pkgconfig/*

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - nvidia-cuda-opencl-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: test/pkgconf

update:
  enabled: false

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: nvidia-cuda-opencl
        real-pkg-name: ${{package.name}}
