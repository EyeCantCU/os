package:
  name: nvidia-cuda-nvprof-11.7
  version: 11.7.101
  epoch: 3 # go/extras-rsc/nvidia-cuda-nvprof-11.7
  description: CUDA nvprof
  copyright:
    - license: PROPRIETARY
  target-architecture:
    - x86_64
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-cuda-nvprof=${{package.full-version}}
    runtime:
      - nvidia-cuda-ld-config-${{vars.cuda-version}}
  resources:
    cpu: "1"
    memory: 4Gi

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvprof/linux-x86_64/cuda_nvprof-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "028c9ae359e037fd8b3b7976304821704818d141284e8878577061dc41e19afe"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv bin ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv lib ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/pkgconfig/
      mv pkg-config/* ${{targets.destdir}}/usr/share/pkgconfig/
      sed -i 's|targets/.*-linux/||g' ${{targets.destdir}}/usr/share/pkgconfig/*

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}

test:
  pipeline:
    - uses: test/pkgconf
    - name: Verify nvprof installation, libraries, and license
      runs: |
        test -x /usr/local/cuda-${{vars.cuda-version}}/bin/nvprof
        test -d /usr/local/cuda-${{vars.cuda-version}}/lib64
        test -f /usr/local/cuda-${{vars.cuda-version}}/nvidia-cuda-nvprof-${{vars.cuda-version}}.LICENSE
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: nvidia-cuda-nvprof
        real-pkg-name: ${{package.name}}

update:
  enabled: false
