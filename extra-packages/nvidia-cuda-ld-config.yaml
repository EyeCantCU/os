package:
  name: nvidia-cuda-ld-config
  version: 1
  epoch: 8
  description: Runtime linker configuration for NVIDIA CUDA libraries
  copyright:
    - license: BSD-3-Clause
  options:
    no-depends: true
    no-provides: true

data:
  - name: cuda-major-versions
    items:
      11:
      12:
      13:

  - name: cuda-versions
    items:
      11.4:
      11.5:
      11.6:
      11.7:
      11.8:
      12.0:
      12.1:
      12.2:
      12.3:
      12.4:
      12.5:
      12.6:
      12.8:
      12.9:
      13.0:
      13.1:

environment:
  contents:
    packages:
      - busybox
      - wolfi-base

pipeline:
  - name: Without this, subpackages don't build.

subpackages:
  - range: cuda-versions
    name: nvidia-cuda-ld-config-${{range.key}}
    description: Runtime linker configuration for NVIDIA CUDA ${{range.key}} libraries
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/etc/ld.so.conf.d
          echo "/usr/local/cuda-${{range.key}}/lib64" > \
            "${{targets.contextdir}}"/etc/ld.so.conf.d/cuda-${{range.key}}.conf

  - range: cuda-major-versions
    name: nvidia-cuda-ld-config-${{range.key}}
    description: Runtime linker configuration for NVIDIA CUDA ${{range.key}} libraries
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/etc/ld.so.conf.d
          echo "/usr/local/cuda-${{range.key}}/lib64" > \
            "${{targets.contextdir}}"/etc/ld.so.conf.d/cuda-${{range.key}}.conf

  - range: cuda-versions
    name: nvidia-cuda-ld-config-${{range.key}}-dev
    description: Linker configuration for NVIDIA CUDA ${{range.key}} libraries for build/test time (only!)
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/etc/ld.so.conf.d
          echo "/usr/local/cuda-${{range.key}}/lib64/stubs" > \
            "${{targets.contextdir}}"/etc/ld.so.conf.d/cuda-${{range.key}}-dev.conf

update:
  enabled: false # this is the upstream

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
