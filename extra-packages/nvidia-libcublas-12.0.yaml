package:
  name: nvidia-libcublas-12.0
  version: 12.0.2.224
  epoch: 4
  description: CUDA cuBLAS
  copyright:
    - license: LicenseRef-NVIDIA-CUDA-libcublas
      license-path: LICENSE
  dependencies:
    runtime:
      - nvidia-cuda-ld-config-${{vars.cuda-version}}

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/libcublas/linux-sbsa/libcublas-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "024561f702d72795f69a8c2a481da8961c85b954c43a3cb9ad66dd6f01ffbf65"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/libcublas/linux-x86_64/libcublas-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "67f9d7f639762685a93a8d3a12b8625084749fade6a887323fbb53bf6fefc81b"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv include ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv lib ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/lib64
      cp LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/pkgconfig/
      mv pkg-config/* ${{targets.destdir}}/usr/share/pkgconfig/
      sed -i 's|targets/.*-linux/||g' ${{targets.destdir}}/usr/share/pkgconfig/*

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/pkgconf

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false

test:
  pipeline:
    - runs: |
        readlink -v /usr/local/cuda-12.0/lib64/libcublas.so
        readlink -v /usr/local/cuda-12.0/lib64/libcublas.so.12
        readlink -v /usr/local/cuda-12.0/lib64/libcublasLt.so
        readlink -v /usr/local/cuda-12.0/lib64/libcublasLt.so.12
        readlink -v /usr/local/cuda-12.0/lib64/libnvblas.so
        readlink -v /usr/local/cuda-12.0/lib64/libnvblas.so.12
