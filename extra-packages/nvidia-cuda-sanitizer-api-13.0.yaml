package:
  name: nvidia-cuda-sanitizer-api-13.0
  version: "13.0.85"
  epoch: 1
  description: CUDA Compute Sanitizer API
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-cuda-sanitizer-api=${{package.full-version}}
    runtime:
      - nvidia-cuda-ld-config-${{vars.cuda-version}}

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_sanitizer_api/linux-sbsa/cuda_sanitizer_api-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "68cc7d0144cdf746d4e76565dca86002979ecab5c5674be01bb3fbd3628531e5"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_sanitizer_api/linux-x86_64/cuda_sanitizer_api-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "8eeba425f66fdd17e78d0dff49baa8b3e4599fc0579984eab7ad9c486a95ebf2"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv bin ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv compute-sanitizer ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE

subpackages:
  - name: ${{package.name}}-docs
    description: ${{package.name}} docs
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/cuda-${{vars.cuda-version}}/compute-sanitizer
          mv ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/compute-sanitizer/docs ${{targets.contextdir}}/usr/local/cuda-${{vars.cuda-version}}/compute-sanitizer
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: "/usr/local/cuda-13.0/compute-sanitizer/docs/api/"
            name: "*.html"

  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/tw/devpackage

test:
  pipeline:
    - name: Run --help and --version
      runs: |
        /usr/local/cuda-${{vars.cuda-version}}/compute-sanitizer/compute-sanitizer --help
        /usr/local/cuda-${{vars.cuda-version}}/compute-sanitizer/compute-sanitizer --version
    - name: Verify the license
      runs: |
        if [ ! -f /usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE ]; then
          echo "License file not found"
          exit 1
        fi
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: nvidia-cuda-sanitizer-api
        real-pkg-name: ${{package.name}}

update:
  enabled: false
