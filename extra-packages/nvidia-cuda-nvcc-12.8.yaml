package:
  name: nvidia-cuda-nvcc-12.8
  version: "12.8.93"
  epoch: 3
  description: CUDA NVCC
  copyright:
    - license: PROPRIETARY
  dependencies:
    runtime:
      - nvidia-cuda-ld-config-${{vars.cuda-version}}

environment:
  contents:
    packages:
      - busybox

vars:
  gcc-major-version: 14

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/linux-sbsa/cuda_nvcc-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "dc0b713ce69fd921aa53ac68610717d126fc273a3c554b0465cf44d7e379f467"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/linux-x86_64/cuda_nvcc-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "9961b3484b6b71314063709a4f9529654f96782ad39e72bf1e00f070db8210d3"
          timeout: 30

  # Without this patch nvcc will not work with glibc 2.41 an newer, as their
  # recently added C23 math functions conflict with CUDA header definitions.
  # glibc 2.42 introduced the same problem with yet another math function.
  - uses: patch
    with:
      patches: math_functions_glibc_2.41.patch math_functions_glibc_2.42.patch

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv include ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv lib ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE
      mv bin ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv nvvm ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/

  - runs: |
      # Symlink the binaries onto the normal path
      mkdir -p ${{targets.destdir}}/usr/bin/
      for i in ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/nvcc/bin/*; do
        [ -f "$i" ] && [ -x "$i" ] && ln -sf /usr/local/cuda-${{vars.cuda-version}}/nvcc/bin/$(basename "$i") ${{targets.destdir}}/usr/bin/
      done

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}

  - name: nvidia-cuda-nvcc-gcc-${{vars.cuda-version}}
    description: ${{package.name}} configured to use compatible gcc
    dependencies:
      runtime:
        - ${{package.name}}
        - gcc-${{vars.gcc-major-version}}
    pipeline:
      - runs: |
          cuda_home="/usr/local/cuda-${{vars.cuda-version}}"
          mkdir -p "${{targets.contextdir}}$cuda_home/bin"
          for cmd in gcc g++; do
            wrapper="${{targets.contextdir}}$cuda_home/bin/$cmd"
            cat > "$wrapper" << EOF
          #!/bin/sh
          exec ${cmd}-${{vars.gcc-major-version}} "\$@"
          EOF
            chmod +x "$wrapper"
          done
    test:
      environment:
        contents:
          packages:
            - nvidia-cuda-cudart-${{vars.cuda-version}}-dev
            - nvidia-cuda-nvcc-${{vars.cuda-version}}-dev
      pipeline:
        - runs: |
            cuda_home="/usr/local/cuda-${{vars.cuda-version}}"
            tmpdir="$(mktemp -d)"
            trap "rm -rf $tmpdir" EXIT
            cd "$tmpdir"
            cat > gcc-version.cu << EOF
            #include <iostream>

            int main() {
              std::cout << __GNUC__ << "\n";
            }
            EOF
            "$cuda_home/bin/nvcc" gcc-version.cu -o gcc-version
            [ "$(./gcc-version)" = "${{vars.gcc-major-version}}" ]

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false

test:
  pipeline:
    - uses: test/tw/ldd-check
