name: Backfill packages to apk.cgr.dev

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backfill-packages.txt"

permissions: {}

jobs:
  backfill:
    name: Backfill packages
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: step-security/google-github-auth@f0e5c257a9534a30b5df12f43329c1eb7b85a5be # v3.0.0
        with:
          workload_identity_provider: "projects/618116202522/locations/global/workloadIdentityPools/prod-shared-e350/providers/prod-shared-gha"
          service_account: "prod-images-ci@prod-images-c6e5.iam.gserviceaccount.com"
      - uses: google-github-actions/setup-gcloud@cb1e50a9932213ecece00a606661ae9ca44f3397 # v2.2.0
        with:
          project_id: "prod-images-c6e5"
      - uses: chainguard-dev/setup-chainctl@be0acd273acf04bfdf91f51198327e719f6af978 # v0.4.0
        with:
          # Managed here:
          # https://github.com/chainguard-dev/mono/blob/main/env/chainguard-images/iac/extra-pusher.tf
          identity: "6ffbe9dcb0b1efade8885c9e7658e4f5bbd47a4a/029252d6adaf9bb7"
      - name: 'Backfill packages to apk.cgr.dev'
        run: |
          set -e
          # Populate the token here, since chainctl auth token
          # doesn't support all of the options we need.
          chainctl auth login --audience apk.cgr.dev \
            --identity "6ffbe9dcb0b1efade8885c9e7658e4f5bbd47a4a/029252d6adaf9bb7"
          echo "::add-mask::$(chainctl auth token --audience apk.cgr.dev)"

          for arch in "aarch64" "x86_64"; do
            echo "Processing ${arch}"
            while IFS= read -r pkg; do
              # Ignore empty lines and comments
              if [[ -z "${pkg}" ]]; then
                continue
              fi
              if [[ "${pkg}" == \#* ]]; then
                continue
              fi

              tok=$(chainctl auth token --audience apk.cgr.dev)
              tmp=$(mktemp -d)

              # Check if package already exists in apk.cgr.dev
              code=$(curl -s -o /dev/null --head -w "%{http_code}" --user "user:${tok}" "https://apk.cgr.dev/extra-packages/${arch}/${pkg}")
              if [ $code == "303" ]; then
                echo "Package already exists: ${pkg}"
                continue
              elif [ $code != "404" ]; then
                echo "Unexpected response code: $code"
                exit 1
              fi

              # Get package from GCS, continue if it doesn't exist (e.g., not in the repo)
              echo "Downloading ${pkg} from GCS"
              gsutil cp gs://chainguard-extras-apk-registry/extras/${arch}/${pkg} ${tmp}/ > /dev/null 2>&1 || continue
              echo "Downloaded ${pkg} from GCS"

              echo "Uploading ${pkg} to apk.cgr.dev"
              curl --fail -X POST \
                --user "user:${tok}" \
                -T ${tmp}/${pkg} \
                "https://apk.cgr.dev/extra-packages/${arch}/${pkg}"
              echo "Uploaded ${pkg} to apk.cgr.dev"
              rm ${tmp}/${pkg}
            done < backfill-packages.txt
          done
      - uses: step-security/action-slack-notify@e04c77a65bae8b6c0373478a1cb8fd7e012637e6 # v2.3.5
        if: failure()
        env:
          SLACK_ICON: http://github.com/chainguard-dev.png?size=48
          SLACK_USERNAME: guardian
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: chainguard-images-alerts
          SLACK_COLOR: '#8E1600'
          MSG_MINIMAL: 'true'
          SLACK_TITLE: '[backfill-packages-extras] failure: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          SLACK_MESSAGE: |
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
