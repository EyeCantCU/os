name: Restore packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "restored-packages.txt"

# Don't restore during builds, to prevent out of sync signatures.
concurrency: build

permissions:
  contents: read

jobs:
  restore:
    if: github.repository == 'chainguard-dev/extra-packages'
    name: Restore packages
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # use public chainguard provider.
      - uses: chainguard-dev/setup-chainctl@be0acd273acf04bfdf91f51198327e719f6af978 # v0.4.0
        with:
          # Managed here:
          # https://github.com/chainguard-dev/mono/blob/main/env/chainguard-images/iac/extras-pusher.tf
          identity: "6ffbe9dcb0b1efade8885c9e7658e4f5bbd47a4a/029252d6adaf9bb7"
      - name: 'Restore packages on apk.cgr.dev'
        run: |
          set -e
          # Transform text file into JSON for bulk restoration, ignoring empty lines and comments and trimming whitespace
          jq -R -n '{apks: [inputs | select(length > 0 and startswith("#") | not) | gsub("^\\s+|\\s+$"; "") | select(length > 0)]}' restored-packages.txt > restored-packages.json
          for arch in "aarch64" "x86_64"; do
            curl -X POST -H "Content-Type: application/json" \
                --user "user:$(chainctl auth token --audience apk.cgr.dev)" \
                --data @restored-packages.json \
                "https://apk.cgr.dev/extra-packages/${arch}/restore" || true
          done
      - uses: step-security/action-slack-notify@e04c77a65bae8b6c0373478a1cb8fd7e012637e6 # v2.3.5
        if: failure()
        env:
          SLACK_ICON: http://github.com/chainguard-dev.png?size=48
          SLACK_USERNAME: guardian
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: chainguard-images-alerts
          SLACK_COLOR: '#8E1600'
          MSG_MINIMAL: 'true'
          SLACK_TITLE: '[restore-packages] failure: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          SLACK_MESSAGE: |
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
