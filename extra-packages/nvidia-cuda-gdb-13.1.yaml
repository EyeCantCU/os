package:
  name: nvidia-cuda-gdb-13.1
  version: "13.1.115"
  epoch: 0
  description: CUDA GDB
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    runtime:
      - gmp
      - libexpat1
      - nvidia-cuda-ld-config-${{vars.cuda-version}}
    provides:
      - nvidia-cuda-gdb=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_gdb/linux-sbsa/cuda_gdb-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "d00656f12034fc5ed7ceb93d61a6ed6a01fa7118ae65d0a28495f529f9674aaa"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_gdb/linux-x86_64/cuda_gdb-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "bc514f7fae45a91c3d1750bd1e353d237fa4f140a1ebc209c9e3da6d68197248"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/bin
      # TODO(pnasrat): add subpackages for python enabled glibc may need other shared libs.
      # https://github.com/chainguard-dev/extra-packages/pull/567
      # aarch64 and x86_64 upstream distro differs
      rm -f bin/cuda-gdb
      mv bin/cuda-gdb-minimal bin/cuda-gdb
      for f in cuda-gdb cuda-gdbserver; do
        mv bin/${f} ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/bin
      done
      mv share ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE

subpackages:
  - name: ${{package.name}}-extras
    description: ${{package.name}} extras
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/cuda-${{vars.cuda-version}}/
          mv extras ${{targets.contextdir}}/usr/local/cuda-${{vars.cuda-version}}/

update:
  enabled: false

test:
  environment:
    contents:
      packages:
        - bash
  pipeline:
    - runs: |
        /usr/local/cuda-${{vars.cuda-version}}/bin/cuda-gdb --version
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: nvidia-cuda-gdb
        real-pkg-name: ${{package.name}}
