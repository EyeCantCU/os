package:
  name: nvidia-codec-sdk-12
  version: 12.1.14
  epoch: 7
  description: NVIDIA Codec SDK
  copyright:
    - license: LicenseRef-NVIDIA-Video-Codec-SDK
      license-path: LicenseAgreement.pdf
    - license: LicenseRef-ffmpeg
      license-path: NOTICES.txt
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-codec-sdk=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox
      - libarchive-tools

pipeline:
  # We mirror the Video Codec SDK to an unofficial location for now.
  # TODO(kaniini): Work with NVIDIA to come to a more robust solution here.
  - uses: fetch
    with:
      uri: https://distfiles.ariadne.space/stuff/video_codec_sdk_${{package.version}}.zip
      expected-sha256: f0048341c087f2edea2175efd26f6d61bb9a0f57beb577fc6928ef063a0c8772
      extract: false
      timeout: 30

  - runs: bsdtar xvf video_codec_sdk_${{package.version}}.zip --strip-components=1

  - working-directory: ${{targets.destdir}}/usr/lib/nvidia-codec-sdk/stubs
    runs: |
      mv ${{package.srcdir}}/Lib/linux/stubs/${{build.arch}}/*.so .

  - working-directory: ${{targets.destdir}}/usr/include
    runs: |
      mv ${{package.srcdir}}/Interface/*.h .

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: nvidia-codec-sdk
        real-pkg-name: ${{package.name}}

update:
  # No release-monitoring support for the Codec SDK.
  enabled: false
