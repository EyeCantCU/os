package:
  name: nvidia-cuda-nvcc-12.3
  version: 12.3.107
  epoch: 8
  description: CUDA NVCC
  copyright:
    - license: LicenseRef-NVIDIA-CUDA-nvcc
      license-path: LICENSE

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/linux-sbsa/cuda_nvcc-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "4c0e6a79a67fb86489be9e0976cc22127ca2ae160b1ad22ac4742d52f0ebe32d"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/linux-x86_64/cuda_nvcc-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "65dba017ed1dbbe819a6ccc1841a4add4dfbc652603aa89be773888e82a5629e"
          timeout: 30

  # Without this patch nvcc will not work with glibc 2.41 an newer, as their
  # recently added C23 math functions conflict with CUDA header definitions.
  # glibc 2.42 introduced the same problem with yet another math function.
  - uses: patch
    with:
      patches: math_functions_glibc_2.41.patch math_functions_glibc_2.42.patch

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.3/
      mv include ${{targets.destdir}}/usr/local/cuda-12.3/
      mv lib ${{targets.destdir}}/usr/local/cuda-12.3/lib64
      cp LICENSE ${{targets.destdir}}/usr/local/cuda-12.3/${{package.name}}.LICENSE
      mv bin ${{targets.destdir}}/usr/local/cuda-12.3/
      mv nvvm ${{targets.destdir}}/usr/local/cuda-12.3/

  - runs: |
      # Symlink the binaries onto the normal path
      mkdir -p ${{targets.destdir}}/usr/bin/
      for i in ${{targets.destdir}}/usr/local/cuda-12.3/nvcc/bin/*; do
        [ -f "$i" ] && [ -x "$i" ] && ln -sf /usr/local/cuda-12.3/nvcc/bin/$(basename "$i") ${{targets.destdir}}/usr/bin/
      done

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
      - if: ${{build.arch}} == 'aarch64'
        runs: |
          # Override bits/math-vector.h for aarch64 as latest glibc ships symbols that nvcc
          # does not export ; more details:
          # https://bugs.launchpad.net/ubuntu/+source/glibc/+bug/2033747
          # https://github.com/OE4T/meta-tegra/commit/981245c8bf3164f16bd7f52fca6ea9c9fa8c349a
          mkdir -p "${{targets.contextdir}}/usr/local/cuda-12.3/include/bits"
          install -m644 math-vector.h "${{targets.contextdir}}/usr/local/cuda-12.3/include/bits/math-vector.h"
    dependencies:
      runtime:
        - nvidia-cuda-nvcc-12.3
    test:
      pipeline:
        - uses: test/tw/devpackage

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false

test:
  environment:
    contents:
      packages:
        - gcc-12-default
        - build-base
        - nvidia-cuda-cudart-12.3-dev
        - ${{package.name}}-dev
  pipeline:
    - name: Test .c files can be compiled
      runs: |
        cat <<EOF >/tmp/test-c.c
        #include <math.h>
        int main() {
          return 0;
        }
        EOF
        /usr/local/cuda-12.3/bin/nvcc -o /tmp/test-c /tmp/test-c.c
        /tmp/test-c
    - name: Test .cu files can be compiled
      runs: |
        cat <<EOF >/tmp/test-cu.cu
        #include <math.h>
        int main() {
          return 0;
        }
        EOF
        /usr/local/cuda-12.3/bin/nvcc -o /tmp/test-cu /tmp/test-cu.cu
        /tmp/test-cu
    - uses: test/tw/ldd-check
