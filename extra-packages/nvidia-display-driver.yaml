package:
  name: nvidia-display-driver
  version: 550.54.14
  epoch: 1
  description: NVIDIA display driver
  copyright:
    - license: PROPRIETARY

environment:
  contents:
    packages:
      - busybox
      - curl

vars:
  NVIDIA_Display_Driver_SHA256_aarch64: "b0fae8061633885c24f6b0c047649b46249a3bb44cadffbf658af28f80642c1d"
  NVIDIA_Display_Driver_SHA256_x86_64: "8c497ff1cfc7c310fb875149bc30faa4fd26d2237b2cba6cd2e8b0780157cfe3"

pipeline:
  - runs: |
      mkdir -p ${{targets.destdir}}/
      echo "Downloading NVIDIA display driver"

      # Unfortunately, there's no other way but to curl since its not a tar file
      # the URL is also different for different build-arch

      if [ "${{build.arch}}" == "aarch64" ]; then
        curl -O https://us.download.nvidia.com/XFree86/${{build.arch}}/${{package.version}}/NVIDIA-Linux-${{build.arch}}-${{package.version}}.run
        OBTAINED_SHA=$(sha256sum NVIDIA-Linux-${{build.arch}}-${{package.version}}.run | awk '{ print $1 }')
        if [ "$OBTAINED_SHA" != "${{vars.NVIDIA_Display_Driver_SHA256_aarch64}}" ]; then
          echo "Expected vars.NVIDIA_Display_Driver_SHA256_aarch64 to be $OBTAINED_SHA. Please update" 1>&2
          exit 1
        fi
      elif [ "${{build.arch}}" == "x86_64" ]; then
        curl -O https://us.download.nvidia.com/XFree86/Linux-${{build.arch}}/${{package.version}}/NVIDIA-Linux-${{build.arch}}-${{package.version}}.run
        OBTAINED_SHA=$(sha256sum NVIDIA-Linux-${{build.arch}}-${{package.version}}.run | awk '{ print $1 }')
        if [ "$OBTAINED_SHA" != "${{vars.NVIDIA_Display_Driver_SHA256_x86_64}}" ]; then
          echo "Expected vars.NVIDIA_Display_Driver_SHA256_x86_64 to be $OBTAINED_SHA. Please update" 1>&2
          exit 1
        fi
      fi
      chmod +x NVIDIA-Linux-${{build.arch}}-${{package.version}}.run
      mv NVIDIA-Linux-${{build.arch}}-${{package.version}}.run ${{targets.destdir}}/

subpackages:
  - name: nvidia-display-driver-compat
    description: compat packages for images like nvidia-gpu-driver
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/drivers
          ln -s /NVIDIA-Linux-${{build.arch}}-${{package.version}}.run ${{targets.subpkgdir}}/drivers/

update:
  enabled: false
