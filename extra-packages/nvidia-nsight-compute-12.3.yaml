package:
  name: nvidia-nsight-compute-12.3
  version: 2023.3.1.1
  epoch: 3 # go/extras-rsc/nvidia-nsight-compute-12.3
  description: Nsight Compute
  copyright:
    - license: LicenseRef-NVIDIA-SLA
      license-path: LICENSE
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-nsight-compute=${{package.full-version}}
  resources:
    cpu: "4"
    memory: 11Gi

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/nsight_compute/linux-sbsa/nsight_compute-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "20023f701cc9a79fbe3c42f7b2fb3d3e30a562fae9ced2c5c4a2e707caecf4ab"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/nsight_compute/linux-x86_64/nsight_compute-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "78934c8cc402401814ad6f0046173fdb4f0d2875c7bc70b99d472856d0d525b8"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv bin ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv nsight-compute ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/

test:
  environment:
    contents:
      packages:
        - bash
  pipeline:
    - name: Verify installation and binaries
      runs: |
        test -x /usr/local/cuda-${{vars.cuda-version}}/bin/ncu
        test -x /usr/local/cuda-${{vars.cuda-version}}/bin/ncu-ui
    - name: Test binary functionality
      runs: |
        # Create symlinks for the nsight-compute version
        ln -s /usr/local/cuda-${{vars.cuda-version}}/nsight-compute/2023.3.1 /usr/local/cuda-${{vars.cuda-version}}/nsight-compute-2023.3.1

        /usr/local/cuda-${{vars.cuda-version}}/bin/ncu --version
        /usr/local/cuda-${{vars.cuda-version}}/bin/ncu --list-sections
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: nvidia-nsight-compute
        real-pkg-name: ${{package.name}}

update:
  enabled: false
