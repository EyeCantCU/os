package:
  name: py3-torch-cuda-11.8
  version: "2.7.1"
  epoch: 5
  description: Tensors and Dynamic neural networks in Python with strong GPU acceleration
  copyright:
    - license: BSD-3-Clause
  target-architecture:
    - x86_64
  resources:
    cpu: 64
    disk: 128Gi
    memory: 256Gi
  options:
    no-depends: true

vars:
  cudnn-version: 9
  gcc-version: 11
  pypi-package: torch
  import: torch

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.\d+$'
    replace: '$1'
    to: cuda-major-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.(\d+)$'
    replace: 'cu$1$2'
    to: cuda-pyvariant

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake-3
      - coreutils
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - gcc-${{vars.gcc-version}}
      - git
      - glibc-dev
      - libffi-dev
      - libgomp
      - libjpeg-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - nvidia-cuda-cupti-${{vars.cuda-version}}-dev
      - nvidia-cuda-nvml-dev-${{vars.cuda-version}}
      - nvidia-cuda-profiler-api-${{vars.cuda-version}}
      - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}-dev
      - nvidia-driver
      - nvidia-libcufile-${{vars.cuda-version}}-dev
      - nvidia-nccl-cuda-${{vars.cuda-version}}-dev
      - openmp-17-dev
      - openssl-dev
      - patchelf
      - posix-libc-utils
      - py3-supported-astunparse
      - py3-supported-build-base-dev
      - py3-supported-numpy-2.1
      - py3-supported-pyyaml
      - py3-supported-requests
      - py3-supported-typing-extensions
      - python3
      - samurai
  environment:
    PYTORCH_BUILD_VERSION: "${{package.version}}+${{vars.cuda-pyvariant}}"
    PYTORCH_BUILD_NUMBER: 0
    CC: gcc-${{vars.gcc-version}}
    CXX: g++-${{vars.gcc-version}}
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
    CUDA_NVCC_EXECUTABLE: /usr/local/cuda-${{vars.cuda-version}}/bin/nvcc
    USE_CUDA: 1
    USE_CUDNN: 1
    USE_SYSTEM_NCCL: 1
    NCCL_LIB_DIR: /usr/lib
    NCCL_INCLUDE_DIR: /usr/include
    NVCC_APPEND_FLAGS: -ccbin gcc-${{vars.gcc-version}}
    CUDNN_HOME: "/usr/local/cudnn-${{vars.cudnn-version}}"
    CUDNN_LIBRARY: "/usr/local/cudnn-${{vars.cudnn-version}}/lib64"
    CUDNN_INCLUDE_DIR: "/usr/local/cudnn-${{vars.cudnn-version}}/include"
    TORCH_CUDA_ARCH_LIST: "5.2 6.0 6.1 7.0+PTX 8.0 8.6 8.7 8.9 9.0"
    TORCH_NVCC_FLAGS: "-Xfatbin -compress-all"
    CUDA_VERSION: "${{vars.cuda-version}}"
    # see pytorch doc on GLIBCXX_USE_CXX11_ABI at
    # https://github.com/pytorch/pytorch/blob/b4b1480b0634a5fb7e116053464301d192e2583a/README.md?plain=1#L236
    # and https://gcc.gnu.org/onlinedocs/libstdc++/manual/using_dual_abi.html
    _GLIBCXX_USE_CXX11_ABI: 1
    CFLAGS: -Wno-error=nonnull -Wno-nonnull
    CXXFLAGS: -Wno-error=nonnull -Wno-nonnull -fdelete-null-pointer-checks
    MAX_JOBS: 32

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/pytorch.git
      tag: v${{package.version}}
      expected-commit: e2d141dbde55c2a4370fac5165b0561b6af4798b
      recurse-submodules: true

  - name: prepare sdist in advance to avoid creating a new one for each build variant
    runs: |
      sitepkgd=$(python3 -c 'import site; print(site.getsitepackages()[0])')
      python3 -m build --sdist -n -x

  - name: build and install libtorch whl into holding directory
    runs: |
      export PATH="$PATH:/usr/local/cuda-${{vars.cuda-version}}/bin"
      export BUILD_LIBTORCH_WHEEL=1
      mkdir -p libtorch-install
      python3 -m pip install --verbose --no-index \
        --no-build-isolation --no-deps --force-reinstall --no-compile \
        --prefix=/usr --root libtorch-install \
        dist/${{vars.pypi-package}}-"${{package.version}}+${{vars.cuda-pyvariant}}".tar.gz

subpackages:
  - name: libtorch-cuda-${{vars.cuda-version}}
    description: Tensors and Dynamic neural networks in C++ with strong GPU acceleration
    options:
      no-depends: true
    dependencies:
      runtime:
        - openmp-17
        - nvidia-cuda-cupti-${{vars.cuda-version}}
        - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}
        - nvidia-cuda-cudart-${{vars.cuda-version}}
        - nvidia-cuda-nvrtc-${{vars.cuda-version}}
        - nvidia-nccl-cuda-${{vars.cuda-version}}
        - nvidia-libcublas-${{vars.cuda-version}}
        - nvidia-libcufft-${{vars.cuda-version}}
        - nvidia-libcufile-${{vars.cuda-version}}
        - nvidia-libcurand-${{vars.cuda-version}}
        - nvidia-libcusolver-${{vars.cuda-version}}
        - nvidia-libcusparse-${{vars.cuda-version}}
    pipeline:
      - name: copy libtorch libs into libtorch package
        runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib
          sitepkgd=$(python3 -c 'import site; print(site.getsitepackages()[0])')
          # this is python specific
          rm libtorch-install/${sitepkgd}/torch/lib/libtorch_python.so
          cp -a libtorch-install/${sitepkgd}/torch/lib/* ${{targets.contextdir}}/usr/lib
      - name: check libcupti support (customer-issues/issues/1938)
        runs: |
          ldd ${{targets.contextdir}}/usr/lib/libtorch_cuda.so | grep libcupti
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - libcuda-stub-cuda-${{vars.cuda-version}}-dev
      pipeline:
        - uses: test/tw/ldd-check

  - name: libtorch-cuda-${{vars.cuda-version}}-dev
    dependencies:
      runtime:
        - libtorch-cuda-${{vars.cuda-version}}
    pipeline:
      - name: copy libtorch dev files into libtorch-dev package
        runs: |
          mkdir -p ${{targets.contextdir}}/usr/include
          sitepkgd=$(python3 -c 'import site; print(site.getsitepackages()[0])')
          cp -a "libtorch-install/${sitepkgd}/torch/include/"* "${{targets.contextdir}}/usr/include"
          mkdir -p ${{targets.contextdir}}/usr/share
          cp -a "libtorch-install/${sitepkgd}/torch/share/cmake" "${{targets.contextdir}}/usr/share/"
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - nvidia-cuda-cudart-${{vars.cuda-version}}-dev
      pipeline:
        - uses: test/tw/ldd-check

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    options:
      no-depends: true
    dependencies:
      runtime:
        - libtorch-cuda-${{vars.cuda-version}}
        - nvidia-cuda-cupti-${{vars.cuda-version}}
        - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}
        - nvidia-cuda-cudart-${{vars.cuda-version}}
        - nvidia-cuda-nvrtc-${{vars.cuda-version}}
        - nvidia-nccl-cuda-${{vars.cuda-version}}
        - nvidia-libcublas-${{vars.cuda-version}}
        - nvidia-libcufft-${{vars.cuda-version}}
        - nvidia-libcufile-${{vars.cuda-version}}
        - nvidia-libcurand-${{vars.cuda-version}}
        - nvidia-libcusolver-${{vars.cuda-version}}
        - nvidia-libcusparse-${{vars.cuda-version}}
        - py${{range.key}}-astunparse
        - py${{range.key}}-filelock
        - py${{range.key}}-fsspec
        - py${{range.key}}-jinja2
        - py${{range.key}}-markupsafe
        - py${{range.key}}-mpmath
        - py${{range.key}}-networkx
        - py${{range.key}}-numpy
        - py${{range.key}}-pyyaml
        - py${{range.key}}-requests
        - py${{range.key}}-setuptools
        - py${{range.key}}-sympy
        - py${{range.key}}-typing-extensions
    pipeline:
      - runs: |
          export PATH="$PATH:/usr/local/cuda-${{vars.cuda-version}}/bin"
          export BUILD_LIBTORCHLESS=ON
          sitepkgd=$(python3 -c 'import site; print(site.getsitepackages()[0])')
          export LIBTORCH_LIB_PATH="$(pwd)/libtorch-install/${sitepkgd}/torch/lib"

          python${{range.key}} -m pip install --verbose \
            --no-index --no-build-isolation --no-deps \
            --force-reinstall --no-compile --prefix=/usr \
            "--root=${{targets.contextdir}}" \
            dist/${{vars.pypi-package}}-"${{package.version}}+${{vars.cuda-pyvariant}}".tar.gz
          sitepkgd=$(python${{range.key}} -c 'import site; print(site.getsitepackages()[0])')
          python${{range.key}} -m compileall --invalidation-mode=unchecked-hash \
            -r100 ${{targets.contextdir}}/$sitepkgd
      - name: move /usr/bin contents for -bin package to collect
        runs: |
          mkdir -p bin-save/${{range.key}}
          mv ${{targets.contextdir}}/usr/bin bin-save/${{range.key}}
      - name: symlink libtorch libs into python tree
        runs: |
          libtorch_sitepkgd=$(python3 -c 'import site; print(site.getsitepackages()[0])')
          sitepkgd=$(python${{range.key}} -c 'import site; print(site.getsitepackages()[0])')
          for f in libtorch-install/${libtorch_sitepkgd}/torch/lib/*; do
            base="$(basename $f)"
            lt_path="/usr/lib/${base}"
            py_path="${{targets.contextdir}}/${sitepkgd}/torch/lib/${base}"
            if [ -f "$py_path" ]; then
              rm "$py_path"
            fi
            ln -s "/usr/lib/${base}" "$py_path"
          done
      - name: libtorch-dev provides the *.cmake files, so remove them here
        runs: |
          sitepkgd=$(python${{range.key}} -c 'import site; print(site.getsitepackages()[0])')
          py_path="${{targets.contextdir}}/${sitepkgd}"
          rm -rf "$py_path"/torch/share
      - name: upstream unit tests
        runs: |
          python${{range.key}} -m venv .venv
          sitepkgd=$(python${{range.key}} -c 'import site; print(site.getsitepackages()[0])')
          sitepkgd_global=$(python3 -c 'import site; print(site.getsitepackages()[0])')
          sitepkg_venv=$(.venv/bin/python -c 'import site; print(site.getsitepackages()[0])')
          cp -a ${{targets.contextdir}}/${sitepkgd}/* $sitepkg_venv/
          cp -a --remove-destination libtorch-install/${sitepkgd_global}/torch/lib/* $sitepkg_venv/torch/lib/
          .venv/bin/pip install --no-compile -r .ci/docker/requirements-ci.txt
          .venv/bin/python /home/build/test/run_test.py \
            -i test_torch test_nn test_autograd \
            --keep-going -v \
            -- --deselect test/test_autograd.py::TestAutograd::test_multi_grad_all_hooks
          rm -rf .venv
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - libcuda-stub-cuda-${{vars.cuda-version}}-dev
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - uses: test/tw/ldd-check
        - name: regression test cuDNN
          runs: |
            python${{range.key}} -c "import sys, torch; assert torch.backends.cudnn.is_available(); v = sys.version_info; print(f'PyTorch is built with cuDNN support (Python {v.major}.{v.minor})')"

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}-dev
    description: python${{range.key}} version of ${{vars.pypi-package}} dev
    options:
      no-depends: true
    dependencies:
      runtime:
        - libtorch-cuda-${{vars.cuda-version}}-dev
        - py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - gcc-${{vars.gcc-version}}
        - python-${{range.key}}-base-dev
    pipeline:
      - uses: split/dev
        with:
          package: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
      - name: symlink libtorch headers into python tree
        runs: |
          sitepkgd=$(python${{range.key}} -c 'import site; print(site.getsitepackages()[0])')
          py_path="${{targets.contextdir}}/${sitepkgd}"
          rm -rf "$py_path"/torch/include
          ln -s /usr/include "$py_path/torch/include"
      - name: symlink libtorch cmake config into python tree
        runs: |
          # libtorch-dev installs *.cmake into the system cmake directory
          sitepkgd=$(python${{range.key}} -c 'import site; print(site.getsitepackages()[0])')
          py_path="${{targets.contextdir}}/${sitepkgd}"
          mkdir -p "$py_path"/torch/share
          ln -s "/usr/share/cmake" "$py_path"/torch/share/
    test:
      pipeline:
        - name: regression test torch.compile
          runs: |
            python${{range.key}} app.py

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}-bin
    description: commands for python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr
          mv bin-save/${{range.key}}/bin ${{targets.contextdir}}/usr
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - libcuda-stub-cuda-${{vars.cuda-version}}-dev
      pipeline:
        - runs: torchrun -h
        - uses: test/tw/ldd-check

  - name: py3-supported-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.11-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.12-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.13-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: test/emptypackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}-dev
    description: meta package providing ${{vars.pypi-package}} development files for supported python versions
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}-dev
        - py3.11-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}-dev
        - py3.12-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}-dev
        - py3.13-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}-dev
    test:
      pipeline:
        - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: pytorch/pytorch
    strip-prefix: v
    tag-filter: v2.

test:
  pipeline:
    - uses: test/emptypackage
