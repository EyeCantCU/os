package:
  name: chainctl
  version: "0.2.213"
  epoch: 0
  description: Chainguard CLI
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - curl
      - wolfi-base

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/mono

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/mono
      expected-commit: a87bc463cb2f84cccbc6abc6903f246f3ffbaad2
      tag: v${{package.version}}

  - uses: go/build
    with:
      ldflags: |
        -X sigs.k8s.io/release-utils/version.gitVersion=${{package.version}}
        -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/release-utils/version.buildDate=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")
        -X chainguard.dev/chainctl/pkg/config.APIEndpoint=https://console-api.enforce.dev
        -X chainguard.dev/chainctl/pkg/config.ConsoleEndpoint=https://console.chainguard.dev
        -X chainguard.dev/chainctl/pkg/config.IssuerEndpoint=https://issuer.enforce.dev
        -X chainguard.dev/chainctl/pkg/config.RegistryEndpoint=https://cgr.dev
      output: chainctl
      packages: .
      modroot: ./chainctl

  - uses: strip

update:
  enabled: true
  github:
    identifier: chainguard-dev/mono
    strip-prefix: v

subpackages:
  - name: docker-credential-cgr
    description: Docker credential helper for Chainguard
    dependencies:
      runtime:
        - chainctl
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          ln -s /usr/bin/chainctl ${{targets.contextdir}}/usr/bin/docker-credential-cgr

          mkdir -p ${{targets.destdir}}/docker
          cp config.json ${{targets.destdir}}/docker
    test:
      environment:
        contents:
          packages:
            - jq
      pipeline:
        - runs: |
            which docker-credential-cgr
            cat /docker/config.json
            jq -r '.credHelpers["cgr.dev"]' < /docker/config.json | grep "^cgr$"

test:
  pipeline:
    - runs: |
        ls -lh /usr/bin/chainctl
        HOME=/home/user chainctl version | grep "^GitVersion:.*${{package.version}}$"
