package:
  name: terraform-1.13
  version: "1.13.5"
  epoch: 5 # GHSA-q9hv-hpm4-hj6x
  copyright:
    - license: BUSL-1.1
  dependencies:
    provides:
      - terraform=${{package.full-version}}

environment:
  contents:
    packages:
      - go
  environment:
    CGO_ENABLED: 0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/terraform
      tag: v${{package.version}}
      expected-commit: 328813676aec7a4e2a491484f91b5e0b67847b6c

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/legacy

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/s3

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/pg

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/oss

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/oci

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/kubernetes

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/gcs

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/cos

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/consul

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/azure

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        github.com/cloudflare/circl@v1.6.3

  - uses: go/build
    with:
      packages: .
      output: terraform
      ldflags: -s -w -X github.com/hashicorp/terraform/version.dev="no"

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for terraform
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/terraform "${{targets.subpkgdir}}"/usr/local/bin
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            /usr/local/bin/terraform --version | grep -q "${{package.version}}"
            /usr/local/bin/terraform --help

  - name: ${{package.name}}-local-provider-config
    description: Configure Terraform to use local providers
    dependencies:
      provides:
        - terraform-local-provider-config=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/terraform/provider-mirror
          cat > "${{targets.subpkgdir}}"/terraform/.terraformrc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "/terraform/provider-mirror"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            grep "filesystem_mirror" /terraform/.terraformrc
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: terraform-local-provider-config

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.13

test:
  pipeline:
    - name: Terraform Initialization
      runs: |
        echo "provider \"local\" {}" > example.tf
        terraform init -input=false || exit 1
        terraform --version
        terraform --help
    - name: Terraform Plan Creation
      runs: |
        terraform plan -input=false -out=tfplan || exit 1
    - name: Terraform Apply Execution
      runs: |
        terraform apply -input=false tfplan || exit 1
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: terraform
        real-pkg-name: ${{package.name}}
