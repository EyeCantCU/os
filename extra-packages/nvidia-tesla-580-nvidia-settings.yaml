# Because nvidia's versioning is unusual, this has to scoped to both a
# release track (tesla) and a version stream (580)
package:
  name: nvidia-tesla-580-nvidia-settings
  version: "580.126.09"
  epoch: 0
  description: NVIDIA Linux Tesla ${{package.version}} nvidia-settings tool
  copyright:
    - license: GPL-2.0
  dependencies:
    runtime:
      # From nvidia-tesla-580-tools
      - ${{vars.basename}}-internal~${{package.version}}
      - ${{vars.basename}}-libnvidia-ml~${{package.version}}

var-transforms:
  - from: ${{package.name}}
    match: '^(nvidia-tesla-[0-9]+)-.*'
    replace: '$1'
    to: basename
  - from: ${{package.name}}
    match: '^(nvidia-tesla-[0-9]+)-(.*)'
    replace: '$2'
    to: toolname

environment:
  contents:
    packages:
      - build-base
      - gtk-2.0-dev
      - gtk-3-dev
      - libXxf86misc-dev
      - libvdpau-dev
      - libx11-dev
      - libxrandr-dev
      - libxv-dev
      - libxxf86vm-dev
      - m4
      - vulkan-headers

pipeline:
  - uses: fetch
    with:
      uri: https://download.nvidia.com/XFree86/${{vars.toolname}}/${{vars.toolname}}-${{package.version}}.tar.bz2
      expected-sha256: ab81e1e420dd71cbf4b00c97a4061f001906d5d4eec62729a512d1f775404359

  - uses: autoconf/make

  - uses: autoconf/make-install
    with:
      opts: PREFIX=/usr

  - runs: |
      # Stored in nvidia-tesla-580-doc
      rm -rf ${{targets.contextdir}}/usr/share/man
      rmdir ${{targets.contextdir}}/usr/share

subpackages:
  - name: ${{vars.basename}}-libnvidia-gtk
    description: NVIDIA Linux Tesla ${{package.version}} GTK libraries
    dependencies:
      runtime:
        - ${{vars.basename}}-internal~${{package.version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr
          mv ${{targets.destdir}}/usr/lib ${{targets.contextdir}}/usr
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: ${{vars.toolname}} --help

update:
  enabled: true
  # We need every release or we might miss some
  # that nvidia-580 kernel driver depends on.
  require-sequential: true
  release-monitor:
    identifier: 388052
