package:
  name: surrealdb
  version: "2.5.0"
  epoch: 0
  description: "A scalable, distributed, collaborative, document-graph database, for the realtime web"
  copyright:
    - license: BUSL-1.1
  resources:
    cpu: 8
    memory: 16Gi

environment:
  contents:
    packages:
      - bash
      - build-base
      - ca-certificates-bundle
      - clang-17
      - gcc-14-default
      - patch
      - rust
      - rustup
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/surrealdb/surrealdb
      tag: v${{package.version}}
      expected-commit: cc484cb8f93de9974cd0662832bbb1aceb026a8d

  - name: Configure and build
    runs: |
      rustup install stable
      rustup target add x86_64-unknown-linux-gnu
      rustup target add aarch64-unknown-linux-gnu

      # This is a bit of a hack, but it's the easiest way to get the right version of rustc and cargo in the path.
      export PATH="$HOME/.rustup/toolchains/stable-${{host.triplet.rust}}/bin:$PATH"
      ARCH=${{build.arch}}
      if [ "$ARCH" = "aarch64" ]; then
          echo '[build]' >> .cargo/config
          echo 'rustflags = ["-Ctarget-feature=+fp16"]' >> .cargo/config
      fi

      cargo build --release

      install -Dm755 target/release/surreal ${{targets.destdir}}/usr/bin/surreal

  - uses: strip

update:
  enabled: true
  github:
    identifier: surrealdb/surrealdb
    strip-prefix: v

test:
  pipeline:
    - name: Verify SurrealDB binary presence
      runs: |
        surreal --version
    - name: Start SurrealDB server in memory and test basic CRUD operations
      runs: |
        # Start SurrealDB server in-memory mode with extended th root user
        surreal start memory --user root --pass root > out.log 2>&1 &

        # Wait to ensure the server is fully initialized
        sleep 5

        # Run CRUD operation TEST
        echo "Running CRUD operations on SurrealDB..."

        # Create a record
        echo "CREATE person SET name = 'John Doe', age = 30;" | surreal sql --namespace testns --database testdb -u root -p root

        # Read and verify the record
        if ! echo "SELECT * FROM person;" | surreal sql --namespace testns --database testdb -u root -p root | grep -qi "John Doe"; then
          echo "Record not found in READ operation."
          exit 1
        fi


        # Update the record
        echo "UPDATE person SET age = 31 WHERE name = 'John Doe';" | surreal sql --namespace testns --database testdb -u root -p root

        # # Verify the updated age
        if ! echo "SELECT * FROM person WHERE name = 'John Doe';" | surreal sql --namespace testns --database testdb -u root -p root | grep -qi "31"; then
          echo "Failed to verify UPDATED record."
          exit 1
        fi

        # Delete the record
        echo "DELETE FROM person WHERE name = 'John Doe';" | surreal sql --namespace testns --database testdb -u root -p root

        echo "CRUD operations completed successfully."
