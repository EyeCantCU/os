package:
  name: tensorrt-cuda-13
  version: "10.14.1.48"
  epoch: 2
  description: TensorRT libraries for CUDA 13
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    runtime:
      - libnvinfer-bin-cuda-${{vars.cuda-major-version}}=${{package.full-version}}
      - libnvinfer-cuda-${{vars.cuda-major-version}}=${{package.full-version}}
      - libnvinfer-dispatch-cuda-${{vars.cuda-major-version}}=${{package.full-version}}
      - libnvinfer-lean-cuda-${{vars.cuda-major-version}}=${{package.full-version}}
      - libnvinfer-plugin-cuda-${{vars.cuda-major-version}}=${{package.full-version}}
      - libnvinfer-vc-plugin-cuda-${{vars.cuda-major-version}}=${{package.full-version}}
      - libnvonnxparser-cuda-${{vars.cuda-major-version}}=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: '(\d+\.\d+\.\d+)\.\d+'
    replace: '$1'
    to: mangled-package-version
  - from: ${{package.version}}
    match: '(\d+\.\d+)\.\d+\.\d+'
    replace: '$1'
    to: major-minor
  - from: ${{package.name}}
    match: '.*cuda-(\d+)(?:\.\d+)?'
    replace: '$1'
    to: cuda-major-version

vars:
  # It's versioned for the latest minor version it supports, but is backwards compatible.
  cuda-version: 13.0

environment:
  contents:
    packages:
      - busybox

data:
  # libnvinfer-plugin is split out here because it has an extra dep
  # we can restore it when melange is able to populate our deps
  - name: _libs
    items:
      libnvinfer-dispatch:
      libnvinfer-lean:
      libnvinfer-vc-plugin:
      libnvonnxparser:
      libnvinfer:

  - name: _devs
    items:
      libnvinfer-dispatch:
      libnvinfer-lean:
      libnvinfer-plugin:
      libnvinfer-vc-plugin:
      libnvonnxparser:
      libnvinfer:

pipeline:
  - if: ${{build.arch}} == "x86_64"
    uses: fetch
    with:
      uri: "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/${{vars.mangled-package-version}}/tars/TensorRT-${{package.version}}.Linux.x86_64-gnu.cuda-${{vars.cuda-version}}.tar.gz"
      expected-sha512: "16af3a4b2a50f3bd3f563334da34fb742bdbdc43423e70277a793261802ef5ee4182efe56a574306a691127b6b8b33601f5fc63d44eb937e1efc99fe68802e19"
      timeout: 600

  - if: ${{build.arch}} == "aarch64"
    uses: fetch
    with:
      uri: "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/${{vars.mangled-package-version}}/tars/TensorRT-${{package.version}}.Linux.aarch64-gnu.cuda-${{vars.cuda-version}}.tar.gz"
      expected-sha512: "81a9b06a65fb03a4a70f0442d0c833ce292157d9680f5701d74e0d52be18d58ed4b0f9d96c2fead1a684e14f4878d5cd9ccff09a37fbd127d70bb93d88ae7b89"
      timeout: 600

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/local/tensorrt
      mv targets doc lib ${{targets.contextdir}}/usr/local/tensorrt/

subpackages:
  - name: libnvinfer-bin-cuda-${{vars.cuda-major-version}}
    description: libnvinfer binaries
    options:
      no-depends: true
    dependencies:
      runtime:
        - libstdc++
        - libnvinfer-cuda-${{vars.cuda-major-version}}
        - libnvonnxparser-cuda-${{vars.cuda-major-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/bin
          mv bin/* ${{targets.contextdir}}/usr/local/bin/
    test:
      environment:
        contents:
          packages:
            - libcuda-stub-cuda-${{vars.cuda-version}}-dev
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/help-check
          with:
            bins: tensorrt_player trtexec

  - range: _libs
    name: ${{range.key}}-cuda-${{vars.cuda-major-version}}
    description: ${{range.key}}
    options:
      no-depends: true
    dependencies:
      runtime:
        - libstdc++
        - ${{package.name}}-ld-config
    pipeline:
      - runs: |
          libname="${{range.key}}"
          _libdir=usr/local/tensorrt/lib
          mkdir -p ${{targets.subpkgdir}}/$_libdir

          # Replacing hyphens with underscores in libname
          libname_with_underscore="${libname//-/_}"
          mv ${{targets.destdir}}/$_libdir/"${libname_with_underscore}".so.* ${{targets.subpkgdir}}/"$_libdir"

          if [ "$libname" = "libnvinfer" ]; then
            mv ${{targets.destdir}}/$_libdir/"${libname_with_underscore}"_builder*.so.* ${{targets.subpkgdir}}/"$_libdir"
          fi
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: libnvinfer-plugin-cuda-${{vars.cuda-major-version}}
    description: libnvinfer-plugin
    options:
      no-depends: true
    dependencies:
      runtime:
        - libstdc++
        - libnvinfer-cuda-${{vars.cuda-major-version}}
        - ${{package.name}}-ld-config
    pipeline:
      - runs: |
          libname="libnvinfer-plugin"
          _libdir=usr/local/tensorrt/lib
          mkdir -p ${{targets.subpkgdir}}/$_libdir

          # Replacing hyphens with underscores in libname
          libname_with_underscore="${libname//-/_}"
          mv ${{targets.destdir}}/$_libdir/"${libname_with_underscore}".so.* ${{targets.subpkgdir}}/"$_libdir"

          if [ "$libname" = "libnvinfer" ]; then
            mv ${{targets.destdir}}/$_libdir/"${libname_with_underscore}"_builder*.so.* ${{targets.subpkgdir}}/"$_libdir"
          fi
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - range: _devs
    name: ${{range.key}}-cuda-${{vars.cuda-major-version}}-dev
    description: ${{range.key}}-dev
    options:
      no-depends: true
    dependencies:
      runtime:
        - ${{range.key}}-cuda-${{vars.cuda-major-version}}
        - ${{package.name}}-ld-config
    pipeline:
      - runs: |
          _libdir=usr/local/tensorrt/lib
          _includedir=usr/local/tensorrt/include

          mkdir -p ${{targets.subpkgdir}}/$_libdir ${{targets.subpkgdir}}/$_libdir/stubs

          libname="${{range.key}}"

          # Replacing hyphens with underscores in libname
          libname_with_underscore="${libname//-/_}"
          mv ${{targets.destdir}}/$_libdir/"${libname_with_underscore}".so ${{targets.subpkgdir}}/"$_libdir"
          mv ${{targets.destdir}}/$_libdir/stubs/"${libname_with_underscore}".so ${{targets.subpkgdir}}/"$_libdir"/stubs/
          mv ${{targets.destdir}}/$_libdir/"${libname_with_underscore}"_static.a ${{targets.subpkgdir}}/"$_libdir"

          if [ "$libname" = "libnvonnxparser" ]; then
            mkdir -p ${{targets.subpkgdir}}/$_includedir
            mv ${{targets.destdir}}/$_libdir/libonnx_proto.a ${{targets.subpkgdir}}/$_libdir
            mv include/NvOnnx*.h ${{targets.subpkgdir}}/$_includedir
          fi

          if [ "$libname" = "libnvinfer-plugin" ]; then
            mkdir -p ${{targets.subpkgdir}}/$_includedir
            mv include/NvInferPlugin*.h ${{targets.subpkgdir}}/$_includedir
          fi

          if [ "$libname" = "libnvinfer" ]; then
            mkdir -p ${{targets.subpkgdir}}/$_includedir
            find include -name "NvInfer*.h" -not -name "*NvInferPlugin*" -exec mv {} "${{targets.subpkgdir}}/$_includedir/" +
          fi
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-dev
    description: tensorrt dev metapackage
    options:
      no-depends: true
    dependencies:
      runtime:
        - ${{package.name}}
        - libnvinfer-dispatch-cuda-${{vars.cuda-major-version}}-dev=${{package.full-version}}
        - libnvinfer-lean-cuda-${{vars.cuda-major-version}}-dev=${{package.full-version}}
        - libnvinfer-plugin-cuda-${{vars.cuda-major-version}}-dev=${{package.full-version}}
        - libnvinfer-vc-plugin-cuda-${{vars.cuda-major-version}}-dev=${{package.full-version}}
        - libnvonnxparser-cuda-${{vars.cuda-major-version}}-dev=${{package.full-version}}
        - libnvinfer-cuda-${{vars.cuda-major-version}}-dev=${{package.full-version}}
    test:
      pipeline:
        - uses: test/metapackage

  - name: ${{package.name}}-ld-config
    description: Runtime linker configuration for TensorRT libraries for NVIDIA GPUs
    pipeline:
      - runs: |
          _libdir="/usr/local/tensorrt/lib"
          mkdir -p "${{targets.contextdir}}"/etc/ld.so.conf.d
          echo "$_libdir" > "${{targets.contextdir}}"/etc/ld.so.conf.d/${{context.name}}.conf
    test:
      pipeline:
        - runs: |
            _libdir="/usr/local/tensorrt/lib"
            mkdir -p $_libdir
            ldconfig -v -N | grep "$_libdir"

test:
  environment:
    contents:
      packages:
        - libcuda-stub-cuda-${{vars.cuda-version}}-dev
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  ignore-regex-patterns:
    - '.*post.*'
  release-monitor:
    identifier: 133035
