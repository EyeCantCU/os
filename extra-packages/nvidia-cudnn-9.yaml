package:
  name: nvidia-cudnn-9
  version: "9.19.1.2"
  epoch: 0 # go/extras-rsc/nvidia-cudnn-9
  description: CUDA Deep Neural Network Libraries
  copyright:
    - license: LicenseRef-NVIDIA-cuDNN
      license-path: LICENSE
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-cudnn=${{package.full-version}}
  resources:
    cpu: "1"
    memory: 6Gi

var-transforms:
  # It's unclear why we chose this prefix. Upstream's debs have the libs
  # directly under /usr/lib/<triplet> and the headers directly under
  # /usr/include/<triplet>. Let's rethink this for the next major version,
  # which would also allow us to drop the -ld-config subpackage.
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+\.\d+$
    replace: /usr/local/cudnn-$1
    to: install-prefix
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+.\d+$
    replace: "$1"
    to: major-minor-version
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+\.\d+$
    replace: "$1"
    to: major-version

vars:
  libsubdir: lib64
  _get_checksums_script: |
    # Copy/paste this function into your shell and run `get_checksums`
    #
    # (This is in a `var` because it's easier to copy/paste than a #-prefixed
    # comment)
    get_checksums() {
        ver="$(yq -r .package.version nvidia-cudnn-9.yaml)"
        echo "CUDA 13: arm64"
        curl -s https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-sbsa/cudnn-linux-sbsa-${ver}_cuda13-archive.tar.xz | sha256sum
        echo "CUDA 13: x86_64"
        curl -s https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-${ver}_cuda13-archive.tar.xz | sha256sum
    }

subpackages:
  - name: ${{package.name}}-cuda-13
    description: CUDA Deep Neural Network Libraries ${{vars.major-minor-version}} for CUDA 13
    dependencies:
      provides:
        - nvidia-cudnn-9.1.1=${{package.full-version}}
      runtime:
        # Provide for compat with intent to remove in future
        - ${{package.name}}-compat
        - ${{package.name}}-ld-config
    pipeline:
      - assertions:
          required-steps: 1
        pipeline:
          # See _get_checksums_script above for help updating these
          - if: ${{build.arch}} == 'aarch64'
            uses: fetch
            with:
              # SBSA = ARM Server Base System Architecture (now called SystemReady)
              uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-sbsa/cudnn-linux-sbsa-${{package.version}}_cuda13-archive.tar.xz"
              expected-sha256: 773da75f2b3ce64155695ecb0027f0e9e4da541414387607a965fee54cd6da7a
              timeout: 120
          - if: ${{build.arch}} == 'x86_64'
            uses: fetch
            with:
              uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-${{package.version}}_cuda13-archive.tar.xz"
              expected-sha256: db7e8d1212680c8271c76999467e3a81b5c8ac2d6f6bac6a3998af423d309394
              timeout: 120
      - runs: |
          mkdir -p ${{targets.contextdir}}${{vars.install-prefix}}/
          mv include ${{targets.contextdir}}${{vars.install-prefix}}/
          mv lib ${{targets.contextdir}}${{vars.install-prefix}}/${{vars.libsubdir}}
          cp LICENSE ${{targets.contextdir}}${{vars.install-prefix}}/${{package.name}}.LICENSE
    test:
      pipeline:
        - runs: |
            # Check for library
            stat ${{vars.install-prefix}}/${{vars.libsubdir}}/libcudnn.so
        - uses: test/tw/ldd-check
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: nvidia-cudnn-9.1.1
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-cuda-13-dev
    description: CUDA Deep Neural Network Libraries ${{vars.major-minor-version}} for CUDA 13 - development headers
    dependencies:
      runtime:
        - ${{package.name}}-cuda-13
    pipeline:
      - uses: split/dev
        with:
          package: ${{package.name}}-cuda-13
    test:
      pipeline:
        - runs: |
            # Check for header
            stat ${{vars.install-prefix}}/include/cudnn.h
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-compat
    description: Compat package for CUDA Deep Neural Network Libraries ${{vars.major-minor-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/local/
          ln -sf ${{vars.install-prefix}} ${{targets.contextdir}}/usr/local/cudnn-${{vars.major-minor-version}}

  - name: ${{package.name}}-ld-config
    description: Runtime linker configuration for CUDA Deep Neural Network Libraries ${{vars.major-minor-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/etc/ld.so.conf.d
          echo "${{vars.install-prefix}}/${{vars.libsubdir}}" > \
            "${{targets.contextdir}}"/etc/ld.so.conf.d/${{package.name}}.conf

update:
  enabled: true
  release-monitor:
    identifier: 373965

test:
  pipeline:
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: nvidia-cudnn
        real-pkg-name: ${{package.name}}
