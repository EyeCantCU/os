package:
  name: nccl-tests
  version: "2.17.2"
  epoch: 0
  description: Tests to check both the performance and the correctness of NCCL operations
  copyright:
    - license: BSD-3-Clause
      license-path: nccl-tests/LICENSE.txt

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/nccl-tests
      tag: v${{package.version}}
      expected-commit: abc46770a98777a9fd1b072adcf8becb76bfe125
      destination: ${{package.name}}

  - runs: |
      mkdir -p "${{targets.contextdir}}/usr/src"
      cp -a ${{package.name}} "${{targets.contextdir}}/usr/src"
      rm -rf "${{targets.contextdir}}/usr/src/${{package.name}}/.git"

update:
  enabled: true
  github:
    identifier: NVIDIA/nccl-tests
    strip-prefix: v
    use-tag: true
  ignore-regex-patterns:
    - delete

test:
  environment:
    contents:
      packages:
        - build-base
        - cuda-toolkit-12.8-dev
        - gcc-12-default
        - nvidia-cuda-cccl-12.8
        - nvidia-nccl-cuda-12.8-dev
  pipeline:
    # We are not actually running the tests, but just compiling them.
    # Running the tests requires GPUs.
    - runs: |
        mkdir -p build
        # Ideally we'd test every supported CUDA version, but they are
        # currently not co-installable because of conflicting provides
        for CUDA_HOME in /usr/local/cuda-*.*; do
          export CUDA_HOME
          cp -a "/usr/src/${{context.name}}" "build/$(basename $CUDA_HOME)"
          make -j$(nproc) -C "build/$(basename $CUDA_HOME)"
        done
