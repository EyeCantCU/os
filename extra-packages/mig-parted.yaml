package:
  name: mig-parted
  version: "0.13.1"
  epoch: 1 # CVE-2025-61731
  description: MIG Partition Editor for NVIDIA GPUs
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - kubectl
      - nvidia-container-toolkit

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/mig-parted
      tag: v${{package.version}}
      expected-commit: 1aa12e58f8b4aa310bfe61c1fb95b1b04f52f551

  - uses: go/build
    with:
      packages: ./cmd/nvidia-mig-parted
      output: nvidia-mig-parted
      ldflags: |
        -extldflags=-Wl,-z,lazy
        -X github.com/NVIDIA/mig-parted/internal/info.version=${{package.version}}
        -X github.com/NVIDIA/mig-parted/internal/info.gitCommit=$(git rev-parse HEAD)

  - uses: go/build
    with:
      packages: ./cmd/nvidia-mig-manager
      output: nvidia-mig-manager
      ldflags: |
        -extldflags=-Wl,-z,lazy
        -X github.com/NVIDIA/mig-parted/internal/info.version=${{package.version}}
        -X github.com/NVIDIA/mig-parted/internal/info.gitCommit=$(git rev-parse HEAD)

subpackages:
  - name: ${{package.name}}-compat
    description: mig-parted compat package
    pipeline:
      - runs: install -Dpm0755 -t ${{targets.subpkgdir}}/usr/bin ./deployments/container/reconfigure-mig.sh
    test:
      pipeline:
        - runs: stat /usr/bin/reconfigure-mig.sh | grep "0755"

update:
  enabled: true
  github:
    identifier: NVIDIA/mig-parted
    strip-prefix: v

test:
  pipeline:
    - name: "help check"
      runs: |
        nvidia-mig-parted --help
        nvidia-mig-manager --help
    - name: "version check"
      runs: |
        set -o pipefail
        nvidia-mig-parted --version | grep -F -e "${{package.version}}"
        nvidia-mig-manager --version | grep -F -e "${{package.version}}"
    - name: "sub command check"
      runs: |
        set -o pipefail
        nvidia-mig-parted apply --help | grep -F -e "nvidia-mig-parted apply"
        nvidia-mig-parted export --help | grep -F -e "nvidia-mig-parted export"
        nvidia-mig-parted assert --help | grep -F -e "nvidia-mig-parted assert"
        nvidia-mig-parted checkpoint --help | grep -F -e "nvidia-mig-parted checkpoint"
        nvidia-mig-parted restore --help | grep -F -e "nvidia-mig-parted restore"
