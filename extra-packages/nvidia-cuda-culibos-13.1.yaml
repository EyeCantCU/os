package:
  name: nvidia-cuda-culibos-13.1
  version: "13.1.68"
  epoch: 0
  description: CUDA culibos
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-cuda-culibos=${{package.full-version}}
    runtime:
      - nvidia-cuda-ld-config-${{vars.cuda-version}}

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_culibos/linux-sbsa/cuda_culibos-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha512: "116ae345e717fca4116f9834d1684b66869d202757e414f08120ea495a47106f57d5a827406317645327fa4071c28e000875f70ee2d935be163ddf678e6687fb"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_culibos/linux-x86_64/cuda_culibos-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha512: "371966c6d8c6eca4ab6bbf14f53c0be07bf368fc1419f5a7bcad3dc663bac3e550dcb07e7f03a958ee28f0f01c745d69c89b0c37bfb2f1785a185c86e3176ff5"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv lib ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: nvidia-cuda-culibos
        real-pkg-name: ${{package.name}}

update:
  enabled: false
  exclude-reason: NVidia/CUDA packages aren't handled by the regular update mechanism
