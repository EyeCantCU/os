package:
  name: nvidia-cuda-cuxxfilt-11.5
  version: 11.5.119
  epoch: 3
  description: CUDA cuxxfilt (demangler)
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-cuda-cuxxfilt=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cuxxfilt/linux-sbsa/cuda_cuxxfilt-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "7ef895dd76f2222d19344cadf32c84f8963c11a7773ceb73c7d9be4eb286576a"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cuxxfilt/linux-x86_64/cuda_cuxxfilt-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "46e3adabbf6a3e7920f054b0e16b8555606798453d5abb004cc4f82df20cf093"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv include ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv lib ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/lib64
      mv bin ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/tw/devpackage

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test binary
      runs: |
        [ "$(echo '_Z3fooi' | /usr/local/cuda-${{vars.cuda-version}}/bin/cu++filt)" = "foo(int)" ] && exit 0 || exit 1
    - name: Verify license exists
      runs: |
        if [ ! -f /usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE ]; then
          echo "License file not found"
          exit 1
        fi
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: nvidia-cuda-cuxxfilt
        real-pkg-name: ${{package.name}}

update:
  enabled: false
