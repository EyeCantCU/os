package:
  name: kibana-9.1
  version: "9.1.10"
  epoch: 6 # GHSA-5rq4-664w-9x2c
  description: Your window into the Elastic Stack
  copyright:
    - license: Apache-2.0
    - license: BSD-3-Clause
    - license: Elastic-2.0
    - license: ISC
    - license: MIT
  resources:
    cpu: 30 # max is 48 for arm64
    memory: 48Gi
  dependencies:
    provides:
      - kibana=${{package.full-version}}
    runtime:
      - libnspr # needed for the @kbn/screenshotting-plugin/chromium package
      - libnss # needed for the @kbn/screenshotting-plugin/chromium package
      - merged-usrsbin
      - nodejs-22
      - wolfi-baselayout

# this will be resolved to 9 only
var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - jq
      - node-gyp
      - nodejs~22
      - npm
      - python3
      - wget
      - yarn
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/elastic/kibana
      tag: v${{package.version}}
      expected-commit: 3c5e7066866006c39ba40861ab0c05b6406ed357

  - uses: patch
    with:
      patches: |
        node-version-bypass.patch
        enable-build-as-root.patch

  - name: Remediate CVEs
    runs: |
      # Bump node-forge to remediate GHSA-65ch-62r8-g69g.
      # Bump nodemailer to remediate GHSA-mm7p-fcc7-pg87
      # Bump tar to remediate GHSA-8qq5-rm4j-mr97, GHSA-83g3-92jg-28cx
      # Bump undici to remediate GHSA-g9mf-h72j-4rw9
      # Bump lodash to remediate GHSA-xxjr-mmjv-4gpg
      # Bump @modelcontextprotocol/sdk to remediate GHSA-8r9q-7v3j-jr4g
      # Bump langchain to remediate GHSA-r399-636x-v7f6
      # Bump @smithy/config-resolver to v4.4.0 to remediate GHSA-6475-r3vj-m8vf
      # Bump qs to remediate GHSA-6rw7-vpxm-498p
      # Bump axios to remediate GHSA-43fc-jf86-j433
      # Bump markdown-it to remediate GHSA-38c4-r59v-3vqw
      # Bump hono to remediate GHSA-gq3j-xvxp-8hrf
      # Bump systeminformation to remediate GHSA-5vv4-hvf7-2h46, GHSA-9c88-49p5-5ggf
      # Bump fast-xml-parser to remediate GHSA-jmr7-xgp7-cmfj
      resolutions='{
        "prismjs": "^1.30.0",
        "tar": "^7.5.8",
        "tar-fs": "^3.1.1",
        "undici": "7.18.2",
        "lodash": "4.17.23",
        "js-yaml": "^4.1.1",
        "jws": ">=3.2.3",
        "**/@langchain/core": "^0.3.80",
        "@langchain/core": "^0.3.80",
        "**/langchain": "^0.3.37",
        "langchain": "^0.3.37",
        "qs": "^6.14.1",
        "@smithy/config-resolver": "4.4.0",
        "node-forge": "^1.3.2",
        "axios": "^1.13.5",
        "markdown-it": "^14.1.1",
        "hono": "^4.11.10",
        "systeminformation": "^5.31.0",
        "fast-xml-parser": "^5.3.6",
        "bn.js": "^4.12.3"
      }'
      dependencies='{
        "nodemailer": "^7.0.7",
        "tar": "^7.5.8",
        "undici": "7.18.2",
        "lodash": "4.17.23",
        "@modelcontextprotocol/sdk": "^1.25.2",
        "@langchain/core": "^0.3.80",
        "langchain": "^0.3.37",
        "@smithy/config-resolver": "4.4.0",
        "qs": "^6.14.1",
        "axios": "^1.13.5",
        "markdown-it": "^14.1.1"
      }'
      jq \
        --argjson resolutions "$resolutions" \
        --argjson dependencies "$dependencies" \
        '.resolutions += $resolutions | .dependencies += $dependencies' \
        package.json > temp.json && mv temp.json package.json

  - name: Update hardcoded node version to match current node version
    runs: |
      # Update engines.node to match the current Node.js version
      jq --arg nodeVersion "$(node --version | sed 's/^v//')" '.engines.node = $nodeVersion' package.json > temp.json && mv temp.json package.json

  - runs: |
      export NODE_OPTIONS="--max-old-space-size=32768 --max-semi-space-size=8192"
      yarn install --force-install

      # moon explicitly excludes $HOME from being the workspace root
      # (https://github.com/moonrepo/moon/blob/master/crates/app/src/systems/startup.rs#L58-L59),
      # so we unset HOME for the build (and so have to explicitly mark it as
      # safe for `git` which is used within the build)
      HOME= git config --global --add safe.directory /home/build
      HOME= yarn kbn bootstrap --allow-root

      # builds fail in x86_64 CI without upping bazels available memory
      echo "startup --host_jvm_args=-Xmx48g" >> ~/.bazelrc
      HOME= node --optimize_for_size --gc-interval=100 scripts/build --release --skip-os-packages --skip-docker-ubi --skip-docker-fips

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/share/kibana
      tar xf target/kibana-${{package.version}}-linux-*.tar.gz -C ${{targets.destdir}}/usr/share/kibana --strip-components=1

  - runs: |
      # Replace minimatch 3.1.2 with 3.1.3 (GHSA-3ppc-4f35-3m26)
      MINIMATCH_DIR="${{targets.destdir}}/usr/share/kibana/node_modules/minimatch"
      if [ -d "$MINIMATCH_DIR" ]; then
        cd /tmp
        curl -sL https://registry.npmjs.org/minimatch/-/minimatch-3.1.5.tgz -o minimatch-3.1.5.tgz
        rm -rf "$MINIMATCH_DIR"
        tar -xzf minimatch-3.1.5.tgz
        mv package "$MINIMATCH_DIR"
        rm minimatch-3.1.5.tgz
      fi
      # Replace basic-ftp 5.0.3 with 5.2.0 (GHSA-5rq4-664w-9x2c)
      BASIC_FTP_DIR="${{targets.destdir}}/usr/share/kibana/node_modules/basic-ftp"
      if [ -d "$BASIC_FTP_DIR" ]; then
        cd /tmp
        curl -sL https://registry.npmjs.org/basic-ftp/-/basic-ftp-5.2.0.tgz -o basic-ftp-5.2.0.tgz
        rm -rf "$BASIC_FTP_DIR"
        tar -xzf basic-ftp-5.2.0.tgz
        mv package "$BASIC_FTP_DIR"
        rm basic-ftp-5.2.0.tgz
      fi

  - runs: |
      rm -rf "${{targets.destdir}}"/usr/share/kibana/node_modules/puppeteer/.cache
      rm -rf "${{targets.destdir}}"/usr/share/kibana/node/glibc-217/bin/node
      ln -sf /usr/bin/node "${{targets.destdir}}"/usr/share/kibana/node/glibc-217/bin/node

# kibana should not be using the "strip" pipeline as the only binaries being stripped are
# ones provided by upstream - node and headless_shell browser ; it's better that our binaries
# match upstream content ; also, for headless_shell, modifying it causes kibana to report an
# error about SHA256 mismatch
subpackages:
  - name: ${{package.name}}-iamguarded
    description: Your window into the Elastic Stack
    dependencies:
      provides:
        - kibana-iamguarded=${{package.full-version}}
      runtime:
        - bash
        - busybox
        - coreutils
        - curl
        - libnss # needed for the @kbn/screenshotting-plugin/chromium package
        - libnspr # needed for the @kbn/screenshotting-plugin/chromium package
        - merged-usrsbin
        - nodejs-22
        - wolfi-baselayout
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: kibana
          version: ${{vars.major-minor-version}}
      - runs: |
          mkdir -p /opt/iamguarded/kibana
          mkdir -p /opt/iamguarded/kibana/config.default
          mkdir -p /opt/iamguarded/kibana/tmp
          mkdir -p /opt/iamguarded/kibana/plugins.default
          mkdir -p /iamguarded/kibana/data
          mkdir -p /iamguarded/kibana/conf

          cp -r ${{targets.destdir}}/usr/share/kibana/* /opt/iamguarded/kibana

          # install necessary config
          install -m644 config/kibana.yml /opt/iamguarded/kibana/config/kibana.yml
          cp -r config/* /opt/iamguarded/kibana/config.default

          /opt/iamguarded/scripts/kibana/postunpack.sh

          # Symlink binaries to path
          mkdir -p ${{targets.contextdir}}/usr/bin
          for i in /opt/iamguarded/kibana/bin/*; do
            name=$(basename "$i")
            ln -sf /opt/iamguarded/kibana/bin/"$name" ${{targets.contextdir}}/usr/bin/"$name"
          done

          mkdir -p ${{targets.contextdir}}/docker-entrypoint-initdb.d
          chmod -R 775 ${{targets.contextdir}}/docker-entrypoint-initdb.d
      - uses: iamguarded/finalize-compat
        with:
          package: kibana
          version: ${{vars.major-minor-version}}
    test:
      environment:
        accounts:
          groups:
            - groupname: elasticsearch
              gid: 1000
          users:
            - username: elasticsearch
              uid: 1000
              gid: 1000
          run-as: 0
        contents:
          packages:
            - yq
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: kibana
            version: ${{vars.major-minor-version}}
        - name: run kibana entrypoint script
          uses: test/daemon-check-output
          with:
            start: /opt/iamguarded/scripts/kibana/entrypoint.sh /opt/iamguarded/scripts/kibana/run.sh
            timeout: 30
            expected_output: |
              Starting Kibana setup
        - uses: test/tw/ldd-check
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: kibana-iamguarded
            real-pkg-name: ${{subpkg.name}}

update:
  enabled: true
  github:
    identifier: elastic/kibana
    strip-prefix: v
    tag-filter-prefix: v9.1.

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - runs: |
        export HOME=/usr/share/kibana
        cd $HOME || exit
        ./node/glibc-217/bin/node src/cli/kibana/dist.js | head -n 1 | jq -r .config.serviceVersion.value | grep -F "${{package.version}}"
    - uses: test/tw/ldd-check
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: kibana
        real-pkg-name: ${{package.name}}
