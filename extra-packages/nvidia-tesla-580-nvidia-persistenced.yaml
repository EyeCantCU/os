# Because nvidia's versioning is unusual, this has to scoped to both a
# release track (tesla) and a version stream (580)
package:
  name: nvidia-tesla-580-nvidia-persistenced
  version: "580.126.09"
  epoch: 0
  description: NVIDIA Linux Tesla ${{package.version}} nvidia-persistenced tool
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # From nvidia-tesla-580-tools
      - ${{vars.basename}}-internal~${{package.version}}
      - ${{vars.basename}}-libnvidia-ml~${{package.version}}

var-transforms:
  - from: ${{package.name}}
    match: '^(nvidia-tesla-[0-9]+)-.*'
    replace: '$1'
    to: basename
  - from: ${{package.name}}
    match: '^(nvidia-tesla-[0-9]+)-(.*)'
    replace: '$2'
    to: toolname

environment:
  contents:
    packages:
      - build-base
      - libtirpc-dev
      - m4

pipeline:
  - uses: fetch
    with:
      uri: https://download.nvidia.com/XFree86/${{vars.toolname}}/${{vars.toolname}}-${{package.version}}.tar.bz2
      expected-sha256: e66f3f85e1af2c386698eaefb68f61232347a703c354097e60d8c5a83a3e70ba

  - uses: autoconf/make

  - uses: autoconf/make-install
    with:
      opts: PREFIX=/usr

  - runs: |
      # Stored in nvidia-tesla-580-doc
      rm -rf ${{targets.contextdir}}/usr/share/man
      rmdir ${{targets.contextdir}}/usr/share

  - runs: |
      svc_tmpl=./init/systemd/${{vars.toolname}}.service.template
      mkdir -p ${{targets.contextdir}}/usr/lib/systemd/system

      sed -e 's/__USER__/${{vars.toolname}}/g' \
        -e 's#^\[Unit]#[Unit]\nConditionPathExists=/sys/module/nvidia#' \
        "$svc_tmpl" > \
        ${{targets.contextdir}}/usr/lib/systemd/system/${{vars.toolname}}.service

      mkdir -p ${{targets.contextdir}}/usr/lib/sysusers.d/

      echo 'u ${{vars.toolname}}' > ${{targets.contextdir}}/usr/lib/sysusers.d/${{vars.toolname}}.conf

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: ${{vars.toolname}} --help

update:
  enabled: true
  # We need every release or we might miss some
  # that nvidia-580 kernel driver depends on.
  require-sequential: true
  release-monitor:
    identifier: 388052
