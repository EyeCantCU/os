package:
  name: neuvector
  version: "5.4.7"
  epoch: 4
  description: "NeuVector Full Lifecycle Container Security Platform"
  copyright:
    - license: Apache-2.0
  # CIS benchmarks are hardcoded to /usr/local/bin/
  checks:
    disabled:
      - usrlocal

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - gcc-14-default
      - glibc-dev
      - go
      - jansson-dev
      - jemalloc-dev
      - libnetfilter_queue-dev
      - libnfnetlink-dev
      - libpcap-dev
      - pcre-dev
      - pcre2-dev
      - pkgconf
      - userspace-rcu-dev
      - vectorscan-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 06424701e69bf1eb76ff90180d78853fded93021
      repository: https://github.com/neuvector/neuvector.git
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/containerd/containerd/v2@v2.1.5
        github.com/opencontainers/selinux@v1.13.0
        golang.org/x/crypto@v0.45.0
      replaces: |-
        github.com/samalba/dockerclient=github.com/Dentrax/dockerclient@v0.1.0 github.com/dgrijalva/jwt-go=github.com/golang-jwt/jwt/v4@v4.5.1
      show-diff: true

subpackages:
  - name: neuvector-monitor
    description: "NeuVector Monitor"
    pipeline:
      - runs: |
          # Build and install monitor
          make -C monitor
          install -Dm755 monitor/monitor ${{targets.contextdir}}/usr/local/bin/monitor

          # Install sysctl config
          mkdir -p ${{targets.contextdir}}/etc
          install -Dm755 scripts/sysctl.conf ${{targets.contextdir}}/etc/

          # Install scripts used by monitor
          install -Dm755 scripts/configure.sh ${{targets.contextdir}}/usr/local/bin/
          install -Dm755 scripts/teardown.sh ${{targets.contextdir}}/usr/local/bin/
          install -Dm755 scripts/runtime-gdb.py ${{targets.contextdir}}/usr/local/bin/

          # version > 5.4.0 uses the screipts directory, liking to keep some possible old dependencies
          mkdir -p ${{targets.contextdir}}/usr/local/bin/scripts
          ln -sf /usr/local/bin/configure.sh ${{targets.contextdir}}/usr/local/bin/scripts/configure.sh
          ln -sf /usr/local/bin/teardown.sh ${{targets.contextdir}}/usr/local/bin/scripts/teardown.sh
          ln -sf /usr/local/bin/runtime-gdb.py ${{targets.contextdir}}/usr/local/bin/scripts/runtime-gdb.py
    test:
      pipeline:
        - runs: |
            monitor -h
            cat /usr/local/bin/scripts/configure.sh

  - name: neuvector-nstools
    description: "NeuVector NSTools"
    pipeline:
      - runs: |
          # Disable treating warnings as errors to prevent our builds from failing due to their coding problems
          # "WARN nstools.c:57:9: error: 'ret' may be used uninitialized"
          # "WARN cc1: all warnings being treated as errors"
          # Source: https://github.com/chainguard-dev/extra-packages/pull/1352
          sed -i 's/-Werror//g' tools/nstools/Makefile

          # Build and install nstools
          make -C tools/nstools
          install -Dm755 tools/nstools/nstools ${{targets.contextdir}}/usr/local/bin/nstools

  - name: neuvector-cis-benchmarks
    description: "CIS benchmarks for NeuVector"
    pipeline:
      - runs: |
          # Copy CIS benchmarks
          mkdir -p ${{targets.contextdir}}/usr/local/bin/scripts/
          mkdir -p ${{targets.contextdir}}/usr/local/bin/scripts/cis_yamls/
          cp -r agent/nvbench/utils/ ${{targets.contextdir}}/usr/local/bin/scripts/
          cp -r agent/nvbench/kubernetes-cis-benchmark/cis-1.6.0/ ${{targets.contextdir}}/usr/local/bin/scripts/cis_yamls/
          cp -r agent/nvbench/kubernetes-cis-benchmark/cis-1.23/ ${{targets.contextdir}}/usr/local/bin/scripts/cis_yamls/
          cp -r agent/nvbench/kubernetes-cis-benchmark/cis-1.24/ ${{targets.contextdir}}/usr/local/bin/scripts/cis_yamls/
          cp -r agent/nvbench/kubernetes-cis-benchmark/cis-1.8.0/ ${{targets.contextdir}}/usr/local/bin/scripts/cis_yamls/
          cp -r agent/nvbench/kubernetes-cis-benchmark/cis-k3s-1.8.0/ ${{targets.contextdir}}/usr/local/bin/scripts/cis_yamls/
          cp -r agent/nvbench/kubernetes-cis-benchmark/aks-1.4.0/ ${{targets.contextdir}}/usr/local/bin/scripts/cis_yamls/
          cp -r agent/nvbench/kubernetes-cis-benchmark/eks-1.4.0/ ${{targets.contextdir}}/usr/local/bin/scripts/cis_yamls/
          cp -r agent/nvbench/kubernetes-cis-benchmark/gke-1.4.0/ ${{targets.contextdir}}/usr/local/bin/scripts/cis_yamls/
          cp -r agent/nvbench/kubernetes-cis-benchmark/gke/ ${{targets.contextdir}}/usr/local/bin/scripts/cis_yamls/
          cp -r agent/nvbench/ocp/rh-1.4.0/ ${{targets.contextdir}}/usr/local/bin/scripts/cis_yamls/

  - name: neuvector-upgrader
    description: "NeuVector Upgrader"
    pipeline:
      - uses: go/build
        with:
          packages: ./upgrader
          output: upgrader
          prefix: usr/local

  - name: neuvector-enforcer
    description: "NeuVector Enforcer"
    dependencies:
      runtime:
        - busybox
        - ca-certificates
        - consul
        - curl
        - ethtool
        - iproute2
        - iptables-wrappers
        - jq
        - neuvector-cis-benchmarks
        - neuvector-monitor
        - neuvector-nstools
        - yq
    pipeline:
      - runs: |
          sed -i 's|interim/master.xxxx|v${{package.version}}|g' agent/version.go
      - uses: go/build
        with:
          ldflags: "-X main.version=${{package.version}}"
          packages: ./agent
          output: agent
          prefix: usr/local
      - uses: go/build
        with:
          ldflags: "-X main.version=${{package.version}}"
          packages: ./agent/workerlet/pathWalker
          output: pathWalker
          prefix: usr/local
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/bin
          mkdir -p ${{targets.contextdir}}/usr/local/bin/scripts
          mkdir -p ${{targets.contextdir}}/usr/local/bin/scripts/rem
          mkdir -p ${{targets.contextdir}}/usr/local/bin/scripts/tmpl

          # Install scripts and templates used by agent
          chmod +x agent/nvbench/*.sh
          install -Dm755 agent/nvbench/*.sh ${{targets.contextdir}}/usr/local/bin/scripts/
          install -Dm755 agent/nvbench/*.rem ${{targets.contextdir}}/usr/local/bin/scripts/rem/
          install -Dm755 agent/nvbench/*.tmpl ${{targets.contextdir}}/usr/local/bin/scripts/tmpl/
          install -Dm755 agent/nvbench/journal.tmpl ${{targets.contextdir}}/usr/local/bin/scripts/

          # Build and install dp
          export CFLAGS="$CFLAGS -DRCU_MEMBARRIER=true -I${PWD}/dp"
          export LDFLAGS="$LDFLAGS -lurcu-memb -no-pie"

          # We are overwriting the EXTRA_LDFLAGS here
          # without this dp will fail to build due to referencing of -lhs path is different
          # had to reorder -lstd++ to be after lhs and lm has to be after lhs due to how the build gets or generates the libraries
          export CG_EXTRA_LDFLAGS="-lpcap -lpcre2-8 -ljansson -ljemalloc -pthread -lurcu -lurcu-cds -lrt -lnetfilter_queue -Wl,-rpath,'$$ORIGIN' -Wl,--disable-new-dtags -L/usr/lib -lhs -lm -lstdc++"

          if [[ "${{build.arch}}" == "aarch64" ]]; then
            make EXTRA_LDFLAGS="$CG_EXTRA_LDFLAGS" -C dp -f Makefile_arm64 LDFLAGS="$LDFLAGS" CFLAGS="$CFLAGS"
          else
            make EXTRA_LDFLAGS="$CG_EXTRA_LDFLAGS" -C dp CFLAGS="$CFLAGS" LDFLAGS="$LDFLAGS"
          fi
          mkdir -p ${{targets.contextdir}}/usr/local/bin
          install -Dm755 dp/dp ${{targets.contextdir}}/usr/local/bin/dp

          # NV checks for this empty file to validate enforcer is running in container
          touch ${{targets.contextdir}}/usr/local/bin/.nvcontainer

          # Binaries expected by agent in /usr/local/bin
          ln -sf /bin/consul ${{targets.contextdir}}/usr/local/bin/consul
          ln -sf /usr/bin/iptables-xml ${{targets.contextdir}}/usr/local/bin/iptables-xml
          ln -sf /usr/bin/tcpdump ${{targets.contextdir}}/usr/local/bin/tcpdump
          ln -sf /usr/bin/yq ${{targets.contextdir}}/usr/local/bin/yq
    test:
      pipeline:
        - runs: |
            agent -v | grep "${{package.version}}"
            cat /usr/local/bin/scripts/configure.sh
            cat /usr/local/bin/scripts/journal.tmpl
            cat /usr/local/bin/scripts/cis_yamls/cis-1.8.0/worker/4_worker_nodes.yaml

  - name: neuvector-controller
    description: "NeuVector Controller"
    dependencies:
      runtime:
        - busybox
        - ca-certificates
        - consul
        - ethtool
        - iproute2
        - neuvector-cis-benchmarks
        - neuvector-monitor
        - neuvector-nstools
        - neuvector-upgrader
        - opa
        - pcre
        - procps
    pipeline:
      - runs: |
          sed -i 's|interim/master.xxxx|v${{package.version}}|g' controller/version.go
      - uses: go/build
        with:
          ldflags: "-X main.Version=${{package.version}} -X google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn"
          packages: ./controller
          output: controller
          prefix: usr/local
      - runs: |
          # Create Folders
          mkdir -p ${{targets.contextdir}}/etc/neuvector/templates
          mkdir -p ${{targets.contextdir}}/usr/local/bin

          # Install pod template
          cp templates/podTemplate.json ${{targets.contextdir}}/etc/neuvector/templates/podTemplate.json

          # NV checks for this empty file to validate controller is running in container
          touch ${{targets.contextdir}}/usr/local/bin/.nvcontainer

          # Binaries expected by agent in /usr/local/bin
          ln -sf /usr/bin/opa ${{targets.contextdir}}/usr/local/bin/opa
          ln -sf /bin/consul ${{targets.contextdir}}/usr/local/bin/consul

          # Copy busybox to /usr/bin/cat to work around neuvector controller hardening
          mkdir -p ${{targets.contextdir}}/usr/bin
          cp /bin/busybox ${{targets.contextdir}}/usr/bin/cat
    test:
      pipeline:
        - runs: |
            controller --help 2>&1 |pcregrep -M 'START.*\nUsage'

update:
  enabled: true
  ignore-regex-patterns:
    - '.*\-.*'
    - '.*fnb.*'
    - '.*oc.*'
    - '8.*' # Unimportant tags based on their internal issue tracker
  github:
    identifier: neuvector/neuvector
    tag-filter: v
    strip-prefix: v

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
