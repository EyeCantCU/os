package:
  name: nvidia-libnvidia-nscq
  version: 550.54.14
  epoch: 3
  description: A Library that provides a stable driver API used by DCGM for monitoring NVSwitch devices.
  copyright:
    - license: PROPRIETARY

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: https://developer.download.nvidia.com/compute/nvidia-driver/redist/libnvidia_nscq/linux-sbsa/libnvidia_nscq-linux-sbsa-${{package.version}}-archive.tar.xz
          expected-sha256: acc7b2d66725a89d659ac620e5003da8e4fa068c81f4392e2bc085aa96af5186
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: https://developer.download.nvidia.com/compute/nvidia-driver/redist/libnvidia_nscq/linux-x86_64/libnvidia_nscq-linux-x86_64-${{package.version}}-archive.tar.xz
          expected-sha256: e91f006079ea8a0432ff48c7456b0996bc214adb9f95f2eea237cb0bde94acd2
          timeout: 30

  - working-directory: ${{targets.destdir}}/usr/lib
    runs: |
      mv /home/build/lib/* .

  - runs: |
      mkdir -p ${{targets.destdir}}/usr
      mv LICENSE ${{targets.destdir}}/usr/${{package.name}}.LICENSE

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false

test:
  pipeline:
    - runs: |
        readlink -v /usr/lib/libnvidia-nscq.so
        readlink -v /usr/lib/libnvidia-nscq.so.2
        readlink -v /usr/lib/libnvidia-nscq.so.2.0
