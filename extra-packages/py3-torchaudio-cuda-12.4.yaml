package:
  name: py3-torchaudio-cuda-12.4
  version: 2.6.0
  epoch: 11 # go/extras-rsc/py3-torchaudio-cuda-12.4
  description: Data manipulation and transformation for audio signal processing, powered by PyTorch
  copyright:
    - license: BSD-2-Clause
  target-architecture:
    - x86_64
  resources:
    cpu: 16
    memory: 42Gi
  options:
    no-depends: true

vars:
  cudnn-version: 9
  gcc-version: 12
  torch-version: 2.6

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.\d+$'
    replace: '$1'
    to: cuda-major-version
  - from: ${{package.name}}
    match: '^py(\d+\.\d+)-.*'
    replace: '$1'
    to: python-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-15
      - cmake-3
      - coreutils
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - gcc-${{vars.gcc-version}}-default
      - git
      - libffi-dev
      - libgomp
      - libjpeg-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libpng-utils
      - lld-15
      - llvm-15
      - llvm-15-dev
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - nvidia-cuda-nvml-dev-${{vars.cuda-version}}
      - nvidia-cuda-profiler-api-${{vars.cuda-version}}
      - nvidia-nccl-cuda-${{vars.cuda-version}}-dev
      - openmp-17-dev
      - patchelf
      - posix-libc-utils
      - py3-supported-build-base-dev
      - py3-supported-installer
      - py3-supported-numpy-2.2
      - py3-supported-pip
      - py3-supported-setuptools
      - py3-supported-torch-cuda-${{vars.cuda-version}}-dev
      - py3-supported-wheel
      - samurai
  environment:
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
    PATH: "$PATH:/usr/local/cuda-${{vars.cuda-version}}/bin"
    MAX_JOBS: 16
    USE_CUDA: 1
    FORCE_CUDA: 1
    USE_CUDNN: 1
    TORCH_CUDA_ARCH_LIST: "5.2 6.0 6.1 7.0+PTX 8.0 8.6 8.7 8.9 9.0"
    TORCH_NVCC_FLAGS: "-Xfatbin -compress-all"
    CFLAGS: "$CFLAGS -Wno-error=nonnull -Wno-nonnull"
    CXXFLAGS: "$CXXFLAGS -Wno-error=nonnull -Wno-nonnull"
    CUDA_VERSION: "${{vars.cuda-version}}"
    CUDAToolkit_ROOT: "/usr/local/cuda-${{vars.cuda-version}}"
    BUILD_VERSION: "${{package.version}}+cu124"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/audio
      tag: v${{package.version}}
      expected-commit: d8831425203385077a03c1d92cfbbe3bf2106008

  - name: prepare sdist in advance to avoid creating a new one for each build variant
    runs: |
      python3.10 -m build --sdist -n -x

subpackages:
  - range: py-versions
    name: py${{range.key}}-torchaudio-cuda-${{vars.cuda-version}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    options:
      no-depends: true
    dependencies:
      runtime:
        - cuda-toolkit-${{vars.cuda-version}}
        # For some reason this isn't detected
        - libgomp
        - libjpeg-turbo
        - libpng
        - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}
        - nvidia-nccl-cuda-${{vars.cuda-version}}
        - openmp-17-dev
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-pillow
        - py${{range.key}}-pyyaml
        - py${{range.key}}-torch-cuda-${{vars.cuda-version}}
        - py${{range.key}}-typing-extensions
    pipeline:
      - runs: |
          python${{range.key}} -m pip install --verbose \
            --no-index --no-build-isolation --no-deps \
            --force-reinstall --no-compile --prefix=/usr "--root=${{targets.contextdir}}" dist/torchaudio-${{package.version}}+cu124.tar.gz
          sitepkgd=$(python${{range.key}} -c 'import site; print(site.getsitepackages()[0])')
          python${{range.key}} -m compileall --invalidation-mode=unchecked-hash -r100 ${{targets.contextdir}}/$sitepkgd
    test:
      environment:
        environment:
          CUDNN_HOME: "/usr/local/cudnn-${{vars.cudnn-version}}"
          CUDA_HOME: "/usr/local/cuda-${{vars.cuda-version}"
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: torch
        - uses: python/import
          with:
            python: python${{range.key}}
            import: torchaudio

  - name: py3-supported-torchaudio-cuda-${{vars.cuda-version}}
    description: meta package providing torchaudio for supported python versions.
    dependencies:
      runtime:
        - py3.10-torchaudio-cuda-${{vars.cuda-version}}
        - py3.11-torchaudio-cuda-${{vars.cuda-version}}
        - py3.12-torchaudio-cuda-${{vars.cuda-version}}
        - py3.13-torchaudio-cuda-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: test/emptypackage
        - uses: python/import
          with:
            python: python3.10
            import: torchaudio
        - uses: python/import
          with:
            python: python3.11
            import: torchaudio
        - uses: python/import
          with:
            python: python3.12
            import: torchaudio
        - uses: python/import
          with:
            python: python3.13
            import: torchaudio

update:
  enabled: true
  github:
    identifier: pytorch/audio
    strip-prefix: v
    tag-filter: v2.6.

test:
  pipeline:
    - uses: test/tw/byproductpackage
