package:
  name: nvidia-nsight-compute-12.4
  version: 2024.1.1.4
  epoch: 1
  description: Nsight Compute
  copyright:
    - license: LicenseRef-NVIDIA-SLA
      license-path: LICENSE
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-nsight-compute=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/nsight_compute/linux-sbsa/nsight_compute-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "5e3b489eaffe329cc3b204a31e9b9c9bd231203ddfd89f57e04fc59c3119527e"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/nsight_compute/linux-x86_64/nsight_compute-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "b6aee577e61db6823a2fe44fcce4902962c7ea90fbb29800ffcceb3df7ea8d47"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv bin ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv nsight-compute ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/

test:
  environment:
    contents:
      packages:
        - bash
  pipeline:
    - name: Verify installation and binaries
      runs: |
        test -x /usr/local/cuda-${{vars.cuda-version}}/bin/ncu
        test -x /usr/local/cuda-${{vars.cuda-version}}/bin/ncu-ui
    - name: Test binary functionality
      runs: |
        # Create symlinks for the nsight-compute version
        ln -s /usr/local/cuda-${{vars.cuda-version}}/nsight-compute/2024.1.1 /usr/local/cuda-${{vars.cuda-version}}/nsight-compute-2024.1.1

        /usr/local/cuda-${{vars.cuda-version}}/bin/ncu --version
        /usr/local/cuda-${{vars.cuda-version}}/bin/ncu --list-sections

update:
  enabled: false
