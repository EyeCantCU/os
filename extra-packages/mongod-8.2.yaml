package:
  name: mongod-8.2
  version: "8.2.3"
  epoch: 0
  description: "The MongoDB Database"
  resources:
    cpu: 30
    memory: 100Gi
    disk: 100Gi
  dependencies:
    provides:
      - mongod=${{package.full-version}}
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  copyright:
    - license: "SSPL-1.0"

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - bash
      - bazelisk
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl-dev
      - gcc-14-default
      - ld-linux
      - libatomic-14
      - libxml2-dev
      - openjdk-21-default-jdk
      - openssl-dev
      - py3.11-pip
      # The build doesn't work on Python 3.12 yet
      - python-3.11
      - python-3.11-dev
      - render-template
      - wolfi-base
      - xz-dev
      - zlib-dev
  environment:
    BAZEL_CXXOPTS: "-std=c++20"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mongodb/mongo
      tag: r${{package.version}}
      expected-commit: 029d8f99bf1e828b5327946b9c820bf493f466f1

  - uses: patch
    with:
      patches: |
        0001-bazel-do-not-toy-with-FORTIFY_SOURCE-settings.patch
        0002-libbson-add-missing-defines.patch
        0003-util-underlinked-dns_query.patch
        0004-abseil-cpp-fix-FTBFS-with-constant-expressions.patch
        0005-bazelrc-update-to-c-20.patch

  - runs: |
      # Mongo requires a very specific build of poetry to install build deps, our packaged one doesn't work.
      # Version from https://github.com/mongodb/mongo/blob/r8.0.6/docs/building.md#python-prerequisites
      # The build runs better in a virtualenv as well.
      set -x
      python3 -m venv .venv
      . .venv/bin/activate
      python3 -m pip install 'poetry==2.0.0'

      # https://jira.mongodb.org/browse/WT-12911
      # https://github.com/mongodb/mongo/commit/fba135f07efbcd6ce5ba74e9610e7848c82d849d
      export PYTHON_KEYRING_BACKEND=keyring.backends.null.Keyring
      if python3 -m poetry install --no-root --sync; then
          echo "WT-12911: poetry install passed the first time. delete this if/else"
      else
          rc=$?
          echo "WT-12911: poetry install failed [$rc], \"fixing\" that problem by doing it again"
          python3 -m poetry install --no-root --sync
      fi

      # drop more of enterprise build
      sed '/src\/mongo\/db\/modules\/enterprise/d' -i src/BUILD.bazel

      bazelisk build //:install-devcore

      mongod_binary="$(readlink -f bazel-bin/install/bin//mongod)"

      mkdir -p ${{targets.destdir}}/usr/bin
      mv $mongod_binary ${{targets.destdir}}/usr/bin/mongod

  - uses: strip

subpackages:
  - name: "mongos-8.2"
    description: "mongo sharding"
    dependencies:
      provides:
        - mongos=${{package.full-version}}
    pipeline:
      - runs: |
          mongos_binary="$(readlink -f bazel-bin/install/bin//mongos)"

          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv $mongos_binary ${{targets.subpkgdir}}/usr/bin/mongos
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: mongos
            real-pkg-name: ${{subpkg.name}}

  - name: "mongos-8.2-iamguarded-compat"
    description: "mongos iamguarded compat"
    dependencies:
      runtime:
        # Required by startup scripts
        - bash
        - coreutils
        - posix-libc-utils
        - merged-usrsbin
        - mongo-${{vars.major-minor-version}}
        - mongod-${{vars.major-minor-version}}
        - mongos-${{vars.major-minor-version}}
        - mongosh
        - posix-libc-utils
        - render-template
        # These are needed, but must be specified in the image config to enable FIPS alternatives.
        #- mongo-tools
        #- wait-for-port
        #- yq
        - wolfi-baselayout
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: mongodb-sharded
          version: ${{vars.major-minor-version}}
      - runs: |
          mkdir -p /opt/iamguarded
          mkdir -p /opt/iamguarded/licenses
          mkdir -p /opt/iamguarded/scripts
          mkdir -p /opt/iamguarded/etc
          mkdir -p /opt/iamguarded/common/bin

          # NOTE: These are intentionally "mongodb" and not "mongos" or "mongodb-sharded"
          mkdir -p /opt/iamguarded/mongodb/bin
          mkdir -p /opt/iamguarded/mongodb/logs
          mkdir -p /opt/iamguarded/mongodb/tmp
          mkdir -p /opt/iamguarded/mongodb/templates
          mkdir -p /opt/iamguarded/mongodb/conf
          mkdir -p /opt/iamguarded/mongodb/licenses
          mkdir -p /opt/iamguarded/mongodb/data/db

          ln -sf /usr/bin/render-template /opt/iamguarded/common/bin/render-template
          ln -sf /usr/bin/wait-for-port /opt/iamguarded/common/bin/wait-for-port
          ln -sf /usr/bin/yq /opt/iamguarded/common/bin/yq

          # This script does some magic with env vars, templates, etc. etc.
          # it is easier to run it than figure out everything that it touches.
          /opt/iamguarded/scripts/mongodb-sharded/postunpack.sh
      - runs: |
          # Set the target directory for the symbolic links
          target_dir="/opt/iamguarded/mongodb/bin/"

          # Loop through the binaries in /usr/bin/
          for binary_path in /usr/bin/mongo*; do
              # Check if the path is a file and not a directory
              if [ -f "$binary_path" ]; then
                  # Extract the binary name from the path
                  binary_name=$(basename "$binary_path")

                  # Create the symbolic link
                  ln -sf "$binary_path" "$target_dir$binary_name"

                  echo "Created symbolic link for $binary_name"
              fi
          done
          for binary in mongo mongod bsondump mongodump mongoexport mongofiles mongoimport mongorestore mongos mongosh mongostat mongotop; do
            ln -sf /usr/bin/$binary /opt/iamguarded/mongodb/bin/$binary
          done

          ln -s /opt/iamguarded/scripts/mongodb-sharded/entrypoint.sh ${{targets.contextdir}}/entrypoint.sh
          ln -s /opt/iamguarded/scripts/mongodb-sharded/run.sh ${{targets.contextdir}}/run.sh
          ln -s /opt/iamguarded/scripts/liblog.sh ${{targets.contextdir}}/liblog.sh
      - runs: |
          # touch/mkdir these empty files and directories to quiet various startup messages per upstream
          touch "${{targets.subpkgdir}}"/.dbshell
          touch "${{targets.subpkgdir}}"/.mongorc.js
          touch "${{targets.subpkgdir}}"/.mongoshrc.js
          mkdir "${{targets.subpkgdir}}"/.mongodb
          mkdir "${{targets.subpkgdir}}"/docker-entrypoint-initdb.d
      - uses: iamguarded/finalize-compat
        with:
          package: mongodb-sharded
          version: ${{vars.major-minor-version}}
      # TODO(maxgio92): restore this hardlink, once Melange is released with:
      # * https://github.com/chainguard-dev/melange/pull/205
      - runs: rm -f ./bazel-bin/install-dist/LICENSE-Community.txt
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: mongodb-sharded
            version: ${{vars.major-minor-version}}
        - runs: |
            run-script --version
            run-script --help
        - runs: |
            for binary in mongo mongod bsondump mongodump mongoexport mongofiles mongoimport mongorestore mongos mongosh mongostat mongotop; do
              test "$(readlink /opt/iamguarded/mongodb/bin/$binary)" = "/usr/bin/$binary"
            done

  - name: "mongo-8.2"
    description: "mongo shell"
    dependencies:
      provides:
        - mongo=${{package.full-version}}
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mongo_binary="$(readlink -f bazel-bin/install/bin/mongo)"

          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv $mongo_binary ${{targets.subpkgdir}}/usr/bin/mongo
    test:
      pipeline:
        - runs: |
            mongo --version
            mongo --help
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: mongo
            real-pkg-name: ${{subpkg.name}}

  - name: "mongod-8.2-iamguarded-compat"
    description: "mongod iamguarded compat"
    dependencies:
      runtime:
        # Required by startup scripts
        - bash
        - coreutils
        - merged-usrsbin
        - mongo-8.2
        - mongod-8.2
        - mongosh
        - posix-libc-utils
        - render-template
        # These are needed, but must be specified in the image config to enable FIPS alternatives.
        #- gosu
        #- busybox
        #- mongo-tools
        #- wait-for-port
        #- yq
        - wolfi-baselayout
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: mongodb
          version: ${{vars.major-minor-version}}
      - runs: |
          mkdir -p /opt/iamguarded
          mkdir -p /opt/iamguarded/licenses
          mkdir -p /opt/iamguarded/scripts
          mkdir -p /opt/iamguarded/etc
          mkdir -p /opt/iamguarded/common/bin
          mkdir -p /opt/iamguarded/mongodb/bin
          mkdir -p /opt/iamguarded/mongodb/logs
          mkdir -p /opt/iamguarded/mongodb/tmp
          mkdir -p ${{targets.subpkgdir}}/iamguarded/mongodb/conf
          mkdir -p ${{targets.subpkgdir}}/iamguarded/mongodb/data/db

          ln -sf /usr/bin/gosu /opt/iamguarded/common/bin/gosu
          ln -sf /usr/bin/render-template /opt/iamguarded/common/bin/render-template
          ln -sf /usr/bin/wait-for-port /opt/iamguarded/common/bin/wait-for-port
          ln -sf /usr/bin/yq /opt/iamguarded/common/bin/yq

          /opt/iamguarded/scripts/mongodb/postunpack.sh
      - runs: |
          # Set the target directory for the symbolic links
          target_dir="/opt/iamguarded/mongodb/bin/"

          # Loop through the binaries in /usr/bin/
          for binary_path in /usr/bin/mongo*; do
              # Check if the path is a file and not a directory
              if [ -f "$binary_path" ]; then
                  # Extract the binary name from the path
                  binary_name=$(basename "$binary_path")

                  # Create the symbolic link
                  ln -sf "$binary_path" "$target_dir$binary_name"

                  echo "Created symbolic link for $binary_name"
              fi
          done
          for binary in mongo mongod bsondump mongodump mongoexport mongofiles mongoimport mongorestore mongos mongosh mongostat mongotop; do
            ln -sf /usr/bin/$binary /opt/iamguarded/mongodb/bin/$binary
          done
      - runs: |
          # touch/mkdir these empty files and directories to quiet various startup messages per upstream
          touch "${{targets.subpkgdir}}"/.dbshell
          touch "${{targets.subpkgdir}}"/.mongorc.js
          touch "${{targets.subpkgdir}}"/.mongoshrc.js
          mkdir "${{targets.subpkgdir}}"/.mongodb
          mkdir "${{targets.subpkgdir}}"/docker-entrypoint-initdb.d
      - uses: iamguarded/finalize-compat
        with:
          package: mongodb
          version: ${{vars.major-minor-version}}
      # TODO(maxgio92): restore this hardlink, once Melange is released with:
      # * https://github.com/chainguard-dev/melange/pull/205
      - runs: rm -f ./bazel-bin/install-dist/LICENSE-Community.txt
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: mongodb
            version: ${{vars.major-minor-version}}
        - runs: |
            run-script --version
            run-script --help
        - runs: |
            for binary in mongo mongod bsondump mongodump mongoexport mongofiles mongoimport mongorestore mongos mongosh mongostat mongotop; do
              test "$(readlink /opt/iamguarded/mongodb/bin/$binary)" = "/usr/bin/$binary"
            done

update:
  enabled: true
  github:
    identifier: mongodb/mongo
    strip-prefix: r
    use-tag: true
    tag-filter: r8.2.

test:
  pipeline:
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: mongod
        real-pkg-name: ${{package.name}}
