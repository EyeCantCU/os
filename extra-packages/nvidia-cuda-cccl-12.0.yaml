package:
  name: nvidia-cuda-cccl-12.0
  version: 12.0.140
  epoch: 3
  description: CXX Core Compute Libraries
  copyright:
    - license: LicenseRef-NVIDIA-CUDA-cccl
      license-path: LICENSE
  dependencies:
    provides:
      - nvidia-cuda-cccl=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cccl/linux-sbsa/cuda_cccl-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "8ac9fa2cbaf2ead8c7794b787eea98a7ee94ecf44f99d564e1a4ae349f08a153"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cccl/linux-x86_64/cuda_cccl-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "99ab5e0f671490141e0f41724f271dbfad75fb1105532f0726523d4fdcf12783"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv include ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv lib ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/lib64
      cp LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE

test:
  pipeline:
    - name: Verify license exists
      runs: |
        if [ ! -f /usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE ]; then
          echo "License file not found"
          exit 1
        fi
    - name: Verify lib and include directories exist
      runs: |
        if [ ! -d /usr/local/cuda-${{vars.cuda-version}}/lib64 ]; then
          echo "lib64 directory not found"
          exit 1
        fi
        if [ ! -d /usr/local/cuda-${{vars.cuda-version}}/include ]; then
          echo "include directory not found"
          exit 1
        fi
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: nvidia-cuda-cccl
        real-pkg-name: ${{package.name}}

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
