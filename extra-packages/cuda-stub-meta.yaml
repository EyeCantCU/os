package:
  name: cuda-stub-meta
  version: 1
  epoch: 4
  description: metapackages to simply CUDA stub library usage in build/test
  copyright:
    - license: BSD-3-Clause
  options:
    no-depends: true
    no-provides: true

data:
  - name: cuda-versions
    items:
      11.4:
      11.5:
      11.6:
      11.7:
      11.8:
      12.0:
      12.1:
      12.2:
      12.3:
      12.4:
      12.5:
      12.6:
      12.8:
      12.9:
      13.0:
      13.1:

environment:
  contents:
    packages:
      - busybox
      - wolfi-base

pipeline:
  - name: Without this, subpackages don't build.

subpackages:
  - range: cuda-versions
    name: libcuda-stub-cuda-${{range.key}}-dev
    description: metapackage to provide the libcuda.so stub in the system path
    dependencies:
      runtime:
        - nvidia-cuda-ld-config-${{range.key}}-dev
        - nvidia-cuda-cudart-${{range.key}}-dev
    test:
      pipeline:
        - runs: |
            ldsocache="$(mktemp)"
            trap "rm -f $ldsocache" EXIT
            ldconfig -C "$ldsocache"
            ldconfig -C "$ldsocache" -p | grep '/usr/local/cuda-${{range.key}}/lib64/stubs/libcuda\.so'

  - range: cuda-versions
    name: libnvidia-ml-stub-cuda-${{range.key}}-dev
    description: metapackage to provide the libnvidia-ml.so stub in the system path
    dependencies:
      runtime:
        - nvidia-cuda-ld-config-${{range.key}}-dev
        - nvidia-cuda-nvml-dev-${{range.key}}
    test:
      pipeline:
        - runs: |
            ldsocache="$(mktemp)"
            trap "rm -f $ldsocache" EXIT
            ldconfig -C "$ldsocache"
            ldconfig -C "$ldsocache" -p | \
              grep '/usr/local/cuda-${{range.key}}/lib64/stubs/libnvidia-ml\.so'

update:
  enabled: false
  exclude-reason: This is a stub package with no upstream

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
