#nolint:valid-spdx-license
package:
  name: mssql-tools18
  version: 18.4.1.1
  epoch: 4
  description: "Tools for Microsoft(R) SQL Server(R)"
  copyright:
    - license: "MICROSOFT SOFTWARE LICENSE"
    - license: "https://odbceula.blob.core.windows.net/eula18/LICENSE18.TXT"

vars:
  # Keep in sync with msodbcsql
  # New versions can usually be found here: https://learn.microsoft.com/en-us/sql/connect/odbc/download-odbc-driver-for-sql-server?view=sql-server-ver17#ubuntu
  ubuntu-version: 22.04

var-transforms:
  - from: ${{package.name}}
    match: '.*tools(\d+)$'
    replace: "$1"
    to: major-version

environment:
  contents:
    packages:
      - busybox
      - curl
      - dpkg-dev
      # These two are needed because the tar implementation is finicky.
      - gnutar
      - xz

pipeline:
  # Make sure that one of the legs of the `fetch` pipeline is executed.
  # Note we don't extract since we need to use the `dpkg-deb` tool to extract.
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == "x86_64"
        uses: fetch
        with:
          uri: https://packages.microsoft.com/ubuntu/${{vars.ubuntu-version}}/prod/pool/main/m/mssql-tools${{vars.major-version}}/mssql-tools${{vars.major-version}}_${{package.version}}-1_amd64.deb
          expected-sha512: 6872edb545482cc3a555dde61869d9e4cde0feaa75c63f72ca67cdc9ee978606cecbe4ce45796862d828cc00f38d94fa0f3f951ad3de185ac3989f1788e93905
          extract: false
      - if: ${{build.arch}} == "aarch64"
        uses: fetch
        with:
          uri: https://packages.microsoft.com/ubuntu/${{vars.ubuntu-version}}/prod/pool/main/m/mssql-tools18/mssql-tools18_${{package.version}}-1_arm64.deb
          expected-sha512: 69270780bfcd0e01cc0e8bf9d1762ec683c439e21ef4ff7302088792e7d303b0ac849763b7fe299a1787cdd77547e2388db072b21fd47953fb0d371d948cffbb
          extract: false

  - runs: |
      mkdir -p ${{targets.destdir}}/${{package.name}}
      dpkg-deb -x ./*.deb ${{targets.destdir}}

update:
  enabled: false
  exclude-reason: "https://github.com/chainguard-dev/internal-dev/issues/1409"

test:
  pipeline:
    - uses: test/tw/contains-files
      with:
        dir: "/opt/mssql-tools18/share/resources/en_US/"
        name: "*.rll"
