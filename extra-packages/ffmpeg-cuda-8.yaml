#nolint:git-checkout-must-use-github-updates
package:
  name: ffmpeg-cuda-8
  version: "8.0.1"
  epoch: 2
  description: ffmpeg multimedia library
  copyright:
    - license: GPL-3.0-or-later AND LGPL-3.0-or-later
  dependencies:
    provider-priority: 1
    provides:
      - ffmpeg-cuda=${{package.full-version}}
  resources:
    cpu: 16
    memory: 16Gi

environment:
  contents:
    packages:
      - aom
      - aom-dev
      - aom-libs
      - build-base
      - busybox
      - ca-certificates-bundle
      - dav1d-dev
      - expat-dev
      - ffnvcodec
      - fontconfig-dev
      - harfbuzz-dev
      - lame-dev
      - libogg-dev
      - libsdl2-dev
      - libsodium-dev
      - libsrt
      - libssh-dev
      - libtheora
      - libtheora-dev
      - libvorbis-dev
      - libwebp-dev
      - libxml2-dev
      - nasm
      - nvidia-codec-sdk
      - openjpeg-dev
      - openssl-dev
      - opus-dev
      - snappy-dev
      - soxr-dev
      - speex-dev
      - svt-av1-dev
      - wolfi-baselayout
      - x264-dev
      - x265-dev
      - yasm
      - zeromq-dev
  environment:
    LIBRARY_PATH: /usr/lib/nvidia-codec-sdk/stubs

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/FFmpeg/FFmpeg
      expected-commit: 894da5ca7d742e4429ffb2af534fcda0103ef593
      tag: n${{package.version}}

  - runs: |
      ./configure \
        --prefix=/usr \
        --libdir=/usr/lib \
        --enable-shared \
        --enable-libx264 \
        --enable-libx265 \
        --enable-libaom \
        --enable-libtheora \
        --enable-ffnvcodec \
        --enable-gpl \
        --enable-version3 \
        --enable-openssl \
        --enable-libmp3lame \
        --enable-ffplay \
        --enable-libdav1d \
        --enable-libharfbuzz \
        --enable-libopus \
        --enable-libsnappy \
        --enable-libsrt \
        --enable-libssh \
        --enable-libsvtav1 \
        --enable-libvorbis \
        --enable-libwebp \
        --enable-libxml2 \
        --enable-lzma \
        --enable-libfontconfig \
        --enable-libfreetype \
        --enable-libopenjpeg \
        --enable-libspeex \
        --enable-libsoxr \
        --enable-libzmq

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-static
    dependencies:
      provides:
        - ffmpeg-cuda-static=${{package.full-version}}
    pipeline:
      - uses: split/static
    description: ffmpeg static libraries
    test:
      pipeline:
        - uses: test/tw/staticpackage

  - name: ${{package.name}}-dev
    dependencies:
      runtime:
        - ${{package.name}}
        - ${{package.name}}-static
      provides:
        - ffmpeg-cuda-dev=${{package.full-version}}
    pipeline:
      - uses: split/dev
    description: ffmpeg development headers
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/pkgconf

  - name: ${{package.name}}-doc
    dependencies:
      provides:
        - ffmpeg-cuda-doc=${{package.full-version}}
    pipeline:
      - uses: split/manpages
    description: ffmpeg manpages
    test:
      pipeline:
        - uses: test/emptypackage

update:
  enabled: true
  ignore-regex-patterns:
    - .*dev.*
  git:
    strip-prefix: n
    tag-filter-prefix: n8.0

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        ffmpeg --help
        ffprobe --help
        ffplay --help
        # Generate and verify a 1-second, 128x128 color test video using libx264 (H.264 encoder)
        ffmpeg -f lavfi -i testsrc=duration=1:size=128x128:rate=30 \
           -c:v libx264 -pix_fmt yuv420p out.mp4
        test -f out.mp4

        # Generate and confirm a 1-second 1000Hz sine wave and encode it to MP3 using libmp3lame
        ffmpeg -f lavfi -i sine=frequency=1000:duration=1 -c:a libmp3lame test.mp3
        test -f test.mp3

        # Inspect the video file metadata
        ffprobe -v error -show_format -show_streams out.mp4
    - uses: test/tw/ldd-check
