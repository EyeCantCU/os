package:
  name: py3-captum
  version: 0.8.0
  epoch: 0
  description: Model interpretability and understanding for PyTorch
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: captum
  cuda-version: 12.9

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/captum.git
      tag: v${{package.version}}
      expected-commit: fc17d5070c5447593749ce28f9602c7ae58d54ac

  - runs: sed -i "s/numpy<2.0/numpy/g" ./setup.py

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-matplotlib
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-packaging
        - py${{range.key}}-torch-cuda-${{vars.cuda-version}}
        - py${{range.key}}-tqdm
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | grep -E -e "IG Attributions: tensor\(\[\[.*\],"
            from captum.attr import IntegratedGradients
            import json
            import numpy as np
            import torch
            import torch.nn as nn

            class ToyModel(nn.Module):
                def __init__(self):
                    super().__init__()
                    self.lin1 = nn.Linear(3, 3)
                    self.relu = nn.ReLU()
                    self.lin2 = nn.Linear(3, 2)

                    # initialize weights and biases
                    self.lin1.weight = nn.Parameter(torch.arange(-4.0, 5.0).view(3, 3))
                    self.lin1.bias = nn.Parameter(torch.zeros(1,3))
                    self.lin2.weight = nn.Parameter(torch.arange(-3.0, 3.0).view(2, 3))
                    self.lin2.bias = nn.Parameter(torch.ones(1,2))

                def forward(self, input):
                    return self.lin2(self.relu(self.lin1(input)))


            model = ToyModel()
            torch.manual_seed(123)
            np.random.seed(123)
            input = torch.rand(2, 3)
            baseline = torch.zeros(2, 3)
            ig = IntegratedGradients(model)
            attributions, _ = ig.attribute(input, baseline, target=0, return_convergence_delta=True)
            print('IG Attributions:', attributions)
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
