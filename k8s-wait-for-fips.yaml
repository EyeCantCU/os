package:
  name: k8s-wait-for-fips
  version: 2.0
  epoch: 0
  description: A simple script that allows to wait for a k8s service, job or pods to enter a desired state
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - curl
      - jq
      # Adding kubectl-fips-default at image level as at package level with kwok/cluster causes conflicts; they both are trying to write the kubectl binary to the same path
      # - kubectl-fips-default
      - openssl-config-fipshardened

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/groundnuty/k8s-wait-for
      tag: v${{package.version}}
      expected-commit: 79b1f15b3e139e2d1a031e164f0003bc6e0df65b

  - runs: |
      install -Dm755 wait_for.sh ${{targets.destdir}}/usr/bin/wait_for.sh

test:
  pipeline:
    - runs: |
        wait_for.sh | grep -q "This script waits until a job"
    - uses: test/kwok/cluster
    - runs: |
        kubectl apply -f - <<EOF
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: dummy-job
        spec:
          template:
            spec:
              containers:
              - name: hello
                image: busybox
                command: ["sh", "-c", "echo Hello from the job; sleep 2"]
              restartPolicy: Never
          backoffLimit: 1
        EOF
        wait_for.sh job dummy-job

update:
  enabled: true
  github:
    identifier: groundnuty/k8s-wait-for
    strip-prefix: v
