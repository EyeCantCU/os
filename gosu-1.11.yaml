package:
  name: gosu-1.11
  version: "1.11"
  epoch: 12 # CVE-2025-61725
  description: Simple Go-based setuid+setgid+setgroups+exec
  copyright:
    - license: GPL-3.0
  dependencies:
    provides:
      - gosu=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tianon/gosu
      tag: ${{package.version}}
      expected-commit: 54529816221a75b98dcad5b747db5d04c2d54099

  - uses: go/build
    with:
      packages: .
      output: gosu
      ldflags: -s -w

  - uses: strip

update:
  enabled: true
  github:
    identifier: tianon/gosu
    use-tag: true
    tag-filter: 1.11

test:
  pipeline:
    - runs: |
        gosu -v
