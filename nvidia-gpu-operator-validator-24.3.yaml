package:
  name: nvidia-gpu-operator-validator-24.3
  version: 24.3.0
  epoch: 4
  description: NVIDIA Validators for the GPU Operator Components
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-gpu-operator-validator=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go
      - make
  environment:
    CGO_ENABLED: "0"
    NVIDIA_DISABLE_REQUIRE: "true"
    NVIDIA_VISIBLE_DEVICES: void
    NVIDIA_DRIVER_CAPABILITIES: utility,compute

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/gpu-operator
      tag: v${{package.version}}
      expected-commit: 0fe1e8db32b05ddab8bbd4d5bcc3f492b75cfee4

  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.23.0 github.com/NVIDIA/nvidia-container-toolkit@v1.16.2

  - name: Make Validator
    runs: |
      make -C validator/ validator

  - name: copy files
    runs: |
      mkdir -p ${{targets.contextdir}}/licenses
      mkdir -p ${{targets.contextdir}}/var/nvidia/manifests
      mkdir -p ${{targets.contextdir}}/usr/bin
      cp NGC-DL-CONTAINER-LICENSE -P ${{targets.contextdir}}/licenses/NGC-DL-CONTAINER-LICENSE

      cp /home/build/validator/validator ${{targets.contextdir}}/usr/bin/nvidia-validator
      cp /home/build/validator/plugin-workload-validation.yaml ${{targets.contextdir}}/var/nvidia/manifests
      cp /home/build/validator/cuda-workload-validation.yaml ${{targets.contextdir}}/var/nvidia/manifests

  - uses: strip

test:
  pipeline:
    - runs: nvidia-validator --help

update:
  enabled: true
  github:
    identifier: NVIDIA/gpu-operator
    strip-prefix: v
    use-tag: true
    tag-filter: v24.3.
