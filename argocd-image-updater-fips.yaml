package:
  name: argocd-image-updater-fips
  version: "1.0.1"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: Automatic container image update for Argo CD
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - aws-cli-2
      - ca-certificates
      - git
      - gpg-fips
      - openssh-client
      - openssl-config-fipshardened
      - tini

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/argoproj-labs/argocd-image-updater
      tag: v${{package.version}}
      expected-commit: cc3918176c900b4f561a0a392ca47d159a125f6c

  - uses: go/bump
    with:
      deps: |-
        k8s.io/kubernetes@v1.33.4
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: ./cmd/
      go-package: go-fips
      output: argocd-image-updater
      ldflags: |
        -X github.com/argoproj-labs/argocd-image-updater/pkg/version.version=${{package.version}}
        -X github.com/argoproj-labs/argocd-image-updater/pkg/version.gitCommit=$(git rev-parse HEAD)
        -X github.com/argoproj-labs/argocd-image-updater/pkg/version.buildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')

update:
  enabled: true
  github:
    identifier: argoproj-labs/argocd-image-updater
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
    - name: Check version
      runs: |
        argocd-image-updater version | grep -q ${{package.version}}
    - uses: test/kwok/cluster
    - name: more tests
      runs: |
        argocd-image-updater test nginx
