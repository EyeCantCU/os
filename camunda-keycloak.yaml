package:
  name: camunda-keycloak
  version: "2025.07.21.001"
  epoch: 0
  description: "Camunda Keycloak"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: "-"
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/camunda/keycloak
      tag: ${{vars.mangled-package-version}}
      expected-commit: 653fe212c625ae00551db6e97a63d19992d6d039

subpackages:
  - name: "${{package.name}}-compat"
    dependencies:
      runtime:
        - aws-sdk-java-v2
        - keycloak-metrics-spi
    description: "Compatibility package to place jars in the location expected by upstream"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/opt/iamguarded
          mkdir -p ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers
          mkdir -p ${{targets.subpkgdir}}/opt/iamguarded/log
          mkdir -p ${{targets.subpkgdir}}/opt/iamguarded/tmp

          # aws sdk
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-annotations-${{package.version}}.jar               ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/annotations-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-apache-client-${{package.version}}.jar             ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/apache-client-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-auth-${{package.version}}.jar                      ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/auth-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-aws-core-${{package.version}}.jar                  ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/aws-core-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-aws-query-protocol-${{package.version}}.jar        ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/aws-query-protocol-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-checksums-${{package.version}}.jar                 ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/checksums-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-checksums-spi-${{package.version}}.jar             ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/checksums-spi-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-endpoints-spi-${{package.version}}.jar             ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/endpoints-spi-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-eventstream-${{package.version}}.jar               ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/eventstream-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-${{package.version}}.jar                 ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/http-auth-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-aws-${{package.version}}.jar             ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/http-auth-aws-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-spi-${{package.version}}.jar             ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/http-auth-spi-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-http-client-spi-${{package.version}}.jar           ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/http-client-spi-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-identity-spi-${{package.version}}.jar              ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/identity-spi-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-json-utils-${{package.version}}.jar                ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/json-utils-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-metrics-spi-${{package.version}}.jar               ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/metrics-spi-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-netty-nio-client-${{package.version}}.jar          ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/netty-nio-client-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-profiles-${{package.version}}.jar                  ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/profiles-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-protocol-core-${{package.version}}.jar             ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/protocols-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-rds-${{package.version}}.jar                       ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/rds-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-regions-${{package.version}}.jar                   ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/regions-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-sdk-core-${{package.version}}.jar                  ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/sdk-core-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-sts-${{package.version}}.jar                       ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/sts-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-sts-${{package.version}}.jar                       ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/sts-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-third-party-jackson-core-${{package.version}}.jar  ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/third-party-jackson-core-${{package.version}}.jar

          # these are not in the base image but are in the aws-sdk-java-v2 package
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-imds-${{package.version}}.jar                      ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/imds-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-arns-${{package.version}}.jar                      ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/arns-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-aws-crt-${{package.version}}.jar         ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/http-auth-aws-crt-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-crt-core-${{package.version}}.jar                  ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/crt-core-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-aws-eventstream-${{package.version}}.jar ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/http-auth-aws-eventstream-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-retries-${{package.version}}.jar                   ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/retries-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-auth-crt-${{package.version}}.jar                  ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/auth-crt-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-retries-spi-${{package.version}}.jar               ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/retries-spi-${{package.version}}.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-utils-${{package.version}}.jar                     ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/utils-${{package.version}}.jar

          # keycloak metrics spi
          ln -sf /usr/share/java/keycloak-metrics-spi/keycloak-metrics-spi-${{package.version}}.jar         ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/keycloak-metrics-spi-${{package.version}}.jar

update:
  enabled: true
  version-transform:
    - match: "-"
      replace: "."
  github:
    identifier: camunda/keycloak
