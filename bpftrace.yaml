package:
  name: bpftrace
  version: "0.24.2"
  epoch: 0
  description: High-level tracing language for Linux
  copyright:
    - license: Apache-2.0

vars:
  llvm-version: 18

environment:
  contents:
    packages:
      - asciidoctor
      - bcc
      - bcc-dev
      # Doesn't like our build, either wants a dynamic libbfd or a separate iberty library that it can link against
      # - binutils-dev
      - bison
      - bpftool
      - build-base
      - busybox
      - cereal
      - clang-${{vars.llvm-version}}
      - clang-${{vars.llvm-version}}-extras
      - flex
      - gcc
      - gtest-dev
      - libbpf
      - libbpf-dev
      - libelf
      - libpcap-dev
      - libsystemd
      - libxml2-dev
      - llvm-${{vars.llvm-version}}
      - llvm-${{vars.llvm-version}}-dev
      - llvm-cmake-${{vars.llvm-version}}
      - pahole
      - pahole-dev
      - systemd-dev
      - systemtap
      - systemtap-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0e0c5cfcc7b1093b000cb516a121f21cd37a7143
      repository: https://github.com/bpftrace/bpftrace
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      # Why doesn't upstream do this? Why doesn't the DCMAKE_LLVM_INCLUDE_DIRS option work? I don't know.
      opts: |
        -DCMAKE_CXX_FLAGS=-I$(llvm-config --includedir) \
        -DCMAKE_C_FLAGS=-I$(llvm-config --includedir) \
        -DClang_DIR=$(llvm-config --prefix)/lib/cmake/clang \

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: bpftrace/bpftrace
    strip-prefix: v

test:
  pipeline:
    - runs: |
        bpftrace --help
    - uses: test/tw/ldd-check
