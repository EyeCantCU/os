package:
  name: velero-fips
  version: 1.14.0
  epoch: 0
  description: Backup and migrate Kubernetes applications and their persistent volumes
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # for fips config & fips-provider
      - openssl-config-fipshardened
      - restic-fips
      # either melange SCA should provide these
      # or we should make go-fips shared link on these
      - so:libcrypto.so.3
      - so:libssl.so.3

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      tag: v${{package.version}}
      expected-commit: 2fc6300f2239f250b40b0488c35feae59520f2d3
      repository: https://github.com/vmware-tanzu/velero

  - uses: go/bump
    with:
      deps: github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0

  - uses: go/build
    with:
      packages: ./cmd/velero
      output: velero
      ldflags: "-X main.version=v${{package.version}} -X github.com/vmware-tanzu/velero/pkg/buildinfo.Version=v${{package.version}} -extldflags '-static'"
      go-package: go-fips

  - uses: go/build
    with:
      packages: ./cmd/velero-restore-helper
      output: velero-restore-helper
      ldflags: "-X main.version=v${{package.version}} -X github.com/vmware-tanzu/velero/pkg/buildinfo.Version=v${{package.version}} -extldflags '-static'"
      go-package: go-fips

  - uses: strip

subpackages:
  - name: "velero-restore-helper-fips"
    description: Velero Restore Helper
    pipeline:
      - working-directory: ${{targets.subpkgdir}}/usr/bin
        runs: |
          mv ${{targets.destdir}}/usr/bin/velero-restore-helper velero-restore-helper

  - name: velero-compat-fips
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    pipeline:
      - runs: |
          # The helm chart expects the binaries to be in / instead of /usr/bin
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/velero ${{targets.subpkgdir}}/velero
          ln -sf /usr/bin/velero-restore-helper ${{targets.subpkgdir}}/velero-restore-helper

update:
  enabled: true
  github:
    identifier: vmware-tanzu/velero
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
  pipeline:
    - runs: |
        velero --help
    - uses: test/go-fips-check
