package:
  name: py3-pygtrie
  version: 2.5.0
  epoch: 0
  description: pure Python implementation of a trie data structure
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: pygtrie

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mina86/pygtrie.git
      tag: v${{package.version}}
      expected-commit: 1587471d95967fbc7339d1981fd3df28830e9c3a

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
