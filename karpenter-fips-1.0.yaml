package:
  name: karpenter-fips-1.0
  version: 1.0.2
  epoch: 0
  description: Karpenter is a Kubernetes Node Autoscaler built for flexibility, performance, and simplicity.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - karpenter-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/karpenter
      tag: v${{package.version}}
      expected-commit: b897114cc08e0cb3a670cfd00caead56c9ed2da8

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/controller
      output: controller

update:
  enabled: true
  github:
    identifier: aws/karpenter
    strip-prefix: v
    tag-filter: v1.0.
