package:
  name: cortex-fips
  version: 1.16.1
  epoch: 0
  description: "A horizontally scalable, highly available, multi-tenant, long term Prometheus."
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-fips
  environment:
    CGO_ENABLED: "1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cortexproject/cortex
      tag: v${{package.version}}
      expected-commit: 155b2c62fd136a43b021dfda1a47ad3521b759c5

  - uses: go/bump
    with:
      deps: golang.org/x/crypto@v0.17.0 google.golang.org/protobuf@v1.33.0 golang.org/x/net@v0.23.0

  - runs: |
      # CVE GHSA-qppj-fm5r-hxr3
      go mod edit -dropreplace=google.golang.org/grpc
      go mod edit -replace=google.golang.org/grpc=google.golang.org/grpc@v1.56.3
      go mod tidy
      go mod vendor

      mkdir -p ${{targets.destdir}}/usr/bin
      go build -ldflags \
        "-s -w \
        -X main.Branch=$(git rev-parse --abbrev-ref HEAD) \
        -X main.Revision=$(git rev-parse --short HEAD) \
        -X main.Version=$(cat ./VERSION)" \
        -o ${{targets.destdir}}/usr/bin/cortex ./cmd/cortex

  - uses: strip

test:
  pipeline:
    - runs: cortex -version

update:
  enabled: true
  github:
    identifier: cortexproject/cortex
    strip-prefix: v
