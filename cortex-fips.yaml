package:
  name: cortex-fips
  version: "1.19.0"
  epoch: 5
  description: "A horizontally scalable, highly available, multi-tenant, long term Prometheus."
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cortexproject/cortex
      tag: v${{package.version}}
      expected-commit: babe4210d83bcb9ba523037a0e7cc2331b5aab04

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        github.com/golang-jwt/jwt/v5@v5.2.2
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      packages: ./cmd/cortex
      output: cortex
      # Cortex uses MD5 but not for crypto.
      go-package: go-fips-md5
      ldflags: |
        -X main.Branch=$(git rev-parse --abbrev-ref HEAD) \
        -X main.Revision=$(git rev-parse --short HEAD) \
        -X main.Version=$(cat ./VERSION)

  - uses: strip

test:
  pipeline:
    - runs: |
        cortex -version
        cortex --version
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: cortexproject/cortex
    strip-prefix: v
