package:
  name: nvidia-cuda-profiler-api-12.1
  version: 12.1.55
  epoch: 1
  description: CUDA Profiler API
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-cuda-profiler-api=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_profiler_api/linux-sbsa/cuda_profiler_api-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "4016484909978e2143f25fa1e6e309f447b5965aba8447324cd0675236fd1c52"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_profiler_api/linux-x86_64/cuda_profiler_api-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "d029f836910814ae32337bea7b341513e322f8f8e63e2fb4353e98f34bacd35c"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.1/
      mv include ${{targets.destdir}}/usr/local/cuda-12.1/
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.1/${{package.name}}.LICENSE

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
