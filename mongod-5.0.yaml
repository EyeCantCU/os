package:
  name: mongod-5.0
  version: "5.0.31"
  epoch: 45
  description: "The MongoDB Database"
  copyright:
    - license: "SSPL-1.0"
  resources:
    cpu: 30
    memory: 60Gi
  dependencies:
    provides:
      - mongod=${{package.full-version}}
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl-dev
      - gcc-14-default
      - gosu
      - ld-linux
      - mongo-tools
      - mongosh
      - openssl
      - openssl-dev
      - py3.11-pip
      - python-3.11
      - python-3.11-dev
      - render-template
      - wait-for-port
      - wolfi-base
      - xz-dev
      - yq
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mongodb/mongo
      tag: r${{package.version}}
      expected-commit: e8c5dca807cdfef1c9b3141c4c2bcd613d9700e7

  - uses: patch
    with:
      patches: optional.patch disable-fips-cli-arg.patch disablewerror.patch

  - runs: |
      python3 -m pip install scons\<4.9.0
      # PyYAML 6.0.0 or older don't install with newer python interpreters
      sed -r -e 's/^PyYAML(.+)$/PyYAML >= 6.0.0/g' -i etc/pip/components/core.req
      python3 -m pip install -r etc/pip/compile-requirements.txt
      # fix build object cache hash calcuation in a fips-enabled environment
      sed 's/hashlib.md5()/hashlib.sha256()/g' -i site_scons/mongo/generators.py
      scons \
        VERBOSE=1 \
        --config=force \
        CXXFLAGS="--param destructive-interference-size=64" \
        --ssl \
        --separate-debug=on \
        --disable-warnings-as-errors \
        install-devcore
      mkdir -p ${{targets.destdir}}/usr/bin
      mv build/install/bin/mongod ${{targets.destdir}}/usr/bin

  - uses: strip

subpackages:
  - name: "mongos-5.0"
    description: "mongo sharding"
    dependencies:
      provides:
        - mongos=${{package.full-version}}
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv build/install/bin/mongos ${{targets.subpkgdir}}/usr/bin
    test:
      pipeline:
        - runs: |
            mongos --version | grep ${{package.version}}
            mongos --help

  - name: "mongo-5.0"
    description: "mongo shell"
    dependencies:
      provides:
        - mongo=${{package.full-version}}
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv build/install/bin/mongo ${{targets.subpkgdir}}/usr/bin
    test:
      pipeline:
        - runs: |
            mongo --version | grep ${{package.version}}
            mongo --help

  - name: "mongod-5.0-iamguarded-compat"
    description: "mongod iamguarded compat"
    dependencies:
      runtime:
        # Required by startup scripts
        - bash
        - coreutils
        - posix-libc-utils
        - merged-usrsbin
        - mongo-5.0
        - mongod-5.0
        - mongosh
        - posix-libc-utils
        - render-template
        # These are needed, but must be specified in the image config to enable FIPS alternatives.
        #- gosu
        #- mongo-tools
        #- wait-for-port
        #- yq
        - wolfi-baselayout
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: mongodb
          version: ${{vars.major-minor-version}}
      - runs: |
          mkdir -p /opt/iamguarded
          mkdir -p /opt/iamguarded/licenses
          mkdir -p /opt/iamguarded/scripts
          mkdir -p /opt/iamguarded/etc
          mkdir -p /opt/iamguarded/common/bin
          mkdir -p /opt/iamguarded/mongodb/bin
          mkdir -p /opt/iamguarded/mongodb/logs
          mkdir -p /opt/iamguarded/mongodb/tmp
          mkdir -p /opt/iamguarded/mongodb/conf
          mkdir -p /opt/iamguarded/mongodb/data/db

          ln -sf /usr/bin/gosu /opt/iamguarded/common/bin/gosu
          ln -sf /usr/bin/render-template /opt/iamguarded/common/bin/render-template
          ln -sf /usr/bin/wait-for-port /opt/iamguarded/common/bin/wait-for-port
          ln -sf /usr/bin/yq /opt/iamguarded/common/bin/yq

          # This script does some magic with env vars, templates, etc. etc.
          # it is easier to run it than figure out everything that it touches.
          /opt/iamguarded/scripts/mongodb/postunpack.sh
      - runs: |
          # Set the target directory for the symbolic links
          target_dir="/opt/iamguarded/mongodb/bin/"

          # Loop through the binaries in /usr/bin/
          for binary_path in /usr/bin/mongo*; do
              # Check if the path is a file and not a directory
              if [ -f "$binary_path" ]; then
                  # Extract the binary name from the path
                  binary_name=$(basename "$binary_path")

                  # Create the symbolic link
                  ln -sf "$binary_path" "$target_dir$binary_name"

                  echo "Created symbolic link for $binary_name"
              fi
          done
          for binary in mongo mongod bsondump mongodump mongoexport mongofiles mongoimport mongorestore mongos mongosh mongostat mongotop; do
            ln -sf /usr/bin/$binary /opt/iamguarded/mongodb/bin/$binary
          done
      - runs: |
          # touch/mkdir these empty files and directories to quiet various startup messages per upstream
          touch "${{targets.subpkgdir}}"/.dbshell
          touch "${{targets.subpkgdir}}"/.mongorc.js
          touch "${{targets.subpkgdir}}"/.mongoshrc.js
          mkdir "${{targets.subpkgdir}}"/.mongodb
          mkdir "${{targets.subpkgdir}}"/docker-entrypoint-initdb.d
      - uses: iamguarded/finalize-compat
        with:
          package: mongodb
          version: ${{vars.major-minor-version}}
      # TODO(maxgio92): restore this hardlink, once Melange is released with:
      # * https://github.com/chainguard-dev/melange/pull/205
      - runs: rm -f ./build/install/LICENSE-Community.txt
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: mongodb
            version: ${{vars.major-minor-version}}
        - runs: |
            run-script --version
            run-script --help
        - runs: |
            for binary in mongo mongod bsondump mongodump mongoexport mongofiles mongoimport mongorestore mongos mongosh mongostat mongotop; do
              test "$(readlink /opt/iamguarded/mongodb/bin/$binary)" = "/usr/bin/$binary"
            done

update:
  enabled: true
  github:
    identifier: mongodb/mongo
    strip-prefix: r
    use-tag: true
    tag-filter: r5.0.

test:
  environment:
    contents:
      packages:
        - netcat-openbsd
        - openssl
        - mongo-${{vars.major-minor-version}}
  pipeline:
    - runs: |
        mongod --version | grep ${{package.version}}
        mongod --help
    - runs: |
        mkdir -p /tmp/mongotest/db
        mkdir -p /tmp/mongotest/log

        # Start mongod in background
        mongod \
          --dbpath /tmp/mongotest/db \
          --logpath /tmp/mongotest/log/mongod.log \
          --port 27017 \
          --bind_ip 127.0.0.1 \
          --storageEngine wiredTiger &

        mongod_pid=$!
        sleep 10

        # Check database files created
        if find /tmp/mongotest/db -name "*.wt" | grep -q .; then
          echo "Database file creation: PASSED"
        else
          echo "Database file creation: FAILED"
          exit 1
        fi

        # Test basic MongoDB operations
        mongo --host 127.0.0.1:27017 --eval "
          db = db.getSiblingDB('testdb');

        // Insert a test document
        result = db.testcollection.insertOne({name: 'test', value: 42, timestamp: new Date()});
        print('Insert result: ' + JSON.stringify(result.acknowledged));

        // Find the document
        doc = db.testcollection.findOne({name: 'test'});
        print('Found document: ' + JSON.stringify(doc));

        // Count documents
        count = db.testcollection.countDocuments({});
        print('Document count: ' + count);

        // Test index creation
        db.testcollection.createIndex({name: 1});
        indexes = db.testcollection.getIndexes();
        print('Index count: ' + indexes.length);

        // Test server status
        status = db.runCommand('serverStatus');
        print('Server uptime: ' + status.uptime + ' seconds');
        print('MongoDB version: ' + status.version);
        " --quiet

        kill $mongod_pid
        wait $mongod_pid
    - runs: |
        mkdir -p /tmp/mongotest/ssl
        cd /tmp/mongotest/ssl

        openssl genrsa 2048 > ca-key.pem
        openssl req -new -nodes -x509 \
          -days 2 \
          -key ca-key.pem \
          -out ca-cert.pem \
          -subj "/CN=mongo CA"
        cat ca-key.pem ca-cert.pem > ca.pem

        openssl req \
          -newkey rsa:2048 -nodes \
          -keyout privkey.pem \
          -x509 -days 2 \
          -out cert.pem \
          -CA ca-cert.pem \
          -CAkey ca-key.pem \
          -subj "/CN=localhost"
        cat privkey.pem cert.pem > fullchain.pem

        # Test TLS-enabled mongod startup
        mkdir -p /tmp/mongotest/tls-db
        mkdir -p /tmp/mongotest/tls-log

        # Start TLS-enabled mongod
        mongod \
          --dbpath /tmp/mongotest/tls-db \
          --logpath /tmp/mongotest/tls-log/mongod.log \
          --port 27018 \
          --bind_ip 127.0.0.1 \
          --tlsMode allowTLS \
          --tlsCertificateKeyFile /tmp/mongotest/ssl/fullchain.pem \
          --tlsCAFile /tmp/mongotest/ssl/ca.pem \
          --fork

        timeout=30
        while [ $timeout -gt 0 ]; do
          if nc -z 127.0.0.1 27018 2>/dev/null; then
            echo "TLS MongoDB is ready"
            break
          fi
          sleep 1
          timeout=$((timeout - 1))
        done

        if [ $timeout -eq 0 ]; then
          echo "TLS MongoDB failed to start within 30 seconds"
          cat /tmp/mongotest/tls-log/mongod.log
          exit 1
        fi
