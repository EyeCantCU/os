package:
  name: py3-rfc3986
  version: 2.0.0
  epoch: 0
  description: A Python implementation of RFC 3986 including validation and authority parsing.
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: rfc3986

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-hyper/rfc3986.git
      tag: ${{package.version}}
      expected-commit: 7a64092490c1b3c4f354b9b14d060fa758d66848

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | tee output.txt
            from rfc3986 import urlparse

            ssh = urlparse('ssh://user@git.openstack.org:29418/openstack/glance.git?extra_param=linky')
            print(ssh.scheme)
            print(ssh.userinfo)
            print(ssh.params)
            print(ssh.port)
            EOF
            get_line() {
              sed -n "${1}p" output.txt | grep -E -e "${2}"
            }
            get_line 1 "ssh"
            get_line 2 "user"
            get_line 3 "extra_param=linky"
            get_line 4 "29418"

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
