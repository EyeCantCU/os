package:
  name: py3.12-onnxruntime
  version: "1.23.1"
  epoch: 0
  description: Cross-platform, high performance ML inferencing and training accelerator
  copyright:
    - license: MIT
  resources:
    cpu: 20
    memory: 50Gi
  dependencies:
    runtime:
      - py${{vars.python-version}}-coloredlogs
      - py${{vars.python-version}}-flatbuffers
      - py${{vars.python-version}}-numpy-2.2
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-protobuf
      - py${{vars.python-version}}-sympy

vars:
  pypi-package: onnxruntime

environment:
  contents:
    packages:
      - abseil-cpp-dev
      - bash
      - cmake-3
      - eigen-dev
      - flatbuffers
      - openvino
      - openvino-dev
      - patch
      - protobuf
      - protobuf-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-numpy-2.2
      - python-${{vars.python-version}}
      - zlib-dev
  environment:
    # This seems to be required to compile `abseil`
    # FIXME: remove this eventually
    CXXFLAGS: "-fdelete-null-pointer-checks"

var-transforms:
  - from: ${{package.name}}
    match: 'py(\d+\.\d+)-.*'
    replace: '$1'
    to: python-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/microsoft/onnxruntime.git
      tag: v${{package.version}}
      expected-commit: d9b2048791efb5804fe3d53a04b4971256addebf
      recurse-submodules: true

  - name: "fix missing cstdint header"
    runs: sed -i "6a \#include <cstdint>" onnxruntime/core/common/semver.h

  - uses: cmake/configure
    with:
      output-dir: build
      opts: |
        -Wno-dev \
        -S cmake \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DCMAKE_BUILD_TYPE=None \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -Donnxruntime_ENABLE_PYTHON=ON \
        -Donnxruntime_BUILD_SHARED_LIB=ON \
        -Donnxruntime_BUILD_UNIT_TESTS=OFF \
        -DBUILD_TESTING=OFF \
        -Donnxruntime_ENABLE_TRAINING=ON \
        -Donnxruntime_ENABLE_LAZY_TENSOR=OFF \
        -Donnxruntime_USE_MPI=ON \
        -Donnxruntime_USE_DNNL=OFF \
        -Donnxruntime_USE_PREINSTALLED_EIGEN=ON \
        -DCMAKE_CXX_STANDARD=17 \
        -Donnxruntime_USE_OPENVINO=ON \
        -Donnxruntime_USE_OPENVINO_GPU=ON \
        -Donnxruntime_USE_OPENVINO_CPU=ON \
        -Donnxruntime_USE_OPENVINO_NPU=ON \
        -DPython_EXECUTABLE=/usr/bin/python${{vars.python-version}}

  # NOTE: this sets some 'magic' apparently, otherwise we would use the 'cmake/build' pipeline.
  # review in future upstream releases
  # see also: https://onnxruntime.ai/docs/build/custom.html#python
  - name: "build using upstream wrapper script"
    runs: |
      ./build.sh --build --update --config Release --build_shared_lib --parallel --compile_no_warning_as_error \
        --skip_submodule_sync --enable_training --allow_running_as_root --skip_tests \
        --cmake_extra_defines CMAKE_INSTALL_PREFIX=/usr \
        --build_wheel

  - name: "TODO: run pip install here"
    runs: exit 1

  - uses: strip

update:
  enabled: true
  github:
    identifier: microsoft/onnxruntime
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
        - py${{vars.python-version}}-pip
        - py${{vars.python-version}}-${{vars.pypi-package}}
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - runs: |
        python3 <<'EOF' | grep -F -e "${{package.version}}" -e "CPU"
        import onnxruntime
        print(onnxruntime.version)
        print(onnxruntime.get_device())
        EOF
