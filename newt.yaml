package:
  name: newt
  version: 0.52.25
  epoch: 1
  description: A library for text mode user interfaces
  copyright:
    - license: LGPL-2.0

var-transforms:
  - from: ${{package.version}}
    match: '\.'
    replace: '-'
    to: tag-version

vars:
  import: snack

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext
      - ncurses-dev
      - popt-dev
      - py3-supported-python-dev
      - slang-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://pagure.io/newt.git
      tag: r${{vars.tag-version}}
      expected-commit: 9b9e7e8936f51f83a7259c5f0a9b4ff909cbd39a

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: "${{package.name}} headers"
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: "${{package.name}} manpages"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

  - range: py-versions
    name: py${{range.key}}-${{vars.import}}
    description: python${{range.key}} bindings for ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/
          mv ${{targets.destdir}}/usr/lib/python${{range.key}} ${{targets.subpkgdir}}/usr/lib/
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.import}}
    description: meta package providing ${{vars.import}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.import}}
        - py3.11-${{vars.import}}
        - py3.12-${{vars.import}}
        - py3.13-${{vars.import}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}

update:
  enabled: true
  release-monitor:
    identifier: 15129

test:
  pipeline:
    - runs: whiptail --help
    - uses: test/tw/ldd-check
