package:
  name: hello-world
  version: 0.0.1
  epoch: 11
  description: "testing the chainguard enterprise repository"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-11-default-jvm
      - openjdk-bcfips-policy-140-3-j11

environment:
  contents:
    packages:
      - busybox
      - helm-fips
      - openjdk-11-default-jvm
      - openjdk-bcfips-policy-140-3-j11

pipeline:
  - runs: |
      mkdir -p ${{targets.destdir}}/usr
      echo test > ${{targets.destdir}}/usr/tester

update:
  enabled: false
  exclude-reason: "example package, doesn't need updates"
