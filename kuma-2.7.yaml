package:
  name: kuma-2.7
  version: 2.7.6
  epoch: 1
  description: A multi-zone service mesh for containers, Kubernetes and VMs.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - kuma=${{package.full-version}}
    runtime:
      - ca-certificates-bundle

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kumahq/kuma
      tag: ${{package.version}}
      expected-commit: 90b2732876d1735a611e38b4633215845055bb20

subpackages:
  - name: kuma-cp-${{vars.major-minor-version}}
    dependencies:
      provides:
        - kuma-cp=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./app/kuma-cp
          output: kuma-cp
      - uses: strip
    test:
      pipeline:
        - name: Verify kuma-cp
          runs: |
            kuma-cp --help

update:
  enabled: true
  github:
    identifier: kumahq/kuma
    tag-filter: 2.7
    use-tag: true
