package:
  name: kuma-2.7
  version: 2.7.5
  epoch: 0
  description: A multi-zone service mesh for containers, Kubernetes and VMs.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kumahq/kuma
      tag: ${{package.version}}
      expected-commit: bab1af2f85836549530a6a6bff6758042b521a2f

subpackages:
  - name: kuma-cp-2.7
    pipeline:
      - uses: go/build
        with:
          packages: ./app/kuma-cp
          output: kuma-cp
      - uses: strip
    test:
      pipeline:
        - name: Verify kuma-cp
          runs: |
            kuma-cp --help

update:
  enabled: true
  github:
    identifier: kumahq/kuma
    tag-filter: 2.7
    use-tag: true
