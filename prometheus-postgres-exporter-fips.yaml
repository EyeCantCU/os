package:
  name: prometheus-postgres-exporter-fips
  version: "0.18.1"
  epoch: 2 # GHSA-j5w8-q4qc-rx2x
  description: Prometheus Exporter for Postgres server metrics
  copyright:
    - license: Apache-2.0

vars:
  PKG: "github.com/prometheus/common"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 320b684f3dcd3f09b6e694e43f9b389b1a8199e5
      repository: https://github.com/prometheus-community/postgres_exporter
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/postgres_exporter
      output: postgres_exporter
      ldflags: |
        -X ${{vars.PKG}}/version.Revision=$(git rev-parse --short HEAD)
        -X ${{vars.PKG}}/version.BuildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')
        -X ${{vars.PKG}}/version.Branch=$(git branch --show-current)
        -X ${{vars.PKG}}/version.Version=v${{package.version}}

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        postgres_exporter --version
        postgres_exporter --help

update:
  enabled: true
  github:
    identifier: prometheus-community/postgres_exporter
    strip-prefix: v
