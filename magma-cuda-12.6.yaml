package:
  name: magma-cuda-12.6
  version: "2.9.0"
  epoch: 0
  description: Matrix Algebra on GPU and Multi-core Architectures (MAGMA) is a collection of next-generation linear algebra libraries for heterogeneous computing
  copyright:
    - license: BSD-3-Clause
  options:
    no-depends: true
  dependencies:
    runtime:
      - intel-oneapi-mkl-core
      - libgomp
      - nvidia-cuda-cudart-${{vars.cuda-version}}
      - nvidia-libcublas-${{vars.cuda-version}}
      - nvidia-libcusparse-${{vars.cuda-version}}
  target-architecture:
    - x86_64
  resources:
    memory: 64Gi

vars:
  gcc-major-version: 13
  py-version: 3.13 # pin to a known compatible version

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - gcc-${{vars.gcc-major-version}}
      - gfortran
      - intel-oneapi-mkl-core-dev
      - nvidia-cuda-profiler-api-${{vars.cuda-version}}
      - openblas-dev
      - perl
      - python-${{vars.py-version}} # build scripts use `python3`
  environment:
    CUDADIR: "/usr/local/cuda-${{vars.cuda-version}}"
    MKLROOT: "/opt/intel/oneapi/mkl/latest"
    LIBRARY_PATH: "/opt/intel/oneapi/mkl/latest/lib"
    NVCC_APPEND_FLAGS: "-ccbin gcc-${{vars.gcc-major-version}}"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/icl-utk-edu/magma
      tag: v${{package.version}}
      expected-commit: 48a32d79517cc6f1522aa190cdec4b1d1babcf53

  - runs: |
      # users are required to provide a make.inc. Currently,
      # the example mkl-gcc one works fine for us.
      ln -sf make.inc-examples/make.inc.mkl-gcc make.inc

  - runs: |
      export PATH="${PATH}:${CUDADIR}/bin"
      make -j$(nproc) lib shared
      make -j$(nproc) install prefix=/usr DESTDIR="${{targets.contextdir}}"

subpackages:
  - name: ${{package.name}}-dev
    description: MAGMA dev files
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/pkgconf

test:
  environment:
    contents:
      packages:
        - nvidia-cuda-cudart-${{vars.cuda-version}}
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: icl-utk-edu/magma
    strip-prefix: v
