package:
  name: unified-memory-framework
  version: "1.0.3"
  epoch: 0
  description: library for constructing allocators and memory pools
  copyright:
    - license: Apache-2.0 WITH LLVM-exception
  target-architecture:
    - x86_64

vars:
  abi: 1
  py-version: 3.13

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - hwloc-dev
      - libtbb-dev
      - numactl-dev
      - py${{vars.py-version}}-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/oneapi-src/unified-memory-framework
      tag: v${{package.version}}
      expected-commit: e7d285269e04d3c0e70917c24945c80a4ea3313a

  - uses: cmake/configure
    with:
      opts: |
        "-DUMF_BUILD_SHARED_LIBRARY=ON"

  - uses: cmake/build

  - uses: cmake/install

test:
  pipeline:
    - uses: test/emptypackage

subpackages:
  - name: libumf${{vars.abi}}
    description: library for constructing allocators and memory pools
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr
          mv ${{targets.destdir}}/usr/lib ${{targets.contextdir}}/usr
          mv ${{targets.destdir}}/usr/include ${{targets.contextdir}}/usr
      - name: empty out main package
        runs: |
          # explicitly remove only the things we expect to be left over.
          # this way, if anything new gets added, test/emptypackage will
          # fail and alert us.
          rm -rf ${{targets.destdir}}/usr/share/doc
          rmdir ${{targets.destdir}}/usr/share
          rmdir ${{targets.destdir}}/usr
      - name: Check that ABI has not changed
        runs: |
          test -e ${{targets.contextdir}}/usr/lib/libumf.so.${{vars.abi}}

  - name: libumf-dev
    description: library for constructing allocators and memory pools
    dependencies:
      runtime:
        - libumf${{vars.abi}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
        with:
          package: libumf${{vars.abi}}

update:
  enabled: true
  github:
    identifier: oneapi-src/unified-memory-framework
    strip-prefix: v
