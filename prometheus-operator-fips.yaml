package:
  name: prometheus-operator-fips
  version: "0.82.0"
  epoch: 0
  description: Prometheus Operator creates/configures/manages Prometheus clusters atop Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - merged-bin
      - wolfi-baselayout

vars:
  PKG: "github.com/prometheus/common"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-operator/prometheus-operator.git
      tag: v${{package.version}}
      expected-commit: d6f3c9110561b7790c3c2d62f07705c4096869d5

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/operator
      output: operator
      ldflags: |
        -X ${{vars.PKG}}/version.Revision=$(git rev-parse --short HEAD)
        -X ${{vars.PKG}}/version.BuildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')
        -X ${{vars.PKG}}/version.Branch=$(git branch --show-current)
        -X ${{vars.PKG}}/version.Version=v${{package.version}}

  - runs: |
      # test uses the -race flag which is incompatible with -buildmode=pie
      unset GOFLAGS
      make test-unit

subpackages:
  - name: prometheus-config-reloader-fips
    description: Prometheus Operator creates/configures/manages Prometheus clusters atop Kubernetes
    dependencies:
      # REMOVE_POST_USRMERGE - https://github.com/orgs/wolfi-dev/discussions/40270
      provides:
        - prometheus-config-reloader-oci-entrypoint-compat-fips=${{package.full-version}}
      runtime:
        - merged-bin
        - wolfi-baselayout
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          packages: ./cmd/prometheus-config-reloader
          output: prometheus-config-reloader
          ldflags: |
            -X ${{vars.PKG}}/version.Revision=$(git rev-parse --short HEAD)
            -X ${{vars.PKG}}/version.BuildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')
            -X ${{vars.PKG}}/version.Branch=$(git branch --show-current)
            -X ${{vars.PKG}}/version.Version=v${{package.version}}
    test:
      pipeline:
        - runs: |
            prometheus-config-reloader --version
            prometheus-config-reloader --help

  - name: prometheus-admission-webhook-fips
    description: Prometheus Operator creates/configures/manages Prometheus clusters atop Kubernetes
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          packages: ./cmd/admission-webhook
          output: admission-webhook
          ldflags: |
            -X ${{vars.PKG}}/version.Revision=$(git rev-parse --short HEAD)
            -X ${{vars.PKG}}/version.BuildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')
            -X ${{vars.PKG}}/version.Branch=$(git branch --show-current)
            -X ${{vars.PKG}}/version.Version=v${{package.version}}
    test:
      pipeline:
        - runs: |
            admission-webhook --version
            admission-webhook --help
    dependencies:
      runtime:
        - merged-bin
        - wolfi-baselayout

test:
  environment:
    contents:
      packages:
        - prometheus-config-reloader-fips
        - prometheus-admission-webhook-fips
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        operator --version
        operator --help

update:
  enabled: true
  github:
    identifier: prometheus-operator/prometheus-operator
    strip-prefix: v
