package:
  name: aws-sdk-java-v2
  version: "2.34.1"
  epoch: 0
  description: "AWS SDK for Java v2 - A modern, fully-featured SDK for AWS services"
  copyright:
    - license: Apache-2.0

vars:
  java-version: 8

environment:
  contents:
    packages:
      - busybox
      - maven
      - openjdk-${{vars.java-version}}-default-jdk
      - python3
  environment:
    JAVA_HOME: /usr/lib/jvm/default-jvm/
    MAVEN_OPTS: "-Xmx2g -XX:ReservedCodeCacheSize=512m"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/aws-sdk-java-v2
      tag: ${{package.version}}
      expected-commit: ddfb9975d6042780122bf01c8b0e91b01d1f1ce1

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/java/aws-sdk-v2

      ./mvnw clean install -P quick

      cp core/annotations/target/aws-sdk-java-annotations-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-annotations.jar
      cp core/checksums/target/aws-sdk-java-checksums-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-checksums.jar
      cp core/http-auth-aws/target/aws-sdk-java-http-auth-aws-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-aws.jar
      cp core/imds/target/aws-sdk-java-imds-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-imds.jar
      cp core/protocols/protocol-core/target/aws-sdk-java-protocol-core-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-protocol-core.jar
      cp core/arns/target/aws-sdk-java-arns-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-arns.jar
      cp core/checksums-spi/target/aws-sdk-java-checksums-spi-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-checksums-spi.jar
      cp core/http-auth-aws-crt/target/aws-sdk-java-http-auth-aws-crt-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-aws-crt.jar
      cp core/json-utils/target/aws-sdk-java-json-utils-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-json-utils.jar
      cp core/regions/target/aws-sdk-java-regions-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-regions.jar
      cp core/auth/target/aws-sdk-java-auth-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-auth.jar
      cp core/crt-core/target/aws-sdk-java-crt-core-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-crt-core.jar
      cp core/http-auth-aws-eventstream/target/aws-sdk-java-http-auth-aws-eventstream-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-aws-eventstream.jar
      cp core/metrics-spi/target/aws-sdk-java-metrics-spi-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-metrics-spi.jar
      cp core/retries/target/aws-sdk-java-retries-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-retries.jar
      cp core/auth-crt/target/aws-sdk-java-auth-crt-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-auth-crt.jar
      cp core/endpoints-spi/target/aws-sdk-java-endpoints-spi-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-endpoints-spi.jar
      cp core/http-auth-spi/target/aws-sdk-java-http-auth-spi-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-spi.jar
      cp core/retries-spi/target/aws-sdk-java-retries-spi-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-retries-spi.jar
      cp core/aws-core/target/aws-sdk-java-aws-core-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-aws-core.jar
      cp core/http-auth/target/aws-sdk-java-http-auth-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth.jar
      cp core/identity-spi/target/aws-sdk-java-identity-spi-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-identity-spi.jar
      cp core/profiles/target/aws-sdk-java-profiles-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-profiles.jar
      cp core/sdk-core/target/aws-sdk-java-sdk-core-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-sdk-core.jar
      cp utils/target/aws-sdk-java-utils-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-utils.jar
      cp http-clients/apache-client/target/aws-sdk-java-apache-client-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-apache-client.jar
      cp http-clients/netty-nio-client/target/aws-sdk-java-netty-nio-client-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-netty-nio-client.jar
      cp http-client-spi/target/aws-sdk-java-http-client-spi-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-http-client-spi.jar
      cp core/protocols/aws-query-protocol/target/aws-sdk-java-aws-query-protocol-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-aws-query-protocol.jar
      cp third-party/third-party-jackson-core/target/aws-sdk-java-third-party-jackson-core-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-third-party-jackson-core.jar
      cp services/rds/target/aws-sdk-java-rds-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-rds.jar
      cp services/sts/target/aws-sdk-java-sts-${{package.version}}.jar \
         ${{targets.destdir}}/usr/share/java/aws-sdk-v2/aws-sdk-java-sts.jar

test:
  environment:
    contents:
      packages:
        - openjdk-${{vars.java-version}}-default-jdk
    environment:
      JAVA_HOME: /usr/lib/jvm/default-jvm
  pipeline:
    - name: Test basic functionality of jars
      runs: |
        echo "existence"
        EXPECTED_JARS="aws-sdk-java-annotations aws-sdk-java-checksums aws-sdk-java-http-auth-aws aws-sdk-java-imds aws-sdk-java-protocol-core aws-sdk-java-arns aws-sdk-java-checksums-spi aws-sdk-java-http-auth-aws-crt aws-sdk-java-json-utils aws-sdk-java-regions aws-sdk-java-auth aws-sdk-java-crt-core aws-sdk-java-http-auth-aws-eventstream aws-sdk-java-metrics-spi aws-sdk-java-retries aws-sdk-java-auth-crt aws-sdk-java-endpoints-spi aws-sdk-java-http-auth-spi aws-sdk-java-retries-spi aws-sdk-java-aws-core aws-sdk-java-http-auth aws-sdk-java-identity-spi aws-sdk-java-profiles aws-sdk-java-sdk-core aws-sdk-java-utils aws-sdk-java-apache-client aws-sdk-java-netty-nio-client aws-sdk-java-http-client-spi aws-sdk-java-aws-query-protocol aws-sdk-java-third-party-jackson-core aws-sdk-java-rds aws-sdk-java-sts"

        for jar in $EXPECTED_JARS; do
           JAR_PATH="/usr/share/java/aws-sdk-v2/${jar}.jar"
           if [ -f "$JAR_PATH" ]; then
              echo "Found: $jar"
              jar tf "$JAR_PATH" > /dev/null
           else
              echo "Missing: $jar at $JAR_PATH"
              exit 1
           fi
        done

        echo "writing"

        cat > AwsSdkTest.java << 'EOF'
        import software.amazon.awssdk.regions.Region;
        import software.amazon.awssdk.arns.Arn;
        import java.util.List;
        import java.util.HashSet;
        import java.util.Set;

        public class AwsSdkTest {
           public static void main(String[] args) {
              System.out.println("testing some functions");

              System.out.println("make regions");
              Region usEast1 = Region.US_EAST_1;
              System.out.println("US East 1 region: " + usEast1.id());

              Region usWest2 = Region.of("us-west-2");
              System.out.println("US West 2 region: " + usWest2.id());

              System.out.println("checking metadata");
              List<Region> regionList = Region.regions();
              Set<Region> regions = new HashSet<>(regionList);
              if (regions.contains(Region.US_EAST_1)) {
                 System.out.println("Region set contains US_EAST_1");
              } else {
                 System.out.println("Region set missing US_EAST_1");
                 System.exit(1);
              }

              System.out.println("arn smoke test");
              String arnString = "arn:aws:s3:::my-bucket/my-key";
              Arn arn = Arn.fromString(arnString);
              System.out.println("Parsed ARN service: " + arn.service());
              System.out.println("Parsed ARN resource: " + arn.resource());

              if (!"s3".equals(arn.service())) {
                 System.out.println("ARN service parsing failed");
                 System.exit(1);
              }
           }
        }
        EOF

        # classpath
        echo "classpath"
        CLASSPATH=""
        for jar in $EXPECTED_JARS; do
           JAR_PATH="/usr/share/java/aws-sdk-v2/${jar}.jar"
           if [ -z "$CLASSPATH" ]; then
              CLASSPATH="$JAR_PATH"
           else
              CLASSPATH="$CLASSPATH:$JAR_PATH"
           fi
        done

        # run test
        echo "compiling"
        javac -cp "$CLASSPATH" AwsSdkTest.java
        echo "running"
        java -cp "$CLASSPATH:." AwsSdkTest
        echo "done"

update:
  enabled: true
  github:
    identifier: aws/aws-sdk-java-v2
    strip-prefix: v
