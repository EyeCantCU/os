package:
  name: aws-c-event-stream-fips
  version: "0.5.5"
  epoch: 0
  description: "AWS C99 implementation of the vnd.amazon.eventstream content-type (FIPS)"
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - aws-c-event-stream=${{package.full-version}}
    provider-priority: 20

environment:
  contents:
    packages:
      - aws-c-cal-fips-dev
      - aws-c-common-dev
      - aws-c-io-fips-dev
      - aws-checksums-dev
      - aws-lc-fips-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - s2n-tls-fips-dev
      - samurai
  environment:
    CMAKE_PREFIX_PATH: /usr/lib/aws-lc
    CFLAGS: "-I/usr/include/aws-lc"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/awslabs/aws-c-event-stream
      tag: v${{package.version}}
      expected-commit: 8f8f599e78864188fe8547dafaa695a1d4855d6a

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING="OFF" \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux \
        -Dcrypto_INCLUDE_DIR=/usr/include/aws-lc

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-event-stream-fips-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-event-stream-fips
      provides:
        - aws-c-event-stream-dev=${{package.full-version}}
      provider-priority: 20
    description: aws-c-event-stream-fips dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-event-stream
    strip-prefix: v
    use-tag: true
