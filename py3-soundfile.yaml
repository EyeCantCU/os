package:
  name: py3-soundfile
  version: 0.13.1
  epoch: 0
  description: Python library for reading and writing sound files
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: soundfile

environment:
  contents:
    packages:
      - libsndfile-dev
      - py3-supported-build-base-dev
      - py3-supported-cffi
      - py3-supported-pycparser

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bastibe/python-soundfile.git
      tag: ${{package.version}}
      expected-commit: 1aee0c3cbbbb3f2ef8947b19e713b019fc7291f6

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-cffi
        - py${{range.key}}-numpy-2.2
        - libsndfile
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - ffmpeg
            - file
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            ffmpeg -f lavfi -i "sine=f=1000:d=2" output.wav

            python${{range.key}} <<'EOF'
            import soundfile as sf
            data, samplerate = sf.read('output.wav')
            sf.write('new_file.flac', data, samplerate)
            EOF

            stat new_file.flac
            file new_file.flac | grep -F -e "FLAC audio bitstream data, 16 bit"

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
