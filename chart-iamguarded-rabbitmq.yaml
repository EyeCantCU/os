package:
  name: chart-iamguarded-rabbitmq
  version: "16.0.2"
  epoch: 0
  description: rabbitmq iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: rabbitmq/${{package.version}}
      expected-commit: 9ca5aa5e3312617ce24d85efe33cc1d696495a25

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/rabbitmq

  - uses: charts/package
    with:
      chart-path: iamguarded/rabbitmq

update:
  enabled: false
  manual: true
  schedule:
    period: daily
    reason: Update automation doesn't yet support automating from private repos.
  git:

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: rabbitmq
