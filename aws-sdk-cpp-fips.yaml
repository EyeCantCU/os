package:
  name: aws-sdk-cpp-fips
  version: "1.11.616"
  epoch: 0
  description: "The AWS SDK for C++"
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - aws-sdk-cpp=${{package.full-version}}
    provider-priority: 20

environment:
  contents:
    packages:
      - aws-crt-cpp-fips-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - samurai
      - zlib-dev
  environment:
    CMAKE_PREFIX_PATH: /usr/lib/aws-lc
    CFLAGS: "-I/usr/include/aws-lc"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/aws-sdk-cpp
      tag: ${{package.version}}
      expected-commit: fd4d27b67669c26621888587630000d12d754e54

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_PREFIX_PATH=/usr \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_DEPS=OFF \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux \
        -DENABLE_TESTING=OFF \
        -DFORCE_SHARED_CRT=ON \
        -DAWS_SDK_WARNINGS_ARE_ERRORS=OFF \
        -DUSE_CRT_HTTP_CLIENT=ON \
        -DUSE_OPENSSL=OFF \
        -Dcrypto_INCLUDE_DIR=/usr/include/aws-lc \
        -Dcrypto_LIBRARY=/usr/lib/aws-lc/libcrypto.a

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-sdk-cpp-fips-dev
    description: aws-sdk-cpp dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-crt-cpp-fips-dev
      provides:
        - aws-sdk-cpp-dev=${{package.full-version}}
      provider-priority: 20

update:
  enabled: true
  github:
    identifier: aws/aws-sdk-cpp
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
