package:
  name: aws-sdk-cpp-fips
  version: "1.11.601"
  epoch: 0
  description: "The AWS SDK for C++"
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - aws-sdk-cpp=${{package.full-version}}
    provider-priority: 20
    runtime:
      - aws-crt-cpp-fips

environment:
  contents:
    packages:
      - aws-crt-cpp-fips-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - samurai
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/aws-sdk-cpp
      tag: ${{package.version}}
      expected-commit: 1db79a0b816c2236d264eb3be7c3e67742a6c9a5

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_DEPS=OFF \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux \
        -DENABLE_TESTING=OFF \
        -DFORCE_SHARED_CRT=ON \
        -DAWS_SDK_WARNINGS_ARE_ERRORS=OFF \
        -DUSE_CRT_HTTP_CLIENT=ON \
        -DUSE_OPENSSL=OFF

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-sdk-cpp-fips-dev
    description: aws-sdk-cpp dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-crt-cpp-fips-dev
      provides:
        - aws-sdk-cpp-dev=${{package.full-version}}
      provider-priority: 20

update:
  enabled: true
  github:
    identifier: aws/aws-sdk-cpp
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
