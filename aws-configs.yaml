package:
  name: aws-configs
  version: "0.0.1"
  epoch: 1
  description: Configuration files needed to run in Amazon EC2
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox

pipeline:
  - name: "Use Amazon Time Sync Service to synchronize clock"
    runs: |
      mkdir -p ${{targets.destdir}}/usr/lib/systemd/timesyncd.conf.d
      cp 50-amazon-time-sync-service.conf ${{targets.destdir}}/usr/lib/systemd/timesyncd.conf.d/

test:
  pipeline:
    - runs: |
        grep -F '[Time]' /usr/lib/systemd/timesyncd.conf.d/50-amazon-time-sync-service.conf

update:
  enabled: false
  exclude-reason: No upstream
