# This package is NOT MAINTAINED upstream tensorflow/tensorflow stopped releasing tflite-runtime after v2.14.0
# The project has migrated to google-ai-edge/LiteRT
# This package should be used with caution as it will not receive security updates
package:
  name: py3-tflite-runtime-2.14.0
  version: "2.14.0"
  epoch: 0
  description: TensorFlow Lite runtime for Python
  copyright:
    - license: Apache-2.0
  resources:
    cpu: 16
    memory: 32Gi

vars:
  pypi-package: tflite-runtime
  import: tflite_runtime

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-18
      - cmake-3
      - coreutils
      - gcc-12
      - gcc-12-default
      - ninja
      - py3-supported-build-base
      - py3-supported-numpy
      - py3-supported-pip
      - py3-supported-pybind11
      - py3-supported-python-dev
      - py3-supported-setuptools
      - py3-supported-wheel
      - python-3-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tensorflow/tensorflow
      tag: v${{package.version}}
      expected-commit: 4dacf3f368eb7965e9b5c3bbdd5193986081c3b2

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: Python ${{range.key}} bindings for TensorFlow Lite runtime
    dependencies:
      runtime:
        - py${{range.key}}-numpy
      provider-priority: ${{range.value}}
    pipeline:
      - name: Build wheel for Python ${{range.key}}
        runs: |
          export PYTHON=python${{range.key}}
          export CI_BUILD_PYTHON=python${{range.key}}
          export BUILD_NUM_JOBS=4

          bash ./tensorflow/lite/tools/pip_package/build_pip_package_with_cmake.sh

          $PYTHON -m pip install --no-deps --no-compile --prefix=/usr --root="${{targets.subpkgdir}}" ./tensorflow/lite/tools/pip_package/gen/tflite_pip/python${{range.key}}/dist/*.whl
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Import test
          runs: |
            python${{range.key}} -c "import tflite_runtime; print(tflite_runtime.__version__)"
            python${{range.key}} -c "from tflite_runtime.interpreter import Interpreter; print('OK')"

update:
  enabled: false
  exclude-reason: "Project migrated to https://github.com/google-ai-edge/LiteRT after v2.14.0; this package tracks the final tensorflow/tensorflow release and will not receive updates"
