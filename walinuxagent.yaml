package:
  name: walinuxagent
  version: 2.12.0.4
  epoch: 0
  description: Agents for Azure cloud
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - grep
      - logrotate
      - openssh
      - openssl
      - py${{vars.python-version}}-distro
      - py${{vars.python-version}}-pyasn1
      - systemd
      - util-linux

vars:
  # We're missing legacycrypt for python 3.13
  python-version: "3.12"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - python-${{vars.python-version}}
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-distro
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Azure/WALinuxAgent.git
      expected-commit: 5fcca0f6baedfe43c98bc5064e5c3f3abb8bc53a
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: chainguard-configs.patch

  - runs: |
      python${{vars.python-version}} setup.py install \
      --verbose \
      --prefix=/usr \
      --lnx-distro='chainguard' \
      --root=${{targets.destdir}}
      # The setup.py script upstream uses out of date arguments that aren't passed from pip

  - runs: |
      sed -i 's/env python3/env python${{vars.python-version}}/' ${{targets.destdir}}/usr/sbin/waagent

  - name: Install Location Cleanup
    runs: |
      mkdir -p ${{targets.destdir}}/usr/
      mv ${{targets.destdir}}/lib/* ${{targets.destdir}}/usr/lib/
      rmdir ${{targets.destdir}}/lib
      mkdir -p ${{targets.destdir}}/usr/lib/systemd/system-preset/
      mv ${{targets.destdir}}/usr/lib/systemd/system/90-waagent.preset  ${{targets.destdir}}/usr/lib/systemd/system-preset/

test:
  pipeline:
    - runs: |
        waagent -help

update:
  enabled: true
  github:
    identifier: Azure/WALinuxAgent
    strip-prefix: v
