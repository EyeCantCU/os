package:
  name: nvidia-nccl-cuda-11.8
  version: 2.21.5
  epoch: 4
  description: Optimized primitives for collective multi-GPU communication
  copyright:
    - license: LicenseRef-NVIDIA-nccl-BSD-3-Clause
      license-path: LICENSE.txt
  dependencies:
    provides:
      - ${{package.name}}-dev=${{package.full-version}}

vars:
  # tag and commit for the https://github.com/NVIDIA/nccl-tests repository used in test
  nccl-tests-tag: v2.13.12
  nccl-tests-expected-commit: 29f4114f027fed903649a3c81babc5d52e8d41ae

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - coreutils
      - gcc-11-default
      # require libglvnd explicitly for apko to resolve dependencies ; https://github.com/chainguard-dev/internal-dev/issues/7748
      - libglvnd
      - nvidia-cuda-cccl-11.8
      - nvidia-cuda-cudart-11.8
      - nvidia-cuda-cudart-11.8-dev
      - nvidia-cuda-nvcc-11.8
      - nvidia-cuda-nvcc-11.8-dev
      - nvidia-cuda-nvrtc-11.8
      - nvidia-cuda-nvrtc-11.8-dev
      - nvidia-cuda-nvtx-11.8
      - nvidia-cuda-nvtx-11.8-dev
      - nvidia-cuda-profiler-api-11.8
      - nvidia-cudnn-9-cuda-11-dev
      # Cuda
      - nvidia-driver-11.8
      - nvidia-libcublas-11.8
      - nvidia-libcublas-11.8-dev
      - nvidia-libcufft-11.8
      - nvidia-libcufft-11.8-dev
      - nvidia-libcurand-11.8
      - nvidia-libcurand-11.8-dev
      - nvidia-libcusolver-11.8
      - nvidia-libcusolver-11.8-dev
      - nvidia-libcusparse-11.8
      - nvidia-libcusparse-11.8-dev
      # python 3.12 had isssues with many CUDA builds, so using python-3.11
      - python-3.11

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/nccl
      tag: v${{package.version}}-1
      expected-commit: ab2b89c4c339bd7f816fbc114a4b05d386b66290

  - runs: |
      # default CUDA_HOME is /usr/local/cuda, hence explicit declaration
      make -j$nproc src.build CUDA_HOME=/usr/local/cuda-11.8

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/lib
      mkdir -p ${{targets.destdir}}/usr/include
      mv ./build/lib/* ${{targets.destdir}}/usr/lib
      mv ./build/include/* ${{targets.destdir}}/usr/include

update:
  enabled: false
  github:
    identifier: NVIDIA/nccl
    strip-prefix: v
    strip-suffix: "-1"
    use-tag: true
    tag-filter: v2

test:
  environment:
    environment:
      HOME: /home/build
    contents:
      packages:
        - bash
        - build-base
        - ca-certificates-bundle
        - cmake
        - gcc-11-default
        - python-3.11-dev
        # Cuda
        - nvidia-driver
        - nvidia-cuda-cccl-11.8
        - nvidia-cuda-profiler-api-11.8
        - nvidia-cudnn-9-cuda-11
        - cuda-toolkit-11.8-dev
  pipeline:
    - uses: git-checkout
      with:
        repository: https://github.com/NVIDIA/nccl-tests
        tag: ${{vars.nccl-tests-tag}}
        expected-commit: ${{vars.nccl-tests-expected-commit}}
    - runs: |
        # We are not actually running the tests, but just compiling them. Running the tests requires GPU's
        make CUDA_HOME=/usr/local/cuda-11.8
    - uses: test/pkgconf
    - uses: test/tw/ldd-check
