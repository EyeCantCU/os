package:
  name: openssl-config-fipshardened-3.6.0
  version: "3.6.0"
  epoch: 2
  description: "Hardened FIPS cryptographic configuration policy for OpenSSL"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openssl-fips-test
      - openssl-provider-fips-3.6.0
    replaces:
      - openssl
      - openssl-config<3.4.0
    replaces-priority: 10

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      mkdir -p "${{targets.destdir}}"/etc/ssl
      cp openssl.cnf "${{targets.destdir}}"/etc/ssl/openssl.cnf

      mkdir -p "${{targets.destdir}}"/etc/ssh/ssh_config.d/
      cp 10-ssh-fips.conf "${{targets.destdir}}"/etc/ssh/ssh_config.d/
      chmod 0644 "${{targets.destdir}}"/etc/ssh/ssh_config.d/10-ssh-fips.conf

      mkdir -p "${{targets.destdir}}"/etc/ssh/sshd_config.d/
      cp 10-sshd-fips.conf "${{targets.destdir}}"/etc/ssh/sshd_config.d/
      chmod 0644 "${{targets.destdir}}"/etc/ssh/sshd_config.d/10-sshd-fips.conf

test:
  environment:
    contents:
      packages:
        - curl
        - gdb
        - git
        - nodejs
        - openscap
        - openssh-client
        - openssh-server
        - openssl
        - openssl-dbg
        - openssl-provider-fips-3.6.0-dbg
        - python3
        - wget
  pipeline:
    - uses: test/oldglibc
      with:
        files: /usr/lib/ossl-modules/fips.so
        version: 2.34
    - name: Check fips test
      runs: |
        openssl-fips-test
    - name: Verify curl still works
      runs: |
        ! curl https://expired.badssl.com/
        curl -I https://github.com/openssl/openssl
    - name: Verify git still works
      runs: |
        git ls-remote --exit-code https://github.com/openssl/openssl refs/tags/openssl-3.3.0
    - name: Verify wget still works
      runs: |
        ! wget https://expired.badssl.com/
        wget -O /dev/null https://github.com/openssl/openssl
    - name: Verify only jitter entropy source is in use
      runs: |
        # Possibly python gdb would be easier to read
        # Possibly python gdb would be easier to read
        cat <<EOF >openssl.gdb
        set pagination off
        set logging file gdb.log
        set logging enabled on
        set width 0
        set height 0
        set verbose on
        set breakpoint pending on
        break jent_entropy_init_ex
        commands 1
          continue
        end
        break jent_read_entropy
        commands 2
          continue
        end
        break syscall_random
        commands 3
          continue
        end
        run rand -hex 8
        run genrsa
        run ecparam -name prime256v1 -genkey
        run genpkey -algorithm ed25519
        EOF
        gdb --batch --command ./openssl.gdb openssl
        # Assert that jitter entropy init is used from fips.so
        grep -q 'Breakpoint 1.*fips.so' gdb.log || exit 1
        # Assert that jitter entropy read is used from fips.so
        grep -q 'Breakpoint 2.*fips.so' gdb.log || exit 1
        # Assert that jitter entropy init is not used from libcrypto.so
        grep -q 'Breakpoint 1.*libcrypto.so' gdb.log && exit 1
        # Assert that jitter entropy read is not used from libcrypto.so
        grep -q 'Breakpoint 2.*libcrypto.so' gdb.log && exit 1
        # Assert that getrandom syscall wrapper is never used
        grep -q 'Breakpoint 3,' gdb.log && exit 1
    - name: Verify ssh client is FIPS hardened
      runs: |
        # TODO FIXME add PQC kex
        # uses SHA1 for mux TODO FIXME
        OPENSSL_CONF=/dev/null ssh -v -G localhost >ssh.log 2>&1
        grep '^debug1: Reading configuration data /etc/ssh/ssh_config.d/10-ssh-fips.conf' ssh.log
        grep '^ciphers aes128-gcm@openssh.com,aes256-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr$' ssh.log
        grep '^macs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512$' ssh.log
        grep '^kexalgorithms ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521$' ssh.log
        grep '^requiredrsasize 2048$' ssh.log
    - name: Verify ssh server is FIPS hardened
      runs: |
        # TODO FIXME add PQC kex
        # sshd needs host keys to be present
        ssh-keygen -A
        sshd -T >sshd.log 2>&1
        # Verify the expected configuration stuck. OpenSSH uses "first definition
        # wins" to resolve redefined options, so this ensures there's no accidental
        # prior definitons that conflict.
        grep '^ciphers aes128-gcm@openssh.com,aes256-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr$' sshd.log
        grep '^kexalgorithms ecdh-sha2-nistp256,ecdh-sha2-nistp384$' sshd.log
        grep '^macs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512$' sshd.log
        grep '^requiredrsasize 2048$' sshd.log
        grep '^hostkeyalgorithms ecdsa-sha2-nistp256-cert-v01@openssh.com,ecdsa-sha2-nistp384-cert-v01@openssh.com,ecdsa-sha2-nistp521-cert-v01@openssh.com,sk-ecdsa-sha2-nistp256-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,sk-ecdsa-sha2-nistp256@openssh.com,rsa-sha2-512,rsa-sha2-256$' sshd.log
        grep '^casignaturealgorithms ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,sk-ecdsa-sha2-nistp256@openssh.com,rsa-sha2-512,rsa-sha2-256$' sshd.log
        grep '^hostbasedacceptedalgorithms ecdsa-sha2-nistp256-cert-v01@openssh.com,ecdsa-sha2-nistp384-cert-v01@openssh.com,ecdsa-sha2-nistp521-cert-v01@openssh.com,sk-ecdsa-sha2-nistp256-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,sk-ecdsa-sha2-nistp256@openssh.com,rsa-sha2-512,rsa-sha2-256$' sshd.log
        grep '^pubkeyacceptedalgorithms ecdsa-sha2-nistp256-cert-v01@openssh.com,ecdsa-sha2-nistp384-cert-v01@openssh.com,ecdsa-sha2-nistp521-cert-v01@openssh.com,sk-ecdsa-sha2-nistp256-cert-v01@openssh.com,rsa-sha2-512-cert-v01@openssh.com,rsa-sha2-256-cert-v01@openssh.com,ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,sk-ecdsa-sha2-nistp256@openssh.com,rsa-sha2-512,rsa-sha2-256$' sshd.log
    - name: docker-dind certificate generation
      runs: |
        # Distilled from dockerd-entrypoint.sh
        set -x
        tmpdir="$(mktemp -d)"
        trap "rm -rf "$tmpdir"" EXIT
        rm -rf "$tmpdir/certs/"
        mkdir -p "$tmpdir/certs/ca"
        openssl genrsa -out "$tmpdir/certs/ca/key.pem" 4096
        # TODO FIXME Does not support sha256/160 for
        # SubjectKeyIdentifier like Letsencrypt does
        OPENSSL_CONF=/etc/ssl/ca.cnf openssl req -new -key "$tmpdir/certs/ca/key.pem" \
          -out "$tmpdir/certs/ca/cert.pem" -subj '/CN=docker:dind CA' \
          -x509 -days 825
        mkdir -p "$tmpdir/certs/server"
        openssl genrsa -out "$tmpdir/certs/server/key.pem" 4096
        # TODO FIXME Does not support sha256/160 for
        # SubjectKeyIdentifier like Letsencrypt does
        OPENSSL_CONF=/etc/ssl/ca.cnf openssl req -new -key "$tmpdir/certs/server/key.pem" \
          -out "$tmpdir/certs/server/csr.pem" -subj '/CN=docker:dind server'
        cat << EOF >"$tmpdir/certs/server/openssl.cnf"
        [ x509_exts ]
        subjectAltName = DNS:b51ddd7b8dcd,DNS:docker,DNS:localhost,IP:127.0.0.1,IP:172.17.0.4,IP:::1
        EOF
        # TODO FIXME Does not support sha256/160 for
        # SubjectKeyIdentifier like Letsencrypt does
        OPENSSL_CONF=/etc/ssl/ca.cnf openssl x509 -req -in "$tmpdir/certs/server/csr.pem"\
          -CA "$tmpdir/certs/ca/cert.pem" -CAkey "$tmpdir/certs/ca/key.pem" \
          -CAcreateserial -out "$tmpdir/certs/server/cert.pem" \
          -days 825 -extfile "$tmpdir/certs/server/openssl.cnf" \
          -extensions x509_exts
        cp "$tmpdir/certs/ca/cert.pem" "$tmpdir/certs/server/ca.pem"
        # TODO FIXME Does not support sha256/160 for
        # SubjectKeyIdentifier like Letsencrypt does
        OPENSSL_CONF=/etc/ssl/ca.cnf openssl verify -verbose -CAfile "$tmpdir/certs/server/ca.pem" \
          "$tmpdir/certs/server/cert.pem"
    - name: openscap stig fips check
      runs: |
        STIG_NAME="ssg-chainguard-gpos-ds.xml"
        STIG_URL="https://raw.githubusercontent.com/chainguard-dev/stigs/main/gpos/xml/scap/ssg/content/${STIG_NAME}"
        curl -fsSLO --output-dir /tmp "${STIG_URL}"
        for rule in 203739r987791 203776r959006 203750r958912 203751r958914 203649r971535 ; do
            rule_args="$rule_args --rule xccdf_mil.disa.stig_rule_SV-${rule}_rule"
        done
        if ! oscap xccdf eval --verbose WARNING $rule_args  "/tmp/${STIG_NAME}" ; then
            # if we failed, then re-run more verbosely to help make diagnosing easier
            oscap xccdf eval --verbose INFO $rule_args  "/tmp/${STIG_NAME}"
        fi
    - name: Check Python MD5 support
      runs: |
        python3 md5-check.py
    - name: Check node HMAC capability
      runs: |
        node -e "require('crypto').createHmac('sha256','key').update('test').digest('hex')"

update:
  enabled: true
  github:
    identifier: openssl/openssl
    strip-prefix: openssl-
    tag-filter-prefix: openssl-
