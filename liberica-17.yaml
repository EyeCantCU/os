package:
  name: liberica-17
  version: "17.0.17.16"
  epoch: 1
  description: Liberica ${{vars.major-version}} Java development kit
  copyright:
    - license: GPL-2.0-with-classpath-exception
  resources:
    memory: 64Gi
  dependencies:
    runtime:
      - alsa-lib
      - crac-criu
      - freetype
      - giflib
      - java-cacerts
      - lcms2
      - libfontconfig1
      - libjpeg-turbo
      - libx11
      - libxext
      - libxi
      - libxrender
      - libxtst
      - ttf-dejavu
      - zlib

vars:
  java-home: /usr/lib/jvm/java-17-liberica
  boot-jdk: /usr/lib/jvm/java-17-openjdk
  googletest-version: v1.13.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+.\d+.\d+)\.(\d+)$
    replace: $1+$2
    to: mangled-package-version
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - alsa-lib-dev
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cups-dev
      - file
      - fontconfig-dev
      - freetype-dev
      - giflib-dev
      - java-cacerts
      - lcms2-dev
      - libffi-dev
      - libjpeg-turbo-dev
      - libx11-dev
      - libxext-dev
      - libxi-dev
      - libxrandr-dev
      - libxrender-dev
      - libxt-dev
      - libxtst-dev
      - openjdk-${{vars.major-version}}-default-jdk
      - zip

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/bell-sw/Liberica/releases/download/${{vars.mangled-package-version}}/bellsoft-jdk${{vars.mangled-package-version}}-src-crac.tar.gz
      expected-sha512: b822a1168f57e9d7b8a958115916ca5c1adba042d1d6384d558317cd4e9a0e288a1f8b405e4683de56f61d4f7fa13089d0b89b12b13ca27bac0adefa4e39bf54

  - name: Extract the googletest version from the source doc and Verify
    runs: |
      googletest_version=$(sed -n 's/.*https:\/\/github\.com\/google\/googletest\/releases\/tag\/\(v[0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' doc/building.md)
      if [ "$googletest_version" != "${{vars.googletest-version}}" ]; then
        echo "Error: googletest version mismatch. Expected ${{vars.googletest-version}}, got $googletest_version"
        exit 1
      fi

  - working-directory: /home/build/googletest
    pipeline:
      - uses: fetch
        with:
          uri: https://github.com/google/googletest/archive/${{vars.googletest-version}}.tar.gz
          expected-sha512: 70c0cfb1b4147bdecb467ecb22ae5b5529eec0abc085763213a796b7cdbd81d1761d12b342060539b936fa54f345d33f060601544874d6213fdde79111fa813e

  - runs: chmod +x configure

  # Note that despite using --with-extra-cflags, --with-extra-cxxflags, and
  # --with-extra-ldflags, the configure still produces warnings like:
  # https://chainguard.dev/contact/18747
  - uses: autoconf/configure
    with:
      opts: |
        --disable-precompiled-headers \
        --disable-warnings-as-errors \
        --enable-dtrace=no \
        --prefix=${{vars.java-home}} \
        --with-boot-jdk=${{vars.boot-jdk}} \
        --with-debug-level=release \
        --with-extra-cflags="$CFLAGS" \
        --with-extra-cxxflags="$CXXFLAGS" \
        --with-extra-ldflags="$LDFLAGS" \
        --with-freetype=system \
        --with-giflib=system \
        --with-gtest="/home/build/googletest" \
        --with-jtreg=no \
        --with-jvm-variants=server \
        --with-lcms=system \
        --with-libffi=system \
        --with-libjpeg=system \
        --with-libpng=system \
        --with-native-debug-symbols=internal \
        --with-vendor-bug-url=https://chainguard.dev/contact \
        --with-vendor-name=Chainguard \
        --with-vendor-url=https://chainguard.dev \
        --with-version-opt="cgr-r${{package.epoch}}" \
        --with-version-string="" \
        --with-zlib=system

  - runs: |
      make jdk-image legacy-jre-image

      mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
      cp -r build/*-server-release/images/jdk/* ${{targets.contextdir}}/${{vars.java-home}}
      rm ${{targets.contextdir}}/${{vars.java-home}}/lib/src.zip

      # symlink for `java-common` to work (which expects jre in $JAVA_HOME/jre)
      ln -sf . ${{targets.contextdir}}/${{vars.java-home}}/jre

      # Symlink CRIU
      ln -sf /usr/sbin/crac-criu ${{targets.contextdir}}/${{vars.java-home}}/lib/criu

subpackages:
  - name: ${{package.name}}-dbg
    description: Liberica ${{vars.major-version}} Java debug symbols
    pipeline:
      - uses: split/debug
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/tw/debugpackage

  - name: ${{package.name}}-jre
    description: Liberica ${{vars.major-version}} Java runtime environment
    dependencies:
      runtime:
        - alsa-lib
        - crac-criu
        - freetype
        - giflib
        - java-cacerts
        - lcms2
        - libfontconfig1
        - libjpeg-turbo
        - libx11
        - libxext
        - libxi
        - libxrender
        - libxtst
        - ttf-dejavu
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          cp -r build/*-server-release/images/jre/* ${{targets.contextdir}}/${{vars.java-home}}

          # copy to shared java cacerts store
          rm -f ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts
          ln -sf /etc/ssl/certs/java/cacerts \
            ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts

          # symlink for `java-common` to work (which expects jre in ${{vars.java-home}}/jre)
          ln -sf . ${{targets.contextdir}}/${{vars.java-home}}/jre

          # Symlink CRIU
          ln -sf /usr/sbin/crac-criu ${{targets.contextdir}}/${{vars.java-home}}/lib/criu
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: "/usr/lib/jvm/java-17-liberica/lib/"
            name: "*.so*"

  - name: ${{package.name}}-jmods
    description: Liberica ${{vars.major-version}} jmods
    dependencies:
      provides:
        - liberica-jmods=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ${{targets.destdir}}/${{vars.java-home}}/jmods \
             ${{targets.contextdir}}/${{vars.java-home}}
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: "/usr/lib/jvm/java-17-liberica/jmods/"
            name: "*.jmod"
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: liberica-jmods

  - name: ${{package.name}}-doc
    description: Liberica ${{vars.major-version}} documentation
    dependencies:
      runtime:
        - man-db
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ${{targets.destdir}}/${{vars.java-home}}/man \
             ${{targets.contextdir}}/${{vars.java-home}}
    test:
      pipeline:
        - uses: test/tw/docs
          with:
            path-prefix: "usr/lib/jvm/java-17-liberica"

  - name: ${{package.name}}-demos
    description: Liberica ${{vars.major-version}} demos
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ${{targets.destdir}}/${{vars.java-home}}/demo \
             ${{targets.contextdir}}/${{vars.java-home}}
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: "/usr/lib/jvm/java-17-liberica/demo/nbproject/jfc/Font2DTest/"
            name: "*.properties"

  - name: ${{package.name}}-default-jvm
    description: Use the Liberica ${{vars.major-version}} JVM as the default JVM
    dependencies:
      runtime:
        - java-common-jre
        - ${{package.name}}-jre
      provides:
        - liberica-default-jvm=1.${{vars.major-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib/jvm
          ln -sf $(basename ${{vars.java-home}}) ${{targets.contextdir}}/usr/lib/jvm/default-jvm
    test:
      pipeline:
        - runs: readlink -v /usr/lib/jvm/default-jvm
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: liberica-default-jvm

  - name: ${{package.name}}-default-jdk
    description: Use the Liberica ${{vars.major-version}} JVM as the default JVM with the JDK installed
    dependencies:
      runtime:
        - ${{package.name}}
        - java-common
      provides:
        - liberica-default-jdk=1.${{vars.major-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib/jvm
          ln -sf $(basename ${{vars.java-home}}) ${{targets.contextdir}}/usr/lib/jvm/default-jvm
    test:
      pipeline:
        - runs: readlink -v /usr/lib/jvm/default-jvm
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: liberica-default-jdk

update:
  enabled: true
  version-transform:
    - match: ^(.+)\+(\d+)$
      replace: $1.$2
  github:
    identifier: bell-sw/Liberica
    tag-filter: 17.
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-default-jdk
        - ${{package.name}}-jmods
  pipeline:
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/usr/lib/jvm/java-17-liberica/lib/:/usr/lib/jvm/java-17-liberica/lib/server/"
    # Test a basic Hello World
    - working-directory: basic
      runs: |
        javac HelloWorld.java
        java HelloWorld | grep -qi "Hello World!"
    # Test a basic HTTP connection
    - working-directory: basic
      runs: |
        javac RequestTest.java
        java RequestTest | grep -qi "Successfully connected to example.org"
    # Test modules
    - working-directory: advanced/module-project
      runs: |
        mkdir output
        javac -d output --module-source-path modules $(find modules -name "*.java")

        # Create a jar with the compiled classes
        jar --verbose --create --file app.jar \
          --main-class dev.chainguard.module.main.Main \
          --module-version 1.0 \
          -C output/test.modules . \
          -C output/main.app .

        # Test the jar
        java -jar app.jar

        # Test jlink
        jlink --verbose --module-path "app.jar:$JAVA_HOME/jmods" \
          --add-modules test.modules \
          --output test-project-jre

        # Test custom JRE
        test-project-jre/bin/java -jar app.jar
