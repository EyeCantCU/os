package:
  name: rancher-webhook-fips-0.6
  version: "0.6.9"
  epoch: 0
  description: Rancher webhook for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-webhook-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 825c54f75e8693a4bca7f0a5189ddb014928b1ff
      repository: https://github.com/rancher/webhook
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        k8s.io/kubernetes@v1.31.6
      modroot: .

  - uses: go/build
    with:
      modroot: .
      output: webhook
      packages: .
      go-package: go-fips

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v0.6.

test:
  pipeline:
    - uses: test/go-fips-check
    - name: "start daemon"
      uses: test/daemon-check-output
      with:
        start: "webhook"
        timeout: 15
        expected_output: |
          starting
          Waiting for server to become available
