package:
  name: policy-controller-fips
  version: "0.12.1"
  epoch: 3
  description: The policy admission controller used to enforce policy on a cluster on verifiable supply-chain metadata from cosign.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

vars:
  PKG: "github.com/sigstore/policy-controller"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e58d7f5acbe8b8cfded12b04c99d72192d9503a9
      repository: https://github.com/sigstore/policy-controller
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/open-policy-agent/opa@v1.4.0
        github.com/cloudflare/circl@v1.6.1
        github.com/go-viper/mapstructure/v2@v2.3.0

  # ldflags come from https://github.com/sigstore/policy-controller/blob/main/Makefile#L45
  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/webhook
      output: policy-controller
      tags: netgo,osusergo
      ldflags: |
        -X sigs.k8s.io/release-utils/version.gitVersion=$(git describe --tags --always --dirty)
        -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/release-utils/version.gitTreeState=clean
        -X sigs.k8s.io/release-utils/version.buildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')

subpackages:
  - name: policy-controller-tester-fips
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          packages: ./cmd/tester
          output: policy-tester
          tags: netgo,osusergo
          ldflags: |
            -X sigs.k8s.io/release-utils/version.gitVersion=$(git describe --tags --always --dirty)
            -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD)
            -X sigs.k8s.io/release-utils/version.gitTreeState=clean
            -X sigs.k8s.io/release-utils/version.buildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')
    dependencies:
      runtime:
        - ca-certificates-bundle
    description: CLI for testing ClusterImagePolicy resources
    test:
      pipeline:
        - runs: |
            policy-tester --version
            policy-tester --help

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        policy-controller --help

update:
  enabled: true
  manual: false
  github:
    identifier: sigstore/policy-controller
    strip-prefix: v
