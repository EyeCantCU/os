pipeline:
  - name: Process Debian CA certificates
    runs: |
      set -euo pipefail

      # Create the debian-package directory
      mkdir -p "${{targets.destdir}}/debian-package"

      # ... [existing setup code] ...

      # Download and extract Debian ca-certificates
      DEB_URL="https://deb.debian.org/debian/pool/main/c/ca-certificates/ca-certificates_${target_ca_certificates_version}_all.deb"
      echo "Fetching Debian ca-certificates from: $DEB_URL"
      curl -fLO "$DEB_URL"

      # Extract the .deb package using ar
      ar x "ca-certificates_${target_ca_certificates_version}_all.deb"
      tar -xf data.tar.xz

      # CRITICAL FIX: Properly generate the complete CA bundle like Debian does
      # This mimics what update-ca-certificates does

      # 1. Start with an empty bundle
      > ca-bundle.crt

      # 2. Process certificates based on Debian's default configuration
      # Read the default configuration that comes with ca-certificates
      if [ -f etc/ca-certificates.conf ]; then
        # Process enabled certificates (lines not starting with !)
        while IFS= read -r line; do
          # Skip comments and disabled entries
          case "$line" in
            '#'*|'!'*|'') continue ;;
          esac

          cert_path="usr/share/ca-certificates/$line"
          if [ -f "$cert_path" ]; then
            cat "$cert_path" >> ca-bundle.crt
          fi
        done < etc/ca-certificates.conf
      else
        # Fallback: If no config, include all certificates (mozilla + any others)
        find usr/share/ca-certificates -name "*.crt" -type f | while read -r cert; do
          cat "$cert" >> ca-bundle.crt
        done
      fi

      # Alternative simpler approach (if we can't parse the config):
      # Include ALL certificates from the package, not just mozilla/
      # find usr/share/ca-certificates -name "*.crt" -type f -exec cat {} \; >> ca-bundle.crt

      # ... [rest of the existing JSON generation code] ...
