package:
  name: nvidia-gpu-operator-24.3
  version: 24.3.0
  epoch: 2
  description: NVIDIA GPU Operator creates/configures/manages GPUs atop Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - nvidia-gpu-operator=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - go
      - ca-certificates-bundle
  environment:
    CGO_ENABLED: 0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/gpu-operator
      tag: v${{package.version}}
      expected-commit: 0fe1e8db32b05ddab8bbd4d5bcc3f492b75cfee4

  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.23.0

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/gpu-operator
      output: gpu-operator
      ldflags: "-s -w -X ${{package.version}}.gitCommit=$(git rev-parse HEAD) -X ${{package.version}}.version=${{package.version}}"
      go-package: go

  - name: copy files
    runs: |
      mkdir -p ${{targets.contextdir}}/opt/gpu-operator

      cp -rf assets ${{targets.contextdir}}/opt/gpu-operator/
      cp -rf manifests ${{targets.contextdir}}/opt/gpu-operator/

      mkdir -p ${{targets.contextdir}}/licenses
      cp NGC-DL-CONTAINER-LICENSE -P ${{targets.contextdir}}/licenses/NGC-DL-CONTAINER-LICENSE

      cp deployments/gpu-operator/crds/nvidia.com_clusterpolicies_crd.yaml ${{targets.contextdir}}/opt/gpu-operator/nvidia.com_clusterpolicies_crd.yaml
      cp deployments/gpu-operator/crds/nvidia.com_nvidiadrivers.yaml ${{targets.contextdir}}/opt/gpu-operator/nvidia.com_nvidiadrivers.yaml
      cp deployments/gpu-operator/charts/node-feature-discovery/crds/nfd-api-crds.yaml ${{targets.contextdir}}/opt/gpu-operator/nfd-api-crds.yaml

  - uses: strip

test:
  pipeline:
    - runs: gpu-operator --help

update:
  enabled: true
  github:
    identifier: NVIDIA/gpu-operator
    strip-prefix: v
    use-tag: true
    tag-filter: v24.3.
