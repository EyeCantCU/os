package:
  name: torchaudio-cuda12
  version: 2.3.1
  epoch: 0
  description: Data manipulation and transformation for audio signal processing, powered by PyTorch
  copyright:
    - license: BSD-2-Clause
  target-architecture:
    - x86_64
  resources:
    cpu: 16
    memory: 16Gi
  options:
    no-depends: true
  dependencies:
    runtime:
      - libgomp
      - openmp-17-dev
      - cuda-toolkit-12.3
      - nvidia-nccl-cuda-12.3

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - gcc-12-default
      - ninja
      - python-3.11-dev
      # cuda
      - nvidia-driver
      - nvidia-cuda-cccl-12
      - nvidia-cuda-profiler-api-12
      - nvidia-cudnn-8-cuda-12
      - cuda-toolkit-12.3-dev
      - pytorch-cuda12

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/audio
      tag: v${{package.version}}
      expected-commit: 3edcf69e78a3c9a3077a11159861422440ec7d4a

  - runs: |
      export LD_LIBRARY_PATH="$LD_LIBRARY_PATH:/usr/local/cuda-12.1/lib:/usr/local/cudann-8.9"
      export PATH="$PATH:/usr/local/cuda-12.3/bin"

      export USE_CUDA=1
      export FORCE_CUDA=1
      export USE_CUDNN=1
      export TORCH_CUDA_ARCH_LIST="5.2 6.0 6.1 7.0+PTX 8.0 8.6 8.7 8.9 9.0"
      export TORCH_NVCC_FLAGS="-Xfatbin -compress-all"

      export CFLAGS="$CFLAGS -Wno-error=nonnull -Wno-nonnull"
      export CXXFLAGS="$CXXFLAGS -Wno-error=nonnull -Wno-nonnull"

      export CUDA_VERSION="12.3"
      export CUDAToolkit_ROOT="/usr/local/cuda-12.3"

      export BUILD_VERSION="${{package.version}}+cu121"

      /usr/share/pytorch/.venv/bin/pip install --upgrade pip setuptools==65.5.1
      /usr/share/pytorch/.venv/bin/pip install wheel

      echo "--extra-index-url https://pypi.ngc.nvidia.com" >> requirements.txt
      /usr/share/pytorch/.venv/bin/pip install -r requirements.txt

      /usr/share/pytorch/.venv/bin/python setup.py bdist_wheel
      /usr/share/pytorch/.venv/bin/pip install dist/*.whl

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/torchaudio
      mv /usr/share/pytorch/.venv ${{targets.destdir}}/usr/share/torchaudio/

      # edit the venv paths
      sed -i "s|/usr/share/pytorch|/usr/share/torchaudio|g" ${{targets.destdir}}/usr/share/torchaudio/.venv/bin/*

      # allow site-packages
      sed -i "s|include-system-site-packages = false|include-system-site-packages = true|g" ${{targets.destdir}}/usr/share/torchaudio/.venv/pyvenv.cfg

  - uses: strip

update:
  enabled: true
  github:
    identifier: pytorch/audio
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - build-base
        - bash
        - busybox
        - libgomp
        - openmp-17-dev
        - torchaudio-cuda12
  pipeline:
    - runs: |
        export PATH=/usr/share/torchaudio/.venv/bin:$PATH
        if ! python -c "import torchaudio" > output.out 2>&1; then
            echo "Failed to import torchaudio"
            cat output.out
            exit 1
        else
            echo "torchaudio imported successfully"
            exit 0
        fi
