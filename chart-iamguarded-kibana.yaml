package:
  name: chart-iamguarded-kibana
  version: "12.1.10"
  epoch: 0
  description: Kibana iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: kibana/${{package.version}}
      expected-commit: f0b3d12d7a9d58e4af892055685e73d3e9c2b753

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/kibana

  - uses: charts/package
    with:
      chart-path: iamguarded/kibana

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: kibana/
    use-tag: true
    tag-filter-prefix: kibana/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /kibana
