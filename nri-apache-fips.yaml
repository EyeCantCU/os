package:
  name: nri-apache-fips
  version: "1.15.3"
  epoch: 1
  description: New Relic Infrastructure Apache Integration (FIPS)
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-apache
      expected-commit: 960218d5dc1c8a5f023768b833baf138d36a1d47
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-apache
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-apache ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-apache
          install -Dm644 legacy/apache-definition.yml ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/apache-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-apache
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-apache
    - uses: test/tw/ver-check
      with:
        bins: nri-apache
        version-flag: "-show_version"
    - name: Test binary execution
      uses: test/daemon-check-output
      with:
        start: |
          nri-apache -metrics
        expected_output: |
          connect: connection refused
        error_strings: |
          "ERROR"
          "Traceback.*most.recent.call"
