package:
  name: libcrypto3-2.34
  version: "3.5.0"
  epoch: 2
  description: "the OpenSSL cryptography suite"
  copyright:
    - license: Apache-2.0
  resources:
    cpu: 16
    memory: 16Gi

environment:
  contents:
    # NB! accessing historic, but certified build of
    # jitterentropy-library-dev=3.5.0-r0. In a fresh bootstrap build
    # any version of jitternetropy-library and get an ESV certificate
    # for it.
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # NB! pinned to version https://csrc.nist.gov/projects/cryptographic-module-validation-program/entropy-validations/certificate/191
      - jitterentropy-library-dev=3.5.0-r0
      - jitterentropy-library=3.5.0-r0
      - oldglibc
      - perl

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openssl/openssl
      tag: openssl-${{package.version}}
      expected-commit: 636dfadc70ce26f2473870570bfd9ec352806b1d

  - uses: patch
    with:
      # fix-cve-2025-4575.patch
      # cannot be cherry-picked from master because of
      # a merge conflict in the test file est/recipes/25-test_x509.t
      # Had to modify from:
      # `- plan tests => 136;`
      # `+ plan tests => 140;`
      # to
      # `- plan tests => 134;`
      # `+ plan tests => 138;`
      # This patch can probably be removed in the next 3.5.1 openssl upstream release.
      patches: fix-jitter.patch fix-cve-2025-4575.patch

  - name: Configure and build
    runs: |
      perl ./Configure \
         linux-${{build.arch}} \
         --prefix=/usr \
         --libdir=lib \
         --openssldir=/etc/ssl \
         enable-ktls \
         enable-jitter \
         shared \
         enable-pie \
         no-zlib \
         no-async \
         no-comp \
         no-idea \
         no-mdc2 \
         no-rc5 \
         no-ec2m \
         no-sm2 \
         no-sm4 \
         no-ssl3 \
         no-seed \
         no-weak-ssl-ciphers \
         -Wa,--noexecstack
      perl configdata.pm --dump
      make -j$(nproc)
      make tests HARNESS_JOBS=10
      mkdir -p ${{targets.contextdir}}/usr/lib/libcrypto3
      cp libcrypto.so.3 ${{targets.contextdir}}/usr/lib/libcrypto3/

test:
  pipeline:
    - uses: test/oldglibc
      with:
        files: /usr/lib/libcrypto3/libcrypto.so.3
        version: 2.34

update:
  enabled: true
  github:
    identifier: openssl/openssl
    strip-prefix: openssl-
    tag-filter-prefix: openssl-
