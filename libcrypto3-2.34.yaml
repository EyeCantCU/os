package:
  name: libcrypto3-2.34
  version: "3.6.0"
  epoch: 1
  description: "the OpenSSL cryptography suite"
  copyright:
    - license: Apache-2.0
  resources:
    cpu: 16
    memory: 16Gi

environment:
  contents:
    # NB! accessing historic, but certified build of
    # jitterentropy-library-dev=3.5.0-r0. In a fresh bootstrap build
    # any version of jitternetropy-library and get an ESV certificate
    # for it.
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      # NB! pinned to version https://csrc.nist.gov/projects/cryptographic-module-validation-program/entropy-validations/certificate/191
      - jitterentropy-library-dev=3.5.0-r0
      - jitterentropy-library=3.5.0-r0
      - oldglibc
      - perl

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openssl/openssl
      tag: openssl-${{package.version}}
      expected-commit: 7b371d80d959ec9ab4139d09d78e83c090de9779

  - uses: patch
    with:
      patches: |
        fix-jitter.patch
        0001-baseprovider-add-MD5-and-SHA1.patch
        0001-fips-block-HMAC-calculation-with-unapproved-digests.patch

  - name: Configure and build
    runs: |
      perl ./Configure \
         linux-${{build.arch}} \
         --prefix=/usr \
         --libdir=lib \
         --openssldir=/etc/ssl \
         enable-ktls \
         enable-jitter \
         shared \
         enable-pie \
         no-zlib \
         no-async \
         no-comp \
         no-idea \
         no-mdc2 \
         no-rc5 \
         no-ec2m \
         no-sm2 \
         no-sm4 \
         no-ssl3 \
         no-seed \
         no-weak-ssl-ciphers \
         -Wa,--noexecstack
      perl configdata.pm --dump
      make -j$(nproc)
      make tests HARNESS_JOBS=10
      mkdir -p ${{targets.contextdir}}/usr/lib/libcrypto3
      cp libcrypto.so.3 ${{targets.contextdir}}/usr/lib/libcrypto3/

test:
  environment:
    contents:
      packages:
        - dotnet-9-sdk
        - nodejs
        - openssl-config-fipshardened
  pipeline:
    - uses: test/oldglibc
      with:
        files: /usr/lib/libcrypto3/libcrypto.so.3
        version: 2.34
    - uses: test/tw/ldd-check
    - runs: |
        cd hmac-check
        # Verify sha256 hmac works with current stock libcrypto
        node -e "require('crypto').createHmac('sha256','key').update('test').digest('hex')"
        # Verify that .NET sha256 HMAC works, and that md5 HMAC is not yet blocked in the public build of libcrypto
        if ! dotnet run ; then
           echo MD5 hmac not blocked in public libcrypto .NET build
        fi
        # Verify again but with this build of portable libcrypto
        cp /usr/lib/libcrypto3/libcrypto.so.3 /usr/lib/libcrypto.so.3
        node -e "require('crypto').createHmac('sha256','key').update('test').digest('hex')"
        # Verify that .NET sha256 HMAC works, and that md5 HMAC is blocked
        dotnet run

update:
  enabled: true
  github:
    identifier: openssl/openssl
    strip-prefix: openssl-
    tag-filter-prefix: openssl-
