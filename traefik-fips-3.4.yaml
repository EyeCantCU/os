package:
  name: traefik-fips-3.4
  version: "3.4.5"
  epoch: 3 # GHSA-47m2-4cr7-mhcw
  description: The Cloud Native Application Proxy
  copyright:
    - license: MIT
  dependencies:
    provides:
      - traefik-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - nodejs-20
      - yarn

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9bf14b67644cb1da14923bda0e3144a0355b4543
      repository: https://github.com/traefik/traefik
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/go-acme/lego/v4@v4.25.2
        github.com/quic-go/quic-go@v0.54.1

  - working-directory: webui
    runs: |
      yarn install
      yarn build

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/traefik
      output: traefik
      ldflags: |
        -X github.com/traefik/traefik/v3/pkg/version.Version=${{package.version}}
        -X github.com/traefik/traefik/v3/pkg/version.BuildDate=$(date -u '+%Y-%m-%d_%I:%M:%S%p')
        -X github.com/traefik/traefik/v3/pkg/version.Codename=$CODENAME
      go-package: go-fips

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v3.4.

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        set -o pipefail
        traefik version | grep ${{package.version}}
        traefik --help
    - name: Run and test traefik
      uses: test/daemon-check-output
      with:
        start: traefik --ping=true --ping.entryPoint=traefik --api.insecure=true --log.level=DEBUG
        timeout: 30
        expected_output: |
          Creating middleware
          Setting up redirection
