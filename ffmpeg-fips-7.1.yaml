# this package builds ffmpeg without zeromq, since that includes libsodium which is not CMVP certified
package:
  name: ffmpeg-fips-7.1
  version: "7.1.3"
  epoch: 0
  description: ffmpeg multimedia library
  copyright:
    - license: GPL-2.0-or-later AND LGPL-2.1-or-later
  dependencies:
    provides:
      - ffmpeg-fips=${{package.full-version}}
    provider-priority: 5
    runtime:
      - libavcodec61=${{package.full-version}}
      - libavdevice61=${{package.full-version}}
      - libavfilter10=${{package.full-version}}
      - libavformat61=${{package.full-version}}
      - libavutil59=${{package.full-version}}
      - libpostproc58=${{package.full-version}}
      - libswresample5=${{package.full-version}}
      - libswscale8=${{package.full-version}}
  resources:
    cpu: 16
    memory: 16Gi

environment:
  contents:
    packages:
      - aom
      - aom-dev
      - aom-libs
      - build-base
      - busybox
      - ca-certificates-bundle
      - dav1d-dev
      - expat-dev
      - fontconfig-dev
      - freetype-dev
      - harfbuzz-dev
      - lame-dev
      - libogg-dev
      - libsdl2-dev
      - libsrt
      - libssh-dev
      - libtheora
      - libtheora-dev
      - libvorbis-dev
      - libwebp-dev
      - libxml2-dev
      - openjpeg-dev
      - openssl-dev
      - opus-dev
      - snappy-dev
      - soxr-dev
      - speex-dev
      - svt-av1-dev
      - wolfi-baselayout
      - x264-dev
      - x265-dev
      - yasm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/FFmpeg/FFmpeg
      expected-commit: f46e514491172d15bd74b4abb1814cd2f05a763e
      tag: n${{package.version}}

  - runs: |
      ./configure \
        --prefix=/usr \
        --libdir=/usr/lib \
        --enable-shared \
        --enable-libx264 \
        --enable-libx265 \
        --enable-libaom \
        --enable-libtheora \
        --enable-gpl \
        --enable-version3 \
        --enable-openssl \
        --enable-libmp3lame \
        --enable-ffplay \
        --enable-libdav1d \
        --enable-libharfbuzz \
        --enable-libopus \
        --enable-libsnappy \
        --enable-libsrt \
        --enable-libssh \
        --enable-libsvtav1 \
        --enable-libvorbis \
        --enable-libwebp \
        --enable-libxml2 \
        --enable-lzma \
        --enable-libfontconfig \
        --enable-libfreetype \
        --enable-libopenjpeg \
        --enable-libspeex \
        --enable-libsoxr

  - uses: autoconf/make

  - uses: autoconf/make-install

  # non-FIPS package builds all these libraries safely. remove so sca doesn't conflict.
  - runs: |
      rm -rf ${{targets.destdir}}/usr/lib/*

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - .*dev.*
  git:
    strip-prefix: n
    tag-filter-prefix: n7.1

test:
  pipeline:
    - uses: test/tw/virtualpackage
      with:
        virtual-pkg-name: "ffmpeg-fips"
    - runs: |
        ffmpeg --help
        ffprobe --help
        ffplay --help

        # Generate and verify a 1-second, 128x128 color test video using libx264 (H.264 encoder)
        ffmpeg -f lavfi -i testsrc=duration=1:size=128x128:rate=30 \
           -c:v libx264 -pix_fmt yuv420p out.mp4
        test -f out.mp4

        # Generate and confirm a 1-second 1000Hz sine wave and encode it to MP3 using libmp3lame
        ffmpeg -f lavfi -i sine=frequency=1000:duration=1 -c:a libmp3lame test.mp3
        test -f test.mp3

        # Inspect the video file metadata
        ffprobe -v error -show_format -show_streams out.mp4
