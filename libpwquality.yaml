package:
  name: libpwquality
  version: 1.4.5
  epoch: 0
  description: Password quality checking library
  copyright:
    - license: BSD-3-Clause OR GPL-2.0-or-later

vars:
  import: pwquality

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - bash
      - build-base
      - cracklib-dev
      - libtool
      - linux-pam-dev
      - py3-supported-build-base
      - py3-supported-python-dev
      - py3-supported-setuptools

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/libpwquality/libpwquality
      tag: ${{package.name}}-${{package.version}}
      expected-commit: 5490e96a3dd6ed7371435ca5b3ccef98bdb48b5a

  - uses: autoconf/configure
    with:
      opts: |
        --enable-pam \
        --disable-python-bindings \ # Build these separately

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: "${{package.name}} headers"
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: "${{package.name}} manpages"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

  - range: py-versions
    name: py${{range.key}}-${{package.name}}
    description: python${{range.key}} version of ${{package.name}}
    pipeline:
      - working-directory: python
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{package.name}}
    description: meta package providing ${{package.name}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{package.name}}
        - py3.11-${{package.name}}
        - py3.12-${{package.name}}
        - py3.13-${{package.name}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: libpwquality/libpwquality
    strip-prefix: libpwquality-

test:
  pipeline:
    - uses: test/tw/ldd-check
