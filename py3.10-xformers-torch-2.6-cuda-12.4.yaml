package:
  name: py3.10-xformers-torch-2.6-cuda-12.4
  version: 0.0.29
  epoch: 2
  description: Toolbox to Accelerate Research on Transformers
  copyright:
    - license: BSD-3-Clause
  target-architecture:
    - x86_64
  resources:
    cpu: 16
    memory: 192Gi
  options:
    no-depends: true
  dependencies:
    runtime:
      - py${{vars.python-version}}-torch-${{vars.torch-version}}-cuda-${{vars.cuda-version}}

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.\d+$'
    replace: '$1'
    to: cuda-major-version
  - from: ${{package.name}}
    match: '^py(\d+\.\d+)-.*'
    replace: '$1'
    to: python-version
  - from: ${{package.name}}
    match: '.*-torch-(\d+\.\d+)-.*'
    replace: '$1'
    to: torch-version

vars:
  # As of 0.0.29.post1, gcc > 13 is not supported.
  # Let's use gcc-12, since we also use it to build torch.
  gcc-version: 12

environment:
  contents:
    packages:
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - gcc-${{vars.gcc-version}}
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-torch-${{vars.torch-version}}-cuda-${{vars.cuda-version}}-dev
      - samurai
  environment:
    # Should match corresponding py3.x-torch-x.x-cuda-x.x package
    TORCH_CUDA_ARCH_LIST: 5.2 6.0 6.1 7.0+PTX 7.5 8.0 8.6 8.7 8.9 9.0
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
    NVCC_APPEND_FLAGS: -ccbin gcc-${{vars.gcc-version}} --compiler-options -fdelete-null-pointer-checks
    NVCC_FLAGS: -Xfatbin -compress-all
    MAX_JOBS: 16 # Avoid OOMs on gcloud workstation

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/facebookresearch/xformers
      tag: v${{package.version}}
      expected-commit: 56be3b5e7f390072a5a0e95e5e64916916dc9cd0
      recurse-submodules: true

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

update:
  enabled: false # https://github.com/chainguard-dev/internal-dev/issues/8369
  github:
    identifier: facebookresearch/xformers
    strip-prefix: v
