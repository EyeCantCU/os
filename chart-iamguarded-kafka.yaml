package:
  name: chart-iamguarded-kafka
  version: "32.2.3"
  epoch: 1
  description: Apache Kafka iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: kafka/${{package.version}}
      expected-commit: 12ee35a7256e3f0872fbaba0c921ffd9a21d3f4a

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/kafka

  - uses: charts/package
    with:
      chart-path: iamguarded/kafka

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: kafka/
    use-tag: true
    tag-filter-prefix: kafka/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /kafka
