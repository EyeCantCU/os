package:
  name: prometheus-redis-exporter-fips
  version: 1.65.0
  epoch: 0
  description: Prometheus Exporter for Redis Metrics.
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/oliver006/redis_exporter
      tag: v${{package.version}}
      expected-commit: 7ffe57fcd7061e348b50025856e492553fe2c14e

  - uses: go/build
    with:
      packages: .
      output: redis_exporter
      go-package: go-fips
      ldflags: |
        -X main.BuildVersion=v${{package.version}}
        -X main.BuildCommitSha=$(git rev-parse HEAD)
        -X main.BuildDate=$(date +%F-%T)

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        redis_exporter --version
        redis_exporter --help

update:
  enabled: true
  github:
    identifier: oliver006/redis_exporter
    strip-prefix: v
    tag-filter: v
