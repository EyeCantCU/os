package:
  name: crossplane-function-environment-configs
  version: "0.5.0"
  epoch: 1 # CVE-2025-61724
  description: A function building the environment from EnvironmentConfigs
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/crossplane-contrib/function-environment-configs.git
      tag: v${{package.version}}
      expected-commit: 49c1ad44683fee0c077b87df8daa6bc26e465a5d

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0
        golang.org/x/oauth2@v0.27.0

  - uses: go/build
    with:
      packages: .
      output: function-environment-configs

update:
  enabled: true
  git:
    strip-prefix: v

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - name: "create compat symlink"
        runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -s /usr/bin/function-environment-configs ${{targets.subpkgdir}}/function
      # NOTE: previously, to generate this package.yaml file we would download the OCI artifact from
      # https://marketplace.upbound.io/functions/crossplane-contrib/function-environment-configs/
      - name: "craft package.yaml"
        runs: |
          dest="${{targets.subpkgdir}}/package.yaml"
          cat package/crossplane.yaml >> "$dest"
          cat package/input/environmentconfigs.fn.crossplane.io_inputs.yaml >> "$dest"
    test:
      pipeline:
        - name: "Verify the symlink"
          runs: |
            test "$(readlink /function)" = "/usr/bin/function-environment-configs"
        - name: "verify the package.yaml file"
          runs: |
            file="/package.yaml"
            # NOTE: may just need a manual update to these checks
            if ! grep -q "apiVersion: meta.pkg.crossplane.io/v1beta1" "$file" \
                || ! grep -q "kind: Function" "$file" \
                || ! grep -q "apiVersion: apiextensions.k8s.io/v1" "$file" \
                || ! grep -q "kind: CustomResourceDefinition" "$file" ; then
              echo "FAIL: the file $file doesn't have the expected content, please review by hand." >&2
              exit 1
            fi
            echo "PASS: the file $file has the expected content."

test:
  environment:
    environment:
      GRPC_PORT: 9443
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - name: Smoke tests
      runs: function-environment-configs --help | grep -F -e "A Crossplane Composition Function"
    - name: Test if endpoint works
      runs: |
        function-environment-configs -d --insecure "--address=localhost:${GRPC_PORT}" &
        DAEMON_PID=$!
        trap 'kill -9 "${DAEMON_PID}"' EXIT
        wait-for-it "localhost:${GRPC_PORT}"
        curl "localhost:${GRPC_PORT}" --http0.9 -o - | xxd | grep -F -e "0500 0040"
