package:
  name: temporal-ui-server-fips
  version: 2.29.1
  epoch: 0
  description: Golang Server for https://github.com/temporalio/ui
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/temporalio/ui-server
      tag: v${{package.version}}
      expected-commit: 4d7dad9c823366470b5d3fb583d93150341d9619

  - uses: go/build
    with:
      packages: ./cmd/server
      output: ui-server
      ldflags: -w
      go-package: go-fips
      tidy: "true"

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: temporalio/ui-server
    strip-prefix: v
    use-tag: true
    tag-filter: v
