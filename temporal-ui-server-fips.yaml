package:
  name: temporal-ui-server-fips
  version: "2.36.0"
  epoch: 0
  description: Golang Server for https://github.com/temporalio/ui
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/temporalio/ui-server
      tag: v${{package.version}}
      expected-commit: 1433a493915200418cae80a45266c3f6f3a76cf7

  - uses: go/build
    with:
      packages: ./cmd/server
      output: ui-server
      ldflags: -w
      go-package: go-fips
      tidy: "true"

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        ui-server --version
        ui-server --help

update:
  enabled: true
  github:
    identifier: temporalio/ui-server
    strip-prefix: v
    use-tag: true
    tag-filter: v
