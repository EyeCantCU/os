package:
  name: temporal-ui-server-fips
  version: "2.35.0"
  epoch: 1
  description: Golang Server for https://github.com/temporalio/ui
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/temporalio/ui-server
      tag: v${{package.version}}
      expected-commit: 1c7e2d7135ca5c662c8285a969388673a9c3f490

  - uses: go/bump
    with:
      deps: |-
        go.temporal.io/api@v1.44.1

  - uses: go/build
    with:
      packages: ./cmd/server
      output: ui-server
      ldflags: -w
      go-package: go-fips
      tidy: "true"

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        ui-server --version
        ui-server --help

update:
  enabled: true
  github:
    identifier: temporalio/ui-server
    strip-prefix: v
    use-tag: true
    tag-filter: v
