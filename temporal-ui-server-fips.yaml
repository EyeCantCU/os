package:
  name: temporal-ui-server-fips
  version: 2.26.1
  epoch: 0
  description: Golang Server for https://github.com/temporalio/ui
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/temporalio/ui-server
      tag: v${{package.version}}
      expected-commit: 0974859738b6373ada140db2eed052254322b57d

  - uses: go/build
    with:
      packages: ./cmd/server
      output: ui-server
      ldflags: -w
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: temporalio/ui-server
    strip-prefix: v
    use-tag: true
    tag-filter: v
