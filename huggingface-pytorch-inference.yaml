package:
  name: huggingface-pytorch-inference
  version: 2.6
  epoch: 0
  description: AWS Deep Learning Containers are pre-built Docker images that make it easier to run popular deep learning frameworks and tools on AWS.
  copyright:
    # EXCEPT FOR "smdistributed.dataparallel and smdistributed.modelparallel are released under the AWS Customer Agreement."
    # https://github.com/aws/deep-learning-containers?tab=License-1-ov-file
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/deep-learning-containers.git
      expected-commit: 4df2bbf33bdca62b3fd4818286acc0dab9b5496b
      branch: master

  - runs: |
      install -Dpm0755 huggingface/build_artifacts/inference/config.properties ${{targets.destdir}}/etc/sagemaker-mms.properties

update:
  enabled: true
  git: {}

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility subpackage for upstream image
    pipeline:
      - runs: |
          install -Dpm0755 huggingface/build_artifacts/inference/mms-entrypoint.py ${{targets.destdir}}/usr/local/bin/dockerd-entrypoint.py
          install -Dpm0755 -t ${{targets.destdir}}/usr/local/bin/ huggingface/build_artifacts/inference/cuda-compatibility-lib.sh
          install -Dpm0755 -t ${{targets.destdir}}/usr/local/bin/ src/deep_learning_container.py
