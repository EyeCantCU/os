package:
  name: packer
  version: 1.11.2
  epoch: 0
  copyright:
    - license: BUSL-1.1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/packer
      tag: v${{package.version}}
      expected-commit: 85d7c1a9b2f64bf673809ee356e9dc743e3ddddb

  - uses: go/build
    with:
      packages: .
      output: packer
      ldflags: -X github.com/packer/version.GitCommit=$(git rev-parse HEAD)

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for packer, upstream image puts packer at /bin/packer
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/bin/
          ln -sf /usr/bin/packer ${{targets.contextdir}}/bin/packer

update:
  enabled: true
  github:
    identifier: hashicorp/packer
    strip-prefix: v

test:
  pipeline:
    - name: verison check
      runs: |
        packer version
    - name: installing, validating and formatting
      runs: |
        cat << 'EOF' > docker-wolfi.pkr.hcl
        packer {
          required_plugins {
            docker = {
              version = ">= 1.0.8"
              source = "github.com/hashicorp/docker"
            }
          }
        }

        source "docker" "wolfi" {
          image  = "cgr.dev/chainguard/wolfi-base:latest"
          commit = true
        }

        build {
          name    = "test-packer"
          sources = [
            "source.docker.wolfi"
          ]
        }
        EOF
        packer init .
        packer validate .
        packer fmt .
        # not invoking packer build given we don't have docker available in test environment.
