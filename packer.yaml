package:
  name: packer
  version: "1.12.0"
  epoch: 33
  copyright:
    - license: BUSL-1.1
  dependencies:
    provides:
      # REMOVE_POST_USRMERGE - https://github.com/orgs/wolfi-dev/discussions/40270
      - ${{package.name}}-compat=${{package.full-version}}
    runtime:
      - merged-bin
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/packer
      tag: v${{package.version}}
      expected-commit: 754c622ca347bec460b7e98eb1bcbdea1c845e86

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v4@v4.0.5
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.28.0
        golang.org/x/net@v0.36.0

  - uses: go/build
    with:
      packages: .
      output: packer
      ldflags: -X github.com/packer/version.GitCommit=$(git rev-parse HEAD)

update:
  enabled: true
  github:
    identifier: hashicorp/packer
    strip-prefix: v

test:
  pipeline:
    - name: verison check
      runs: |
        packer version
    - name: installing, validating and formatting
      runs: |
        cat << 'EOF' > docker-wolfi.pkr.hcl
        packer {
          required_plugins {
            docker = {
              version = ">= 1.0.8"
              source = "github.com/hashicorp/docker"
            }
          }
        }

        source "docker" "wolfi" {
          image  = "cgr.dev/chainguard/wolfi-base:latest"
          commit = true
        }

        build {
          name    = "test-packer"
          sources = [
            "source.docker.wolfi"
          ]
        }
        EOF
        packer init .
        packer validate .
        packer fmt .
        # not invoking packer build given we don't have docker available in test environment.
