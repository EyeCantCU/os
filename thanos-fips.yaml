package:
  name: thanos-fips
  version: 0.35.1
  epoch: 4
  description: Highly available Prometheus setup with long term storage capabilities.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 086a698b2195adb6f3463ebbd032e780f39d2050
      repository: https://github.com/thanos-io/thanos
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.23.0 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/thanos
      output: thanos
      ldflags: >
        -X main.version=$(git describe --abbrev=0 --always) -X main.buildDate=$(date +%FT%T%z) -X main.commit=$(git rev-parse HEAD) -X main.Branch=$(git describe --always --contains --all)


update:
  enabled: true
  ignore-regex-patterns:
    - rc*
  github:
    identifier: thanos-io/thanos
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: thanos --version
