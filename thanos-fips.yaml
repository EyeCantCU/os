package:
  name: thanos-fips
  version: "0.38.0"
  epoch: 5
  description: Highly available Prometheus setup with long term storage capabilities.
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0439da0dd291735c36bb515c03e9dfa0012c76c9
      repository: https://github.com/thanos-io/thanos
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        github.com/golang-jwt/jwt/v5@v5.2.2
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      go-package: go-fips-md5
      packages: ./cmd/thanos
      output: thanos
      ldflags: >
        -X main.version=$(git describe --abbrev=0 --always) -X main.buildDate=$(date +%FT%T%z) -X main.commit=$(git rev-parse HEAD) -X main.Branch=$(git describe --always --contains --all)


subpackages:
  - name: ${{package.name}}-iamguarded-compat
    description: "compat package for iamguarded"
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p /opt/iamguarded/thanos/bin/
          ln -sf /usr/bin/thanos /opt/iamguarded/thanos/bin/thanos
      - uses: iamguarded/build-compat
        with:
          package: thanos
          version: ${{vars.major-version}}
      - uses: iamguarded/finalize-compat
        with:
          package: thanos
          version: ${{vars.major-version}}
    test:
      pipeline:
        - runs: |
            stat /opt/iamguarded/thanos/bin/thanos
            /opt/iamguarded/thanos/bin/thanos --version
        - uses: iamguarded/test-compat
          with:
            package: thanos
            version: ${{vars.major-version}}

update:
  enabled: true
  ignore-regex-patterns:
    - rc*
  github:
    identifier: thanos-io/thanos
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        thanos --help
    - runs: thanos --version
