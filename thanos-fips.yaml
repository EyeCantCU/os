package:
  name: thanos-fips
  version: 0.37.1
  epoch: 0
  description: Highly available Prometheus setup with long term storage capabilities.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e0812e2f46f81af3324686d910d885d8f2751d46
      repository: https://github.com/thanos-io/thanos
      tag: v${{package.version}}

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/thanos
      output: thanos
      ldflags: >
        -X main.version=$(git describe --abbrev=0 --always) -X main.buildDate=$(date +%FT%T%z) -X main.commit=$(git rev-parse HEAD) -X main.Branch=$(git describe --always --contains --all)


update:
  enabled: true
  ignore-regex-patterns:
    - rc*
  github:
    identifier: thanos-io/thanos
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        thanos --help
    - runs: thanos --version
