package:
  name: autogen
  version: 5.18.16
  epoch: 2
  description: An automated text file generator
  copyright:
    - license: GPL-3.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash-binsh
      - build-base
      - busybox
      - coreutils
      - file
      - gettext
      - gmp-dev
      - guile-dev
      - libtool
      - libxml2-dev
      - m4
      - pcre-dev

pipeline:
  - uses: fetch
    with:
      uri: https://ftp.gnu.org/gnu/autogen/rel${{package.version}}/autogen-${{package.version}}.tar.gz
      expected-sha256: e23c5bbd0ac83079ae2ef6eb3fd1948fecce718ac853025607a3ab0395538406

  - uses: patch
    with:
      patches: autogen-guile-3.0.patch

  - runs: autoreconf -fiv

  - uses: autoconf/configure
    with:
      # It's broken, and useless for one-time builds according to GNU docs.
      opts: --disable-dependency-tracking

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: "${{package.name}}-libopts"
    description: "${{package.name}} libopts library"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/
          mv ${{targets.destdir}}/usr/lib/libopts* ${{targets.subpkgdir}}/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: "${{package.name}}-doc"
    description: "${{package.name}} documentation"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

  - name: "${{package.name}}-dev"
    description: "${{package.name}} development files"
    pipeline:
      - uses: split/dev
      - runs: |
          mv ${{targets.subpkgdir}}/usr/bin/autoopts-config ${{targets.destdir}}/usr/bin/
          rmdir ${{targets.subpkgdir}}/usr/bin
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/pkgconf

update:
  enabled: true
  release-monitor:
    identifier: 143

test:
  pipeline:
    - runs: |
        test -x $(which autogen)
        columns --help
        test -x $(which getdefs)
    - uses: test/tw/ldd-check
