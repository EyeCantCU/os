package:
  name: linky-user
  version: 1
  epoch: 0
  description: create a user named linky that can sudo and prohibit root login
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - shadow

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      # Create user & group records
      mkdir -p ${{targets.contextdir}}/usr/lib/sysusers.d/
      cat <<EOF >${{targets.contextdir}}/usr/lib/sysusers.d/${{package.name}}.conf
      u linky 1000 linky /home/linky /bin/sh
      EOF

      # Unlock the account to allow ssh access, as sysusers.d accounts are locked by default
      mkdir -p ${{targets.contextdir}}/usr/lib/systemd/system/systemd-sysusers.service.d/
      cat <<EOF >${{targets.contextdir}}/usr/lib/systemd/system/systemd-sysusers.service.d/${{package.name}}.conf
      [Service]
      ExecStartPost=-passwd -u linky
      EOF

      # Add to sudoers, similar to how aws-ssm-agent does it
      mkdir -p ${{targets.contextdir}}/etc/sudoers.d/
      cat <<EOF >${{targets.contextdir}}/etc/sudoers.d/${{package.name}}
      linky ALL=(ALL) NOPASSWD:ALL
      EOF

      # Create home directory
      mkdir -p ${{targets.contextdir}}/usr/lib/tmpfiles.d/
      cat <<EOF >${{targets.contextdir}}/usr/lib/tmpfiles.d/${{package.name}}.conf
      d /home/linky 0750 linky linky - -
      EOF

      # Block root login
      mkdir -p ${{targets.contextdir}}/etc/ssh/sshd_config.d
      cat <<EOF >${{targets.contextdir}}/etc/ssh/sshd_config.d/${{package.name}}.conf
      PermitRootLogin no
      EOF

update:
  enabled: false
  exclude-reason: |
    This package is a config only package to satisfy AWS criteria
