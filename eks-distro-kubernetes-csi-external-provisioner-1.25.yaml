package:
  name: eks-distro-kubernetes-csi-external-provisioner-1.25
  version: 4.0.0 # eks-distro v1-25-eks-33: https://github.com/aws/eks-distro/releases/tag/v1-25-eks-33
  epoch: 0
  description: Sidecar container that watches Kubernetes PersistentVolumeClaim objects and triggers CreateVolume/DeleteVolume against a CSI endpoint
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - eks-distro-kubernetes-csi-external-provisioner=${{package.full-version}}

vars:
  eks-project: kubernetes-csi/external-provisioner
  eks-package-version: 1-25-eks-33

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.(\d+)\.(\d+)$
    replace: $1-$2-eks-$3
    to: eks-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-distro
      tag: v${{vars.eks-package-version}}
      expected-commit: 7216b0d9bf84d690f18587ddc8777d1aacd03795

  - uses: eks-distro/build
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}

  - uses: eks-distro/install
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      binary-target: csi-provisioner

  - uses: strip

update:
  manual: true
