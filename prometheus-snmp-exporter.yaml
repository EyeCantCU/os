package:
  name: prometheus-snmp-exporter
  version: "0.30.0"
  epoch: 0 # GHSA-j5w8-q4qc-rx2x
  description: SNMP Exporter for Prometheus
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - curl
      - go
      - make

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/snmp_exporter
      expected-commit: 6a8e26642d5add0f4ed3eef5da99debe069a82a1
      tag: v${{package.version}}

  - runs: |
      make common-build

  - runs: |
      sed -i '/_ "net\/http\/pprof"/d' main.go
      git diff

  - runs: |
      install -Dpm0755 -t "${{targets.contextdir}}"/usr/bin/ snmp_exporter
      install -Dpm0644 -t "${{targets.contextdir}}"/etc/snmp_exporter/ snmp.yml

  - uses: strip

update:
  enabled: true
  github:
    identifier: prometheus/snmp_exporter
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - wait-for-it
        - curl
  pipeline:
    - name: "Start server and test endpoint with error checking"
      uses: test/daemon-check-output
      with:
        start: snmp_exporter --config.file=/etc/snmp_exporter/snmp.yml --web.listen-address=:9116
        timeout: "10"
        expected_output: |
          Listening on" address
          TLS is disabled
        error_strings: |
          ERROR
        post: |
          curl -s http://localhost:9116/metrics | grep snmp_exporter_build_info
