package:
  name: perl-bit-vector
  version: "7.4"
  epoch: 0
  description: Efficient bit vector, set of integers, and big int math library
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-carp-clan

environment:
  contents:
    packages:
      - build-base
      - perl-carp-clan
      - perl-dev

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/S/ST/STBEY/Bit-Vector-${{package.version}}.tar.gz
      expected-sha256: 3c6daa671fecfbc35f92a9385b563d65f50dfc6bdc8b4805f9ef46c0d035a926

  - uses: patch
    with:
      patches: gcc-15.patch

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 2668

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Smoke test
      runs: |
        set -euo pipefail
        perl <<'EOF'
        use Bit::Vector;
        # Test bit operations
        my $v = Bit::Vector->new(10);
        $v->Bit_On(5);
        die "Bit operations failed" unless $v->bit_test(5);
        # Test set operations
        my $a = Bit::Vector->new(8);
        my $b = Bit::Vector->new(8);
        $a->Bit_On(2);
        $b->Bit_On(2);
        my $union = $a->Clone();
        $union->Union($a, $b);
        die "Set operations failed" unless $union->bit_test(2);
        # Test big integer math
        my $x = Bit::Vector->new(32);
        $x->from_Dec("42");
        die "Big integer math failed" unless $x->to_Dec() eq "42";
        print "Bit::Vector functional tests passed\n";
        EOF
