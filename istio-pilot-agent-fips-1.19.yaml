package:
  name: istio-pilot-agent-fips-1.19
  version: 1.19.10
  epoch: 1
  description: Nanny binary for Istio Envoy
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - istio-pilot-agent-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/istio/istio
      tag: ${{package.version}}
      expected-commit: 745cdaa0dfdbeb31393fed75028a8c629c0f3a36

  - uses: go/bump
    with:
      deps: github.com/lestrrat-go/jwx@v1.2.29 google.golang.org/protobuf@v1.33.0 github.com/go-jose/go-jose/v3@v3.0.3 github.com/docker/docker@v24.0.9

  - uses: go/build
    with:
      packages: ./pilot/cmd/pilot-agent
      output: pilot-agent
      go-package: go-fips

  - runs: |
      mkdir -p ${{targets.destdir}}/var/lib/istio/envoy
      cp ./tools/packaging/common/envoy_bootstrap.json \
        ${{targets.destdir}}/var/lib/istio/envoy/envoy_bootstrap_tmpl.json
      cp ./tools/packaging/common/gcp_envoy_bootstrap.json \
        ${{targets.destdir}}/var/lib/istio/envoy/gcp_envoy_bootstrap_tmpl.json

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          # link /usr/local/bin/pilot-agent -> /usr/bin/pilot-agent to match
          # what the Istio Helm charts may expect.
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -sf /usr/bin/pilot-agent ${{targets.subpkgdir}}/usr/local/bin/pilot-agent
    dependencies:
      provides:
        - istio-pilot-agent-fips-compat=${{package.full-version}}

update:
  enabled: true
  github:
    identifier: istio/istio
    tag-filter: 1.19.
    use-tag: true
