package:
  name: gpu-operator-24.9
  version: "24.9.2"
  epoch: 3
  description: NVIDIA GPU Operator creates/configures/manages GPUs atop Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - gpu-operator=${{package.full-version}}
    runtime:
      - busybox
      - kubectl
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - nvidia-cuda-nvml-dev-${{vars.cuda-version}}
      - nvidia-cuda-profiler-api-${{vars.cuda-version}}
      - nvidia-cudnn-8-cuda-12
      - nvidia-nccl-cuda-${{vars.cuda-version}}

vars:
  # Based on the base image used in upstream dockerfile: https://github.com/NVIDIA/gpu-operator/blob/main/docker/Dockerfile#L17
  cuda-version: 12.6

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/gpu-operator
      tag: v${{package.version}}
      expected-commit: a7551902048c92e8f8166cf2dd27c7ac22a073bc

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.36.0
      modroot: .

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/gpu-operator
      output: gpu-operator
      ldflags: -X github.com/NVIDIA/gpu-operator/internal/info.gitCommit=$(git rev-list -1 HEAD) -X github.com/NVIDIA/gpu-operator/internal/info.version=v${{package.version}}
      vendor: true

  - runs: |
      mkdir -p ${{targets.destdir}}/opt/${{package.name}}
      mkdir -p ${{targets.destdir}}/opt/${{package.name}}/manifests
      mkdir -p ${{targets.destdir}}/licenses

      cp -r ./assets/* ${{targets.destdir}}/opt/${{package.name}}
      cp -r ./manifests/* ${{targets.destdir}}/opt/${{package.name}}/manifests
      cp hack/must-gather.sh ${{targets.destdir}}/usr/bin/gather

      cp deployments/gpu-operator/crds/nvidia.com_clusterpolicies.yaml ${{targets.destdir}}/opt/${{package.name}}/nvidia.com_clusterpolicies.yaml
      cp deployments/gpu-operator/charts/node-feature-discovery/crds/nfd-api-crds.yaml ${{targets.destdir}}/opt/${{package.name}}/nfd-api-crds.yaml
      cp deployments/gpu-operator/crds/nvidia.com_nvidiadrivers.yaml ${{targets.destdir}}/opt/${{package.name}}/nvidia.com_nvidiadrivers.yaml

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - name: "Match CUDA version"
      runs: |
        line=$(curl -sL https://raw.githubusercontent.com/NVIDIA/gpu-operator/refs/tags/v${{package.version}}/docker/Dockerfile | grep '^FROM .*cuda:')
        cuda_mm_version=$(echo "$line" | head -n1 | sed -E 's/.*cuda:([0-9]+\.[0-9]+).*/\1/')

        if [ "$cuda_mm_version" != "${{vars.cuda-version}}" ]; then
          echo "CUDA version mismatch!"
          exit 1
        fi
    - runs: |
        gpu-operator --help
    - uses: test/kwok/cluster
    - uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /opt/gpu-operator/manifests/state-driver
          echo "{}" > /opt/gpu-operator/manifests/state-driver/dummy.yaml
        start: /usr/bin/gpu-operator
        timeout: 30
        expected_output: |
          starting manager
          Starting metrics server
          starting server
          Serving metrics server
        post: |
            wait-for-it -t 10 --strict localhost:8081 -- echo "Server is up"
            curl -ksfL http://localhost:8081/healthz

update:
  enabled: true
  github:
    identifier: NVIDIA/gpu-operator
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v24.9.
