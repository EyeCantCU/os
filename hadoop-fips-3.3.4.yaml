#nolint:valid-pipeline-git-checkout-tag
package:
  name: hadoop-fips-3.3.4
  version: 3.3.4
  epoch: 1
  description: Open Source NoSQL Database
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - bzip2
      - coreutils
      - gawk
      - grep
      - openssl
      - python-${{vars.py-version}}
      - sed
      - zlib
      - zstd
    provides:
      - hadoop-fips=${{package.full-version}}

vars:
  py-version: '3.11'
  java-version: '8'
  test-java-version: '11'

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - bzip2
      - cmake
      - doxygen
      - jq
      - libprotobuf
      - maven
      - nodejs
      - npm
      - nvm
      - openjdk-${{vars.java-version}}-default-jdk
      - openssl-dev
      - protobuf-c-compiler
      - protobuf-c-dev
      - py${{vars.py-version}}-google-cloud-sdk
      - python-${{vars.py-version}}
      - snappy-dev
      - yarn
      - zlib-dev
      - zstd

pipeline:
  - uses: ecosystems/auth
    with:
      repo: chainguard-dev/ecosystems-hadoop

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/ecosystems-hadoop.git
      expected-commit: 9321bea500c6ced1ba8de5ec4deed72cf0169f75
      branch: fips-${{package.version}}

  - uses: maven/pombump

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/share/java/hadoop

      # The version of nodejs in the hadoop-project/pom.xml is 12.22.1 which is older than the recommended version >14.17.0
      sed -i "s#<nodejs.version>v[0-9]\+\.[0-9]\+\.[0-9]\+</nodejs.version>#<nodejs.version>$(node --version)</nodejs.version>#" hadoop-project/pom.xml

      # Override any existing paths set for the local maven repository
      mvn clean install -Dmaven.repo.local=./.m2/repository -Pdist -DskipTests -Dtar -Dmaven.javadoc.skip=true
      tar --strip-components 1 -C "${{targets.destdir}}"/usr/share/java/hadoop -xzf hadoop-dist/target/hadoop-${{package.version}}-cg0.tar.gz

      mkdir -p "${{targets.destdir}}"/usr/bin/

      for f in /home/build/hadoop-dist/target/hadoop-${{package.version}}-cg0/bin/*; do
        filename=$(basename "$f")
        ln -s  /usr/share/java/hadoop/bin/"$filename" "${{targets.destdir}}"/usr/bin/"$filename"
      done

subpackages:
  - name: ${{package.name}}-dev
    description: Development files for ${{package.name}}
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}

  - name: ${{package.name}}-compat
    description: Compatibility package for ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/opt
          ln -s /usr/share/java/hadoop ${{targets.contextdir}}/opt/hadoop
    dependencies:
      runtime:
        - ${{package.name}}

  - name: ${{package.name}}-m2
    description: Maven repository for ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/m2/repository
          cp -av ./.m2/repository/* ${{targets.contextdir}}/usr/share/m2/repository/

test:
  environment:
    contents:
      packages:
        - bcfips-policy-140-3-j${{vars.test-java-version}}
        - openjdk-${{vars.test-java-version}}-default-jdk
    environment:
      LANG: C.UTF-8
      JAVA_HOME: /usr/lib/jvm/default-jvm
      HADOOP_HOME: /usr/share/java/hadoop
      HADOOP_CONF_DIR: /usr/share/java/hadoop/etc/hadoop
      JDK_JAVA_OPTIONS: "-Djavax.net.ssl.trustStoreType=FIPS --module-path=/usr/share/java/bouncycastle-fips -Djavax.net.ssl.trustStoreType=FIPS -Djava.security.properties=/usr/lib/jvm/default-jvm/conf/security/java.security -Dorg.bouncycastle.fips.approved.only=true --add-exports=java.base/sun.security.internal.spec=ALL-UNNAMED --add-exports=java.base/sun.security.provider=ALL-UNNAMED"
  pipeline:
    - runs: hadoop version | grep -q ${{package.version}}
    - runs: hdfs version | grep -q ${{package.version}}
    - name: Create test directory
      runs: |
        hdfs dfs -mkdir /test-dir
        stat /test-dir
    - name: Start single node
      runs: |
        ## Ensure the user environment is properly configured
        mkdir input
        cp /usr/share/java/hadoop/etc/hadoop/*.xml input
        hadoop jar /usr/share/java/hadoop/share/hadoop/mapreduce/hadoop-mapreduce-examples-${{package.version}}-cg0.jar grep -Dmapreduce.shuffle-key-length=112 input output 'dfs[a-z.]+'
        cat output/* | grep "dfsadmin"
    - name: test
      runs: |
        hadoop jar /usr/share/java/hadoop/share/hadoop/mapreduce/hadoop-mapreduce-examples-${{package.version}}-cg0.jar pi -Dmapreduce.shuffle-key-length=112 10 100 | grep "3.14800000000000000000"
    - uses: test/ldd-check
      with:
        packages: ${{package.name}}

update:
  enabled: false
  manual: true
