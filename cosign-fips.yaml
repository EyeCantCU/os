package:
    name: cosign-fips
    version: 2.2.3
    epoch: 0
    description: Container Signing
    copyright:
        - license: Apache-2.0
    dependencies:
        runtime:
            - ca-certificates-bundle
environment:
    contents:
        packages:
            - busybox
            - ca-certificates-bundle
    environment:
        CGO_ENABLED: "1"
pipeline:
    - uses: fetch
      with:
        uri: https://github.com/sigstore/cosign/archive/v${{package.version}}/cosign-v${{package.version}}.tar.gz
        expected-sha256: 2135a2e3c40c570dc99d5784e5482ab2df903136e48fa63d4a55ade3707cad09
    - uses: go/build
      with:
        packages: ./cmd/cosign
        output: cosign
        ldflags: -w -X sigs.k8s.io/release-utils/version.gitVersion=${{package.version}}
        go-package: go-fips
    - uses: strip
update:
    enabled: true
    github:
        identifier: sigstore/cosign
        strip-prefix: v
