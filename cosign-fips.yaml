package:
  name: cosign-fips
  version: 2.4.0
  epoch: 2
  description: Container Signing
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
  environment:
    CGO_ENABLED: "1"

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/sigstore/cosign/archive/v${{package.version}}/cosign-v${{package.version}}.tar.gz
      expected-sha256: 814acc7f9184753ace5cef5fed11e88b0cbe5dff27270f5e6e5d03e87ff404b6

  - uses: go/bump
    with:
      deps: github.com/sigstore/sigstore-go@v0.6.1
      replaces: github.com/docker/docker=github.com/docker/docker@v26.1.5+incompatible

  - uses: go/build
    with:
      packages: ./cmd/cosign
      output: cosign
      ldflags: -w -X sigs.k8s.io/release-utils/version.gitVersion=${{package.version}}
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: sigstore/cosign
    strip-prefix: v
