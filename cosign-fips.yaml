package:
  name: cosign-fips
  version: "3.0.2"
  epoch: 2 # GHSA-j5w8-q4qc-rx2x
  description: Container Signing
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
  environment:
    CGO_ENABLED: "1"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 84449696f0658a5ef5f2abba87fdd3f8b17ca1be
      repository: https://github.com/sigstore/cosign
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: test/fakeoidc

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: ./cmd/cosign
      output: cosign
      ldflags: |
        -X sigs.k8s.io/release-utils/version.gitVersion=v${{package.version}}
        -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/release-utils/version.gitTreeState=$(git diff --quiet && echo clean || echo dirty)
        -X sigs.k8s.io/release-utils/version.buildDate=$(date -d@${SOURCE_DATE_EPOCH} -u "+%Y-%m-%dT%H:%M:%SZ")
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: sigstore/cosign
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - name: Verify Cosign installation
      runs: |
        cosign version | grep ${{package.version}} || exit 1
        cosign --help
    - name: Get an attestation and test
      runs: |
        cosign download attestation --platform=linux/amd64 \
        --predicate-type=https://spdx.dev/Document \
        chainguard/curl | jq -r .payload | base64 -d | jq .predicate
    - uses: test/go-fips-check
