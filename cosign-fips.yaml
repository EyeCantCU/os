package:
  name: cosign-fips
  version: 2.3.0
  epoch: 0
  description: Container Signing
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
  environment:
    CGO_ENABLED: "1"

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/sigstore/cosign/archive/v${{package.version}}/cosign-v${{package.version}}.tar.gz
      expected-sha256: 3c32cab29e3c90f17b11ac428d5290c59cd226c78136721e6e4899569a357480

  - uses: go/build
    with:
      packages: ./cmd/cosign
      output: cosign
      ldflags: -w -X sigs.k8s.io/release-utils/version.gitVersion=${{package.version}}
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: sigstore/cosign
    strip-prefix: v
