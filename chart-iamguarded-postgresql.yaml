package:
  name: chart-iamguarded-postgresql
  version: "17.0.1"
  epoch: 0
  description: PostgreSQL iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: postgresql/${{package.version}}
      expected-commit: 0a101909ce511465df195263fda978dfae973ebc

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/postgresql

  - uses: charts/package
    with:
      chart-path: iamguarded/postgresql

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: postgresql/
    use-tag: true
    tag-filter-prefix: postgresql/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /postgresql
