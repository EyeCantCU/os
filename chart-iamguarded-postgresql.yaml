package:
  name: chart-iamguarded-postgresql
  version: "16.7.2"
  epoch: 0
  description: PostgreSQL iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: ecosystems/auth
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: postgresql/${{package.version}}
      expected-commit: 6fa611bcc3611666ac322d421ed6c2a0eb10646c

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/postgresql

  - uses: charts/package
    with:
      chart-path: iamguarded/postgresql

update:
  enabled: false
  manual: true
  schedule:
    period: daily
    reason: Update automation doesn't yet support automating from private repos.
  git:

test:
  pipeline:
    - uses: ecosystems/auth
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: postgresql
