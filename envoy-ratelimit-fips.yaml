package:
  name: envoy-ratelimit-fips
  version: 1.4.0
  epoch: 0
  description: Go/gRPC service designed to enable generic rate limit scenarios from different types of applications.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/envoyproxy/ratelimit
      tag: v${{package.version}}
      expected-commit: 0dd5b8bf85d6f9d4976c4b4ae512310a6bf700b1

  - uses: go/bump
    with:
      deps: golang.org/x/crypto@v0.17.0 golang.org/x/net@v0.17.0 google.golang.org/grpc@v1.56.3 gopkg.in/yaml.v2@v2.2.8
      go-version: "1.21"

  - uses: go/build
    with:
      modroot: .
      output: ratelimit
      packages: ./src/service_cmd
      go-package: go-fips

subpackages:
  - name: envoy-ratelimit-fips-compat
    pipeline:
      - runs: |
          # The helm chart expects the ratelimit binary to be in /bin instead of /usr/bin
          mkdir -p "${{targets.subpkgdir}}"/bin
          ln -sf /usr/bin/ratelimit ${{targets.subpkgdir}}/bin/ratelimit
    description: Compatibility package to place binaries in the location expected by upstream helm charts

update:
  enabled: true
  github:
    identifier: envoyproxy/ratelimit
    strip-prefix: v
