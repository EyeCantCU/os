#nolint:valid-pipeline-git-checkout-tag
package:
  name: envoy-ratelimit-fips
  # This project doesn't do releases and everything is commit based.
  # This corresponds to commit 26f28d78ccafaefe120cb698279ab2e8c4fc2c4f
  version: "0.0.0_git20250721"
  epoch: 0
  description: Go/gRPC service designed to enable generic rate limit scenarios from different types of applications.
  copyright:
    - license: Apache-2.0
  dependencies:
    # REMOVE_POST_USRMERGE - https://github.com/orgs/wolfi-dev/discussions/40270
    provides:
      - envoy-ratelimit-fips-compat=${{package.full-version}}
    runtime:
      - merged-bin
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a90e0e5dee04c88aab97df2b0e1093bdceaa3e4a
      repository: https://github.com/envoyproxy/ratelimit
      depth: -1
      branch: main

  - uses: go/build
    with:
      output: ratelimit
      packages: ./src/service_cmd
      go-package: go-fips

test:
  environment:
    contents:
      packages:
        - redis
        - wait-for-it
        - curl
  pipeline:
    - uses: test/go-fips-check
    - name: "Test Redis and ratelimit"
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /var/run/nutcracker
          redis-server redis.conf
          wait-for-it -t 10 --strict localhost:8125 -- echo "Redis is up"
        start: ratelimit -config_dir=configs
        timeout: "10"
        expected_output: |
          Listening for gRPC
          Listening for HTTP
        post: |
          wait-for-it -t 10 --strict localhost:8080 -- echo "HTTP is up"
          wait-for-it -t 10 --strict localhost:8081 -- echo "gRPC is up"
          curl -sf http://localhost:8080/healthcheck | grep -qi "OK"

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: This project doesn't do releases and everything is commit based
