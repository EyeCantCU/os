package:
  name: step-kms-plugin-fips
  version: 0.11.7
  epoch: 0
  description: step plugin to manage keys and certificates on a cloud KMSs and HSMs
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/smallstep/step-kms-plugin
      tag: v${{package.version}}
      expected-commit: 358603dbf14a2be0d1f98dbf8873bc39d8f5bcaf

  - uses: go/build
    with:
      modroot: ./cmd
      packages: .
      output: step-kms-plugin
      ldflags: -X 'main.Version=${{package.version}}'
      tags: fips,noyubikey
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: smallstep/step-kms-plugin
    strip-prefix: v
