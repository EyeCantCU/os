package:
  name: py3.8-wheel
  version: 0.44.0
  epoch: 0
  description: "built-package format for Python"
  copyright:
    - license: MIT
  options:
    no-provides: true
  dependencies:
    runtime:
      - py3.8-installer
      - python-3.8

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3.8-flit-core
      - py3.8-gpep517
      - python-3.8
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/wheel
      tag: ${{package.version}}
      expected-commit: 7bb46d7727e6e89fe56b3c78297b3af2672bbbe2

  - runs: |
      python3.8 -m gpep517 build-wheel --wheel-dir dist --output-fd 1
      python3.8 -m installer -d "${{targets.destdir}}" dist/wheel-${{package.version}}-py3-none-any.whl

  - uses: strip

update:
  enabled: true
  github:
    identifier: pypa/wheel
    use-tag: true

test:
  pipeline:
    - runs: |
        wheel version
        wheel --help
