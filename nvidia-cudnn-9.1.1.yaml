package:
  name: nvidia-cudnn-9.1.1
  version: 9.1.1.17
  epoch: 2
  description: CUDA Deep Neural Network Libraries
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-cudnn=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-sbsa/cudnn-linux-sbsa-${{package.version}}_cuda12-archive.tar.xz"
          expected-sha256: "19bd66ee9fb30348f18801a398d0bec98b4663866efa244ca122825b3429526c"
          timeout: 120
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-${{package.version}}_cuda12-archive.tar.xz"
          expected-sha256: "992b4be26899cc4c618bb1f6989261df7d0a9f9032b2217bf1fce9dd3228c904"
          timeout: 120

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cudnn/
      mv include ${{targets.destdir}}/usr/local/cudnn/
      mv lib ${{targets.destdir}}/usr/local/cudnn/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cudnn/${{package.name}}.LICENSE

subpackages:
  - name: nvidia-cudnn-9.1.1-cuda-12.4
    description: configures cudnn-8.9.0 with cuda-12.4
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/cuda/lib64
          mkdir -p ${{targets.subpkgdir}}/usr/local/cuda/include
          for f in ${{targets.destdir}}/usr/local/cudnn/lib64/*; do
            ln -sf /usr/local/cudnn/lib64/$(basename $f) ${{targets.subpkgdir}}/usr/local/cuda/lib64/$(basename $f)
          done
          for f in ${{targets.destdir}}/usr/local/cudnn/include/*; do
            ln -sf /usr/local/cudnn/include/$(basename $f) ${{targets.subpkgdir}}/usr/local/cuda/include/$(basename $f)
          done

update:
  enabled: false

test:
  environment:
    contents:
      packages:
        - wolfi-base
        - nvidia-cudnn-9.1.1-cuda-12.4
  pipeline:
    - runs: |
        # Make sure they're symlinked into the right place for the cuda-12.4 subpackage.
        stat /usr/local/cuda/include/cudnn.h
        stat /usr/local/cuda/lib64/libcudnn.so
