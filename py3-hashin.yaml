#nolint:valid-pipeline-git-checkout-tag
package:
  name: py3-hashin
  version: 1.0.1
  epoch: 0
  description: "Helps you write your requirements.txt with hashes so you can install with pip install --require-hashes -r ..."
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python3
      - py3-pip

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - build-base
      - py3-pip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/peterbe/hashin.git
      tag: ${{package.version}}
      expected-commit: 808a2fc3713011c544496d58403b6a572e160dff

  - runs: |
      pip install . --prefix=/usr --root=${{targets.destdir}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: peterbe/hashin
