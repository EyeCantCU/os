package:
  name: request-1279
  version: 1.14.0
  epoch: 2
  description: The Kubernetes operator for K8ssandra with cusomizations
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/k8ssandra/k8ssandra-operator
      tag: v${{package.version}}
      expected-commit: ac9e5f19eb2c22bd6cf91a0f6411f2da6c6fd682

  # remove_cron_test.patch needs to be last in the list as it patches some of the same files as the other patches and will fail if applied first
  - uses: patch
    with:
      patches: reconcile.patch reconcile_test.patch medusa_reconciler.patch medusa_reconciler_test.patch remove_cron.patch

  - uses: go/bump
    with:
      deps: google.golang.org/grpc@v1.56.3 google.golang.org/protobuf@v1.33.0 golang.org/x/net@v0.23.0
      replaces: golang.org/x/net=golang.org/x/net@v0.23.0

  - uses: go/build
    with:
      packages: .
      output: manager
      go-package: go-fips

  - uses: strip

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/manager ${{targets.subpkgdir}}/manager

update:
  enabled: true
  github:
    identifier: k8ssandra/k8ssandra-operator
    strip-prefix: v
