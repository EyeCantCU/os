package:
  name: request-1279
  version: 1.19.0
  epoch: 1
  description: The Kubernetes operator for K8ssandra with cusomizations
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/k8ssandra/k8ssandra-operator
      tag: v${{package.version}}
      expected-commit: 75250860563acdb7f70c114f7ea8e6ed8d9aaeef

  # This is NOT a patch for CVE remediation. This is a once-off custom package and patches. Do not remove this as part of triaging CVE / build failures
  - uses: patch
    with:
      patches: reconcile.patch reconcile_test.patch

  - uses: go/build
    with:
      packages: .
      output: manager
      go-package: go-fips

  - uses: strip

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/manager ${{targets.subpkgdir}}/manager

update:
  enabled: true
  github:
    identifier: k8ssandra/k8ssandra-operator
    strip-prefix: v
