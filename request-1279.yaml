package:
  name: request-1279
  version: 1.13.0
  epoch: 0
  description: The Kubernetes operator for K8ssandra with cusomizations
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - wolfi-baselayout
      - busybox
      - build-base
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/k8ssandra/k8ssandra-operator
      tag: v${{package.version}}
      expected-commit: 6ad0ed0d8316d7353fd75c7f64460defb3b9bd7c

  - uses: patch
    with:
      patches: reconcile.patch reconcile_test.patch medusa_reconciler.patch medusa_reconciler_test.patch

  - uses: go/build
    with:
      packages: .
      output: manager
      # CVE-2023-3978, CVE-2023-39325 and CVE-2023-44487
      deps: golang.org/x/net@v0.17.0 google.golang.org/grpc@v1.58.3
      go-package: go-fips

  - uses: strip

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/manager ${{targets.subpkgdir}}/manager

update:
  enabled: true
  github:
    identifier: k8ssandra/k8ssandra-operator
    strip-prefix: v
