package:
  name: py3.9-hatchling
  version: 1.26.3
  epoch: 0
  description: "Modern, extensible Python build backend"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - py3.9-packaging
      - py3.9-pathspec
      - py3.9-pluggy
      - py3.9-tomli
      - py3.9-trove-classifiers
      - python-3.9

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3.9-build
      - py3.9-installer
      - py3.9-packaging
      - py3.9-pathspec
      - py3.9-pluggy
      - py3.9-pip
      - py3.9-tomli
      - py3.9-trove-classifiers
      - py3.9-wheel
      - python-3.9
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6bc4bbeff1be8226958874e43698f5bf3b8ea339
      repository: https://github.com/pypa/hatch
      tag: hatchling-v${{package.version}}

  - runs: |
      cd backend
      export SOURCE_DATE_EPOCH=315532800
      mkdir -p dist
      python3.9 -m pip wheel -w dist --no-index --no-build-isolation --no-deps .
      python3.9 -m pip install --no-index --no-build-isolation --no-deps \
        --force-reinstall --no-compile --prefix=/usr --root=${{targets.contextdir}} dist/*.whl

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: hatchling
      runs: |
        hatchling --help

update:
  enabled: true
  github:
    identifier: pypa/hatch
    strip-prefix: hatchling-v
    tag-filter: hatchling-v
