package:
  name: py3-peft-cuda-12.9
  version: "0.16.0"
  epoch: 0
  description: State-of-the-art Parameter-Efficient Fine-Tuning (PEFT) methods
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: peft
  import: peft

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/huggingface/peft
      tag: v${{package.version}}
      expected-commit: 45996a1d6e00b0951424a210d24aa4058c7b0dcf

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-accelerate-cuda-${{vars.cuda-version}}
        - py${{range.key}}-huggingface-hub
        - py${{range.key}}-numpy
        - py${{range.key}}-packaging
        - py${{range.key}}-pyyaml
        - py${{range.key}}-safetensors
        - py${{range.key}}-tqdm
        - py${{range.key}}-transformers
        - py${{range.key}}-torch-cuda-${{vars.cuda-version}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.11-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.12-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.13-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: huggingface/peft
    strip-prefix: v
