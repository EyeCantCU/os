package:
  name: rekor-fips
  version: "1.4.3"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: Software Supply Chain Transparency Log
  copyright:
    - license: Apache-2.0
      paths:
        - "*"
  checks:
    disabled:
      - empty

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sigstore/rekor
      tag: v${{package.version}}
      expected-commit: cb5b1d5f364a8437e1c6c857b200283e2dcc2b29

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: hack/tools

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

subpackages:
  - name: ${{package.name}}-server
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: ./cmd/rekor-server
          output: rekor-server
          ldflags: -w
          go-package: go-fips
      - uses: strip
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: ${{subpkg.name}}

  - name: ${{package.name}}-cli
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: ./cmd/rekor-cli
          output: rekor-cli
          ldflags: -w
          go-package: go-fips
      - uses: strip
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: ${{subpkg.name}}

  - name: ${{package.name}}-backfill-index
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: ./cmd/backfill-index
          output: backfill-index
          ldflags: -w
          go-package: go-fips
      - uses: strip
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: ${{subpkg.name}}

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: sigstore/rekor
    strip-prefix: v
