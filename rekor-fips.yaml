package:
  name: rekor-fips
  version: "1.3.10"
  epoch: 0
  description: Software Supply Chain Transparency Log
  copyright:
    - license: Apache-2.0
      paths:
        - "*"
  checks:
    disabled:
      - empty

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - git
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sigstore/rekor
      tag: v${{package.version}}
      expected-commit: 4118a64b4b9c228a968b2d935a00807ca1b33aed

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v4@v4.0.5
        github.com/redis/go-redis/v9@v9.7.3
        github.com/golang-jwt/jwt/v5@v5.2.2
        golang.org/x/net@v0.38.0

subpackages:
  - name: ${{package.name}}-server
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: ./cmd/rekor-server
          output: rekor-server
          ldflags: -w
          go-package: go-fips
      - uses: strip

  - name: ${{package.name}}-cli
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: ./cmd/rekor-cli
          output: rekor-cli
          ldflags: -w
          go-package: go-fips
      - uses: strip

  - name: ${{package.name}}-backfill-index
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: ./cmd/backfill-index
          output: backfill-index
          ldflags: -w
          go-package: go-fips
      - uses: strip

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: sigstore/rekor
    strip-prefix: v
