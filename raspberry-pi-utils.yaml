#nolint:valid-pipeline-git-checkout-tag
package:
  name: raspberry-pi-utils
  version: "0.0.0_git20250414"
  epoch: 0
  description: A collection of scripts and simple applications for Raspberry Pi.
  copyright:
    - license: BSD-3-Clause
  target-architecture:
    - aarch64

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/raspberrypi/utils
      branch: master
      expected-commit: 358ac7085d6a9c3d4ffa62e03c23c8671904c3ec

subpackages:
  # https://www.raspberrypi.com/documentation/computers/os.html#vcgencmd
  - name: vcgencmd
    pipeline:
      - working-directory: vcgencmd
        pipeline:
          - uses: cmake/configure
          - uses: cmake/build
          - uses: cmake/install

test:
  pipeline:
    - name: Basic test of the utilities
      runs: |
        dtmerge --version | grep ${{package.version}}
        eeptools --version | grep ${{package.version}}
        kdtc --version | grep ${{package.version}}
        otpset --version | grep ${{package.version}}
        overlaycheck --version | grep ${{package.version}}
        ovmerge --version | grep ${{package.version}}
        pinctrl --version | grep ${{package.version}}
        piolib --version | grep ${{package.version}}
        raspinfo --version | grep ${{package.version}}
        vclog --version | grep ${{package.version}}

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: This project doesn't do releases and everything is commit based
