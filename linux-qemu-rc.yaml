package:
  name: linux-qemu-rc
  version: "6.17_rc6"
  epoch: 0
  description: "Linux Release Candidate kernel"
  copyright:
    - license: GPL-2.0
  resources:
    cpu: 16
    memory: 24Gi
  dependencies:
    runtime:
      - ${{package.name}}-modules=${{package.full-version}}
      # Ensure we get Chainguard branding in our VMs.
      - chainguard-baselayout
      - merged-lib
      - wolfi-baselayout

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)_rc(\d+)
    replace: "$1"
    to: kernel-version
  - from: ${{package.version}}
    match: \d+\.\d+\_rc(\d+)
    replace: "$1"
    to: kernel-rc
  - from: ${{package.name}}
    match: 'linux-(.*)'
    replace: '$1'
    to: flavor
  - from: ${{package.name}}
    match: 'linux-(.*)'
    replace: '${{package.full-version}}-$1'
    to: version-flavor
  - from: ${{package.version}}
    match: ^(.+)_rc(.+)
    replace: "$1-rc$2"
    to: mangled-package-version
  - from: ${{package.version}}
    match: '^(\d+\.\d+)_rc\d+$'
    replace: '$1'
    to: mangled-kernel-major-version
  - from: ${{package.version}}
    match: '^(\d+)\.\d+_rc\d+$'
    replace: '$1'
    to: jitterentropy-version

pipeline:
  - uses: kernel/version-check
    with:
      moniker: mainline

  - uses: git-checkout
    with:
      repository: https://github.com/torvalds/linux.git
      expected-commit: f83ec76bf285bea5727f478a68b894f5543ca76e
      tag: v${{vars.mangled-package-version}}

  - uses: patch
    with:
      patches: 0001-crypto-reusable-jitterentropy-${{vars.mangled-kernel-major-version}}.patch 0001-random-use-jitterentropy-${{vars.mangled-kernel-major-version}}.patch

  - uses: kernel/config
    with:
      flavor: ${{vars.flavor}}
      make-targets: hardening.config
      version-flavor: ${{vars.version-flavor}}

  # TODO: pin this to a certified
  # jitterentropy version when we
  # have one.
  - uses: kernel/reusable-jitterentropy
    with:
      version: ${{vars.jitterentropy-version}}
      kernel-version: ${{vars.mangled-kernel-major-version}}

  - uses: kernel/build
    with:
      version-flavor: ${{vars.version-flavor}}

subpackages:
  - name: "${{package.name}}-boot-installed"
    description: "Linux RC kernel (installed for EFI)"
    dependencies:
      runtime:
        # Ensure we get Chainguard branding in our VMs.
        - ${{package.name}}-modules=${{package.full-version}}
        - chainguard-baselayout
        - merged-lib
        - systemd-boot-installed
        - wolfi-baselayout
      provides:
        - ${{package.name}}-boot-configuration=${{package.full-version}}
    pipeline:
      - uses: kernel/boot-installed
        with:
          version-flavor: ${{vars.version-flavor}}

  - name: "${{package.name}}-fips-boot-installed"
    description: "FIPS Linux kernel (installed for EFI)"
    dependencies:
      runtime:
        # Ensure we get Chainguard branding in our VMs.
        - ${{package.name}}-modules=${{package.full-version}}
        - chainguard-baselayout
        - systemd-boot-installed
      provides:
        - ${{package.name}}-boot-configuration=${{package.full-version}}
    pipeline:
      - uses: kernel/boot-installed
        with:
          version-flavor: ${{vars.version-flavor}}
          extra-args: fips=1

  - name: "${{package.name}}-modules"
    description: "Linux kernel modules"
    pipeline:
      - uses: kernel/modules
        with:
          version-flavor: ${{vars.kernel-version}}.0-rc${{vars.kernel-rc}}-r${{package.epoch}}-qemu-rc
    dependencies:
      runtime:
        - merged-lib
        - wolfi-baselayout

test:
  pipeline:
    - uses: kernel/test/kconfig/systemd
    - uses: kernel/test/config-snippet
      with:
        snippet: jitterentropy
        # This is =y instead of =m for melange runner reasons
        x86_64_exclude: CRYPTO_USER_API
        aarch64_exclude: CRYPTO_USER_API
    - uses: kernel/test/config-snippet
      with:
        snippet: ${{vars.flavor}}
        # Depends on CONFIG_X86
        aarch64_exclude: VIRTIO_PCI_ADMIN_LEGACY
    - name: Test Basic Boot
      uses: kernel/test/console_grep
      with:
        string: "Unable to mount root fs"
    - name: Test for XFS
      uses: kernel/test/console_grep
      with:
        string: "xfs"
    - name: Test for NVME
      uses: kernel/test/console_grep
      with:
        string: "nvme nvme0: pci function"
    - name: Test for ip6tables
      uses: kernel/test/console_grep
      with:
        string: "Segment Routing with IPv6"
    - uses: kernel/test/random_quality
      with:
        args: fips=1
    - name: Test for reusable jent
      uses: kernel/test/console_grep
      with:
        string: "jitterentropy built from ${{vars.jitterentropy-version}}"

update:
  enabled: true
  enable-prerelease-tags: true
  version-transform:
    - match: -rc(\d+)$
      replace: _rc$1
  github:
    identifier: torvalds/linux
    use-tag: true
    strip-prefix: v
