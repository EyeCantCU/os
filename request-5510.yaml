#nolint:valid-pipeline-git-checkout-tag
package:
  name: request-5510
  # we need specifically 2.17.2 and pg16.x https://github.com/chainguard-dev/image-requests/issues/5510#issuecomment-30037141422
  version: "2.17.2"
  epoch: 0
  description: A time-series database for high-performance real-time analytics packaged as a Postgres extension.
  # Outside of the "tsl" directory, source code in a given file is licensed under the Apache License Version 2.0
  # We are only building the opensource bits here.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - postgresql-${{vars.pg-version}}
      - postgresql-${{vars.pg-version}}-client
      - timescaledb-parallel-copy
      - timescaledb-tune

environment:
  contents:
    packages:
      - build-base
      - busybox
      - postgresql-${{vars.pg-version}}-dev

vars:
  pg-version: 16

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/timescale/timescaledb
      tag: ${{package.version}}
      expected-commit: b359d26de186ea43f93c28c08cd1b8c6449c91bd

  - uses: cmake/configure
    with:
      opts: |
        -DAPACHE_ONLY=ON \
        -DPG_CONFIG=/usr/bin/pg_config

  - uses: cmake/build

  - uses: cmake/install

subpackages:
  - name: ${{package.name}}-oci-entrypoint-pg${{vars.pg-version}}
    description: "docker OCI entrypoint"
    dependencies:
      runtime:
        - bash
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/timescale/timescaledb-docker
          branch: main
          expected-commit: d6339b0f6f8cb0c41c4eb2087034557fda7fb2f1
      - runs: |
          # Necessary due to `sed` in postgres packages which moves this directory to `/var/lib/postgres/initdb` in the entrypoint script
          mkdir -p ${{targets.contextdir}}/var/lib/postgres/initdb/ ${{targets.contextdir}}/usr/local/bin
          ln -s /var/lib/postgres/initdb ${{targets.contextdir}}/docker-entrypoint-initdb.d
          install -Dpm0755 docker-entrypoint-initdb.d/* ${{targets.contextdir}}/var/lib/postgres/initdb/
          ln -s /usr/bin/timescaledb-tune ${{targets.contextdir}}/usr/local/bin/timescaledb-tune
    test:
      pipeline:
        - runs: |
            stat /docker-entrypoint-initdb.d/
            stat /var/lib/postgres/initdb/
            test -L /docker-entrypoint-initdb.d
            test -L /usr/local/bin/timescaledb-tune
            test "$(readlink /docker-entrypoint-initdb.d)" = "/var/lib/postgres/initdb"
            test "$(readlink /usr/local/bin/timescaledb-tune)" = "/usr/bin/timescaledb-tune"

test:
  environment:
    accounts:
      groups:
        - groupname: wolfi
          gid: 65532
      users:
        - username: wolfi
          gid: 65532
          uid: 65532
      run-as: 0
    contents:
      packages:
        - postgresql-${{vars.pg-version}}-client
        - shadow
        - sudo-rs
    environment:
      PGUSER: wolfi
  pipeline:
    - name: Check postgres version
      runs: |
        postgres --version | grep -F -e "${{vars.pg-version}}"
        psql --version | grep -F -e "${{vars.pg-version}}"
    - name: Check extension control file
      runs: |
        stat $(pg_config --sharedir)/extension/timescaledb.control
    - name: Create database and load extension
      runs: |
        TEST_DB="$(mktemp -d)"
        rm -rf "${TEST_DB}" # let $PGUSER create it
        TMP_LOGFILE="$(mktemp)"
        rm -rf "${TMP_LOGFILE}" # same here

        sudo -u "${PGUSER}" initdb -D "${TEST_DB}"
        echo "shared_preload_libraries = 'timescaledb'" | tee "${TEST_DB}/postgresql.conf"
        sudo -u "${PGUSER}" pg_ctl -D "${TEST_DB}" -o "-c unix_socket_directories='/tmp'" -l "${TMP_LOGFILE}" start
        trap 'cat $TMP_LOGFILE' EXIT
        createdb -h /tmp testdb
        psql -h /tmp -d testdb -c "CREATE TABLE test_table (time TIMESTAMPTZ, value INT);"
        psql -d testdb -c "CREATE EXTENSION timescaledb;"
        sudo -u "${PGUSER}" pg_ctl -D "${TEST_DB}" -m fast stop
    - name: Test CLI tools
      runs: |
        timescaledb-tune --version
        timescaledb-parallel-copy --help

update:
  enabled: true
  github:
    identifier: timescale/timescaledb
    tag-filter-prefix: "2.17"
