#nolint:valid-pipeline-git-checkout-commit,valid-pipeline-git-checkout-tag
package:
  name: cilium-fips-1.15
  version: 1.15.10
  epoch: 1
  description: Cilium is a networking, observability, and security solution with an eBPF-based dataplane
  copyright:
    - license: Apache-2.0
  resources:
    cpu: 30
    memory: 64Gi
  dependencies:
    runtime:
      - bpftool
      # cilium does compilations at runtime on the node.
      - clang-17
      - cni-plugins-fips-loopback
      - ip6tables
      - iproute2
      - ipset
      - iptables
      - kmod
      - llvm17
      - cilium-host-utils=${{package.full-version}}
    provides:
      - cilium=${{package.full-version}}

# This package contains cni binaries. They can be copied out of Wolfi
# onto older host-os During build-time link against an older glibc, to
# ensure go-fips built cni remain ABI compatible with old foreign
# host-os. Majority of regular go-fips binaries/images do not need
# this.
environment:
  contents:
    packages:
      - bash
      - bazel-6
      - binutils
      # Use the FIPS build of BoringSSL
      - boringssl-fips-static-compat
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-17
      - clang-17-dev
      - cmake
      - coreutils # for GNU install
      # We need to stick to gcc 12 for now, envoy doesn't build with gcc >= 13
      - gcc-12-default
      - git
      - go-fips
      - grep
      - ip6tables
      - iptables # for cilium-iptables
      - libtool
      - llvm-lld-17
      - llvm17
      - llvm17-dev
      - oldglibc
      - openjdk-11
      - patch
      - python3-dev
      - samurai
      - wolfi-baselayout
      # for fips config & fips-provider
      - openssl-config-fipshardened

vars:
  # https://github.com/cilium/cilium/blob/v1.15.6/images/cilium/Dockerfile
  CILIUM_PROXY_COMMIT: "0d05e48bfbb8c4737ec40d5781d970a550ed2bbd"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cilium/cilium
      tag: v${{package.version}}
      expected-commit: 2fdab41a13d2a3f8abbbb4d3b4ba8cc1624c3935

  - uses: patch
    with:
      patches: loopback-location.patch cilium-version.patch

  - uses: go/bump
    with:
      deps: google.golang.org/grpc@v1.64.1

  - runs: |
      # Check the Dockerfile for a SHA and match against the proxy SHA
      ENVOY_SHA=$(grep 'FROM.*cilium-envoy' ./images/cilium/Dockerfile \
        | sed "s/^FROM.*:v[0-9.]\+-[0-9]\+-//g" | cut -d@ -f1)

      if [ "$ENVOY_SHA" != "${{vars.CILIUM_PROXY_COMMIT}}" ]; then
        echo "Expected vars.CILIUM_PROXY_COMMIT to be $ENVOY_SHA. Please update" 1>&2
        exit 1
      fi

  - runs: |
      # Bazel errors out on toolchain stanza
      sed -i '/$toolchain /d' go.mod
      # Bazel errors out on go point release
      sed -i 's|^\(go 1\.[0-9]*\)\.[0-9]*|\1|' go.mod

  - uses: go/remove-cgo-enabled-0
    with:
      files: Makefile Makefile.defs images/runtime/build-gops.sh
      seds: |
        s,CGO_ENABLED=0[ ]*,,g
        s,-s -w,-w,g
        s,tools/mount,,g
        s,tools/sysctlfix,,g
        s,plugins/cilium-cni,,g

  - runs: |
      # Remove groupadd from Makefile: it's not doing anything useful in
      # a package build anyway, and it's not available in busybox.
      find . -name Makefile -exec sed -i '/groupadd/d' {} \;

      DESTDIR=${{targets.destdir}} DISABLE_ENVOY_INSTALLATION=1 make build-container
      DESTDIR=${{targets.destdir}} DISABLE_ENVOY_INSTALLATION=1 make install-container

  - runs: |
      # these tools run on host and are linked against oldglibc for compatability
      export CGO_CFLAGS=-I/usr/lib/oldglibc/include
      export CGO_LDFLAGS=-L/usr/lib/oldglibc/lib
      for d in tools/sysctlfix tools/mount plugins/cilium-cni; do
          make -C $d clean all
          DESTDIR=${{targets.destdir}} make -C $d install
      done

  - uses: git-checkout
    with:
      repository: https://github.com/cilium/proxy
      # Branch from https://github.com/cilium/cilium/blob/v1.15.5/images/cilium/Dockerfile
      # Note often the branch is updated with dependencies updates, no tags
      # See CILIUM_PROXY_COMMIT for anchor point
      branch: v1.29
      depth: 1000
      destination: envoy

  - runs: |
      git -C envoy reset --hard ${{vars.CILIUM_PROXY_COMMIT}}

  - working-directory: envoy
    uses: patch
    with:
      patches: ../envoy-toolchains-paths.patch

  # Remove when Envoy > 1.29.9 is used.
  - working-directory: envoy
    uses: patch
    with:
      patches: ../envoy-googleurl.patch

  # Use the FIPS build of BoringSSL
  - uses: patch
    with:
      patches: boringssl_fips.genrule_cmd.patch

  - runs: |
      cd /home/build/envoy/proxylib
      make
      mkdir -p ${{targets.destdir}}/usr/lib
      cp -v libcilium.so ${{targets.destdir}}/usr/lib/libcilium.so

      cd /home/build/envoy

      # The Python interpreter complains about being run as root, there's a flag to pass to disable that warning.
      sed -i 's/envoy_dependencies_extra()/envoy_dependencies_extra(ignore_root_user_error=True)/g' WORKSPACE
      export JAVA_HOME=/usr/lib/jvm/java-11-openjdk
      mkdir -p .cache/bazel/_bazel_root

      ./bazel/setup_clang.sh /usr

      mkdir -p ${{targets.destdir}}/usr/bin

      for target in cilium-envoy-starter cilium-envoy; do
        bazel build --fission=no --config=clang \
          --discard_analysis_cache \
          --nokeep_state_after_build \
          --notrack_incremental_state \
          --conlyopt="-Wno-strict-prototypes" \
          --verbose_failures -c opt //:${target}
        install -m 755 bazel-bin/${target} ${{targets.destdir}}/usr/bin/${target}
      done

  - uses: strip

subpackages:
  - name: ${{package.name}}-operator-generic
    description: Generic operator for cilium
    dependencies:
      runtime:
        - gops
      provides:
        - cilium-operator-generic-fips=${{package.full-version}}
    pipeline:
      - runs: |
          cd /home/build/operator
          make cilium-operator-generic
          DESTDIR=${{targets.subpkgdir}} make install-generic
      - uses: strip

  - name: ${{package.name}}-hubble-relay
    description: Hubble relay
    dependencies:
      provides:
        - cilium-hubble-relay-fips=${{package.full-version}}
    pipeline:
      - runs: |
          cd /home/build/hubble-relay
          make hubble-relay
          DESTDIR=${{targets.subpkgdir}} make install
      - uses: strip

  - name: ${{package.name}}-host-utils
    description: Cilium binaries that run on the host.
    dependencies:
      provides:
        - cilium-host-utils=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          for p in cilium-mount cilium-sysctlfix; do
              mv "${{targets.destdir}}"/usr/bin/$p "${{targets.contextdir}}"/usr/bin
          done
          mkdir -p "${{targets.contextdir}}/opt/cni/bin"
          mv "${{targets.destdir}}"/opt/cni/bin/cilium-cni "${{targets.contextdir}}"/opt/cni/bin
      - uses: strip
    test:
      pipeline:
        - uses: test/go-fips-check

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        cilium version
        cilium --help
        cilium-agent --version
        cilium-agent --help
        cilium-bugtool --help
        cilium-dbg version
        cilium-dbg --help
        cilium-envoy --version
        cilium-envoy --help
        cilium-health --help
        cilium-mount --version
        cilium-mount --help
        cilium-sysctlfix --help
    # Ensure that structured version info is available
    - runs: cilium version -ojsonpath={.Client.Version} | grep ${{package.version}}

update:
  enabled: true
  github:
    identifier: cilium/cilium
    strip-prefix: v
    tag-filter-prefix: v1.15.
