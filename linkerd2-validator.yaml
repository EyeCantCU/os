package:
  name: linkerd2-validator
  version: 1.6.4
  epoch: 0
  description: linkerd2 validator package (linkerd/linkerd2-proxy-init)
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ba0964997774216d9bcb5195d5e5804df3800e72
      repository: https://github.com/linkerd/linkerd2-proxy-init
      tag: v${{package.version}}

update:
  enabled: true
  github:
    identifier: linkerd/linkerd2-proxy-init
    tag-filter: validator
    strip-prefix: validator v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: version test
      runs: |
        linkerd2-validator --version
