package:
  name: linkerd2-validator
  version: 0.1.4
  epoch: 0
  description: linkerd2 validator package (linkerd/linkerd2-proxy-init)
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ba0964997774216d9bcb5195d5e5804df3800e72
      repository: https://github.com/linkerd/linkerd2-proxy-init
      tag: validator/v${{package.version}}

  - uses: cargo/build
    with:
      modroot: ./validator
      output: linkerd-network-validator

update:
  enabled: true
  github:
    identifier: linkerd/linkerd2-proxy-init
    tag-filter: validator
    strip-prefix: validator v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: functionality test
      runs: |
        # Test version output
        linkerd-network-validator --version

        # Test help output shows expected options
        linkerd-network-validator --help | grep -q "log-level"
        linkerd-network-validator --help | grep -q "log-format"

        # Test it validates CLI arguments (should show help/usage on invalid args)
        linkerd-network-validator --invalid-arg 2>&1 | grep -q -i "error\|usage\|help"
