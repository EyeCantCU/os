package:
  name: caddy-fips
  version: "2.10.0"
  epoch: 0
  description: Fast and extensible multi-platform HTTP/1-2-3 web server with automatic HTTPS
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # for fips config & fips-provider
      - openssl-config-fipshardened
      # either melange SCA should provide these
      # or we should make go-fips shared link on these
      - so:libcrypto.so.3
      - so:libssl.so.3

environment:
  contents:
    packages:
      - openssl-config-fipshardened
      # Needed because man-page pipeline tries to execute the just
      # compiled caddy-fips, and our go-fips toolchain prohibits runtime
      # opt out
      - so:libcrypto.so.3
      - so:libssl.so.3

pipeline:
  - uses: git-checkout
    with:
      expected-commit: fb22a26b1a08a2fa3b2526d1852467904ee140f6
      repository: https://github.com/caddyserver/caddy
      tag: v${{package.version}}

  - runs: |
      install -m644 -D "./Caddyfile" "${{targets.destdir}}/etc/caddy/Caddyfile"
      install -m755 -D "./index.html" "${{targets.destdir}}/usr/share/caddy/index.html"

  - uses: go/build
    with:
      output: caddy
      packages: ./cmd/caddy
      go-package: go-fips

test:
  pipeline:
    - runs: |
        caddy --version
        caddy --help

update:
  enabled: true
  manual: false
  github:
    identifier: caddyserver/caddy
    strip-prefix: v
    tag-filter: v
    use-tag: true
