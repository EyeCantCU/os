package:
  name: caddy-fips
  version: "2.10.2"
  epoch: 6 # GHSA-h8cp-697h-8c8p
  description: Fast and extensible multi-platform HTTP/1-2-3 web server with automatic HTTPS
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # for fips config & fips-provider
      - openssl-config-fipshardened
      # either melange SCA should provide these
      # or we should make go-fips shared link on these
      - so:libcrypto.so.3
      - so:libssl.so.3

environment:
  contents:
    packages:
      - go-fips-1.25
      - openssl-config-fipshardened
      # Needed because man-page pipeline tries to execute the just
      # compiled caddy-fips, and our go-fips toolchain prohibits runtime
      # opt out
      - so:libcrypto.so.3
      - so:libssl.so.3

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 551f793700fe1550845c824470b623fd1aa03d36
      repository: https://github.com/caddyserver/caddy
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/quic-go/quic-go@v0.54.1
        github.com/slackhq/nebula@v1.9.7
        github.com/smallstep/certificates@v0.29.0
        golang.org/x/crypto@v0.45.0

  - runs: |
      install -m644 -D "./Caddyfile" "${{targets.destdir}}/etc/caddy/Caddyfile"
      install -m755 -D "./index.html" "${{targets.destdir}}/usr/share/caddy/index.html"

  - uses: go/build
    with:
      output: caddy
      packages: ./cmd/caddy
      go-package: go-fips

test:
  pipeline:
    - runs: |
        caddy --version
        caddy --help
    - uses: test/go-fips-check

update:
  enabled: true
  manual: false
  github:
    identifier: caddyserver/caddy
    strip-prefix: v
    tag-filter: v
    use-tag: true
