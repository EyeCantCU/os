package:
  name: freeipa
  version: "4.13.1"
  epoch: 0
  description: IPA is an integrated solution to provide centrally managed Identity, Authentication, and Authorization
  copyright:
    - license: GPL-3.0-or-later
  dependencies:
    runtime:
      - py${{vars.python-version}}-dogtag-pki
      - py${{vars.python-version}}-ifaddr
      - py${{vars.python-version}}-ifaddr
      - py${{vars.python-version}}-ipaclient
      - py${{vars.python-version}}-ipalib
      - py${{vars.python-version}}-ipaplatform
      - py${{vars.python-version}}-ipapython
      - py${{vars.python-version}}-ipaserver
      - py${{vars.python-version}}-ipatests
      - py${{vars.python-version}}-jinja2
      - py${{vars.python-version}}-lib389
      - py${{vars.python-version}}-pexpect
      - py${{vars.python-version}}-pytest
      - py${{vars.python-version}}-pytest-multihost
      - py${{vars.python-version}}-samba
      - systemd

vars:
  python-version: 3.13

environment:
  contents:
    packages:
      - 389-ds-base-dev
      - bash
      - build-base
      - busybox
      - coreutils
      - curl-dev
      - ding-libs-dev
      - gettext-dev
      - jansson-dev
      - krb5-dev
      - libnspr-dev
      - libpwquality-dev
      - libtool
      - libunistring-dev
      - nodejs
      - npm
      - openldap-dev
      - openssl-dev
      - pkgconf-dev
      - popt-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-lesscpy
      - py${{vars.python-version}}-rjsmin
      - samba-dev
      - sssd-dev
      - systemd-dev
      - talloc-dev
      - tevent-dev

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: "-"
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://pagure.io/freeipa.git
      tag: release-${{vars.mangled-package-version}}
      expected-commit: 914aa64f782d646cdb8e7244d5687965fe6d498f
      recurse-submodules: true

  # Our `py3-setuptools` package seems to include `[post(date)]` to the end of the setuptools version array
  # Which is unexpected by a build script
  - uses: patch
    with:
      patches: |
        freeipa-correct-setuptools-version.patch

  # Using krb5 versions that have the `-final` suffix is not expected by freeIPA
  - uses: patch
    with:
      patches: freeipa-krb5-no-suffix.patch

  # FreeIPA doesnt directly support wolfi, we need this so that it works fine
  # TODO: Add support upstream (this is non-trivial.)
  - uses: patch
    with:
      patches: freeipa-platform-fedora.patch

  # Need this so it will recognize wolfi from `/etc/os-release` to be a valid platform
  - working-directory: ipaplatform
    runs: |
      ln -s ./fedora ./wolfi

  - uses: autoconf/configure
    with:
      opts: |
        --sbindir=/usr/bin \
        --with-vendor-suffix=-${{package.epoch}} \
        --enable-server \
        --enable-client

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

update:
  enabled: true
  # FreeIPA uses `-` as separator instead of `.` in their tags
  # e.g. release-4-12-4 for version 4.12.4
  # So we need to transform `.` to `-` for matching the tags
  version-transform:
    - match: '-'
      replace: '.'
  git:
    strip-prefix: release-

subpackages:
  - name: ${{package.name}}-doc
    description: ${{package.name}} documentation and manpages
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

  - name: py${{vars.python-version}}-ipatests
    description: ${{package.name}} python subpackage ipatests
    dependencies:
      runtime:
        - py${{vars.python-version}}-cryptography
        - py${{vars.python-version}}-dnspython
        - py${{vars.python-version}}-gssapi
        - py${{vars.python-version}}-ipaclient
        - py${{vars.python-version}}-ipalib
        - py${{vars.python-version}}-ipaplatform
        - py${{vars.python-version}}-ipapython
        - py${{vars.python-version}}-pexpect
        - py${{vars.python-version}}-polib
        - py${{vars.python-version}}-pytest
        - py${{vars.python-version}}-pytest-multihost
        - py${{vars.python-version}}-ldap
        - py${{vars.python-version}}-six
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/python${{vars.python-version}}/site-packages/
          mv ${{targets.destdir}}/usr/lib/python${{vars.python-version}}/site-packages/ipatests* ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/
    test:
      environment:
        contents:
          packages:
            - python-${{vars.python-version}}
      pipeline:
        # Not importable, so no import test here, its supposed to be used ipa-run-tests
        - uses: test/tw/pip-check
          with:
            python: python${{vars.python-version}}

  - name: py${{vars.python-version}}-ipaserver
    description: ${{package.name}} python subpackage ipaserver
    dependencies:
      runtime:
        - py${{vars.python-version}}-cryptography
        - py${{vars.python-version}}-dbus-python
        - py${{vars.python-version}}-dnspython
        - py${{vars.python-version}}-ipaclient
        - py${{vars.python-version}}-ipalib
        - py${{vars.python-version}}-ipaplatform
        - py${{vars.python-version}}-ipapython
        - py${{vars.python-version}}-jwcrypto
        - py${{vars.python-version}}-typing-extensions
        - py${{vars.python-version}}-lxml
        - py${{vars.python-version}}-netaddr
        - py${{vars.python-version}}-psutil
        - py${{vars.python-version}}-pyasn1
        - py${{vars.python-version}}-augeas
        - py${{vars.python-version}}-ldap
        - py${{vars.python-version}}-requests
        - py${{vars.python-version}}-six
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/python${{vars.python-version}}
          mv ${{targets.destdir}}/usr/lib/python${{vars.python-version}}/site-packages/ipaserver* ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}
    test:
      environment:
        contents:
          packages:
            - python-${{vars.python-version}}
      pipeline:
        - uses: test/tw/pip-check
          with:
            python: python${{vars.python-version}}
        - uses: python/import
          with:
            python: python${{vars.python-version}}
            import: ipaserver

  - name: py${{vars.python-version}}-ipaplatform
    description: ${{package.name}} python subpackage ipaplatform
    dependencies:
      runtime:
        - py${{vars.python-version}}-cffi
        - py${{vars.python-version}}-ipapython
        - py${{vars.python-version}}-pyasn1
        - py${{vars.python-version}}-six
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/python${{vars.python-version}}/site-packages/
          mv ${{targets.destdir}}/usr/lib/python${{vars.python-version}}/site-packages/ipaplatform* ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/
    test:
      environment:
        contents:
          packages:
            - python-${{vars.python-version}}
      pipeline:
        - uses: test/tw/pip-check
          with:
            python: python${{vars.python-version}}
        - uses: python/import
          with:
            python: python${{vars.python-version}}
            import: ipaplatform

  - name: py${{vars.python-version}}-ipalib
    description: ${{package.name}} python subpackage ipalib
    dependencies:
      runtime:
        - py${{vars.python-version}}-setuptools
        - py${{vars.python-version}}-ldap
        - py${{vars.python-version}}-ipaplatform
        - py${{vars.python-version}}-ipapython
        - py${{vars.python-version}}-netaddr
        - py${{vars.python-version}}-packaging
        - py${{vars.python-version}}-pyasn1
        - py${{vars.python-version}}-pyasn1-modules
        - py${{vars.python-version}}-six
        - py${{vars.python-version}}-urllib3
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/python${{vars.python-version}}/site-packages
          mv ${{targets.destdir}}/usr/lib/python${{vars.python-version}}/site-packages/ipalib* ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/
    test:
      environment:
        contents:
          packages:
            - python-${{vars.python-version}}
      pipeline:
        - uses: test/tw/pip-check
          with:
            python: python${{vars.python-version}}
        - uses: python/import
          with:
            python: python${{vars.python-version}}
            import: ipalib

  - name: py${{vars.python-version}}-ipapython
    description: ${{package.name}} python subpackage ipapython
    dependencies:
      runtime:
        - py${{vars.python-version}}-cffi
        - py${{vars.python-version}}-cryptography
        - py${{vars.python-version}}-dnspython
        - py${{vars.python-version}}-gssapi
        - py${{vars.python-version}}-ipaplatform
        - py${{vars.python-version}}-netaddr
        - py${{vars.python-version}}-six
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/python${{vars.python-version}}/site-packages/
          mv ${{targets.destdir}}/usr/lib/python${{vars.python-version}}/site-packages/ipapython* ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/
    test:
      environment:
        contents:
          packages:
            - python-${{vars.python-version}}
      pipeline:
        - uses: test/tw/pip-check
          with:
            python: python${{vars.python-version}}
        - uses: python/import
          with:
            python: python${{vars.python-version}}
            import: ipapython

  - name: py${{vars.python-version}}-ipaclient
    description: ${{package.name}} python subpackage ipaclient
    dependencies:
      runtime:
        - py${{vars.python-version}}-cryptography
        - py${{vars.python-version}}-ipalib
        - py${{vars.python-version}}-ipapython
        - py${{vars.python-version}}-qrcode
        - py${{vars.python-version}}-six
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/python${{vars.python-version}}/site-packages/
          mv ${{targets.destdir}}/usr/lib/python${{vars.python-version}}/site-packages/ipaclient* ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/
    test:
      environment:
        contents:
          packages:
            - python-${{vars.python-version}}
      pipeline:
        - uses: test/tw/pip-check
          with:
            python: python${{vars.python-version}}
        - uses: python/import
          with:
            python: python${{vars.python-version}}
            import: ipaclient

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Fail expected
      runs: |
        # Every single one of these is expected to fail as we cannot run `ipa-client-install`
        # because it requires a system booted with systemd so it can run `systemctl` to query
        # information.
        # The expected failure must not be a "missing python module" one, instead, something
        # complaining about not being able to run due to FreeIPA client/server not running

        check_compliant() {
          COMMAND="${1}"
          shift

          OUTPUT_TEST="$(mktemp)"
          { "${COMMAND}" --help || true ; } 2>&1 | tee "${OUTPUT_TEST}"
          if grep -F -e "No module named" "${OUTPUT_TEST}" ; then
            echo "Failed test due to module not being found"
            rm -f "${OUTPUT_TEST}"
            exit 1
          fi
          if grep -F -e "IPA is not configured on this system" ; then
            echo "$COMMAND: expected failure"
          fi
          rm -f "${OUTPUT_TEST}"
        }

        for COMMAND in \
            ipa-acme-manage \
            ipa-adtrust-install \
            ipa-advise \
            ipa-backup \
            ipa-ca-install \
            ipa-cacert-manage \
            ipa-cert-fix \
            ipa-certupdate \
            ipa-client-automount \
            ipa-client-install \
            ipa-client-samba \
            ipa-compat-manage \
            ipa-crlgen-manage \
            ipa-csreplica-manage \
            ipa-dns-install \
            ipa-epn \
            ipa-getkeytab \
            ipa-join \
            ipa-kra-install \
            ipa-ldap-updater \
            ipa-managed-entries \
            ipa-migrate \
            ipa-nis-manage \
            ipa-otptoken-import \
            ipa-pkinit-manage \
            ipa-replica-conncheck \
            ipa-replica-install \
            ipa-replica-manage \
            ipa-restore \
            ipa-rmkeytab \
            ipa-run-tests \
            ipa-server-certinstall \
            ipa-server-install \
            ipa-server-upgrade \
            ipa-test-config \
            ipa-test-task \
            ipa-winsync-migrate \
            ipa \
            ipactl ; do
            check_compliant "${COMMAND}"
          done
