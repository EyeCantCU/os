package:
  name: grafana-10.1
  version: 10.1.7
  epoch: 0
  description: The open and composable observability and data visualization platform.
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    runtime:
      - bash
    provides:
      - grafana=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - findutils
      - go
      - nodejs-16
      - posix-libc-utils
      - py3-setuptools
      - python3
      - yarn

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 50f6940ae646ce96dc580d3b76e50d69e4b63017
      repository: https://github.com/grafana/grafana
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: golang.org/x/crypto@v0.17.0 github.com/go-jose/go-jose/v3@v3.0.1 go.opentelemetry.io/otel@v1.21.0 go.opentelemetry.io/otel/trace@v1.21.0 go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.46.0 go.opentelemetry.io/otel/sdk@v1.21.0 go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.21.0 go.opentelemetry.io/contrib/instrumentation/net/http/httptrace/otelhttptrace@v0.44.0 go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.44.0 google.golang.org/grpc@v1.56.3 github.com/go-git/go-git/v5@v5.11.0 github.com/cloudflare/circl@v1.3.7

  - runs: |
      yarn install
      yarn run build
      yarn run plugins:build-bundled

      # Our default LDFLAGS cause an issue with grafana. We need to remove '-z, noexecheap' from LDFLAGS
      # Ref https://github.com/wolfi-dev/os/issues/7419
      LDFLAGS="$(echo $LDFLAGS | sed 's/,-z,noexecheap//g')"

      # Bump the version of wire used, the old version panics with new Go
      # https://github.com/google/wire/issues/400
      sed -i "s/v0.5.0/v0.6.0/g" .bingo/wire.mod

      make build

      mkdir -p ${{targets.destdir}}/usr/bin
      mv ./bin/linux-*/* ${{targets.destdir}}/usr/bin/

  - name: package
    runs: |
      mkdir -p ${{targets.destdir}}/usr/share/grafana/plugins-bundled
      mkdir -p ${{targets.destdir}}/usr/share/grafana/scripts
      mkdir -p ${{targets.destdir}}/usr/share/grafana/bin

      mv ./conf ${{targets.destdir}}/usr/share/grafana/
      mv ./plugins-bundled/internal ${{targets.destdir}}/usr/share/grafana/plugins-bundled/
      mv ./public ${{targets.destdir}}/usr/share/grafana/
      mv ./scripts/*.sh ${{targets.destdir}}/usr/share/grafana/scripts/

      mkdir -p ${{targets.destdir}}/etc/grafana/
      cp ${{targets.destdir}}/usr/share/grafana/conf/sample.ini ${{targets.destdir}}/etc/grafana/grafana.ini

update:
  enabled: true
  github:
    use-tag: true
    identifier: grafana/grafana
    tag-filter-prefix: v10.1.
    strip-prefix: v
