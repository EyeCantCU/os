package:
  name: aws-c-http-fips
  version: "0.10.2"
  epoch: 0
  description: AWS C99 implementation of the HTTP/1.1 and HTTP/2 specifications (FIPS)
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - aws-c-http=${{package.full-version}}
    provider-priority: 20

environment:
  contents:
    packages:
      - aws-c-cal-fips-dev
      - aws-c-common-dev
      - aws-c-compression-dev
      - aws-c-io-fips-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - s2n-tls-fips-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 10961a708a4148c57db139232277573da2f6e99c
      repository: https://github.com/awslabs/aws-c-http
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-http-fips-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-http-fips
      provides:
        - aws-c-http-dev=${{package.full-version}}
      provider-priority: 20
    description: aws-c-http-fips dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-http
    strip-prefix: v
    use-tag: true
