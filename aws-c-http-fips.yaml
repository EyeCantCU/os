package:
  name: aws-c-http-fips
  version: "0.10.4"
  epoch: 1
  description: AWS C99 implementation of the HTTP/1.1 and HTTP/2 specifications (FIPS)
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 20

vars:
  aws-lc-lib-dir: /usr/lib/aws-lc
  aws-lc-include-dir: /usr/include/aws-lc
  aws-lc-crypto-lib: /usr/lib/aws-lc/libcrypto.so

environment:
  contents:
    packages:
      - aws-c-cal-fips-dev
      - aws-c-common-dev
      - aws-c-compression-dev
      - aws-c-io-fips-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - s2n-tls-fips-dev
      - samurai
  environment:
    CMAKE_PREFIX_PATH: ${{vars.aws-lc-lib-dir}}
    CFLAGS: "-I${{vars.aws-lc-include-dir}}"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ce0d65623bff28f03204756d9d1b3366bd0b387d
      repository: https://github.com/awslabs/aws-c-http
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_PREFIX_PATH=/usr \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_INSTALL_RPATH=${{vars.aws-lc-lib-dir}} \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux \
        -Dcrypto_INCLUDE_DIR=${{vars.aws-lc-include-dir}} \
        -Dcrypto_SHARED_LIBRARY=${{vars.aws-lc-crypto-lib}}

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-http-fips-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-http-fips
      provider-priority: 20
    description: aws-c-http-fips dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-http
    strip-prefix: v
    use-tag: true
