package:
  name: tekton-chains-fips
  version: 0.22.0
  epoch: 1
  description: Supply Chain Security in Tekton Pipelines
  copyright:
    - license: Apache-2.0

environment:
  environment:
    CGO_ENABLED: "1"
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7fd8992e3c70bb0dbc987df3a9bd8a18e69e317d
      repository: https://github.com/tektoncd/chains
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/docker/docker@v26.1.5

  - uses: go/build
    with:
      output: tekton-chains
      packages: ./cmd/controller
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: tektoncd/chains
    strip-prefix: v

test:
  pipeline:
    - runs: |
        tekton-chains -h
