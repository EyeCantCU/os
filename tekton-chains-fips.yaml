package:
  name: tekton-chains-fips
  version: 0.21.0
  epoch: 1
  description: Supply Chain Security in Tekton Pipelines
  copyright:
    - license: Apache-2.0

environment:
  environment:
    CGO_ENABLED: "1"
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9a67b0f3db034cb5f27f8d83d55f5f98b3cae11a
      repository: https://github.com/tektoncd/chains
      tag: v${{package.version}}

  - uses: go/build
    with:
      output: tekton-chains
      packages: ./cmd/controller
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: tektoncd/chains
    strip-prefix: v

test:
  pipeline:
    - runs: |
        tekton-chains -h
