package:
  name: tekton-chains-fips
  version: "0.25.1"
  epoch: 0
  description: Supply Chain Security in Tekton Pipelines
  copyright:
    - license: Apache-2.0

environment:
  environment:
    CGO_ENABLED: "1"
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips-md5

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ab93ad44dcfeb860b6648a91328acd218a71dfab
      repository: https://github.com/tektoncd/chains
      tag: v${{package.version}}

  - uses: go/build
    with:
      output: tekton-chains
      packages: ./cmd/controller
      go-package: go-fips-md5

update:
  enabled: true
  github:
    identifier: tektoncd/chains
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        tekton-chains --help
    - runs: |
        tekton-chains -h
