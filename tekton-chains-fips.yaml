package:
  name: tekton-chains-fips
  version: "0.24.0"
  epoch: 0
  description: Supply Chain Security in Tekton Pipelines
  copyright:
    - license: Apache-2.0

environment:
  environment:
    CGO_ENABLED: "1"
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 65f8d90df06be35f440f832dd6245e40019709f0
      repository: https://github.com/tektoncd/chains
      tag: v${{package.version}}

  - uses: go/build
    with:
      output: tekton-chains
      packages: ./cmd/controller
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: tektoncd/chains
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        tekton-chains --help
    - runs: |
        tekton-chains -h
