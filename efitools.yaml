#nolint:valid-pipeline-git-checkout-tag
package:
  name: efitools
  version: "1.9.2.3.5"
  epoch: 0
  description: useful tools for manipulating UEFI secure boot platforms
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gnu-efi
      - help2man
      - openssl
      - openssl-dev
      - vim

pipeline:
  - uses: git-checkout
    with:
      # Currently there is no good upstream for this, likely need to
      # create a new upstream location for it
      repository: https://git.launchpad.net/ubuntu/+source/efitools
      branch: applied/debian/sid
      expected-commit: 3e82ebedbc5dfb3c9edf65cec08317065449572a

  - name: Inlined patches, that should be upstreamed
    runs: |
      # We don't have perl modules, but we do have vim
      sed -i 's|./xxdi.pl|xxd -i|' -i Make.rules Makefile
      # We don't yet have sbsign, and don't need it yet
      sed -i 's|sbsign|-sbsign|' -i Make.rules
      # Other patches already define XOPEN_SOURCE
      sed -i '/XOPEN_SOURCE/d' -i cert-to-efi-hash-list.c
      # C23 allows to use bool as keyword without stdbool import
      sed -i '/typedef unsigned char bool/d' -i lib/asn1/typedefs.h

  - uses: autoconf/make

  - uses: autoconf/make-install
    with:
      opts: PREFIX=/usr

  - runs: |
      rm -rf ${{targets.destdir}}/usr/share/efitools

  - uses: strip

subpackages:
  - name: "${{package.name}}-doc"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: false
  exclude-reason: |
    This package is distro patched in every distro and likely needs a new home
