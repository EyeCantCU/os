#nolint:valid-pipeline-git-checkout-tag
package:
  name: py3-kenlm
  version: "0_git20251015"
  epoch: 0
  description: Faster and Smaller Language Model Queries
  copyright:
    - license: GPL-3.0-only
    - license: LGPL-2.1-only

vars:
  pypi-package: kenlm

environment:
  contents:
    packages:
      - bash
      - bzip2-dev
      - cmake
      - eigen-dev
      - py3-supported-build-base-dev
      - xz-dev
      - zlib-dev

data:
  - name: py-versions
    # Does not seem to be buildable for Python 3.13
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kpu/kenlm.git
      branch: master
      expected-commit: 4cb443e60b7bf2c0ddf3c745378f76cb59e254e5

  - uses: patch
    with:
      # this patch comes from https://github.com/kpu/kenlm/pull/468/files
      # kenlm, as of 14/10/25 does not have py3.13 support
      patches: py3.13-support.patch

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - curl
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            curl -fSsLo model.arpa "https://raw.githubusercontent.com/kpu/kenlm/4cb443e60b7bf2c0ddf3c745378f76cb59e254e5/lm/test.arpa"
            python${{range.key}} <<'EOF' | grep -E -e ".*[[:digit:]]*\.[[:digit:]]*"
            import kenlm
            model = kenlm.Model('model.arpa')
            print(model.score('this is a sentence .', bos = True, eos = True))
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git: {}
  schedule:
    period: monthly
    reason: "Upstream does not maintain tags or releases"

test:
  pipeline:
    - uses: test/emptypackage
