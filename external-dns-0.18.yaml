package:
  name: external-dns-0.18
  version: "0.18.0"
  epoch: 9 # GHSA-j5w8-q4qc-rx2x
  description: Configure external DNS servers (AWS Route53, Google CloudDNS and others) for Kubernetes Ingresses and Services.
  copyright:
    - paths:
        - '*'
      license: Apache-2.0
  dependencies:
    provides:
      - external-dns=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+$
    replace: "$1"
    to: major-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1a2d18f3e26e132b5618e874de679b52f6db7f54
      repository: https://github.com/kubernetes-sigs/external-dns
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - runs: |
      # Our global LDFLAGS conflict with a Makefile parameter
      unset LDFLAGS
      make build
      mkdir -p ${{targets.destdir}}/usr/bin
      mv build/external-dns ${{targets.destdir}}/usr/bin/

  - uses: strip

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: external-dns
          version: ${{vars.major-version}}
      - name: Create symlinks
        runs: |
          mkdir -p /opt/iamguarded/external-dns/bin
          ln -s /usr/bin/external-dns /opt/iamguarded/external-dns/bin/external-dns
      - uses: iamguarded/finalize-compat
        with:
          package: external-dns
          version: ${{vars.major-version}}
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            /opt/iamguarded/external-dns/bin/external-dns --version
            /opt/iamguarded/external-dns/bin/external-dns --help
        - uses: iamguarded/test-compat
          with:
            package: external-dns
            version: ${{vars.major-version}}

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/external-dns
    strip-prefix: v
    tag-filter: v0.18.

test:
  pipeline:
    # Basic smoke tests using reusable pipelines
    - uses: test/tw/ver-check
      with:
        bins: external-dns
    - uses: test/tw/help-check
      with:
        bins: external-dns
        expect-contains: "provider"
    # Verify expected DNS providers are available in help output
    - name: Verify DNS providers are available
      runs: |
        help_output=$(external-dns --help 2>&1)

        # Check for major cloud DNS providers
        echo "$help_output" | grep -F "aws" || {
          echo "FAIL: AWS provider not found in help output"
          exit 1
        }
        echo "$help_output" | grep -F "google" || {
          echo "FAIL: Google provider not found in help output"
          exit 1
        }
        echo "$help_output" | grep -F "azure" || {
          echo "FAIL: Azure provider not found in help output"
          exit 1
        }
        echo "$help_output" | grep -F "cloudflare" || {
          echo "FAIL: Cloudflare provider not found in help output"
          exit 1
        }
        echo "SUCCESS: All expected DNS providers are available"
    # Test that external-dns can start and initialize (fails with expected error)
    - name: Test minimal startup and initialization
      runs: |
        # external-dns should fail without a valid source, but should parse args
        # and show a meaningful error - this proves initialization works
        output=$(external-dns --source=service --provider=inmemory 2>&1 || true)

        # Check that it actually started and attempted to run
        # It should fail with a kubeconfig error since we're not in a cluster
        if echo "$output" | grep -iE "(kubeconfig|cluster|config|unable|failed|error)"; then
          echo "SUCCESS: external-dns initialized and reported expected configuration error"
        else
          echo "FAIL: Expected initialization output not found"
          echo "Actual output: $output"
          exit 1
        fi
    # Test dry-run mode can be invoked
    - name: Test dry-run flag is recognized
      runs: |
        # Check that --dry-run flag is accepted by the binary
        output=$(external-dns --help 2>&1)
        if echo "$output" | grep -F "dry-run"; then
          echo "SUCCESS: dry-run flag is available"
        else
          echo "FAIL: dry-run flag not found in help"
          exit 1
        fi
    # Test configuration validation with invalid provider
    - name: Test configuration validation with invalid provider
      runs: |
        # Use an invalid provider to test that validation catches it
        if output=$(external-dns --provider=invalid-provider-xyz 2>&1); then
          echo "FAIL: Expected failure with invalid provider but command succeeded"
          exit 1
        fi

        # Verify the error message mentions the invalid provider or unknown option
        if echo "$output" | grep -iE "(unknown|invalid|unsupported|error)"; then
          echo "SUCCESS: Configuration validation correctly rejects invalid provider"
        else
          echo "FAIL: Expected helpful error message for invalid provider"
          echo "Actual output: $output"
          exit 1
        fi
    # Test that interval parsing works
    - name: Test interval configuration parsing
      runs: |
        # Test with inmemory provider and valid interval to ensure parsing works
        # This should still fail due to no kubeconfig, but should parse the interval
        output=$(external-dns --source=service --provider=inmemory --interval=30s 2>&1 || true)

        # The command should not fail with an interval parsing error
        if echo "$output" | grep -iE "invalid.*interval|parse.*interval"; then
          echo "FAIL: Interval parsing failed"
          exit 1
        fi
        echo "SUCCESS: Interval configuration accepted"
