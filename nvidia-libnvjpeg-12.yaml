package:
  name: nvidia-libnvjpeg-12
  version: 12.3.0
  epoch: 0
  description: high-performance GPU-accelerated library for decoding, encoding and transcoding JPEG format images.
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-libnvjpeg=${{package.version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/libnvjpeg/linux-sbsa/libnvjpeg-linux-sbsa-12.3.0.81-archive.tar.xz"
          expected-sha256: "dc25a4b967c6fa8ddcea1f90448af7d18eb24d332639488fc9ed0316eb60a919"
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/libnvjpeg/linux-x86_64/libnvjpeg-linux-x86_64-12.3.0.81-archive.tar.xz"
          expected-sha256: "2ab40ef82d528b0ccdf5326754915f8d89991360d57ca56c58ff1c25c65c2236"

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.3/
      mv include ${{targets.destdir}}/usr/local/cuda-12.3/
      mv lib ${{targets.destdir}}/usr/local/cuda-12.3/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.3/${{package.name}}.LICENSE

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/pkgconfig/
      mv pkg-config/* ${{targets.destdir}}/usr/share/pkgconfig/
      sed -i 's|targets/.*-linux/||g' ${{targets.destdir}}/usr/share/pkgconfig/*

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
