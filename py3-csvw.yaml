package:
  name: py3-csvw
  version: 1.10.2
  epoch: 0
  description: CSV on the web
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: csvw

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cldf/csvw.git
      tag: v${{package.version}}
      expected-commit: 3f049d99d0462fccf3a547119304333dcc4f89c3

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-attrs
        - py${{range.key}}-isodate
        - py${{range.key}}-python-dateutil
        - py${{range.key}}-rfc3986
        - py${{range.key}}-uritemplate
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
