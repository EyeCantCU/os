package:
  name: chart-iamguarded-spark
  version: "10.0.3"
  epoch: 2
  description: Spark iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: spark/${{package.version}}
      expected-commit: 215c75892cfd0879a86024dc54e1db3c9b3f4018

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/spark

  - uses: charts/package
    with:
      chart-path: iamguarded/spark

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: spark/
    use-tag: true
    tag-filter-prefix: spark/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /spark
