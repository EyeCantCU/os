package:
  name: helm-fips
  version: "3.17.3"
  epoch: 1
  description: The Kubernetes Package Manager
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/helm/helm
      tag: v${{package.version}}
      expected-commit: e4da49785aa6e6ee2b86efd5dd9e43400318262b

  - uses: go/bump
    with:
      deps: |-
        github.com/docker/docker@v26.1.5
        golang.org/x/oauth2@v0.27.0
        github.com/containerd/containerd@v1.7.27
        golang.org/x/net@v0.38.0

  - runs: |
      make build CGO_ENABLED=1 LDFLAGS=-w TAGS=netgo,osusergo
      install -Dm755 ./bin/helm "${{targets.destdir}}/usr/bin/helm"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - name: Setup Helm
      runs: |
        helm repo add stable https://charts.helm.sh/stable
        helm repo update
        helm --help
    - name: Verify Helm Version
      runs: |
        helm version | grep "version.BuildInfo" || exit 1
    - name: Search Helm Chart
      runs: |
        helm search repo nginx | grep "nginx" || exit 1
    - name: Helm Lint
      runs: |
        helm create lint-test
        helm lint lint-test || exit 1
        rm -rf lint-test
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: helm/helm
    strip-prefix: v
