package:
  name: helm-fips
  version: 3.14.3
  epoch: 1
  description: The Kubernetes Package Manager
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-fips
  environment:
    CGO_ENABLED: "1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/helm/helm
      tag: v${{package.version}}
      expected-commit: f03cc04caaa8f6d7c3e67cf918929150cf6f3f12

  - uses: go/bump
    with:
      deps: golang.org/x/crypto@v0.21.0 google.golang.org/protobuf@v1.33.0
      go-version: 1.21

  - runs: |
      make build
      install -Dm755 ./bin/helm "${{targets.destdir}}/usr/bin/helm"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - busybox
        - curl
  pipeline:
    - name: Setup Helm
      runs: |
        helm repo add stable https://charts.helm.sh/stable
        helm repo update
    - name: Verify Helm Version
      runs: |
        helm version | grep "version.BuildInfo" || exit 1
    - name: Search Helm Chart
      runs: |
        helm search repo nginx | grep "nginx" || exit 1
    - name: Helm Lint
      runs: |
        helm create lint-test
        helm lint lint-test || exit 1
        rm -rf lint-test

update:
  enabled: true
  github:
    identifier: helm/helm
    strip-prefix: v
