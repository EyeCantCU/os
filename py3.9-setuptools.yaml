# Generated from https://pypi.org/project/setuptools/
package:
  name: py3.9-setuptools
  version: "78.0.1"
  epoch: 0
  description: Easily download, build, install, upgrade, and uninstall Python packages
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.9

environment:
  contents:
    packages:
      - busybox
      - python-3.9

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/s/setuptools/setuptools-${{package.version}}.tar.gz
      expected-sha256: 4321d2dc2157b976dee03e1037c9f2bc5fea503c0c47d3c9458e0e8e49e659ce

  - name: Python Build
    runs: python setup.py build

  - name: Python Install
    runs: python setup.py install --prefix=/usr --root="${{targets.destdir}}"

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        imports: import setuptools

update:
  enabled: true
  release-monitor:
    identifier: 4021
