package:
  name: chainguard-baselayout
  version: 20230214
  epoch: 13
  description: "baselayout data for Chainguard"
  copyright:
    - license: MIT
  dependencies:
    replaces:
      - wolfi-baselayout
    runtime:
      - glibc-locale-posix
      - wolfi-baselayout

environment:
  contents:
    packages:
      - busybox

pipeline:
  - name: Generate /etc/os-release
    runs: |
      mkdir -p ${{targets.destdir}}/etc
      cat >${{targets.destdir}}/etc/os-release <<EOF
      ID=chainguard
      NAME="Chainguard"
      PRETTY_NAME="Chainguard"
      VERSION_ID="${{package.version}}"
      HOME_URL="https://chainguard.dev/"
      EOF

  - name: Add secfixes.d
    runs: |
      mkdir -p ${{targets.destdir}}/etc/secfixes.d
      install -m644 chainguard ${{targets.destdir}}/etc/secfixes.d/chainguard

test:
  environment:
    contents:
      packages:
        - bash
        - coreutils
  pipeline:
    - name: "Scanner expectations"
      runs: |
        # This tells scanners which feed to look at.
        grep 'ID=chainguard' /etc/os-release

        # This tells most scanners which of a vendor's feeds to look at,
        # but as a rolling distro we should never be changing this, so
        # instead of using ${{package.version}} we hardcode this here
        # because only the epoch should really ever change.
        grep 'VERSION_ID="20230214"' /etc/os-release

update:
  enabled: false
  exclude-reason: |
    This package is a base package and does not need to be updated automatically
