package:
  name: seaweedfs-fips
  version: "3.97"
  epoch: 0 # GHSA-2464-8j7c-4cjm
  description: SeaweedFS is a fast distributed storage system for blobs, objects, files.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/seaweedfs/seaweedfs
      tag: ${{package.version}}
      expected-commit: 76452ab593995ab52b75e681de5b221de1e3f006

  - uses: go/build
    with:
      packages: ./weed
      output: weed
      go-package: go-fips-md5
      ldflags: -X github.com/seaweedfs/seaweedfs/weed/util/version.COMMIT=$(git rev-parse HEAD)

  - name: Add config file and entrypoint script
    runs: |
      mkdir -p ${{targets.destdir}}/etc/seaweedfs
      mkdir -p ${{targets.destdir}}/usr/bin
      cp ./docker/filer.toml ${{targets.destdir}}/etc/seaweedfs/filer.toml
      cp ./docker/entrypoint.sh ${{targets.destdir}}/usr/bin/entrypoint.sh
      chmod +x ${{targets.destdir}}/usr/bin/entrypoint.sh

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: weed entrypoint.sh
    - name: "help command"
      runs: |
        entrypoint.sh help
        weed help

update:
  enabled: true
  github:
    identifier: seaweedfs/seaweedfs
