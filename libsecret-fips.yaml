package:
  name: libsecret-fips
  version: "0.21.7"
  epoch: 0
  description: Library for storing and retrieving passwords and other secrets (FIPS)
  copyright:
    - license: LGPL-2.1
  dependencies:
    # Prevent apk add libsecret installing libsecret-fips
    provider-priority: 0
    # Yet still allow to directly install libsecret-fips to satisfy
    # libsecret dependencies
    provides:
      - libsecret=${{package.full-version}}
    runtime:
      - libgcrypt-al2023-fips

# creates a new var that contains only the major and minor version to be used in the fetch URL
# e.g. 0.21.0 will create a new var mangled-package-version=0.21
var-transforms:
  - from: ${{package.version}}
    match: (\d+\.\d+)\.\d+
    replace: $1
    to: mangled-package-version

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - dbus
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - libgcrypt-al2023-fips-dev
      - libxslt-dev
      - meson
      - posix-libc-utils
      - py3-packaging
      - vala

pipeline:
  - uses: fetch
    with:
      expected-sha256: 6b452e4750590a2b5617adc40026f28d2f4903de15f1250e1d1c40bfd68ed55e
      uri: https://download.gnome.org/sources/libsecret/${{vars.mangled-package-version}}/libsecret-${{package.version}}.tar.xz

  - uses: meson/configure
    with:
      opts: |
        --default-library=both \
        -Dgtk_doc=false \
        -Dmanpage=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-static
    pipeline:
      - uses: split/static
    description: libsecret-fips static

  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      provider-priority: 0
      provides:
        - libsecret-dev=${{package.full-version}}
      runtime:
        - ${{package.name}}
        - libsecret-fips-lang
    description: libsecret-fips dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-lang
    pipeline:
      - uses: split/locales
    dependencies:
      provider-priority: 0
      provides:
        - libsecret-lang=${{package.full-version}}
    description: libsecret-fips locales

update:
  enabled: true
  release-monitor:
    identifier: 13150

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify secret-tool runs
      runs: |
        secret-tool --help 2>&1 | grep -F "secret-tool"
    - name: Verify FIPS mode enabled
      runs: |
        stat /etc/gcrypt/fips_enabled
