package:
  name: cert-manager-webhook-pdns-fips
  version: "2.5.2"
  epoch: 6
  description: A PowerDNS webhook for cert-manager
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/zachomedia/cert-manager-webhook-pdns
      tag: v${{package.version}}
      expected-commit: 0c44f1340426a5e910a3fc7b06dbd05611ac1592

  - name: Downgrade Go to 1.23 for FIPS
    runs: |
      # we are using go 1.23 because go-fips-1.24 is not available yet
      sed -i 's/go 1\.24\(\.[0-9]*\)\?/go 1.23/' go.mod
      go mod tidy

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      output: webhook
      packages: .
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: zachomedia/cert-manager-webhook-pdns
    strip-prefix: v
  ignore-regex-patterns:
    - 'cert-manager-webhook-pdns-'

# https://github.com/zachomedia/cert-manager-webhook-pdns/blob/bf4d525dca7345538aaad8840f6315a73c27f38b/README.md?plain=1#L45
test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
    environment:
      GROUP_NAME: "acme.zacharyseguin.ca"
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        webhook -h
