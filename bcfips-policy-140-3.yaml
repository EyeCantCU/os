package:
  name: bcfips-policy-140-3
  version: 1
  epoch: 17
  description: Java security policy using BouncyCastle FIPS 140-3
  copyright:
    - license: MIT

vars:
  bc-version: 2.1

data:
  - name: openjdk-versions
    items:
      11: ""
      17: ""
      21: ""

  - name: openjdk-crac-versions
    items:
      17: ""
      21: ""

  - name: adoptium-versions
    items:
      11: ""
      17: ""
      21: ""

  - name: corretto-versions
    items:
      11: ""
      17: ""
      21: ""

  - name: graalvm-versions
    items:
      23: ""

  - name: liberica-versions
    items:
      11: ""
      17: ""
      21: ""

environment:
  contents:
    packages:
      - busybox

pipeline:
  - name: Package policy
    runs: |
      mkdir -p "${{targets.contextdir}}/usr/lib/jvm/jdk-fips-config"
      cp java.policy unapproved.java.security "${{targets.contextdir}}/usr/lib/jvm/jdk-fips-config"

  - name: Package test suite
    runs: |
      mkdir -p ${{targets.contextdir}}/usr/lib/${{package.name}}/
      cp Test.java test.sh ${{targets.contextdir}}/usr/lib/${{package.name}}/

  - name: Make maven just work
    runs: |
      mkdir -p ${{targets.contextdir}}/etc
      cp mavenrc ${{targets.contextdir}}/etc

subpackages:
  - range: openjdk-versions
    name: openjdk-${{package.name}}-j${{range.key}}
    description: Java ${{range.key}} security policy using BouncyCastle FIPS 140-3 for OpenJDK
    dependencies:
      provides:
        - ${{package.name}}-j${{range.key}}=${{package.full-version}}
      runtime:
        - bcfips-policy-140-3
        - bouncycastle-fips~${{vars.bc-version}}
      replaces:
        - openjdk-${{range.key}}
        - openjdk-${{range.key}}-jre
        - openjdk-${{range.key}}-jre-base
    pipeline:
      - name: Create the FIPS configuration for OpenJDK ${{range.key}}
        runs: |
          _java_home="usr/lib/jvm/java-${{range.key}}-openjdk"
          mkdir -p "${{targets.contextdir}}/$_java_home/conf/security"
          cp java.security "${{targets.contextdir}}/$_java_home/conf/security"

  - range: openjdk-versions
    name: openjdk-${{package.name}}-additional-sun-providers-j${{range.key}}
    description: "Java ${{range.key}} security policy using BouncyCastle FIPS 140-3 for OpenJDK"
    dependencies:
      provides:
        - ${{package.name}}-additional-sun-providers-j${{range.key}}=${{package.full-version}}
      runtime:
        - bcfips-policy-140-3
        - bouncycastle-fips~${{vars.bc-version}}
      replaces:
        - openjdk-${{range.key}}
        - openjdk-${{range.key}}-jre
        - openjdk-${{range.key}}-jre-base
    pipeline:
      - name: Add additional sun providers for OpenJDK ${{range.key}}
        runs: |
          _java_home="usr/lib/jvm/java-${{range.key}}-openjdk"
          mkdir -p "${{targets.contextdir}}/$_java_home/conf/security"
          cp additional-sun-providers-java.security "${{targets.contextdir}}/$_java_home/conf/security"

  - range: openjdk-crac-versions
    name: openjdk-crac-${{package.name}}-j${{range.key}}
    description: Java ${{range.key}} security policy using BouncyCastle FIPS 140-3 for OpenJDK CRaC
    dependencies:
      runtime:
        - bcfips-policy-140-3
        - bouncycastle-fips~${{vars.bc-version}}
      replaces:
        - openjdk-crac-${{range.key}}
        - openjdk-crac-${{range.key}}-jre
        - openjdk-crac-${{range.key}}-jre-base
    pipeline:
      - name: Create the FIPS configuration for OpenJDK CRaC ${{range.key}}
        runs: |
          _java_home="usr/lib/jvm/java-${{range.key}}-openjdk-crac"
          mkdir -p "${{targets.contextdir}}/$_java_home/conf/security"
          cp java.security "${{targets.contextdir}}/$_java_home/conf/security"

  - range: openjdk-crac-versions
    name: openjdk-crac-${{package.name}}-additional-sun-providers-j${{range.key}}
    description: "Java ${{range.key}} security policy using BouncyCastle FIPS 140-3 for OpenJDK CRaC"
    dependencies:
      runtime:
        - bcfips-policy-140-3
        - bouncycastle-fips~${{vars.bc-version}}
      replaces:
        - openjdk-crac-${{range.key}}
        - openjdk-crac-${{range.key}}-jre
        - openjdk-crac-${{range.key}}-jre-base
    pipeline:
      - name: Add additional sun providers for OpenJDK CRaC ${{range.key}}
        runs: |
          _java_home="usr/lib/jvm/java-${{range.key}}-openjdk-crac"
          mkdir -p "${{targets.contextdir}}/$_java_home/conf/security"
          cp additional-sun-providers-java.security "${{targets.contextdir}}/$_java_home/conf/security"

  - range: adoptium-versions
    name: adoptium-openjdk-${{package.name}}-j${{range.key}}
    description: Java ${{range.key}} security policy using BouncyCastle FIPS 140-3 for Adoptium
    dependencies:
      runtime:
        - bcfips-policy-140-3
        - bouncycastle-fips~${{vars.bc-version}}
      replaces:
        - adoptium-openjdk-${{range.key}}
        - adoptium-openjdk-${{range.key}}-jre
        - adoptium-openjdk-${{range.key}}-jre-base
    pipeline:
      - name: Create the FIPS configuration for Adoptium ${{range.key}}
        runs: |
          _java_home="usr/lib/jvm/java-${{range.key}}-adoptium"
          mkdir -p "${{targets.contextdir}}/$_java_home/conf/security"
          cp java.security "${{targets.contextdir}}/$_java_home/conf/security"

  - range: adoptium-versions
    name: adoptium-openjdk-${{package.name}}-additional-sun-providers-j${{range.key}}
    description: "Java ${{range.key}} security policy using BouncyCastle FIPS 140-3 for Adoptium"
    dependencies:
      runtime:
        - bcfips-policy-140-3
        - bouncycastle-fips~${{vars.bc-version}}
      replaces:
        - adoptium-openjdk-${{range.key}}
        - adoptium-openjdk-${{range.key}}-jre
        - adoptium-openjdk-${{range.key}}-jre-base
    pipeline:
      - name: Add additional sun providers for Adoptium ${{range.key}}
        runs: |
          _java_home="usr/lib/jvm/java-${{range.key}}-adoptium"
          mkdir -p "${{targets.contextdir}}/$_java_home/conf/security"
          cp additional-sun-providers-java.security "${{targets.contextdir}}/$_java_home/conf/security"

  - range: corretto-versions
    name: corretto-${{package.name}}-j${{range.key}}
    description: Java ${{range.key}} security policy using BouncyCastle FIPS 140-3 for Corretto
    dependencies:
      runtime:
        - bcfips-policy-140-3
        - bouncycastle-fips~${{vars.bc-version}}
      replaces:
        - corretto-${{range.key}}
        - corretto-${{range.key}}-jre
    pipeline:
      - name: Create the FIPS configuration for Corretto ${{range.key}}
        runs: |
          _java_home="usr/lib/jvm/java-${{range.key}}-amazon-corretto"
          mkdir -p "${{targets.contextdir}}/$_java_home/conf/security"
          cp java.security "${{targets.contextdir}}/$_java_home/conf/security"

  - range: graalvm-versions
    name: graalvm-${{package.name}}-j${{range.key}}
    description: Java ${{range.key}} security policy using BouncyCastle FIPS 140-3 for GraalVM
    dependencies:
      runtime:
        - bcfips-policy-140-3
        - bouncycastle-fips~${{vars.bc-version}}
      replaces:
        - graalvm-${{range.key}}-ce
        - graalvm-${{range.key}}-ce-nodejs
    pipeline:
      - name: Create the FIPS configuration for GraalVM ${{range.key}}
        runs: |
          _java_home="usr/lib/jvm/java-${{range.key}}-graalvm"
          mkdir -p "${{targets.contextdir}}/$_java_home/conf/security"
          cp java.security "${{targets.contextdir}}/$_java_home/conf/security"

  - range: liberica-versions
    name: liberica-${{package.name}}-j${{range.key}}
    description: Java ${{range.key}} security policy using BouncyCastle FIPS 140-3 for Liberica
    dependencies:
      runtime:
        - bcfips-policy-140-3
        - bouncycastle-fips~${{vars.bc-version}}
      replaces:
        - liberica-${{range.key}}
        - liberica-${{range.key}}-jre
    pipeline:
      - name: Create the FIPS configuration for Corretto ${{range.key}}
        runs: |
          _java_home="usr/lib/jvm/java-${{range.key}}-liberica"
          mkdir -p "${{targets.contextdir}}/$_java_home/conf/security"
          cp java.security "${{targets.contextdir}}/$_java_home/conf/security"

test:
  environment:
    contents:
      packages:
        - maven
  pipeline:
    - uses: java-fips/algorithms
      with:
        java-version: 11
    - uses: java-fips/algorithms
      with:
        java-version: 17
    - uses: java-fips/algorithms
      with:
        java-version: 21
    - uses: java-fips/algorithms
      with:
        java-distro: openjdk-crac
        java-version: 17
    - uses: java-fips/algorithms
      with:
        java-distro: openjdk-crac
        java-version: 21
    - uses: java-fips/algorithms
      with:
        java-distro: adoptium-openjdk
        java-version: 11
    - uses: java-fips/algorithms
      with:
        java-distro: adoptium-openjdk
        java-version: 17
    - uses: java-fips/algorithms
      with:
        java-distro: adoptium-openjdk
        java-version: 21
    - uses: java-fips/algorithms
      with:
        java-distro: corretto
        java-home: "/usr/lib/jvm/java-11-amazon-corretto"
        java-version: 11
    - uses: java-fips/algorithms
      with:
        java-distro: corretto
        java-version: 17
        java-home: "/usr/lib/jvm/java-17-amazon-corretto"
    - uses: java-fips/algorithms
      with:
        java-distro: corretto
        java-home: "/usr/lib/jvm/java-21-amazon-corretto"
        java-version: 21
    - uses: java-fips/algorithms
      with:
        java-distro: graalvm
        java-version: 23
    - uses: git-checkout
      with:
        repository: https://github.com/apache/maven
        tag: maven-3.9.9
        expected-commit: 8e8579a9e76f7d015ee5ec7bfcdc97d260186937
        destination: maven
    - working-directory: maven
      runs: |
        export LANG=en_US.UTF-8
        export JAVA_HOME=/usr/lib/jvm/java-21-openjdk
        mvn clean package

update:
  manual: true
  exclude-reason: |
    Auxiliary package maintained in this enterprise-packages.
