package:
  name: dbt-snowflake
  version: "1.10.4"
  epoch: 0
  description: dbt Snowflake adapter - data transformation tool for Snowflake
  copyright:
    - license: Apache-2.0
  options:
    # Don't resolve dependencies from libraries bundled in the virtual environment
    no-depends: true
    # Don't provide libraries bundled in the virtual environment to other packages
    no-provides: true
  dependencies:
    runtime:
      - python-${{vars.python-version}}

vars:
  venv-home: '/usr/share/dbt-snowflake/venv'
  python-version: '3.12'

environment:
  contents:
    packages:
      - busybox
      - python-${{vars.python-version}}
      - uv

pipeline:
  - runs: |
      # Create virtual environment
      uv venv "${{vars.venv-home}}" --system-site-packages
      source "${{vars.venv-home}}/bin/activate"

      # Install dbt-snowflake (automatically includes dbt-core)
      uv pip install dbt-snowflake==${{package.version}}

      # Remove pip and virtualenv from virtual environment
      # pip doesn't need to be present in the virtual environment,
      # the venv can be managed via a system installed package manager
      # virtualenv vendors an outdated and unused pip wheel
      uv pip uninstall pip virtualenv

      # Install virtual environment to package
      mkdir -p "${{targets.contextdir}}/usr/share/dbt-snowflake"
      cp -a "${{vars.venv-home}}" "${{targets.contextdir}}/usr/share/dbt-snowflake/"

      # Symlink dbt to /usr/bin for easy CLI access
      mkdir -p "${{targets.contextdir}}/usr/bin"
      ln -sf "${{vars.venv-home}}/bin/dbt" "${{targets.contextdir}}/usr/bin/dbt"

      # Ensure lockfile isn't world-writeable
      chmod 644 "${{targets.contextdir}}/${{vars.venv-home}}/.lock"

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility package for dbt-snowflake container images
    options:
      no-depends: true
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          # Symlink libstdc++ from usr/lib to /usr/lib/$(uname -m)-linux-gnu/
          mkdir -p "${{targets.subpkgdir}}/usr/lib/$(uname -m)-linux-gnu"
          ln -sf /usr/lib/libstdc++.so.6 "${{targets.subpkgdir}}/usr/lib/$(uname -m)-linux-gnu/"
    test:
      pipeline:
        - runs: stat "/usr/lib/$(uname -m)-linux-gnu/libstdc++.so.6"

  - name: ${{package.name}}-oci-entrypoint
    description: OCI entrypoint for dbt-snowflake images (drop-in replacement for official dbt images)
    dependencies:
      runtime:
        - ${{package.name}}
        - bash
    pipeline:
      - runs: |
          # Create working directory matching official dbt images
          mkdir -p "${{targets.contextdir}}/usr/app/dbt"

          # Create profiles directory
          mkdir -p "${{targets.contextdir}}/root/.dbt"

          # Create wrapper script that sources venv and runs dbt
          mkdir -p "${{targets.contextdir}}/usr/local/bin"
          printf '%s\n' \
            '#!/bin/bash' \
            'set -euo pipefail' \
            'source /usr/share/dbt-snowflake/venv/bin/activate' \
            'exec dbt "$@"' \
            > "${{targets.contextdir}}/usr/local/bin/dbt-entrypoint"
          chmod +x "${{targets.contextdir}}/usr/local/bin/dbt-entrypoint"
    test:
      pipeline:
        - runs: |
            stat /usr/local/bin/dbt-entrypoint
            stat /usr/app/dbt
            stat /root/.dbt

update:
  enabled: true
  ignore-regex-patterns:
    - 'rc\d+$'
    - 'b\d+$'
    - 'a\d+$'
  github:
    identifier: dbt-labs/dbt-snowflake
    use-tag: true
    tag-filter-prefix: v

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-compat
        - bash
  pipeline:
    - runs: |
        set -euo pipefail
        source "${{vars.venv-home}}/bin/activate"
        dbt --version
        # Verify snowflake adapter is available
        dbt --version | grep -F "snowflake"
    - uses: test/tw/pip-check
      with:
        python: ${{vars.venv-home}}/bin/python${{vars.python-version}}
    - uses: test/tw/ldd-check
