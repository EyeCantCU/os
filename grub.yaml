package:
  name: grub
  version: "2.12"
  epoch: 45
  description: "the grand unified bootloader"
  copyright:
    - license: GPL-3.0
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  environment:
    GCC_SPEC_FILE: /dev/null
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - binutils
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - device-mapper-libs
      - flex
      - fuse3-dev
      - fuse3-libs
      - gawk
      - gcc-14-default
      - gettext
      - gettext-dev
      - libpcre2-8-0
      - libtool
      - lvm2-dev
      - patch
      - pcre2-dev
      - pkgconf
      - pkgconf-dev
      - posix-libc-utils
      - python3
      - systemd-dev
      - wolfi-base
      - xz-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.savannah.gnu.org/git/grub.git
      tag: grub-${{package.version}}
      expected-commit: 5ca9db22e8ed0dbebb2aec53722972de0680a463

  - runs: |
      set -x
      # Grub compiles with our standard CFLAGS, however grub-install doesn't actually work if we enable -O2 or -Wp,-D_FORTIFY_SOURCE=3
      export CFLAGS="${CFLAGS/-Wp,-D_FORTIFY_SOURCE=3/}"
      export CPPFLAGS="${CPPFLAGS/-Wp,-D_FORTIFY_SOURCE=3/}"
      export CFLAGS="${CFLAGS/-O2/}"
      export CPPFLAGS="${CPPFLAGS/-O2/}"
      ./bootstrap
      # Build bios grub
      case $(uname -m) in
        x86_64)
          ./configure --target=i386 --with-platform=pc --prefix=/usr --bindir=/usr/bin --sbindir=/usr/bin
        ;;
        aarch64)
          ./configure --target=aarch64 --prefix=/usr --bindir=/usr/bin --sbindir=/usr/bin
        ;;
      esac
      make "-j$(nproc)"
      ls -halF grub-install
      make install DESTDIR="${{targets.destdir}}"
      # "- uses: strip" isn't actually stripping these files, so I'm doing it manually here
      strip ${{targets.destdir}}/usr/bin/grub-* || true

  - uses: strip

subpackages:
  - name: grub-efi
    description: "the grand unified bootloader for uefi"
    pipeline:
      - runs: |
          set -x
          make clean
          ./bootstrap
          # Build uefi grub
          ./configure --target="$(uname -m)" --with-platform=efi  --prefix=/usr --bindir=/usr/bin --sbindir=/usr/bin
          make "-j$(nproc)"
          ls -halF grub-install
          make install DESTDIR="${{targets.subpkgdir}}"
          # "- uses: strip" isn't actually stripping these files, so I'm doing it manually here
          strip ${{targets.subpkgdir}}/usr/bin/grub-* || true
      - uses: strip
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

test:
  pipeline:
    - runs: |
        # Make sure our main file is installed an executable
        grub-bios-setup --help
        grub-bios-setup --version
        grub-editenv --help
        grub-editenv --version
        grub-file --help
        grub-fstest --help
        grub-fstest --version
        grub-glue-efi --help
        grub-glue-efi --version
        grub-install --help
        grub-install --version
        grub-kbdcomp --help
        grub-kbdcomp --version
        grub-macbless --help
        grub-macbless --version
        grub-menulst2cfg --help
        grub-menulst2cfg --version
        grub-mkconfig --help
        grub-mkconfig --version
        grub-mkimage --help
        grub-mkimage --version
        grub-mklayout --help
        grub-mklayout --version
        grub-mknetdir --help
        grub-mknetdir --version
        grub-mkpasswd-pbkdf2 --help
        grub-mkpasswd-pbkdf2 --version
        grub-mkrelpath --help
        grub-mkrelpath --version
        grub-mkrescue --help
        grub-mkrescue --version
        grub-mkstandalone --help
        grub-mkstandalone --version
        grub-mount --help
        grub-mount --version
        grub-probe --help
        grub-probe --version
        grub-reboot --help
        grub-reboot --version
        grub-render-label --help
        grub-render-label --version
        grub-script-check --help
        grub-script-check --version
        grub-set-default --help
        grub-set-default --version
        grub-sparc64-setup --help
        grub-sparc64-setup --version
        grub-syslinux2cfg --help
        grub-syslinux2cfg --version

update:
  enabled: true
  release-monitor:
    identifier: 1257
