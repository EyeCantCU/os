package:
  name: openssl-config-fipshardened
  version: 3.4.0
  epoch: 3
  description: "Hardened FIPS cryptographic configuration policy for OpenSSL"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openssl-provider-fips~3.0.9
      - openssl-fips-test

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      mkdir -p "${{targets.destdir}}"/etc/ssl
      cp policy-preamble.cnf "${{targets.destdir}}"/etc/ssl/openssl.cnf

test:
  environment:
    contents:
      packages:
        - gdb
        - openssl
        - openssl-dbg
  pipeline:
    - name: Verify only jitter entropy source is in use
      runs: |
        # Possibly python gdb would be easier to read
        cat <<EOF >openssl.gdb
        set pagination off
        set logging file gdb.log
        set logging on
        set width 0
        set height 0
        set verbose off
        set breakpoint pending on
        break get_jitter_random_value
        commands 1
          continue
        end
        break syscall_random
        commands 2
          continue
        end
        run rand -hex 8
        run genrsa -out /dev/null
        run ecparam -name prime256v1 -genkey
        run genpkey -algorithm ed25519
        EOF
        gdb --batch --command ./openssl.gdb openssl
        # Assert that jitter entropy is used
        grep -q 'Breakpoint 1,' gdb.log || exit 1
        # Assert that getrandom syscall wrapper is not used
        grep -q 'Breakpoint 2,' gdb.log && exit 1

update:
  enabled: true
  release-monitor:
    identifier: 2566
