package:
  name: consul-k8s-fips-1.5
  version: "1.5.9"
  epoch: 8 # GHSA-j5w8-q4qc-rx2x
  description: The consul-k8s includes first-class integrations between Consul and Kubernetes.
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - go-discover-fips
    provides:
      - consul-k8s-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - oldglibc~2.28

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/consul-k8s
      expected-commit: 35b34efbf84f15acbed3fc6fe89c3ed1f99416fb
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: control-plane

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v3@v3.0.4
        golang.org/x/crypto@v0.45.0
      modroot: ./acceptance

  - uses: go/bump
    with:
      deps: |-
        helm.sh/helm/v3@v3.18.5
        github.com/containerd/containerd@v1.7.29
        golang.org/x/crypto@v0.45.0
      replaces: |-
        github.com/envoyproxy/go-control-plane=github.com/envoyproxy/go-control-plane@v0.12.0 github.com/envoyproxy/go-control-plane/contrib=github.com/envoyproxy/go-control-plane/contrib@v0.12.0
      modroot: cli

  - uses: go/build
    with:
      go-package: go-fips
      modroot: ./control-plane/cni
      output: consul-cni
      packages: .

  - uses: go/build
    with:
      go-package: go-fips
      modroot: ./control-plane
      output: consul-k8s-control-plane
      packages: .

subpackages:
  - name: ${{package.name}}-cli
    description: "CLI for interacting with Consul on Kubernetes"
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          modroot: ./cli
          output: consul-k8s
          packages: .
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: ${{subpkg.name}}
        - name: Verify help
          runs: |
            consul-k8s --help

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.5.

test:
  pipeline:
    - name: Verify help
      runs: |
        consul-cni --help
        consul-k8s-control-plane --help
        consul-cni --version
        consul-k8s-control-plane --version
    - uses: test/go-fips-check
