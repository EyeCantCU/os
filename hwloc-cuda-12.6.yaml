package:
  name: hwloc-cuda-12.6
  version: "2.12.2"
  epoch: 1
  description: Portable abstraction of hierarchical hardware architectures with CUDA support
  copyright:
    - license: BSD-3-Clause
  dependencies:
    replaces:
      - hwloc
    provides:
      - hwloc=${{package.version}}
      - so:libhwloc.so.15
    runtime:
      - cairo
      - eudev-libs
      - libxml2-16
      - ncurses
      - numactl
      - nvidia-cuda-cudart-${{vars.cuda-version}}
  options:
    no-depends: true
    no-provides: true

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cairo-dev
      - eudev-dev
      - libxml2-dev
      - merged-usrsbin
      - ncurses-dev
      - nvidia-cuda-cudart-${{vars.cuda-version}}
      - nvidia-cuda-cudart-${{vars.cuda-version}}-dev
      - nvidia-cuda-nvcc-${{vars.cuda-version}}
      - nvidia-cuda-nvcc-${{vars.cuda-version}}-dev
      - nvidia-cuda-nvml-dev-${{vars.cuda-version}}
      - wolfi-baselayout
  environment:
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
    LIBRARY_PATH: /usr/local/cuda-${{vars.cuda-version}}/lib64:/usr/local/cuda-${{vars.cuda-version}}/lib

var-transforms:
  - from: ${{package.version}}
    match: (\d+\.\d+)\.\d+
    replace: $1
    to: mangled-package-version
  - from: ${{package.name}}
    match: .*cuda-(\d+\.\d+)
    replace: $1
    to: cuda-version

pipeline:
  - uses: fetch
    with:
      expected-sha256: 563e61d70febb514138af0fac36b97621e01a4aacbca07b86e7bd95b85055ba0
      uri: https://download.open-mpi.org/release/hwloc/v${{vars.mangled-package-version}}/hwloc-${{package.version}}.tar.bz2

  - uses: autoconf/configure
    with:
      opts: |
        --with-cuda-version=${{vars.cuda-version}} \
        --with-cuda=/usr/local/cuda-${{vars.cuda-version}} \
        --enable-plugins

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      if [[ "${{build.arch}}" == "x86_64" ]]; then
        mkdir -p ${{targets.destdir}}/usr/bin
        mv ${{targets.destdir}}/usr/sbin/* ${{targets.destdir}}/usr/bin
        rmdir ${{targets.destdir}}/usr/sbin
      fi

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: hwloc dev
    pipeline:
      - uses: split/dev
    options:
      # Avoid a sca dependency on so:libhwloc.so.XX, we specifically
      # want the one in ${{package.name}}.
      no-depends: true
    dependencies:
      runtime:
        - ${{package.name}}==${{package.full-version}}
        - merged-usrsbin
        - wolfi-baselayout
      replaces:
        - hwloc-dev
      provides:
        - hwloc-dev=${{package.version}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: hwloc manpages
    dependencies:
      replaces:
        - hwloc-doc
      provides:
        - hwloc-doc=${{package.version}}
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: open-mpi/hwloc
    strip-prefix: hwloc-
    tag-filter: hwloc-
    use-tag: true

test:
  environment:
    contents:
      packages:
        # provide a stub libnvidia-ml to pass ldd-check.
        # IRL, hosts will inject this lib into the container.
        - libnvidia-ml-stub-cuda-${{vars.cuda-version}}-dev
    environment:
      CUDA_HOME: "/usr/local/cuda-${{vars.cuda-version}}"
  pipeline:
    - if: ${{build.arch}} == 'x86_64'
      name: hwloc-gather-cpuid version and help tests
      runs: |
        hwloc-gather-cpuid --version
        hwloc-gather-cpuid --help
        hwloc-dump-hwdata --version
        hwloc-dump-hwdata --help
    - name: General version and help tests
      runs: |
        hwloc-ls
        hwloc-annotate --version
        hwloc-annotate --help
        hwloc-bind --version
        hwloc-bind --help
        hwloc-calc --version
        hwloc-calc --help
        hwloc-compress-dir --version
        hwloc-compress-dir --help
        hwloc-diff --version
        hwloc-diff --help
        hwloc-distrib --version
        hwloc-distrib --help
        hwloc-gather-topology --version
        hwloc-gather-topology --help
        hwloc-info --version
        hwloc-info --help
        hwloc-ls --version
        hwloc-ls --help
        hwloc-patch --version
        hwloc-patch --help
        hwloc-ps --version
        hwloc-ps --help
        lstopo --version
        lstopo --help
        lstopo-no-graphics --version
        lstopo-no-graphics --help
    - uses: test/tw/ldd-check
