package:
  name: aws-efs-csi-driver-fips-1.6
  version: 1.6.0
  epoch: 10
  description: CSI driver for Amazon EFS.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - efs-utils # pull in nfs-utils & busybox
      - mount
      - openssl
      - py3-botocore # required for cross account mount: https://github.com/kubernetes-sigs/aws-efs-csi-driver/blob/master/Dockerfile#L52
      - tcpdump
      - umount

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
      - wolfi-baselayout

pipeline:
  # We can't use go/install because this requires specific ldflags to set the version
  - uses: git-checkout
    with:
      expected-commit: 62b0a9e1ee3e875ecbc739bcd727e46852a331bb
      repository: https://github.com/kubernetes-sigs/aws-efs-csi-driver
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.23.0 k8s.io/apiserver@v0.25.16 google.golang.org/grpc@v1.56.3 google.golang.org/protobuf@v1.33.0 github.com/golang/protobuf@v1.5.4 k8s.io/kubernetes@v1.27.13
      replaces: k8s.io/apiserver=k8s.io/apiserver@v0.27.13 k8s.io/apimachinery=k8s.io/apimachinery@v0.27.13 k8s.io/api=k8s.io/api@v0.27.13 k8s.io/client-go=k8s.io/client-go@v0.27.13 k8s.io/component-base=k8s.io/component-base@v0.27.13

  - runs: |
      # Our global LDFLAGS conflict with a Makefile parameter
      unset LDFLAGS
      make ARCH=$(go env GOARCH)
      install -Dm755 bin/aws-efs-csi-driver ${{targets.destdir}}/usr/bin/aws-efs-csi-driver

      mkdir -p ${{targets.destdir}}/etc/amazon/efs
      cp THIRD-PARTY ${{targets.destdir}}/
      # Ref: https://github.com/kubernetes-sigs/aws-efs-csi-driver/blob/master/Dockerfile#L86
      mkdir -p ${{targets.destdir}}/etc/amazon/efs-static-files

  - uses: strip

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/aws-efs-csi-driver
    strip-prefix: v
    use-tag: true
    tag-filter: v1.6.
