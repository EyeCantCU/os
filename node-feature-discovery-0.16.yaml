package:
  name: node-feature-discovery-0.16
  version: "0.16.8"
  epoch: 0
  description: Node feature discovery for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - node-feature-discovery=${{package.full-version}}

environment:
  contents:
    packages:
      - protoc

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/node-feature-discovery
      tag: v${{package.version}}
      expected-commit: 34264759652bc005415b9e8f6c790eafd65880fd

  - name: copy conf
    runs: |
      mkdir -p ${{targets.contextdir}}/etc/kubernetes/node-feature-discovery/
      cp ./deployment/components/worker-config/nfd-worker.conf.example ${{targets.contextdir}}/etc/kubernetes/node-feature-discovery/nfd-worker.conf

  - uses: go/bump
    with:
      # Excess gobumps to make sure we don't run into api version mismatches (which did happen without them)
      # These are all k8s.io items with matching versions in the go.mod
      deps: |-
        k8s.io/cli-runtime@v0.30.10
        k8s.io/cluster-bootstrap@v0.30.10
        k8s.io/cri-api@v0.30.10
        k8s.io/kube-aggregator@v0.30.10
        k8s.io/kube-proxy@v0.30.10
        k8s.io/kube-scheduler@v0.30.10
        k8s.io/legacy-cloud-providers@v0.30.10
        k8s.io/metrics@v0.30.10
        k8s.io/mount-utils@v0.30.10
        k8s.io/sample-apiserver@v0.30.10
        golang.org/x/oauth2@v0.27.0
      modroot: .

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/kubectl-nfd
      output: kubectl-nfd
      tags: osusergo,netgo
      ldflags: "-X sigs.k8s.io/node-feature-discovery/pkg/version.version=${{package.version}} -X sigs.k8s.io/node-feature-discovery/pkg/utils/hostpath.pathPrefix=/host-"
      go-package: go

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/nfd-gc
      output: nfd-gc
      tags: osusergo,netgo
      ldflags: "-X sigs.k8s.io/node-feature-discovery/pkg/version.version=${{package.version}} -X sigs.k8s.io/node-feature-discovery/pkg/utils/hostpath.pathPrefix=/host-"
      go-package: go

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/nfd-master
      output: nfd-master
      tags: osusergo,netgo
      ldflags: "-X sigs.k8s.io/node-feature-discovery/pkg/version.version=${{package.version}} -X sigs.k8s.io/node-feature-discovery/pkg/utils/hostpath.pathPrefix=/host-"
      go-package: go

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/nfd-topology-updater
      output: nfd-topology-updater
      tags: osusergo,netgo
      ldflags: "-X sigs.k8s.io/node-feature-discovery/pkg/version.version=${{package.version}} -X sigs.k8s.io/node-feature-discovery/pkg/utils/hostpath.pathPrefix=/host-"
      go-package: go

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/nfd-worker
      output: nfd-worker
      tags: osusergo,netgo
      ldflags: "-X sigs.k8s.io/node-feature-discovery/pkg/version.version=${{package.version}} -X sigs.k8s.io/node-feature-discovery/pkg/utils/hostpath.pathPrefix=/host-"
      go-package: go

  - uses: strip

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/node-feature-discovery
    strip-prefix: v
    use-tag: true
    tag-filter: v0.16.

test:
  pipeline:
    - runs: |
        kubectl-nfd -h
        nfd-gc -version
        nfd-master -version
        nfd-topology-updater -version
        nfd-worker -version
        kubectl-nfd --help
        nfd-gc --version
        nfd-gc --help
        nfd-master --version
        nfd-master --help
        nfd-topology-updater --version
        nfd-topology-updater --help
        nfd-worker --version
        nfd-worker --help
