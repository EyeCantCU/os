package:
  name: ltp
  version: 20240524
  epoch: 0
  description: "The Linux Test Project"
  copyright:
    - license: GPL-2.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bison
      - build-base
      - flex
      - git
      - m4
      - make
      - pkgconf
      - pkgconf-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/linux-test-project/ltp
      tag: ${{package.version}}
      expected-commit: 8f21ebba42216dbb7e8d44c23b4a977d6823f7a1

  - runs: |
      make autotools
      ./configure
      make -j $(nproc)
      make install DESTDIR="${{targets.destdir}}"

  - uses: strip

update:
  enabled: true
  github:
    identifier: linux-test-project/ltp
    use-tag: true

test:
  pipeline:
    - runs: |
        [ -x "/opt/ltp/runltp" ] || echo "ERROR: runltp not installed properly" 2>&1
