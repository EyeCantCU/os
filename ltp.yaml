package:
  name: ltp
  version: "20250530"
  epoch: 0
  description: "The Linux Test Project"
  copyright:
    - license: GPL-2.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bison
      - build-base
      - flex
      - git
      - m4
      - make
      - pkgconf
      - pkgconf-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/linux-test-project/ltp
      tag: ${{package.version}}
      expected-commit: 14331e1ecfcd63426c9d270d88b7bad9f60c6d64

  - runs: |
      make autotools
      ./configure
      make -j $(nproc)
      make install DESTDIR="${{targets.destdir}}"

  - uses: strip

update:
  enabled: true
  github:
    identifier: linux-test-project/ltp
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/opt/ltp/testcases/data/ldd01/"
    - runs: |
        [ -x "/opt/ltp/runltp" ] || echo "ERROR: runltp not installed properly" 2>&1
