package:
  name: ginkgo
  version: "2.24.0"
  epoch: 0 # CVE-2025-47907
  description: A Modern Testing Framework for Go
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/onsi/ginkgo
      tag: v${{package.version}}
      expected-commit: 3d9dae2e740a3d3460abd7ea809292005b7f15ce

  - uses: go/build
    with:
      packages: ./ginkgo
      output: ginkgo

test:
  pipeline:
    - name: Binary checks
      runs: |
        # Check that the binary exists and has the correct version
        ginkgo version | grep ${{package.version}}
    - name: Basic commands check
      runs: |
        # Test the help command works
        ginkgo help

        # Verify key commands are available
        for cmd in "run" "build" "bootstrap" "generate" "outline" "unfocus" "labels" "watch" "version"; do
          if ! ginkgo help "$cmd"; then
            exit 1
          fi
        done

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v
