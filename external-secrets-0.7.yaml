package:
  name: external-secrets-0.7
  version: 0.7.3
  epoch: 4
  description: External Secrets Operator reads information from a third-party service like AWS Secrets Manager and automatically injects the values as Kubernetes Secrets.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-1.21 # We need to stick to go 1.21 for now, external-secrets-0.7 doesn't build with go >= 1.22
      - wolfi-baselayout
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/external-secrets/external-secrets
      tag: v${{package.version}}
      expected-commit: 593eb139990bc0deeb437dfffc8b4d46bcfeea4f

  - uses: go/bump
    with:
      deps: google.golang.org/grpc@v1.56.3 google.golang.org/protobuf@v1.33.0 github.com/lestrrat-go/jwx@v1.2.29 golang.org/x/net@v0.23.0 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/hashicorp/go-retryablehttp@v0.7.7

  - runs: |
      make ARCH=$(go env GOARCH) build
      mkdir -p ${{targets.destdir}}/usr/bin
      install -Dm755 ./bin/external-secrets-linux-$(go env GOARCH) ${{targets.destdir}}/usr/bin/external-secrets

subpackages:
  - name: external-secrets-0.7-compat
    pipeline:
      - runs: |
          # The Dockerfile entrypoint expects the external-secret binary to be in /bin instead of /usr/bin
          mkdir -p "${{targets.subpkgdir}}/bin"
          ln -sf /usr/bin/external-secrets ${{targets.subpkgdir}}/bin/external-secrets
      - uses: strip

update:
  enabled: false
