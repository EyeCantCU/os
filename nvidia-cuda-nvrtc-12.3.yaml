package:
  name: nvidia-cuda-nvrtc-12.3
  version: 12.3.103
  epoch: 3
  description: CUDA NVRTC
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-cuda-nvrtc=${{package.full-version}}
      - nvidia-cuda-nvrtc-12=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvrtc/linux-sbsa/cuda_nvrtc-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "44d6f8cfe935686f936a92cd5e0ec2e63e1920bc0e6ccd70c1c7931f407808b8"
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvrtc/linux-x86_64/cuda_nvrtc-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "3178e8b1a63616e8d4c43d62d151b4e07b02beb85f0a68ce6d8edbf6616734e8"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.3/
      mv include ${{targets.destdir}}/usr/local/cuda-12.3/
      mv lib ${{targets.destdir}}/usr/local/cuda-12.3/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.3/${{package.name}}.LICENSE

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/pkgconfig/
      mv pkg-config/* ${{targets.destdir}}/usr/share/pkgconfig/
      sed -i 's|targets/.*-linux/||g' ${{targets.destdir}}/usr/share/pkgconfig/*

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - nvidia-cuda-nvrtc-12.3

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
