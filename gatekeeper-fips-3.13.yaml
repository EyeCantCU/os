package:
  name: gatekeeper-fips-3.13
  version: 3.13.4
  epoch: 10
  description: Gatekeeper - Policy Controller for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - gatekeeper-fips=3.13.999

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d7228ce938e84118219a6126825944f1cff89311
      repository: https://github.com/open-policy-agent/gatekeeper
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: golang.org/x/crypto@v0.17.0 google.golang.org/protobuf@v1.33.0 golang.org/x/net@v0.23.0

  - uses: go/build
    with:
      packages: .
      output: manager
      ldflags: |
        -X github.com/open-policy-agent/gatekeeper/pkg/version.Version=v${{package.version}}
        -X main.frameworksVersion=$(go list -f '{{ .Version }}' -m github.com/open-policy-agent/frameworks/constraint)
        -X main.opaVersion=$(go list -f '{{ .Version }}' -m github.com/open-policy-agent/opa)
      go-package: go-fips

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}
          ln -sf /usr/bin/manager ${{targets.subpkgdir}}/manager
    dependencies:
      provides:
        - gatekeeper-fips-compat=3.13.999

update:
  enabled: true
  github:
    identifier: open-policy-agent/gatekeeper
    strip-prefix: v
    use-tag: true
    tag-filter: v3.13.
