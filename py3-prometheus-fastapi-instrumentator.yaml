package:
  name: py3-prometheus-fastapi-instrumentator
  version: 7.1.0
  epoch: 0
  description: Instrument your FastAPI app with Prometheus metrics
  copyright:
    - license: ISC

vars:
  pypi-package: prometheus-fastapi-instrumentator
  import: prometheus_fastapi_instrumentator

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-pip
      - py3-supported-poetry-core
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-wheel

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/trallnag/prometheus-fastapi-instrumentator
      tag: v${{package.version}}
      expected-commit: 63b05e52b6687e7371551d57a525f090e65ec73a

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-prometheus-client
        - py${{range.key}}-starlette
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            set -euo pipefail
            python${{range.key}} <<-EOF
            from prometheus_fastapi_instrumentator import Instrumentator

            # Test basic Instrumentator functionality
            instrumentator = Instrumentator()
            assert instrumentator is not None
            assert hasattr(instrumentator, 'instrument')
            assert hasattr(instrumentator, 'expose')

            print("All tests passed!")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  git:
    strip-prefix: v
