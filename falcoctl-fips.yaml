package:
  name: falcoctl-fips
  version: "0.11.1"
  epoch: 2
  description: Administrative tooling for Falco
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2b06411214ebcfdf9ddd15caa498837865c4a694
      repository: https://github.com/falcosecurity/falcoctl
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0

  - runs: |
      make falcoctl RELEASE=${{package.version}}
      mkdir -p ${{targets.destdir}}/usr/bin
      mv falcoctl ${{targets.destdir}}/usr/bin/

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        falcoctl version
        falcoctl --help

update:
  enabled: true
  github:
    identifier: falcosecurity/falcoctl
    strip-prefix: v
