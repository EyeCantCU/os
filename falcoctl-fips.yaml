package:
  name: falcoctl-fips
  version: 0.10.0
  epoch: 1
  description: Administrative tooling for Falco
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 4fce8b537b323d284b87dc20d1975999ac31b1ac
      repository: https://github.com/falcosecurity/falcoctl
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: github.com/golang-jwt/jwt/v4@v4.5.1

  - runs: |
      make falcoctl RELEASE=${{package.version}}
      mkdir -p ${{targets.destdir}}/usr/bin
      mv falcoctl ${{targets.destdir}}/usr/bin/

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        falcoctl version
        falcoctl --help

update:
  enabled: true
  github:
    identifier: falcosecurity/falcoctl
    strip-prefix: v
