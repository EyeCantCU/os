# Creates meta-packages used internally in building other CUDA dependent packages like torch, vllm etc.
package:
  name: cuda-toolkit-12.9
  version: 12.9
  # version of the the cuda-toolkit and the run-time dependencies are tracked referencing NVIDIA's toolkit versions
  epoch: 0
  description: Meta-package for providing CUDA-toolkit packages
  copyright:
    - license: LicenseRef-NVIDIA-CUDA
      license-path: LICENSE
  dependencies:
    runtime:
      - nvidia-cuda-cudart-12.9
      - nvidia-cuda-nvcc-12.9
      - nvidia-cuda-nvml-dev-12.9
      - nvidia-cuda-nvrtc-12.9
      - nvidia-cuda-nvtx-12.9
      - nvidia-libcublas-12.9
      - nvidia-libcufft-12.9
      - nvidia-libcurand-12.9
      - nvidia-libcusolver-12.9
      - nvidia-libcusparse-12.9
      - nvidia-libnvjitlink-12.9

subpackages:
  - name: ${{package.name}}-dev
    description: Meta-package for providing CUDA-toolkit development packages
    dependencies:
      runtime:
        - nvidia-cuda-cudart-12.9-dev
        - nvidia-cuda-nvcc-12.9-dev
        - nvidia-cuda-nvrtc-12.9-dev
        - nvidia-cuda-nvml-dev-12.9
        - nvidia-cuda-nvtx-12.9-dev
        - nvidia-libcublas-12.9-dev
        - nvidia-libcufft-12.9-dev
        - nvidia-libcurand-12.9-dev
        - nvidia-libcusolver-12.9-dev
        - nvidia-libcusparse-12.9-dev
        - nvidia-libnvjitlink-12.9-dev
    test:
      pipeline:
        - uses: test/emptypackage

update:
  enabled: false
  exclude-reason: meta-package

test:
  pipeline:
    - uses: test/emptypackage
