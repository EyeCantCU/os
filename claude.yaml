package:
  name: claude
  version: "0.2.114"
  epoch: 0
  description: Claude Code Installer
  copyright:
    - license: PROPRIETARY
  dependencies:
    runtime:
      - bash
      - busybox
      - coreutils
      - git
      - nodejs-23
      - npm
      - openssh-client
      - python3
      - ripgrep

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - runs: |
      # Install the binary, proprietary claude-code from npm
      mkdir -p ${{targets.destdir}}/usr/bin
      cat >${{targets.destdir}}/usr/bin/claude <<EOF
      #!/bin/sh
      set -e
      # Install claude from npm, since we're not allowed to distribute
      npm install -g @anthropic-ai/claude-code@${{package.version}} -prefix /usr/local 2>&1 >/dev/null
      # Launch claude, with whatever parameters we were passed
      exec claude \$@
      EOF
      chmod 755 ${{targets.destdir}}/usr/bin/claude

update:
  enabled: true
  release-monitor:
    identifier: 377805

test:
  pipeline:
    - runs: |
        claude --help
        claude --version
