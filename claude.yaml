package:
  name: claude
  version: 0.2.74
  epoch: 0
  description: Claude Code Research Preview
  copyright:
    - license: PROPRIETARY
  dependencies:
    runtime:
      - bash
      - busybox
      - coreutils
      - git
      - nodejs
      - npm
      - openssh-client

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - nodejs
      - npm
      - ripgrep

pipeline:
  - runs: |
      # Install the binary, proprietary claude-code from npm
      npm install -g @anthropic-ai/claude-code --force
      mkdir -p ${{targets.destdir}}/usr/
      # Copy over the installed claude code
      cp -a /usr/local ${{targets.destdir}}/usr/
      # Drop the vendored ripgrep (which we have packaged and thus CVE-remediated)
      rm -rf ${{targets.destdir}}/usr/local/lib/node_modules/@anthropic-ai/claude-code/vendor
      # Remove the lib64 symlink, which causes breakages
      rm -f ${{targets.destdir}}/usr/local/lib64

update:
  enabled: false

test:
  pipeline:
    - runs: |
        claude --help
        claude --version
