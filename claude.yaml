package:
  name: claude
  version: "1.0.44"
  epoch: 0
  description: Claude Code Installer
  copyright:
    - license: PROPRIETARY
  dependencies:
    runtime:
      - bash
      - busybox
      - coreutils
      - git
      - nodejs-23
      - npm
      - openssh-client
      - python3
      - ripgrep

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - runs: |
      # Install the binary, proprietary claude-code from npm
      # into ~/.claude/local as happens if you did a `-g` install and then
      # ran `/migrate-installer`
      # Each user gets their own claude installation,
      # which is how claude wants it.
      fpath="${{targets.destdir}}/usr/bin/claude"
      mkdir -p $(dirname "$fpath")

      cat >"$fpath" <<"EOF"
      #!/bin/sh
      # shellcheck disable=SC3043
      set -e
      package="@anthropic-ai/claude-code@${{package.version}}"
      prefix="$HOME/.claude/local"
      bin="$prefix/node_modules/.bin/claude"

      _install() {
          local out="" rc=""
          set -- npm install --prefix="$1" "$2"
          echo "installing $package via: $*" 1>&2
          out=$("$@" 2>&1) && return 0
          rc=$?
          printf "%s\n%s\n\n%s\n" "ERROR: $*" "$out" \
              "ERROR: installation of $package with npm failed $rc. see above."
      }

      if [ ! -x "$bin" ]; then
          _install "$prefix" "$package"
      fi

      exec "$bin" "$@"
      EOF
      chmod 755 "$fpath"

update:
  enabled: true
  release-monitor:
    identifier: 377805

test:
  pipeline:
    - runs: |
        claude --help
        claude --version
