package:
  name: rabbitmq-cluster-operator-fips
  version: "2.18.0"
  epoch: 0 # CVE-2025-61729
  description: Open source RabbitMQ cluster operator. Kubernetes operator to deploy and manage RabbitMQ clusters.
  copyright:
    - license: MPL-2.0

environment:
  environment:
    GO111MODULE: on

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rabbitmq/cluster-operator
      tag: v${{package.version}}
      expected-commit: e20d5f4992960e4347430c4dd8fd7570eb016f46

  - uses: go/build
    with:
      packages: .
      output: manager
      tags: timetzdata
      go-package: go-fips

test:
  environment:
    contents:
      packages:
        - curl
    environment:
      OPERATOR_NAMESPACE: default
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        manager --help
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - name: Launch operator with kwok cluster
      uses: test/daemon-check-output
      with:
        setup: |
          kubectl apply -f https://raw.githubusercontent.com/rabbitmq/cluster-operator/refs/tags/v${{package.version}}/config/crd/bases/rabbitmq.com_rabbitmqclusters.yaml
          sleep 1
        start: manager --metrics-bind-address ":8080"
        timeout: 30
        expected_output: |
          FIPS 140-3 mode enabled
          Starting Controller
          Starting workers
        post: |
          curl --silent --fail localhost:8080/metrics

update:
  enabled: true
  github:
    identifier: rabbitmq/cluster-operator
    strip-prefix: v
