package:
  name: rabbitmq-cluster-operator-fips
  version: "2.17.1"
  epoch: 0
  description: Open source RabbitMQ cluster operator. Kubernetes operator to deploy and manage RabbitMQ clusters.
  copyright:
    - license: MPL-2.0

environment:
  environment:
    GO111MODULE: on

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rabbitmq/cluster-operator
      tag: v${{package.version}}
      expected-commit: 86e3a60d87a4da94a13ed6584734787fd8b117a1

  - uses: go/build
    with:
      packages: .
      output: manager
      tags: timetzdata
      go-package: go-fips

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        manager --help

update:
  enabled: true
  github:
    identifier: rabbitmq/cluster-operator
    strip-prefix: v
