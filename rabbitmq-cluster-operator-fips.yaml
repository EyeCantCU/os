package:
  name: rabbitmq-cluster-operator-fips
  version: "2.17.0"
  epoch: 0 # CVE-2025-47907
  description: Open source RabbitMQ cluster operator. Kubernetes operator to deploy and manage RabbitMQ clusters.
  copyright:
    - license: MPL-2.0

environment:
  environment:
    GO111MODULE: on

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rabbitmq/cluster-operator
      tag: v${{package.version}}
      expected-commit: 535a681207135748746ec06469fbe6c5ba30a1f1

  - uses: go/build
    with:
      packages: .
      output: manager
      tags: timetzdata
      go-package: go-fips

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        manager --help

update:
  enabled: true
  github:
    identifier: rabbitmq/cluster-operator
    strip-prefix: v
