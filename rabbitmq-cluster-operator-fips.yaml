package:
  name: rabbitmq-cluster-operator-fips
  version: 2.11.0
  epoch: 1
  description: Open source RabbitMQ cluster operator. Kubernetes operator to deploy and manage RabbitMQ clusters.
  copyright:
    - license: MPL-2.0

environment:
  environment:
    GO111MODULE: on

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rabbitmq/cluster-operator
      tag: v${{package.version}}
      expected-commit: 7f35974c9c099125ebad2c275a4a6f65152792df

  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.33.0

  - uses: go/build
    with:
      packages: .
      output: manager
      tags: timetzdata
      go-package: go-fips

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        manager --help

update:
  enabled: true
  github:
    identifier: rabbitmq/cluster-operator
    strip-prefix: v
