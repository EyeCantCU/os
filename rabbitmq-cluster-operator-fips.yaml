package:
  name: rabbitmq-cluster-operator-fips
  version: 2.10.0
  epoch: 1
  description: Open source RabbitMQ cluster operator. Kubernetes operator to deploy and manage RabbitMQ clusters.
  copyright:
    - license: MPL-2.0

environment:
  environment:
    GO111MODULE: on

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rabbitmq/cluster-operator
      tag: v${{package.version}}
      expected-commit: 008ed9fd1742791c97c1bb8004e58b7563ea9dbb

  - uses: go/build
    with:
      packages: .
      output: manager
      tags: timetzdata
      go-package: go-fips

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: rabbitmq/cluster-operator
    strip-prefix: v
