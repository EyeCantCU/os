package:
  name: volcano
  version: "1.13.0"
  epoch: 0
  description: A Cloud Native Batch System
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 943b8c23d402462b63f1e21f7f7a39129ba8d63c
      repository: https://github.com/volcano-sh/volcano
      tag: v${{package.version}}

subpackages:
  - name: vc-scheduler
    description: subpackage for volcano scheduler
    pipeline:
      - uses: go/build
        with:
          ldflags: |
            -X 'volcano.sh/volcano/pkg/version.GitSHA=$(git rev-parse HEAD)'
            -X 'volcano.sh/volcano/pkg/version.Built=$(date -u -d "@$SOURCE_DATE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ')'
            -X 'volcano.sh/volcano/pkg/version.Version=${{package.version}}'
          packages: ./cmd/scheduler
          output: vc-scheduler
      - runs: |
          mkdir -p "${{targets.contextdir}}"/
          ln -sf /usr/bin/vc-scheduler ${{targets.contextdir}}/vc-scheduler
    test:
      environment:
        contents:
          packages:
            - vc-scheduler
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

  - name: vc-controller-manager
    description: subpackage for volcano controller manager
    pipeline:
      - uses: go/build
        with:
          ldflags: |
            -X 'volcano.sh/volcano/pkg/version.GitSHA=$(git rev-parse HEAD)'
            -X 'volcano.sh/volcano/pkg/version.Built=$(date -u -d "@$SOURCE_DATE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ')'
            -X 'volcano.sh/volcano/pkg/version.Version=${{package.version}}'
          packages: ./cmd/controller-manager
          output: vc-controller-manager
      - runs: |
          mkdir -p "${{targets.contextdir}}"/
          ln -sf /usr/bin/vc-controller-manager ${{targets.contextdir}}/vc-controller-manager
    test:
      environment:
        contents:
          packages:
            - vc-controller-manager
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

  - name: vc-webhook-manager
    description: subpackage for volcano webhook-manager
    pipeline:
      - uses: go/build
        with:
          ldflags: |
            -X 'volcano.sh/volcano/pkg/version.GitSHA=$(git rev-parse HEAD)'
            -X 'volcano.sh/volcano/pkg/version.Built=$(date -u -d "@$SOURCE_DATE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ')'
            -X 'volcano.sh/volcano/pkg/version.Version=${{package.version}}'
          packages: ./cmd/webhook-manager
          output: vc-webhook-manager
      - runs: |
          mkdir -p "${{targets.contextdir}}"/
          ln -sf /usr/bin/vc-webhook-manager ${{targets.contextdir}}/vc-webhook-manager
    test:
      environment:
        contents:
          packages:
            - vc-webhook-manager
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

  - name: vc-agent
    description: subpackage for volcano agent
    pipeline:
      - uses: go/build
        with:
          ldflags: |
            -X 'volcano.sh/volcano/pkg/version.GitSHA=$(git rev-parse HEAD)'
            -X 'volcano.sh/volcano/pkg/version.Built=$(date -u -d "@$SOURCE_DATE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ')'
            -X 'volcano.sh/volcano/pkg/version.Version=${{package.version}}'
          packages: ./cmd/agent
          output: vc-agent
      - uses: go/build
        with:
          ldflags: |
            -X 'volcano.sh/volcano/pkg/version.GitSHA=$(git rev-parse HEAD)'
            -X 'volcano.sh/volcano/pkg/version.Built=$(date -u -d "@$SOURCE_DATE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ')'
            -X 'volcano.sh/volcano/pkg/version.Version=${{package.version}}'
          packages: ./cmd/network-qos
          output: vc-network-qos
      - runs: |
          mkdir -p "${{targets.contextdir}}"/
          ln -sf /usr/bin/vc-agent ${{targets.contextdir}}/vc-agent
          ln -sf /usr/bin/vc-network-qos ${{targets.contextdir}}/vc-network-qos
    test:
      environment:
        contents:
          packages:
            - vc-webhook-manager
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

  - name: vcctl
    description: subpackage for vcctl
    pipeline:
      - uses: go/build
        with:
          ldflags: |
            -X 'volcano.sh/volcano/pkg/version.GitSHA=$(git rev-parse HEAD)'
            -X 'volcano.sh/volcano/pkg/version.Built=$(date -u -d "@$SOURCE_DATE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ')'
            -X 'volcano.sh/volcano/pkg/version.Version=${{package.version}}'
          packages: ./cmd/cli
          output: vcctl

update:
  enabled: true
  github:
    identifier: volcano-sh/volcano
    strip-prefix: v
