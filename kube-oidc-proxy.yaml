package:
  name: kube-oidc-proxy
  version: 1.0.6
  epoch: 11
  description: OIDC to Kubernetes API servers where OIDC authentication is unavailable
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libssl3

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - git
      - go
      - go-bindata
      - openssl
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/TremoloSecurity/kube-oidc-proxy
      tag: v${{package.version}}
      expected-commit: 6dbd3448d20269d59267f37e956d703092524772

  - uses: go/bump
    with:
      deps: golang.org/x/crypto@v0.17.0 google.golang.org/protobuf@v1.33.0 golang.org/x/net@v0.23.0

  - runs: |
      CGO_ENABLED=0 go build \
        -trimpath -ldflags "-w -X=main.version=${{package.version}}" \
        -o ${{targets.destdir}}/usr/bin/kube-oidc-proxy ./cmd/.

  - uses: strip

update:
  enabled: true
  github:
    identifier: TremoloSecurity/kube-oidc-proxy
    strip-prefix: v
