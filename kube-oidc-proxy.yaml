package:
  name: kube-oidc-proxy
  version: 1.0.7
  epoch: 0
  description: OIDC to Kubernetes API servers where OIDC authentication is unavailable
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libssl3

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - git
      - go
      - go-bindata
      - openssl
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/TremoloSecurity/kube-oidc-proxy
      tag: v${{package.version}}
      expected-commit: e3f1c1f130af305d31d6bd8b655e63fed01538cb

  - runs: |
      CGO_ENABLED=0 go build \
        -trimpath -ldflags "-w -X=main.version=${{package.version}}" \
        -o ${{targets.destdir}}/usr/bin/kube-oidc-proxy ./cmd/.

  - uses: strip

update:
  enabled: true
  github:
    identifier: TremoloSecurity/kube-oidc-proxy
    strip-prefix: v
