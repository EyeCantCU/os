package:
  name: oldlibstdcxx-2.28
  version: 8.5.0
  epoch: 0
  description: "the GNU C++ library"
  copyright:
    - license: GPL-3.0-or-later
  options:
    no-provides: true

vars:
  # the nearest compiler version we have to ${{package.version}}
  gcc-major-version: 11

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - file
      - gawk
      - gcc-${{vars.gcc-major-version}}
      - glibc-iconv
      - gmp-dev
      - isl-dev
      - mpc-dev
      - mpfr-dev
      - zlib-dev
  environment:
    CC: gcc-${{vars.gcc-major-version}}
    CXX: g++-${{vars.gcc-major-version}}

pipeline:
  - uses: fetch
    with:
      uri: https://ftpmirror.gnu.org/gnu/gcc/gcc-${{package.version}}/gcc-${{package.version}}.tar.xz
      expected-sha512: 92f599680e6b7fbce88bcdda810f468777d541e5fddfbb287f7977d51093de2a5178bd0e6a08dfe37090ea10a0508a43ccd00220041abbbec33f1179bfc174d8

  - name: 'Set up build directory'
    runs: |
      mkdir build

  # Do a full GCC build.
  # While libstdc++ will build standalone, the result is broken.
  # gthread support is not detected, and that results in missing
  # symbols. There maybe other problems as well.
  - name: 'Configure libstdc++'
    working-directory: build
    runs: |
      ../configure \
            --program-suffix="-8" \
            --prefix=/usr/lib/oldlibstdc++/usr \
            --disable-nls \
            --disable-werror \
            --with-pkgversion='Wolfi ${{package.full-version}}' \
            --with-glibc-version=2.28 \
            --enable-initfini-array \
            --disable-nls \
            --disable-multilib \
            --disable-libatomic \
            --disable-libsanitizer \
            --enable-host-shared \
            --enable-shared \
            --enable-threads \
            --enable-tls \
            --enable-default-pie \
            --enable-default-ssp \
            --with-system-zlib \
            --enable-languages=c,c++ \
            --enable-bootstrap \
            --enable-gnu-indirect-function \
            --enable-gnu-unique-object \
            --enable-cet=auto \
            --enable-link-mutex \
            --with-gcc-major-version-only \
            --with-linker-hash-style=gnu \
            --disable-libcc1 \
            --enable-cxx-flags="-D_GLIBCXX_ASSERTIONS"

  - runs: |
      make -C build -j$(nproc)

  - runs: |
      mkdir install.tmp
      make -C build -j$(nproc) install DESTDIR="$(pwd)/install.tmp"

  - runs: |
      mkdir -p "${{targets.contextdir}}/usr/lib/oldlibstdc++/usr/lib"
      mv install.tmp/usr/lib/oldlibstdc++/usr/lib*/libstdc++.so* "${{targets.contextdir}}/usr/lib/oldlibstdc++/usr/lib"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - build-base
        - ct-manylinux-2.28-gcc-13
        - ct-manylinux-2.28-gcc-14
        - gcc-13
        - gcc-14
  pipeline:
    - uses: test/tw/ldd-check
    - name: "unpack saved-off libstdc++.so"
      runs: |
        mkdir 13
        tar -C 13 -xvf "/usr/lib/ct-manylinux-2.28-gcc-13/test/libs.tar.gz"
    - uses: test/oldlibstdc++
      with:
        oldlib: "/usr/lib/oldlibstdc++/usr/lib/libstdc++.so.6"
        newlib: "13/libstdc++.so.6"
        nonsharedlib: "/usr/lib/oldglibc/usr/lib/gcc/${{host.triplet.gnu}}/13/libstdc++_nonshared.a"
        cc: "/usr/bin/gcc-13"
    - name: "unpack saved-off libstdc++.so"
      runs: |
        mkdir 14
        tar -C 14 -xvf "/usr/lib/ct-manylinux-2.28-gcc-14/test/libs.tar.gz"
    - uses: test/oldlibstdc++
      with:
        oldlib: "/usr/lib/oldlibstdc++/usr/lib/libstdc++.so.6"
        newlib: "14/libstdc++.so.6"
        nonsharedlib: "/usr/lib/oldglibc/usr/lib/gcc/${{host.triplet.gnu}}/13/libstdc++_nonshared.a"
        cc: "/usr/bin/gcc-14"

update:
  enabled: false
  exclude-reason: |
    oldlibstdc++ is a fixed old version of libstdc++. The version here is
    picked to result in most backwards compatible binaries for
    manylinux wheels. It is libstdc++ supported by Debian Bullseye, Ubuntu
    20.04, RHEL 8.
