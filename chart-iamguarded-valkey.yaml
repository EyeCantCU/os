package:
  name: chart-iamguarded-valkey
  version: "3.0.4"
  epoch: 0
  description: valkey iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: ecosystems/auth
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: valkey/${{package.version}}
      expected-commit: 81a1707cc7c34b9f294c6cc1959e266989f50f56

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/valkey

  - uses: charts/package
    with:
      chart-path: iamguarded/valkey

update:
  enabled: false
  manual: true
  schedule:
    period: daily
    reason: Update automation doesn't yet support automating from private repos.
  git:

test:
  pipeline:
    - uses: ecosystems/auth
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: valkey
