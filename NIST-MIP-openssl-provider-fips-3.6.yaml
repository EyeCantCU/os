#nolint:valid-pipeline-fetch-digest
package:
  # body-type-number
  name: NIST-MIP-openssl-provider-fips-3.6
  # v1 of nist meta-packages
  version: 1
  epoch: 2
  # Many SCA tools know how to read APK URL
  # URL to the certificate
  url: https://csrc.nist.gov/Projects/cryptographic-module-validation-program/modules-in-process/modules-in-process-list
  # Some tools use description
  # body, type, number, certificate name, standard
  description: "Module In Process - Chainguard FIPS Provider 3.6 metapackage"
  copyright:
    # NIST information is all public
    - license: NIST-PD
  dependencies:
    runtime:
      # Strict dependency on the actual module
      - openssl-provider-fips-3.6.0

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      # Note this URL will make it into package SPDX SBOM, and will also make it into APKO SBOM
      uri: https://csrc.nist.gov/Projects/cryptographic-module-validation-program/modules-in-process/modules-in-process-list
      # Unstable content, thus no expected checksum and hence the nolint too
      expected-none: true
      extract: false
      delete: true

test:
  pipeline:
    - uses: test/tw/metapackage

update:
  enabled: false
  exclude-reason: "This is an empty NIST CMVP certificate SBOM indicator"
