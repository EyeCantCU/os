# pgvector-13 is intended to support PostgreSQL 13.
# https://github.com/pgvector/pgvector#installation-notes
package:
  name: pgvector-13
  version: "0.8.1"
  epoch: 0
  description: Open-source vector similarity search for PostgreSQL
  copyright:
    - license: PostgreSQL

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - clang-19
      - postgresql-13-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pgvector/pgvector
      expected-commit: 778dacf20c07caf904557a88705142631818d8cb
      tag: v${{package.version}}

  - runs: |
      make OPTFLAGS=""
      make USE_PGXS=1 DESTDIR="${{targets.destdir}}" PG_CONFIG=/usr/bin/pg_config install

  - uses: strip

test:
  environment:
    contents:
      packages:
        - postgresql-13
        - postgresql-13-client
        - shadow
        - sudo-rs
    environment:
      PGDATA: /tmp/test_db
      PGDB: testdb
      PGUSER: wolfi
  pipeline:
    - name: "Test loading the extension"
      runs: |
        useradd $PGUSER
        sudo -u $PGUSER initdb -D $PGDATA
        sudo -u $PGUSER pg_ctl -D $PGDATA -l /tmp/logfile start
        createdb $PGDB
        psql -U $PGUSER -d $PGDB -c "CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;"
        psql -U $PGUSER -d $PGDB -c "SELECT * FROM pg_extension;"
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: pgvector/pgvector
    strip-prefix: v
    use-tag: true
