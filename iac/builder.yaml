contents:
  repositories:
    - https://apk.cgr.dev/chainguard
    - https://apk.cgr.dev/chainguard-private
    - https://apk.cgr.dev/extra-packages
    - cgr-install/packages
  keyring:
    - cgr-install/local-melange.rsa.pub
  packages:
  # mattmoor-chainit-init does basic vm setup and invokes the entrypoint/cmd
  - mattmoor-chainit-init
  - cgr-install

entrypoint:
  command: cgr-install

cmd: >
  guest-install --kernel-cmdline-toks=cgri.opts --output=9p:output
  --input-tar=/dev/vda --disk=/dev/vdb --scratch=/dev/vdc

# This isn't particularly relevant for how we use this,
# but we need to specify the set of architectures here
# so that the locking done by apko_config doesn't try to
# do a bunch of unsupported architectures.
archs:
- x86_64
- aarch64
