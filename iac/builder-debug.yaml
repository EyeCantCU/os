contents:
  repositories:
    - https://apk.cgr.dev/chainguard
    - https://apk.cgr.dev/extra-packages
  packages:
  # We need an init system to invoke our entrypoint.
  - mattmoor-chainit-init

  # We need a shell
  - bash
  - bash-binsh
  # We need tar, truncate, and other posix tools.
  - coreutils
  # We use tar to unpack the rootfs.
  - gnutar

  # We use sfdisk to partition disk.
  - sfdisk

  # We need this for mkfs.fat
  - dosfstools
  # We need a way to copy file into EFI without mounting it
  - mtools
  - findutils
  # for mkfs.xfs
  - xfsprogs
  - xfsprogs-extra
  # Needed for forcing reproducibility
  - libfaketime
  # debug editing
  - sed
  # We mount the output 9p shared dir
  - mount

entrypoint:
  command: /bin/bash
cmd: |
  -c '
  set -e
  set -x
  set -o pipefail

  empty_dir() {
    # empty an existing dir maintaining its timestamp. error on non-existing.
    local d="$1" tmpf=""
    [ -d "$d" ] || { echo "ERROR: empty_dir $d: '$d' is not a directory" 1>&2; return 1; }
    [ -L "$d" ] && { echo "ERROR: empty_dir $d: '$d' is a symlink" 1>&2; return 1; }
    tmpf=$(mktemp)
    touch --reference="$d" "$tmpf" &&
      find "$d" -mindepth 1 -delete &&
      touch --reference="$tmpf" "$d" &&
      rm -f "$tmpf" || {
        echo "ERROR: empty_dir $d: failed $?"
        rm -f "$tmpf"
        return 1
      }
  }

  _grep() {
      set +x
      local m="$1"; shift;
      for f in "$@"; do
          while read line ; do
              case "$line" in
                  *$m*) echo "$f: $line"; continue;;
              esac
          done < "$f"
      done
  }

  write_kernel_conf() {
      local rootd="$1" rootflag="" out="" ver="" opts="" fname="" kernel=""

      # basically find a single chainguard/*/linux file and write
      # an entry in boot/loader/entries for it.
      out=$(cd "$rootd/boot" && set +f && set -- chainguard/*/linux
          [ $# -eq 0 ] && { echo "no kernel found" 1>&2; exit 1; };
          echo "$# - $*" 1>&2
          for f in "$@"; do [ -f "$f" ] && echo "$f" && exit 0; done
          echo "didn not find kernel" 1>&2
          exit 1) || return 1
      kernel="/$out"
      # grab the version from chainguard/6.1.2/linux
      ver=${out#chainguard/}
      ver=${ver%/linux}
      rootflag="root=PARTLABEL=Chainguard"


      local console="ttyS0" debugtty="ttyS1"
      if [ "$(cat /output/buildArch)" = "aarch64" ]; then
          console="ttyAMA0"
          debugtty="ttyS0"
      fi

      opts="$rootflag systemd.debug-shell=$debugtty console=$console"

      local rwflag="" ofname="boot/loader/entries/chainguard-$ver.conf"
      if [ ! -f "$rootd/$ofname" ]; then
          echo "expected config file in $ofname was not found." 1>&2
          return 1
      else
          local line=""
          line=$(_grep "options * rw" "$rootd/$ofname")
          if [ -n "$line" ]; then
              rwflag="rw"
          fi
      fi

      fname="boot/loader/entries/chainguard-$ver-debug.conf"

  echo "
  title      Chainguard-debug
  version    $ver
  sort-key   0chainguard
  options    $opts${rwflag:+ $rwflag}
  linux      $kernel
  " | tee "$rootd/$fname"

      ( set +x;
        echo "=== /$fname =="
        sed "s,^,| ," "$rootd/$fname"
        echo "=== cmdlines ===" ;
        cd "$rootd/boot/loader/entries" && _grep options *.conf )
  }

  setup_debug() {
      local rootd="$1"

      write_kernel_conf "$rootd" ||
          { echo "failed writing kernel conf"; return 1; }
  }

  mkdir /output
  mount -t 9p -otrans=virtio -oversion=9p2000.L output /output

  tarball=/dev/vda
  disk=/dev/vdb
  scratch=/dev/vdc

  FROZEN_TIMESTAMP=1744654025

  GPT_UUID=11111111-1111-1111-11111111111111111
  PT_UUID_EFI=22222222-2222-2222-2222-222222222222
  PT_UUID_ROOT=33333333-3333-3333-3333-333333333333
  FS_UUID_ROOT=44444444-4444-4444-4444-444444444444
  FS_UUID_EFI=55555555 # 32 bit int
  DISK_UUID=5A82A03F-386A-43C8-8DD5-DD0E5452A3F1

  # https://uapi-group.org/specifications/specs/discoverable_partitions_specification
  EFI_TYPE="c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
  ROOT_X86_64="4f68bce3-e8cd-4db1-96e7-fbcaf984b709"
  ROOT_ARM64="b921b045-1df0-41c3-af44-4c6f280d3fae"

  if [ "$(cat /output/buildArch)" = "x86_64" ]; then
      ROOT_TYPE="${ROOT_X86_64}"
  elif [ "$(cat /output/buildArch)" = "aarch64" ]; then
      ROOT_TYPE="${ROOT_ARM64}"
  fi

  [ -e "$tarball" ]
  [ -b "$disk" ]

  # Create a GPT parition table on our disk where the
  # EFI System Partition (ESP) is 100M to hold the kernel,
  # systemd-boot, and a handful of configuration files.
  # The root partition will be the remainder of the disk.
  gib=$((1024 * 1024 * 1024))
  start=$((1024 * 1024 * 4)) # Start 4Mib for maximum alignment
  sectsize=512
  sstart=$((start / sectsize))
  efisize=$(((gib - start) / sectsize)) # make efisize 1GiB - startsize, so second part starts at 1GiB
  sfdisk $disk << EOF
  label: gpt
  label-id: $GPT_UUID
  unit: sectors
  sector-size: $sectsize

  disk.raw1 : start=  $sstart, size=$efisize, type=$EFI_TYPE, uuid=$PT_UUID_EFI, name="ESP"
  disk.raw2 : start=, size=, type=$ROOT_TYPE, uuid=$PT_UUID_ROOT, name="Chainguard", attrs="GUID:59"
  EOF

  # Reproducibility improvements, this way partition layout is reproducible
  sfdisk --disk-id $disk "$DISK_UUID"

  uefi_partition="${disk}1"
  root_partition="${disk}2"

  # Create a scratch disk in /tmp where we unpack potentially
  # very large disks
  mkfs.xfs "${scratch}"
  mount -t xfs -o noatime,nodiratime "${scratch}" /tmp/

  # Extract rootfs and clean it up
  root_dir=$(mktemp -d /tmp/root.XXXXXX)
  SOURCE_DATE_EPOCH=$FROZEN_TIMESTAMP tar \
    --sort=name \
    --warning=no-timestamp \
    --xattrs \
    --xattrs-include='*' \
    -xpf "$tarball" \
    --numeric-owner \
    -C $root_dir
  # Remove included char devices that we dont need
  empty_dir "$root_dir/dev"

  # START DEBUG
  setup_debug "$root_dir" || exit

  # Format our EFP System Partition with FAT32 (required)
  # using invariant will make the partition reproducible
  mkfs.vfat --invariant -i "$FS_UUID_EFI" -F 32 $uefi_partition

  # Extract the boot directory from the tar, then populate
  # our EFI partition.
  # We will use mtools so we wont need to mount, this making the
  # partition not reproducible
  # configure mtools to correctly read out vfat partition
  cat > /root/.mtoolsrc << EOF
  drive c: file="$uefi_partition" partition=0 hidden=$sstart
  EOF

  # ESP mount point should be /boot, but old 'boot-installed' packages
  # effectively expected it to be /boot/efi.  Those are identifyable
  # by presence of /boot/efi/EFI rather than /boot/EFI.
  espmp="boot"
  if [ -d "$root_dir/boot/efi/EFI" ]; then
     espmp="boot/efi"
  fi
  if [ -e "$root_dir/boot/EFI" ] && [ -e "$root_dir/boot/efi" ]; then
    echo "ERROR: installation has boot /boot/EFI and /boot/efi" 1>&2
    exit 1
  fi
  # First create directories
  find $root_dir/$espmp -type d -printf "%P\n" | sort | while read -r dir; do
      if [ -n "$dir" ]; then
          MTOOLS_SKIP_CHECK=1 \
              SOURCE_DATE_EPOCH=$FROZEN_TIMESTAMP \
              TZ=UTC \
              mmd -D o "c:/$dir"
      fi
  done
  # Then copy all files
  find $root_dir/$espmp -type f -printf "%P\n" | sort | while read -r file; do
      MTOOLS_SKIP_CHECK=1 \
          SOURCE_DATE_EPOCH=$FROZEN_TIMESTAMP \
          TZ=UTC \
          mcopy -o -p -m -Q "$root_dir/$espmp/$file" "c:/$file"
  done

  # Remove files in boot which were copied to ESP
  empty_dir "$root_dir/$espmp"

  # Format our root partition with xfs
  FAKE_TIME="$(date -d @"$FROZEN_TIMESTAMP" +"%Y-%m-%d %H:%M:%S")"
  export LD_PRELOAD="/usr/lib/faketime/libfaketime.so.1"
  export FAKERANDOM_SEED="0x12345678DEADBEEF"
  export FAKETIME=$FAKE_TIME
  export NO_FAKE_STAT=1

  mkfs.xfs \
    -b size=4096 \
    -d agcount=4 \
    -d noalign \
    -i attr=2 \
    -i projid32bit=1 \
    -i size=512 \
    -l size=67108864 \
    -l su=4096 \
    -l version=2 \
    -m crc=1 \
    -m finobt=1 \
    -m uuid=$FS_UUID_ROOT \
    -n size=16384 \
    -n version=2 \
    -p file=$root_dir \
    $root_partition

  # Ensure / is 0755 or systemd will complain
  # by default it will inherit whatever permission $root_dir will have
  # for consistency lets set it manually.
  xfs_db -x $root_partition -c "inode 128" -c "write core.mode 040755"

  sync
  echo -n 0 > /output/result

  exit 0
  '

# This isn't particularly relevant for how we use this,
# but we need to specify the set of architectures here
# so that the locking done by apko_config doesn't try to
# do a bunch of unsupported architectures.
archs:
- x86_64
- aarch64
