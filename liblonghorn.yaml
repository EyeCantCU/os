package:
  name: liblonghorn
  version: "1.0.2"
  epoch: 0
  description: "C library for Longhorn storage"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rancher/liblonghorn
      tag: v${{package.version}}
      expected-commit: 1baf6127cec97a69be977980eb581f417a1e3e42

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

update:
  enabled: true
  github:
    identifier: rancher/liblonghorn
    use-tag: true
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - gcc
        - glibc-dev
  pipeline:
    - uses: test/tw/ldd-check
    - name: "Compile test"
      runs: |
        cat > test.c <<EOF
        #define _POSIX_C_SOURCE 200809L
        #include <stdio.h>
        #include <stdlib.h>
        #include <assert.h>
        #include <liblonghorn.h>
        #include <sys/types.h>

        int main() {
            struct lh_client_conn *conn = lh_client_allocate_conn();
            assert(conn != NULL);
            // unmap with dummy args
            char buf[64] = {0};
            int unmap_result = lh_client_unmap(conn, buf, sizeof(buf), 0);
            assert(unmap_result != 0);
            lh_client_free_conn(conn);
            printf("passed\\n");
            return 0;
        }
        EOF
        gcc -Wall -Wextra -std=gnu99 -o test test.c -llonghorn
    - name: "Run functional test"
      runs: |
        ls
        ./test | grep -q "passed"
