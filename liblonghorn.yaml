package:
  name: liblonghorn
  version: "1.0.0"
  epoch: 0
  description: "C library for Longhorn storage"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rancher/liblonghorn
      tag: v${{package.version}}
      expected-commit: 53d1c063b95efc8d949b095bd4bf04637230265f

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: liblonghorn-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: rancher/liblonghorn
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
