package:
  name: py3-polib
  version: 1.2.0
  epoch: 0
  description: Pure python library to manipulate, create, modify gettext files (pot, po and mo files).
  copyright:
    - license: MIT

vars:
  pypi-package: polib

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/izimobil/polib.git
      tag: ${{package.version}}
      expected-commit: f7854ac57527485f665ff6b58f4374d5516b25dc

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
