package:
  name: sentry-cli
  version: 2.58.2
  epoch: 0
  description: A command line utility to work with Sentry
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - openssl-dev
      - pkgconf
  environment:
    OPENSSL_NO_VENDOR: "1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/getsentry/sentry-cli
      tag: ${{package.version}}
      expected-commit: b8965a39887e7e268e2e03ec9584d71adc30d81c

  - uses: cargo/build
    with:
      output: sentry-cli

update:
  enabled: true
  github:
    identifier: getsentry/sentry-cli
    strip-prefix: v
    use-tag: true

test:
  # Manual testing is required here as this is meant to directly talk to sentry's platform.
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: sentry-cli
    - uses: test/tw/ver-check
      with:
        bins: sentry-cli
