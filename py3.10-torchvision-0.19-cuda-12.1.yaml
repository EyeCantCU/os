package:
  name: py3.10-torchvision-0.19-cuda-12.1
  version: 0.19.0
  epoch: 0
  description: Datasets, Transforms and Models specific to Computer Vision
  copyright:
    - license: BSD-3-Clause
  target-architecture:
    - x86_64
  resources:
    cpu: 16
    memory: 16Gi
  options:
    no-depends: true
  dependencies:
    runtime:
      # For some reason this isn't detected
      - libgomp
      - openmp-17-dev
      - libjpeg-turbo
      - libpng
      - nvidia-cuda-cudart-12.1
      - nvidia-cuda-nvrtc-12.1
      - nvidia-cuda-nvtx-12.1
      - nvidia-cudnn-8-cuda-12
      - nvidia-cudnn-8
      - nvidia-libcublas-12.1
      - nvidia-libcufft-12.1
      - nvidia-libcurand-12.1
      - nvidia-libcusolver-12.1
      - nvidia-libcusparse-12.1
      - nvidia-nccl-cuda-12.1
      - nvidia-driver
      - cuda-toolkit-12.1
      - nvidia-nccl-cuda-12.1
      - py3.10-numpy
      - py3.10-pyyaml
      - py3.10-typing-extensions
      - py3.10-pillow
      - py3.10-torch-2.4-cuda-12.1

environment:
  contents:
    packages:
      - patchelf
      - build-base
      - bash
      - busybox
      - ca-certificates-bundle
      - cmake
      - py3.10-installer
      - py3.10-numpy
      - py3.10-pip
      - py3.10-setuptools
      - py3.10-wheel
      - python-3.10
      - python-3.10-dev
      - samurai
      - clang-15-dev
      - clang-15
      - libffi-dev
      - libjpeg-dev
      - libpng-dev
      - libpng-utils
      - libjpeg-turbo-dev
      - llvm15
      - llvm15-dev
      - llvm-lld-15
      - clang-15-default
      - openmp-17-dev
      - posix-libc-utils
      - gcc-12-default
      - git
      - coreutils
      - libgomp
      - nvidia-driver
      - nvidia-cuda-cccl-12.1
      - nvidia-cuda-profiler-api-12.1
      - nvidia-nccl-cuda-12.1-dev
      - cuda-toolkit-12.1-dev
      - py3.10-torch-2.4-cuda-12.1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/vision.git
      tag: v${{package.version}}
      expected-commit: 48b1edffdc6f34b766e2b4bbf23b78bd4df94181

  - name: Python Build
    runs: |
      export CUDA_VERSION="12.1"
      export CUDA_HOME="/usr/local/cuda-${CUDA_VERSION}"
      export PATH="$PATH:${CUDA_HOME}/bin"
      export CMAKE_CUDA_ARCHITECTURES=all
      export USE_CUDA=1
      export FORCE_CUDA=1
      export USE_CUDNN=1
      export TORCH_CUDA_ARCH_LIST="5.2 6.0 6.1 7.0+PTX 8.0 8.6 8.7 8.9 9.0"
      export TORCH_NVCC_FLAGS="-Xfatbin -compress-all"

      [ -d "$CUDA_HOME" ] || { echo "CUDA_HOME ($CUDA_HOME) is not a dir"; exit 1; }

      # Disable some warnings
      export CFLAGS="$CFLAGS -Wno-error=nonnull -Wno-nonnull"
      export CXXFLAGS="$CXXFLAGS -Wno-error=nonnull -Wno-nonnull"

      export BUILD_VERSION="${{package.version}}+cu121"

      python setup.py bdist_wheel
            python3.10 -m pip install --verbose \
        --no-index --no-build-isolation --no-deps \
        --force-reinstall --no-compile --prefix=/usr "--root=${{targets.contextdir}}" dist/*.whl
      sitepkgd=$(python3.10 -c 'import site; print(site.getsitepackages()[0])')
      python3.10 -m compileall --invalidation-mode=unchecked-hash -r100 ${{targets.contextdir}}/$sitepkgd

update:
  enabled: true
  github:
    identifier: pytorch/vision
    strip-prefix: v
    tag-filter: v0.19.

test:
  environment:
    contents:
      packages:
        - wolfi-base
        - busybox
  pipeline:
    - uses: python/import
      with:
        python: python3.10
        import: torch
    - uses: python/import
      with:
        python: python3.10
        import: torchvision
    - runs: |
        python3.10 ./quickstart.py > output.out 2>&1
        grep -E "ERROR|None" output.out && exit 1


