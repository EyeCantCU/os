package:
  name: os-shell-bitnami
  version: 1
  epoch: 0
  description: "Meta package for Bitnami's OS shell"
  dependencies:
    runtime:
      - bash
      - ca-certificates
      - ca-certificates-bundle
      - curl
      - ini-file
      - jq
      - procps
      - render-template
      - wait-for-port
      - yq
      - coreutils
      - sed
      - grep
      - util-linux
      - util-linux-misc
      - mount
      - findutils
      - tzdata
      - openssl
      - gzip
      - diffutils
      - gpgv

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: mkdir -p ${{targets.contextdir}}

update:
  enabled: false
  exclude-reason: |
    This is a meta package for packages that comprise Bitnami's OS shell image
