package:
  name: grype-fips
  version: "0.104.1"
  epoch: 1 # CVE-2025-61729
  description: Vulnerability scanner for container images, filesystems, and SBOMs
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/anchore/grype
      tag: v${{package.version}}
      expected-commit: 39f7fa17af2739cafe9b27176d4a68f7c05f21c1

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X main.version=${{package.version}}
      output: grype
      packages: ./cmd/grype

update:
  enabled: true
  github:
    identifier: anchore/grype
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        grype --version
        grype --help
        grype cgr.dev/chainguard/wolfi-base | grep -E "(No vulnerabilities found|VULNERABILITY)"
        grype db list
