package:
  name: grype-fips
  version: "0.95.0"
  epoch: 0
  description: Vulnerability scanner for container images, filesystems, and SBOMs
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/anchore/grype
      tag: v${{package.version}}
      expected-commit: 9fb2497e9b48718ab5b3061c67865b7da7e4b03f

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X main.version=${{package.version}}
      output: grype
      packages: ./cmd/grype

update:
  enabled: true
  github:
    identifier: anchore/grype
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        grype --version
        grype --help
        grype cgr.dev/chainguard/wolfi-base | grep -E "(No vulnerabilities found|VULNERABILITY)"
        grype db list
