package:
  name: sox
  version: 14.4.2
  epoch: 2
  description:
  copyright:
    - license: GPL-2.0 AND LGPL-2.1

environment:
  contents:
    packages:
      - build-base
      - busybox
      - flac-dev
      - lame-dev
      - libmad-dev
      - libogg-dev
      - libtool
      - libvorbis-dev
      - pkgconf-dev

vars:
  soversion: "3"

pipeline:
  - uses: git-checkout
    with:
      repository: https://git.code.sf.net/p/sox/code
      tag: ${{package.name}}-${{package.version}}
      expected-commit: 45b161d73ec087a8e003747b1aed07cd33589bca
      cherry-picks: |
        master/65c7a43ff357d20a375cbc0f2bbbb9184b1da10e: sox_sample_test: clean up nonsense

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

  - name: "upstream tests"
    working-directory: src
    runs: |
      sh tests.sh
      sh testall.sh

subpackages:
  - name: libsox-${{vars.soversion}}
    pipeline:
      - uses: split/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: libsox-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libsox-${{vars.soversion}}==${{package.full-version}}
    test:
      pipeline:
        - uses: test/pkgconf

  - name: sox-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 4858

test:
  pipeline:
    - uses: test/tw/ldd-check
