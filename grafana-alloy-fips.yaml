package:
  name: grafana-alloy-fips
  version: 1.3.1
  epoch: 2
  description: OpenTelemetry Collector distribution with programmable pipelines
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips
      - nodejs-18
      - systemd-dev
      - tzdata
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/alloy
      tag: v${{package.version}}
      expected-commit: e4979b2a2fc575eecb4142e0140d36c56350e418

  - name: Generate UI
    runs: make generate-ui

  - uses: go/bump
    with:
      deps: github.com/docker/docker@v26.1.5 github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension@v0.107.0 github.com/opencontainers/runc@v1.1.14
      replaces: go.opentelemetry.io/collector/extension=go.opentelemetry.io/collector/extension@v0.105.0
      show-diff: true

  - uses: go/build
    with:
      packages: .
      output: alloy
      tags: netgo,builtinassets,promtail_journal_enabled
      go-package: go-fips

  - name: Setup default config files
    runs: |
      mkdir -p ${{targets.contextdir}}/etc/alloy/
      install -m644 -D example-config.alloy ${{targets.contextdir}}/etc/alloy/config.alloy

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        /usr/bin/alloy --version

update:
  enabled: true
  ignore-regex-patterns:
    - -rc
  github:
    identifier: grafana/alloy
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
