package:
  name: grafana-alloy-fips
  version: 1.2.1
  epoch: 2
  description: OpenTelemetry Collector distribution with programmable pipelines
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips
      - nodejs-18
      - tzdata
      - yarn
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/alloy
      tag: v${{package.version}}
      expected-commit: e83e8af406b19c11b102b76f21142f7561a77036

  - uses: go/bump
    with:
      deps: github.com/hashicorp/go-retryablehttp@v0.7.7 google.golang.org/grpc@v1.64.1

  - name: Generate UI
    runs: make generate-ui

  - uses: go/build
    with:
      packages: .
      output: alloy
      tags: netgo,builtinassets,promtail_journal_enabled
      go-package: go-fips

  - name: Setup default config files
    runs: |
      mkdir -p ${{targets.contextdir}}/etc/alloy/
      install -m644 -D example-config.alloy ${{targets.contextdir}}/etc/alloy/config.alloy

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        /usr/bin/alloy --version

update:
  enabled: true
  ignore-regex-patterns:
    - -rc
  github:
    identifier: grafana/alloy
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
