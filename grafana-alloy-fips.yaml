package:
  name: grafana-alloy-fips
  version: "1.8.3"
  epoch: 1
  description: OpenTelemetry Collector distribution with programmable pipelines
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips-md5
      - nodejs-18
      - nofips-node
      - systemd-dev
      - tzdata
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/alloy
      tag: v${{package.version}}
      expected-commit: a3cd3344de6cdbede6a8afb9cd5812fb5180712e

  - name: Generate UI
    runs: |
      make generate-ui

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0
        github.com/snowflakedb/gosnowflake@v1.13.3
        github.com/go-jose/go-jose/v4@v4.0.5

  - uses: go/build
    with:
      packages: .
      output: alloy
      tags: netgo,builtinassets,promtail_journal_enabled
      go-package: go-fips

  - name: Setup default config files
    runs: |
      mkdir -p ${{targets.contextdir}}/etc/alloy/
      install -m644 -D example-config.alloy ${{targets.contextdir}}/etc/alloy/config.alloy

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        alloy --version
        alloy --help
    - runs: |
        /usr/bin/alloy --version

update:
  enabled: true
  ignore-regex-patterns:
    - -rc
  github:
    identifier: grafana/alloy
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
