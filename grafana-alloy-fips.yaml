package:
  name: grafana-alloy-fips
  version: "1.10.2"
  epoch: 1 # GHSA-2464-8j7c-4cjm
  description: OpenTelemetry Collector distribution with programmable pipelines
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - gcc-14-default
      - go-fips-md5
      - nodejs-18
      - nofips-node
      - systemd-dev
      - tzdata
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/alloy
      tag: v${{package.version}}
      expected-commit: b19f8c577aa79fd51de96ab292eedd7838336b09

  - uses: go/bump
    with:
      deps: |-
        github.com/go-viper/mapstructure/v2@v2.4.0

  - name: Generate UI
    runs: |
      make generate-ui

  - uses: go/build
    with:
      packages: .
      output: alloy
      tags: netgo,builtinassets,promtail_journal_enabled
      go-package: go-fips

  - name: Setup default config files
    runs: |
      mkdir -p ${{targets.contextdir}}/etc/alloy/
      install -m644 -D example-config.alloy ${{targets.contextdir}}/etc/alloy/config.alloy

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        alloy --version
        alloy --help
    - runs: |
        /usr/bin/alloy --version

update:
  enabled: true
  ignore-regex-patterns:
    - -rc
  github:
    identifier: grafana/alloy
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
