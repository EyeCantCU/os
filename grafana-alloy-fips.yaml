package:
  name: grafana-alloy-fips
  version: "1.7.5"
  epoch: 4
  description: OpenTelemetry Collector distribution with programmable pipelines
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips-1.23
      - nodejs-18
      - systemd-dev
      - tzdata
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/alloy
      tag: v${{package.version}}
      expected-commit: de1a51cf0ceac3b12e0c4e7bf868a1e818643f38

  - name: Generate UI
    runs: |
      make generate-ui

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v3@v3.0.4
        golang.org/x/oauth2@v0.27.0
        golang.org/x/crypto@v0.35.0
        github.com/expr-lang/expr@v1.17.0
        github.com/golang-jwt/jwt/v4@v4.5.2
        github.com/golang-jwt/jwt/v5@v5.2.2
        golang.org/x/net@v0.38.0
        github.com/snowflakedb/gosnowflake@v1.13.3

  - uses: go/build
    with:
      packages: .
      output: alloy
      tags: netgo,builtinassets,promtail_journal_enabled
      go-package: go-fips

  - name: Setup default config files
    runs: |
      mkdir -p ${{targets.contextdir}}/etc/alloy/
      install -m644 -D example-config.alloy ${{targets.contextdir}}/etc/alloy/config.alloy

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        alloy --version
        alloy --help
    - runs: |
        /usr/bin/alloy --version

update:
  enabled: true
  ignore-regex-patterns:
    - -rc
  github:
    identifier: grafana/alloy
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
