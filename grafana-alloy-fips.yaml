package:
  name: grafana-alloy-fips
  version: "1.11.3"
  epoch: 4 # GHSA-j5w8-q4qc-rx2x
  description: OpenTelemetry Collector distribution with programmable pipelines
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips-md5
      - nodejs-18
      - nofips-node
      - systemd-dev
      - tzdata
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/alloy
      tag: v${{package.version}}
      expected-commit: 091a20eb3eb50a968f129d6094455962e9dd328e

  - runs: |
      # Upstream already have a `replace` directive downgrading from 1.3.x to
      # 1.2.x which go/bump doesn't understand, so it treats this as a
      # downgrade
      sed -i 's,\(github.com/opencontainers/runc\) v1.2.6,\1 v1.2.8,' go.mod

  - uses: go/bump
    with:
      deps: |-
        github.com/opencontainers/selinux@v1.13.0
        github.com/dvsekhvalnov/jose2go@v1.7.0
        golang.org/x/crypto@v0.45.0

  - name: Generate UI
    runs: |
      make generate-ui

  - uses: go/build
    with:
      packages: .
      output: alloy
      tags: netgo,builtinassets,promtail_journal_enabled
      go-package: go-fips

  - name: Setup default config files
    runs: |
      mkdir -p ${{targets.contextdir}}/etc/alloy/
      install -m644 -D example-config.alloy ${{targets.contextdir}}/etc/alloy/config.alloy

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        alloy --version
        alloy --help
    - runs: |
        /usr/bin/alloy --version

update:
  enabled: true
  ignore-regex-patterns:
    - -rc
  github:
    identifier: grafana/alloy
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
