package:
  name: grafana-alloy-fips
  version: 1.5.0
  epoch: 0
  description: OpenTelemetry Collector distribution with programmable pipelines
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips-1.22
      - nodejs-18
      - systemd-dev
      - tzdata
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/alloy
      tag: v${{package.version}}
      expected-commit: 3a39c06613073f2cc76dab03c7cf8210569871e9

  - name: Generate UI
    runs: |
      make generate-ui

  - uses: go/bump
    with:
      deps: github.com/golang-jwt/jwt/v4@v4.5.1

  - uses: go/build
    with:
      packages: .
      output: alloy
      tags: netgo,builtinassets,promtail_journal_enabled
      go-package: go-fips

  - name: Setup default config files
    runs: |
      mkdir -p ${{targets.contextdir}}/etc/alloy/
      install -m644 -D example-config.alloy ${{targets.contextdir}}/etc/alloy/config.alloy

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        alloy --version
        alloy --help
    - runs: |
        /usr/bin/alloy --version

update:
  enabled: true
  ignore-regex-patterns:
    - -rc
  github:
    identifier: grafana/alloy
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
