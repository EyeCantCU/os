package:
  name: chart-iamguarded-prometheus
  version: "2.1.16"
  epoch: 0
  description: prometheus iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: prometheus/${{package.version}}
      expected-commit: c4472d23e7bd22fb9d7b5655c0a7979784357668

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/prometheus

  - uses: charts/package
    with:
      chart-path: iamguarded/prometheus

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: prometheus/
    use-tag: true
    tag-filter-prefix: prometheus/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /prometheus
