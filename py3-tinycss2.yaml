package:
  name: py3-tinycss2
  version: "1.5.1"
  epoch: 0
  description: A tiny CSS parser
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0

vars:
  pypi-package: tinycss2
  module-name: tinycss2

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-wheel

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Kozea/tinycss2
      tag: v${{package.version}}
      expected-commit: f295a49711a4d348664bba7fb34113b3b4b78cb2

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-webencodings
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.module-name}}
        - runs: |
            set -euo pipefail

            # Test CSS parsing
            python${{range.key}} <<'EOF'
            import tinycss2

            # Parse a simple CSS stylesheet
            css_string = """
            body {
              font-family: sans-serif;
              color: #333;
            }

            h1 {
              font-size: 2em;
              color: blue;
            }

            .container {
              max-width: 1200px;
              margin: 0 auto;
            }
            """

            # Parse the CSS
            rules = tinycss2.parse_stylesheet(css_string)

            # Verify we got rules back
            assert len(rules) > 0, "Should parse CSS rules"
            assert any(hasattr(rule, 'prelude') for rule in rules), "Should have rule objects with preludes"

            # Test parsing a single declaration
            declaration = tinycss2.parse_one_declaration("color: red")
            assert declaration is not None, "Should parse declaration"
            assert declaration.name == "color", "Should parse property name"

            # Test parsing component values
            tokens = tinycss2.parse_component_value_list("10px 20px 30px")
            assert len(tokens) > 0, "Should parse component values"

            # Test color parsing
            color_tokens = tinycss2.parse_one_component_value("#ff0000")
            assert color_tokens is not None, "Should parse color value"

            print("tinycss2 CSS parsing test passed!")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/byproductpackage
