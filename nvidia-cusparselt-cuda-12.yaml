package:
  name: nvidia-cusparselt-cuda-12
  version: 0.8.0.4
  epoch: 1
  description: A High-Performance CUDA Library for Sparse Matrix-Matrix Multiplication
  copyright:
    - license: LicenseRef-NVIDIA-CUDA-cusparselt
      license-path: LICENSE
  options:
    no-depends: true

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+)(?:\.\d+)?'
    replace: '$1'
    to: cuda-major-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cusparselt/redist/libcusparse_lt/linux-sbsa/libcusparse_lt-linux-sbsa-${{package.version}}_cuda${{vars.cuda-major-version}}-archive.tar.xz"
          expected-sha256: "b59e2f8ffd154b156b2d74ccd7cad7775385693bec8cb9562596060072c515f2"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cusparselt/redist/libcusparse_lt/linux-x86_64/libcusparse_lt-linux-x86_64-${{package.version}}_cuda${{vars.cuda-major-version}}-archive.tar.xz"
          expected-sha256: "483954591766bade877becef126d53908d5fef5d7468b503736af37388669c08"
          timeout: 30

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/local/cuda-${{vars.cuda-major-version}}/
      mv include ${{targets.contextdir}}/usr/local/cuda-${{vars.cuda-major-version}}/
      mv lib ${{targets.contextdir}}/usr/local/cuda-${{vars.cuda-major-version}}/lib64

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    test:
      pipeline:
        - uses: test/tw/header-check

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify libcusparselt installation and license
      runs: |
        # Verify basic directory structure
        test -d /usr/local/cuda-${{vars.cuda-major-version}}
