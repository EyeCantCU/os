package:
  name: chart-iamguarded-minio
  version: "17.0.23"
  epoch: 0
  description: minio iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: minio/${{package.version}}
      expected-commit: c06b3224b550084be242b8546cf1ec66e03cef1c

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/minio

  - uses: charts/package
    with:
      chart-path: iamguarded/minio

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: minio/
    use-tag: true
    tag-filter-prefix: minio/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /minio
