package:
  name: chart-iamguarded-minio
  version: 16.0.10
  epoch: 2
  description: minio iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: minio/${{package.version}}
      expected-commit: 055477f89bc7da14e5674c15f1f280f9ae0bdf0c

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/minio

  - uses: charts/package
    with:
      chart-path: iamguarded/minio

update:
  enabled: false
  exclude-reason: |
    For now we do not support major version 17, withdrawing and pausing updates for now.
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: minio/
    use-tag: true
    tag-filter-prefix: minio/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /minio
