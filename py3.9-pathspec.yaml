package:
  name: py3.9-pathspec
  version: "1.0.1"
  epoch: 0
  description: "Utility library for gitignore style pattern matching of file paths"
  copyright:
    - license: MPL-2.0
  dependencies:
    provider-priority: 0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3.9-build
      - py3.9-flit-core
      - py3.9-installer
      - py3.9-pip
      - py3.9-wheel
      - python-3.9

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/p/pathspec/pathspec-${{package.version}}.tar.gz
      expected-sha512: 8df3915ab4afd2b7f7d8f3974aeb9e5a5c821609847f1b7645333f1056f328e42249cec89e5ef92cdaa4cf5f103147d41f5ef159580e725fc637d770992f15cd

  - uses: py/pip-build-install
    with:
      python: python3.9
      dest: ${{targets.contextdir}}

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: pathspec

update:
  enabled: true
  release-monitor:
    identifier: 23424
