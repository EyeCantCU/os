package:
  name: py3.9-pathspec
  version: "1.0.0"
  epoch: 0
  description: "Utility library for gitignore style pattern matching of file paths"
  copyright:
    - license: MPL-2.0
  dependencies:
    provider-priority: 0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3.9-build
      - py3.9-flit-core
      - py3.9-installer
      - py3.9-pip
      - py3.9-wheel
      - python-3.9

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/p/pathspec/pathspec-${{package.version}}.tar.gz
      expected-sha512: dce406457091e60ef08d88ae8c7f1d4ac4e40851f16c3b548f3c17969b0d25bb764256f5ee9e0d667e3ddd21e916f41a0f1ad050a8abba9add41c9b7c67fed95

  - uses: py/pip-build-install
    with:
      python: python3.9
      dest: ${{targets.contextdir}}

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: pathspec

update:
  enabled: true
  release-monitor:
    identifier: 23424
