package:
  name: ytt-fips
  version: "0.52.1"
  epoch: 0 # CVE-2025-47907
  description: YAML templating tool that works on YAML structure instead of text
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: cb3fd06302d7363f4903b46a8fbdb8a58fab163a
      repository: https://github.com/carvel-dev/ytt
      tag: v${{package.version}}

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/ytt
      output: ytt
      ldflags: -X github.com/vmware-tanzu/carvel-ytt/pkg/version.Version=v${{package.version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: carvel-dev/ytt
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - name: version check
      runs: ytt --version
    - name: simple YAML templating from stdin
      runs: |
        echo "name: world" | ytt -f -
    - name: simple YAML templating from file
      runs: |
        cat <<EOF > test.yaml
        name: world
        # comments are ignored in the output
        demo_list:
        - hello
        - world
        demo_map:
          demo_key: demo_value
        EOF
        ytt -f test.yaml
