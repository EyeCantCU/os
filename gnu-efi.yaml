package:
  name: gnu-efi
  version: "4.0.4"
  epoch: 0
  description: Develop EFI applications for ARM-64, ARM-32, x86_64, IA-64 (IPF), IA-32 (x86), and MIPS platforms using the GNU toolchain and the EFI development environment.
  copyright:
    - license: GPL-2.0-or-later OR BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ncroxon/gnu-efi
      tag: ${{package.version}}
      expected-commit: 37cd8f069bde6715eebdc5e38a8f15ee6de5edcf

  - uses: autoconf/make

  - uses: autoconf/make-install
    with:
      opts: PREFIX=/usr

  - runs: |
      rm -rf ${{targets.contextdir}}/usr/lib/gnuefi

test:
  pipeline:
    - uses: test/pkgconf

update:
  enabled: true
  github:
    identifier: ncroxon/gnu-efi
