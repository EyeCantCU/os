package:
  name: chart-bitwarden-sdk-server
  version: "0.5.2"
  epoch: 0
  description: Bitwarden SDK Server Helm chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - helm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/external-secrets/bitwarden-sdk-server
      tag: v${{package.version}}
      expected-commit: 1d36b6f40475709b96772c7977affc46624b28b2

  # Stamp appVersion to match release (source has placeholder values)
  - runs: |
      cd deploy/charts/bitwarden-sdk-server
      yq -i '.appVersion = "v${{package.version}}"' Chart.yaml

  - uses: charts/package
    with:
      chart-path: deploy/charts/bitwarden-sdk-server
      chart-version: v${{package.version}}
      # Template: repository:tag (no digest field, use pseudo_tag)
      images: |
        bitwarden-sdk-server:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [bitwarden-sdk-server]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: external-secrets/bitwarden-sdk-server
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
