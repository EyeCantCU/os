package:
  name: prometheus-node-exporter-1.4
  version: 1.4.1
  epoch: 29 # GHSA-j5w8-q4qc-rx2x
  description: Prometheus Exporter for machine metrics
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/node_exporter
      tag: v${{package.version}}
      expected-commit: a954c9fea6bcccea7f68a77a002a2a878ef1d60c

  - uses: go/bump
    with:
      deps: |-
        google.golang.org/protobuf@v1.33.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        github.com/opencontainers/selinux@v1.13.0
        golang.org/x/crypto@v0.45.0
      tidy-compat: 1.17

  - runs: |
      make build

  - runs: |
      install -Dm755 node_exporter "${{targets.destdir}}"/usr/bin/node_exporter

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.4.

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - runs: |
        node_exporter --version
        node_exporter --help
    - name: Test node_exporter metrics endpoint
      uses: test/daemon-check-output
      with:
        start: /usr/bin/node_exporter --web.listen-address=:9100
        expected_output: "Listening on"
        timeout: "30"
        post: |
          # Wait for the HTTP endpoint to be ready
          wait-for-it localhost:9100 -t 30

          # Query the metrics endpoint
          metrics=$(curl -f -s http://localhost:9100/metrics)

          # Verify response contains valid Prometheus metrics format
          echo "$metrics" | grep -F "# HELP" || {
            echo "FAIL: Expected '# HELP' lines in metrics output"
            exit 1
          }
          echo "$metrics" | grep -F "# TYPE" || {
            echo "FAIL: Expected '# TYPE' lines in metrics output"
            exit 1
          }

          # Verify at least one basic system metric is present
          # Check for CPU or memory metrics which should always be available
          if echo "$metrics" | grep -E "^node_cpu_seconds_total|^node_memory_MemTotal_bytes"; then
            echo "SUCCESS: Found expected system metrics"
          else
            echo "FAIL: Expected node_cpu_seconds_total or node_memory_MemTotal_bytes in metrics"
            exit 1
          fi

          echo "SUCCESS: node_exporter is serving valid Prometheus metrics"
