# source is gitlab so we can't use github updates to get expected commit
# let's still auto create the PR, it will fail as expected commit will be wrong
# however it will be easy to fix
#nolint:git-checkout-must-use-github-updates
package:
  name: gitaly-fips-17.0
  version: 17.0.5
  epoch: 0
  description:
  copyright:
    - license: MIT
  dependencies:
    provides:
      - gitaly-fips=${{package.full-version}}
    runtime:
      - gitaly-backup-fips-${{vars.major-minor-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - busybox
      - make
      - go-fips
  environment:
    CGO_ENABLED: 1
    FIPS_MODE: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/gitlab-org/gitaly.git
      tag: v${{package.version}}
      expected-commit: cfe8898de52c5c1dbf68140a01a3e8b7c4e0ae15

  - uses: go/bump
    with:
      deps: github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0

  - runs: |
      make install DESTDIR="${{targets.destdir}}" PREFIX=/usr

  - uses: strip

subpackages:
  - name: gitaly-backup-fips-${{vars.major-minor-version}}
    dependencies:
      provides:
        - gitaly-backup-fips=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/gitaly-backup ${{targets.contextdir}}/usr/bin/

update:
  enabled: true
  release-monitor:
    identifier: 373175

test:
  pipeline:
    - runs: |
        gitaly -v | grep "${{package.version}}"
        gitaly-blackbox -version | grep "${{package.version}}"
        gitaly-backup -v | grep "${{package.version}}"
    - uses: test/go-fips-check
