package:
  name: tekton-pipelines-fips-1.0
  version: "1.0.0"
  epoch: 4
  description: A cloud-native Pipeline resource.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - tekton-pipelines-fips=${{package.full-version}}

vars:
  base-package-name: tekton-pipelines

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+.\d+)\.\d+$
    replace: $1
    to: major-minor-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tektoncd/pipeline
      tag: v${{package.version}}
      expected-commit: d9974e2cce817a43c69789161f0824e05a7572af

data:
  - name: cmds
    items:
      controller: controller
      entrypoint: entrypoint
      events: events
      nop: nop
      resolvers: resolvers
      sidecarlogresults: sidecarlogresults
      webhook: webhook
      workingdirinit: workingdirinit

subpackages:
  - range: cmds
    name: ${{vars.base-package-name}}-${{range.key}}-fips-${{vars.major-minor-version}}
    description: tekton pipelines ${{range.key}} fips
    dependencies:
      provides:
        - ${{vars.base-package-name}}-${{range.key}}-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/${{range.key}}
          output: ${{range.key}}
          go-package: go-fips-md5
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: ^${{vars.base-package-name}}-${{range.key}}-fips
        - runs: |
            if [ ${{range.key}} != "webhook" ]
            then
              ${{range.key}} --help
            fi

  - range: cmds
    name: ${{vars.base-package-name}}-${{range.key}}-fips-${{vars.major-minor-version}}-compat
    description: tekton pipelines ${{range.key}} compat package
    dependencies:
      provides:
        - ${{vars.base-package-name}}-${{range.key}}-fips-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/ko-app
          ln -sf /usr/bin/${{range.key}} ${{targets.contextdir}}/ko-app/${{range.key}}
    test:
      environment:
        contents:
          packages:
            - ${{vars.base-package-name}}-${{range.key}}-fips-${{vars.major-minor-version}}
      pipeline:
        - runs: stat -L /ko-app/${{range.key}}

update:
  enabled: true
  github:
    identifier: tektoncd/pipeline
    strip-prefix: v
    tag-filter: v1.0.

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
