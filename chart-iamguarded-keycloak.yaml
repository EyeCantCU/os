package:
  name: chart-iamguarded-keycloak
  version: "24.8.0"
  epoch: 0
  description: keycloak iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common
      - chart-iamguarded-postgresql

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: keycloak/${{package.version}}
      expected-commit: aea8732d32649ae7401c5a951cf0f0519fda907b

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/keycloak

  - uses: charts/package
    with:
      chart-path: iamguarded/keycloak

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: keycloak/
    use-tag: true
    tag-filter-prefix: keycloak/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /keycloak
