package:
  name: kubo-fips
  version: "0.39.0"
  epoch: 0 # GHSA-j5w8-q4qc-rx2x
  description: An IPFS implementation in Go with WebTransport disabled for FIPS compatibility
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - coreutils
      - dash-binsh
      - findutils
      - gosu-fips
      - posix-libc-utils
      - tini

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - fuse3
      - openssl

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2896aed9f41072d5cb420c790db5ea1a3536050a
      repository: https://github.com/ipfs/kubo
      tag: v${{package.version}}

  # NOTE: The go-libp2p library's WebTransport implementation isn't FIPS-compliant
  # due to its use of non-validated cryptographic libraries. These patches disable
  # WebTransport to achieve FIPS compliance. If go-libp2p becomes FIPS-compliant
  # in the future, these patches may be removed, please remove the test as well in that case.
  - name: Apply config patch
    uses: patch
    with:
      patches: |
        disable-webtransport-config.patch
        disable-webtransport-source.patch

  - name: vendoring go dependencies for patching
    runs: |
      go mod vendor

  - name: Apply vendor patches for FIPS compatibility
    uses: patch
    with:
      patches: |
        disable-webtransport-vendor-defaults.patch

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/ipfs
      output: ipfs
      tags: openssl
      ldflags: |
        -X 'github.com/ipfs/kubo/version.CurrentCommit=$(git rev-parse HEAD)'

  - runs: |
      mkdir -p ${{targets.destdir}}/data/ipfs
      mkdir -p ${{targets.destdir}}/ipfs ${{targets.destdir}}/ipns
      mkdir -p ${{targets.destdir}}/container-init.d

      install -Dm755 bin/container_daemon ${{targets.destdir}}/usr/bin/start_ipfs
      install -Dm755 bin/container_init_run ${{targets.destdir}}/usr/bin/container_init_run

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility symlinks for IPFS container entrypoint scripts
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/bin
          ln -sf /usr/bin/start_ipfs ${{targets.contextdir}}/usr/local/bin/start_ipfs
          ln -sf /usr/bin/container_init_run ${{targets.contextdir}}/usr/local/bin/container_init_run
    test:
      pipeline:
        - runs: |
            # Verify symlinks exist and point to correct targets
            stat /usr/local/bin/start_ipfs
            stat /usr/local/bin/container_init_run

            # Check that symlinks point to the right locations
            test "$(readlink /usr/local/bin/start_ipfs)" = "/usr/bin/start_ipfs"
            test "$(readlink /usr/local/bin/container_init_run)" = "/usr/bin/container_init_run"

            # Verify the targets are executable
            test -x /usr/bin/start_ipfs
            test -x /usr/bin/container_init_run

test:
  environment:
    accounts:
      users:
        - username: ipfs
          uid: 1000
          gid: 1000
    environment:
      IPFS_PATH: /data/ipfs
      SRC_DIR: /kubo
      GOLOG_LOG_LEVEL: ""
    contents:
      packages:
        - ${{package.name}}
        - ${{package.name}}-compat
        - curl
  pipeline:
    - uses: test/go-fips-check
    - name: Verify IPFS functionality
      runs: |
        ipfs init | grep -q "initializing IPFS node"
        ipfs version | grep -q "ipfs version"
        ipfs id | grep -q '"ID"' && ipfs id | grep -q '"PublicKey"' && ipfs id | grep -q '"AgentVersion"'
    - name: Verify WebTransport is disabled
      runs: |
        ! ipfs config Addresses.Swarm | grep -q webtransport || {
          echo "WebTransport listeners still present!"
          exit 1
        }
        echo "WebTransport successfully disabled"
    - name: Test container entrypoint scripts installed
      runs: |
        # Verify entrypoint scripts and directories are installed
        test -x /usr/local/bin/start_ipfs
        test -x /usr/local/bin/container_init_run
        test -d /container-init.d
    - name: Test container entrypoint with daemon startup
      pipeline:
        - name: "Launch IPFS daemon"
          uses: test/daemon-check-output
          with:
            start: |
              /sbin/tini -- /usr/local/bin/start_ipfs daemon --migrate=true --agent-version-suffix=docker
            timeout: 15
            expected_output: |
              Initializing daemon...
              Daemon is ready
              Gateway server listening on
              Swarm listening on
            post: |
              echo "Testing basic IPFS functionality..."

              echo "test content" > testfile.txt || { echo "Failed to create test file"; exit 1; }
              echo "Test file created"

              HASH=$(ipfs add -q testfile.txt) || { echo "Failed to add file to IPFS"; exit 1; }
              echo "Added file with hash: $HASH"

              if ipfs cat $HASH | grep -q "test content"; then
                echo "File retrieval successful"
              else
                echo "File retrieval failed"
                exit 1
              fi

              echo "All IPFS functionality tests completed successfully!"

              # Test API health check
              echo "Testing API endpoint..."
              sleep 3
              API_STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:5001/api/v0/version)
              if [ "$API_STATUS" -eq 200 ]; then
                  echo "API health check passed with status code 200"
              else
                  echo "API health check failed with status code $API_STATUS"
                  exit 1
              fi

update:
  enabled: true
  github:
    identifier: ipfs/kubo
    strip-prefix: v
