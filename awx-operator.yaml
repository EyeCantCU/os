package:
  name: awx-operator
  version: 2.19.1
  epoch: 3
  description: An Ansible AWX operator for Kubernetes built with Operator SDK and Ansible.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ansible-operator
      - bash-binsh
      - coreutils
      - openssl

environment:
  contents:
    packages:
      - busybox
      - py3-ansible-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ansible/awx-operator
      tag: ${{package.version}}
      expected-commit: dd37ebd440edf953d822f2c134833a44a8e77532

  - runs: |
      mkdir -p ${{targets.contextdir}}/opt/ansible
      cp requirements.yml ${{targets.contextdir}}/opt/ansible/requirements.yml
      HOME=${{targets.contextdir}}/opt/ansible ansible-galaxy collection install -r ${{targets.contextdir}}/opt/ansible/requirements.yml
      cp watches.yaml ${{targets.contextdir}}/opt/ansible/watches.yaml
      cp -r roles ${{targets.contextdir}}/opt/ansible/roles
      cp -r playbooks ${{targets.contextdir}}/opt/ansible/playbooks

update:
  enabled: true
  github:
    identifier: ansible/awx-operator

test:
  pipeline:
    - name: Check Ansible files
      runs: |
        test -f /opt/ansible/watches.yaml
    - uses: test/kwok/cluster
    - name: Smoke test run
      runs: |
        cd /opt/ansible || exit

        # Apply all CRDs required by AWX Operator v2.19.1
        kubectl apply -f https://raw.githubusercontent.com/ansible/awx-operator/${{package.version}}/config/crd/bases/awx.ansible.com_awxs.yaml
        kubectl apply -f https://raw.githubusercontent.com/ansible/awx-operator/${{package.version}}/config/crd/bases/awx.ansible.com_awxbackups.yaml
        kubectl apply -f https://raw.githubusercontent.com/ansible/awx-operator/${{package.version}}/config/crd/bases/awx.ansible.com_awxrestores.yaml
        kubectl apply -f https://raw.githubusercontent.com/ansible/awx-operator/${{package.version}}/config/crd/bases/awx.ansible.com_awxmeshingresses.yaml

        ansible-operator run >awx-operator.log 2>&1 &
        sleep 1
        grep -q '"Starting Controller","controller":"awx-controller"' awx-operator.log
