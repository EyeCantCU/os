package:
  name: nvidia-nccl-cuda-12.1
  version: 2.22.3
  epoch: 4
  description: Optimized primitives for collective multi-GPU communication
  copyright:
    - license: LicenseRef-NVIDIA-nccl-BSD-3-Clause
      license-path: LICENSE.txt
  target-architecture:
    - x86_64
  resources:
    cpu: 16
    memory: 32Gi
  dependencies:
    provides:
      - ${{package.name}}-dev=${{package.full-version}}

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - coreutils
      - gcc-12-default
      - nvidia-cuda-cccl-12.1
      - nvidia-cuda-cudart-12.1
      - nvidia-cuda-cudart-12.1-dev
      - nvidia-cuda-nvcc-12.1
      - nvidia-cuda-nvcc-12.1-dev
      - nvidia-cuda-nvrtc-12.1
      - nvidia-cuda-nvrtc-12.1-dev
      - nvidia-cuda-nvtx-12.1
      - nvidia-cuda-nvtx-12.1-dev
      - nvidia-cuda-profiler-api-12.1
      - nvidia-cudnn-8-cuda-12-dev
      # Cuda
      - nvidia-driver
      - nvidia-libcublas-12.1
      - nvidia-libcublas-12.1-dev
      - nvidia-libcufft-12.1
      - nvidia-libcufft-12.1-dev
      - nvidia-libcurand-12.1
      - nvidia-libcurand-12.1-dev
      - nvidia-libcusolver-12.1
      - nvidia-libcusolver-12.1-dev
      - nvidia-libcusparse-12.1
      - nvidia-libcusparse-12.1-dev
      - nvidia-libnvjitlink-12.1
      - nvidia-libnvjitlink-12.1-dev
      # python 3.12 had isssues with many CUDA builds, so using python-3.11
      - python-3.11

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/nccl
      tag: v${{package.version}}-1
      expected-commit: 178b6b759074597777ce13438efb0e0ba625e429

  - runs: |
      # default CUDA_HOME is /usr/local/cuda, hence explicit declaration
      make -j$nproc src.build CUDA_HOME=/usr/local/cuda-12.1

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/lib
      mkdir -p ${{targets.destdir}}/usr/include
      mv ./build/lib/* ${{targets.destdir}}/usr/lib
      mv ./build/include/* ${{targets.destdir}}/usr/include

# TODO(pnasrat): re-enable once have build dep ordering fixed
# subpackages:
#   - name: ${{package.name}}-dev
#     description: ${{package.name}} development headers
#     pipeline:
#       - uses: split/dev
#     dependencies:
#       runtime:
#         - nvidia-nccl-cuda-12.1
update:
  enabled: false
  github:
    identifier: NVIDIA/nccl
    strip-prefix: v
    strip-suffix: "-1"
    use-tag: true
    tag-filter: v2

test:
  environment:
    environment:
      HOME: /home/build
    contents:
      packages:
        - nvidia-nccl-cuda-12.1-dev
        - bash
        - build-base
        - ca-certificates-bundle
        - cmake
        - gcc-12-default
        - isl-dev
        - mpc-dev
        - python-3.11-dev
        # Cuda
        - nvidia-driver
        - nvidia-cuda-cccl-12.1
        - nvidia-cuda-profiler-api-12.1
        - nvidia-cudnn-8-cuda-12-dev
        - cuda-toolkit-12.1-dev
  pipeline:
    - uses: git-checkout
      with:
        repository: https://github.com/NVIDIA/nccl-tests
        tag: v2.13.9
        expected-commit: c6afef0b6f76ffc55d4172d971be6cf5a08a73a4
    - runs: |
        # We are not actually running the tests, but just compiling them. Running the tests requires GPU's
        make CUDA_HOME=/usr/local/cuda-12.1
    - uses: test/pkgconf
    - uses: test/tw/ldd-check
