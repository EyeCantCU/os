package:
  name: selinux-policy
  version: "42.15"
  epoch: 6
  description: "SELinux policy"
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      # fixfiles needs these
      - coreutils
      - grep
      - merged-sbin
      - wolfi-baselayout

vars:
  common-args: -O -j $(nproc) V=1 VERBOSE=1 DISTRO=redhat UBAC=n DIRECT_INITRC=n MONOLITHIC=n MLS_CATS=1024 MCS_CATS=1024 UNK_PERMS=allow NAME=targeted TYPE=mcs

environment:
  contents:
    packages:
      - build-base
      - busybox
      - checkpolicy
      - coreutils
      - m4
      - policycoreutils
      - py3.13-sepolgen
      - python-3.13
      - semodule-utils

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fedora-selinux/selinux-policy
      tag: v${{package.version}}
      expected-commit: 496f5d2328274687452604e8d7e669c00f3521b8

  - uses: git-checkout
    with:
      # how to join the two repos?
      repository: https://github.com/containers/container-selinux
      tag: v2.242.0
      expected-commit: edfbda465d37deb2a831330a2c3c65b557e6dff5
      destination: container-selinux

  - runs: |
      git -c "user.name=Melange Build" -c "user.email=melange-build@cgr.dev" am *.patch

  - runs: |
      # join container policy
      cp container-selinux/container.* policy/modules/contrib
      # lots of dir/file creation
      # create policy defaults
      make ${{vars.common-args}} bare
      make ${{vars.common-args}} conf
      # install policy defaults
      install -p -m0644 ./dist/targeted/booleans.conf ./policy/booleans.conf
      install -p -m0644 ./dist/targeted/users ./policy/users
      install -p -m0644 ./dist/targeted/modules.conf ./policy/modules.conf
      make ${{vars.common-args}} base.pp
      make ${{vars.common-args}} validate
      make ${{vars.common-args}} modules
      make ${{vars.common-args}} DESTDIR=${{targets.contextdir}} install
      make ${{vars.common-args}} DESTDIR=${{targets.contextdir}} install-appconfig
      mkdir -p ${{targets.contextdir}}/var/lib/selinux/targeted
      make ${{vars.common-args}} DESTDIR=${{targets.contextdir}} SEMODULE="semodule -p ${{targets.contextdir}} -X 100 " load
      : > ${{targets.contextdir}}/etc/selinux/config
      echo SELINUX=enforcing >> ${{targets.contextdir}}/etc/selinux/config
      echo SELINUXTYPE=targeted >> ${{targets.contextdir}}/etc/selinux/config

subpackages:
  - name: ${{package.name}}-permissive
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/etc/selinux
          : > ${{targets.contextdir}}/etc/selinux/config
          echo SELINUX=permissive >> ${{targets.contextdir}}/etc/selinux/config
          echo SELINUXTYPE=targeted >> ${{targets.contextdir}}/etc/selinux/config

update:
  enabled: true
  github:
    identifier: fedora-selinux/selinux-policy
    use-tag: true
    tag-filter: v
    strip-prefix: v
