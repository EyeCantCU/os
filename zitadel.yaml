package:
  name: zitadel
  version: "3.3.2"
  epoch: 0
  description: Identity infrastructure, simplified for you.
  copyright:
    - license: AGPL-3.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: b76d8d37cbc6da7e062648083d80c03a7d89c6cd
      repository: https://github.com/zitadel/zitadel
      tag: v${{package.version}}

  # - uses: go/bump
  #   with:
  #     deps: |-
  #       github.com/cloudflare/circl@v1.6.1
  #       github.com/go-chi/chi/v5@v5.2.2


  - uses: go/build
    with:
      output: caddy
      packages: ./cmd/caddy

subpackages:
  - name: caddy-man
    description: caddy manpages
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share
          "${{targets.destdir}}"/usr/bin/caddy manpage --directory "${{targets.subpkgdir}}"/usr/share/

  - name: caddy-src
    description: Caddy sources
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/src/caddy"
          tar xfv caddy-src.tar -C "${{targets.subpkgdir}}/usr/src/caddy"

update:
  enabled: true
  manual: false
  github:
    identifier: caddyserver/caddy
    strip-prefix: v
    tag-filter: v
    use-tag: true

