package:
  name: py3-phonemizer
  version: 3.3.0
  epoch: 0
  description: Simple phonemization of words and texts in many languages.
  copyright:
    - license: GPL-3.0-only

vars:
  pypi-package: phonemizer

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bootphon/phonemizer.git
      tag: v${{package.version}}
      expected-commit: 3ed323f0c77797b829092b07a8a4b08ee6f71187

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-attrs
        - py${{range.key}}-dlinfo
        - py${{range.key}}-joblib
        - py${{range.key}}-segments
        - py${{range.key}}-typing-extensions
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
