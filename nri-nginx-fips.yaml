package:
  name: nri-nginx-fips
  version: "3.6.3"
  epoch: 1
  description: New Relic Infrastructure nginx Integration (FIPS)
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-nginx
      expected-commit: 94223e1e7142a0dcf9c9bd30efbc433c0ab7bb55
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-nginx
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-nginx ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-nginx
          install -Dm644 legacy/nginx-definition.yml ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/nginx-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-nginx
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-nginx
    - uses: test/tw/ver-check
      with:
        bins: nri-nginx
        version-flag: "-show_version"
    - name: Test binary execution
      runs: |
        nri-nginx 2>&1 | grep -q "can't continue"
