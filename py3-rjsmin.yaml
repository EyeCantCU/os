package:
  name: py3-rjsmin
  version: 1.2.4
  epoch: 0
  description: Fast javascript minifier for Python
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: rjsmin

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ndparker/rjsmin.git
      tag: ${{package.version}}
      expected-commit: 92e1e6c3202adb1bad7dc49f63ffa0c9ae76c270

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} -m rjsmin <<EOF | xargs | grep -F -e '{hello:world}'
            {
              "hello": "world"
            }
            EOF

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
