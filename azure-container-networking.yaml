package:
  name: azure-container-networking
  version: "1.7.9"
  epoch: 1 # CVE-2025-61729
  description: Azure container netowrking
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Azure/azure-container-networking.git
      tag: v${{package.version}}
      expected-commit: 21426497ecfb6a8f2a7e67f6553972f291b90c49

subpackages:
  - name: azure-vnet-cni
    pipeline:
      - uses: autoconf/make
        with:
          opts: azure-cni-plugin
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin/
          ARCH=""
          if [ "${{build.arch}}" = "aarch64" ]; then
            ARCH=arm64
          fi

          if [ "${{build.arch}}" = "x86_64" ]; then
            ARCH=amd64
          fi

          # I've left out the telemetry stuff for now
          # I see the binary on my AKS hosts but don't see the configuration anywhere
          cp output/linux_$ARCH/cni/azure-vnet  ${{targets.subpkgdir}}/usr/bin/
          cp output/linux_$ARCH/cni/azure-vnet-ipam ${{targets.subpkgdir}}/usr/bin/
          cp output/linux_$ARCH/cni/azure-vnet-ipamv6 ${{targets.subpkgdir}}/usr/bin/
          cp output/linux_$ARCH/cni/azure-vnet-stateless ${{targets.subpkgdir}}/usr/bin/

          mkdir -p ${{targets.subpkgdir}}/etc/cni/net.d
          mv output/linux_$ARCH/cni/10-azure.conflist ${{targets.subpkgdir}}/etc/cni/net.d
    test:
      pipeline:
        - runs: |
            azure-vnet --help
            azure-vnet-ipam --help
            azure-vnet-ipamv6 --help
            azure-vnet-stateless --help

update:
  enabled: true
  github:
    identifier: Azure/azure-container-networking
    strip-prefix: v
  ignore-regex-patterns:
    - azure-
    - ipv6

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
