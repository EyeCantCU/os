# Adapted from: https://github.com/GoogleCloudPlatform/guest-configs/blob/master/packaging/google-compute-engine.spec
package:
  name: google-guest-config
  version: "20250501.00"
  epoch: 0
  description: "google guest config"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - google-compute-engine-oslogin
      - google-guest-agent
      - jq
      - nvme-cli
      - networkd-dispatcher
      - curl
      - busybox
      - ethtool
      - bash

environment:
  contents:
    packages:
      - busybox
      - coreutils
      - findutils

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GoogleCloudPlatform/guest-configs.git
      tag: ${{package.version}}
      expected-commit: 8cd404e025df0fec16b99420d23ec50fd70a960f

  - runs: |
      cd src
      # Remove unused configs
      rm -rf ./etc/apt ./etc/dhcp ./etc/dracut.conf.d ./etc/NetworkManager ./etc/rsyslog.d ./etc/sysconfig
      rm -rf ./lib/dracut
      # Fixup the paths for usr merge
      mkdir -p ${{targets.destdir}}/usr/bin
      mkdir -p ${{targets.destdir}}/usr/lib
      mv ./sbin/* ${{targets.destdir}}/usr/bin/
      mv ./lib/* ${{targets.destdir}}/usr/lib/
      # Remove dhclient script
      rm -rf ${{targets.destdir}}/usr/bin/google-dhclient-script
      rmdir ./lib ./sbin
      find . -exec cp -a --parents {} ${{targets.destdir}} \;

update:
  enabled: true
  github:
    identifier: GoogleCloudPlatform/guest-configs
    use-tag: true

test:
  pipeline:
    - runs: |
        # Check Critical Files
        test -f /usr/lib/udev/rules.d/75-gce-network.rules
        test -f /usr/lib/udev/rules.d/65-gce-disk-naming.rules
        test -x /usr/lib/networkd-dispatcher/routable.d/google_hostname.sh

        # Check critical commands
        for cmd in \
          gce-nic-naming \
          google_optimize_local_ssd \
          google_set_hostname \
          google_set_multiqueue; do
            command -v "$cmd" || exit 1
        done
