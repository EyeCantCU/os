package:
  name: chart-iamguarded-kubernetes-event-exporter
  version: "3.6.2"
  epoch: 1
  description: kubernetes-event-exporter iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: kubernetes-event-exporter/${{package.version}}
      expected-commit: b0c54435261faca50b050fb06cb55a81fc82af8b

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/kubernetes-event-exporter

  - uses: charts/package
    with:
      chart-path: iamguarded/kubernetes-event-exporter

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: kubernetes-event-exporter/
    use-tag: true
    tag-filter-prefix: kubernetes-event-exporter/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /kubernetes-event-exporter
