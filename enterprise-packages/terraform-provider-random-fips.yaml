package:
  name: terraform-provider-random-fips
  version: "3.8.1"
  epoch: 3 # CVE-2025-61732
  description: Utility provider that supports the use of randomness within Terraform configurations.
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - terraform-local-provider-config
  resources:
    cpu: "2"
    memory: 7Gi

pipeline:
  - uses: git-checkout
    with:
      expected-commit: de3700a633e45ff8d1b8277ba8a422f80945dfb7
      repository: https://github.com/hashicorp/terraform-provider-random
      tag: v${{package.version}}

  - uses: go/build
    with:
      output: terraform-provider-random
      packages: .
      vendor: "true"
      go-package: go-fips

  - runs: |
      GOARCH=$(go env GOARCH)
      mkdir -p "${{targets.destdir}}/terraform/provider-mirror/registry.terraform.io/hashicorp/random/${{package.version}}/linux_${GOARCH}/"
      ln -s /usr/bin/terraform-provider-random \
          "${{targets.destdir}}/terraform/provider-mirror/registry.terraform.io/hashicorp/random/${{package.version}}/linux_${GOARCH}/terraform-provider-random_v${{package.version}}_x5"

update:
  enabled: true
  github:
    identifier: hashicorp/terraform-provider-random
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - terraform
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: terraform-provider-random
    - name: Functional Terraform initialization test
      runs: |-
        set -euo pipefail

        # Create a minimal Terraform configuration that uses the random provider
        mkdir -p /tmp/terraform-test
        cd /tmp/terraform-test

        tee main.tf <<'EOF'
        terraform {
          required_providers {
            random = {
              source = "hashicorp/random"
            }
          }
        }

        resource "random_id" "test" {
          byte_length = 8
        }

        output "random_id" {
          value = random_id.test.hex
        }
        EOF

        # Initialize Terraform with the provider from local mirror (fails if provider not found)
        terraform init -input=false

        # Functional verification: confirm provider is registered and usable
        # Note: 'terraform providers' lists configured providers - this is NOT a help check,
        # it verifies the provider was correctly installed in the mirror and is discoverable
        terraform providers | grep -F "hashicorp/random"

        echo "SUCCESS: Terraform provider initialized successfully"
