package:
  name: aws-cfn-bootstrap
  version: "2.0.37"
  epoch: 0
  description: CloudFormation helper scripts
  dependencies:
    runtime:
      - py${{vars.python-version}}-setuptools
  copyright:
    - license: Apache-2.0

vars:
  python-version: 3.13

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+.\d+)\.(\d+)$
    replace: $1-$2
    to: "fixed-ver"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: fetch
    with:
      uri: https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-${{vars.fixed-ver}}.tar.gz
      expected-sha512: 7f4a19b83fa9148102138b51fdb96f39ddc5690a1f60778e55768cb813779ed778f523867c267d17fee197bbd1884cbdc8b986e5eda05f866508b408a0903cdc
      extract: true

  - uses: py/pip-build-install

  - uses: strip

update:
  enabled: true
  version-transform:
    - match: ^(.+)\-(\d+)$
      replace: $1.$2
  release-monitor:
    identifier: 359771

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        cfn-elect-cmd-leader --help
        cfn-get-metadata --help
        cfn-hup --help
        cfn-init --help
        cfn-send-cmd-event --help
        cfn-send-cmd-result --help
