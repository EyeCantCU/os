package:
  name: aws-cfn-bootstrap
  version: "2.0.38"
  epoch: 0
  description: CloudFormation helper scripts
  dependencies:
    runtime:
      - py${{vars.python-version}}-setuptools
  copyright:
    - license: Apache-2.0

vars:
  python-version: 3.13

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+.\d+)\.(\d+)$
    replace: $1-$2
    to: "fixed-ver"

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base

pipeline:
  - uses: fetch
    with:
      uri: https://s3.amazonaws.com/cloudformation-examples/aws-cfn-bootstrap-py3-${{vars.fixed-ver}}.tar.gz
      expected-sha512: 09b00262bc1e241e2c13537e6e4adbbb38f28c0bc8734627e5d462e68fb8583c0e11fe5dabf76fa19c40e601084d9e8ae85d90d74d4d5222b181a3f2ab32ce4a
      extract: true

  - uses: py/pip-build-install

  - uses: strip

update:
  enabled: true
  version-transform:
    - match: ^(.+)\-(\d+)$
      replace: $1.$2
  release-monitor:
    identifier: 359771

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        cfn-elect-cmd-leader --help
        cfn-get-metadata --help
        cfn-hup --help
        cfn-init --help
        cfn-send-cmd-event --help
        cfn-send-cmd-result --help
