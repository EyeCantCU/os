package:
  name: aws-ebs-csi-driver-1.50
  version: "1.50.3"
  epoch: 3 # CVE-2025-68121
  description: CSI driver for Amazon EBS.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - aws-ebs-csi-driver=${{package.full-version}}
    runtime:
      - blkid
      - blockdev
      - ca-certificates
      - ca-certificates-bundle
      - e2fsprogs
      - e2fsprogs-extra
      - lsblk
      - merged-bin
      - mount
      - umount
      - util-linux
      - util-linux-misc
      - wolfi-baselayout
      - xfsprogs-5.10

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  # We can't use go/install because this requires specific ldflags to set the version
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/aws-ebs-csi-driver
      tag: v${{package.version}}
      expected-commit: 5fdde22b8689b1a254556e91edddbd6d23e133ee

  - uses: go/build
    with:
      packages: ./cmd
      ldflags: |
        -X github.com/kubernetes-sigs/aws-ebs-csi-driver/pkg/driver.driverVersion=${{package.version}}
        -X github.com/kubernetes-sigs/aws-ebs-csi-driver/pkg/cloud.driverVersion=${{package.version}}
        -X github.com/kubernetes-sigs/aws-ebs-csi-driver/pkg/driver.gitCommit=$(git rev-parse HEAD)
        -X github.com/kubernetes-sigs/aws-ebs-csi-driver/pkg/driver.buildDate=$(date -u -d "@${SOURCE_DATE_EPOCH:-$(date +%s)}" "+%Y-%m-%dT%H:%M:%SZ")
      output: aws-ebs-csi-driver

update:
  enabled: true
  ignore-regex-patterns:
    - helm-chart-aws-ebs-csi-driver-
  github:
    identifier: kubernetes-sigs/aws-ebs-csi-driver
    strip-prefix: v
    tag-filter: v1.50

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: aws-ebs-csi-driver
    - uses: test/tw/ver-check
      with:
        bins: aws-ebs-csi-driver
    - name: Test driver initialization
      uses: test/daemon-check-output
      with:
        setup: |
          set -euo pipefail
          # Create directory for CSI socket endpoint
          mkdir -p /tmp/csi
          # Create a minimal kubeconfig file to bypass Kubernetes metadata retrieval
          mkdir -p /tmp/.kube
          tee /tmp/.kube/config << 'EOF'
          apiVersion: v1
          kind: Config
          clusters:
          - cluster:
              server: https://localhost:443
            name: test-cluster
          contexts:
          - context:
              cluster: test-cluster
              user: test-user
            name: test-context
          current-context: test-context
          users:
          - name: test-user
            user:
              token: test-token
          EOF
        start: env AWS_REGION=us-east-1 AWS_ACCESS_KEY_ID=test AWS_SECRET_ACCESS_KEY=test KUBECONFIG=/tmp/.kube/config /usr/bin/aws-ebs-csi-driver controller --endpoint=unix:///tmp/csi/csi.sock
        expected_output: "Driver Information.*ebs.csi.aws.com"
        timeout: "30"
        post: |
          set -euo pipefail
          # Verify CSI socket was created
          stat /tmp/csi/csi.sock
