package:
  name: docker-credential-ecr-login-fips
  version: "0.11.0"
  epoch: 5 # CVE-2025-61732
  description: Credential helper for Docker to use the AWS Elastic Container Registry
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 4Gi

pipeline:
  - uses: fetch
    with:
      uri: https://amazon-ecr-credential-helper-releases.s3.us-east-2.amazonaws.com/${{package.version}}/release.tar.gz
      expected-sha512: f2d087c16b4c3be9bb37e4064c509e5571a02cb31b9d0f31a9f0fe70ba537b9249d106866af0af9e382cee340d09424be7e9b210fd8cb53241c8f88b4483fff5

  - uses: go/build
    with:
      packages: ./cli/docker-credential-ecr-login
      ldflags: -X github.com/awslabs/amazon-ecr-credential-helper/ecr-login/version.Version=${{package.version}}
      output: docker-credential-ecr-login
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: awslabs/amazon-ecr-credential-helper
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: docker-credential-ecr-login
    - uses: test/tw/ver-check
      with:
        bins: docker-credential-ecr-login
