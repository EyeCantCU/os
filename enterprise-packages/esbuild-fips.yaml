package:
  name: esbuild-fips
  version: "0.27.3"
  epoch: 1 # CVE-2025-61730
  description: An extremely fast bundler for the web
  copyright:
    - license: MIT
  dependencies:
    # Prevent apk add esbuild installing esbuild-fips
    provider-priority: 0
    # Yet still allow to directly install esbuild-fips to satisfy
    # esbuild dependencies
    provides:
      - esbuild=${{package.full-version}}

environment:
  contents:
    packages:
      - nodejs

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/evanw/esbuild
      tag: v${{package.version}}
      expected-commit: 9129e00e6c36a3e374820cb5e3fc2cd319c8ab85

  - runs: |
      node scripts/esbuild.js --update-version-go

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/esbuild
      output: esbuild

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: esbuild
    - uses: test/tw/help-check
      with:
        bins: esbuild
    - name: Test JavaScript bundling
      runs: |
        set -euo pipefail

        # Create a minimal JavaScript file to bundle
        tee /tmp/input.js <<'EOF'
        const greeting = "Hello from esbuild!";
        console.log(greeting);
        EOF

        # Bundle the JavaScript file
        esbuild /tmp/input.js --bundle --outfile=/tmp/output.js

        # Verify output file was created (fails test if missing)
        stat /tmp/output.js

        # Verify output contains the expected content (fails test if missing)
        grep -F "Hello from esbuild" /tmp/output.js

update:
  enabled: true
  github:
    identifier: evanw/esbuild
    strip-prefix: v
