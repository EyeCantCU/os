package:
  name: kyverno-policy-reporter-plugins-kyverno-fips
  version: "0.5.3"
  epoch: 4 # GHSA-4c4x-jm2x-pf9j
  description: Policy Reporter Plugin Kyverno
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "13"
    memory: 12Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kyverno/policy-reporter-plugins
      tag: kyverno-plugin-v${{package.version}}
      expected-commit: 095e87f714a00ba17bd2f783243b130c4f5f76da

  - uses: go/bump
    with:
      deps: |-
        github.com/sigstore/cosign/v2@v2.6.2
        github.com/theupdateframework/go-tuf/v2@v2.3.1
        github.com/sigstore/rekor@v1.5.0
      modroot: plugins/kyverno

  - uses: go/build
    with:
      go-package: go-fips
      output: kyverno-plugin
      packages: .
      modroot: plugins/kyverno

test:
  pipeline:
    - runs: |
        kyverno-plugin --help
    - uses: test/go-fips-check

update:
  enabled: true
  git:
    strip-prefix: kyverno-plugin-v
    tag-filter-prefix: kyverno
