package:
  name: py3-responses
  version: 0.25.8
  epoch: 0
  description: A utility library for mocking out the requests Python library
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: responses

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      # We only need this for 3.13 presently
      3.13:

pipeline:
  - uses: fetch
    with:
      expected-sha512: 59cf48cf71347de3cd80aa84176bab2e3d5dd20cd6c0b7b6278f40be6adc530d6268360c2e722331ba6faede51be4fdd62c163de4eface0371588c49ec384ffb
      uri: https://files.pythonhosted.org/packages/source/r/responses/responses-${{package.version}}.tar.gz

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-pyyaml
        - py${{range.key}}-requests
        - py${{range.key}}-urllib3
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - tw
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.pypi-package}}

update:
  enabled: true
  release-monitor:
    identifier: 248481

test:
  pipeline:
    - uses: test/emptypackage
