package:
  name: gcp-compute-persistent-disk-csi-driver-fips-1.22
  version: "1.22.5"
  epoch: 1 # CVE-2025-61731
  description: The Google Compute Engine Persistent Disk (GCE PD) Container Storage Interface (CSI) Storage Plugin.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - blkid
      - blockdev
      - btrfs-progs
      - busybox
      - ca-certificates
      - dbus-libs
      - device-mapper
      - e2fsprogs
      - e2fsprogs-extra
      - e2fsprogs-libs
      - glibc
      - json-c
      - kmod-libs
      - libacl1
      - libblkid
      - libbsd
      - libcap
      - libcom_err
      - libcrypto3
      - libgcc
      - libgcrypt-al2023-fips
      - libgpg-error
      - liblz4-1
      - libmd
      - libmount
      - libnvme-dev
      - libpcre2-8-0
      - libstdc++
      - libsystemd
      - libuuid
      - mount
      - ncurses
      - nvme-cli
      - readline
      - systemd
      - umount
      - userspace-rcu
      - util-linux
      - util-linux-misc
      - xfsprogs
      - xz
      - zlib

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/gcp-compute-persistent-disk-csi-driver
      tag: v${{package.version}}
      expected-commit: 69d46d2905a4ddd56e41083654a9f75765fc9727

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/gce-pd-csi-driver/main.go
      ldflags: |
        -X main.version=$(git describe --long --tags --match='v*' --dirty 2>/dev/null || git rev-list -n1 HEAD)
      output: gce-pd-csi-driver

test:
  pipeline:
    - uses: test/go-fips-check
    - name: help message
      runs: |
        /usr/bin/gce-pd-csi-driver -help

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.22
