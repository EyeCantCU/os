package:
  name: mx
  description: Command-line tool used for the development of Graal projects.
  version: "7.69.1"
  epoch: 0
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - bash
      - git
      - posix-libc-utils
      - python-${{vars.python-version}}

vars:
  # 3.12 is the last version of Python to include 'pipes'
  python-version: '3.12'

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/graalvm/mx
      tag: ${{package.version}}
      expected-commit: 0cfe02a64cee12ade2a7959496b542af86d85a15
      destination: ${{targets.contextdir}}/usr/share/mx

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      ln -s /usr/share/mx/mx ${{targets.contextdir}}/usr/bin/mx

update:
  enabled: true
  ignore-regex-patterns:
    - '.*checkstyle.*'
    - '.*jackpot.*'
    - '.*jdk.*'
    - 'findbugs.*'
  git: {}

test:
  pipeline:
    - runs: |
        mx --help
        mx version | grep ${{package.version}}
