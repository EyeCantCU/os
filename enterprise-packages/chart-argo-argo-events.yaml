package:
  name: chart-argo-argo-events
  version: "2.4.20"
  epoch: 0
  description: A Helm chart for Argo Events, the event-driven workflow automation framework
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/argoproj/argo-helm
      tag: argo-events-${{package.version}}
      expected-commit: bf03eaeea47b57568bcd455e282d5831dcaf3f57

  - uses: charts/package
    with:
      chart-path: charts/argo-events
      images: |
        argo-events:
          values:
            global:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [argo-events]
          - name: with-webhook
            images: [argo-events]
            values:
              webhook:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: argoproj/argo-helm
    strip-prefix: argo-events-
    use-tag: true
    tag-filter-prefix: argo-events-
