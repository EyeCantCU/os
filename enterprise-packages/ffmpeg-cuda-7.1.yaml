package:
  name: ffmpeg-cuda-7.1
  version: "7.1.3"
  epoch: 1
  description: ffmpeg multimedia library
  copyright:
    - license: GPL-2.0-or-later AND LGPL-2.1-or-later
  dependencies:
    provides:
      - ffmpeg-cuda=${{package.full-version}}
    provider-priority: 1
  resources:
    cpu: 16
    memory: 16Gi

environment:
  contents:
    packages:
      - aom
      - aom-dev
      - aom-libs
      - build-base
      - busybox
      - ca-certificates-bundle
      - dav1d-dev
      - expat-dev
      - ffnvcodec # needed for CUDA support
      - fontconfig-dev
      - freetype-dev
      - harfbuzz-dev
      - lame-dev
      - libogg-dev
      - libsdl2-dev
      - libsodium-dev
      - libsrt
      - libssh-dev
      - libtheora
      - libtheora-dev
      - libvorbis-dev
      - libwebp-dev
      - libxml2-dev
      - nasm # needed for CUDA support
      - nvidia-codec-sdk # needed for CUDA support
      - openjpeg-dev
      - openssl-dev
      - opus-dev
      - snappy-dev
      - soxr-dev
      - speex-dev
      - svt-av1-dev
      - wolfi-baselayout
      - x264-dev
      - x265-dev
      - yasm
      - zeromq-dev
  environment:
    LIBRARY_PATH: /usr/lib/nvidia-codec-sdk/stubs #for CUDA support

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/FFmpeg/FFmpeg
      expected-commit: f46e514491172d15bd74b4abb1814cd2f05a763e
      tag: n${{package.version}}
      cherry-picks: |
        release/7.1/5dc6ff172cad3722831c2e2603013cedd9181b5b: avcodec/libsvtav1: rename aq_mode for v4.0.0

  # for CUDA support, we need to enable ffnvcodec
  - runs: |
      ./configure \
        --prefix=/usr \
        --libdir=/usr/lib \
        --enable-shared \
        --enable-libx264 \
        --enable-libx265 \
        --enable-libaom \
        --enable-libtheora \
        --enable-gpl \
        --enable-version3 \
        --enable-ffnvcodec \
        --enable-openssl \
        --enable-libmp3lame \
        --enable-ffplay \
        --enable-libdav1d \
        --enable-libharfbuzz \
        --enable-libopus \
        --enable-libsnappy \
        --enable-libsrt \
        --enable-libssh \
        --enable-libsvtav1 \
        --enable-libvorbis \
        --enable-libwebp \
        --enable-libxml2 \
        --enable-lzma \
        --enable-libfontconfig \
        --enable-libfreetype \
        --enable-libopenjpeg \
        --enable-libspeex \
        --enable-libsoxr \
        --enable-libzmq

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-static
    dependencies:
      provides:
        - ffmpeg-cuda-static=${{package.full-version}}
    pipeline:
      - uses: split/static
    description: ffmpeg static libraries
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: ffmpeg-cuda-static
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-dev
    dependencies:
      runtime:
        - ${{package.name}}
        - ${{package.name}}-static
      provides:
        - ffmpeg-cuda-dev=${{package.full-version}}
    pipeline:
      - uses: split/dev
    description: ffmpeg development headers
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    dependencies:
      provides:
        - ffmpeg-cuda-doc=${{package.full-version}}
    pipeline:
      - uses: split/manpages
    description: ffmpeg manpages
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: ffmpeg-cuda-doc
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-cuda-qt-faststart
    dependencies:
      provides:
        - ffmpeg-cuda-qt-faststart=${{package.full-version}}
    description: "Utility for optimizing MP4 files for HTTP streaming"
    pipeline:
      - uses: autoconf/make
        with:
          dir: tools
          opts: qt-faststart
      - runs: install -Dpm0755 -t ${{targets.contextdir}}/usr/bin tools/qt-faststart
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            ffmpeg -f lavfi -i testsrc=size=640x480:duration=10:rate=30 -c:v libx264 -pix_fmt yuv420p sample_video.mp4
            qt-faststart sample_video.mp4 sample_video_faststart.mp4
            # Check if the output file is created
            test -f sample_video_faststart.mp4
            # Check if the output file is a valid MP4 file
            ffmpeg -v error -i sample_video_faststart.mp4 -f null -

  # for FIPS enabled environment, use this subpackage rather than main package because
  # it doesn't contain zeromq which brings libsodium which is not FIPS compliant
  - name: ${{package.name}}-nozeromq
    description: ffmpeg with CUDA support built without ZeroMQ (FIPS-friendlier)
    dependencies:
      provides:
        - ffmpeg-cuda-nozeromq=${{package.full-version}}
    pipeline:
      - runs: |
          ./configure \
            --prefix=/usr \
            --libdir=/usr/lib \
            --enable-shared \
            --enable-libx264 \
            --enable-libx265 \
            --enable-libaom \
            --enable-libtheora \
            --enable-gpl \
            --enable-version3 \
            --enable-ffnvcodec \
            --enable-openssl \
            --enable-libmp3lame \
            --enable-ffplay \
            --enable-libdav1d \
            --enable-libharfbuzz \
            --enable-libopus \
            --enable-libsnappy \
            --enable-libsrt \
            --enable-libssh \
            --enable-libsvtav1 \
            --enable-libvorbis \
            --enable-libwebp \
            --enable-libxml2 \
            --enable-lzma \
            --enable-libfontconfig \
            --enable-libfreetype \
            --enable-libopenjpeg \
            --enable-libspeex \
            --enable-libsoxr \
            --disable-libzmq
      - uses: autoconf/make
      - uses: autoconf/make-install
      - uses: strip
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: ffmpeg-cuda-nozeromq
            real-pkg-name: ${{subpkg.name}}
        - runs: |
            ffmpeg -version
            ffmpeg -f lavfi -i testsrc=duration=1:size=128x128:rate=30 -c:v libx264 -pix_fmt yuv420p out.mp4
            test -f out.mp4
            ffmpeg -f lavfi -i sine=frequency=1000:duration=1 -c:a libmp3lame test.mp3
            test -f test.mp3

update:
  enabled: true
  ignore-regex-patterns:
    - .*dev.*
  git:
    strip-prefix: n
    tag-filter-prefix: n7.1

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        ffmpeg --help
        ffprobe --help
        ffplay --help

        # Generate and verify a 1-second, 128x128 color test video using libx264 (H.264 encoder)
        ffmpeg -f lavfi -i testsrc=duration=1:size=128x128:rate=30 \
           -c:v libx264 -pix_fmt yuv420p out.mp4
        test -f out.mp4

        # Generate and confirm a 1-second 1000Hz sine wave and encode it to MP3 using libmp3lame
        ffmpeg -f lavfi -i sine=frequency=1000:duration=1 -c:a libmp3lame test.mp3
        test -f test.mp3

        # Inspect the video file metadata
        ffprobe -v error -show_format -show_streams out.mp4
