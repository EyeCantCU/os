package:
  name: karpenter-fips-1.6
  version: "1.6.6"
  epoch: 3 # CVE-2025-61732
  description: Karpenter is a Kubernetes Node Autoscaler built for flexibility, performance, and simplicity.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - karpenter-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/karpenter-provider-aws
      tag: v${{package.version}}
      expected-commit: a3160208fde9f7260cc7f4386c838c37d20b671e

  - uses: go/build
    with:
      go-package: go-fips-md5
      packages: ./cmd/controller
      output: controller
      ldflags: -X=sigs.k8s.io/karpenter/pkg/operator.Version=${{package.version}}

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.6.

test:
  environment:
    environment:
      # Required for test, otherwise application returns error when running --help.
      SYSTEM_NAMESPACE: default
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: controller
