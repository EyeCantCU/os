package:
  name: aws-c-mqtt-fips
  version: "0.14.0"
  epoch: 0
  description: AWS C99 implementation of the MQTT 3.1.1 specification (FIPS)
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - aws-lc-fips

vars:
  aws-lc-lib-dir: /usr/lib/aws-lc
  aws-lc-include-dir: /usr/include/aws-lc
  aws-lc-crypto-lib: /usr/lib/aws-lc/libcrypto.so

environment:
  contents:
    packages:
      - aws-c-cal-fips-dev
      - aws-c-common-dev
      - aws-c-compression-dev
      - aws-c-http-fips-dev
      - aws-c-io-fips-dev
      - aws-lc-fips-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - s2n-tls-fips-dev
      - samurai
  environment:
    CMAKE_PREFIX_PATH: ${{vars.aws-lc-lib-dir}}
    CFLAGS: "-I${{vars.aws-lc-include-dir}}"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 41b6a7d6d566a56eff69743df66c077d56a80c9d
      repository: https://github.com/awslabs/aws-c-mqtt
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_PREFIX_PATH=/usr \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_INSTALL_RPATH=${{vars.aws-lc-lib-dir}} \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux \
        -Dcrypto_INCLUDE_DIR=${{vars.aws-lc-include-dir}} \
        -Dcrypto_SHARED_LIBRARY=${{vars.aws-lc-crypto-lib}}

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-mqtt-fips-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-mqtt-fips
    description: aws-c-mqtt-fips dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-mqtt
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - aws-c-cal-fips-dev
        - aws-c-common-dev
        - aws-c-http-fips-dev
        - aws-c-io-fips-dev
        - build-base
        - gcc
        - aws-c-mqtt-fips-dev
  pipeline:
    - uses: test/tw/ldd-check
    - name: "Compile simple MQTT test program"
      runs: |
        cat << 'EOF' > test.c
        #include <aws/mqtt/mqtt.h>
        #include <aws/common/common.h>

        int main() {
            struct aws_allocator *allocator = aws_default_allocator();
            aws_mqtt_library_init(allocator);
            aws_mqtt_library_clean_up();
            return 0;
        }
        EOF
        gcc -o test test.c -laws-c-mqtt -laws-c-common -laws-c-io -laws-c-cal
        ./test
