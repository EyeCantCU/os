package:
  name: perl-date-manip
  version: "6.98"
  epoch: 0
  description: Perl date manipulation routines
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl

environment:
  contents:
    packages:
      - perl-test-inter

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/SBECK-github/Date-Manip
      tag: v${{package.version}}
      expected-commit: abf9bcfb1a0ec9fe64ab88fb67b805520b0c7c4c

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: perl-date-manip docs
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: SBECK-github/Date-Manip
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: dm_date
        expect-contains: "dm_date"
    - uses: test/tw/help-check
      with:
        bins: dm_zdump
        expect-contains: "dm_zdump"
    - name: Smoke test
      runs: |
        set -euo pipefail
        perl -e 'use Date::Manip; print "Date::Manip version: $Date::Manip::VERSION\n"'
    - name: Basic functionality
      runs: |
        set -euo pipefail
        perl <<'EOF'
        use Date::Manip;
        my $date = ParseDate("2024-06-15");
        die "Failed to parse date" unless $date;
        print "Date parsing works\n";
        EOF
    - name: CLI tools
      runs: |
        set -euo pipefail
        dm_date +"%Y" | grep -F "$(date +%Y)"
        dm_zdump America/New_York | grep -F "New_York"
