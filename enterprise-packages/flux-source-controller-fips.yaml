package:
  name: flux-source-controller-fips
  version: "1.7.4"
  epoch: 5 # GHSA-59jp-pj84-45mr
  description: The GitOps Toolkit source management component
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - gcc
      - go-fips
      - lld-20

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2eb5a81a22b414215f25d7981fd3ab7b078ad6ca
      repository: https://github.com/fluxcd/source-controller
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        github.com/sigstore/fulcio@v1.8.5
        github.com/sigstore/cosign/v2@v2.6.2

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/bin
      CGO_ENABLED=1 CGO_LDFLAGS="-fuse-ld=lld -no-pie" go build \
        -tags 'netgo,osusergo,static_build' \
        -trimpath -o "${{targets.destdir}}"/usr/bin/source-controller .

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - api/
  github:
    identifier: fluxcd/source-controller
    strip-prefix: v
    tag-filter: v

test:
  environment:
    contents:
      packages:
        - ${{package.name}}
        - curl
  pipeline:
    - runs: |
        source-controller -h > output.txt 2>&1
        cat output.txt | grep "Usage of source-controller"
    - uses: test/go-fips-check
    - uses: test/kwok/cluster
    - name: Launch controller with kwok cluster
      uses: test/daemon-check-output
      with:
        setup: |
          kubectl apply -f https://github.com/fluxcd/source-controller/releases/download/v${{package.version}}/source-controller.crds.yaml
          kubectl wait --for=condition=Ready nodes --all
          sleep 1
        start: source-controller --storage-path=/tmp --health-addr :9441 --metrics-addr :8081
        timeout: 30
        expected_output: |
          Starting Controller
          Starting workers
        post: |
          curl --silent --fail localhost:8081/metrics
          curl --silent --fail localhost:9441/healthz
          curl -s localhost:9090 | grep 'pre'
