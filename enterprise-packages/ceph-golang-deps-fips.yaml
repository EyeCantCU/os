## This is a lite package that contains go runtime dependencies needed by ceph
## This approach was used to satisfy fips packages
package:
  name: ceph-golang-deps-fips
  version: "1"
  description: Distributed object, block, and file storage
  epoch: 2 # go/enterprise-rsc/ceph-golang-deps-fips
  dependencies:
    provides:
      - ceph-golang-deps=${{package.full-version}}
    runtime:
      - podman-fips
      - prometheus-fips
  resources:
    cpu: "2"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox

update:
  enabled: false

test:
  pipeline:
    - uses: test/emptypackage
