package:
  name: eglexternalplatform
  version: 1.2.1
  epoch: 0
  description: EGL External Platform interface headers
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - meson

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/eglexternalplatform
      tag: ${{package.version}}
      expected-commit: cf9f10589775c1b4d90f1df6f417f8cf1bed7ec6

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

test:
  pipeline:
    - runs: |
        headers=$(find /usr/include/ -name '${{package.name}}*.h')
        [ -n "$headers" ] || { echo "no headers found!"; exit 1; }
    - uses: test/pkgconf

update:
  enabled: true
  github:
    identifier: NVIDIA/eglexternalplatform
    use-tag: true
