package:
  name: perl-xml-simple
  version: "2.25"
  epoch: 0
  description: An API for simple XML files
  copyright:
    - license: Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl-xml-parser

environment:
  contents:
    packages:
      - perl-xml-parser
      - perl-xml-sax

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/G/GR/GRANTM/XML-Simple-${{package.version}}.tar.gz
      expected-sha256: 531fddaebea2416743eb5c4fdfab028f502123d9a220405a4100e68fc480dbf8

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 3537

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  environment:
    contents:
      packages:
        - perl
  pipeline:
    - name: Smoke test
      runs: echo "use XML::Simple;" | perl
    - runs: |
        perl <<'EOF' | grep -F -e "'username' => 'alice'"
        use warnings;
        use strict;
        use XML::Simple qw(:strict);
        use Data::Dumper;
        print Dumper(XMLin('<opt username="alice" password="flurp" />', ForceArray => 0, KeyAttr => {} ));
        EOF
