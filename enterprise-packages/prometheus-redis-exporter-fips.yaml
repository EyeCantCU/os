package:
  name: prometheus-redis-exporter-fips
  version: "1.81.0"
  epoch: 1 # CVE-2025-61729
  description: Prometheus Exporter for Redis Metrics.
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/oliver006/redis_exporter
      tag: v${{package.version}}
      expected-commit: caeb0efbc313118088aafaafc1f110091484d095

  - uses: go/build
    with:
      packages: .
      output: redis_exporter
      go-package: go-fips
      ldflags: |
        -X main.BuildVersion=v${{package.version}}
        -X main.BuildCommitSha=$(git rev-parse HEAD)
        -X main.BuildDate=$(date +%F-%T)

test:
  environment:
    contents:
      packages:
        - curl
        - redis
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: redis_exporter
    - uses: test/tw/help-check
      with:
        bins: redis_exporter
    - name: Test metrics endpoint
      runs: |
        set -euo pipefail
        # Start Redis
        redis-server > /dev/null 2>&1 &
        REDIS_PID=$!
        sleep 2

        # Start redis-exporter
        redis_exporter --web.listen-address=":9121" --log-format=txt > /dev/null 2>&1 &
        EXPORTER_PID=$!
        sleep 2

        # Check metrics endpoint (which is provided by redis-exporter).
        if ! curl -sf http://localhost:9121/metrics | grep -F "redis_up"; then
          echo "Metrics endpoint not responding"
          kill $REDIS_PID $EXPORTER_PID
          exit 1
        fi

        METRICS=$(curl -sf http://localhost:9121/metrics)

        # Check core metrics exist
        echo $METRICS
        for metric in "redis_up 1" "redis_uptime_in_seconds"; do
          if ! echo "$METRICS" | grep -F "$metric"; then
            echo "Missing metric: $metric"
            kill $REDIS_PID $EXPORTER_PID
            exit 1
          fi
        done

update:
  enabled: true
  github:
    identifier: oliver006/redis_exporter
    strip-prefix: v
    tag-filter: v
