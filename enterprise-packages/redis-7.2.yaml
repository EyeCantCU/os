package:
  name: redis-7.2
  version: "7.2.12"
  epoch: 3 # go/enterprise-rsc/redis-7.2
  description: Advanced key-value store
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provides:
      - redis=${{package.full-version}}
    runtime:
      - merged-usrsbin
      - posix-libc-utils-bin # `getent` is required on startup in ha mode for ip introspection cluster formation
      - wolfi-baselayout
  resources:
    cpu: "5"
    memory: 18Gi

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - jemalloc
      - linux-headers
      - openssl-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9913c926510755fa0d241658f550338a02258edb
      repository: https://github.com/redis/redis.git
      tag: ${{package.version}}

  - uses: patch
    with:
      patches: 0000-Disable-protected-mode.patch CVE-2025-27151.patch

  - runs: |
      export CFLAGS="$CFLAGS -DUSE_MALLOC_USABLE_SIZE"
        make \
        BUILD_TLS=yes \
        all -j$(nproc)
      make install PREFIX=/usr INSTALL_BIN="${{targets.destdir}}/usr/bin"

  - uses: strip

subpackages:
  - name: redis-cli-7.2
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/redis-cli "${{targets.subpkgdir}}"/usr/bin/redis-cli
    description: redis-cli is the command line interface utility to talk with Redis.
    dependencies:
      provides:
        - redis-cli=${{package.full-version}}
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    test:
      pipeline:
        - runs: |
            redis-cli --version
            redis-cli --help

  - name: redis-benchmark-7.2
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/redis-benchmark "${{targets.subpkgdir}}"/usr/bin/redis-benchmark
    description: redis-benchmark utility that simulates running commands done by N clients while at the same time sending M total queries.
    dependencies:
      provides:
        - redis-benchmark=${{package.full-version}}
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    test:
      environment:
        contents:
          packages:
            - redis
      pipeline:
        - runs: |
            redis-benchmark --version
            redis-benchmark --help
        - name: Test benchmarking against a running Redis instance
          runs: |
            # Create a minimal redis config
            tee /tmp/redis.conf <<'EOF'
            dbfilename dump.rdb
            pidfile /tmp/redis_6379.pid
            dir /tmp/
            EOF

            # Start Redis server in background
            redis-server /tmp/redis.conf > /tmp/redis.log 2>&1 &
            REDIS_PID=$!

            # Wait for Redis to be ready
            sleep 3

            # Verify Redis is running
            if [ ! -d "/proc/$REDIS_PID" ]; then
              echo "ERROR: Redis failed to start"
              cat /tmp/redis.log
              exit 1
            fi

            # Run redis-benchmark with minimal workload for quick testing
            # -t set,get : only run SET and GET tests
            # -n 100 : only 100 requests per test
            # -q : quiet mode with summary output
            output=$(redis-benchmark -t set,get -n 100 -q 2>&1)
            benchmark_rc=$?

            # Check benchmark completed successfully
            if [ "$benchmark_rc" -ne 0 ]; then
              echo "ERROR: redis-benchmark failed with exit code $benchmark_rc"
              echo "Output: $output"
              kill $REDIS_PID 2>/dev/null || true
              exit 1
            fi

            # Verify benchmark produced performance output
            echo "$output" | grep -F "requests per second" || {
              echo "ERROR: Expected 'requests per second' in benchmark output"
              echo "Actual output: $output"
              kill $REDIS_PID 2>/dev/null || true
              exit 1
            }

            echo "SUCCESS: redis-benchmark completed with valid performance data"
            echo "$output"

            # Cleanup
            kill $REDIS_PID 2>/dev/null || true

  - name: redis-${{vars.major-minor-version}}-iamguarded-compat
    dependencies:
      provides:
        - redis-iamguarded-compat=${{package.full-version}}
      runtime:
        - bash
        - busybox # Required by startup scripts
        - coreutils
        - libxcrypt
        - merged-usrsbin
        - openssl
        - redis
        - redis-cli
        - wait-for-port
        - wolfi-baselayout
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: redis
          version: ${{vars.major-minor-version}}
      - runs: |
          # The startup scripts expect these directories to be in place.
          # If not, redis will fail to launch.
          mkdir -p /iamguarded/redis/data
          mkdir -p /opt/iamguarded/redis/etc.default
          mkdir -p /opt/iamguarded/redis/etc

          # Moves in the default redis configuration. Note the iamguarded scripts
          # create a copy of this later and make some modifications.
          cp redis.conf /opt/iamguarded/redis/etc/redis-default.conf

          ln -s /opt/iamguarded/scripts/redis/entrypoint.sh ${{targets.contextdir}}/entrypoint.sh
          ln -s /opt/iamguarded/scripts/redis/run.sh ${{targets.contextdir}}/run.sh
      - uses: iamguarded/finalize-compat
        with:
          package: redis
          version: ${{vars.major-minor-version}}
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: redis
            version: ${{vars.major-minor-version}}

  - name: redis-sentinel-${{vars.major-minor-version}}-iamguarded-compat
    dependencies:
      provides:
        - redis-sentinel-iamguarded-compat=${{package.full-version}}
      runtime:
        - bash
        - busybox # Required by startup scripts
        - coreutils
        - libxcrypt
        - merged-usrsbin
        - openssl
        - redis
        - redis-cli
        - wait-for-port
        - wolfi-baselayout
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: redis-sentinel
          version: ${{vars.major-minor-version}}
      - runs: |
          mkdir -p /opt/iamguarded/redis-sentinel/etc
          cp redis.conf /opt/iamguarded/redis-sentinel/etc/redis-default.conf
      - uses: iamguarded/finalize-compat
        with:
          package: redis-sentinel
          version: ${{vars.major-minor-version}}
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: redis-sentinel
            version: ${{vars.major-minor-version}}

  - name: redis-cluster-${{vars.major-minor-version}}-iamguarded-compat
    dependencies:
      provides:
        - redis-cluster-iamguarded-compat=${{package.full-version}}
      runtime:
        - bash
        - busybox # Required by startup scripts
        - coreutils
        - libxcrypt
        - merged-usrsbin
        - openssl
        - redis
        - redis-cli
        - wait-for-port
        - wolfi-baselayout
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: redis-cluster
          version: ${{vars.major-minor-version}}
      - runs: |
          mkdir -p /opt/iamguarded/redis/etc
          mkdir -p /opt/iamguarded/redis/etc.default
          cp redis.conf /opt/iamguarded/redis/etc/redis-default.conf
      - uses: iamguarded/finalize-compat
        with:
          package: redis-cluster
          version: ${{vars.major-minor-version}}
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: redis-cluster
            version: ${{vars.major-minor-version}}

update:
  enabled: true
  github:
    identifier: redis/redis
    tag-filter-prefix: "7.2."

test:
  environment:
    contents:
      packages:
        - redis-cli
  pipeline:
    - runs: |
        cat <<EOF >> /tmp/redis.conf
        dbfilename dump.rdb
        pidfile /tmp/redis_6379.pid
        dir /tmp/
        EOF

        redis-server /tmp/redis.conf > redis.log 2>&1 &

        trap 'cat redis.log' EXIT

        sleep 2 # wait for redis to start
        redis-cli SET bike:1 "Process 134" || exit 1
        redis-cli GET bike:1 | grep 'Process 134' || exit 1
        redis-cli exists bike:1 | grep 1 || exit 1
        redis-cli exists bike:2 | grep 0 || exit 1
        redis-sentinel --version
    - runs: |
        redis-server --version | grep "jemalloc" || exit 1
