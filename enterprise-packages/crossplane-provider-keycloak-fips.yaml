package:
  name: crossplane-provider-keycloak-fips
  version: "2.14.0"
  epoch: 3 # CVE-2025-68121
  description: Official Keycloak Provider for Crossplane by Upbound
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - terraform-fips
  resources:
    cpu: "10"
    memory: 14Gi

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - curl
      - go-fips-1.25
      - goimports
      - gzip
      - terraform-fips
      - up

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0509c08dd9fffcfc2b5fa1e2cd51aae6cd60db17
      repository: https://github.com/crossplane-contrib/provider-keycloak
      tag: v${{package.version}}
      recurse-submodules: true

  # CGO is disabled (hardcoded) in the makelib, and apparently we can't override via env vars or similar
  - name: Enable CGO for code generation
    working-directory: /home/build
    runs: sed -i 's/@CGO_ENABLED=0/@CGO_ENABLED=1/' build/makelib/golang.mk

  - name: Code Generation
    runs: |
      go run cmd/generator/main.go $(pwd)
      make generate

  - uses: go/build
    with:
      output: crossplane-keycloak-provider
      packages: ./cmd/provider
      ldflags: |
        -X github.com/crossplane-contrib/provider-keycloak/internal/version.Version=v${{package.version}}
      go-package: go-fips-md5

  - runs: |
      up xpkg xp-extract xpkg.upbound.io/crossplane-contrib/provider-keycloak:v${{package.version}}
      mkdir -p "${{targets.destdir}}"
      gunzip out.gz -c > "${{targets.destdir}}"/package.yaml

update:
  enabled: true
  github:
    identifier: crossplane-contrib/provider-keycloak
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - name: help output
      runs: |
        crossplane-keycloak-provider --help
        terraform --help
        cat /package.yaml
