xpack.security.enabled: true
xpack.security.http.ssl.enabled: true
xpack.security.http.ssl.keystore.path: "/usr/share/elasticsearch/config/server.keystore"
xpack.security.http.ssl.keystore.type: "BCFKS"
xpack.security.enrollment.enabled: true
xpack.security.transport.ssl.enabled: true
xpack.security.transport.ssl.verification_mode: full
xpack.security.transport.ssl.keystore.path: "/usr/share/elasticsearch/config/server.keystore"
xpack.security.transport.ssl.keystore.type: "BCFKS"
xpack.security.transport.ssl.truststore.path: "/usr/share/elasticsearch/config/server.truststore"
xpack.security.transport.ssl.truststore.type: "BCFKS"
xpack.security.autoconfiguration.enabled: false
xpack.security.authc.password_hashing.algorithm: "pbkdf2_stretch"
