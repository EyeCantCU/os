package:
  name: blob-csi-1.25
  version: "1.25.10"
  epoch: 10 # GHSA-9h8m-3fm2-qjrq
  description: Azure Blob Storage CSI driver
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "5"
    memory: 12Gi
  dependencies:
    provides:
      - blob-csi=${{package.full-version}}
    runtime:
      - merged-lib
      - wolfi-baselayout

environment:
  contents:
    packages:
      - bash
      - blobfuse2
      - blobfuse2-health-monitor
      - ca-certificates
      - conntrack-tools
      - curl
      - fuse3
      - iproute2
      - iptables-nft
      - kmod
      - procps
      - util-linux

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 355ef0cc4b6fe2efcd32eb447c4c9168b912b070
      repository: https://github.com/kubernetes-sigs/blob-csi-driver
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/opencontainers/selinux@v1.13.0
        golang.org/x/crypto@v0.45.0
        k8s.io/kubernetes@v1.32.10
        go.opentelemetry.io/otel/sdk@v1.40.0
      replaces: |-
        k8s.io/api=k8s.io/api@v0.32.10 k8s.io/apiextensions-apiserver=k8s.io/apiextensions-apiserver@v0.32.10 k8s.io/apimachinery=k8s.io/apimachinery@v0.32.10 k8s.io/apiserver=k8s.io/apiserver@v0.32.10 k8s.io/cli-runtime=k8s.io/cli-runtime@v0.32.10 k8s.io/client-go=k8s.io/client-go@v0.32.10 k8s.io/cloud-provider=k8s.io/cloud-provider@v0.32.10 k8s.io/cluster-bootstrap=k8s.io/cluster-bootstrap@v0.32.10 k8s.io/code-generator=k8s.io/code-generator@v0.32.10 k8s.io/component-base=k8s.io/component-base@v0.32.10 k8s.io/component-helpers=k8s.io/component-helpers@v0.32.10 k8s.io/controller-manager=k8s.io/controller-manager@v0.32.10 k8s.io/cri-api=k8s.io/cri-api@v0.32.10 k8s.io/cri-client=k8s.io/cri-client@v0.32.10 k8s.io/csi-translation-lib=k8s.io/csi-translation-lib@v0.32.10 k8s.io/dynamic-resource-allocation=k8s.io/dynamic-resource-allocation@v0.32.10 k8s.io/endpointslice=k8s.io/endpointslice@v0.32.10 k8s.io/kms=k8s.io/kms@v0.32.10 k8s.io/kube-aggregator=k8s.io/kube-aggregator@v0.32.10 k8s.io/kube-controller-manager=k8s.io/kube-controller-manager@v0.32.10 k8s.io/kube-proxy=k8s.io/kube-proxy@v0.32.10 k8s.io/kube-scheduler=k8s.io/kube-scheduler@v0.32.10 k8s.io/kubectl=k8s.io/kubectl@v0.32.10 k8s.io/kubelet=k8s.io/kubelet@v0.32.10 k8s.io/kubernetes=k8s.io/kubernetes@v1.32.10 k8s.io/legacy-cloud-providers=k8s.io/legacy-cloud-providers@v0.32.10 k8s.io/metrics=k8s.io/metrics@v0.32.10 k8s.io/pod-security-admission=k8s.io/pod-security-admission@v0.32.10 k8s.io/sample-apiserver=k8s.io/sample-apiserver@v0.32.10 k8s.io/sample-cli-plugin=k8s.io/sample-cli-plugin@v0.32.10 k8s.io/sample-controller=k8s.io/sample-controller@v0.32.10 sigs.k8s.io/structured-merge-diff/v4=sigs.k8s.io/structured-merge-diff/v4@v4.4.2

  - runs: |
      sed -i '/k8s\.io/ s/\.31\.6/\.31\.12/g' go.mod

  - uses: go/build
    with:
      ldflags: |
        -X sigs.k8s.io/blob-csi-driver/pkg/blob.driverVersion=v${{package.version}}
        -X sigs.k8s.io/blob-csi-driver/pkg/blob.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/blob-csi-driver/pkg/blob.buildDate=$(TZ="UTC" date +"%Y-%m-%dT%H:%M:%SZ")
      output: blobplugin
      packages: ./pkg/blobplugin

  - uses: go/build
    with:
      ldflags: |
        -X sigs.k8s.io/blob-csi-driver/pkg/blob.driverVersion=v${{package.version}}
        -X sigs.k8s.io/blob-csi-driver/pkg/blob.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/blob-csi-driver/pkg/blob.buildDate=$(TZ="UTC" date +"%Y-%m-%dT%H:%M:%SZ")
      output: blobfuse-proxy
      packages: ./pkg/blobfuse-proxy

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/lib/blobfuse-proxy
      mkdir -p ${{targets.contextdir}}/usr/lib/systemd/system
      cp ./pkg/blobfuse-proxy/init.sh ${{targets.contextdir}}/usr/lib/blobfuse-proxy/
      cp ./pkg/blobfuse-proxy/install-proxy.sh ${{targets.contextdir}}/usr/lib/blobfuse-proxy/
      cp ./pkg/blobfuse-proxy/install-proxy-rhcos.sh ${{targets.contextdir}}//usr/lib/blobfuse-proxy/
      cp ./pkg/blobfuse-proxy/blobfuse-proxy.service ${{targets.contextdir}}/usr/lib/systemd/system/

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}
          mkdir -p ${{targets.subpkgdir}}/blobfuse-proxy
          ln -sf /usr/bin/blobplugin ${{targets.subpkgdir}}/blobplugin
          ln -sf /usr/bin/blobfuse-proxy ${{targets.subpkgdir}}/blobfuse-proxy/blobfuse-proxy
          ln -sf /usr/lib/blobfuse-proxy/init.sh ${{targets.subpkgdir}}/blobfuse-proxy/init.sh
          ln -sf /usr/lib/blobfuse-proxy/install-proxy.sh ${{targets.subpkgdir}}/blobfuse-proxy/install-proxy.sh
          ln -sf /usr/lib/blobfuse-proxy/install-proxy-rhcos.sh ${{targets.subpkgdir}}/blobfuse-proxy/install-proxy-rhcos.sh
          ln -sf /usr/lib/systemd/system/blobfuse-proxy.service ${{targets.subpkgdir}}/blobfuse-proxy/blobfuse-proxy.service
    dependencies:
      provides:
        - blob-csi-compat=${{package.full-version}}
      runtime:
        - merged-lib
        - wolfi-baselayout
        - coreutils
        - grep
        - lsb-release-minimal
        - util-linux-misc
        - azcopy
        - bind
        - conntrack-tools
        - dash-binsh
        - e2fsprogs
        - iproute2
        - iptables-nft
        - kmod
        - mount
        - netcat-openbsd
        - nfs-utils
        - procps
        - udev
        - aznfs-mount
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: blob-csi-compat
            real-pkg-name: ${{subpkg.name}}

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/blob-csi-driver
    strip-prefix: v
    tag-filter: v1.25.

test:
  pipeline:
    - uses: test/kwok/cluster
    - runs: blobplugin --version | grep ${{package.version}}
    - runs: |
        mkdir -p /etc/kubernetes
        cat <<EOF > /etc/kubernetes/azure.json
        {
          "cloud":"AzurePublicCloud",
          "tenantId": "xxxx-xxxx-xxxx-xxxx-xxxx",
          "subscriptionId": "xxxx-xxxx-xxxx-xxxx-xxxx",
          "resourceGroup": "resource-group-name",
          "location": "eastus2",
          "aadClientId": "xxxx-xxxx-xxxx-xxxx-xxxx",
          "aadClientSecret": "xxxx-xxxx-xxxx-xxxx-xxxx",
          "useManagedIdentityExtension": false,
          "userAssignedIdentityID": "",
          "useInstanceMetadata": true
        }
        EOF
    # Run the binary and verify its startup
    - name: Run and test `blobplugin`
      uses: test/daemon-check-output
      with:
        start: /usr/bin/blobplugin -kubeconfig=/root/.kube/config -v=5
        timeout: 30
        expected_output: |
          Driver Version: v${{package.version}}
          Driver Name: blob.csi.azure.com
          Enabling controller service capability: CREATE_DELETE_VOLUME
          Enabling controller service capability: CLONE_VOLUME
          Enabling volume access mode: MULTI_NODE_MULTI_WRITER
