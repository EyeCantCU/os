package:
  name: rancher-system-upgrade-controller-fips
  version: "0.19.0"
  epoch: 0
  description: A Kubernetes controller that safely automates node upgrades in your cluster, coordinating OS and Kubernetes version updates with minimal disruption.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - tzdata

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rancher/system-upgrade-controller
      tag: v${{package.version}}
      expected-commit: b0ff1f4c330d5c3cea8fc7c48556db6db9d946d6

  - uses: go/build
    with:
      packages: .
      go-package: go-fips
      output: system-upgrade-controller
      ldflags: |
        -X github.com/rancher/system-upgrade-controller/pkg/version.Version=${{package.version}}
        -X github.com/rancher/system-upgrade-controller/pkg/version.GitCommit=$(git rev-parse HEAD | cut -c1-8)

update:
  enabled: true
  ignore-regex-patterns:
    - -rc
  github:
    identifier: rancher/system-upgrade-controller
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: system-upgrade-controller
    - uses: test/kwok/cluster
    - name: "Test controller startup and Plan CRD processing"
      uses: test/daemon-check-output
      with:
        setup: |
          set -euo pipefail

          kubectl create namespace system-upgrade
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: system-upgrade
            namespace: system-upgrade
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: system-upgrade
          rules:
          - apiGroups: ["", "apps", "batch", "upgrade.cattle.io"]
            resources: ["*"]
            verbs: ["*"]
          ---
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: system-upgrade
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: system-upgrade
          subjects:
          - kind: ServiceAccount
            name: system-upgrade
            namespace: system-upgrade
          EOF

          kubectl apply -f https://raw.githubusercontent.com/rancher/system-upgrade-controller/v${{package.version}}/pkg/crds/yaml/generated/upgrade.cattle.io_plans.yaml
          kubectl wait --for=condition=Established crd plans.upgrade.cattle.io --timeout=60s
        start: |
          system-upgrade-controller \
            --kubeconfig ~/.kube/config \
            --namespace system-upgrade \
            --name system-upgrade-controller \
            --debug
        timeout: 30
        expected_output: |
          Starting /v1, Kind=Node controller
          Starting upgrade.cattle.io/v1, Kind=Plan controller
        post: |
          set -euo pipefail

          kubectl apply -f - <<EOF
          apiVersion: upgrade.cattle.io/v1
          kind: Plan
          metadata:
            name: test-plan
            namespace: system-upgrade
          spec:
            nodeSelector:
              matchLabels:
                kubernetes.io/os: linux
            serviceAccountName: system-upgrade
            concurrency: 1
            version: "test-version-1.0.0"
            upgrade:
              image: cgr.dev/chainguard/wolfi-base:latest
              command: ["sh", "-c"]
              args: ["echo upgrade-test"]
          EOF

          sleep 2
          kubectl get plan test-plan -n system-upgrade -o json | jq -e '.spec.version == "test-version-1.0.0"'
          echo "Plan created and controller is processing it successfully"
