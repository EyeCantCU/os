package:
  name: helm-fips-4
  version: "4.1.1"
  epoch: 1 # go/enterprise-rsc/helm-fips-4
  description: The Kubernetes Package Manager
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - helm-fips=${{package.full-version}}
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "6"
    memory: 9Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/helm/helm
      tag: v${{package.version}}
      expected-commit: 5caf0044d4ef3d62a955440272999e139aafbbed

  - runs: |
      make build CGO_ENABLED=1 LDFLAGS=-w TAGS=netgo,osusergo
      install -Dm755 ./bin/helm "${{targets.destdir}}/usr/bin/helm"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: helm
    - name: Setup Helm
      runs: |
        set -euo pipefail
        helm repo add stable https://charts.helm.sh/stable
        helm repo update
    - name: Verify Helm Version
      runs: |
        set -euo pipefail
        # Verify version output contains BuildInfo (fails test if missing)
        helm version | grep -F "version.BuildInfo" || exit 1
    - name: Search Helm Chart
      runs: |
        set -euo pipefail
        # Verify nginx chart is searchable (fails test if not found)
        helm search repo nginx | grep -F "nginx" || exit 1
    - name: Helm Lint
      runs: |
        set -euo pipefail
        helm create lint-test
        helm lint lint-test || exit 1
        rm -rf lint-test

update:
  enabled: true
  github:
    identifier: helm/helm
    strip-prefix: v
    tag-filter-prefix: v4
