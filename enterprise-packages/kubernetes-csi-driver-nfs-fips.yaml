package:
  name: kubernetes-csi-driver-nfs-fips
  version: "4.12.1"
  epoch: 5 # CVE-2025-61726
  description: This driver allows Kubernetes to access NFS server on Linux node
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - coreutils
      - efs-utils
      - libcap
      # https://github.com/kubernetes-csi/csi-driver-nfs/blob/b68ee7181160b12717c80c53667e2d33bf1edc7b/Dockerfile#L21
      - mount
      - umount
      - util-linux-misc

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-csi/csi-driver-nfs
      tag: v${{package.version}}
      expected-commit: c220ebec63f171bb2e56b3112f9756e1164e47b2

  - uses: go/bump
    with:
      deps: |-
        github.com/opencontainers/selinux@v1.13.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/nfsplugin
      ldflags: |
        -X github.com/kubernetes-csi/csi-driver-nfs/pkg/nfs.driverVersion=${{package.version}}
        -X github.com/kubernetes-csi/csi-driver-nfs/pkg/nfs.gitCommit=$(git rev-parse --short=8 HEAD)
        -X github.com/kubernetes-csi/csi-driver-nfs/pkg/nfs.buildDate=$(date -u -d "@${SOURCE_DATE_EPOCH:-$(date +%s)}" "+%Y-%m-%dT%H:%M:%SZ")
      output: nfsplugin

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package for matching with the upstream Dockerfile"
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/
          ln -sf /usr/bin/nfsplugin "${{targets.contextdir}}"/nfsplugin
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            set -euo pipefail

            # Verify symlink exists (fails test if missing)
            stat /nfsplugin

            # Verify symlink points to correct target (fails test if wrong)
            target=$(readlink /nfsplugin)
            if [ "$target" != "/usr/bin/nfsplugin" ]; then
              echo "FAIL: Expected symlink target '/usr/bin/nfsplugin', got '$target'"
              exit 1
            fi

            # Verify the symlinked binary works (fails test if binary errors)
            /nfsplugin --help

update:
  enabled: true
  github:
    identifier: kubernetes-csi/csi-driver-nfs
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        nfsplugin --help
    - name: Test NFS plugin daemon startup and socket
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /csi
        start: /usr/bin/nfsplugin -v=5 --endpoint="unix:///csi/csi.sock" --nodeid="node-000000"
        expected_output: "Listening for connections"
        post: |-
          set -euo pipefail

          # Verify the Unix socket was created (fails test if missing)
          stat /csi/csi.sock

          # Verify it's a socket file type (fails test if not a socket)
          test -S /csi/csi.sock || { echo "FAIL: /csi/csi.sock is not a socket"; exit 1; }

          echo "SUCCESS: CSI socket is created and is a valid Unix socket"
