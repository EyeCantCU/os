package:
  name: container-object-storage-interface-fips
  version: "0.2.1"
  epoch: 1 # CVE-2025-47907
  description: Container Object Storage Interface (COSI) responsible for defining COSI spec and APIs, interfacing with COSI drivers, and managing the lifecycle of COSI objects
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - container-object-storage-interface-controller-fips
      - container-object-storage-interface-sidecar-fips

data:
  - name: binaries
    items:
      sidecar:
      controller:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/container-object-storage-interface
      tag: v${{package.version}}
      expected-commit: f1f392110e45b4f407aa214380eda16b118db31d

subpackages:
  - range: binaries
    name: "container-object-storage-interface-${{range.key}}-fips"
    description: COSI's ${{range.key}} binary
    pipeline:
      - uses: go/bump
        with:
          deps: |-
            golang.org/x/net@v0.38.0
            golang.org/x/oauth2@v0.27.0
          modroot: ./${{range.key}}
      - uses: go/build
        with:
          go-package: go-fips
          packages: ./cmd
          output: ${{range.key}}
          modroot: ./${{range.key}}
    test:
      pipeline:
        - uses: test/go-fips-check
        - runs: |
            ${{range.key}} --help

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/container-object-storage-interface
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - container-object-storage-interface-controller-compat
        - container-object-storage-interface-sidecar-compat
    environment:
      KUBERNETES_SERVICE_HOST: "127.0.0.1"
      KUBERNETES_SERVICE_PORT: 32764
  pipeline:
    - uses: test/emptypackage
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - uses: test/daemon-check-output
      with:
        start: /controller -v=9
        timeout: 15
        expected_output: |
          acquire leader lease
          Response Headers
          failed to acquire lease
