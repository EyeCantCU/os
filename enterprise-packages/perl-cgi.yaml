package:
  name: perl-cgi
  version: "4.71"
  epoch: 1
  description: Handle Common Gateway Interface requests and responses
  copyright:
    - license: Artistic-2.0
  dependencies:
    runtime:
      - perl
      - perl-html-parser
      - perl-uri

environment:
  contents:
    packages:
      - perl-dev
      - perl-html-parser
      - perl-test-nowarnings
      - perl-test-warn
      - perl-uri

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/leejo/CGI.pm.git
      tag: v${{package.version}}
      expected-commit: a1940af56ffbec89ff66bd6c13da1389ef689696

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Smoke test
      runs: |
        perl <<'EOF' | grep -F -e "Content-Type: text/html; charset=ISO-8859-1"
        use strict;
        use warnings;

        use CGI qw/:standard/;           # load standard CGI routines
        print header();                  # create the HTTP header
        EOF
