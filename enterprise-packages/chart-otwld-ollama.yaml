package:
  name: chart-otwld-ollama
  version: "1.48.0"
  epoch: 0
  description: Get up and running with large language models locally.
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/otwld/ollama-helm
      tag: ollama-${{package.version}}
      expected-commit: ed1d763cd7c7c5d98a3cf2e8a10c390fbabed269

  - uses: charts/package
    with:
      chart-path: .
      images: |
        ollama:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        values:
          tests:
            enabled: false
        cases:
          - name: default
            images: [ollama]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: otwld/ollama-helm
    strip-prefix: ollama-
    use-tag: true
    tag-filter-prefix: ollama-
