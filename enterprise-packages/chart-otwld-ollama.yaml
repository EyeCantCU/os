package:
  name: chart-otwld-ollama
  version: "1.49.0"
  epoch: 0
  description: Get up and running with large language models locally.
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/otwld/ollama-helm
      tag: ollama-${{package.version}}
      expected-commit: 7c2b134c39b49e70b4fc4781f75a88ee3a21e5d2

  - uses: charts/package
    with:
      chart-path: .
      images: |
        ollama:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        values:
          tests:
            enabled: false
        cases:
          - name: default
            images: [ollama]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: otwld/ollama-helm
    strip-prefix: ollama-
    use-tag: true
    tag-filter-prefix: ollama-
