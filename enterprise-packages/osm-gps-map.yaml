package:
  name: osm-gps-map
  version: 1.2.0
  epoch: 1 # go/enterprise-rsc/osm-gps-map
  description: GTK+ Widget for Displaying OpenStreetMap tiles
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "6"
    memory: 9Gi

environment:
  contents:
    packages:
      - autoconf
      - autoconf-archive
      - automake
      - build-base
      - busybox
      - glib-dev
      - gobject-introspection-dev # Required for automake even though we disable introspection
      - gtk-3-dev
      - gtk-doc # Required for autogen.sh even though we disable gtk-doc
      - libsoup3-dev
      - libtool
      - pkgconf-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nzjrs/osm-gps-map
      tag: ${{package.version}}
      expected-commit: 4f383ca3623bca1d2908d4c315b2d9e960d2972f

  # Cherry-picks have merge conflicts on v1.2.0, using adapted patches instead
  - uses: patch
    with:
      patches: drop-old-soup.patch port-to-libsoup3.patch

  - runs: ./autogen.sh

  - uses: autoconf/configure
    with:
      opts: |
        --disable-introspection \
        --disable-gtk-doc

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      environment:
        contents:
          packages:
            - gtk-3-dev
            - libsoup3-dev
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify osm-gps-map library
      runs: |
        set -euo pipefail
        stat /usr/lib/libosmgpsmap-1.0.so*
        echo "osm-gps-map library test passed"

update:
  enabled: true
  github:
    identifier: nzjrs/osm-gps-map
