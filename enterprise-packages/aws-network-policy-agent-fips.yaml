package:
  name: aws-network-policy-agent-fips
  version: "1.3.1"
  epoch: 1 # CVE-2025-61730
  description: Amazon EKS Network Policy Agent is a daemonset that is responsible for enforcing configured network policies on the cluster.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - clang-16
      - libbpf-dev
      - llvm-16-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/aws-network-policy-agent
      tag: v${{package.version}}
      # WARNING Also please upgrade vmlinux.h header by hand using generate-vmlinuxh.sh
      # TODO:
      # Note that script relies on launchad AL2023 docker container to
      # get AL2023 kernel image. Maybe we should package dnf tooling
      # in wolfi, to be able to download AL2023 kernel as a build
      # dependency at build-time instead
      expected-commit: 6035dc585f59adb9aaac2107f7f8c39f545eacc5

  - name: Drop -march=bpf which produces an error in versions > clang-16
    uses: patch
    with:
      patches: fix-build-march-bpf-will-error.patch

  # Make sure that one of the legs of the copy headers is executed.
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == "x86_64"
        runs: |
          mv pkg/ebpf/c/vmlinux.h-x86_64 pkg/ebpf/c/vmlinux.h
          rm pkg/ebpf/c/vmlinux.h-aarch64
      - if: ${{build.arch}} == "aarch64"
        runs: |
          mv pkg/ebpf/c/vmlinux.h-aarch64 pkg/ebpf/c/vmlinux.h
          rm pkg/ebpf/c/vmlinux.h-x86_64

  - uses: go/build
    with:
      tags: netgo,ebpf,core
      output: controller
      packages: main.go
      go-package: go-fips

  - uses: go/build
    with:
      output: aws-eks-na-cli
      packages: ./cmd/cli
      go-package: go-fips

  - uses: go/build
    with:
      output: aws-eks-na-cli-v6
      packages: ./cmd/cliv6
      go-package: go-fips

  - uses: autoconf/make
    with:
      opts: build-bpf

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      mv pkg/ebpf/c/*.bpf.o ${{targets.contextdir}}/usr/bin/

  - uses: strip

# we needed this since we defined the package itself as a runtime dependencies for the compat package in Wolfi OS
subpackages:
  # Note we do not use the package.name here to get the compat in before the
  # fips part.
  - name: "aws-network-policy-agent-compat-fips"
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}

          for bin in ${{targets.destdir}}/usr/bin/*
          do
            ln -sf /usr/bin/$(basename "$bin") ${{targets.contextdir}}/$(basename "$bin")
          done
    test:
      pipeline:
        - runs: |
            # Fail if links don't work
            stat -L /aws-eks-na-cli
            stat -L /aws-eks-na-cli-v6
            stat -L /controller
            stat -L /tc.v4ingress.bpf.o
            stat -L /tc.v4egress.bpf.o
            stat -L /tc.v6ingress.bpf.o
            stat -L /tc.v6egress.bpf.o
            stat -L /v4events.bpf.o
            stat -L /v6events.bpf.o

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        aws-eks-na-cli --help
        aws-eks-na-cli-v6 --help
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: aws/aws-network-policy-agent
    strip-prefix: v
