package:
  name: kubernetes-csi-external-snapshotter-8.2
  version: "8.2.1"
  epoch: 14 # CVE-2025-68119
  description: Sidecar container that watches Kubernetes Snapshot CRD objects and triggers CreateSnapshot/DeleteSnapshot against a CSI endpoint
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - kubernetes-csi-external-snapshotter=${{package.full-version}}
      - kubernetes-csi-external-csi-snapshotter=${{package.full-version}}
      - kubernetes-csi-external-csi-snapshotter-${{vars.major-minor-version}}=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-csi/external-snapshotter
      tag: v${{package.version}}
      expected-commit: a6a3d9d6b5f6f1e6fa0d311148b696556e4499e8

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      packages: ./cmd/csi-snapshotter
      output: csi-snapshotter
      ldflags: -X main.version=$(git describe --long --tags --match="v*" --dirty 2>/dev/null || git rev-list -n1 HEAD) -extldflags "-static"

  - uses: strip

subpackages:
  - name: kubernetes-csi-external-snapshot-controller-${{vars.major-minor-version}}
    dependencies:
      provides:
        - kubernetes-csi-external-snapshot-controller=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/snapshot-controller
          output: snapshot-controller
          ldflags: -X main.version=$(git describe --long --tags --match="v*" --dirty 2>/dev/null || git rev-list -n1 HEAD) -extldflags "-static"
      - uses: strip
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: kubernetes-csi-external-snapshot-controller
            real-pkg-name: ${{subpkg.name}}
        - uses: test/kwok/cluster
        - uses: test/daemon-check-output
          with:
            setup: |
              # Install VolumeSnapshot CRDs - snapshot-controller FATAL exits without them
              kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v${{package.version}}/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
              kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v${{package.version}}/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
              kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v${{package.version}}/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
              kubectl wait --for=condition=Established crd --all --timeout=60s
            start: snapshot-controller --kubeconfig ~/.kube/config
            expected_output: "Starting snapshot controller"
            timeout: "30"

update:
  enabled: true
  github:
    identifier: kubernetes-csi/external-snapshotter
    strip-prefix: v
    tag-filter: v8.2

test:
  environment:
    contents:
      packages:
        - kubernetes-csi-external-snapshot-controller-${{vars.major-minor-version}}
        - curl
        - kubernetes-csi-driver-hostpath
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: csi-snapshotter
    - uses: test/tw/help-check
      with:
        bins: |
          csi-snapshotter
          snapshot-controller
    - uses: test/kwok/cluster
    - name: Test csi-snapshotter with CSI driver
      runs: |
        set -euo pipefail
        mkdir -p /csi
        hostpathplugin --v=5 --endpoint="unix:///csi/csi.sock" --nodeid="node-000000" > /dev/null 2>&1 &
        csi-snapshotter --v=5 --csi-address "/csi/csi.sock" --kubeconfig ~/.kube/config --http-endpoint ":8080" > /dev/null 2>&1 &
        sleep 10
        # Verify metrics endpoint is responding (fails test on HTTP errors)
        curl -sfLk localhost:8080/metrics
