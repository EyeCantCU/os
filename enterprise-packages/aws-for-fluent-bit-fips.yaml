package:
  name: aws-for-fluent-bit-fips
  version: "3.2.3"
  epoch: 0
  description: AWS provides a Fluent Bit image with plugins for both CloudWatch Logs and Kinesis Data Firehose.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - aws-flb-cloudwatch-compat-fips
      - aws-flb-cloudwatch-fips
      - aws-flb-firehose-compat-fips
      - aws-flb-firehose-fips
      - aws-flb-kinesis-compat-fips
      - aws-flb-kinesis-fips
      - ca-certificates-bundle
      - fluent-bit

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - fluent-bit-docker-image

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/aws-for-fluent-bit
      expected-commit: 0c6b09b695f5cf22481c8b4cdb5652bb9dd57a29
      tag: v${{package.version}}

  - runs: |
      mkdir -p "${{targets.destdir}}"/etc/ecs
      mkdir -p "${{targets.destdir}}"/etc/fluent-bit/etc
      mkdir -p "${{targets.destdir}}"/etc/fluent-bit/parsers
      cp -r ./ecs/* ${{targets.destdir}}/etc/ecs
      cp fluent-bit.conf "${{targets.destdir}}"/etc/fluent-bit/etc/
      cp ./entrypoint.sh "${{targets.destdir}}"/etc/fluent-bit/entrypoint.sh
      echo "${{package.version}}" > "${{targets.destdir}}"/etc/fluent-bit/AWS_FOR_FLUENT_BIT_VERSION
      chmod +x "${{targets.destdir}}"/etc/fluent-bit/entrypoint.sh

  - runs: |
      mkdir -p "${{targets.destdir}}"/etc/fluent-bit/configs
      mv configs/parse-json.conf \
        configs/minimize-log-loss.conf \
        configs/output-metrics-healthcheck.conf \
        configs/plugin-metrics-to-cloudwatch.conf \
        configs/plugin-and-storage-metrics-to-cloudwatch.conf \
        configs/plugin-metrics-parser.conf \
        "${{targets.destdir}}"/etc/fluent-bit/configs/

  - runs: |
      cp /fluent-bit-docker-image/conf/parsers*.conf "${{targets.destdir}}"/etc/fluent-bit/etc
      cp /fluent-bit-docker-image/conf/parsers*.conf "${{targets.destdir}}"/etc/fluent-bit/parsers/

  - uses: strip

subpackages:
  - name: "aws-for-fluent-bit-compat-fips"
    description: "Compatibility package to place binaries in the location expected by AWS for Fluent Bit"
    pipeline:
      - runs: |
          # The AWS for Fluent Bit expects the .so libraries to be in /fluent-bit
          mkdir -p "${{targets.subpkgdir}}"/fluent-bit
          mkdir -p "${{targets.subpkgdir}}"/fluent-bit/bin
          mkdir -p "${{targets.subpkgdir}}"/ecs
          ln -sf /etc/ecs ${{targets.subpkgdir}}/ecs
          ln -sf /etc/fluent-bit/ ${{targets.subpkgdir}}/fluent-bit/
          ln -sf /usr/bin/fluent-bit ${{targets.subpkgdir}}/fluent-bit/bin/fluent-bit
          ln -sf /etc/fluent-bit/configs ${{targets.subpkgdir}}/fluent-bit
          ln -sf /etc/fluent-bit/parsers ${{targets.subpkgdir}}/fluent-bit
      - uses: strip
    # test added by a robot (compat)
    test:
      environment:
        contents:
          packages:
            - aws-for-fluent-bit-fips
      pipeline:
        - uses: test/tw/symlink-check
          with:
            packages: aws-for-fluent-bit-compat-fips
            allow-absolute: true

update:
  enabled: true
  github:
    identifier: aws/aws-for-fluent-bit
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/go-fips-check
      with:
        package-match: fluent-bit
    - name: "Verify package-installed configuration files"
      runs: |
        set -euo pipefail

        # Verify main configuration file exists (fails test if missing)
        stat /etc/fluent-bit/etc/fluent-bit.conf

        # Verify entrypoint script exists and is executable (fails test if missing or not executable)
        stat /etc/fluent-bit/entrypoint.sh
        test -x /etc/fluent-bit/entrypoint.sh || { echo "FAIL: entrypoint.sh is not executable"; exit 1; }

        # Verify version file exists and contains correct version (fails test if missing or wrong version)
        stat /etc/fluent-bit/AWS_FOR_FLUENT_BIT_VERSION
        grep -F "${{package.version}}" /etc/fluent-bit/AWS_FOR_FLUENT_BIT_VERSION

        # Verify configs directory and files exist (fails test if missing)
        stat /etc/fluent-bit/configs
        stat /etc/fluent-bit/configs/parse-json.conf
        stat /etc/fluent-bit/configs/minimize-log-loss.conf

        # Verify parsers directory and files exist (fails test if missing)
        stat /etc/fluent-bit/parsers
        stat /etc/fluent-bit/etc/parsers.conf

        echo "SUCCESS: All configuration files verified"
    - name: "Forward dummy log stream and verify output"
      runs: |-
        set -euo pipefail

        tee dummy.conf <<'EOF'
        [SERVICE]
          Flush        1
          Daemon       Off
          Log_Level    info
        [INPUT]
            Name         dummy
            Dummy        {"log":"test-message"}
            Samples      5
        [OUTPUT]
            Name         stdout
            Match        *
        EOF

        fluent-bit -c dummy.conf > /tmp/fluent-bit.log 2>&1 &
        PID=$!
        sleep 5
        kill $PID 2>/dev/null || true

        # Verify test-message appears in output (fails test if missing)
        grep -F "test-message" /tmp/fluent-bit.log

        echo "SUCCESS: Fluent-bit processed dummy log stream correctly"
