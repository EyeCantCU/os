package:
  name: portieris-fips
  version: "0.13.33"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: A Kubernetes Admission Controller for verifying image trust.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/IBM/portieris.git
      tag: v${{package.version}}
      expected-commit: 16293f03158119873e75c13426aeb970b0ffe6a2

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: "./cmd/portieris"
      ldflags: "-X github.com/IBM/portieris/internal/info.Version=v${{package.version}}"
      tags: containers_image_openpgp
      output: portieris
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: IBM/portieris
    strip-prefix: v

test:
  pipeline:
    - runs: |
        portieris --help
    - uses: test/go-fips-check
