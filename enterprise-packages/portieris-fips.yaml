package:
  name: portieris-fips
  version: "0.13.34"
  epoch: 2 # GHSA-fcv2-xgw5-pqxf
  description: A Kubernetes Admission Controller for verifying image trust.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/IBM/portieris.git
      tag: v${{package.version}}
      expected-commit: ce2ebfd69117de128ddcf8e20f82bc42423220ee

  - uses: go/bump
    with:
      deps: |-
        github.com/sigstore/fulcio@v1.8.5
        github.com/sigstore/sigstore@v1.10.4

  - uses: go/build
    with:
      packages: "./cmd/portieris"
      ldflags: "-X github.com/IBM/portieris/internal/info.Version=v${{package.version}}"
      tags: containers_image_openpgp
      output: portieris
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: IBM/portieris
    strip-prefix: v

test:
  pipeline:
    - runs: |
        portieris --help
    - uses: test/go-fips-check
