package:
  name: py3-qrcode
  version: 8.2
  epoch: 1 # go/enterprise-rsc/py3-qrcode
  description: Python QR Code image generator
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 6Gi

vars:
  pypi-package: qrcode

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-poetry

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/lincolnloop/python-qrcode.git
      tag: v${{package.version}}
      expected-commit: 3704f57a1107dbf553a50f5b531da3859abe19cf

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
