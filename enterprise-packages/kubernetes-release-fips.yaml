package:
  name: kubernetes-release-fips
  version: "0.18.0"
  epoch: 7 # CVE-2025-61729
  description: Release infrastructure for Kubernetes and related components
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/release
      tag: v${{package.version}}
      expected-commit: c9d35e44243dce12e40ee2b60faddb3fea2f76f6

subpackages:
  - name: kubernetes-release-go-runner-fips
    description: "A go based binary that can run commands and wrap stdout/stderr"
    pipeline:
      - working-directory: /home/build/images/build/go-runner
        uses: go/build
        with:
          packages: .
          output: go-runner
          go-package: go-fips
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/
          ln -sf /usr/bin/go-runner ${{targets.subpkgdir}}/go-runner
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: kubernetes-release-go-runner-fips
        - uses: test/tw/help-check
          with:
            bins: go-runner
        - name: Test go-runner command wrapping functionality
          runs: |
            set -euo pipefail
            # Verify go-runner can execute commands and wrap output
            output=$(go-runner echo "test-output")
            echo "$output" | grep -F "test-output" || {
              echo "FAIL: Expected 'test-output' in go-runner output"
              echo "Actual output: $output"
              exit 1
            }
            echo "SUCCESS: go-runner correctly wraps command output"

test:
  environment:
    contents:
      packages:
        - go-fips
        - kubernetes-release-go-runner-fips
  pipeline:
    - uses: test/go-fips-check
    - name: Verify go-runner installation
      runs: |
        set -euo pipefail
        # Verify go-runner can wrap go version command (fails if go-runner broken)
        go-runner go version
        # Verify symlink at /go-runner works (fails if symlink broken)
        /go-runner go version

update:
  enabled: true
  github:
    identifier: kubernetes/release
    strip-prefix: v
