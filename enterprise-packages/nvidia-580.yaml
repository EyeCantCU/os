#nolint:git-checkout-must-use-github-updates
package:
  name: nvidia-580
  version: "580.126.09"
  epoch: 14
  description: NVIDIA Linux open GPU kernel module
  copyright:
    - license: MIT AND GPL-2.0

var-transforms:
  - from: ${{package.name}}
    match: 'nvidia-([0-9]+)'
    replace: '$1'
    to: nvidia-version

environment:
  environment:
    NV_BUILD_USER: noreply
    NV_BUILD_HOST: chainguard.dev
    KBUILD_BUILD_USER: noreply
    KBUILD_BUILD_HOST: chainguard.dev
    KBUILD_BUILD_VERSION: Chainguard
  contents:
    packages:
      - linux-aws-6.12-headers
      - linux-aws-6.18-headers
      - linux-azure-6.12-headers
      - linux-azure-6.18-headers
      - linux-gcp-6.12-headers
      - linux-gcp-6.18-headers
      - linux-qemu-6.12-headers
      - linux-qemu-6.18-headers
      - linux-vmware-6.12-headers
      - linux-vmware-6.18-headers

data:
  - name: kernels
    items:
      linux-aws-6.12: aws-6.12
      linux-azure-6.12: azure-6.12
      linux-gcp-6.12: gcp-6.12
      linux-qemu-6.12: qemu-6.12
      linux-vmware-6.12: vmware-6.12
      linux-aws-6.18: aws-6.18
      linux-azure-6.18: azure-6.18
      linux-gcp-6.18: gcp-6.18
      linux-qemu-6.18: qemu-6.18
      linux-vmware-6.18: vmware-6.18

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/open-gpu-kernel-modules
      tag: ${{package.version}}
      expected-commit: 455d4b8b75f56d7483489c255705d064fdedf3c6

  - uses: patch
    with:
      patches: modules/${{package.name}}/objtool-rethunk-sls-orc.patch

subpackages:
  - range: kernels
    name: ${{package.name}}-${{range.value}}
    description: NVIDIA Linux open GPU kernel module for ${{range.key}}
    dependencies:
      provides:
        - ${{package.name}}-driver=${{package.full-version}}
    pipeline:
      - uses: kernel/out-of-tree-module
        with:
          headers: ${{range.value}}
          chdir: false
          clean: true
    test:
      environment:
        contents:
          packages:
            - kmod
            - ${{range.key}}-headers
      pipeline:
        - runs: |
            set -o pipefail
            modinfo /usr/lib/modules/*/extra/nvidia.ko.zst | grep vermagic | grep "${{range.value}}"
        - uses: kernel/test/module-signature
          with:
            module: 'nvidia*.ko*'
            certificate: nvidia-580.x509
        - uses: kernel/test/modprobe
          with:
            modprobe: nvidia
            # TODO(a-crate): fix oot module signing in tests
            # we have a signature but it's kind of difficult to get it into the keyring
            # in the microvm
            args: 'module.sig_enforce=0'
            # Nvidia module refuses to load if there is no hardware present. If
            # we reached the hardware scan it's probably OK.
            error: No such device

  # If these metapackages break during package version updates, the corresponding
  # nvidia-tesla-$nvidiaversion-tools package probably needs to be updated in extra-packages.
  - name: ${{package.name}}-tools
    description: Metapackage for NVIDIA kernel module and correct nvidia tool version
    dependencies:
      runtime:
        - ${{package.name}}-driver=${{package.full-version}}
        - nvidia-tesla-${{vars.nvidia-version}}-tools~${{package.version}}
    test:
      pipeline:
        - uses: test/emptypackage

  - name: ${{package.name}}-systemd-service
    description: Metapackage for NVIDIA kernel module and systemd services to initialize the GPU
    dependencies:
      runtime:
        - ${{package.name}}-driver=${{package.full-version}}
        - nvidia-tesla-${{vars.nvidia-version}}-systemd-service~${{package.version}}
    test:
      pipeline:
        - uses: test/emptypackage

  - name: ${{package.name}}-container-host
    description: Metapackage for NVIDIA kernel module and dependencies to use the GPU in containers
    dependencies:
      runtime:
        - ${{package.name}}-driver=${{package.full-version}}
        - nvidia-tesla-${{vars.nvidia-version}}-systemd-service~${{package.version}}
        - nvidia-tesla-${{vars.nvidia-version}}-libcuda~${{package.version}}
        - nvidia-container-toolkit-nvidia-container-runtime
        - nvidia-container-toolkit-nvidia-ctk-systemd-service
    test:
      pipeline:
        - uses: test/emptypackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  release-monitor:
    identifier: 388052
