package:
  name: arangodb-3.12
  version: "3.12.7.2"
  epoch: 1
  description: "Native multi-model database with flexible data models for documents, graphs, and key-values."
  copyright:
    - license: "BUSL-1.1"
  dependencies:
    provides:
      - arangodb=${{package.full-version}}
    runtime:
      - coreutils
      - openmp-19

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)(?:\.\d+)+$ # upstream sometimes uses a.b.c, sometimes a.b.c.d
    replace: $1
    to: major-minor-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-19
      - clang-19-dev
      - cmake-3
      - curl
      - gc-dev
      - gcc-14-default
      - icu-dev
      - jemalloc-dev
      - jitterentropy-library-dev
      - libatomic-14
      - libunwind-dev
      - lld
      - llvm-19
      - llvm-libcxx-19
      - llvm-libcxx-19-dev
      - lz4-dev
      - nodejs
      - npm
      - openblas-dev
      - openmp-19-dev
      - openssl-dev
      - perl
      - py3-setuptools
      - python3-dev
      - snappy-dev
      - systemd-dev
      - yarn
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/arangodb/arangodb
      tag: v${{package.version}}
      expected-commit: 91887006ed857e7694fa35d52e20f1da4b7c7ba9

  - name: Get dependencies
    runs: |
      git submodule update --init --recursive

  - name: Fix CVE-2025-5889, GHSA-mh29-5h37-fv8m and GHSA-6rw7-vpxm-498p
    runs: |
      cd js/node
      npm install brace-expansion@1.1.12 js-yaml@3.14.2 qs@6.14.2 lodash@4.17.23 --no-save --omit=dev

  - name: Hack to use our libs
    runs: |
      sed -i '/if (LIBOMP)/,/endif ()/c\
        message(STATUS "Using shared libomp.so from /usr/lib")\
        set(OpenMP_C_FLAGS "-fopenmp=libomp -L/usr/lib -Wl,-rpath,/usr/lib")\
        set(OpenMP_CXX_FLAGS "${OpenMP_C_FLAGS}")' 3rdParty/CMakeLists.txt
      mkdir -p /usr/lib/x86_64-linux-gnu/blas
      mkdir -p /usr/lib/x86_64-linux-gnu/lapack
      ln -sf /usr/lib/libopenblas.a /usr/lib/x86_64-linux-gnu/blas/libblas.a
      ln -sf /usr/lib/libopenblas.a /usr/lib/x86_64-linux-gnu/lapack/liblapack.a

  - name: Configure the build
    runs: |
      cmake \
        -DSTATIC_EXECUTABLES=OFF \
        -DOpenMP_C_FLAGS="-fopenmp" \
        -DOpenMP_CXX_FLAGS="-fopenmp" \
        -DOpenMP_C_LIB_NAMES="omp" \
        -DOpenMP_CXX_LIB_NAMES="omp" \
        -DOpenMP_omp_LIBRARY="/usr/lib/libomp.so" \
        -DOpenMP_ROOT="/usr/lib" \
        -DCMAKE_C_COMPILER=clang-19 \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DCMAKE_C_COMPILER_AR="/usr/bin/llvm-ar" \
        -DCMAKE_CXX_COMPILER_AR="/usr/bin/llvm-ar" \
        -DCMAKE_C_COMPILER_RANLIB="/usr/bin/llvm-ranlib" \
        -DCMAKE_CXX_COMPILER_RANLIB="/usr/bin/llvm-ranlib" \
        -DCMAKE_EXE_LINKER_FLAGS="-Wl,--build-id=sha1 -fno-stack-protector -fuse-ld=lld -ljitterentropy" \
        -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld" \
        -DUSE_LIBUNWIND=true -DUSE_PRECOMPILED_V8=false \
        -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
        -DCMAKE_C_FLAGS="-fPIC" \
        -DCMAKE_CXX_FLAGS="-fPIC" \
        -DSNAPPY_INCLUDE_DIR=/usr/include \
        -DJEMALLOC_INCLUDE=/usr/include \
        -DZLIB_INCLUDE_DIR=/usr/include \
        -DUNWIND_INCLUDE_DIR=/usr/include \
        -DOPENSSL_ROOT_DIR=/usr/lib \
        --preset community

  - name: Build
    runs: |
      cmake \
        --build \
        --preset community \
        --target arangodb \
        -- -j$(nproc) VERBOSE=1

  - name: Install binaries
    runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      cd build-presets/community/bin
      cp -a arango-init-database arango-secure-installation arangobench arangod arangodump arangoexport arangoimp arangoimport arangoinspect arangorestore arangosh arangovpack foxx-manager snowball ${{targets.destdir}}/usr/bin

  - name: Build Aardvark React UI
    working-directory: js/apps/system/_admin/aardvark/APP/react
    runs: |
      yarn install --frozen-lockfile
      yarn build
      rm -rf node_modules

  # Reference: https://github.com/arangodb/oskar/blob/04f8b7902bc8ac4fa1ebec3187313e28126489f7/debian/3.11/common/rules
  - name: Install helpers and configurations
    runs: |
      mkdir -p ${{targets.destdir}}/usr/share/arangodb3
      cp -a js ${{targets.destdir}}/usr/share/arangodb3/js
      cp Installation/arangodb-helper ${{targets.destdir}}/usr/share/arangodb3/arangodb-helper
      cp Installation/arangodb-update-db ${{targets.destdir}}/usr/share/arangodb3/arangodb-update-db
      cp build-presets/community/bin/icudtl.dat ${{targets.destdir}}/usr/share/arangodb3/icudtl.dat
      cp build-presets/community/bin/icudtl_legacy.dat ${{targets.destdir}}/usr/share/arangodb3/icudtl_legacy.dat

  - name: Install configuration files
    runs: |
      mkdir -p ${{targets.destdir}}/etc
      cp -a build-presets/community/etc/arangodb3 ${{targets.destdir}}/etc/arangodb3
      # ref: https://github.com/arangodb/arangodb-docker/blob/fc9ce3eff9804b5232c97894c603266eae12a592/alpine/3.11.14/Dockerfile#L32
      sed -i "/^uid.*$/d" ${{targets.destdir}}/etc/arangodb3/arangod.conf
      sed -i "s|127.0.0.1|0.0.0.0|g" ${{targets.destdir}}/etc/arangodb3/arangod.conf
      sed -i "s|^file = /var/log/arangodb3/arangod.log|file = -|" ${{targets.destdir}}/etc/arangodb3/arangod.conf
      mkdir -p ${{targets.destdir}}/var/log/arangodb3
      mkdir -p ${{targets.destdir}}/var/log/arangodb3-apps
      mkdir -p ${{targets.destdir}}/var/lib/arangodb3
      mkdir -p ${{targets.destdir}}/var/lib/arangodb3-apps

  - name: Copy timezone data
    working-directory: 3rdParty/tzdata
    runs: |
      mkdir -p ${{targets.destdir}}/usr/share/arangodb3/tzdata
      cp NEWS africa antarctica asia australasia backward backzone calendars etcetera europe northamerica southamerica version windowsZones.xml ${{targets.destdir}}/usr/share/arangodb3/tzdata/
      echo "UTC" > ${{targets.destdir}}/etc/timezone

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    dependencies:
      provides:
        - arangodb-compat=${{package.full-version}}
      runtime:
        # pwgen and numactl are required by entrypoint scripts
        # https://github.com/arangodb/arangodb-docker/blob/351d27922fd2060deb86a76a26a99ff1bb2f3c12/alpine/3.11.9/docker-entrypoint.sh#L68
        - pwgen
        - numactl
        - bash-binsh
    pipeline:
      - name: Install entrypoint
        runs: |
          mkdir -p "${{targets.destdir}}"/usr/share
          install -m755 scripts/docker/deploy/entrypoint.sh "${{targets.destdir}}/usr/share/entrypoint.sh"
          sed -i 's|/usr/sbin/arango-init-database -c /tmp/arangod.conf \$@|/usr/sbin/arango-init-database -c /tmp/arangod.conf|' ${{targets.destdir}}/usr/share/entrypoint.sh
      # Differs from 3.11 because 3.11 does not have the docker entrypoint stored in the main arangodb repo
      - name: Create symlinks
        runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/share/entrypoint.sh ${{targets.subpkgdir}}/entrypoint.sh
          mkdir -p ${{targets.contextdir}}/usr/bin/
          ln -sf /usr/bin/arangod ${{targets.contextdir}}/usr/bin/arango-init-database
    test:
      pipeline:
        - runs: |
            test "$(readlink -f /entrypoint.sh)" = "/usr/share/entrypoint.sh"
            test "$(readlink -f /usr/sbin/arango-init-database)" = "/usr/bin/arangod"

update:
  enabled: true
  github:
    identifier: arangodb/arangodb
    tag-filter: v3.12
    strip-prefix: v
    use-tag: true

test:
  environment:
    accounts:
      users:
        - username: arangodb
          uid: 1000
          gid: 0
      # sudo must retain permissions
      run-as: 0
    contents:
      packages:
        - curl
        - jq
        - sudo
        - wait-for-it
  pipeline:
    - name: Ensure important directories exist
      runs: |
        for d in /var/lib/arangodb3 /var/lib/arangodb3-apps /var/log/arangodb3 /var/log/arangodb3-apps; do
          stat "$d"
        done
    - name: Test arangodb and arangosh end-to-end
      runs: |
        #!/bin/bash
        set -ueo pipefail

        sudo chown -R arangodb:root /var

        # Start arangod with authentication disabled.
        sudo -u arangodb arangod \
          -c /etc/arangodb3/arangod.conf \
          --server.endpoint tcp://127.0.0.1:8529 \
          --server.authentication=false \
          --default-language-check=false \
          /tmp/database-dir &> /tmp/arangod_output.log &
        wait-for-it localhost:8529 --timeout=10

        # Set credentials using arangosh tool.
        ICU_DATA_LEGACY=/usr/share/arangodb3/ ICU_DATA=/usr/share/arangodb3/ \
          arangosh --server.endpoint tcp://127.0.0.1:8529 \
          --server.authentication false \
          --javascript.execute-string 'require("@arangodb/users").update("root", "newpassword")'

        # Restart arangod with authentication enabled.
        kill -9 $!
        arangod \
          -c /etc/arangodb3/arangod.conf \
          --server.endpoint tcp://127.0.0.1:8529 \
          /tmp/database-dir &
        wait-for-it localhost:8529 --timeout=10

        # Test variables.
        ARANGO_HOST="http://localhost:8529"
        DB_NAME="testdb"
        COLLECTION_NAME="testcollection"
        DOC_NAME="testdoc"
        USER="root"
        PASSWORD="newpassword"
        AUTH_HEADER=""
        if [[ -n "$PASSWORD" ]]; then
          AUTH_HEADER="-u $USER:$PASSWORD"
        fi

        # Check the version.
        curl_output=$(curl --silent --fail $AUTH_HEADER "$ARANGO_HOST/_api/version") || exit $?
        version=$(echo "$curl_output" | jq '.version' | tr -d '"')
        if [[ ${version//-/.} != ${{package.version}} ]]; then
          echo "Version ${version//-/.} does not match package version ${{package.version}}"
          exit 1
        fi

        # Create a database.
        curl_output=$(curl --silent --fail -X POST $AUTH_HEADER \
          "$ARANGO_HOST/_api/database" \
          -H "Content-Type: application/json" \
          -d '{"name": "'$DB_NAME'"}') || exit $?
        err=$(echo "$curl_output" | jq '.error')
        if [[ $err != "false" ]]; then
          echo "Failed creating a database"
          exit 1
        fi

        # Create a collection.
        curl_output=$(curl --silent --fail -X POST $AUTH_HEADER \
          -H "Content-Type: application/json" \
          -d "{\"name\": \"$COLLECTION_NAME\"}" \
          "$ARANGO_HOST/_db/$DB_NAME/_api/collection") || exit $?
        err=$(echo "$curl_output" | jq '.error')
        if [[ $err != "false" ]]; then
          echo "Failed creating a collection"
          exit 1
        fi

        # Create a document.
        curl_output=$(curl --silent --fail -X POST $AUTH_HEADER \
          -H "Content-Type: application/json" \
          -d "{\"_key\": \"${DOC_NAME}\", \"name\": \"Test\"}" \
          "$ARANGO_HOST/_db/$DB_NAME/_api/document/$COLLECTION_NAME") || exit $?
        id=$(echo "$curl_output" | jq '._id')
        if [[ "${id//\"/}" != "${COLLECTION_NAME}/${DOC_NAME}" ]]; then
          echo "Failed inserting a document"
          exit 1
        fi

        # Get a document.
        res=$(curl --silent -X POST $AUTH_HEADER \
          -H "Content-Type: application/json" \
          -d "{\"query\": \"FOR doc IN $COLLECTION_NAME FILTER doc._key == \\\"$DOC_NAME\\\" RETURN doc\"}" \
          "$ARANGO_HOST/_db/$DB_NAME/_api/cursor")

        error=$(echo "$res" | jq '.error')
        if [[ $error != "false" ]]; then
          echo "Failed querying document"
          exit 1
        fi
        id=$(echo "$res" | jq '.result[0]._id')
        if [[ ${id//\"/} != "${COLLECTION_NAME}/${DOC_NAME}" ]]; then
          echo "Failed querying document"
          exit 1
        fi

        # Cleanup.
        curl_output=$(curl --silent -X DELETE $AUTH_HEADER "$ARANGO_HOST/_db/$DB_NAME/_api/collection/$COLLECTION_NAME") || exit $?
        err=$(echo "$curl_output" | jq '.error')
        if [[ $err != "false" ]]; then
          echo "Failed cleaning up collection"
          exit 1
        fi

        curl_output=$(curl --silent -X DELETE $AUTH_HEADER "$ARANGO_HOST/_api/database/$DB_NAME") || exit $?
        err=$(echo "$curl_output" | jq '.error')
        if [[ $err != "false" ]]; then
          echo "Failed cleaning up database"
          exit 1
        fi
    - uses: test/tw/ldd-check
