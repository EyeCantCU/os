package:
  name: crossplane-provider-gitlab-fips
  version: "0.16.0"
  epoch: 2 # CVE-2025-61730
  description: Crossplane provider-gitlab is the infrastructure provider for Gitlab.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - crossplane-crank

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 75e6a8aded44cb6e97c32ced960203afc48f6e34
      repository: https://github.com/crossplane-contrib/provider-gitlab
      tag: v${{package.version}}

  - uses: go/build
    with:
      output: crossplane-gitlab-provider
      packages: ./cmd/provider
      ldflags: |
        -X github.com/crossplane-contrib/provider-gitlab/pkg/version.Version=v${{package.version}}
      go-package: go-fips-md5

  - runs: |
      crank xpkg extract xpkg.upbound.io/crossplane-contrib/provider-gitlab:v${{package.version}}
      mkdir -p "${{targets.destdir}}"
      gunzip out.gz -c > "${{targets.destdir}}"/package.yaml

subpackages:
  - name: crossplane-provider-gitlab-compat-fips
    description: Compat package for ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/local/bin"
          ln -sf /usr/bin/crossplane-gitlab-provider "${{targets.contextdir}}/usr/local/bin/crossplane-gitlab-provider"
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

update:
  enabled: true
  github:
    identifier: crossplane-contrib/provider-gitlab
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        crossplane-gitlab-provider --help
    - uses: test/kwok/cluster
    - name: Start crossplane-gitlab-provider in cluster
      uses: test/daemon-check-output
      with:
        start: |
          crossplane-gitlab-provider --debug /dev/null 2>&1 &
        timeout: 30
        expected_output: |
          error: Cannot start controller manager: failed to list managed resources: no matches for kind "Member" in version "groups.gitlab.crossplane.io/v1alpha1"
