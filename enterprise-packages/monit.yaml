package:
  name: monit
  version: 5.35.2
  epoch: 1
  description: Managing and monitoring on a UNIX system
  copyright:
    - license: AGPL-3.0-or-later

environment:
  contents:
    packages:
      - bison
      - build-base
      - flex-dev
      - libtool
      - linux-pam-dev
      - openssl-dev
      - pkgconf-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://bitbucket.org/tildeslash/monit.git
      tag: release-${{package.version}}
      expected-commit: 0245e2d222bc75f572b96d26ca1e0bd07cb6dd33

  - runs: |
      autoreconf -fi -I m4 -I config

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-config
    description: default monit config file
    pipeline:
      - runs: |
          # The monit source ships a default monitrc but 'make install' does not
          # install it. Alpine and Fedora both install it in their packaging step.
          # Reference: https://gitlab.alpinelinux.org/alpine/aports/-/blob/master/main/monit/APKBUILD
          # Reference: https://src.fedoraproject.org/rpms/monit/blob/rawhide/f/monit.spec
          install -Dm600 monitrc "${{targets.subpkgdir}}"/etc/monitrc
          sed -i 's|^#  include /etc/monit.d/\*|include /etc/monit.d/*|' "${{targets.subpkgdir}}"/etc/monitrc
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            files: |
              /etc/monitrc

  - name: ${{package.name}}-dev
    description: dev library for ${{package.name}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/docs

test:
  environment:
    environment:
      MONIT_PORT: "2812"
    contents:
      packages:
        - ${{package.name}}-config
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: monit
    - uses: test/tw/help-check
      with:
        bins: monit
    - runs: |
        set -euo pipefail
        # Validate the shipped config syntax
        monit -t
    - runs: |
        set -euo pipefail
        # Create a test config that extends the default via /etc/monit.d/
        mkdir -p /etc/monit.d
        echo "test content" > /tmp/monit_test_file
        cat > /etc/monit.d/test.conf <<'MONITEOF'
        set daemon 10
        set httpd port 2812 and
            use address localhost
            allow localhost

        check system localhost
            if loadavg (1min) > 4 then alert

        check file test_file with path /tmp/monit_test_file
            if does not exist then alert

        check filesystem rootfs with path /
            if space usage > 90% then alert

        check directory test_dir with path /tmp
            if does not exist then alert
        MONITEOF
                monit -t
    - uses: test/daemon-check-output
      with:
        start: monit -I
        timeout: 30
        expected_output: |
          Starting Monit
          started
        post: |-
          set -o pipefail

          # Wait for HTTP interface to be ready
          wait-for-it -t 30 localhost:${MONIT_PORT}

          # Test that all configured services are being monitored
          monit status | grep -F "localhost"
          monit status | grep -F "test_file"
          monit status | grep -F "rootfs"
          monit status | grep -F "test_dir"
          monit summary

          netstat -ln | grep -F ":${MONIT_PORT}"

          monit unmonitor test_file

update:
  enabled: true
  version-transform:
    - match: "-"
      replace: "."
  git:
    strip-prefix: release-
    tag-filter-prefix: release-
