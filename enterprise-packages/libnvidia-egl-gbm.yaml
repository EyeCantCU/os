package:
  name: libnvidia-egl-gbm
  version: 1.1.3
  epoch: 0
  description: NVIDIA EGL External Platform library for GBM
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - eglexternalplatform
      - libdrm-dev
      - mesa
      - mesa-dev
      - meson

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/egl-gbm
      tag: ${{package.version}}
      expected-commit: a73cbcec5e3911ea6b075df63f6f4e559392926c

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: NVIDIA/egl-gbm
    use-tag: true
