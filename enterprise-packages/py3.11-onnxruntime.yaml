package:
  name: py3.11-onnxruntime
  version: "1.24.2"
  epoch: 0
  description: Cross-platform, high performance ML inferencing and training accelerator
  resources:
    cpu: 20
    memory: 50Gi
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py${{vars.python-version}}-coloredlogs
      - py${{vars.python-version}}-flatbuffers
      - py${{vars.python-version}}-numpy-2.2
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-protobuf
      - py${{vars.python-version}}-sympy

vars:
  pypi-package: onnxruntime

environment:
  contents:
    packages:
      - bash
      - cmake-3
      - eigen-dev
      - patch
      - protobuf-dev
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-numpy-2.2
      - python-${{vars.python-version}}
      - zlib-dev
  environment:
    # This seems to be required to compile `abseil`
    # FIXME: remove this eventually
    CXXFLAGS: "-fdelete-null-pointer-checks"

var-transforms:
  - from: ${{package.name}}
    match: 'py(\d+\.\d+)-.*'
    replace: '$1'
    to: python-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/microsoft/onnxruntime.git
      tag: v${{package.version}}
      expected-commit: 058787ceead760166e3c50a0a4cba8a833a6f53f
      recurse-submodules: true

  # NOTE: this sets some 'magic' apparently, otherwise we would use the 'cmake/build' pipeline.
  # review in future upstream releases
  - name: "build using upstream wrapper script"
    runs: |
      ./build.sh --build --update --config Release --build_shared_lib --parallel --compile_no_warning_as_error \
        --skip_submodule_sync --allow_running_as_root --skip_tests --enable_pybind --build_wheel \
        --cmake_extra_defines \
          CMAKE_POLICY_VERSION_MINIMUM=3.5 \
          CMAKE_INSTALL_PREFIX=/usr \
          onnxruntime_ENABLE_PYTHON=ON \
          onnxruntime_BUILD_SHARED_LIB=ON \
          onnxruntime_BUILD_UNIT_TESTS=OFF \
          BUILD_TESTING=OFF \
          onnxruntime_ENABLE_TRAINING=ON \
          onnxruntime_ENABLE_LAZY_TENSOR=OFF \
          onnxruntime_USE_MPI=ON \
          onnxruntime_USE_DNNL=OFF \
          onnxruntime_USE_PREINSTALLED_EIGEN=ON \
          CMAKE_CXX_STANDARD=17 \
          Python_EXECUTABLE=/usr/bin/python${{vars.python-version}}

  - name: Fix Python build
    runs: |
      # Manually fix https://github.com/microsoft/onnxruntime/issues/24570
      mkdir onnxruntime/capi
      python setup.py --help # We have to call it like this once to generate the file we need.
      cp -r build/Linux/Release/onnxruntime/* onnxruntime

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: microsoft/onnxruntime
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
        - py${{vars.python-version}}-pip
        - py${{vars.python-version}}-${{vars.pypi-package}}
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/pip-check
      with:
        python: python${{vars.python-version}}
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.pypi-package}}
    - runs: |
        python3 <<'EOF' | grep -F -e "${{package.version}}" -e "CPU"
        import onnxruntime
        print(onnxruntime.version)
        print(onnxruntime.get_device())
        EOF
