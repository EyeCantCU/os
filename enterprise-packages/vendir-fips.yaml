package:
  name: vendir-fips
  version: "0.45.1"
  epoch: 1 # CVE-2025-61729
  description: Easy way to vendor portions of git repos, github releases, helm charts, docker image contents, etc. declaratively
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f7d4c1368b4bf9c975382db2b7db785922a2b241
      repository: https://github.com/carvel-dev/vendir
      tag: v${{package.version}}

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/vendir
      output: vendir
      ldflags: -X carvel.dev/vendir/pkg/vendir/version.Version=v${{package.version}}

update:
  enabled: true
  github:
    identifier: carvel-dev/vendir
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: vendir
    - uses: test/tw/help-check
      with:
        bins: vendir
    - name: version check
      runs: |
        set -euo pipefail
        # Verify version is correctly embedded in binary (fails if not found)
        vendir version | grep -F "${{package.version}}"
    - uses: git-checkout
      with:
        expected-commit: f7d4c1368b4bf9c975382db2b7db785922a2b241
        repository: https://github.com/carvel-dev/vendir
        tag: v${{package.version}}
    - name: run sync
      runs: |
        set -euo pipefail
        cd examples/inline
        vendir sync
