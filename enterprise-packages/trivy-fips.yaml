package:
  name: trivy-fips
  version: "0.69.0"
  epoch: 0 # go/enterprise-rsc/trivy-fips
  description: Simple and comprehensive vulnerability scanner for containers
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "9"
    memory: 18Gi

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8fb9191a07f5d92cb6088a8637b1001a2a7ad604
      repository: https://github.com/aquasecurity/trivy
      tag: v${{package.version}}

  - uses: go/build
    with:
      experiments: jsonv2
      go-package: go-fips
      packages: ./cmd/trivy
      output: trivy
      ldflags: -X github.com/aquasecurity/trivy/pkg/version/app.ver=${{package.version}}

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: trivy
    - uses: test/tw/ver-check
      with:
        bins: trivy
    - name: Check trivy version as JSON
      runs: |
        trivy version -f json | jq -M
        [ "$(trivy version -f json 2>/dev/null | jq -r .Version)" == "${{package.version}}" ]

update:
  enabled: true
  github:
    identifier: aquasecurity/trivy
    strip-prefix: v
