package:
  name: perl-ffi-checklib
  version: "0.31"
  epoch: 0
  description: Check that a library is available for FFI
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl-file-which

environment:
  contents:
    packages:
      - perl-file-which
      - perl-test2-suite

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PL/PLICEASE/FFI-CheckLib-${{package.version}}.tar.gz
      expected-sha256: 04d885fc377d44896e5ea1c4ec310f979bb04f2f18658a7e7a4d509f7e80bb80

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 2832

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Smoke test
      runs: |
        set -euo pipefail
        perl -e 'use FFI::CheckLib; print "FFI::CheckLib loaded successfully\n"'
