package:
  name: ko-fips
  version: "0.18.1"
  epoch: 1 # GHSA-whqx-f9j3-ch6m
  description: Simple, fast container image builder for Go applications.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # for fips config & fips-provider
      - openssl-config-fipshardened
      # either melange SCA should provide these
      # or we should make go-fips shared link on these
      - so:libcrypto.so.3
      - so:libssl.so.3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ko-build/ko
      tag: v${{package.version}}
      expected-commit: 7f1ced62a0c8db30fc2267155f664b38bfbde492
      destination: ko

  - uses: go/bump
    with:
      deps: |-
        github.com/sigstore/cosign/v2@v2.6.2
      modroot: ko

  - uses: go/build
    with:
      packages: .
      output: ko
      modroot: ko
      ldflags: -X github.com/google/ko/pkg/commands.Version=${{package.version}}
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: ko-build/ko
    strip-prefix: v

test:
  pipeline:
    - runs: |
        ko version
        ko --help
    - uses: test/go-fips-check
