package:
  name: kaniko-chainguard-baselayout
  # Update this when chainguard-baselayout is updated.
  version: 20230214
  epoch: 1 # go/enterprise-rsc/kaniko-chainguard-baselayout
  description: Chainguard-baselayout with a minimum filesystem for Kaniko
  copyright:
    - license: MIT
  dependencies:
    replaces:
      - wolfi-baselayout
      - chainguard-baselayout
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      for i in etc etc/secfixes.d; do
        mkdir -p "${{targets.destdir}}"/${i}
      done
      for i in etc/nsswitch.conf etc/os-release etc/secfixes.d/wolfi etc/secfixes.d/chainguard; do
        install -m644 vendor/${i} "${{targets.destdir}}"/${i}
      done

test:
  environment:
    contents:
      packages:
        - bash
        - coreutils
  pipeline:
    - name: "Scanner expectations"
      runs: |
        # This tells scanners which feed to look at.
        grep 'ID=chainguard' /etc/os-release

        # This tells most scanners which of a vendor's feeds to look at,
        # but as a rolling distro we should never be changing this, so
        # instead of using ${{package.version}} we hardcode this here
        # because only the epoch should really ever change.
        grep 'VERSION_ID="20230214"' /etc/os-release

update:
  enabled: false
  exclude-reason: |
    This package is a base package and does not need to be updated automatically
