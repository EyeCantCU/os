package:
  name: volume-modifier-for-k8s-fips
  version: "0.9.3"
  epoch: 0 # CVE-2025-61732
  description: volume-modifier-for-k8s is a sidecar deployed alongside CSI drivers to enable volume modification through annotations on the PVC.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/awslabs/volume-modifier-for-k8s
      tag: v${{package.version}}
      expected-commit: ea7962fe9df99ff7cdc220861c0025199613d155

  # TODO: Add support for plugins
  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd
      output: volume-modifier-for-k8s
      ldflags: "-X main.version=${{package.version}}"
      modroot: .

  - uses: strip

update:
  enabled: true
  github:
    identifier: awslabs/volume-modifier-for-k8s
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: volume-modifier-for-k8s
    - uses: test/tw/help-check
      with:
        bins: volume-modifier-for-k8s
