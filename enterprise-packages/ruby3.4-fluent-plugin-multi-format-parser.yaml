package:
  name: ruby3.4-fluent-plugin-multi-format-parser
  version: 1.1.0
  epoch: 0
  description: Multi format parser for Fluentd
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ruby3.4-fluentd
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - ruby-3.4
      - ruby-3.4-dev

vars:
  gem: fluent-plugin-multi-format-parser

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5e65da57cef94a423ca8b23abd21020c98fc3e83
      repository: https://github.com/repeatedly/fluent-plugin-multi-format-parser
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

test:
  environment:
    contents:
      packages:
        - ruby3.4-fluentd
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: fluent/plugin/parser_multi_format
    - runs: |
        ruby -e "require 'fluent/plugin/parser_multi_format'"
    - name: Validate plugin loads in fluentd
      runs: |
        set -euo pipefail
        tee /tmp/test.conf <<'EOF'
        <source>
          @type tail
          path /dev/null
          tag test
          <parse>
            @type multi_format
            <pattern>
              format json
            </pattern>
          </parse>
        </source>

        <match **>
          @type null
        </match>
        EOF
        fluentd --dry-run -c /tmp/test.conf

update:
  enabled: true
  github:
    identifier: repeatedly/fluent-plugin-multi-format-parser
    strip-prefix: v
    use-tag: true
