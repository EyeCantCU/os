package:
  name: terraform-fips-1.11
  version: "1.11.4"
  epoch: 13 # go/enterprise-rsc/terraform-fips-1.11
  copyright:
    - license: BUSL-1.1
  dependencies:
    provides:
      - terraform-fips=${{package.full-version}}
  resources:
    cpu: "10"
    memory: 14Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/terraform
      tag: v${{package.version}}
      expected-commit: 35645b8fca68ff7e0b8785a3b563724a529a0caf

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/kubernetes

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/gcs

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/azure

  # go >=1.24 removed the tlskyber option and added tlsmlkem
  # Since they are disabled anyway, apply the same disabling to the new flag
  # so that we can build terraform with latest go
  # Reference: https://github.com/golang/go/issues/72111
  - name: "Replace tlksyber with tlsmlkem"
    runs: |
      sed -i 's/godebug tlskyber=0/godebug tlsmlkem=0/' go.mod

  - uses: go/bump
    with:
      deps: |-
        github.com/cloudflare/circl@v1.6.1
        github.com/hashicorp/go-getter@v1.7.9
        github.com/ulikunitz/xz@v0.5.14
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: .
      go-package: go-fips-md5
      output: terraform
      ldflags: -X github.com/hashicorp/terraform/version.dev="no"

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for terraform
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/terraform "${{targets.subpkgdir}}"/usr/local/bin
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: terraform
        - uses: test/tw/help-check
          with:
            bins: terraform
        - name: Verify symlink at /usr/local/bin works
          runs: |
            set -euo pipefail
            # Verify symlink exists
            stat /usr/local/bin/terraform
            # Verify symlink is executable
            test -x /usr/local/bin/terraform || { echo "FAIL: symlink not executable"; exit 1; }
            # Verify symlink points to /usr/bin/terraform (fails test if not)
            readlink /usr/local/bin/terraform | grep -F "/usr/bin/terraform"

  - name: ${{package.name}}-local-provider-config
    description: Configure Terraform to use local providers
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/terraform/provider-mirror
          cat > "${{targets.subpkgdir}}"/terraform/.terraformrc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "/terraform/provider-mirror"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - name: Verify config file structure
          runs: |
            set -euo pipefail
            # Verify config file contains expected filesystem_mirror setting (fails test if missing)
            grep -F "filesystem_mirror" /terraform/.terraformrc

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.11

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: terraform
    - uses: test/tw/help-check
      with:
        bins: terraform
    - name: Terraform Initialization
      runs: |
        set -euo pipefail
        echo "provider \"local\" {}" > example.tf
        terraform init -input=false
    - name: Terraform Plan Creation
      runs: |
        set -euo pipefail
        terraform plan -input=false -out=tfplan
    - name: Terraform Apply Execution
      runs: |-
        set -euo pipefail
        terraform apply -input=false tfplan
