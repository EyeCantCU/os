package:
  name: lensfun
  version: 0.3.4
  epoch: 1 # go/enterprise-rsc/lensfun
  description: Image manipulation library to rectify lens defects
  copyright:
    - license: LGPL-3.0-or-later
  resources:
    cpu: "1"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - doxygen
      - glib-dev
      - libpng-dev
      - py3-docutils
      - py3-setuptools
      - python3
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/lensfun/lensfun
      tag: v${{package.version}}
      expected-commit: 101c745e847a5de4a1e569a94368ce2027198598

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DBUILD_DOC=OFF \
        -DBUILD_LENSTOOL=ON \
        -DBUILD_TESTS=OFF

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-tools
    description: lensfun extra tools
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/lensfun-* "${{targets.contextdir}}"/usr/bin/
          mv "${{targets.destdir}}"/usr/bin/g-lensfun-update-data "${{targets.contextdir}}"/usr/bin/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: py3-${{package.name}}
    description: lensfun Python bindings
    dependencies:
      runtime:
        - python3
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/python3* "${{targets.contextdir}}"/usr/lib/
    test:
      pipeline:
        - uses: python/import
          with:
            import: lensfun

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify lensfun library
      runs: |
        set -euo pipefail
        # Check that the library is present
        stat /usr/lib/liblensfun.so*
        echo "lensfun library test passed"

update:
  enabled: true
  github:
    identifier: lensfun/lensfun
    strip-prefix: v
