package:
  name: audit-rules
  version: "4.1.2"
  epoch: 4
  description: Comprehensive audit rules for Linux auditing subsystem supporting OSPP, PCI-DSS, and STIG compliance
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - audit

environment:
  contents:
    packages:
      - busybox
      - coreutils
      - m4

pipeline:
  - runs: |
      mkdir -p "${{targets.destdir}}/etc/audit/rules.d"

      # Copy static rules files
      cp ./*.rules "${{targets.destdir}}/etc/audit/rules.d/"

      # Process M4 templates for architecture-specific syscall rules
      for f in ./*.rules.m4; do
        m4 -DARCH=${{build.arch}} audit-macros.m4 "$f" \
          | cat -s > "${{targets.destdir}}/etc/audit/rules.d/$(basename "${f%.m4}")"
      done

      cp auditd.conf "${{targets.destdir}}/etc/audit/"

      # Set appropriate permissions
      chmod 640 "${{targets.destdir}}/etc/audit/auditd.conf"
      chmod 640 "${{targets.destdir}}/etc/audit/rules.d/"*.rules
      chmod 750 "${{targets.destdir}}/etc/audit/rules.d"

update:
  enabled: false
  exclude-reason: |
    This is the upstream for this package

test:
  pipeline:
    - uses: test/tw/contains-files
      with:
        files: /etc/audit/auditd.conf
