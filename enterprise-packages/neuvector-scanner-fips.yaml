package:
  name: neuvector-scanner-fips
  version: "4.080"
  epoch: 0 # go/enterprise-rsc/neuvector-scanner-fips
  description: NeuVector vulnerability scanner for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates
      - neuvector-db
      - neuvector-scanner-monitor
      - neuvector-scanner-task-fips
      - neuvector-sigstore-interface-fips
      - openssl-config-fipshardened
  resources:
    cpu: "3"
    memory: 8Gi

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neuvector/scanner
      tag: v${{package.version}}
      expected-commit: 70e3d32a380b5d8db7d33b7428bb7cb19f309044

  - uses: go/build
    with:
      modroot: .
      packages: .
      output: scanner
      prefix: usr/local
      vendor: true
      go-package: go-fips

  # Empty file that tells NV that the scanner is running in a container
  - runs: touch ${{targets.contextdir}}/usr/local/bin/.nvcontainer

  - uses: strip

subpackages:
  - name: neuvector-scanner-task-fips
    description: NeuVector Scanner Task
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: .
          output: scannerTask
          prefix: usr/local
          vendor: true
          go-package: go-fips
      - uses: strip
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/help-check
          with:
            bins: scannerTask

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: scanner

update:
  enabled: true
  git:
    tag-filter-prefix: v
    strip-prefix: v
