package:
  name: neuvector-scanner-fips
  version: "4.052"
  epoch: 0 # GHSA-cgrx-mc8f-2prm
  description: NeuVector vulnerability scanner for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates
      - neuvector-db
      - neuvector-scanner-monitor
      - neuvector-scanner-task-fips
      - neuvector-sigstore-interface-fips
      - openssl-config-fipshardened

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neuvector/scanner
      tag: v${{package.version}}
      expected-commit: a3b152b4463a87bcffc1111f0fad1f9d7b41f134

  - uses: go/build
    with:
      modroot: .
      packages: .
      output: scanner
      prefix: usr/local
      vendor: true
      go-package: go-fips

  # Empty file that tells NV that the scanner is running in a container
  - runs: touch ${{targets.contextdir}}/usr/local/bin/.nvcontainer

  - uses: strip

subpackages:
  - name: neuvector-scanner-task-fips
    description: NeuVector Scanner Task
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: .
          output: scannerTask
          prefix: usr/local
          vendor: true
          go-package: go-fips
      - uses: strip
    test:
      pipeline:
        - uses: test/go-fips-check
        - runs: |
            if scannerTask --help 2>&1 | grep -q "usage: scan [OPTIONS]"; then
              exit 0
            fi

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        if scanner --help 2>&1 | grep -q "usage: scan [OPTIONS]"; then
          exit 0
        fi

update:
  enabled: true
  git:
    tag-filter-prefix: v
    strip-prefix: v
