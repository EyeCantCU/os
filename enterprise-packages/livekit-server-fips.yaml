package:
  name: livekit-server-fips
  version: "1.9.11"
  epoch: 5 # GHSA-9f3f-wv7r-qc8r
  description: End-to-end realtime stack for connecting humans and AI
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/livekit/livekit
      tag: v${{package.version}}
      expected-commit: 0508ee9f9ce71b497e65bbe66037cd2a2090ce5e

  - uses: go/bump
    with:
      deps: |-
        github.com/pion/dtls/v3@v3.1.1

  - uses: go/build
    with:
      go-package: go-fips-md5
      packages: ./cmd/server
      output: livekit-server
      ldflags: |
        -X github.com/livekit/livekit/version.Version=${{package.version}}

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binary in the location expected by upstream Dockerfile"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}
          ln -sf /usr/bin/livekit-server ${{targets.contextdir}}/livekit-server
    test:
      pipeline:
        - name: "Test compat symlink"
          runs: |
            test -L /livekit-server
            test "$(readlink /livekit-server)" = "/usr/bin/livekit-server"

update:
  enabled: true
  github:
    identifier: livekit/livekit
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
        - livekit-cli
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: livekit-server
    - uses: test/tw/help-check
      with:
        bins: livekit-server
    - name: "Command tests"
      runs: |
        set -euo pipefail
        # Verify generate-keys subcommand help (fails test if missing)
        livekit-server generate-keys --help | grep -F "generates an API key and secret pair"
        # Verify ports subcommand help (fails test if missing)
        livekit-server ports --help | grep -F "print ports that server is configured to use"
        # Verify list-nodes subcommand help (fails test if missing)
        livekit-server list-nodes --help | grep -F "list all nodes"
    - name: "Server startup test with CLI integration"
      uses: test/daemon-check-output
      with:
        # Use --dev for package testing: provides placeholder API keys and basic config
        # Production uses full config with real API keys, TLS certs, and production settings
        start: livekit-server --dev
        timeout: 30
        expected_output: |
          starting in development mode
          starting LiveKit server
          starting relay signal server
        post: |-
          set -euo pipefail
          wait-for-it localhost:7880 -t 15
          curl -fsSL http://localhost:7880 | grep -F "OK"

          # token creation
          lk token create \
            --api-key devkey \
            --api-secret secret \
            --join \
            --room test-room \
            --identity test-user \
            --valid-for 15m | grep -F "Access token:"

          # project setup
          lk project add test-local \
            --url ws://localhost:7880 \
            --api-key devkey \
            --api-secret secret \
            --default | grep -F "Saved CLI config to"

          # Verify project creation
          lk project list | grep -F "test-local"
