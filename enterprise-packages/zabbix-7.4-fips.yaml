package:
  name: zabbix-7.4-fips
  version: "7.4.6"
  epoch: 0
  description: FIPS-enabled Zabbix monitoring system - server and proxy components
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - openssl-config-fipshardened

vars:
  postgres-version: "17"
  # Common configure options shared between server and proxy builds
  common-opts: |
    --enable-ipv6 \
    --with-openssl \
    --with-net-snmp \
    --with-openipmi \
    --with-ssh \
    --with-ldap \
    --with-libcurl \
    --with-unixodbc \
    --with-libpcre2 \
    --with-libxml2=/usr \
    --with-ares \
    --with-libmodbus \
    --with-libevent \
    --sysconfdir=/etc/zabbix

environment:
  contents:
    packages:
      - build-base
      - busybox
      - c-ares-dev
      - curl-dev
      - libevent-dev
      - libmodbus-dev
      - libssh-dev
      - libtool
      - libxml2-dev
      - linux-headers
      - net-snmp-dev
      - openipmi-dev
      - openldap-dev
      - openssl-dev
      - pcre2-dev
      - postgresql-${{vars.postgres-version}}-dev
      - sqlite-dev
      - unixodbc-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/zabbix/zabbix
      tag: ${{package.version}}
      expected-commit: 626d2b8a4820a424efe8fd39df3b706468f1e5d4

  # Generate configure script from configure.ac
  - runs: ./bootstrap.sh

  # =============================================================
  # Phase 1: Build server with PostgreSQL and generate all schemas
  # =============================================================
  - uses: autoconf/configure
    with:
      opts: |
        --enable-server \
        --with-postgresql \
        ${{vars.common-opts}}

  # Generate database schema files for all backends (postgresql, sqlite3, etc.)
  - runs: make -j$(nproc) dbschema

  - uses: autoconf/make

  - runs: |
      # Save server binary and generated schemas to /tmp (preserved across make clean)
      cp src/zabbix_server/zabbix_server /tmp/zabbix_server
      cp -r database/postgresql /tmp/postgresql_schema
      cp -r database/sqlite3 /tmp/sqlite3_schema

      make clean

  # =============================================================
  # Phase 2: Build proxy with SQLite3
  # =============================================================
  - uses: autoconf/configure
    with:
      opts: |
        --enable-proxy \
        --with-sqlite3 \
        ${{vars.common-opts}}

  - uses: autoconf/make

  - runs: |
      # Restore server binary and schema files to source tree
      cp /tmp/zabbix_server src/zabbix_server/zabbix_server
      cp -r /tmp/postgresql_schema/* database/postgresql/
      cp -r /tmp/sqlite3_schema/* database/sqlite3/

  # =============================================================
  # Create shared runtime directories (used by both server and proxy)
  # =============================================================
  - runs: |
      mkdir -p "${{targets.destdir}}/etc/zabbix"
      mkdir -p "${{targets.destdir}}/var/lib/zabbix/enc"
      mkdir -p "${{targets.destdir}}/var/lib/zabbix/mibs"
      mkdir -p "${{targets.destdir}}/var/lib/zabbix/modules"
      mkdir -p "${{targets.destdir}}/var/lib/zabbix/snmptraps"
      mkdir -p "${{targets.destdir}}/var/lib/zabbix/ssh_keys"
      mkdir -p "${{targets.destdir}}/var/lib/zabbix/ssl/certs"
      mkdir -p "${{targets.destdir}}/var/lib/zabbix/ssl/keys"
      mkdir -p "${{targets.destdir}}/var/lib/zabbix/ssl/ssl_ca"
      mkdir -p "${{targets.destdir}}/usr/lib/zabbix/externalscripts"

subpackages:
  - name: zabbix-server-pgsql-7.4-fips
    description: FIPS-enabled Zabbix Server with PostgreSQL database - central monitoring server for distributed monitoring
    dependencies:
      provides:
        - zabbix-server-pgsql-fips=${{package.full-version}}
      runtime:
        - fping
        - iputils
        - net-snmp-agent-libs
        - nmap
        - postgresql-${{vars.postgres-version}}-client
        - tzdata
        - zabbix-7.4-fips
    pipeline:
      - runs: |
          # Install the server binary
          install -Dm755 src/zabbix_server/zabbix_server "${{targets.contextdir}}/usr/bin/zabbix_server"

          # Create server-specific directories
          mkdir -p "${{targets.contextdir}}/etc/zabbix"
          mkdir -p "${{targets.contextdir}}/usr/lib/zabbix/alertscripts"
          mkdir -p "${{targets.contextdir}}/var/lib/zabbix/dbscripts"
          mkdir -p "${{targets.contextdir}}/var/lib/zabbix/enc_internal"
          mkdir -p "${{targets.contextdir}}/var/lib/zabbix/export"

          # Install default configuration template
          install -Dm644 conf/zabbix_server.conf "${{targets.contextdir}}/etc/zabbix/zabbix_server.conf"

          # Install PostgreSQL database schema files
          mkdir -p "${{targets.contextdir}}/usr/share/zabbix/database/postgresql"
          install -Dm644 database/postgresql/schema.sql "${{targets.contextdir}}/usr/share/zabbix/database/postgresql/schema.sql"
          install -Dm644 database/postgresql/images.sql "${{targets.contextdir}}/usr/share/zabbix/database/postgresql/images.sql"
          install -Dm644 database/postgresql/data.sql "${{targets.contextdir}}/usr/share/zabbix/database/postgresql/data.sql"
    test:
      environment:
        contents:
          packages:
            - bash
            - netcat-openbsd
            - openssl-fips-test
            - postgresql-${{vars.postgres-version}}
            - postgresql-${{vars.postgres-version}}-client
            - procps
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/ver-check
          with:
            bins: zabbix_server
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: zabbix_server
        - name: Check FIPS OpenSSL
          runs: |
            openssl-fips-test
        - name: Verify no non-FIPS crypto libraries
          runs: |
            set -euo pipefail
            # Verify the binary does NOT link against non-FIPS crypto libraries
            # These libraries are not CMVP certified and would break FIPS compliance
            if ldd /usr/bin/zabbix_server | grep -E "(libsodium|libgcrypt|libgnutls)"; then
              echo "ERROR: zabbix_server should not link to non-FIPS crypto libraries"
              exit 1
            fi
            echo "Verified: no non-FIPS crypto libraries linked"
        - name: Test version and feature output
          runs: |
            set -euo pipefail
            # Verify server reports correct version
            zabbix_server -V 2>&1 | grep -F "zabbix_server (Zabbix) ${{package.version}}"
        - name: Test configuration validation
          runs: |
            set -euo pipefail
            # Create minimal valid config for testing
            tee /etc/zabbix/zabbix_server.conf << 'EOF'
            DBHost=localhost
            DBName=zabbix
            DBUser=zabbix
            LogType=console
            EOF
            # Validate configuration syntax using -T flag (returns 0 on valid config)
            zabbix_server -c /etc/zabbix/zabbix_server.conf -T
        - name: Verify PostgreSQL schema files
          runs: |
            set -euo pipefail
            # Verify PostgreSQL schema files are installed
            stat /usr/share/zabbix/database/postgresql/schema.sql
            stat /usr/share/zabbix/database/postgresql/images.sql
            stat /usr/share/zabbix/database/postgresql/data.sql
            # Verify schema files have content
            test -s /usr/share/zabbix/database/postgresql/schema.sql || { echo "ERROR: schema.sql is empty"; exit 1; }
            test -s /usr/share/zabbix/database/postgresql/data.sql || { echo "ERROR: data.sql is empty"; exit 1; }
            echo "PostgreSQL schema files verified"
        - name: Test PostgreSQL database initialization
          runs: |
            set -euo pipefail
            # Create postgres user and group for testing (if not exists)
            if ! getent group postgres >/dev/null 2>&1; then
              addgroup -S postgres
            fi
            if ! getent passwd postgres >/dev/null 2>&1; then
              adduser -S -D -H -h /var/lib/postgresql -s /bin/sh -G postgres postgres
            fi

            # Initialize PostgreSQL database for testing
            mkdir -p /var/lib/postgresql/data
            mkdir -p /run/postgresql
            chown -R postgres:postgres /var/lib/postgresql /run/postgresql

            # Initialize database cluster
            su postgres -c "initdb -D /var/lib/postgresql/data"

            # Start PostgreSQL
            su postgres -c "pg_ctl -D /var/lib/postgresql/data -l /var/lib/postgresql/logfile start"

            # Wait for PostgreSQL to be ready
            for i in $(seq 1 30); do
              if su postgres -c "pg_isready" >/dev/null 2>&1; then
                echo "PostgreSQL is ready"
                break
              fi
              sleep 1
            done

            # Create zabbix database and user
            su postgres -c "psql -c \"CREATE USER zabbix WITH PASSWORD 'zabbix';\""
            su postgres -c "psql -c \"CREATE DATABASE zabbix OWNER zabbix;\""

            # Import schema (this validates the SQL files are correct)
            su postgres -c "psql -d zabbix -f /usr/share/zabbix/database/postgresql/schema.sql"
            su postgres -c "psql -d zabbix -f /usr/share/zabbix/database/postgresql/images.sql"
            su postgres -c "psql -d zabbix -f /usr/share/zabbix/database/postgresql/data.sql"

            # Verify tables were created
            table_count=$(su postgres -c "psql -d zabbix -t -c \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = 'public';\"" | tr -d ' ')
            echo "Database created with $table_count tables"
            test "$table_count" -gt 100 || { echo "ERROR: Expected >100 tables, got $table_count"; exit 1; }

            # Stop PostgreSQL
            su postgres -c "pg_ctl -D /var/lib/postgresql/data stop"
            echo "PostgreSQL database initialization test passed"
        - name: Test server process types configuration
          runs: |
            set -euo pipefail
            # Test configuration with various server process types (multi-process architecture)
            tee /tmp/server_processes.conf << 'EOF'
            DBHost=localhost
            DBName=zabbix
            DBUser=zabbix
            LogType=console
            StartPollers=5
            StartPollersUnreachable=1
            StartTrappers=5
            StartPingers=1
            StartDiscoverers=1
            StartHTTPPollers=1
            StartTimers=1
            StartEscalators=1
            StartAlerters=3
            EOF
            zabbix_server -c /tmp/server_processes.conf -T
            echo "Server process types configuration validated"
        - name: Test alerting configuration
          runs: |
            set -euo pipefail
            # Test configuration with alerting settings (alert management feature)
            tee /tmp/alerting.conf << 'EOF'
            DBHost=localhost
            DBName=zabbix
            DBUser=zabbix
            LogType=console
            AlertScriptsPath=/usr/lib/zabbix/alertscripts
            StartAlerters=5
            EOF
            zabbix_server -c /tmp/alerting.conf -T
            # Verify alertscripts directory exists
            stat /usr/lib/zabbix/alertscripts
            echo "Alerting configuration validated"

  - name: zabbix-server-pgsql-7.4-fips-compat
    description: Compatibility package for FIPS-enabled Zabbix Server PostgreSQL Docker image
    dependencies:
      provides:
        - zabbix-server-pgsql-fips-compat=${{package.full-version}}
      runtime:
        - bash
        - busybox
        - gzip
        - merged-usrsbin # docker-entrypoint.sh expects /usr/sbin/zabbix_server
        - net-snmp-tools
        - zabbix-server-pgsql-7.4-fips
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/zabbix/zabbix-docker
          tag: ${{package.version}}
          destination: zabbix-docker
      - runs: |
          # Install docker-entrypoint.sh from upstream zabbix-docker repository
          install -Dm755 zabbix-docker/Dockerfiles/server-pgsql/alpine/docker-entrypoint.sh \
            "${{targets.contextdir}}/usr/bin/docker-entrypoint.sh"

          # Install config files from upstream zabbix-docker repository
          # These config files use ${ZBX_*} environment variable references which
          # zabbix_server natively expands at runtime. The entrypoint exports these
          # variables (e.g., ZBX_DB_HOST) and the config files reference them.
          mkdir -p "${{targets.contextdir}}/etc/zabbix"
          for conf in zabbix-docker/config_templates/server/*.conf; do
            install -Dm644 "$conf" "${{targets.contextdir}}/etc/zabbix/$(basename "$conf")"
          done

          # Create combined schema file at expected location for docker-entrypoint.sh
          # The upstream entrypoint expects /usr/share/doc/zabbix-server-postgresql/create.sql.gz
          mkdir -p "${{targets.contextdir}}/usr/share/doc/zabbix-server-postgresql"

          # Concatenate schema files in correct order and compress
          cat database/postgresql/schema.sql \
              database/postgresql/images.sql \
              database/postgresql/data.sql | gzip -9 > \
              "${{targets.contextdir}}/usr/share/doc/zabbix-server-postgresql/create.sql.gz"
    test:
      pipeline:
        - runs: |
            set -euo pipefail
            # Verify docker-entrypoint.sh exists and is executable
            stat /usr/bin/docker-entrypoint.sh
            test -x /usr/bin/docker-entrypoint.sh || { echo "ERROR: /usr/bin/docker-entrypoint.sh is not executable"; exit 1; }
            # Verify /usr/sbin/zabbix_server works via merged-usrsbin symlink
            /usr/sbin/zabbix_server --help
            # Verify combined schema file exists and is valid gzip
            stat /usr/share/doc/zabbix-server-postgresql/create.sql.gz
            zcat /usr/share/doc/zabbix-server-postgresql/create.sql.gz > /dev/null

  - name: zabbix-proxy-sqlite3-7.4-fips
    description: FIPS-enabled Zabbix Proxy with SQLite3 database - distributed monitoring proxy
    dependencies:
      provides:
        - zabbix-proxy-sqlite3-fips=${{package.full-version}}
      runtime:
        - fping
        - iputils
        - net-snmp-agent-libs
        - nmap
        - sqlite-libs
        - tzdata
        - zabbix-7.4-fips
    pipeline:
      - runs: |
          # Install the proxy binary
          install -Dm755 src/zabbix_proxy/zabbix_proxy "${{targets.contextdir}}/usr/bin/zabbix_proxy"

          # Create proxy-specific directories
          mkdir -p "${{targets.contextdir}}/etc/zabbix"
          mkdir -p "${{targets.contextdir}}/var/lib/zabbix/db_data"
          mkdir -p "${{targets.contextdir}}/var/lib/zabbix/enc_internal"

          # Install default configuration template
          install -Dm644 conf/zabbix_proxy.conf "${{targets.contextdir}}/etc/zabbix/zabbix_proxy.conf"

          # Install SQLite3 database schema file
          mkdir -p "${{targets.contextdir}}/usr/share/zabbix/database/sqlite3"
          install -Dm644 database/sqlite3/schema.sql "${{targets.contextdir}}/usr/share/zabbix/database/sqlite3/schema.sql"
    test:
      environment:
        contents:
          packages:
            - bash
            - openssl-fips-test
            - procps
            - sqlite
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/ver-check
          with:
            bins: zabbix_proxy
            version: ${{package.version}}
        - uses: test/tw/help-check
          with:
            bins: zabbix_proxy
        - name: Check FIPS OpenSSL
          runs: |
            openssl-fips-test
        - name: Verify no non-FIPS crypto libraries
          runs: |
            set -euo pipefail
            # Verify the binary does NOT link against non-FIPS crypto libraries
            # These libraries are not CMVP certified and would break FIPS compliance
            if ldd /usr/bin/zabbix_proxy | grep -E "(libsodium|libgcrypt|libgnutls)"; then
              echo "ERROR: zabbix_proxy should not link to non-FIPS crypto libraries"
              exit 1
            fi
            echo "Verified: no non-FIPS crypto libraries linked"
        - name: Test configuration validation
          runs: |
            set -euo pipefail
            # Create minimal valid config for testing
            tee /etc/zabbix/zabbix_proxy.conf << 'EOF'
            Server=127.0.0.1
            Hostname=test-proxy
            DBName=/var/lib/zabbix/zabbix_proxy.db
            LogType=console
            EOF
            # Validate configuration syntax using -T flag (returns 0 on valid config)
            zabbix_proxy -c /etc/zabbix/zabbix_proxy.conf -T
        - name: Verify SQLite3 schema file
          runs: |
            set -euo pipefail
            # Verify SQLite3 schema file is installed
            stat /usr/share/zabbix/database/sqlite3/schema.sql
            # Verify schema file has content
            test -s /usr/share/zabbix/database/sqlite3/schema.sql || { echo "ERROR: schema.sql is empty"; exit 1; }
        - name: Test SQLite3 database initialization
          runs: |
            set -euo pipefail
            # Create test database directory
            mkdir -p /var/lib/zabbix

            # Initialize SQLite database with schema
            sqlite3 /var/lib/zabbix/test_proxy.db < /usr/share/zabbix/database/sqlite3/schema.sql

            # Verify tables were created
            table_count=$(sqlite3 /var/lib/zabbix/test_proxy.db "SELECT COUNT(*) FROM sqlite_master WHERE type='table';")
            echo "Database created with $table_count tables"
            test "$table_count" -gt 50 || { echo "ERROR: Expected >50 tables, got $table_count"; exit 1; }

            # Clean up
            rm -f /var/lib/zabbix/test_proxy.db
            echo "SQLite3 database initialization test passed"
        - name: Test proxy process types configuration
          runs: |
            set -euo pipefail
            # Test configuration with various proxy process types
            tee /tmp/proxy_processes.conf << 'EOF'
            Server=127.0.0.1
            Hostname=test-proxy
            DBName=/var/lib/zabbix/zabbix_proxy.db
            LogType=console
            StartPollers=5
            StartPollersUnreachable=1
            StartTrappers=5
            StartPingers=1
            StartDiscoverers=1
            StartHTTPPollers=1
            EOF
            zabbix_proxy -c /tmp/proxy_processes.conf -T
            echo "Proxy process types configuration validated"

  - name: zabbix-proxy-sqlite3-7.4-fips-compat
    description: Compatibility package for FIPS-enabled Zabbix Proxy SQLite3 Docker image
    dependencies:
      provides:
        - zabbix-proxy-sqlite3-fips-compat=${{package.full-version}}
      runtime:
        - bash
        - busybox
        - gzip
        - merged-usrsbin
        - net-snmp-tools
        - zabbix-proxy-sqlite3-7.4-fips
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/zabbix/zabbix-docker
          tag: ${{package.version}}
          destination: zabbix-docker
      - runs: |
          # Install docker-entrypoint.sh from upstream zabbix-docker repository
          install -Dm755 zabbix-docker/Dockerfiles/proxy-sqlite3/alpine/docker-entrypoint.sh \
            "${{targets.contextdir}}/usr/bin/docker-entrypoint.sh"

          # Install config files from upstream zabbix-docker repository
          # These config files use ${ZBX_*} environment variable references which
          # zabbix_proxy natively expands at runtime. The entrypoint exports these
          # variables (e.g., ZBX_SERVER_HOST) and the config files reference them.
          mkdir -p "${{targets.contextdir}}/etc/zabbix"
          for conf in zabbix-docker/config_templates/proxy/*.conf; do
            install -Dm644 "$conf" "${{targets.contextdir}}/etc/zabbix/$(basename "$conf")"
          done
    test:
      pipeline:
        - runs: |
            set -euo pipefail
            # Verify docker-entrypoint.sh exists and is executable
            stat /usr/bin/docker-entrypoint.sh
            test -x /usr/bin/docker-entrypoint.sh || { echo "ERROR: /usr/bin/docker-entrypoint.sh is not executable"; exit 1; }
            # Verify directories from zabbix-proxy-sqlite3 package exist
            stat /var/lib/zabbix/db_data
            stat /var/lib/zabbix/enc_internal

update:
  enabled: true
  github:
    identifier: zabbix/zabbix
    use-tag: true
    tag-filter-prefix: "7.4."

test:
  pipeline:
    - uses: test/tw/emptypackage
