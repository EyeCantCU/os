package:
  name: node-feature-discovery-fips-0.18
  version: "0.18.3"
  epoch: 8 # GHSA-9h8m-3fm2-qjrq
  description: Node feature discovery for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - node-feature-discovery-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/node-feature-discovery
      tag: v${{package.version}}
      expected-commit: f39ef6267b20ddeb79e717940b71bb98979c49a0

  - uses: go/bump
    with:
      deps: |-
        github.com/opencontainers/runc@v1.3.3
        golang.org/x/crypto@v0.45.0
        k8s.io/kubernetes@v1.34.2
        go.opentelemetry.io/otel/sdk@v1.40.0

  - name: copy conf
    runs: |
      mkdir -p ${{targets.contextdir}}/etc/kubernetes/node-feature-discovery/
      cp ./deployment/components/worker-config/nfd-worker.conf.example ${{targets.contextdir}}/etc/kubernetes/node-feature-discovery/nfd-worker.conf

subpackages:
  - name: ${{package.name}}-kubectl-nfd
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/kubectl-nfd
          output: kubectl-nfd
          ldflags: |
            -X sigs.k8s.io/node-feature-discovery/pkg/version.version=${{package.version}}
            -X sigs.k8s.io/node-feature-discovery/pkg/utils/hostpath.pathPrefix=/host-
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/help-check
          with:
            bins: kubectl-nfd

  - name: ${{package.name}}-gc
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/nfd-gc
          output: nfd-gc
          ldflags: |
            -X sigs.k8s.io/node-feature-discovery/pkg/version.version=${{package.version}}
            -X sigs.k8s.io/node-feature-discovery/pkg/utils/hostpath.pathPrefix=/host-
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/ver-check
          with:
            bins: nfd-gc
        - uses: test/tw/help-check
          with:
            bins: nfd-gc

  - name: ${{package.name}}-master
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/nfd-master
          output: nfd-master
          ldflags: |
            -X sigs.k8s.io/node-feature-discovery/pkg/version.version=${{package.version}}
            -X sigs.k8s.io/node-feature-discovery/pkg/utils/hostpath.pathPrefix=/host-
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/ver-check
          with:
            bins: nfd-master
        - uses: test/tw/help-check
          with:
            bins: nfd-master

  - name: ${{package.name}}-topology-updater
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/nfd-topology-updater
          output: nfd-topology-updater
          ldflags: |
            -X sigs.k8s.io/node-feature-discovery/pkg/version.version=${{package.version}}
            -X sigs.k8s.io/node-feature-discovery/pkg/utils/hostpath.pathPrefix=/host-
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/ver-check
          with:
            bins: nfd-topology-updater
        - uses: test/tw/help-check
          with:
            bins: nfd-topology-updater

  - name: ${{package.name}}-worker
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/nfd-worker
          output: nfd-worker
          ldflags: |
            -X sigs.k8s.io/node-feature-discovery/pkg/version.version=${{package.version}}
            -X sigs.k8s.io/node-feature-discovery/pkg/utils/hostpath.pathPrefix=/host-
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/ver-check
          with:
            bins: nfd-worker
        - uses: test/tw/help-check
          with:
            bins: nfd-worker

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/node-feature-discovery
    strip-prefix: v
    use-tag: true
    tag-filter: v0.18.

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-master
        - ${{package.name}}-worker
        - ${{package.name}}-gc
        - ${{package.name}}-topology-updater
        - ${{package.name}}-kubectl-nfd
  pipeline:
    - uses: test/kwok/cluster
    - name: "Test nfd-master startup"
      uses: test/daemon-check-output
      with:
        setup: |
          # Create minimal config file
          mkdir -p /etc/kubernetes/node-feature-discovery
          cat > /etc/kubernetes/node-feature-discovery/nfd-master.conf <<EOF
          {
            "noPublish": true,
            "instance": "test",
            "enableLeaderElection": false,
            "nfdApiParallelism": 1,
            "resyncPeriod": "1s",
            "inClusterConfig": true,
            "verifyServiceAccount": false
          }
          EOF

          # Create minimal service account directory
          mkdir -p /var/run/secrets/kubernetes.io/serviceaccount/
          echo "fake-token" > /var/run/secrets/kubernetes.io/serviceaccount/token
          echo "fake-ca" > /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          echo "default" > /var/run/secrets/kubernetes.io/serviceaccount/namespace
        start: env KUBERNETES_SERVICE_HOST=localhost KUBERNETES_SERVICE_PORT=8080 nfd-master --config=/etc/kubernetes/node-feature-discovery/nfd-master.conf
        timeout: 30
        expected_output: |
          Node Feature Discovery Master
          configuration file parsed
          configuration successfully updated
          starting the nfd api controller
        error_strings: |
          panic
          fatal
          FATAL
        post: |
          # Verify clean shutdown
          ps aux | grep nfd-master | grep -v grep || true
    - name: Validation test
      runs: |-
        test -f /etc/kubernetes/node-feature-discovery/nfd-worker.conf || (echo "Config file missing"; exit 1)
