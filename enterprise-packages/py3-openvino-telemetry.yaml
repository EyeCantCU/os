#nolint:valid-pipeline-git-checkout-tag
package:
  name: py3-openvino-telemetry
  version: "0_git20260116"
  epoch: 0
  description: Simple cross-platform colored terminal text
  copyright:
    - license: MIT

vars:
  pypi-package: openvino-telemetry

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openvinotoolkit/telemetry
      branch: master
      expected-commit: 58f0c8204cdb556588f846bdf1bd2c38405af97a

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: move usr/bin executables for -bin
        runs: |
          mkdir -p ./cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./cleanup/${{range.key}}/
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - python-${{range.key}}
            - py${{range.key}}-pip
            - py${{range.key}}-${{vars.pypi-package}}
      pipeline:
        - runs: |
            pip freeze | grep -F -e "${{vars.pypi-package}}" -e "${{package.version}}"
        - uses: python/import
          with:
            python: python${{range.key}}
            import: openvino_telemetry

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - runs: |
            opt_in_out --help | grep -F -e "usage: opt_in_out"
            {
              opt_in_out --opt_in --opt_out || true
            } | grep -F -e 'Specify either "--opt_in" or "--opt_out" command line parameter.'
            opt_in_out --opt_in | grep -F -e "You have successfully opted in to send the telemetry data."
            opt_in_out --opt_out | grep -F -e "You have successfully opted out to send the telemetry data."

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: openvino_telemetry
        - uses: python/import
          with:
            python: python3.11
            import: openvino_telemetry
        - uses: python/import
          with:
            python: python3.12
            import: openvino_telemetry
        - uses: python/import
          with:
            python: python3.13
            import: openvino_telemetry

update:
  enabled: true
  git: {}
  schedule:
    period: daily
    reason: Upstream does not maintain tags or releases

test:
  pipeline:
    - uses: test/tw/byproductpackage
