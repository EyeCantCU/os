package:
  name: ltp
  version: "20260130"
  epoch: 2
  description: "The Linux Test Project"
  copyright:
    - license: GPL-2.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bison
      - build-base
      - flex
      - git
      - m4
      - make
      - pkgconf
      - pkgconf-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/linux-test-project/ltp
      tag: ${{package.version}}
      expected-commit: 6a60ae592cd375f004df0694efc7d50ddae9aa5e
      cherry-picks: |
        master/767b3e519e85095dfee3a47d15a373a403fe3dab: openat2: define _GNU_SOURCE and include <fcntl.h>

  - runs: |
      make autotools
      ./configure
      make -j $(nproc)
      make install DESTDIR="${{targets.destdir}}"

  - uses: strip

update:
  enabled: true
  github:
    identifier: linux-test-project/ltp
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/opt/ltp/testcases/data/ldd01/"
    - runs: |
        [ -x "/opt/ltp/runltp" ] || echo "ERROR: runltp not installed properly" 2>&1
