package:
  name: rancher-webhook-fips-0.5
  version: "0.5.10"
  epoch: 0
  description: Rancher webhook for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-webhook-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 62c16d807c8481d236030494049696eb112229ad
      repository: https://github.com/rancher/webhook
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      output: webhook
      packages: .
      go-package: go-fips

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v0.5.

test:
  pipeline:
    - uses: test/go-fips-check
    - name: "start daemon"
      uses: test/daemon-check-output
      with:
        start: "webhook"
        timeout: 15
        expected_output: |
          starting
          Waiting for server to become available
