package:
  name: rancher-webhook-fips-0.5
  version: "0.5.12"
  epoch: 2 # GHSA-j5w8-q4qc-rx2x
  description: Rancher webhook for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-webhook-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 92a5350df20af50b7117c1d6a9240c34e947cd9c
      repository: https://github.com/rancher/webhook
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - runs: |
      # Bump all k8s.io x.30.1 replace lines to x.30.9 for CVE remediation
      sed -i 's,\(=> k8s.io.*.30.\)1,\19,' go.mod
      go mod tidy

  - uses: go/build
    with:
      modroot: .
      output: webhook
      packages: .
      go-package: go-fips

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v0.5.

test:
  pipeline:
    - uses: test/go-fips-check
    - name: "start daemon"
      uses: test/daemon-check-output
      with:
        start: "webhook"
        timeout: 15
        expected_output: |
          starting
          Waiting for server to become available
