package:
  name: chart-apache-flink-kubernetes-operator
  version: "1.14.0"
  epoch: 0
  description: A Helm chart for the Apache Flink Kubernetes Operator
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/flink-kubernetes-operator
      tag: release-${{package.version}}
      expected-commit: f50413820c3fcd948bf404c604294e6677264618

  - uses: charts/package
    with:
      chart-path: helm/flink-kubernetes-operator
      images: |
        flink-kubernetes-operator:
          values:
            image:
              repository: ${registry_repo}
              tag: ${tag}
              digest: ${digest}
      test: |
        cases:
          - name: default
            images: [flink-kubernetes-operator]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: apache/flink-kubernetes-operator
    strip-prefix: release-
    use-tag: true
    tag-filter-prefix: release-
