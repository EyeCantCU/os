package:
  name: reposilite
  version: "3.5.27"
  epoch: 0 # Bump netty to 4.1.130.Final
  description: Lightweight and easy-to-use repository management software dedicated for Maven artifacts
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-default-jdk

environment:
  contents:
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - gradle
      - libstdc++
      - openjdk-21
  environment:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dzikoysk/reposilite
      tag: ${{package.version}}
      expected-commit: 7d425c80eaf06313368fb32b8c67b72274d667c8

  - uses: patch
    with:
      patches: bump-deps-CVE.patch

  - name: Build shadowJar with Gradle
    runs: |
      ./gradlew :reposilite-backend:shadowJar --no-daemon --stacktrace

  - name: Install application
    runs: |
      # Create installation directories
      mkdir -p ${{targets.contextdir}}/usr/share/java/reposilite

      install -Dm644 reposilite-backend/build/libs/reposilite-${{package.version}}.jar ${{targets.contextdir}}/usr/share/java/reposilite/reposilite.jar

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility package with upstream Docker image
    dependencies:
      runtime:
        - busybox
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/app/data
          mkdir -p ${{targets.contextdir}}/var/log/reposilite

          ln -sf /usr/share/java/reposilite/reposilite.jar ${{targets.contextdir}}/app/reposilite.jar

          cp entrypoint.sh ${{targets.contextdir}}/app/entrypoint.sh
    test:
      pipeline:
        - runs: |
            readlink -v /app/reposilite.jar

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - name: Test basic functionality
      uses: test/daemon-check-output
      with:
        timeout: 60
        start: |
          java -jar /usr/share/java/reposilite/reposilite.jar "--token" "root:root-secret"
        expected_output: |
          Reposilite ${{package.version}} Status
        post: |
          curl -fsS -u root:root-secret http://localhost:8080/api/status/instance | grep "${{package.version}}"

update:
  enabled: true
  ignore-regex-patterns:
    - 3\.[0-9]+\.[0-9]+-next
  github:
    identifier: dzikoysk/reposilite
    use-tag: true
    tag-filter: "3."
