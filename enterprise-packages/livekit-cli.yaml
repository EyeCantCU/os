package:
  name: livekit-cli
  version: "2.6.3"
  epoch: 0
  description: Command line interface to LiveKit
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/livekit/livekit-cli
      tag: v${{package.version}}
      expected-commit: 60e0b9ddbcda0a2ae0bca1eaef923e1effb9d3de

  - uses: go/build
    with:
      packages: ./cmd/lk
      output: lk

update:
  enabled: true
  github:
    identifier: livekit/livekit-cli
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - name: "Binary checks"
      runs: |
        lk --version | grep "${{package.version}}"
        lk --help
    - name: "cli commands check"
      runs: |
        lk token --help
        lk room --help
        lk project --help
    - name: "Token generation"
      runs: |
        # token creation
        lk token create \
          --api-key API123456789 \
          --api-secret secret123456789 \
          --join \
          --room test-room \
          --identity test-user \
          --valid-for 10m
