package:
  name: livekit-cli
  version: "2.13.1"
  epoch: 1 # CVE-2025-61726
  description: Command line interface to LiveKit
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/livekit/livekit-cli
      tag: v${{package.version}}
      expected-commit: 573d1688a47614710ec98ef95ad8ca1127401eca

  - uses: go/bump
    with:
      deps: |-
        github.com/containerd/containerd/v2@v2.1.5
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: ./cmd/lk
      output: lk

update:
  enabled: true
  github:
    identifier: livekit/livekit-cli
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - name: "Binary checks"
      runs: |
        lk --version | grep "${{package.version}}"
        lk --help
    - name: "cli commands check"
      runs: |
        lk token --help
        lk room --help
        lk project --help
    - name: "Token generation"
      runs: |
        # token creation
        lk token create \
          --api-key API123456789 \
          --api-secret secret123456789 \
          --join \
          --room test-room \
          --identity test-user \
          --valid-for 10m
