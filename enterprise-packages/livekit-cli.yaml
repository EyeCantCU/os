package:
  name: livekit-cli
  version: "2.15.0"
  epoch: 0 # GHSA-9h8m-3fm2-qjrq
  description: Command line interface to LiveKit
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/livekit/livekit-cli
      tag: v${{package.version}}
      expected-commit: ad5c8dcedca4ca5a810bf1e2fa933b024e8b14b3

  - uses: go/bump
    with:
      deps: |-
        github.com/go-git/go-git/v5@v5.16.5
        github.com/cloudflare/circl@v1.6.3

  - uses: go/build
    with:
      packages: ./cmd/lk
      output: lk

update:
  enabled: true
  github:
    identifier: livekit/livekit-cli
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - name: "Binary checks"
      runs: |
        lk --version | grep "${{package.version}}"
        lk --help
    - name: "cli commands check"
      runs: |
        lk token --help
        lk room --help
        lk project --help
    - name: "Token generation"
      runs: |
        # token creation
        lk token create \
          --api-key API123456789 \
          --api-secret secret123456789 \
          --join \
          --room test-room \
          --identity test-user \
          --valid-for 10m
