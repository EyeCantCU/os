package:
  name: chart-ingress-nginx-ingress-nginx
  version: "4.14.1"
  epoch: 0
  description: Ingress controller for Kubernetes using NGINX as a reverse proxy and load balancer
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - helm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/ingress-nginx
      tag: helm-chart-${{package.version}}
      expected-commit: e832d044efc57ccae15e93ea26a169f64238bf6b

  - uses: charts/package
    with:
      chart-path: charts/ingress-nginx
      images: |
        controller:
          values:
            global:
              image:
                registry: ${registry}
            controller:
              image:
                image: ${repo}
                tag: ${tag}
                digest: ${digest}
        kube-webhook-certgen:
          values:
            global:
              image:
                registry: ${registry}
            controller:
              admissionWebhooks:
                patch:
                  image:
                    image: ${repo}
                    tag: ${tag}
                    digest: ${digest}
        defaultBackend:
          values:
            global:
              image:
                registry: ${registry}
            defaultBackend:
              image:
                image: ${repo}
                tag: ${tag}
      test: |
        cases:
          - name: default
            images: [controller, kube-webhook-certgen]
          - name: with-default-backend
            images: [controller, kube-webhook-certgen, defaultBackend]
            values:
              defaultBackend:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: kubernetes/ingress-nginx
    strip-prefix: helm-chart-
    use-tag: true
    tag-filter-prefix: helm-chart-
