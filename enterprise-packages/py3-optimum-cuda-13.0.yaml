package:
  name: py3-optimum-cuda-13.0
  version: "2.1.0"
  epoch: 1
  description: "Optimum is an extension of Transformers, Diffusers, TIMM and Sentence-Transformers, providing a set of optimization tools and enabling maximum efficiency to train and run models on targeted hardware, while keeping things easy to use."
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: optimum
  import: optimum

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: "$1"
    to: cuda-version

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/huggingface/optimum
      tag: v${{package.version}}
      expected-commit: 8cfe543cbd7192e0de3004b856bf93fe570d300c

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-huggingface-hub<1.0 # We need huggingface-hub<1.0 for transformers
        - py${{range.key}}-numpy-2.2
        # apko currently can not resolve dependencies for tritonserver-backend-tensorrtllm-cuda-*
        # without pinning transformers to the same version stream it uses.
        - py${{range.key}}-transformers-4.56
        - py${{range.key}}-torch-cuda-${{vars.cuda-version}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            optimum-cli --help

  - name: py3-supported-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.11-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.12-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.13-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: huggingface/optimum
    strip-prefix: v
