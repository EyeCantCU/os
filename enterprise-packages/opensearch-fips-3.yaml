# This melange yaml is complex.  The context is opensearch releases the main package and many plugins, some in the same repo
# and some in different repos.  They all share the same version number so rather than having a separate melange yaml for each
# package, we package them all in one build so they can be released together.  For plugins to run they need to be built with the
# same version they are installed into.
package:
  name: opensearch-fips-3
  version: "3.5.0"
  epoch: 1
  description: Open source distributed and RESTful search engine.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash # some helper scripts use bash
      - busybox # some helper scripts use busybox
      - openjdk-21-jre
      - openjdk-bcfips-policy-140-3-j21 # use our jars - opensearch has/may ship with new versions without cmvp cert

vars:
  # OpenSearch 3.x requires JDK 21. Bump when upstream OpenSearch changes its minimum JDK requirement.
  # ref: https://github.com/opensearch-project/OpenSearch/blob/3.5.0/buildSrc/src/main/resources/minimumRuntimeVersion
  java-version: "21"
  plugin_version_qualifier: "0"

var-transforms:
  # External plugins typically only release for major.minor versions (x.y.0)
  # Extract major.minor from package version (e.g., "3.3.1" -> "3.3.*") using * as a wildcard
  # This is used to find the latest matching tag if upstream releases multiple patch versions
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: $1.[0-9]*
    to: plugin_version
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+$
    replace: "$1"
    to: major-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake-3
      - curl
      - gcc-14
      - gcc-14-default
      - gfortran
      - git
      - gradle-8
      - libgomp
      - liblapack
      - liblapacke
      - openblas
      - openblas-dev
      - openjdk-21-default-jdk
      - patch
      - unzip
      - zlib-dev
  environment:
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk
    LANG: "en_US.UTF-8"

data:
  - name: internal-plugins
    items:
      # plugin_name: cve patch list
      analysis-icu: ""
      analysis-kuromoji: ""
      analysis-nori: ""
      analysis-phonetic: ""
      analysis-smartcn: ""
      analysis-stempel: ""
      analysis-ukrainian: ""
      crypto-kms: ""
      discovery-azure-classic: ""
      discovery-ec2: ""
      discovery-gce: ""
      ingest-attachment: ""
      mapper-annotated-text: ""
      mapper-murmur3: ""
      mapper-size: ""
      repository-azure: ""
      repository-gcs: ""
      repository-s3: ""
      store-smb: ""
      telemetry-otel: ""

  - name: external-plugins
    items:
      # plugin_name: cve patch list
      alerting: ""
      anomaly-detection: ""
      asynchronous-search: ""
      cross-cluster-replication: ""
      custom-codecs: ""
      geospatial: ""
      index-management: ""
      job-scheduler: ""
      k-nn: ""
      ml-commons: ""
      neural-search: ""
      notifications: ""
      observability: ""
      performance-analyzer: ""
      reporting: ""
      security: ""
      security-analytics: ""
      sql: ""

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/opensearch-project/OpenSearch
      tag: ${{package.version}}
      expected-commit: bbc94f0bdc3a759011e6529ecfe52840856f91a3

  # Drift check: fail early if upstream changes its minimum Java version
  - runs: |
      grep -qFx "${{vars.java-version}}" buildSrc/src/main/resources/minimumRuntimeVersion || {
        echo "ERROR: upstream Java version changed, update vars.java-version and openjdk dependencies"
        exit 1
      }

  # opensearch-env script hard codes its own internal classpath
  # patch it to also include the system provided bcfips jars
  - uses: patch
    with:
      patches: opensearch-env.patch

  - runs: |
      echo "org.gradle.daemon=false" >> gradle.properties
      ./gradlew --no-daemon localDistro --parallel -Dbuild.snapshot=false -Dbuild.version_qualifier= -Pcrypto.standard=FIPS-140-3 2>&1 | tee /tmp/gradle-main.log

      # Verify FIPS mode was used during build
      grep -F 'Crypto Standard       : FIPS-140-3' /tmp/gradle-main.log

      mkdir -p ${{targets.destdir}}/usr/share/opensearch/logs

      install -dm777 ${{targets.destdir}}/usr/share/opensearch/
      mv build/distribution/local/opensearch-${{package.version}}/agent/ ${{targets.destdir}}/usr/share/opensearch
      mv build/distribution/local/opensearch-${{package.version}}/bin/ ${{targets.destdir}}/usr/share/opensearch
      mv build/distribution/local/opensearch-${{package.version}}/lib/ ${{targets.destdir}}/usr/share/opensearch
      mv build/distribution/local/opensearch-${{package.version}}/config/ ${{targets.destdir}}/usr/share/opensearch
      mv build/distribution/local/opensearch-${{package.version}}/modules/ ${{targets.destdir}}/usr/share/opensearch
      mv build/distribution/local/opensearch-${{package.version}}/plugins/ ${{targets.destdir}}/usr/share/opensearch

      mv ./distribution/docker/src/docker/config/opensearch.yml ./distribution/docker/src/docker/config/log4j2.properties ${{targets.destdir}}/usr/share/opensearch/config

  - runs: |
      # Use system BCFIPS jars (with jent entropy) instead of bundled ones to avoid SecureRandom bootstrap loop
      rm -f ${{targets.destdir}}/usr/share/opensearch/config/fips_java.security
      find ${{targets.destdir}}/usr/share/opensearch/lib -name 'bc*.jar' -delete
      # Also remove from tools directories
      find ${{targets.destdir}}/usr/share/opensearch/lib/tools -name 'bc*.jar' -delete

      # Add FIPS JVM options to use system BCFIPS
      tee -a ${{targets.destdir}}/usr/share/opensearch/config/jvm.options << 'EOF'

      # FIPS configuration - use system BCFIPS jars
      -Djavax.net.ssl.trustStoreType=BCFKS
      -Djavax.net.ssl.trustStoreProvider=BCFIPS
      --module-path=/usr/share/java/bouncycastle-fips/
      EOF

  - runs: |
      # Use a modified entrypoint script as the official one duplicates env vars and system properties used by the JVM on startup
      # This means we avoid errors like: ERROR: setting [discovery.seed_hosts] already set, saw [opensearch-cluster-master-headless] and [opensearch-cluster-master-headless]
      #
      # Opensearch operator requires opensearch-docker-entrypoint.sh in /usr/share/opensearch but historically we had it in bin, so also make a symlink to avoid breaking things.
      mv opensearch-docker-entrypoint.sh  ${{targets.destdir}}/usr/share/opensearch/
      ln -s /usr/share/opensearch/opensearch-docker-entrypoint.sh ${{targets.destdir}}/usr/share/opensearch/bin/opensearch-docker-entrypoint.sh

  - runs: |
      # Set permissions to read/write the config dir
      chmod -R 755 ${{targets.destdir}}/usr/share/opensearch/

      mkdir -p ${{targets.destdir}}/usr/bin
      for i in ${{targets.destdir}}/usr/share/opensearch/bin/*; do
        name=$(basename $i)
        ln -sf /usr/share/opensearch/bin/$name ${{targets.destdir}}/usr/bin/$name
      done

      chmod -R 644 ${{targets.destdir}}/usr/share/opensearch/config/opensearch.yml

      # Manually set this to docker: https://github.com/opensearch-project/OpenSearch/blob/5f8193021215cd6979fde66474ec8d74d32ac91a/distribution/docker/src/docker/Dockerfile#LL49C90-L49C129
      sed -i -e 's/OPENSEARCH_DISTRIBUTION_TYPE=tar/OPENSEARCH_DISTRIBUTION_TYPE=docker/'  ${{targets.destdir}}/usr/share/opensearch/bin/opensearch-env

  - runs: |
      cd plugins
      ../gradlew --no-daemon assemble -Dbuild.snapshot=false -Dbuild.version_qualifier= --stacktrace -Pcrypto.standard=FIPS-140-3 2>&1 | tee /tmp/gradle-plugins.log

      # Verify FIPS mode was used during build
      grep -F 'Crypto Standard       : FIPS-140-3' /tmp/gradle-main.log

      # useful for finding generated zip file we use to extract into the final apk
      find . -name "*.zip"

  - runs: |
      # Remove files so they don't conflict with subpackages
      echo "Removing files that conflict with subpackages"
      rm -rf /home/build/settings.gradle

  - uses: strip

subpackages:
  - range: internal-plugins
    name: ${{package.name}}-${{range.key}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/opensearch/plugins/opensearch-${{range.key}}
          unzip "./plugins/${{range.key}}/build/distributions/${{range.key}}-${{package.version}}.zip" -d "${{targets.contextdir}}/usr/share/opensearch/plugins/opensearch-${{range.key}}"
          # Remove bundled bc-fips jars - use system BCFIPS via module-path instead
          find "${{targets.contextdir}}/usr/share/opensearch/plugins/opensearch-${{range.key}}" -name 'bc*.jar' -delete

  - range: external-plugins
    name: ${{package.name}}-${{range.key}}
    pipeline:
      # Delete other plugins. Opensearch can only build one at a time, otherwise we run into conflicting dependencies version issues with yarn.
      - runs: |
          rm -r plugins/* || true

          # Clone the repository and find the latest matching tag
          git clone --quiet --origin=origin https://github.com/opensearch-project/${{range.key}}.git ./plugins/${{range.key}}
          cd ./plugins/${{range.key}}

          # Get the latest tag matching the pattern (e.g., major.minor.*.0)
          LATEST_TAG=$(git tag -l "${{vars.plugin_version}}.${{vars.plugin_version_qualifier}}" | sort -V | tail -n1)

          if [ -z "$LATEST_TAG" ]; then
            echo "ERROR: No matching tag found for pattern ${{vars.plugin_version}}.${{vars.plugin_version_qualifier}}"
            exit 1
          fi

          echo "Using plugin tag: $LATEST_TAG"
          git checkout --quiet "$LATEST_TAG"
      - runs: |
          cd ./plugins/${{range.key}}

          # apply any CVE patches
          if [ -n "${{range.value}}" ]; then
              patch -p1 < "../../${{range.value}}"
          fi

          # notifications source live in a subfolder
          if [ "${{range.key}}" = "notifications" ]; then
            cd ./notifications
          fi

          # skip check task, using -x doesn't append to an existing list
          # job scheduler requires a test cluster to connect to so skip verification checks
          if [ "${{range.key}}" = "job-scheduler" ]; then
            sed -i '/startParameter.excludedTaskNames=\[/ s/]/, "check"]/g' settings.gradle
          fi

          # sql plugin: use system bc-fips via module-path instead of bundling
          # change implementation to compileOnly so bc-fips is not packaged in the plugin jar
          # the implementation option leads to shading and jar hell
          if [ "${{range.key}}" = "sql" ]; then
            sed -i 's/implementation "org.bouncycastle:bc-fips/compileOnly "org.bouncycastle:bc-fips/' datasources/build.gradle
          fi

          # Ensure there's a newline at the end of the file, so we don't append
          # to the last line
          echo >> gradle.properties
          echo "org.gradle.daemon=false" >> gradle.properties

          # k-nn plugin requires special handling for building JNI native libraries
          if [ "${{range.key}}" = "k-nn" ]; then
            # Disable static BLAS linking and use OpenBLAS
            sed -i 's/set(BLA_STATIC ON)/set(BLA_VENDOR OpenBLAS)\nset(BLA_STATIC OFF)/' ./jni/cmake/init-faiss.cmake

            # Set NMSLIB_SIMD_FLAGS based on architecture
            if [ "${{build.arch}}" = "x86_64" ]; then
              NMSLIB_SIMD_FLAGS="x86-64"
            else
              NMSLIB_SIMD_FLAGS="armv8-a"
            fi

            # Build the Java plugin first
            ./gradlew build \
              --no-daemon \
              --refresh-dependencies \
              -Dbuild.snapshot=false \
              -Dbuild.version_qualifier= \
              -Dopensearch.version=${{package.version}} \
              -Dbuild.lib.commit_patches=false \
              -Dnmslib_simd_flags=$NMSLIB_SIMD_FLAGS \
              -x check \
              -x integTest \
              -x test \
              -x javadoc \
              -PfailOnJavadocWarning=false \
              --stacktrace \
              -Pcrypto.standard=FIPS-140-3 2>&1 | tee /tmp/gradle-knn.log

            # Verify FIPS mode was used during build
            grep -F 'Crypto Standard       : FIPS-140-3' /tmp/gradle-knn.log

            # Build Faiss base library (without AVX)
            ./gradlew :buildJniLib -Pknn_libs=opensearchknn_faiss -Davx512.enabled=false -Davx512_spr.enabled=false -Davx2.enabled=false -Dbuild.lib.commit_patches=false -Dnproc.count=4 --stacktrace -Pcrypto.standard=FIPS-140-3 2>&1 | tee /tmp/gradle-Faiss.log

            # Verify FIPS mode was used during build
            grep -F 'Crypto Standard       : FIPS-140-3' /tmp/gradle-Faiss.log

            # Clear CMake cache before building nmslib
            rm -rf jni/build/CMakeCache.txt jni/build/CMakeFiles

            # Build Nmslib library
            ./gradlew :buildJniLib -Pknn_libs=opensearchknn_nmslib -Dbuild.lib.commit_patches=false -Dbuild.lib.apply_patches=false -Dnproc.count=4 --stacktrace -Pcrypto.standard=FIPS-140-3 2>&1 | tee /tmp/gradle-Nmslib.log

            # Verify FIPS mode was used during build
            grep -F 'Crypto Standard       : FIPS-140-3' /tmp/gradle-Nmslib.log

            # AVX variants only for x86_64
            if [ "${{build.arch}}" = "x86_64" ]; then
              rm -rf jni/build/CMakeCache.txt jni/build/CMakeFiles
              ./gradlew :buildJniLib -Pknn_libs=opensearchknn_faiss -Davx2.enabled=true -Davx512.enabled=false -Davx512_spr.enabled=false -Dbuild.lib.commit_patches=false -Dbuild.lib.apply_patches=false -Dnproc.count=4 --stacktrace -Pcrypto.standard=FIPS-140-3 2>&1 | tee /tmp/gradle-Faiss-AVX2.log

              rm -rf jni/build/CMakeCache.txt jni/build/CMakeFiles
              ./gradlew :buildJniLib -Pknn_libs=opensearchknn_faiss -Davx512.enabled=true -Davx512_spr.enabled=false -Dbuild.lib.commit_patches=false -Dbuild.lib.apply_patches=false -Dnproc.count=4 --stacktrace -Pcrypto.standard=FIPS-140-3 2>&1 | tee -a /tmp/gradle-Faiss-AVX2.log

              rm -rf jni/build/CMakeCache.txt jni/build/CMakeFiles
              ./gradlew :buildJniLib -Pknn_libs=opensearchknn_faiss -Davx512_spr.enabled=true -Dbuild.lib.commit_patches=false -Dbuild.lib.apply_patches=false -Dnproc.count=4 --stacktrace -Pcrypto.standard=FIPS-140-3 2>&1 | tee -a /tmp/gradle-Faiss-AVX2.log

              # Verify FIPS mode was used during build
              grep -F 'Crypto Standard       : FIPS-140-3' /tmp/gradle-Faiss-AVX2.log
            fi

          else
            # For other plugins, single gradle run
            ./gradlew clean assemble \
              -Dbuild.snapshot="false" \
              -Dbuild.version_qualifier="" \
              -Dopensearch.version="${{package.version}}" \
              -x check \
              -x integTest \
              -x javadoc \
              -PfailOnJavadocWarning=false \
              --stacktrace \
              -Pcrypto.standard=FIPS-140-3 2>&1 | tee /tmp/gradle-plugin.log

            # Verify FIPS mode was used during plugin build
            grep -F 'Crypto Standard       : FIPS-140-3' /tmp/gradle-plugin.log
          fi

          # useful for finding generated zip file we use to extract into the final apk
          find . -name "*.zip"

          # Extract the value of rootProject.name, this is because the key is not always the same as the plugin name
          # note: not all plugins have a settings.gradle file
          plugin_name=$(grep "^rootProject.name" settings.gradle 2>/dev/null | awk -F" = " '{print $2}' | tr -d "'" | tr -d '"')

          # Check if plugin_name is empty and assign default if it is
          if [ -z "$plugin_name" ]; then
              plugin_name=${{range.key}}
          fi

          echo "Plugin name: $plugin_name"

          # Remove any existing "opensearch-" prefix before adding it to ensure it's not duplicated
          plugin_name=$(echo $plugin_name | sed 's/^opensearch-//')

          # Ensure the plugin_name has the "opensearch-" prefix
          plugin_name="opensearch-$plugin_name"

          echo "Final plugin name: $plugin_name"

          mkdir -p "${{targets.contextdir}}/usr/share/opensearch/plugins"

          # Define the base path for the unzip destination
          destination_base="${{targets.contextdir}}/usr/share/opensearch"

          # Determine the source directory based on the plugin key
          case "${{range.key}}" in
              "alerting")
                  zip_dir="./alerting"
                  ;;
              "k-nn")
                  zip_dir="."
                  ;;
              "ml-commons"|"sql")
                  zip_dir="./plugin"
                  ;;
              "notifications")
                  zip_dir="./notifications"
                  install -Dm644 notifications/src/main/config/notifications.yml "${destination_base}/config/${plugin_name}/notifications.yml"

                  # Special handling for notifications core
                  unzip "./core/build/distributions/${plugin_name}-core-${{vars.plugin_version}}.${{vars.plugin_version_qualifier}}.zip" -d "${destination_base}/plugins/${plugin_name}-core"
                  install -Dm644 core/src/main/config/notifications-core.yml "${destination_base}/config/${plugin_name}-core/notifications-core.yml"
                  ;;
              "observability")
                  zip_dir="."
                  install -Dm644 src/main/config/observability.yml "${destination_base}/config/${plugin_name}/observability.yml"
                  ;;
              "performance-analyzer")
                  zip_dir="."
                  mkdir -p "${destination_base}/config/${plugin_name}/"
                  install -Dm644 config/* "${destination_base}/config/${plugin_name}/"
                  ;;
              "reporting")
                  zip_dir="."
                  install -Dm644 src/main/config/reports-scheduler.yml "${destination_base}/config/${plugin_name}/reports-scheduler.yml"
                  ;;
              "security")
                  zip_dir="."
                  mkdir -p "${destination_base}/config/${plugin_name}/"
                  install -Dm644 config/* "${destination_base}/config/${plugin_name}/"
                  ;;
              *)
                  zip_dir="."
                  ;;
          esac

          # Unzip the main plugin distribution
          unzip "${zip_dir}/build/distributions/${plugin_name}-${{vars.plugin_version}}.${{vars.plugin_version_qualifier}}.zip" -d "${destination_base}/plugins/${plugin_name}"

          # Copy JNI native libraries for k-nn plugin
          if [ "${{range.key}}" = "k-nn" ]; then
            mkdir -p "${destination_base}/plugins/${plugin_name}/lib"
            cp ./jni/build/release/libopensearchknn*.so "${destination_base}/plugins/${plugin_name}/lib/"
            cp /usr/lib/libgomp.so* "${destination_base}/plugins/${plugin_name}/lib/"
          fi

          # Remove bundled bc-fips jars - use system BCFIPS instead
          find "${destination_base}/plugins/${plugin_name}" -name 'bc*.jar' -delete
      - uses: strip
    test:
      pipeline:
        - runs: |
            # Verify k-nn JNI native libraries are present
            if [ "${{range.key}}" = "k-nn" ]; then
              # Common libraries (all architectures)
              stat /usr/share/opensearch/plugins/opensearch-knn/lib/libopensearchknn_common.so
              stat /usr/share/opensearch/plugins/opensearch-knn/lib/libopensearchknn_faiss.so
              stat /usr/share/opensearch/plugins/opensearch-knn/lib/libopensearchknn_nmslib.so
              stat /usr/share/opensearch/plugins/opensearch-knn/lib/libopensearchknn_util.so
              stat /usr/share/opensearch/plugins/opensearch-knn/lib/libgomp.so.1

              # x86_64-specific AVX variant libraries
              if [ "${{build.arch}}" = "x86_64" ]; then
                stat /usr/share/opensearch/plugins/opensearch-knn/lib/libopensearchknn_faiss_avx2.so
                stat /usr/share/opensearch/plugins/opensearch-knn/lib/libopensearchknn_faiss_avx512.so
                stat /usr/share/opensearch/plugins/opensearch-knn/lib/libopensearchknn_faiss_avx512_spr.so
              fi

              echo "All k-nn JNI native libraries verified"
            fi

  - name: ${{package.name}}-iamguarded-compat
    description: "Compatibility package for iamguarded variant of OpenSearch"
    dependencies:
      provides:
        - opensearch-iamguarded-compat=${{package.full-version}}
      runtime:
        - bash
        - curl
        - gzip
        - coreutils
        - glibc-locale-en
        - libgomp
        - libstdc++
        - posix-libc-utils
        - procps
        - yq-fips
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: opensearch
          version: ${{vars.major-version}}
      - runs: |
          # Run postunpack scripts to match upstream Dockerfile (1:1 image fs)
          /opt/iamguarded/scripts/opensearch/postunpack.sh
          /opt/iamguarded/scripts/java/postunpack.sh
          mkdir -p /opt/iamguarded/opensearch
          install -d -m 755 /opt/iamguarded/opensearch
          install -d -m 755 /opt/iamguarded/opensearch/config
          install -d -m 755 /opt/iamguarded/opensearch/config.default
          install -d -m 755 /opt/iamguarded/opensearch/logs
          install -d -m 755 /opt/iamguarded/opensearch/data
          install -d -m 755 /opt/iamguarded/scripts/opensearch
          install -d -m 755 /opt/iamguarded/opensearch/tmp
          install -d -m 775 /docker-entrypoint-initdb.d
          # Create symlink for Java (required by iamguarded scripts)
          ln -sf /usr/lib/jvm/java-${{vars.java-version}}-openjdk /opt/iamguarded/java
          # Create symlinks to the main opensearch installation
          # Remove dirs first — postunpack.sh created them, and ln -sf into an existing dir creates nested symlinks
          for dir in bin lib modules plugins agent; do
            rm -rf /opt/iamguarded/opensearch/${dir}
            ln -sf /usr/share/opensearch/${dir} /opt/iamguarded/opensearch/${dir}
          done
          # Copy config to both config and config.default (entrypoint copies config.default to config at startup)
          cp -r "${{targets.destdir}}/usr/share/opensearch/config/"* /opt/iamguarded/opensearch/config/
          cp -r "${{targets.destdir}}/usr/share/opensearch/config/"* /opt/iamguarded/opensearch/config.default/
          # Remove keystore files copied from main package — OpenSearch creates these at startup
          rm -f /opt/iamguarded/opensearch/config/opensearch.keystore*
          rm -f /opt/iamguarded/opensearch/config.default/opensearch.keystore*
          find /opt/iamguarded/opensearch/config /opt/iamguarded/opensearch/config.default -type d -exec chmod 755 {} +
          find /opt/iamguarded/opensearch/config /opt/iamguarded/opensearch/config.default -type f -exec chmod 644 {} +
          # Symlink security plugin config so it's accessible via OPENSEARCH_PATH_CONF
          ln -sf /usr/share/opensearch/config/opensearch-security /opt/iamguarded/opensearch/config/opensearch-security
          ln -sf /usr/share/opensearch/config/opensearch-security /opt/iamguarded/opensearch/config.default/opensearch-security
          # Volume mount points and init directory expected by iamguarded entrypoint
          install -d -m 755 "${{targets.destdir}}/iamguarded/opensearch/data"
          install -d -m 775 "${{targets.destdir}}/docker-entrypoint-initdb.d"
          ln -sf /opt/iamguarded/scripts/opensearch/entrypoint.sh "${{targets.destdir}}/entrypoint.sh"
          ln -sf /opt/iamguarded/scripts/opensearch/run.sh "${{targets.destdir}}/run.sh"
          chmod -R g+rwX /opt/iamguarded
      - uses: iamguarded/finalize-compat
        with:
          package: opensearch
          version: ${{vars.major-version}}
    test:
      environment:
        accounts:
          groups:
            - groupname: opensearch
              gid: 1000
          users:
            - username: opensearch
              uid: 1000
              gid: 1000
          run-as: 0
        contents:
          packages:
            - ${{package.name}}
            - opensearch-fips-3-security
            - openjdk-${{vars.java-version}}-default-jvm
            - openjdk-bcfips-policy-140-3-j${{vars.java-version}}
            - curl
            - shadow
            - wait-for-it
        environment:
          JAVA_HOME: /usr/lib/jvm/default-jvm
          JAVA_TOOL_OPTIONS: "--module-path=/usr/share/java/bouncycastle-fips/"
          OPENSEARCH_JAVA_OPTS: "--module-path=/usr/share/java/bouncycastle-fips/"
          # FIPS requires 112-bit passwords (14+ chars) for opensearch keystore/truststore
          KEYSTORE_PASSWORD: "MySuperSecureP@ssword123"
          TRUSTSTORE_PASSWORD: "TrustStoreP@ssword123"
          OPENSEARCH_PATH_CONF: "/opt/iamguarded/opensearch/config"
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: opensearch
            version: ${{vars.major-version}}
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true
        - name: "Test iamguarded directory structure"
          uses: test/tw/contains-files
          with:
            files: |
              /opt/iamguarded/opensearch/bin
              /opt/iamguarded/opensearch/lib
              /opt/iamguarded/opensearch/modules
              /opt/iamguarded/opensearch/plugins
              /opt/iamguarded/opensearch/agent
        - name: "Test iamguarded opensearch daemon startup"
          uses: test/daemon-check-output
          with:
            setup: |-
              CONF_DIR="/opt/iamguarded/opensearch/config"
              # Generate BCFKS keystore with self-signed cert for FIPS TLS validation
              keytool -genkeypair \
                -alias opensearch \
                -keyalg RSA \
                -keysize 2048 \
                -validity 365 \
                -dname "CN=localhost,OU=Test,O=OpenSearch,L=Test,ST=Test,C=US" \
                -keystore "${CONF_DIR}/keystore.bcfks" \
                -storetype BCFKS \
                -storepass "${KEYSTORE_PASSWORD}" \
                -providername BCFIPS \
                -provider org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider
              # Export cert in DER for truststore and PEM for curl --cacert
              keytool -exportcert \
                -alias opensearch \
                -keystore "${CONF_DIR}/keystore.bcfks" \
                -storetype BCFKS \
                -storepass "${KEYSTORE_PASSWORD}" \
                -providername BCFIPS \
                -provider org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider \
                -file /tmp/opensearch.crt
              keytool -exportcert \
                -alias opensearch \
                -keystore "${CONF_DIR}/keystore.bcfks" \
                -storetype BCFKS \
                -storepass "${KEYSTORE_PASSWORD}" \
                -providername BCFIPS \
                -provider org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider \
                -rfc -file /tmp/opensearch-ca.pem
              keytool -importcert \
                -alias opensearch \
                -file /tmp/opensearch.crt \
                -keystore "${CONF_DIR}/truststore.bcfks" \
                -storetype BCFKS \
                -storepass "${TRUSTSTORE_PASSWORD}" \
                -noprompt \
                -providername BCFIPS \
                -provider org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider
              # Configure opensearch for single-node FIPS testing
              # node.store.allow_mmap=false bypasses vm.max_map_count kernel check
              tee "${CONF_DIR}/opensearch.yml" <<EOF
              cluster.name: test-cluster
              node.name: test-node
              discovery.type: single-node
              node.store.allow_mmap: false
              network.host: 0.0.0.0
              plugins.security.ssl.transport.enabled: true
              plugins.security.ssl.transport.keystore_type: BCFKS
              plugins.security.ssl.transport.keystore_filepath: keystore.bcfks
              plugins.security.ssl.transport.keystore_password: ${KEYSTORE_PASSWORD}
              plugins.security.ssl.transport.truststore_type: BCFKS
              plugins.security.ssl.transport.truststore_filepath: truststore.bcfks
              plugins.security.ssl.transport.truststore_password: ${TRUSTSTORE_PASSWORD}
              plugins.security.ssl.http.enabled: true
              plugins.security.ssl.http.keystore_type: BCFKS
              plugins.security.ssl.http.keystore_filepath: keystore.bcfks
              plugins.security.ssl.http.keystore_password: ${KEYSTORE_PASSWORD}
              plugins.security.ssl.http.truststore_type: BCFKS
              plugins.security.ssl.http.truststore_filepath: truststore.bcfks
              plugins.security.ssl.http.truststore_password: ${TRUSTSTORE_PASSWORD}
              plugins.security.allow_default_init_securityindex: true
              EOF
              cp "${CONF_DIR}/opensearch.yml" /opt/iamguarded/opensearch/config.default/opensearch.yml
              # Add FIPS keystore/truststore JVM options
              tee -a "${CONF_DIR}/jvm.options" <<EOF
              -Djavax.net.ssl.keyStore=${CONF_DIR}/keystore.bcfks
              -Djavax.net.ssl.keyStorePassword=${KEYSTORE_PASSWORD}
              -Djavax.net.ssl.keyStoreType=BCFKS
              -Djavax.net.ssl.trustStore=${CONF_DIR}/truststore.bcfks
              -Djavax.net.ssl.trustStorePassword=${TRUSTSTORE_PASSWORD}
              EOF
              # Set permissions for opensearch user
              chown -R opensearch:opensearch /iamguarded
              chown -R opensearch:opensearch /opt/iamguarded
              # Create opensearch keystore with FIPS-compliant password (112-bit / 14+ chars)
              printf '%s\n%s\n' "${KEYSTORE_PASSWORD}" "${KEYSTORE_PASSWORD}" | /usr/share/opensearch/bin/opensearch-keystore create -p
              chown opensearch:opensearch "${CONF_DIR}/opensearch.keystore"
            start: /opt/iamguarded/scripts/opensearch/entrypoint.sh /opt/iamguarded/scripts/opensearch/run.sh
            expected_output: |
              Starting Opensearch setup
              Opensearch setup finished!
              Starting Opensearch
              initialized successfully
            timeout: 120
            error_strings: please-dont-match-anything
            post: |-
              set -euo pipefail
              CURL="curl -sfL --retry=3 --cacert /tmp/opensearch-ca.pem -u admin:admin"
              URL="https://localhost:9200"
              wait-for-it localhost:9200 -t 90
              wait-for-it localhost:9300 -t 90
              # Verify cluster health is green over HTTPS
              $CURL --retry 12 --retry-delay 5 --retry-all-errors "${URL}/_cluster/health?pretty" | grep -F '"status" : "green"'
              $CURL -X PUT "${URL}/test-index" -H "Content-Type: application/json" -d '{"settings": {"number_of_shards": 1, "number_of_replicas": 0}}'
              $CURL -X POST "${URL}/test-index/_doc/1" -H "Content-Type: application/json" -d '{"title": "FIPS Test", "content": "OpenSearch running in FIPS-140-3 mode"}'
              $CURL -X POST "${URL}/test-index/_refresh"
              $CURL "${URL}/test-index/_search" | grep -F "FIPS Test"
              $CURL -X DELETE "${URL}/test-index"

update:
  enabled: true
  ignore-regex-patterns:
    - -beta
    - -alpha
  github:
    identifier: opensearch-project/OpenSearch
    tag-filter-prefix: "3."

test:
  environment:
    accounts:
      groups:
        - groupname: opensearch
          gid: 1000
      users:
        - username: opensearch
          uid: 1000
          gid: 1000
      run-as: 0
    contents:
      packages:
        - openjdk-21-default-jvm
        - bash
        - curl
        - sudo
        - wait-for-it
        - openjdk-bcfips-policy-140-3-j21
        - opensearch-fips-3-security
    environment:
      JAVA_HOME: /usr/lib/jvm/default-jvm
      # FIPS requires 112-bit passwords (14+ chars)
      KEYSTORE_PASSWORD: "MySuperSecureP@ssword123"
      TRUSTSTORE_PASSWORD: "TrustStoreP@ssword123"
      JAVA_TOOL_OPTIONS: "--module-path=/usr/share/java/bouncycastle-fips/"
      OPENSEARCH_JAVA_OPTS: "--module-path=/usr/share/java/bouncycastle-fips/"
  pipeline:
    - name: "Configure and start OpenSearch in FIPS mode"
      runs: |
        set -x -euo pipefail

        # Generate keypair directly into BCFKS keystore using BCFIPS provider
        keytool -genkeypair \
          -alias opensearch \
          -keyalg RSA \
          -keysize 2048 \
          -validity 365 \
          -dname "CN=localhost,OU=Test,O=OpenSearch,L=Test,ST=Test,C=US" \
          -keystore /usr/share/opensearch/config/keystore.bcfks \
          -storetype BCFKS \
          -storepass "${KEYSTORE_PASSWORD}" \
          -providername BCFIPS \
          -provider org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider

        # Export cert from BCFKS keystore for truststore (DER) and curl (PEM)
        keytool -exportcert \
          -alias opensearch \
          -keystore /usr/share/opensearch/config/keystore.bcfks \
          -storetype BCFKS \
          -storepass "${KEYSTORE_PASSWORD}" \
          -providername BCFIPS \
          -provider org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider \
          -file /tmp/opensearch.crt
        keytool -exportcert \
          -alias opensearch \
          -keystore /usr/share/opensearch/config/keystore.bcfks \
          -storetype BCFKS \
          -storepass "${KEYSTORE_PASSWORD}" \
          -providername BCFIPS \
          -provider org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider \
          -rfc -file /tmp/opensearch-ca.pem

        # Create BCFKS truststore and import the certificate
        keytool -importcert \
          -alias opensearch \
          -file /tmp/opensearch.crt \
          -keystore /usr/share/opensearch/config/truststore.bcfks \
          -storetype BCFKS \
          -storepass "${TRUSTSTORE_PASSWORD}" \
          -noprompt \
          -providername BCFIPS \
          -provider org.bouncycastle.jcajce.provider.BouncyCastleFipsProvider

        # Configure for single-node testing with TLS
        tee /usr/share/opensearch/config/opensearch.yml << EOF
        cluster.name: test-cluster
        node.name: test-node
        path.data: /usr/share/opensearch/data
        path.logs: /usr/share/opensearch/logs
        network.host: 0.0.0.0
        discovery.type: single-node

        # TLS configuration using BCFKS keystores
        plugins.security.ssl.transport.enabled: true
        plugins.security.ssl.transport.keystore_type: BCFKS
        plugins.security.ssl.transport.keystore_filepath: keystore.bcfks
        plugins.security.ssl.transport.keystore_password: ${KEYSTORE_PASSWORD}
        plugins.security.ssl.transport.truststore_type: BCFKS
        plugins.security.ssl.transport.truststore_filepath: truststore.bcfks
        plugins.security.ssl.transport.truststore_password: ${TRUSTSTORE_PASSWORD}
        plugins.security.ssl.http.enabled: true
        plugins.security.ssl.http.keystore_type: BCFKS
        plugins.security.ssl.http.keystore_filepath: keystore.bcfks
        plugins.security.ssl.http.keystore_password: ${KEYSTORE_PASSWORD}
        plugins.security.ssl.http.truststore_type: BCFKS
        plugins.security.ssl.http.truststore_filepath: truststore.bcfks
        plugins.security.ssl.http.truststore_password: ${TRUSTSTORE_PASSWORD}

        # Allow automatic security index initialization for testing
        plugins.security.allow_default_init_securityindex: true
        EOF

        # Add keystore and truststore passwords to jvm.options for BCFIPS
        tee -a /usr/share/opensearch/config/jvm.options << EOF
        -Djavax.net.ssl.keyStore=/usr/share/opensearch/config/keystore.bcfks
        -Djavax.net.ssl.keyStorePassword=${KEYSTORE_PASSWORD}
        -Djavax.net.ssl.keyStoreType=BCFKS
        -Djavax.net.ssl.trustStore=/usr/share/opensearch/config/truststore.bcfks
        -Djavax.net.ssl.trustStorePassword=${TRUSTSTORE_PASSWORD}
        EOF

        # This is only set for testing - image.cue sets path user/group/perms in images
        chown -R opensearch:opensearch /usr/share/opensearch

        # Create keystore with FIPS-compliant password (112+ bits = 14+ chars)
        sudo -E -u opensearch opensearch-keystore create -p << KEYSTORE
        ${KEYSTORE_PASSWORD}
        ${KEYSTORE_PASSWORD}
        KEYSTORE

        # Check opensearch-plugin command works with patched opensearch-env
        opensearch-plugin list | grep security

        # Start OpenSearch in foreground mode (backgrounded) so we can see output
        echo "${KEYSTORE_PASSWORD}" | sudo -E -u opensearch opensearch > /tmp/opensearch.log 2>&1 &
        OPENSEARCH_PID=$!

        # Wait for OpenSearch to be ready - it can take 10-20s sometimes
        if ! wait-for-it -t 30 localhost:9200; then
          echo "OpenSearch failed to start, showing log:"
          cat /tmp/opensearch.log
          exit 1
        fi

        sleep 15 # port can be up, but cluster health not available yet? esp in arm ci, really slow
        # Verify cluster is healthy (using HTTPS with proper TLS verification)
        curl -sf --cacert /tmp/opensearch-ca.pem -u admin:admin 'https://localhost:9200/_cluster/health?pretty'

        # Test basic functionality - add and retrieve a document over TLS
        curl -sf --cacert /tmp/opensearch-ca.pem -u admin:admin -X PUT 'https://localhost:9200/test-index/_doc/1' \
          -H 'Content-Type: application/json' \
          -d '{"name": "FIPS Test", "message": "OpenSearch running in FIPS mode with TLS"}'
        sleep 15 # takes time to ingest and index doc, esp in arm ci
        curl -sf --cacert /tmp/opensearch-ca.pem -u admin:admin 'https://localhost:9200/test-index/_doc/1' | grep -F "FIPS Test"
