#nolint:valid-pipeline-git-checkout-tag
package:
  name: chainguard-vm-security-guide
  version: "0.1.78"
  epoch: 0
  description: Security automation content for Chainguard VMs
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - cmake
      - libxml2-utils
      - make
      - openscap
      - py3-jinja2
      - py3-pyyaml
      - py3-setuptools
      - python-3

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/complianceascode-content

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/complianceascode-content
      branch: wolfi-vm
      expected-commit: 3c7ff735bc6f9cef62bc65ed397e626d89582a82

  - runs: |
      for profile in products/chainguard/profiles/*; do
        case "$(basename "$profile")" in
          stig.profile|stig_gpos.profile) ;;
          *) rm "$profile" ;;
        esac
      done

  - runs: |
      cd build
      cmake ..
      make chainguard

      mkdir -p "${{targets.destdir}}/usr/share/xml/scap/ssg/content"
      cp ssg-chainguard-ds.xml "${{targets.destdir}}/usr/share/xml/scap/ssg/content/"

update:
  enabled: false
  exclude-reason: |
    The wolfi-vm branch of the complianceascode-content repository receives
    changes for testing in the wolfi-vm CI. Until we start creating and tagging
    releases, updates to this package should happen manually.

test:
  environment:
    contents:
      packages:
        - openscap
  pipeline:
    - runs: |
        # Verify SCAP content is recognized by oscap
        oscap info /usr/share/xml/scap/ssg/content/ssg-chainguard-ds.xml >info
        grep -Fwq 'Id: xccdf_org.ssgproject.content_profile_stig' info
        grep -Fwq 'Id: xccdf_org.ssgproject.content_profile_stig_gpos' info
