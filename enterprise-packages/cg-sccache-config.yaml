package:
  name: cg-sccache-config
  version: "0.1"
  epoch: 0
  description: Utility to add sccache wrappers around all installed/supported compilers
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - sccache

vars:
  test-cuda-version: 13.1

environment:
  contents:
    packages:
      - build-base
      - busybox
      - shellcheck

pipeline:
  - runs: |
      shellcheck cg-sccache-config

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      cp cg-sccache-config ${{targets.destdir}}/usr/bin/

update:
  enabled: false
  exclude-reason: "this is the upstream"

test:
  environment:
    contents:
      packages:
        - build-base
        - clang
        - nvidia-cuda-nvcc-${{vars.test-cuda-version}}-dev
        - nvidia-cuda-nvrtc-${{vars.test-cuda-version}}-dev
        - nvidia-cuda-cudart-${{vars.test-cuda-version}}-dev
        - nvcc-${{vars.test-cuda-version}}-gcc-wrapper
    environment:
      SCCACHE_LOG: debug
      SCCACHE_ERROR_LOG: /tmp/sccache.log
  pipeline:
    - uses: sccache/enable
    - name: "smoke test gcc/g++ after wrapper install"
      uses: test/compiler/smoke
      with:
        cc: gcc
        cxx: g++
    - name: "check that gcc/g++ smoke test activated sccache"
      runs: |
        trap 'rm -f "$SCCACHE_ERROR_LOG"' EXIT
        # || true because the error log doesn't always get created.
        # sccache debug messages are printed while the hardening-check
        # runs - so the wrappers are working. Perhaps the sccache server
        # process gets terminated before it has time to create the log file
        ## Will only exist if sccache was spawned
        cat "$SCCACHE_ERROR_LOG" || true
    - name: "validate gcc hardening is still in place after wrapper install"
      uses: test/compiler/hardening-check
      with:
        cc: gcc
    - name: "check that gcc hardening test activated sccache"
      runs: |
        trap 'rm -f "$SCCACHE_ERROR_LOG"' EXIT
        # || true because the error log doesn't always get created.
        # sccache debug messages are printed while the hardening-check
        # runs - so the wrappers are working. Perhaps the sccache server
        # process gets terminated before it has time to create the log file
        ## Will only exist if sccache was spawned
        cat "$SCCACHE_ERROR_LOG" || true
    - name: "validate that gcc C objects are getting cached"
      runs: |
        tmpdir="$(mktemp -d)"
        trap 'rm -rf "$tmpdir" "$SCCACHE_ERROR_LOG" stats.out' EXIT

        cat > "$tmpdir/test.c" << EOF
        #include <stdio.h>

        int main() {
          return(0);
        }
        EOF
        gcc -c "$tmpdir/test.c"
        gcc -c "$tmpdir/test.c"

        sccache --show-stats | tee stats.out
        killall sccache
        for i in $(seq 10); do
          pidof sccache || break
          sleep 1
        done
        # Will only exist if sccache was spawned
        cat "$SCCACHE_ERROR_LOG"
        grep -E '^Cache hits \(C/C\+\+\)\s+1$' stats.out
    - name: "smoke test clang/clang++ after wrapper install"
      uses: test/compiler/smoke
      with:
        cc: clang
        cxx: clang++
    - name: "check that clang/clang++ smoke test activated sccache"
      runs: |
        trap 'rm -f "$SCCACHE_ERROR_LOG"' EXIT
        # || true because the error log doesn't always get created.
        # sccache debug messages are printed while the hardening-check
        # runs - so the wrappers are working. Perhaps the sccache server
        # process gets terminated before it has time to create the log file
        ## Will only exist if sccache was spawned
        cat "$SCCACHE_ERROR_LOG" || true
    - name: "validate clang hardening is still in place after wrapper install"
      uses: test/compiler/hardening-check
      with:
        cc: clang
    - name: "check that clang hardening test activated sccache"
      runs: |
        trap 'rm -f "$SCCACHE_ERROR_LOG"' EXIT
        # || true because the error log doesn't always get created.
        # sccache debug messages are printed while the hardening-check
        # runs - so the wrappers are working. Perhaps the sccache server
        # process gets terminated before it has time to create the log file
        ## Will only exist if sccache was spawned
        cat "$SCCACHE_ERROR_LOG" || true
    - name: "validate that clang C objects are getting cached"
      runs: |
        tmpdir="$(mktemp -d)"
        trap 'rm -rf "$tmpdir" "$SCCACHE_ERROR_LOG" stats.out' EXIT

        cat > "$tmpdir/test.c" << EOF
        #include <stdio.h>

        int main() {
          return(0);
        }
        EOF
        clang -c "$tmpdir/test.c"
        clang -c "$tmpdir/test.c"

        sccache --show-stats | tee stats.out
        killall sccache
        for i in $(seq 10); do
          pidof sccache || break
          sleep 1
        done
        # Will only exist if sccache was spawned
        cat "$SCCACHE_ERROR_LOG"
        grep -E '^Cache hits \(C/C\+\+\)\s+1$' stats.out
    - name: "validate that nvcc objects are getting cached"
      runs: |
        tmpdir="$(mktemp -d)"
        trap 'rm -rf "$tmpdir" "$SCCACHE_ERROR_LOG" stats.out' EXIT
        export PATH="$PATH:/usr/local/cuda-${{vars.test-cuda-version}}/bin"

        cat > "$tmpdir/test.cu" << EOF
        #include <stdio.h>

        int main() {
          return(0);
        }
        EOF
        nvcc -c "$tmpdir/test.cu"
        nvcc -c "$tmpdir/test.cu"

        sccache --show-stats | tee stats.out
        killall sccache
        for i in $(seq 10); do
          pidof sccache || break
          sleep 1
        done
        # Will only exist if sccache was spawned
        cat "$SCCACHE_ERROR_LOG"
        grep -E '^Cache hits \(CUDA\)\s+[12]$' stats.out
