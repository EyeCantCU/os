package:
  name: airflow-2
  version: "2.11.0"
  epoch: 12
  description: Platform to programmatically author, schedule, and monitor workflows
  options:
    #  There is a dependency on libarrow.so although it
    #  is provided in the virtual environment. Enabling no-depends
    #  works around this
    no-depends: true
  dependencies:
    runtime:
      - coreutils # numfmt is required
      - eudev-libs # provides libudev.so.1
      - keyutils-libs # provides libkeyutils.so.1
      - mariadb-connector-c # provides libmariadb.so.3
      - merged-usrsbin
      - netcat-openbsd # nc is required
      - posix-libc-utils # genconf is required
      - python-3.12
      - tzdata
      - unixodbc
      - wolfi-baselayout
    provides:
      - airflow=${{package.full-version}}
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+$
    replace: "$1"
    to: major-version

environment:
  contents:
    packages:
      - cargo-auditable
      - findutils
      - gcc
      - glibc-dev
      - glibc-locales
      - localedef
      - mariadb-connector-c-dev
      - mariadb-dev
      - nodejs
      - npm
      - pkgconf-dev
      - postgresql-dev
      - py3-pip
      - py3-xmlsec
      - py3.12-build-bin
      - py3.12-pip
      # Airflow requires python<3.13
      - python-3.12
      - python-3.12-dev
      - rust
      - wolfi-base
      - xmlsec-dev
      - xmlsec-openssl
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/airflow
      tag: ${{package.version}}
      expected-commit: d9ed7b94d033dc61ee1c05aafb9f1c1f7b82cfb2

  - runs: |
      # By default, the airflow celery provider is not built, but running the upstream helm chart requires it
       python patch.py
       # remove the patcher
       rm -rf patch.py

  - uses: patch
    with:
      patches: cryptography.patch requests.patch urllib3.patch

  - working-directory: ./airflow/www
    runs: |
      # front-end build
      yarn install --frozen-lockfile
      # Update BrowsersList regularly: https://github.com/browserslist/update-db#readme
      npx update-browserslist-db@latest
      yarn run build
      rm -rf node_modules

  - runs: |
      # requires EPOCH to be later that 1980
      export SOURCE_DATE_EPOCH=315532800

      # To install mysqlclient wheel
      export MYSQLCLIENT_CFLAGS=`mysql_config --cflags`
      export MYSQLCLIENT_CFLAGS=`mysql_config --cflags`

      python3.12 -m build --wheel
      pip3.12 install --verbose \
       --prefix="/opt/airflow" --root=${{targets.contextdir}} dist/*.whl

  - runs: |
      # CVE-2024-6345 GHSA-cx63-2mw6-8hw5
      # setuptools comes from airflow/providers/google/provider.yaml having
      # gcloud-aio-auth>=4.0.0,<5.0.0 . gcloud-aio-auth 4 is backlevel and has
      # setuptools in it's pyproject.toml 'tool.poetry.dependencies'
      # The tldr; For that case it is not needed in runtime.
      pip3.12 uninstall --yes setuptools

      #GHSA-8w49-h785-mj3c/GHSA-8495-4g3g-x7pr/GHSA-27mf-ghqm-j3j8 fixes
      #GHSA-r244-wg5g-6w2r (redshift-connector>=2.1.6)
      #CVE-2025-50213 (apache-airflow-providers-snowflake>=6.4.0)
      #GHSA-9548-qrrj-x5pj (aiohttp 3.12.4)
      #GHSA-847f-9342-265h (h2 4.3.0)
      pip3.12 install --verbose \
        --force-reinstall --prefix=/opt/airflow --root="${{targets.contextdir}}" \
        aiohttp>=3.10.11 tornado>=6.5.0 statsd packaging pyparsing \
        apache-airflow==${{package.version}} apache-airflow-providers-celery==3.10.0 "flask>=2.2.1,<2.3" \
        redshift-connector>=2.1.6 flask-appbuilder>=4.6.2 apache-airflow-providers-snowflake>=6.4.0 aiohttp==3.12.14 \
        paramiko==3.5.1 h2==4.3.0
      # NOTE: paramiko is pinned to 3.5.1 to resolve compatibility issues with SFTP providers. Unpin once upstream support is merged, https://github.com/apache/airflow/pull/54165.
      # NOTE: apache-airflow-providers-celery is pinned to 3.10.0 because 3.10.3 introduced a regresssion.
      # https://github.com/apache/airflow/issues/47781 details more about it.
      # NOTE: flask is pinned to < 2.3 as required by apache-airflow-providers-fab:
      # https://github.com/apache/airflow/blob/21b8621539a382c3382f869752651be99ba30421/providers/fab/pyproject.toml#L68
      # Before removing these pins, please check if the airflow[-bitnami] image helm tests pass.

  - runs: find . -name '__pycache__' -exec rm -rf {} +

  - runs: |
      mkdir -p ${{targets.destdir}}/opt/airflow/dags
      mkdir -p ${{targets.destdir}}/scripts/docker

      # The first time you run Airflow, it will create a file called `airflow.cfg` in
      # `$AIRFLOW_HOME` directory
      # However, for production case it is advised to generate the configuration
      export PYTHONPATH=${{targets.destdir}}/opt/airflow/lib/python3.12/site-packages

      ${{targets.destdir}}/opt/airflow/bin/airflow config list --defaults > ${{targets.destdir}}/"airflow.cfg"

      cp airflow/config_templates/default_webserver_config.py ${{targets.destdir}}/

      cp scripts/docker/entrypoint_prod.sh ${{targets.destdir}}/entrypoint
      chmod 755 ${{targets.destdir}}/entrypoint

      cp scripts/docker/clean-logs.sh ${{targets.destdir}}/clean-logs
      chmod 755 ${{targets.destdir}}/clean-logs

      cp scripts/docker/airflow-scheduler-autorestart.sh ${{targets.destdir}}/airflow-scheduler-autorestart
      chmod 755 ${{targets.destdir}}/airflow-scheduler-autorestart

      cp -r scripts/docker/* ${{targets.destdir}}/scripts/docker
      chmod 755 ${{targets.destdir}}/scripts/docker

subpackages:
  - name: ${{package.name}}-compat
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-usrsbin
        - wolfi-baselayout
      provides:
        - airflow-compat=${{package.full-version}}
    pipeline:
      - runs: |
          # Symlink libstdc++ from usr/lib to /usr/lib/$(uname -m)-linux-gnu/
          mkdir -p ${{targets.subpkgdir}}/usr/lib/$(uname -m)-linux-gnu
          ln -sf /usr/lib/libstdc++.so.6 ${{targets.subpkgdir}}/usr/lib/$(uname -m)-linux-gnu/
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: airflow-compat
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-iamguarded-compat
    dependencies:
      runtime:
        - ${{package.name}}
        - bash
        - busybox
        - coreutils
        - ini-file
        - wait-for-port
        - wolfi-baselayout
      provides:
        - airflow-iamguarded-compat=${{package.full-version}}
    description: "Iamguarded compat for Airflow"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: airflow
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /opt/iamguarded
          ln -sf /opt/airflow /opt/iamguarded
          mkdir -p ${{targets.contextdir}}/opt/airflow/venv
          chmod g+rwX /opt/iamguarded
          ln -sf /opt/airflow/lib /opt/airflow/bin ${{targets.contextdir}}/opt/airflow/venv
          mkdir -p ${{targets.contextdir}}/opt/airflow/bin
          touch ${{targets.contextdir}}/opt/airflow/bin/activate
          chmod 0755 ${{targets.contextdir}}/opt/airflow/bin/activate

          # fix find invocations in scripts to allow copying configuration files
          sed -i -E 's#find "\$AIRFLOW_BASE_DIR"#find "\$AIRFLOW_BASE_DIR/"#g' /opt/iamguarded/scripts/*.sh

          # prevent certain changes as compat is using symlink
          sed -i -E 's/configure_permissions_ownership "|ensure_dir_exists "|chmod -R g\+rwX "\$AIRFLOW_BASE_DIR"/true ; # \0/' \
            /opt/iamguarded/scripts/airflow/postunpack.sh

          sed -i 's/locale-gen/localedef -i en_US -f UTF-8 en_US.UTF-8/g' /opt/iamguarded/scripts/locales/add-extra-locales.sh

          /opt/iamguarded/scripts/airflow/postunpack.sh
          /opt/iamguarded/scripts/locales/add-extra-locales.sh
          sed -i '/if ! am_i_root && \[\[ -e "$LIBNSS_WRAPPER_PATH" \]\]; then/,/fi/d' /opt/iamguarded/scripts/airflow/entrypoint.sh
      - uses: iamguarded/finalize-compat
        with:
          package: airflow
          version: ${{vars.major-version}}
    test:
      environment:
        accounts:
          groups:
            - groupname: airflow
              gid: 1001
          users:
            - username: airflow
              gid: 1001
              uid: 1001
          run-as: 0
        contents:
          packages:
            - ${{package.name}}
            - sudo
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: airflow
            version: ${{vars.major-version}}
        - working-directory: /
          pipeline:
            - name: "Launch the entrypoint / run scripts"
              uses: test/daemon-check-output
              with:
                setup: |
                  chown 1001:1001 -fR /opt/airflow
                  mkdir -p /opt/airflow/tmp /opt/airflow/dags
                start: |
                  sudo -uairflow -E env /opt/iamguarded/scripts/airflow/entrypoint.sh /opt/iamguarded/scripts/airflow/run.sh
                timeout: 60
                expected_output: |
                  Initializing Airflow
                  Configuring Airflow database

update:
  enabled: true
  ignore-regex-patterns:
    - 'rc\d+$'
    - 'helm-chart*'
  github:
    identifier: apache/airflow
    tag-filter-prefix: 2.

test:
  environment:
    contents:
      packages:
        - python3
  pipeline:
    - runs: |
        export PATH=/opt/airflow/bin:$PATH
        export PYTHONPATH=/opt/airflow/lib/python3.12/site-packages
        HOME=/home/build airflow version
        python3.12 -c "import airflow"

        # Test paramiko version and SFTP provider imports
        python3.12 - <<'PY'
        import paramiko
        print("paramiko", paramiko.__version__)

        # Verify paramiko is < 4.0.0
        from packaging import version
        paramiko_version = version.parse(paramiko.__version__)
        expected_max = version.parse("4.0.0")

        if paramiko_version >= expected_max:
            raise Exception(f"paramiko version {paramiko.__version__} is >= 4.0.0, which breaks SFTP providers")

        print(f"✓ paramiko version {paramiko.__version__} is compatible (< 4.0.0)")
        PY
    - uses: test/tw/ldd-check
