package:
  name: airflow-2
  version: "2.11.0"
  epoch: 26
  description: Platform to programmatically author, schedule, and monitor workflows
  options:
    #  There is a dependency on libarrow.so although it
    #  is provided in the virtual environment. Enabling no-depends
    #  works around this
    no-depends: true
  dependencies:
    runtime:
      - coreutils # numfmt is required
      - eudev-libs # provides libudev.so.1
      - keyutils-libs # provides libkeyutils.so.1
      - mariadb-connector-c # provides libmariadb.so.3
      - merged-usrsbin
      - netcat-openbsd # nc is required
      - posix-libc-utils # genconf is required
      - python-${{vars.python-version}}
      - tzdata
      - unixodbc
      - wolfi-baselayout
    provides:
      - airflow=${{package.full-version}}
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+$
    replace: "$1"
    to: major-version

vars:
  python-version: 3.12

environment:
  contents:
    packages:
      - cargo-auditable
      - findutils
      - gcc
      - glibc-dev
      - glibc-locales
      - localedef
      - mariadb-connector-c-dev
      - mariadb-dev
      - nodejs
      - npm
      - pkgconf-dev
      - postgresql-dev
      - py${{vars.python-version}}-build-bin
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-xmlsec
      # Airflow requires python<3.13
      - python-${{vars.python-version}}
      - python-${{vars.python-version}}-dev
      - rust
      - wolfi-base
      - xmlsec-dev
      - xmlsec-openssl
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/airflow
      tag: ${{package.version}}
      expected-commit: d9ed7b94d033dc61ee1c05aafb9f1c1f7b82cfb2

  - runs: |
      curl https://raw.githubusercontent.com/apache/airflow/constraints-${{package.version}}/constraints-${{vars.python-version}}.txt > constraints-${{vars.python-version}}.txt

  - uses: py/tw/bump-constraints
    with:
      constraints-file: constraints-${{vars.python-version}}.txt
      packages: |
        mysql-connector-python==9.4.0 # 9.3.0 broken on aarch64
        aiohttp==3.13.3 # GHSA-6jhg-hg63-jvvf
        aiomysql==0.3.0 # GHSA-r397-ff8c-wv2g
        aiosignal==1.4.0 # Needed for aiohttp 3.12.14
        h2==4.3.0 # GHSA-847f-9342-265h
        protobuf==5.29.5 # CVE-2024-7254
        redshift-connector==2.1.7 # GHSA-r244-wg5g-6w2r
        requests==2.32.4 # CVE-2024-47081
        urllib3==2.6.3 # GHSA-38jv-5279-wg99
        apache-airflow-providers-snowflake==6.4.0 # CVE-2025-50213
        filelock==3.20.3 # GHSA-qmgc-5h2g-mvrw
        marshmallow==3.26.2 # GHSA-428g-f7cq-pgp5
        azure-core==1.38.0 # GHSA-jm66-cg57-jjv5
        setuptools==80.10.2
        pyasn1==0.6.2 # GHSA-63vm-454h-vhhq
        sqlparse==0.5.4

  - runs: |
      # By default, the airflow celery provider is not built, but running the upstream helm chart requires it
       python patch.py
       # remove the patcher
       rm -rf patch.py

  - uses: patch
    with:
      patches: cryptography.patch requests.patch urllib3.patch CVE-2025-12758.patch

  - working-directory: ./airflow/www
    runs: |
      # front-end build
      # CVE patches modify package.json, so regenerate yarn.lock
      rm -rf yarn.lock
      yarn install
      # Update BrowsersList regularly: https://github.com/browserslist/update-db#readme
      npx update-browserslist-db@latest
      yarn run build
      rm -rf node_modules

  - runs: |
      # requires EPOCH to be later that 1980
      export SOURCE_DATE_EPOCH=315532800
      set -x

      # To install mysqlclient wheel
      export MYSQLCLIENT_CFLAGS=`mysql_config --cflags`

      python${{vars.python-version}} -m build --wheel
      pip${{vars.python-version}} install --verbose \
        --prefix="/opt/airflow" --root=${{targets.contextdir}} \
        --constraint constraints-${{vars.python-version}}.txt \
        dist/*.whl

      pip${{vars.python-version}} install --force-reinstall --verbose \
        --prefix="/opt/airflow" --root=${{targets.contextdir}} \
        --constraint constraints-${{vars.python-version}}.txt \
        statsd packaging pyparsing

      # CVE-2024-6345 GHSA-cx63-2mw6-8hw5
      # setuptools comes from airflow/providers/google/provider.yaml having
      # gcloud-aio-auth>=4.0.0,<5.0.0 . gcloud-aio-auth 4 is backlevel and has
      # setuptools in it's pyproject.toml 'tool.poetry.dependencies'
      # The tldr; For that case it is not needed in runtime.
      pip${{vars.python-version}} uninstall --yes setuptools

  - runs: find . -name '__pycache__' -exec rm -rf {} +

  - runs: |
      mkdir -p ${{targets.destdir}}/opt/airflow/dags
      mkdir -p ${{targets.destdir}}/scripts/docker

      # The first time you run Airflow, it will create a file called `airflow.cfg` in
      # `$AIRFLOW_HOME` directory
      # However, for production case it is advised to generate the configuration
      export PYTHONPATH=${{targets.destdir}}/opt/airflow/lib/python${{vars.python-version}}/site-packages

      ${{targets.destdir}}/opt/airflow/bin/airflow config list --defaults > ${{targets.destdir}}/"airflow.cfg"

      cp airflow/config_templates/default_webserver_config.py ${{targets.destdir}}/

      cp scripts/docker/entrypoint_prod.sh ${{targets.destdir}}/entrypoint
      chmod 755 ${{targets.destdir}}/entrypoint

      cp scripts/docker/clean-logs.sh ${{targets.destdir}}/clean-logs
      chmod 755 ${{targets.destdir}}/clean-logs

      cp scripts/docker/airflow-scheduler-autorestart.sh ${{targets.destdir}}/airflow-scheduler-autorestart
      chmod 755 ${{targets.destdir}}/airflow-scheduler-autorestart

      cp -r scripts/docker/* ${{targets.destdir}}/scripts/docker
      chmod 755 ${{targets.destdir}}/scripts/docker

subpackages:
  - name: ${{package.name}}-compat
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-usrsbin
        - wolfi-baselayout
      provides:
        - airflow-compat=${{package.full-version}}
    pipeline:
      - runs: |
          # Symlink libstdc++ from usr/lib to /usr/lib/$(uname -m)-linux-gnu/
          mkdir -p ${{targets.subpkgdir}}/usr/lib/$(uname -m)-linux-gnu
          ln -sf /usr/lib/libstdc++.so.6 ${{targets.subpkgdir}}/usr/lib/$(uname -m)-linux-gnu/
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: airflow-compat
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-iamguarded-compat
    dependencies:
      runtime:
        - ${{package.name}}
        - bash
        - busybox
        - coreutils
        - ini-file
        - wait-for-port
        - wolfi-baselayout
      provides:
        - airflow-iamguarded-compat=${{package.full-version}}
    description: "Iamguarded compat for Airflow"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: airflow
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /opt/iamguarded
          ln -sf /opt/airflow /opt/iamguarded
          mkdir -p ${{targets.contextdir}}/opt/airflow/venv
          chmod g+rwX /opt/iamguarded
          ln -sf /opt/airflow/lib /opt/airflow/bin ${{targets.contextdir}}/opt/airflow/venv
          mkdir -p ${{targets.contextdir}}/opt/airflow/bin
          touch ${{targets.contextdir}}/opt/airflow/bin/activate
          chmod 0755 ${{targets.contextdir}}/opt/airflow/bin/activate

          # fix find invocations in scripts to allow copying configuration files
          sed -i -E 's#find "\$AIRFLOW_BASE_DIR"#find "\$AIRFLOW_BASE_DIR/"#g' /opt/iamguarded/scripts/*.sh

          # prevent certain changes as compat is using symlink
          sed -i -E 's/configure_permissions_ownership "|ensure_dir_exists "|chmod -R g\+rwX "\$AIRFLOW_BASE_DIR"/true ; # \0/' \
            /opt/iamguarded/scripts/airflow/postunpack.sh

          sed -i 's/locale-gen/localedef -i en_US -f UTF-8 en_US.UTF-8/g' /opt/iamguarded/scripts/locales/add-extra-locales.sh

          /opt/iamguarded/scripts/airflow/postunpack.sh
          /opt/iamguarded/scripts/locales/add-extra-locales.sh
          sed -i '/if ! am_i_root && \[\[ -e "$LIBNSS_WRAPPER_PATH" \]\]; then/,/fi/d' /opt/iamguarded/scripts/airflow/entrypoint.sh
      - uses: iamguarded/finalize-compat
        with:
          package: airflow
          version: ${{vars.major-version}}
    test:
      environment:
        accounts:
          groups:
            - groupname: airflow
              gid: 1001
          users:
            - username: airflow
              gid: 1001
              uid: 1001
          run-as: 0
        contents:
          packages:
            - ${{package.name}}
            - sudo
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: airflow
            version: ${{vars.major-version}}
        - working-directory: /
          pipeline:
            - name: "Launch the entrypoint / run scripts"
              uses: test/daemon-check-output
              with:
                setup: |
                  chown 1001:1001 -fR /opt/airflow
                  mkdir -p /opt/airflow/tmp /opt/airflow/dags
                start: |
                  sudo -uairflow -E env /opt/iamguarded/scripts/airflow/entrypoint.sh /opt/iamguarded/scripts/airflow/run.sh
                timeout: 60
                expected_output: |
                  Initializing Airflow
                  Configuring Airflow database

update:
  enabled: true
  ignore-regex-patterns:
    - 'rc\d+$'
    - 'helm-chart*'
  github:
    identifier: apache/airflow
    tag-filter-prefix: 2.

test:
  environment:
    contents:
      packages:
        - python-${{vars.python-version}}
  pipeline:
    - runs: |
        export PATH=/opt/airflow/bin:$PATH
        export PYTHONPATH=/opt/airflow/lib/python${{vars.python-version}}/site-packages
        HOME=/home/build airflow version
        python${{vars.python-version}} -c "import airflow"

        # Test paramiko version and SFTP provider imports
        python${{vars.python-version}} - <<'PY'
        import paramiko
        print("paramiko", paramiko.__version__)

        # Verify paramiko is < 4.0.0
        from packaging import version
        paramiko_version = version.parse(paramiko.__version__)
        expected_max = version.parse("4.0.0")

        if paramiko_version >= expected_max:
            raise Exception(f"paramiko version {paramiko.__version__} is >= 4.0.0, which breaks SFTP providers")

        print(f"✓ paramiko version {paramiko.__version__} is compatible (< 4.0.0)")
        PY
    - name: "Test database initialization with airflow db migrate"
      runs: |
        export PATH=/opt/airflow/bin:$PATH
        export PYTHONPATH=/opt/airflow/lib/python${{vars.python-version}}/site-packages
        export HOME=/tmp/airflow-home
        export AIRFLOW_HOME=$HOME

        # Create a clean home directory for airflow
        mkdir -p $AIRFLOW_HOME

        # Initialize the database using SQLite (default)
        airflow db migrate

        # Verify database file was created
        stat $AIRFLOW_HOME/airflow.db

        # Verify tables were created by checking db version
        airflow db check
        echo "SUCCESS: Database initialized and verified"
    - name: "Test DAG parsing with a simple DAG"
      runs: |
        export PATH=/opt/airflow/bin:$PATH
        export PYTHONPATH=/opt/airflow/lib/python${{vars.python-version}}/site-packages
        export HOME=/tmp/airflow-home
        export AIRFLOW_HOME=$HOME

        mkdir -p $AIRFLOW_HOME/dags

        # Create a simple test DAG
        tee $AIRFLOW_HOME/dags/test_dag.py <<'EOF'
        from datetime import datetime
        from airflow import DAG
        from airflow.operators.bash import BashOperator

        with DAG(
            dag_id="test_dag",
            start_date=datetime(2024, 1, 1),
            schedule=None,
            catchup=False,
        ) as dag:
            task1 = BashOperator(
                task_id="echo_task",
                bash_command="echo 'Hello from Airflow'",
            )
        EOF

        # Parse and list DAGs to verify the DAG is recognized
        airflow dags list 2>&1 | tee /tmp/dag_list.txt

        # Verify our test DAG is in the list
        if ! grep -F "test_dag" /tmp/dag_list.txt; then
          echo "FAIL: test_dag not found in DAG list"
          exit 1
        fi

        echo "SUCCESS: DAG parsed and listed correctly"
    - name: "Test task execution with BashOperator"
      runs: |
        export PATH=/opt/airflow/bin:$PATH
        export PYTHONPATH=/opt/airflow/lib/python${{vars.python-version}}/site-packages
        export HOME=/tmp/airflow-home
        export AIRFLOW_HOME=$HOME

        # Execute the test task directly using airflow tasks test
        # This runs the task without scheduling
        output=$(airflow tasks test test_dag echo_task 2024-01-01 2>&1)
        echo "$output"

        # Verify the task executed and produced expected output
        if ! echo "$output" | grep -F "Hello from Airflow"; then
          echo "FAIL: Task execution did not produce expected output"
          exit 1
        fi

        echo "SUCCESS: Task executed correctly"
    - name: "Test provider imports work correctly"
      runs: |
        export PATH=/opt/airflow/bin:$PATH
        export PYTHONPATH=/opt/airflow/lib/python${{vars.python-version}}/site-packages

        # Test that providers can be imported (verify at least core provider functionality)
        python${{vars.python-version}} <<'EOF'
        # Test BashOperator is importable and functional
        from airflow.operators.bash import BashOperator
        print("BashOperator imported successfully")

        # Test PythonOperator
        from airflow.operators.python import PythonOperator
        print("PythonOperator imported successfully")

        # Test Celery provider (installed based on build config comments)
        try:
            from airflow.providers.celery.executors.celery_executor import CeleryExecutor
            print("CeleryExecutor imported successfully")
        except ImportError as e:
            print(f"Note: Celery provider not available - {e}")

        # Test file sensor (common workflow component)
        from airflow.sensors.filesystem import FileSensor
        print("FileSensor imported successfully")

        # Verify we can create a simple DAG programmatically
        from airflow import DAG
        from datetime import datetime
        test_dag = DAG(dag_id="provider_test", start_date=datetime(2024, 1, 1), schedule=None)
        assert test_dag is not None
        print("DAG creation works correctly")

        print("SUCCESS: Provider imports verified")
        EOF
    - uses: test/tw/ldd-check
