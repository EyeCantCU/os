# Please note the last release of this package was 2 years ago, and seems to be complete and has no CVEs
# this package is needed as runtime dep for celery
package:
  name: py3-click-didyoumean
  version: "0.3.1"
  epoch: 1 # go/enterprise-rsc/py3-click-didyoumean
  description: Enables git-like did-you-mean feature in click
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: click-didyoumean
  import: click_didyoumean

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-poetry-core
      - py3-supported-python-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/click-contrib/click-didyoumean
      tag: v${{package.version}}
      expected-commit: e571cc808c5107fbe5b05b1d42af05d118b066e1

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-click
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import click_didyoumean

            # Test basic imports and classes
            assert hasattr(click_didyoumean, 'DYMGroup'), "DYMGroup class not found"
            assert hasattr(click_didyoumean, 'DYMCommandCollection'), "DYMCommandCollection class not found"

            # Test DYMGroup class
            assert callable(click_didyoumean.DYMGroup), "DYMGroup is not callable"

            # Test DYMCommandCollection class
            assert callable(click_didyoumean.DYMCommandCollection), "DYMCommandCollection is not callable"
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: click-contrib/click-didyoumean
    strip-prefix: v
