package:
  name: chart-iamguarded-mysql
  version: "14.0.5"
  epoch: 0
  description: MySQL iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: mysql/${{package.version}}
      expected-commit: 8061a66099b5075868d392b6833bf1f3df3bd442

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/mysql

  - uses: charts/package
    with:
      chart-path: iamguarded/mysql

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: mysql/
    use-tag: true
    tag-filter-prefix: mysql/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /mysql
