package:
  name: nerdctl-fips
  version: "2.2.1"
  epoch: 0 # GHSA-jv3w-x3r3-g6rm
  description: Docker-compatible CLI for containerd, with support for Compose, Rootless, eStargz, OCIcrypt, IPFS, ...
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/containerd/nerdctl
      tag: v${{package.version}}
      expected-commit: 0d1089396f017bb872ad40606b0d31ebdeaa828a

  - uses: go/remove-cgo-enabled-0
    with:
      seds: |
        s,CGO_ENABLED=0[ ]*,,g
        s,-s -w,-w,g

  - runs: |
      make
      install -Dm755 ./_output/nerdctl ${{targets.destdir}}/usr/bin/nerdctl

  - uses: strip

update:
  enabled: true
  github:
    identifier: containerd/nerdctl
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - containerd-fips
        - iptables-wrappers
        - curl
        - coreutils
  pipeline:
    - name: "Configure and start containerd"
      runs: |
        mkdir -p /etc/containerd
        cat > /etc/containerd/config.toml << EOF
        version = 2
        [plugins."io.containerd.grpc.v1.cri"]
          snapshotter = ""
        EOF

        containerd > out.log 2>&1 &
        sleep 5  # Give containerd time to start

        nerdctl info

        # don't unpack, we're using a fake containerd
        nerdctl pull --unpack=false cgr.dev/chainguard/wolfi-base:latest
    - uses: test/go-fips-check
