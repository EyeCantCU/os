package:
  name: ztunnel-fips-1.24
  version: "1.24.6"
  epoch: 4
  description: The `ztunnel` component of istio ambient mesh.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - ztunnel-fips=${{package.full-version}}
    runtime:
      - ca-certificates-bundle
      - iptables-wrappers
      - libmnl
      - libnetfilter_conntrack
      - libnfnetlink

vars:
  boring-version: 853ca1ea1168dff08011e5d42d94609cc0ca2e27

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - clang-20
      - cmake
      - protoc
      - rust

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/istio/ztunnel
      tag: ${{package.version}}
      expected-commit: 2b351810add39b8a05f878460ad8b6d36c4694b9

  - uses: rust/cargobump

  - runs: |
      # https://github.com/istio/ztunnel/blob/master/README.md#boring-fips
      grep ${{vars.boring-version}} -r vendor/boringssl-fips/
      if [ "${{build.arch}}" = "aarch64" ]; then
        sed 's|x86_64|arm64|' -i .cargo/config.toml
      fi
      export ZTUNNEL_BUILD_buildStatus=clean
      export ZTUNNEL_BUILD_buildGitRevision=$(git rev-parse HEAD)
      export ZTUNNEL_BUILD_buildTag=$(git describe --tags --abbrev=0)
      export ZTUNNEL_BUILD_buildVersion=$(git rev-parse HEAD)
      cargo auditable build --release --no-default-features --features tls-boring --bin ztunnel
      mkdir -p ${{targets.destdir}}/usr/bin
      cp out/rust/release/ztunnel ${{targets.destdir}}/usr/bin/ztunnel

  - uses: rust/build-tree-check
    with:
      allowed-crates: "libboring_sys"
      blocked-crates: "libring"
      allowed-symbols: "boringssl_fips_self_test boring_rustls_provider::tls13::AES_256_GCM_SHA384"
      blocked-symbols: "ring::digest::SHA384 ring::aead::aes_gcm::AES_256_GCM"
      binary: "out/rust/release/ztunnel"

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for ztunnel
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/local/bin
          ln -sf /usr/bin/ztunnel "${{targets.contextdir}}"/usr/local/bin/ztunnel
    dependencies:
      provides:
        - ztunnel-fips-compat=${{package.full-version}}

update:
  enabled: true
  ignore-regex-patterns:
    - '-rc'
    - '-beta'
  github:
    identifier: istio/ztunnel
    tag-filter-prefix: 1.24.
    use-tag: true

test:
  environment:
    contents:
      packages:
        - jq
        - rust-audit-info
  pipeline:
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 4407
        software-version: ${{vars.boring-version}}
    - name: Version information tests
      runs: |
        VERSION_OUTPUT=$(ztunnel version)
        echo "$VERSION_OUTPUT" | grep "Version"
        echo "$VERSION_OUTPUT" | grep "BuildStatus"
        echo "$VERSION_OUTPUT" | grep "GitTag"
        echo "$VERSION_OUTPUT" | grep ${{package.version}}
    - name: Command structure tests
      runs: |
        set -e
        ztunnel help | grep "Commands:"
        ztunnel help proxy | grep "Start the ztunnel proxy"
        ztunnel help version | grep "Print the version"
    - name: Check audit-info
      runs: |
        crate=$(rust-audit-info /usr/bin/ztunnel | jq -r '.packages | .[] | select(.name=="ring") | .name')
        if [ "ring" = "$crate" ]; then
          echo ring is a false positive metadata
        fi
        crate=$(rust-audit-info /usr/bin/ztunnel | jq -r '.packages | .[] | select(.name=="boring-sys") | .name')
        [ "boring-sys" = "$crate" ]
