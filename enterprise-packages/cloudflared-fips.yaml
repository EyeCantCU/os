package:
  name: cloudflared-fips
  version: "2026.2.0"
  epoch: 1 # go/enterprise-rsc/cloudflared-fips
  description: Cloudflare Tunnel client
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 8Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cloudflare/cloudflared
      tag: ${{package.version}}
      expected-commit: 66587173e2cd5b2ea6d495e97aec6551e5e18c30

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: ./cmd/cloudflared
      output: cloudflared
      ldflags: -X "main.Version=${{package.version}}"
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: cloudflare/cloudflared

test:
  environment:
    contents:
      packages:
        - bash
        - coreutils
        - curl
        - grep
        - procps
        - netcat-openbsd
        - python3
  pipeline:
    - uses: test/go-fips-check
    - name: "Verify binary existence and permissions"
      runs: |
        test -x /usr/bin/cloudflared
    - uses: test/tw/ver-check
      with:
        bins: cloudflared
    - uses: test/tw/help-check
      with:
        bins: cloudflared
    - name: "Test quick tunnel creation"
      uses: test/daemon-check-output
      with:
        setup: |
          # Start a simple HTTP server on port 8080 for cloudflared to tunnel
          mkdir -p /tmp/www
          echo "Hello from tunnel test" > /tmp/www/index.html
          cd /tmp/www && python3 -m http.server 8080 > /tmp/http.log 2>&1 &
        start: cloudflared tunnel --url localhost:8080/
        timeout: 30
        expected_output: |
          Thank you for trying Cloudflare Tunnel
          Your quick Tunnel has been created! Visit it at
          https://.*trycloudflare.com
        error_strings: |
          panic:
          FATAL
          failed to create tunnel
          certificate error
          connection refused
        post: |
          set -euo pipefail
          # Verify cloudflared process is still running and hasn't crashed
          pgrep -x cloudflared > /dev/null || { echo "FAIL: cloudflared process not running"; exit 1; }
          echo "SUCCESS: cloudflared tunnel is running"
