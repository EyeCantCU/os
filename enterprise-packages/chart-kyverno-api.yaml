package:
  name: chart-kyverno-api
  version: "0.0.1_alpha2"
  epoch: 0
  description: Kyverno API CRDs chart
  copyright:
    - license: Apache-2.0

# APK mangles 0.0.1-alpha.2 to 0.0.1_alpha2; reverse it for upstream references
var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+\.\d+)_(.+?)(\d+)$
    replace: "$1-$2.$3"
    to: upstream-version

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kyverno/api
      tag: v${{vars.upstream-version}}
      expected-commit: 2930548bd505235d088c9648e874d87599568cc4

  - runs: |
      # Source chart has version v0.0.0 - set it to match the published chart version
      yq -i '.version = "${{vars.upstream-version}}"' charts/kyverno-api/Chart.yaml
      yq -i '.appVersion = "${{vars.upstream-version}}"' charts/kyverno-api/Chart.yaml

  - uses: charts/package
    with:
      chart-path: charts/kyverno-api
      chart-version: ${{vars.upstream-version}}
      test: |
        cases:
          - name: default
            images: []

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  version-transform:
    - match: "-alpha."
      replace: "_alpha"
  github:
    identifier: kyverno/api
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
