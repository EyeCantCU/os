package:
  name: velero-plugin-for-aws-fips
  version: "1.13.2"
  epoch: 3 # CVE-2025-61732
  description: Plugins to support Velero on AWS
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - merged-bin
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      tag: v${{package.version}}
      expected-commit: 18469e7330ee47fbcefbf6ce4c0f68dfc273c5d5
      repository: https://github.com/vmware-tanzu/velero-plugin-for-aws

  - uses: go/build
    with:
      packages: ./velero-plugin-for-aws
      output: velero-plugin-for-aws
      go-package: go-fips

  - uses: go/build
    with:
      packages: ./hack/cp-plugin
      output: cp-plugin
      go-package: go-fips

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    pipeline:
      - runs: |
          # The plugin binary is expected to be in /plugins directory
          # https://github.com/vmware-tanzu/velero-plugin-for-aws/blob/60a7e327a32f7fd21bdc2b712f6e2cbd8fd09b26/Dockerfile#L30-L31
          mkdir -p "${{targets.subpkgdir}}"/plugins
          # /target directory is created to match the Dockerfile
          # https://github.com/vmware-tanzu/velero-plugin-for-aws/blob/60a7e327a32f7fd21bdc2b712f6e2cbd8fd09b26/Dockerfile#L37
          mkdir -p "${{targets.subpkgdir}}"/target
          cp "${{targets.destdir}}"/usr/bin/velero-plugin-for-aws "${{targets.subpkgdir}}"/plugins/velero-plugin-for-aws
    dependencies:
      runtime:
        - merged-bin
        - wolfi-baselayout
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
        environment:
          PATH: /plugins:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      pipeline:
        - name: Verify plugin binary location
          runs: |
            set -euo pipefail
            # Verify plugin binary exists at /plugins/ (fails test if missing)
            stat /plugins/velero-plugin-for-aws
            # Verify binary is executable
            test -x /plugins/velero-plugin-for-aws || { echo "FAIL: not executable"; exit 1; }
        - uses: test/tw/help-check
          with:
            bins: velero-plugin-for-aws

update:
  enabled: true
  github:
    identifier: vmware-tanzu/velero-plugin-for-aws
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - velero-plugin-for-aws-fips-compat
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: |
          velero-plugin-for-aws
          cp-plugin
    - name: Test cp-plugin functionality
      runs: |
        set -euo pipefail
        cp-plugin /plugins/velero-plugin-for-aws /target/velero-plugin-for-aws
        # Verify the copy was successful (fails test if missing)
        stat /target/velero-plugin-for-aws
