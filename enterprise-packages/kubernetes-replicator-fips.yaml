package:
  name: kubernetes-replicator-fips
  version: "2.12.2"
  epoch: 3 # CVE-2025-61730
  description: Kubernetes controller for synchronizing secrets & config maps across namespaces
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mittwald/kubernetes-replicator
      tag: v${{package.version}}
      expected-commit: 69a5350bb5def351f05bece35e2017f0ec6013ef

  - uses: go/build
    with:
      packages: .
      output: kubernetes-replicator
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: mittwald/kubernetes-replicator
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
    environment:
      KUBERNETES_SERVICE_HOST: "127.0.0.1"
      KUBERNETES_SERVICE_PORT: "32764"
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: kubernetes-replicator
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - name: Test controller startup and Kubernetes API connectivity
      uses: test/daemon-check-output
      with:
        setup: |
          # Grant cluster-admin for full access to secrets, configmaps, roles, rolebindings, serviceaccounts
          kubectl create clusterrolebinding test-admin \
            --clusterrole=cluster-admin \
            --serviceaccount=default:default
        start: /usr/bin/kubernetes-replicator
        expected_output: "running"
        timeout: "30"
    - uses: test/go-fips-check
