# Fix CVE-2025-11966 and CVE-2025-11965 in vertx-web
# Also bump netty to 4.2.7.Final to match what vertx 5.0.5 expects
# Bump log4j>=2.25.3 to remediate CVE-2025-68161
properties:
  - property: vertx.version
    value: "5.0.5"
  - property: netty.version
    value: "4.2.7.Final"
  - property: log4j.version
    value: "2.25.3"
