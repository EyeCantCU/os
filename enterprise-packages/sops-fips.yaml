package:
  name: sops-fips
  version: "3.11.0"
  epoch: 7 # CVE-2025-68121
  description: Simple and flexible tool for managing secrets
  copyright:
    - license: MPL-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/getsops/sops
      tag: v${{package.version}}
      # There is a second git-checkout in test pipeline we need to update.
      expected-commit: 168736311794fc9a386ae489d03bcd2cef8bcfba

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      go-package: go-fips
      modroot: .
      tidy: true
      packages: ./cmd/sops
      output: sops

update:
  enabled: true
  github:
    identifier: getsops/sops
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        # NOTE: These cannot be the FIPS variants because the
        # sops_functional_tests_key.asc is a 3DES key.
        - gpg
        - gpg-agent
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: sops
    - uses: test/tw/help-check
      with:
        bins: sops
    - uses: git-checkout
      with:
        repository: https://github.com/getsops/sops
        tag: v${{package.version}}
        expected-commit: 168736311794fc9a386ae489d03bcd2cef8bcfba
    - name: run tests
      runs: |
        set -euo pipefail
        gpg-agent --daemon > /dev/null 2>&1
        gpg --import pgp/sops_functional_tests_key.asc > /dev/null 2>&1

        cd examples/all_in_one
        # Decrypt test file - output shown for debugging if test fails
        sops decrypt config/secret.enc.json
