package:
  name: wave-fips
  version: "0.11.0"
  epoch: 1
  description: Kubernetes configuration tracking controller
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openssl-config-fipshardened

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wave-k8s/wave
      tag: v${{package.version}}
      expected-commit: 1b34ce496b4ddca22e1b856b0c42267340c045a2

  - uses: go/build
    with:
      packages: ./cmd/manager
      output: wave
      ldflags: -w -X main.VERSION=${{package.version}}
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - "wave-"
  github:
    identifier: wave-k8s/wave
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
    environment:
      KUBERNETES_SERVICE_HOST: "127.0.0.1"
      KUBERNETES_SERVICE_PORT: "32764"
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: wave
    - uses: test/tw/help-check
      with:
        bins: wave
    - name: Verify Kubernetes connection error message
      runs: |
        set -euo pipefail
        # wave should fail when no Kubernetes cluster is available
        if output=$(wave 2>&1); then
          echo "FAIL: Expected wave to fail without Kubernetes cluster"
          exit 1
        fi
        # Verify the error message is helpful (fails test if message not found)
        echo "$output" | grep -Fi "try setting KUBERNETES_MASTER environment variable"
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - name: Test wave Kubernetes controller startup
      uses: test/daemon-check-output
      with:
        setup: |
          set -euo pipefail
          # Grant wave controller cluster-admin access for watching resources
          kubectl create clusterrolebinding wave-admin \
            --clusterrole=cluster-admin \
            --serviceaccount=default:default
        start: wave
        expected_output: "Starting Controller"
        timeout: 30
        post: |-
          set -euo pipefail
          # Create a ConfigMap that wave can track
          kubectl create configmap test-config --from-literal=key=value

          # Create a deployment with wave annotation to track config changes
          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: test-wave
            annotations:
              wave.pusher.com/update-on-config-change: "true"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: test-wave
            template:
              metadata:
                labels:
                  app: test-wave
              spec:
                containers:
                - name: nginx
                  image: nginx:latest
                  envFrom:
                  - configMapRef:
                      name: test-config
          EOF

          # Give wave time to process and add its hash annotation
          sleep 5

          # Verify wave added its tracking hash to the deployment (proves controller works)
          kubectl get deployment test-wave -o yaml | grep -F "wave.pusher.com"

environment:
  contents:
    packages:
      - go-fips-1.25
