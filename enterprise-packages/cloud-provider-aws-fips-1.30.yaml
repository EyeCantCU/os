package:
  name: cloud-provider-aws-fips-1.30
  version: "1.30.10"
  epoch: 6
  description: The AWS cloud provider provides the interface between a Kubernetes cluster and AWS service APIs.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - cloud-provider-aws-fips=${{package.full-version}}
  resources:
    cpu: "13"
    memory: 16Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/cloud-provider-aws
      tag: v${{package.version}}
      expected-commit: 50cab0807b2c83d472c006fa3253c76a7d6fd29c

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: tests/e2e

  - runs: |
      # Overwrite existing `replaces` directive, which go/bump can't handle
      sed -i 's|\(golang.org/x/crypto v\)0.17.0|\10.35.0|' go.mod

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/crypto@v0.45.0

subpackages:
  - name: ${{package.name}}-cloud-controller-manager
    description: The AWS Cloud Controller Manager is the controller that is primarily responsible for creating and updating AWS loadbalancers (classic and NLB) and node lifecycle management.
    dependencies:
      provides:
        - cloud-provider-aws-fips-cloud-controller-manager=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/aws-cloud-controller-manager
          output: aws-cloud-controller-manager
          ldflags: |
            -X k8s.io/component-base/version.gitVersion=v${{package.version}}
            -X main.gitVersion=v${{package.version}}
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/help-check
          with:
            bins: aws-cloud-controller-manager
        - name: Verify version embedding
          runs: |
            set -euo pipefail
            # Verify version is properly embedded (fails test if not found)
            aws-cloud-controller-manager --version | grep -F "Kubernetes v${{package.version}}"

  - name: ${{package.name}}-ecr-credential-provider
    description: The credential provider is a binary that is executed by kubelet to provide credentials for images in ECR.
    dependencies:
      provides:
        - cloud-provider-aws-fips-ecr-credential-provider=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/ecr-credential-provider
          output: ecr-credential-provider
          ldflags: |
            -X k8s.io/component-base/version.gitVersion=v${{package.version}}
            -X main.gitVersion=v${{package.version}}
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/help-check
          with:
            bins: ecr-credential-provider
        - name: Verify version embedding
          runs: |
            set -euo pipefail
            # Verify version is properly embedded (fails test if not found)
            ecr-credential-provider --version | grep -F "ecr-credential-provider version v${{package.version}}"

update:
  enabled: true
  github:
    identifier: kubernetes/cloud-provider-aws
    strip-prefix: v
    tag-filter: v1.30.

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage

environment:
  contents:
    packages:
      - go-fips-1.25
