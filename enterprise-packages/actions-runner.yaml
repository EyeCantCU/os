package:
  name: actions-runner
  version: "2.331.0"
  epoch: 1
  description: The Runner for GitHub Actions
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # Exclude nodejs-25 since corepack depends on nodejs (resolves to nodejs-25)
      # and both provide cmd:node, causing resolution conflicts
      - "!nodejs-25"
      - bash
      - busybox
      - ca-certificates-bundle
      - corepack
      - curl
      - docker
      - docker-cli-buildx
      - icu-libs
      - krb5-libs
      - lttng-ust
      - nodejs-24
      - npm
      - openssl
      - posix-libc-utils
      - runner-container-hooks-k8s
      - zlib
  options:
    # Bypass APK dependency resolution to avoid musl conflicts
    # The pre-built runner binaries are statically linked against musl libc,
    # but APK's dependency resolver conflicts with musl package installation
    no-depends: true

vars:
  # github actions-runner targets .NET 8.0, use .NET 8 SDK to match upstream
  # should be bumped according to - https://github.com/actions/runner/blob/main/src/dev.sh#L20
  dotnet-sdk-version: "8"

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - corepack
      - dotnet-${{vars.dotnet-sdk-version}}-sdk
      - nodejs-24
      - nodejs-24-doc # Provides man pages for node externals directory
      - npm
      - runner-container-hooks-k8s

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/actions/runner
      tag: v${{package.version}}
      expected-commit: 39f6c643d3032f8795fa71f1482731ca90c8e038

  - name: Verify .NET SDK version matches upstream
    runs: |
      # Extract .NET SDK version from upstream dev.sh file
      # https://github.com/actions/runner/blob/main/src/dev.sh#L20
      upstream_dotnet_version=$(grep -E "DOTNET_VERSION|dotnet.*version" src/dev.sh | head -1 | sed 's/.*=//' | tr -d '"' | tr -d "'")

      # Convert our version to match upstream format (e.g., "9" -> "9.0")
      our_version="${{vars.dotnet-sdk-version}}.0"

      if [ "$our_version" != "$upstream_dotnet_version" ]; then
        echo "WARNING: Expected .NET SDK version: $our_version from melange.yaml but found $upstream_dotnet_version upstream" >&2
        echo "Consider updating dotnet-sdk-version in vars section" >&2
      else
        echo "✓ .NET SDK version matches upstream: $upstream_dotnet_version"
      fi

  - name: Build from source using our .NET SDK
    runs: |
      # Create the runnerversion file that dev.sh expects
      echo "${{package.version}}" > runnerversion

      # Determine runtime ID based on architecture
      ARCH=${{build.arch}}
      if [[ "$ARCH" == "aarch64" ]]; then
        RUNTIME_ID="linux-arm64"
      elif [[ "$ARCH" == "x86_64" ]]; then
        RUNTIME_ID="linux-x64"
      fi

      # Build the runner using dotnet msbuild directly
      # bypass dev.sh and call MSBuild targets directly to use our dotnet-sdk and nodejs
      dotnet msbuild -t:Build -p:PackageRuntime="${RUNTIME_ID}" -p:BUILDCONFIG="Release" -p:RunnerVersion="${{package.version}}" src/dir.proj

      # Create layout using dotnet msbuild
      dotnet msbuild -t:layout -p:PackageRuntime="${RUNTIME_ID}" -p:BUILDCONFIG="Release" -p:RunnerVersion="${{package.version}}" src/dir.proj

  - name: Copy k8s container hooks
    runs: |
      mkdir -p _layout/k8s _layout/k8s-novolume
      cp /usr/share/actions-runner-container-hooks/k8s/index.js _layout/k8s/index.js
      cp /usr/share/actions-runner-container-hooks/k8s/index.js _layout/k8s-novolume/index.js

  - name: Setup externals/node24
    runs: |
      # the upstream has /externals directory, which has node binary, instead of running the upstream
      # script which downloads pre-built release, we are using our own nodejs-24
      # and creating the directory structure
      mkdir -p _layout/externals/node24/bin
      mkdir -p _layout/externals/node24/include
      mkdir -p _layout/externals/node24/lib/node_modules
      mkdir -p _layout/externals/node24/share

      # Copy node binary
      cp /usr/bin/node _layout/externals/node24/bin/node
      chmod +x _layout/externals/node24/bin/node

      # Copy node /includes and /share files
      cp -r /usr/include/node _layout/externals/node24/include/
      cp -r /usr/share/man _layout/externals/node24/share/
      cp -r /usr/share/doc/node _layout/externals/node24/share/

      # Copy npm and corepack modules
      cp -r /usr/lib/node_modules/npm _layout/externals/node24/lib/node_modules/
      cp -r /usr/share/node_modules/corepack _layout/externals/node24/lib/node_modules/

      # Fix CVE-2026-24842: Update tar dependency to 7.5.7
      # Use npm pack to download tarball without resolving npm's internal dependencies
      npm pack tar@7.5.7 --pack-destination=/tmp
      rm -rf _layout/externals/node24/lib/node_modules/npm/node_modules/tar
      mkdir -p _layout/externals/node24/lib/node_modules/npm/node_modules/tar
      tar -xzf /tmp/tar-7.5.7.tgz -C _layout/externals/node24/lib/node_modules/npm/node_modules/tar --strip-components=1
      rm /tmp/tar-7.5.7.tgz

      ln -sf ../lib/node_modules/npm/bin/npm-cli.js _layout/externals/node24/bin/npm
      ln -sf ../lib/node_modules/npm/bin/npx-cli.js _layout/externals/node24/bin/npx

      ln -sf ../lib/node_modules/corepack/dist/corepack.js _layout/externals/node24/bin/corepack

  - name: Install files and fix lib
    runs: |
      mkdir -p "${{targets.destdir}}/usr/share/actions-runner"
      cp -r _layout/* "${{targets.destdir}}/usr/share/actions-runner/"

      # .NET expects liblttng-ust.so.0 but we have liblttng-ust.so.1
      mkdir -p "${{targets.destdir}}/usr/lib"
      ln -sf liblttng-ust.so.1 "${{targets.destdir}}/usr/lib/liblttng-ust.so.0"

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility package for the ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/home"
          ln -sf /usr/share/actions-runner "${{targets.contextdir}}/home/runner"
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
            - nodejs-24
            - runner-container-hooks-k8s
      pipeline:
        - runs: |
            test -L /home/runner
            test "$(readlink /home/runner)" = "/usr/share/actions-runner"
            test -d /home/runner/externals/node24
            test -f /home/runner/externals/node24/bin/node
            test -d /home/runner/k8s
            test -d /home/runner/k8s-novolume

update:
  enabled: true
  github:
    identifier: actions/runner
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - python3
        - wait-for-it
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        # Core testing requires github credentials, testing is limited to binary check
        /usr/share/actions-runner/bin/Runner.Listener --version | grep ${{package.version}}
        test -x /usr/share/actions-runner/run.sh

        export RUNNER_ALLOW_RUNASROOT=1
        /usr/share/actions-runner/config.sh --help | grep -q "Configures the runner"

        # configuration process with mock server to validate authentication flow
        # Start mock server and wait for it to be ready
        python3 /home/build/mock-server.py &
        mock_pid=$!
        wait-for-it -t 10 localhost:8080

        # with timeout to prevent hanging
        timeout 30s /usr/share/actions-runner/config.sh --unattended --url http://localhost:8080/fake --token dummy --name test --work /tmp --labels self-hosted,linux | grep -q "Self-hosted runner registration"

        # Cleanup mock server
        kill $mock_pid
