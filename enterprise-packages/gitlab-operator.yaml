package:
  name: gitlab-operator
  version: "2.9.0"
  epoch: 0 # CVE-2025-68121
  description: Kubernetes Operator for GitLab Server
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - helm

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/gitlab-org/cloud-native/gitlab-operator
      tag: ${{package.version}}
      expected-commit: 8c39f1a5ec2ace80d538e70af42331119f9e765f

  - uses: go/build
    with:
      packages: .
      output: manager

subpackages:
  # GitLab Operator requires specific bundled Helm chart versions (from CHART_VERSIONS) to function.
  # Packaging charts separately would risk version mismatches due to independent release cycles
  # See: https://github.com/chainguard-dev/image-requests/issues/6541#issuecomment-3478074177
  - name: ${{package.name}}-charts
    description: "Pre-packaged GitLab Helm charts for the GitLab Operator"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/charts
          helm repo add gitlab https://charts.gitlab.io/
          helm repo update
          cat CHART_VERSIONS | xargs -I {} helm fetch gitlab/gitlab --version {} --destination ${{targets.contextdir}}/charts/
    test:
      environment:
        contents:
          packages:
            - curl
      pipeline:
        - runs: |
            chart_versions=$(curl -sSL https://gitlab.com/gitlab-org/cloud-native/gitlab-operator/-/raw/${{package.version}}/CHART_VERSIONS)

            for version in ${chart_versions}; do
              [[ -f "/charts/gitlab-${version}.tgz" ]]
            done

            for chart in /charts/gitlab-*.tgz; do
              tar -tzf "${chart}" | grep "gitlab/Chart.yaml"
            done

  - name: ${{package.name}}-compat
    description: "Compatibility package for GitLab Operator"
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/
          ln -sf /usr/bin/manager "${{targets.contextdir}}"/manager
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  git: {}

test:
  environment:
    contents:
      packages:
        - mkcert
        - curl
        - gitlab-operator-charts
  pipeline:
    # manager does not have a version flag
    - uses: test/tw/help-check
      with:
        bins: manager
        expect-contains: "Usage of manager"
    - uses: test/kwok/cluster
    - name: Apply CRDs
      runs: |
        set -o pipefail
        kubectl apply -f https://gitlab.com/gitlab-org/cloud-native/gitlab-operator/-/raw/master/deploy/chart/crds/gitlab.yaml
    - name: Test operator daemon
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /tmp/k8s-webhook-server/serving-certs/
          mkcert -install
          mkcert -key-file /tmp/k8s-webhook-server/serving-certs/tls.key \
                 -cert-file /tmp/k8s-webhook-server/serving-certs/tls.crt \
                 localhost

          # downloading the manifest to create a gitlab custom resource
          CHART_VERSION=$(curl -sSL https://gitlab.com/gitlab-org/cloud-native/gitlab-operator/-/raw/${{package.version}}/CHART_VERSIONS | head -n1)
          curl -sSL https://gitlab.com/gitlab-org/cloud-native/gitlab-operator/-/raw/${{package.version}}/config/samples/gitlab.yaml -o /tmp/gitlab-test.yaml

          sed -i "s/X.Y.Z/${CHART_VERSION}/" /tmp/gitlab-test.yaml
          sed -i "s/configureCertmanager: true/configureCertmanager: false/" /tmp/gitlab-test.yaml
        start: manager
        timeout: 30
        expected_output: |
          chart added to the catalog
          starting manager
          Starting webhook server
          Starting Controller
          Starting workers
        post: |
          curl -fsSL http://localhost:6060/liveness
          kubectl apply -f /tmp/gitlab-test.yaml
          kubectl get gitlab gitlab
          # Only checking if Gitlab initializes, since it needs jobs to become Available
          phase=$(kubectl get gitlab gitlab -o jsonpath='{.status.phase}')
          [[ "$phase" == "Preparing" || "$phase" == "Initialized" ]]
