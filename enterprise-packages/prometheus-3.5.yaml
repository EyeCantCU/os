package:
  name: prometheus-3.5
  version: "3.5.1"
  epoch: 0 # GHSA-j5w8-q4qc-rx2x
  description: The Prometheus monitoring system and time series database.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - prometheus=${{package.full-version}}
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - go
      - nodejs
      - npm

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7d42ddfaad88c3a1fd52236e5a7707315c58e84d
      repository: https://github.com/prometheus/prometheus
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: documentation/examples/remote_storage

  - uses: go/bump
    with:
      deps: |-
        github.com/docker/docker@v28.3.3
        golang.org/x/crypto@v0.45.0
      modroot: internal/tools

  - uses: go/bump
    with:
      deps: |-
        github.com/go-viper/mapstructure/v2@v2.4.0
        golang.org/x/crypto@v0.45.0

  - uses: patch
    with:
      patches: disable-pprof.patch

  - runs: |
      GOLDFLAGS="-X github.com/prometheus/common/version.Version=${{package.version}}
        -X github.com/prometheus/common/version.Revision=WolfiLinux
        -X github.com/prometheus/common/version.Branch=master
        -X github.com/prometheus/common/version.BuildUser=$USER@$(hostname)
        -X github.com/prometheus/common/version.BuildDate=$(date -u "+%Y%m%d-%H:%M:%S" ${SOURCE_DATE_EPOCH:+-d @$SOURCE_DATE_EPOCH})
      "
      if [ -n "$LDFLAGS" ]; then
        # LDFLAGS (and only LDFLAGS) should be passed to -extldflags.
        GOLDFLAGS="$GOLDFLAGS -extldflags '$LDFLAGS'"
      fi

      # set -j1 to run things in the correct order in makefile
      # actual go building is still parallel
      make -j1 assets-compress

      go build \
        -trimpath \
        -mod=readonly \
        -ldflags "$GOLDFLAGS" \
        -tags netgo,builtinassets \
        ./cmd/prometheus
      go build \
        -trimpath \
        -mod=readonly \
        -ldflags "$GOLDFLAGS" \
        ./cmd/promtool

  - runs: |
      install -Dm755 prometheus "${{targets.destdir}}"/usr/bin/prometheus
      install -Dm755 promtool "${{targets.destdir}}"/usr/bin/promtool

      install -Dm644 prometheus.confd \
        "${{targets.destdir}}"/etc/conf.d/prometheus

      install -dm644 "${{targets.destdir}}"/var/lib/prometheus/data

      install -Dm644 -t "${{targets.destdir}}"/etc/prometheus \
        documentation/examples/prometheus.yml

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    dependencies:
      runtime:
        - ${{package.name}}
      provides:
        - prometheus-iamguarded-compat=${{package.full-version}}
    description: "compat package for iamguarded"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: prometheus
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /opt/iamguarded/prometheus/bin/
          mkdir -p /opt/iamguarded/prometheus/conf
          mkdir -p /opt/iamguarded/prometheus/data

          chmod g+rwX /opt/iamguarded

          ln -sf /usr/bin/prometheus /opt/iamguarded/prometheus/bin/prometheus
          ln -sf /usr/bin/promtool /opt/iamguarded/prometheus/bin/promtool
          cp -r ${{targets.destdir}}/etc/prometheus/* /opt/iamguarded/prometheus/conf/
          cp -r ${{targets.destdir}}/var/lib/prometheus/data /opt/iamguarded/prometheus/data
      - uses: iamguarded/finalize-compat
        with:
          package: prometheus
          version: ${{vars.major-version}}
    test:
      pipeline:
        - runs: |
            stat /opt/iamguarded/prometheus/bin/prometheus
            stat /opt/iamguarded/prometheus/bin/promtool
            /opt/iamguarded/prometheus/bin/prometheus --version
            /opt/iamguarded/prometheus/bin/promtool --version
        - uses: iamguarded/test-compat
          with:
            package: prometheus
            version: ${{vars.major-version}}

update:
  ignore-regex-patterns:
    - '\+stringlabels' # looks like stringlabels are still experimental, let's stick to the main version stream.
  enabled: true
  github:
    identifier: prometheus/prometheus
    strip-prefix: v
    tag-filter-prefix: v3.5

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - name: Check Prometheus Rules
      runs: |
        cat << 'EOF' > rules.example
        groups:
        - name: http
          rules:
          - record: job:http_inprogress_requests:sum
            expr: sum(http_inprogress_requests) by (job)
        EOF
        promtool check rules rules.example
        prometheus --version
        prometheus --help
        promtool --version
        promtool --help
    - name: Verify Prometheus Scrape Store Query Pipeline
      uses: test/daemon-check-output
      with:
        setup: |
          # Create config for prometheus to scrape itself
          cat << 'EOF' > /tmp/prometheus.yml
          global:
            scrape_interval: 5s
            evaluation_interval: 5s

          scrape_configs:
            - job_name: "prometheus"
              static_configs:
              - targets: ["localhost:9090"]
          EOF
          mkdir -p /tmp/prometheus-data
        start: /usr/bin/prometheus --config.file=/tmp/prometheus.yml --web.listen-address=127.0.0.1:9090 --storage.tsdb.path=/tmp/prometheus-data
        expected_output: "Server is ready to receive web requests"
        timeout: "60"
        post: |
          # Wait for port to be fully ready
          wait-for-it localhost:9090 -t 30

          # Verify health endpoint
          curl -s "http://127.0.0.1:9090/-/healthy" | grep -q "Prometheus Server is Healthy."
          echo "Health check passed"

          # Wait for at least one scrape cycle to complete (5s scrape_interval + buffer)
          echo "Waiting for scrape cycle to complete..."
          sleep 10

          # Query the 'up' metric to verify scraping works
          # The 'up' metric should be 1 if prometheus successfully scraped itself
          up_result=$(curl -s "http://127.0.0.1:9090/api/v1/query?query=up")
          echo "Query result for 'up' metric: $up_result"

          # Verify we got successful response and the metric value is 1 (target is up)
          echo "$up_result" | grep -q '"status":"success"'
          echo "API query returned success status"

          echo "$up_result" | grep -q '"value":\[.*,"1"\]'
          echo "Prometheus successfully scraped itself (up=1)"

          # Query prometheus internal metrics to verify time series database is storing data
          prom_metrics=$(curl -s "http://127.0.0.1:9090/api/v1/query?query=prometheus_tsdb_head_samples_appended_total")
          echo "TSDB samples appended: $prom_metrics"
          echo "$prom_metrics" | grep -q '"status":"success"'
          echo "TSDB metrics query successful - time series database is operational"

          # Query scrape duration to confirm complete scrape pipeline
          scrape_duration=$(curl -s "http://127.0.0.1:9090/api/v1/query?query=scrape_duration_seconds")
          echo "Scrape duration metrics: $scrape_duration"
          echo "$scrape_duration" | grep -q '"status":"success"'
          echo "Scrape duration metric available - full scrape pipeline verified"

          echo "All Prometheus core functionality tests passed: scrape -> store -> query pipeline verified"
        error_strings: ""
