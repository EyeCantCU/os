#nolint:valid-pipeline-fetch-digest
package:
  # body-type-number
  name: NIST-CMVP-5132
  # v1 of nist meta-packages
  version: 1
  epoch: 0
  # Many SCA tools know how to read APK URL
  # URL to the certificate
  url: https://csrc.nist.gov/projects/cryptographic-module-validation-program/certificate/5132
  # Some tools use description
  # body, type, number, certificate name, standard
  description: "NIST CMVP 5132 Chainguard FIPS Provider for OpenSSL (FIPS 140-3) metapackage"
  copyright:
    # NIST information is all public
    - license: NIST-PD
  dependencies:
    runtime:
      # Statically linked entropy source
      - NIST-ESV-191
      # Strict dependency on the actual module
      - openssl-provider-fips-3.4.0=3.4.0-r4

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      # Note this URL will make it into package SPDX SBOM, and will also make it into APKO SBOM
      uri: https://csrc.nist.gov/projects/cryptographic-module-validation-program/certificate/5132
      # Unstable content, thus no expected checksum and hence the nolint too
      expected-none: true
      extract: false
      delete: true

test:
  pipeline:
    - uses: test/tw/metapackage
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 5132

update:
  enabled: false
  exclude-reason: "This is an empty NIST CMVP certificate SBOM indicator"
