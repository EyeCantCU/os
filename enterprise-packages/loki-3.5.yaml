package:
  name: loki-3.5
  version: "3.5.10"
  epoch: 0
  description: Like Prometheus, but for logs.
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    provides:
      - loki=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go
      - ruby-${{vars.ruby-version}}
      - ruby-${{vars.ruby-version}}-dev

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+$
    replace: "$1"
    to: major-version

vars:
  gem: fluent-plugin-grafana-loki
  ruby-version: "3.2"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: bda4b6bcfdaa3da472890d019884f94bc507962c
      repository: https://github.com/grafana/loki
      tag: v${{package.version}}

  - uses: autoconf/make
    with:
      opts: |
        UNAME_S=$(uname -s)

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      mv cmd/loki/loki ${{targets.contextdir}}/usr/bin/loki

      # Add the default config
      mkdir -p ${{targets.contextdir}}/etc/loki
      mv cmd/loki/loki-local-config.yaml ${{targets.contextdir}}/etc/loki/local-config.yaml

  - uses: strip

subpackages:
  - name: ${{package.name}}-logcli
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mv cmd/logcli/logcli ${{targets.contextdir}}/usr/bin/logcli
    dependencies:
      provides:
        - logcli=${{package.full-version}}
    test:
      pipeline:
        - runs: |
            logcli --version

  - name: ${{package.name}}-promtail
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mv clients/cmd/promtail/promtail ${{targets.contextdir}}/usr/bin/promtail

          mkdir -p ${{targets.contextdir}}/etc/promtail
          mv clients/cmd/promtail/promtail-local-config.yaml ${{targets.contextdir}}/etc/promtail/config.yml
    dependencies:
      provides:
        - promtail=${{package.full-version}}
    test:
      pipeline:
        - runs: |
            promtail --version

  - name: ${{package.name}}-loki-canary
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mv cmd/loki-canary/loki-canary ${{targets.contextdir}}/usr/bin/loki-canary
    dependencies:
      provides:
        - loki-canary=${{package.full-version}}
    test:
      pipeline:
        - runs: |
            loki-canary --version

  - name: ruby${{vars.ruby-version}}-${{vars.gem}}-${{vars.major-minor-version}}
    pipeline:
      - runs: |
          # extract gem version from gemspec
          export GEM_VERSION=$(grep "spec.version" clients/cmd/fluentd/${{vars.gem}}.gemspec | sed -n "s/.*spec.version *= *['\"]\\([^'\"]*\\)['\"].*/\\1/p")
          gem install --install-dir="${{targets.contextdir}}/usr/lib/ruby/gems/${{vars.ruby-version}}.0" \
            --bindir="${{targets.contextdir}}/usr/bin" \
            --ignore-dependencies \
            --no-document \
            ${{vars.gem}} -v $GEM_VERSION
      - uses: ruby/clean
    dependencies:
      provides:
        - fluent-plugin-grafana-${{package.name}}=${{package.full-version}}
        - ruby${{vars.ruby-version}}-${{vars.gem}}=${{package.full-version}}
      runtime:
        - ruby${{vars.ruby-version}}-fluentd
    test:
      environment:
        contents:
          packages:
            - ruby-${{vars.ruby-version}}
      pipeline:
        - runs: |
            ruby -e "require 'fluent/plugin/out_loki'"

  - name: ${{package.name}}-iamguarded-compat
    dependencies:
      runtime:
        - ${{package.name}}
        - ${{package.name}}-logcli
      provides:
        - loki-iamguarded-compat=${{package.full-version}}
    options:
      no-provides: true
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: grafana-loki
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p "/opt/iamguarded/grafana-loki/bin"
          mkdir -p "/iamguarded/grafana-loki/wal"
          mkdir -p "/iamguarded/grafana-loki/data"
          mkdir -p "/iamguarded/grafana-loki/loki"
          ln -s "../../../../usr/bin/loki" "/opt/iamguarded/grafana-loki/bin/loki"
          ln -s "../../../../usr/bin/logcli" "/opt/iamguarded/grafana-loki/bin/logcli"
          ln -s "/opt/iamguarded/grafana-loki/wal" "/wal"
          ln -s "/opt/iamguarded/grafana-loki/data" "/data"
          ln -s "/opt/iamguarded/grafana-loki/loki" "/loki"
      - uses: iamguarded/finalize-compat
        with:
          package: grafana-loki
          version: ${{vars.major-version}}
    # Note: we are not testing with daemon-check-output because the iamguarded image is just a binary with some symlinks
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: grafana-loki
            version: ${{vars.major-version}}
        - uses: test/tw/symlink-check
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: loki-iamguarded-compat
            real-pkg-name: ${{subpkg.name}}

update:
  enabled: true
  github:
    identifier: grafana/loki
    strip-prefix: v
    tag-filter: v3.5

test:
  environment:
    contents:
      packages:
        - curl
    environment:
      LOKI_PORT: "3100"
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: loki
    - name: Verify Loki server starts and accepts logs
      uses: test/daemon-check-output
      with:
        setup: |-
          # We have to fix the config due to a deprecated value: https://github.com/grafana/loki/issues/16990
          sed -i '/enable_multi_variant_queries: true/d' /etc/loki/local-config.yaml
        start: loki -config.file=/etc/loki/local-config.yaml -config.expand-env=true
        expected_output: "server listening on addresses"
        timeout: 60
        post: |-
          set -euo pipefail
          # Wait for Loki to be fully ready
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors "http://localhost:${LOKI_PORT}/ready"
          # Push test logs
          curl -f -X POST "http://localhost:${LOKI_PORT}/loki/api/v1/push" \
            -H "Content-Type: application/json" \
            -d '{
              "streams": [
                {
                  "stream": {"job": "test", "level": "info"},
                  "values": [["'$(date +%s)000000000'", "test log message"]]
                }
              ]
            }'
          # Verify metrics endpoint
          curl -f "http://localhost:${LOKI_PORT}/metrics" | grep -F "loki_"
