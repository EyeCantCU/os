package:
  name: kube-logging-operator-custom-runner-fips
  version: "0.14.0"
  epoch: 3 # CVE-2025-61732
  description: Logging operator for Kubernetes - go custom runner
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kube-logging/custom-runner
      tag: v${{package.version}}
      expected-commit: d9ad8a14935d336d22238ddd27588c93f703c797

  - uses: go/build
    with:
      packages: .
      go-package: go-fips
      output: logging-operator-custom-runner

update:
  enabled: true
  github:
    identifier: kube-logging/custom-runner
    strip-prefix: v

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package for ${{package.name}}"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/
          ln -s ../usr/bin/logging-operator-custom-runner ${{targets.subpkgdir}}/runner
    dependencies:
      provides:
        - ${{package.name}}-entrypoint=${{package.full-version}}
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
        - uses: test/tw/help-check
          with:
            bins: /runner

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/daemon-check-output
      with:
        start: |
          logging-operator-custom-runner -cfgjson '{"events": {"onStart": [{"exec": {"command": "echo ONSTART_EVENT_EXECUTED && touch /tmp/onstart.marker"}}]}}'
        timeout: 60
        expected_output: |
          ONSTART_EVENT_EXECUTED
        post: |-
          set -euo pipefail
          # Verify onStart event handler created marker file (fails test if missing)
          stat /tmp/onstart.marker
          echo "SUCCESS: custom-runner onStart event executed correctly"
