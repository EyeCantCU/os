package:
  name: grafana-operator-fips
  version: "5.22.0"
  epoch: 0 # CVE-2025-68121
  description: An operator for Grafana that installs and manages Grafana instances, Dashboards and Datasources through Kubernetes/OpenShift CRs
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana-operator/grafana-operator
      tag: v${{package.version}}
      expected-commit: b429654470f29d9afd96aa0fa23ee5b9459576e5

  - uses: go/build
    with:
      modroot: .
      packages: .
      output: grafana-operator
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: grafana-operator/grafana-operator
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - bash
        - curl
        - jq
        - git
        - kubectl
        - kustomize
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: grafana-operator
    - uses: test/kwok/cluster
    - name: "Start and verify operator"
      uses: test/daemon-check-output
      with:
        setup: |
          set -euo pipefail
          git clone --depth=1 --branch v${{package.version}} https://github.com/grafana-operator/grafana-operator.git
          kubectl create -f grafana-operator/deploy/kustomize/base/crds.yaml
          kubectl create namespace grafana-operator-system
        start: |
          grafana-operator \
            --metrics-bind-address=:8080 \
            --health-probe-bind-address=:8081 \
            --leader-elect=false
        timeout: 30
        expected_output: |
          starting server
          Starting Controller
          Starting workers
        post: |
          set -euo pipefail
          curl --silent --fail http://localhost:8080/metrics
          curl --silent --fail http://localhost:8081/healthz
