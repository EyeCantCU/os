package:
  name: hydra-fips
  version: "25.4.0"
  epoch: 8 # GHSA-9h8m-3fm2-qjrq
  description: OpenID Certified OAuth 2.0 Server and OpenID Connect Provider
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "7"
    memory: 9Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ory/hydra
      tag: v${{package.version}}
      expected-commit: de9baaa9bc1b1865710d4e07e4bd0c4aca599447

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        filippo.io/edwards25519@v1.1.1
        go.opentelemetry.io/otel/sdk@v1.40.0
      modroot: oryx

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        filippo.io/edwards25519@v1.1.1
        github.com/cloudflare/circl@v1.6.3
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      packages: .
      output: hydra
      ldflags: |
        -X 'github.com/ory/hydra/v2/driver/config.Version=$(git describe --abbrev=0 --tags)'
        -X 'github.com/ory/hydra/v2/driver/config.Date=$(TZ=UTC date -d@${SOURCE_DATE_EPOCH} -u "+%Y-%m-%dT%H:%M:%SZ")'
        -X 'github.com/ory/hydra/v2/driver/config.Commit=$(git rev-parse HEAD)'
      tags: sqlite,json1,hsm
      go-package: go-fips

update:
  enabled: true
  ignore-regex-patterns:
    - rc*
    - pre*
  github:
    identifier: ory/hydra
    strip-prefix: v

test:
  environment:
    environment:
      DSN: memory
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: hydra
    - uses: test/tw/help-check
      with:
        bins: hydra
    - name: "Test database migration"
      runs: |
        set -euo pipefail
        # Verify database migration completes successfully (fails test if migration fails)
        /usr/bin/hydra migrate sql up -e --yes
    - name: "Start server and test"
      uses: test/daemon-check-output
      with:
        start: /usr/bin/hydra serve all --dev
        timeout: "30"
        expected_output: |
          DSN is memory
          running migration
          networks applied successfully
          client applied successfully
          Thank you for using Ory Hydra
        post: |-
          set -euo pipefail
          # Verify health endpoint responds (fails test on HTTP error or timeout)
          curl -sf http://localhost:4444/health/alive
