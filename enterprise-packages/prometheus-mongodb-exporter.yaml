package:
  name: prometheus-mongodb-exporter
  version: "0.49.0"
  epoch: 1 # GHSA-9h8m-3fm2-qjrq
  description: A Prometheus exporter for MongoDB including sharding, replication and storage engines
  copyright:
    - license: Apache-2.0
  dependencies:
    # REMOVE_POST_USRMERGE - https://github.com/orgs/wolfi-dev/discussions/40270
    provides:
      - prometheus-mongodb-exporter-iamguarded-compat=${{package.full-version}}
    runtime:
      - merged-bin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/percona/mongodb_exporter
      expected-commit: 934212d3dcf79334e51af934a0968314aae3ca8c
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.40.0

  - runs: |
      make build
      mkdir -p ${{targets.destdir}}/usr/bin
      mv mongodb_exporter ${{targets.destdir}}/usr/bin/

  - uses: strip

update:
  enabled: true
  github:
    identifier: percona/mongodb_exporter
    strip-prefix: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        mongodb_exporter --version
        mongodb_exporter --help
