package:
  name: temporal-ui-server-fips
  version: "2.44.1"
  epoch: 0 # CVE-2025-61729
  description: Golang Server for https://github.com/temporalio/ui
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/temporalio/ui-server
      tag: v${{package.version}}
      expected-commit: 97ce579174740f2f72e0d239ed262aa5a64a8e09

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: ./cmd/server
      output: ui-server
      ldflags: -w
      go-package: go-fips
      tidy: "true"

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        ui-server --version
        ui-server --help

update:
  enabled: true
  github:
    identifier: temporalio/ui-server
    strip-prefix: v
    use-tag: true
    tag-filter: v
