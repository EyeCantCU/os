package:
  name: temporal-ui-server-fips
  version: "2.45.3"
  epoch: 0 # go/enterprise-rsc/temporal-ui-server-fips
  description: Golang Server for https://github.com/temporalio/ui
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 4Gi
    disk: 10Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/temporalio/ui-server
      tag: v${{package.version}}
      expected-commit: 83d31b358bfc5bf5df77c324cbdb5cf1f28eeae8

  - uses: go/build
    with:
      packages: ./cmd/server
      output: ui-server
      ldflags: -w
      go-package: go-fips
      tidy: "true"

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        ui-server --version
        ui-server --help

update:
  enabled: true
  github:
    identifier: temporalio/ui-server
    strip-prefix: v
    use-tag: true
    tag-filter: v
