package:
  name: temporal-ui-server-fips
  version: "2.45.4"
  epoch: 0 # go/enterprise-rsc/temporal-ui-server-fips
  description: Golang Server for https://github.com/temporalio/ui
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 4Gi
    disk: 10Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/temporalio/ui-server
      tag: v${{package.version}}
      expected-commit: d0a1c672dc6c0e905d72b92f0c45c4963b2d1f96

  - uses: go/build
    with:
      packages: ./cmd/server
      output: ui-server
      ldflags: -w
      go-package: go-fips
      tidy: "true"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: ui-server
    - uses: test/tw/help-check
      with:
        bins: ui-server
    - name: Verify ui-server daemon startup
      uses: test/daemon-check-output
      with:
        start: /usr/bin/ui-server
        expected_output: |
          server
        timeout: 30
        error_strings: ""
        post: |
          set -euo pipefail
          # Daemon started and is producing log output
          echo "SUCCESS: ui-server daemon started successfully"

update:
  enabled: true
  github:
    identifier: temporalio/ui-server
    strip-prefix: v
    use-tag: true
    tag-filter: v
