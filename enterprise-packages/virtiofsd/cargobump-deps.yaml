  # clap 4.5.20+ uses anstream 0.6.8+ which fixes the vulnerability
  # This also updates rustix to a version that fixes CVE-2024-43806
  - name: clap
    version: 4.5.23
  # Note: atty (GHSA-g98v-hv3f-hcfr) is Low severity and would require
  # patching Cargo.toml to update env_logger 0.8 -> 0.11, which may
  # introduce breaking changes. Leaving for upstream to address.
