package:
  name: py3-cqlsh
  version: "6.2.0"
  epoch: 0
  description: Cassandra CQL shell - command-line client for CQL on Cassandra/Scylla clusters
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: cqlsh

environment:
  contents:
    packages:
      - busybox
      - py3-supported-build-base
      - py3-supported-python-dev
      - uv

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jeffwidman/cqlsh
      tag: ${{package.version}}
      expected-commit: 42c7296a359ad9438f3da090b65f4d5e534e0743

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: auth/uv
        with:
          allow-fallback-indexes: true
      - runs: |
          uv pip install "${{vars.pypi-package}}==${{package.version}}" --system --prefix "${{targets.contextdir}}/usr" --python ${{range.key}}
      - runs: |
          # Remove uv lockfile (world-writable, triggers linter)
          rm -f "${{targets.contextdir}}/usr/.lock"
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: test/tw/ldd-check

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
        - python-${{range.key}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: cqlsh
        - uses: test/tw/ver-check
          with:
            bins: cqlsh

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  github:
    identifier: jeffwidman/cqlsh

test:
  pipeline:
    - uses: test/tw/byproductpackage
