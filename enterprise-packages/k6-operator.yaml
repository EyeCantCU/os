package:
  name: k6-operator
  version: "1.2.0"
  epoch: 3 # GHSA-9h8m-3fm2-qjrq
  description: A Kubernetes operator for orchestrating distributed load testing with k6
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/k6-operator
      tag: v${{package.version}}
      expected-commit: 925e2a750ca572a4ff3f0414c4b11dd649d040cb

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      packages: ./cmd/main.go
      output: manager

subpackages:
  - name: ${{package.name}}-compat
    dependencies:
      runtime:
        - ${{package.name}}
    description: Compatibility package to provide binary at expected upstream location
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}
          ln -sf /usr/bin/manager ${{targets.subpkgdir}}/manager
    test:
      pipeline:
        - runs: |
            [ "$(readlink -f /manager)" = "/usr/bin/manager" ]

  - name: ${{package.name}}-starter
    dependencies:
      runtime:
        # the starter container command as ["sh", "-c", "curl ..."] in starter.go, requiring /bin/sh to be present.
        - dash-binsh
        - curl
        - curl-oci-entrypoint
        - scuttle
    description: k6-operator starter component with curl and scuttle
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}
    test:
      pipeline:
        - uses: test/emptypackage

  - name: ${{package.name}}-runner
    dependencies:
      runtime:
        - k6
        - scuttle
    description: k6-operator runner component with k6 and scuttle
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}
    test:
      pipeline:
        - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: grafana/k6-operator
    strip-prefix: v
    tag-filter: v
  ignore-regex-patterns:
    - helm-.*
    - rc.*

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
    environment:
      METRICS_PORT: "8080"
      HEALTH_PORT: "8081"
  pipeline:
    - name: Check version and help output
      runs: |
        set -o pipefail
        manager --help 2>&1 | grep -F "manager"
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - name: Apply CRDs and test operator startup
      runs: |
        set -o pipefail

        kubectl apply -f https://raw.githubusercontent.com/grafana/k6-operator/v${{package.version}}/config/crd/bases/k6.io_testruns.yaml
        kubectl apply -f https://raw.githubusercontent.com/grafana/k6-operator/v${{package.version}}/config/crd/bases/k6.io_privateloadzones.yaml
        kubectl create namespace k6-operator-system
    - name: Test operator daemon
      uses: test/daemon-check-output
      with:
        start: manager
        timeout: 30
        expected_output: |
          starting manager
          controller-runtime.metrics
          Starting metrics server
          Starting EventSource
          Starting Controller
          Starting workers
        post: |
          set -o pipefail
          wait-for-it "localhost:${METRICS_PORT}" -t 30
          curl -fsSL "localhost:${METRICS_PORT}/metrics" | grep -F "controller_runtime_reconcile_total"
          curl -fsSL "localhost:${METRICS_PORT}/metrics" | grep -F "controller_runtime_active_workers"
          curl -fsSL "localhost:${METRICS_PORT}/metrics" | grep -F "workqueue_adds_total"
