package:
  name: minify-fips
  version: "2.24.10"
  epoch: 0 # CVE-2025-61732
  description: "Go minifiers for web formats"
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tdewolff/minify
      tag: v${{package.version}}
      expected-commit: 9fb8080ae36721f60899ff40c5eeba8893bd8655

  - uses: go/build
    with:
      packages: ./cmd/minify
      output: minify
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: tdewolff/minify
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        minify --help
    - runs: |
        minify --version
