package:
  name: k8s-driver-manager
  version: 0.9.1
  epoch: 0
  description: Kubernetes component for seamless upgrades of NVIDIA drivers on cluster nodes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/k8s-driver-manager
      tag: v${{package.version}}
      expected-commit: be979ef08699fac8a83f2ffb85fa1ff3d606ba20

  - uses: go/build
    with:
      packages: ./cmd/driver-manager
      output: driver-manager
      ldflags: |
        -X github.com/NVIDIA/k8s-driver-manager/internal/info.version=${{package.version}}
        -X github.com/NVIDIA/k8s-driver-manager/internal/info.gitCommit=$(git rev-parse HEAD)

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: driver-manager
    - uses: test/tw/ver-check
      with:
        bins: driver-manager
    - name: Verify driver-manager subcommands
      runs: |
        driver-manager --help | grep -F "preflight_check"
        driver-manager --help | grep -F "uninstall_driver"
    - uses: test/kwok/cluster
    - name: Test preflight_check with kubeconfig
      runs: |
        export NODE_NAME=$(kubectl get nodes -o jsonpath='{.items[0].metadata.name}')
        driver-manager --kubeconfig="$HOME/.kube/config" preflight_check 2>&1 | grep -F "Preflight checks completed"
