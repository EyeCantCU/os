package:
  name: chart-iamguarded-mongodb-sharded
  version: "9.4.12"
  epoch: 0
  description: mongodb-sharded iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: mongodb-sharded/${{package.version}}
      expected-commit: 2e5bcf4b7624c06b906d46b1270be10b56c04243

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/mongodb-sharded

  - uses: charts/package
    with:
      chart-path: iamguarded/mongodb-sharded

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: mongodb-sharded/
    use-tag: true
    tag-filter-prefix: mongodb-sharded/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /mongodb-sharded
