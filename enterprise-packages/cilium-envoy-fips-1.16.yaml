#nolint:valid-pipeline-git-checkout-commit,valid-pipeline-git-checkout-tag
package:
  name: cilium-envoy-fips-1.16
  version: "1.16.19"
  epoch: 3 # CVE-2025-61732
  description: Envoy with additional cilium plugins
  copyright:
    - license: Apache-2.0
  resources:
    cpu: 20
    memory: 50Gi
  dependencies:
    provides:
      - cilium-envoy-fips=${{package.full-version}}
    runtime:
      - boringssl-fips-static-${{vars.boringssl}}-tools

capabilities:
  add:
    - CAP_NET_ADMIN
    - CAP_SYS_ADMIN
    - CAP_BPF

environment:
  contents:
    packages:
      - apk-tools
      - bash
      - bazel-7
      - binutils
      - boringssl-fips-static-${{vars.boringssl}}-newapi
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-17
      - cmake
      - coreutils # for GNU install
      - git
      - glibc-locale-en # Fixes issues with UTF-8 characters in filenames
      - go-fips~1.24
      - isl-dev
      - libcxx1-17-dev
      - libtool
      - lld-17
      - lld-17-dev
      - llvm-17
      - llvm-17-dev
      - openjdk-21-default-jdk
      - patch
      - python3-dev
      - samurai
      - wolfi-baselayout

vars:
  boringssl: "2023042800"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cilium/cilium
      tag: v${{package.version}}
      expected-commit: 011fab6e7b798edd17e0337307dc034ed4916653
      destination: cilium

  - uses: git-checkout
    with:
      repository: https://github.com/cilium/proxy
      # Branch from https://github.com/cilium/cilium/blob/v${{package.version}}/images/cilium/Dockerfile
      # Note often the branch is updated with dependencies updates, no tags
      # See CILIUM_PROXY_COMMIT for anchor point
      branch: v1.32
      depth: 1000

  - name: Get the CILIUM_PROXY_COMMIT and reset to it
    runs: |
      ENVOY_SHA=$(grep 'ARG.*cilium-envoy' ./cilium/images/cilium/Dockerfile \
        | sed "s/^ARG.*:v[0-9.]\+-[0-9]\+-//g" | cut -d@ -f1)
      echo "SHA is: $ENVOY_SHA"
      # Sometimes the commit is too "hidden" and can't be reset to, so we try fetching it explicitly.
      git fetch origin $ENVOY_SHA
      git reset --hard $ENVOY_SHA
      # Fix 404, likely can drop in the next release
      sed -i "s|5251fec52ee063192dcd8bd0615c6283e7b12b6c|8e583d10a1781319981e5ad4a477be9ad3f6fe73|" WORKSPACE
      sed 's|build --@com_googlesource_googleurl//build_config:system_icu=0|build --@googleurl//build_config:system_icu=0|' -i envoy.bazelrc
      git commit -m "Update envoy to fix offline url" WORKSPACE envoy.bazelrc

  - runs: |
      # Bazel errors out on toolchain stanza
      sed -i '/$toolchain /d' go.mod
      # Bazel errors out on go point release
      sed -i 's|^\(go 1\.[0-9]*\)\.[0-9]*|\1|' go.mod

  - name: Build and Install proxylib then Remove go-fips from the build env
    runs: |
      cd ./proxylib
      make
      mkdir -p ${{targets.destdir}}/usr/lib
      cp -v libcilium.so ${{targets.destdir}}/usr/lib/libcilium.so

      # Remove go-fips, openssl-config-fipshardened and all from the build environment. As it is only required for building proxylib with go-fips.
      # Reason: https://github.com/chainguard-dev/enterprise-packages/pull/12174#issuecomment-2563993262
      apk del go-fips go-msft* openssl-config-fipshardened openssl-provider-fips openssl-fips-test binutils-gold

  - uses: patch
    with:
      patches: 0001-Add-chainguard-patches.patch

  - name: Fix the toolchain and root user error
    runs: |
      # The Python interpreter complains about being run as root, there's a flag to pass to disable that warning.
      sed -i 's/envoy_dependencies_extra()/envoy_dependencies_extra(ignore_root_user_error=True)/g' WORKSPACE

      # The toolchain at cilium/proxy has paths that are specific to their CI. https://github.com/cilium/proxy/blob/main/WORKSPACE#L3
      # Unregister to use Wolfi's toolchain available in the build env.
      sed 's/register_toolchains/#register_toolchains/g' -i WORKSPACE

      # Create symlink for llvm-ar-17 since the build expects this specific name
      ln -sf /usr/bin/llvm-ar /usr/bin/llvm-ar-17

  - runs: |
      mkdir -p .cache/bazel/_bazel_root

      ./bazel/setup_clang.sh /usr

      # Use libc++ to be consistent with other Wolfi Envoy packages.
      echo "build --config=libc++" >> user.bazelrc

      # Choose boringssl-fips
      # Despite using boringssl prebuilt in FIPS mode different
      # versions of envoy still had other conditional code paths that
      # depend on this setting, most importantly in --version output
      # See https://github.com/envoyproxy/envoy/blob/v1.27.0/bazel/BUILD#L475
      echo "build --define=boringssl=fips" >> user.bazelrc

      # Use our pre-built boringssl-fips-static
      echo "build --override_repository=boringssl_fips=/usr/lib/boringssl-fips-static" >> user.bazelrc

      mkdir -p ${{targets.destdir}}/usr/bin

      bazel build --fission=no --config=clang \
        --discard_analysis_cache \
        --nokeep_state_after_build \
        --notrack_incremental_state \
        --conlyopt="-Wno-strict-prototypes" \
        `# The thread-safety analysis flagged some issue in upstream code` \
        --cxxopt="-Wno-thread-safety" \
        --verbose_failures -c opt //:cilium-envoy-starter
      install -m 755 bazel-bin/cilium-envoy-starter ${{targets.destdir}}/usr/bin/cilium-envoy-starter

      bazel build --fission=no --config=clang \
        --discard_analysis_cache \
        --nokeep_state_after_build \
        --notrack_incremental_state \
        --conlyopt="-Wno-strict-prototypes" \
        `# The thread-safety analysis flagged some issue in upstream code` \
        --cxxopt="-Wno-thread-safety" \
        --action_env=LIBURING_CFLAGS="-ftrivial-auto-var-init=uninitialized" \
        --verbose_failures -c opt //:cilium-envoy
      install -m 755 bazel-bin/cilium-envoy ${{targets.destdir}}/usr/bin/cilium-envoy

  - uses: strip

test:
  environment:
    contents:
      packages:
        - bash
        - curl
        - go-fips~1.24
        - netcat-openbsd
        - procps
        - jq
  pipeline:
    - name: "Verify FIPS compliance"
      uses: test/go-fips-check
    - name: "Verify binary installation"
      runs: |
        # Test cilium-envoy binary
        cilium-envoy --version
        cilium-envoy --help

        # Test cilium-envoy-starter binary
        cilium-envoy-starter --version
        cilium-envoy-starter --help
    - name: "Verify boringcrypto version"
      runs: |
        envoy_version=$(cilium-envoy --version | sed -n 's|.*/BoringSSL-FIPS-\(.*\)|\1|p')
        [ "$envoy_version" = "${{vars.boringssl}}" ]
        /usr/bin/bssl-test_fips
        bssl_version=$(/usr/bin/bssl-test_fips | sed -n 's|^Module version: \(.*\)|\1|p')
        [ "$bssl_version" = "${{vars.boringssl}}" ]
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 4953
        software-version: ${{vars.boringssl}}
    - name: "Verify libcilium.so installation"
      runs: |
        # Check that the library exists
        if [ ! -f /usr/lib/libcilium.so ]; then
          echo "ERROR: /usr/lib/libcilium.so does not exist"
          exit 1
        fi

        # Verify we can load the library
        ldd /usr/lib/libcilium.so
    - uses: test/tw/ldd-check
      with:
        files: "/usr/bin/cilium-envoy /usr/bin/cilium-envoy-starter /usr/lib/libcilium.so"
        verbose: true
    - name: "Test Envoy admin interface startup"
      uses: test/daemon-check-output
      with:
        setup: |
          #!/bin/sh -e
          cat > /tmp/minimal.yaml <<EOF
          admin:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 9901
          static_resources:
            listeners: []
            clusters: []
          EOF
        start: cilium-envoy --config-path /tmp/minimal.yaml --admin-address-path /tmp/admin.txt
        timeout: 30
        expected_output: |
          starting main dispatch loop
          all clusters initialized
        post: |
          #!/bin/sh -e
          # Get admin address
          ADMIN_ADDR=$(cat /tmp/admin.txt)

          # Test admin endpoints
          curl -s "http://${ADMIN_ADDR}/server_info" | jq . || exit 1
          curl -s "http://${ADMIN_ADDR}/stats" | grep envoy || exit 1
          curl -s "http://${ADMIN_ADDR}/clusters" | jq . || exit 1
    - name: "Test hot restart capability"
      uses: test/daemon-check-output
      with:
        setup: |
          #!/bin/sh -e
          cat > /tmp/minimal.yaml <<EOF
          admin:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 9901
          static_resources:
            listeners: []
            clusters: []
          EOF
        start: cilium-envoy --config-path /tmp/minimal.yaml --restart-epoch 0
        timeout: 30
        expected_output: |
          starting main dispatch loop
          all clusters initialized
        post: |
          #!/bin/sh -e
          first_pid=$(pgrep -f "restart-epoch 0")
          cilium-envoy --config-path /tmp/minimal.yaml --restart-epoch 1 > /dev/null 2>&1 &
          sleep 2

          # Verify both processes exist
          if ! ps -p $first_pid > /dev/null; then
            echo "Original Envoy process not found"
            exit 1
          fi

update:
  enabled: true
  github:
    use-tag: true
    identifier: cilium/cilium
    strip-prefix: v
    tag-filter-prefix: v1.16.
