# Generated from https://pypi.org/project/pip/
package:
  name: py3.9-pip
  version: "26.0.1"
  epoch: 0 # CVE-2025-8869
  description: The PyPA recommended tool for installing Python packages.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py3.9-setuptools
      - python-3.9

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3.9-setuptools
      - python-3.9
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/pip
      expected-commit: 5fe4ea4f24cd9756316a4b5ef05daa15d84f7d0c
      tag: ${{package.version}}

  - uses: py/pip-build-install-bootstrap
    with:
      python: python3.9
      dest: ${{targets.destdir}}

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - 'b'
  shared: true
  github:
    identifier: pypa/pip
    use-tag: true

test:
  pipeline:
    - runs: |
        set -o pipefail
        pip --version | grep "${{package.version}}"
        pip --help
        pip3 --version
        pip3 --help
        pip3.9 --version
        pip3.9 --help
