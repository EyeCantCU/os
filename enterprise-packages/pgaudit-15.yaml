# pgAudit v1.7.X is intended to support PostgreSQL 15.
# https://github.com/pgaudit/pgaudit/blob/master/README.md#postgresql-version-compatibility
package:
  name: pgaudit-15
  version: "1.7.1"
  epoch: 3 # go/enterprise-rsc/pgaudit-15
  description: PostgreSQL Audit Extension
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "4"
    memory: 14Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-19
      - glibc-dev
      - krb5-dev
      - postgresql-15-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pgaudit/pgaudit.git
      tag: ${{package.version}}
      expected-commit: 72da89c3fa02f3f2b9f3933214d91ad9c3428467

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/postgresql/extension
      make USE_PGXS=1 DESTDIR=${{targets.destdir}} PG_CONFIG=/usr/bin/pg_config install

test:
  environment:
    contents:
      packages:
        - make
        - postgresql-15
        - postgresql-15-client
        - postgresql-15-contrib
        - shadow
        - sudo-rs
    environment:
      PGDATA: /tmp/test_db
      PGUSER: wolfi
  pipeline:
    - uses: test/tw/ldd-check
    - uses: git-checkout
      with:
        repository: https://github.com/pgaudit/pgaudit.git
        tag: ${{package.version}}
        expected-commit: 72da89c3fa02f3f2b9f3933214d91ad9c3428467
    - runs: |
        # Based on upstream tests in https://github.com/pgaudit/pgaudit/tree/main/test
        useradd $PGUSER
        sudo -u $PGUSER initdb -D $PGDATA
        echo "shared_preload_libraries = 'pgaudit'" >> ${PGDATA}/postgresql.conf
        if ! sudo -u $PGUSER pg_ctl -D $PGDATA -l /tmp/logfile start; then
          echo "!!! SERVER STARTUP FAILED"
          cat /tmp/logfile
          exit 1
        fi

        if ! make installcheck USE_PGXS=1; then
          echo "!!! INSTALLCHECK FAILED"
          cat regression.diffs
          exit 1
        fi

update:
  enabled: true
  github:
    identifier: pgaudit/pgaudit
    tag-filter: 1.7.
    use-tag: true
