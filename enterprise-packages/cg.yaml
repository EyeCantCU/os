package:
  name: cg
  version: "0.2.216"
  epoch: 1
  description: Chainguard's internal tool for working with packages, images, and vulnerabilities
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/mono

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/mono
      expected-commit: 854c9829a1d477ee2bc06c9f645fd769c3a34391
      tag: v${{package.version}}

  - uses: go/build
    with:
      ldflags: |
        -X sigs.k8s.io/release-utils/version.gitVersion=${{package.version}}
        -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/release-utils/version.buildDate=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")
      output: cg
      packages: .
      modroot: ./cg
      go-package: go-1.26

  - uses: strip

update:
  enabled: true
  github:
    identifier: chainguard-dev/mono
    strip-prefix: v

test:
  pipeline:
    - runs: |
        cg version
