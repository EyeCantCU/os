#nolint:valid-pipeline-git-checkout-tag
package:
  name: amazon-ecs-cni-plugins
  version: "2024.9.0_git20260305"
  epoch: 0 # CVE-2025-61732
  description: Amazon ECS CNI Plugins is a collection of CNI plugins used on Amazon ECS
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/amazon-ecs-cni-plugins
      branch: master
      expected-commit: 9b0ab26e9e1adbf05c652c1efef53a012011bc16

  - runs: |
      rm -r ./vendor

  - uses: go/build
    with:
      ldflags: -X pkg/version/version.Version=${{package.version}} -X pkg/version.GitShortHash=$(git rev-parse --short=8 HEAD)
      output: ecs-bridge
      packages: ./plugins/ecs-bridge

  - uses: go/build
    with:
      ldflags: -X pkg/version/version.Version=${{package.version}} -X pkg/version.GitShortHash=$(git rev-parse --short=8 HEAD)
      output: ecs-eni
      packages: ./plugins/eni

  - uses: go/build
    with:
      ldflags: -X pkg/version/version.Version=${{package.version}} -X pkg/version.GitShortHash=$(git rev-parse --short=8 HEAD)
      output: ecs-ipam
      packages: ./plugins/ipam

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: Upstream does not maintain tags and releases, last change was ~11 months ago.

test:
  pipeline:
    - runs: |
        ecs-bridge -version
        ecs-eni -version
        ecs-ipam -version
