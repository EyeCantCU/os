package:
  name: py3-python-engineio
  version: "4.12.3"
  epoch: 0
  description: Engine.IO server and client for Python
  copyright:
    - license: MIT

vars:
  pypi-package: python-engineio
  import: engineio

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/miguelgrinberg/python-engineio
      tag: v${{package.version}}
      expected-commit: 96fdf1c94561e36de17d2de37fa09fe3fe290da4

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-simple-websocket
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import engineio
            from engineio import Client, Server, AsyncClient, AsyncServer

            # Test basic python-engineio functionality
            assert hasattr(engineio, 'Client')
            assert hasattr(engineio, 'Server')
            assert hasattr(engineio, 'AsyncClient')
            assert hasattr(engineio, 'AsyncServer')

            # Test Client instance
            eio_client = engineio.Client()
            assert eio_client is not None
            assert hasattr(eio_client, 'connect')
            assert hasattr(eio_client, 'send')
            assert hasattr(eio_client, 'wait')
            assert hasattr(eio_client, 'disconnect')
            assert hasattr(eio_client, 'on')

            # Test Server instance
            eio_server = engineio.Server()
            assert eio_server is not None
            assert hasattr(eio_server, 'on')
            assert hasattr(eio_server, 'send')
            assert hasattr(eio_server, 'disconnect')

            # Test AsyncClient instance
            eio_async_client = engineio.AsyncClient()
            assert eio_async_client is not None

            # Test AsyncServer instance
            eio_async_server = engineio.AsyncServer()
            assert eio_async_server is not None

            # Test event decorator functionality
            @eio_client.on('connect')
            def on_connect():
                pass

            @eio_client.on('message')
            def on_message(data):
                pass

            @eio_client.on('disconnect')
            def on_disconnect():
                pass
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: miguelgrinberg/python-engineio
    strip-prefix: v
