package:
  name: drupal-11.3
  description: Drupal is an open source content management platform powering millions of websites and applications.
  version: "11.3.3"
  epoch: 0
  resources:
    cpu: 17
    memory: 32Gi
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - ${{package.name}}-apache2-config
      - docker-library-php
      # `make test/drupal*` should complain about missing extensions
      - php-${{vars.php-version}}
      - php-${{vars.php-version}}-apache
      - php-${{vars.php-version}}-curl
      - php-${{vars.php-version}}-dom
      - php-${{vars.php-version}}-gd
      - php-${{vars.php-version}}-mbstring
      - php-${{vars.php-version}}-mysqlnd
      - php-${{vars.php-version}}-opcache
      - php-${{vars.php-version}}-pdo
      - php-${{vars.php-version}}-pdo_mysql
      - php-${{vars.php-version}}-pdo_pgsql
      - php-${{vars.php-version}}-pdo_sqlite
      - php-${{vars.php-version}}-phar
      - php-${{vars.php-version}}-simplexml
      - php-${{vars.php-version}}-sodium
      - php-${{vars.php-version}}-xml
      - php-${{vars.php-version}}-xmlwriter
      - php-${{vars.php-version}}-zip
    provides:
      - drupal=${{package.full-version}}

update:
  enabled: true
  github:
    identifier: drupal/drupal
    use-tag: true
    tag-filter: "11.3"

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - apache2-config
      - build-base
      - busybox
      - composer
      - php-${{vars.php-version}}-curl
      - php-${{vars.php-version}}-dom
      - php-${{vars.php-version}}-gd
      - php-${{vars.php-version}}-mbstring
      - php-${{vars.php-version}}-mysqlnd
      - php-${{vars.php-version}}-pdo
      - php-${{vars.php-version}}-pdo_mysql
      - php-${{vars.php-version}}-simplexml
      - php-${{vars.php-version}}-sodium
      - php-${{vars.php-version}}-xml
      - php-${{vars.php-version}}-xmlwriter
      - php-${{vars.php-version}}-zip
  environment:
    PHP_INI_DIR: etc/php

vars:
  php-version: 8.4

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/drupal/drupal.git
      tag: ${{package.version}}
      expected-commit: 679bff00327c2f4011e5d33e79cfeadf41d02d77
      destination: /usr/src/${{package.name}}

  - uses: git-checkout
    with:
      repository: https://github.com/drupal/recommended-project.git
      tag: ${{package.version}}
      expected-commit: 4d4b0fc0134113f3c49d856657bbf00e960c1915
      destination: vendor-binaries

  # For compatibility with upstream image that has `/opt/drupal/{vendor,recipes}`
  - name: Generate vendor binaries
    working-directory: vendor-binaries
    runs: |
      composer install

  - name: Prep config
    runs: |
      install -d "${{targets.contextdir}}/${PHP_INI_DIR}/conf.d/"
      # from upstream docker file
      tee "${{targets.contextdir}}/${PHP_INI_DIR}/conf.d/opcache-recommended.ini" <<EOF
      opcache.memory_consumption=128
      opcache.interned_strings_buffer=8
      opcache.max_accelerated_files=4000
      opcache.revalidate_freq=60
      EOF
      # from upstream docker file
      tee "${{targets.contextdir}}/${PHP_INI_DIR}/conf.d/docker-php-drupal-recommended.ini" <<EOF
      output_buffering=true
      EOF

  - name: Build Drupal
    runs: |
      export COMPOSER_ALLOW_SUPERUSER=1
      export COMPOSER_HOME="$(mktemp -d)"
      install -dm0755 "${{targets.contextdir}}/opt/drupal/web"

      # Copy vendor and project files from recommended-project (matches upstream structure)
      mv vendor-binaries/vendor "${{targets.contextdir}}/opt/drupal/"
      cp -r vendor-binaries/composer* "${{targets.contextdir}}/opt/drupal/"
      install -Dpm0644 -t "${{targets.contextdir}}/opt/drupal/" vendor-binaries/LICENSE.txt

      # Copy Drupal core source to web/
      cp -a "/usr/src/${{package.name}}/." "${{targets.contextdir}}/opt/drupal/web/"

      # Remove files from web/ that should only exist at project root (not in web/)
      # These come from drupal/drupal repo but upstream uses drupal/recommended-project structure
      rm -rf "${{targets.contextdir}}/opt/drupal/web/.git"*
      rm -rf "${{targets.contextdir}}/opt/drupal/web/vendor"
      rm -rf "${{targets.contextdir}}/opt/drupal/web/composer"
      rm -f "${{targets.contextdir}}/opt/drupal/web/composer.json"
      rm -f "${{targets.contextdir}}/opt/drupal/web/composer.lock"
      rm -f "${{targets.contextdir}}/opt/drupal/web/SECURITY.md"

      # Replace autoload.php with scaffolded version that points to ../vendor (upstream structure)
      tee > "${{targets.contextdir}}/opt/drupal/web/autoload.php" << 'AUTOLOAD_EOF'
      <?php

      /**
       * @file
       * Includes the autoloader created by Composer.
       *
       * This file was generated by drupal-scaffold.
       *
       * @see composer.json
       * @see index.php
       * @see core/install.php
       * @see core/rebuild.php
       */

      return require __DIR__ . '/../vendor/autoload.php';
      AUTOLOAD_EOF
      # Remove leading whitespace from autoload.php
      sed -i 's/^      //' "${{targets.contextdir}}/opt/drupal/web/autoload.php"

      chmod 755 "${{targets.contextdir}}/opt/drupal/web"
      chmod 755 "${{targets.contextdir}}/opt/drupal/web/.htaccess"

  - name: Verify platform requirements using project-level composer
    working-directory: ${{targets.contextdir}}/opt/drupal
    runs: |
      composer check-platform-reqs

  - name: create settings.php
    runs: |
      # Create settings.php (readable by web server) and files directory (writable for uploads)
      install -Dpm0644 "${{targets.contextdir}}/opt/drupal/web/sites/default/default.settings.php" "${{targets.contextdir}}/opt/drupal/web/sites/default/settings.php"
      install -dpm0750 "${{targets.contextdir}}/opt/drupal/web/sites/default/files"
      # Quieten CVE reader false positive complaining about fake drupal example website in package_manager tests
      rm -r "${{targets.contextdir}}/opt/drupal/web/core/modules/package_manager/tests/"

  - name: Configure symlinks
    runs: |
      # Upstream image uses /usr/bin/apache2, but we have /usr/bin/httpd instead, both are the same
      # https://github.com/docker-library/php/blob/d21ab07e7f4014a5443f47c8ff8e292f9c703a58/apache2-foreground#L40
      install -d "${{targets.contextdir}}/usr/bin"
      ln -sf httpd "${{targets.contextdir}}/usr/bin/apache2"
      # Copy recipes directory from recommended-project (includes README.txt)
      cp -r vendor-binaries/recipes "${{targets.contextdir}}/opt/drupal/"

subpackages:
  - name: ${{package.name}}-compat
    description: Compat subpackage for drupal project upstream image
    dependencies:
      runtime:
        - ${{package.name}}
        - php-${{vars.php-version}}-phar
        - php-${{vars.php-version}}-openssl
        # The image uses a shell script as the entrypoint
        - coreutils
      provides:
        - drupal-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/var/www"
          ln -f -s /opt/drupal/web "${{targets.contextdir}}/var/www/html"
          mkdir -p "${{targets.contextdir}}/var/log/apache2"
          ln -sf /dev/stdout "${{targets.contextdir}}/var/log/apache2/access.log"
          ln -sf /dev/stderr "${{targets.contextdir}}/var/log/apache2/error.log"
          ln -sf /dev/stdout "${{targets.contextdir}}/var/log/apache2/other_vhosts_access.log"
          # Symlink for PHP config directory for upstream compatibility
          mkdir -p "${{targets.contextdir}}/usr/local/etc/php"
          ln -sf "/${PHP_INI_DIR}/conf.d" "${{targets.contextdir}}/usr/local/etc/php/conf.d"
    # test added by a robot (compat)
    test:
      pipeline:
        - uses: test/tw/symlink-check
          with:
            # Compat packages use absolute symlinks for compatibility with upstream images
            allow-absolute: "true"

  - name: ${{package.name}}-apache2-config
    description: ${{package.name}} Apache2 httpd.conf configuration
    dependencies:
      replaces:
        - apache2-config
        - apache2-config-compat
      provides:
        - drupal-apache2-config=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/etc/apache2/extra/
          APACHE_DIR="${{targets.contextdir}}"/etc/apache2
          TARGET="${{targets.contextdir}}"/etc/apache2/httpd.conf

          install -Dpm0644 -t "${APACHE_DIR}" /etc/apache2/httpd.conf
          install -Dpm0644 -t "${{targets.contextdir}}/etc/apache2/extra/" /etc/apache2/extra/httpd-ssl.conf

          # Configure DocumentRoot and ServerRoot paths
          # Set the log folders to access.log, error.log, and other_vhosts_access.log
          sed -i \
            -e 's|/usr/share/apache2/default-site/htdocs|/var/www/html|' \
            -e 's|/usr/local/apache2/htdocs|/var/www/html|' \
            -e 's|^ErrorLog.*|ErrorLog "/var/log/apache2/error.log"|' \
            -e 's|"var/log/apache2/access_log common"|"/var/log/apache2/access.log combined"|' \
            "$TARGET"

          echo 'CustomLog /var/log/apache2/other_vhosts_access.log vhost_combined' > "$APACHE_DIR/extra/vhost-access-log.conf"
          echo "Include etc/apache2/extra/vhost-access-log.conf" >> "$TARGET"

          # Fix the error: `Apache is running a threaded MPM, but your PHP Module is not compiled to be threadsafe. You need to recompile PHP.`
          sed -ri \
            -e 's|^(\s*)LoadModule mpm_event_module|\1#LoadModule mpm_event_module|' \
            -e 's|^(\s*)#*LoadModule mpm_prefork_module|\1LoadModule mpm_prefork_module|' \
            "${{targets.contextdir}}"/etc/apache2/httpd.conf

          # Load additional modules that upstream image loads by default
          # Also include the config files for remoteip and apache-limits as upstream image does
          tee <<EOF >> "$TARGET"
          LoadModule deflate_module     /usr/lib/apache2/modules/mod_deflate.so
          LoadModule negotiation_module /usr/lib/apache2/modules/mod_negotiation.so
          LoadModule rewrite_module     /usr/lib/apache2/modules/mod_rewrite.so
          LoadModule remoteip_module    /usr/lib/apache2/modules/mod_remoteip.so
          LoadModule php_module         /usr/lib/apache2/modules/libphp.so
          <FilesMatch \.php$>
            SetHandler application/x-httpd-php
          </FilesMatch>
          <Directory "/var/www/html">
            AllowOverride All
          </Directory>
          EOF
    test:
      environment:
        contents:
          packages:
            - apache2
            - php-${{vars.php-version}}-apache
      pipeline:
        - name: Validate httpd config
          runs: |
            set -euo pipefail
            grep -F 'DocumentRoot "//var/www/html"' /etc/apache2/httpd.conf
            grep -F 'LoadModule php_module' /etc/apache2/httpd.conf
            grep -F 'LoadModule rewrite_module' /etc/apache2/httpd.conf
            grep -F 'AllowOverride All' /etc/apache2/httpd.conf
            # Create DocumentRoot for apachectl syntax check (drupal package provides the actual content)
            mkdir -p /var/www/html
            apachectl -t

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-compat
        - ${{package.name}}-apache2-config
        - apache2-utils
        - curl
        - tini
        - wait-for-it
        - crane
    environment:
      DRUPAL_ADMIN_PASSWORD: admin
      DRUPAL_PORT: 8080
      DRUPAL_HOST: localhost
      DRUPAL_TEST_NAME: Drupal_Test
      HTTP_PORT: 80
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/symlink-check
    - name: Verify key files exist
      runs: |
        set -euo pipefail
        stat /opt/drupal/web/core/install.php
        stat /opt/drupal/vendor/autoload.php
        stat /opt/drupal/web/sites/default/settings.php
    - name: Lint httpd config
      runs: |
        apachectl -S
    - name: Test production endpoint with httpd
      uses: test/daemon-check-output
      with:
        # Use tini to ensure proper process reaping by daemon-check-output
        start: tini -s -- apache2-foreground
        timeout: 60
        expected_output: |
          configured -- resuming normal operations
        post: |-
          set -o pipefail
          curl -s "http://${DRUPAL_HOST}:${HTTP_PORT}" | grep -F 'Redirecting to <a href="/core/install.php">'
          curl -s "http://${DRUPAL_HOST}:${HTTP_PORT}/core/install.php" | grep -F '<span class="site-version">${{package.version}}</span>'
    - working-directory: /opt/drupal/web/core/scripts
      name: Smoke tests
      runs: |
        set -euo pipefail
        php ./drupal --version | grep -F ${{package.version}}
        php ./drupal help recipe | grep -F 'Applies a recipe to a site.'
        php ./drupal help list | grep -F 'List commands'
        php ./drupal help generate-theme | grep -F 'Generates a new theme'
    - name: Ensure demo quickstart website works
      working-directory: /opt/drupal/web
      uses: test/daemon-check-output
      with:
        start: php -d memory_limit=256M core/scripts/drupal quick-start demo_umami --suppress-login --site-name "${DRUPAL_TEST_NAME}" --password "${DRUPAL_ADMIN_PASSWORD}" --host "${DRUPAL_HOST}" --port "${DRUPAL_PORT}"
        timeout: 300
        expected_output: |
          Drupal development server started
        post: |-
          set -o pipefail
          curl "http://${DRUPAL_HOST}:${DRUPAL_PORT}" | grep -F "<title>Home | $DRUPAL_TEST_NAME</title>"
          curl "http://${DRUPAL_HOST}:${DRUPAL_PORT}" | grep -F "content=\"Drupal ${{vars.major-version}}"
    - name: Ensure the PHP modules match Drupal image
      runs: |
        /bin/bash -c '
        set -euo pipefail

        # Sometimes the tag is not available yet, so use the previous patch version
        # e.g. 11.3.1 -> 11.3.0
        tag=${{package.version}}
        DRUPAL_IMAGE="docker.io/library/drupal"
        # Check if tag exists; if not, fall back to previous patch version
        # Suppressing output here is intentional as we handle the failure case explicitly
        if ! crane manifest "$DRUPAL_IMAGE:$tag" > /dev/null 2>&1; then
          echo "Tag $tag not found, trying previous patch version..."
          tag=${tag%.*}.$(( ${tag##*.} - 1 ))
        fi

        required_modules=$(crane export "$DRUPAL_IMAGE:$tag" - | \
          tar -tvf - | \
          grep "usr/local/lib/php/extensions/.*\.so$" | \
          awk -F"/" "{print \$NF}" | \
          sed "s/\.so\$//" | \
          sort -u)

        echo "Modules required by $DRUPAL_IMAGE:$tag:"
        echo "$required_modules"

        loaded_modules=$(php -m | tr "[:upper:]" "[:lower:]" | sed "s/zend opcache/opcache/")

        missing_modules=()
        while read -r module; do
          if ! grep -iq "^${module}$" <<< "$loaded_modules"; then
            missing_modules+=("$module")
          fi
        done <<< "$required_modules"

        if [ ${#missing_modules[@]} -ne 0 ]; then
          echo "Missing PHP modules: ${missing_modules[*]}"
          exit 1
        else
          echo "All required PHP modules are loaded!"
        fi
        '
