package:
  name: chart-prometheus-prometheus-adapter
  version: "5.2.0"
  epoch: 0
  description: A Helm chart for k8s prometheus adapter
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/helm-charts
      tag: prometheus-adapter-${{package.version}}
      expected-commit: ba04297b341a59ac627dee9ec4b8e9686708fb6f

  - uses: charts/package
    with:
      chart-path: charts/prometheus-adapter
      images: |
        prometheus-adapter:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [prometheus-adapter]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: prometheus-community/helm-charts
    strip-prefix: prometheus-adapter-
    use-tag: true
    tag-filter-prefix: prometheus-adapter-
