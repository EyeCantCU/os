package:
  name: azure-configs
  version: "0.0.2"
  epoch: 2 # go/enterprise-rsc/azure-configs
  description: Configuration Files Needed to run in Azure
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 2Gi

environment:
  contents:
    packages:
      - busybox

pipeline:
  - name: "Azure required ssh setting"
    runs: |
      mkdir -p ${{targets.destdir}}/etc/ssh/sshd_config.d/
      cp 50-azure-ssh-config.conf ${{targets.destdir}}/etc/ssh/sshd_config.d/

  - name: "Azure required systemd-networkd settings"
    runs: |
      mkdir -p ${{targets.destdir}}/etc/systemd/network/
      cp 99-azure-unmanaged-devices.network ${{targets.destdir}}/etc/systemd/network/

test:
  pipeline:
    - runs: |
        ls /etc/ssh/sshd_config.d/50-azure-ssh-config.conf
        ls /etc/systemd/network/99-azure-unmanaged-devices.network

update:
  enabled: false
  exclude-reason: No upstream
