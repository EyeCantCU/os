package:
  name: libnvidia-egl-wayland
  version: 1.1.21
  epoch: 0
  description: NVIDIA EGL External Platform library for Wayland
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - eglexternalplatform
      - mesa-dev
      - meson
      - wayland-dev
      - wayland-protocols

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/egl-wayland
      tag: ${{package.version}}
      expected-commit: f81fcd016bb232c12ba59dddb240648203caaf4c

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    description: Headers and libraries from ${{package.name}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: NVIDIA/egl-wayland
    use-tag: true
