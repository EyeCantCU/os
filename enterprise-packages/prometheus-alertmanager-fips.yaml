package:
  name: prometheus-alertmanager-fips
  version: "0.31.1"
  epoch: 2 # GHSA-9h8m-3fm2-qjrq
  description: Prometheus Alertmanager
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - nodejs<21
      - npm

vars:
  PKG: "github.com/prometheus/common"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/alertmanager
      tag: v${{package.version}}
      expected-commit: 7a639ba087d6e877038cabfdaa645230f79001b8

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      go-package: go-fips-md5
      packages: ./cmd/alertmanager
      output: alertmanager
      ldflags: |
        -X ${{vars.PKG}}/version.Revision=$(git rev-parse --short HEAD)
        -X ${{vars.PKG}}/version.BuildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')
        -X ${{vars.PKG}}/version.Branch=$(git branch --show-current)
        -X ${{vars.PKG}}/version.Version=v${{package.version}}

  - uses: go/build
    with:
      go-package: go-fips-md5
      packages: ./cmd/amtool
      output: amtool
      ldflags: |
        -X ${{vars.PKG}}/version.Revision=$(git rev-parse --short HEAD)
        -X ${{vars.PKG}}/version.BuildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')
        -X ${{vars.PKG}}/version.Branch=$(git branch --show-current)
        -X ${{vars.PKG}}/version.Version=v${{package.version}}

  - runs: |
      install -Dm644 examples/ha/alertmanager.yml "${{targets.destdir}}"/etc/alertmanager/alertmanager.yml

  - uses: strip

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    description: "compat package for iamguarded"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: prometheus-alertmanager
          version: "${{vars.major-version}}"
      - runs: |
          mkdir -p /opt/iamguarded/alertmanager/bin/
          mkdir -p /opt/iamguarded/alertmanager/conf/
          mkdir -p /opt/iamguarded/alertmanager/data/
          mkdir -p ${{targets.contextdir}}/etc/alertmanager
          mkdir -p ${{targets.contextdir}}/alertmanager
          chmod g+rwX /opt/iamguarded/alertmanager/data/
          ln -sf /usr/bin/alertmanager /opt/iamguarded/alertmanager/bin/alertmanager
          ln -sf /usr/bin/amtool /opt/iamguarded/alertmanager/bin/amtool
          ln -sf /etc/alertmanager/alertmanager.yml /opt/iamguarded/alertmanager/conf/config.yml
          ln -sf /opt/iamguarded/alertmanager/conf ${{targets.contextdir}}/etc/alertmanager
          ln -sf /opt/iamguarded/alertmanager/data ${{targets.contextdir}}/alertmanager
      - uses: iamguarded/finalize-compat
        with:
          package: prometheus-alertmanager
          version: "${{vars.major-version}}"
    test:
      pipeline:
        - runs: |
            stat /opt/iamguarded/alertmanager/bin/alertmanager
            stat /opt/iamguarded/alertmanager/bin/amtool
        - uses: iamguarded/test-compat
          with:
            package: prometheus-alertmanager
            version: "${{vars.major-version}}"

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: |
          alertmanager
          amtool
    - uses: test/tw/help-check
      with:
        bins: |
          alertmanager
          amtool
    - name: Functional tests
      runs: |
        set -euo pipefail

        # Start alertmanager with test config
        alertmanager \
          --config.file=test-alertmanager-config.yaml \
          --storage.path=alertmanager \
          --web.listen-address=127.0.0.1:9093 \
          --cluster.listen-address="" \
          --log.level=debug > out.log 2>&1 &
        AM_PID=$!
        sleep 5

        # Test health endpoints (fails test if not ready/healthy)
        curl -sf http://127.0.0.1:9093/-/ready
        curl -sf http://127.0.0.1:9093/-/healthy

        # Create a test alert
        curl -sf -XPOST -H "Content-Type: application/json" \
          -d '[{"labels":{"alertname":"TestAlertFromMelangeTest","severity":"critical"}}]' \
          http://127.0.0.1:9093/api/v2/alerts

        # Verify alert exists (fails test if not found)
        curl -sf http://127.0.0.1:9093/api/v2/alerts | grep -F "TestAlertFromMelangeTest"

        # Create a silence for our test alert
        SILENCE_ID=$(curl -sf -XPOST -H "Content-Type: application/json" \
          -d '{"matchers":[{"name":"alertname","value":"TestAlertFromMelangeTest","isRegex":false}],"startsAt":"2021-01-01T00:00:00Z","endsAt":"2031-01-01T00:00:00Z","createdBy":"melange-test","comment":"test silence"}' \
          http://127.0.0.1:9093/api/v2/silences | grep -o '"silenceID":"[^"]*"' | cut -d'"' -f4)

        # Verify silence exists (fails test if not found)
        curl -sf http://127.0.0.1:9093/api/v2/silences | grep -F "$SILENCE_ID"

        kill -9 $AM_PID

update:
  enabled: true
  github:
    identifier: prometheus/alertmanager
    strip-prefix: v
