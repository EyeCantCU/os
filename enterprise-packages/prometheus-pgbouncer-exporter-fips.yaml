package:
  name: prometheus-pgbouncer-exporter-fips
  version: "0.11.1"
  epoch: 1 # CVE-2025-61726, CVE-2025-61730, CVE-2025-61731, CVE-2025-68119 (Go stdlib, rebuild with Go 1.25.6+)
  description: Prometheus exporter for PgBouncer
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/pgbouncer_exporter
      tag: v${{package.version}}
      expected-commit: a0e0af37bcb72ee50369f7bf3de34c569b960343

  - uses: go/build
    with:
      packages: .
      ldflags: |-
        -X github.com/prometheus/common/version.Version=${{package.version}}
        -X github.com/prometheus/common/version.Revision=$(git rev-parse HEAD)
        -X github.com/prometheus/common/version.Branch=v${{package.version}}
        -X github.com/prometheus/common/version.BuildUser=$(whoami)@$HOSTNAME
        -X github.com/prometheus/common/version.BuildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")
      output: pgbouncer_exporter
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: prometheus-community/pgbouncer_exporter
    use-tag: true
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: pgbouncer_exporter
    - uses: test/tw/ver-check
      with:
        bins: pgbouncer_exporter
    - uses: test/daemon-check-output
      with:
        start: pgbouncer_exporter
        timeout: 15
        expected_output: |
          Starting pgbouncer_exporter
          Listening on
        post: |
          wait-for-it 127.0.0.1:9127
          curl -sf http://127.0.0.1:9127/metrics > metrics.txt
          grep -q "pgbouncer_up" metrics.txt
          grep -q "promhttp_metric_handler_requests_total" metrics.txt
          grep -q "promhttp_metric_handler_requests_in_flight" metrics.txt
