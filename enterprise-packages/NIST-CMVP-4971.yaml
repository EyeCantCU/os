#nolint:valid-pipeline-fetch-digest
package:
  # body-type-number
  name: NIST-CMVP-4971
  # v1 of nist meta-packages
  version: 1
  epoch: 3 # go/enterprise-rsc/NIST-CMVP-4971
  # Many SCA tools know how to read APK URL
  # URL to the certificate
  url: https://csrc.nist.gov/projects/cryptographic-module-validation-program/certificate/4971
  # Some tools use description
  # body, type, number, certificate name, standard
  description: "NIST CMVP 4971 Amazon Linux 2023 Libgcrypt Cryptographic Module (FIPS 140-3) metapackage"
  copyright:
    # NIST information is all public
    - license: NIST-PD
  dependencies:
    runtime:
      # Strict dependency on the actual module
      - libgcrypt-al2023-fips
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      # Note this URL will make it into package SPDX SBOM, and will also make it into APKO SBOM
      uri: https://csrc.nist.gov/projects/cryptographic-module-validation-program/certificate/4971
      # Unstable content, thus no expected checksum and hence the nolint too
      expected-none: true
      extract: false
      delete: true

test:
  pipeline:
    - uses: test/tw/metapackage
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 4971

update:
  enabled: false
  exclude-reason: "This is an empty NIST CMVP certificate SBOM indicator"
