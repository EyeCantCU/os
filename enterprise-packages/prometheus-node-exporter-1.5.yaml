package:
  name: prometheus-node-exporter-1.5
  version: 1.5.0
  epoch: 43 # GHSA-j5w8-q4qc-rx2x
  description: Prometheus Exporter for machine metrics
  copyright:
    - license: Apache-2.0
  dependencies:
    # REMOVE_POST_USRMERGE - https://github.com/orgs/wolfi-dev/discussions/40270
    provides:
      - prometheus-node-exporter-1.5-compat=${{package.full-version}}
    runtime:
      - merged-bin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/node_exporter
      tag: v${{package.version}}
      expected-commit: 1b48970ffcf5630534fb00bb0687d73c66d1c959

  - uses: go/bump
    with:
      deps: |-
        google.golang.org/protobuf@v1.33.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        github.com/opencontainers/selinux@v1.13.0
        golang.org/x/crypto@v0.45.0

  - runs: |
      make build

  - runs: |
      install -Dm755 node_exporter "${{targets.destdir}}"/usr/bin/node_exporter

  - uses: strip

update:
  enabled: false
  exclude-reason: v1.5.* version stream only contains the v1.5.0 release since 2022-11-29.

test:
  pipeline:
    - runs: |
        node_exporter --version
        node_exporter --help
