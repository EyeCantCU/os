package:
  name: chart-iamguarded-cassandra
  version: 12.3.13
  epoch: 0
  description: Cassandra iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: cassandra/${{package.version}}
      expected-commit: aa4e4d59f254571c0ba0f1aa28f2453400b43402

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/cassandra

  - uses: charts/package
    with:
      chart-path: iamguarded/cassandra

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: cassandra/
    use-tag: true
    tag-filter-prefix: cassandra/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /cassandra
