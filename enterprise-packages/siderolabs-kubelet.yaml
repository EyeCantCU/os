package:
  name: siderolabs-kubelet
  version: "1.35.0"
  epoch: 0
  description: Siderolabs Kubelet meta package with slim dependencies for Talos Linux
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # we don't depend on kubelet here to allow for more flexible versioning
      - ca-certificates
      - ethtool
      - iproute2
      - libcap-utils
      - nfs-utils
      - socat
      - util-linux

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      cp Dockerfile /tmp/expected-Dockerfile

  - uses: git-checkout
    with:
      repository: https://github.com/siderolabs/kubelet
      tag: v${{package.version}}
      expected-commit: 510e63ad1d696ba7c378d5cd260eb48e2b896bab

  - name: Verify upstream Dockerfile hasn't changed
    runs: |
      diff -u /tmp/expected-Dockerfile Dockerfile

test:
  pipeline:
    - uses: test/metapackage

subpackages:
  - name: ${{package.name}}-compat
    description: Siderolabs Kubelet compat symlink
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      # since we don't depend on kubelet directly, we cant use our symlink check since this will be a dangling symlink
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/local/bin"
          ln -sf /usr/bin/kubelet "${{targets.subpkgdir}}/usr/local/bin/kubelet"
    test:
      pipeline:
        - runs: |
            readlink /usr/local/bin/kubelet | grep -Fx /usr/bin/kubelet

update:
  enabled: true
  github:
    identifier: siderolabs/kubelet
    strip-prefix: v
