package:
  name: siderolabs-kubelet
  version: "1.35.0"
  epoch: 0
  description: Siderolabs Kubelet - Containerized Kubernetes kubelet for Talos Linux
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - conntrack-tools
      - device-mapper
      - ethtool
      - iproute2
      - ipset
      - iptables
      - keyutils
      - kmod
      - kubelet
      - libcap-utils
      - nfs-utils
      - rpcbind
      - socat
      - util-linux

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      cp Dockerfile /tmp/expected-Dockerfile

  - uses: git-checkout
    with:
      repository: https://github.com/siderolabs/kubelet
      tag: v${{package.version}}
      expected-commit: 510e63ad1d696ba7c378d5cd260eb48e2b896bab

  - name: Verify upstream Dockerfile hasn't changed
    runs: |
      diff -u /tmp/expected-Dockerfile Dockerfile

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/local/bin"
      ln -sf /usr/bin/kubelet "${{targets.destdir}}/usr/local/bin/kubelet"

update:
  enabled: true
  github:
    identifier: siderolabs/kubelet
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - kubelet
  pipeline:
    - uses: test/tw/symlink-check
      with:
        allow-absolute: true
    - runs: |
        /usr/local/bin/kubelet --help
