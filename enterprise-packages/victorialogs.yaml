package:
  name: victorialogs
  version: "1.47.0"
  epoch: 0 # go/enterprise-rsc/victorialogs
  description: VictoriaLogs is a fast, easy to use database for logs designed to efficiently manage terabytes of log data with high performance and reliability.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "5"
    memory: 8Gi

environment:
  contents:
    packages:
      - nodejs
      - npm
      - python3
  environment:
    GOTOOLCHAIN: local+auto

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 84e27c678b6cf7eb01a370bfa00f70ac55c70be7
      repository: https://github.com/VictoriaMetrics/VictoriaLogs
      tag: v${{package.version}}

  - working-directory: app/vmui/packages/vmui
    runs: |
      npm install
      npm install -g tsx
      npm run gen:logsql-pipes
      npm run build

  - runs: |
      rm -rf app/vlselect/vmui/* && mv app/vmui/packages/vmui/build/* app/vlselect/vmui && rm -rf app/vlselect/vmui/dashboards

  - uses: go/build
    with:
      packages: ./app/victoria-logs
      output: victoria-logs
      ldflags: -X github.com/VictoriaMetrics/VictoriaMetrics/lib/buildinfo.Version=victoria-logs-$(date -u -d "@${SOURCE_DATE_EPOCH:-$(date +%s)}" "+%Y-%m-%dT%H:%M:%SZ")-${{package.version}}

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility package to place binaries in the location expected by upstream Dockerfile
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/
          ln -sf ./usr/bin/victoria-logs ${{targets.contextdir}}/victoria-logs-prod
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    environment:
      TERM: xterm
      DISPLAY: ":99"
      CYPRESS_CACHE_FOLDER: /tmp/cypress-cache
    contents:
      packages:
        - curl
        - nodejs
        - npm
        - xvfb
        - xkeyboard-config
        - xkbcomp
        - chromium
        - font-opensans
        - ncurses
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test the victoria-logs binary
      runs: |
        victoria-logs -version | grep -F "${{package.version}}"
    - uses: test/tw/help-check
      with:
        bins: victoria-logs
    - name: "Test victoria-logs service"
      uses: test/daemon-check-output
      with:
        start: victoria-logs -httpListenAddr=:9428
        post: |-
          #!/bin/bash -ex
          set -o pipefail

          Xvfb :99 -screen 0 1280x1024x24 2>/dev/null &
          XVFB_PID=$!

          cleanup() {
            kill "$XVFB_PID" 2>/dev/null || true
            pkill -9 -f chromium 2>/dev/null || true
          }
          trap cleanup EXIT

          # Test vmui static assets are served
          curl -sf http://localhost:9428/select/vmui/favicon.svg | grep -F "svg"
          curl -sf http://localhost:9428/select/vmui/manifest.json | grep -F "name"

          # Test health endpoint
          curl -sf http://localhost:9428/health | grep -F "OK"

          # Test log ingestion endpoint accepts data
          curl -sf -X POST "http://localhost:9428/insert/jsonline" \
            -H "Content-Type: application/json" \
            -d '{"_msg":"test log message","level":"info"}'

          # Verify ingested log can be queried (query endpoint returns JSON lines)
          sleep 1
          curl -sf "http://localhost:9428/select/logsql/query?query=test&limit=10" | grep -F "test log message"

          # Test hits endpoint returns proper JSON with timestamps
          curl -sf "http://localhost:9428/select/logsql/hits?query=*&start=1d&step=1h" | grep -F "timestamps"

          # Run Cypress e2e tests for vmui with a timeout to prevent hanging
          npm install && npx cypress install

          # Ignore benign ResizeObserver error that causes flaky test failures
          mkdir -p cypress/support
          echo "Cypress.on('uncaught:exception', (err) => { if (err.message.includes('ResizeObserver')) return false; });" >> cypress/support/e2e.js

          timeout --kill-after=10 300 npm run cy:run
        expected_output: |
          started server at http://0.0.0.0:9428/
