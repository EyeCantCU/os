package:
  name: gcp-compute-persistent-disk-csi-driver-fips-1.17
  version: "1.17.15"
  epoch: 9 # GHSA-9h8m-3fm2-qjrq
  description: The Google Compute Engine Persistent Disk (GCE PD) Container Storage Interface (CSI) Storage Plugin.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - blkid
      - blockdev
      - btrfs-progs
      - busybox
      - ca-certificates
      - dbus-libs
      - device-mapper
      - e2fsprogs
      - e2fsprogs-extra
      - e2fsprogs-libs
      - glibc
      - json-c
      - kmod-libs
      - libacl1
      - libblkid
      - libbsd
      - libcap
      - libcom_err
      - libcrypto3
      - libgcc
      - libgcrypt-al2023-fips
      - libgpg-error
      - liblz4-1
      - libmd
      - libmount
      - libnvme-dev
      - libpcre2-8-0
      - libstdc++
      - libsystemd
      - libuuid
      - mount
      - ncurses
      - nvme-cli
      - readline
      - systemd
      - umount
      - userspace-rcu
      - util-linux
      - util-linux-misc
      - xfsprogs
      - xz
      - zlib
  resources:
    cpu: "4"
    memory: 8Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/gcp-compute-persistent-disk-csi-driver
      tag: v${{package.version}}
      expected-commit: 68e3bad8efc759a28558b80b295fdda71670bdb4

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/crypto@v0.45.0
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/gce-pd-csi-driver/main.go
      ldflags: |
        -X main.version=$(git describe --long --tags --match='v*' --dirty 2>/dev/null || git rev-list -n1 HEAD)
      output: gce-pd-csi-driver

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: gce-pd-csi-driver

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.17.
