#nolint:valid-pipeline-git-checkout-tag
# https://github.com/pelias/docker-baseimage/blob/master/Dockerfile
package:
  name: pelias-baseimage
  version: 0_git20260106
  epoch: 1
  description: "Base infrastructure package for Pelias geocoding services"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - bash
      - bzip2
      - ca-certificates # required for nave to access https endpoints
      - curl
      - gawk
      - git
      - glibc-locales # required for language support (replaces 'locales')
      - iputils # iputils-ping equivalent
      - libzip
      - nodejs-20
      - pigz
      - sqlite-libs
      - unzip
      - wget
      - zstd
      # - libsqlite3-mod-spatialite - too old to build https://www.gaia-gis.it/fossil/libspatialite/home

vars:
  # SHA256 hashes for upstream drift detection
  # Update these when upstream files change and we've reviewed the changes
  dockerfile-sha256: 5f4f41b4ffd1da47e04c050c7d722abb5993926017ad8d324b54d8c31ff84bf4
  packages-sh-sha256: 74a3501510f3a6c39c06a9d4d6a9bb53742db0ab0cf28de6f561319ba9b6201c

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pelias/docker-baseimage
      branch: master
      expected-commit: 6f1de72c257c401f7080678b32053eae55996500

  # We need to make sure that all the packages in packages.sh are installed and the steps in Dockerfile that we can add at package level are added here.
  # Since pelias/docker-baseimage does not use tags or releases, we rely on the upstream drift detection to identify changes that need to be reviewed and added here.
  - name: Detect upstream drift
    runs: |
      set -euo pipefail

      # Verify Dockerfile content hasn't changed
      # If this check fails, review the changes in the upstream Dockerfile: https://github.com/pelias/docker-baseimage/blob/master/Dockerfile
      # and make sure all necessary steps are added to this package
      echo "${{vars.dockerfile-sha256}}  Dockerfile" | sha256sum -c

      # Verify packages.sh content hasn't changed
      # If this check fails, review the changes in the upstream packages.sh: https://github.com/pelias/docker-baseimage/blob/master/packages.sh
      # and make sure all packages are installed in the runtime section above
      echo "${{vars.packages-sh-sha256}}  packages.sh" | sha256sum -c

  - runs: |
      mkdir -p "${{targets.destdir}}"/data
      mkdir -p "${{targets.destdir}}"/code/pelias
      # Create pelias configuration
      echo '{}' > "${{targets.destdir}}"/code/pelias.json
      # Note: https://github.com/pelias/docker-baseimage/blob/master/Dockerfile#L54 ensure user permissions at image level

test:
  pipeline:
    - name: Verify directory structure
      runs: |
        stat /data
        stat /code/pelias
    - name: Verify pelias config
      runs: |
        stat /code/pelias.json

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: |
      Upstream does not maintain tags or releases. Weekly rebuilds run the drift check
      to detect changes in Dockerfile or packages.sh that require review.
