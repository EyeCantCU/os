package:
  name: k8s-driver-manager-fips
  version: 0.9.1
  epoch: 1
  description: FIPS-enabled Kubernetes component for seamless upgrades of NVIDIA drivers on cluster nodes
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - busybox # for other utilities such as readlink, basename, dirname, etc: https://github.com/NVIDIA/k8s-driver-manager/blob/be979ef08699fac8a83f2ffb85fa1ff3d606ba20/scripts/vfio-manage#L37-L38
      - util-linux-misc # for getopt command: https://github.com/NVIDIA/k8s-driver-manager/blob/be979ef08699fac8a83f2ffb85fa1ff3d606ba20/scripts/vfio-manage#L191-L192

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/k8s-driver-manager
      tag: v${{package.version}}
      expected-commit: be979ef08699fac8a83f2ffb85fa1ff3d606ba20

  - uses: go/bump
    with:
      deps: |
        golang.org/x/net@v0.45.0

  - uses: go/build
    with:
      packages: ./cmd/driver-manager
      output: driver-manager
      go-package: go-fips-md5
      ldflags: |
        -X github.com/NVIDIA/k8s-driver-manager/internal/info.version=${{package.version}}
        -X github.com/NVIDIA/k8s-driver-manager/internal/info.gitCommit=$(git rev-parse HEAD)

  # https://github.com/NVIDIA/k8s-driver-manager/blob/be979ef08699fac8a83f2ffb85fa1ff3d606ba20/deployments/container/Dockerfile.distroless#L62
  - name: add vfio-manage script
    runs: |
      install -Dm755 scripts/vfio-manage ${{targets.contextdir}}/usr/bin/vfio-manage

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: driver-manager
    - uses: test/tw/ver-check
      with:
        bins: driver-manager
    - name: Verify driver-manager subcommands
      runs: |
        driver-manager --help | grep -F "preflight_check"
        driver-manager --help | grep -F "uninstall_driver"
    - uses: test/kwok/cluster
    - uses: test/daemon-check-output
      with:
        start: |
          env NODE_NAME="node-000000" driver-manager --kubeconfig="$HOME/.kube/config" preflight_check
        expected_output: |
          Performing preflight checks
          Preflight checks completed

environment:
  contents:
    packages:
      - go-fips-1.25
