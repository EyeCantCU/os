package:
  name: prometheus-node-exporter
  version: "1.9.1"
  epoch: 7 # CVE-2025-47907
  description: Prometheus Exporter for machine metrics
  copyright:
    - license: Apache-2.0
  dependencies:
    # REMOVE_POST_USRMERGE - https://github.com/orgs/wolfi-dev/discussions/40270
    provides:
      - prometheus-node-exporter-compat=${{package.full-version}}
    runtime:
      - merged-bin
      - wolfi-baselayout

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/node_exporter
      tag: v${{package.version}}
      expected-commit: f2ec547b49af53815038a50265aa2adcd1275959

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0

  - runs: |
      sed -i '/_ "net\/http\/pprof"/d' node_exporter.go
      git diff

  - runs: |
      make build

  - runs: |
      install -Dm755 node_exporter "${{targets.destdir}}"/usr/bin/node_exporter

  - uses: strip

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    description: "iamguarded compat package for ${{package.name}}"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: prometheus-node-exporter
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /opt/iamguarded/node-exporter/bin
          ln -sf /usr/bin/node_exporter /opt/iamguarded/node-exporter/bin/node_exporter
      - uses: iamguarded/finalize-compat
        with:
          package: prometheus-node-exporter
          version: ${{vars.major-version}}
    test:
      pipeline:
        - runs: stat /opt/iamguarded/node-exporter/bin/node_exporter
        - uses: iamguarded/test-compat
          with:
            package: prometheus-node-exporter
            version: ${{vars.major-version}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        node_exporter --version
        node_exporter --help
