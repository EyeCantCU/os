package:
  name: prometheus-node-exporter
  version: "1.10.2"
  epoch: 4 # GHSA-j5w8-q4qc-rx2x
  description: Prometheus Exporter for machine metrics
  copyright:
    - license: Apache-2.0
  dependencies:
    # REMOVE_POST_USRMERGE - https://github.com/orgs/wolfi-dev/discussions/40270
    provides:
      - prometheus-node-exporter-compat=${{package.full-version}}
    runtime:
      - merged-bin
      - wolfi-baselayout

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/node_exporter
      tag: v${{package.version}}
      expected-commit: 654f19dee6a0c41de78a8d6d870e8c742cdb43b9

  - uses: go/bump
    with:
      deps: |-
        github.com/opencontainers/selinux@v1.13.0
        golang.org/x/crypto@v0.45.0

  - runs: |
      sed -i '/_ "net\/http\/pprof"/d' node_exporter.go
      git diff

  - runs: |
      make build

  - runs: |
      install -Dm755 node_exporter "${{targets.destdir}}"/usr/bin/node_exporter

  - uses: strip

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    description: "iamguarded compat package for ${{package.name}}"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: prometheus-node-exporter
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /opt/iamguarded/node-exporter/bin
          ln -sf /usr/bin/node_exporter /opt/iamguarded/node-exporter/bin/node_exporter
      - uses: iamguarded/finalize-compat
        with:
          package: prometheus-node-exporter
          version: ${{vars.major-version}}
    test:
      pipeline:
        - runs: stat /opt/iamguarded/node-exporter/bin/node_exporter
        - uses: iamguarded/test-compat
          with:
            package: prometheus-node-exporter
            version: ${{vars.major-version}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    # Basic smoke tests
    - runs: |
        node_exporter --version
        node_exporter --help
    # Functional test: verify HTTP metrics endpoint works
    - name: Test metrics collection and HTTP endpoint
      uses: test/daemon-check-output
      with:
        start: /usr/bin/node_exporter --collector.disable-defaults --collector.cpu --web.listen-address=:9100
        expected_output: "Listening on"
        timeout: "30"
        post: |
          # Wait for HTTP server to be ready
          wait-for-it localhost:9100 -t 10

          # Query the metrics endpoint
          metrics=$(curl -f -s http://localhost:9100/metrics)

          # Verify we got Prometheus-formatted output (should have HELP/TYPE comments)
          echo "$metrics" | grep -F "# HELP" || {
            echo "FAIL: Expected Prometheus metrics format with HELP comments"
            exit 1
          }

          # Verify cpu collector is exposing metrics
          echo "$metrics" | grep -F "node_cpu_seconds_total" || {
            echo "FAIL: Expected node_cpu_seconds_total metric from cpu collector"
            exit 1
          }

          # Verify the metrics endpoint returns expected content type hints
          echo "$metrics" | grep -F "# TYPE" || {
            echo "FAIL: Expected Prometheus metrics format with TYPE comments"
            exit 1
          }

          echo "SUCCESS: node_exporter is collecting and exposing Prometheus metrics via HTTP"
