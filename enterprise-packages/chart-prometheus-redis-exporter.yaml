package:
  name: chart-prometheus-redis-exporter
  version: "6.21.0"
  epoch: 0
  description: Prometheus exporter for Redis metrics
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/helm-charts
      tag: prometheus-redis-exporter-${{package.version}}
      expected-commit: a148d52378029822d328333a56343c3ccef5e5f8

  - uses: charts/package
    with:
      chart-path: charts/prometheus-redis-exporter
      images: |
        redis-exporter:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        ignore:
          - v0.0.0@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        cases:
          - name: default
            images: [redis-exporter]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: prometheus-community/helm-charts
    strip-prefix: prometheus-redis-exporter-
    use-tag: true
    tag-filter-prefix: prometheus-redis-exporter-
