#nolint:valid-pipeline-git-checkout-tag
package:
  name: py3-nvidia-cutlass-dsl-cuda-13.0
  version: "4.3.5"
  epoch: 0
  description: NVIDIA CUTLASS Python DSL
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: nvidia-cutlass-dsl

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: "$1"
    to: cuda-version

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/cutlass
      tag: v${{package.version}}
      expected-commit: 4faf1a1568cf1e4ad8ff71846a13e16f2a6a6f6b

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-typing-extensions
        - py${{range.key}}-cuda-python-cuda-${{vars.cuda-version}}
    pipeline:
      - runs: |
          # Download and install nvidia-cutlass-dsl wheel from PyPI because no properly-buildable upstream source exists
          # This should eventually be resolved as they've made progress on main but not on the tagged version, and
          # allegedly they're leaving beta soon...
          python${{range.key}} -m pip install \
            --no-deps \
            --no-cache-dir \
            --root-user-action ignore \
            --prefix=/usr \
            --root=${{targets.subpkgdir}} \
            --verbose \
            ${{vars.pypi-package}}==${{package.version}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - py${{range.key}}-pip
            - libcuda-stub-cuda-${{vars.cuda-version}}-dev # Would be replaced by a legitimate provider at normal runtime
      pipeline:
        - runs: |
            # Verify package is recognized by pip
            pip${{range.key}} show nvidia-cutlass-dsl
        - uses: test/tw/ldd-check

  - name: py3-supported-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.11-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.12-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.13-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: NVIDIA/cutlass
    strip-prefix: v
  ignore-regex-patterns:
    - ".*a.*" # Ignore alpha versions
