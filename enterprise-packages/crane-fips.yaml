package:
  name: crane-fips
  version: "0.21.2"
  epoch: 0 # CVE-2025-61732
  description: Tool for interacting with remote images and registries.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google/go-containerregistry
      tag: v${{package.version}}
      expected-commit: 9e0ccb0a7240fe7cc820f0fc78e2e2b1ef8b7e71

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/crane
      ldflags: |
        -buildid=
        -X github.com/google/go-containerregistry/cmd/crane/cmd.Version=${{package.version}}
        -X github.com/google/go-containerregistry/pkg/v1/remote/transport.Version=${{package.version}}
      output: crane

subpackages:
  - name: krane-fips
    description: "Krane a drop-in replacement for crane with additional authentication"
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          packages: .
          ldflags: -buildid= -X github.com/google/go-containerregistry/cmd/crane/cmd.Version=${{package.version}} -X github.com/google/go-containerregistry/pkg/v1/remote/transport.Version=${{package.version}}
          modroot: /home/build/cmd/krane
          output: krane
    test:
      environment:
        contents:
          packages:
            - jq
      pipeline:
        - uses: test/go-fips-check
        - name: Verify Krane installation
          runs: |
            krane version | grep ${{ package.version }} || exit 1
            krane --help
        - name: Fetch and verify manifest
          runs: |
            krane manifest chainguard/static | jq '.schemaVersion' | grep '2' || exit 1
        - name: List tags for a public image
          runs: |
            krane ls chainguard/static | grep -E 'latest|v[0-9]+.[0-9]+.[0-9]+' || exit 1
        - name: Validate image existence
          runs: |
            krane digest chainguard/static:latest && echo "Image exists" || exit 1
        - name: Pull and save an image locally
          runs: |
            krane pull chainguard/static:latest static_latest.tar || exit 1
            [ -f static_latest.tar ] || exit 1

update:
  enabled: true
  github:
    identifier: google/go-containerregistry
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - uses: test/go-fips-check
    - name: Verify Crane installation
      runs: |
        crane version | grep ${{ package.version }} || exit 1
        crane --help
    - name: Fetch and verify manifest
      runs: |
        crane manifest cgr.dev/chainguard/static | jq '.schemaVersion' | grep '2' || exit 1
    - name: List tags for a public image
      runs: |
        crane ls cgr.dev/chainguard/static | grep -E 'latest|v[0-9]+.[0-9]+.[0-9]+' || exit 1
    - name: Validate image existence
      runs: |
        crane digest cgr.dev/chainguard/static:latest && echo "Image exists" || exit 1
    - name: Pull and save an image locally
      runs: |
        crane pull cgr.dev/chainguard/static:latest static_latest.tar || exit 1
        [ -f static_latest.tar ] || exit 1
