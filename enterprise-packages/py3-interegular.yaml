# Please note that the last release of this package was in 2024 over pypy
# They have't cut tags on Github since 5 years.
# They rather release on main itself https://github.com/MegaIng/interegular/blob/758f83721c1ac306b96b7a706b69716a67ed954b/interegular/__init__.py#L34
# release monitor is the only way hence to automate this
# This project is small and looks complete and has no CVEs as of date
# So we can keep it as it is hard requirement for lm-format-enforcer which is hard requirement for vllm
package:
  name: py3-interegular
  version: "0.3.3"
  epoch: 1 # go/enterprise-rsc/py3-interegular
  description: Allows to check regexes for overlaps.
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  pypi-package: interegular
  import: interegular

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: fetch
    with:
      expected-sha256: d9b697b21b34884711399ba0f0376914b81899ce670032486d0d048344a76600
      uri: https://files.pythonhosted.org/packages/source/i/interegular/interegular-${{package.version}}.tar.gz

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  release-monitor:
    identifier: 353231
