package:
  name: linux-gcp-6.18
  version: "6.18.9"
  epoch: 0
  description: "the GCP generic linux kernel 6.18 LTS"
  copyright:
    - license: GPL-2.0
  resources:
    cpu: 16
    memory: 24Gi
  dependencies:
    # If installing linux:version-flavor with no preference,
    # make this default.
    provider-priority: 10
    runtime:
      - ${{package.name}}-modules=${{package.full-version}}
      # Ensure we get Chainguard branding in our VMs.
      - chainguard-baselayout

vars:
  # DO NOT BUMP
  # Pinned to certified build.
  jitterentropy-package: linux-jitterentropy-6.18
  jitterentropy-version: 6.18.0-r0

environment:
  environment:
    KBUILD_BUILD_USER: noreply
    KBUILD_BUILD_HOST: chainguard.dev
    KBUILD_BUILD_VERSION: Chainguard

var-transforms:
  - from: ${{package.name}}
    match: 'linux-(.*)'
    replace: '$1'
    to: flavor
  - from: ${{package.name}}
    match: 'linux-(.*)-[0-9.]+'
    replace: '$1-generic'
    to: config-flavor
  - from: ${{package.name}}
    match: 'linux-(.*)'
    replace: '${{package.full-version}}-$1'
    to: version-flavor
  # Turn "6.12.0" into "6.12", but keep "6.12.51" as "6.12.51"
  - from: ${{package.version}}
    match: '^(\d+[.]\d+)(?:[.]0|([.][1-9]\d*))$'
    replace: '$1$2'
    to: mangled-package-version
  - from: ${{package.version}}
    match: '^(\d+\.\d+)\.\d+$'
    replace: '$1'
    to: mangled-kernel-major-version

