package:
  name: py3.9-pluggy
  version: "1.6.0"
  epoch: 0
  description: "Plugin management and hook calling for Python"
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3.9-build
      - py3.9-installer
      - py3.9-pip
      - py3.9-wheel
      - python-3.9

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/p/pluggy/pluggy-${{package.version}}.tar.gz
      expected-sha512: 8b88eb778ab955910bcde2b3a6c4925d0a239f932aa9b1d8a351aa21b8a922bd842f735e397ef15ed9bd8e51085a88723660e1e691888a9879e7144add32bff2

  - uses: py/pip-build-install
    with:
      python: python3.9
      dest: ${{targets.contextdir}}

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: pluggy

update:
  enabled: true
  release-monitor:
    identifier: 7500
