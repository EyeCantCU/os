package:
  name: chart-iamguarded-opensearch
  version: "2.0.10"
  epoch: 0
  description: Opensearch iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: opensearch/${{package.version}}
      expected-commit: 0822e6a9f462ebacce72f272b1c9ae83823b2a46

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/opensearch

  - uses: charts/package
    with:
      chart-path: iamguarded/opensearch

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: opensearch/
    use-tag: true
    tag-filter-prefix: opensearch/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /opensearch
