package:
  name: moreutils
  version: "0.70"
  epoch: 0
  description: A collection of the unix tools that nobody thought to write long ago
  copyright:
    - license: GPL-2.0-or-later
  dependencies:
    runtime:
      - perl

environment:
  contents:
    packages:
      - build-base
      - busybox
      - docbook-xml
      - libxml2-utils
      - libxslt
      - perl

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6cb7c5ce79d1c71affcb9876b71aab75b0114ad5
      repository: git://git.joeyh.name/moreutils
      tag: ${{package.version}}

  - runs: |
      make DOCBOOKXSL=/usr/share/xml/docbook/xsl-stylesheets
      make install PREFIX=/usr DESTDIR=${{targets.destdir}}

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    description: Documentation for moreutils
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  git: {}

test:
  environment:
    contents:
      packages:
        - gzip
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test sponge
      runs: |
        set -euo pipefail
        echo "hello world" | sponge /tmp/test.txt
        grep -F "hello world" /tmp/test.txt
    - name: Test isutf8
      runs: |
        set -euo pipefail
        echo "valid utf8" | isutf8
    - name: Test errno
      runs: |
        set -euo pipefail
        errno ENOENT | grep -F "No such file"
        errno 2 | grep -F ENOENT
    - name: Test ifne
      runs: |
        set -euo pipefail
        echo "data" | ifne cat | grep -F data
    - name: Test pee
      runs: |
        set -euo pipefail
        echo "test" | pee cat cat | wc -l | grep -F 2
    - name: Test mispipe
      runs: |
        set -euo pipefail
        mispipe "echo hello" cat | grep -F hello
    - name: Test ts
      runs: |
        set -euo pipefail
        echo "log message" | ts | grep -F "log message"
    - name: Test combine
      runs: |
        set -euo pipefail
        printf "a\nb\nc\n" > /tmp/f1.txt
        printf "b\nc\nd\n" > /tmp/f2.txt
        combine /tmp/f1.txt and /tmp/f2.txt | grep -F b
    - name: Test zrun
      runs: |
        set -euo pipefail
        echo "compressed" | gzip > /tmp/test.gz
        zrun cat /tmp/test.gz | grep -F compressed
    - name: Test parallel
      runs: |
        set -euo pipefail
        parallel -j2 echo -- a b c | sort | head -1 | grep -F a
    - name: Test lckdo
      runs: |
        set -euo pipefail
        lckdo /tmp/test.lock echo "locked" | grep -F locked
    - name: Test ifdata
      runs: |
        set -euo pipefail
        ifdata -e lo
    - name: Verify Perl scripts are installed
      runs: |
        set -euo pipefail
        # These require a TTY or optional Perl modules to run
        stat /usr/bin/chronic
        stat /usr/bin/vidir
        stat /usr/bin/vipe
