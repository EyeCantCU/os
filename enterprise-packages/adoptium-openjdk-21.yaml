# need to use release monitor as tags are cut before the release
#nolint:git-checkout-must-use-github-updates,update-identifier-must-match-git-repository
package:
  name: adoptium-openjdk-21
  version: "21.0.10.7"
  epoch: 1
  description: "Adoptium OpenJDK 21"
  copyright:
    - license: GPL-2.0-with-classpath-exception
  dependencies:
    runtime:
      - adoptium-openjdk-21-jre

environment:
  contents:
    packages:
      - alsa-lib-dev
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cups-dev
      - file
      - fontconfig-dev
      - freetype-dev
      - giflib-dev
      - lcms2-dev
      - libffi-dev
      - libjpeg-turbo-dev
      - libx11-dev
      - libxext-dev
      - libxi-dev
      - libxrandr-dev
      - libxrender-dev
      - libxt-dev
      - libxtst-dev
      - openjdk-21-default-jdk
      - zip
  environment:
    # This is needed to work around the error date 1970-01-01T00:00:00Z is not within the valid range 1980-01-01T00:00:02Z to 2099-12-31T23:59:59Z
    SOURCE_DATE_EPOCH: 315532900

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+.\d+.\d+)\.(\d+)$
    replace: $1+$2
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/adoptium/jdk21u.git
      tag: jdk-${{vars.mangled-package-version}}_adopt
      expected-commit: a633eafe0fccb1902f3f787a382c2df6e81fc335

  - name: Ensure the tag we build is a release tag
    runs: |
      git fetch origin release
      # This is not perfect, note that release tag can potentially
      # already contain next EA build zero tag already
      [ "$(git describe FETCH_HEAD)" = "jdk-${{vars.mangled-package-version}}_adopt" ]

  - working-directory: /home/build/googletest
    pipeline:
      - uses: fetch
        with:
          uri: https://github.com/google/googletest/archive/v1.14.0.tar.gz
          expected-sha512: 765c326ccc1b87a01027385e69238266e356361cd4ee3e18e3c9d137a5d11fa5d657c164d02dd1be8fe693c8e10f2b580588dbfa57d27f070e2750f50d3e662c

  - uses: patch
    with:
      patches: JDK-8332297.patch

  - runs: chmod +x configure

  # Note that despite using --with-extra-cflags, --with-extra-cxxflags, and
  # --with-extra-ldflags, the configure still produces warnings like:
  # https://github.com/wolfi-dev/os/issues/18747
  - uses: autoconf/configure
    with:
      opts: |
        --with-extra-cflags="$CFLAGS" \
        --with-extra-cxxflags="$CXXFLAGS" \
        --with-extra-ldflags="$LDFLAGS" \
        --with-boot-jdk=/usr/lib/jvm/java-21-openjdk \
        --prefix=/usr/lib/jvm/java-21-adoptium \
        --with-vendor-name=wolfi \
        --with-vendor-url=https://wolfi.dev \
        --with-vendor-bug-url=https://github.com/wolfi-dev/os/issues \
        --with-version-opt="wolfi-r${{package.epoch}}" \
        --disable-warnings-as-errors \
        --disable-precompiled-headers \
        --enable-dtrace=no \
        --with-zlib=system \
        --with-debug-level=release \
        --with-native-debug-symbols=internal \
        --with-jvm-variants=server \
        --with-jtreg=no  \
        --with-libpng=system \
        --with-jvm-variants=server \
        --with-libjpeg=system \
        --with-giflib=system \
        --with-lcms=system \
        --with-gtest="/home/build/googletest" \
        --with-version-pre="no" \
        --with-version-string=""

  - runs: make jdk-image

  # Check we built something valid
  - runs: |
      _java_bin="./build/*-server-release/images/jdk/bin"

      $_java_bin/javac -d . HelloWorld.java
      $_java_bin/java HelloWorld

      # NOTE: Disable flakey tests for now as we're seeing builds hang on aarch64
      # # run the gtest unittest suites
      # make test-hotspot-gtest

  - runs: |
      _java_home="usr/lib/jvm/java-21-adoptium"

      mkdir -p "${{targets.destdir}}"/$_java_home
      cp -r build/*-server-release/images/jdk/* "${{targets.destdir}}"/$_java_home
      rm "${{targets.destdir}}"/$_java_home/lib/src.zip

subpackages:
  - name: "${{package.name}}-dbg"
    description: "OpenJDK 21 Java Debug Symbols"
    pipeline:
      - uses: split/debug
    dependencies:
      runtime:
        - adoptium-openjdk-21
    test:
      pipeline:
        - uses: test/tw/debugpackage

  - name: "${{package.name}}-jre"
    description: "OpenJDK 21 Java Runtime Environment"
    dependencies:
      runtime:
        - alsa-lib
        - freetype
        - giflib
        - lcms2
        - libfontconfig1
        - libjpeg-turbo
        - libxi
        - libxext
        - libxi
        - libxrender
        - libxtst
        - adoptium-openjdk-21-jre-base
    pipeline:
      - runs: |
          _java_home="usr/lib/jvm/java-21-adoptium"

          mkdir -p "${{targets.subpkgdir}}"/$_java_home/lib
          mv "${{targets.destdir}}"/$_java_home/lib/libawt_xawt.so \
              "${{targets.destdir}}"/$_java_home/lib/libfontmanager.so \
              "${{targets.destdir}}"/$_java_home/lib/libjavajpeg.so \
              "${{targets.destdir}}"/$_java_home/lib/libjawt.so \
              "${{targets.destdir}}"/$_java_home/lib/libjsound.so \
              "${{targets.destdir}}"/$_java_home/lib/liblcms.so \
              "${{targets.destdir}}"/$_java_home/lib/libsplashscreen.so \
              "${{targets.subpkgdir}}"/$_java_home/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check
          with:
            extra-library-paths: "/usr/lib/jvm/java-21-adoptium/lib/:/usr/lib/jvm/java-21-adoptium/lib/server/"

  - name: "${{package.name}}-jre-base"
    description: "OpenJDK 21 Java Runtime Environment (headless)"
    dependencies:
      runtime:
        - java-common
        - java-cacerts
    pipeline:
      - runs: |
          _java_home="usr/lib/jvm/java-21-adoptium"

          mkdir -p "${{targets.subpkgdir}}"/$_java_home
          mv "${{targets.destdir}}"/$_java_home/lib \
             "${{targets.subpkgdir}}"/$_java_home

          mkdir -p "${{targets.subpkgdir}}"/$_java_home/bin
          for i in java \
                    jfr \
                    jrunscript \
                    keytool \
                    rmiregistry; do
            mv "${{targets.destdir}}"/$_java_home/bin/$i "${{targets.subpkgdir}}"/$_java_home/bin/$i
          done

          mv "${{targets.destdir}}"/$_java_home/legal "${{targets.subpkgdir}}"/$_java_home
          mv "${{targets.destdir}}"/$_java_home/conf "${{targets.subpkgdir}}"/$_java_home
          mv "${{targets.destdir}}"/$_java_home/release "${{targets.subpkgdir}}"/$_java_home
          cp ASSEMBLY_EXCEPTION \
              LICENSE \
              README.md \
             "${{targets.subpkgdir}}"/$_java_home

          # symlink to shared java cacerts store
          rm -f "${{targets.subpkgdir}}"/$_java_home/lib/security/cacerts
          ln -sf /etc/ssl/certs/java/cacerts \
            "${{targets.subpkgdir}}"/$_java_home/lib/security/cacerts

          # symlink for `java-common` to work (which expects jre in $_java_home/jre)
          ln -sf . "${{targets.subpkgdir}}/$_java_home/jre"
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: "/usr/lib/jvm/java-21-adoptium/lib/"
            name: "*.so*"

  - name: "${{package.name}}-jmods"
    description: "OpenJDK 21 jmods"
    dependencies:
      provides:
        - adoptium-openjdk-jmods=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/jvm/java-21-adoptium
          mv "${{targets.destdir}}"/usr/lib/jvm/java-21-adoptium/jmods \
             "${{targets.subpkgdir}}"/usr/lib/jvm/java-21-adoptium
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: adoptium-openjdk-jmods
            real-pkg-name: ${{subpkg.name}}

  - name: "${{package.name}}-doc"
    description: "OpenJDK 21 Documentation"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/jvm/java-21-adoptium
          mv "${{targets.destdir}}"/usr/lib/jvm/java-21-adoptium/man \
             "${{targets.subpkgdir}}"/usr/lib/jvm/java-21-adoptium
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: "/usr/lib/jvm/java-21-adoptium/man/"
            name: "*.1"

  - name: "${{package.name}}-demos"
    description: "OpenJDK 21 Demos"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/jvm/java-21-adoptium
          mv "${{targets.destdir}}"/usr/lib/jvm/java-21-adoptium/demo \
             "${{targets.subpkgdir}}"/usr/lib/jvm/java-21-adoptium
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: "/usr/lib/jvm/java-21-adoptium/demo/nbproject/jfc/TableExample/"
            name: "*.properties"

  - name: "${{package.name}}-default-jvm"
    description: "Use the adoptium-openjdk-21 JVM as the default JVM"
    dependencies:
      runtime:
        - adoptium-openjdk-21-jre
      provides:
        - default-jvm=1.21
        - default-jvm-lts=1.21
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/jvm
          ln -sf java-21-adoptium "${{targets.subpkgdir}}"/usr/lib/jvm/default-jvm
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: default-jvm
            real-pkg-name: ${{subpkg.name}}
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: default-jvm-lts
            real-pkg-name: ${{subpkg.name}}

  - name: "${{package.name}}-default-jdk"
    description: "Use the adoptium-openjdk-21 JVM as the default JVM with the JDK installed"
    dependencies:
      runtime:
        - adoptium-openjdk-21-default-jvm
        - adoptium-openjdk-21
      provides:
        - default-jdk=1.21
        - default-jdk-lts=1.21
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: default-jdk
            real-pkg-name: ${{subpkg.name}}
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: default-jdk-lts
            real-pkg-name: ${{subpkg.name}}

# NOTE:
# track released binaries rather than source tags to avoid the
# obscure way that source releases are tagged in jdk21u.
update:
  enabled: true
  github:
    identifier: adoptium/temurin21-binaries
  version-transform:
    - match: ^jdk-(21\.\d+\.\d+)\+(\d+)$
      replace: $1.$2

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-default-jdk
        - ${{package.name}}-jmods
    environment:
      JAVA_HOME: usr/lib/jvm/java-21-adoptium
  pipeline:
    # Test a basic Hello World
    - working-directory: basic
      runs: |
        javac HelloWorld.java
        java HelloWorld | grep -qi "Hello World!"
    # Test a basic HTTP connection
    - working-directory: basic
      runs: |
        javac RequestTest.java
        java RequestTest | grep -qi "Successfully connected to example.org"
    # Test modules
    - working-directory: advanced/module-project
      runs: |
        mkdir output
        javac -d output --module-source-path modules $(find modules -name "*.java")

        # Create a jar with the compiled classes
        jar --verbose --create --file app.jar \
          --main-class dev.chainguard.module.main.Main \
          --module-version 1.0 \
          -C output/test.modules . \
          -C output/main.app .

        # Test the jar
        java -jar app.jar

        # Test jlink
        jlink --verbose --module-path "app.jar:$JAVA_HOME/jmods" \
          --add-modules test.modules \
          --output test-project-jre

        # Test custom JRE
        test-project-jre/bin/java -jar app.jar
