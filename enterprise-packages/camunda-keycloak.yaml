package:
  name: camunda-keycloak
  version: "2025.10.17.001"
  epoch: 0
  description: "Camunda Keycloak"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: "-"
    to: mangled-package-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/camunda/keycloak
      tag: ${{vars.mangled-package-version}}
      expected-commit: 43c864cfe6457f5465430d3ad366079f170f5b56

subpackages:
  - name: "${{package.name}}-compat"
    dependencies:
      runtime:
        - aws-advanced-jdbc-wrapper
        - aws-sdk-java-v2
        - busybox
        - keycloak-metrics-spi
    description: "Compatibility package to place jars in the location expected by upstream"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/
          mkdir -p ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/log
          mkdir -p ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/tmp

          # aws sdk
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-annotations.jar               ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/annotations.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-apache-client.jar             ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/apache-client.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-auth.jar                      ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/auth.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-aws-core.jar                  ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/aws-core.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-aws-query-protocol.jar        ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/aws-query-protocol.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-checksums.jar                 ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/checksums.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-checksums-spi.jar             ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/checksums-spi.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-endpoints-spi.jar             ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/endpoints-spi.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-aws-eventstream.jar ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/eventstream.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth.jar                 ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/http-auth.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-aws.jar             ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/http-auth-aws.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-spi.jar             ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/http-auth-spi.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-http-client-spi.jar           ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/http-client-spi.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-identity-spi.jar              ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/identity-spi.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-json-utils.jar                ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/json-utils.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-metrics-spi.jar               ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/metrics-spi.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-netty-nio-client.jar          ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/netty-nio-client.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-profiles.jar                  ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/profiles.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-protocol-core.jar             ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/protocols.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-rds.jar                       ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/rds.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-regions.jar                   ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/regions.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-sdk-core.jar                  ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/sdk-core.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-sts.jar                       ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/sts.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-sts.jar                       ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/sts.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-third-party-jackson-core.jar  ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/third-party-jackson-core.jar

          # these not in the camunda-keycloak image but are in the aws-sdk-java-v2 package
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-imds.jar                      ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/imds.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-arns.jar                      ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/arns.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-http-auth-aws-crt.jar         ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/http-auth-aws-crt.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-crt-core.jar                  ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/crt-core.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-retries.jar                   ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/retries.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-auth-crt.jar                  ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/auth-crt.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-retries-spi.jar               ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/retries-spi.jar
          ln -sf /usr/share/java/aws-sdk-v2/aws-sdk-java-utils.jar                     ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/utils.jar

          # keycloak metrics spi
          ln -sf /usr/share/java/keycloak-metrics-spi/keycloak-metrics-spi.jar         ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/keycloak-metrics-spi.jar

          # aws advanced jdbc wrapper
          ln -sf /usr/share/java/aws-advanced-jdbc-wrapper.jar ${{targets.subpkgdir}}/opt/iamguarded/keycloak/providers/aws-advanced-jdbc-wrapper.jar
    # test added by a robot (compat)
    test:
      pipeline:
        - runs: |
            readlink -v /opt/iamguarded/keycloak/providers/annotations.jar
            readlink -v /opt/iamguarded/keycloak/providers/apache-client.jar
            readlink -v /opt/iamguarded/keycloak/providers/arns.jar
            readlink -v /opt/iamguarded/keycloak/providers/auth-crt.jar
            readlink -v /opt/iamguarded/keycloak/providers/auth.jar
            readlink -v /opt/iamguarded/keycloak/providers/aws-advanced-jdbc-wrapper.jar
            readlink -v /opt/iamguarded/keycloak/providers/aws-core.jar
            readlink -v /opt/iamguarded/keycloak/providers/aws-query-protocol.jar
            readlink -v /opt/iamguarded/keycloak/providers/checksums-spi.jar
            readlink -v /opt/iamguarded/keycloak/providers/checksums.jar
            readlink -v /opt/iamguarded/keycloak/providers/crt-core.jar
            readlink -v /opt/iamguarded/keycloak/providers/endpoints-spi.jar
            readlink -v /opt/iamguarded/keycloak/providers/eventstream.jar
            readlink -v /opt/iamguarded/keycloak/providers/http-auth-aws-crt.jar
            readlink -v /opt/iamguarded/keycloak/providers/http-auth-aws.jar
            readlink -v /opt/iamguarded/keycloak/providers/http-auth-spi.jar
            readlink -v /opt/iamguarded/keycloak/providers/http-auth.jar
            readlink -v /opt/iamguarded/keycloak/providers/http-client-spi.jar
            readlink -v /opt/iamguarded/keycloak/providers/identity-spi.jar
            readlink -v /opt/iamguarded/keycloak/providers/imds.jar
            readlink -v /opt/iamguarded/keycloak/providers/json-utils.jar
            readlink -v /opt/iamguarded/keycloak/providers/keycloak-metrics-spi.jar
            readlink -v /opt/iamguarded/keycloak/providers/metrics-spi.jar
            readlink -v /opt/iamguarded/keycloak/providers/netty-nio-client.jar
            readlink -v /opt/iamguarded/keycloak/providers/profiles.jar
            readlink -v /opt/iamguarded/keycloak/providers/protocols.jar
            readlink -v /opt/iamguarded/keycloak/providers/rds.jar
            readlink -v /opt/iamguarded/keycloak/providers/regions.jar
            readlink -v /opt/iamguarded/keycloak/providers/retries-spi.jar
            readlink -v /opt/iamguarded/keycloak/providers/retries.jar
            readlink -v /opt/iamguarded/keycloak/providers/sdk-core.jar
            readlink -v /opt/iamguarded/keycloak/providers/sts.jar
            readlink -v /opt/iamguarded/keycloak/providers/third-party-jackson-core.jar
            readlink -v /opt/iamguarded/keycloak/providers/utils.jar

update:
  enabled: true
  version-transform:
    - match: "-"
      replace: "."
  github:
    identifier: camunda/keycloak

# test added by a robot. The APK was empty when it was checked,
# which may not be true forever. If this test fails in the future, please
# replace it with a more accurate test.
test:
  pipeline:
    - uses: test/emptypackage
