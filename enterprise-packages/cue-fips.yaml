package:
  name: cue-fips
  version: "0.15.4"
  epoch: 4
  description: The home of the CUE language! Validate and define text-based and dynamic configuration
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips
      - openssl-config-fipshardened

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cue-lang/cue
      tag: v${{package.version}}
      expected-commit: 50c137cdd1d9bc64c3f62c197dea20538a4f5fa8

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/cue
      output: cue
      ldflags: -w -buildid= -X cuelang.org/go/cmd/cue/cmd.version=${{package.version}}
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: cue-lang/cue
    strip-prefix: v

subpackages:
  - name: ${{package.name}}-bash-completion
    description: bash completion for cue
    pipeline:
      - runs: |
          set -x
          mkdir -p "${{targets.subpkgdir}}/usr/share/bash-completion/completions"
          ${{targets.destdir}}/usr/bin/cue completion bash > ${{targets.subpkgdir}}/usr/share/bash-completion/completions/cue
    dependencies:
      runtime:
        - cue-fips
    test:
      pipeline:
        - name: Verify bash completion file exists
          runs: |
            set -euo pipefail
            # Verify bash completion file was installed correctly (fails test if missing)
            stat /usr/share/bash-completion/completions/cue

  - name: ${{package.name}}-zsh-completion
    description: zsh completion for cue
    pipeline:
      - runs: |
          set -x
          mkdir -p "${{targets.subpkgdir}}/usr/share/zsh/site-functions"
          ${{targets.destdir}}/usr/bin/cue completion zsh > ${{targets.subpkgdir}}/usr/share/zsh/site-functions/_cue
    dependencies:
      runtime:
        - cue-fips
    test:
      pipeline:
        - name: Verify zsh completion file exists
          runs: |
            set -euo pipefail
            # Verify zsh completion file was installed correctly (fails test if missing)
            stat /usr/share/zsh/site-functions/_cue

  - name: ${{package.name}}-fish-completion
    description: fish completion for cue
    pipeline:
      - runs: |
          set -x
          mkdir -p "${{targets.subpkgdir}}/usr/share/fish/vendor_completions.d"
          ${{targets.destdir}}/usr/bin/cue completion fish > ${{targets.subpkgdir}}/usr/share/fish/vendor_completions.d/cue.fish
    dependencies:
      runtime:
        - cue-fips
    test:
      pipeline:
        - name: Verify fish completion file exists
          runs: |
            set -euo pipefail
            # Verify fish completion file was installed correctly (fails test if missing)
            stat /usr/share/fish/vendor_completions.d/cue.fish

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: cue
    - uses: test/tw/help-check
      with:
        bins: cue
    - name: Test CUE configuration validation
      runs: |
        set -euo pipefail
        # Create a valid CUE configuration file
        tee /tmp/test.cue <<'EOF'
        package test

        name: "test"
        count: 42
        enabled: true
        EOF

        # Verify cue can validate the configuration (fails test if invalid)
        cue vet /tmp/test.cue

        echo "SUCCESS: CUE configuration validation works"
