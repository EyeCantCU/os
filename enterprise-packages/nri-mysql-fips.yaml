package:
  name: nri-mysql-fips
  version: "1.19.0"
  epoch: 0 # CVE-2025-61732
  description: New Relic Infrastructure mysql Integration (FIPS)
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-mysql
      expected-commit: 12d72e68ca2a05366cd8f4283f98acdd71233fda
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-mysql
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-mysql ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-mysql
          install -Dm644 legacy/mysql-definition.yml ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/mysql-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-mysql
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-mysql
    - uses: test/tw/ver-check
      with:
        bins: nri-mysql
        version-flag: "-show_version"
    - name: Test binary execution
      uses: test/daemon-check-output
      with:
        start: |
          nri-mysql
        expected_output: |
          connect: connection refused
        error_strings: |
          FAIL
          Traceback.*most.recent.call
