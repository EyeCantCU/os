package:
  name: npm-10.8.2
  version: "10.8.2"
  epoch: 4
  description: "the npm package manager for javascript, pinned to 10.18.2 specifically for node-18"
  copyright:
    - license: Artistic-2.0

environment:
  contents:
    packages:
      - build-base
      - rsync
      - wolfi-base

pipeline:
  - uses: fetch
    with:
      uri: https://registry.npmjs.org/npm/-/npm-${{package.version}}.tgz
      expected-sha512: c7f0088c520a46596b85c6f8f1da943400199748a0f7ea8cb8df75469668dc26f6fb3ba26df87e2884a5ebe91557292d0f3db7d0929cdb4f14910c3032ac81fb
      delete: true

  - uses: patch
    with:
      patches: |
        brace-expansion-2.0.2.patch

  - runs: |
      # Wrapper scripts written in Bash and CMD.
      rm bin/npm bin/npx bin/*.cmd
      rm README.md

      # HTML docs
      rm -rf docs

  - working-directory: /home/build/node_modules
    runs: |
      find . -type f \( \
             -name '.*' -o \
             -name '*.cmd' -o \
             -name '*.bat' -o \
             -name '*.map' -o \
             -name '*.md' -o \
             \( -name '*.ts' -a ! -name '*.d.ts' \) -o \
             -name 'AUTHORS*' -o \
             -name 'LICENSE*' -o \
             -name 'license' -o \
             -name 'node-gyp' -o \
             -name 'Makefile' -o \
             -name 'README*' -o \
             -name 'readme.markdown' \) -delete

      rm -rf ./*/.git* ./*/doc ./*/docs ./*/examples ./*/scripts ./*/test
      rm -rf node_modules/node-gyp

      find . -type f -executable  -exec chmod -x {} \;

  - working-directory: /home/build/man
    runs: |
      for f in man5/folders.5 man5/install.5 man7/*.7; do
        sec=${f##*.}
        name=$(basename $f .$sec)
        title=$(echo "$name" | tr '[:lower:]' '[:upper:]')

        sed -Ei "s/^\.TH \"$title\"/.TH \"NPM-$title\"/" "$f"
        mv "$f" "${f%/*}/npm-$name.$sec"
      done

  - uses: fetch
    with:
      uri: https://registry.npmjs.org/cross-spawn/-/cross-spawn-7.0.6.tgz
      expected-sha512: b95d903963f69d6ceccb668ca7c69189b862f5d9731791e0879487681f4e893184c834e2249cb1d2ecb9d505ddc966ed00736e6b85c9cd429c6b73b3294777bc
      extract: false

  - working-directory: /home/build
    runs: |
      tar -x --strip-components=1 -C node_modules/cross-spawn -f cross-spawn-7.0.6.tgz
      rm cross-spawn-7.0.6.tgz

  - runs: |
      destdir="${{targets.destdir}}"/usr/lib/node_modules/npm
      install -dDm755 "$destdir"
      rsync -av --exclude melange-out /home/build/ "$destdir"
      chmod 755 "$destdir"

  - working-directory: ${{targets.destdir}}/usr/bin
    runs: |
      ln -s ../lib/node_modules/npm/bin/npm-cli.js npm
      ln -s ../lib/node_modules/npm/bin/npx-cli.js npx

  - working-directory: ${{targets.destdir}}/usr/share
    runs: |
      mv "${{targets.destdir}}"/usr/lib/node_modules/npm/man man
      ln -s ../../../share/man "${{targets.destdir}}"/usr/lib/node_modules/npm/man

update:
  manual: true
  exclude-reason: |
    This package is meant as a stop-gap to ensure node-18 works until it is no longer in maintenance:
    https://nodejs.org/en/about/previous-releases

test:
  environment:
    contents:
      packages:
        - nodejs
    environment:
      HOME: /home/build
  pipeline:
    - runs: |
        npm --version
        npm install -g cowsay
        cowsay Yay! It works!
        npm help
        npx --version
        npx --help
