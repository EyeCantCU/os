package:
  name: pvc-autoresizer-fips
  version: "0.20.0"
  epoch: 1
  description: Auto-resize PersistentVolumeClaim objects based on Prometheus metrics
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "7"
    memory: 16Gi

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5968e5df269035df54af36742a07f5a0cc731377
      repository: https://github.com/topolvm/pvc-autoresizer
      tag: v${{package.version}}

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd
      output: pvc-autoresizer

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}
          ln -sf /usr/bin/pvc-autoresizer ${{targets.subpkgdir}}/pvc-autoresizer
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - name: Check symlink
          runs: |
            stat /pvc-autoresizer

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: pvc-autoresizer
    - name: Verify in-cluster config error handling
      runs: |
        set -euo pipefail
        # We expect the below command to fail when run outside a Kubernetes cluster
        set +e
        output=$(pvc-autoresizer --prometheus-url=http://invalid-prometheus-server/api/v1/query --namespaces=default 2>&1)
        rc=$?
        set -e

        if [ "$rc" -eq 0 ]; then
          echo "ERROR: Expected command to fail but it succeeded"
          exit 1
        fi

        # Verify error message is helpful (fails test if not found)
        if ! echo "$output" | grep -iF "unable to load in-cluster config"; then
          echo "ERROR: Expected error message about in-cluster config"
          echo "Actual output: $output"
          exit 1
        fi

        echo "SUCCESS: Command failed gracefully with expected error message"

update:
  enabled: true
  github:
    identifier: topolvm/pvc-autoresizer
    strip-prefix: v
    tag-filter: v

environment:
  contents:
    packages:
      - go-fips-1.25
