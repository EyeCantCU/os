package:
  name: gops-fips
  version: "0.3.29"
  epoch: 1 # CVE-2025-68119
  description: gops is a command to list and diagnose Go processes currently running on your system.
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - git

pipeline:
  - uses: git-checkout
    with:
      expected-commit: a2d8f7790eac63a6668583a060cb45903410a91b
      repository: https://github.com/google/gops
      tag: v${{package.version}}

  - runs: |
      # This package is used in FIPS context
      # Assert that no cryptography is used
      echo Checking crypto is not used
      [ -z "$(go build -a -n 2>&1 | grep 'packagefile crypto=')" ]

  - uses: go/build
    with:
      packages: .
      ldflags: -linkmode external
      go-package: go-fips
      output: gops

update:
  enabled: true
  github:
    identifier: google/gops
    strip-prefix: v

test:
  pipeline:
    - runs: |
        gops --help
    - uses: test/go-fips-check
