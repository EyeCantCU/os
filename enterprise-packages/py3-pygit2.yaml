package:
  name: py3-pygit2
  version: "1.19.1"
  epoch: 0
  description: Python bindings to the libgit2 library
  copyright:
    # https://spdx.org/licenses/GCC-exception-2.0.html
    # This linking exception is mentioned in Project license: https://github.com/libgit2/pygit2#License-1-ov-file:
    - license: GPL-2.0-only WITH GCC-exception-2.0

vars:
  pypi-package: pygit2
  import: pygit2

data:
  - name: py-versions
    items:
      # python3.10 is not supported for this project
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - libgit2-dev
      - py3-supported-build-base-dev
      - py3-supported-cffi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/libgit2/pygit2
      tag: v${{package.version}}
      expected-commit: 7ee1ae57fef6327ab47b2c7049456501fcee6f74

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-cffi
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: test/tw/pip-check
        with:
          python: python${{range.key}}
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}
        - name: Test basic pygit2 functionality
          runs: |
            set -euo pipefail
            python${{range.key}} -c "
            import pygit2
            import tempfile
            import os

            # Create a temporary directory for the test repo
            with tempfile.TemporaryDirectory() as tmpdir:
                repo_path = os.path.join(tmpdir, 'test_repo')

                # Initialize a new repository
                repo = pygit2.init_repository(repo_path, False)
                print(f'Repository initialized at: {repo_path}')

                # Verify repository was created
                assert repo.is_empty
                print('Repository is empty (as expected)')

                # Test repository path
                assert repo.path == repo_path + '/.git/'
                print(f'Repository path verified: {repo.path}')

                # Test libgit2 version
                version = pygit2.LIBGIT2_VERSION
                print(f'libgit2 version: {version}')

                print('All pygit2 tests passed!')
            "

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/tw/emptypackage

update:
  enabled: true
  git:
    strip-prefix: v
