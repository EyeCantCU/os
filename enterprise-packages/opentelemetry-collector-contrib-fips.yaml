package:
  name: opentelemetry-collector-contrib-fips
  version: "0.132.0"
  epoch: 0 # CVE-2025-47907
  description: Contrib repository for the OpenTelemetry Collector
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - gcc-14-default

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-collector-contrib
      tag: v${{package.version}}
      expected-commit: b42536f0eaa6790e004be61767b1d2714e3f4ee3

  - uses: go/bump
    with:
      deps: |-
        github.com/docker/docker@v28.3.3
      modroot: receiver/hostmetricsreceiver

  - uses: go/bump
    with:
      deps: |-
        github.com/docker/docker@v28.3.3
      modroot: receiver/prometheusreceiver

  - uses: go/bump
    with:
      deps: |-
        github.com/docker/docker@v28.3.3
      modroot: receiver/mysqlreceiver

  # https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/35631
  - runs: |
      make genotelcontribcol

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v4@v4.0.5
        github.com/golang-jwt/jwt/v4@v4.5.2
      modroot: ./cmd/otelcontribcol

  - uses: go/build
    with:
      modroot: ./cmd/otelcontribcol
      packages: .
      output: otelcol-contrib
      go-package: go-fips-md5

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-collector-contrib
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        otelcol-contrib --version
        otelcol-contrib --help
