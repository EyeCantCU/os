package:
  name: opentelemetry-collector-contrib-fips
  version: "0.145.0"
  epoch: 3
  description: Contrib repository for the OpenTelemetry Collector
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "32"
    memory: 30Gi

environment:
  contents:
    packages:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-collector-contrib
      tag: v${{package.version}}
      expected-commit: 6a88877d723bdfba997c2f8db1f57eb97f5ab642
      cherry-picks: |
        main/95dc24a597eba4d20c796757b71b77606921fd64: fix client-credentials grant type regression

  # https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/35631
  - runs: |
      make genotelcontribcol

  - uses: go/build
    with:
      modroot: ./cmd/otelcontribcol
      packages: .
      output: otelcol-contrib
      go-package: go-fips-md5

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-collector-contrib
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: otelcol-contrib
    - uses: test/tw/help-check
      with:
        bins: otelcol-contrib
