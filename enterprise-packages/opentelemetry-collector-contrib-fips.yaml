package:
  name: opentelemetry-collector-contrib-fips
  version: "0.147.0"
  epoch: 0
  description: Contrib repository for the OpenTelemetry Collector
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "32"
    memory: 30Gi

environment:
  contents:
    packages:
      - go-fips-1.25

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-collector-contrib
      tag: v${{package.version}}
      expected-commit: 28446b3e2d590451992761222d4c43b7948632d8

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.51.0
      modroot: receiver/bigipreceiver

  # https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/35631
  - runs: |
      make genotelcontribcol

  - uses: go/build
    with:
      modroot: ./cmd/otelcontribcol
      packages: .
      output: otelcol-contrib
      go-package: go-fips-md5

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-collector-contrib
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: otelcol-contrib
    - uses: test/tw/help-check
      with:
        bins: otelcol-contrib
