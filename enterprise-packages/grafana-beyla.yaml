package:
  name: grafana-beyla
  version: "2.6.3"
  epoch: 0
  description: eBPF-based autoinstrumentation of web applications and network metrics
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - clang
      - go
      - libcap-utils
      - llvm
      - wget

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/beyla
      tag: v${{package.version}}
      expected-commit: 2f66f6e9a393d883a285fd15c3abdd7bb3943965
      recurse-submodules: true

  - runs: |
      go get github.com/go-viper/mapstructure/v2@v2.4.0
      go mod tidy
      go mod vendor

  - uses: autoconf/make
    with:
      opts: bpf2go

  - uses: autoconf/make
    with:
      opts: generate

  - uses: autoconf/make
    with:
      opts: copy-obi-vendor

  - uses: go/build
    with:
      output: beyla
      packages: ./cmd/beyla
      ldflags: |
        -X github.com/grafana/beyla/v2/pkg/buildinfo.Version=${{package.version}}
         -X github.com/grafana/beyla/v2/pkg/buildinfo.Revision=${{package.version}}
      vendor: true

  - runs: setcap 'cap_net_raw,cap_sys_admin,cap_bpf,cap_dac_read_search,cap_perfmon,cap_sys_ptrace,cap_checkpoint_restore+ep' "${{targets.contextdir}}/usr/bin/beyla"

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package for Grafana beyla"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/
          ln -s ./usr/bin/beyla ${{targets.contextdir}}/beyla
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
        - runs: |
            /beyla -h > help.txt 2>&1
            cat help.txt | grep "Usage of /beyla"

update:
  enabled: true
  github:
    identifier: grafana/beyla
    strip-prefix: v

# https://opentelemetry.io/es/docs/zero-code/obi/#limitations
capabilities:
  add:
    - CAP_SYS_ADMIN
    - CAP_DAC_READ_SEARCH
    - CAP_SYS_PTRACE
    - CAP_PERFMON
    - CAP_BPF
    - CAP_CHECKPOINT_RESTORE
    - CAP_NET_RAW

test:
  environment:
    environment:
      BEYLA_OPEN_PORT: 8080
      BEYLA_TRACE_PRINTER: text
      BEYLA_PROMETHEUS_PORT: 8090
    contents:
      packages:
        - go
        - curl
  pipeline:
    - runs: |
        beyla -h > help.txt 2>&1
        cat help.txt | grep "Usage of beyla"
    - name: "Test beyla run"
      uses: test/daemon-check-output
      with:
        start: beyla
        timeout: 30
        expected_output: |
          Starting main node
          opening prometheus scrape endpoint
        error_strings: |
          FAIL
          FATAL
