#nolint:valid-pipeline-git-checkout-tag
package:
  name: tritonserver-backend-tensorrtllm-cuda-13.0
  version: 25.12
  epoch: 0
  description: NVIDIA Triton Inference Server TensorRTLLM Backend
  copyright:
    - license: Apache-2.0
  target-architecture:
    - x86_64
  resources:
    cpu: 64
    memory: 256Gi
    disk: 128Gi
  dependencies:
    runtime:
      - c-ares
      - cuda-toolkit-${{vars.cuda-version}}
      - libgomp
      - numactl
      - nvidia-nccl-cuda-${{vars.cuda-version}}
      - openmp-17-dev
      - openmpi-cuda-${{vars.cuda-version}} # libnvinfer_plugin_tensorrt_llm.so links to its libmpi.so, not autodetected
      # From tensorrt_llm/requirements.txt:
      - py${{vars.python-version}}-accelerate-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-aenum
      # Discovered during testing
      - py${{vars.python-version}}-aiohttp
      - py${{vars.python-version}}-backoff
      - py${{vars.python-version}}-blake3
      - py${{vars.python-version}}-build
      - py${{vars.python-version}}-click
      - py${{vars.python-version}}-click-option-group
      - py${{vars.python-version}}-colored
      - py${{vars.python-version}}-cuda-python-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-diffusers-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-einops
      - py${{vars.python-version}}-evaluate
      - py${{vars.python-version}}-fastapi
      - py${{vars.python-version}}-flashinfer-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-h5py
      - py${{vars.python-version}}-httpx
      - py${{vars.python-version}}-lark
      - py${{vars.python-version}}-matplotlib
      - py${{vars.python-version}}-mpi4py
      - py${{vars.python-version}}-mpmath
      - py${{vars.python-version}}-numpy
      - py${{vars.python-version}}-nvidia-modelopt-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-nvtx
      - py${{vars.python-version}}-onnx
      - py${{vars.python-version}}-onnx-graphsurgeon
      - py${{vars.python-version}}-openai
      - py${{vars.python-version}}-opencv-python-headless-4.11
      - py${{vars.python-version}}-optimum-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-ordered-set
      - py${{vars.python-version}}-pandas
      - py${{vars.python-version}}-peft-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-pillow
      - py${{vars.python-version}}-polygraphy
      - py${{vars.python-version}}-psutil
      - py${{vars.python-version}}-pulp
      - py${{vars.python-version}}-pydantic
      - py${{vars.python-version}}-pynvml
      - py${{vars.python-version}}-pyzmq
      - py${{vars.python-version}}-sentencepiece
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-strenum
      - py${{vars.python-version}}-tensorrt-cuda-${{vars.cuda-major-version}}
      - py${{vars.python-version}}-tiktoken
      - py${{vars.python-version}}-torch-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-torchvision-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-tornado
      - py${{vars.python-version}}-transformers
      - py${{vars.python-version}}-uvicorn
      - py${{vars.python-version}}-wheel
      - py${{vars.python-version}}-xgrammar-cuda-${{vars.cuda-version}}
      - rdma-core
      - tensorrt-cuda-${{vars.cuda-major-version}}
      - tritonserver-cuda-${{vars.cuda-version}} # libtriton_tensorrtllm.so links to libtritonserver.so, not autodetected
  options:
    no-depends: true

environment:
  contents:
    packages:
      - bash
      - busybox
      - cmake
      - coreutils # we use ln -r below, busybox doesn't support that
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - file
      - git-lfs
      - grep # busybox grep does not support -P and `grep -oP` is used in various places
      - hwloc-cuda-${{vars.cuda-version}}-dev
      - libarchive-dev
      - libcuda-stub-cuda-${{vars.cuda-version}}-dev
      - numactl-dev
      - nvcc-${{vars.cuda-version}}-gcc-default
      - nvidia-nccl-cuda-${{vars.cuda-version}}-dev
      - openmpi-cuda-${{vars.cuda-version}}-dev
      - openssl-dev
      - patchelf
      - py${{vars.python-version}}-accelerate-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-attrs
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-conan-bin
      - py${{vars.python-version}}-importlib-metadata
      - py${{vars.python-version}}-mpi4py
      - py${{vars.python-version}}-numpy
      - py${{vars.python-version}}-pillow
      - py${{vars.python-version}}-protobuf
      - py${{vars.python-version}}-pybind11
      - py${{vars.python-version}}-pybind11-stubgen-bin
      # pin setuptools to work around:
      #  https://github.com/chainguard-dev/enterprise-packages/issues/22689
      - py${{vars.python-version}}-setuptools<80
      - py${{vars.python-version}}-tensorrt-cuda-${{vars.cuda-major-version}}
      - py${{vars.python-version}}-torch-cuda-${{vars.cuda-version}}-dev
      - py${{vars.python-version}}-typing-extensions
      - py${{vars.python-version}}-virtualenv
      - python-${{vars.python-version}} # Need a `python3` for https://github.com/NVIDIA/TensorRT-LLM/blob/28fb9aacaa5a05494635194a9cbb264da9a744bd/cpp/CMakeLists.txt#L138
      - rapidjson-dev
      - rdma-core-dev
      - samurai
      - tensorrt-cuda-${{vars.cuda-major-version}}-dev
      - triton-inference-server-backend=${{package.version}}
      - triton-inference-server-common=${{package.version}}
      - triton-inference-server-core=${{package.version}}
      - ucx-dev
      - uv
      - wget
      - zeromq-dev
      - zlib-dev
  environment:
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
    # Restricting to one architecture will speed up builds when you're
    # just debugging packaging.
    # CUDA_ARCHITECTURES: 90
    CXXFLAGS: -Wno-maybe-uninitialized
    #LD_LIBRARY_PATH: /usr/local/tensorrt/lib
    #TRT_ROOT: /usr/local/tensorrt
    VERBOSE: 1

vars:
  python-version: "3.12"
  venv-home: "/home/build/venv"

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: "$1"
    to: cuda-version
  - from: ${{vars.cuda-version}}
    match: (\d+)\.\d+
    replace: $1
    to: cuda-major-version

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5419275f0e9830ca7083ddab1651eaa10c66636f
      repository: https://github.com/triton-inference-server/tensorrtllm_backend.git
      branch: r${{package.version}}
      destination: backend
      recurse-submodules: true

  - uses: patch
    working-directory: backend/tensorrt_llm/3rdparty/cutlass
    with:
      patches: ${{package.srcdir}}/cpp-17-compat.patch

  - uses: patch
    working-directory: backend/tensorrt_llm
    with:
      patches: ${{package.srcdir}}/tensorrt_llm-init-pointers.patch ${{package.srcdir}}/disable-pip-installs.patch ${{package.srcdir}}/tensorrt_llm-noldd.patch

  - name: Confirm that transformers version stream is still necessary
    runs: |
      grep '^transformers==4\.56\.' \
        backend/tensorrt_llm/triton_backend/requirements.txt

  - name: pull precompiled batch manager
    working-directory: backend/tensorrt_llm
    runs: |
      # The tensorrt_llm repository uses git lfs to store the precompiled
      # versions of the batch manager
      # https://github.com/NVIDIA/TensorRT-LLM/tree/a96cccafcf6365c128f004f779160951f8c0801c/cpp/tensorrt_llm
      # So we need to pull in the lfs files.
      git lfs install
      git lfs pull

  - name: build tensorrt_llm wheel
    working-directory: backend/build
    runs: |
      export PATH=$PATH:/usr/local/cuda-${{vars.cuda-version}}/bin:/usr/local/tensorrt/bin
      # torch is installed as an apk
      sed -i 's/^torch/#&/' ../tensorrt_llm/requirements.txt

      # Force C++20 as various parts of cutlass seem to need it.
      find ../tensorrt_llm/3rdparty/cutlass -name "CMakeLists.txt" -exec sed -i "s/CMAKE_CXX_STANDARD 17/CMAKE_CXX_STANDARD 20/g" {} \;

      [ -z "$CUDA_ARCHITECTURES" ] || cuda_arch_arg="--cuda_architectures $CUDA_ARCHITECTURES"
      # export PIP_DRY_RUN=1 # Stop build_wheel.py from installing things from the Internet
      python${{vars.python-version}} ../tensorrt_llm/scripts/build_wheel.py --trt_root /usr/local/tensorrt \
        -D "CUDAToolkit_ROOT=/usr/local/cuda-${{vars.cuda-version}}" \
        -D "CUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda-${{vars.cuda-version}}/" -D "ENABLE_MULTI_DEVICE=1" \
        -D "CMAKE_TRT_INCLUDE_DIR=/usr/local/tensorrt/include" \
        -D "CMAKE_TRT_LIB_DIR=/usr/local/tensorrt/lib" \
        $cuda_arch_arg

  - name: install tensorrt_llm wheel
    runs: |
      pip${{vars.python-version}} install --verbose \
        --no-deps --no-index --no-build-isolation \
        --force-reinstall --no-compile \
        --prefix=${{targets.destdir}}/usr \
        backend/tensorrt_llm/build/tensorrt_llm-*.whl
      python${{vars.python-version}} -m compileall \
        --invalidation-mode=unchecked-hash \
        -r100 ${{targets.destdir}}

  - name: create versioned symlinks, required to pass ldd-check
    runs: |
      py_root="${{targets.destdir}}/usr/lib/python${{vars.python-version}}/site-packages/tensorrt_llm"
      ldconfig -N -l "$py_root"/libs/*.so

  - name: Configure backend
    working-directory: backend/tensorrt_llm/triton_backend/inflight_batcher_llm
    uses: cmake/configure
    with:
      output-dir: ../build
      # USE_CXX11_ABI still needed as of v0.20.0
      opts: |
        "-DCMAKE_CXX_FLAGS=${CXXFLAGS}" \
        "-DCMAKE_TOOLCHAIN_FILE=${CMAKE_TOOLCHAIN_FILE}" \
        "-DVCPKG_TARGET_TRIPLET=${VCPKG_TARGET_TRIPLET}" \
        "-DTRT_LIB_DIR=${TRT_ROOT}/targets/${{build.arch}}-linux-gnu/lib" \
        "-DTRT_INCLUDE_DIR=${TRT_ROOT}/include" \
        "-DUSE_CXX11_ABI:BOOL=ON" \
        "-DCMAKE_BUILD_TYPE=Release" \
        "-DCMAKE_INSTALL_PREFIX:PATH=/tmp/tritonbuild/tensorrtllm/install" \
        "-DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda-${{vars.cuda-version}}" \
        "-DCMAKE_CUDA_COMPILER=/usr/local/cuda-${{vars.cuda-version}}/bin/nvcc" \
        "-DCMAKE_INSTALL_PREFIX:PATH=/tmp/tritonbuild/tensorrtllm/install" \
        "-DTRITON_REPO_ORGANIZATION:STRING=file:///usr/src/triton-inference-server" \
        "-DTRITON_COMMON_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/common.git && git branch --show-current)" \
        "-DTRITON_CORE_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/core.git && git branch --show-current)" \
        "-DTRITON_BACKEND_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/backend.git && git branch --show-current)" \
        "-DTRITON_ENABLE_GPU:BOOL=ON" \
        "-DTRITON_ENABLE_MALI_GPU:BOOL=OFF" \
        "-DTRITON_ENABLE_STATS:BOOL=ON" \
        "-DTRITON_ENABLE_METRICS:BOOL=ON" \
        "-DTRITON_ENABLE_MEMORY_TRACKER:BOOL=ON"

  # cmake/build pipeline doesn't support -t yet
  - name: Build backend
    working-directory: backend/tensorrt_llm/triton_backend/inflight_batcher_llm
    runs: cmake --build ../build -t install

  - name: Install backend
    runs: |
      # See https://github.com/triton-inference-server/server/issues/7410#issuecomment-2218856792
      # Using a directory other than the default seems to cause problems at least for the python backend.
      backend_dir="${{targets.destdir}}/opt/tritonserver/backends/tensorrtllm"
      mkdir -p "$backend_dir"/plugins
      mkdir -p "$backend_dir"/libs
      cp backend/tensorrt_llm/triton_backend/build/*.so "$backend_dir"
      cp backend/tensorrt_llm/triton_backend/build/trtllmExecutorWorker "$backend_dir"

  - name: Symlink tensorrt_llm whl objects into system root
    runs: |
      py_root="${{targets.destdir}}/usr/lib/python${{vars.python-version}}/site-packages/tensorrt_llm"
      trtllm_root="${{targets.destdir}}/opt/tensorrt_llm"

      py_libs="$py_root/libs"
      trtllm_libs="$trtllm_root/libs"
      mkdir -p "$trtllm_libs"
      for lib in "$py_libs"/*; do
        ln -f -s -r "$lib" "$trtllm_libs"/
      done

      py_bin="$py_root/bin"
      trtllm_bin="$trtllm_root/bin"
      mkdir -p "$trtllm_bin"
      for bin in "$py_bin"/*; do
        ln -f -s -r "$bin" "$trtllm_bin"/
      done

  - name: Add libs to system library path
    runs: |
      mkdir -p "${{targets.contextdir}}"/etc/ld.so.conf.d
      echo "/opt/tensorrt_llm/libs" | tee "${{targets.contextdir}}"/etc/ld.so.conf.d/${{package.name}}.conf

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: r
    tag-filter-prefix: r

test:
  environment:
    contents:
      packages:
        - libcuda-stub-cuda-${{vars.cuda-version}}-dev
  pipeline:
    # Disable for now due to known missing deps
    # - uses: test/tw/pip-check
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: /opt/tritonserver/lib
