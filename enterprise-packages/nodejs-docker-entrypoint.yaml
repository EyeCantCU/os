package:
  name: nodejs-docker-entrypoint
  version: "0.0.1"
  epoch: 0
  description: Official Node.js Docker image entrypoint script
  copyright:
    - license: MIT
environment:
  contents:
    packages:
      - busybox
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nodejs/docker-node
      branch: main
      expected-commit: 5003dfda1d449fc1ab855b36d0ad0345d5331c74
  - name: Install docker-entrypoint.sh
    runs: |
      install -Dm755 docker-entrypoint.sh ${{targets.contextdir}}/usr/local/bin/docker-entrypoint.sh
update:
  enabled: false
test:
  pipeline:
    - runs: |
        set -euo pipefail
        stat /usr/local/bin/docker-entrypoint.sh
        # Verify it's executable
        test -x /usr/local/bin/docker-entrypoint.sh || { echo "ERROR: not executable"; exit 1; }
        # Verify shebang
        head -1 /usr/local/bin/docker-entrypoint.sh | grep -F "#!/bin/sh"
