#nolint:valid-pipeline-git-checkout-tag
package:
  name: nodejs-docker-entrypoint
  version: "0.0.1"
  epoch: 0
  description: Official Node.js Docker image entrypoint script
  copyright:
    - license: MIT

vars:
  # SHA256 hash for upstream drift detection
  entrypoint-sha256: a15ac9589c04baf9da95b08e0e79b5cf1d75ab8dc64e06a5e68e4ceb0ad7c8ea

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nodejs/docker-node
      branch: main
      expected-commit: 5003dfda1d449fc1ab855b36d0ad0345d5331c74

  - name: Detect upstream drift
    runs: |
      set -euo pipefail
      # Verify docker-entrypoint.sh content hasn't changed
      # If this check fails, review the changes at:
      # https://github.com/nodejs/docker-node/blob/main/docker-entrypoint.sh
      echo "${{vars.entrypoint-sha256}}  docker-entrypoint.sh" | sha256sum -c

  - name: Install docker-entrypoint.sh
    runs: |
      install -Dm755 docker-entrypoint.sh "${{targets.contextdir}}/usr/bin/docker-entrypoint.sh"

update:
  enabled: true
  manual: true
  git: {}
  schedule:
    period: monthly
    reason: |
      Track docker-entrypoint.sh on upstream main; monthly drift checks
      alert us when it changes so we can review and update commit/hash.

test:
  pipeline:
    - runs: |
        set -euo pipefail
        stat /usr/bin/docker-entrypoint.sh
        # Verify it's executable
        test -x /usr/bin/docker-entrypoint.sh || { echo "ERROR: not executable"; exit 1; }
        # Verify shebang
        head -1 /usr/bin/docker-entrypoint.sh | grep -F "#!/bin/sh"
