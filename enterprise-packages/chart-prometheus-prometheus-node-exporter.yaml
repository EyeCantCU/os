package:
  name: chart-prometheus-prometheus-node-exporter
  version: "4.52.0"
  epoch: 0 # go/enterprise-rsc/chart-prometheus-prometheus-node-exporter
  description: A Helm chart for prometheus node-exporter
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 1Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/helm-charts
      tag: prometheus-node-exporter-${{package.version}}
      expected-commit: 03b7fb3c17c3cf1be34a1bd4afaba352aaf58eac

  - uses: charts/package
    with:
      chart-path: charts/prometheus-node-exporter
      images: |
        node-exporter:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${tag}
              digest: ${digest}
        kube-rbac-proxy:
          values:
            kubeRBACProxy:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${tag}
                sha: ${digest}
      test: |
        values:
          # Set a fake version explicitly for semverCompare (coalesce checks version before tag)
          version: "99.0.0"
        cases:
          - name: default
            images: [node-exporter]
          - name: with-kube-rbac-proxy
            images: [node-exporter, kube-rbac-proxy]
            values:
              kubeRBACProxy:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: prometheus-community/helm-charts
    strip-prefix: prometheus-node-exporter-
    use-tag: true
    tag-filter-prefix: prometheus-node-exporter-
