package:
  name: maxscale-24.08-fips
  version: "24.08.0"
  epoch: 0
  description: MariaDB MaxScale 24.08 - Advanced database proxy, router, and firewall (FIPS)
  copyright:
    - license: BUSL-1.1
  dependencies:
    runtime:
      - openssl-config-fipshardened
    provides:
      - maxscale-fips=${{package.full-version}}

environment:
  environment:
    CC: gcc-11
    CXX: g++-11
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake-3
      - curl-dev
      - cyrus-sasl-dev
      - flex
      - gcc-11
      - git
      - glibc-dev
      - gnutls-dev
      - icu-dev
      - krb5-dev
      - libpq-17
      - libtool
      - linux-pam-dev
      - make
      - ncurses-dev
      - openssl-dev
      - perl
      - pkgconf
      - python3
      - sqlite-dev
      - systemd-dev
      - tcl
      - tcl-dev
      - unixodbc-dev
      - util-linux-dev
      - wget
      - xz-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mariadb-corporation/MaxScale
      tag: maxscale-${{package.version}}
      expected-commit: ac6ee6fd6603fcc7e031e4f8b0efc33383e5d04d
      recurse-submodules: true

  # Build flags as per upstream Dockerfile:
  # https://github.com/mariadb-corporation/MaxScale/blob/maxscale-24.08.0/Documentation/REST-API/templates/Dockerfile
  - uses: cmake/configure
    with:
      opts: |
        -G "Unix Makefiles" \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DBUILD_BINLOG=N \
        -DBUILD_CDC=N \
        -DBUILD_GSSAPI=N \
        -DBUILD_GUI=N \
        -DBUILD_KAFKACDC=N \
        -DBUILD_KAFKAIMPORTER=N \
        -DBUILD_KMIP_KEY_MANAGER=N \
        -DBUILD_LUAFILTER=N \
        -DBUILD_MAXCTRL=N \
        -DBUILD_MIRROR=N \
        -DBUILD_NOSQL=N \
        -DBUILD_QC_MYSQLEMBEDDED=N \
        -DBUILD_RABBITMQ=N \
        -DBUILD_STORAGE_MEMCACHED=N \
        -DBUILD_STORAGE_REDIS=N \
        -DBUILD_TESTS=N \
        -DBUILD_TOOLS=N \
        -DBUILD_VAULT_KEY_MANAGER=N \
        -DCMAKE_C_FLAGS="-Wno-stringop-overread" \
        -DCMAKE_CXX_FLAGS="-Wno-stringop-overflow"

  - runs: |
      cd output
      make -j$(nproc)

  - uses: cmake/install

  - uses: strip

update:
  enabled: true
  github:
    identifier: mariadb-corporation/MaxScale
    strip-prefix: maxscale-
    use-tag: true
    tag-filter: maxscale-24.08

test:
  environment:
    environment:
      REST_API_PORT: "8989"
    contents:
      packages:
        - curl
        - jq
        - scanelf
  pipeline:
    - name: Verify MaxScale installation
      runs: |
        set -euo pipefail
        stat /usr/bin/maxscale
    - uses: test/tw/ver-check
      with:
        bins: maxscale
    - uses: test/tw/help-check
      with:
        bins: maxscale
        help-flag: --help
    - name: Verify MaxScale library dependencies
      runs: |
        set -euo pipefail
        scanelf -n /usr/bin/maxscale | grep -F "libmaxscale-common.so"
    - uses: test/daemon-check-output
      with:
        setup: |
          adduser -D maxscale
          mkdir -p /var/lib/maxscale /var/run/maxscale /var/log/maxscale /var/cache/maxscale /etc/maxscale.modules.d /etc/maxscale.cnf.d
          chown -R maxscale:maxscale /var/lib/maxscale /var/run/maxscale /var/log/maxscale /var/cache/maxscale /etc/maxscale.modules.d /etc/maxscale.cnf.d
          tee /etc/maxscale.cnf << 'EOF'
          [maxscale]
          threads=1
          admin_host=127.0.0.1
          admin_port=8989
          admin_secure_gui=false
          EOF
        start: /usr/bin/maxscale --nodaemon --log=stdout --user=maxscale
        expected_output: |
          MaxScale started
          Started REST API on
          MaxScale started with 1 worker threads
        timeout: 30
        post: |-
          set -euo pipefail
          wait-for-it 127.0.0.1:${REST_API_PORT} -t 10
          # REST API returns JSON, verify with default credentials admin:mariadb
          curl -sf -u admin:mariadb http://127.0.0.1:${REST_API_PORT}/v1/maxscale | jq -e '.data.id == "maxscale"'
          # Check thread count matches config
          curl -sf -u admin:mariadb http://127.0.0.1:${REST_API_PORT}/v1/maxscale | jq -e '.data.attributes.parameters.threads == 1'
          # Verify no services configured, clean start
          curl -sf -u admin:mariadb http://127.0.0.1:${REST_API_PORT}/v1/services | jq -e '.data | length == 0'
    - name: Verify FIPS linkage
      runs: |-
        set -euo pipefail
        scanelf -n /usr/bin/maxscale | grep -F "libssl.so"
        scanelf -n /usr/bin/maxscale | grep -F "libcrypto.so"
