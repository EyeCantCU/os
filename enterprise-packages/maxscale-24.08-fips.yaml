package:
  name: maxscale-24.08-fips
  version: "24.08.0"
  epoch: 0
  description: MariaDB MaxScale 24.08 - Advanced database proxy, router, and firewall (FIPS)
  copyright:
    - license: "BSL-1.1"
  checks:
    disabled:
      - setuidgid
      - tempdir
  dependencies:
    runtime:
      - openssl-config-fipshardened
    provides:
      - maxscale-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-18
      - cmake-3
      - curl-dev
      - cyrus-sasl-dev
      - flex
      - git
      - glibc-dev
      - gnutls-dev
      - icu-dev
      - krb5-dev
      - libpq-17
      - libtool
      - linux-pam-dev
      - make
      - ncurses-dev
      - openssl-dev
      - perl
      - pkgconf
      - python3
      - sqlite-dev
      - systemd-dev
      - tcl
      - tcl-dev
      - unixodbc-dev
      - util-linux-dev
      - wget
      - xz-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mariadb-corporation/MaxScale
      tag: maxscale-${{package.version}}
      expected-commit: ac6ee6fd6603fcc7e031e4f8b0efc33383e5d04d
      recurse-submodules: true

  - runs: |
      # Remove -Werror from CMake files to allow building with warnings
      find . -name "CMakeLists.txt" -exec sed -i 's/-Werror=[^ "]*//g;s/-Werror//g' {} \;
      # Fix the nullptr_t issue
      if [ -f maxutils/maxsimd/src/canonical.cc ]; then
        sed -i 's/\([^:]\)nullptr_t/\1std::nullptr_t/g' maxutils/maxsimd/src/canonical.cc
      fi
      # 24.08 removed BUNDLE=N; deps are built via ExternalProject.
      # Force C17 for connector-c and strip its internal -Werror.
      sed -i 's|-DWITH_EXTERNAL_ZLIB=Y|-DWITH_EXTERNAL_ZLIB=Y -DCMAKE_C_STANDARD=17|' cmake/BuildMariaDBConnector.cmake
      sed -i 's|LOG_INSTALL 1)|LOG_INSTALL 1\n  PATCH_COMMAND sed -i s/-Werror//g <SOURCE_DIR>/CMakeLists.txt\n)|' cmake/BuildMariaDBConnector.cmake
      # Clang rejects VLA with initializer in pp_sqlite.cc:684
      sed -i 's/char database\[nDatabase + 1\] = "";/char database[nDatabase + 1]; database[0] = 0;/' server/modules/parser_plugin/pp_sqlite/pp_sqlite.cc
      # Fix K&R forward declarations in bundled lemon.c (sqlite 3.11)
      sed -i \
        -e 's/^void FindRulePrecedences();/void FindRulePrecedences(struct lemon *);/' \
        -e 's/^void FindFirstSets();/void FindFirstSets(struct lemon *);/' \
        -e 's/^void FindStates();/void FindStates(struct lemon *);/' \
        -e 's/^void FindLinks();/void FindLinks(struct lemon *);/' \
        -e 's/^void FindFollowSets();/void FindFollowSets(struct lemon *);/' \
        -e 's/^void FindActions();/void FindActions(struct lemon *);/' \
        server/modules/parser_plugin/pp_sqlite/sqlite-src-3110100/tool/lemon.c

  - uses: cmake/configure
    with:
      opts: |
        -G "Unix Makefiles" \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_C_COMPILER=clang \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DBUILD_KAFKACDC=OFF \
        -DBUILD_KAFKAIMPORTER=OFF \
        -DBUILD_MAXCTRL=OFF \
        -DBUILD_GUI=OFF \
        -DBUILD_TESTS=OFF \
        -DBUILD_MIRROR=OFF \
        -DBUILD_CDC=OFF \
        -DCMAKE_C_FLAGS="-Wno-error" \
        -DCMAKE_CXX_FLAGS="-Wno-error"

  - runs: |
      cd output
      make -j$(nproc)

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    description: Development files for MaxScale 24.08 (FIPS)

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: Documentation for MaxScale 24.08 (FIPS)

update:
  enabled: true
  github:
    identifier: mariadb-corporation/MaxScale
    strip-prefix: maxscale-
    use-tag: true
    tag-filter: maxscale-24.08

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
        - scanelf
  pipeline:
    - name: Verify MaxScale FIPS installation
      runs: |
        set -euo pipefail
        stat /usr/bin/maxscale
    - name: Check MaxScale version
      runs: |
        set -euo pipefail
        maxscale --version
    - name: Verify MaxScale library dependencies
      runs: |
        set -euo pipefail
        scanelf -n /usr/bin/maxscale | grep -F "libmaxscale-common.so"
    - name: Verify FIPS linkage
      runs: |-
        set -euo pipefail
        scanelf -n /usr/bin/maxscale | grep -F "libssl.so"
        scanelf -n /usr/bin/maxscale | grep -F "libcrypto.so"
