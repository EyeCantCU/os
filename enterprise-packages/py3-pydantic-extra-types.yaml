package:
  name: py3-pydantic-extra-types
  version: "2.11.0"
  epoch: 1 # go/enterprise-rsc/py3-pydantic-extra-types
  description: A place for pydantic types that probably shouldn't exist in the main pydantic lib
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 3Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-hatchling
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-wheel

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pydantic/pydantic-extra-types
      tag: v${{package.version}}
      expected-commit: 1873338e3fb42452e25a09e087b758587a427bef

vars:
  pypi-package: pydantic-extra-types

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-pydantic
        - py${{range.key}}-typing-extensions
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: pydantic_extra_types

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  git:
    strip-prefix: v
