package:
  name: tinycdb
  version: 0.81
  epoch: 0
  description: TinyCDB - a very fast and simple package for creating and reading constant databases
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base

pipeline:
  - uses: fetch
    with:
      expected-sha256: 469de2d445bf54880f652f4b6dc95c7cdf6f5502c35524a45b2122d70d47ebc2
      uri: https://www.corpit.ru/mjt/tinycdb/tinycdb-${{package.version}}.tar.gz

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: cdb
    - runs: cdb -h | grep -E "[[:digit:]]\.[[:digit:]]{2}"
    - name: Test cdb database creation and query
      runs: |
        tee testdata.txt <<'EOF'
        +3,5:one->Hello
        +3,5:two->World
        +5,7:three->Testing
        +4,12:four->CDB Database

        EOF

        cdb -c test.cdb testdata.txt
        stat test.cdb

        [ "$(cdb -q test.cdb one)" == "Hello" ]
        [ "$(cdb -q test.cdb two)" == "World" ]
        [ "$(cdb -q test.cdb three)" == "Testing" ]
        [ "$(cdb -q test.cdb four)" == "CDB Database" ]
    - name: Test cdb dump and list operations
      runs: |
        tee testdata2.txt << 'EOF'
        +4,6:key1->value1
        +4,6:key2->value2

        EOF

        cdb -c test2.cdb testdata2.txt

        # Test dump operation
        cdb -d test2.cdb > dump.txt

        # Verify dump contains our keys
        grep -E -e "key1.*value1" dump.txt
        grep -E -e "key2.*value2" dump.txt

        # Test list operation
        cdb -l test2.cdb > list.txt

        # Verify list contains our keys
        grep -F "key1" list.txt
        grep -F "key2" list.txt

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    description: ${{package.name}} dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

update:
  enabled: true
  schedule:
    period: monthly
    reason: Project has infrequent releases
  release-monitor:
    identifier: 14675
