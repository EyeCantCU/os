package:
  name: buildkitd-fips
  version: "0.27.1"
  description: "concurrent, cache-efficient, and Dockerfile-agnostic builder toolkit"
  epoch: 0 # GHSA-846p-jg2w-w324
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - buildctl-fips
      - runc-fips
    provides:
      - buildkit-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips
      - libseccomp-dev
      - libseccomp-static

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/moby/buildkit
      tag: v${{package.version}}
      expected-commit: 5fbebf9d177edcc7af06c36c78728fdd357bf964

  - uses: go/bump
    with:
      deps: |-
        github.com/theupdateframework/go-tuf/v2@v2.3.1
        github.com/sigstore/rekor@v1.5.0
        github.com/sigstore/sigstore@v1.10.4
        github.com/theupdateframework/go-tuf/v2@v2.4.1

  - uses: go/build
    with:
      go-package: go-fips
      modroot: .
      packages: ./cmd/buildkitd
      tags: osusergo,netgo,static_build,seccomp
      output: buildkitd
      ldflags: |
        -X github.com/moby/buildkit/version.Version=${{package.version}}
        -X github.com/moby/buildkit/version.Revision=r${{package.epoch}}
        -X github.com/moby/buildkit/version.Package=github.com/moby/buildkit

  - uses: go/build
    with:
      go-package: go-fips
      modroot: .
      packages: ./cmd/buildctl
      output: buildctl
      ldflags: |
        -X github.com/moby/buildkit/version.Version=${{package.version}}
        -X github.com/moby/buildkit/version.Revision=r${{package.epoch}}
        -X github.com/moby/buildkit/version.Package=github.com/moby/buildkit

  - runs: |
      cp ./examples/buildctl-daemonless/buildctl-daemonless.sh ${{targets.destdir}}/usr/bin/ # https://github.com/moby/buildkit/blob/4c93208b9db9f8936b17c33bc93d19fc1bbf5266/Dockerfile#L152

subpackages:
  - name: buildctl-fips
    description: "buildkit client"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/buildctl ${{targets.subpkgdir}}/usr/bin/buildctl
    test:
      pipeline:
        - runs: |
            buildctl --version
            buildctl --help

update:
  enabled: true
  github:
    identifier: moby/buildkit
    strip-prefix: v
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        if [ -n "$XDG_RUNTIME_DIR" ]; then
            buildctl-daemonless.sh --version
            buildctl-daemonless.sh --help
        fi
        buildkitd --version
        buildkitd --help
    - name: "start daemon"
      uses: test/daemon-check-output
      with:
        start: "/usr/bin/buildkitd"
        timeout: 60
        expected_output: |
          running server
