package:
  name: altinity-clickhouse-24.3
  version: "24.3.18.10426"
  epoch: 0
  description: Altinity Stable Build for ClickHouse - production-ready releases with extended support, rigorous testing, and 100% compatibility with upstream ClickHouse.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "65"
    memory: 128Gi
  dependencies:
    provides:
      - altinity-clickhouse=${{package.full-version}}
    runtime:
      - altinity-clickhouse-server-config=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+).*
    replace: $1
    to: major-minor-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - clang-18
      - coreutils
      - findutils
      - grep
      - ini-file
      - libcxx1
      - lld-18
      - nasm<3
      - perl
      - python3
      - rust
      - shadow
      - tzdata
      - xmlstarlet
      - yasm

pipeline:
  # parallel submodule fetch saves ~10 min during build; '0' tells git to use a reasonable value.
  - runs: git config --global submodule.fetchJobs 0

  - uses: git-checkout
    with:
      repository: https://github.com/Altinity/ClickHouse
      tag: v${{package.version}}.altinitystable
      expected-commit: ef8a945bc84037671dd803577841a5e1563cec6e
      recurse-submodules: "true"

  # The default build script is defensive and tries to protect against defining cflags.
  - uses: patch
    with:
      patches: allow_cflags.patch

  - runs: |
      # Overwrite VERSION_STRING to set the correct version of the binary.
      # https://github.com/Altinity/ClickHouse/blob/cfe75cb0ba14d5c72cc045c534cc618d82a22665/cmake/autogenerated_versions.txt#L15
      sed -i "s|^SET(VERSION_STRING [^)]*)|SET(VERSION_STRING ${{package.version}}.altinitystable)|" cmake/autogenerated_versions.txt

  - uses: cmake/configure
    # Reference for cmake options:
    # https://github.com/Altinity/ClickHouse/blob/v24.3.18.10389.altinitystable/docker/packager/packager#L269
    with:
      opts: |
        -DCOMPILER_CACHE=disabled \
        -DNO_ARMV81_OR_HIGHER=1 \
        -DENABLE_TESTS=0 \
        -DENABLE_UTILS=0 \
        -DCMAKE_FIND_PACKAGE_NO_PACKAGE_REGISTRY=ON \
        -DCMAKE_SKIP_INSTALL_ALL_DEPENDENCY=ON \
        -DBUILD_STANDALONE_KEEPER=1 \
        -DSPLIT_DEBUG_SYMBOLS=ON \
        -DCMAKE_CXX_FLAGS="-Wno-error=unused-result" \
        -DVERSION_STRING=${{package.version}}.altinitystable \
        -DCLICKHOUSE_OFFICIAL_BUILD=1

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dbg
    description: "${{package.name}} Debug Symbols"
    dependencies:
      provides:
        - altinity-clickhouse-debug=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib/debug ${{targets.contextdir}}/usr/lib/
    test:
      pipeline:
        - uses: test/tw/debugpackage

  - name: "${{package.name}}-dev"
    description: "development files for altinity clickhouse"
    dependencies:
      provides:
        - altinity-clickhouse-dev=${{package.full-version}}
      runtime:
        - altinity-clickhouse=${{package.full-version}}
    pipeline:
      - runs: |
          # cannot use split/dev since it incorrectly copies usr/bin/clickhouse-extract-from-config
          mkdir -p ${{targets.contextdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: "${{package.name}}-bash-completion"
    description: "bash completion for altinity clickhouse"
    dependencies:
      provides:
        - altinity-clickhouse-bash-completion=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/bash-completion
          mv ${{targets.destdir}}/usr/share/bash-completion/completions \
            ${{targets.contextdir}}/usr/share/bash-completion/
    test:
      pipeline:
        - runs: |
            stat /usr/share/bash-completion/completions/clickhouse

  - name: "altinity-clickhouse-keeper-${{vars.major-minor-version}}"
    description: "standalone altinity clickhouse keeper"
    dependencies:
      provides:
        - altinity-clickhouse-keeper=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          mv "${{targets.destdir}}/usr/bin/clickhouse-keeper" \
             "${{targets.contextdir}}/usr/bin/clickhouse-keeper"

          # Keeper tools symlink to standalone keeper
          cd "${{targets.contextdir}}/usr/bin"
          ln -sf clickhouse-keeper clickhouse-keeper-converter
          ln -sf clickhouse-keeper clickhouse-keeper-client
      - runs: |
          install -Dm644 -t ${{targets.contextdir}}/usr/lib/systemd/system \
            packages/clickhouse-keeper.service

          install -Dm644 -t ${{targets.contextdir}}/etc/clickhouse-keeper \
            programs/keeper/keeper_config.xml
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/help-check
          with:
            bins: clickhouse-keeper
        - name: Test that stable version is built
          runs: |
            clickhouse-keeper --version | grep ${{package.version}} | grep -F "altinitystable"
        - uses: test/daemon-check-output
          with:
            setup: |
              sed -i "s/<!-- <console>1<\\/console> -->/<console>1<\\/console>/" /etc/clickhouse-keeper/keeper_config.xml
            start: clickhouse-keeper --config-file /etc/clickhouse-keeper/keeper_config.xml
            expected_output: |
              Listening for Keeper
              Loaded config
              Ready for connections
            timeout: "30"
            post: |
              #!/bin/sh -e
              # not testing clickhouse-keeper-converter: needs zookeeper nodes
              clickhouse-keeper-client -h localhost -p 9181 -q "ls" | grep "keeper"
              clickhouse-keeper-client -h localhost -p 9181 -q "create \"/test\" \"hello_world\""
              clickhouse-keeper-client -h localhost -p 9181 -q "get \"/test\"" | grep "hello_world"
              clickhouse-keeper-client -h localhost -p 9181 -q "rm \"test\""
              clickhouse-keeper-client -h localhost -p 9181 -q "ls" | grep -v "test"

  - name: "altinity-clickhouse-server-${{vars.major-minor-version}}-config"
    description: "altinity clickhouse server symlinks and service files"
    dependencies:
      provides:
        - altinity-clickhouse-server-config=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/bin"
          ln -sf clickhouse "${{targets.contextdir}}/usr/bin/clickhouse-keeper"
          ln -sf clickhouse "${{targets.contextdir}}/usr/bin/clickhouse-keeper-converter"
          ln -sf clickhouse "${{targets.contextdir}}/usr/bin/clickhouse-keeper-client"
          install -Dm644 -t ${{targets.contextdir}}/usr/lib/systemd/system \
            packages/clickhouse-server.service \
            packages/clickhouse-keeper.service
    test:
      environment:
        contents:
          packages:
            - altinity-clickhouse=${{package.full-version}}
      pipeline:
        - uses: test/tw/symlink-check

  - name: "altinity-clickhouse-server-${{vars.major-minor-version}}-oci-entrypoint"
    description: "entrypoint script and config for altinity clickhouse image"
    dependencies:
      provides:
        - altinity-clickhouse-server-oci-entrypoint=${{package.full-version}}
      runtime:
        - gzip
        - bash
        - coreutils
        - wget
        - glibc-locale-en
    pipeline:
      - runs: |
          install -Dm755 -t "${{targets.contextdir}}/" docker/server/entrypoint.sh
          install -Dm644 -t "${{targets.contextdir}}/etc/clickhouse-server/config.d/" docker/server/docker_related_config.xml
    test:
      pipeline:
        - runs: |
            stat /entrypoint.sh /etc/clickhouse-server/config.d/docker_related_config.xml

  - name: "altinity-clickhouse-keeper-${{vars.major-minor-version}}-oci-entrypoint"
    description: "entrypoint script and config for altinity clickhouse image"
    dependencies:
      provides:
        - altinity-clickhouse-keeper-oci-entrypoint=${{package.full-version}}
      runtime:
        - bash
        - coreutils
        - su-exec
        - glibc-locale-en
    pipeline:
      - runs: |
          install -Dm755 -t "${{targets.contextdir}}/" docker/keeper/entrypoint.sh
    test:
      pipeline:
        - runs: stat /entrypoint.sh

update:
  enabled: true
  github:
    identifier: Altinity/ClickHouse
    use-tag: true
    tag-filter: v24.3.
    strip-prefix: v
    strip-suffix: .altinitystable
    tag-filter-prefix: v24.3.
    tag-filter-contains: altinitystable

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: |
          clickhouse
          clickhouse-benchmark
          clickhouse-client
          clickhouse-compressor
          clickhouse-disks
          clickhouse-extract-from-config
          clickhouse-format
          clickhouse-git-import
          clickhouse-keeper
          clickhouse-keeper-client
          clickhouse-keeper-converter
          clickhouse-local
          clickhouse-obfuscator
          clickhouse-server
          clickhouse-static-files-disk-uploader
          clickhouse-su
    - uses: test/tw/ver-check
      with:
        bins: |
          clickhouse
          clickhouse-client
          clickhouse-keeper
          clickhouse-local
          clickhouse-server
    - name: "Start ClickHouse server"
      runs: |
        clickhouse-server --config /etc/clickhouse-server/config.xml > /tmp/clickhouse.log 2>&1 &
        wait-for-it localhost:8123 -t 30 -- clickhouse-client --query "SELECT 1"
    - name: "Test CREATE DATABASE"
      runs: |
        clickhouse-client --query "CREATE DATABASE IF NOT EXISTS test;"
    - name: "Test CREATE TABLE"
      runs: |
        clickhouse-client --query "CREATE TABLE IF NOT EXISTS test.sample (id UInt32, name String) ENGINE = MergeTree() ORDER BY id;"
    - name: "Test INSERT"
      runs: |
        clickhouse-client --query "INSERT INTO test.sample VALUES (1, 'test');"
    - name: "Test SELECT"
      runs: |
        clickhouse-client --query "SELECT * FROM test.sample" | grep -F "test"
    - name: "Test HTTP interface"
      runs: |
        curl -sf "http://localhost:8123/?query=SELECT%201" | grep -F "1"
        curl -sf --data-raw "" "http://localhost:8123/?query=CREATE%20DATABASE%20IF%20NOT%20EXISTS%20http_test"
    - name: "Test system tables"
      runs: |
        clickhouse-client --query "SELECT * FROM system.databases WHERE name = 'system'" | grep -F "system"
        clickhouse-client --query "SELECT * FROM system.tables WHERE database = 'system' LIMIT 1"
    - name: "Test data types"
      runs: |
        clickhouse-client --query "
            CREATE TABLE IF NOT EXISTS test.types (
            int8_col Int8,
            uint64_col UInt64,
            float_col Float64,
            string_col String,
            date_col Date
            ) ENGINE = MergeTree() ORDER BY int8_col"
        clickhouse-client --query "
            INSERT INTO test.types VALUES
            (1, 18446744073709551615, 3.14159, 'test string', '2024-01-01')"
        clickhouse-client --query "SELECT * FROM test.types" | grep -F "test string"
    - name: "Test aggregations"
      runs: |
        clickhouse-client --query "
            CREATE TABLE IF NOT EXISTS test.events (
            event_date Date,
            user_id UInt32,
            event_type String,
            value UInt64
            ) ENGINE = MergeTree() ORDER BY (event_date, user_id)"
        clickhouse-client --query "
            INSERT INTO test.events VALUES
            ('2024-01-01', 1, 'click', 10),
            ('2024-01-01', 1, 'click', 20),
            ('2024-01-01', 2, 'view', 5),
            ('2024-01-02', 1, 'click', 15),
            ('2024-01-02', 2, 'click', 25)"
        clickhouse-client --query "SELECT COUNT(*) FROM test.events" | grep -F "5"
        clickhouse-client --query "SELECT SUM(value) FROM test.events" | grep -F "75"
        clickhouse-client --query "SELECT user_id, COUNT(*), SUM(value) FROM test.events GROUP BY user_id ORDER BY user_id" | grep -F "1"
    - name: "Test DateTime types"
      runs: |
        clickhouse-client --query "
            CREATE TABLE IF NOT EXISTS test.timestamps (
                id UInt32,
                created_at DateTime,
                updated_at DateTime64(3),
                event_date Date
            ) ENGINE = MergeTree() ORDER BY id"
        clickhouse-client --query "
            INSERT INTO test.timestamps VALUES
            (1, '2024-01-15 10:30:00', '2024-01-15 10:30:00.123', '2024-01-15'),
            (2, '2024-06-20 14:45:30', '2024-06-20 14:45:30.456', '2024-06-20')"
        clickhouse-client --query "SELECT toYear(created_at), toMonth(created_at) FROM test.timestamps WHERE id = 1" | grep -F "2024"
        clickhouse-client --query "SELECT toHour(created_at) FROM test.timestamps WHERE id = 1" | grep -F "10"
    - name: "Test JOINs"
      runs: |
        clickhouse-client --query "
            CREATE TABLE IF NOT EXISTS test.users (
                user_id UInt32,
                username String
            ) ENGINE = MergeTree() ORDER BY user_id"
        clickhouse-client --query "
            CREATE TABLE IF NOT EXISTS test.orders (
                order_id UInt32,
                user_id UInt32,
                amount Decimal(10,2)
            ) ENGINE = MergeTree() ORDER BY order_id"
        clickhouse-client --query "
            INSERT INTO test.users VALUES (1, 'alice'), (2, 'bob'), (3, 'charlie')"
        clickhouse-client --query "
            INSERT INTO test.orders VALUES (101, 1, 99.99), (102, 1, 149.50), (103, 2, 75.00)"
        # INNER JOIN
        clickhouse-client --query "
            SELECT u.username, o.amount
            FROM test.users u
            INNER JOIN test.orders o ON u.user_id = o.user_id
            WHERE u.username = 'alice'
            ORDER BY o.amount" | grep -F "99.99"
        # LEFT JOIN - charlie has no orders
        clickhouse-client --query "
            SELECT u.username, count(o.order_id) as order_count
            FROM test.users u
            LEFT JOIN test.orders o ON u.user_id = o.user_id
            GROUP BY u.username
            ORDER BY u.username" | grep -F "charlie"
    - name: "Test Array type"
      runs: |
        clickhouse-client --query "
            CREATE TABLE IF NOT EXISTS test.tags (
                id UInt32,
                name String,
                tags Array(String),
                scores Array(UInt32)
            ) ENGINE = MergeTree() ORDER BY id"
        clickhouse-client --query "
            INSERT INTO test.tags VALUES
            (1, 'product_a', ['electronics', 'sale', 'featured'], [85, 92, 78]),
            (2, 'product_b', ['clothing', 'new'], [90, 88]),
            (3, 'product_c', ['electronics', 'premium'], [95, 99, 100])"
        # Test array functions
        clickhouse-client --query "SELECT name, length(tags) FROM test.tags WHERE id = 1" | grep -F "3"
        clickhouse-client --query "SELECT name FROM test.tags WHERE has(tags, 'electronics')" | grep -F "product_a"
        clickhouse-client --query "SELECT arrayJoin(tags) as tag FROM test.tags WHERE id = 1" | grep -F "sale"
        clickhouse-client --query "SELECT name, arrayMax(scores) FROM test.tags WHERE id = 3" | grep -F "100"
    - name: "Test ReplacingMergeTree"
      runs: |
        clickhouse-client --query "
            CREATE TABLE IF NOT EXISTS test.user_states (
                user_id UInt32,
                status String,
                updated_at DateTime
            ) ENGINE = ReplacingMergeTree(updated_at) ORDER BY user_id"
        clickhouse-client --query "
            INSERT INTO test.user_states VALUES
            (1, 'active', '2024-01-01 10:00:00'),
            (1, 'inactive', '2024-01-02 10:00:00'),
            (1, 'active', '2024-01-03 10:00:00')"
        # Force merge to deduplicate
        clickhouse-client --query "OPTIMIZE TABLE test.user_states FINAL"
        # Should have only 1 row (latest version)
        clickhouse-client --query "SELECT count() FROM test.user_states" | grep -F "1"
        clickhouse-client --query "SELECT status FROM test.user_states WHERE user_id = 1" | grep -F "active"
    - name: "Test approximate functions"
      runs: |
        # These are signature ClickHouse OLAP features for analytics/observability
        clickhouse-client --query "
            CREATE TABLE IF NOT EXISTS test.metrics (
                timestamp DateTime,
                user_id UInt32,
                response_time_ms UInt32,
                endpoint String
            ) ENGINE = MergeTree() ORDER BY timestamp"
        clickhouse-client --query "
            INSERT INTO test.metrics VALUES
            ('2024-01-01 10:00:00', 1, 50, '/api/users'),
            ('2024-01-01 10:00:01', 2, 120, '/api/users'),
            ('2024-01-01 10:00:02', 1, 45, '/api/orders'),
            ('2024-01-01 10:00:03', 3, 200, '/api/users'),
            ('2024-01-01 10:00:04', 2, 85, '/api/orders'),
            ('2024-01-01 10:00:05', 4, 150, '/api/users'),
            ('2024-01-01 10:00:06', 1, 55, '/api/users'),
            ('2024-01-01 10:00:07', 5, 300, '/api/orders'),
            ('2024-01-01 10:00:08', 2, 95, '/api/users'),
            ('2024-01-01 10:00:09', 3, 180, '/api/orders')"
        # uniq() - HyperLogLog cardinality estimation (5 unique users)
        clickhouse-client --query "SELECT uniq(user_id) FROM test.metrics" | grep -F "5"
        # uniqExact() - exact count
        clickhouse-client --query "SELECT uniqExact(user_id) FROM test.metrics" | grep -F "5"
        # quantile() - p50 median response time
        clickhouse-client --query "SELECT quantile(0.5)(response_time_ms) FROM test.metrics" | grep -E "^[0-9]"
        # quantiles() - p50, p95, p99 in one query
        clickhouse-client --query "SELECT quantiles(0.5, 0.95, 0.99)(response_time_ms) FROM test.metrics" | grep -F "["
    - name: "Test window functions"
      runs: |
        clickhouse-client --query "
            CREATE TABLE IF NOT EXISTS test.sales (
                sale_date Date,
                region String,
                amount Decimal(10,2)
            ) ENGINE = MergeTree() ORDER BY sale_date"
        clickhouse-client --query "
            INSERT INTO test.sales VALUES
            ('2024-01-01', 'East', 100.00),
            ('2024-01-02', 'East', 150.00),
            ('2024-01-03', 'East', 120.00),
            ('2024-01-01', 'West', 200.00),
            ('2024-01-02', 'West', 180.00),
            ('2024-01-03', 'West', 220.00)"
        # row_number() - ranking within partition
        clickhouse-client --query "
            SELECT region, sale_date, amount,
                   row_number() OVER (PARTITION BY region ORDER BY sale_date) as rn
            FROM test.sales
            ORDER BY region, sale_date" | grep -F "1"
        # running total with window function
        clickhouse-client --query "
            SELECT region, sale_date, amount,
                   sum(amount) OVER (PARTITION BY region ORDER BY sale_date) as running_total
            FROM test.sales
            WHERE region = 'East'
            ORDER BY sale_date" | grep -F "370"
    - name: "Test clickhouse-local"
      runs: |
        echo -e "1,Alice\n2,Bob\n3,Charlie" > /tmp/test.csv
        clickhouse-local --query "SELECT * FROM file('/tmp/test.csv', CSV, 'id UInt32, name String')" | grep -F "Alice"
        clickhouse-local --query "SELECT COUNT(*) FROM file('/tmp/test.csv', CSV, 'id UInt32, name String')" | grep -F "3"
    - name: "Test benchmark"
      runs: |
        clickhouse-benchmark --query "SELECT 1" --iterations 10
        clickhouse-benchmark --concurrency 2 --query "SELECT number FROM system.numbers LIMIT 10" --iterations 3
    - name: "Verify Altinity Stable build"
      runs: |
        # Critical: Verify this is Altinity Stable, not vanilla ClickHouse or Antalya
        clickhouse-server --version | grep -F "altinitystable"
        clickhouse-client --version | grep -F "altinitystable"
