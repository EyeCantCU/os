package:
  name: libsoup3
  version: "3.6.6"
  epoch: 0
  description: Gnome HTTP client/server library (version 3)
  copyright:
    - license: LGPL-2.0-or-later

environment:
  contents:
    packages:
      - brotli-dev
      - build-base
      - busybox
      - glib-dev
      - libgcrypt-dev
      - libpsl-dev
      - meson
      - nghttp2-dev
      - python3
      - sqlite-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.gnome.org/GNOME/libsoup.git
      tag: ${{package.version}}
      expected-commit: 25eac153004f777581ca2d95e31a02ca96844332

  - uses: meson/configure
    with:
      opts: |
        -Db_lto=true \
        -Dtls_check=false \
        -Dintrospection=disabled \
        -Dvapi=disabled \
        -Dtests=false \
        -Ddocs=disabled \
        -Dgssapi=disabled \
        -Dntlm=disabled

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-lang
    pipeline:
      - uses: split/locales

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify libsoup3 library
      runs: |
        set -euo pipefail
        stat /usr/lib/libsoup-3.0.so*
        echo "libsoup3 library test passed"

update:
  enabled: true
  git:
    strip-prefix: ""
    tag-filter-prefix: "3."
