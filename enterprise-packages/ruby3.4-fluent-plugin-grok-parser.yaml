package:
  name: ruby3.4-fluent-plugin-grok-parser
  version: 2.6.2
  epoch: 0
  description: Fluentd's Grok parser
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ruby3.4-fluentd
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - ruby-3.4
      - ruby-3.4-dev

vars:
  gem: fluent-plugin-grok-parser

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2fe22dba73dc3a6c7020fa7d43a396f87421e336
      repository: https://github.com/fluent/fluent-plugin-grok-parser
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

test:
  environment:
    contents:
      packages:
        - ruby3.4-fluentd
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: fluent/plugin/parser_grok
    - runs: |
        ruby -e "require 'fluent/plugin/grok'"
        ruby -e "require 'fluent/plugin/parser_grok'"
        ruby -e "require 'fluent/plugin/parser_multiline_grok'"
    - name: Validate plugin loads in fluentd
      runs: |
        set -euo pipefail
        tee /tmp/test.conf <<'EOF'
        <source>
          @type tail
          path /dev/null
          tag test
          <parse>
            @type grok
            <grok>
              pattern %{COMMONAPACHELOG}
            </grok>
          </parse>
        </source>

        <match **>
          @type null
        </match>
        EOF
        fluentd --dry-run -c /tmp/test.conf

update:
  enabled: true
  github:
    identifier: fluent/fluent-plugin-grok-parser
    strip-prefix: v
    use-tag: true
