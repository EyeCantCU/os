package:
  name: chart-maikumori-gotenberg
  version: "1.18.0"
  epoch: 0
  description: A Helm chart for Gotenberg
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/MaikuMori/helm-charts
      tag: gotenberg-${{package.version}}
      expected-commit: 4c5e71f427e0b14ac11e7aa714c21766ee8f271e

  - uses: charts/package
    with:
      chart-path: charts/gotenberg
      images: |
        gotenberg:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        ignore:
          - busybox:latest
        cases:
          - name: default
            images: [gotenberg]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: MaikuMori/helm-charts
    strip-prefix: gotenberg-
    use-tag: true
    tag-filter-prefix: gotenberg-
