package:
  name: chart-grafana-tempo
  version: "1.26.2"
  epoch: 0
  description: Grafana Tempo Single Binary Mode
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - helm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana-community/helm-charts
      tag: tempo-${{package.version}}
      expected-commit: bd030eb12258c8c6bf95b3d59d0d510c381ece5e

  - uses: charts/package
    with:
      chart-path: charts/tempo
      images: |
        tempo:
          values:
            tempo:
              registry: ${registry}
              repository: ${repo}
              tag: ${pseudo_tag}
        tempo-query:
          values:
            tempoQuery:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [tempo]
          - name: with-tempo-query
            images: [tempo, tempo-query]
            values:
              tempoQuery:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: grafana-community/helm-charts
    strip-prefix: tempo-
    use-tag: true
    tag-filter-prefix: tempo-
