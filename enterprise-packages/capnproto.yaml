package:
  name: capnproto
  version: "1.3.0"
  epoch: 0
  description: Cap'n Proto serialization/RPC system - core runtime library
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - openssl-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7dbb95989721016f8b590245ec7528c6ff03d1fe
      repository: https://github.com/capnproto/capnproto
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_SHARED_LIBS=ON \
        -DWITH_OPENSSL=ON \
        -DWITH_ZLIB=ON \
        -DBUILD_TESTING=OFF

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers and libraries
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: capnproto/capnproto
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: capnp
    - uses: test/tw/help-check
      with:
        bins: capnp
    - name: Test schema compilation
      runs: |
        set -euo pipefail
        cd "$(mktemp -d)"

        tee test.capnp << 'EOF'
        @0x85150b117366d14b;

        struct Person {
          name @0 :Text;
          email @1 :Text;
          birthdate @2 :Date;

          struct Date {
            year @0 :Int16;
            month @1 :UInt8;
            day @2 :UInt8;
          }
        }

        struct AddressBook {
          people @0 :List(Person);
        }
        EOF

        capnp compile -oc++ test.capnp
        stat test.capnp.c++ test.capnp.h
        grep -F -e "CAPNP_END_HEADER" test.capnp.h
        grep -F -e "namespace capnp" test.capnp.c++
    - name: Test encode and decode
      runs: |
        set -euo pipefail
        cd "$(mktemp -d)"

        tee data.capnp << 'EOF'
        @0x85150b117366d14b;

        struct TestData {
          value @0 :Int32;
          name @1 :Text;
        }
        EOF

        echo '(value = 42, name = "test")' | capnp encode data.capnp TestData > encoded.bin
        capnp decode data.capnp TestData < encoded.bin | tee output.txt
        grep -F -e 'value = 42' output.txt
        grep -F -e 'name = "test"' output.txt
    - name: Test schema validation error detection
      runs: |
        set -euo pipefail
        cd "$(mktemp -d)"

        tee invalid.capnp << 'EOF'
        @0x85150b117366d14b;

        struct BadSchema {
          field1 @0 :Text;
          field2 @0 :Int32;
        }
        EOF

        if capnp compile -oc++ invalid.capnp ; then
        	echo "Expected failure passed when compiling protobuf manifest to C++"
        	exit 1
        fi
