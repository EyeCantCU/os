package:
  name: networkd-dispatcher
  version: 2.2.4
  epoch: 0
  description: Dispatcher service for systemd-networkd connection status changes
  copyright:
    - license: GPL-3.0-only
  dependencies:
    runtime:
      - py${{vars.python-version}}-dbus-python
      - py${{vars.python-version}}-pygobject
      - systemd

vars:
  python-version: "3.13"
  required-config-dirs: "routable.d dormant.d no-carrier.d off.d carrier.d degraded.d configuring.d configured.d"

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/craftyguy/networkd-dispatcher.git
      expected-commit: dfd26d72793914eb3da910ef8c71de6d7c8942a2
      tag: ${{package.version}}

  - uses: patch
    with:
      # By default there is a race condition with systemd-networkd startup which can be resolved by
      # either forcing networkd-dispatcher to start first (which slows down network bringup)
      # or add a flag to run triggers for pre-existing state. This does the latter.
      patches: default-args.patch

  - runs: |
      install -Dm755 networkd-dispatcher ${{targets.destdir}}/usr/bin/networkd-dispatcher
      install -Dm644 networkd-dispatcher.conf ${{targets.destdir}}/etc/conf.d/networkd-dispatcher.conf
      install -Dm644 networkd-dispatcher.txt ${{targets.destdir}}/usr/share/doc/networkd-dispatcher/networkd-dispatcher.txt
      install -Dm644 networkd-dispatcher.service ${{targets.destdir}}/usr/lib/systemd/system/networkd-dispatcher.service
      for dir in ${{vars.required-config-dirs}}; do
        mkdir -p ${{targets.destdir}}/etc/networkd-dispatcher/$dir
      done
      # TODO: run upstream tests (./tests/run.sh). Requires pytest-cov and pytest-mock modules, currently unpackaged.

  - runs: |
      sed -i 's/env python3/env python${{vars.python-version}}/' ${{targets.destdir}}/usr/bin/networkd-dispatcher

test:
  pipeline:
    - runs: |
        networkd-dispatcher --help
        # Daemon won't start if these directories don't exist
        for dir in ${{vars.required-config-dirs}}; do
          test -d /etc/networkd-dispatcher/$dir
        done

update:
  enabled: true
  git: {}
