package:
  name: opentelemetry-python-instrumentation
  description: OpenTelemetry auto-instrumentation for Python
  version: 0.141.0
  epoch: 0
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # Required: https://github.com/open-telemetry/opentelemetry-operator/blob/main/autoinstrumentation/python/Dockerfile#L29
      - busybox
  options:
    no-depends: true

environment:
  contents:
    packages:
      - busybox
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}
      - uv
      - wolfi-baselayout

vars:
  # https://github.com/open-telemetry/opentelemetry-operator/blob/main/autoinstrumentation/python/Dockerfile#L12
  python-version: "3.11"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-operator
      tag: v${{package.version}}
      expected-commit: fff0d090527e61bd93041806a8b3bc53a5465612

  - uses: auth/uv
    with:
      allow-fallback-indexes: true

  - name: Install Python auto-instrumentation packages
    # Note: upstream also builds /autoinstrumentation-musl for Alpine. Wolfi uses glibc,
    # so we only build /autoinstrumentation.
    runs: |
      set -euo pipefail

      DESTDIR="${{targets.destdir}}/autoinstrumentation"
      mkdir -p "$DESTDIR"

      uv pip install \
        --target "$DESTDIR" \
        --no-cache \
        --no-compile-bytecode \
        --python python${{vars.python-version}} \
        -r autoinstrumentation/python/requirements.txt

      chmod -R go+r,go-w "$DESTDIR"

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-operator
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        # Python needed to run instrumentation (simulates target app container)
        - python-${{vars.python-version}}
    environment:
      PYTHONPATH: /autoinstrumentation
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test opentelemetry-bootstrap lists instrumentations
      runs: |
        set -euo pipefail

        # Verify bootstrap can discover available instrumentations
        python${{vars.python-version}} /autoinstrumentation/bin/opentelemetry-bootstrap \
          --action=requirements \
          | grep -F "opentelemetry-instrumentation"
    - name: Test opentelemetry-instrument wraps a script
      runs: |
        set -euo pipefail

        # Create a simple test application
        tee /tmp/app.py << 'EOF'
        print("instrumented app running")
        EOF

        # Run with auto-instrumentation (exporters disabled - no backend needed)
        OTEL_TRACES_EXPORTER=none \
        OTEL_METRICS_EXPORTER=none \
        OTEL_LOGS_EXPORTER=none \
          python${{vars.python-version}} /autoinstrumentation/bin/opentelemetry-instrument \
            python${{vars.python-version}} /tmp/app.py 2>&1 \
          | grep -F "instrumented app running"
    - name: Test OpenTelemetry SDK creates traces
      runs: |
        set -euo pipefail

        # Create and export a test span using ConsoleSpanExporter
        python${{vars.python-version}} << 'EOF' 2>&1 | tee /tmp/trace_output.txt
        from opentelemetry import trace
        from opentelemetry.sdk.trace import TracerProvider
        from opentelemetry.sdk.trace.export import ConsoleSpanExporter, SimpleSpanProcessor

        provider = TracerProvider()
        provider.add_span_processor(SimpleSpanProcessor(ConsoleSpanExporter()))
        trace.set_tracer_provider(provider)

        tracer = trace.get_tracer(__name__)
        with tracer.start_as_current_span("test-span") as span:
            span.set_attribute("test.key", "test-value")
        EOF

        # Verify trace was exported with expected span name and attribute
        grep -F "test-span" /tmp/trace_output.txt
        grep -F "test.key" /tmp/trace_output.txt
