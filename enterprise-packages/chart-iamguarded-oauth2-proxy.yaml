package:
  name: chart-iamguarded-oauth2-proxy
  version: "8.0.1"
  epoch: 1
  description: oauth2-proxy iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common
      - chart-iamguarded-redis

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: oauth2-proxy/${{package.version}}
      expected-commit: 75e9466d156d5c71efb022a1c86cff2fac75c3c1

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/oauth2-proxy

  - uses: charts/package
    with:
      chart-path: iamguarded/oauth2-proxy

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: oauth2-proxy/
    use-tag: true
    tag-filter-prefix: oauth2-proxy/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /oauth2-proxy
