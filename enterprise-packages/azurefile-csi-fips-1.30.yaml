package:
  name: azurefile-csi-fips-1.30
  version: "1.30.10"
  epoch: 13 # GHSA-9h8m-3fm2-qjrq
  description: Azure File CSI Driver
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - azurefile-csi-fips=${{package.full-version}}
    runtime:
      # https://github.com/kubernetes-sigs/azurefile-csi-driver/blob/v1.30.10/pkg/azurefileplugin/Dockerfile#L36
      - azcopy-fips
      - cifs-utils
      - e2fsprogs
      - mount
      - nfs-utils
      - udev
      - umount
      - util-linux
      - xfsprogs
  resources:
    cpu: "9"
    memory: 18Gi

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 524242e086cbc85ab7ca3e4cdd02d50d091e0e81
      repository: https://github.com/kubernetes-sigs/azurefile-csi-driver
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        github.com/opencontainers/selinux@v1.13.0
        golang.org/x/crypto@v0.45.0
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: |
        -X sigs.k8s.io/azurefile-csi-driver/pkg/azurefile.driverVersion=v${{package.version}}
        -X sigs.k8s.io/azurefile-csi-driver/pkg/azurefile.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/azurefile-csi-driver/pkg/azurefile.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")
      output: azurefileplugin
      packages: ./pkg/azurefileplugin

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/azurefileplugin ${{targets.subpkgdir}}/azurefileplugin
    dependencies:
      provides:
        - azurefile-csi-fips-compat=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: azurefile-csi-fips-compat
            real-pkg-name: ${{subpkg.name}}

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.30.

test:
  environment:
    contents:
      packages:
        - grpcurl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: azurefileplugin
    # Run the azurefileplugin binary and verify its startup
    - name: Run and test `azurefileplugin`
      uses: test/daemon-check-output
      with:
        start: /usr/bin/azurefileplugin --endpoint=unix:///tmp/csi.sock --nodeid=test-node
        timeout: 30
        expected_output: |
          file.csi.azure.com
          Driver Version: v${{package.version}}
          Enabling controller service capability: CREATE_DELETE_VOLUME
          Enabling volume access mode: SINGLE_NODE_WRITER
        post: |
          set -euo pipefail

          # Verify CSI Unix socket was created (fails test if missing)
          stat /tmp/csi.sock

          # Verify it's a proper Unix socket file (fails test if wrong type)
          test -S /tmp/csi.sock || {
            echo "FAIL: /tmp/csi.sock is not a Unix socket"
            exit 1
          }

          # Test CSI gRPC server responds using grpcurl
          # Try to list services - if reflection is enabled, we verify CSI services exist
          set +e
          grpc_response=$(grpcurl -plaintext -unix /tmp/csi.sock list 2>&1)
          grpc_rc=$?
          set -e

          if [ $grpc_rc -eq 0 ]; then
            # Reflection available - verify CSI identity service is registered
            echo "$grpc_response" | grep -F "csi.v1.Identity" || {
              echo "FAIL: CSI Identity service not found in gRPC reflection"
              echo "Response: $grpc_response"
              exit 1
            }
            echo "SUCCESS: CSI gRPC services verified via reflection"
          else
            # Reflection not available - verify server at least accepts connections
            # The successful daemon startup with expected_output proves CSI initialization
            echo "INFO: gRPC reflection not enabled (common for CSI drivers)"
            echo "CSI functionality verified via startup log messages"
          fi

          echo "SUCCESS: CSI driver gRPC endpoint is available at /tmp/csi.sock"
