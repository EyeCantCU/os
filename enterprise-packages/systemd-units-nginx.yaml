#nolint:valid-pipeline-git-checkout-tag
package:
  name: systemd-units-nginx
  version: "0_git20260116"
  epoch: 0
  description: systemd units for nginx
  copyright:
    - license: MIT
  dependencies:
    runtime:
      # note can be provided by multiple packages
      - nginx

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://src.fedoraproject.org/rpms/nginx.git
      branch: rawhide
      expected-commit: 7459e21df5a1c4203d49c77c00755b5eb8cb6246

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/lib/systemd/system/
      mkdir -p ${{targets.contextdir}}/usr/lib/sysusers.d/
      install -Dm644 nginx.service ${{targets.contextdir}}/usr/lib/systemd/system/
      install -Dm644 nginx@.service ${{targets.contextdir}}/usr/lib/systemd/system/
      install -Dm644 nginx.sysusers ${{targets.contextdir}}/usr/lib/sysusers.d/nginx.conf

test:
  environment:
    contents:
      packages:
        - systemd
  pipeline:
    - runs: |
        systemd-sysusers
        nginx -t
        [ -z "$(systemd-analyze verify nginx.service 2>&1)" ]
        [ -z "$(systemd-analyze verify nginx@.service 2>&1)" ]
        systemd-analyze --no-pager --offline=true security nginx.service
        systemd-analyze --no-pager --offline=true security nginx@.service

update:
  enabled: true
  git:
    tag-filter-contains: nginx-0_7_67-1_fc14
  version-transform:
    - match: .*
      replace: "0"
  schedule:
    period: weekly
    reason: Tags are not used
