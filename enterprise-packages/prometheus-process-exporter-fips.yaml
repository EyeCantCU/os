package:
  name: prometheus-process-exporter-fips
  version: "0.8.7"
  epoch: 9
  description: A Prometheus exporter that collects process metrics by mining the /proc filesystem
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ncabatoff/process-exporter.git
      tag: v${{package.version}}
      expected-commit: e52ab0a1c03d6baf8ed60154c254ecc0008549f3

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: ./cmd/process-exporter/main.go
      go-package: go-fips
      output: process-exporter

update:
  enabled: true
  github:
    identifier: ncabatoff/process-exporter
    strip-prefix: v
    tag-filter: v

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: process-exporter
    - uses: test/kwok/cluster
    - name: "Functional test"
      uses: test/daemon-check-output
      with:
        start: /usr/bin/process-exporter
        timeout: 30
        expected_output: |
          :9256
        post: |-
          set -euo pipefail
          # Verify metrics endpoint responds with process exporter metrics (proves exporter is collecting)
          curl -fsSL localhost:9256/metrics | grep -F "promhttp_metric_handler_requests_total"

environment:
  contents:
    packages:
      - go-fips-1.25
