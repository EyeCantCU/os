package:
  name: perl-xml-sax-base
  version: "1.09"
  epoch: 0
  description: Base class for SAX Drivers and Filters
  copyright:
    - license: Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl

environment:
  contents:
    packages:
      - build-base
      - perl-alien-build
      - perl-alien-libxml2
      - perl-capture-tiny
      - perl-dev
      - perl-path-tiny

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/G/GR/GRANTM/XML-SAX-Base-${{package.version}}.tar.gz
      expected-sha256: 66cb355ba4ef47c10ca738bd35999723644386ac853abbeb5132841f5e8a2ad0

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: make test

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 3535

subpackages:
  - name: ${{package.name}}-doc
    description: ${{package.name}} documentation
    pipeline:
      - uses: split/alldocs
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Smoke test
      runs: echo "use XML::SAX::Base;" | perl
    - runs: |
        perl <<'EOF'
        use strict;
        use warnings;
        use XML::SAX::Base;

        # Test creating a SAX handler (XML::SAX::Base is a base class)
        package TestHandler;
        use base 'XML::SAX::Base';

        sub start_document {
            my ($self, $doc) = @_;
            print "SAX: start_document called\n";
            return $self->SUPER::start_document($doc);
        }

        sub end_document {
            my ($self, $doc) = @_;
            print "SAX: end_document called\n";
            return $self->SUPER::end_document($doc);
        }

        package main;
        my $handler = TestHandler->new();
        die "Failed to create SAX handler" unless defined $handler;
        print "SAX handler created successfully\n";

        # Test that handler can process document events
        $handler->start_document({});
        $handler->end_document({});

        print "XML::SAX::Base tests passed\n";
        EOF
