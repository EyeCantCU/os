package:
  name: promxy-fips
  version: "0.0.93"
  epoch: 10
  description: An aggregating proxy to enable HA prometheus.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jacksontj/promxy
      tag: v${{package.version}}
      expected-commit: 920021379e4e92044b1a0b17e32ee8124980cbfe

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: ./cmd/promxy
      go-package: go-fips
      tags: netgo,builtinassets
      output: promxy
      ldflags: -X github.com/prometheus/common/version.Version=${{package.version}}

  - uses: go/build
    with:
      packages: ./cmd/remote_write_exporter
      go-package: go-fips
      output: remote_write_exporter

update:
  enabled: true
  github:
    identifier: jacksontj/promxy
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: promxy
    # test remote_write_exporter by validating specific help parameter exists
    - uses: test/tw/help-check
      with:
        bins: remote_write_exporter
        expect-contains: bind-addr

environment:
  contents:
    packages:
      - go-fips-1.25
