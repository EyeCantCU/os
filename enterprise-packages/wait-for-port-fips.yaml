package:
  name: wait-for-port-fips
  version: "1.0.10"
  epoch: 6 # CVE-2025-61732
  description: CLI tool for waiting until a TCP port reaches the desired state
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - go-fips-1.25

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bitnami/wait-for-port
      tag: v${{package.version}}
      expected-commit: 55a31d45febe69c337fd7e5a16ebd0ad749482d2

  - uses: go/build
    with:
      packages: .
      go-package: go-fips
      output: wait-for-port

update:
  enabled: true
  github:
    identifier: bitnami/wait-for-port
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - netcat-openbsd
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: wait-for-port
    - name: Test port waiting functionality
      runs: |-
        set -euo pipefail
        # Start a listener on port 2568 in background
        nc -l -p 2568 &
        # Test that wait-for-port detects the open port (fails test if port not detected)
        wait-for-port 2568
