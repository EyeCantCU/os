package:
  name: chart-postfinance-kubelet-csr-approver
  version: "1.2.13"
  epoch: 0
  description: Kubelet CSR Approver
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/postfinance/kubelet-csr-approver
      tag: v${{package.version}}
      expected-commit: 23160d0276d6e501232638ee59fd0fcf1cfe73a5

  # Upstream uses stefanprodan/helm-gh-pages action during release which sets
  # chart_version (without 'v' prefix) and app_version (with 'v' prefix).
  - runs: |
      yq -i '.version = "${{package.version}}"' charts/kubelet-csr-approver/Chart.yaml
      yq -i '.appVersion = "v${{package.version}}"' charts/kubelet-csr-approver/Chart.yaml

  - uses: charts/package
    with:
      chart-path: charts/kubelet-csr-approver
      images: |
        kubelet-csr-approver:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        values:
          providerRegex: "^.+$"
        cases:
          - name: default
            images: [kubelet-csr-approver]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: postfinance/kubelet-csr-approver
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
