package:
  name: kyverno-policy-reporter-plugins-kyverno
  version: "0.5.3"
  epoch: 4 # GHSA-9h8m-3fm2-qjrq
  description: Policy Reporter Plugin Kyverno
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kyverno/policy-reporter-plugins
      tag: kyverno-plugin-v${{package.version}}
      expected-commit: 095e87f714a00ba17bd2f783243b130c4f5f76da

  - uses: go/bump
    with:
      deps: |-
        github.com/sigstore/fulcio@v1.8.5
        github.com/sigstore/cosign/v2@v2.6.2
        github.com/sigstore/rekor@v1.5.0
        github.com/sigstore/sigstore@v1.10.4
        github.com/theupdateframework/go-tuf/v2@v2.4.1
        github.com/cloudflare/circl@v1.6.3
        go.opentelemetry.io/otel/sdk@v1.40.0
      modroot: plugins/kyverno

  - uses: go/build
    with:
      go-package: go
      output: kyverno-plugin
      packages: .
      modroot: plugins/kyverno

test:
  pipeline:
    - runs: |
        kyverno-plugin --help

subpackages:
  - name: ${{package.name}}-compat
    description: compatibility symlinks package for kyverno-plugin Dockerfile
    pipeline:
      - runs: |
          # Symlink the binary from usr/bin to /ko-app/
          mkdir -p ${{targets.subpkgdir}}/ko-app
          ln -sf /usr/bin/kyverno-plugin ${{targets.subpkgdir}}/ko-app/kyverno-plugin
    test:
      pipeline:
        - runs: |
            readlink -v /ko-app/kyverno-plugin

update:
  enabled: true
  git:
    strip-prefix: kyverno-plugin-v
    tag-filter-prefix: kyverno
