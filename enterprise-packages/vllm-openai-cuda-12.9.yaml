#nolint:valid-pipeline-git-checkout-tag,valid-pipeline-git-checkout-commit
package:
  name: vllm-openai-cuda-12.9
  version: "0.15.1"
  epoch: 0
  description: A high-throughput and memory-efficient inference and serving engine for LLMs
  target-architecture:
    - x86_64
  resources:
    cpu: 96
    memory: 256Gi
  copyright:
    - license: Apache-2.0
  options:
    no-provides: true
    # Python wheels (opencv-python-headless, pyzmq, etc.) bundle vendored .so files with unique hashes
    # in their filenames (e.g., libavcodec-e0dd92b8.so.59). Without no-depends, SCA would generate
    # unsatisfiable dependencies on these vendored libraries that no system package provides.
    no-depends: true
  # Runtime dependency notes:
  # Since we use no-depends: true, SCA won't auto-generate library dependencies.
  # We must explicitly list dependencies for libraries used at runtime to prevent drift on updates.
  # Vendored libraries (with hashes in filename like libavif-850e7649.so) are bundled by PyPI wheels and not listed.
  #
  # NOTE: Unlike upstream, we do NOT ship XPU (Intel) or ROCm (AMD) support. The bitsandbytes XPU and ROCm
  # libraries are removed during build as they require vendor-specific libraries not in our ecosystem.
  dependencies:
    runtime:
      # Package dependencies (for scripts/tools)
      - bash
      - busybox
      # CUDA toolkit and libraries (use package names - NVIDIA packages don't provide so: deps)
      - cuda-toolkit-${{vars.cuda-version}}
      - curl
      - ffmpeg-cuda-nozeromq # ffmpeg with CUDA support, no zeromq to avoid libsodium dependency (FIPS compliance), upstream comes with ffmpeg
      - gdrcopy-cuda-${{vars.cuda-version}} # GPU memory copy optimization via GPUDirect RDMA
      - git # needed for EP kernels installation script (clone pplx-kernels, DeepEP)
      # OpenMPI/NVSHMEM (from nvshmem bootstrap plugins: libmpi.so.40, libpmix.so.2)
      # Note: liboshmem.so.40 is not provided as separate so: dep, comes with openmpi
      - libfabric1 # libfabric.so.1
      - nvidia-cuda-cudart-${{vars.cuda-version}} # libcudart.so.12
      # cuDNN (from PyTorch libtorch_cuda.so, libtorch_python.so)
      - nvidia-cudnn-${{vars.cudnn-major-version}}-cuda-${{vars.cuda-major-version}} # libcudnn.so.9
      - nvidia-libcublas-${{vars.cuda-version}} # libcublas.so.12, libcublasLt.so.12
      - nvidia-libcusparse-${{vars.cuda-version}} # libcusparse.so.12
      - nvidia-libnvjitlink-${{vars.cuda-version}} # libnvJitLink.so.12
      # NCCL (from PyTorch libtorch_cuda.so)
      - nvidia-nccl-cuda-${{vars.cuda-version}} # libnccl.so.2
      - nvidia-nccl-cuda-${{vars.cuda-version}}-dev # nccl.h header for JIT compilation (pynccl_allocator.py)
      - openmpi-cuda-${{vars.cuda-version}} # provides so:libmpi.so.40
      - openpmix # provides so:libpmix.so.2
      - py${{vars.python-version}}-opencv-python-headless # use system OpenCV instead of PyPI wheel to avoid vendored OpenSSL, needed for FIPS
      - py${{vars.python-version}}-pip # needed for JIT compilation, core performance feature of vLLM
      - py${{vars.python-version}}-pyzmq # use system pyzmq (links to system zeromq) to avoid vendored libsodium, needed for FIPS
      - py${{vars.python-version}}-setuptools<81
      - python-${{vars.python-version}}
      - python-${{vars.python-version}}-dev # needed for JIT compilation, core performance feature of vLLM
      # Core system libraries (glibc provides so:libc.so.6, so:libm.so.6, so:libpthread.so.0, so:librt.so.1, so:libdl.so.2)
      - so:libc.so.6
      - so:libdl.so.2
      - so:libgcc_s.so.1
      # OpenMP (from numba omppool, PyTorch libtorch_cpu.so - note: PyTorch also bundles its own libgomp.so.1)
      - so:libgomp.so.1
      - so:libm.so.6
      - so:libpthread.so.0
      - so:librt.so.1
      - so:libstdc++.so.6
      # TBB (from numba tbbpool)
      - so:libtbb.so.12
      - so:libz.so.1
      - wget # needed for EP kernels installation script (download NVSHMEM)
      - zeromq-nocurve # provides libzmq without libsodium (FIPS compliant)

vars:
  cudnn-major-version: 9
  import: vllm
  pypi-package: vllm
  python-version: 3.12

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.\d+$'
    replace: '$1'
    to: cuda-major-version
  - from: ${{vars.cuda-version}}
    match: '(\d+)\.(\d+)'
    replace: '$1$2'
    to: cuda-wheel-version

environment:
  contents:
    packages:
      - busybox
      - cmake
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - jq
      - ncurses-dev
      - nvcc-${{vars.cuda-version}}-gcc-default
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - py3-supported-build-base-dev
      - python-${{vars.python-version}}
      - samurai
      - uv
  environment:
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
    LD_LIBRARY_PATH: /usr/local/cuda-${{vars.cuda-version}}/lib64:/usr/local/cuda-${{vars.cuda-version}}/lib
    CMAKE_CUDA_ARCHITECTURES: all
    CUDA_TOOLKIT_ROOT_DIR: /usr/local/cuda-${{vars.cuda-version}}
    CUDAToolkit_ROOT: /usr/local/cuda-${{vars.cuda-version}}
    CMAKE_ARGS: "-DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda-${{vars.cuda-version}} -DCUDAToolkit_ROOT=/usr/local/cuda-${{vars.cuda-version}} -DCMAKE_CUDA_COMPILER=/usr/local/cuda-${{vars.cuda-version}}/bin/nvcc"
    PATH: "/usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin:/usr/local/cuda-${{vars.cuda-version}}/bin"
    FORCE_CUDA: 1
    USE_CUDA: 1
    USE_CUDNN: 1
    VERBOSE: 1
    MAX_JOBS: "64"
    CMAKE_BUILD_TYPE: Release
    UV_LINK_MODE: copy
    UV_INDEX_STRATEGY: "unsafe-best-match"
    UV_HTTP_TIMEOUT: 500

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/vllm-project/vllm.git
      tag: v${{package.version}}
      expected-commit: 1892993bc18e243e2c05841314c5e9c06a80c70d

  - name: Detect dependency drift
    runs: |
      set -oue pipefail

      versions="docker/versions.json"

      our_cuda_version="${{vars.cuda-version}}"
      their_cuda_version=$(jq -r '.variable.CUDA_VERSION.default |
                           split(".")[:2] | join(".")' "$versions")

      if [ "$their_cuda_version" != "$our_cuda_version" ]; then
        echo "Invalid CUDA version detected!"
        echo "Our CUDA version: $our_cuda_version"
        echo "Their CUDA version: $their_cuda_version"
        echo "Please update the CUDA version used by this package."
        exit 1
      fi

      our_python_version="${{vars.python-version}}"
      their_python_version=$(jq -r '.variable.PYTHON_VERSION.default' "$versions")

      if [ "$their_python_version" != "$our_python_version" ]; then
        echo "Invalid Python version detected!"
        echo "Our Python version: $our_python_version"
        echo "Their Python version: $their_python_version"
        echo "Please update the Python version used by this package."
        exit 1
      fi

  - name: Install build dependencies
    runs: |
      uv pip install \
        --system \
        --extra-index-url "https://download.pytorch.org/whl/cu${{vars.cuda-wheel-version}}" \
        -r requirements/build.txt

  - name: Build wheel
    runs: |
      python${{vars.python-version}} setup.py bdist_wheel --dist-dir dist --py-limited-api=cp38

  - name: Install wheel
    runs: |
      uv pip install \
        --system --prefix ${{targets.contextdir}}/usr \
        --extra-index-url "https://download.pytorch.org/whl/cu${{vars.cuda-wheel-version}}" \
        dist/*.whl

  - name: Install CUDA dependencies
    runs: |
      uv pip install \
        --system --prefix ${{targets.contextdir}}/usr \
        --extra-index-url "https://download.pytorch.org/whl/cu${{vars.cuda-wheel-version}}" \
        -r requirements/cuda.txt

  # OpenAI-server parity extras (mirrors vllm-openai-base)
  - name: Install OpenAI server extras
    runs: |
      set -oue pipefail

      versions="docker/versions.json"
      bitsandbytes_version=$(jq -r '.variable.BITSANDBYTES_VERSION_X86.default' "$versions")
      timm_version=$(jq -r '.variable.TIMM_VERSION.default' "$versions")
      runai_version=$(jq -r '.variable.RUNAI_MODEL_STREAMER_VERSION.default' "$versions")

      uv pip install \
        --system --prefix ${{targets.contextdir}}/usr \
        accelerate hf_transfer modelscope \
        "bitsandbytes>=${bitsandbytes_version}" \
        "timm${timm_version}" \
        "runai-model-streamer[s3,gcs]${runai_version}"

  # Right about here we run out of disk space
  - name: Purge cache
    runs: uv cache clean

  # FlashInfer — mirror upstream precompiled cubin + JIT cache (no AOT, no git)
  - name: Install FlashInfer cubin + jit-cache
    runs: |
      set -oue pipefail

      versions="docker/versions.json"
      flashinfer_version=$(jq -r '.variable.FLASHINFER_VERSION.default' "$versions")

      uv pip install \
        --system --prefix ${{targets.contextdir}}/usr \
        "flashinfer-cubin==${flashinfer_version}"

      uv pip install \
        --system --prefix ${{targets.contextdir}}/usr \
        --extra-index-url "https://flashinfer.ai/whl/cu${{vars.cuda-wheel-version}}" \
        "flashinfer-jit-cache==${flashinfer_version}"

  # DeepGEMM — FP8 GEMM kernels for Hopper/Blackwell (SM 9.0a/10.0a)
  # Provides ~5.5% throughput improvement, enabled by default in vLLM 0.11+
  # Upstream pins by commit (not tag) in versions.json
  - uses: git-checkout
    with:
      repository: https://github.com/deepseek-ai/DeepGEMM.git
      branch: main
      destination: deepgemm
      depth: -1

  - name: Pin DeepGEMM to upstream commit
    working-directory: deepgemm
    runs: |
      set -oue pipefail

      deepgemm_commit=$(jq -r '.variable.DEEPGEMM_GIT_REF.default' "../docker/versions.json")

      git checkout "$deepgemm_commit"
      git submodule update --init --recursive

  - name: Build and install DeepGEMM
    working-directory: deepgemm
    runs: |
      # Build for Hopper (9.0a) and Blackwell (10.0a) only - matches upstream
      export TORCH_CUDA_ARCH_LIST="9.0a 10.0a"

      python${{vars.python-version}} setup.py bdist_wheel --dist-dir dist

      uv pip install \
        --system --prefix ${{targets.contextdir}}/usr \
        dist/*.whl

  # Install build.txt into runtime for JIT compilation
  - name: Install build-time deps into runtime (for JIT)
    runs: |
      uv pip install \
        --system --prefix ${{targets.contextdir}}/usr \
        --extra-index-url "https://download.pytorch.org/whl/cu${{vars.cuda-wheel-version}}" \
        -r requirements/build.txt

  # Patch ray's vendored dependencies that have CVEs
  # Ray bundles its own aiohttp and log4j which the scanner detects
  - name: Patch ray vendored dependencies
    runs: |
      SITE_PACKAGES="${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages"
      RAY_SITE="${SITE_PACKAGES}/ray"

      # Patch ray's vendored aiohttp (CVE-2025-69223, etc.)
      # Ray bundles aiohttp in ray/_private/runtime_env/agent/thirdparty_files/
      # Copy the already-installed fixed aiohttp from system site-packages
      THIRDPARTY_DIR="${RAY_SITE}/_private/runtime_env/agent/thirdparty_files"

      # Remove old aiohttp directories (both package and dist-info)
      rm -r "${THIRDPARTY_DIR}"/aiohttp*

      # Copy up-to-date aiohttp from system site-packages
      cp -r "${SITE_PACKAGES}"/aiohttp "${THIRDPARTY_DIR}/"
      cp -r "${SITE_PACKAGES}"/aiohttp-*.dist-info "${THIRDPARTY_DIR}/"

      # Patch ray's log4j in ray_dist.jar (CVE-2025-68161)
      # ray/jars/ray_dist.jar contains log4j-core 2.17.1
      # vllm doesn't use ray's Java components, so we can remove the vulnerable JAR
      # to eliminate the CVE. If Java support is needed, this would need to be
      # rebuilt with updated log4j.
      echo "Removing ray_dist.jar containing vulnerable log4j-core"
      echo "vllm uses ray for Python-based distributed computing, not Java"
      rm "${RAY_SITE}/jars/ray_dist.jar"

  - name: Prune incompatible GPU extras
    runs: |
      # bitsandbytes: drop non-CUDA-12, XPU, and ROCm artifacts
      # - cuda118/cuda130: incompatible CUDA versions
      # - xpu: requires Intel oneAPI libraries (libsvml.so, libirng.so, libimf.so, libintlc.so.5, libsycl.so.8)
      #        which are not available in our ecosystem. Unlike upstream, we don't ship XPU support. We will mention in Compat Notes
      # - rocm*: requires AMD HIP libraries (libhipblas.so, libhipsparse.so, libhipblaslt.so)
      #          which are not available in our ecosystem. Unlike upstream, we don't ship ROCm support.
      mv ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/bitsandbytes/libbitsandbytes_cuda${{vars.cuda-wheel-version}}.so \
         ${{package.srcdir}}/
      rm ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/bitsandbytes/libbitsandbytes_cuda*.so
      rm ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/bitsandbytes/libbitsandbytes_xpu.so
      rm ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/bitsandbytes/libbitsandbytes_rocm*.so
      mv ${{package.srcdir}}/libbitsandbytes_cuda${{vars.cuda-wheel-version}}.so \
         ${{targets.contextdir}}/usr/lib/python${{vars.python-version}}/site-packages/bitsandbytes/

      # CuPy and its vendor backends are optional for vLLM; safest is to remove CuPy entirely:
      # upstream also removed but it is optionally used by ray
      # If we ship it then we have to pull in cudnn8 which is not compatible with cudnn9 we ship
      # https://github.com/vllm-project/vllm/pull/3625
      uv pip uninstall --system --prefix "${{targets.contextdir}}/usr" cupy-cuda${{vars.cuda-major-version}}x

      # Remove PyPI opencv-python-headless in favor of system package (py3.12-opencv-python-headless)
      # The PyPI wheel vendors OpenSSL 1.1 which is not FIPS compliant; our system package uses system OpenSSL
      uv pip uninstall --system --prefix "${{targets.contextdir}}/usr" opencv-python-headless

      # Remove PyPI pyzmq in favor of system package (py3.12-pyzmq)
      # The PyPI wheel bundles libsodium; our system package links to system libsodium (no vendored libs)
      uv pip uninstall --system --prefix "${{targets.contextdir}}/usr" pyzmq

      # Remove PyPI numpy in favor of system package (py3.12-numpy-2.2)
      # The system numpy is pulled in as a transitive dependency of py3.12-opencv-python-headless.
      # Without this, the -dev subpackage would contain numpy headers that conflict with system numpy.
      uv pip uninstall --system --prefix "${{targets.contextdir}}/usr" numpy

      # Remove PyPI pygments in favor of system package (py3.12-pygments)
      # Pygments comes from fastapi[standard] -> rich-toolkit -> rich -> pygments
      # Without this, the main package would contain pygments files that conflict with system pygments coming from system numpy
      uv pip uninstall --system --prefix "${{targets.contextdir}}/usr" pygments

      # Remove PyPI setuptools in favor of system package (py3.12-setuptools)
      # The system setuptools is pulled in via py3.12-pip -> py3.12-pip-base -> py3.12-setuptools.
      # Without this, the main package would contain setuptools files that conflict with system setuptools.
      uv pip uninstall --system --prefix "${{targets.contextdir}}/usr" setuptools

      # Remove uv lockfile (world-writable, triggers linter)
      rm ${{targets.contextdir}}/usr/.lock

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development files
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-compat
    description: Auxiliary tools and helpers for vLLM (collect-env, examples)
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/vllm-workspace
          cp vllm/collect_env.py ${{targets.contextdir}}/vllm-workspace

          mkdir -p ${{targets.contextdir}}/vllm-workspace/requirements
          cp requirements/build.txt ${{targets.contextdir}}/vllm-workspace/requirements/
          cp requirements/kv_connectors.txt ${{targets.contextdir}}/vllm-workspace/requirements/

          # We can't include ep_kernels_workspace in our package as they are being pulled up from a script
          # tools/ep_kernels/install_python_libraries.sh, we are including that script here for user convenience
          install -Dm755 tools/ep_kernels/install_python_libraries.sh ${{targets.contextdir}}/vllm-workspace

test:
  environment:
    contents:
      packages:
        # ldd check will fail in absence of libcuda.so, but we can add this only in test pipeline
        # for ref https://github.com/chainguard-dev/extra-packages/pull/2890
        - libcuda-stub-cuda-${{vars.cuda-version}}-dev
        # Test co-installability: if there are file conflicts between main and -dev packages as dev package is important for image
        - ${{package.name}}-dev
  pipeline:
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/usr/lib/python${{vars.python-version}}/site-packages/torch/lib"
    - uses: test/tw/pip-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: ${{vars.import}}
    - runs: |
        set -eux
        # Please note that this will fail on CPU as upstream doesn't release CPU wheels for it
        # https://github.com/vllm-project/vllm/issues/23096

        # Run it; allow non-zero; then assert the expected failure text
        set +e
        python${{vars.python-version}} test-vllm-cpu-smoke.py > /tmp/vllm.log 2>&1
        set -e

        if grep -F "Device string must not be empty" /tmp/vllm.log; then
          echo "OK: vLLM smoke hit expected CPU-only error"
        else
          echo "Expected pattern not found; showing log:"
          sed -n '1,200p' /tmp/vllm.log
          exit 1
        fi
    # FIPS compliance: verify no vendored libcrypto, libssl, or libsodium in Python site-packages
    # PyPI wheels often bundle these which breaks FIPS compliance
    - name: Verify no vendored crypto libraries (FIPS compliance)
      runs: |
        set -euo pipefail
        SITE_PACKAGES="/usr/lib/python${{vars.python-version}}/site-packages"
        echo "Scanning $SITE_PACKAGES for vendored crypto libraries..."

        # Find all .so files and check their dependencies
        # libcrypto and libssl are OpenSSL components; libsodium is used by some packages
        # Check for libraries linking to non-system crypto libs (vendored copies)
        CRYPTO_LIBS=$(find "$SITE_PACKAGES" -name "*.so*" -type f -exec ldd {} 2>/dev/null \; | \
                      grep -E "libcrypto|libssl|libsodium" | grep -v "=> /lib/" | grep -v "=> /usr/lib/" || :)

        if [ -n "$CRYPTO_LIBS" ]; then
          echo "ERROR: Found vendored crypto libraries in site-packages (breaks FIPS compliance):"
          echo "$CRYPTO_LIBS"
          echo ""
          echo "These libraries must link to system OpenSSL/libsodium, not vendored copies."
          echo "Check for PyPI wheels that bundle libcrypto.so, libssl.so, or libsodium.so"
          exit 1
        fi

        # Also check for embedded crypto .so files (some wheels embed them directly)
        EMBEDDED_CRYPTO=$(find "$SITE_PACKAGES" -type f \( -name "*libcrypto*" -o -name "*libssl*" -o -name "*libsodium*" \) \
                          ! -path "*__pycache__*" || :)

        if [ -n "$EMBEDDED_CRYPTO" ]; then
          echo "ERROR: Found embedded crypto library files in site-packages (breaks FIPS compliance):"
          echo "$EMBEDDED_CRYPTO"
          exit 1
        fi

        echo "OK: No vendored crypto libraries found - FIPS compliance check passed"

update:
  enabled: true
  ignore-regex-patterns:
    - post
    - test
    - submission
  github:
    identifier: vllm-project/vllm
    strip-prefix: v
