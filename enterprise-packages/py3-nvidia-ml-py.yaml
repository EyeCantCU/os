package:
  name: py3-nvidia-ml-py
  version: "13.580.65"
  epoch: 0
  description: Python Bindings for the NVIDIA Management Library
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: nvidia-ml-py
  import: pynvml

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: fetch
    with:
      uri: https://pypi.python.org/packages/source/n/nvidia_ml_py/nvidia_ml_py-${{package.version}}.tar.gz
      expected-sha512: 04202d3df4dff21afe221512f275cd974f9bbe8cf077ec30de79b233f5f3e91eb6a5776aab94e433a36c1bbb6763628f002165fd813bc6d57cc43c37479091eb

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  release-monitor:
    identifier: 132962
