package:
  name: rabbitmq-default-user-credential-updater-fips
  version: "1.0.7"
  epoch: 0
  description: Updates RabbitMQ default user password
  copyright:
    - license: MPL-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rabbitmq/default-user-credential-updater
      tag: v${{package.version}}
      expected-commit: 7a0378caed892ea6f5e9bb7310357a15652b1733

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      output: default-user-credential-updater

subpackages:
  - name: ${{package.name}}-bitnami-compat
    dependencies:
      runtime:
        - ${{package.name}}
    description: "compat package for ${{package.name}} image"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/opt/bitnami/rmq-default-credential-updater/bin
          ln -sf /usr/bin/default-user-credential-updater ${{targets.contextdir}}/opt/bitnami/rmq-default-credential-updater/bin/default-user-credential-updater
    test:
      pipeline:
        - runs: |
            /opt/bitnami/rmq-default-credential-updater/bin/default-user-credential-updater -h  2>&1 | grep "Usage of /opt/bitnami/rmq-default-credential-updater/bin/default-user-credential-updater"

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        default-user-credential-updater -h  2>&1 | grep "Usage of default-user-credential-updater:"
        default-user-credential-updater version
        default-user-credential-updater --help

update:
  enabled: true
  github:
    identifier: rabbitmq/default-user-credential-updater
    strip-prefix: v
