package:
  name: chart-fluent-fluent-operator
  version: "3.6.0"
  epoch: 0
  description: Fluent Operator provides great flexibility in building a logging layer based on Fluent Bit and Fluentd.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fluent/fluent-operator
      tag: v${{package.version}}
      expected-commit: f7b17bbff96a3c414c5ba239789edc5a3fbcba02

  # Remove external repository refs from subchart dependencies, update version
  # constraints to match the actual subchart versions, and copy the sibling
  # subchart directories into the chart's charts/ directory so that helm
  # dependency build can find them locally.
  - runs: |
      yq -i 'del(.dependencies[].repository)' charts/fluent-operator/Chart.yaml
      for dep in fluent-bit-crds fluentd-crds; do
        ver=$(yq '.version' "charts/$dep/Chart.yaml")
        yq -i "(.dependencies[] | select(.name == \"$dep\")).version = \"$ver\"" charts/fluent-operator/Chart.yaml
      done
      mkdir -p charts/fluent-operator/charts
      cp -r charts/fluent-bit-crds charts/fluent-operator/charts/
      cp -r charts/fluentd-crds charts/fluent-operator/charts/

  - uses: charts/package
    with:
      chart-path: charts/fluent-operator
      images: |
        fluent-operator:
          values:
            operator:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${pseudo_tag}
        fluent-bit:
          values:
            fluentbit:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${pseudo_tag}
        fluentd:
          values:
            fluentd:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [fluent-operator, fluent-bit]
          - name: with-fluentd
            images: [fluent-operator, fluent-bit, fluentd]
            values:
              fluentd:
                enable: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: fluent/fluent-operator
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
