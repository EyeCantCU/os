package:
  name: chart-iamguarded-node-exporter
  version: "4.5.19"
  epoch: 1
  description: Node exporter iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: node-exporter/${{package.version}}
      expected-commit: a3ef55bcfe235e64505c155887600b46a0263b8f

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/node-exporter

  - uses: charts/package
    with:
      chart-path: iamguarded/node-exporter

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: node-exporter/
    use-tag: true
    tag-filter-prefix: node-exporter/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /node-exporter
