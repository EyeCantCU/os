package:
  name: zabbix-agent2-7.2-eol-compat
  version: "7.2.15"
  epoch: 1
  description: Docker compatibility layer for Zabbix Agent 2 7.2 (EOL)
  copyright:
    - license: AGPL-3.0-only
  dependencies:
    runtime:
      - bash
      - busybox
      - iputils
      - merged-usrsbin
      - smartmontools
      - tzdata

environment:
  contents:
    packages:
      - busybox

pipeline:
  # 7.2.15 tag still exists in zabbix-docker repo
  - uses: git-checkout
    with:
      repository: https://github.com/zabbix/zabbix-docker
      tag: ${{package.version}}
      expected-commit: a8510fe47b92edd608dcf60af110aacf28699c86
      destination: zabbix-docker

  - runs: |
      # Install docker-entrypoint.sh from upstream zabbix-docker repository
      install -Dm755 zabbix-docker/Dockerfiles/agent2/alpine/docker-entrypoint.sh \
        "${{targets.destdir}}/usr/bin/docker-entrypoint.sh"

update:
  enabled: false
  exclude-reason: "7.2 reached EOL on Dec 31, 2025 - frozen at 7.2.15"
  github:
    identifier: zabbix/zabbix-docker
    use-tag: true
    tag-filter-prefix: "7.2."

test:
  environment:
    contents:
      packages:
        # Test with non-FIPS variant
        - zabbix-agent2-7.2
  pipeline:
    - runs: |
        # Verify /usr/sbin/zabbix_agent2 works via merged-usrsbin symlink
        /usr/sbin/zabbix_agent2 --help
        # Verify docker-entrypoint.sh exists and is executable
        test -x /usr/bin/docker-entrypoint.sh
