package:
  name: ruby3.4-fluent-plugin-prometheus
  version: "2.2.1"
  epoch: 0
  description: A fluent plugin that collects metrics and exposes for Prometheus.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ruby3.4-fluentd
      - ruby3.4-prometheus-client
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-3.4
      - ruby-3.4-dev

vars:
  gem: fluent-plugin-prometheus

pipeline:
  - uses: git-checkout
    with:
      destination: ${{vars.gem}}
      expected-commit: f8e841863f89dfb38878a53845d314814838778f
      repository: https://github.com/fluent/fluent-plugin-prometheus
      tag: v${{package.version}}

  - working-directory: ${{vars.gem}}
    pipeline:
      - uses: ruby/unlock-spec
      - uses: ruby/build
        with:
          gem: ${{vars.gem}}
      - uses: ruby/install
        with:
          gem: ${{vars.gem}}
          version: ${{package.version}}
      - uses: ruby/clean

update:
  enabled: true
  github:
    identifier: fluent/fluent-plugin-prometheus
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ruby3.4-fluentd
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: fluent/plugin/in_prometheus
    - runs: |
        ruby -e "require 'fluent/plugin/prometheus'"
        ruby -e "require 'fluent/plugin/in_prometheus'"
    - name: Validate plugin loads in fluentd
      runs: |
        set -euo pipefail
        tee /tmp/test.conf <<'EOF'
        <source>
          @type prometheus
          port 24231
        </source>

        <match **>
          @type null
        </match>
        EOF
        fluentd --dry-run -c /tmp/test.conf
