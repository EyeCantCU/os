package:
  name: colord
  version: 1.4.8
  epoch: 1 # go/enterprise-rsc/colord
  description: System daemon for managing color devices
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "1"
    memory: 3Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - dbus-dev
      - gettext-dev
      - gio
      - glib-dev
      - gtk-doc
      - lcms2-dev
      - libgudev-dev
      - libgusb
      - libgusb-dev
      - libudev-dev
      - libxslt
      - meson
      - polkit-dev
      - sqlite-dev
      - vala

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hughsie/colord
      tag: ${{package.version}}
      expected-commit: e3ee294acdc53d7f191e1090631d75f471e59d82

  - uses: meson/configure
    with:
      opts: |
        -Dsystemd=false \
        -Dargyllcms_sensor=false \
        -Dman=false \
        -Ddocs=false \
        -Ddaemon_user=colord \
        -Dsane=false \
        -Dvapi=false \
        -Dsession_example=false \
        -Dintrospection=false \
        -Dbash_completion=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libcolord
        - dbus-dev
        - libgudev-dev
        - polkit-dev
        - sqlite-dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-lang
    pipeline:
      - uses: split/locales

  - name: libcolord
    description: colord client library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libcolord.so.* "${{targets.contextdir}}"/usr/lib/
          mv "${{targets.destdir}}"/usr/lib/libcolordprivate.so.* "${{targets.contextdir}}"/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-colorhug
    description: colord ColorHug support
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libcolorhug.so.* "${{targets.contextdir}}"/usr/lib/
          mkdir -p "${{targets.contextdir}}"/usr/lib/colord-sensors
          mv "${{targets.destdir}}"/usr/lib/colord-sensors/libcolord_sensor_colorhug.so "${{targets.contextdir}}"/usr/lib/colord-sensors/
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify colord library
      runs: |
        set -euo pipefail
        stat /usr/lib/libcolord.so*
        stat /usr/lib/libcolordprivate.so*
        echo "colord library test passed"

update:
  enabled: true
  github:
    identifier: hughsie/colord
    use-tag: true
