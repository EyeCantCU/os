package:
  name: chart-sigstore-fulcio
  version: "2.7.4"
  epoch: 0
  description: |
    Fulcio is a free code signing Certificate Authority, built to make short-lived certificates available to anyone.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-sigstore-ctlog

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sigstore/helm-charts
      tag: fulcio-${{package.version}}
      expected-commit: 127b2f2264475f5c20363d646bb688a6f2cf8a1d

  - uses: charts/package
    with:
      chart-path: charts/fulcio
      images: |
        fulcio:
          values:
            server:
              image:
                registry: ${registry}
                repository: ${repo}
                version: ${pseudo_tag}
        createcerts:
          values:
            createcerts:
              image:
                registry: ${registry}
                repository: ${repo}
                version: ${pseudo_tag}
        curl:
          values:
            init:
              image:
                curl:
                  registry: ${registry}
                  repository: ${repo}
                  version: ${digest}
      test: |
        values:
          imagePullSecrets:
            - name: my-pull-secret
          ctlog:
            enabled: false
          init:
            enabled: true
        cases:
          - name: default
            images: [fulcio, createcerts, curl]
          - name: without-createcerts
            images: [fulcio, curl]
            values:
              createcerts:
                enabled: false

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: sigstore/helm-charts
    strip-prefix: fulcio-
    use-tag: true
    tag-filter-prefix: fulcio-
