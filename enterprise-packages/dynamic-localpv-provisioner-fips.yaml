package:
  name: dynamic-localpv-provisioner-fips
  version: "4.4.0"
  epoch: 5 # CVE-2025-61732
  description: Dynamic Local Volumes for Kubernetes Stateful workloads.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - ca-certificates-bundle
      - iproute2
      - mii-tool
      - net-tools
      - procps
  resources:
    cpu: "4"
    memory: 8Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openebs/dynamic-localpv-provisioner
      tag: v${{package.version}}
      expected-commit: 9d5dad82ad12edb4bf85d30316227194a48c86f5

  - uses: go/bump
    with:
      deps: |-
        github.com/prometheus/client_golang@v1.11.1
        github.com/Masterminds/goutils@v1.1.1
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        golang.org/x/crypto@v0.45.0

  - uses: go/remove-cgo-enabled-0
    with:
      files: buildscripts/build.sh

  - runs: |
      make provisioner-localpv
      mkdir -p ${{targets.destdir}}/usr/bin
      GOOS=$(go env GOOS)
      GOARCH=$(go env GOARCH)
      mv ./bin/provisioner-localpv/${GOOS}_${GOARCH}/provisioner-localpv ${{targets.destdir}}/usr/bin/

update:
  ignore-regex-patterns:
    - localp* # there are some misspellings in the upstream tags so using a wildcard here
  enabled: true
  github:
    identifier: openebs/dynamic-localpv-provisioner
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
    environment:
      KUBERNETES_SERVICE_HOST: "127.0.0.1"
      KUBERNETES_SERVICE_PORT: "32764"
      OPENEBS_NAMESPACE: "default"
      NODE_NAME: "node-000000"
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: provisioner-localpv
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - name: Test provisioner with Kubernetes cluster
      uses: test/daemon-check-output
      with:
        setup: |
          kubectl create clusterrolebinding test-admin \
            --clusterrole=cluster-admin \
            --serviceaccount=default:default
        start: /usr/bin/provisioner-localpv
        expected_output: |
          Starting Provisioner
        timeout: "30"
        error_strings: ""
        post: |-
          set -euo pipefail

          # Create a StorageClass that uses this provisioner (verifies provisioner sees cluster)
          kubectl apply -f - <<EOF
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: test-local-storage
          provisioner: openebs.io/local
          volumeBindingMode: WaitForFirstConsumer
          EOF

          # Verify the StorageClass was created with correct provisioner (fails test if not found)
          kubectl get storageclass test-local-storage -o jsonpath='{.provisioner}' | grep -F "openebs.io/local"

          echo "SUCCESS: Provisioner is running and cluster resources are accessible"
