package:
  name: py3-pygtrie
  version: 2.5.0
  epoch: 0
  description: pure Python implementation of a trie data structure
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: pygtrie

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mina86/pygtrie.git
      tag: v${{package.version}}
      expected-commit: 1587471d95967fbc7339d1981fd3df28830e9c3a

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | grep -E -e "Trie contents: \[\('apple', 'A common fruit'\).*]"
            import pygtrie

            t = pygtrie.StringTrie()

            t['apple'] = 'A common fruit'
            t['appetizer'] = 'A small dish before a main course'
            t['application'] = 'A formal request or program'
            t['banana'] = 'A long, curved fruit'
            t['band'] = 'A group of musicians'

            print(f"Trie contents: {list(t.items())}")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
