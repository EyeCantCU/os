package:
  name: linux-qemu-generic
  version: "6.16.10"
  epoch: 2
  description: "the QEMU generic linux kernel"
  copyright:
    - license: GPL-2.0
  dependencies:
    runtime:
      - ${{package.name}}-modules=${{package.full-version}}
      # Ensure we get Chainguard branding in our VMs.
      - chainguard-baselayout
      - merged-lib
      - wolfi-baselayout

environment:
  environment:
    KBUILD_BUILD_USER: noreply
    KBUILD_BUILD_HOST: chainguard.dev
    KBUILD_BUILD_VERSION: Chainguard
  contents:
    packages:
      - bootc-dracut

var-transforms:
  - from: ${{package.name}}
    match: 'linux-(.*)'
    replace: '$1'
    to: flavor
  - from: ${{package.name}}
    match: 'linux-(.*)'
    replace: '${{package.full-version}}-$1'
    to: version-flavor
  - from: ${{package.version}}
    match: '^(\d+[.]\d+)[.]0$'
    replace: '$1'
    to: mangled-package-version
  - from: ${{package.version}}
    match: '^(\d+\.\d+)\.\d+$'
    replace: '$1'
    to: mangled-kernel-major-version

pipeline:
  - uses: kernel/version-check
    with:
      moniker: stable

  - uses: git-checkout
    with:
      repository: https://github.com/gregkh/linux
      tag: v${{vars.mangled-package-version}}
      expected-commit: bcabc18865f367a23e016bf6113420c82aea276d

  - uses: patch
    with:
      patches: 0001-crypto-fix-hkdf-tests-${{vars.mangled-kernel-major-version}}.patch

  - uses: kernel/config
    with:
      flavor: ${{vars.flavor}}
      make-targets: hardening.config
      version-flavor: ${{vars.version-flavor}}

  - uses: kernel/build
    with:
      version-flavor: ${{vars.version-flavor}}

subpackages:
  - name: "${{package.name}}-boot-installed"
    description: "Linux kernel (installed for EFI)"
    dependencies:
      runtime:
        # Ensure we get Chainguard branding in our VMs.
        - ${{package.name}}-modules=${{package.full-version}}
        - chainguard-baselayout
        - merged-lib
        - systemd-boot-installed
        - wolfi-baselayout
      provides:
        - ${{package.name}}-boot-configuration=${{package.full-version}}
    pipeline:
      - uses: kernel/boot-installed
        with:
          version-flavor: ${{vars.version-flavor}}

  - name: "${{package.name}}-fips-boot-installed"
    description: "FIPS Linux kernel (installed for EFI)"
    dependencies:
      runtime:
        # Ensure we get Chainguard branding in our VMs.
        - ${{package.name}}-modules=${{package.full-version}}
        - chainguard-baselayout
        - systemd-boot-installed
      provides:
        - ${{package.name}}-boot-configuration=${{package.full-version}}
    pipeline:
      - uses: kernel/boot-installed
        with:
          version-flavor: ${{vars.version-flavor}}
          extra-args: fips=1

  - name: "${{package.name}}-modules"
    description: "Linux kernel modules"
    pipeline:
      - uses: kernel/modules
        with:
          version-flavor: ${{vars.version-flavor}}
    dependencies:
      runtime:
        - merged-lib
        - wolfi-baselayout

  - name: "${{package.name}}-bootc-boot-installed"
    description: "Linux kernel (installed for EFI)"
    dependencies:
      runtime:
        # Ensure we get Chainguard branding in our VMs.
        - ${{package.name}}-modules=${{package.full-version}}
        - chainguard-baselayout
        - merged-lib
        - systemd-boot-installed
        - wolfi-baselayout
      provides:
        - ${{package.name}}-boot-configuration=${{package.full-version}}
    pipeline:
      - uses: kernel/boot-installed
        with:
          version-flavor: ${{vars.version-flavor}}
      - uses: kernel/dracut
        with:
          version-flavor: ${{vars.version-flavor}}
          kmoddir: ${{targets.destdir}}-modules/usr/lib/modules/${{vars.version-flavor}}
          output: ${{targets.subpkgdir}}/usr/lib/modules/${{vars.version-flavor}}/initramfs.img
      - runs: |
          kmodd=usr/lib/modules/${{vars.version-flavor}}
          mkdir -p "${{targets.subpkgdir}}/$kmodd"
          mv ${{targets.subpkgdir}}/boot/chainguard/${{vars.version-flavor}}/linux \
             "${{targets.subpkgdir}}/$kmodd/vmlinuz"
          rm -Rf ${{targets.subpkgdir}}/boot

test:
  pipeline:
    - uses: kernel/test/kconfig/systemd
    - uses: kernel/test/config-snippet
      with:
        snippet: ${{vars.flavor}}
        # Depends on CONFIG_X86
        aarch64_exclude: VIRTIO_PCI_ADMIN_LEGACY
    - name: Test Basic Boot
      uses: kernel/test/console_grep
      with:
        string: "Unable to mount root fs"
    - name: Test for XFS
      uses: kernel/test/console_grep
      with:
        string: "xfs"
    - name: Test for NVME
      uses: kernel/test/console_grep
      with:
        string: "nvme nvme0: pci function"
    - name: Test for ip6tables
      uses: kernel/test/console_grep
      with:
        string: "Segment Routing with IPv6"

update:
  enabled: true
  github:
    identifier: gregkh/linux
    use-tag: true
    strip-prefix: v
    tag-filter: v
  ignore-regex-patterns:
    # skip mainline (x.y) release tags, wait for stable (x.y.z) release tags
    - ^\d+[.]\d+$
  version-transform:
    # mainline release tag x.y to kernel version x.y.0
    - match: ^(\d+[.]\d+)$
      replace: $1.0
