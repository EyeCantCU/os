package:
  name: secretgen-controller
  version: "0.20.1"
  epoch: 1
  description: Kubernetes controller for generating secrets (certificates, passwords, RSA keys, SSH keys)
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/carvel-dev/secretgen-controller
      tag: v${{package.version}}
      expected-commit: 8af1ddf89d1ee89e0423427c8fc54b808cb3c33e

  - uses: go/build
    with:
      packages: ./cmd/controller
      output: secretgen-controller
      ldflags: |
        -X main.Version=v${{package.version}}
      vendor: true

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package with upstream image layout (executable placed at /)"
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"
          ln -sf usr/bin/secretgen-controller "${{targets.contextdir}}"/secretgen-controller
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  ignore-regex-patterns:
    - '.*-alpha.*'
    - '.*-beta.*'
    - '.*-rc.*'
  git:
    strip-prefix: v

test:
  environment:
    environment:
      KUBERNETES_SERVICE_HOST: "127.0.0.1"
      KUBERNETES_SERVICE_PORT: 32764
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: secretgen-controller
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - name: Install SecretGen CRDs and RBAC
      runs: |
        set -euo pipefail

        # Install CRDs
        kubectl apply -f https://github.com/carvel-dev/secretgen-controller/releases/download/v${{package.version}}/release.yml

        # Wait for CRDs to be established
        kubectl wait --for condition=established --timeout=60s crd/passwords.secretgen.k14s.io
        kubectl wait --for condition=established --timeout=60s crd/certificates.secretgen.k14s.io
        kubectl wait --for condition=established --timeout=60s crd/rsakeys.secretgen.k14s.io
        kubectl wait --for condition=established --timeout=60s crd/sshkeys.secretgen.k14s.io

        # Grant admin privileges to service account
        tee /tmp/rbac.yaml << 'EOF'
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: secretgen-controller-admin
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
        - kind: ServiceAccount
          name: default
          namespace: default
        EOF

        kubectl apply -f /tmp/rbac.yaml
    - name: Start secretgen-controller and run functional tests
      uses: test/daemon-check-output
      with:
        start: secretgen-controller --namespace default --metrics-bind-address :8080
        timeout: 60
        expected_output: |
          Starting Controller
        post: |
          #!/bin/sh -e
          wait-for-it -t 60 localhost:8080

          netstat -ln | grep 8080
          curl -sf http://localhost:8080/metrics | grep controller_runtime_reconcile_total

          cat > /tmp/password.yaml <<EOF
          apiVersion: secretgen.k14s.io/v1alpha1
          kind: Password
          metadata:
            name: test-password
            namespace: default
          spec:
            length: 32
            digits: 8
            uppercaseLetters: 8
            lowercaseLetters: 12
            symbols: 4
          EOF

          kubectl apply -f /tmp/password.yaml

          # Wait for secret to be created by controller
          kubectl wait --for=jsonpath='{.data.password}' --timeout=30s secret/test-password

          PASSWORD=$(kubectl get secret test-password -o jsonpath='{.data.password}' | base64 -d)
          test ${#PASSWORD} -eq 32

          cat > /tmp/ca-certificate.yaml <<EOF
          apiVersion: secretgen.k14s.io/v1alpha1
          kind: Certificate
          metadata:
            name: test-ca-cert
            namespace: default
          spec:
            isCA: true
          EOF

          kubectl apply -f /tmp/ca-certificate.yaml
          echo "Wating for CA certificate secret to be created..."
          sleep 3 # give some time for the controller to create the secret
          echo "Checking CA certificate secret data..."
          kubectl get secret test-ca-cert -o jsonpath='{.data.crt\.pem}'

          cat > /tmp/rsa-key.yaml <<EOF
          apiVersion: secretgen.k14s.io/v1alpha1
          kind: RSAKey
          metadata:
            name: test-rsa-key
            namespace: default
          spec: {}
          EOF

          kubectl apply -f /tmp/rsa-key.yaml
          echo "Wating for RSA key secret to be created..."
          sleep 3 # give some time for the controller to create the secret
          echo "Checking RSA key secret data..."
          kubectl get secret test-rsa-key -o jsonpath='{.data.key\.pem}'

          cat > /tmp/ssh-key.yaml <<EOF
          apiVersion: secretgen.k14s.io/v1alpha1
          kind: SSHKey
          metadata:
            name: test-ssh-key
            namespace: default
          spec: {}
          EOF

          kubectl apply -f /tmp/ssh-key.yaml
          echo "Wating for SSH key secret to be created..."
          sleep 3 # give some time for the controller to create the secret
          echo "Checking SSH key secret data..."
          kubectl get secret test-ssh-key -o jsonpath='{.data.ssh-privatekey}'

environment:
  contents:
    packages:
      - go-1.25
