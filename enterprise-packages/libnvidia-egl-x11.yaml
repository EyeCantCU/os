package:
  name: libnvidia-egl-x11
  version: 1.0.4
  epoch: 0
  description: NVIDIA EGL External Platform library for X11
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - eglexternalplatform
      - libdrm-dev
      - libx11-dev
      - libxcb-dev
      - mesa
      - mesa-dev
      - meson

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/egl-x11
      tag: v${{package.version}}
      expected-commit: d808ba433b4deb443f5d91062a6cf9c27f0272b3

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: NVIDIA/egl-x11
    use-tag: true
    strip-prefix: v
