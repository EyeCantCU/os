package:
  name: chart-sigstore-ctlog
  version: "0.2.66"
  epoch: 0
  description: Certificate Log
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sigstore/helm-charts
      tag: ctlog-${{package.version}}
      expected-commit: b612d56ae1758e0692932c8e39d0fd32d3c51037

  - uses: charts/package
    with:
      chart-path: charts/ctlog
      images: |
        ct-server:
          values:
            server:
              image:
                registry: ${registry}
                repository: ${repo}
                version: ${pseudo_tag}
        createtree:
          values:
            createtree:
              image:
                registry: ${registry}
                repository: ${repo}
                version: ${pseudo_tag}
        createctconfig:
          values:
            createctconfig:
              image:
                registry: ${registry}
                repository: ${repo}
                version: ${pseudo_tag}
        curl:
          values:
            createctconfig:
              initContainerImage:
                curl:
                  registry: ${registry}
                  repository: ${repo}
                  version: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [ct-server, createtree, createctconfig, curl]
          - name: without-createtree
            images: [ct-server, createctconfig, curl]
            values:
              createtree:
                enabled: false
          - name: without-createctconfig
            images: [ct-server, createtree]
            values:
              createctconfig:
                enabled: false

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: sigstore/helm-charts
    strip-prefix: ctlog-
    use-tag: true
    tag-filter-prefix: ctlog-
