# CVE-2025-22228: spring-security-crypto 6.1.4 -> 6.4.5
# The version is controlled by spring-security-crypto.version property in bom/pom.xml
# Version 6.4.4 fixes CVE-2025-22228 but has a known regression (spring-security#16802):
#   BCrypt timing attack mitigation broken, allowing username enumeration via response timing
# Version 6.4.5 fixes both CVE-2025-22228 AND the regression
# This will override any transitive dependencies pulling in older versions (like 6.1.4)
properties:
  - property: spring-security-crypto.version
    value: "6.4.5"