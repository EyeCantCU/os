package:
  name: goose-fips
  version: "3.26.0"
  epoch: 4 # CVE-2025-61732
  description: "Database migration tool supporting SQL migrations and Go functions (FIPS-enabled)"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - openssl-config-fipshardened
  resources:
    cpu: "2"
    memory: 7Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - openssl-config-fipshardened

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pressly/goose
      tag: v${{package.version}}
      expected-commit: 3d1474de3049db2e1ba64a4fe724917292ae7790

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: ./cmd/goose
      output: goose
      ldflags: -X main.version=${{package.version}}
      go-package: go-fips

  - uses: strip

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: goose
    - uses: test/tw/ver-check
      with:
        bins: goose
    - name: Test goose commands
      runs: |
        set -euo pipefail
        # Test create command (generates migration file)
        mkdir -p /tmp/migrations
        goose -dir /tmp/migrations create test_migration sql
        stat /tmp/migrations/*_test_migration.sql

        # Test status with sqlite
        goose -dir /tmp/migrations sqlite3 /tmp/test.db status

update:
  enabled: true
  github:
    identifier: pressly/goose
    strip-prefix: v
