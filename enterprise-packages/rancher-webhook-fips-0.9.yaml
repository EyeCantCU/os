package:
  name: rancher-webhook-fips-0.9
  version: "0.9.2"
  epoch: 0 # go/enterprise-rsc/rancher-webhook-fips-0.6
  description: Rancher webhook for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-webhook-fips=${{package.full-version}}
  resources:
    cpu: "2"
    memory: 9Gi

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 15aec1b1bc45a887c9721843cb8dc0f4913a0609
      repository: https://github.com/rancher/webhook
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: .

  - uses: go/build
    with:
      modroot: .
      output: webhook
      packages: .
      go-package: go-fips

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v0.9.

test:
  pipeline:
    - uses: test/go-fips-check
    - name: "start daemon"
      uses: test/daemon-check-output
      with:
        start: "webhook"
        timeout: 15
        expected_output: |
          starting
          Waiting for server to become available
