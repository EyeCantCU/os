package:
  name: rancher-webhook-fips-0.9
  version: "0.9.3"
  epoch: 1 # go/enterprise-rsc/rancher-webhook-fips-0.6
  description: Rancher webhook for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-webhook-fips=${{package.full-version}}
  resources:
    cpu: "2"
    memory: 9Gi

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9a35185635c22e9c1314d14d6d01996406ca7db7
      repository: https://github.com/rancher/webhook
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: .

  - uses: go/build
    with:
      modroot: .
      output: webhook
      packages: .
      go-package: go-fips

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v0.9.

test:
  pipeline:
    - uses: test/go-fips-check
    - name: "start daemon"
      uses: test/daemon-check-output
      with:
        start: "webhook"
        timeout: 15
        expected_output: |
          starting
          Waiting for server to become available

environment:
  contents:
    packages:
      - go-fips-1.25
