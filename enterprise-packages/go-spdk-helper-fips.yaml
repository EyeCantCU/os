package:
  name: go-spdk-helper-fips
  version: "0.5.0"
  epoch: 0 # CVE-2025-61732
  description: Helper functions for Storage Performance Development Kit (SPDK)
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - blockdev
      - device-mapper # For dmsetup
      - lsblk
      - nvme-cli # For NVMe device management
      - openssl-config-fipshardened
      - util-linux

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/longhorn/go-spdk-helper.git
      tag: v${{package.version}}
      expected-commit: faccf3d2233228e76fe54b2d19d628ea16b99b78

  - uses: go/build
    with:
      packages: .
      output: go-spdk-helper
      vendor: true
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: longhorn/go-spdk-helper
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: go-spdk-helper
    - uses: test/tw/ldd-check
    - runs: |
        go-spdk-helper dmsetup --help
        go-spdk-helper nvmecli --help
        go-spdk-helper bdev --help
        go-spdk-helper device --help
    - name: Sanity check to ensure all needed runtime dependencies are present
      runs: |
        command -v dmsetup
        command -v nvme
        command -v lsblk
        command -v blockdev
