package:
  name: syncthing-fips
  version: "2.0.15"
  epoch: 2
  description: "Open Source Continuous File Synchronization"
  copyright:
    - license: MPL-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/syncthing/syncthing
      tag: v${{package.version}}
      expected-commit: dc2a77ab8e5bd02cd14d67c54ca030c7f086d470

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.51.0

  - name: Apply patch
    uses: patch
    with:
      patches: |
        0001-tlsutil-choose-ECDSA-in-FIPS-mode-until-3.4-module.patch
        0002-rand-for-cryptographically-secure-operations-use-std.patch

  - runs: |
      go generate ./...

  - uses: go/build
    with:
      ldflags: |
        -X github.com/syncthing/syncthing/lib/build.Version=v${{package.version}}
      packages: ./cmd/syncthing
      output: syncthing
      go-package: go-fips-md5

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package for Docker entrypoint"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/bin"
          install -m755 script/docker-entrypoint.sh "${{targets.subpkgdir}}/usr/bin/entrypoint.sh"
    test:
      pipeline:
        - name: "Test"
          runs: |
            test -x /usr/bin/entrypoint.sh

update:
  enabled: true
  github:
    identifier: syncthing/syncthing
    strip-prefix: v
    use-tag: true
  ignore-regex-patterns:
    - "-rc"
    - "-beta"

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: syncthing
    - uses: test/tw/help-check
      with:
        bins: syncthing
    - name: "Test serve"
      uses: test/daemon-check-output
      with:
        setup: |
          set -euo pipefail
          syncthing generate
          syncthing paths
        start: syncthing serve
        timeout: 10
        expected_output: |
          TCP listener starting
          QUIC listener starting
        post: |
          set -euo pipefail
          wait-for-it 127.0.0.1:8384 -t 15
          curl -fsSL http://127.0.0.1:8384/ | grep -F 'syncthing'

environment:
  contents:
    packages:
      - go-fips-1.25
