package:
  name: chart-kyverno-reports-server
  version: "0.1.6"
  epoch: 0
  description: Reports Server for Kyverno - policy reports storage with PostgreSQL backend
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-postgresql
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kyverno/reports-server
      tag: reports-server-chart-${{package.version}}
      expected-commit: 49e03eecc1f19b88831e3e8eba537611bfcf0e6d

  # Relax the pinned postgresql version so vendor_deps can use the
  # iamguarded-postgresql APK (which is at a newer version).
  - runs: |
      yq -i '(.dependencies[] | select(.name == "postgresql")).version = ">=0.0.0"' charts/reports-server/Chart.yaml

  - uses: charts/package
    with:
      chart-path: charts/reports-server
      images: |
        reports-server:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${pseudo_tag}
        kubectl:
          values:
            apiServicesManagement:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${pseudo_tag}
      test: |
        ignore:
          - "docker.io/bitnamilegacy/postgresql:16.1.0-debian-11-r22"
        cases:
          - name: default
            images: [reports-server, kubectl]
          - name: no-api-services
            images: [reports-server]
            values:
              apiServicesManagement:
                enabled: false

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  ignore-regex-patterns:
    - "-rc"
  github:
    identifier: kyverno/reports-server
    strip-prefix: reports-server-chart-
    use-tag: true
    tag-filter-prefix: reports-server-chart-
