package:
  name: bank-vaults-fips
  version: 1.32.1
  epoch: 0
  description: A Vault swiss-army knife. A CLI tool to init, unseal and configure Vault (auth methods, secret engines).
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "5"
    memory: 10Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bank-vaults/bank-vaults
      tag: v${{package.version}}
      expected-commit: 5566b7805d1b39e3649eae975b26a0e73533a22b

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/bank-vaults
      output: bank-vaults
      go-package: go-fips

  - uses: strip

subpackages:
  - name: bank-vaults-template-fips
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: ./cmd/template
          output: template
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: ${{subpkg.name}}
        - runs: |
            template version
            template --help

update:
  enabled: true
  git:
    # There are some charts/ tags, ignore those.
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        bank-vaults --help
