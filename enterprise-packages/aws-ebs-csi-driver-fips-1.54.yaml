package:
  name: aws-ebs-csi-driver-fips-1.54
  version: "1.54.0"
  epoch: 4
  description: CSI driver for Amazon EBS.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - aws-ebs-csi-driver-fips=${{package.full-version}}
    runtime:
      - blkid
      - blockdev
      - ca-certificates
      - ca-certificates-bundle
      - e2fsprogs
      - e2fsprogs-extra
      - lsblk
      - merged-bin
      - mount
      - umount
      - util-linux
      - util-linux-misc
      - wolfi-baselayout
      - xfsprogs-5.10
  resources:
    cpu: "8"
    memory: 16Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - go-fips-1.25

pipeline:
  # We can't use go/install because this requires specific ldflags to set the version
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/aws-ebs-csi-driver
      tag: v${{package.version}}
      expected-commit: 1b4743722b806896c5871898550390fab058406f

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.40.0
      modroot: tests/e2e

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      packages: ./cmd
      ldflags: |
        -X github.com/kubernetes-sigs/aws-ebs-csi-driver/pkg/driver.driverVersion=${{package.version}}
        -X github.com/kubernetes-sigs/aws-ebs-csi-driver/pkg/cloud.driverVersion=${{package.version}}
        -X github.com/kubernetes-sigs/aws-ebs-csi-driver/pkg/driver.gitCommit=$(git rev-parse HEAD)
        -X github.com/kubernetes-sigs/aws-ebs-csi-driver/pkg/driver.buildDate=$(date -u -d "@${SOURCE_DATE_EPOCH:-$(date +%s)}" "+%Y-%m-%dT%H:%M:%SZ")
      output: aws-ebs-csi-driver
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/aws-ebs-csi-driver
    strip-prefix: v
    use-tag: true
    tag-filter: v1.54

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: aws-ebs-csi-driver
    - uses: test/tw/ver-check
      with:
        bins: aws-ebs-csi-driver
