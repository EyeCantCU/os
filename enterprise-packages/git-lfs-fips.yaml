package:
  name: git-lfs-fips
  version: "3.7.1"
  epoch: 4 # CVE-2025-68119
  description: "large file support for git"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - git
  scriptlets:
    post-install: |
      #!/bin/sh
      git-lfs install --skip-repo --system
    pre-deinstall: |
      #!/bin/sh
      git lfs uninstall --skip-repo --system

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/git-lfs/git-lfs
      tag: v${{package.version}}
      expected-commit: b84b33847fe6458f36ef521534dc0eac953cb379

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      ldflags: -X github.com/git-lfs/git-lfs/v3/config.GitCommit=$(git rev-parse --short HEAD)
      packages: .
      output: git-lfs
      go-package: go-fips

subpackages:
  - name: git-lfs-fips-config
    description: system wide git-lfs config
    dependencies:
      runtime:
        - git-lfs-fips
    pipeline:
      - runs: |
          ${{targets.destdir}}/usr/bin/git-lfs install --skip-repo --system
          mkdir -p ${{targets.subpkgdir}}/etc/
          cp /etc/gitconfig ${{targets.subpkgdir}}/etc/gitconfig

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        git-lfs --version
        git-lfs --help

update:
  enabled: true
  github:
    identifier: git-lfs/git-lfs
    tag-filter: v
    strip-prefix: v
