package:
  name: kubectx
  version: 0.9.5
  epoch: 0
  description: Faster way to switch between clusters and namespaces in kubectl
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ahmetb/kubectx
      tag: v${{package.version}}
      expected-commit: 92e5b5f43b94b06bc38b0fbde1ee51e00079c39c

  - uses: go/bump
    with:
      deps: |-
        k8s.io/client-go@v0.34.3

  - name: build kubectx
    uses: go/build
    with:
      packages: ./cmd/kubectx
      output: kubectx
      ldflags: -X main.version=${{package.version}}

  - name: build kubens
    uses: go/build
    with:
      packages: ./cmd/kubens
      output: kubens
      ldflags: -X main.version=${{package.version}}

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: kubectx kubens
    - uses: test/tw/ver-check
      with:
        bins: kubectx kubens

update:
  enabled: true
  github:
    identifier: ahmetb/kubectx
    strip-prefix: v
