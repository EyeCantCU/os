package:
  name: kubectx
  version: 0.9.5
  epoch: 2 # go/enterprise-rsc/kubectx
  description: Faster way to switch between clusters and namespaces in kubectl
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 4Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ahmetb/kubectx
      tag: v${{package.version}}
      expected-commit: 92e5b5f43b94b06bc38b0fbde1ee51e00079c39c

  - uses: go/bump
    with:
      deps: |-
        k8s.io/client-go@v0.34.3

  - name: build kubectx
    uses: go/build
    with:
      packages: ./cmd/kubectx
      output: kubectx
      ldflags: -X main.version=${{package.version}}

  - name: build kubens
    uses: go/build
    with:
      packages: ./cmd/kubens
      output: kubens
      ldflags: -X main.version=${{package.version}}

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: |
          kubectx
          kubens
    - uses: test/tw/ver-check
      with:
        bins: |
          kubectx
          kubens
    - name: Test kubectx can list contexts
      runs: |
        set -euo pipefail

        # Create a minimal kubeconfig with test contexts
        mkdir -p /tmp/.kube
        tee /tmp/.kube/config <<'EOF'
        apiVersion: v1
        kind: Config
        clusters:
        - cluster:
            server: https://test-cluster-1.example.com
          name: cluster-1
        - cluster:
            server: https://test-cluster-2.example.com
          name: cluster-2
        contexts:
        - context:
            cluster: cluster-1
            user: user-1
          name: context-1
        - context:
            cluster: cluster-2
            user: user-2
          name: context-2
        current-context: context-1
        users:
        - name: user-1
        - name: user-2
        EOF

        export KUBECONFIG=/tmp/.kube/config

        # Verify kubectx can list contexts from the kubeconfig (fails if contexts not found)
        output=$(kubectx 2>&1)

        # Check that both contexts are listed
        if echo "$output" | grep -F "context-1"; then
          echo "SUCCESS: Found context-1"
        else
          echo "FAIL: Expected 'context-1' in output"
          echo "Actual output: $output"
          exit 1
        fi

        if echo "$output" | grep -F "context-2"; then
          echo "SUCCESS: Found context-2"
        else
          echo "FAIL: Expected 'context-2' in output"
          echo "Actual output: $output"
          exit 1
        fi

        echo "SUCCESS: kubectx correctly lists contexts from kubeconfig"
    - name: Test kubens can read namespace from kubeconfig
      runs: |
        set -euo pipefail

        # Create a minimal kubeconfig with namespace configuration
        mkdir -p /tmp/.kube-ns
        tee /tmp/.kube-ns/config <<'EOF'
        apiVersion: v1
        kind: Config
        clusters:
        - cluster:
            server: https://test-cluster.example.com
          name: test-cluster
        contexts:
        - context:
            cluster: test-cluster
            user: test-user
            namespace: my-test-namespace
          name: test-context
        current-context: test-context
        users:
        - name: test-user
        EOF

        export KUBECONFIG=/tmp/.kube-ns/config

        # Verify kubens --current can read the namespace from kubeconfig (fails if not found)
        output=$(kubens --current 2>&1)

        if echo "$output" | grep -F "my-test-namespace"; then
          echo "SUCCESS: kubens correctly reads namespace from kubeconfig"
        else
          echo "FAIL: Expected 'my-test-namespace' in output"
          echo "Actual output: $output"
          exit 1
        fi

update:
  enabled: true
  github:
    identifier: ahmetb/kubectx
    strip-prefix: v
