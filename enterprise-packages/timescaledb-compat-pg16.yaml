#nolint:valid-pipeline-git-checkout-tag
package:
  name: timescaledb-compat-pg16
  version: "2.25.0"
  epoch: 0
  description: A time-series database for high-performance real-time analytics packaged as a Postgres extension.
  # Outside of the "tsl" directory, source code in a given file is licensed under the Apache License Version 2.0
  # We are only building the opensource bits here.
  copyright:
    - license: Apache-2.0
  dependencies:
    replaces:
      - postgresql-${{vars.pg-version}}-base # We are replacing the postgres config on this package
    runtime:
      - postgresql-${{vars.pg-version}}
      - postgresql-${{vars.pg-version}}-client
      - timescaledb-parallel-copy
      - timescaledb-tune

environment:
  contents:
    packages:
      - build-base
      - busybox
      - postgresql-${{vars.pg-version}}
      - postgresql-${{vars.pg-version}}-dev

vars:
  pg-version: 16

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/timescale/timescaledb
      tag: ${{package.version}}
      expected-commit: a686498674d7a6c3bc36bdf665d464e5f371bd25

  - uses: cmake/configure
    with:
      opts: |
        -DAPACHE_ONLY=ON \
        -DPG_CONFIG=/usr/bin/pg_config

  - uses: cmake/build

  - uses: cmake/install

  - runs: |
      # This is necessary so the default postgres config will load the timescaledb extension on startup
      sed -r "s/[#]*\s*(shared_preload_libraries)\s*=\s*'(.*)'/\1 = 'timescaledb,\2'/;s/,'/'/" /usr/share/postgresql${{vars.pg-version}}/postgresql.conf.sample | tee "${{targets.destdir}}/usr/share/postgresql${{vars.pg-version}}/postgresql.conf.sample"

subpackages:
  - name: timescaledb-oci-entrypoint-pg${{vars.pg-version}}
    description: "docker OCI entrypoint"
    dependencies:
      runtime:
        - bash
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/timescale/timescaledb-docker
          branch: main
          expected-commit: d6339b0f6f8cb0c41c4eb2087034557fda7fb2f1
      - runs: |
          # Necessary due to `sed` in postgres packages which moves this directory to `/var/lib/postgres/initdb` in the entrypoint script
          mkdir -p \
            "${{targets.contextdir}}/var/lib/postgres/initdb/" \
            "${{targets.contextdir}}/usr/local/bin" \
            "${{targets.contextdir}}/usr/share/postgresql${{vars.pg-version}}"
          ln -s /var/lib/postgres/initdb ${{targets.contextdir}}/docker-entrypoint-initdb.d
          install -Dpm0755 docker-entrypoint-initdb.d/* ${{targets.contextdir}}/var/lib/postgres/initdb/
          ln -s /usr/bin/timescaledb-tune ${{targets.contextdir}}/usr/local/bin/timescaledb-tune
    test:
      pipeline:
        - runs: |
            stat /docker-entrypoint-initdb.d/
            stat /var/lib/postgres/initdb/
            test -L /docker-entrypoint-initdb.d
            test -L /usr/local/bin/timescaledb-tune
            test "$(readlink /docker-entrypoint-initdb.d)" = "/var/lib/postgres/initdb"
            test "$(readlink /usr/local/bin/timescaledb-tune)" = "/usr/bin/timescaledb-tune"

test:
  environment:
    accounts:
      groups:
        - groupname: wolfi
          gid: 65532
      users:
        - username: wolfi
          gid: 65532
          uid: 65532
      run-as: 0
    contents:
      packages:
        - postgresql-${{vars.pg-version}}-client
        - shadow
        - sudo-rs
    environment:
      PGUSER: wolfi
  pipeline:
    - uses: test/tw/ldd-check
    - name: Check postgres version
      runs: |
        postgres --version | grep -F -e "${{vars.pg-version}}"
        psql --version | grep -F -e "${{vars.pg-version}}"
    - uses: test/tw/help-check
      with:
        bins: timescaledb-parallel-copy
    - name: Test CLI tools
      runs: timescaledb-tune --version
    - name: Check extension control file
      runs: |
        stat $(pg_config --sharedir)/extension/timescaledb.control
    - name: Create database and load extension
      runs: |
        TEST_DB="$(mktemp -d)"
        TMP_LOGFILE="$(mktemp)"
        chown -v wolfi:wolfi "${TEST_DB}" "${TMP_LOGFILE}"

        sudo -u "${PGUSER}" initdb -D "${TEST_DB}"
        sudo -u "${PGUSER}" pg_ctl -D "${TEST_DB}" -o "-c unix_socket_directories='/tmp'" -l "${TMP_LOGFILE}" start
        trap 'cat $TMP_LOGFILE' EXIT
        createdb -h /tmp testdb
        psql -h /tmp -d testdb -c "select * from pg_settings where name = 'shared_preload_libraries'" | grep -F -e "timescaledb"
        psql -h /tmp -d testdb -c "CREATE EXTENSION timescaledb;"
        psql -h /tmp -d testdb -c "CREATE DATABASE timescaledbtest;"
        psql -h /tmp -d testdb -c "CREATE TABLE conditions (time TIMESTAMPTZ NOT NULL, temp REAL NOT NULL);"
        psql -h /tmp -d testdb -c "SELECT create_hypertable('conditions', 'time');"
        psql -h /tmp -d testdb -c "INSERT INTO conditions (time, temp) VALUES (NOW(), 72.5), (NOW() - INTERVAL '1 hour', 71.8);"
        psql -h /tmp -d testdb -c "CREATE TABLE test_table (time TIMESTAMPTZ, value INT);"
        sudo -u "${PGUSER}" pg_ctl -D "${TEST_DB}" -m fast stop

update:
  enabled: true
  github:
    identifier: timescale/timescaledb
