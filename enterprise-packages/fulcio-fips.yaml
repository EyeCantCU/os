package:
  name: fulcio-fips
  version: "1.8.5"
  epoch: 2 # go/enterprise-rsc/fulcio-fips
  description: Sigstore OIDC PKI
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 11Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sigstore/fulcio
      tag: v${{package.version}}
      expected-commit: eaae2f2be56df9dea5f9b439ec81bedae4c0978d

  - uses: go/bump
    with:
      deps: |-
        github.com/sigstore/sigstore@v1.10.4

  - uses: go/build
    with:
      packages: ./
      modroot: .
      output: fulcio
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: sigstore/fulcio
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - name: Check Fulcio version
      runs: |
        # Check the Fulcio version
        fulcio version
    - name: Run fulcio server
      runs: |
        fulcio serve --ca=ephemeralca > out.log 2>&1 &
        echo "Sleep 2 seconds and try to retrieve root certificate"
        sleep 2
        curl localhost:8080/api/v1/rootCert
    - uses: test/go-fips-check
