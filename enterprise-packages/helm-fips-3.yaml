package:
  name: helm-fips-3
  version: "3.20.0"
  epoch: 1 # CVE-2025-61732
  description: The Kubernetes Package Manager
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - helm-fips=${{package.full-version}}
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/helm/helm
      tag: v${{package.version}}
      expected-commit: b2e4314fa0f229a1de7b4c981273f61d69ee5a59

  - runs: |
      make build CGO_ENABLED=1 LDFLAGS=-w TAGS=netgo,osusergo
      install -Dm755 ./bin/helm "${{targets.destdir}}/usr/bin/helm"

  - uses: strip

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - name: Setup Helm
      runs: |
        helm repo add stable https://charts.helm.sh/stable
        helm repo update
        helm --help
    - name: Verify Helm Version
      runs: |
        helm version | grep "version.BuildInfo" || exit 1
    - name: Search Helm Chart
      runs: |
        helm search repo nginx | grep "nginx" || exit 1
    - name: Helm Lint
      runs: |
        helm create lint-test
        helm lint lint-test || exit 1
        rm -rf lint-test
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: helm/helm
    strip-prefix: v
    tag-filter-prefix: v3
