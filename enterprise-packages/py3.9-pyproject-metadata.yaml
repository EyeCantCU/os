package:
  name: py3.9-pyproject-metadata
  version: "0.9.1"
  epoch: 0
  description: PEP 621 metadata parsing
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py3.9-packaging
      - python-3.9

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3.9-flit-core
      - py3.9-gpep517
      - py3.9-installer
      - py3.9-pip
      - py3.9-setuptools
      - python-3.9
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/pyproject-metadata
      tag: ${{package.version}}
      expected-commit: 81b1d0558c7165e09b717dcbccb6a3dc4f814887

  - runs: |
      python3.9 -m gpep517 build-wheel --wheel-dir dist --output-fd 1
      python3.9 -m installer -d "${{targets.destdir}}" dist/*.whl
      find ${{targets.destdir}} -name "*.pyc" -exec rm -rf '{}' +

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: pyproject_metadata

update:
  enabled: true
  ignore-regex-patterns:
    - a
    - b
    - rc
    - post
  github:
    identifier: pypa/pyproject-metadata
    use-tag: true
