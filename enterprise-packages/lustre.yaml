package:
  name: lustre
  version: 2.16.61
  epoch: 0
  description: "Lustre parallel distributed file system - userspace utilities"
  copyright:
    - license: GPL-2.0-only

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.(\d+)\.(\d+)$
    replace: "${1}_${2}_${3}"
    to: mangled-version

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - e2fsprogs-dev
      - flex
      - gawk
      - keyutils-dev
      - libaio-dev
      - libnl3-dev
      - libtool
      - linux-headers
      - openssl-dev
      - pkgconf-dev
      - readline-dev
      - util-linux-dev
      - yaml-dev
      - zlib-dev
  environment:
    # Use bash explicitly to avoid shell compatibility issues with busybox ash
    CONFIG_SHELL: /bin/bash

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/lustre/lustre-release
      tag: v${{vars.mangled-version}}
      expected-commit: d6849bca61e5dafc1cee0f38d0792e833a6fb823

  - runs: |
      bash autogen.sh

  # Add UAPI include paths since we're building userspace only (no kernel modules)
  # Also add libnl3 include path for netlink headers
  # Disable stringop-truncation warning that GCC 15 flags in strncpy usage
  - uses: autoconf/configure
    with:
      opts: |
        CPPFLAGS="-I$PWD/lnet/include/uapi -I$PWD/lustre/include/uapi -I/usr/include/libnl3" \
        CFLAGS="-Wno-stringop-truncation" \
        --bindir=/usr/bin \
        --sbindir=/usr/bin \
        --enable-dist \
        --enable-utils

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: lustre-dev
    description: Development files for Lustre
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - lustre
    test:
      pipeline:
        - uses: test/pkgconf

  - name: lustre-doc
    description: Documentation for Lustre
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: lustre/lustre-release
    strip-prefix: v
    tag-filter: v2_16_

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: "Verify lustre libraries exist"
      runs: |
        stat /usr/lib/liblustreapi.so.1
        stat /usr/lib/liblnetconfig.so.4
    - name: "Verify lustre survey utilities exist"
      runs: |
        stat /usr/bin/obdfilter-survey
        stat /usr/bin/ost-survey
