package:
  name: chart-kyverno-kyverno
  version: "3.6.2"
  epoch: 0
  description: Kubernetes Native Policy Management
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kyverno/kyverno
      tag: v1.16.2
      expected-commit: 2377cc562e43489b5e0927a492f96d26ed9c51d8

  # Fetch the openreports dependency chart - it's not committed to kyverno repo (gitignored)
  # and there's no git tag for v0.1.0 in the openreports repo
  - uses: fetch
    with:
      uri: https://openreports.github.io/reports-api/openreports-0.1.0.tgz
      expected-sha256: 3ad112726e16cb29253c9e2fabcd8f3e7113580d98e0b712a1e67f25d03ba2dd
      extract: false

  - runs: |
      # Extract the tgz and remove the repository field so vendor_deps doesn't rewrite it
      tar -xzf openreports-0.1.0.tgz -C charts/kyverno/charts/
      yq -i '(.dependencies[] | select(.name == "openreports")) |= del(.repository)' charts/kyverno/Chart.yaml

  - uses: charts/package
    with:
      chart-path: charts/kyverno
      images: |
        kyverno:
          values:
            admissionController:
              container:
                image:
                  registry: ${registry}
                  repository: ${repo}
                  tag: ${pseudo_tag}
        kyvernopre:
          values:
            admissionController:
              initContainer:
                image:
                  registry: ${registry}
                  repository: ${repo}
                  tag: ${pseudo_tag}
        background-controller:
          values:
            backgroundController:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${pseudo_tag}
        cleanup-controller:
          values:
            cleanupController:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${pseudo_tag}
        reports-controller:
          values:
            reportsController:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${pseudo_tag}
        kyverno-cli:
          values:
            crds:
              migration:
                image:
                  registry: ${registry}
                  repository: ${repo}
                  tag: ${pseudo_tag}
        kubectl:
          values:
            webhooksCleanup:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${pseudo_tag}
      test: |
        values:
          global:
            imagePullSecrets:
              - name: pull-secret
          openreports:
            installCrds: false
        cases:
          - name: default
            images: [kyverno, kyvernopre, background-controller, cleanup-controller, reports-controller, kyverno-cli, kubectl]
          - name: no-migration
            images: [kyverno, kyvernopre, background-controller, cleanup-controller, reports-controller, kubectl]
            values:
              crds:
                migration:
                  enabled: false
          - name: no-webhooks-cleanup
            images: [kyverno, kyvernopre, background-controller, cleanup-controller, reports-controller, kyverno-cli]
            values:
              webhooksCleanup:
                enabled: false

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  ignore-regex-patterns:
    - "-rc"
    - "-beta"
  github:
    identifier: kyverno/kyverno
    strip-prefix: v
    use-tag: true
