package:
  name: librechat
  version: "0.8.2"
  epoch: 5 # GHSA-3ppc-4f35-3m26
  description: "Multi-model AI chat interface supporting OpenAI, Anthropic, and other providers"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - busybox
      - ca-certificates-bundle
      - jemalloc
      - nodejs-${{vars.nodejs-version}}
      - npm
      - py3-pip
      - python3
      - sqlite-libs
      - uv
      - yarn

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - crane
      - jemalloc
      - jq
      - nodejs-${{vars.nodejs-version}}
      - npm
      - scanelf

vars:
  nodejs-version: "20"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/danny-avila/LibreChat
      tag: v${{package.version}}
      expected-commit: efbc088642afb69540efae9518b66e07760b23b7

  - runs: |
      npm pkg set overrides.fast-xml-parser=5.3.6
      npm pkg set dependencies.@aws-sdk/client-bedrock-runtime=3.980.0
      npm pkg set dependencies.@aws-sdk/client-s3=3.980.0
      npm pkg set dependencies.@azure/storage-blob=12.30.0
      npm pkg set dependencies.@librechat/agents=3.1.50
      npm pkg set dependencies.webpack=5.104.1
      npm pkg set dependencies.langsmith=0.4.6
      npm pkg set dependencies.axios=1.13.5
      npm pkg set overrides.axios=1.13.5

  - name: Bump vite to 6.4.1 in root package.json to remediate GHSA-93m4-6634-74q7
    runs: |
      npm pkg set devDependencies.vite=6.4.1
      npm install @smithy/signature-v4 @smithy/protocol-http @smithy/eventstream-codec

  - name: Bump nodemailer to 7.0.11 in api/package.json to remediate GHSA-rcmh-qjqh-p98v
    runs: |
      cd api
      npm pkg set dependencies.nodemailer=7.0.11

  - name: Bump langchain/core to 0.3.80 in api/package.json to remediate GHSA-r399-636x-v7f6
    runs: |
      cd api
      npm pkg set dependencies.@langchain/core=0.3.80

  - name: Bump jws to remediate GHSA-869p-cjfg-cm3x
    runs: |
      # jws is a transistive dependency of jsonwebtoken, so we need to update both
      npm pkg set --workspace api --workspace packages/data-schemas --workspace packages/api dependencies.jsonwebtoken=9.0.3
      npm pkg set --workspace api dependencies.jws=4.0.1

  - name: Remediate modelcontextprotocol CVEs
    runs: |
      cd api
      npm pkg set dependencies.@modelcontextprotocol/sdk=1.26.0
      cd ../packages/api
      npm pkg set peerDependencies.@modelcontextprotocol/sdk=1.26.0

  - name: Bump @smithy/config-resolver to remediate GHSA-6475-r3vj-m8vf
    runs: |
      cd api
      npm pkg set dependencies.@smithy/config-resolver=4.4.0

  - name: Bump diff to remediate GHSA-73rr-hh4g-fpgx
    runs: |
      npm pkg set overrides.diff=8.0.3
      jq '.dependencies.diff = "8.0.3"' packages/api/package.json > packages/api/package.json.tmp
      mv packages/api/package.json.tmp packages/api/package.json

  - name: Bump undici to remediate GHSA-g9mf-h72j-4rw9
    runs: |
      npm pkg set overrides.undici=7.18.2
      jq '.dependencies.undici = "7.18.2"' api/package.json > api/package.json.tmp
      mv api/package.json.tmp api/package.json

  - name: Bump lodash to remediate GHSA-xxjr-mmjv-4gpg
    runs: |
      npm pkg set overrides.lodash=4.17.23
      npm pkg set dependencies.lodash-es=4.17.23
      npm pkg set dependencies.mermaid=11.12.3

  - name: Bump @isaacs/brace-expansion to remediate GHSA-7h2j-956f-4vf2
    runs: |
      npm pkg set dependencies.@isaacs/brace-expansion=5.0.1

  - name: Bump ajv to remediate GHSA-2g4f-4pwh-qvx6
    runs: |
      # Bump top-level ajv@8 to 8.18.0
      npm pkg set dependencies.ajv=8.18.0
      # Fix eslint's bundled ajv@6 copies via nested npm overrides
      # (applies to all eslint/@eslint/eslintrc instances in the tree)
      npm pkg set 'overrides.eslint.ajv=^6.14.0'
      npm pkg set 'overrides.@eslint/eslintrc.ajv=^6.14.0'

  - name: Bump minimatch to remediate GHSA-3ppc-4f35-3m26
    runs: |
      # Override root-level minimatch@3.x to 3.1.3 (used by eslint, jake, nodemon, etc.)
      npm pkg set overrides.minimatch=3.1.3
      # @typescript-eslint/typescript-estree uses minimatch@9.x
      npm pkg set 'overrides.@typescript-eslint/typescript-estree.minimatch=9.0.6'
      # jest->glob, rimraf->glob use minimatch@9.x
      npm pkg set overrides.jest.glob.minimatch=9.0.6
      npm pkg set overrides.rimraf.glob.minimatch=9.0.6
      # test-exclude->glob, workbox-build->glob use minimatch@3.x
      npm pkg set 'overrides.test-exclude.glob.minimatch=3.1.3'
      npm pkg set 'overrides.workbox-build.glob.minimatch=3.1.3'

  - name: Rebuild the package-lock.json to incorporate any dependency changes during CVE remediation
    runs: |
      # Delete lock file to force regeneration with overrides and updated dependencies
      rm -f package-lock.json
      npm install

  - name: Install dependencies
    runs: |
      touch .env
      npm config set fetch-retry-maxtimeout 600000
      npm config set fetch-retries 5
      npm config set fetch-retry-mintimeout 15000
      npm ci --no-audit

  - name: Patch remaining minimatch instances for GHSA-3ppc-4f35-3m26
    runs: |
      # npm overrides with a root-level catch-all can prevent parent-specific
      # overrides from applying when the target version crosses major boundaries.
      # Directly patch the remaining vulnerable instances after install.
      fix_minimatch() {
        local pkg_dir="$1" target="$2"
        if [ -f "$pkg_dir/package.json" ]; then
          current=$(jq -r .version "$pkg_dir/package.json")
          echo "Updating minimatch in $pkg_dir from $current to $target"
          rm -rf "$pkg_dir"
          npm pack "minimatch@$target" --pack-destination /tmp
          mkdir -p "$pkg_dir"
          tar xzf "/tmp/minimatch-$target.tgz" -C "$pkg_dir" --strip-components=1
          rm "/tmp/minimatch-$target.tgz"
        fi
      }
      fix_minimatch node_modules/filelist/node_modules/minimatch 5.1.7
      fix_minimatch node_modules/glob/node_modules/minimatch 10.2.1
      fix_minimatch node_modules/sucrase/node_modules/minimatch 9.0.6

  - name: Patch MCP SDK to use express 5.2.1 which fixes body-parser CVE
    runs: |
      # @modelcontextprotocol/sdk depends on express@^5.0.1 which uses body-parser@^2.0.1
      # Express 5.2.1 requires body-parser@^2.2.1, fixing GHSA-wqch-xfxh-vrr4
      # Patch the SDK's package.json in node_modules to require express@^5.2.1
      MCP_PKG="node_modules/@modelcontextprotocol/sdk/package.json"
      if [ ! -f "$MCP_PKG" ]; then
        echo "ERROR: $MCP_PKG not found"
        exit 1
      fi

      echo "Patching $MCP_PKG to use express@^5.2.1"
      cat "$MCP_PKG" | jq '.dependencies.express = "^5.2.1"' > "${MCP_PKG}.tmp"
      mv "${MCP_PKG}.tmp" "$MCP_PKG"

      # Install express@5.2.1 (and body-parser@2.2.1) for MCP SDK
      cd node_modules/@modelcontextprotocol/sdk && npm install

  - name: Build frontend
    runs: |
      # Needs more old space or it runs out of memory when building
      NODE_OPTIONS="--max-old-space-size=4096" npm run frontend

  - name: npm cache clean
    runs: |
      npm cache clean --force

  - name: Install package contents
    runs: |
      mkdir -p ${{targets.destdir}}/app
      cp -r api client config packages redis-config ${{targets.destdir}}/app/
      cp -r node_modules ${{targets.destdir}}/app/
      cp package.json package-lock.json ${{targets.destdir}}/app/
      cp .env ${{targets.destdir}}/app/

      # Create necessary runtime directories
      mkdir -p ${{targets.destdir}}/app/client/public/images
      mkdir -p ${{targets.destdir}}/app/api/logs
      mkdir -p ${{targets.destdir}}/app/uploads

  - name: Cleanup musl libraries
    runs: |
      scanelf -R -n . | grep -i musl | awk '{print $NF}' | xargs rm -rf

  # Mitigate esbuild Vulnerabilities
  - runs: |
      rm -f ${{targets.destdir}}/app/node_modules/@esbuild/linux-*/bin/esbuild
      rm -f ${{targets.destdir}}/app/node_modules/esbuild/bin/esbuild
      rm -f ${{targets.destdir}}/app/node_modules/.bin/esbuild

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for ${{package.name}}
    pipeline:
      # The dockerfile doesn't mention it but the image has an entrypoint, "docker inspect librechat/librechat:latest | grep entrypoint"
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/local/bin"
          crane export node:${{vars.nodejs-version}}-alpine - | tar -xOf - usr/local/bin/docker-entrypoint.sh > docker-entrypoint.sh

          # Verify the SHA256 hash of the entrypoint script
          EXPECTED_SHA="a15ac9589c04baf9da95b08e0e79b5cf1d75ab8dc64e06a5e68e4ceb0ad7c8ea"
          ACTUAL_SHA=$(sha256sum docker-entrypoint.sh | awk '{print $1}')

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: docker-entrypoint.sh hash mismatch!"
            exit 1
          fi

          install -Dm755 docker-entrypoint.sh ${{targets.subpkgdir}}/usr/local/bin/docker-entrypoint.sh
    test:
      pipeline:
        - runs: |
            stat /usr/local/bin/docker-entrypoint.sh

  - name: ${{package.name}}-dev
    description: Development files for ${{package.name}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  environment:
    environment:
      MONGO_URI: "mongodb://127.0.0.1:27017/LibreChat"
      HOST: "0.0.0.0"
      PORT: "3080"
    contents:
      packages:
        - mongod
  pipeline:
    - name: Test backend with MongoDB
      working-directory: /app
      uses: test/daemon-check-output
      with:
        setup: |
          # Start MongoDB in background
          mkdir -p /tmp/mongodb
          mongod --dbpath /tmp/mongodb --port 27017 --bind_ip 127.0.0.1 > /tmp/mongodb.log 2>&1 &
          sleep 5
        start: npm run backend
        timeout: 30
        expected_output: |
          Connected to MongoDB

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v
