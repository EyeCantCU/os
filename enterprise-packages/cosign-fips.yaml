package:
  name: cosign-fips
  version: "3.0.4"
  epoch: 3 # GHSA-846p-jg2w-w324, GHSA-fphv-w9fq-2525
  description: Container Signing
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
  environment:
    CGO_ENABLED: "1"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6832fba4928c1ad69400235bbc41212de5006176
      repository: https://github.com/sigstore/cosign
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/sigstore/fulcio@v1.8.5
        github.com/sigstore/rekor@v1.5.0
        github.com/sigstore/sigstore@v1.10.4
        github.com/theupdateframework/go-tuf/v2@v2.4.1

  - uses: go/build
    with:
      packages: ./cmd/cosign
      output: cosign
      ldflags: |
        -X sigs.k8s.io/release-utils/version.gitVersion=v${{package.version}}
        -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/release-utils/version.gitTreeState=$(git diff --quiet && echo clean || echo dirty)
        -X sigs.k8s.io/release-utils/version.buildDate=$(date -d@${SOURCE_DATE_EPOCH} -u "+%Y-%m-%dT%H:%M:%SZ")
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: sigstore/cosign
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: cosign
    - uses: test/tw/help-check
      with:
        bins: cosign
    - name: Test keypair generation and blob signing
      runs: |
        set -euo pipefail
        # Generate a keypair for testing (using password 'test')
        export COSIGN_PASSWORD="test"
        cosign generate-key-pair

        # Verify keys were generated
        stat cosign.key
        stat cosign.pub

        # Create a test blob to sign
        echo "test data for signing" > /tmp/test-blob.txt

        # Sign the blob with the generated key (cosign v3 syntax)
        # The signature is now stored within the bundle file, not output to stdout
        cosign sign-blob /tmp/test-blob.txt --key cosign.key --bundle /tmp/test-blob.bundle

        # Verify bundle file was created
        stat /tmp/test-blob.bundle
        echo "SUCCESS: Generated keypair and signed blob"
    - name: Test blob signature verification
      runs: |
        set -euo pipefail
        # Verify the signature created in the previous step
        export COSIGN_PASSWORD="test"
        cosign verify-blob /tmp/test-blob.txt --key cosign.pub --bundle /tmp/test-blob.bundle

        # Test that verification fails with wrong content
        echo "modified content" > /tmp/modified-blob.txt
        if cosign verify-blob /tmp/modified-blob.txt --key cosign.pub --bundle /tmp/test-blob.bundle 2>/dev/null; then
          echo "FAIL: Verification should have failed for modified content"
          exit 1
        fi
        echo "SUCCESS: Signature verification works correctly"
    - name: Test attestation download and parsing
      runs: |
        set -euo pipefail
        cosign download attestation --platform=linux/amd64 \
        --predicate-type=https://spdx.dev/Document \
        chainguard/curl | jq -r .payload | base64 -d | jq .predicate
    - uses: test/go-fips-check
