package:
  name: valkey-ldap
  version: "1.0.0"
  epoch: 1 # GHSA-434x-w66g-qw3r
  description: An LDAP authentication module for Valkey
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - clang-21
      - openssl-dev
      - rust

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/valkey-io/valkey-ldap
      tag: ${{package.version}}
      expected-commit: ca367215194618242199d88f6890913a663dc36b

  - uses: rust/cargobump

  - runs: |
      cargo auditable build --release
      mkdir -p "${{targets.destdir}}"/usr/lib/valkey/
      install -m755 target/release/libvalkey_ldap.so "${{targets.destdir}}"/usr/lib/valkey/libvalkey_ldap.so

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - '-rc'
  github:
    identifier: valkey-io/valkey-ldap
    use-tag: true

test:
  environment:
    contents:
      packages:
        - valkey
        - valkey-cli
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test module loading and basic operations
      runs: |
        set -euo pipefail
        echo "=== Testing LDAP module with Valkey 9.0 ==="

        valkey-server valkey.conf &
        sleep 3

        valkey-cli PING | grep -F "PONG"

        valkey-cli MODULE LIST | grep -F "ldap"

        valkey-cli SET test_key "test_value" | grep -F "OK"
        valkey-cli GET test_key | grep -F "test_value"

        valkey-cli SHUTDOWN NOSAVE || true
