package:
  name: external-secrets-fips
  version: "2.0.1"
  epoch: 0
  description: Integrate external secret management systems with Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/external-secrets/external-secrets
      tag: v${{package.version}}
      expected-commit: 4ec4aeb22431ded515722f9dbd02767ebe2d6ea8

  - uses: go/build
    with:
      go-package: go-msft-1.25
      packages: .
      output: external-secrets

  - uses: strip

test:
  environment:
    contents:
      packages:
        - git
        - curl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/kwok/cluster
    - name: Fetch the testdata from the source repo
      runs: |
        set -euo pipefail
        git clone --depth=1 https://github.com/external-secrets/external-secrets
    - name: Run a simple test of the external secrets operator against the testdata
      uses: test/daemon-check-output
      with:
        setup: |
          set -euo pipefail
          kubectl apply --server-side=true -f external-secrets/deploy/crds/bundle.yaml
          kubectl wait --for=condition=Established crd --all --timeout=60s
        start: external-secrets
        expected_output: "Starting"
        post: |
          set -euo pipefail
          # Verify metrics endpoint is responding with secretstore metrics
          curl -sf localhost:8080/metrics | grep -F "secretstore"

update:
  enabled: true
  github:
    identifier: external-secrets/external-secrets
    strip-prefix: v
    tag-filter: v
