package:
  name: maxscale-22.08-fips
  version: "22.08.19"
  epoch: 0
  description: MariaDB MaxScale 22.08 - Advanced database proxy, router, and firewall (FIPS)
  copyright:
    - license: BUSL-1.1
  dependencies:
    runtime:
      - openssl-config-fipshardened
    provides:
      - maxscale-fips=${{package.full-version}}

environment:
  environment:
    CC: gcc-11
    CXX: g++-11
  contents:
    packages:
      - autoconf
      - automake
      - bison
      - boost-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake-3
      - curl-dev
      - cyrus-sasl-dev
      - flex
      - gcc-11
      - git
      - glibc-dev
      - gnutls-dev
      - hiredis-dev
      - icu-dev
      - jansson-dev
      - krb5-dev
      - libatomic_ops-dev
      - libmemcached-dev
      - libmicrohttpd-dev
      - libpq-17
      - librdkafka-dev
      - libssh-dev
      - libtool
      - libxml2-dev
      - linux-pam-dev
      - make
      - ncurses-dev
      - openssl-dev
      - pcre2-dev
      - perl
      - pkgconf
      - python3
      - sqlite-dev
      - systemd-dev
      - tcl
      - tcl-dev
      - unixodbc-dev
      - util-linux-dev
      - wget
      - xz-dev
      - zlib-dev
      - zstd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mariadb-corporation/MaxScale
      tag: maxscale-${{package.version}}
      expected-commit: 741a03925a13ce5c379f60ba508fd8ebbea05c7b
      recurse-submodules: true

  # Build flags as per upstream Dockerfile:
  # https://github.com/mariadb-corporation/MaxScale/blob/maxscale-22.08.19/Documentation/REST-API/templates/Dockerfile
  - uses: cmake/configure
    with:
      opts: |
        -G "Unix Makefiles" \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DBUNDLE=N \
        -DFORCE_BUNDLE=N \
        -DBUILD_BINLOG=N \
        -DBUILD_CDC=N \
        -DBUILD_GSSAPI=N \
        -DBUILD_GUI=N \
        -DBUILD_KAFKACDC=N \
        -DBUILD_LUAFILTER=N \
        -DBUILD_MAXCTRL=N \
        -DBUILD_MIRROR=N \
        -DBUILD_NOSQL=N \
        -DBUILD_QC_MYSQLEMBEDDED=N \
        -DBUILD_RABBITMQ=N \
        -DBUILD_STORAGE_MEMCACHED=N \
        -DBUILD_STORAGE_REDIS=N \
        -DBUILD_TESTS=N \
        -DBUILD_TOOLS=N \
        -DCMAKE_C_FLAGS="-Wno-stringop-overread"

  - runs: |
      cd output
      make -j$(nproc)

  - uses: cmake/install

  - uses: strip

update:
  enabled: true
  github:
    identifier: mariadb-corporation/MaxScale
    strip-prefix: maxscale-
    use-tag: true
    tag-filter: maxscale-22.08

test:
  environment:
    environment:
      REST_API_PORT: "8989"
    contents:
      packages:
        - curl
        - jq
        - scanelf
  pipeline:
    - name: Verify MaxScale installation
      runs: |
        set -euo pipefail
        stat /usr/bin/maxscale
    - uses: test/tw/ver-check
      with:
        bins: maxscale
    - uses: test/tw/help-check
      with:
        bins: maxscale
        help-flag: --help
    - name: Verify MaxScale library dependencies
      runs: |
        set -euo pipefail
        scanelf -n /usr/bin/maxscale | grep -F "libmaxscale-common.so"
    - uses: test/daemon-check-output
      with:
        setup: |
          adduser -D maxscale
          mkdir -p /var/lib/maxscale /var/run/maxscale /var/log/maxscale /var/cache/maxscale /etc/maxscale.modules.d /etc/maxscale.cnf.d
          chown -R maxscale:maxscale /var/lib/maxscale /var/run/maxscale /var/log/maxscale /var/cache/maxscale /etc/maxscale.modules.d /etc/maxscale.cnf.d
          tee /etc/maxscale.cnf << 'EOF'
          [maxscale]
          threads=1
          admin_host=127.0.0.1
          admin_port=8989
          admin_secure_gui=false
          EOF
        start: /usr/bin/maxscale --nodaemon --log=stdout --user=maxscale
        expected_output: |
          MaxScale started
          Started REST API on
          MaxScale started with 1 worker threads
        timeout: 30
        post: |-
          set -euo pipefail
          wait-for-it 127.0.0.1:${REST_API_PORT} -t 10
          # REST API returns JSON, verify with default credentials admin:mariadb
          curl -sf -u admin:mariadb http://127.0.0.1:${REST_API_PORT}/v1/maxscale | jq -e '.data.id == "maxscale"'
          # Check thread count matches config
          curl -sf -u admin:mariadb http://127.0.0.1:${REST_API_PORT}/v1/maxscale | jq -e '.data.attributes.parameters.threads == 1'
          # Verify no services configured, clean start
          curl -sf -u admin:mariadb http://127.0.0.1:${REST_API_PORT}/v1/services | jq -e '.data | length == 0'
    - name: Verify FIPS linkage
      runs: |-
        set -euo pipefail
        scanelf -n /usr/bin/maxscale | grep -F "libssl.so"
        scanelf -n /usr/bin/maxscale | grep -F "libcrypto.so"
