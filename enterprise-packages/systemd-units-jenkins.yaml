#nolint:valid-pipeline-git-checkout-tag
package:
  name: systemd-units-jenkins
  version: "2.176.1_git20251202"
  epoch: 0
  description: systemd units for jenkins
  copyright:
    - license: MIT
  # no runtime depends, as version streams do not provide jenkins
  options:
    # The /usr/bin/jenkins is a wrapper around war
    no-provides: true

environment:
  contents:
    packages:
      - busybox
      - python3
  environment:
    PORT: "8080"
    ARTIFACTNAME: "jenkins"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jenkinsci/packaging
      branch: master
      expected-commit: 3ee2adff699a982343359254351fba0ecfc259b8

  - uses: patch
    with:
      patches: |
        set-dirs.patch

  - runs: |
      ./bin/branding.py systemd
      mkdir -p ${{targets.contextdir}}/usr/lib/systemd/system/
      mkdir -p ${{targets.contextdir}}/usr/lib/sysusers.d/
      mkdir -p ${{targets.contextdir}}/usr/bin/
      install -Dm644 systemd/jenkins.service ${{targets.contextdir}}/usr/lib/systemd/system/
      install -Dm644 jenkins.sysusers ${{targets.contextdir}}/usr/lib/sysusers.d/jenkins.conf
      install -Dm755 systemd/jenkins.sh ${{targets.contextdir}}/usr/bin/jenkins

test:
  environment:
    contents:
      packages:
        - systemd
  pipeline:
    - runs: |
        systemd-sysusers
        [ -z "$(systemd-analyze verify jenkins.service 2>&1)" ]
        systemd-analyze --no-pager --offline=true security jenkins.service

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: Upstream does not really maintain tags or releases. There is a version tag from years ago but also updates to master since.
