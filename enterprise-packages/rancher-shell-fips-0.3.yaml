package:
  name: rancher-shell-fips-0.3
  description: kubectl and helm installer image for Rancher
  epoch: 4
  version: 0.3.1
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-shell-fips=${{package.full-version}}
    runtime:
      - bash
      - bash-completion
      - busybox
      - curl
      - gnutar
      - gzip
      - helm-fips
      - jq
      - k9s-fips
      - kubectl-bash-completion-fips-${{vars.kubectl-version}}
      - kubectl-fips-${{vars.kubectl-version}}
      - kubectl-fips-${{vars.kubectl-version}}-default
      - kustomize-fips
      - posix-libc-utils
      - vim

vars:
  kubectl-version: '1.30'

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rancher/shell.git
      expected-commit: 086deba03a557ff3dbece8281be2ce9535a68fc1
      tag: v${{package.version}}

  - runs: |
      # Ensure kubectl version is correct
      MK_KUBECTL_VERSION=$(grep "^KUBECTL_VERSION :=" ./hack/make/deps.mk | awk '{print $3}' | tr -d 'v')
      if [ ${MK_KUBECTL_VERSION#${{vars.kubectl-version}}} = $MK_KUBECTL_VERSION ]; then
        echo "kubectl version in Makefile doesn't match buildtime kubectl version!"
        echo "Found: $MK_KUBECTL_VERSION"
        echo "Expected: ${{vars.kubectl-version}}"
        exit 1
      fi

      # Create bashrc
      mkdir -p ${{targets.destdir}}/home/shell
      cat >> ${{targets.destdir}}/home/shell/.bashrc << 'EOF'
      . /etc/profile.d/bash_completion.sh
      alias k="kubectl"
      alias ks="kubectl -n kube-system"
      source <(kubectl completion bash)
      complete -o default -F __start_kubectl k
      LANG=en_US.UTF-8
      PS1="> "
      EOF

      # Install scripts
      install -Dm755 ./package/kustomize.sh ${{targets.destdir}}/home/shell/kustomize.sh
      install -Dm755 ./package/welcome ${{targets.destdir}}/usr/local/bin/welcome
      install -Dm755 ./package/helm-cmd ${{targets.destdir}}/usr/local/bin/helm-cmd

      # Symlink ../run to /var/run
      mkdir -p ${{targets.destdir}}/var
      ln -sf ../run ${{targets.destdir}}/var/run

test:
  pipeline:
    - name: Verify installed files exist
      runs: |
        set -euo pipefail
        # This test verifies all package-installed files are present.
        # Each stat command fails the test immediately if the file is missing.

        # Verify .bashrc config file was installed (fails test if missing)
        stat /home/shell/.bashrc

        # Verify kustomize.sh script was installed (fails test if missing)
        stat /home/shell/kustomize.sh

        # Verify helm-cmd script was installed (fails test if missing)
        stat /usr/local/bin/helm-cmd

        # Verify welcome script was installed (fails test if missing)
        stat /usr/local/bin/welcome
    - name: Verify executable permissions
      runs: |
        set -euo pipefail
        # This test verifies all installed scripts have executable permissions.
        # Each test -x check fails with a descriptive error if permission is missing.

        # Verify welcome script is executable (fails test if not executable)
        test -x /usr/local/bin/welcome || { echo "FAIL: /usr/local/bin/welcome is not executable"; exit 1; }

        # Verify helm-cmd script is executable (fails test if not executable)
        test -x /usr/local/bin/helm-cmd || { echo "FAIL: /usr/local/bin/helm-cmd is not executable"; exit 1; }

        # Verify kustomize.sh script is executable (fails test if not executable)
        test -x /home/shell/kustomize.sh || { echo "FAIL: /home/shell/kustomize.sh is not executable"; exit 1; }
    - name: Test welcome script execution
      runs: |
        set -euo pipefail
        # This test verifies the welcome script runs without errors.
        # The script execution fails the test if it crashes, errors, or returns non-zero.

        # Execute welcome script (fails test if script errors or crashes)
        /usr/local/bin/welcome
    - name: Validate helm-cmd script syntax
      runs: |
        set -euo pipefail
        # This test verifies helm-cmd has valid bash syntax.
        # bash -n parses without executing - fails test if syntax errors exist.

        # Validate helm-cmd script syntax (fails test if bash finds syntax errors)
        bash -n /usr/local/bin/helm-cmd
    - name: Validate bashrc syntax
      runs: |
        set -euo pipefail
        # This test verifies .bashrc has valid bash syntax.
        # bash -n parses without executing - fails test if syntax errors exist.

        # Validate .bashrc syntax (fails test if bash finds syntax errors)
        bash -n /home/shell/.bashrc

update:
  enabled: true
  ignore-regex-patterns:
    - .*-rc.*
  github:
    identifier: rancher/shell
    use-tag: true
    strip-prefix: v
    tag-filter: v0.3
