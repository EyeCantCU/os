package:
  name: py3-virt-firmware
  version: "26.2"
  epoch: 0 # go/enterprise-rsc/py3-virt-firmware
  description: This is a small collection of tools for edk2 firmware images
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "4"
    memory: 5Gi

environment:
  contents:
    packages:
      - py3-supported-build-base

vars:
  pypi-package: virt-firmware
  import: virt.firmware.efi

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/kraxel/virt-firmware
      tag: v${{package.version}}
      expected-commit: 615323ab8687a7497ff30b7d36e7d07393d67c07

  - uses: patch
    with:
      patches: fix-pkg-resources.patch

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-cryptography
        - py${{range.key}}-pefile
        - py${{range.key}}-setuptools
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
      - runs: |
          cp experimental/authenticode.py ${{targets.contextdir}}/usr/bin/authenticode
          sed '1s|python3|python${{range.key}}|' -i ${{targets.contextdir}}/usr/bin/authenticode
          chmod +x ${{targets.contextdir}}/usr/bin/authenticode
    test:
      environment:
        contents:
          packages:
            - py${{range.key}}-setuptools
      pipeline:
        - runs: |
            virt-fw-vars --help
            authenticode --help

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

test:
  pipeline:
    - uses: test/tw/emptypackage

update:
  enabled: true
  git:
    strip-prefix: v
