package:
  name: chart-kubernetes-sigs-aws-efs-csi-driver
  version: "3.4.0"
  epoch: 0
  description: A Helm chart for AWS EFS CSI Driver
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/aws-efs-csi-driver
      tag: helm-chart-aws-efs-csi-driver-${{package.version}}
      expected-commit: a5cd66f1f8d32561432e88f7fe4bde0e775af915

  - uses: charts/package
    with:
      chart-path: charts/aws-efs-csi-driver
      images: |
        aws-efs-csi-driver:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
        livenessprobe:
          values:
            sidecars:
              livenessProbe:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        node-driver-registrar:
          values:
            sidecars:
              nodeDriverRegistrar:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        csi-provisioner:
          values:
            sidecars:
              csiProvisioner:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [aws-efs-csi-driver, livenessprobe, node-driver-registrar, csi-provisioner]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/aws-efs-csi-driver
    strip-prefix: helm-chart-aws-efs-csi-driver-
    use-tag: true
    tag-filter-prefix: helm-chart-aws-efs-csi-driver-
