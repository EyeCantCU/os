package:
  name: chart-cockroachdb-cockroachdb
  version: "19.0.5"
  epoch: 0
  description: CockroachDB is a scalable, survivable, strongly-consistent SQL database.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: de0d25aa58ec6eab1a9c9836afe622ef4e7689f9
      repository: https://github.com/cockroachdb/helm-charts
      tag: v25.4.3-preview+2

  - uses: charts/package
    with:
      chart-path: cockroachdb
      images: |
        cockroachdb:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
        copy-certs:
          values:
            tls:
              copyCerts:
                image: ${ref}
        self-signer:
          values:
            tls:
              selfSigner:
                image:
                  registry: ${registry}
                  repository: ${repo}
                  tag: ${pseudo_tag}
        visus:
          values:
            visus:
              image:
                name: ${registry_repo}
                tag: ${pseudo_tag}
        operator-cockroachdb:
          values:
            operator:
              image:
                name: ${ref}
      test: |
        cases:
          - name: default
            images: [cockroachdb, copy-certs, self-signer]
          - name: with-visus
            images: [cockroachdb, copy-certs, self-signer, visus]
            values:
              visus:
                enabled: true
          - name: with-operator
            images: [self-signer, operator-cockroachdb]
            values:
              operator:
                enabled: true
          - name: tls-disabled
            images: [cockroachdb, self-signer]
            values:
              tls:
                enabled: false

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: false
  exclude-reason: >-
    Git tags follow CockroachDB database versions (v25.4.x), not chart versions (19.x). No tag pattern maps to chart version. Chart is published to https://charts.cockroachdb.com/ with proper chart versions. Chart.yaml is generated from build/templates/cockroachdb/Chart.yaml. To update manually: check helm search repo cockroachdb --versions, find the new chart version, then search git log for the "release: advance to vX.Y.Z" commit whose Chart.yaml has the matching chart version.
