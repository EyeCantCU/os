package:
  name: chart-kubernetes-sigs-azurefile-csi-driver
  version: "1.35.0"
  epoch: 0
  description: Azure File Container Storage Interface (CSI) Storage Plugin
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/azurefile-csi-driver
      tag: v${{package.version}}
      expected-commit: 5cc0239576e05b33ac052bf26f39fa1716e34ff4

  - uses: charts/package
    with:
      chart-path: charts/latest/azurefile-csi-driver
      images: |
        azurefile-csi:
          values:
            image:
              azurefile:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        csi-provisioner:
          values:
            image:
              csiProvisioner:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        csi-resizer:
          values:
            image:
              csiResizer:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        livenessprobe:
          values:
            image:
              livenessProbe:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        csi-node-driver-registrar:
          values:
            image:
              nodeDriverRegistrar:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        csi-snapshotter:
          values:
            snapshot:
              image:
                csiSnapshotter:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        snapshot-controller:
          values:
            snapshot:
              image:
                csiSnapshotController:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
      test: |
        values:
          # Disable Windows nodes to avoid hardcoded -windows-hp tag suffix images
          windows:
            enabled: false
          imagePullSecrets:
            - name: my-pull-secret
        ignore:
          - "v0.0.0@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
          - "index.docker.io/library/v0.0.0@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
        cases:
          - name: default
            images: [azurefile-csi, csi-provisioner, csi-resizer, livenessprobe, csi-node-driver-registrar, csi-snapshotter]
          - name: with-snapshot-controller
            images: [azurefile-csi, csi-provisioner, csi-resizer, livenessprobe, csi-node-driver-registrar, csi-snapshotter, snapshot-controller]
            values:
              snapshot:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/azurefile-csi-driver
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
