package:
  name: chart-fluent-fluentd
  version: "0.5.3"
  epoch: 0
  description: A Helm chart for Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fluent/helm-charts
      tag: fluentd-${{package.version}}
      expected-commit: 375d371bae9f49044344efbfcf2cc93bbeb98509

  - uses: charts/package
    with:
      chart-path: charts/fluentd
      images: |
        fluentd-kubernetes-daemonset:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [fluentd-kubernetes-daemonset]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: fluent/helm-charts
    strip-prefix: fluentd-
    use-tag: true
    tag-filter-prefix: fluentd-
