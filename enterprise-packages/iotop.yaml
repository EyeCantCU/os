package:
  name: iotop
  version: "1.31"
  epoch: 1 # go/enterprise-rsc/iotop
  description: A top utility for IO
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ncurses-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Tomas-M/iotop
      tag: v${{package.version}}
      expected-commit: 57890d671ba69ebc4a619a1cfe7d76cdd3d836a8

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: mv ${{targets.destdir}}/usr/sbin ${{targets.destdir}}/usr/bin

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    description: "${{package.name}} manpages"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: Tomas-M/iotop
    strip-prefix: v

test:
  pipeline:
    - runs: iotop --help
    - uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
