package:
  name: py3-google-cloud-pubsub
  version: "2.34.0"
  epoch: 1 # go/enterprise-rsc/py3-google-cloud-pubsub
  description: Google Cloud Pub/Sub API client library
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 5Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-wheel

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

vars:
  pypi-package: google-cloud-pubsub

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/googleapis/python-pubsub
      tag: v${{package.version}}
      expected-commit: 171f7d41cc749114c8e1ab9f618d1cb4ca8c0ac0

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-opentelemetry-sdk
        - py${{range.key}}-opentelemetry-api
        - py${{range.key}}-google-api-core
        - py${{range.key}}-google-cloud-core
        - py${{range.key}}-grpc-google-iam-v1
        - py${{range.key}}-grpcio
        - py${{range.key}}-grpcio-status
        - py${{range.key}}-proto-plus
        - py${{range.key}}-protobuf
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              from google.cloud import pubsub_v1

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: googleapis/python-pubsub
    strip-prefix: v
    use-tag: true
