#nolint:valid-spdx-license
package:
  name: databricks-cli-fips
  version: "0.290.1"
  epoch: 0 # CVE-2025-47907
  description: Databricks CLI for interacting with Databricks services
  copyright:
    - license: Databricks

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/databricks/cli
      tag: v${{package.version}}
      expected-commit: 0af5564a7d6155328404ff20fbaf6901f85b43cf

  - uses: go/build
    with:
      packages: .
      ldflags: |
        -X github.com/databricks/cli/internal/build.buildProjectName=databricks
        -X github.com/databricks/cli/internal/build.buildVersion=${{package.version}}
        -X github.com/databricks/cli/internal/build.buildBranch=$(git rev-parse --abbrev-ref HEAD)
        -X "github.com/databricks/cli/internal/build.buildTimestamp=$(date -u -d "@${SOURCE_DATE_EPOCH:-$(date +%s)}" +%s)"
      output: databricks
      go-package: go-fips

update:
  enabled: true
  # Github backend cannot be used as the databricks org has our CI on their IP block list :(
  git:
    strip-prefix: v
  ignore-regex-patterns:
    - snapshot # Invalid tag

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility package for databricks CLI
    dependencies:
      runtime:
        - ${{package.name}}
        - terraform-fips
        - terraform-provider-databricks-fips
        - terraform-provider-databricks-fips-cli-compat
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/app/bin
          ln -s /usr/bin/databricks ${{targets.contextdir}}/app/databricks
          ln -s /usr/bin/terraform ${{targets.contextdir}}/app/bin/terraform

          mkdir -p ${{targets.contextdir}}/app/config
          cp docker/config.tfrc ${{targets.contextdir}}/app/config/
    test:
      environment:
        environment:
          DATABRICKS_TF_CLI_CONFIG_FILE: /app/config/config.tfrc
          DATABRICKS_TF_EXEC_PATH: /app/bin/terraform
      pipeline:
        - uses: test/go-fips-check
        - runs: |
            set -euo pipefail
            export PATH="/app:$PATH"

            # Verify databricks symlink is accessible via /app path (fails test if missing)
            which databricks | grep -F /app/databricks

            # Verify databricks symlink exists and is executable (functional test of compat package)
            stat /app/databricks
            test -x /app/databricks || { echo "FAIL: /app/databricks is not executable"; exit 1; }

            # Verify terraform symlink exists and is executable
            stat /app/bin/terraform
            test -x /app/bin/terraform || { echo "FAIL: /app/bin/terraform is not executable"; exit 1; }

            # Test terraform symlink works with functional initialization
            /app/bin/terraform init

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: databricks
    - uses: test/tw/help-check
      with:
        bins: databricks
