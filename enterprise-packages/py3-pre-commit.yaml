package:
  name: py3-pre-commit
  version: "4.5.1"
  epoch: 1
  description: A framework for managing and maintaining multi-language pre-commit hooks.
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - py3-supported-build-base

vars:
  pypi-package: pre-commit
  import: pre_commit

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pre-commit/pre-commit
      tag: v${{package.version}}
      expected-commit: 8a0630ca1aa7f6d5665effe674ebe2022af17919

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-cfgv
        - py${{range.key}}-identify
        - py${{range.key}}-nodeenv
        - py${{range.key}}-pyyaml
        - py${{range.key}}-virtualenv
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            pre-commit --version | grep -F "${{package.version}}" || {
              echo "FAIL: pre-commit --version did not contain '${{package.version}}'";
              exit 1;
            }
            pre-commit --help || {
              echo "FAIL: pre-commit --help exited non-zero [$?]"
            }

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/emptypackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: pre-commit/pre-commit
    strip-prefix: v
