package:
  name: velero-plugin-for-microsoft-azure-fips
  version: "1.14.0"
  epoch: 0
  description: Plugins to support Velero on microsoft-azure
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "5"
    memory: 9Gi

pipeline:
  - uses: git-checkout
    with:
      tag: v${{package.version}}
      expected-commit: 9d3a12ea45d517c10cc2636e76e930cc971f6abe
      repository: https://github.com/vmware-tanzu/velero-plugin-for-microsoft-azure

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./velero-plugin-for-microsoft-azure
      output: velero-plugin-for-microsoft-azure

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./hack/cp-plugin
      output: cp-plugin

update:
  enabled: true
  github:
    identifier: vmware-tanzu/velero-plugin-for-microsoft-azure
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: |-
          velero-plugin-for-microsoft-azure
          cp-plugin

environment:
  contents:
    packages:
      - go-fips-1.25
