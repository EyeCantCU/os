package:
  name: colord-gtk
  version: 0.3.1
  epoch: 0
  description: GTK support library for colord
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - colord-dev
      - glib-dev
      - gtk-3-dev
      - lcms2-dev
      - meson

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hughsie/colord-gtk
      tag: ${{package.version}}
      expected-commit: b5a0ca3c512277842011757d9ce2efbfd6a8d888

  - uses: meson/configure
    with:
      opts: |
        -Dgtk2=false \
        -Dgtk4=false \
        -Dvapi=false \
        -Dtests=false \
        -Dman=false \
        -Ddocs=false \
        -Dintrospection=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      environment:
        contents:
          packages:
            - colord-dev
            - gtk-3-dev
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-lang
    pipeline:
      - uses: split/locales

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify colord-gtk library
      runs: |
        set -euo pipefail
        stat /usr/lib/libcolord-gtk.so*
        echo "colord-gtk library test passed"

update:
  enabled: true
  ignore-regex-patterns:
    - "COLORD"
  github:
    identifier: hughsie/colord-gtk
    use-tag: true
