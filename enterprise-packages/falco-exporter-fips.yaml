package:
  name: falco-exporter-fips
  version: 0.8.7
  epoch: 14 # CVE-2025-68121
  description: Prometheus Metrics Exporter for Falco output events
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 573cccb096fab90874747607522e30f7b09cb4b1
      repository: https://github.com/falcosecurity/falco-exporter
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/falco-exporter
      output: falco-exporter

update:
  enabled: true
  github:
    identifier: falcosecurity/falco-exporter
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: falco-exporter
    - name: "start daemon"
      uses: test/daemon-check-output
      with:
        start: falco-exporter
        timeout: 60
        setup: ""
        expected_output: |
          listening on
        post: |-
          set -euo pipefail
          response=$(curl -sf localhost:9376/metrics)
          if echo "$response" | grep -F 'promhttp_metric_handler_requests_total'; then
            echo "SUCCESS: Found expected metric"
          else
            echo "FAIL: expected metric 'promhttp_metric_handler_requests_total' not found"
            echo "Response: $response"
            exit 1
          fi
