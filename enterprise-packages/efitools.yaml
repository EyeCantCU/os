#nolint:valid-pipeline-git-checkout-tag
package:
  name: efitools
  version: "1.9.2.3.6"
  epoch: 2 # go/enterprise-rsc/efitools
  description: useful tools for manipulating UEFI secure boot platforms
  copyright:
    - license: GPL-2.0-or-later
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gnu-efi
      - help2man
      - openssl
      - openssl-dev
      - vim

pipeline:
  - uses: git-checkout
    with:
      # Currently there is no good upstream for this, likely need to
      # create a new upstream location for it
      repository: https://git.launchpad.net/ubuntu/+source/efitools
      branch: applied/debian/sid
      expected-commit: 8a3323bfbcab1107401c6c6584b1a415c26ec415

  - name: Inlined patches, that should be upstreamed
    runs: |
      # We don't have perl modules, but we do have vim
      sed -i 's|./xxdi.pl|xxd -i|' -i Make.rules Makefile
      # We don't yet have sbsign, and don't need it yet
      sed -i 's|sbsign|-sbsign|' -i Make.rules
      # Other patches already define XOPEN_SOURCE
      sed -i '/XOPEN_SOURCE/d' -i cert-to-efi-hash-list.c

  - uses: autoconf/make

  - uses: autoconf/make-install
    with:
      opts: PREFIX=/usr

  - runs: |
      rm -rf ${{targets.destdir}}/usr/share/efitools

  - uses: strip

subpackages:
  - name: "${{package.name}}-doc"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: false
  exclude-reason: |
    This package is distro patched in every distro and likely needs a new home

test:
  pipeline:
    - uses: test/tw/contains-files
      with:
        files: |
          /usr/bin/cert-to-efi-hash-list
          /usr/bin/cert-to-efi-sig-list
          /usr/bin/efi-readvar
          /usr/bin/efi-updatevar
          /usr/bin/efitool-mkusb
          /usr/bin/flash-var
          /usr/bin/hash-to-efi-sig-list
          /usr/bin/sig-list-to-certs
          /usr/bin/sign-efi-sig-list
