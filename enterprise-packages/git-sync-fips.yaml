package:
  name: git-sync-fips
  version: "4.5.1"
  epoch: 3 # CVE-2025-61732
  description: A sidecar app which clones a git repo and keeps it in sync with the upstream.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - git
      - openssh-client

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/git-sync
      tag: v${{package.version}}
      expected-commit: 3845a49729d0ae37b154bd6f78c0e53f03a04fa8

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      ldflags: |
        -X k8s.io/git-sync/pkg/version.VERSION=${{package.version}}
      output: git-sync

update:
  enabled: true
  github:
    identifier: kubernetes/git-sync
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: git-sync
    - uses: test/tw/help-check
      with:
        bins: git-sync
    - name: one time syncing
      runs: |
        set -euo pipefail
        git-sync --repo=https://github.com/kubernetes/git-sync --root=/tmp/git/root --one-time
