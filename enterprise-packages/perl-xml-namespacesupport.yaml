package:
  name: perl-xml-namespacesupport
  version: "1.12"
  epoch: 0
  description: Generic namespace helpers (ported from SAX2)
  copyright:
    - license: GPL-1.0-or-later
  dependencies:
    runtime:
      - perl

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PE/PERIGRIN/XML-NamespaceSupport-${{package.version}}.tar.gz
      expected-sha256: 47e995859f8dd0413aa3f22d350c4a62da652e854267aa0586ae544ae2bae5ef

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 3530

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Smoke test
      runs: echo "use XML::NamespaceSupport;" | perl
    - runs: |
        perl <<'EOF'
        use strict;
        use warnings;
        use XML::NamespaceSupport;

        # Test creating a namespace support object
        my $nsup = XML::NamespaceSupport->new();
        die "Failed to create XML::NamespaceSupport object" unless defined $nsup;
        print "Created XML::NamespaceSupport object\n";

        # Test declaring a namespace
        $nsup->declare_prefix('foo' => 'http://example.com/foo');
        my $uri = $nsup->get_uri('foo');
        die "Failed to get URI for prefix 'foo'" unless $uri eq 'http://example.com/foo';
        print "Namespace declaration works: foo => $uri\n";

        # Test getting declared prefixes
        my @prefixes = $nsup->get_prefixes();
        die "Should have at least one prefix" unless @prefixes;
        print "Found " . scalar(@prefixes) . " declared prefixes\n";

        print "XML::NamespaceSupport tests passed\n";
        EOF
