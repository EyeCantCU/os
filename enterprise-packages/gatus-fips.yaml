package:
  name: gatus-fips
  version: "5.35.0"
  epoch: 2
  description: Automated developer-oriented status page
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c4900ced6c44f3e8a3473eb0237c7b81b2195b72
      repository: https://github.com/TwiN/gatus.git
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/gofiber/fiber/v2@v2.52.12

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      output: gatus

  - runs: |
      mkdir -p ${{targets.contextdir}}/config
      cp ./config.yaml "${{targets.contextdir}}/config/"

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by gatus"
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"
          ln -sf /usr/bin/gatus "${{targets.contextdir}}/gatus"
    test:
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

update:
  enabled: true
  github:
    identifier: TwiN/gatus
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/daemon-check-output
      with:
        start: GATUS_CONFIG_PATH=./config.yaml gatus > /dev/null 2>&1 &
        expected_output: "Listening on 0.0.0.0:8080"

environment:
  contents:
    packages:
      - go-fips-1.25
