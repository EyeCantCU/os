package:
  name: py3-xgrammar-cuda-13.0
  version: "0.1.31"
  epoch: 1
  description: Efficient, Flexible and Portable Structured Generation
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

vars:
  pypi-package: xgrammar
  import: xgrammar

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - gcc
      - py3-supported-build-base-dev
      - py3-supported-nanobind
      - py3-supported-scikit-build-core
      - samurai
  environment:
    ## -Wno-cpp required to avoid:
    #  warning "<ciso646> is deprecated in C++17, use <version> to detect implementation-specific macros" subpackage=py3.10-xgrammar
    # last checked in in version 0.1.21
    ## -fno-lto required to avoid undiagnosed linking issues
    # last checked in in version 0.1.21
    CXXFLAGS: -Wno-cpp -fno-lto
    VERBOSE: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mlc-ai/xgrammar
      tag: v${{package.version}}
      expected-commit: aa44ded202fdaa2cb55f48deb31d17c9822a8a1f
      recurse-submodules: true

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-ninja
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-pydantic
        - py${{range.key}}-torch-cuda-${{vars.cuda-version}}
        - py${{range.key}}-transformers-4.56
        - py${{range.key}}-triton-cuda-${{vars.cuda-version}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: test/tw/ldd-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.11-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.12-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.13-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: mlc-ai/xgrammar
    tag-filter-prefix: v
    strip-prefix: v
