package:
  name: py3-celery
  version: "5.6.2"
  epoch: 0
  description: Distributed Task Queue
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: celery
  import: celery

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-python-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/celery/celery
      tag: v${{package.version}}
      expected-commit: 6a43c846f183ef0cbade24f4b9a8f7a6ea113b44

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    options:
      # prevent from auto-detecting celery commands to avoid conflicts
      # between different python versions (py3.10-celery vs py3.11-celery, etc.)
      no-provides: true
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-amqp
        - py${{range.key}}-billiard
        - py${{range.key}}-click
        - py${{range.key}}-click-didyoumean
        - py${{range.key}}-click-repl
        - py${{range.key}}-kombu
        - py${{range.key}}-python-dateutil
        - py${{range.key}}-pytz
        - py${{range.key}}-tblib
        - py${{range.key}}-typing-extensions
        - py${{range.key}}-tzlocal
        - py${{range.key}}-vine
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test Celery basic functionality
          runs: |
            python${{range.key}} <<-EOF
            from celery import Celery

            # Test creating a Celery app and defining a task
            app = Celery('test_app')

            @app.task
            def test_task():
                return 'hello world'

            # Test essential task methods exist
            assert hasattr(test_task, 'delay')
            assert hasattr(test_task, 'apply_async')
            assert hasattr(test_task, 'apply')
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: celery/celery
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/byproductpackage
