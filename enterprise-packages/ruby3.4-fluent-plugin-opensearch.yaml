package:
  name: ruby3.4-fluent-plugin-opensearch
  version: 1.1.5
  epoch: 0
  description: Opensearch output plugin for Fluent event collector
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ruby3.4-aws-sdk-core
      - ruby3.4-faraday
      - ruby3.4-faraday-excon
      - ruby3.4-faraday_middleware-aws-sigv4
      - ruby3.4-fluentd
      - ruby3.4-opensearch-ruby
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-3.4
      - ruby-3.4-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5bf8450f8127688c4f9b4b5caa588c9c16a04b93
      repository: https://github.com/fluent/fluent-plugin-opensearch
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: fluent-plugin-opensearch

update:
  enabled: true
  github:
    identifier: fluent/fluent-plugin-opensearch
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ruby3.4-fluentd
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: fluent/plugin/out_opensearch
    - runs: |
        ruby -e "require 'fluent/plugin/in_opensearch'"
        ruby -e "require 'fluent/plugin/out_opensearch'"
        ruby -e "require 'fluent/plugin/filter_opensearch_genid'"
        ruby -e "require 'fluent/plugin/opensearch_tls'"
        ruby -e "require 'fluent/plugin/output'"
    - name: Validate plugin loads in fluentd
      runs: |
        set -euo pipefail
        tee /tmp/test.conf <<'EOF'
        <source>
          @type forward
          port 24224
        </source>

        <filter **>
          @type opensearch_genid
        </filter>

        <match **>
          @type opensearch
          host localhost
          port 9200
        </match>
        EOF
        fluentd --dry-run -c /tmp/test.conf
