package:
  name: py3-python-dotenv
  version: "1.2.2"
  epoch: 0
  description: Read key-value pairs from .env file and set them as environment variables
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0

vars:
  import: dotenv
  pypi-package: python-dotenv

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/theskumar/python-dotenv
      tag: v${{package.version}}
      expected-commit: 36004e0e34be7665ff2b11a8a4005144f76f176d

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - name: Python Build
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: |
          # Remove CLI to avoid cmd:dotenv conflict when installing multiple Python versions
          rm -rf "${{targets.contextdir}}/usr/bin"
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  github:
    identifier: theskumar/python-dotenv
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/emptypackage
