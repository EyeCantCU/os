package:
  name: linux-jitterentropy-certified
  version: "1.0.0"
  epoch: 0
  description: Metapackage for jitterentropy certified ojects and patches.
  # This package doesn't do anything useful other than to provide a version stamp
  # for patches and objects for our jitterentropy patchset. This is the version of
  # that /patchset/ not the kernels, and it really only exists so that we have a
  # version we can submit for certification that is the jitterentropy version
  # indepedent of any kernel, whereas 6.X.Y-rZ is the platform identifier.
  #
  # This is all for the purpose of submitting multiple kernels under a single
  # entropy source submission. It serves no technical purpose.
  copyright:
    - license: GPL-2.0
  dependencies:
    runtime:
      - linux-jitterentropy-6.12=6.12.60-r3
      - linux-jitterentropy-6.18=6.18.0-r0

pipeline:
  - runs: |
      for i in 6.12 6.18; do
        mkdir -p ${{targets.destdir}}/usr/lib/linux-jitterentropy-"$i"/patches/
        for j in patches/"$i"/*-crypto-reusable-jitterentropy.patch; do
          cp "$j" ${{targets.destdir}}/usr/lib/linux-jitterentropy-"$i"/patches/
        done
      done

test:
  pipeline:
    - runs: |
        test -f /usr/lib/linux-jitterentropy-6.12/patches/0001-crypto-reusable-jitterentropy.patch
        test -f /usr/lib/linux-jitterentropy-6.18/patches/0001-crypto-reusable-jitterentropy.patch

update:
  enabled: false
  exclude-reason: |
    This is the upstream and it's a metapackage for things we control.
