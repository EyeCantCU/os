package:
  name: k8s-secret-sync
  version: "4.3.2"
  epoch: 0
  description: Two-way sync of JSON files to Kubernetes secret objects
  copyright:
    - license: BSD-3-Clause
    - license: Apache-2.0
  dependencies:
    runtime:
      - busybox # needed for the script
      - py${{vars.python-version}}-kubernetes
      - python-${{vars.python-version}}
      - tini

vars:
  python-version: 3.12

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jupyterhub/zero-to-jupyterhub-k8s.git
      tag: ${{package.version}}
      expected-commit: 9dba5197ea8cdb6bcc662fd037f57f0e73f2aa3e

  - runs: |
      install -Dm755 images/secret-sync/acme-secret-sync.py \
        "${{targets.destdir}}/usr/bin/acme-secret-sync.py"

update:
  enabled: true
  github:
    identifier: jupyterhub/zero-to-jupyterhub-k8s
    use-tag: true

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - runs: |
        set -euo pipefail

        # Verify script is installed and executable
        stat /usr/bin/acme-secret-sync.py
        test -x /usr/bin/acme-secret-sync.py

        # Test help output
        /usr/bin/acme-secret-sync.py --help

        # Test that kubernetes module is available
        python${{vars.python-version}} -c "import kubernetes; print('kubernetes module available')"
    - name: Validate Python version matches upstream
      runs: |
        set -euo pipefail

        # Fetch upstream Dockerfile
        curl --retry 3 -fsSL -o /tmp/Dockerfile \
          "https://raw.githubusercontent.com/jupyterhub/zero-to-jupyterhub-k8s/${{package.version}}/images/secret-sync/Dockerfile"

        # Extract Python version from upstream Dockerfile
        DOCKERFILE_PYTHON_VERSION=$(grep "^FROM python:" /tmp/Dockerfile | awk -F: '{print $2}' | awk -F- '{print $1}')
        echo "Upstream Dockerfile uses Python version: $DOCKERFILE_PYTHON_VERSION"

        # Validate it matches our build Python version
        if [ "$DOCKERFILE_PYTHON_VERSION" != ${{vars.python-version}} ]; then
          echo "ERROR: Upstream Dockerfile uses Python $DOCKERFILE_PYTHON_VERSION but we are building with Python ${{vars.python-version}}"
          echo "Please update the package dependencies to use python-$DOCKERFILE_PYTHON_VERSION and py$DOCKERFILE_PYTHON_VERSION-kubernetes"
          exit 1
        fi
