package:
  name: py3-opentelemetry-semantic-conventions
  version: 1.37.0
  epoch: 0
  description: OpenTelemetry Semantic Conventions
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3-supported-hatchling
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-wheel

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

vars:
  pypi-package: opentelemetry-semantic-conventions

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-python
      tag: v${{package.version}}
      expected-commit: bc413fcf74a380cf62428a130ead61ff1683494a

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-opentelemetry-api
        - py${{range.key}}-typing-extensions
        - py${{range.key}}-deprecated
    pipeline:
      - working-directory: opentelemetry-semantic-conventions
        pipeline:
          - uses: py/pip-build-install
            with:
              python: python${{range.key}}
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              from opentelemetry.semconv import trace
        - name: Test semantic conventions attributes
          runs: |
            python${{range.key}} <<'EOF'
            from opentelemetry.semconv.attributes import http_attributes
            from opentelemetry.semconv.attributes import service_attributes
            from opentelemetry.semconv.attributes import network_attributes

            # Verify attributes exist and are accessible
            assert hasattr(http_attributes, 'HTTP_REQUEST_METHOD')
            assert hasattr(service_attributes, 'SERVICE_NAME')
            assert hasattr(network_attributes, 'NETWORK_PROTOCOL_NAME')

            print("Semantic convention attributes: PASS")
            EOF
        - name: Test metrics conventions
          runs: |
            python${{range.key}} <<'EOF'
            from opentelemetry.semconv.metrics import http_metrics

            # Verify metrics conventions are accessible
            assert hasattr(http_metrics, 'HTTP_SERVER_REQUEST_DURATION')

            print("Metrics conventions: PASS")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-python
    strip-prefix: v
    use-tag: true
