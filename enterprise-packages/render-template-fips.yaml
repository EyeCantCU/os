package:
  name: render-template-fips
  version: "1.0.9"
  epoch: 7 # CVE-2025-61732
  description: CLI tool for rendering templates with custom data
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - go-fips-1.25

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bitnami/render-template
      tag: v${{package.version}}
      expected-commit: baedd2184462f293d1b07b2aadeb164374300f5d

  - uses: go/build
    with:
      packages: .
      go-package: go-fips
      output: render-template

update:
  enabled: true
  github:
    identifier: bitnami/render-template
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        set -euo pipefail
        echo 'hello {{who}}' > template.tpl
        render-template template.tpl | grep -F hello
        who=pikachu render-template template.tpl | grep -F pikachu
