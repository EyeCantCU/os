package:
  name: chart-mittwald-kubernetes-replicator
  version: "2.12.3"
  epoch: 0
  description: Controller for replicating secrets+configmaps across namespaces
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mittwald/kubernetes-replicator
      tag: v${{package.version}}
      expected-commit: b82f6224e27df05eaee1529e66795eb441a350fd

  # Upstream tags before bumping Chart.yaml version; patch to match the published chart.
  # Uncomment the tag field in values.yaml so chelm can validate the image path.
  - runs: |
      yq -i '.version = "${{package.version}}"' deploy/helm-chart/kubernetes-replicator/Chart.yaml
      yq -i '.appVersion = "v${{package.version}}"' deploy/helm-chart/kubernetes-replicator/Chart.yaml
      yq -i '.image.tag = ""' deploy/helm-chart/kubernetes-replicator/values.yaml

  - uses: charts/package
    with:
      chart-path: deploy/helm-chart/kubernetes-replicator
      images: |
        kubernetes-replicator:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [kubernetes-replicator]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: mittwald/kubernetes-replicator
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
