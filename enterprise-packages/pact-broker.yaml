package:
  name: pact-broker
  version: "2.118.0"
  epoch: 0
  description: The pact_broker gem - stores and shares consumer-driven contracts
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby-${{vars.ruby-version}}

vars:
  ruby-version: "3.3"
  gem: pact_broker

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-${{vars.ruby-version}}
      - ruby-${{vars.ruby-version}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pact-foundation/pact_broker
      tag: v${{package.version}}
      expected-commit: 695808da4e273e6c17a52b7fe4d7a7ab51bc003a

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - runs: |
      set -euo pipefail
      # The upstream gemspec reads .gitignore to compute file lists. Create an
      # empty one in the installed gem so bundler can parse the gemspec when
      # pact-broker-docker uses this gem as a path source.
      touch "${{targets.contextdir}}/usr/lib/ruby/gems/${{vars.ruby-version}}.0/gems/${{vars.gem}}-${{package.version}}/.gitignore"

  - uses: ruby/clean

update:
  enabled: true
  github:
    identifier: pact-foundation/pact_broker
    strip-prefix: v
    tag-filter: v2.

test:
  pipeline:
    # pact_broker cannot be required standalone - it has 24 runtime deps
    # (sequel, rack, nokogiri, etc.) that are bundled in pact-broker-docker.
    # This package provides the gem built from source for use as a path source.
    - runs: |
        set -euo pipefail
        GEM_DIR="/usr/lib/ruby/gems/${{vars.ruby-version}}.0/gems/pact_broker-${{package.version}}"

        # Verify the gem is installed
        gem list pact_broker | grep -F "pact_broker (${{package.version}})"

        # Verify key gem files exist
        stat "$GEM_DIR/lib/pact_broker.rb"
        stat "$GEM_DIR/lib/pact_broker/version.rb"
        stat "$GEM_DIR/.gitignore"

        # Verify gemspec is parseable (pact-broker-docker depends on this for path source)
        ruby -e "spec = Gem::Specification.load('$GEM_DIR/pact_broker.gemspec'); puts spec.name + ' ' + spec.version.to_s" | grep -F "pact_broker ${{package.version}}"

        # Verify version matches
        ruby -e "load '$GEM_DIR/lib/pact_broker/version.rb'; puts PactBroker::VERSION" | grep -F "${{package.version}}"
