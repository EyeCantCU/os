package:
  name: chart-iamguarded-jaeger
  version: 6.0.5
  epoch: 0
  description: Jaeger iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-cassandra
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: jaeger/${{package.version}}
      expected-commit: 8454623e8b2f57fd29f126a9ba670c9ca97b71f0

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: patch
    with:
      patches: values.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/jaeger

  - uses: charts/package
    with:
      chart-path: iamguarded/jaeger

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: jaeger/
    use-tag: true
    tag-filter-prefix: jaeger/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /jaeger
