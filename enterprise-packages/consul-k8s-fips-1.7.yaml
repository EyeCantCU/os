package:
  name: consul-k8s-fips-1.7
  version: "1.7.12"
  epoch: 0 # CVE-2025-68121
  description: The consul-k8s includes first-class integrations between Consul and Kubernetes.
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - go-discover-fips
    provides:
      - consul-k8s-fips=${{package.full-version}}
  resources:
    cpu: "10"
    memory: 12Gi

environment:
  contents:
    packages:
      - oldglibc~2.28

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/consul-k8s
      expected-commit: 1f65be0b9e2f342a854a597fbef21539cdc7041b
      tag: v${{package.version}}

  - uses: go/build
    with:
      go-package: go-fips
      modroot: ./control-plane/cni
      output: consul-cni
      packages: .

  - uses: go/build
    with:
      go-package: go-fips
      modroot: ./control-plane
      output: consul-k8s-control-plane
      packages: .

subpackages:
  - name: ${{package.name}}-cli
    description: "CLI for interacting with Consul on Kubernetes"
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          modroot: ./cli
          output: consul-k8s
          packages: .
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: ${{subpkg.name}}
        - uses: test/tw/ver-check
          with:
            bins: consul-k8s
        - uses: test/tw/help-check
          with:
            bins: consul-k8s

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.7.

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: |
          consul-cni
          consul-k8s-control-plane
    - uses: test/tw/help-check
      with:
        bins: |
          consul-cni
          consul-k8s-control-plane
