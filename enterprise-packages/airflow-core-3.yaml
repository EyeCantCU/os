package:
  name: airflow-core-3
  version: "3.1.6"
  epoch: 1
  description: Minimal Airflow core - Platform to programmatically author, schedule, and monitor workflows
  dependencies:
    runtime:
      - bash
      - busybox
      - curl
      - cyrus-sasl
      - findutils
      - glibc-locale-en
      - glibc-locales
      - gnupg-utils
      - gzip
      - mariadb
      - openssl
      - postgresql-client
      - python-${{vars.python-version}}
    provides:
      - airflow-core=${{package.full-version}}
  copyright:
    - license: Apache-2.0

vars:
  venv-home: '/home/airflow/.local'
  # Python support docs: https://airflow.apache.org/docs/apache-airflow/stable/installation/supported-versions.html
  python-version: '3.12'

environment:
  contents:
    packages:
      - busybox
      - curl
      - patch
      - python-${{vars.python-version}}
      - uv

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/airflow
      tag: ${{package.version}}
      expected-commit: d6a009b6dfa1802930f514a2429cc56f5b4c2f12

  - runs: |
      curl -f https://raw.githubusercontent.com/apache/airflow/refs/tags/constraints-${{package.version}}/constraints-no-providers-${{vars.python-version}}.txt \
           -o constraints-${{vars.python-version}}

  - uses: py/tw/bump-constraints
    with:
      constraints-file: constraints-${{vars.python-version}}
      only-replace: false
      packages: |
        cryptography==44.0.1 # GHSA-79v4-65xg-pq4g, GHSA-h4gh-qq45-vh27
        werkzeug==3.1.4
        ray==2.52.0
        filelock==3.20.1
        python-multipart==0.0.22

  - runs: |
      # Create and source virtual environment
      uv venv ${{vars.venv-home}} --system-site-packages
      source ${{vars.venv-home}}/bin/activate

      # Install airflow core
      uv pip install apache-airflow==${{package.version}} \
        --constraint constraints-${{vars.python-version}}

      # Uninstall pip and virtualenv from virtual environment
      #
      # pip doesn't need to be present in the virtual environment,
      # the venv can be managed via a system installed package manager
      #
      # virtualenv vendors an outdated and unused pip wheel
      uv pip uninstall pip virtualenv

      # Mark md5 as not used for security
      patch -p1 -d ${{vars.venv-home}}/lib/python${{vars.python-version}}/site-packages < md5-not-usedforsecurity.patch

      # Install virtual environment
      mkdir -p ${{targets.contextdir}}/home/airflow
      cp -a ${{vars.venv-home}} ${{targets.contextdir}}/home/airflow

      # Ensure lockfile isn't world-writeable
      chmod 644 ${{targets.contextdir}}/${{vars.venv-home}}/.lock

# We can't re-use airflow-compat subpackage from airflow package in wolfi/os because it invoke full airflow and hence bloats size
subpackages:
  - name: ${{package.name}}-compat
    options:
      no-depends: true
    dependencies:
      runtime:
        - ${{package.name}}
      provides:
        - airflow-core-compat=${{package.full-version}}
    pipeline:
      - runs: |
          # Symlink libstdc++ from usr/lib to /usr/lib/$(uname -m)-linux-gnu/
          mkdir -p ${{targets.subpkgdir}}/usr/lib/$(uname -m)-linux-gnu
          ln -sf /usr/lib/libstdc++.so.6 ${{targets.subpkgdir}}/usr/lib/$(uname -m)-linux-gnu/
    test:
      pipeline:
        - runs: stat /usr/lib/$(uname -m)-linux-gnu/libstdc++.so.6

  - name: ${{package.name}}-oci-entrypoint
    description: Entrypoint for using airflow-core in OCI containers
    dependencies:
      runtime:
        - ${{package.name}}
        - netcat-openbsd
      provides:
        - airflow-core-oci-entrypoint=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/opt/airflow/dags
          mkdir -p ${{targets.contextdir}}/opt/airflow/logs
          mkdir -p ${{targets.contextdir}}/scripts/docker

          # The first time you run Airflow, it will create a file called `airflow.cfg` in
          # `$AIRFLOW_HOME` directory
          # However, for production case it is advised to generate the configuration
          source ${{vars.venv-home}}/bin/activate
          airflow config list --defaults > ${{targets.contextdir}}/opt/airflow/airflow.cfg

          cp airflow-core/src/airflow/config_templates/default_webserver_config.py ${{targets.contextdir}}/

          install -Dm755 scripts/docker/entrypoint_prod.sh ${{targets.contextdir}}/entrypoint
          install -Dm755 scripts/docker/clean-logs.sh ${{targets.contextdir}}/clean-logs
          install -Dm755 scripts/docker/airflow-scheduler-autorestart.sh ${{targets.contextdir}}/airflow-scheduler-autorestart
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: airflow-core-oci-entrypoint
            real-pkg-name: ${{subpkg.name}}

update:
  enabled: true
  ignore-regex-patterns:
    - 'rc\d+$'
    - 'helm-chart*'
  github:
    identifier: apache/airflow
    tag-filter-prefix: 3.

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-compat
        - bash
  pipeline:
    - runs: |
        # Source virtual environment
        source ${{vars.venv-home}}/bin/activate

        # Set airflow home
        export AIRFLOW_HOME=/opt/airflow

        # Prevents warnings about example dags not being in the right place under /opt/airflow
        # This is expected as we intentionally put them under /home/airflow, and we use our own test dag
        export AIRFLOW__CORE__LOAD_EXAMPLES=False

        # Initialize Airflow database
        airflow db migrate

        # Create and test a simple DAG
        echo "Creating and testing a simple DAG..."
        mkdir -p /opt/airflow/dags
        cat <<EOF > /opt/airflow/dags/test_dag.py
        from airflow import DAG
        from airflow.operators.bash import BashOperator
        from datetime import datetime

        with DAG("test_dag", start_date=datetime(2024, 1, 1), schedule=None) as dag:
            task = BashOperator(
                task_id="test_task",
                bash_command="echo Hello World!"
            )
        EOF

        # Reload the db
        airflow dags reserialize

        # List DAGs
        airflow dags list | grep test_dag || (echo "DAG not found!" && exit 1)

        # Test Task Execution in DAG
        airflow tasks test test_dag test_task 2024-01-01 || (echo "Task execution failed!" && exit 1)
    - uses: test/tw/pip-check
      with:
        python: ${{vars.venv-home}}/bin/python${{vars.python-version}}
    - uses: test/tw/ldd-check
