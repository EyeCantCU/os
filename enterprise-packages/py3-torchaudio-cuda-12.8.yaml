# Please note that torchaudio will be sunsetting a lot of features in the future.
# Anyone willing to update this please refer to this discussion before doing so https://github.com/pytorch/audio/issues/3902
# Ideally, we should not have added it but it is hard requirement for vllm
# Starting with TorchAudio 2.8 (expected around August 2025), APIs slated for removal will trigger a deprecation warning.
# These APIs will be fully removed in TorchAudio 2.9 (anticipated by the end of 2025).
# So please be gentle with next release
package:
  name: py3-torchaudio-cuda-12.8
  version: "2.10.0"
  epoch: 0
  description: Data manipulation and transformation for audio signal processing
  resources:
    cpu: 16
    memory: 40Gi
  copyright:
    - license: BSD-2-Clause

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: "$1"
    to: cuda-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.(\d+)$'
    replace: "cu$1$2"
    to: cuda-pyvariant

vars:
  pypi-package: torchaudio

environment:
  contents:
    packages:
      - ccache
      - cmake
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - ninja
      - nvcc-${{vars.cuda-version}}-gcc-wrapper
      - py3-supported-build-base-dev
      - py3-supported-torch-cuda-${{vars.cuda-version}}-dev
  environment:
    CFLAGS: "-Wno-error=nonnull -Wno-nonnull"
    CXXFLAGS: "-Wno-error=nonnull -Wno-nonnull"
    # Not having this makes the log at least 4x bigger
    NVCC_APPEND_FLAGS: --compiler-options -fdelete-null-pointer-checks
    BUILD_VERSION: ${{package.version}}+${{vars.cuda-pyvariant}}
    CMAKE_CUDA_ARCHITECTURES: all
    PATH: "$PATH:/usr/local/cuda-${{vars.cuda-version}}/bin"
    TORCH_CUDA_ARCH_LIST: "5.2 6.0 6.1 7.0+PTX 8.0 8.6 8.7 8.9 9.0"
    TORCH_NVCC_FLAGS: "-Xfatbin -compress-all"
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/audio.git
      tag: v${{package.version}}
      expected-commit: 27b7ebdebd2d2e4d34a2f5c05b0fb26efbd1da63
      cherry-picks: |
        main/e1232690308a6b5297fcd06e925899a9b64f7280: Fix building on GCC 14.2 (pytorch/audio#4163)

  - runs: ccache -F 0 -M 0

subpackages:
  - name: libtorchaudio-cuda-${{vars.cuda-version}}
    description: C++ torchaudio library
    dependencies:
      runtime:
        - libtorch-cuda-${{vars.cuda-version}}
        - sox-ng-dev
    pipeline:
      - uses: cmake/configure
        with:
          opts: |
            -DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda-${{vars.cuda-version}} \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-${{vars.cuda-version}}/bin/nvcc \
            -DUSE_SYSTEM_NVTX=1 \
            -DCMAKE_CUDA_ARCHITECTURES="${CMAKE_CUDA_ARCHITECTURES}"
      - uses: cmake/build
      - uses: cmake/install
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv ${{targets.subpkgdir}}/usr/torchaudio/lib/*.so ${{targets.subpkgdir}}/usr/lib
          rm -rf ${{targets.subpkgdir}}/usr/torchaudio/
      - uses: strip
    test:
      pipeline:
        # Torchaudio is moving towards deprecating C bindings, they do not have headers for it anymore even
        - uses: test/tw/ldd-check

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-torch-cuda-${{vars.cuda-version}}
        - py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}-shared
        - sox-ng-dev
        - sox-ng
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: move shared libraries
        runs: |
          mkdir -p bin-save/${{range.key}}/torchaudio
          mv ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/torchaudio/lib/*.so bin-save/${{range.key}}/torchaudio
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - ffmpeg
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | grep -F -e "${{package.version}}"
            import torchaudio
            print(torchaudio.__version__)
            EOF

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}-shared
    description: Shared objects for compatibility with FFMPeg versions ${{vars.pypi-package}}
    options:
      # These are split up because they link to old versions on FFMPEG (on purpose)
      # And we still want dependency resolution for everything that are not these .so files
      no-depends: true
    dependencies:
      runtime:
        - libgomp
    pipeline:
      - name: move shared libraries
        runs: |
          mkdir -p bin-save/${{range.key}}
          mkdir -p ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/torchaudio/lib
          mv bin-save/${{range.key}}/torchaudio/*.so ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/torchaudio/lib
      - uses: strip

  - name: py3-supported-${{vars.pypi-package}}-${{vars.cuda-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.11-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.12-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.13-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
