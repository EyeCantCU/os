package:
  name: jose
  version: 14
  epoch: 1 # go/enterprise-rsc/jose
  description: C-language implementation of Javascript Object Signing and Encryption
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 6Gi

environment:
  contents:
    packages:
      - build-base
      - jansson-dev
      - openssl-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/latchset/jose.git
      tag: v${{package.version}}
      expected-commit: 339ad6c836587c3e481f5df56c22c5370c7a264b

  - uses: meson/configure

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development libraries
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/pkgconf

  - name: libjose-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: latchset/jose
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test key management (AES128-GCM, RSA, ES256)
      runs: |
        # Test key generation
        jose jwk gen -i '{"alg": "A128GCM"}' -o oct.jwk
        jose jwk gen -i '{"alg": "RSA1_5"}' -o rsa.jwk
        jose jwk gen -i '{"alg": "ES256"}' -o ec.jwk

        # Test pubkey calculation
        jose jwk pub -i oct.jwk -o oct.pub.jwk
        jose jwk pub -i rsa.jwk -o rsa.pub.jwk
        jose jwk pub -i ec.jwk -o ec.pub.jwk

        # Test thumbprint calculation
        jose jwk thp -i oct.jwk > /dev/null
        jose jwk thp -i rsa.jwk > /dev/null
        jose jwk thp -i ec.jwk  > /dev/null
    - name: Test signature
      runs: |
        echo "message" | jose jws sig -i- -k ec.jwk -o msg.jws
        jose jws ver -i msg.jws -k ec.pub.jwk
    - name: Test encryption
      runs: |
        echo "message" | jose jwe enc -I - -k rsa.pub.jwk -o encrypted.jwe
        jose jwe dec -i encrypted.jwe -k rsa.jwk
