package:
  name: istio-fips-1.27
  version: "1.27.7"
  epoch: 0 # GHSA-jv3w-x3r3-g6rm
  description: Istio is an open source service mesh that layers transparently onto existing distributed applications.
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

# This package contains cni binaries. They can be copied out of Wolfi
# onto older host-os During build-time link against an older glibc, to
# ensure go-fips built cni remain ABI compatible with old foreign
# host-os.
environment:
  contents:
    packages:
      - oldglibc~2.28

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/istio/istio
      tag: ${{package.version}}
      expected-commit: 044f05ec0a1c9ba4bf80a26d801a39f70b58af81

  - uses: go/bump
    with:
      deps: |-
        github.com/go-viper/mapstructure/v2@v2.4.0
        golang.org/x/crypto@v0.45.0
        github.com/containernetworking/plugins@v1.9.0

  # Integration with our portable OpenSSL
  - uses: patch
    with:
      patches: portable-libcrypto.patch

subpackages:
  - name: istio-cni-fips-${{vars.major-minor-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./cni/cmd/istio-cni
          output: istio-cni
          go-package: go-fips
          ldflags: |
            -X istio.io/istio/pkg/version.buildVersion=${{package.version}}
            -X istio.io/istio/pkg/version.buildGitRevision=$(git rev-parse HEAD)
            -X istio.io/istio/pkg/version.buildTag=$(git describe --tags --always)
            -X istio.io/istio/pkg/version.buildStatus="Clean"
          extra-args: "-buildvcs=false"
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: istio-cni
        - uses: test/go-fips-check
          with:
            package-match: ${{subpkg.name}}

  - name: istio-cni-fips-${{vars.major-minor-version}}-compat
    pipeline:
      - runs: |
          # See https://github.com/istio/istio/blob/1.20.2/cni/deployments/kubernetes/Dockerfile.install-cni
          mkdir -p ${{targets.subpkgdir}}/opt/cni/bin
          ln -sf /usr/bin/istio-cni ${{targets.subpkgdir}}/opt/cni/bin/istio-cni
    dependencies:
      provides:
        - istio-cni-fips-compat=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: istio-cni-fips-compat
            real-pkg-name: ${{subpkg.name}}

  - name: istio-install-cni-fips-${{vars.major-minor-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./cni/cmd/install-cni
          output: install-cni
          go-package: go-fips
          ldflags: |
            -X istio.io/istio/pkg/version.buildVersion=${{package.version}}
            -X istio.io/istio/pkg/version.buildGitRevision=$(git rev-parse HEAD)
            -X istio.io/istio/pkg/version.buildTag=$(git describe --tags --always)
            -X istio.io/istio/pkg/version.buildStatus="Clean"
          extra-args: "-buildvcs=false"
    dependencies:
      provides:
        - istio-install-cni-fips=${{package.full-version}}
      runtime:
        - libcrypto3-2.34
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: install-cni
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: istio-install-cni-fips
            real-pkg-name: ${{subpkg.name}}
        - uses: test/go-fips-check
          with:
            package-match: ${{subpkg.name}}

  - name: istio-install-cni-fips-${{vars.major-minor-version}}-compat
    pipeline:
      - runs: |
          # See https://github.com/istio/istio/blob/1.20.2/cni/deployments/kubernetes/Dockerfile.install-cni
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -sf /usr/bin/install-cni ${{targets.subpkgdir}}/usr/local/bin/install-cni
    dependencies:
      provides:
        - istio-install-cni-fips-compat=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: istio-install-cni-fips-compat
            real-pkg-name: ${{subpkg.name}}

  - name: istio-pilot-agent-fips-${{vars.major-minor-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./pilot/cmd/pilot-agent
          output: pilot-agent
          go-package: go-fips-md5
          # Extracted from https://github.com/istio/istio/blob/4358b84b911a80ba09ef36ac00ad85535a77e7ca/common/scripts/report_build_info.sh#L41-L48
          # Use this instead for buildStatus once our pipeline stops dirtying the git tree: "$(if git diff-index --quiet HEAD --; then echo "Clean"; else echo "Modified"; fi)"
          ldflags: |
            -X istio.io/istio/pkg/version.buildVersion=${{package.version}}
            -X istio.io/istio/pkg/version.buildGitRevision=$(git rev-parse HEAD)
            -X istio.io/istio/pkg/version.buildTag=$(git describe --tags --always)
            -X istio.io/istio/pkg/version.buildStatus="Clean"
          extra-args: "-buildvcs=false"
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/var/lib/istio/envoy
          cp ./tools/packaging/common/envoy_bootstrap.json \
            ${{targets.subpkgdir}}/var/lib/istio/envoy/envoy_bootstrap_tmpl.json
    test:
      pipeline:
        - uses: test/daemon-check-output
          with:
            start: /usr/bin/pilot-agent proxy sidecar
            expected_output: "Starting"
            timeout: "10"
            error_strings: ""
        - uses: test/go-fips-check
          with:
            package-match: ${{subpkg.name}}

  - name: istio-pilot-agent-fips-${{vars.major-minor-version}}-compat
    pipeline:
      - runs: |
          # link /usr/local/bin/pilot-agent -> /usr/bin/pilot-agent to match
          # what the Istio Helm charts may expect.
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -sf /usr/bin/pilot-agent ${{targets.subpkgdir}}/usr/local/bin/pilot-agent
    dependencies:
      provides:
        - istio-pilot-agent-fips-compat=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: istio-pilot-agent-fips-compat
            real-pkg-name: ${{subpkg.name}}

  - name: istio-pilot-discovery-fips-${{vars.major-minor-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./pilot/cmd/pilot-discovery
          output: pilot-discovery
          go-package: go-fips-md5
          # Extracted from https://github.com/istio/istio/blob/4358b84b911a80ba09ef36ac00ad85535a77e7ca/common/scripts/report_build_info.sh#L41-L48
          # Use this instead for buildStatus once our pipeline stops dirtying the git tree: "$(if git diff-index --quiet HEAD --; then echo "Clean"; else echo "Modified"; fi)"
          ldflags: |
            -X istio.io/istio/pkg/version.buildVersion=${{package.version}}
            -X istio.io/istio/pkg/version.buildGitRevision=$(git rev-parse HEAD)
            -X istio.io/istio/pkg/version.buildTag=$(git describe --tags --always)
            -X istio.io/istio/pkg/version.buildStatus="Clean"
          extra-args: "-buildvcs=false"
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/var/lib/istio/envoy
          cp ./tools/packaging/common/envoy_bootstrap.json \
            ${{targets.subpkgdir}}/var/lib/istio/envoy/envoy_bootstrap_tmpl.json
    test:
      pipeline:
        - uses: test/daemon-check-output
          with:
            start: /usr/bin/pilot-discovery discovery
            expected_output: "starting"
            timeout: "10"
            error_strings: ""
        - uses: test/go-fips-check
          with:
            package-match: ${{subpkg.name}}

update:
  enabled: true
  git:
    tag-filter-prefix: 1.27.

test:
  environment:
    contents:
      packages:
        - jq
        - grep
        - istio-pilot-agent-fips-${{vars.major-minor-version}}
        - istio-pilot-discovery-fips-${{vars.major-minor-version}}
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: |
          pilot-discovery
          pilot-agent
    - runs: |-
        set -euo pipefail

        # Verify version metadata is correctly embedded in pilot-discovery
        pilot-discovery version -o json > /tmp/pd-version.json
        # Verify file is not empty before processing
        if [ ! -s /tmp/pd-version.json ]; then
          echo "FAIL: pilot-discovery version output is empty"
          exit 1
        fi

        # Verify revision is not unknown
        revision=$(jq -r '.clientVersion.revision' /tmp/pd-version.json)
        if [ "$revision" = "unknown" ]; then
          echo "FAIL: pilot-discovery revision is 'unknown'"
          exit 1
        fi

        # Verify tag is not unknown
        tag=$(jq -r '.clientVersion.tag' /tmp/pd-version.json)
        if [ "$tag" = "unknown" ]; then
          echo "FAIL: pilot-discovery tag is 'unknown'"
          exit 1
        fi

        # Verify version metadata is correctly embedded in pilot-agent
        pilot-agent version -o json > /tmp/pa-version.json
        # Verify file is not empty before processing
        if [ ! -s /tmp/pa-version.json ]; then
          echo "FAIL: pilot-agent version output is empty"
          exit 1
        fi

        # Verify revision is not unknown
        revision=$(jq -r '.clientVersion.revision' /tmp/pa-version.json)
        if [ "$revision" = "unknown" ]; then
          echo "FAIL: pilot-agent revision is 'unknown'"
          exit 1
        fi

        # Verify tag is not unknown
        tag=$(jq -r '.clientVersion.tag' /tmp/pa-version.json)
        if [ "$tag" = "unknown" ]; then
          echo "FAIL: pilot-agent tag is 'unknown'"
          exit 1
        fi

        echo "SUCCESS: All version metadata checks passed"
