package:
  name: nri-consul-fips
  version: "2.9.6"
  epoch: 0
  description: New Relic Infrastructure consul Integration (FIPS)
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-consul
      expected-commit: dcd378a85c3c787d05fef1fa82cdd53a512199f5
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-consul
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-consul ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-consul
          install -Dm644 legacy/consul-definition.yml ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/consul-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-consul
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-consul
    - uses: test/tw/ver-check
      with:
        bins: nri-consul
        version-flag: "-show_version"
    - name: "Test binary execution"
      uses: test/daemon-check-output
      with:
        start: |
          nri-consul
        expected_output: |
          connect: connection refused
        error_strings: |
          FAIL
          Traceback.*most.recent.call
