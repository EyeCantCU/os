#nolint:valid-pipeline-git-checkout-tag
package:
  name: amazon-vpc-cni-plugins-fips
  version: "1.3_git20251112"
  epoch: 3
  description: Amazon VPC CNI Plugins for Amazon ECS, for EKS use amazon-k8s-cni
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - iptables-nft

environment:
  contents:
    packages:
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/amazon-vpc-cni-plugins
      branch: master
      expected-commit: a4e9ac076709c882a904afabc4c24c7700600f6b

  - runs: |
      rm -r ./vendor

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X pkg/version/version.Version=${{package.version}} -X pkg/version.GitShortHash=$(git rev-parse --short=8 HEAD)
      output: aws-appmesh
      packages: ./plugins/aws-appmesh

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X pkg/version/version.Version=${{package.version}} -X pkg/version.GitShortHash=$(git rev-parse --short=8 HEAD)
      output: ecs-serviceconnect
      packages: ./plugins/ecs-serviceconnect

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X pkg/version/version.Version=${{package.version}} -X pkg/version.GitShortHash=$(git rev-parse --short=8 HEAD)
      output: vpc-branch-eni
      packages: ./plugins/vpc-branch-eni

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X pkg/version/version.Version=${{package.version}} -X pkg/version.GitShortHash=$(git rev-parse --short=8 HEAD)
      output: vpc-eni
      packages: ./plugins/vpc-eni

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: Upstream does not really maintain tags or releases. There is a version tag from 2 years ago but also updates to master since.

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        aws-appmesh -version
        ecs-serviceconnect -version
        vpc-branch-eni -version
        vpc-eni -version
