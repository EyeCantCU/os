package:
  name: rancher-webhook-fips-0.4
  version: "0.4.18"
  epoch: 10 # CVE-2025-61732
  description: Rancher webhook for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-webhook-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f102dbe61696469b224fcb909a6ad3af64c169e7
      repository: https://github.com/rancher/webhook
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: upgrade-k8s.io-packages.patch

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      modroot: .
      output: webhook
      packages: .
      go-package: go-fips

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v0.4.

test:
  pipeline:
    - uses: test/go-fips-check
    - name: "start daemon"
      uses: test/daemon-check-output
      with:
        start: "webhook"
        timeout: 15
        expected_output: |
          starting
          Waiting for server to become available
