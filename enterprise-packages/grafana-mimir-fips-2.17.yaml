package:
  name: grafana-mimir-fips-2.17
  version: "2.17.2"
  epoch: 1 # GHSA-2464-8j7c-4cjm
  description: Grafana Mimir provides horizontally scalable, highly available, multi-tenant, long-term storage for Prometheus.
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    provides:
      - grafana-mimir-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/mimir
      tag: mimir-${{package.version}}
      expected-commit: bce93699bd2d5b8fc530034073be7d2da4365751

  # the repo has an ssh://git@github.com URI for mimir-prometheus
  # so just rm the file and default to the https URL for go.mod
  - runs: |
      rm go.sum
      rm .gitconfig

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/mimir
      output: grafana-mimir
      ldflags: "-w"
      go-package: go-fips-md5

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - distributed
    - weekly
  github:
    identifier: grafana/mimir
    strip-prefix: mimir-
    use-tag: true
    tag-filter-prefix: mimir-2.17

test:
  pipeline:
    - runs: |
        grafana-mimir -version
        grafana-mimir --version
    - uses: test/go-fips-check
