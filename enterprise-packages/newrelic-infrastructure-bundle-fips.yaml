package:
  name: newrelic-infrastructure-bundle-fips
  version: "3.3.12"
  epoch: 0
  description: New Relic Infrastructure containerised agent bundle with JDK 11 (FIPS)
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - nri-apache-fips
      - nri-apache-fips-compat
      - nri-cassandra-fips
      - nri-cassandra-fips-compat
      - nri-consul-fips
      - nri-consul-fips-compat
      - nri-couchbase-fips
      - nri-couchbase-fips-compat
      - nri-discovery-kubernetes-fips
      - nri-discovery-kubernetes-fips-compat
      - nri-elasticsearch-fips
      - nri-elasticsearch-fips-compat
      - nri-f5-fips
      - nri-f5-fips-compat
      - nri-haproxy-fips
      - nri-haproxy-fips-compat
      - nri-jmx-fips
      - nri-jmx-fips-compat
      - nri-kafka-fips
      - nri-kafka-fips-compat
      - nri-memcached-fips
      - nri-memcached-fips-compat
      - nri-mongodb-fips
      - nri-mongodb-fips-compat
      - nri-mssql-fips
      - nri-mssql-fips-compat
      - nri-mysql-fips
      - nri-mysql-fips-compat
      - nri-nagios-fips
      - nri-nagios-fips-compat
      - nri-nginx-fips
      - nri-nginx-fips-compat
      - nri-postgresql-fips
      - nri-postgresql-fips-compat
      - nri-rabbitmq-fips
      - nri-rabbitmq-fips-compat
      - nri-redis-fips
      - nri-redis-fips-compat
      - nrjmx
      - openjdk-11-jre
      - openjdk-bcfips-policy-140-3-j11

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/infrastructure-bundle
      tag: v${{package.version}}
      expected-commit: 3c57e93f5dc89538ef7298fc53df1accfea52404
      destination: ${{package.name}}

update:
  enabled: true
  github:
    identifier: newrelic/infrastructure-bundle
    use-tag: true
    tag-filter: v
    strip-prefix: v

test:
  pipeline:
    - runs: |
        # This is a dependency package, so we mostly need to check that it's
        # installable.  However, we can also check that it only ships the
        # .spdx.json file while we're here.
        installed_files=$(apk info -L newrelic-infrastructure-bundle-fips 2>/dev/null | tail -n+2 | grep -v '^$')
        [ "$installed_files" == "var/lib/db/sbom/newrelic-infrastructure-bundle-fips-${{package.full-version}}.spdx.json" ]
