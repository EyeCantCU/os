package:
  name: chart-iamguarded-kube-state-metrics
  version: "5.1.0"
  epoch: 1
  description: kube-state-metrics iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: kube-state-metrics/${{package.version}}
      expected-commit: b8343ddb25f3c8723ee896cb39fe71c789a72429

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/kube-state-metrics

  - uses: charts/package
    with:
      chart-path: iamguarded/kube-state-metrics

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: kube-state-metrics/
    use-tag: true
    tag-filter-prefix: kube-state-metrics/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /kube-state-metrics
