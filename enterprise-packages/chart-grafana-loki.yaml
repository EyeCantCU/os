package:
  name: chart-grafana-loki
  version: "6.53.0"
  epoch: 0
  description: Helm chart for Grafana Loki and Grafana Enterprise Logs supporting monolithic, simple scalable, and microservices modes.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - helm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/loki
      tag: helm-loki-${{package.version}}
      expected-commit: bb44f06ad2bd522d4184c6bbc9db1df0aed40f44

  # Remove external subchart dependencies - they are optional and disabled during testing.
  # Without their APKs, helm dependency build would fail trying to fetch them.
  - runs: |
      yq -i 'del(.dependencies)' production/helm/loki/Chart.yaml

  # Fix the deprecated .sha field in _helpers.tpl to accept full digest strings
  # (sha256:...) without prepending another sha256: prefix.
  - runs: |
      sed -i 's|@sha256:%s" .service.sha|@%s" .service.sha|' production/helm/loki/templates/_helpers.tpl

  - uses: charts/package
    with:
      chart-path: production/helm/loki
      images: |
        loki:
          values:
            loki:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${tag}
                digest: ${digest}
        gateway:
          values:
            gateway:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${tag}
                digest: ${digest}
        loki-canary:
          values:
            lokiCanary:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${tag}
                digest: ${digest}
        memcached:
          values:
            memcached:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        memcached-exporter:
          values:
            memcachedExporter:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        sidecar:
          values:
            sidecar:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                sha: ${digest}
        enterprise-logs:
          values:
            enterprise:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${tag}
                digest: ${digest}
        enterprise-provisioner:
          values:
            enterprise:
              provisioner:
                image:
                  registry: ${registry}
                  repository: ${repo}
                  tag: ${tag}
                  digest: ${digest}
      test: |
        values:
          deploymentMode: SingleBinary
          loki:
            storage:
              type: filesystem
            commonConfig:
              replication_factor: 1
            useTestSchema: true
          singleBinary:
            replicas: 1
          read:
            replicas: 0
          write:
            replicas: 0
          backend:
            replicas: 0
        cases:
          - name: default
            images: [loki, gateway, loki-canary, memcached, memcached-exporter, sidecar]
          - name: enterprise
            # gateway is excluded: enterprise+gelGateway replaces nginx gateway with enterprise-logs image
            images: [enterprise-logs, enterprise-provisioner, loki-canary, memcached, memcached-exporter, sidecar]
            values:
              enterprise:
                enabled: true
                adminToken:
                  secret: test-token

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: grafana/loki
    strip-prefix: helm-loki-
    use-tag: true
    tag-filter-prefix: helm-loki-
