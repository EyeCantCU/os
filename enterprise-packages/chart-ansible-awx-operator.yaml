package:
  name: chart-ansible-awx-operator
  version: "3.2.0"
  epoch: 0
  description: The community-supported AWX Operator Helm Chart
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ansible-community/awx-operator-helm
      tag: awx-operator-${{package.version}}
      expected-commit: 0fffb3f420945d48df582dbaa6612aaf02cbb079

  # operator-controller-containers is an empty map ({}) by default. The chart merges
  # container specs into this map at render time. Add the expected keys so chelm can
  # validate the values paths.
  - runs: |
      yq -i '."operator-controller-containers" = {"awx-manager": {"image": ""}, "kube-rbac-proxy": {"image": ""}}' charts/awx-operator/values.yaml

  - uses: charts/package
    with:
      chart-path: charts/awx-operator
      images: |
        awx-operator:
          values:
            operator-controller-containers:
              awx-manager:
                image: ${ref}
        kube-rbac-proxy:
          values:
            operator-controller-containers:
              kube-rbac-proxy:
                image: ${ref}
      test: |
        cases:
          - name: default
            images: [awx-operator, kube-rbac-proxy]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: ansible-community/awx-operator-helm
    strip-prefix: awx-operator-
    use-tag: true
    tag-filter-prefix: awx-operator-
