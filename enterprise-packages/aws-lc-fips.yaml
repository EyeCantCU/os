package:
  name: aws-lc-fips
  version: "2.0.0"
  epoch: 4 # go/enterprise-rsc/aws-lc-fips
  description: "A general-purpose cryptographic library maintained by the AWS Cryptography team for AWS and their customers"
  copyright:
    - license: Apache-2.0 AND OpenSSL AND BSD-3-Clause AND ISC
  dependencies:
    runtime:
      - NIST-CMVP-4759
  resources:
    cpu: "2"
    memory: 7Gi

vars:
  aws-lc-lib-dir: /usr/lib/aws-lc
  aws-lc-include-dir: /usr/include/aws-lc
  aws-lc-crypto-lib: /usr/lib/aws-lc/libcrypto.so

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-18
      - cmake-3
      - go
      - perl
      - samurai
  environment:
    NO_COLOR: "1"
    TERM: "dumb"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 329d23ce93d42b9017502ac24ca073ebdaa7660f
      repository: https://github.com/aws/aws-lc
      tag: AWS-LC-FIPS-${{package.version}}

  - uses: patch
    with:
      patches: jitterentropy-compile-flags.patch

  - if: ${{build.arch}} == 'aarch64'
    uses: cmake/configure
    with:
      opts: |
        -DCMAKE_INSTALL_LIBDIR=lib/aws-lc \
        -DCMAKE_INSTALL_INCLUDEDIR=include/aws-lc \
        -DCMAKE_INSTALL_RPATH=${{vars.aws-lc-lib-dir}} \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_C_COMPILER=clang \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DBUILD_TESTING=OFF \
        -DFIPS=1 \
        -DENABLE_FIPS_ENTROPY_CPU_JITTER=ON \
        -DOPENSSL_NO_ASM=ON

  - if: ${{build.arch}} == 'x86_64'
    uses: cmake/configure
    with:
      opts: |
        -DCMAKE_INSTALL_LIBDIR=lib/aws-lc \
        -DCMAKE_INSTALL_INCLUDEDIR=include/aws-lc \
        -DCMAKE_INSTALL_RPATH=${{vars.aws-lc-lib-dir}} \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_C_COMPILER=clang \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DBUILD_TESTING=OFF \
        -DFIPS=1 \
        -DENABLE_FIPS_ENTROPY_CPU_JITTER=ON

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
      - runs: |
          for component in crypto ssl; do
            mkdir -p ${{targets.subpkgdir}}${{vars.aws-lc-lib-dir}}/$component
            mv ${{targets.destdir}}${{vars.aws-lc-lib-dir}}/$component/cmake ${{targets.subpkgdir}}${{vars.aws-lc-lib-dir}}/$component/cmake
          done
    description: "AWS-LC (FIPS) dev"
    dependencies:
      runtime:
        - aws-lc-fips
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-tools
    description: "AWS-LC (FIPS) tools"
    dependencies:
      runtime:
        - aws-lc-fips
        - NIST-CMVP-4816
    pipeline:
      - runs: |
          mv ${{targets.destdir}}/usr/bin/bssl ${{targets.destdir}}/usr/bin/bssl-${{package.name}}-${{package.version}}
          mkdir -p ${{targets.subpkgdir}}/usr
          mv ${{targets.destdir}}/usr/bin ${{targets.subpkgdir}}/usr
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - runs: |
            bssl-${{package.name}}-${{package.version}} isfips && echo "FIPS mode enabled"

test:
  environment:
    contents:
      packages:
        - posix-libc-utils
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 4816
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 4759
        software-version: ${{package.version}}

update:
  enabled: false
  exclude-reason: |
    Version 2.0.0 is the FIPS certified version of aws-lc; only update when a new 2.x.x release is certified.
  github:
    identifier: aws/aws-lc
    strip-prefix: AWS-LC-FIPS-
    use-tag: true
    tag-filter: AWS-LC-FIPS-2
