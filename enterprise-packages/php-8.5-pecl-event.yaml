package:
  name: php-8.5-pecl-event
  version: 3.1.4
  epoch: 1 # go/enterprise-rsc/php-8.5-pecl-event
  description: "PHP ${{vars.phpMM}} Event is a PECL extension providing interface to libevent C library."
  copyright:
    - license: PHP-3.01
  dependencies:
    runtime:
      - php-${{vars.phpMM}}
      - php-${{vars.phpMM}}-sockets
  resources:
    cpu: "3"
    memory: 4Gi

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - libevent-dev
      - openssl-dev
      - php-${{vars.phpMM}}-dev
      - php-${{vars.phpMM}}-sockets

pipeline:
  - uses: git-checkout
    with:
      repository: https://bitbucket.org/osmanov/pecl-event.git
      tag: ${{package.version}}
      expected-commit: daa2b073545325e623a22d79889c656e00094d1e

  - uses: pecl/phpize

  - uses: autoconf/configure
    with:
      opts: |
        --with-event-core \
        --with-event-extra

  - uses: autoconf/make

  - uses: pecl/install
    with:
      extension: event

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        php -m | grep -q "event"

        # Check extension version info
        php -r "
        if (extension_loaded('event')) {
          echo 'Event extension is loaded and working';
        } else {
          echo 'Event extension failed to load';
          exit(1);
        }"
    - runs: |
        # Test basic Event functionality
        cat > test.php << 'EOF'
        <?php
        $base = new EventBase();
        $buffer = new EventBuffer();
        $test_data = "Event extension test";
        $buffer->add($test_data);
        $result = $buffer->read(strlen($test_data));
        echo $result === $test_data ? 'Basic functionality test passed' : 'Test failed';
        ?>
        EOF

        php test.php | grep -q "Basic functionality test passed"

update:
  enabled: true
  git: {}
