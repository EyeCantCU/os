package:
  name: k6-fips
  version: "1.6.0"
  epoch: 1 # CVE-2025-61731
  description: A modern load testing tool, using Go and JavaScript (FIPS compliant version)
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    runtime:
      - bash-binsh
      - coreutils
      - curl
      - grep
      - openssl-config-fipshardened

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/k6
      tag: v${{package.version}}
      expected-commit: d97957fc61c3d122313632f6ff2f83e54969ca8b

  - uses: patch
    with:
      patches: 0001-patch-switch-md5-usage-to-sha256.patch

  - uses: go/build
    with:
      packages: .
      output: k6
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: grafana/k6
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: k6
    - uses: test/tw/help-check
      with:
        bins: k6
    - name: "run a demo test"
      runs: |
        set -euo pipefail
        k6 new | grep -F "New script created"
        k6 run script.js --duration=1.5s
    - name: "run an md5 test"
      runs: |
        set -euo pipefail
        tee test.js <<EOF
        import crypto from 'k6/crypto';

        export default function () {
            let hash1 = crypto.hmac('sha256', 'mysecret', 'hello world!', 'hex');
            let hash2 = crypto.hmac('md5', 'mysecret', 'hello world!', 'hex');

            const binArray = [104, 101, 108, 108, 111, 32, 119, 111, 114, 108, 100, 33];

            hash1 = crypto.hmac('sha256', 'mysecret', new Uint8Array(binArray).buffer, 'hex');
            hash2 = crypto.hmac('md5', 'mysecret', new Uint8Array(binArray).buffer, 'hex');
            console.log(hash1);
            console.log(hash2);

        }
        EOF
        k6 run test.js 2>&1 | grep -F 'invalid algorithm: md5'
