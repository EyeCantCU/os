package:
  name: azurefile-csi-fips-1.35
  version: "1.35.1"
  epoch: 0 # GHSA-9h8m-3fm2-qjrq
  description: Azure File CSI Driver
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - azurefile-csi-fips=${{package.full-version}}
    runtime:
      # https://github.com/kubernetes-sigs/azurefile-csi-driver/blob/v1.33.1/pkg/azurefileplugin/Dockerfile#L36
      - azcopy-fips
      - azfiles-authenticator
      - cifs-utils
      - e2fsprogs
      - mount
      - nfs-utils
      - udev
      - umount
      - util-linux
      - xfsprogs

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ddc738eab97bc7df369e6a3cfde5c5d50baaddc8
      repository: https://github.com/kubernetes-sigs/azurefile-csi-driver
      tag: v${{package.version}}

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: |
        -X sigs.k8s.io/azurefile-csi-driver/pkg/azurefile.driverVersion=v${{package.version}}
        -X sigs.k8s.io/azurefile-csi-driver/pkg/azurefile.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/azurefile-csi-driver/pkg/azurefile.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")
      output: azurefileplugin
      packages: ./pkg/azurefileplugin

  - uses: go/build
    with:
      go-package: go-fips
      output: azurefile-proxy
      packages: ./pkg/azurefile-proxy

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/azurefileplugin ${{targets.subpkgdir}}/azurefileplugin

          # https://github.com/kubernetes-sigs/azurefile-csi-driver/blob/a9797b4447144d7d5d0ebfa354b1d023b14cae62/pkg/azurefileplugin/Dockerfile#L38-L41
          mkdir -p "${{targets.contextdir}}"/azurefile-proxy/
          install -Dm755 ./pkg/azurefile-proxy/init.sh "${{targets.contextdir}}"/azurefile-proxy/
          install -Dm755 ./pkg/azurefile-proxy/install-proxy.sh "${{targets.contextdir}}"/azurefile-proxy/
          install -Dm755 ./pkg/azurefile-proxy/azurefile-proxy.service "${{targets.contextdir}}"/azurefile-proxy/
          ln -sf /usr/bin/azurefile-proxy "${{targets.contextdir}}"/azurefile-proxy/azurefile-proxy
    dependencies:
      provides:
        - azurefile-csi-fips-compat=${{package.full-version}}
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            files: |
              /azurefile-proxy/azurefile-proxy.service
              /azurefile-proxy/init.sh
              /azurefile-proxy/install-proxy.sh
        - runs: readlink -v /azurefile-proxy/azurefile-proxy
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: azurefile-csi-fips-compat

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.35.

test:
  environment:
    contents:
      packages:
        - procps
  pipeline:
    - uses: test/tw/virtualpackage
      with:
        virtual-pkg-name: azurefile-csi-fips
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: azurefileplugin
    # Run the azurefileplugin binary and verify its startup
    - name: Run and test `azurefileplugin`
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /var/lib/kubelet/plugins/file.csi.azure.com
        start: /usr/bin/azurefileplugin --endpoint unix:///var/lib/kubelet/plugins/file.csi.azure.com/csi.sock --nodeid test-node
        timeout: 30
        expected_output: |
          Driver Version: v${{package.version}}
          Enabling controller service capability: CREATE_DELETE_VOLUME
          Enabling volume access mode: SINGLE_NODE_WRITER
        post: |
          set -euo pipefail

          # Verify the CSI driver process is still running (didn't crash after startup)
          pgrep -x azurefileplugin > /dev/null || { echo "FAIL: CSI driver process not running"; exit 1; }

          # Verify CSI socket was created (proves driver is listening for gRPC requests)
          CSI_SOCK="/var/lib/kubelet/plugins/file.csi.azure.com/csi.sock"
          if [ -S "$CSI_SOCK" ]; then
            echo "SUCCESS: CSI socket created at $CSI_SOCK"
          else
            echo "FAIL: CSI socket not created at $CSI_SOCK"
            ls -la /var/lib/kubelet/plugins/file.csi.azure.com/ || true
            exit 1
          fi

          echo "SUCCESS: CSI driver is running and listening on socket"
    - name: Verify additional binaries are installed
      runs: |-
        set -euo pipefail
        # Verify azfilesrefresh binary is installed (fails test if missing)
        stat /usr/bin/azfilesrefresh
        # Verify azurefile-proxy binary is installed (fails test if missing)
        stat /usr/bin/azurefile-proxy
