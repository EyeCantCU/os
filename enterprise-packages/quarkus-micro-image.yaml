#nolint:valid-pipeline-git-checkout-tag
package:
  name: quarkus-micro-image
  # https://github.com/quarkusio/quarkus-images/blob/d3fc1440150668bd490472e4ca07d94e94f1b562/quarkus-micro-base-image/pom.xml#L37
  version: "2.0.1_git20260128"
  epoch: 0
  description: Minimal base image to run Quarkus native applications compiled with GraalVM
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libgcc
      - libstdc++
      - zlib

vars:
  # SHA256 hashes for upstream drift detection
  # Update these when upstream files change and we've reviewed the changes
  pom-xml-sha256: 3995639ad102f379bd0e1c95cb1ac09e6fecae71aa5e2beae35a9e5982cbe4b0
  quarkusmicro-java-sha256: 445291cb1a468dd56aac9473d50f41626902fa1c06a77721ae31c370173f792e

environment:
  contents:
    packages:
      - busybox
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/quarkusio/quarkus-images
      branch: main
      expected-commit: 34b0af38748dc8a997474d17ffe7d293c9484bfc

  # We need to make sure that the version of the package remains same with the upstream and if there are any new runtime deps added.
  # Since quarkusio/quarkus-images does not use tags or releases, we rely on the upstream drift detection to identify changes that need to be reviewed and added here.
  - name: Detect upstream drift
    runs: |
      set -euo pipefail

      cd quarkus-micro-base-image

      # Verify pom.xml content hasn't changed
      # If this check fails, review the changes in the upstream pom.xml: https://github.com/quarkusio/quarkus-images/blob/main/quarkus-micro-base-image/pom.xml
      # and make sure all necessary steps are added to this package

      # Specifically check if there are any changes to the hardcoded version for the image over here:
      # https://github.com/quarkusio/quarkus-images/blob/d3fc1440150668bd490472e4ca07d94e94f1b562/quarkus-micro-base-image/pom.xml#L37

      echo "${{vars.pom-xml-sha256}}  pom.xml" | sha256sum -c

      # Verify QuarkusMicro.java content hasn't changed
      # If this check fails, review the changes in the upstream QuarkusMicro.java: https://github.com/quarkusio/quarkus-images/blob/main/quarkus-micro-base-image/src/main/java/io/quarkus/images/QuarkusMicro.java
      # and make sure all necessary steps are added to this package

      # Specifically check if there are any new runtime deps added over here:
      # https://github.com/quarkusio/quarkus-images/blob/d3fc1440150668bd490472e4ca07d94e94f1b562/quarkus-micro-base-image/src/main/java/io/quarkus/images/QuarkusMicro.java#L12

      echo "${{vars.quarkusmicro-java-sha256}}  src/main/java/io/quarkus/images/QuarkusMicro.java" | sha256sum -c

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: |
      Upstream does not maintain tags or releases. Weekly rebuilds run the drift check
      to detect changes in Dockerfile or packages.sh that require review.

test:
  pipeline:
    - runs: |
        ldconfig -p | grep libgcc_s.so
        ldconfig -p | grep libstdc++.so
        ldconfig -p | grep libz.so
