#nolint:update-identifier-must-match-git-repository
package:
  name: longhorn-engine-1.8
  version: 1.8.2
  epoch: 4 # CVE-2025-61730
  description: Longhorn Engine implements a lightweight block device storage controller capable of storing the data in a number of replicas.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - longhorn-engine=${{package.full-version}}
    runtime:
      - cifs-utils
      - e2fsprogs
      - grpc-health-probe
      - iproute2
      - iputils
      - jq
      - libaio
      - longhorn-instance-manager-${{vars.major-minor-version}}
      - nfs-utils
      - qemu-utils
      - rancher-tgt
      - sg3-utils
      - tini

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - glibc-dev
      - libqcow-dev
      - openssl-dev
      - zlib-dev
      - zlib-static
  environment:
    # Add OpenSSL and jitterentropy to CGO linker flags since libqcow depends on them
    CGO_LDFLAGS: "-lcrypto -ljitterentropy"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/longhorn/longhorn-engine.git
      tag: v${{package.version}}
      expected-commit: 554a84e4f14d1a6acf80d75facc5a330e51f5bee

  - uses: go/build
    with:
      packages: .
      output: longhorn
      # Use static linking so the binary can run on the host node without library dependencies.
      # Longhorn copies this binary to the host and runs it directly, not inside a container.
      tags: netgo
      ldflags: |
        -X main.Version=${{package.version}}
        -X main.GitCommit=$(git rev-parse --short HEAD)
        -X main.BuildDate=$(date -u ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")
        -linkmode external -extldflags -static

  - name: Install scripts
    runs: |
      # Install the launcher scripts from the package directory
      install -Dm755 package/engine-manager ${{targets.contextdir}}/usr/bin/engine-manager
      install -Dm755 package/launch-simple-file ${{targets.contextdir}}/usr/bin/launch-simple-file
      install -Dm755 package/launch-simple-longhorn ${{targets.contextdir}}/usr/bin/launch-simple-longhorn

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for ${{package.name}}
    dependencies:
      provides:
        - longhorn-engine-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/bin
          ln -sf /usr/bin/longhorn ${{targets.contextdir}}/usr/local/bin/longhorn
          ln -sf /usr/bin/engine-manager ${{targets.contextdir}}/usr/local/bin/engine-manager
          ln -sf /usr/bin/launch-simple-file ${{targets.contextdir}}/usr/local/bin/launch-simple-file
          ln -sf /usr/bin/launch-simple-longhorn ${{targets.contextdir}}/usr/local/bin/launch-simple-longhorn
          ln -sf /usr/bin/tini ${{targets.contextdir}}/tini
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

test:
  environment:
    contents:
      packages:
        - lsof
        - procps
        - util-linux
        - wait-for-it
        - posix-libc-utils
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test binary help
      uses: test/tw/help-check
      with:
        bins: longhorn
    - name: Verify launcher scripts are installed
      runs: |
        # Verify the launcher scripts exist and are executable
        stat /usr/bin/engine-manager
        stat /usr/bin/launch-simple-file
        stat /usr/bin/launch-simple-longhorn
        test -x /usr/bin/engine-manager
        test -x /usr/bin/launch-simple-file
        test -x /usr/bin/launch-simple-longhorn
    - name: Test version
      runs: longhorn --version | grep ${{package.version}}
    - name: Verify longhorn binary is statically linked
      runs: ldd /usr/bin/longhorn 2>&1 | grep -q "not a dynamic executable"
    - name: Test controller with replicas
      uses: test/daemon-check-output
      with:
        setup: |
          # /var/lib is used here since it supports both fallocate (QEMU) and fiemap (Docker), unlike /tmp breaks under QEMU (no fallocate) or /home/build breaks under Docker (no fiemap)
          TEST_DIR=/var/lib/longhorn-test
          mkdir -p ${TEST_DIR}/replica1 ${TEST_DIR}/replica2
          tgtd -f > /tmp/tgtd.log 2>&1 &

          # Wait for tgtd to be ready by polling tgtadm (more reliable than sleep)
          for i in $(seq 1 10); do
            if tgtadm --lld iscsi --mode target --op show >/dev/null 2>&1; then
              echo "tgtd is ready after $i attempt(s)"
              break
            fi
            if [ "$i" -eq 10 ]; then
              echo "ERROR: tgtd failed to start after 10 attempts"
              exit 1
            fi
            sleep 1
          done

          pgrep -f tgtd
          longhorn replica --listen 0.0.0.0:9502 --size 100M ${TEST_DIR}/replica1 > /tmp/replica1.log 2>&1 &
          wait-for-it localhost:9502 -t 5
          longhorn replica --listen 0.0.0.0:9503 --size 100M ${TEST_DIR}/replica2 > /tmp/replica2.log 2>&1 &
          wait-for-it localhost:9503 -t 5
          lsof -i :9502 | grep -F "longhorn"
          lsof -i :9503 | grep -F "longhorn"
        start: longhorn controller --frontend socket --listen 0.0.0.0:9501 --size 100M --current-size 100M --replica tcp://127.0.0.1:9502 --replica tcp://127.0.0.1:9503 test-volume
        timeout: 60
        expected_output: |
          Listening
        post: |
          set -o pipefail
          lsof -i :9501 | grep -F longhorn
          longhorn info
          longhorn snapshot create test-snapshot
          longhorn snapshot ls | grep -F "test-snapshot"
          echo "Volume operations completed successfully"

# All of the version streamed components of longhorn should follow a single release as shown in https://github.com/longhorn/longhorn
# To align with this, we will watch for releases from the longhorn/longhorn repo.
# The expectation is that should a release/tag be available in the group repo, that release/tag will also be available in the component but not vice versa.
update:
  enabled: true
  github:
    identifier: longhorn/longhorn
    tag-filter-prefix: v1.8
    strip-prefix: v
    use-tag: true
  ignore-regex-patterns:
    - '.*-rc\d+$'
    - ".*-dev-.*"
