package:
  name: amazon-ssm-agent
  version: "3.3.3270.0"
  epoch: 5 # GHSA-37cx-329c-33x3
  description: Agent to enable remote management of your EC2 instances, on-premises servers, or virtual machines (VMs).
  url: http://docs.aws.amazon.com/ssm/latest/APIReference/Welcome.html
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "6"
    memory: 9Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - coreutils
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/amazon-ssm-agent
      tag: v${{package.version}}
      expected-commit: 09d1697b44e2858f7f0a417835cff87af5a38d1d

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        github.com/go-git/go-git/v5@v5.16.5

  - uses: patch
    with:
      patches: 0001-Add-more-distributions.patch 0002-Add-support-for-apk-installed-db.patch

  - runs: |
      go get ./agent/plugins/inventory/gatherers/application
      go get ./agent/backoffconfig
      go mod tidy
      go mod vendor

  - runs: |
      sed -i -e 's#const[ \s]*Version.*#const Version = "${{package.version}}"#g' agent/version/version.go

  - uses: go/build
    with:
      packages: ./core
      output: amazon-ssm-agent

  - uses: go/build
    with:
      packages: ./agent
      output: ssm-agent-worker

  - uses: go/build
    with:
      packages: ./agent/framework/processor/executer/outofproc/worker/
      output: ssm-document-worker

  - uses: go/build
    with:
      packages: ./agent/framework/processor/executer/outofproc/sessionworker/
      output: ssm-session-worker

  - uses: go/build
    with:
      packages: ./agent/session/logging/
      output: ssm-session-logger

  - uses: go/build
    with:
      packages: ./agent/cli-main/
      output: ssm-cli

  - name: create required dirs and files
    runs: |
      mkdir -p ${{targets.destdir}}/etc/amazon/ssm
      mkdir -p ${{targets.destdir}}/var/lib/amazon/ssm
      mkdir -p ${{targets.destdir}}/var/log/amazon/ssm
      mkdir -p ${{targets.destdir}}/usr/lib/systemd/system/
      cp README.md RELEASENOTES.md NOTICE.md ${{targets.destdir}}/etc/amazon/ssm/
      cp packaging/linux/amazon-ssm-agent.service ${{targets.destdir}}/usr/lib/systemd/system/
      cp amazon-ssm-agent.json.template ${{targets.destdir}}/etc/amazon/ssm/amazon-ssm-agent.json.template
      cp seelog_unix.xml ${{targets.destdir}}/etc/amazon/ssm/seelog.xml.template
      mkdir -p ${{targets.destdir}}/usr/lib/systemd/system-preset/
      echo "enable amazon-ssm-agent.service" >> ${{targets.destdir}}/usr/lib/systemd/system-preset/70-amazon-ssm-agent.preset

test:
  pipeline:
    - runs: |
        amazon-ssm-agent -version | grep ${{package.version}}
        amazon-ssm-agent -help
        # just prints error
        ssm-agent-worker -help
        # no help, but can run and not do much
        ssm-session-logger
        ssm-cli help
        # these binaries run in the background and don't exit
        ssm-document-worker
        ssm-session-worker

subpackages:
  - name: "amazon-ssm-agent-ecs-exec"
    description: "Amazon ECS exec requires copies of these SSM agent binaries that live in the ecs-agent container"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/var/lib/ecs/deps/execute-command/bin/${{package.version}}
          cp "${{targets.destdir}}"/usr/bin/amazon-ssm-agent "${{targets.subpkgdir}}"/var/lib/ecs/deps/execute-command/bin/${{package.version}}/
          cp "${{targets.destdir}}"/usr/bin/ssm-agent-worker "${{targets.subpkgdir}}"/var/lib/ecs/deps/execute-command/bin/${{package.version}}/
          cp "${{targets.destdir}}"/usr/bin/ssm-session-worker "${{targets.subpkgdir}}"/var/lib/ecs/deps/execute-command/bin/${{package.version}}/
    test:
      pipeline:
        - runs: |
            /var/lib/ecs/deps/execute-command/bin/${{package.version}}/amazon-ssm-agent -version | grep ${{package.version}}
            /var/lib/ecs/deps/execute-command/bin/${{package.version}}/amazon-ssm-agent -help
            /var/lib/ecs/deps/execute-command/bin/${{package.version}}/ssm-agent-worker -help
            /var/lib/ecs/deps/execute-command/bin/${{package.version}}/ssm-session-worker

update:
  enabled: true
  github:
    identifier: aws/amazon-ssm-agent
    strip-prefix: v
