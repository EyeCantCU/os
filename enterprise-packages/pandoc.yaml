package:
  name: pandoc
  version: "3.8.3"
  epoch: 1
  description: "The universal markup converter"
  copyright:
    - license: "GPL-2.0-or-later AND BSD-3-Clause AND MIT"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cabal-install
      - libffi-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: "https://github.com/jgm/pandoc"
      destination: "${{package.name}}"
      tag: "${{package.version}}"
      expected-commit: 568dab14533940ecee16824097400f1eabf13869

  # When updating to a new version, uncomment this and follow its instructions:
  # - working-directory: "${{package.name}}"
  #   uses: haskell/record-dependencies
  #
  - uses: haskell/fetch-dependencies

  - working-directory: "${{package.name}}"
    runs: cabal install -j"$(nproc)" --installdir="${{targets.destdir}}/usr/bin" --install-method=copy pandoc-cli

  - working-directory: "${{package.name}}"
    runs: cabal test -j"$(nproc)"

  - working-directory: "${{package.name}}"
    uses: haskell/install-cabal-freeze

  - uses: strip

update:
  enabled: true
  manual: true
  exclude-reason: "Requires manual updates using haskell/record-dependencies"
  github:
    identifier: jgm/pandoc

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: pandoc
    - uses: test/tw/ldd-check
    - name: Test markdown to HTML conversion
      runs: |
        # Test basic markdown heading conversion
        echo "# Test" | pandoc -f markdown -t html | grep -q "<h1"

        # Test inline formatting (bold/strong)
        echo "**bold**" | pandoc -f markdown -t html | grep -q "<strong>bold</strong>"

        # Test italic formatting
        echo "*italic*" | pandoc -f markdown -t html | grep -q "<em>italic</em>"

        # Test link conversion
        echo "[link](http://example.com)" | pandoc -f markdown -t html | grep -q 'href="http://example.com"'
