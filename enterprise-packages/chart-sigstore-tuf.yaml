package:
  name: chart-sigstore-tuf
  version: "0.1.29"
  epoch: 0
  description: A framework for securing software update systems - the scaffolding implementation
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sigstore/helm-charts
      tag: tuf-${{package.version}}
      expected-commit: cec2f33bc0b23a7c3ce6d150a0f9e72ce9a3889b

  - uses: charts/package
    with:
      chart-path: charts/tuf
      images: |
        scaffolding-server:
          values:
            deployment:
              registry: ${registry}
              repository: ${repo}
              version: ${digest}
      test: |
        cases:
          - name: default
            images: [scaffolding-server]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: sigstore/helm-charts
    strip-prefix: tuf-
    use-tag: true
    tag-filter-prefix: tuf-
