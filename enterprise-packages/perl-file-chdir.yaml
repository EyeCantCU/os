package:
  name: perl-file-chdir
  version: "0.1011"
  epoch: 0
  description: A more sensible way to change directories
  copyright:
    - license: Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/D/DA/DAGOLDEN/File-chdir-${{package.version}}.tar.gz
      expected-sha256: 31ebf912df48d5d681def74b9880d78b1f3aca4351a0ed1fe3570b8e03af6c79

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 2878

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Smoke test
      runs: echo "use File::chdir;" | perl
    - runs: |
        perl <<'EOF'
        use strict;
        use warnings;
        use File::chdir;
        use Cwd;

        # Test $CWD variable for changing directories
        my $original = cwd();
        print "Original directory: $original\n";

        # Change to /tmp using $CWD
        {
            local $CWD = '/tmp';
            my $current = cwd();
            die "Failed to change directory" unless $current eq '/tmp';
            print "Changed to: $current\n";
        }

        # Should be back to original after scope exit
        my $back = cwd();
        die "Failed to return to original directory" unless $back eq $original;
        print "Returned to: $back\n";

        print "File::chdir tests passed\n";
        EOF
