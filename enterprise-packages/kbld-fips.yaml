package:
  name: kbld-fips
  version: "0.47.2"
  epoch: 0 # CVE-2025-68119
  description: kbld seamlessly incorporates image building and image pushing into your development and deployment workflows
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: db19480a5f1ec901d38b304c24560b5783400c78
      repository: https://github.com/carvel-dev/kbld
      tag: v${{package.version}}

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/kbld
      output: kbld
      ldflags: -X carvel.dev/kbld/pkg/kbld/version.Version=v${{package.version}}

update:
  enabled: true
  github:
    identifier: carvel-dev/kbld
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: kbld
    - uses: test/tw/help-check
      with:
        bins: kbld
    - name: write config
      runs: |
        tee build.yml <<'EOF'
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: test
        spec:
          selector:
            matchLabels:
              app: test
          template:
            metadata:
              labels:
                app: test
            spec:
              containers:
              - name: my-app
                image: cgr.dev/chainguard/static
        EOF
    - name: run kbld
      # We do a very simple resolve here based on https://carvel.dev/kbld/docs/v0.44.x/resolving/
      # We don't do a full resolve+build, since this requires a Docker daemon.
      runs: |-
        set -euo pipefail
        output=$(kbld -f build.yml)
        # Verify kbld processed the manifest and resolved the image (fails test if missing)
        echo "$output" | grep -F "kind: Deployment"
        # Verify image reference is present in output (fails test if missing)
        echo "$output" | grep -F "cgr.dev/chainguard/static"
        echo "SUCCESS: kbld resolved the Kubernetes manifest"
