package:
  name: chart-iamguarded-kong
  version: "15.4.22"
  epoch: 1 # go/enterprise-rsc/chart-iamguarded-kong
  description: kong iamguarded chart
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - chart-iamguarded-cassandra
      - chart-iamguarded-common
      - chart-iamguarded-postgresql

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: kong/${{package.version}}
      expected-commit: cbb3bfac6abef5ff964ac0948593b486411682a6

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: patch
    with:
      patches: sync-postgresql-version.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/kong

  - uses: charts/package
    with:
      chart-path: iamguarded/kong

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: kong/
    use-tag: true
    tag-filter-prefix: kong/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /kong
