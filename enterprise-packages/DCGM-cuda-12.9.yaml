package:
  name: DCGM-cuda-12.9
  version: "4.4.2"
  epoch: 0
  description: "NVIDIA Data Center GPU Manager"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - fmt~10
      - ld-linux # so:ld-linux-x86-64.so.2 and so:ld-linux-aarch64.so.1=1
      # Actually DCGM upstream tries to build both cuda11 and cuda12
      # builds at the same time, force a single build for now.
      # Possibly need DCGM-cuda11 build, which does full build, but
      # then only keeps the compiled 11 code paths.
      - nvidia-cuda-cudart-${{vars.cuda-version}}
      - nvidia-dcgm-libdcgmmoduleprofiling
      - so:libc.so.6
      - so:libdl.so.2
      - so:libgcc_s.so.1
      - so:libm.so.6
      - so:libpthread.so.0
      - so:librt.so.1
      - so:libstdc++.so.6
      - so:libyaml-cpp.so.0.8
  options:
    no-depends: true

vars:
  cuda-version: 12.9

environment:
  contents:
    packages:
      - Catch2-2.13-dev
      - Catch2-2.13-static
      - bash
      # boost 1.86 we no longer have in melange, but we still have the APKs
      # the alternative is to use a newer boost APKs and patch the upstream code to be able to work with it
      # but that means manually rebasing the patches every upstream release. This seems easier.
      - boost-dev~1.86
      - boost-static~1.86
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - coreutils
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - fmt-dev~10
      - gcc~14
      - git-lfs
      - jsoncpp-dev
      - jsoncpp-static
      - libevent-dev
      - libevent-static
      - nvidia-libcublas-${{vars.cuda-version}}
      - nvidia-libcublas-${{vars.cuda-version}}-dev
      - plog-dev
      - plog-static
      - tclap
      - wolfi-baselayout
      - yaml-cpp-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/DCGM
      expected-commit: f0ec2156c5c0257e4644d70c853eb1e7bc90994a
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: |
        fix-link-ordering.patch
        coinstallability-workaround.patch
        fix-gettid.patch

  - runs: |
      git lfs install
      git lfs pull

  - runs: |
      # code has unused variables in C code
      sed -i 's|-Werror|-Wno-error|' CMakeLists.txt
      # Cannot currently coinstall, but can't easily disable a single cuda variant, so
      # we trick the system into building all cuda versions as our versioin
      sed -i 's|11.8|${{vars.cuda-version}}|' -i ./cmake/FindCuda.cmake
      sed -i 's|12.8|${{vars.cuda-version}}|' -i ./cmake/FindCuda.cmake
      sed -i 's|13.0|${{vars.cuda-version}}|' -i ./cmake/FindCuda.cmake

      # FindCuda expects a `target/<arch>` part of the path which we don't have
      sed -i '/unset(_Cuda_PATH)/ aset(_Cuda_TARGET_DIR "")' cmake/FindCuda.cmake

      # FindCuda doesn't look in /usr/local, so add it to the set of paths considered
      sed -i '/unset(_Cuda_PATH)/ alist(APPEND _Cuda_PATHS "/usr/local")' cmake/FindCuda.cmake

  - uses: cmake/configure
    with:
      opts: |
        -UDCGM_LIB_INSTALL_PREFIX \
        -UDCGM_PACKAGING \
        -UDCGM_PACKAGING_ENGINE \
        -DBUILD_TESTING=OFF \
        -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
        -DCMAKE_CXX_STANDARD=20

  - uses: cmake/build

  - uses: cmake/install

  - runs: |
      # Remove pre-built binaries (native and foreign arch)
      find ${{targets.destdir}}/usr/share/dcgm_tests -type f -executable -name '*_64bit' -delete
      find ${{targets.destdir}}/usr/share/dcgm_tests -type f -executable -name '*_aarch64' -delete
      find ${{targets.destdir}}/usr/share/dcgm_tests -type f -executable -name '*_ppc64le' -delete
      mv ${{targets.destdir}}/usr/sbin/* ${{targets.destdir}}/usr/bin/
      rmdir ${{targets.destdir}}/usr/sbin/

  - uses: strip

  - name: Remove cuda11 build, which was missbuilt with cuda12
    working-directory: ${{targets.contextdir}}
    runs: |
      rm usr/bin/dcgmproftester11
      rm usr/lib/libdcgm_cublas_proxy11.so*
      rm -r usr/libexec/datacenter-gpu-manager-4/plugins/cuda11
      rm -r usr/share/dcgm_tests/apps/nvvs/plugins/cuda11
      _arch=${{build.arch}}; case $_arch in x86_64) _arch="amd64" ;; aarch64) _arch="aarch64" ;; esac
      rm usr/share/dcgm_tests/apps/${_arch}/dcgmproftester11
      rm usr/share/dcgm_tests/apps/${_arch}/libdcgm_cublas_proxy11.so*

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/dcgm/sdk_samples
          mv ${{targets.destdir}}/usr/src/datacenter-gpu-manager-4/sdk_samples/c_src ${{targets.contextdir}}/usr/local/dcgm/sdk_samples
          # Move libdcgm_cublas_proxy12.so* to subpackage from mainpackage to optimise main package size
          mv ${{targets.destdir}}/usr/lib/libdcgm_cublas_proxy12.so* ${{targets.contextdir}}/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-tests
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share
          mv ${{targets.destdir}}/usr/share/dcgm_tests ${{targets.contextdir}}/usr/share
    test:
      pipeline:
        - name: "basic verification some files are in the expected path"
          runs: |
            stat /usr/share/dcgm_tests/__init__.py
            stat /usr/share/dcgm_tests/apps/__init__.py

  - name: ${{package.name}}-nvvs
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/libexec
          mv ${{targets.destdir}}/usr/libexec/datacenter-gpu-manager-4 ${{targets.contextdir}}/usr/libexec/datacenter-gpu-manager-4
    test:
      pipeline:
        - name: "basic verification some files are in the expected path"
          runs: |
            stat /usr/libexec/datacenter-gpu-manager-4/nvvs
            stat /usr/libexec/datacenter-gpu-manager-4/plugins/cuda12/nvbandwidth

update:
  enabled: true
  github:
    identifier: NVIDIA/DCGM
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: dcgmi nv-hostengine
    - uses: test/tw/help-check
      with:
        bins: dcgmi nv-hostengine
    - name: Run and test DCGM
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /var/run
          touch /var/run/nvhostengine.pid
        start: nv-hostengine --no-daemon
        timeout: 30
        expected_output: |
          Started host engine version
        post: |
          #!/bin/sh -e
          set -o pipefail
          dcgmi modules --list | grep -i Success
          dcgmi modules --list | grep -i Loaded
          dcgmi modules --list | grep -i Core
