package:
  name: chart-iamguarded-mlflow
  version: "5.1.13"
  epoch: 1
  description: Mlflow iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common
      - chart-iamguarded-minio
      - chart-iamguarded-postgresql

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: mlflow/${{package.version}}
      expected-commit: bfce8183f81689cab40257430166140f3d9b1d8c

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/mlflow

  - uses: charts/package
    with:
      chart-path: iamguarded/mlflow

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: mlflow/
    use-tag: true
    tag-filter-prefix: mlflow/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /mlflow
