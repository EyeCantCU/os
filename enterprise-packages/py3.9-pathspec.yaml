package:
  name: py3.9-pathspec
  version: "1.0.4"
  epoch: 0
  description: "Utility library for gitignore style pattern matching of file paths"
  copyright:
    - license: MPL-2.0
  dependencies:
    provider-priority: 0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3.9-build
      - py3.9-flit-core
      - py3.9-installer
      - py3.9-pip
      - py3.9-wheel
      - python-3.9

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/p/pathspec/pathspec-${{package.version}}.tar.gz
      expected-sha512: 1004dc55111a4cbf8767775894ed79da465598cd700afbeb96f6ef1f997dcb43cfba8af0b0a1de6232da9725a6e08577ce531da7faa16125c2b7bda0a378d5c3

  - uses: py/pip-build-install
    with:
      python: python3.9
      dest: ${{targets.contextdir}}

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: pathspec

update:
  enabled: true
  release-monitor:
    identifier: 23424
