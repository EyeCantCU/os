package:
  name: opentofu-fips-1.8
  version: "1.8.11"
  epoch: 9 # go/enterprise-rsc/opentofu-fips-1.8
  copyright:
    - license: MPL-2.0
  dependencies:
    provides:
      - opentofu-fips=${{package.full-version}}
  resources:
    cpu: "6"
    memory: 10Gi

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c4585918fa4946dd4ac73c8145898101a1adbadd
      repository: https://github.com/opentofu/opentofu
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/cloudflare/circl@v1.6.1
        github.com/hashicorp/go-getter@v1.7.9
        github.com/go-jose/go-jose/v3@v3.0.4
        github.com/go-viper/mapstructure/v2@v2.4.0
        github.com/golang-jwt/jwt/v4@v4.5.2
        github.com/ulikunitz/xz@v0.5.14
        golang.org/x/crypto@v0.45.0
        golang.org/x/oauth2@v0.27.0

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X 'github.com/opentofu/opentofu/version.dev=no'
      modroot: .
      output: tofu
      packages: ./cmd/tofu

update:
  enabled: true
  ignore-regex-patterns:
    - "rc"
    - "beta"
  github:
    identifier: opentofu/opentofu
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v1.8

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        tofu --version
        tofu --help
    - name: tofu Initialization
      runs: |
        echo "provider \"local\" {}" > example.tf
        tofu init -input=false || exit 1
    - name: tofu Plan Creation
      runs: |
        tofu plan -input=false -out=tfplan || exit 1
    - name: tofu Apply Execution
      runs: |
        tofu apply -input=false tfplan || exit 1
