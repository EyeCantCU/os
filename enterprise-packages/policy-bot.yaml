package:
  name: policy-bot
  version: "1.41.1"
  epoch: 1
  description: A GitHub App that enforces approval policies on pull requests
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.25
      - nodejs-20
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/palantir/policy-bot
      tag: v${{package.version}}
      expected-commit: 0d2b70a822f59a77f7a8d398a76011705337beb4

  - runs: |
      yarn install
      yarn run build:production

      mkdir -p ${{targets.destdir}}/usr/bin
      mkdir -p ${{targets.destdir}}/config
      cp -R ./server/templates ${{targets.destdir}}/usr/bin
      cp -R ./build/static ${{targets.destdir}}/usr/bin
      cp -R ./config/policy-bot.example.yml ${{targets.destdir}}/config/policy-bot.yml

  - uses: go/build
    with:
      packages: ./
      output: policy-bot
      ldflags: -X github.com/palantir/policy-bot/version.version=${{package.version}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: palantir/policy-bot
    strip-prefix: v

test:
  pipeline:
    - name: Policy Bot Version Check
      runs: |
        policy-bot --help
        policy-bot server --help
