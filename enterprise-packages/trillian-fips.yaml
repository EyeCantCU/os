package:
  name: trillian-fips
  version: "1.7.2"
  epoch: 10 # CVE-2025-61732
  description: Merkle tree implementation used in Sigstore
  copyright:
    - license: Apache-2.0
  checks:
    disabled:
      - empty

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google/trillian
      tag: v${{package.version}}
      expected-commit: e7aca3cc3a83e222540555ca75ecc87cffccdd53

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

subpackages:
  - name: ${{package.name}}-logserver
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: ./cmd/trillian_log_server
          output: trillian_log_server
          ldflags: -w
          go-package: go-fips
      - uses: strip
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/help-check
          with:
            bins: trillian_log_server

  - name: ${{package.name}}-logsigner
    pipeline:
      - uses: go/build
        with:
          modroot: .
          packages: ./cmd/trillian_log_signer
          output: trillian_log_signer
          ldflags: -w
          go-package: go-fips
      - uses: strip
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/help-check
          with:
            bins: trillian_log_signer

update:
  enabled: true
  github:
    identifier: google/trillian
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
