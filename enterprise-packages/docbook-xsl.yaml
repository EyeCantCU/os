package:
  name: docbook-xsl
  version: 1.79.2
  epoch: 0
  description: Stylesheets for converting DocBook XML into HTML, man pages and other presentations
  copyright:
    - license: MIT

pipeline:
  - runs: |
      install_root="${{targets.destdir}}/usr/share/xml/docbook/xsl-ns-stylesheets"
      mkdir -p "${install_root}"

  - uses: fetch
    with:
      uri: https://github.com/docbook/xslt10-stylesheets/releases/download/release/${{package.version}}/docbook-xsl-${{package.version}}.tar.bz2
      expected-sha256: 316524ea444e53208a2fb90eeb676af755da96e1417835ba5f5eb719c81fa371
      directory: ${{targets.destdir}}/usr/share/xml/docbook/xsl-ns-stylesheets

  - runs: |
      cd "${{targets.destdir}}/usr/share/xml/docbook/xsl-ns-stylesheets"
      rm -rf tools test

test:
  pipeline:
    - uses: test/tw/contains-files
      with:
        files: |
          /usr/share/xml/docbook/xsl-ns-stylesheets/VERSION.xsl
          /usr/share/xml/docbook/xsl-ns-stylesheets/manpages/docbook.xsl
          /usr/share/xml/docbook/xsl-ns-stylesheets/html/docbook.xsl
          /usr/share/xml/docbook/xsl-ns-stylesheets/fo/docbook.xsl
          /usr/share/xml/docbook/xsl-ns-stylesheets/common/common.xsl
          /usr/share/xml/docbook/xsl-ns-stylesheets/manpages/param.xsl
          /usr/share/xml/docbook/xsl-ns-stylesheets/manpages/html-synop.xsl
          /usr/share/xml/docbook/xsl-ns-stylesheets/html/param.xsl
          /usr/share/xml/docbook/xsl-ns-stylesheets/lib/lib.xsl
          /usr/share/xml/docbook/xsl-ns-stylesheets/html/titlepage.templates.xsl

subpackages:
  - name: docbook-xsl-doc
    description: Documentation for DocBook XSL stylesheets
    pipeline:
      - runs: |
          install_root="${{targets.destdir}}/usr/share/xml/docbook/xsl-ns-stylesheets"

          docdir="${{targets.subpkgdir}}/usr/share/doc/docbook-xsl"
          mkdir -p "${docdir}"

          # Move any top-level directories under install_root whose name starts with "doc"
          for d in "${install_root}"/doc*; do
            [ -d "$d" ] || continue
            echo "Moving $(basename "$d") from base package to doc subpackage"
            mv "$d" "${docdir}/"
          done

          cd "${install_root}"
          mv AUTHORS README* NEWS* REL* "${docdir}/"
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: docbook/xslt10-stylesheets
    use-tag: true
    tag-filter: 'release/'
    strip-prefix: 'release/'
