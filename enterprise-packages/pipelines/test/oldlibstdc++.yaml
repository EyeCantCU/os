name: oldlibstdc++

needs:
  packages:
    - binutils
    - gawk
    - posix-libc-utils

inputs:
  oldlib:
    description: |
      Path to a libstdc++.so which provides the target ABI
    required: true
  newlib:
    description: |
      Path to a libstdc++.so that contains symbols beyond the target ABI
    required: true
  nonsharedlib:
    description: |
      Path to a libstdc++_nonshared.a, which provides the ABI delta between oldlib and newlib
    required: true
  cc:
    description: |
      Path to the compiler to use to run the test
    required: false
    default: gcc
  cc-prefix-dir:
    description: |
      Path to the compiler's install prefix
    required: false
    default: ""
  expected-nonshared-missing:
    description: |
      A list of symbols (mangled names) that are expected to be missing from the nonsharedlib
    required: false
    default: ""
  expected-nonshared-extra:
    description: |
      A list of extraneous symbols (mangled names) expected to be included in the nonsharedlib
    required: false
    default: ""

pipeline:
  - name: "check that the nonshared lib contains the expected symbol delta"
    runs: |
      exitcode=0
      tmpdir="$(mktemp -d)"
      trap 'rm -rf $tmpdir' EXIT

      # cargo-culted from https://git.almalinux.org/rpms/gcc-toolset-14-gcc/src/commit/62cb63d4a3ddb6b77a5a69794f2b8f76c3a25ad1/SPECS/gcc.spec#L1149
      extract_abilist() {
        local lib="$1"

        readelf -Ws "${lib}" | sed -n '/\.symtab/,$d;/ UND /d;/@GLIBC_PRIVATE/d;/\(GLOBAL\|WEAK\|UNIQUE\)/p' | awk '{ if ($4 == "OBJECT") { printf "%s %s %s %s %s\n", $8, $4, $5, $6, $3 } else { printf "%s %s %s %s\n", $8, $4, $5, $6 }}' | sed 's/ UNIQUE / GLOBAL /;s/ WEAK / GLOBAL /;s/@@GLIBCXX_\(LDBL_\)\?[0-9.]*//;s/@@CXXABI_TM_[0-9.]*//;s/@@CXXABI_FLOAT128//;s/@@CXXABI_\(LDBL_\)\?[0-9.]*//' | LC_ALL=C sort -u
      }

      extract_abilist "${{inputs.oldlib}}" > "$tmpdir/oldlib.abilist"
      extract_abilist "${{inputs.newlib}}" > "$tmpdir/newlib.abilist"

      # generate a list of symbols that are only in the newlib
      comm -1 -3 "$tmpdir/oldlib.abilist" "$tmpdir/newlib.abilist" > "$tmpdir/only-in-new.abilist"

      if [ -n "${{inputs.cc-prefix-dir}}" ]; then
        prefix_arg="-B ${{inputs.cc-prefix-dir}}"
      else
        prefix_arg=""
      fi
      GCC_SPEC_FILE=/dev/null "${{inputs.cc}}" $prefix_arg -shared -o "$tmpdir/libstdc++_nonshared.so" -Wl,--whole-archive "${{inputs.nonsharedlib}}" -Wl,--no-whole-archive "${{inputs.oldlib}}"
      extract_abilist "$tmpdir/libstdc++_nonshared.so" > "$tmpdir/nonshared.abilist"
      echo ====================NONSHARED=========================
      ldd -d -r "$tmpdir/libstdc++_nonshared.so"
      ldd -u "$tmpdir/libstdc++_nonshared.so"
      if grep -e 'CXXABI_' -e 'GLIBCXX_' "$tmpdir/nonshared.abilist"; then
        echo "ERROR: nonshared library should not expose CXXABI_* GLIBCXX_* versioned symbols" 1>&2
        exitcode=1
      fi
      comm -2 -3 "$tmpdir/only-in-new.abilist" "$tmpdir/nonshared.abilist" | \
        grep -v "^CXXABI_" | grep -v "^GLIBCXX_" > "$tmpdir/nonshared-missing.abilist"
      cp "$tmpdir/nonshared-missing.abilist" "$tmpdir/nonshared-missing.abilist.orig"
      for sym in ${{inputs.expected-nonshared-missing}}; do
        cp "$tmpdir/nonshared-missing.abilist" "$tmpdir/nonshared-missing.abilist.orig"
        test -n "$sym" || continue
        sed -i "/^${sym} /d" "$tmpdir/nonshared-missing.abilist"
        if diff "$tmpdir/nonshared-missing.abilist" "$tmpdir/nonshared-missing.abilist.orig" > /dev/null; then
          echo "ERROR: expected-nonshared-missing symbol not found: ${sym}" 1>&2
          exitcode=1
        fi
      done
      if test -s "$tmpdir/nonshared-missing.abilist"; then
        echo "ERROR: Unexpected missing nonshared symbols:" 1>&2
        cat "$tmpdir/nonshared-missing.abilist" 1>&2
        exitcode=1
      fi
      comm -1 -3 "$tmpdir/only-in-new.abilist" \
        "$tmpdir/nonshared.abilist" > "$tmpdir/nonshared-extra"
      for sym in ${{inputs.expected-nonshared-extra}}; do
        cp "$tmpdir/nonshared-extra" "$tmpdir/nonshared-extra.orig"
        test -n "$sym" || continue
        sed -i "/^${sym} /d" "$tmpdir/nonshared-extra"
        if diff "$tmpdir/nonshared-missing.abilist" "$tmpdir/nonshared-missing.abilist.orig" > /dev/null; then
          echo "ERROR: expected-nonshared-extra symbol not found: ${sym}" 1>&2
          exitcode=1
        fi
      done
      if test -s "$tmpdir/nonshared-extra"; then
        echo "ERROR: Unexpected extra nonshared symbols:" 1>&2
        cat "$tmpdir/nonshared-extra" 1>&2
        exitcode=1
      fi
      readelf -Ws "${{inputs.nonsharedlib}}" | grep -v __dso_handle | grep HIDDEN.*UND && exitcode=1
      echo ====================NONSHARED END=====================
      exit $exitcode
