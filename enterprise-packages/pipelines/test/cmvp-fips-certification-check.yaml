name: Check CMVP FIPS certification status

needs:
  packages:
    - busybox
    - wget

inputs:
  validation-status:
    description: |
      validation status to check: Active, Historical, Revoked
    required: true
    default: Active
  certificate-number:
    description: |
      certificate number to check
    required: true
  software-version:
    description: |
      software version to check
    required: false

pipeline:
  - name: "check CMVP FIPS certification status"
    runs: |
      # Downloading search results
      wget -q -O cmvp.html 'https://csrc.nist.gov/projects/cryptographic-module-validation-program/validated-modules/search?SearchMode=Advanced&CertificateNumber=${{inputs.certificate-number}}&CertificateStatus=${{inputs.validation-status}}&SoftwareVersions=${{inputs.software-version}}'
      # Scrape for the result (NB: ^M line ending)
      grep "^.* certificates match the search criteria" cmvp.html
      # Match on the exact value (NB: ^M line ending)
      grep -q "^ *1 certificates match the search criteria" cmvp.html
