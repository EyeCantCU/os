name: Build and install an out of tree kernel module

needs:
  packages:
    - bison
    - build-base
    - busybox
    - ca-certificates-bundle
    - coreutils
    - diffutils
    - elfutils
    - elfutils-dev
    - findutils
    - flex
    - gawk
    - gmp
    - gmp-dev
    - gnutar
    - kmod
    - mpc
    - mpc-dev
    - mpfr
    - mpfr-dev
    - openssl
    - openssl-dev
    - pahole
    - pahole-dev
    - perl
    - python3
    - wolfi-base
    - zstd

inputs:
  headers:
    description: The kernel headers directory, or partial version flavor to use.
    required: false
  chdir:
    description: Change directory to the kernel headers directory before building
    default: true
    required: false
  clean:
    description: |
      Run `make clean` after installing.
      For dealing with build systems which do not detect and rebuild when changing headers.
    default: false
    required: false

pipeline:
  - runs: |
      kdir="${{inputs.headers}}"
      if [ "$kdir" = "" ]; then
        kdir=$(find /usr/lib/modules -name build -print -quit)
      elif [ ! -d "$kdir" ]; then
        kdir=$(find /usr/lib/modules/ -name *"$kdir"* -print -quit)
        [ -z "$kdir" ] && { echo "could not find headers matching ${{inputs.headers}}"; exit 1; }
        kdir="$kdir"/build
      fi

      export KERNEL_UNAME=$(basename $(dirname "$kdir"))

      chdir_args=""
      if [ "${{inputs.chdir}}" = "true" ]; then
        chdir_args="-C '$kdir'"
      fi
      make $chdir_args M="$PWD" -j$(nproc) modules
      # Keep this more or less in sync with the modules.yaml pipeline
      make $chdir_args M="$PWD" INSTALL_MOD_DIR=extra \
        INSTALL_MOD_PATH="${{targets.contextdir}}/usr" INSTALL_MOD_STRIP=1 ZSTD="zstd -19" modules_install

      # Drop depmod generated files, we'll generate them again at image build time.
      find "${{targets.contextdir}}"/usr/lib/modules/ -name 'modules.*' -delete

      # TODO(a-crate): sign with ephemeral keys. The kernel build system should do this,
      # but something is broken.
      if [ "${{inputs.clean}}" = "true" ]; then
        make $chdir_args clean
      fi
