name: Test that a kernel config includes options set by a config snippet

needs:
  packages:
    - busybox
    - apk-tools

inputs:
  config-path:
    default: "auto"
    description: "Path to kernel config. Default is to find ^boot/config-* in the package under test."
  snippet:
    description: "Config snippet name to test for"
    required: true
  x86_64_exclude:
    description: "Ignore these options from the cloud config snippet"
  aarch64_exclude:
    description: "Ignore these options from the cloud config snippet"

pipeline:
  - name: "check for required kernel config options"
    runs: |
      if [ "${{inputs.config-path}}" = "auto" ]; then
        kconf_path=/$(apk info -L ${{context.name}} | grep "^boot/config-")
      else
        kconf_path="${{inputs.config-path}}"
      fi
      echo "Using kernel config $kconf_path"

      exclude_options="${{inputs.x86_64_exclude}}"
      if [ "${{build.arch}}" = "aarch64" ]; then
          exclude_options="${{inputs.aarch64_exclude}}"
      fi

      exclude_expr=""
      for exclude in $(echo "$exclude_options" | grep -Ev '^#|$^'); do
        if [ -z ${exclude_expr} ]; then
          exclude_expr="${exclude}"
        else
          exclude_expr="${exclude_expr}|${exclude}"
        fi
      done
      [ -n "$exclude_expr" ] && exclude_expr="(${exclude_expr})"

      # Do some cleanup to make both these work:
      # config-options: FOO BAR
      # config-options: |
      #   FOO
      #   BAR
      # and allow comments in multiline input.
      # Add CONFIG_ where it's not specified, and if the user specified CONFIG_*=?
      # without an explicit option, assume y or m is ok.
      cleanup_input() {
        input_options=$(echo "$@" | grep -Ev '^#|$^')
        if [ -n "$exclude_expr" ]; then
            input_options=$(echo "$input_options" | grep -Ev "$exclude_expr")
        fi
        for kconf_opt in $input_options; do
          case "$kconf_opt" in
            "CONFIG_"*)
              ;;
            *)
              kconf_opt="CONFIG_${kconf_opt}"
              ;;
          esac
          case "$kconf_opt" in
            "CONFIG_"*"="*)
              ;;
            *"=")
              kconf_opt="${kconf_opt}[ym]"
              ;;
            *)
              kconf_opt="${kconf_opt}=[ym]"
              ;;
          esac
          printf "$kconf_opt "
        done
      }
      EXIT=0

      config_options="$(cat config-${{inputs.snippet}})"

      for kconf_opt in $(cleanup_input "$config_options"); do
        if ! grep -Ex "$kconf_opt" "$kconf_path"; then
          EXIT=1
          echo "Missing $kconf_opt"
        fi
      done

      exit $EXIT
