name: modprobe

needs:
  packages:
    - bash
    - busybox
    - perl # for extract-module-sig.pl
    - openssl
    - zstd

inputs:
  module:
    description: Filename match of modules to verify (find -name argument)
    required: true
  certificate:
    description: Filename of certificate to verify
    required: false
    default: '*.x509'

pipeline:
  - name: Test kernel module signature verification
    runs: |
      set +x
      certificates=$(find /usr/lib/modules -name "${{inputs.certificate}}")
      [ -z "$certificates" ] && { echo "No certificates found"; exit 1; }

      modules=$(find /usr/lib/modules -name "${{inputs.module}}")
      [ -z "$modules" ] && { echo "No modules found"; exit 1; }

      echo "Verifying modules: $modules"
      echo "with certificates: $certificates"

      for m in $modules; do
        ok=false
        for c in $certificates; do
          echo "Trying to verify $(basename $m) with $(basename $c)"
          ./scripts/verify-mod-cert "$m" "$c" && { ok=true; break; }
        done
        [ "$ok" = "true" ] || unverified_modules="$unverified_modules $(basename $m)"
      done

      [ -z "$unverified_modules" ] || { echo "Could not verify signatures for $unverified_modules"; exit 1; }
