package:
  name: chart-iamguarded-postgresql-ha
  version: "16.0.3"
  epoch: 0
  description: PostgreSQL cluster iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: postgresql-ha/${{package.version}}
      expected-commit: c995d17abcf310a3f843bf21ce9004598f6c8b8e

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/postgresql-ha

  - uses: charts/package
    with:
      chart-path: iamguarded/postgresql-ha

update:
  enabled: false
  manual: true
  schedule:
    period: daily
    reason: Update automation doesn't yet support automating from private repos.
  git:

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /postgresql-ha
