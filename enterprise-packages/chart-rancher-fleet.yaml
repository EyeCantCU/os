package:
  name: chart-rancher-fleet
  version: "0.14.3"
  epoch: 0
  description: Fleet Controller - GitOps at Scale
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rancher/fleet
      tag: v${{package.version}}
      expected-commit: 7c2c7e3b2b7c7c90eed31ac71d5dc8d07b6f12a5

  # The source chart has placeholder versions (0.0.0) and dev image tags.
  # Replicate upstream's release process: update versions, tags in values.yaml
  # and package with the correct version via helm package --version.
  - runs: |
      sed -i "s/tag: dev/tag: v${{package.version}}/g" charts/fleet/values.yaml
      yq -i '.appVersion = "${{package.version}}"' charts/fleet/Chart.yaml

  - uses: charts/package
    with:
      chart-path: charts/fleet
      images: |
        fleet:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
        fleet-agent:
          values:
            agentImage:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [fleet, fleet-agent]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: rancher/fleet
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
