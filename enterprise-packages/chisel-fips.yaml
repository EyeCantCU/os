package:
  name: chisel-fips
  version: "1.11.3"
  epoch: 6 # CVE-2025-61731
  description: Chisel is a fast TCP/UDP tunnel over HTTP
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jpillora/chisel
      tag: v${{package.version}}
      expected-commit: d56938d7a26e5ee9f50f390822a6a334ad8fd70d

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: .
      output: chisel
      go-package: go-fips
      ldflags: |
        -X github.com/jpillora/chisel/share.BuildVersion=${{package.version}}
        -buildid='$(git rev-parse HEAD)'

update:
  enabled: true
  github:
    identifier: jpillora/chisel
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
        - redis
        - redis-cli
        - wait-for-port
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: chisel
    - uses: test/tw/help-check
      with:
        bins: chisel
    - runs: |
        set -euo pipefail
        redis-server --port 7777 </dev/null >/dev/null 2>/dev/null &
        chisel server </dev/null >/dev/null 2>/dev/null &

        # ensure background processes are running, wait 1s more
        wait-for-port 7777
        wait-for-port 8080
        sleep 1

        chisel client http://127.0.0.1:8080 6379:localhost:7777 </dev/null >/dev/null 2>/dev/null &

        # ensure background processes are running, wait 1s more
        wait-for-port 6379
        sleep 1

        # set value without chisel proxy
        redis-cli -p 7777 SET a b

        # get value back using chisel proxy (fails test if tunnel broken)
        redis-cli GET a | grep -F b

        # Cleanup - processes may already be dead
        pkill chisel || true
        pkill redis-server || true
