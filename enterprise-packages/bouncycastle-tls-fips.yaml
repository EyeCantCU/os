package:
  name: bouncycastle-tls-fips
  # renovate: datasource=maven depName=org.bouncycastle:bctls-fips versioning=maven
  version: "2.1.22"
  epoch: 3
  description: BouncyCastle FIPS TLS APIs
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://repo1.maven.org/maven2/org/bouncycastle/bctls-fips/${{package.version}}/bctls-fips-${{package.version}}.jar
      expected-sha512: 7af89150b7b6ad23a3e8859976cd4e7cf8e152c16f8a376760b94a77b02b6f3072dc6d0a1ad916e5a28190b3e25c8f92a0720dd040bbb94fb9d1dd72df9492f3
      extract: false

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/java/bouncycastle-fips
      cp bctls-fips-${{package.version}}.jar ${{targets.destdir}}/usr/share/java/bouncycastle-fips/bctls-fips.jar

test:
  environment:
    contents:
      packages:
        - openjdk-17-default-jvm
        - openjdk-17-default-jdk
    environment:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk
  pipeline:
    - name: Verify JAR file exists
      runs: |
        set -euo pipefail
        # Verify the JAR file was installed (fails test if missing)
        stat /usr/share/java/bouncycastle-fips/bctls-fips.jar
    - name: Verify JAR is valid and loadable
      runs: |
        set -euo pipefail
        # Verify JAR is a valid Java archive with expected JSSE package structure
        jar tf /usr/share/java/bouncycastle-fips/bctls-fips.jar | grep -F "org/bouncycastle/jsse" || {
          echo "FAIL: JAR does not contain expected org.bouncycastle.jsse classes"
          exit 1
        }
    - uses: java-fips/algorithms
      with:
        java-version: "17"

update:
  enabled: false
  exclude-reason: |
    Please upgrade this always. Note this jar is outside of FIPS
    boundary, and should always be updated to latest published version
    on maven. There is no git repository where one can track version
    numbers for it, as the upstream repo is private. Unless we write a
    maven version tracker.
