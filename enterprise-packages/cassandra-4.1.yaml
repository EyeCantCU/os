package:
  name: cassandra-4.1
  version: "4.1.10"
  epoch: 2
  description: Open Source NoSQL Database
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - curl # required by application
      - jemalloc
      - python-${{vars.python-version}} # needed for cqlsh
    provides:
      - cassandra=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

vars:
  python-version: 3.11
  java-version: 11

environment:
  contents:
    packages:
      - ant
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - openjdk-${{vars.java-version}}-default-jdk
      - python-${{vars.python-version}}
  environment:
    JAVA_HOME: /usr/lib/jvm/java-${{vars.java-version}}-openjdk
    CASSANDRA_USE_JDK11: true

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/cassandra
      expected-commit: d48bfcce442489de45797ecdf3bde7574ade42d5
      tag: cassandra-${{package.version}}

  - uses: patch
    with:
      # Bumps snakeyaml, jackson-databind and commons-lang3 to mitigate a bunch of CVEs
      patches: bumpdeps.patch

  - runs: |
      ant artifacts -Dversion=${{package.version}}

      # Install cassandra from the tarball in build/dist into the destdir in /usr/share/java/cassandra
      mkdir -p "${{targets.destdir}}"/usr/share/java/cassandra
      tar --strip-components 1 -C "${{targets.destdir}}"/usr/share/java/cassandra -xzf build/apache-cassandra-${{package.version}}-bin.tar.gz

      # Remove pre-built binaries for architectures we don't support.
      find . -name "libsigar*" | grep -vE '(amd64|arm64|x86)-linux' | xargs rm -f

      # Symlink everything in the cassandra bin directory into /usr/bin
      mkdir -p "${{targets.destdir}}"/usr/bin/

      for f in /home/build/build/dist/bin/*; do
        filename=$(basename "$f")
        ln -sf  /usr/share/java/cassandra/bin/"$filename" "${{targets.destdir}}"/usr/bin/"$filename"
      done

      mkdir -p ${{targets.destdir}}/var/lib/cassandra
      mkdir -p ${{targets.destdir}}/var/log/cassandra

      ln -sT /var/lib/cassandra/ "${{targets.destdir}}"/usr/share/java/cassandra/data
      ln -sT /var/log/cassandra/ "${{targets.destdir}}"/usr/share/java/cassandra/logs

subpackages:
  - name: ${{package.name}}-compat
    dependencies:
      provides:
        - cassandra-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/etc
          ln -sf /opt/cassandra/conf ${{targets.subpkgdir}}/etc/cassandra
          mkdir -p ${{targets.subpkgdir}}/opt
          ln -sf /usr/share/java/cassandra ${{targets.subpkgdir}}/opt/cassandra
    # test added by a robot (compat)
    test:
      pipeline:
        - runs: |
            readlink -v /etc/cassandra
            readlink -v /opt/cassandra

  - name: ${{package.name}}-iamguarded-compat
    dependencies:
      provides:
        - cassandra-iamguarded-compat=${{package.full-version}}
      runtime:
        - cassandra-${{vars.major-minor-version}}
        - python-${{vars.python-version}}
        - dash-binsh
        - posix-libc-utils
        - coreutils
        - bash
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: cassandra
          version: ${{vars.major-minor-version}}
      - runs: |
          mkdir -p /opt/iamguarded/cassandra/bin /iamguarded/cassandra /opt/iamguarded/java
          chmod g+rwX /opt/iamguarded

          ln -s /usr/bin/cassandra /opt/iamguarded/cassandra/bin/cassandra
          ln -s /usr/bin/cassandra.in.sh /opt/iamguarded/cassandra/bin/cassandra.in.sh
          ln -s /usr/bin/cqlsh /opt/iamguarded/cassandra/bin/cqlsh
          ln -s /usr/bin/cqlsh.py /opt/iamguarded/cassandra/bin/cqlsh.py
          ln -s /usr/bin/debug-cql /opt/iamguarded/cassandra/bin/debug-cql
          ln -s /usr/bin/nodetool /opt/iamguarded/cassandra/bin/nodetool
          ln -s /usr/bin/sstableloader /opt/iamguarded/cassandra/bin/sstableloader
          ln -s /usr/bin/sstablescrub /opt/iamguarded/cassandra/bin/sstablescrub
          ln -s /usr/bin/sstableupgrade /opt/iamguarded/cassandra/bin/sstableupgrade
          ln -s /usr/bin/sstableutil /opt/iamguarded/cassandra/bin/sstableutil
          ln -s /usr/bin/sstableverify /opt/iamguarded/cassandra/bin/sstableverify
          ln -s /usr/bin/stop-server /opt/iamguarded/cassandra/bin/stop-server

          ln -s /usr/share/java/cassandra/lib /opt/iamguarded/cassandra/lib
      - name: copy-files-to-dest
        runs: |
          # Create symlinks for all files and directories in /usr/lib/jvm/java-${{vars.java-version}}-openjdk/
          for item in /usr/lib/jvm/java-${{vars.java-version}}-openjdk/*; do
            # Get the base name of the item (file or directory)
            base_item=$(basename "$item")
            ln -s "$item" /opt/iamguarded/java/$base_item
          done
      - name: copy-conf-files
        runs: |
          # Copy conf files for iamguarded compatibility
          mkdir -p /opt/iamguarded/cassandra/
          cp -r ${{targets.destdir}}/usr/share/java/cassandra/conf /opt/iamguarded/cassandra/conf
          cp -r ${{targets.destdir}}/usr/share/java/cassandra/conf /opt/iamguarded/cassandra/conf.default
      - uses: iamguarded/finalize-compat
        with:
          package: cassandra
          version: ${{vars.major-minor-version}}
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: cassandra
            version: ${{vars.major-minor-version}}

update:
  enabled: true
  github:
    identifier: apache/cassandra
    use-tag: true
    tag-filter-prefix: cassandra-4.1
    strip-prefix: cassandra-

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-compat
        - bash
        - coreutils
        - openjdk-${{vars.java-version}}-default-jvm
    environment:
      LANG: en_US.UTF-8
      CASSANDRA_HOME: /opt/cassandra
      CASSANDRA_CONF: /opt/cassandra/conf
      CASSANDRA_LOGS_DIR: /opt/cassandra/logs
      PATH: /usr/sbin:/sbin:/usr/bin:/bin:/opt/cassandra/bin/
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: |
          cqlsh
          cqlsh.py
          stop-server
    - runs: |
        cqlsh --version
        cqlsh.py --version
        stop-server -h
    - name: "Test Cassandra server startup"
      uses: test/daemon-check-output
      with:
        start: |
          cassandra -R -f
        timeout: 120
        expected_output: |
          Startup complete
        post: |
          set -o pipefail
          # Basic connectivity test
          nodetool status | grep -F "UN"

          # Run CQL operations
          cqlsh -e "CREATE KEYSPACE IF NOT EXISTS test_ks
            WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"

          cqlsh -e "CREATE TABLE IF NOT EXISTS test_ks.test_table
            (id uuid PRIMARY KEY, value text);"

          cqlsh -e "INSERT INTO test_ks.test_table (id, value)
            VALUES (uuid(), 'test_value');"

          # Verify data
          cqlsh -e "SELECT value FROM test_ks.test_table;" | grep -F "test_value"

          # Check node tools
          nodetool info | grep -F "Native Transport active"
