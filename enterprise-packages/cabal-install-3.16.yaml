package:
  name: cabal-install-3.16
  version: "3.16.0.0"
  epoch: 1
  description: "Command-line interface to Haskell package management"
  copyright:
    - license: "BSD-3-Clause"
  dependencies:
    runtime:
      - ghc<9.16
      - ghc>=9.12
    provides:
      - cabal-install=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      # Self-dependency.  See git history for cabal-install-stage0 and
      # cabal-install-* bootstrap chain.
      - cabal-install~3.16
      - libffi-dev
      - zlib-dev

vars:
  project-file: "cabal.release.project"

pipeline:
  - runs: ghc-pkg recache --global

  - uses: git-checkout
    with:
      repository: "https://github.com/haskell/cabal"
      destination: "${{package.name}}"
      tag: "cabal-install-v${{package.version}}"
      expected-commit: "651120c958f8dd6ec63f4717f9a7e2e868ba5a64"

  # When updating to a new version, uncomment this and follow its instructions:
  # - working-directory: "${{package.name}}"
  #   uses: haskell/record-dependencies
  #   with:
  #     project-file: "${{vars.project-file}}"
  #
  - uses: haskell/fetch-dependencies

  - working-directory: "${{package.name}}"
    runs: cabal install -j"$(nproc)" --project-file="${{vars.project-file}}" --installdir="${{targets.destdir}}/usr/bin" --install-method=copy cabal-install

  - uses: strip

update:
  enabled: true
  manual: true
  exclude-reason: "Requires manual updates using haskell/record-dependencies"
  github:
    identifier: haskell/cabal
    strip-prefix: "cabal-install-v"
    tag-filter-prefix: "cabal-install-v3.16."

test:
  pipeline:
    - runs: cabal --version
    - uses: test/tw/ldd-check
