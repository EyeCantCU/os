package:
  name: backup-restore-operator-fips-8.1
  version: "8.1.2"
  epoch: 2 # GHSA-9h8m-3fm2-qjrq
  description: FIPS-compliant Rancher Backup Restore Operator for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openssl-config-fipshardened
    provides:
      - backup-restore-operator=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rancher/backup-restore-operator
      tag: v${{package.version}}
      expected-commit: 8fd8f0421e435587f7d22517f060e5a8055e77ad

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/operator/main.go
      output: backup-restore-operator
      ldflags: |
        -X github.com/rancher/backup-restore-operator/cmd/operator/version.Version=${{package.version}}
        -X github.com/rancher/backup-restore-operator/cmd/operator/version.GitCommit=$(git rev-parse HEAD)
        -X github.com/rancher/backup-restore-operator/cmd/operator/version.Date=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        -w

update:
  enabled: true
  ignore-regex-patterns:
    - .*-rc.*
  github:
    identifier: rancher/backup-restore-operator
    strip-prefix: v
    tag-filter: v8.1

test:
  environment:
    environment:
      OPERATOR_NAMESPACE: "cattle-resources-system"
  pipeline:
    - uses: test/go-fips-check
    - uses: test/kwok/cluster
    - name: Start operator daemon
      uses: test/daemon-check-output
      with:
        timeout: 60
        setup: |
          # Install CRDs
          kubectl apply -f https://raw.githubusercontent.com/rancher/backup-restore-operator/refs/tags/v${{package.version}}/charts/rancher-backup-crd/templates/backup.yaml
          kubectl apply -f https://raw.githubusercontent.com/rancher/backup-restore-operator/refs/tags/v${{package.version}}/charts/rancher-backup-crd/templates/restore.yaml
          kubectl apply -f https://raw.githubusercontent.com/rancher/backup-restore-operator/refs/tags/v${{package.version}}/charts/rancher-backup-crd/templates/resourceset.yaml
        start: backup-restore-operator
        expected_output: |
          Starting backup-restore-operator version
          Starting resources.cattle.io/v1, Kind=Backup controller
          Starting resources.cattle.io/v1, Kind=Restore controller
