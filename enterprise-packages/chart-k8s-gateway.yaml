package:
  name: chart-k8s-gateway
  version: "3.4.1"
  epoch: 0
  description: A Helm chart for the k8s_gateway CoreDNS plugin
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/k8s-gateway/k8s_gateway
      tag: k8s-gateway-${{package.version}}
      expected-commit: 582488df5a575c59655891b0415eb4c71acc1432

  - uses: charts/package
    with:
      chart-path: charts/k8s-gateway
      images: |
        k8s-gateway:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${pseudo_tag}
      test: |
        values:
          domain: example.com
        cases:
          - name: default
            images: [k8s-gateway]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: k8s-gateway/k8s_gateway
    strip-prefix: k8s-gateway-
    use-tag: true
    tag-filter-prefix: k8s-gateway-
