package:
  name: chart-falcosecurity-falcosidekick
  version: "0.13.0"
  epoch: 0
  description: Connect Falco to your ecosystem
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/falcosecurity/charts
      tag: falcosidekick-${{package.version}}
      expected-commit: 383e8694be63df3c37aa248186419d69b8869fdd

  - uses: charts/package
    with:
      chart-path: charts/falcosidekick
      images: |
        falcosidekick:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${pseudo_tag}
        falcosidekick-ui:
          values:
            webui:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${pseudo_tag}
        falcosidekick-ui-init:
          values:
            webui:
              initContainer:
                image:
                  registry: ${registry}
                  repository: ${repo}
                  tag: ${pseudo_tag}
        falcosidekick-ui-redis:
          values:
            webui:
              redis:
                image:
                  registry: ${registry}
                  repository: ${repo}
                  tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [falcosidekick]
          - name: with-webui
            images: [falcosidekick, falcosidekick-ui, falcosidekick-ui-init, falcosidekick-ui-redis]
            values:
              webui:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: falcosecurity/charts
    strip-prefix: falcosidekick-
    use-tag: true
    tag-filter-prefix: falcosidekick-
