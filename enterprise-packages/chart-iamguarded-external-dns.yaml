package:
  name: chart-iamguarded-external-dns
  version: "9.0.3"
  epoch: 2
  description: external-dns iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: external-dns/${{package.version}}
      expected-commit: 3260dbca771ef1979e4e950a9abbf5ce8f4e2ba2

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: patch
    with:
      patches: helpers.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/external-dns

  - uses: charts/package
    with:
      chart-path: iamguarded/external-dns

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: external-dns/
    use-tag: true
    tag-filter-prefix: external-dns/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /external-dns
