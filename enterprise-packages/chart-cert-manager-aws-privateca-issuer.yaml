package:
  name: chart-cert-manager-aws-privateca-issuer
  version: "1.8.0"
  epoch: 0
  description: An addon for cert-manager to sign certificates using AWS PCA
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/aws-privateca-issuer
      tag: v${{package.version}}
      expected-commit: 0ce98d6fbf29cb577593cbb75482dbd0ff5c6e61

  - uses: charts/package
    with:
      chart-path: charts/aws-pca-issuer
      images: |
        aws-privateca-issuer:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [aws-privateca-issuer]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: cert-manager/aws-privateca-issuer
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
