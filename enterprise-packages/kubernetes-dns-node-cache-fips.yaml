package:
  name: kubernetes-dns-node-cache-fips
  version: "1.26.5"
  epoch: 2 # GHSA-47m2-4cr7-mhcw
  description: NodeLocal DNSCache improves Cluster DNS performance by running a DNS caching agent on cluster nodes as a DaemonSet.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7c36dd0000bf118392e932b3429f01f169fba5a3
      repository: https://github.com/kubernetes/dns
      tag: ${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/coredns/coredns@v1.12.4
        github.com/quic-go/quic-go@v0.54.1
      replaces: |-
        k8s.io/client-go=k8s.io/client-go@v0.34.1 k8s.io/api=k8s.io/api@v0.34.1 k8s.io/apimachinery=k8s.io/apimachinery@v0.34.1

  - uses: go/build
    with:
      ldflags: -X github.com/kubernetes/dns/pkg/version.Version=v${{package.version}}
      output: node-cache
      packages: ./cmd/node-cache
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: kubernetes/dns
    strip-prefix: v
    use-tag: true

test:
  environment:
  pipeline:
    - runs: |
        node-cache --help
    - uses: test/go-fips-check
