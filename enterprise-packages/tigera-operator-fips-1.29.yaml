package:
  name: tigera-operator-fips-1.29
  version: 1.29.8
  epoch: 31 # CVE-2025-61732
  description: Kubernetes operator for installing Calico and Calico Enterprise
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # for fips config & fips-provider
      - openssl-config-fipshardened
      # either melange SCA should provide these
      # or we should make go-fips shared link on these
      - so:libcrypto.so.3
      - so:libssl.so.3

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c7865358f5dc98b210ac759c7495137fdbc37b02
      repository: https://github.com/tigera/operator
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        google.golang.org/protobuf@v1.33.0
        github.com/elastic/cloud-on-k8s/v2@2.4.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: .
      output: operator
      ldflags: -X github.com/tigera/operator/version.VERSION=v${{package.version}}
      go-package: go-fips

update:
  enabled: true
  git:
    tag-filter-prefix: v1.29.
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - name: Check if binary exists
      runs: |
        if [ ! -x "$(command -v operator)" ]; then
          echo "Error: operator binary not found!"
          exit 1
        fi
        echo "Operator binary found."
    - name: Verify version output
      runs: |
        EXPECTED_VERSION="Operator: v${{package.version}}"
        if ! operator --version 2>&1 | grep -q "$EXPECTED_VERSION"; then
          echo "Error: Version mismatch! Expected '$EXPECTED_VERSION' in output."
          operator --version 2>&1  # Print full output for debugging
          exit 1
        fi
        echo "Version check passed."
    - name: Validate basic execution
      runs: |
        if ! operator --help > /dev/null 2>&1; then
          echo "Error: Operator help command failed!"
          exit 1
        fi
        echo "Operator help command executed successfully."
