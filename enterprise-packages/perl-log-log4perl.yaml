package:
  name: perl-log-log4perl
  version: "1.57"
  epoch: 2 # go/enterprise-rsc/perl-log-log4perl
  description: Log4j implementation for Perl
  copyright:
    - license: Artistic-1.0-Perl
  resources:
    cpu: "1"
    memory: 2Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mschilli/log4perl.git
      tag: ${{package.version}}
      expected-commit: 6be9a6f5e34c597718012bd40fd64ca2684a8145

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  environment:
    contents:
      packages:
        - perl
  pipeline:
    - name: Smoke test
      runs: echo "use Log::Log4perl;" | perl
    - runs: |
        OUTPUT_LOGFILE="$(mktemp)"
        tee log4perl.conf <<EOF
        log4perl.logger.linky              = WARN,  FileAppndr1
        log4perl.appender.FileAppndr1      = Log::Log4perl::Appender::File
        log4perl.appender.FileAppndr1.filename = ${OUTPUT_LOGFILE}
        log4perl.appender.FileAppndr1.layout   = Log::Log4perl::Layout::SimpleLayout
        EOF

        perl <<'EOF'
        use Log::Log4perl qw(:easy);
        Log::Log4perl->easy_init($ERROR);
        Log::Log4perl::init('./log4perl.conf');

        $logger = Log::Log4perl->get_logger('linky.logger');
        $logger->warn('example linky warning');
        $logger->error('example linky error');
        $logger->fatal('example linky fatal');
        EOF

        grep -F -e "WARN - example linky warning" "${OUTPUT_LOGFILE}"
        grep -F -e "ERROR - example linky error" "${OUTPUT_LOGFILE}"
        grep -F -e "FATAL - example linky fatal" "${OUTPUT_LOGFILE}"
