package:
  name: flux-notification-controller-fips
  version: "1.8.1"
  epoch: 1 # GHSA-9h8m-3fm2-qjrq
  description: The GitOps Toolkit event forwarded and notification dispatcher
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 10Gi

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 52ecadcd98943eb5d976c4ee8cd9ba52819ae17a
      repository: https://github.com/fluxcd/notification-controller
      tag: v${{package.version}}

  - runs: |
      goversion=$(go version | awk '{print $3}' | sed 's/go//')
      sed -i "s/^go .*/go ${goversion}/" go.mod
      sed -i '/toolchain /d' go.mod
      go mod tidy

  - uses: go/bump
    with:
      deps: |-
        github.com/cloudflare/circl@v1.6.3
        go.opentelemetry.io/otel/sdk@v1.40.0

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/bin
      CGO_ENABLED=1 go build \
        -ldflags="-X main.Version=${{package.version}}" \
        -trimpath -a -o "${{targets.destdir}}"/usr/bin/notification-controller .

  - uses: strip

update:
  enabled: true
  github:
    identifier: fluxcd/notification-controller
    strip-prefix: v
    tag-filter: v

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/kwok/cluster
    - name: Launch controller with kwok cluster
      uses: test/daemon-check-output
      with:
        setup: |
          kubectl apply -f https://github.com/fluxcd/notification-controller/releases/download/v${{package.version}}/notification-controller.crds.yaml
          kubectl wait --for=condition=Ready nodes --all
        start: notification-controller --health-addr :9441 --metrics-addr :8081
        timeout: 30
        expected_output: |
          Starting Controller
          Starting workers
        post: |
          curl --silent --fail localhost:8081/metrics
          curl --silent --fail localhost:9441/healthz
