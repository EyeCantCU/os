package:
  name: emsdk
  version: "5.0.1"
  epoch: 0
  description: Emscripten SDK - Toolchain for compiling C/C++ to WebAssembly
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ant
      - bash
      - build-base
      - busybox
      - cmake
      - curl
      - emscripten
      - git
      - libidn2
      - libxml2
      - make
      - openjdk-${{vars.java-version}}-default-jvm # https://github.com/emscripten-core/emsdk/blob/main/docker/Dockerfile#L106
      - openssh-client
      - py3-pip
      - tzdata
      - unzip
      - wget
      - zip

vars:
  java-version: 11

environment:
  contents:
    packages:
      - busybox
      - emscripten

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/emscripten-core/emsdk
      tag: ${{package.version}}
      expected-commit: 14c18b569f55138fe4963924162244251f454fb0

  - runs: |
      # Install emsdk scripts to /emsdk
      mkdir -p "${{targets.destdir}}"/emsdk/upstream

      # Copy essential files for emsdk to work
      cp emsdk emsdk.py "${{targets.destdir}}"/emsdk/
      cp emsdk_manifest.json emscripten-releases-tags.json "${{targets.destdir}}"/emsdk/
      cp legacy-emscripten-tags.txt legacy-binaryen-tags.txt llvm-tags-64bit.txt "${{targets.destdir}}"/emsdk/
      cp emsdk_env.sh "${{targets.destdir}}"/emsdk/

      for item in /upstream/*; do
        ln -sf "$item" "${{targets.destdir}}"/emsdk/upstream/
      done

      # Create .emsdk_version so that `emsdk construct_env` (called by the
      # entrypoint via emsdk_env.sh) recognises the toolchain as installed and
      # active.  Without this file, adjusted_path() strips /emsdk/upstream/emscripten
      # from PATH because no tools are detected as active.
      # This is important as emsdk tools are not installed with the sdk but with apk!
      COMMIT_HASH=$(grep "\"${{package.version}}\":" emscripten-releases-tags.json | sed 's/.*": "//;s/".*//')
      echo "releases-${COMMIT_HASH}-64bit" > "${{targets.destdir}}"/emsdk/upstream/.emsdk_version

  # Create .emscripten config matching upstream Docker image layout
  # https://github.com/emscripten-core/emsdk/blob/main/docker/Dockerfile
  - runs: |
      tee "${{targets.destdir}}"/emsdk/.emscripten << 'EOF'
      import os
      emsdk_path = os.path.dirname(os.path.abspath(__file__))
      NODE_JS = '/usr/bin/node'
      LLVM_ROOT = emsdk_path + '/upstream/bin'
      BINARYEN_ROOT = emsdk_path + '/upstream'
      EMSCRIPTEN_ROOT = emsdk_path + '/upstream/emscripten'
      EOF

subpackages:
  - name: emsdk-oci-entrypoint
    description: OCI entrypoint for emsdk container images
    dependencies:
      runtime:
        - emsdk
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/emsdk/docker/
          install -Dm755 docker/entrypoint.sh "${{targets.subpkgdir}}"/emsdk/docker/entrypoint.sh
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            files: |
              /emsdk/docker/entrypoint.sh

test:
  pipeline:
    - name: Verify emscripten binary version
      runs: |
        export PATH=/upstream/emscripten:$PATH
        ## The ver-check pipeline will look for binaries versioned same as the package
        ## but as defined in /upstream/emscripten/emscripten-version.txt, this approach won't work for this version of the application
        emcc --version
        em++ --version
        emar --version
    - uses: test/tw/contains-files
      with:
        files: |
          /emsdk/upstream
          /emsdk/upstream/.emsdk_version
          /emsdk/upstream/emscripten/emcc
          /emsdk/upstream/emscripten/em++
          /emsdk/upstream/bin/clang
          /emsdk/upstream/bin/wasm-ld
    - name: "Test emsdk upstream layout"
      runs: |
        set -euo pipefail

        # Verify /emsdk/upstream is a real directory matching upstream Docker layout
        test -d /emsdk/upstream

        # Verify LLVM symlinks point to system LLVM
        readlink /emsdk/upstream/bin/clang | grep -F "/usr/bin"
        readlink /emsdk/upstream/bin/wasm-ld | grep -F "/usr/bin"
    - name: "Test WebAssembly compilation"
      runs: |
        set -euo pipefail
        export PATH=/upstream/emscripten:$PATH

        # Compile a simple C program to WebAssembly
        echo 'int main() { return 0; }' > test.c
        emcc test.c -o test.js

        # Verify output was created
        stat test.js
        stat test.wasm
    - name: "Test library linking"
      runs: |
        set -euo pipefail
        export PATH=/upstream/emscripten:$PATH
        tee add.cpp << 'EOF'
        int add(int a, int b) { return a + b; }
        EOF
        tee main.cpp << 'EOF'
        #include <iostream>
        int add(int,int);
        int main(){ std::cout << add(2,3) << std::endl; }
        EOF
        em++ -c add.cpp -o add.o
        emar rcs libadd.a add.o
        emar t libadd.a | grep -F "add.o"

        # Compile to WebAssembly
        em++ main.cpp -L. -ladd -o main.js -sENVIRONMENT=node -sEXIT_RUNTIME=1
        stat main.js
        stat main.wasm

        # Run with node
        node main.js | grep -F 5

update:
  enabled: true
  github:
    identifier: emscripten-core/emsdk
    use-tag: true
