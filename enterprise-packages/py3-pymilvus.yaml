package:
  name: py3-pymilvus
  version: "2.6.9"
  epoch: 0
  description: Python SDK for Milvus vector database
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: pymilvus
  import: pymilvus

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-python-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/milvus-io/pymilvus
      tag: v${{package.version}}
      expected-commit: 93bd7d75da6963878435d933f6af6dcdf73135e0

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-cachetools
        - py${{range.key}}-grpcio
        - py${{range.key}}-orjson
        - py${{range.key}}-protobuf
        - py${{range.key}}-python-dotenv
        - py${{range.key}}-pandas
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - git
            - py${{range.key}}-pytest
            - py${{range.key}}-numpy
            - py${{range.key}}-pandas
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Run upstream tests
          runs: |
            git clone --depth=1 --branch v${{package.version}} https://github.com/milvus-io/pymilvus.git
            cd pymilvus/tests
            # Run tests that don't require a running Milvus server or pytest-benchmark
            python${{range.key}} -m pytest test_types.py test_utils.py test_cache.py test_ts_utils.py -v
            cd ../..
            rm -rf pymilvus

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  github:
    identifier: milvus-io/pymilvus
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/byproductpackage
