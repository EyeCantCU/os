package:
  name: trust-manager-fips
  version: "0.20.3"
  epoch: 2 # go/enterprise-rsc/trust-manager-fips
  description: trust-manager is an operator for distributing trust bundles across a Kubernetes cluster.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 9Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - docker
      - go-fips
      - rsync
      - wolfi-baselayout
  environment:
    CGO_ENABLED: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/trust-manager
      tag: v${{package.version}}
      expected-commit: 596512c47007e2b303be9a592265bb66e530f1ef
      destination: trust-manager

  - uses: go/build
    with:
      packages: ./cmd/trust-manager
      output: trust-manager
      go-package: go-fips
      modroot: trust-manager

subpackages:
  - name: "trust-package-fips"
    description: "Utility for copying trust packages from bundles"
    pipeline:
      - uses: go/build
        with:
          packages: .
          output: copyandmaybepause
          modroot: trust-manager/trust-packages/debian
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/help-check
          with:
            bins: /usr/bin/copyandmaybepause
        - name: Test file copying functionality
          runs: |
            set -euo pipefail
            # Create test directories
            mkdir -p /tmp/test-input /tmp/test-output

            # Create test JSON files
            echo '{"test": "data1"}' > /tmp/test-input/file1.json
            echo '{"test": "data2"}' > /tmp/test-input/file2.json

            # Create non-JSON file (should be ignored)
            echo "not json" > /tmp/test-input/file.txt

            # Run copyandmaybepause
            copyandmaybepause /tmp/test-input /tmp/test-output

            # Verify JSON files were copied
            stat /tmp/test-output/file1.json
            stat /tmp/test-output/file2.json

            # Verify non-JSON file was not copied (should fail)
            ! stat /tmp/test-output/file.txt

            # Verify content matches
            grep -F '"test": "data1"' /tmp/test-output/file1.json
            grep -F '"test": "data2"' /tmp/test-output/file2.json

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
        - openssl
        - git
        - curl
  pipeline:
    - runs: |
        trust-manager --help
    - uses: test/go-fips-check
    - uses: test/kwok/cluster
    - name: "Check Core functionality"
      uses: test/daemon-check-output
      with:
        setup: |
          # Clone trust-manager repo and install CRDs
          git clone --depth=1 https://github.com/cert-manager/trust-manager.git
          kubectl apply -f trust-manager/deploy/crds/
          kubectl config view --minify --raw > /tmp/kubeconfig.yaml
          # Verify CRDs are installed
          kubectl get crds | grep -F trust.cert-manager.io
          # Create webhook certificates
          mkdir -p /tmp/trust-manager-certs
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/trust-manager-certs/tls.key \
            -out /tmp/trust-manager-certs/tls.crt -days 365 -nodes \
            -subj "/CN=trust-manager-webhook" \
            -addext "subjectAltName=DNS:trust-manager-webhook,DNS:localhost,IP:127.0.0.1"
          chmod 644 /tmp/trust-manager-certs/tls.crt
          chmod 600 /tmp/trust-manager-certs/tls.key
        start: |
          trust-manager \
            --kubeconfig /tmp/kubeconfig.yaml \
            --leader-elect=false \
            --log-level=5 \
            --webhook-certificate-dir=/tmp/trust-manager-certs \
            --webhook-host=127.0.0.1 \
            --webhook-port=9443 \
            --metrics-port=9402 \
            --readiness-probe-port=6060
        expected_output: |
          Starting Controller
          Starting workers
        timeout: 30
        post: |
          set -euo pipefail
          curl -fsS http://localhost:6060/readyz | grep -F "ok"
          curl -fsS http://localhost:9402/metrics | grep -F "controller_runtime"
          kubectl create namespace cert-manager
          # Create test CA certificate
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/test-ca.key \
            -out /tmp/test-ca.crt -days 365 -nodes \
            -subj "/CN=Test-CA/O=Trust-Manager-Test"
          kubectl create configmap test-ca-bundle --from-file=ca.crt=/tmp/test-ca.crt -n cert-manager
          kubectl get configmap test-ca-bundle -n cert-manager -o yaml
          kubectl label namespace cert-manager trust-manager=enabled
          # Create Bundle resource
          cat > /tmp/test-bundle.yaml << 'EOF'
          apiVersion: trust.cert-manager.io/v1alpha1
          kind: Bundle
          metadata:
            name: test-bundle
            namespace: cert-manager
          spec:
            sources:
            - configMap:
                name: test-ca-bundle
                key: ca.crt
            target:
              configMap:
                key: ca-bundle.crt
              namespaceSelector:
                matchLabels:
                  trust-manager: enabled
          EOF
          kubectl apply -f /tmp/test-bundle.yaml
          sleep 15
          # Verify Bundle was created
          kubectl get bundles -n cert-manager | grep -F "test-bundle"

update:
  enabled: true
  github:
    identifier: cert-manager/trust-manager
    strip-prefix: v
    tag-filter: v
