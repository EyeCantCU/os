package:
  name: logstash-exporter-fips
  version: "1.9.1"
  epoch: 5 # go/enterprise-rsc/logstash-exporter-fips
  description: Prometheus exporter for Logstash written in Go
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips
  environment:
    GITHUB_REPO: "github.com/kuskoman/logstash-exporter"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5761d02ccb04473925aec08935567dae0210d129
      repository: https://github.com/kuskoman/logstash-exporter
      tag: v${{package.version}}

  - uses: go/build
    with:
      packages: ./cmd/exporter/main.go
      ldflags: |
        -X ${GITHUB_REPO}/config.Version="${{package.version}}"
        -X ${GITHUB_REPO}/config.GitCommit="$(git rev-parse --short HEAD)"
        -X ${GITHUB_REPO}/config.BuildDate="$(date -d@${SOURCE_DATE_EPOCH} -u +%Y-%m-%dT%H:%M:%SZ)"
      output: logstash-exporter
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - '-pre*'
  github:
    identifier: kuskoman/logstash-exporter
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - runs: |
        logstash-exporter -version
    - uses: test/go-fips-check
