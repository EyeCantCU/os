package:
  name: kubernetes-csi-node-driver-registrar-2.14
  version: "2.14.0"
  epoch: 7 # CVE-2025-61725
  description: Sidecar container that registers a CSI driver with the kubelet using the kubelet plugin registration mechanism.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - kubernetes-csi-node-driver-registrar=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8bd83d14abc6a2abfeccaa87da919615a4ebc70e
      repository: https://github.com/kubernetes-csi/node-driver-registrar
      tag: v${{package.version}}

  - uses: go/build
    with:
      ldflags: -X main.version=v${{package.version}} -extldflags '-static'
      output: csi-node-driver-registrar
      packages: ./cmd/csi-node-driver-registrar
      vendor: "true"

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          # The helm chart expects the binaries to be in / instead of /usr/bin
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/csi-node-driver-registrar ${{targets.subpkgdir}}/csi-node-driver-registrar
    dependencies:
      provides:
        - kubernetes-csi-node-driver-registrar-compat=${{package.full-version}}
    description: Compatibility package to place binaries in the location expected by upstream helm charts
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: kubernetes-csi-node-driver-registrar-compat
            real-pkg-name: ${{subpkg.name}}

update:
  enabled: true
  github:
    identifier: kubernetes-csi/node-driver-registrar
    strip-prefix: v
    tag-filter: v2.14.

test:
  pipeline:
    # Verify version and help output using reusable pipelines
    - uses: test/tw/ver-check
      with:
        bins: csi-node-driver-registrar
    - uses: test/tw/help-check
      with:
        bins: csi-node-driver-registrar
    # Test flag validation: running without required flags should show usage info
    - name: Test missing required flags error
      runs: |
        # Running with no flags should fail and show required flag information
        if output=$(csi-node-driver-registrar 2>&1); then
          echo "ERROR: Expected failure when running without required flags"
          exit 1
        fi
        # Should mention the required csi-address flag
        echo "$output" | grep -iE "csi-address|usage|required|flag" || {
          echo "ERROR: Expected helpful message about required flags"
          echo "Actual output: $output"
          exit 1
        }
        echo "Missing flags correctly rejected"
    # Test configuration parsing with socket paths
    - name: Test socket path flag parsing
      runs: |
        # Create a dummy socket path directory
        mkdir -p /tmp/csi-test

        # Test with non-existent socket path (should fail gracefully)
        if output=$(csi-node-driver-registrar \
          --csi-address=/tmp/nonexistent/csi.sock \
          --kubelet-registration-path=/var/lib/kubelet/plugins/test/csi.sock \
          2>&1); then
          # If it starts, stop it
          echo "Binary started (unexpected), may have tried to connect"
        else
          # Should fail with meaningful error about socket
          echo "Binary failed as expected with unavailable socket"
          echo "$output" | grep -iE "connect|socket|dial|error|fail" || {
            echo "ERROR: Expected connection-related error message"
            echo "Actual output: $output"
            exit 1
          }
        fi
        echo "Socket path parsing works correctly"
    # Test invalid socket path rejection
    - name: Test invalid socket path handling
      runs: |
        # Empty csi-address should be rejected
        if output=$(csi-node-driver-registrar --csi-address= 2>&1); then
          # If command succeeds, something is wrong
          echo "ERROR: Should reject empty csi-address"
          exit 1
        fi
        echo "Empty csi-address correctly rejected"
    # Test plugin registration path validation
    - name: Test kubelet-registration-path validation
      runs: |
        mkdir -p /tmp/csi-socket-dir

        # Test with valid-looking paths (will fail to connect but should parse correctly)
        output=$(csi-node-driver-registrar \
          --csi-address=/tmp/csi-socket-dir/csi.sock \
          --kubelet-registration-path=/var/lib/kubelet/plugins/csi-driver/csi.sock \
          --plugin-registration-path=/registration \
          2>&1) || true

        # The binary should attempt to use these paths - verify it processes the flags
        # It will fail because there's no actual CSI driver, but parsing should work
        echo "Kubelet registration path flags are accepted and parsed"
    # Test health port flag
    - name: Test health-port flag parsing
      runs: |
        # Start with health port and let it fail on CSI connection
        output=$(timeout 2 csi-node-driver-registrar \
          --csi-address=/tmp/nonexistent.sock \
          --kubelet-registration-path=/var/lib/kubelet/plugins/test/csi.sock \
          --health-port=9809 \
          2>&1) || true

        # Should not complain about the health-port flag itself
        if echo "$output" | grep -i "unknown.*health-port"; then
          echo "ERROR: health-port flag should be recognized"
          exit 1
        fi
        echo "Health port flag accepted correctly"
