package:
  name: ruby3.4-fluent-plugin-cloudwatch-logs
  version: "0.15.0"
  epoch: 0
  description: CloudWatch Logs Plugin for Fluentd
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ruby3.4-aws-sdk-cloudwatchlogs
      - ruby3.4-fluentd
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-3.4
      - ruby-3.4-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7ba7bb820c7c9335b6d591af3d64e1a5cbd7a909
      repository: https://github.com/fluent-plugins-nursery/fluent-plugin-cloudwatch-logs.git
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

vars:
  gem: fluent-plugin-cloudwatch-logs

update:
  enabled: true
  github:
    identifier: fluent-plugins-nursery/fluent-plugin-cloudwatch-logs
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ruby3.4-fluentd
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: fluent/plugin/out_cloudwatch_logs
    - runs: |
        ruby -e "require 'fluent/plugin/in_cloudwatch_logs'"
        ruby -e "require 'fluent/plugin/out_cloudwatch_logs'"
    - name: Validate plugin loads in fluentd
      runs: |
        set -euo pipefail
        tee /tmp/test.conf <<'EOF'
        <source>
          @type cloudwatch_logs
          region us-east-1
          log_group_name test
          use_tag_as_stream true
          tag cloudwatch
        </source>

        <match **>
          @type cloudwatch_logs
          region us-east-1
          log_group_name test
          log_stream_name_key stream_name
        </match>
        EOF
        fluentd --dry-run -c /tmp/test.conf
