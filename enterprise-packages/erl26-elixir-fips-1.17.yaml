package:
  name: erl26-elixir-fips-1.17
  version: "1.17.3"
  epoch: 2
  description: General-purpose programming language and runtime environment
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: ${{vars.erlMM}}
    runtime:
      - erlang-fips-${{vars.erlMM}}
    provides:
      - elixir-fips=${{package.full-version}}
      - elixir-fips-1.17=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox
      - erlang-fips-${{vars.erlMM}}-dev
  environment:
    # suppresses this message: "the VM is running with native name encoding of latin1 which may cause Elixir to malfunction as it expects utf8. Please ensure your locale is set to UTF-8 (which can be verified by running "locale" in your shell) or set the ELIXIR_ERL_OPTIONS="+fnu" environment variable"
    ELIXIR_ERL_OPTIONS: "+fnu"

var-transforms:
  - from: ${{package.name}}
    match: ^erl(\d\d+)-.*
    replace: $1
    to: erlMM

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 78f63d08313677a680868685701ae79a2459dcc1
      repository: https://github.com/elixir-lang/elixir
      tag: v${{package.version}}

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

update:
  enabled: true
  github:
    identifier: elixir-lang/elixir
    strip-prefix: v
    tag-filter-prefix: v1.17

test:
  environment:
    environment:
      ELIXIR_ERL_OPTIONS: "+fnu"
    contents:
      packages:
        - curl
        - erlang-fips-${{vars.erlMM}}-dev
        - openssl-config-fipshardened
        - erl${{vars.erlMM}}-rebar3
        - wait-for-it
  pipeline:
    - uses: test/virtualpackage
      with:
        real-pkg-name: "${{package.name}}"
        virtual-pkg-name: elixir-fips
    - uses: test/tw/ver-check
      with:
        bins: |
          elixir
          elixirc
          iex
          mix
    - uses: test/tw/help-check
      with:
        bins: mix
    - name: Verify Erlang version compatibility
      runs: |
        set -euo pipefail
        # Verify elixir was compiled with the correct Erlang/OTP version
        elixir --version | grep -F "compiled with Erlang/OTP ${{vars.erlMM}}"
    - name: Ensure FIPS provider functionality
      runs: |
        set -euo pipefail
        # Verify FIPS provider is available (fails test if not found)
        elixir -e "IO.inspect(:crypto.info())" | grep -F "fips_provider_available: true"
        tee bad_hash.exs <<EOF
        :crypto.enable_fips_mode(true)
        :crypto.hash(:md5, "Linky")
        EOF
        # MD5 should be rejected in FIPS mode - verify expected error message
        {
          elixir ./bad_hash.exs || true
        } 2>&1 | grep -F "Bad digest type in FIPS"
    - name: Basic script test
      runs: |
        set -euo pipefail
        ELIXIR_FILE="$(mktemp)"
        printf "%s" 'IO.puts("Hello, Wolfi!")' | tee "${ELIXIR_FILE}"

        # Verify script execution produces expected output (fails test if not found)
        elixir "${ELIXIR_FILE}" | grep -e "^Hello, Wolfi!$"
    - name: Web app test
      runs: |-
        set -euo pipefail
        mkdir -p ./zzz/lib/zzz ./zzz/test

        tee ./zzz/lib/zzz.ex <<'EOF'
        defmodule Zzz.Router do
          use Plug.Router

          plug :match
          plug :dispatch

          get "/" do
            send_resp(conn, 200, "Hello, Elixir!")
          end

          match _ do
            send_resp(conn, 404, "Not Found")
          end
        end
        EOF

        tee ./zzz/mix.exs <<'EOF'
        defmodule Zzz.MixProject do
          use Mix.Project

          def project do
            [
              app: :zzz,
              version: "0.1.0",
              elixir: "~> 1.15",
              start_permanent: Mix.env() == :prod,
              deps: deps()
            ]
          end

          def application do
            [
              extra_applications: [:logger],
              mod: {Zzz.Application, []}
            ]
          end

          defp deps do
            [
              {:plug_cowboy, "~> 2.7"}
            ]
          end
        end
        EOF

        HOST_IP=localhost
        HARDCODED_PORT=8888

        tee ./zzz/lib/zzz/application.ex <<EOF
        defmodule Zzz.Application do
          # See https://hexdocs.pm/elixir/Application.html
          # for more information on OTP Applications
          @moduledoc false

          use Application

          @impl true
          def start(_type, _args) do
            children = [
              {Plug.Cowboy, scheme: :http, plug: Zzz.Router, options: [port: ${HARDCODED_PORT}]}
            ]

            IO.puts("Starting server on http://${HOST_IP}:${HARDCODED_PORT}")
            # See https://hexdocs.pm/elixir/Supervisor.html
            # for other strategies and supported options
            opts = [strategy: :one_for_one, name: Zzz.Supervisor]
            Supervisor.start_link(children, opts)
          end
        end
        EOF

        printf "%s" "ExUnit.start()" | tee ./zzz/test/test_helper.exs

        cd zzz
        mix local.rebar rebar3 /usr/bin/rebar3
        mix deps.get
        mix release
        _build/dev/rel/zzz/bin/zzz daemon
        wait-for-it --strict -t 10 "${HOST_IP}:${HARDCODED_PORT}"
        # Verify web app responds correctly (fails test on HTTP error or missing content)
        curl -sf "${HOST_IP}:${HARDCODED_PORT}" | grep -F "Hello, Elixir!"
