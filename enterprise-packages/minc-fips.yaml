package:
  name: minc-fips
  version: 0.1.0
  description: "MicroShift in Container - deploy lightweight Kubernetes using Podman"
  epoch: 1 # CVE-2025-61726
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/minc-org/minc
      tag: v${{package.version}}
      expected-commit: f3ffdbfed3433690544d6b7e0d8e8cb1121329e5

  - uses: go/bump
    with:
      deps: |-
        github.com/go-viper/mapstructure/v2@v2.4.0
        golang.org/x/net@v0.38.0
        golang.org/x/oauth2@v0.27.0
      modroot: .

  - uses: go/build
    with:
      packages: ./cmd/minc
      output: minc
      ldflags: |
        -X github.com/minc-org/minc/pkg/constants.Version=${{package.version}}
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: minc-org/minc
    strip-prefix: v

# minc needs docker runtime to run since it creates a microshift cluster
# Similar to kind or k3d
test:
  environment:
    contents:
      packages:
        - podman
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: minc
    - uses: test/tw/ver-check
      with:
        bins: minc
    - name: "Bash completion test"
      runs: |
        minc completion bash > bash_completion.sh
        grep -qF "bash completion V2 for minc" bash_completion.sh
    - name: "Status check"
      runs: |
        minc status 2>&1 | grep -qF "stopped"
    - name: "Basic daemon test"
      uses: test/daemon-check-output
      with:
        start: minc create /dev/null 2>&1 &
        expected_output: |
          error creating cluster
