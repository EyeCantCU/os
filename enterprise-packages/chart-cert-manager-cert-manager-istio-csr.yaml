package:
  name: chart-cert-manager-cert-manager-istio-csr
  version: "0.15.0"
  epoch: 0
  description: istio-csr enables the use of cert-manager for issuing certificates in Istio service meshes
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/istio-csr
      tag: v${{package.version}}
      expected-commit: a4d4351d794981deb32b233060ac674f85d5fba8

  # Source chart has placeholder versions (v0.0.0) and commented-out image fields.
  # Replicate upstream's helm.mk build process:
  # - Set the prerelease annotation (helm.mk sets this before helm package)
  # - Set image.tag (helm_values_mutation_function in 00_mod.mk)
  # - Add image.digest field (commented out upstream, needed for digest pinning)
  - runs: |
      yq -i '.annotations."artifacthub.io/prerelease" = "false"' deploy/charts/istio-csr/Chart.yaml
      yq -i '.image.tag = "v${{package.version}}"' deploy/charts/istio-csr/values.yaml
      yq -i '.image.digest = ""' deploy/charts/istio-csr/values.yaml

  - uses: charts/package
    with:
      chart-path: deploy/charts/istio-csr
      chart-version: v${{package.version}}
      images: |
        cert-manager-istio-csr:
          values:
            image:
              repository: ${registry_repo}
              tag: ${tag}
              digest: ${digest}
      test: |
        cases:
          - name: default
            images: [cert-manager-istio-csr]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: cert-manager/istio-csr
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
