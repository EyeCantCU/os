# This is an unguarded package for a customer that is expected to have CVEs. Leave pinned to 2022.12.01.
package:
  name: re2-20221201
  version: "2022.12.01"
  epoch: 0
  description: Efficient, principled regular expression library
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provides:
      - re2=${{package.full-version}}

vars:
  # https://github.com/google/re2/blob/2022-12-01/CMakeLists.txt#L21-L23
  soversion: "10"

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: "-"
    to: mangled-package-version

environment:
  contents:
    packages:
      - abseil-cpp-20250127-dev
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - icu-dev
  environment:
    # https://github.com/wolfi-dev/os/issues/34075
    CMAKE_CXX_FLAGS: -fdelete-null-pointer-checks

pipeline:
  - uses: fetch
    with:
      expected-sha256: 665b65b6668156db2b46dddd33405cd422bd611352c5052ab3dae6a5fbac5506
      uri: https://github.com/google/re2/archive/${{vars.mangled-package-version}}.tar.gz

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_SHARED_LIBS=ON \
        -DCMAKE_CXX_FLAGS="$CMAKE_CXX_FLAGS" \
        -DRE2_USE_ICU=ON \
        -DRE2_BUILD_TESTING="OFF"

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: libre2-${{vars.soversion}}
    pipeline:
      - uses: split/lib
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    description: re2 dev
    dependencies:
      runtime:
        - abseil-cpp-20250127-dev
        - icu-dev
        - libre2-${{vars.soversion}}=${{package.full-version}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: false
  exclude-reason: "This is the last release from 2022"

test:
  pipeline:
    - uses: test/tw/emptypackage
