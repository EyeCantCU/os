package:
  name: py3.13-scanner-test-libraries
  version: 0.0.1
  epoch: 1
  description: A test package to be used with Chainguard Libraries.

environment:
  contents:
    packages:
      - py${{vars.python-version}}-build-base-dev
      - py${{vars.python-version}}-numpy
      - py${{vars.python-version}}-openvino-telemetry
      - py${{vars.python-version}}-packaging
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - py${{vars.python-version}}-wheel
      - python-${{vars.python-version}}
      - python-${{vars.python-version}}-dev

var-transforms:
  - from: ${{package.name}}
    match: 'py(\d+\.\d+)-.*'
    replace: "$1"
    to: python-version

pipeline:
  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

update:
  enabled: false
  exclude-reason: This is a test package and shouln't be updated automatically.

test:
  pipeline:
    - uses: test/tw/contains-files
      with:
        dir: "/usr/lib/python3.13/site-packages/urllib3-1.26.16+cgr.1.dist-info/"
        name: "*"
