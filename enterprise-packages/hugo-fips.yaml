package:
  name: hugo-fips
  version: "0.155.3"
  epoch: 1 # go/enterprise-rsc/hugo-fips
  description: The world's fastest framework for building websites.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "7"
    memory: 11Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gohugoio/hugo
      tag: v${{package.version}}
      expected-commit: 8a858213b73907e823e2be2b5640a0ce4c04d295

  - uses: go/build
    with:
      packages: .
      output: hugo
      tags: extended
      go-package: go-fips-md5

update:
  enabled: true
  github:
    identifier: gohugoio/hugo
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: hugo
    - uses: test/tw/help-check
      with:
        bins: hugo
    - name: Create a new Hugo site
      runs: hugo new site test-site
    - uses: test/daemon-check-output
      working-directory: test-site
      with:
        start: /usr/bin/hugo serve
        expected_output: "Web Server is available at"
        timeout: 10
