package:
  name: postgrest
  version: "14.4"
  epoch: 0
  description: "Serve a RESTful API from any PostgreSQL database"
  copyright:
    - license: "MIT"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cabal-install
      - libffi-dev
      - postgresql-dev
      - zlib-dev

var-transforms:
  - from: ${{package.version}}
    match: '^(\d+)\..*'
    replace: "$1"
    to: major-version

pipeline:
  - name: Validation for EVEN major version
    runs: |
      # https://docs.postgrest.org/en/v14/ says "Starting from v14.0, only
      # even-numbered MAJOR versions will be released, reserving odd-numbered
      # MAJOR versions for development".  Be careful to only update this to
      # even-numbered major versions.
      MAJOR=${{vars.major-version}}
      if [ $((MAJOR % 2)) -eq 0 ]; then
        echo "Major version is even, proceeding with build..."
      else
        echo "ERROR: Major version is odd, Stable releases are only for even-numbered major versions."
        echo "Odd versions are reserved for development and testing. see https://docs.postgrest.org/en/v14/"
        exit 1
      fi

  - uses: git-checkout
    with:
      repository: "https://github.com/PostgREST/postgrest"
      destination: "${{package.name}}"
      tag: "v${{package.version}}"
      expected-commit: "5485b8ca9a3214123a6fdd89ae3171542b23bade"

  # Override upstream to allow building with GHC 9.14.
  - working-directory: "${{package.name}}"
    runs: |
      cat >cabal.project.local <<EOF
      allow-newer: *:Cabal, *:base, *:containers, *:ghc, *:ghc-bignum, *:template-haskell, *:text, *:time
      package postgrest
        ghc-options: -Wno-error=incomplete-record-selectors
      EOF

  # When updating to a new version, uncomment this and follow its instructions:
  # - working-directory: "${{package.name}}"
  #   uses: haskell/record-dependencies
  #
  - uses: haskell/fetch-dependencies

  - working-directory: "${{package.name}}"
    runs: cabal install -j"$(nproc)" --installdir="${{targets.destdir}}/usr/bin" --install-method=copy exe:postgrest

  - working-directory: "${{package.name}}"
    uses: haskell/install-cabal-freeze

  - uses: strip

update:
  enabled: true
  exclude-reason: "Requires manual updates using haskell/record-dependencies"
  ignore-regex-patterns:
    - '^v\d*[13579]\.' # Ignoring odd versions
  github:
    identifier: PostgREST/postgrest
    strip-prefix: "v"
    tag-filter-prefix: "v"

# It's difficult to get the upstream test suite working, because it relies
# on a complex Nix setup.  We can at least run some smoke tests.
test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: postgrest
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: postgrest
