# Adpated from:
package:
  name: jujutsu
  version: "0.33.0"
  epoch: 0 # GHSA-xwfj-jgwm-7wp5
  description: Git-compatible distributed version control system
  copyright:
    - license: APACHE-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - rust

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jj-vcs/jj
      tag: v${{package.version}}
      expected-commit: 24f4e1083e8bcd6e5b8aaee3fa86e08cb7081d13

  - uses: rust/cargobump

  - uses: cargo/build
    with:
      output: jj

subpackages:
  - name: jujutsu-docs
    pipeline:
      - runs: |
          mkdir -p ${{targets.destdir}}/usr/share/man
          target/release/jj util install-man-pages ${{targets.destdir}}/usr/share/man
      - uses: split/manpages

test:
  pipeline:
    - runs: jj --help

update:
  enabled: true
  github:
    identifier: jj-vcs/jj
    use-tag: true
    strip-prefix: v
