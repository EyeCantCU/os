package:
  name: argo-cd-3.1
  version: "3.1.12"
  epoch: 5 # GHSA-9h8m-3fm2-qjrq
  description: Declarative continuous deployment for Kubernetes.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - argo-cd=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go
      - nodejs-20
      - patch
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/argoproj/argo-cd
      tag: v${{package.version}}
      expected-commit: a46152e850cb0d711bce22f562e646f9df22af9b

  - uses: go/bump
    with:
      deps: |-
        k8s.io/kubernetes@v1.33.6
        github.com/go-git/go-git/v5@v5.16.5
        github.com/cloudflare/circl@v1.6.3
        go.opentelemetry.io/otel/sdk@v1.40.0

  - runs: |
      cd ui
      yarn install
      yarn cache clean
      NODE_ENV='production' NODE_ONLINE_ENV='online' NODE_OPTIONS=--max_old_space_size=8192 yarn build

      cd ..

      # Our global LDFLAGS conflict with a Makefile parameter
      unset LDFLAGS
      # Our global `-pie` flag results in a binary that cannot be copied to a non chainguard image
      # Disable the `-pie` flag here since ArgoCD's helm charts like to copy around the multicall binary to different images (ie: dex)

      unset GOFLAGS

      make argocd-all

      mkdir -p ${{targets.destdir}}/usr/bin
      mv dist/argocd* ${{targets.destdir}}/usr/bin/

      ln -s /usr/bin/argocd ${{targets.destdir}}/usr/bin/argocd-server
      ln -s /usr/bin/argocd ${{targets.destdir}}/usr/bin/argocd-repo-server
      ln -s /usr/bin/argocd ${{targets.destdir}}/usr/bin/argocd-cmp-server
      ln -s /usr/bin/argocd ${{targets.destdir}}/usr/bin/argocd-application-controller
      ln -s /usr/bin/argocd ${{targets.destdir}}/usr/bin/argocd-notifications
      ln -s /usr/bin/argocd ${{targets.destdir}}/usr/bin/argocd-applicationset-controller
      ln -s /usr/bin/argocd ${{targets.destdir}}/usr/bin/argocd-k8s-auth
      ln -s /usr/bin/argocd ${{targets.destdir}}/usr/bin/argocd-commit-server

  - uses: strip

subpackages:
  - name: ${{package.name}}-repo-server
    description: "ArgoCD repo server"
    dependencies:
      runtime:
        - ${{package.name}}-compat
        - git
        - git-lfs
        - gnupg
        - gpg
        - gpg-agent
        - tzdata
        - helm~3
        - kustomize
        - openssh
      provides:
        - argo-cd-repo-server=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          cp hack/gpg-wrapper.sh "${{targets.subpkgdir}}"/usr/bin/gpg-wrapper.sh
          cp hack/git-verify-wrapper.sh "${{targets.subpkgdir}}"/usr/bin/git-verify-wrapper.sh
          cp entrypoint.sh "${{targets.subpkgdir}}"/usr/bin/uid_entrypoint.sh
          mkdir -p "${{targets.contextdir}}"/etc/ssh
          touch "${{targets.contextdir}}"/etc/ssh/ssh_known_hosts
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: argo-cd-repo-server
            real-pkg-name: ${{subpkg.name}}
        - name: Verify wrapper scripts are installed and executable
          runs: |
            # Verify gpg-wrapper.sh exists and is executable
            stat /usr/bin/gpg-wrapper.sh
            test -x /usr/bin/gpg-wrapper.sh || { echo "ERROR: gpg-wrapper.sh is not executable"; exit 1; }

            # Verify git-verify-wrapper.sh exists and is executable
            stat /usr/bin/git-verify-wrapper.sh
            test -x /usr/bin/git-verify-wrapper.sh || { echo "ERROR: git-verify-wrapper.sh is not executable"; exit 1; }

            # Verify uid_entrypoint.sh exists and is executable
            stat /usr/bin/uid_entrypoint.sh
            test -x /usr/bin/uid_entrypoint.sh || { echo "ERROR: uid_entrypoint.sh is not executable"; exit 1; }
        - name: Test gpg-wrapper.sh with --version
          runs: |
            # gpg-wrapper.sh passes args to gpg, test that it invokes gpg correctly
            output=$(/usr/bin/gpg-wrapper.sh --version 2>&1) || true
            echo "$output" | grep -F "gpg" || {
              echo "FAIL: gpg-wrapper.sh did not invoke gpg correctly"
              echo "Output: $output"
              exit 1
            }
            echo "SUCCESS: gpg-wrapper.sh correctly invokes gpg"
        - name: Test git-verify-wrapper.sh displays help
          runs: |
            # git-verify-wrapper.sh is a wrapper that invokes git, test basic functionality
            # It should at least be able to run without errors when help is requested
            output=$(/usr/bin/git-verify-wrapper.sh --help 2>&1) || true
            # The wrapper should not produce any fatal errors on invocation
            if echo "$output" | grep -F "command not found"; then
              echo "FAIL: git-verify-wrapper.sh has missing dependency"
              exit 1
            fi
            echo "SUCCESS: git-verify-wrapper.sh runs without missing dependencies"
        - name: Test uid_entrypoint.sh runs successfully
          runs: |
            # uid_entrypoint.sh is an entrypoint script that should run without error
            # It typically handles UID mapping and runs a command
            # Test that it can at least run 'id' without errors
            output=$(/usr/bin/uid_entrypoint.sh id 2>&1)
            echo "$output" | grep -F "uid=" || {
              echo "FAIL: uid_entrypoint.sh did not execute command correctly"
              echo "Output: $output"
              exit 1
            }
            echo "SUCCESS: uid_entrypoint.sh correctly executes commands"

  - name: ${{package.name}}-compat
    description: "Compatibility package for locating binaries according to upstream helm charts"
    pipeline:
      - runs: |
          # ArgoCD manifests and helm charts all hardcode the executables path to /usr/local/bin/*
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          # This must be copied and not symlinked due to how `argocd` copies executables between (init)containers
          # example: https://github.com/argoproj/argo-helm/blob/argo-cd-5.33.1/charts/argo-cd/templates/dex/deployment.yaml#L136-L143
          cp ${{targets.destdir}}/usr/bin/argocd "${{targets.subpkgdir}}"/usr/local/bin/argocd

          ln -s /usr/local/bin/argocd "${{targets.subpkgdir}}"/usr/local/bin/argocd-server
          ln -s /usr/local/bin/argocd "${{targets.subpkgdir}}"/usr/local/bin/argocd-repo-server
          ln -s /usr/local/bin/argocd "${{targets.subpkgdir}}"/usr/local/bin/argocd-cmp-server
          ln -s /usr/local/bin/argocd "${{targets.subpkgdir}}"/usr/local/bin/argocd-application-controller
          ln -s /usr/local/bin/argocd "${{targets.subpkgdir}}"/usr/local/bin/argocd-notifications
          ln -s /usr/local/bin/argocd "${{targets.subpkgdir}}"/usr/local/bin/argocd-applicationset-controller
          ln -s /usr/local/bin/argocd "${{targets.subpkgdir}}"/usr/local/bin/argocd-k8s-auth
          ln -s /usr/local/bin/argocd "${{targets.subpkgdir}}"/usr/local/bin/argocd-commit-server
    dependencies:
      provides:
        - argo-cd-compat=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: argo-cd-compat
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-iamguarded-compat
    description: "compat package with iamguarded argo-cd image"
    dependencies:
      provides:
        - argo-cd-iamguarded-compat=${{package.full-version}}
      runtime:
        - argo-cd-${{vars.major-minor-version}}
        - bash
        - coreutils
        - dash-binsh
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: argo-cd
          version: ${{vars.major-minor-version}}
      - runs: |
          mkdir -p /opt/iamguarded/argo-cd/bin/
          chmod g+rwX /opt/iamguarded
          ln -sf /usr/bin/argocd /opt/iamguarded/argo-cd/bin/argocd
          ln -sf /usr/bin/argocd-server /opt/iamguarded/argo-cd/bin/argocd-server
          ln -sf /usr/bin/argocd-repo-server /opt/iamguarded/argo-cd/bin/argocd-repo-server
          ln -sf /usr/bin/argocd-cmp-server /opt/iamguarded/argo-cd/bin/argocd-cmp-server
          ln -sf /usr/bin/argocd-application-controller /opt/iamguarded/argo-cd/bin/argocd-application-controller
          ln -sf /usr/bin/argocd-notifications /opt/iamguarded/argo-cd/bin/argocd-notifications
          ln -sf /usr/bin/argocd-applicationset-controller /opt/iamguarded/argo-cd/bin/argocd-applicationset-controller
          ln -sf /usr/bin/argocd-k8s-auth /opt/iamguarded/argo-cd/bin/argocd-k8s-auth
          ln -sf /usr/bin/argocd-commit-server /opt/iamguarded/argo-cd/bin/argocd-commit-server
      - uses: iamguarded/finalize-compat
        with:
          package: argo-cd
          version: ${{vars.major-minor-version}}
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: argo-cd
            version: ${{vars.major-minor-version}}

update:
  enabled: true
  github:
    identifier: argoproj/argo-cd
    strip-prefix: v
    tag-filter: v3.1.

test:
  pipeline:
    - name: ArgoCD Version Check
      runs: |
        argocd version --short --client || exit 1
    - uses: test/tw/help-check
      with:
        bins: |
          argocd
          argocd-server
          argocd-application-controller
          argocd-applicationset-controller
          argocd-cmp-server
          argocd-k8s-auth
          argocd-notifications
          argocd-repo-server
          argocd-commit-server
    - name: Test argocd CLI subcommands
      runs: |
        # Test account commands are available (no server required)
        argocd account --help | grep -F "account" || {
          echo "FAIL: argocd account subcommand not working"
          exit 1
        }

        # Test app commands are available
        argocd app --help | grep -F "app" || {
          echo "FAIL: argocd app subcommand not working"
          exit 1
        }

        # Test cluster commands are available
        argocd cluster --help | grep -F "cluster" || {
          echo "FAIL: argocd cluster subcommand not working"
          exit 1
        }

        # Test repo commands are available
        argocd repo --help | grep -F "repo" || {
          echo "FAIL: argocd repo subcommand not working"
          exit 1
        }

        echo "SUCCESS: All argocd CLI subcommands are available"
    - name: Test argocd-server initialization output
      runs: |
        # Test that argocd-server can start and produce expected output
        # It will fail because of missing Kubernetes config, but should show
        # initialization logic working
        output=$(timeout 5 argocd-server 2>&1 || true)

        # Verify the server attempts to start (shows it's parsing args correctly)
        if echo "$output" | grep -iE "(starting|listen|config|kubernetes|cluster)"; then
          echo "SUCCESS: argocd-server initialization logic works"
        else
          echo "Server output: $output"
          # Check for common startup indicators
          if echo "$output" | grep -iE "(error|fail)"; then
            echo "INFO: Server failed to start as expected (no Kubernetes)"
            echo "SUCCESS: Server initialization attempted correctly"
          else
            echo "FAIL: Unable to verify server initialization"
            exit 1
          fi
        fi
    - name: Test argocd admin commands
      runs: |
        # Test admin subcommand which has offline utilities
        argocd admin --help | grep -F "admin" || {
          echo "FAIL: argocd admin subcommand not working"
          exit 1
        }

        # Test settings subcommand (offline utility)
        argocd admin settings --help | grep -F "settings" || {
          echo "FAIL: argocd admin settings subcommand not working"
          exit 1
        }

        echo "SUCCESS: argocd admin commands work correctly"
    - name: Verify all symlinks resolve correctly
      runs: |
        # Verify all ArgoCD component symlinks point to valid executables
        for binary in argocd-server argocd-repo-server argocd-cmp-server \
                      argocd-application-controller argocd-notifications \
                      argocd-applicationset-controller argocd-k8s-auth \
                      argocd-commit-server; do
          stat /usr/bin/$binary
          # Verify symlink target is valid
          test -L /usr/bin/$binary || {
            echo "INFO: /usr/bin/$binary is not a symlink (this is OK)"
          }
          # Verify executable works
          /usr/bin/$binary --help >/dev/null 2>&1 || {
            echo "FAIL: /usr/bin/$binary --help failed"
            exit 1
          }
        done
        echo "SUCCESS: All ArgoCD component binaries work correctly"
