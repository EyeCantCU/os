package:
  name: chart-kubernetes-cloud-provider-vsphere
  version: "1.35.0"
  epoch: 0
  description: A Helm chart for vSphere Cloud Provider Interface Manager (CPI)
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/cloud-provider-vsphere
      tag: v${{package.version}}
      expected-commit: 93af0f78bc262173a372015d1f662098299224c5

  - uses: charts/package
    with:
      chart-path: charts/vsphere-cpi
      images: |
        cloud-provider-vsphere:
          values:
            daemonset:
              image: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [cloud-provider-vsphere]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: kubernetes/cloud-provider-vsphere
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
    tag-filter-contains: .
