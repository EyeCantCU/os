package:
  name: chart-twuni-docker-registry
  version: "3.0.0"
  epoch: 0
  description: A Helm chart for Docker Registry
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/twuni/docker-registry.helm
      tag: v${{package.version}}
      expected-commit: ab431e8015b7eb4bea7cc70b88bcf6af64d3f98d

  - uses: charts/package
    with:
      chart-path: .
      images: |
        docker-registry:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [docker-registry]
          - name: with-garbage-collect
            images: [docker-registry]
            values:
              garbageCollect:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: twuni/docker-registry.helm
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
