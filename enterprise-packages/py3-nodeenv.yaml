package:
  name: py3-nodeenv
  version: "1.10.0"
  epoch: 1
  description: a tool to create isolated node.js environments.
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - py3-supported-build-base

vars:
  pypi-package: nodeenv
  import: nodeenv

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ekalinin/nodeenv
      tag: ${{package.version}}
      expected-commit: 9dee547f5e45c9d1b155e4351d165f2b504ae281

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            nodeenv --version | grep -F "${{package.version}}" || {
              echo "FAIL: nodeenv --version did not contain '${{package.version}}'";
              exit 1;
            }
            nodeenv --help || {
              echo "FAIL: nodeenv --help exited non-zero [$?]"
            }

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: ekalinin/nodeenv
