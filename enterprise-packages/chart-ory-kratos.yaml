package:
  name: chart-ory-kratos
  version: "0.60.1"
  epoch: 0
  description: A ORY Kratos Helm chart for Kubernetes
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ory/k8s
      tag: v${{package.version}}
      expected-commit: 0fd0d2c0f3727de146f811723c78f5c3c6c50ba8

  # ory-commons is a library chart vendored as a tgz in charts/kratos/charts/.
  # Remove the repository field so the vendor step doesn't rewrite it to
  # file:///ory-commons (which wouldn't exist), and extract the tgz so helm
  # can find it locally without fetching.
  - runs: |
      yq -i "del(.dependencies[].repository)" helm/charts/kratos/Chart.yaml
      rm -f helm/charts/kratos/Chart.lock
      tar xzf helm/charts/kratos/charts/ory-commons-0.1.0.tgz -C helm/charts/kratos/charts/

  - uses: charts/package
    with:
      chart-path: helm/charts/kratos
      images: |
        kratos:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
        watcher:
          values:
            watcher:
              image: ${ref}
        busybox:
          values:
            test:
              busybox:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [kratos]
          - name: with-watcher
            images: [kratos, watcher]
            values:
              watcher:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: ory/k8s
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
    tag-filter-contains: .
