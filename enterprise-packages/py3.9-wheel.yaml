package:
  name: py3.9-wheel
  version: "0.46.3"
  epoch: 0
  description: "built-package format for Python"
  copyright:
    - license: MIT
  options:
    no-provides: true
  dependencies:
    runtime:
      - py3.9-installer
      - python-3.9

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3.9-flit-core
      - py3.9-gpep517
      - python-3.9
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/wheel
      tag: ${{package.version}}
      expected-commit: 8b6fa740a7101edacb42b0f8e83a1b659ff61033

  - runs: |
      python3.9 -m gpep517 build-wheel --wheel-dir dist --output-fd 1
      python3.9 -m installer -d "${{targets.destdir}}" dist/wheel-${{package.version}}-py3-none-any.whl

  - uses: strip

update:
  enabled: true
  github:
    identifier: pypa/wheel
    use-tag: true

test:
  pipeline:
    - runs: |
        wheel version
        wheel --help
