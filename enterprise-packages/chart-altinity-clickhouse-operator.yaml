package:
  name: chart-altinity-clickhouse-operator
  version: "0.26.0"
  epoch: 0
  description: Helm chart to deploy altinity-clickhouse-operator
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Altinity/clickhouse-operator
      tag: release-${{package.version}}
      expected-commit: 6398f7ff7f6e2560e09cc5de07f9eeaf32a7adf0

  - uses: charts/package
    with:
      chart-path: deploy/helm/clickhouse-operator
      images: |
        clickhouse-operator:
          values:
            operator:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        metrics-exporter:
          values:
            metrics:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        kubectl:
          values:
            crdHook:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
      test: |
        # Example CRD template in configmap data, not an actual container image
        ignore:
          - clickhouse/clickhouse-server:23.8
        cases:
          - name: default
            images: [clickhouse-operator, metrics-exporter, kubectl]
          - name: without-metrics
            images: [clickhouse-operator, kubectl]
            values:
              metrics:
                enabled: false
          - name: without-crdhook
            images: [clickhouse-operator, metrics-exporter]
            values:
              crdHook:
                enabled: false

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: Altinity/clickhouse-operator
    strip-prefix: release-
    use-tag: true
    tag-filter-prefix: release-
