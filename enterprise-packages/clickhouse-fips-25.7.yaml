package:
  name: clickhouse-fips-25.7
  version: "25.7.8.71"
  epoch: 4
  description: ClickHouse is the fastest and most resource efficient open-source database for real-time apps and analytics.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: 65
    memory: 128Gi
  dependencies:
    provides:
      - clickhouse-fips=${{package.full-version}}
    runtime:
      - openssl-config-fipshardened

vars:
  build-dir: build
  clang-version: 19

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version
  - from: ${{package.version}}
    match: ^(\d+\.\d+).*
    replace: $1
    to: major-minor-version
  - from: ${{package.version}}
    match: ^(\d+)\.(\d+)\.(\d+).*
    replace: $3
    to: patch-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ccache
      - clang-${{vars.clang-version}}
      - cmake
      - gawk
      - git
      - gnupg-fips
      - grep
      - jitterentropy-library-dev
      - lld-${{vars.clang-version}}
      - lsb-release-minimal
      - nasm
      - openssl-dev
      - perl
      - python3
      - rust
      - rustup
      - samurai
      - wget
      - xmlstarlet
      - yasm
  environment:
    RUSTC_BOOTSTRAP: 1
    CLICKHOUSE_BUILD: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ClickHouse/ClickHouse
      tag: v${{package.version}}-stable
      expected-commit: 172d08824532568dbeceb8e31642a85c865a72a7

  - uses: patch
    with:
      patches: |
        allow_cflags.patch
        compatibility.patch
        openssl.patch
        poco.patch

  - runs: |
      git submodule update --init --depth=1 --jobs=$(nproc)

      # Remove bundled OpenSSL to force use of system libraries
      rm -rf contrib/openssl contrib/openssl-cmake

      # Create symlinks for OpenSSL headers in the structure expected by the build
      mkdir -p contrib/openssl/include
      ln -sf /usr/include/openssl contrib/openssl/include/

      # Install stable Rust toolchain
      rustup install stable

      # Modify the CMakeLists.txt to use stable toolchain instead of any nightly version
      sed -i 's/set(Rust_TOOLCHAIN "nightly[^"]*")/set(Rust_TOOLCHAIN "stable")/' contrib/corrosion-cmake/CMakeLists.txt

      # Overwrite VERSION_STRING to properly set the version of the binary.
      sed -i "s|^SET(VERSION_STRING [^)]*)|SET(VERSION_STRING ${{package.version}})|" cmake/autogenerated_versions.txt
      sed -i "s|^SET(VERSION_DESCRIBE [^)]*)|SET(VERSION_DESCRIBE v${{package.version}}-stable)|" cmake/autogenerated_versions.txt
      sed -i "s|^SET(VERSION_PATCH [^)]*)|SET(VERSION_PATCH ${{vars.patch-version}})|" cmake/autogenerated_versions.txt

      # Reference for cmake options: https://github.com/ClickHouse/ClickHouse/blob/master/ci/jobs/build_clickhouse.py
      mkdir -p ${{vars.build-dir}}
      cd ${{vars.build-dir}}

      cmake \
        -DCLICKHOUSE_OFFICIAL_BUILD=1 \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_CXX_FLAGS="-Wno-unused-result -Wno-error=unused-result -Wno-deprecated-declarations -D_GNU_SOURCE" \
        -DCMAKE_C_FLAGS="-D_GNU_SOURCE" \
        -DCMAKE_SHARED_LINKER_FLAGS="-Wl" \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCOMPILER_CACHE=disabled \
        -DENABLE_EXAMPLES=OFF \
        -DENABLE_OPENSSL_DYNAMIC=ON \
        -DENABLE_RUST=ON \
        -DENABLE_SSL=1 \
        -DENABLE_TESTS=OFF \
        -DNO_ARMV81_OR_HIGHER=1 \
        -DOPENSSL_INCLUDE_DIR=/home/build/contrib/openssl/include \
        -DPARALLEL_COMPILE_JOBS=$(nproc) \
        -DPARALLEL_LINK_JOBS=$(nproc) \
        -DVERSION_STRING=${{package.version}} \
        ..

  - working-directory: ${{vars.build-dir}}
    runs: |
      ninja -j $(nproc) clickhouse
      mkdir -p  ${{targets.contextdir}}/var/log/clickhouse-server
      DESTDIR=${{targets.contextdir}} ninja install
      rm -rf ${{targets.contextdir}}/usr/lib/debug

  - uses: strip

subpackages:
  - name: "${{package.name}}-dev"
    description: "headers for clickhouse"
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - runs: readlink -v /usr/bin/clickhouse-extract-from-config

  - name: "${{package.name}}-bash-completion"
    description: "bash completion for clickhouse"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/bash-completion/completions
          mv ${{targets.destdir}}/usr/share/bash-completion/completions/clickhouse ${{targets.contextdir}}/usr/share/bash-completion/completions

  - name: "${{package.name}}-compat"
    description: "docker compat for clickhouse"
    pipeline:
      - working-directory: ${{vars.build-dir}}
        runs: |
          install -Dm755 ../docker/server/entrypoint.sh ${{targets.contextdir}}/entrypoint.sh
          mkdir -p ${{targets.contextdir}}/etc/clickhouse-server/config.d/
          # users.d dir required by entrypoint script
          mkdir -p ${{targets.contextdir}}/etc/clickhouse-server/users.d/
          cp  ../docker/server/docker_related_config.xml ${{targets.contextdir}}/etc/clickhouse-server/config.d/docker_related_config.xml
    dependencies:
      provides:
        - clickhouse-fips-compat=${{package.full-version}}
    test:
      environment:
        accounts:
          groups:
            - groupname: clickhouse
              gid: 101
            - groupname: nonroot
              gid: 1001
          users:
            - username: clickhouse
              gid: 101
              uid: 101
            - username: nonroot
              gid: 1001
              uid: 1001
          run-as: 0
        contents:
          packages:
            - ${{package.name}}
            - bash
            - coreutils
            - grep
            - procps
            - curl
      pipeline:
        - runs: |
            # Verify entrypoint script exists and is executable
            test -x /entrypoint.sh

            # Verify config directory structure exists
            test -d /etc/clickhouse-server/config.d/
            test -d /etc/clickhouse-server/users.d/

            # Verify docker config file exists
            test -f /etc/clickhouse-server/config.d/docker_related_config.xml

            # Verify docker config file contains expected settings
            grep -q "<listen_host>0.0.0.0</listen_host>" /etc/clickhouse-server/config.d/docker_related_config.xml
        - name: "Test entrypoint script with server startup"
          uses: test/daemon-check-output
          with:
            setup: |
              # Set environment variables that entrypoint.sh expects
              export CLICKHOUSE_CONFIG=./clickhouse-config.xml
              export CLICKHOUSE_USER=default

              # Create required directories and permissions
              # Create required directories and permissions (relative to current directory)
              mkdir -p ./clickhouse-data/lib ./clickhouse-data/log ./clickhouse-data/docker-initdb.d

              # Create a minimal config.xml in the current directory
              cat > ./clickhouse-config.xml << EOF
              <clickhouse>
                  <logger>
                      <level>information</level>
                      <log>./clickhouse-data/log/clickhouse-server.log</log>
                      <errorlog>./clickhouse-data/log/clickhouse-server.err.log</errorlog>
                  </logger>
                  <http_port>8123</http_port>
                  <tcp_port>9000</tcp_port>
                  <path>./clickhouse-data/lib/</path>
                  <tmp_path>./clickhouse-data/lib/tmp/</tmp_path>
                  <user_files_path>./clickhouse-data/lib/user_files/</user_files_path>
                  <format_schema_path>./clickhouse-data/lib/format_schemas/</format_schema_path>
                  <watch_memory_usage_via_cgroups>false</watch_memory_usage_via_cgroups>
              </clickhouse>
              EOF

              # Create users config directory and file
              mkdir -p ./clickhouse-data/users.d
              touch ./clickhouse-data/users.d/default.xml

              chown -R nonroot:nonroot /home/build
            start: /entrypoint.sh clickhouse-su nonroot:nonroot clickhouse-server
            expected_output: |
              Starting ClickHouse
              Ready for connections
            post: |
              # Verify server is accessible
              curl -s --connect-timeout 5 "http://localhost:8123/?query=SELECT%201" | grep -q "1" || {
                echo "Failed to connect to ClickHouse server"
                exit 1
              }

  - name: clickhouse-fips-${{vars.major-minor-version}}-iamguarded-compat
    dependencies:
      provides:
        - clickhouse-fips-iamguarded-compat=${{package.full-version}}
      runtime:
        - bash
        - busybox
        - coreutils
        - xmlstarlet
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: clickhouse
          version: ${{vars.major-version}}
      - runs: |
          set -x
          mkdir -p /iamguarded/clickhouse/etc
          mkdir -p /iamguarded/clickhouse/data
          mkdir -p /opt/iamguarded/clickhouse/etc.default
          mkdir -p /opt/iamguarded/clickhouse/etc/config.d
          mkdir -p /opt/iamguarded/clickhouse/etc/conf.d
          mkdir -p /opt/iamguarded/clickhouse/etc/users.d
          mkdir -p /opt/iamguarded/clickhouse/bin
          mkdir -p /opt/iamguarded/clickhouse/logs
          mkdir -p /opt/iamguarded/clickhouse/tmp
          mkdir -p /opt/iamguarded/clickhouse/licenses
          mkdir -p ${{targets.contextdir}}/var/log/clickhouse-server
          mkdir ${{targets.contextdir}}/docker-entrypoint-initdb.d
          mkdir ${{targets.contextdir}}/docker-entrypoint-startdb.d
          install -m755 ${{targets.destdir}}/etc/clickhouse-keeper/keeper_config.xml /opt/iamguarded/clickhouse/etc/keeper_config.xml
          install -m755 ${{targets.destdir}}/etc/clickhouse-server/users.xml /opt/iamguarded/clickhouse/etc/users.xml
          install -m755 ${{targets.destdir}}/etc/clickhouse-server/config.xml /opt/iamguarded/clickhouse/etc/config.xml
          mkdir -p ${{targets.contextdir}}/var/log/
          # Disable some commands used in iamguarded scripts. These commands more likely fail in this since this image take non root approach
          sed -i 's/ensure_user_exists/# ensure_user_exists/g' /opt/iamguarded/scripts/clickhouse/postunpack.sh
          # The `--userspec`` flag belongs to GNU's chroot, whereas we are use BusyBox's. As a workaround, use `su-exec` instead.
          sed -i 's|exec chroot --userspec="$userspec" /|exec chroot / su-exec "$userspec"|' /opt/iamguarded/scripts/libos.sh
          sed -i 's|chroot --userspec="$userspec" /|chroot / su-exec "$userspec"|' /opt/iamguarded/scripts/libos.sh
          # Use package path while unpacking
          find /opt/iamguarded/scripts -iname "*.sh" -exec sed -i '/chown/c\continue' -i {} \;
          # Remove existing symlinks that might conflict
          rm -f /etc/clickhouse-server /var/lib/clickhouse /var/log/clickhouse-server /var/lib/clickhouse/tmp
          /opt/iamguarded/scripts/clickhouse/postunpack.sh
          # Find all files in /usr/bin that are either named "clickhouse" or symlinks pointing to "clickhouse"
          for file in ${{targets.destdir}}/usr/bin/*; do
              if [ -f "$file" ] && [ "$(basename "$file")" = "clickhouse" ]; then
                  # Found a direct match for "clickhouse"
                  ln -sf /usr/bin/clickhouse /opt/iamguarded/clickhouse/bin/clickhouse
              elif [ -L "$file" ]; then
                  # Check if the symlink points to clickhouse
                  target=$(readlink -f "$file")
                  if [ "$(basename "$target")" = "clickhouse" ]; then
                      link_name=$(basename "$file")
                      ln -sf /usr/bin/clickhouse "/opt/iamguarded/clickhouse/bin/$link_name"
                  fi
              fi
          done
          ln -s /dev/stdout ${{targets.contextdir}}/var/log/clickhouse-server/clickhouse.log
          ln -s /dev/stderr ${{targets.contextdir}}/var/log/clickhouse-server/clickhouse_error.log
          mkdir -p ${{targets.contextdir}}/var/lib
          ln -s /iamguarded/clickhouse/data ${{targets.contextdir}}/var/lib/clickhouse
      - uses: iamguarded/finalize-compat
        with:
          package: clickhouse
          version: ${{vars.major-version}}
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: clickhouse
            version: ${{vars.major-version}}

  - name: clickhouse-keeper-fips-${{vars.major-minor-version}}
    description: "clickhouse keeper"
    dependencies:
      provides:
        - clickhouse-keeper-fips=${{package.full-version}}
    pipeline:
      - runs: |
          install -Dm755 ${{targets.destdir}}/usr/bin/clickhouse-keeper ${{targets.contextdir}}/usr/bin/clickhouse-keeper

          # multicall symlinks
          ln -sf /usr/bin/clickhouse-keeper ${{targets.contextdir}}/usr/bin/clickhouse-keeper-converter
          ln -sf /usr/bin/clickhouse-keeper ${{targets.contextdir}}/usr/bin/clickhouse-keeper-client
    test:
      environment:
        contents:
          packages:
            - bash
            - coreutils
            - procps
      pipeline:
        - runs: |
            # Smoke tests for binary existence and basic functionality
            clickhouse-keeper --version | grep ${{package.version}}
            clickhouse-keeper-client --help
            clickhouse-keeper-converter --help
        - name: "Test keeper server and basic operations"
          uses: test/daemon-check-output
          with:
            setup: |
              # Create directory for test configs and data
              mkdir -p keeper-test/logs keeper-test/data

              # Create basic configuration file
              cat > keeper-test/keeper-config.xml << EOF
              <clickhouse>
                  <logger>
                      <level>debug</level>
                      <log>keeper-test/logs/keeper.log</log>
                      <errorlog>keeper-test/logs/keeper.err.log</errorlog>
                      <console>1</console>
                  </logger>
                  <keeper_server>
                      <tcp_port>9181</tcp_port>
                      <server_id>1</server_id>
                      <log_storage_path>keeper-test/data</log_storage_path>
                      <snapshot_storage_path>keeper-test/data</snapshot_storage_path>
                      <listen_host>127.0.0.1</listen_host>
                      <raft_configuration>
                          <server>
                              <id>1</id>
                              <hostname>127.0.0.1</hostname>
                              <port>9234</port>
                          </server>
                      </raft_configuration>
                  </keeper_server>
              </clickhouse>
              EOF
            start: clickhouse-keeper --config keeper-test/keeper-config.xml
            expected_output: |
              Application: Starting ClickHouse Keeper ${{package.version}}
              Quorum initialized
              Ready for connections
            post: |
              # Verify default node exists
              clickhouse-keeper-client --host 127.0.0.1 --port 9181 -q "ls" | grep -q "keeper"

              # Create test node
              clickhouse-keeper-client --host 127.0.0.1 --port 9181 -q "create \"/test-node\" \"test-data\""

              # Verify node exists
              clickhouse-keeper-client --host 127.0.0.1 --port 9181 -q "ls" | grep -q "test-node"

              # Get data from the node
              clickhouse-keeper-client --host 127.0.0.1 --port 9181 -q "get \"/test-node\"" | grep -q "test-data"

  - name: clickhouse-keeper-fips-${{vars.major-minor-version}}-iamguarded-compat
    dependencies:
      provides:
        - clickhouse-keeper-fips-iamguarded-compat=${{package.full-version}}
      runtime:
        - bash
        - busybox
        - coreutils
        - merged-usrsbin
        - wolfi-baselayout
        - clickhouse-keeper-fips
        - xmlstarlet
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: clickhouse-keeper
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /iamguarded/clickhouse-keeper/etc
          mkdir -p /iamguarded/clickhouse-keeper/data
          mkdir -p /opt/iamguarded/clickhouse-keeper/etc
          mkdir -p /opt/iamguarded/clickhouse-keeper/etc.default
          mkdir -p /opt/iamguarded/clickhouse-keeper/bin
          mkdir -p /opt/iamguarded/clickhouse-keeper/logs
          mkdir -p /opt/iamguarded/clickhouse-keeper/tmp
          mkdir -p /opt/iamguarded/clickhouse-keeper/licenses

          mkdir -p ${{targets.contextdir}}/var/log/clickhouse-server

          install -m755 ${{targets.destdir}}/etc/clickhouse-keeper/keeper_config.xml /opt/iamguarded/clickhouse-keeper/etc/keeper_config.xml

          mkdir -p ${{targets.contextdir}}/var/log/

          sed -i 's/ensure_user_exists/# ensure_user_exists/g' /opt/iamguarded/scripts/clickhouse-keeper/postunpack.sh

          sed -i 's|exec chroot --userspec="$userspec" /|exec chroot / su-exec "$userspec"|' /opt/iamguarded/scripts/libos.sh
          sed -i 's|chroot --userspec="$userspec" /|chroot / su-exec "$userspec"|' /opt/iamguarded/scripts/libos.sh

          # Use package path while unpacking
          find /opt/iamguarded/scripts -iname "*.sh" -exec sed -i '/chown/c\continue' -i {} \;
          # Remove existing symlinks that might conflict
          rm -f /etc/clickhouse-keeper /var/lib/clickhouse /var/log/clickhouse-server
          /opt/iamguarded/scripts/clickhouse-keeper/postunpack.sh

          # Find all files in /usr/bin that are either named "clickhouse-keeper" or symlinks pointing to "clickhouse-keeper"
          for file in ${{targets.destdir}}/usr/bin/*; do
              if [ -f "$file" ] && [ "$(basename "$file")" = "clickhouse-keeper" ]; then
                  # Found a direct match for "clickhouse-keeper"
                  ln -sf /usr/bin/clickhouse-keeper /opt/iamguarded/clickhouse-keeper/bin/clickhouse-keeper
              elif [ -L "$file" ]; then
                  # Check if the symlink points to clickhouse-keeper
                  target=$(readlink -f "$file")
                  if [ "$(basename "$target")" = "clickhouse-keeper" ]; then
                      link_name=$(basename "$file")
                      ln -sf /usr/bin/clickhouse-keeper "/opt/iamguarded/clickhouse-keeper/bin/$link_name"
                  fi
              fi
          done
      - uses: iamguarded/finalize-compat
        with:
          package: clickhouse-keeper
          version: ${{vars.major-version}}
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: clickhouse-keeper
            version: ${{vars.major-version}}

test:
  environment:
    accounts:
      groups:
        - groupname: clickhouse
          gid: 101
        - groupname: nonroot
          gid: 1001
      users:
        - username: clickhouse
          gid: 101
          uid: 101
        - username: nonroot
          gid: 1001
          uid: 1001
      run-as: 0
    contents:
      packages:
        - ${{package.name}}-compat
        - bash
        - coreutils
        - curl
        - findutils
        - openssl
        - procps
  pipeline:
    - uses: test/tw/ldd-check
    - name: Check fips test
      runs: |
        openssl-fips-test
    - runs: |
        ch --version
        chc --version
        chl --version
        clickhouse --version
        clickhouse-benchmark --help
        clickhouse-client --version
        clickhouse-compressor --help
        clickhouse-disks --help
        clickhouse-format version
        clickhouse-git-import version
        clickhouse-keeper --version
        clickhouse-keeper-client --help
        clickhouse-keeper-converter --help
        clickhouse-local --version
        clickhouse-obfuscator version
        clickhouse-server --version
        clickhouse-static-files-disk-uploader version
        clickhouse-su --version
    - name: "Test server / basic database operations"
      uses: test/daemon-check-output
      with:
        setup: ./setup-minimal-config.sh
        start: clickhouse-su nonroot:nonroot clickhouse-server -C minimal_config.xml
        expected_output: |
          Starting ClickHouse
          starting up
          Ready for connections
        post: ./test-daemon.sh
    - name: "Test FIPS mode"
      uses: test/daemon-check-output
      with:
        setup: ./setup-fips-tls-test.sh
        start: clickhouse-su nonroot:nonroot clickhouse-server -C test_config.xml
        expected_output: |
          Starting ClickHouse
          starting up
          Ready for connections
        post: ./test-fips-tls.sh

update:
  enabled: true
  ignore-regex-patterns:
    - '-new$'
  git:
    tag-filter-prefix: v25.7.
    strip-prefix: v
    strip-suffix: -stable
