# This package packages the FIPS 140-3 certified Amazon Linux 2023 as an apk to be used in Chainguard container images.
# As it was the binary rpms that got essentially certified, this is what we're using.
package:
  name: libgcrypt-al2023-fips
  version: "1.10.2" # This needs to be manually watched for updates, which should be infrequent
  epoch: 6 # go/enterprise-rsc/libgcrypt-al2023-fips
  description: General purpose crypto library based on the code used in GnuPG (AL2023 certified version)
  copyright:
    - license: LGPL-2.1
  dependencies:
    provides:
      - libgcrypt=${{package.full-version}}
    runtime:
      - NIST-CMVP-4971
  resources:
    cpu: "3"
    memory: 5Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - rpm2cpio
      - wget

pipeline:
  - name: Fetch library binaries
    assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          uri: "https://cdn.amazonlinux.com/al2023/core/guids/639146aac738d55bc4b9b721f1c6e3b359c71016df3bf8cdb9ef151adbc7ce93/aarch64/../../../../blobstore/e78957b2c808b1b1c6424c10ae9fb2c7efd997d8035eaadf42c118a3c10e6457/libgcrypt-1.10.2-1.amzn2023.0.2.aarch64.rpm"
          expected-sha256: "e78957b2c808b1b1c6424c10ae9fb2c7efd997d8035eaadf42c118a3c10e6457"
          timeout: 30
          extract: false
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://cdn.amazonlinux.com/al2023/core/guids/639146aac738d55bc4b9b721f1c6e3b359c71016df3bf8cdb9ef151adbc7ce93/x86_64/../../../../blobstore/415795ee76565581f7944d19f38c7bc6d9bad40ded22731a6c6065e250b70a21/libgcrypt-1.10.2-1.amzn2023.0.2.x86_64.rpm"
          expected-sha256: "415795ee76565581f7944d19f38c7bc6d9bad40ded22731a6c6065e250b70a21"
          timeout: 30
          extract: false

  - name: Fetch library dev assets
    assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          uri: "https://cdn.amazonlinux.com/al2023/core/guids/639146aac738d55bc4b9b721f1c6e3b359c71016df3bf8cdb9ef151adbc7ce93/aarch64/../../../../blobstore/0acaa6b3eabdef9440dea7112d597fa888d4b62ffe9dfa80bf0ffeb807ba827e/libgcrypt-devel-1.10.2-1.amzn2023.0.2.aarch64.rpm"
          expected-sha256: "0acaa6b3eabdef9440dea7112d597fa888d4b62ffe9dfa80bf0ffeb807ba827e"
          timeout: 30
          extract: false
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://cdn.amazonlinux.com/al2023/core/guids/639146aac738d55bc4b9b721f1c6e3b359c71016df3bf8cdb9ef151adbc7ce93/x86_64/../../../../blobstore/615c8bc60e16885d4f70b6d63675238d29df94b282355b3ddd25c6edf7fa7001/libgcrypt-devel-1.10.2-1.amzn2023.0.2.x86_64.rpm"
          expected-sha256: "615c8bc60e16885d4f70b6d63675238d29df94b282355b3ddd25c6edf7fa7001"
          timeout: 30
          extract: false

  - runs: |
      for p in libgcrypt-1.10.2*.rpm libgcrypt-devel-1.10.2*.rpm; do rpm2cpio $p | cpio -idmv; done
      mkdir -p "${{targets.destdir}}/usr/lib"
      mkdir -p "${{targets.destdir}}/usr/bin"
      mv ./usr/lib64/libgcrypt.so.* "${{targets.destdir}}/usr/lib"
      mv ./usr/bin/dumpsexp ./usr/bin/hmac256 ./usr/bin/mpicalc "${{targets.destdir}}/usr/bin"

  - name: Enable FIPS mode
    runs: |
      mkdir -p "${{targets.destdir}}/etc/gcrypt"
      touch "${{targets.destdir}}/etc/gcrypt/fips_enabled"

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: "${{package.name}} dev"
    dependencies:
      # Allow libgcrypt-al2023-fips-dev to satisfy libgcrypt-dev dependencies
      # This is needed for packages like cups-dev that depend on libgcrypt-dev
      provides:
        - libgcrypt-dev=${{package.full-version}}
      runtime:
        - ${{package.name}}
        - libgpg-error-dev
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mkdir -p ${{targets.contextdir}}/usr/lib
          mkdir -p ${{targets.contextdir}}/usr/include
          mkdir -p ${{targets.contextdir}}/usr/share
          mv ./usr/bin/libgcrypt-config ${{targets.contextdir}}/usr/bin
          mv ./usr/lib64/libgcrypt.so ${{targets.contextdir}}/usr/lib
          mv ./usr/lib64/pkgconfig ${{targets.contextdir}}/usr/lib
          mv ./usr/include/gcrypt.h ${{targets.contextdir}}/usr/include
          mv ./usr/share/aclocal ${{targets.contextdir}}/usr/share
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-src
    description: "Sources for the ${{package.name}} binaries"
    pipeline:
      - uses: fetch
        with:
          uri: "https://cdn.amazonlinux.com/al2023/core/guids/639146aac738d55bc4b9b721f1c6e3b359c71016df3bf8cdb9ef151adbc7ce93/SRPMS/../../../../blobstore/ce1668b0bc7d1877ef3f05ab1c2e0f37ac32c640e16d060b5c807c09a0351ce4/libgcrypt-1.10.2-1.amzn2023.0.2.src.rpm"
          expected-sha256: "ce1668b0bc7d1877ef3f05ab1c2e0f37ac32c640e16d060b5c807c09a0351ce4"
          timeout: 30
          extract: false
      - runs: |
          mkdir ./src
          (cd src; rpm2cpio ../libgcrypt-1.10.2*.src.rpm | cpio -idmv)
          mkdir -p ${{targets.contextdir}}/usr/src
          mv ./src ${{targets.contextdir}}/usr/src/${{package.name}}
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: "/usr/src/libgcrypt-al2023-fips/"
            name: "*.patch"

update:
  # Checking for new updates of libgcrypt in Amazon Linux 2023 requires looking into Amazon Linux
  # release notes, e.g. https://docs.aws.amazon.com/linux/al2023/release-notes/all-packages-AL2023.7.html
  # If a new version is present, one needs to run an Amazon Linux container, install dnf-plugins-core and
  # run `dnf download --setopt=arch=<ARCH> --url libgcrypt` to get the new urls.
  enabled: false
  exclude-reason: |
    No easy way to track new versions through the Amazon Linux 2023 RPM repositories

test:
  environment:
    contents:
      packages:
        - gpg-fips
        - gpg-fips-agent
        - pinentry
        - pkgconf
        - ${{package.name}}-dev
  pipeline:
    - runs: |
        set -euo pipefail
        echo "Raw message" >test
        # Test if basic encryption/decryption works.
        gpg --batch --yes --passphrase="pw" --pinentry-mode loopback -c test
        gpg --batch --passphrase="pw" --pinentry-mode loopback -d test.gpg >decrypted
        cmp test decrypted
    - uses: test/tw/ver-check
      with:
        bins: |
          libgcrypt-config
          dumpsexp
          mpicalc
    - uses: test/tw/help-check
      with:
        bins: |
          dumpsexp
          mpicalc
    - uses: test/tw/ldd-check
    # XXX: We can't really fully validate the FIPS certification via CMVP using the
    #  version number for validation as the 4971 entry is missing the
    #  "Software Versions" metadata set.
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 4971
