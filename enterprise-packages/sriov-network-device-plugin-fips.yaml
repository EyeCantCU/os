package:
  name: sriov-network-device-plugin-fips
  version: "3.10.0"
  epoch: 3 # CVE-2025-61729
  description: SRIOV network device plugin for Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d00e2da18b0b5c6b57fd9ace70db2d5a5f7a88d2
      repository: https://github.com/k8snetworkplumbingwg/sriov-network-device-plugin
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/opencontainers/runc@v1.2.8

  - uses: go/build
    with:
      output: sriovdp
      packages: ./cmd/sriovdp
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: k8snetworkplumbingwg/sriov-network-device-plugin
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        sriovdp --help
