package:
  name: sriov-network-device-plugin-fips
  version: "3.11.0"
  epoch: 1 # CVE-2025-61731
  description: SRIOV network device plugin for Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d9b3819fcfaa15d40b9cdfdc4ee0888d956c17a1
      repository: https://github.com/k8snetworkplumbingwg/sriov-network-device-plugin
      tag: v${{package.version}}

  - uses: go/build
    with:
      output: sriovdp
      packages: ./cmd/sriovdp
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: k8snetworkplumbingwg/sriov-network-device-plugin
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        sriovdp --help
