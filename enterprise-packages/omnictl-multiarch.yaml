package:
  name: omnictl-multiarch
  version: "1.5.4"
  description: "multi-architecture omnictl binaries"
  epoch: 0
  copyright:
    - license: BUSL-1.1

environment:
  contents:
    packages:
      - busybox
      - ca-certificates
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/siderolabs/omni
      tag: v${{package.version}}
      expected-commit: 8fa3caf4764c5474b0a39a97c89f0387a5014eab

  - runs: |
      set -e
      mkdir -p ${{targets.contextdir}}/omnictl

      for platform in linux:amd64 linux:arm64 darwin:amd64 darwin:arm64 windows:amd64; do
        GOOS=$(echo ${platform} | cut -d: -f1)
        GOARCH=$(echo ${platform} | cut -d: -f2)

        output_name="omnictl-${GOOS}-${GOARCH}"
        if [ "$GOOS" = "windows" ]; then
          output_name="${output_name}.exe"
        fi

        GOOS="$GOOS" GOARCH="$GOARCH" go build \
          -ldflags "-w -X github.com/siderolabs/omni/version.Version=${{package.version}} \
            -X github.com/siderolabs/omni/version.Revision=r${{package.epoch}} \
            -X github.com/siderolabs/omni/version.Package=github.com/siderolabs/omni" \
          -o "${{targets.contextdir}}/omnictl/${output_name}" \
          ./cmd/omnictl
      done

update:
  enabled: true
  github:
    identifier: siderolabs/omni
    strip-prefix: v

test:
  pipeline:
    - name: Cross-compiled binaries check
      runs: |
        for binary in omnictl-linux-amd64 omnictl-linux-arm64 omnictl-darwin-amd64 omnictl-darwin-arm64 omnictl-windows-amd64.exe; do
          stat /omnictl/$binary
        done
