package:
  name: istio-1.27
  version: "1.27.5"
  epoch: 2 # GHSA-jv3w-x3r3-g6rm
  description: Istio is an open source service mesh that layers transparently onto existing distributed applications.
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/istio/istio
      tag: ${{package.version}}
      expected-commit: 4e291059a25d05161759d4d848308dd25251b3fe

  - uses: go/bump
    with:
      deps: |-
        github.com/go-viper/mapstructure/v2@v2.4.0
        golang.org/x/crypto@v0.45.0
        github.com/containernetworking/plugins@v1.9.0

subpackages:
  - name: istio-cni-${{vars.major-minor-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./cni/cmd/istio-cni
          output: istio-cni
          ldflags: |
            -X istio.io/istio/pkg/version.buildVersion=${{package.version}}
            -X istio.io/istio/pkg/version.buildGitRevision=$(git rev-parse HEAD)
            -X istio.io/istio/pkg/version.buildTag=$(git describe --tags --always)
            -X istio.io/istio/pkg/version.buildStatus="Clean"
          extra-args: "-buildvcs=false"
      - uses: strip
    dependencies:
      provides:
        - istio-cni=${{package.full-version}}
    test:
      pipeline:
        - name: Verify istio-cni binary executes
          runs: |
            set -euo pipefail
            # Verify binary exists and is executable (fails test if missing)
            stat /usr/bin/istio-cni
            test -x /usr/bin/istio-cni || { echo "FAIL: istio-cni is not executable"; exit 1; }
            # CNI plugins require CNI_* env vars to function, but we can verify the binary loads
            # Running without CNI env will show usage/error but proves binary is functional
            if istio-cni 2>&1 | head -5; then
              echo "Binary executed successfully"
            else
              # CNI plugins exit non-zero without proper env, which is expected
              echo "Binary executed (non-zero exit expected without CNI environment)"
            fi
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: istio-cni
            real-pkg-name: ${{subpkg.name}}

  - name: istioctl-${{vars.major-minor-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./istioctl/cmd/istioctl
          output: istioctl
          ldflags: |
            -X istio.io/istio/pkg/version.buildVersion=${{package.version}}
            -X istio.io/istio/pkg/version.buildGitRevision=$(git rev-parse HEAD)
            -X istio.io/istio/pkg/version.buildTag=$(git describe --tags --always)
            -X istio.io/istio/pkg/version.buildStatus="Clean"
          extra-args: "-buildvcs=false"
    dependencies:
      provides:
        - istioctl=${{package.full-version}}
    test:
      pipeline:
        - uses: test/tw/ver-check
          with:
            bins: istioctl
        - uses: test/tw/help-check
          with:
            bins: istioctl

  - name: istioctl-bash-completion-${{vars.major-minor-version}}
    dependencies:
      provides:
        - istioctl-bash-completion=${{package.full-version}}
      runtime:
        - istioctl-${{vars.major-minor-version}}
        - bash-completion
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/share/bash-completion/completions
          ${{targets.outdir}}/istioctl-${{vars.major-minor-version}}/usr/bin/istioctl completion bash > "${{targets.contextdir}}"/usr/share/bash-completion/completions/istioctl-${{vars.major-minor-version}}
    test:
      pipeline:
        - runs: stat /usr/share/bash-completion/completions/istioctl-${{vars.major-minor-version}}

  - name: istioctl-zsh-completion-${{vars.major-minor-version}}
    dependencies:
      provides:
        - istioctl-zsh-completion=${{package.full-version}}
      runtime:
        - istioctl-${{vars.major-minor-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/share/zsh/site-functions
          ${{targets.outdir}}/istioctl-${{vars.major-minor-version}}/usr/bin/istioctl completion zsh > "${{targets.contextdir}}"/usr/share/zsh/site-functions/istioctl-${{vars.major-minor-version}}
    test:
      pipeline:
        - runs: stat /usr/share/zsh/site-functions/istioctl-${{vars.major-minor-version}}

  - name: istio-cni-${{vars.major-minor-version}}-compat
    pipeline:
      - runs: |
          # See https://github.com/istio/istio/blob/1.20.2/cni/deployments/kubernetes/Dockerfile.install-cni
          mkdir -p ${{targets.subpkgdir}}/opt/cni/bin
          ln -sf /usr/bin/istio-cni ${{targets.subpkgdir}}/opt/cni/bin/istio-cni
    dependencies:
      provides:
        - istio-cni-compat=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: istio-cni-compat
            real-pkg-name: ${{subpkg.name}}

  - name: istio-install-cni-${{vars.major-minor-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./cni/cmd/install-cni
          output: install-cni
          ldflags: |
            -X istio.io/istio/pkg/version.buildVersion=${{package.version}}
            -X istio.io/istio/pkg/version.buildGitRevision=$(git rev-parse HEAD)
            -X istio.io/istio/pkg/version.buildTag=$(git describe --tags --always)
            -X istio.io/istio/pkg/version.buildStatus="Clean"
          extra-args: "-buildvcs=false"
      - uses: strip
    dependencies:
      provides:
        - istio-install-cni=${{package.full-version}}
    test:
      pipeline:
        - name: Verify install-cni binary executes
          runs: |
            set -euo pipefail
            # Verify binary exists and is executable (fails test if missing)
            stat /usr/bin/install-cni
            test -x /usr/bin/install-cni || { echo "FAIL: install-cni is not executable"; exit 1; }
            # Test that install-cni shows help/usage information
            install-cni --help 2>&1 | grep -F "Usage" || install-cni --help 2>&1 | head -10
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: istio-install-cni
            real-pkg-name: ${{subpkg.name}}

  - name: istio-install-cni-${{vars.major-minor-version}}-compat
    pipeline:
      - runs: |
          # See https://github.com/istio/istio/blob/1.20.0/cni/deployments/kubernetes/Dockerfile.install-cni
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -sf /usr/bin/install-cni ${{targets.subpkgdir}}/usr/local/bin/install-cni
    dependencies:
      provides:
        - istio-install-cni-compat=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: istio-install-cni-compat
            real-pkg-name: ${{subpkg.name}}

  - name: istio-pilot-agent-${{vars.major-minor-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./pilot/cmd/pilot-agent
          output: pilot-agent
          # Extracted from https://github.com/istio/istio/blob/4358b84b911a80ba09ef36ac00ad85535a77e7ca/common/scripts/report_build_info.sh#L41-L48
          # Use this instead for buildStatus once our pipeline stops dirtying the git tree: "$(if git diff-index --quiet HEAD --; then echo "Clean"; else echo "Modified"; fi)"
          ldflags: |
            -X istio.io/istio/pkg/version.buildVersion=${{package.version}}
            -X istio.io/istio/pkg/version.buildGitRevision=$(git rev-parse HEAD)
            -X istio.io/istio/pkg/version.buildTag=$(git describe --tags --always)
            -X istio.io/istio/pkg/version.buildStatus="Clean"
          extra-args: "-buildvcs=false"
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/var/lib/istio/envoy
          cp ./tools/packaging/common/envoy_bootstrap.json \
            ${{targets.subpkgdir}}/var/lib/istio/envoy/envoy_bootstrap_tmpl.json
    test:
      environment:
        contents:
          packages:
            - jq
            - openssl
            - curl
        environment:
          KUBERNETES_SERVICE_HOST: "127.0.0.1"
          KUBERNETES_SERVICE_PORT: "32764"
      pipeline:
        - name: Verify pilot-agent version and startup capability
          runs: |
            set -euo pipefail
            # Verify binary exists and is executable (fails test if missing)
            stat /usr/bin/pilot-agent
            test -x /usr/bin/pilot-agent || { echo "FAIL: pilot-agent is not executable"; exit 1; }

            # Verify version information is correctly embedded (not "unknown")
            pilot-agent version -o json | jq -e '.clientVersion.version' | grep -F "${{package.version}}"
            pilot-agent version -o json | jq -e '.clientVersion.revision != "unknown"'
            pilot-agent version -o json | jq -e '.clientVersion.tag != "unknown"'

            # Verify help output shows expected commands
            pilot-agent --help 2>&1 | grep -F "proxy"
        - uses: test/kwok/cluster
          with:
            serviceaccount: true
        - name: Verify pilot-agent daemon startup with kwok cluster
          uses: test/daemon-check-output
          with:
            setup: |
              kubectl create namespace istio-system

              # Create directories pilot-agent needs (RELATIVE paths from cwd)
              mkdir -p var/run/secrets/istio
              mkdir -p var/run/secrets/workload-spiffe-uds
              mkdir -p etc/istio/proxy

              # Generate self-signed CA cert
              openssl req -x509 -newkey rsa:2048 -keyout /tmp/ca-key.pem \
                -out var/run/secrets/istio/root-cert.pem -days 1 -nodes \
                -subj "/CN=Istio CA"
            start: pilot-agent proxy sidecar --domain=cluster.local
            timeout: 30
            expected_output: "Starting"

  - name: istio-pilot-agent-${{vars.major-minor-version}}-compat
    pipeline:
      - runs: |
          # link /usr/local/bin/pilot-agent -> /usr/bin/pilot-agent to match
          # what the Istio Helm charts may expect.
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -sf /usr/bin/pilot-agent ${{targets.subpkgdir}}/usr/local/bin/pilot-agent
    dependencies:
      provides:
        - istio-pilot-agent-compat=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: istio-pilot-agent-compat
            real-pkg-name: ${{subpkg.name}}

  - name: istio-pilot-discovery-${{vars.major-minor-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./pilot/cmd/pilot-discovery
          output: pilot-discovery
          # Extracted from https://github.com/istio/istio/blob/4358b84b911a80ba09ef36ac00ad85535a77e7ca/common/scripts/report_build_info.sh#L41-L48
          # Use this instead for buildStatus once our pipeline stops dirtying the git tree: "$(if git diff-index --quiet HEAD --; then echo "Clean"; else echo "Modified"; fi)"
          ldflags: |
            -X istio.io/istio/pkg/version.buildVersion=${{package.version}}
            -X istio.io/istio/pkg/version.buildGitRevision=$(git rev-parse HEAD)
            -X istio.io/istio/pkg/version.buildTag=$(git describe --tags --always)
            -X istio.io/istio/pkg/version.buildStatus="Clean"
          extra-args: "-buildvcs=false"
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/var/lib/istio/envoy
          cp ./tools/packaging/common/envoy_bootstrap.json \
            ${{targets.subpkgdir}}/var/lib/istio/envoy/envoy_bootstrap_tmpl.json
    test:
      environment:
        contents:
          packages:
            - jq
            - curl
        environment:
          KUBERNETES_SERVICE_HOST: "127.0.0.1"
          KUBERNETES_SERVICE_PORT: "32764"
      pipeline:
        - name: Verify pilot-discovery version and startup capability
          runs: |
            set -euo pipefail
            # Verify binary exists and is executable (fails test if missing)
            stat /usr/bin/pilot-discovery
            test -x /usr/bin/pilot-discovery || { echo "FAIL: pilot-discovery is not executable"; exit 1; }

            # Verify version information is correctly embedded (not "unknown")
            pilot-discovery version -o json | jq -e '.clientVersion.version' | grep -F "${{package.version}}"
            pilot-discovery version -o json | jq -e '.clientVersion.revision != "unknown"'
            pilot-discovery version -o json | jq -e '.clientVersion.tag != "unknown"'

            # Verify help output shows expected commands
            pilot-discovery --help 2>&1 | grep -F "discovery"
        - uses: test/kwok/cluster
          with:
            serviceaccount: true
        - name: Verify pilot-discovery daemon startup with kwok cluster
          uses: test/daemon-check-output
          with:
            setup: |
              kubectl create namespace istio-system
            start: pilot-discovery discovery --monitoringAddr=:15014
            expected_output: "Starting"
            timeout: 30
            post: |
              set -euo pipefail
              # Verify ready endpoint responds (fails test if not ready)
              curl -sf http://localhost:8080/ready && echo "SUCCESS: ready endpoint responding"

  - name: istio-pilot-discovery-${{vars.major-minor-version}}-compat
    pipeline:
      - runs: |
          # link /usr/local/bin/pilot-discovery -> /usr/bin/pilot-discovery to match
          # what the Istio Helm charts may expect.
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -sf /usr/bin/pilot-discovery ${{targets.subpkgdir}}/usr/local/bin/pilot-discovery
    dependencies:
      provides:
        - istio-discovery-compat=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: istio-discovery-compat
            real-pkg-name: ${{subpkg.name}}

update:
  enabled: true
  ignore-regex-patterns:
    - '-rc'
    - '-beta'
  github:
    identifier: istio/istio
    tag-filter-prefix: 1.27.
    use-tag: true

test:
  environment:
    contents:
      packages:
        - jq
        - grep
        - istio-pilot-agent-${{vars.major-minor-version}}
        - istio-pilot-discovery-${{vars.major-minor-version}}
  pipeline:
    - runs: |-
        set -euo pipefail
        # check version/tag/commit are not "unknown" for pilot-discovery
        # Verify version matches package version (fails test if mismatch)
        pilot-discovery version -o json | jq .clientVersion.version | grep -F ${{package.version}}
        # Verify revision is set (fails test if "unknown")
        pilot-discovery version -o json | jq .clientVersion.revision | grep -vF unknown
        # Verify tag is set (fails test if "unknown")
        pilot-discovery version -o json | jq .clientVersion.tag | grep -vF unknown

        # check version/tag/commit are not "unknown" for pilot-agent
        # Verify version matches package version (fails test if mismatch)
        pilot-agent version -o json | jq .clientVersion.version | grep -F ${{package.version}}
        # Verify revision is set (fails test if "unknown")
        pilot-agent version -o json | jq .clientVersion.revision | grep -vF unknown
        # Verify tag is set (fails test if "unknown")
        pilot-agent version -o json | jq .clientVersion.tag | grep -vF unknown
