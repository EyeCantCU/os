#nolint:git-checkout-must-use-github-updates
package:
  name: py3-onnx-graphsurgeon
  version: "10.14"
  epoch: 2 # go/enterprise-rsc/py3-onnx-graphsurgeon
  description: ONNX GraphSurgeon is a Python library that allows you to create and modify ONNX models
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 8Gi

vars:
  pypi-package: onnx-graphsurgeon
  import: onnx_graphsurgeon

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-numpy-2.2
      - py3-supported-onnx

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/TensorRT
      tag: v${{package.version}}
      expected-commit: 3b4ddc1d45f11167f2ea53dc6046bba8df800e2d
      cherry-picks: |
        main/d53588c081c3e80f4d0fd7b7ac41e397f8cc1811: Support onnx 1.20 by using ml_dtypes

  - uses: patch
    with:
      patches: unpin-onnx.patch

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-onnx
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
        working-directory: tools/onnx-graphsurgeon
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: NVIDIA/TensorRT
    tag-filter-prefix: v
    strip-prefix: v
