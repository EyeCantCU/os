#nolint:valid-pipeline-git-checkout-tag
package:
  name: spark-fips-3.5
  version: "3.5.4"
  epoch: 21 # Bump netty to 4.1.130.Final
  description: Unified engine for large-scale data analytics
  copyright:
    - license: Apache-2.0

vars:
  grpc-version: "1.56.0"
  hadoop-version: "3.3.6"
  java-version: "8"
  test-java-version: "11"
  python-version: "3.11"

environment:
  contents:
    packages:
      - R
      - R-dev
      - bash
      - bouncycastle-fips~2.1
      - busybox
      - ca-certificates-bundle
      - curl
      - glibc-iconv
      - glibc-locale-en
      - grep
      - grpc-java-fips-${{vars.grpc-version}}-m2
      - hadoop-fips-${{vars.hadoop-version}}-m2
      - maven
      - openjdk-${{vars.java-version}}-default-jdk
      - perl-utils
      - procps
      - protobuf-dev
      - py${{vars.python-version}}-pip
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}
      - yaml-dev
  environment:
    APACHE_MIRROR: "https://repo.maven.apache.org/maven2/org"
    MAVEN_OPTS: "-Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Daether.connector.http.connectionMaxTtl=25"
    JAVA_OPTS: "-Xms4g -Xmx4g"
    JAVA_HOME: /usr/lib/jvm/default-jvm
    LANG: en_US.UTF-8

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/ecosystems-spark

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/ecosystems-spark.git
      expected-commit: 7906f010cba03e8bd49060d03fcb14627cc3ee33
      branch: fips-${{package.version}}

  - uses: maven/pombump

subpackages:
  - name: ${{package.name}}-scala-2.12
    dependencies:
      # Both `python` and `openjdk-{11,17}-default-jvm` are required for running Spark,
      # but will be added in the image, since upstream supports different Python versions
      # and Java versions. So we don't need to specify them here to avoid conflicts.
      runtime:
        - bash
        - busybox
        - procps
        - posix-libc-utils
        - tini
        - net-tools
        - linux-pam
        - libnss
        - openssl-config-fipshardened
        - openssl
    pipeline:
      - uses: patch
        with:
          patches: guava.patch mvn.patch
      - runs: |
          ./dev/make-distribution.sh --name custom-spark --pip \
            -Psparkr -Phive -Phive-thriftserver -Pmesos -Pyarn -Pkubernetes \
            -Dmaven.repo.local=/usr/share/m2/repository -Daether.syncContext.named.time=10 \
            -T$(grep -c processor /proc/cpuinfo)

          mkdir -p ${{targets.contextdir}}/usr/lib/spark/work-dir
          mv dist/kubernetes/dockerfiles/spark/entrypoint.sh ${{targets.contextdir}}/usr/lib/spark
          mv dist/* ${{targets.contextdir}}/usr/lib/spark/
          mv ${{targets.contextdir}}/usr/lib/spark/examples/jars/spark-examples_2.12-${{package.version}}.jar ${{targets.contextdir}}/usr/lib/spark/examples/jars/spark-examples.jar

          # Symlink BCFIPS JARs to Spark classpath
          ln -s /usr/share/java/bouncycastle-fips/* ${{targets.contextdir}}/usr/lib/spark/jars/
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}-scala-2.12-compat
            - R
            - bcfips-policy-140-3-j${{vars.test-java-version}}
            - openjdk-${{vars.test-java-version}}-default-jvm
            - python3
            - wait-for-it
        environment:
          SPARK_CONF: "--conf spark.ssl.enabled=true --conf spark.ssl.protocol=TLSv1.3 --conf spark.network.crypto.enabled=true --conf spark.authenticate=true --conf spark.authenticate.secret=AbCdEfG0%12345678NotReal --conf spark.io.encryption.enabled=true --conf spark.ssl.keyPassword=AbCdEfG0%12345678NotReal --conf spark.ssl.keyStorePassword=AbCdEfG0%12345678NotReal --conf spark.ssl.trustStorePassword=AbCdEfG0%12345678NotReal --conf spark.ssl.keyStoreType=BCFKS --conf spark.ssl.trustStoreType=BCFKS --conf spark.ssl.keyStore=/opt/spark/conf/keystore.bcfks --conf spark.ssl.trustStore=/opt/spark/conf/truststore.bcfks --conf spark.ssl.keyStore=/opt/spark/conf/keystore.bcfks --conf spark.ssl.trustStore=/opt/spark/conf/truststore.bcfks"
          SPARK_HOME: "/usr/lib/spark"
          JAVA_HOME: "/usr/lib/jvm/default-jvm"
          CLASSPATH: "/usr/share/java/bouncycastle-fips/*:./*:."
          JAVA_TOOL_OPTIONS: "--module-path=/usr/share/java/bouncycastle-fips"
          JAVA_TRUSTSTORE_OPTIONS: "-Djavax.net.ssl.trustStoreType=BCFKS"
          JDK_JAVA_OPTIONS: "--add-exports=java.base/sun.security.internal.spec=ALL-UNNAMED --add-exports=java.base/sun.security.provider=ALL-UNNAMED -Djavax.net.ssl.trustStoreType=BCFKS"
      pipeline:
        - name: Spark utils version check
          runs: |
            spark-shell --version
            spark-submit --version
            pyspark --version
            spark-sql --version
        - name: Generate KeyStore
          runs: |
            keytool \
              -v -keystore /usr/lib/spark/conf/keystore.bcfks \
              -storetype bcfks \
              -providername BCFIPS \
              -alias localhost \
              -genkeypair -sigalg SHA512withRSA -keyalg RSA \
              -dname CN=localhost \
              -storepass "AbCdEfG0%12345678NotReal"
        - name: Generate TrustStore
          runs: |
            keytool \
              -v -keystore /usr/lib/spark/conf/truststore.bcfks \
              -storetype bcfks \
              -providername BCFIPS \
              -alias localhost \
              -genkeypair -sigalg SHA512withRSA -keyalg RSA \
              -dname CN=localhost \
              -storepass "AbCdEfG0%12345678NotReal"
        - name: Start and wait for Spark
          runs: |
            /opt/entrypoint.sh spark-shell ${SPARK_CONF} &> spark_output.txt &
            if ! wait-for-it localhost:4440; then
              cat ./spark_output.txt
              exit 1
            fi
        - name: Calculate sum
          runs: spark-submit ./sum.py --master spark://localhost:4440 ${SPARK_CONF}
        - name: Perform basic SQL query
          runs: spark-submit ./SQLQuery.R --master spark://localhost:4440 ${SPARK_CONF}
        - name: Calculate avg salary
          runs: spark-submit ./salaries.py --master spark://localhost:4440 ${SPARK_CONF}

  - name: ${{package.name}}-scala-2.12-compat
    description: "Compatibility package to place binaries in the location expected by upstream image"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/opt
          ln -s /usr/lib/spark/entrypoint.sh ${{targets.contextdir}}/opt/entrypoint.sh
          ln -s /usr/lib/spark/kubernetes/dockerfiles/spark/decom.sh ${{targets.contextdir}}/opt/decom.sh
          ln -s /usr/lib/spark ${{targets.contextdir}}/opt/spark

          mkdir -p ${{targets.contextdir}}/usr/bin
          for path in ${{targets.outdir}}/${{package.name}}-scala-2.12/usr/lib/spark/bin/*; do
            name=${path##*/}
            ln -s ../lib/spark/bin/$name ${{targets.contextdir}}/usr/bin/$name
          done

  - name: ${{package.name}}-scala-2.13
    dependencies:
      runtime:
        - bash
        - busybox
        - procps
        - posix-libc-utils
        - tini
        - net-tools
        - linux-pam
        - libnss
        - openssl-config-fipshardened
        - openssl
    pipeline:
      - runs: |
          git stash
          mvn clean
      - uses: patch
        with:
          patches: guava.patch mvn.patch
      - runs: |
          ./dev/change-scala-version.sh 2.13
      - uses: maven/pombump
        with:
          properties-file: pombump-properties-2.13.yaml
      - uses: maven/pombump
        with:
          patch-file: pombump-deps.yaml
      - runs: |
          ./dev/make-distribution.sh --name pyspark-2.13 \
            --pip --tgz -Pscala-2.13 -Phive -Phive-thriftserver -Pkubernetes -Pyarn \
            -Dmaven.repo.local=/usr/share/m2/repository -Daether.syncContext.named.time=10 \
            -T$(grep -c processor /proc/cpuinfo)

          mkdir -p ${{targets.contextdir}}/usr/lib/spark
          mv dist/kubernetes/dockerfiles/spark/entrypoint.sh ${{targets.contextdir}}/usr/lib/spark
          mv dist/* ${{targets.contextdir}}/usr/lib/spark/
          mv ${{targets.contextdir}}/usr/lib/spark/examples/jars/spark-examples_2.13-${{package.version}}.jar ${{targets.contextdir}}/usr/lib/spark/examples/jars/spark-examples.jar

          # Symlink BCFIPS JARs to Spark classpath
          ln -s /usr/share/java/bouncycastle-fips/* ${{targets.contextdir}}/usr/lib/spark/jars/
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}-scala-2.13-compat
            - R
            - bcfips-policy-140-3-j${{vars.test-java-version}}
            - openjdk-${{vars.test-java-version}}-default-jvm
            - python3
            - wait-for-it
        environment:
          SPARK_CONF: "--conf spark.ssl.enabled=true --conf spark.ssl.protocol=TLSv1.3 --conf spark.network.crypto.enabled=true --conf spark.authenticate=true --conf spark.authenticate.secret=AbCdEfG0%12345678NotReal --conf spark.io.encryption.enabled=true --conf spark.ssl.keyPassword=AbCdEfG0%12345678NotReal --conf spark.ssl.keyStorePassword=AbCdEfG0%12345678NotReal --conf spark.ssl.trustStorePassword=AbCdEfG0%12345678NotReal --conf spark.ssl.keyStoreType=BCFKS --conf spark.ssl.trustStoreType=BCFKS --conf spark.ssl.keyStore=/opt/spark/conf/keystore.bcfks --conf spark.ssl.trustStore=/opt/spark/conf/truststore.bcfks --conf spark.ssl.keyStore=/opt/spark/conf/keystore.bcfks --conf spark.ssl.trustStore=/opt/spark/conf/truststore.bcfks"
          SPARK_HOME: "/usr/lib/spark"
          JAVA_HOME: "/usr/lib/jvm/default-jvm"
          CLASSPATH: "/usr/share/java/bouncycastle-fips/*:./*:."
          JAVA_TOOL_OPTIONS: "--module-path=/usr/share/java/bouncycastle-fips"
          JAVA_TRUSTSTORE_OPTIONS: "-Djavax.net.ssl.trustStoreType=BCFKS"
          JDK_JAVA_OPTIONS: "--add-exports=java.base/sun.security.internal.spec=ALL-UNNAMED --add-exports=java.base/sun.security.provider=ALL-UNNAMED -Djavax.net.ssl.trustStoreType=BCFKS"
      pipeline:
        - name: Spark utils version check
          runs: |
            spark-shell --version
            spark-submit --version
            pyspark --version
            spark-sql --version
        - name: Generate KeyStore
          runs: |
            keytool \
              -v -keystore /usr/lib/spark/conf/keystore.bcfks \
              -storetype bcfks \
              -providername BCFIPS \
              -alias localhost \
              -genkeypair -sigalg SHA512withRSA -keyalg RSA \
              -dname CN=localhost \
              -storepass "AbCdEfG0%12345678NotReal"
        - name: Generate TrustStore
          runs: |
            keytool \
              -v -keystore /usr/lib/spark/conf/truststore.bcfks \
              -storetype bcfks \
              -providername BCFIPS \
              -alias localhost \
              -genkeypair -sigalg SHA512withRSA -keyalg RSA \
              -dname CN=localhost \
              -storepass "AbCdEfG0%12345678NotReal"
        - name: Start and wait for Spark
          runs: |
            /opt/entrypoint.sh spark-shell ${SPARK_CONF} &> spark_output.txt &
            if ! wait-for-it localhost:4440; then
              cat ./spark_output.txt
              exit 1
            fi
        - name: Calculate sum
          runs: spark-submit ./sum.py --master spark://localhost:4440 ${SPARK_CONF}
        - name: Perform basic SQL query
          runs: spark-submit ./SQLQuery.R --master spark://localhost:4440 ${SPARK_CONF}
        - name: Calculate avg salary
          runs: spark-submit ./salaries.py --master spark://localhost:4440 ${SPARK_CONF}

  - name: ${{package.name}}-scala-2.13-compat
    description: "Compatibility package to place binaries in the location expected by upstream image"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/opt
          ln -s /usr/lib/spark ${{targets.contextdir}}/opt/spark
          ln -s /usr/lib/spark/kubernetes/dockerfiles/spark/decom.sh ${{targets.contextdir}}/opt/decom.sh
          ln -s /usr/lib/spark/entrypoint.sh ${{targets.contextdir}}/opt/entrypoint.sh

          mkdir -p ${{targets.contextdir}}/usr/bin
          for path in ${{targets.outdir}}/${{package.name}}-scala-2.13/usr/lib/spark/bin/*; do
            name=${path##*/}
            ln -s ../lib/spark/bin/$name ${{targets.contextdir}}/usr/bin/$name
          done

update:
  enabled: false
  manual: true
  exclude-reason: FIPS & Starts project maintained by ecosystems

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
