package:
  name: chart-iamguarded-flux
  version: "2.4.36"
  epoch: 3
  description: flux iamguarded chart
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: flux/${{package.version}}
      expected-commit: b1daae900d8764b740be6e9798d4590a5071d123

  - uses: patch
    with:
      patches: iamguarded.patch flux-image-crds-v1.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/flux

  - uses: charts/package
    with:
      chart-path: iamguarded/flux

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: flux/
    use-tag: true
    tag-filter-prefix: flux/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /flux
