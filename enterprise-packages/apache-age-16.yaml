package:
  name: apache-age-16
  version: "1.6.0"
  epoch: 0
  description: Graph database extension for PostgreSQL - openCypher query support
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - apache-age=${{package.full-version}}
    runtime:
      - glibc-locales
      - postgresql-${{vars.pg-version}}
      - postgresql-${{vars.pg-version}}-client

var-transforms:
  - from: ${{package.name}}
    match: '^apache-age-(\d+)$'
    replace: $1
    to: pg-version

environment:
  contents:
    packages:
      - bison
      - busybox
      - clang-19
      - flex
      - perl
      - postgresql-${{vars.pg-version}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/age
      tag: PG${{vars.pg-version}}/v${{package.version}}-rc0
      expected-commit: 2db2f060c4c9265a14d40f007eb8c56febf31e4c

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      install -Dm755 docker/docker-entrypoint-initdb.d/00-create-extension-age.sql \
        "${{targets.destdir}}/docker-entrypoint-initdb.d/00-create-extension-age.sql"

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility symlinks for upstream Docker image paths
    dependencies:
      provides:
        - apache-age-compat=${{package.full-version}}
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          # Reference: https://github.com/apache/age/blob/PG16/v1.6.0-rc0/docker/Dockerfile
          mkdir -p "${{targets.contextdir}}/usr/lib/postgresql/${{vars.pg-version}}/lib"
          ln -sf ../../../postgresql${{vars.pg-version}}/age.so \
            "${{targets.contextdir}}/usr/lib/postgresql/${{vars.pg-version}}/lib/age.so"

          mkdir -p "${{targets.contextdir}}/usr/share/postgresql/${{vars.pg-version}}/extension"
          ln -sf ../../../postgresql${{vars.pg-version}}/extension/age--${{package.version}}.sql \
            "${{targets.contextdir}}/usr/share/postgresql/${{vars.pg-version}}/extension/age--${{package.version}}.sql"
          ln -sf ../../../postgresql${{vars.pg-version}}/extension/age.control \
            "${{targets.contextdir}}/usr/share/postgresql/${{vars.pg-version}}/extension/age.control"
    test:
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  github:
    identifier: apache/age
    tag-filter-prefix: PG16/v
    strip-prefix: PG16/v
    strip-suffix: -rc0

test:
  environment:
    contents:
      packages:
        - shadow
        - sudo-rs
    environment:
      PGUSER: wolfi
      PGDATA: /tmp/pgdata
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify extension files exist and are not empty
      runs: |
        set -euo pipefail
        test -s /usr/lib/postgresql${{vars.pg-version}}/age.so
        test -s /usr/share/postgresql${{vars.pg-version}}/extension/age--${{package.version}}.sql
        test -s /usr/share/postgresql${{vars.pg-version}}/extension/age.control
        test -s /docker-entrypoint-initdb.d/00-create-extension-age.sql
        grep -F "CREATE EXTENSION age" /docker-entrypoint-initdb.d/00-create-extension-age.sql
    - name: Test Apache AGE extension
      runs: |
        set -euo pipefail
        useradd $PGUSER
        sudo -u $PGUSER initdb -D $PGDATA
        sudo -u $PGUSER pg_ctl start -D $PGDATA -l /tmp/pglog

        until pg_isready -h localhost -U $PGUSER; do
          sleep 2
        done

        # Setup: Create extension and graph
        psql postgres << 'EOF'
        CREATE EXTENSION age;
        LOAD 'age';
        SET search_path = ag_catalog, "$user", public;
        SELECT create_graph('test_graph');
        EOF

        # Create vertices and validate output
        psql postgres -c "LOAD 'age'; SET search_path = ag_catalog, \"\$user\", public; SELECT * FROM cypher('test_graph', \$\$ CREATE (n:Person {name: 'Alice', age: 30}) RETURN n \$\$) AS (n agtype);" | grep -F "Alice"
        psql postgres -c "LOAD 'age'; SET search_path = ag_catalog, \"\$user\", public; SELECT * FROM cypher('test_graph', \$\$ CREATE (n:Person {name: 'Bob', age: 25}) RETURN n \$\$) AS (n agtype);" | grep -F "Bob"

        # Create an edge and validate output
        psql postgres -c "LOAD 'age'; SET search_path = ag_catalog, \"\$user\", public; SELECT * FROM cypher('test_graph', \$\$ MATCH (a:Person {name: 'Alice'}), (b:Person {name: 'Bob'}) CREATE (a)-[r:KNOWS {since: 2020}]->(b) RETURN r \$\$) AS (r agtype);" | grep -F "KNOWS"

        # Query vertices and validate both are returned
        psql postgres -c "LOAD 'age'; SET search_path = ag_catalog, \"\$user\", public; SELECT * FROM cypher('test_graph', \$\$ MATCH (n:Person) RETURN n.name \$\$) AS (name agtype);" | grep -F "Alice"
        psql postgres -c "LOAD 'age'; SET search_path = ag_catalog, \"\$user\", public; SELECT * FROM cypher('test_graph', \$\$ MATCH (n:Person) RETURN n.name \$\$) AS (name agtype);" | grep -F "Bob"

        # Query edge relationship and validate
        psql postgres -c "LOAD 'age'; SET search_path = ag_catalog, \"\$user\", public; SELECT * FROM cypher('test_graph', \$\$ MATCH (a:Person)-[r:KNOWS]->(b:Person) RETURN a.name, r.since, b.name \$\$) AS (name1 agtype, since agtype, name2 agtype);" | grep -F "2020"
