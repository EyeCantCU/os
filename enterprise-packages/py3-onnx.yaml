package:
  name: py3-onnx
  version: "1.20.1"
  epoch: 1
  description: Open Neural Network Exchange
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

vars:
  pypi-package: onnx

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - abseil-cpp-dev
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - ninja
      - protobuf-dev
      - py3-supported-build-base-dev
      - py3-supported-nanobind
      - wolfi-base
  environment:
    CMAKE_ARGS: -DONNX_USE_PROTOBUF_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -DCMAKE_BUILD_TYPE=MinSizeRel

pipeline:
  - uses: fetch
    with:
      expected-sha256: ded16de1df563d51fbc1ad885f2a426f814039d8b5f4feb77febe09c0295ad67
      uri: https://files.pythonhosted.org/packages/source/o/onnx/onnx-${{package.version}}.tar.gz

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-protobuf
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-typing-extensions
        - py${{range.key}}-ml-dtypes
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - runs: rm -rf .setuptools-cmake-build
      - name: Create CMake config file to enable finding the version-appropriate nanobind-config.cmake
        runs: |
          # Per https://nanobind.readthedocs.io/en/latest/building.html#finding-nanobind
          cat <<EOF > /home/build/cmake/external/Findnanobind.cmake
          execute_process(
            COMMAND /usr/bin/python${{range.key}} -m nanobind --cmake_dir
            OUTPUT_STRIP_TRAILING_WHITESPACE OUTPUT_VARIABLE nanobind_ROOT)

          find_package(nanobind CONFIG REQUIRED)
          EOF
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: "move usr/bin executables for -bin"
        runs: |
          mkdir -p ./cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./cleanup/${{range.key}}/
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - uses: test/tw/ldd-check
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}
            real-pkg-name: ${{subpkg.name}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
      provides:
        - py3-${{vars.pypi-package}}-bin
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - runs: |
            backend-test-tools --help
            check-model --help
            check-node --help
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}-bin
            real-pkg-name: ${{subpkg.name}}
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}
            real-pkg-name: ${{subpkg.name}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  release-monitor:
    identifier: 146229

test:
  pipeline:
    - uses: test/tw/byproductpackage
