package:
  name: gdal-no-py
  version: "3.12.1"
  epoch: 0
  description: GDAL library and tools without Python/Java bindings
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - bash
      - bash-completion
      - busybox
      - ca-certificates
      - ca-certificates-bundle
      - expat
      - libarchive
      - libcurl-openssl4
      - libdeflate
      - libjpeg-turbo
      - libpng
      - libpq
      - libwebp
      - lz4
      - mimalloc2
      - muparser
      - openjpeg
      - proj-util
      - sqlite-libs
      - tiff
      - wget
      - zlib
      - zstd

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - curl-dev
      - expat-dev
      - json-c-dev
      - libarchive-dev
      - libdeflate-dev
      - libecpg-18-dev
      - libgeotiff-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libwebp-dev
      - lz4-dev
      - muparser-dev
      - openjpeg-dev
      - openssl-dev
      - postgresql-18-dev
      - proj-dev
      - sqlite-dev
      - tiff-dev
      - zlib-dev
      - zstd-dev
      - zstd-static

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/OSGeo/gdal
      tag: v${{package.version}}
      expected-commit: 21882def44a088a6a1d5b2d6235b0083cfe6bada

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_TESTING=OFF \
        -DBUILD_APPS=ON \
        -DOGR_ENABLE_DRIVER_PG=ON \
        -DGDAL_USE_CRYPTOPP=OFF \
        -DOGR_ENABLE_DRIVER_PG_PLUGIN=ON \
        -DPostgreSQL_INCLUDE_DIR=/usr/include \
        -DGDAL_FIND_PACKAGE_PROJ_MODE=MODULE \
        -DGDAL_USE_TIFF_INTERNAL=ON \
        -DGDAL_USE_GEOTIFF_INTERNAL=ON \
        -DGDAL_ENABLE_PLUGINS=ON \
        -DBUILD_PYTHON_BINDINGS=OFF \
        -DBUILD_JAVA_BINDINGS=OFF \
        -DGDAL_USE_MUPARSER=ON \
        -DGDAL_USE_WEBP=ON \
        -DGDAL_USE_JPEG=ON \
        -DGDAL_USE_PNG=ON \
        -DGDAL_USE_OPENJPEG=ON

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

  - runs: |
      # Remove unused turbojpeg and webp libraries like upstream
      rm -f ${{targets.destdir}}/usr/lib/libturbojpeg.so*
      rm -f ${{targets.destdir}}/usr/lib/libwebpmux.so*
      rm -f ${{targets.destdir}}/usr/lib/libwebpdemux.so*
      rm -f ${{targets.destdir}}/usr/lib/libwebpdecoder.so*

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: gdalinfo
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: |
          gdal_translate
          gdaltransform
          gdalwarp
          gdaldem
          gdalbuildvrt
          gdaladdo
          gdal_grid
          gdal_rasterize
          gdal_contour
          gdaltindex
          ogr2ogr
          ogrlineref
          ogrtindex
    - runs: |
        # Check expected formats are present
        gdalinfo --formats > gdalformats.txt
        for format in GTiff JPEG PNG WEBP JP2OpenJPEG GIF; do
          grep -F "$format" gdalformats.txt
        done

        ogrinfo --formats > ogrformats.txt
        for format in PostgreSQL SQLite GeoJSON; do
          grep -F "$format" ogrformats.txt
        done

        # Check unwanted formats are NOT present
        gdalinfo --formats | grep -F -v -e "HDF5"
        gdalinfo --formats | grep -F -v -e "EXR"
        ogrinfo --formats | grep -F -v -e "Arrow"
        ogrinfo --formats | grep -F -v -e "Parquet"

        # Check no language bindings
        ! test -d /usr/lib/python*/site-packages/osgeo
        ! test -f /usr/lib/libgdalalljni.so

subpackages:
  - name: ${{package.name}}-dev
    description: GDAL development files
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - runs: |
            stat /usr/include/gdal.h
            stat /usr/include/gdal_alg.h
            stat /usr/include/ogr_api.h
            stat /usr/include/ogr_srs_api.h

update:
  enabled: true
  github:
    identifier: OSGeo/gdal
    strip-prefix: v
    use-tag: true
