package:
  name: gdal-no-py
  version: "3.12.1"
  epoch: 0
  description: GDAL library and tools without Python/Java bindings
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - bash
      - busybox
      - ca-certificates
      - ca-certificates-bundle
      - expat
      - libarchive
      - libcurl-openssl4
      - libdeflate
      - libjpeg-turbo
      - libpng
      - libpq
      - libwebp
      - lz4
      - mimalloc2
      - muparser
      - openjpeg
      - proj-util
      - sqlite-libs
      - tiff
      - wget
      - zlib
      - zstd

environment:
  contents:
    packages:
      # ONLY what upstream alpine-small installs - no more, no less
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - curl-dev
      - expat-dev
      - json-c-dev
      - libarchive-dev
      - libdeflate-dev
      - libecpg-18-dev
      - libgeotiff-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libwebp-dev
      - lz4-dev
      - muparser-dev
      - openjpeg-dev
      - openssl-dev
      - postgresql-18-dev
      - proj-dev
      - sqlite-dev
      - tiff-dev
      - zlib-dev
      - zstd-dev
      - zstd-static

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/OSGeo/gdal/releases/download/v${{package.version}}/gdal-${{package.version}}.tar.xz
      expected-sha256: 2a4fd3170ff81def93db60f7f61f2842a2ae7ad0335e4ed4ba305252f05835de

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCMAKE_BUILD_TYPE=Release \
        -DBUILD_TESTING=OFF \
        -DBUILD_APPS=ON \
        -DOGR_ENABLE_DRIVER_PG=ON \
        -DGDAL_USE_CRYPTOPP=OFF \
        -DOGR_ENABLE_DRIVER_PG_PLUGIN=ON \
        -DPostgreSQL_INCLUDE_DIR=/usr/include \
        -DGDAL_FIND_PACKAGE_PROJ_MODE=MODULE \
        -DGDAL_USE_TIFF_INTERNAL=ON \
        -DGDAL_USE_GEOTIFF_INTERNAL=ON \
        -DGDAL_ENABLE_PLUGINS=ON \
        -DBUILD_PYTHON_BINDINGS=OFF \
        -DBUILD_JAVA_BINDINGS=OFF \
        -DGDAL_USE_MUPARSER=ON \
        -DGDAL_USE_WEBP=ON \
        -DGDAL_USE_JPEG=ON \
        -DGDAL_USE_PNG=ON \
        -DGDAL_USE_OPENJPEG=ON

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

  - runs: |
      # Remove unused turbojpeg and webp libraries like upstream
      rm -f ${{targets.destdir}}/usr/lib/libturbojpeg.so*
      rm -f ${{targets.destdir}}/usr/lib/libwebpmux.so*
      rm -f ${{targets.destdir}}/usr/lib/libwebpdemux.so*
      rm -f ${{targets.destdir}}/usr/lib/libwebpdecoder.so*

  - runs: |
      cmake \
        --build output \
        --target clean

test:
  pipeline:
    - runs: |
        # Version check
        gdalinfo --version | grep "GDAL 3.12.1"

        # Check expected formats are present
        gdalinfo --formats | grep "GTiff"
        gdalinfo --formats | grep "JPEG"
        gdalinfo --formats | grep "PNG"
        gdalinfo --formats | grep "WEBP"
        gdalinfo --formats | grep "JP2OpenJPEG"
        gdalinfo --formats | grep "GIF"
        ogrinfo --formats | grep "PostgreSQL"
        ogrinfo --formats | grep "SQLite"
        ogrinfo --formats | grep "GeoJSON"

        # Check all the tools exist
        test -f /usr/bin/gdal_translate
        test -f /usr/bin/gdaltransform
        test -f /usr/bin/gdalwarp
        test -f /usr/bin/gdaldem
        test -f /usr/bin/gdalbuildvrt
        test -f /usr/bin/gdaladdo
        test -f /usr/bin/gdal_grid
        test -f /usr/bin/gdal_rasterize
        test -f /usr/bin/gdal_contour
        test -f /usr/bin/gdaltindex
        test -f /usr/bin/ogr2ogr
        test -f /usr/bin/ogrlineref
        test -f /usr/bin/ogrtindex

        # Check unwanted formats are NOT present
        ! gdalinfo --formats | grep "^  HDF5 "
        ! gdalinfo --formats | grep "^  EXR "
        ! ogrinfo --formats | grep "^  Arrow "
        ! ogrinfo --formats | grep "^  Parquet "


        # Check no language bindings
        ! test -d /usr/lib/python*/site-packages/osgeo
        ! test -f /usr/lib/libgdalalljni.so

        # Check header exists
        test -f /usr/include/gdal.h

update:
  enabled: true
  github:
    identifier: OSGeo/gdal
    strip-prefix: v
    use-tag: true
