package:
  name: chart-jouve-mailpit
  version: "0.31.2"
  epoch: 0
  description: An email and SMTP testing tool with API for developers
  copyright:
    - license: GPL-3.0-or-later

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jouve/charts
      tag: mailpit-${{package.version}}
      expected-commit: 6d4e5db90fc9ecbe5d9c2dcee1a49b23be21abba

  - uses: charts/package
    with:
      chart-path: charts/mailpit
      images: |
        mailpit:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${tag}
              digest: ${digest}
      test: |
        cases:
          - name: default
            images: [mailpit]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: jouve/charts
    strip-prefix: mailpit-
    use-tag: true
    tag-filter-prefix: mailpit-
