package:
  name: py3-tinyhtml5
  version: 2.0.0
  epoch: 0
  description: A lightweight HTML5 parser that transforms HTML documents into ElementTree structures
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0

vars:
  pypi-package: tinyhtml5
  module-name: tinyhtml5

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-wheel
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/CourtBouillon/tinyhtml5
      tag: ${{package.version}}
      expected-commit: d671717b852d7971cea9173737b3781d160b440c

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-webencodings
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.module-name}}
        - runs: |
            set -euo pipefail

            # Test HTML5 parsing
            python${{range.key}} <<'EOF'
            import tinyhtml5

            # Parse a simple HTML document
            html_string = """
            <!DOCTYPE html>
            <html>
              <head>
                <title>Test Document</title>
              </head>
              <body>
                <h1>Hello, World!</h1>
                <p>This is a test paragraph.</p>
              </body>
            </html>
            """

            # Parse HTML into Element
            root = tinyhtml5.parse(html_string)

            # Verify we got an Element
            assert root is not None, "Should return an Element"
            assert root.tag.endswith('html'), "Root should be html element"

            # Find the title element
            title = root.find('.//{http://www.w3.org/1999/xhtml}title')
            assert title is not None, "Should find title element"
            assert 'Test Document' in title.text, "Title should contain expected text"

            # Find the h1 element
            h1 = root.find('.//{http://www.w3.org/1999/xhtml}h1')
            assert h1 is not None, "Should find h1 element"
            assert 'Hello, World!' in h1.text, "H1 should contain expected text"

            print("tinyhtml5 HTML parsing test passed!")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  git: {}
