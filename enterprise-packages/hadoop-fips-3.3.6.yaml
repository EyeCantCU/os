#nolint:valid-pipeline-git-checkout-tag
package:
  name: hadoop-fips-3.3.6
  version: 3.3.6
  epoch: 20 # Bump netty to 4.1.130.Final
  description: Maven repository for Hadoop FIPS
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - hadoop-fips-${{package.version}}-m2=${{package.full-version}}

vars:
  python-version: '3.11'
  java-version: '8'

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - bzip2
      - cmake
      - doxygen
      - jq
      - maven
      - nodejs
      - npm
      - nvm
      - openjdk-${{vars.java-version}}-default-jdk
      - openssl-dev
      - protobuf-c-compiler
      - protobuf-c-dev
      - py${{vars.python-version}}-google-cloud-sdk
      - python-${{vars.python-version}}
      - snappy-dev
      - yarn
      - zlib-dev
      - zstd

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/ecosystems-hadoop

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/ecosystems-hadoop.git
      expected-commit: 4b03c2608ebf7a63d5b1ed903a31791f9afce5f1
      branch: fips-${{package.version}}

  - uses: maven/pombump
    with:
      properties-file: pombump-properties.yaml
      pom: pom.xml

  - uses: maven/pombump
    with:
      properties-file: hadoop-project-pombump-properties.yaml
      pom: hadoop-project/pom.xml

  - uses: maven/pombump
    with:
      properties-file: hadoop-yarn-csi-properties.yaml
      pom: hadoop-yarn-project/hadoop-yarn/hadoop-yarn-csi/pom.xml

  # NOTE: this was part of the remediation for CVE-2025-59250
  # we pombumped to a newer com.microsoft.sqlserver, but it makes this test fail
  - name: "update ensure-jars-have-correct-contents.sh to allow for newer mssql jar"
    runs: |
      sed -i '60a\ allowed_expr+="|^mssql/"' \
        hadoop-client-modules/hadoop-client-check-test-invariants/src/test/resources/ensure-jars-have-correct-contents.sh

  - runs: |
      # The version of nodejs in the hadoop-project/pom.xml is 12.22.1 which is older than the recommended version >14.17.0
      sed -i "s#<nodejs.version>v[0-9]\+\.[0-9]\+\.[0-9]\+</nodejs.version>#<nodejs.version>$(node --version)</nodejs.version>#" hadoop-project/pom.xml

      # Override any existing paths set for the local maven repository
      mvn clean install -Dmaven.repo.local=./.m2/repository -DskipTests -Dmaven.javadoc.skip=true

      # Copy Maven repository
      mkdir -p ${{targets.contextdir}}/usr/share/m2/repository
      cp -av ./.m2/repository/* ${{targets.contextdir}}/usr/share/m2/repository/

update:
  enabled: false
  manual: true

test:
  pipeline:
    - name: "verify the package has .jar files in a well known location"
      runs: |
        path="/usr/share/m2/repository/org/apache/hadoop/"
        if ! find "${path}" -name "*.jar" | grep -q . ; then
            echo "FAIL: no .jar files found in path '${path}'" >&2
            exit 1
        fi
