package:
  name: watchexec
  version: "2.5.0"
  epoch: 0 # GHSA-r6v5-fh4h-64xc
  description: Simple, standalone tool that executes commands in response to file modifications
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "8"
    memory: 13Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/watchexec/watchexec
      tag: v${{package.version}}
      expected-commit: 161d4bf80b077167b3e10c869553d6c3f4b95c01

  - uses: rust/cargobump

  - uses: cargo/build
    with:
      output: ${{package.name}}
      rustflags: "-C linker=/usr/local/bin/gcc"

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: watchexec
    - uses: test/tw/ver-check
      with:
        bins: watchexec
    - name: Basic functionality test - file watching
      runs: |
        mkdir -p /tmp/watchexec-test
        cd /tmp/watchexec-test
        echo "initial" > test.txt

        # Create a flag file to track command execution
        rm -f /tmp/watchexec-ran

        # Start watchexec in background to watch for changes
        # Use timeout to ensure we don't hang forever
        timeout 10s watchexec --watch . --shell=none -- sh -c 'echo ran > /tmp/watchexec-ran' &
        WATCHEXEC_PID=$!

        # Give watchexec time to start and initialize
        sleep 2

        # Modify the file to trigger watchexec
        echo "modified" > test.txt

        # Wait for watchexec to detect change and run command
        sleep 2

        # Check if command was executed
        if [ -f /tmp/watchexec-ran ]; then
          echo "SUCCESS: watchexec detected file change and executed command"
        else
          echo "FAIL: watchexec did not execute command"
          kill $WATCHEXEC_PID 2>/dev/null
          exit 1
        fi

        kill $WATCHEXEC_PID 2>/dev/null
        rm -rf /tmp/watchexec-test /tmp/watchexec-ran
