package:
  name: py3-simpleeval
  version: 1.0.3
  epoch: 0
  description: A simple, safe single expression evaluator library.
  copyright:
    - license: MIT

vars:
  pypi-package: simpleeval

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-hatchling

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/danthedeckie/simpleeval.git
      tag: ${{package.version}}
      expected-commit: b2b84bfba88603c8c0cef5de2650bc3d0b5b88a7

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | grep -F -e "121"
            from simpleeval import simple_eval
            print(simple_eval("square(11)", functions={"square": lambda x: x*x}))
            EOF

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
