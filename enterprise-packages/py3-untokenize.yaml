# Please note that the last release of this package was in Sept 2020 over pypy
# They have't cut tags on Github since 4 years.
# This project is small and looks complete and has no CVEs as of date
# So we can keep it as it is since it's an requirement for spamcheck image
package:
  name: py3-untokenize
  version: "0.1.1"
  epoch: 1 # go/enterprise-rsc/py3-untokenize
  description: Transforms tokens into original source code (while preserving whitespace).
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 4Gi

vars:
  pypi-package: untokenize
  import: untokenize

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-pip
      - py3-supported-python-dev
      - py3-supported-setuptools
      - py3-supported-wheel

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/myint/untokenize
      tag: v${{package.version}}
      expected-commit: ab1cfab86a2307a5009287030e3b9b0c0ea58464

  - uses: patch
    with:
      patches: support-python-3.14.patch

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: myint/untokenize
    strip-prefix: v
    use-tag: true
