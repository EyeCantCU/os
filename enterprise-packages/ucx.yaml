package:
  name: ucx
  version: "1.20.0"
  epoch: 0
  description: Unified Communication X (UCX) is an award winning, optimized production proven-communication framework for modern, high-bandwidth and low-latency networks.
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gcc-14 # ftbfs w/ gcc 15 as of 1.18.1
      - libstdc++-14-dev
      - libtool
      - rdma-core-dev
  environment:
    CC: gcc-14
    CXX: g++-14
    # flags last confirmed needed w/ 1.18.1 and GCC 14
    CFLAGS: -Wno-enum-int-mismatch -Wno-incompatible-pointer-types

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openucx/ucx
      tag: ${{package.version}}
      expected-commit: 4b7a6ca8410f9cea0e15857233ecfeefdd863dde

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ucx-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - libucx0
    description: ucx dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: libucx0
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr"
          mv "${{targets.destdir}}/usr/lib" "${{targets.contextdir}}/usr"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ucx-utils
    description: ucx utilities
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - runs: |
            ucx_info -h
            ucx_read_profile -h
        - runs: |
            io_demo &
            pid="$!"
            for i in $(seq 5); do
              if io_demo 127.0.0.1:1337; then
                kill "$pid" || true
                exit 0
              fi
              sleep 1
            done
            kill "$pid" || true
            exit 1

update:
  enabled: true
  github:
    identifier: openucx/ucx
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/contains-files
      with:
        dir: "/usr/share/ucx/perftest/"
        name: "*"
