package:
  name: coredns-fips-1.14
  version: "1.14.1"
  epoch: 6 # GHSA-9h8m-3fm2-qjrq
  description: CoreDNS is a DNS server that chains plugins
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
    provides:
      - coredns-fips=${{package.full-version}}
  resources:
    cpu: "8"
    memory: 19Gi

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
      - libcap-utils
      - make
      - wolfi-baselayout
  environment:
    CGO_ENABLED: 1

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 80527fd389841310a728cf862491129321c8a112
      repository: https://github.com/coredns/coredns
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.40.0

  - runs: |
      # Ensures plugins get included
      make check

  - uses: go/build
    with:
      ldflags: -X github.com/coredns/coredns/coremain.GitCommit=v${{package.version}}
      output: coredns
      packages: .
      go-package: go-fips

  - uses: strip

  - runs: setcap cap_net_bind_service=+ep "${{targets.destdir}}/usr/bin/coredns"

update:
  enabled: true
  github:
    identifier: coredns/coredns
    strip-prefix: v
    tag-filter: v1.14.

test:
  environment:
    contents:
      packages:
        - bind-tools
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: coredns
    - uses: test/tw/help-check
      with:
        bins: coredns
    - runs: |-
        set -euo pipefail
        tee Corefile <<EOF
        .:1053 {
            file /home/build/db.wolfi.dev
            log
            errors
            cache
        }
        EOF

        tee /home/build/db.wolfi.dev <<'EOF'
        $TTL 3600
        @    IN SOA ns1.wolfi.dev. admin.wolfi.dev. (
                  20240101   ; Serial
                  7200       ; Refresh
                  3600       ; Retry
                  1209600    ; Expire
                  3600 )     ; Negative Cache TTL
        ;
        @    IN NS  ns1.wolfi.dev.
        ;
        foo.wolfi.dev  IN TXT "hi"
        EOF

        coredns > out.log 2>&1 &
        sleep 2

        # Verify DNS query returns expected TXT record (fails test if missing)
        dig @localhost -p 1053 foo.wolfi.dev TXT +short | grep -F '"hi"'
