package:
  name: nri-f5-fips
  version: "2.9.3"
  epoch: 0 # CVE-2025-68119
  description: New Relic Infrastructure f5 Integration (FIPS)
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-f5
      expected-commit: 7195e3b38bb1c6d9072880a2ff696efcb4b0e3c7
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-f5
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-f5 ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-f5
          install -Dm644 legacy/f5-definition.yml ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/f5-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-f5
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-f5
    - uses: test/tw/ver-check
      with:
        bins: nri-f5
        version-flag: "-show_version"
    - name: "Test binary execution"
      uses: test/daemon-check-output
      with:
        start: |
          nri-f5 -username=xyz -password=xyz
        expected_output: |
          connect: connection refused
        error_strings: |
          FAIL
          Traceback.*most.recent.call
