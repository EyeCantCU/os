package:
  name: chart-cyberark-secrets-provider-for-k8s
  version: "1.7.8"
  epoch: 0
  description: A Helm chart for deploying CyberArk Secrets Provider for Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cyberark/secrets-provider-for-k8s
      tag: v${{package.version}}
      expected-commit: a81a6d3e0384b433e7fdc8db31b07be976546c63

  - uses: patch
    with:
      patches: cg-standards.patch

  - uses: charts/package
    with:
      chart-path: helm/secrets-provider
      images: |
        secrets-provider-for-k8s:
          values:
            secretsProvider:
              image: ${registry_repo}
              tag: ${tag}
              digest: ${digest}
      test: |
        values:
          environment:
            k8sSecrets:
              - test-secret
            conjur:
              conjurConnConfigMap: conjur-config
              authnLogin: "host/conjur/authn-k8s/my-cluster/apps/test"
        cases:
          - name: default
            images: [secrets-provider-for-k8s]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: cyberark/secrets-provider-for-k8s
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
