package:
  name: shellcheck
  version: "0.11.0"
  epoch: 1
  description: "A shell script static analysis tool"
  copyright:
    - license: "GPL-3.0-or-later"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cabal-install
      - libffi-dev
      - pandoc

pipeline:
  - uses: git-checkout
    with:
      repository: "https://github.com/koalaman/shellcheck"
      destination: "${{package.name}}"
      tag: "v${{package.version}}"
      expected-commit: "aac0823e6b58f8a499e856e93738082691cbf212"

  # When updating to a new version, uncomment this and follow its instructions:
  # - working-directory: "${{package.name}}"
  #   uses: haskell/record-dependencies
  #
  - uses: haskell/fetch-dependencies

  - working-directory: "${{package.name}}"
    runs: cabal install -j"$(nproc)" --installdir="${{targets.destdir}}/usr/bin" --install-method=copy shellcheck

  - working-directory: "${{package.name}}"
    runs: |
      ./manpage
      install -D -m644 shellcheck.1 "${{targets.destdir}}/usr/share/man/man1/shellcheck.1"

  - working-directory: "${{package.name}}"
    runs: cabal test -j"$(nproc)"

  - working-directory: "${{package.name}}"
    uses: haskell/install-cabal-freeze

  - uses: strip

subpackages:
  - name: shellcheck-doc
    pipeline:
      - uses: split/manpages
    description: "shellcheck manpages"
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  manual: true
  exclude-reason: "Requires manual updates using haskell/record-dependencies"
  github:
    identifier: koalaman/shellcheck
    strip-prefix: "v"
    tag-filter-prefix: "v"

test:
  pipeline:
    - runs: shellcheck --version
    - uses: test/tw/ldd-check
    - uses: test/no-docs
