# DO NOT CHANGE/BUMP/PATCH etc. WITHOUT CHECKING IN WITH OUR AZUL/ZULU PARTNERSHIP TEAM
#nolint:valid-pipeline-git-checkout-tag
package:
  name: zulu-25-cpu
  version: 25.0.1.0.101
  epoch: 1
  description: Zulu ${{vars.major-version}} Java development kit
  copyright:
    - license: GPL-2.0-with-classpath-exception
  dependencies:
    runtime:
      - alsa-lib
      - freetype
      - giflib
      - java-cacerts
      - lcms2
      - libfontconfig1
      - libjpeg-turbo
      - libx11
      - libxext
      - libxi
      - libxrender
      - libxtst
      - ttf-dejavu
      - zlib

vars:
  zulu-version: 25.31+14
  jtreg-version: 7.5+1
  jtreg-hash: 0ca08a11ee19cb56b65cbf85715b147d6ce6c3077775f05d76a7af63b03b5925
  java-home: /usr/lib/jvm/java-25-zulu
  boot-jdk: /usr/lib/jvm/java-25-openjdk
  pandoc-version: 2.19.2

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - alsa-lib-dev
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cups-dev
      - file
      - fontconfig-dev
      - freetype-dev
      - giflib-dev
      - java-cacerts
      - lcms2-dev
      - libffi-dev
      - libjpeg-turbo-dev
      - libx11-dev
      - libxext-dev
      - libxi-dev
      - libxrandr-dev
      - libxrender-dev
      - libxt-dev
      - libxtst-dev
      - openjdk-${{vars.major-version}}-default-jdk
      - zip
  environment:
    # This is needed to work around the error date 1970-01-01T00:00:00Z is not within the valid range 1980-01-01T00:00:02Z to 2099-12-31T23:59:59Z
    SOURCE_DATE_EPOCH: 315532900

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/zulu-jdk

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/zulu-jdk
      expected-commit: 38ad833613ef445979f6bda43ac0c216629a1162
      branch: cpu-25

  - runs: |
      mv /home/build/zsrc/* /home/build/

  - working-directory: /home/build/googletest
    pipeline:
      - uses: fetch
        with:
          uri: https://github.com/google/googletest/archive/v1.14.0.tar.gz
          expected-sha512: 765c326ccc1b87a01027385e69238266e356361cd4ee3e18e3c9d137a5d11fa5d657c164d02dd1be8fe693c8e10f2b580588dbfa57d27f070e2750f50d3e662c

  - working-directory: /home/build/pandoc
    pipeline:
      - if: ${{build.arch}} == "aarch64"
        uses: fetch
        with:
          uri: https://github.com/jgm/pandoc/releases/download/${{vars.pandoc-version}}/pandoc-${{vars.pandoc-version}}-linux-arm64.tar.gz
          expected-sha512: adb4eb5e3fa79d188d2123d132493c131dbedb408380012876b8ee80950cde4315ac179e9126d30d55221c3637b911b153ee4e6f550ccbc4dcd1f4828229974a
      - if: ${{build.arch}} == "x86_64"
        uses: fetch
        with:
          uri: https://github.com/jgm/pandoc/releases/download/${{vars.pandoc-version}}/pandoc-${{vars.pandoc-version}}-linux-amd64.tar.gz
          expected-sha512: c3c2ea179601cf9fea3826e6e6d148b951e5d5fe440db80759bdd49de2200660e6b66100453bd1714623bd98ac46fd51a4fb6e715668de04a122181949eee82a

  - runs: chmod +x configure

  # Note that despite using --with-extra-cflags, --with-extra-cxxflags, and
  # --with-extra-ldflags, the configure still produces warnings like:
  # https://chainguard.dev/contact/18747
  - uses: autoconf/configure
    with:
      opts: |
        --disable-precompiled-headers \
        --disable-warnings-as-errors \
        --enable-dtrace=no \
        --prefix=${{vars.java-home}} \
        --with-boot-jdk=${{vars.boot-jdk}} \
        --with-debug-level=release \
        --with-extra-cflags="$CFLAGS" \
        --with-extra-cxxflags="$CXXFLAGS" \
        --with-extra-ldflags="$LDFLAGS" \
        --with-freetype=system \
        --with-giflib=system \
        --with-gtest="/home/build/googletest" \
        --with-jtreg=no \
        --with-jvm-variants=server \
        --with-lcms=system \
        --with-libjpeg=system \
        --with-libpng=system \
        --with-native-debug-symbols=internal \
        --with-vendor-bug-url=http://www.azul.com/support/ \
        --with-vendor-name="Azul Systems, Inc." \
        --with-vendor-url=http://www.azul.com/ \
        --with-vendor-vm-bug-url=http://www.azul.com/support/ \
        --with-version-build=1 \
        --with-version-pre="no" \
        --with-version-opt=LTS \
        --with-vendor-version-string=Zulu${{vars.zulu-version}}-CG \
        --enable-refined-build \
        --with-zlib=system \
        PANDOC=/home/build/pandoc/bin/pandoc

  - runs: |
      make jdk-image legacy-jre-image

      # copy addons files to images
      cp ${{package.srcdir}}/addons/DISCLAIMER build/*-server-release/images/jdk
      cp ${{package.srcdir}}/addons/Welcome.html build/*-server-release/images/jdk
      cp ${{package.srcdir}}/addons/readme.txt build/*-server-release/images/jdk
      cp ${{package.srcdir}}/addons/DISCLAIMER build/*-server-release/images/jre
      cp ${{package.srcdir}}/addons/Welcome.html build/*-server-release/images/jre
      cp ${{package.srcdir}}/addons/readme.txt build/*-server-release/images/jre

      mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
      cp -r build/*-server-release/images/jdk/* ${{targets.contextdir}}/${{vars.java-home}}
      rm ${{targets.contextdir}}/${{vars.java-home}}/lib/src.zip

      # copy to shared java cacerts store
      rm -f ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts
      ln -sf /etc/ssl/certs/java/cacerts \
        ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts
      # symlink for `java-common` to work (which expects jre in $JAVA_HOME/jre)
      ln -sf . ${{targets.contextdir}}/${{vars.java-home}}/jre

# DO NOT CHANGE/BUMP/PATCH etc. WITHOUT CHECKING IN WITH OUR AZUL/ZULU PARTNERSHIP TEAM
subpackages:
  - name: ${{package.name}}-dbg
    description: Zulu ${{vars.major-version}} Java debug symbols
    pipeline:
      - uses: split/debug
    dependencies:
      runtime:
        - ${{package.name}}

  - name: ${{package.name}}-jre
    description: Zulu ${{vars.major-version}} Java runtime environment
    dependencies:
      runtime:
        - alsa-lib
        - freetype
        - giflib
        - java-cacerts
        - lcms2
        - libfontconfig1
        - libjpeg-turbo
        - libx11
        - libxext
        - libxi
        - libxrender
        - libxtst
        - ttf-dejavu
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          cp -r build/*-server-release/images/jre/* ${{targets.contextdir}}/${{vars.java-home}}

          # symlink to shared java cacerts store
          rm -f ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts
          ln -sf /etc/ssl/certs/java/cacerts \
            ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts

          # symlink for `java-common` to work (which expects jre in ${{vars.java-home}}/jre)
          ln -sf . "${{targets.contextdir}}/${{vars.java-home}}/jre"
    test:
      environment:
        contents:
          packages:
            - openssl
      pipeline:
        - uses: test/tw/ldd-check
          with:
            extra-library-paths: /usr/lib/jvm/java-25-zulu/lib/server/
        - name: Verify cacerts is a symlink
          runs: |
            set -euo pipefail
            # Verify cacerts is a symlink to the shared java cacerts store
            readlink ${{vars.java-home}}/lib/security/cacerts | grep -F "/etc/ssl/certs/java/cacerts"
        - name: Verify custom certs are picked up by Java
          runs: |
            set -euo pipefail
            # Create a self-signed cert
            openssl req -new -newkey rsa:2048 -days 365 -nodes -x509 \
              -keyout /tmp/test.key -out /usr/local/share/ca-certificates/test.crt \
              -subj "/CN=mytestcert/"
            # Regenerate all cert stores (triggers java-cacerts hook)
            update-ca-certificates
            # Verify Java sees the custom cert
            ${{vars.java-home}}/bin/keytool -list -cacerts -storepass changeit | grep -F "mytestcert"

  - name: ${{package.name}}-jmods
    description: Zulu ${{vars.major-version}} jmods
    dependencies:
      provides:
        - zulu-jmods=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ${{targets.destdir}}/${{vars.java-home}}/jmods \
             ${{targets.contextdir}}/${{vars.java-home}}

  - name: ${{package.name}}-doc
    description: Zulu ${{vars.major-version}} documentation
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ${{targets.destdir}}/${{vars.java-home}}/man \
             ${{targets.contextdir}}/${{vars.java-home}}

  - name: ${{package.name}}-demos
    description: Zulu ${{vars.major-version}} demos
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ${{targets.destdir}}/${{vars.java-home}}/demo \
             ${{targets.contextdir}}/${{vars.java-home}}

  - name: ${{package.name}}-default-jvm
    description: Use the Zulu ${{vars.major-version}} JVM as the default JVM
    dependencies:
      runtime:
        - java-common-jre
        - ${{package.name}}-jre
      provides:
        - zulu-default-jvm=1.${{vars.major-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib/jvm
          ln -sf $(basename ${{vars.java-home}}) ${{targets.contextdir}}/usr/lib/jvm/default-jvm

  - name: ${{package.name}}-default-jdk
    description: Use the Zulu ${{vars.major-version}} JVM as the default JVM with the JDK installed
    dependencies:
      runtime:
        - ${{package.name}}
        - java-common
      provides:
        - zulu-default-jdk=1.${{vars.major-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib/jvm
          ln -sf $(basename ${{vars.java-home}}) ${{targets.contextdir}}/usr/lib/jvm/default-jvm

update:
  enabled: false
  exclude-reason: "Wait for Azul to propose PRs in https://github.com/chainguard-dev/zulu-jdk/pulls"
  version-transform:
    - match: ^(.+)\+(\d+)$
      replace: $1.$2
  github:
    identifier: chainguard-dev/zulu-jdk
    use-tag: true

test:
  environment:
    contents:
      packages:
        - bash
        - busybox-full
        - unzip
        - zip
        - make
        - ${{package.name}}-default-jdk
        - ${{package.name}}-jmods
  pipeline:
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: /usr/lib/jvm/java-25-zulu/lib/server/
    - uses: auth/github
      with:
        repo: chainguard-dev/zulu-jdk
    - uses: git-checkout
      with:
        repository: https://github.com/chainguard-dev/zulu-jdk
        expected-commit: 38ad833613ef445979f6bda43ac0c216629a1162
        branch: cpu-25
    # Test a basic Hello World
    - working-directory: tests/openjdk-25/basic
      runs: |
        javac HelloWorld.java
        java HelloWorld | grep -qi "Hello World!"
    # Test a basic HTTP connection
    - working-directory: tests/openjdk-${{vars.major-version}}/basic
      runs: |
        javac RequestTest.java
        java RequestTest | grep -qi "Successfully connected to example.org"
    # Test modules
    - working-directory: tests/openjdk-${{vars.major-version}}/advanced/module-project
      runs: |
        mkdir output
        javac -d output --module-source-path modules $(find modules -name "*.java")

        # Create a jar with the compiled classes
        jar --verbose --create --file app.jar \
          --main-class dev.chainguard.module.main.Main \
          --module-version 1.0 \
          -C output/test.modules . \
          -C output/main.app .

        # Test the jar
        java -jar app.jar

        # Test jlink
        jlink --verbose --module-path "app.jar:$JAVA_HOME/jmods" \
          --add-modules test.modules \
          --output test-project-jre

        # Test custom JRE
        test-project-jre/bin/java -jar app.jar
    - uses: fetch
      with:
        uri: https://github.com/openjdk/jtreg/archive/refs/tags/jtreg-${{vars.jtreg-version}}.tar.gz
        expected-sha256: ${{vars.jtreg-hash}}
        strip-components: 1
    - runs: |
        echo "Build jtreg..."
        BUILD_ROOT=/home/build/build/images/jtreg bash make/build.sh --jdk ${{vars.java-home}}
    - working-directory: tests/zulu-certification-suite
      runs: |
        echo "Run jtreg tests..."
        export TESTED_ZULU=${{vars.java-home}}
        export JTREG_PATH=/home/build/build/images/jtreg
        $TESTED_ZULU/bin/java -jar $JTREG_PATH/lib/jtreg.jar -verbose:fail -retain:all \
          -e:MAJOR_VERSION=${{vars.major-version}},JAVA_VERSION=${{package.version}},ZULU_VERSION=${{vars.zulu-version}},BRANDING=CG  \
          -jdk:$TESTED_ZULU .
    - runs: |
        echo "✅ All tests passed"
