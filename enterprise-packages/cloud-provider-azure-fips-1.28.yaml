package:
  name: cloud-provider-azure-fips-1.28
  version: "1.28.14"
  epoch: 13 # CVE-2025-61726
  description: Cloud provider for Azure
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

data:
  - name: cloud-provider-azure-packages
    items:
      cloud-controller-manager: Controller manager for Azure Cloud
      cloud-node-manager: Node manager for Azure Cloud

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/cloud-provider-azure
      tag: v${{package.version}}
      expected-commit: aff7028282405b4de0549b970b7c96819b4c1e71

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: pkg/azclient

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        github.com/golang-jwt/jwt/v4@v4.5.2
        github.com/golang-jwt/jwt/v5@v5.2.2
        golang.org/x/net@v0.38.0
        golang.org/x/crypto@v0.45.0

subpackages:
  - range: cloud-provider-azure-packages
    name: cloud-provider-azure-${{range.key}}-fips-${{vars.major-minor-version}}
    description: ${{range.value}}
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          packages: ./cmd/${{range.key}}
          ldflags: |
            -X sigs.k8s.io/cloud-provider-azure/pkg/version.gitVersion=v${{package.version}}
            -X k8s.io/client-go/pkg/version.gitVersion=v${{package.version}}
            -X sigs.k8s.io/cloud-provider-azure/pkg/version.gitCommit=$(git rev-parse HEAD)
            -X k8s.io/client-go/pkg/version.gitCommit=$(git rev-parse HEAD)
            -X sigs.k8s.io/cloud-provider-azure/pkg/version.buildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')
            -X k8s.io/client-go/pkg/version.buildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')
          output: ${{range.key}}
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: "^cloud-provider-azure-${{range.key}}-fips-${{vars.major-minor-version}}"

test:
  environment:
    contents:
      packages:
        - cloud-provider-azure-cloud-controller-manager-fips-${{vars.major-minor-version}}
        - cloud-provider-azure-cloud-node-manager-fips-${{vars.major-minor-version}}
  pipeline:
    - name: help message
      runs: |
        /usr/bin/cloud-controller-manager --help
        /usr/bin/cloud-controller-manager --version | grep v${{package.version}}
        /usr/bin/cloud-node-manager --help
        /usr/bin/cloud-node-manager --version | grep v${{package.version}}

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.28
