package:
  name: chart-prometheus-kube-state-metrics
  version: "7.1.0"
  epoch: 1
  description: Install kube-state-metrics to generate and expose cluster-level metrics
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/helm-charts
      tag: kube-state-metrics-${{package.version}}
      expected-commit: 254721e00ea50b46db0ae032c1873a4dca68d85a

  - uses: charts/package
    with:
      chart-path: charts/kube-state-metrics
      images: |
        kube-state-metrics:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${tag}
              sha: ${digest}
        kube-rbac-proxy:
          values:
            kubeRBACProxy:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${tag}
                sha: ${digest}
      test: |
        values:
          imagePullSecrets:
            - name: my-pull-secret
        cases:
          - name: default
            images: [kube-state-metrics]
          - name: with-kube-rbac-proxy
            images: [kube-state-metrics, kube-rbac-proxy]
            values:
              kubeRBACProxy:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: prometheus-community/helm-charts
    strip-prefix: kube-state-metrics-
    use-tag: true
    tag-filter-prefix: kube-state-metrics-
