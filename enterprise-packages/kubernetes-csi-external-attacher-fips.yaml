package:
  name: kubernetes-csi-external-attacher-fips
  version: "4.11.0"
  epoch: 0 # CVE-2025-61732
  description: Sidecar container that watches Kubernetes VolumeAttachment objects and triggers ControllerPublish/Unpublish against a CSI endpoint
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-csi/external-attacher
      tag: v${{package.version}}
      expected-commit: cc32e8cebcb4433b84c26aacc59e200aecd9f5be

  - uses: go/build
    with:
      packages: ./cmd/csi-attacher
      # "-extldflags '-static'" dropped from non-fips and upstream builds
      # as it causes a test failure in go-fips-check which expects a
      # dynamically linked binary.
      ldflags: "-w -X main.version=v${{package.version}}"
      output: csi-attacher
      go-package: go-fips

subpackages:
  - name: ${{package.name}}-compat
    description: compat pkg for upstream entrypoint
    pipeline:
      - runs: |
          # Symlink the binary from /usr/bin to /
          mkdir -p ${{targets.subpkgdir}}
          ln -sf /usr/bin/csi-attacher ${{targets.subpkgdir}}/csi-attacher
    test:
      pipeline:
        - runs: |
            stat /csi-attacher

update:
  enabled: true
  github:
    identifier: kubernetes-csi/external-attacher
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
        - kubernetes-csi-driver-hostpath
        - jq
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: csi-attacher
    - uses: test/tw/help-check
      with:
        bins: csi-attacher
    - uses: test/kwok/cluster
    - name: Test CSI attacher watches VolumeAttachment and triggers CSI operations
      runs: |
        set -euo pipefail

        # Create CSI socket directory
        mkdir -p /csi

        # Start the hostpath CSI driver in background
        hostpathplugin --v=5 --endpoint="unix:///csi/csi.sock" --nodeid="node-000000" > /tmp/hostpathplugin.log 2>&1 &
        CSI_PID=$!
        sleep 5

        # Verify CSI driver started
        if [ ! -d "/proc/$CSI_PID" ]; then
          echo "ERROR: CSI hostpath driver failed to start"
          cat /tmp/hostpathplugin.log
          exit 1
        fi

        # Start the CSI attacher
        csi-attacher --v=5 --csi-address "/csi/csi.sock" --kubeconfig ~/.kube/config --http-endpoint ":8080" > /tmp/csi-attacher.log 2>&1 &
        ATTACHER_PID=$!
        sleep 10

        # Verify attacher started
        if [ ! -d "/proc/$ATTACHER_PID" ]; then
          echo "ERROR: CSI attacher failed to start"
          cat /tmp/csi-attacher.log
          exit 1
        fi

        # Verify metrics endpoint is serving
        curl -f -s localhost:8080/metrics > /tmp/metrics.txt
        if [ ! -s /tmp/metrics.txt ]; then
          echo "ERROR: Metrics endpoint returned empty response"
          exit 1
        fi
        echo "Metrics endpoint is functional"

        # Create a CSIDriver resource for hostpath
        tee /tmp/csidriver.yaml <<'EOF'
        apiVersion: storage.k8s.io/v1
        kind: CSIDriver
        metadata:
          name: hostpath.csi.k8s.io
        spec:
          attachRequired: true
          podInfoOnMount: true
        EOF
        kubectl apply -f /tmp/csidriver.yaml

        # Create a VolumeAttachment object to test core attacher functionality
        tee /tmp/volumeattachment.yaml <<'EOF'
        apiVersion: storage.k8s.io/v1
        kind: VolumeAttachment
        metadata:
          name: test-attachment
        spec:
          attacher: hostpath.csi.k8s.io
          nodeName: node-000000
          source:
            persistentVolumeName: test-pv
        EOF
        kubectl apply -f /tmp/volumeattachment.yaml

        # Wait for the attacher to detect and process the VolumeAttachment
        echo "Waiting for attacher to process VolumeAttachment..."
        sleep 15

        # Check csi-attacher logs for evidence of processing VolumeAttachment
        echo "Checking attacher logs for VolumeAttachment processing..."
        if grep -F "VolumeAttachment" /tmp/csi-attacher.log; then
          echo "SUCCESS: Attacher detected VolumeAttachment object"
        else
          echo "WARNING: VolumeAttachment not explicitly mentioned in logs"
        fi

        # Check if ControllerPublishVolume was called on the CSI driver
        echo "Checking CSI driver logs for ControllerPublishVolume call..."
        if grep -F "ControllerPublishVolume" /tmp/hostpathplugin.log; then
          echo "SUCCESS: CSI driver received ControllerPublishVolume call"
        else
          echo "Checking for attachment processing in attacher logs..."
          # If PV doesn't exist, the attacher will report an error but still process it
          if grep -iE "test-attachment|attach|processing" /tmp/csi-attacher.log; then
            echo "SUCCESS: Attacher is processing attachment requests"
          else
            echo "FAIL: No evidence attacher is processing VolumeAttachment objects"
            echo "=== Attacher logs ==="
            cat /tmp/csi-attacher.log
            echo "=== CSI driver logs ==="
            cat /tmp/hostpathplugin.log
            exit 1
          fi
        fi

        # Check VolumeAttachment status
        echo "Checking VolumeAttachment status..."
        kubectl get volumeattachment test-attachment -o json > /tmp/va-status.json
        if jq -e '.metadata.name' /tmp/va-status.json > /dev/null 2>&1; then
          echo "SUCCESS: VolumeAttachment object exists in cluster"
        else
          echo "FAIL: Could not retrieve VolumeAttachment status"
          exit 1
        fi

        # Test detach by deleting VolumeAttachment
        echo "Testing detach operation by deleting VolumeAttachment..."
        kubectl delete volumeattachment test-attachment
        sleep 5

        # Check for ControllerUnpublishVolume call or deletion processing
        echo "Checking for detach operation..."
        if grep -F "ControllerUnpublishVolume" /tmp/hostpathplugin.log; then
          echo "SUCCESS: CSI driver received ControllerUnpublishVolume call"
        else
          if grep -iE "deleted|unpublish|detach" /tmp/csi-attacher.log; then
            echo "SUCCESS: Attacher processed deletion request"
          else
            echo "INFO: Detach may have been handled - checking process is still running"
          fi
        fi

        # Final verification - attacher should still be running
        if [ -d "/proc/$ATTACHER_PID" ]; then
          echo "SUCCESS: CSI attacher is still running after operations"
        else
          echo "WARNING: Attacher process exited - checking for crash"
          if grep -iE "panic|fatal|crash" /tmp/csi-attacher.log; then
            echo "FAIL: Attacher crashed"
            cat /tmp/csi-attacher.log
            exit 1
          fi
        fi

        echo "CSI attacher core functionality test complete"
    - uses: test/go-fips-check
