package:
  name: linux-qemu-rc
  version: "6.19_rc8"
  epoch: 0
  description: "Linux Release Candidate kernel"
  copyright:
    - license: GPL-2.0
  resources:
    cpu: 16
    memory: 24Gi
  dependencies:
    # If installing linux:version-flavor with no preference,
    # make this default.
    provider-priority: 10
    runtime:
      - ${{package.name}}-modules=${{package.full-version}}
      # Ensure we get Chainguard branding in our VMs.
      - chainguard-baselayout
      - merged-lib
      - wolfi-baselayout

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)_rc(\d+)
    replace: "$1"
    to: kernel-version
  - from: ${{package.version}}
    match: \d+\.\d+\_rc(\d+)
    replace: "$1"
    to: kernel-rc
  - from: ${{package.name}}
    match: 'linux-(.*)'
    replace: '$1'
    to: flavor
  - from: ${{package.name}}
    match: 'linux-(.*)'
    replace: '${{package.full-version}}-$1'
    to: version-flavor
  - from: ${{package.version}}
    match: ^(.+)_rc(.+)
    replace: "$1-rc$2"
    to: mangled-package-version
  - from: ${{package.version}}
    match: '^(\d+\.\d+)_rc\d+$'
    replace: '$1'
    to: mangled-kernel-major-version

pipeline:
  - uses: kernel/version-check
    with:
      moniker: mainline

  - uses: git-checkout
    with:
      repository: https://github.com/torvalds/linux.git
      expected-commit: 18f7fcd5e69a04df57b563360b88be72471d6b62
      tag: v${{vars.mangled-package-version}}

  - uses: patch
    with:
      patches: |
        patches/${{vars.mangled-kernel-major-version}}/0001-module-Make-use-of-platform-keyring-for-module-signa.patch

  # remove the default CONFIG_INIT_ON_FREE_DEFAULT_ON configuration
  # to avoid issues with Melange in Elastic Builds
  - runs: |
      sed -i '/# Initialize all heap variables to zero on allocation./d' kernel/configs/hardening.config
      sed -i '/CONFIG_INIT_ON_FREE_DEFAULT_ON=y/d' kernel/configs/hardening.config

  - uses: kernel/config
    with:
      flavor: ${{vars.flavor}}
      make-targets: hardening.config
      version-flavor: ${{vars.version-flavor}}

  - uses: kernel/build
    with:
      version-flavor: ${{vars.version-flavor}}

subpackages:
  - name: "${{package.name}}-boot-installed"
    description: "Linux RC kernel (installed for EFI)"
    dependencies:
      runtime:
        # Ensure we get Chainguard branding in our VMs.
        - ${{package.name}}-modules=${{package.full-version}}
        - chainguard-baselayout
        - merged-lib
        - systemd-boot-installed
        - wolfi-baselayout
      provides:
        - ${{package.name}}-boot-configuration=${{package.full-version}}
    pipeline:
      - uses: kernel/boot-installed
        with:
          version-flavor: ${{vars.version-flavor}}

  - name: "${{package.name}}-fips-boot-installed"
    description: "FIPS Linux kernel (installed for EFI)"
    dependencies:
      runtime:
        # Ensure we get Chainguard branding in our VMs.
        - ${{package.name}}-modules=${{package.full-version}}
        - chainguard-baselayout
        - systemd-boot-installed
      provides:
        - ${{package.name}}-boot-configuration=${{package.full-version}}
    pipeline:
      - uses: kernel/boot-installed
        with:
          version-flavor: ${{vars.version-flavor}}
          extra-args: fips=1

  - name: "${{package.name}}-modules"
    description: "Linux kernel modules"
    pipeline:
      - uses: kernel/modules
        with:
          version-flavor: ${{vars.kernel-version}}.0-rc${{vars.kernel-rc}}-r${{package.epoch}}-qemu-rc
    dependencies:
      runtime:
        - merged-lib
        - wolfi-baselayout

  - name: ${{package.name}}-headers
    description: Linux kernel headers
    pipeline:
      - uses: kernel/headers
        with:
          version-flavor: ${{vars.version-flavor}}

test:
  pipeline:
    - uses: kernel/test/kconfig/systemd
    - uses: kernel/test/config-snippet
      with:
        snippet: ${{vars.flavor}}
        # Depends on CONFIG_X86
        aarch64_exclude: VIRTIO_PCI_ADMIN_LEGACY
    - name: Test Basic Boot
      uses: kernel/test/console_grep
      with:
        string: "Unable to mount root fs"
    - name: Test for XFS
      uses: kernel/test/console_grep
      with:
        string: "xfs"
    - name: Test for NVME
      uses: kernel/test/console_grep
      with:
        string: "nvme nvme0: pci function"
    - name: Test for ip6tables
      uses: kernel/test/console_grep
      with:
        string: "Segment Routing with IPv6"
    - uses: kernel/test/modprobe
      with:
        modprobe: zram

update:
  enabled: true
  enable-prerelease-tags: true
  version-transform:
    - match: -rc(\d+)$
      replace: _rc$1
  github:
    identifier: torvalds/linux
    use-tag: true
    strip-prefix: v
    tag-filter-contains: rc
