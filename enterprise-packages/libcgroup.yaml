package:
  name: libcgroup
  version: "3.2.0"
  epoch: 4 # go/enterprise-rsc/libcgroup
  description: libcgroup is a library that abstracts the control group file system in Linux
  copyright:
    - license: LGPL-2.1
  checks:
    disabled:
      - setuidgid
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout
  resources:
    cpu: "1"
    memory: 2Gi

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - flex
      - libtool
      - linux-pam-dev
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/libcgroup/libcgroup
      tag: v${{package.version}}
      expected-commit: 565c13c49e4511daefa75fb00a6b8695e903019b

  - uses: autoconf/configure
    with:
      opts: --sbindir=/usr/bin

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: "${{package.name}} headers"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: "${{package.name}} manpages"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

update:
  enabled: true
  github:
    identifier: libcgroup/libcgroup
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
