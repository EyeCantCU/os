#nolint:valid-pipeline-git-checkout-tag
package:
  name: tritonserver-backend-tensorrt-cuda-13.1
  version: "25.12"
  epoch: 1
  description: The Triton backend for TensorRT
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - cuda-toolkit-${{vars.cuda-version}}
      - tensorrt-cuda-${{vars.cuda-major-version}}
      - tritonserver-cuda-${{vars.cuda-version}}
  options:
    no-depends: true

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - nvcc-${{vars.cuda-version}}-gcc-default
      - python3
      - rapidjson-dev
      - tensorrt-cuda-${{vars.cuda-major-version}}-dev
      - triton-inference-server-backend=${{package.version}}
      - triton-inference-server-common=${{package.version}}
      - triton-inference-server-core=${{package.version}}

vars:
  # Arbitrary output dir so installing the backend doesn't need to be hardcoded
  output-dir: /home/build/output

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.\d+$'
    replace: '$1'
    to: cuda-major-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/triton-inference-server/tensorrt_backend.git
      branch: r${{package.version}}
      expected-commit: 12b98531758dccd3476d87c0dc9e3475fae41988
      recurse-submodules: true

  - uses: cmake/configure
    with:
      opts: |
        -DTRITON_COMMON_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/common.git && git branch --show-current) \
        -DTRITON_CORE_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/core.git && git branch --show-current) \
        -DTRITON_BACKEND_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/backend.git && git branch --show-current) \
        -DCMAKE_CUDA_COMPILER=/usr/local/cuda-${{vars.cuda-version}}/bin/nvcc \
        -DCMAKE_INSTALL_PREFIX:PATH=/opt/tritonserver \
        -DTRITON_TENSORRT_INCLUDE_PATHS=/usr/local/tensorrt/include \
        -DTRITON_TENSORRT_LIB_PATHS=/usr/local/tensorrt/lib \
        -DCMAKE_PREFIX_PATH=/usr/local/tensorrt/lib

  - uses: cmake/build
    with:
      output-dir: ${{vars.output-dir}}

  # This backend builds tritonserver + stub libraries that already provided by our tritonserver package
  # We only care about the baceknd so disregard everything else and only install the backend
  - runs: |
      DESTDIR=${{vars.output-dir}} cmake --install ${{vars.output-dir}}
      install -Dpm0755 -t ${{targets.destdir}}/opt/tritonserver/backends/tensorrt/ ${{vars.output-dir}}/opt/tritonserver/backends/tensorrt/*

update:
  enabled: false
  exclude-reason: "Upstream does not maintain tags or GitHub releases. Instead, it uses monthly branches for releases."

test:
  environment:
    environment:
      TRITON_HTTP_PORT: 8080
      TRITON_GRPC_PORT: 8081
      MODELS_PATH: /tmp/models
      SAMPLE_MODEL_NAME: sampletrt
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/opt/tritonserver/lib"
    # Expected to fail as tensorrt backend requires GPU acceleration
    - uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p "${MODELS_PATH}/${SAMPLE_MODEL_NAME}/1"
          tee ${MODELS_PATH}/${SAMPLE_MODEL_NAME}/config.pbtxt <<EOF
          name: "${SAMPLE_MODEL_NAME}"
          backend: "tensorrt"
          input: [
            {
              name: "gpu_0/data_0"
              data_type: TYPE_FP32
              dims: [ -1, 3, 224, 224]
            }
          ]
          parameters: [
          {
             key: "NUM_STREAMS"
             value: {
               string_value: "1"
             }
          },
          {
             key: "PERFORMANCE_HINT"
             value: {
               string_value: "LATENCY"
             }
          }
          ]
          EOF
        start: |
          /opt/tritonserver/bin/tritonserver \
            --model-repository=${MODELS_PATH} \
            --http-port="${TRITON_HTTP_PORT}" \
            --grpc-port="${TRITON_GRPC_PORT}" \
            --http-address="0.0.0.0"
        expected_output: |
          DCGM unable to get device info and count, GPU metrics will not be available
          Collecting CPU metrics
          TRITONBACKEND_ModelInitialize:
          /opt/tritonserver/backends/tensorrt/libtriton_tensorrt.so
          TensorRT backend supports only GPU device
        timeout: 60
        error_strings: "NULL"
