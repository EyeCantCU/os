package:
  name: aws-nuke-fips
  version: "3.64.0"
  epoch: 1
  description: Remove all the resources from an AWS account
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ekristen/aws-nuke
      tag: v${{package.version}}
      expected-commit: 26ea131ce48c78594ebb2e489325564b3e85c311

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./
      output: aws-nuke
      ldflags: |
        -X github.com/ekristen/aws-nuke/v3/pkg/common.SUMMARY=${{package.version}}
        -X github.com/ekristen/aws-nuke/v3/pkg/common.COMMIT=$(git rev-parse HEAD)

update:
  enabled: true
  github:
    identifier: ekristen/aws-nuke
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    # AUTOGENERATED
    - uses: test/tw/ver-check
      with:
        bins: aws-nuke
    - uses: test/tw/help-check
      with:
        bins: aws-nuke
    - name: Test resource types listing
      runs: |
        set -euo pipefail
        # List available resource types (functional test that doesn't require AWS credentials)
        # This verifies the binary can enumerate AWS resources it supports
        aws-nuke resource-types 2>&1 | grep -F "IAMUser"

environment:
  contents:
    packages:
      - go-fips-1.25
