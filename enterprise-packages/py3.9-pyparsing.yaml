package:
  name: py3.9-pyparsing
  version: "3.3.2"
  epoch: 1 # go/enterprise-rsc/py3.9-pyparsing
  description: "simple packaging tool for simple packages (core)"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.9
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3.9-flit-core
      - py3.9-gpep517
      - py3.9-installer
      - python-3.9
      - wolfi-base

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/p/pyparsing/pyparsing-${{package.version}}.tar.gz
      expected-sha256: c777f4d763f140633dcb6d8a3eda953bf7a214dc4eff598413c070bcdc117cbc

  - runs: |
      mkdir -p dist
      backend="$(python3 -m gpep517 get-backend)"
      python3.9 -m gpep517 build-wheel --wheel-dir dist --backend "$backend" --output-fd 1

  - runs: |
      python3.9 -m installer -d "${{targets.destdir}}" dist/pyparsing-${{package.version}}-py3-none-any.whl

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: pyparsing

update:
  enabled: true
  ignore-regex-patterns:
    - '[ab]\d+$'
  release-monitor:
    identifier: 3756
