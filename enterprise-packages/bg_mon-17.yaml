#nolint:valid-pipeline-git-checkout-commit,valid-pipeline-git-checkout-tag,check-version-matches
package:
  name: bg_mon-17
  version: "0_git20251112"
  epoch: 0
  description: PostgreSQL background worker for monitoring database and system performance
  copyright:
    - license: MIT

var-transforms:
  - from: ${{package.name}}
    match: '^bg_mon-(\d+)$'
    replace: $1
    to: pg-version

environment:
  contents:
    packages:
      - brotli-dev
      - build-base
      - busybox
      # Project has a hard requirement on clang-19 else emits this error /usr/lib/llvm-19/bin/llvm-lto: not found
      - clang-19
      - libevent-dev
      - postgresql-${{vars.pg-version}}-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/CyberDem0n/bg_mon
      expected-commit: a73c6bcd10dfdf9feaf5eabab7eb6b12d167680d
      branch: master

  - uses: autoconf/make-install
    with:
      opts: USE_PGXS=1

  - uses: strip

test:
  environment:
    contents:
      packages:
        - postgresql-${{vars.pg-version}}
        - postgresql-${{vars.pg-version}}-client
        - shadow
        - sudo-rs
        - glibc-locales
        - curl
        - jq
        - wait-for-it
    environment:
      PGUSER: wolfi
  pipeline:
    - name: Testing package functionality
      runs: |
        useradd $PGUSER
        sudo -u $PGUSER initdb -D /tmp/pgdata --auth=trust 2>&1
        cat bg_mon.conf >> /tmp/pgdata/postgresql.conf
        sudo -u $PGUSER pg_ctl start -w -D /tmp/pgdata -l /tmp/pgdata/pg_log 2>&1
        wait-for-it localhost:5432 -t 5
        curl -f -s http://127.0.0.1:8080/ | grep -E "hostname|postgresql|version|${{vars.pg-version}}"
    - uses: test/tw/ldd-check

update:
  enabled: true
  git: {}
  schedule:
    reason: No tagged releases. Updated infrequently
    period: weekly
