package:
  name: docker-compose-fips
  version: "5.1.0"
  epoch: 2 # GHSA-9h8m-3fm2-qjrq
  description: Define and run multi-container applications with Docker
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - btrfs-progs-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - containerd-fips
      - coreutils
      - go-fips
      - go-fips-md5
      - libseccomp-dev
      - libtool
      - linux-headers
      - lvm2-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/docker/compose
      tag: v${{package.version}}
      expected-commit: 85d6770b7fb6e2b38234cc9219f59049e42d6924

  - uses: go/bump
    with:
      deps: |-
        github.com/sigstore/sigstore@v1.10.4
        go.opentelemetry.io/otel/sdk@v1.40.0

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      DESTDIR=${{targets.destdir}}/usr/bin/ make build

test:
  environment:
    contents:
      packages:
        - docker-cli-fips
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: docker-compose
    - uses: test/tw/ver-check
      with:
        bins: docker-compose

update:
  enabled: true
  github:
    identifier: docker/compose
    strip-prefix: v
    tag-filter: v
