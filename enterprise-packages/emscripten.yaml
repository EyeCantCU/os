package:
  name: emscripten
  version: "5.0.1"
  epoch: 2
  description: Emscripten compiler - C/C++ to WebAssembly
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - binaryen
      - clang
      - google-closure-compiler-java
      - lld
      - llvm
      - nodejs
      - python3
  resources:
    cpu: "2"
    memory: 6Gi

## There might be some discrepancy between the version of the package and the version of the binaries in the package
## Here https://github.com/emscripten-core/emscripten/blob/5.0.0/emscripten-version.txt.
## The next release should update this
environment:
  contents:
    packages:
      - binaryen
      - busybox
      - clang
      - git
      - google-closure-compiler-java
      - lld
      - llvm
      - nodejs
      - npm
      - python3

vars:
  java-version: 21
  binaryen-tools: "wasm-as wasm-ctor-eval wasm-dis wasm-emscripten-finalize wasm-fuzz-lattices wasm-fuzz-types wasm-merge wasm-metadce wasm-opt wasm-reduce wasm-shell wasm-split wasm2js"
  llvm-tools: "clang clang++ lld ld.lld wasm-ld llvm-ar llvm-as llvm-dis llvm-dwarfdump llvm-dwp llvm-nm llvm-objcopy llvm-ranlib llvm-readobj llvm-size llvm-strip llvm-symbolizer"
  entry-points: "bootstrap emcc em++ emar emranlib emcmake emconfigure emmake emrun embuilder emsize emstrip emscan-deps emscons em-config emdwp emnm empath-split emprofile emsymbolizer"
  python-entry-points: "bootstrap.py emcc.py em++.py emar.py emranlib.py emcmake.py emconfigure.py emmake.py emrun.py embuilder.py emsize.py emstrip.py emscan-deps.py emscons.py em-config.py"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/emscripten-core/emscripten
      tag: ${{package.version}}
      expected-commit: 8c5f43157a3f069ade75876e23061330521eabde

  - runs: |
      # Fix CVE-2025-5889: add npm override for brace-expansion before install
      sed -i 's/"dependencies":/"overrides": {"brace-expansion": "4.0.1"},"dependencies":/' package.json

      # Install dependencies (npm install needed for overrides, npm ci requires exact lock match)
      npm install --omit=dev --only=production

      # Symlink google-closure-compiler JAR from system package
      # This fixes CVE-2022-3510, CVE-2024-7254, CVE-2022-3509, CVE-2022-3171
      mkdir -p node_modules/google-closure-compiler-java
      ln -sf /usr/share/java/google-closure-compiler/compiler.jar node_modules/google-closure-compiler-java/compiler.jar
      # Create index.js so require('google-closure-compiler-java') returns JAR path
      echo "module.exports = require.resolve('./compiler.jar');" > node_modules/google-closure-compiler-java/index.js
      # Also ensure the wrapper module can find it
      rm -rf node_modules/google-closure-compiler/node_modules/google-closure-compiler-java

      # Generate entry points using upstream tooling
      python tools/maint/create_entry_points.py

      # Create directory structure matching emsdk upstream layout:
      # /upstream/bin/        - LLVM tools
      # /upstream/emscripten/ - Emscripten compiler
      mkdir -p "${{targets.destdir}}"/upstream/bin
      mkdir -p "${{targets.destdir}}"/upstream/emscripten

      # Copy upstream-generated entry points
      for f in ${{vars.entry-points}}; do
        cp "$f" "${{targets.destdir}}"/upstream/emscripten/
      done

      # Copy all Python entry points to emscripten subdirectory
      for f in ${{vars.python-entry-points}}; do
        cp "$f" "${{targets.destdir}}"/upstream/emscripten/
      done

      # Copy version and file
      cp emscripten-version.txt "${{targets.destdir}}"/upstream/emscripten/

      # Copy required directories
      cp -r cmake tools src system third_party node_modules \
        "${{targets.destdir}}"/upstream/emscripten/

  # Create emscripten_config matching upstream layout at /upstream/emscripten_config
  - runs: |
      tee "${{targets.destdir}}"/upstream/emscripten_config << 'EOF'
      BINARYEN_ROOT = '/usr'
      LLVM_ROOT = '/upstream/bin'
      NODE_JS = '/usr/bin/node'
      EMSCRIPTEN_ROOT = '/upstream/emscripten'
      EOF

  - runs: |
      # Provide a simple profile script for emscripten users
      install -d "${{targets.destdir}}"/etc/profile.d
      tee "${{targets.destdir}}"/etc/profile.d/emscripten.sh << 'EOF'
      #!/bin/sh
      export EM_CONFIG=/upstream/emscripten_config
      case ":$PATH:" in
        *:/upstream/emscripten:*) ;;
        *) export PATH="/upstream/emscripten:$PATH" ;;
      esac
      EOF

  - runs: |
      # Create symlinks to system LLVM in bin directory
      for tool in ${{vars.llvm-tools}}; do
        ln -sf /usr/bin/${tool} "${{targets.destdir}}"/upstream/bin/${tool}
      done

  - runs: |
      # Create symlinks to binaryen wasm tools in bin directory
      for tool in ${{vars.binaryen-tools}}; do
        ln -sf /usr/bin/${tool} "${{targets.destdir}}"/upstream/bin/${tool}
      done

test:
  environment:
    contents:
      packages:
        - openjdk-${{vars.java-version}}-default-jvm
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: /upstream/emscripten/emcc /upstream/emscripten/em++
    - name: Verify emscripten entry points match upstream
      runs: |
        set -euo pipefail
        export PATH=/upstream/emscripten:$PATH

        # Standard tools with --version support
        emar --version
        emstrip --version

        # Entry point scripts at root level - verify executable
        for tool in bootstrap emscons emscan-deps em-config emcmake emconfigure emmake emrun emranlib embuilder emsize; do
          test -x /upstream/emscripten/$tool || { echo "ERROR: $tool is not executable"; exit 1; }
        done

        # Remapped tools (wrapper in root, .py in tools/)
        for tool in emdwp emnm empath-split emprofile emsymbolizer; do
          test -x /upstream/emscripten/$tool || { echo "ERROR: $tool is not executable"; exit 1; }
          test -e /upstream/emscripten/tools/${tool}.py || { echo "ERROR: tools/${tool}.py not found"; exit 1; }
        done

        # Tools in subdirectories
        for tool in file_packager webidl_binder; do
          test -x /upstream/emscripten/tools/$tool || { echo "ERROR: tools/$tool is not executable"; exit 1; }
          test -e /upstream/emscripten/tools/${tool}.py || { echo "ERROR: tools/${tool}.py not found"; exit 1; }
        done
    - name: Verify LLVM symlinks point to system binaries
      runs: |
        set -euo pipefail
        for tool in ${{vars.llvm-tools}}; do
          test -L /upstream/bin/${tool} || { echo "ERROR: /upstream/bin/${tool} is not a symlink"; exit 1; }
          test "$(readlink /upstream/bin/${tool})" = "/usr/bin/${tool}" || { echo "ERROR: /upstream/bin/${tool} does not point to /usr/bin/${tool}"; exit 1; }
        done
    - name: Verify binaryen tool symlinks point to system binaries
      runs: |
        set -euo pipefail
        for tool in ${{vars.binaryen-tools}}; do
          test -L /upstream/bin/${tool} || { echo "ERROR: /upstream/bin/${tool} is not a symlink"; exit 1; }
          test "$(readlink /upstream/bin/${tool})" = "/usr/bin/${tool}" || { echo "ERROR: /upstream/bin/${tool} does not point to /usr/bin/${tool}"; exit 1; }
        done
    - name: Test WebAssembly compilation
      runs: |
        set -euo pipefail
        export PATH=/upstream/emscripten:$PATH
        echo 'int main() { return 0; }' > test.c
        emcc test.c -o test.js
        stat test.js
        stat test.wasm
    - name: Test file_packager tool
      runs: |
        set -euo pipefail
        export PATH=/upstream/emscripten:$PATH
        /upstream/emscripten/tools/file_packager --help
    - uses: test/tw/contains-files
      with:
        files: |
          /upstream/emscripten/node_modules/google-closure-compiler-java/compiler.jar
          /upstream/emscripten/node_modules/google-closure-compiler-java/index.js
          /upstream/emscripten/node_modules/.bin/google-closure-compiler
    - name: Test google-closure-compiler integration
      runs: |
        set -euo pipefail
        export PATH=/upstream/emscripten:$PATH

        # Verify index.js exports the JAR path
        grep -F "require.resolve('./compiler.jar')" /upstream/emscripten/node_modules/google-closure-compiler-java/index.js

        # Test closure compiler via npm wrapper
        echo 'function hello(name) { console.log("Hello " + name); } hello("World");' > /tmp/test.js
        /upstream/emscripten/node_modules/.bin/google-closure-compiler --js /tmp/test.js --js_output_file /tmp/test.min.js
        stat /tmp/test.min.js
        cat /tmp/test.min.js

        # Verify output is minified (variable renamed)
        grep -vF "function hello(name)" /tmp/test.min.js

update:
  enabled: true
  github:
    identifier: emscripten-core/emscripten
    use-tag: true
