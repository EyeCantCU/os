package:
  name: emscripten
  version: "5.0.0"
  epoch: 3
  description: Emscripten compiler - C/C++ to WebAssembly
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - binaryen
      - clang
      - lld
      - llvm
      - nodejs
      - python3
  resources:
    cpu: "1"
    memory: 6Gi

## There might be some discrepancy between the version of the package and the version of the binaries in the package
## Here https://github.com/emscripten-core/emscripten/blob/5.0.0/emscripten-version.txt.
## The next release should update this
environment:
  contents:
    packages:
      - binaryen
      - busybox
      - clang
      - git
      - lld
      - llvm
      - nodejs
      - npm
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/emscripten-core/emscripten
      tag: ${{package.version}}
      expected-commit: be68a767ff3937d97ffc7996a24bd3d7e7f9c849

  - runs: |
      # Install production dependencies only (matches upstream emsdk behavior)
      # Using --omit=dev reduces node_modules from ~239 to ~123 packages
      npm ci --omit=dev

      # Fix CVE-2025-5889 in brace-expansion
      npm install brace-expansion@4.0.1 --depth=10

      # Update google-closure-compiler-java to fix CVE-2022-3510, CVE-2024-7254,
      # CVE-2022-3509, CVE-2022-3171 (protobuf-java vulns in bundled JAR)
      npm install google-closure-compiler-java@20260121.0.0
      # Also update nested dependency under google-closure-compiler
      rm -rf node_modules/google-closure-compiler/node_modules/google-closure-compiler-java
      cp -r node_modules/google-closure-compiler-java node_modules/google-closure-compiler/node_modules/

      # Create directory structure matching emsdk upstream layout:
      # /upstream/bin/        - LLVM tools
      # /upstream/emscripten/ - Emscripten compiler
      mkdir -p "${{targets.destdir}}"/upstream/bin
      mkdir -p "${{targets.destdir}}"/upstream/emscripten

      # Copy Python entry points to emscripten subdirectory
      # Includes all tools from upstream emsdk (emscons, emstrip, emscan-deps, em-config)
      for f in emcc.py em++.py emar.py emranlib.py emcmake.py \
               emconfigure.py emmake.py emrun.py embuilder.py emsize.py \
               emstrip.py emscan-deps.py emscons.py em-config.py; do
        cp "$f" "${{targets.destdir}}"/upstream/emscripten/
      done

      # Copy version and other required files
      cp emscripten-version.txt "${{targets.destdir}}"/upstream/emscripten/

      # Copy required directories
      cp -r tools src system third_party node_modules \
        "${{targets.destdir}}"/upstream/emscripten/

  - runs: |
      # Create config file pointing to system LLVM/Binaryen
      tee "${{targets.destdir}}"/upstream/emscripten/.emscripten << 'EOF'
      import os
      LLVM_ROOT = '/upstream/bin'
      BINARYEN_ROOT = '/usr'
      NODE_JS = '/usr/bin/node'
      CACHE = os.path.expanduser('~/.cache/emscripten')
      EOF

  - runs: |
      # Create wrapper scripts for tools with .py files at root level
      for tool in emcc em++ emar emranlib emcmake emconfigure emmake emrun embuilder emsize \
                  emstrip emscan-deps emscons em-config; do
        tee "${{targets.destdir}}"/upstream/emscripten/${tool} << WRAPPER
      #!/bin/sh
      export EM_CONFIG=/upstream/emscripten/.emscripten
      exec python3 /upstream/emscripten/${tool}.py "\$@"
      WRAPPER
        chmod +x "${{targets.destdir}}"/upstream/emscripten/${tool}
      done

      # Create wrapper scripts for tools that live in tools/ subdirectory
      # These match upstream emsdk (emdwp, emnm, empath-split, emprofile, emsymbolizer)
      for tool in emdwp emnm empath-split emprofile emsymbolizer; do
        tee "${{targets.destdir}}"/upstream/emscripten/${tool} << WRAPPER
      #!/bin/sh
      export EM_CONFIG=/upstream/emscripten/.emscripten
      exec python3 /upstream/emscripten/tools/${tool}.py "\$@"
      WRAPPER
        chmod +x "${{targets.destdir}}"/upstream/emscripten/${tool}
      done

  - runs: |
      # Create symlinks to system LLVM in bin directory
      for tool in clang clang++ lld ld.lld wasm-ld \
                  llvm-ar llvm-as llvm-dis llvm-dwarfdump llvm-dwp llvm-nm \
                  llvm-objcopy llvm-ranlib llvm-readobj llvm-size llvm-strip llvm-symbolizer; do
        ln -sf /usr/bin/${tool} "${{targets.destdir}}"/upstream/bin/${tool}
      done

test:
  environment:
    environment:
      # Match upstream emsdk PATH setup - tools are in /upstream/emscripten
      PATH: /upstream/emscripten:/usr/bin:/bin
  pipeline:
    - name: Verify emscripten binary version
      runs: |
        # Not using test/tw/ver-check because emscripten version output includes
        # additional metadata from emscripten-version.txt that doesn't match
        # the package version format exactly
        emcc --version
        em++ --version
        emar --version
        # Verify root-level tools are available
        emstrip --version
        emscons --version
        emscan-deps --version
        em-config --version
        # Verify tools/ subdirectory tools are available (match upstream emsdk)
        emdwp --help
        emnm --help
        empath-split --help
        emprofile --help
        emsymbolizer --help
    - name: "Test WebAssembly compilation"
      runs: |
        set -euo pipefail
        echo 'int main() { return 0; }' > test.c
        emcc test.c -o test.js
        stat test.js
        stat test.wasm

update:
  enabled: true
  github:
    identifier: emscripten-core/emscripten
    use-tag: true
