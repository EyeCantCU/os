package:
  name: harden-vm
  version: "0.0.4"
  epoch: 9
  description: Script to apply hardening
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - bash
      - coreutils
      - util-linux-misc

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin/
      cp apply-hardening ${{targets.destdir}}/usr/bin/

update:
  enabled: false
  exclude-reason: |
    This package is upstream of package.

test:
  pipeline:
    - uses: test/tw/contains-files
      with:
        files: |
          /usr/bin/apply-hardening
