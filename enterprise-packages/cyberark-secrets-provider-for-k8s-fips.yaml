package:
  name: cyberark-secrets-provider-for-k8s-fips
  version: "1.8.0"
  epoch: 1
  description: CyberArk Secrets Provider for Kubernetes FIPS
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - coreutils
      - dash-binsh
  resources:
    cpu: "6"
    memory: 8Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cyberark/secrets-provider-for-k8s
      tag: v${{package.version}}
      expected-commit: 5fc9691a22118632cfee2f2afbebafe9b5b66a52

  - uses: go/build
    with:
      packages: ./cmd/secrets-provider
      output: secrets-provider
      ldflags: -X github.com/cyberark/secrets-provider-for-k8s/pkg/secrets.Tag=v${{package.version}}
      tidy: true
      go-package: go-fips

  - runs: |
      cp -r ./bin/run-time-scripts/* ${{targets.contextdir}}/usr/bin/
      chmod +x ${{targets.destdir}}/usr/bin/*

subpackages:
  - name: ${{package.name}}-usrlocal-compat
    description: Provides CyberArk secrets provider for K8s FIPS binaries and scripts in /usr/local/bin
    dependencies:
      runtime:
        - ${{package.name}}=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/bin
          for path in ${{targets.destdir}}/usr/bin/*; do
            bin=$(basename $path)
            ln -s /usr/bin/$bin ${{targets.contextdir}}/usr/local/bin/$bin
          done
    test:
      pipeline:
        - runs: |
            link="$(readlink -fv /usr/local/bin/secrets-provider)"
            if [ "$link" != "/usr/bin/secrets-provider" ]; then
              echo "Symlink invalid!"
              echo "Found: $link"
              echo "Expected: /usr/bin/secrets-provider"
              exit 1
            fi

update:
  enabled: true
  github:
    identifier: cyberark/secrets-provider-for-k8s
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        # We need Conjur deployed in order to properly test this
        # which is not feasible in our package tests
        secrets-provider 2>&1 | grep ${{package.version}}

environment:
  contents:
    packages:
      - go-fips-1.25
