package:
  name: coredns-fips-1.12
  version: "1.12.4"
  epoch: 10 # GHSA-cfpf-hrx2-8rv6
  description: CoreDNS is a DNS server that chains plugins
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
    provides:
      - coredns-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
      - libcap-utils
      - make
      - wolfi-baselayout
  environment:
    CGO_ENABLED: 1

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f32329577fd5e3fe19908f8a9ba5c76aafb45bf6
      repository: https://github.com/coredns/coredns
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        github.com/quic-go/quic-go@v0.57.0
        github.com/expr-lang/expr@v1.17.7

  - runs: |
      # Ensures plugins get included
      make check

  - uses: go/build
    with:
      ldflags: -X github.com/coredns/coredns/coremain.GitCommit=v${{package.version}}
      output: coredns
      packages: .
      go-package: go-fips

  - uses: strip

  - runs: setcap cap_net_bind_service=+ep "${{targets.destdir}}/usr/bin/coredns"

update:
  enabled: true
  github:
    identifier: coredns/coredns
    strip-prefix: v
    tag-filter: v1.12.

test:
  environment:
    contents:
      packages:
        - bind-tools
        - wait-for-it
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: coredns
    - runs: |
        coredns -plugins
    - runs: |
        set -euo pipefail

        tee Corefile <<EOF
        .:1053 {
            file /home/build/db.wolfi.dev
            log
            errors
            cache
        }
        EOF

        tee /home/build/db.wolfi.dev <<'EOF'
        $TTL 3600
        @    IN SOA ns1.wolfi.dev. admin.wolfi.dev. (
                  20240101   ; Serial
                  7200       ; Refresh
                  3600       ; Retry
                  1209600    ; Expire
                  3600 )     ; Negative Cache TTL
        ;
        @    IN NS  ns1.wolfi.dev.
        ;
        foo.wolfi.dev  IN TXT "hi"
        EOF

        coredns > out.log 2>&1 &

        # Wait for DNS server to be ready
        wait-for-it localhost:1053 -t 30

        # Validates intree plugins can be successfully loaded
        dig @localhost -p 1053 foo.wolfi.dev TXT +short | grep -F '"hi"'
