package:
  name: perl-archive-zip
  version: "1.68"
  epoch: 0
  description: Provide an interface to ZIP archive files
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl

pipeline:
  # Use fetch from CPAN - upstream GitHub repository has no git tags
  # CPAN is the source of truth for this module's versioning
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PH/PHRED/Archive-Zip-${{package.version}}.tar.gz
      expected-sha256: 984e185d785baf6129c6e75f8eb44411745ac00bf6122fb1c8e822a3861ec650

  - runs: tar -xzf Archive-Zip-${{package.version}}.tar.gz --strip-components=1

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: perl/cleanup

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: Documentation for ${{package.name}}
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  release-monitor:
    identifier: 2650

test:
  environment:
    contents:
      packages:
        - make
        - perl-sub-identify
        - perl-test-simple
        - unzip
        - wget
        - zip
  pipeline:
    - name: Run upstream tests
      runs: |
        set -euo pipefail
        cd /tmp
        wget -qO- "https://cpan.metacpan.org/authors/id/P/PH/PHRED/Archive-Zip-${{package.version}}.tar.gz" | tar -xzf -
        cd Archive-Zip-${{package.version}}
        perl Makefile.PL
        make test
    - name: Test module loading
      runs: |
        set -euo pipefail
        perl -e 'use Archive::Zip qw(:ERROR_CODES); print "OK\n"'
    - name: Test crc32 CLI tool
      runs: |
        set -euo pipefail
        echo "test" > /tmp/test.txt
        crc32 /tmp/test.txt | grep -E '^[0-9a-f]{8}$'
    - name: Test ZIP operations
      runs: |
        set -euo pipefail
        perl -e '
          use Archive::Zip qw(:ERROR_CODES);

          # Create ZIP
          my $zip = Archive::Zip->new();
          $zip->addString("test content", "test.txt");
          $zip->writeToFileNamed("/tmp/test.zip") == AZ_OK or die "Write failed";

          # Read ZIP
          my $zip2 = Archive::Zip->new();
          $zip2->read("/tmp/test.zip") == AZ_OK or die "Read failed";

          # Verify content
          my $content = $zip2->contents("test.txt");
          die "Content mismatch" unless $content eq "test content";

          print "ZIP operations: OK\n";
        '
