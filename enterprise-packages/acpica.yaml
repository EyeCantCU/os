package:
  name: acpica
  version: "20251212"
  epoch: 0
  description: "The ACPI Component Architecture (ACPICA) project provides an open-source operating system-independent implementation of the Advanced Configuration and Power Interface specification (ACPI)"
  copyright:
    - license: Intel-ACPI

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - flex
      - m4

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/acpica/acpica
      expected-commit: 446be438238e9d339eed5182b807ac5f82df56c9
      tag: ${{package.version}}

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: acpibin acpiexamples acpiexec acpihelp acpisrc acpixtract iasl
    - runs: |
        acpidump -v 2>&1 | grep ${{package.version}}

update:
  enabled: true
  github:
    identifier: acpica/acpica
