package:
  name: cimg
  version: "3.7.2"
  epoch: 0
  description: Small C++ toolkit for image processing (header-only library)
  copyright:
    - license: CECILL-C OR CECILL-2.0

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GreycLab/CImg
      tag: v.${{package.version}}
      expected-commit: adc0075060e600f79bff9a6455daf53ff5968905

  - runs: |
      # Install main header
      install -Dm644 CImg.h "${{targets.destdir}}"/usr/include/CImg.h

      # Install plugin headers
      mkdir -p "${{targets.destdir}}"/usr/include/CImg/plugins
      install -Dm644 plugins/*.h "${{targets.destdir}}"/usr/include/CImg/plugins/

subpackages:
  - name: ${{package.name}}-dev
    description: CImg development headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage

test:
  pipeline:
    - uses: test/tw/emptypackage

update:
  enabled: true
  ignore-regex-patterns:
    - '^\d+$' # Ignore old-style numeric-only tags (v.165, v.221, etc.)
  git:
    strip-prefix: v.
    tag-filter-prefix: v.
