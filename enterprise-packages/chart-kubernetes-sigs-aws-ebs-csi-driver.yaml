package:
  name: chart-kubernetes-sigs-aws-ebs-csi-driver
  version: "2.56.1"
  epoch: 0
  description: A Helm chart for AWS EBS CSI Driver
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/aws-ebs-csi-driver
      tag: helm-chart-aws-ebs-csi-driver-${{package.version}}
      expected-commit: 4edc670d31d62eda935793a3594c4bafac49c677

  - uses: charts/package
    with:
      chart-path: charts/aws-ebs-csi-driver
      images: |
        aws-ebs-csi-driver:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
        csi-provisioner:
          values:
            sidecars:
              provisioner:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        csi-attacher:
          values:
            sidecars:
              attacher:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        csi-snapshotter:
          values:
            sidecars:
              snapshotter:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        livenessprobe:
          values:
            sidecars:
              livenessProbe:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        csi-resizer:
          values:
            sidecars:
              resizer:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        csi-node-driver-registrar:
          values:
            sidecars:
              nodeDriverRegistrar:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        volume-modifier-for-k8s:
          values:
            sidecars:
              volumemodifier:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
      test: |
        values:
          helmTester:
            enabled: false
          imagePullSecrets:
            - name: my-pull-secret
        cases:
          - name: default
            images: [aws-ebs-csi-driver, csi-provisioner, csi-attacher, livenessprobe, csi-resizer, csi-node-driver-registrar]
          - name: with-snapshotter
            images: [aws-ebs-csi-driver, csi-provisioner, csi-attacher, csi-snapshotter, livenessprobe, csi-resizer, csi-node-driver-registrar]
            values:
              sidecars:
                snapshotter:
                  forceEnable: true
          - name: with-volume-modifier
            images: [aws-ebs-csi-driver, csi-provisioner, csi-attacher, livenessprobe, csi-resizer, csi-node-driver-registrar, volume-modifier-for-k8s]
            values:
              controller:
                volumeModificationFeature:
                  enabled: true
          - name: all-optional
            images: [aws-ebs-csi-driver, csi-provisioner, csi-attacher, csi-snapshotter, livenessprobe, csi-resizer, csi-node-driver-registrar, volume-modifier-for-k8s]
            values:
              sidecars:
                snapshotter:
                  forceEnable: true
              controller:
                volumeModificationFeature:
                  enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/aws-ebs-csi-driver
    strip-prefix: helm-chart-aws-ebs-csi-driver-
    use-tag: true
    tag-filter-prefix: helm-chart-aws-ebs-csi-driver-
