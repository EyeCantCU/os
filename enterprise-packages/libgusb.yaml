package:
  name: libgusb
  version: 0.4.9
  epoch: 0
  description: GLib wrapper around libusb
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - eudev-dev
      - glib-dev
      - json-glib-dev
      - libusb-dev
      - meson

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hughsie/libgusb
      tag: ${{package.version}}
      expected-commit: ed31c8134d80d006bd45450e84180be2a7c0742e

  - uses: meson/configure
    with:
      opts: |
        -Db_lto=true \
        -Ddocs=false \
        -Dintrospection=false \
        -Dvapi=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-utils
    description: libgusb utilities
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/* "${{targets.contextdir}}"/usr/bin/
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify libgusb library
      runs: |
        set -euo pipefail
        stat /usr/lib/libgusb.so*
        echo "libgusb library test passed"

update:
  enabled: true
  github:
    identifier: hughsie/libgusb
