package:
  name: spiffe-helper-fips
  version: "0.11.0"
  epoch: 4
  description: A helper utility for SPIFFE (Secure Production Identity Framework For Everyone) operations.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/spiffe/spiffe-helper.git
      expected-commit: 1d0551d63787b528926b3e17fac949a376040bec
      tag: v${{package.version}}

  - uses: go/build
    with:
      packages: "./cmd/spiffe-helper"
      output: spiffe-helper
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: spiffe/spiffe-helper
    strip-prefix: v

test:
  pipeline:
    - runs: |
        spiffe-helper --help
    - uses: test/go-fips-check

environment:
  contents:
    packages:
      - go-fips-1.25
