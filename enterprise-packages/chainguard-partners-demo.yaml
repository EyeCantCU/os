#nolint:valid-pipeline-git-checkout-tag
package:
  name: chainguard-partners-demo
  version: "0.0.1"
  epoch: 0
  description: Chainguard Partners demo application
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-partners

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-partners/demo
      expected-commit: b7b1ae9d858ea325ccb9bc509e3d546db95b7681
      branch: main

  - uses: go/build
    with:
      output: chainguard-partners-demo
      packages: .

  - uses: strip

update:
  enabled: false
  exclude-reason: No tags available in chainguard-partners/demo. This is a demo.

test:
  pipeline:
    - runs: |
        set -euo pipefail
        chainguard-partners-demo | grep -F "Hello, Partners!"
