#nolint:valid-pipeline-git-checkout-tag
package:
  name: chainguard-partners-demo
  version: "0.0.1"
  epoch: 1
  description: Chainguard Partners demo application
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-partners

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-partners/demo
      expected-commit: a128b121b0f7f50d90264b306c4926e4715a97a0
      branch: main

  - uses: go/build
    with:
      modroot: ./hello-world
      output: chainguard-partners-demo
      packages: .

  - uses: strip

update:
  enabled: false
  exclude-reason: No tags available in chainguard-partners/demo. This is a demo.

test:
  pipeline:
    - runs: |
        set -euo pipefail
        chainguard-partners-demo | grep -F "Hello, World Partners!"
