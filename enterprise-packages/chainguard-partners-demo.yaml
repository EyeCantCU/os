package:
  name: chainguard-partners-demo
  version: "0.0.1"
  epoch: 2
  description: Chainguard Partners demo application
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-partners

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-partners/demo
      expected-commit: bbac8c237c1d62a36f4e3f7c4801725bfdb9de45
      tag: hello-world/v${{package.version}}

  - uses: go/build
    with:
      modroot: ./hello-world
      output: chainguard-partners-demo
      packages: .

  - uses: strip

update:
  enabled: true
  github:
    identifier: chainguard-partners/demo
    strip-prefix: hello-world/v
    tag-filter-prefix: hello-world/v
    use-tag: true

test:
  pipeline:
    - runs: |
        set -euo pipefail
        chainguard-partners-demo | grep -F "Hello, World Partners!"
