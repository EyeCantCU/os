package:
  name: kyverno-policy-reporter-plugins-trivy-fips
  version: "0.4.12"
  epoch: 1 # CVE-2025-61726
  description: Policy Reporter Plugin Trivy
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kyverno/policy-reporter-plugins
      tag: trivy-plugin-v${{package.version}}
      expected-commit: 095e87f714a00ba17bd2f783243b130c4f5f76da

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: example

  - uses: go/build
    with:
      go-package: go-fips
      output: trivy
      packages: .
      modroot: plugins/trivy

test:
  pipeline:
    - runs: |
        trivy help
    - uses: test/go-fips-check

update:
  enabled: true
  git:
    strip-prefix: trivy-plugin-v
    tag-filter-prefix: trivy
