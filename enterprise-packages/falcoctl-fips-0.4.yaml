package:
  name: falcoctl-fips-0.4
  version: 0.4.0
  epoch: 29 # CVE-2025-61726
  description: Administrative tooling for Falco
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: bc12026e6388a08270834750bead6d332c34251c
      repository: https://github.com/falcosecurity/falcoctl
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        google.golang.org/protobuf@v1.33.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        github.com/docker/docker@v28.0.0
        github.com/sirupsen/logrus@v1.9.1
      replaces: |-
        golang.org/x/net=golang.org/x/net@v0.38.0 github.com/emicklei/go-restful=github.com/emicklei/go-restful@v2.16.0+incompatible

  - runs: |
      make falcoctl RELEASE=${{package.version}}
      mkdir -p ${{targets.destdir}}/usr/bin
      mv falcoctl ${{targets.destdir}}/usr/bin/

  - uses: strip

update:
  enabled: true
  github:
    identifier: falcosecurity/falcoctl
    use-tag: true
    strip-prefix: v
    tag-filter: v0.4.

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        falcoctl version
        falcoctl --help
