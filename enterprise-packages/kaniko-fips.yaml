package:
  name: kaniko-fips
  version: "1.25.11"
  epoch: 1
  description: Build Container Images In Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-forks/kaniko
      tag: v${{package.version}}
      expected-commit: cb447ed1cb302ad202c43b2a10758288e6fe0ab8

  # patch to fix customer escalation: https://github.com/chainguard-dev/customer-issues/issues/2579
  - uses: patch
    with:
      patches: remove-usrmerge-symlinks.patch

  - uses: go/build
    with:
      output: executor
      packages: ./cmd/executor
      ldflags: -X github.com/chainguard-dev/kaniko/pkg/version.version=v${{package.version}}
      go-package: go-fips-md5

subpackages:
  - name: kaniko-warmer-fips
    pipeline:
      - uses: go/build
        with:
          output: warmer
          packages: ./cmd/warmer
          ldflags: -X github.com/chainguard-dev/kaniko/pkg/version.version=v${{package.version}}
          go-package: go-fips-md5
    test:
      pipeline:
        - uses: test/go-fips-check
        - runs: |
            warmer --help

update:
  enabled: true
  github:
    identifier: chainguard-forks/kaniko
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
    - name: "Verify executor binary and version"
      runs: |
        executor --help
        executor version | grep -q v${{package.version}}
    - name: "Test executor basic functionality"
      runs: |
        # Create a simple Dockerfile
        cat > Dockerfile << 'EOF'
        FROM scratch
        EOF

        # Build a simple image
        # We need --force when running under non-containerized environments (e.g. QEMU)
        executor \
          --force \
          --context dir://. \
          --dockerfile Dockerfile \
          --no-push \
          --tarPath test.tar

        # Verify the tar was created
        test -f test.tar

environment:
  contents:
    packages:
      - go-fips-1.25
