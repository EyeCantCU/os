package:
  name: chart-iamguarded-influxdb
  version: "6.6.16"
  epoch: 3 # go/enterprise-rsc/chart-iamguarded-influxdb
  description: influxdb iamguarded chart
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "3"
    memory: 12Gi

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: influxdb/${{package.version}}
      expected-commit: 7d35e670e5abfdb86f136ef4fd0882412b5e80e0

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/influxdb

  - uses: charts/package
    with:
      chart-path: iamguarded/influxdb

update:
  enabled: false # Pinned on last working version
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: influxdb/
    use-tag: true
    tag-filter-prefix: influxdb/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /influxdb
