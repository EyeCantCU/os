package:
  name: portmidi
  version: 2.0.8
  epoch: 1 # go/enterprise-rsc/portmidi
  description: Platform independent library for MIDI input/output
  copyright:
    - license: MIT
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - alsa-lib-dev
      - build-base
      - busybox
      - cmake
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/PortMidi/portmidi
      tag: v${{package.version}}
      expected-commit: 101dac9455e2718512c94e24cbcae6a6f34b908b

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      environment:
        contents:
          packages:
            - alsa-lib-dev
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - build-base
        - portmidi-dev
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test portmidi library functionality
      runs: |
        set -euo pipefail
        stat /usr/lib/libportmidi.so.2
        gcc -o /tmp/test_portmidi ./test_portmidi.c -lportmidi
        /tmp/test_portmidi

update:
  enabled: true
  github:
    identifier: PortMidi/portmidi
    strip-prefix: v
    tag-filter-prefix: v
