package:
  name: eco-python-meta
  version: 1
  epoch: 2 # go/enterprise-rsc/eco-python-meta
  description: "metapackage for eco python builds"
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0
  resources:
    cpu: "6"
    memory: 16Gi

vars:
  llvm-version: 19

environment:
  contents:
    packages:
      - busybox

pipeline:
  - name: "no-op"

test:
  pipeline:
    - uses: test/tw/byproductpackage

subpackages:
  - name: "eco-python-base"
    description: "packages preloaded in build images, metapackage"
    dependencies:
      runtime:
        - "eco-python-base-rebuilder-deps=${{package.full-version}}"
        - "bash"
        - "bash-completion"
        - "ca-certificates-bundle"
        - "chainguard-baselayout"
        - "coreutils"
        - "curl"
        - "google-cloud-sdk=525.0.0-r0" # temporary pin because 526 seems to be broken
        - "iproute2"
        - "jq"
        - "python-3.9-base"
        - "python-3.9-base-dev"
        - "python-3.13-dev"
        - "python-3.14-base-dev"
        - "shadow"
        - "uv"
    test:
      pipeline:
        - uses: test/tw/metapackage

  - name: "eco-python-base-rebuilder-deps"
    description: "packages used by the rebuilder itself, split out for organization only, metapackage"
    dependencies:
      runtime:
        - "eco-python-rebuilder-vcs=${{package.full-version}}"
        - "apk-tools"
        - "chainctl"
        - "cosign"
        - "gnupg"
        - "otel-cli"
        - "patch"
        - "py3.13-auditwheel-bin"
        - "py3-supported-auditwheel"
        - "py3-supported-python-dev"
        - "syft"
        - "witness"
    test:
      pipeline:
        - uses: test/tw/metapackage

  - name: "eco-python-rebuilder-vcs"
    description: "vcs deps for the rebuilder, split out for organization only, metapackage"
    dependencies:
      runtime:
        - "git"
        - "mercurial"
        - "py3-breezy"
        - "subversion"
    test:
      pipeline:
        - uses: test/tw/metapackage

  - name: "eco-python-native"
    description: "packages that are often needed in native package builds, metapackage"
    dependencies:
      runtime:
        - "eco-python-base=${{package.full-version}}"
        - "eco-python-native-typical-libs=${{package.full-version}}"
        - "autoconf"
        - "automake"
        - "build-base"
        - "clang-${{vars.llvm-version}}"
        - "cmake"
        - "gfortran"
        - "gh"
        - "go"
        - "libsystemd"
        - "libtool"
        - "libzmq-static"
        - "lld-${{vars.llvm-version}}"
        - "ninja"
        - "nodejs"
        - "npm"
        - "patchelf"
        - "pkgconf"
        - "posix-libc-utils"
        - "py3-clang-${{vars.llvm-version}}"
        - "py3-supported-build-base-dev"
        - "py3-supported-meson"
        - "runuser"
        - "rust"
        - "samurai"
        - "util-linux"
        - "util-linux-dev"
        - "util-linux-misc"
    test:
      pipeline:
        - uses: test/tw/metapackage

  - name: "eco-python-native-typical-libs"
    description: "library dev packages frequently consumed by native builds, metapackage"
    dependencies:
      runtime:
        - "abseil-cpp-dev"
        - "bzip2-dev"
        - "curl-dev"
        - "db"
        - "expat-dev"
        - "ffmpeg"
        - "ffmpeg-dev"
        - "ffmpeg-static"
        - "freetype-dev"
        - "fribidi-dev"
        - "gdbm-dev"
        - "icu-dev"
        - "keyutils-dev"
        - "krb5-libs"
        - "krb5-dev"
        - "lcms2-dev"
        - "libffi-dev"
        - "libice-dev"
        - "libidn2"
        - "libjpeg-turbo-dev"
        - "libpcap-dev"
        - "libpciaccess-dev"
        - "libpng-dev"
        - "libsm-dev"
        - "libsodium-dev"
        - "libstdc++-dev"
        - "libunwind-dev"
        - "libwebp-dev"
        - "libxcb-dev"
        - "libxml2-dev"
        - "libxslt-dev"
        - "linux-headers"
        - "llhttp-dev"
        - "lz4-dev"
        - "mesa-dev"
        - "ncurses-dev"
        - "openblas-dev"
        - "openjpeg-dev"
        - "openjpeg-tools"
        - "openssl-dev"
        - "openssl-provider-legacy"
        - "postgresql-dev"
        - "protobuf-dev"
        - "re2"
        - "re2-dev"
        - "readline-dev"
        - "tiff-dev"
        - "tk-dev"
        - "xz-dev"
        - "yaml-dev"
        - "zeromq"
        - "zeromq-dev"
        - "zlib-dev"
    test:
      pipeline:
        - uses: test/tw/metapackage

  # It is important that this package has a name that sorts before
  # "build-base". `apko` sorts the dependency list and does a one-shot
  # evaluation as it goes. If build-base is evaluated first, `apko` will
  # resolve its `gcc` dep to the latest version.
  - name: "2.28-build-base"
    description: "packages required for the 2.28 build environment, metapackage"
    dependencies:
      runtime:
        - "ct-manylinux-2.28"
        - "gcc-14-default"
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: false
