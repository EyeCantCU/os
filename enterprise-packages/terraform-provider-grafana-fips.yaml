package:
  name: terraform-provider-grafana-fips
  version: "4.25.0"
  epoch: 2 # CVE-2025-61732
  description: Terraform Grafana provider
  copyright:
    - license: MPL-2.0
  resources:
    cpu: 16
    memory: 40Gi
  dependencies:
    runtime:
      - terraform-local-provider-config

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/terraform-provider-grafana
      tag: v${{package.version}}
      expected-commit: cbca5a22e64af675542e15a85bc401610514befb

  - uses: go/build
    with:
      packages: .
      output: terraform-provider-grafana
      go-package: go-fips

  - runs: |
      GOARCH=$(go env GOARCH)
      mkdir -p "${{targets.destdir}}"/terraform/provider-mirror/registry.terraform.io/grafana/grafana/${{package.version}}/linux_${GOARCH}/
      ln -s /usr/bin/terraform-provider-grafana \
          "${{targets.destdir}}"/terraform/provider-mirror/registry.terraform.io/grafana/grafana/${{package.version}}/linux_${GOARCH}/terraform-provider-grafana_v${{package.version}}_x5

update:
  enabled: true
  github:
    identifier: grafana/terraform-provider-grafana
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - terraform
  pipeline:
    # FIPS check must be first for Go FIPS packages
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: terraform-provider-grafana
    - name: Verify Terraform can initialize with provider
      runs: |
        set -euo pipefail

        mkdir -p /tmp/tf-test
        cd /tmp/tf-test

        # Create minimal config using the grafana provider
        tee main.tf <<'EOF'
        terraform {
          required_providers {
            grafana = {
              source = "grafana/grafana"
            }
          }
        }
        EOF

        # Terraform init should load the provider from local mirror
        # (configured by terraform-local-provider-config runtime dependency)
        terraform init -input=false

        # Verify provider was loaded successfully (fails test if not found)
        terraform version | grep -F "grafana"
