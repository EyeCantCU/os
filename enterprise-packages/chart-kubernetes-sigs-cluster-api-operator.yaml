package:
  name: chart-kubernetes-sigs-cluster-api-operator
  version: "0.25.0"
  epoch: 0
  description: Cluster API Operator
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - kustomize
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/cluster-api-operator
      tag: v${{package.version}}
      expected-commit: 7c2c805caad6a0d9b4885fb133a1d4b5846ad4c3

  # Replicate upstream's release-chart process:
  # 1. Generate operator-components.yaml from kustomize
  # 2. Update values.yaml with production image
  # 3. Update Chart.yaml with release version
  - runs: |
      # Generate operator-components.yaml (CRDs, RBAC, webhooks)
      kustomize build ./config/chart > hack/charts/cluster-api-operator/templates/operator-components.yaml

      # Set appVersion in Chart.yaml (source has placeholder 0.0.0)
      yq -i '.appVersion = "${{package.version}}"' \
        hack/charts/cluster-api-operator/Chart.yaml

      # Set production image repository and tag in values.yaml
      yq -i '.image.manager.repository = "registry.k8s.io/capi-operator/cluster-api-operator"' \
        hack/charts/cluster-api-operator/values.yaml
      yq -i '.image.manager.tag = "v${{package.version}}"' \
        hack/charts/cluster-api-operator/values.yaml

  - uses: charts/package
    with:
      chart-path: hack/charts/cluster-api-operator
      images: |
        cluster-api-operator:
          values:
            image:
              manager:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
      test: |
        cases:
          - name: default
            images: [cluster-api-operator]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/cluster-api-operator
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
