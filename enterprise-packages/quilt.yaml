package:
  name: quilt
  version: "0.69"
  epoch: 0
  description: Easily manage large numbers of patches
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - bash
      - bzip2
      - diffutils
      - gawk
      - gettext
      - patch

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - diffutils
      - gettext-dev
      - lynx
      - patch
      - perl
      - sed

pipeline:
  - uses: fetch
    with:
      uri: https://download-mirror.savannah.gnu.org/releases/quilt/quilt-${{package.version}}.tar.gz
      expected-sha256: 555ddffde22da3c86d1caf5a9c1fb8a152ac2b84730437bd39cc08849c9f4852

  - uses: autoconf/configure

  - uses: autoconf/make
    with:
      opts: all

  - uses: autoconf/make-install
    with:
      opts: BUILD_ROOT="${{targets.contextdir}}"

  - runs: |
      # Move bash completion to standard location
      mkdir -p "${{targets.contextdir}}"/usr/share/bash-completion/completions
      ls -latr "${{targets.contextdir}}"/etc/bash_completion.d/
      mv "${{targets.contextdir}}"/etc/bash_completion.d/quilt "${{targets.contextdir}}"/usr/share/bash-completion/completions/quilt

update:
  enabled: true
  release-monitor:
    identifier: 4143

subpackages:
  - name: ${{package.name}}-doc
    description: Documentation for ${{package.name}}
    pipeline:
      - uses: split/manpages
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share/doc/${{package.name}}
          mv "${{targets.destdir}}"/usr/share/doc/${{package.name}}/* "${{targets.subpkgdir}}"/usr/share/doc/${{package.name}}/ || true
    test:
      pipeline:
        - uses: test/docs

  - name: ${{package.name}}-bash-completion
    description: Bash completion for ${{package.name}}
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/share/bash-completion/completions
          mv "${{targets.destdir}}"/usr/share/bash-completion/completions/quilt "${{targets.contextdir}}"/usr/share/bash-completion/completions/quilt
    test:
      pipeline:
        - runs: stat /usr/share/bash-completion/completions/quilt

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: quilt
    - uses: test/tw/help-check
      with:
        bins: quilt
    - name: Functional test
      runs: |
        set -o pipefail
        # Create a test directory structure
        TEST_DIR=$(mktemp -d)
        cd "$TEST_DIR"

        # Initialize quilt patches directory
        mkdir -p patches

        # Create a sample file to patch
        echo "original content" > test.txt

        # Create a new patch
        quilt new test.patch
        quilt add test.txt
        echo "modified content" > test.txt
        quilt refresh

        # Verify the patch was created
        stat patches/test.patch

        # Verify patch content
        grep -F "modified content" patches/test.patch

        # Pop the patch and verify original content is restored
        quilt pop
        grep -F "original content" test.txt

        # Push the patch back and verify modified content
        quilt push
        grep -F "modified content" test.txt

        # Cleanup
        cd /
        rm -rf "$TEST_DIR"
