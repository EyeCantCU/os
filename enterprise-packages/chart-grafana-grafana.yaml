package:
  name: chart-grafana-grafana
  version: "10.5.15"
  epoch: 0
  description: The leading tool for querying and visualizing time series and metrics.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - helm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/helm-charts
      tag: grafana-${{package.version}}
      expected-commit: 570b7560be8503a031a470cf81a7dfaf865ed5b5

  # Fix hardcoded sha256: prefix in templates - the .sha field should accept the full digest
  - runs: |
      find charts/grafana/templates -type f \( -name '*.yaml' -o -name '*.tpl' \) \
        -exec sed -i 's/@sha256:{{ \.Values\./@{{ .Values./g' {} +

  - uses: charts/package
    with:
      chart-path: charts/grafana
      images: |
        grafana:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${tag}
              sha: ${digest}
        download-dashboards-image:
          values:
            downloadDashboardsImage:
              registry: ${registry}
              repository: ${repo}
              tag: ${tag}
              sha: ${digest}
        init-chown-data:
          values:
            initChownData:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${tag}
                sha: ${digest}
        sidecar:
          values:
            sidecar:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${tag}
                sha: ${digest}
        image-renderer:
          values:
            imageRenderer:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${tag}
                sha: ${digest}
      test: |
        cases:
          - name: default
            images: [grafana]
          - name: with-sidecar
            images: [grafana, sidecar]
            values:
              sidecar:
                dashboards:
                  enabled: true
          - name: with-persistence
            images: [grafana, init-chown-data]
            values:
              persistence:
                enabled: true
          - name: with-image-renderer
            images: [grafana, image-renderer]
            values:
              imageRenderer:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: grafana/helm-charts
    strip-prefix: grafana-
    use-tag: true
    tag-filter-prefix: grafana-
