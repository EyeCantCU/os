package:
  name: lvm-driver-fips
  version: "1.8.1"
  epoch: 3
  description: Dynamically provision Stateful Persistent Node-Local Volumes & Filesystems for Kubernetes that is integrated with a backend LVM2 data storage stack.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - blkid
      - btrfs-progs
      - busybox
      - ca-certificates-bundle
      - device-mapper
      - e2fsprogs
      - e2fsprogs-extra
      - lvm2
      - mount
      - umount
      - util-linux
      - util-linux-misc
      - xfsprogs
  resources:
    cpu: "4"
    memory: 17Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openebs/lvm-localpv
      tag: v${{package.version}}
      expected-commit: 6c31db000035dae12ec63d3bdefcedb25ad84b67

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/main.go
      ldflags: |
        -X github.com/openebs/lvm-localpv/pkg/version.Version=${{package.version}}
        -X github.com/openebs/lvm-localpv/pkg/version.GitCommit=$(git rev-parse HEAD)
      output: lvm-driver

subpackages:
  - name: ${{package.name}}-compat
    description: "upstream image have executable placed at /usr/local/bin"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/bin/
          ln -sf ../../bin/lvm-driver ${{targets.contextdir}}/usr/local/bin/lvm-driver
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  github:
    identifier: openebs/lvm-localpv
    strip-prefix: v
  ignore-regex-patterns:
    - ^lvm-localpv-.*

test:
  environment:
    contents:
      packages:
        - kubernetes-csi-node-driver-registrar
        - git
  pipeline:
    - uses: test/go-fips-check
    - uses: test/kwok/cluster
    - uses: test/tw/help-check
      with:
        bins: lvm-driver
    - runs: |
        set -euo pipefail
        sleep 5
        mkdir -p /var/run/secrets/kubernetes.io/serviceaccount
        mkdir -p /var/lib/kubelet/plugins/lvm-localpv
        mkdir -p /plugin
        mkdir -p /registration
        mkdir -p /var/run/secrets/kubernetes.io/serviceaccount
        CA=$(kubectl config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority}')
        cp $CA /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubectl create clusterrolebinding default --clusterrole=cluster-admin --serviceaccount=default:default
        kubectl create token default > /var/run/secrets/kubernetes.io/serviceaccount/token
        export KUBERNETES_SERVICE_HOST=127.0.0.1
        export KUBE_NODE_NAME=node-000000
        export KUBERNETES_SERVICE_PORT=32764
        csi-node-driver-registrar --v=5 --csi-address=/plugin/csi.sock --kubelet-registration-path=/var/lib/kubelet/plugins/lvm-localpv/csi.sock > /dev/null 2>&1 &
        sleep 10
        git clone --branch v${{package.version}} --depth=1 https://github.com/openebs/lvm-localpv
        cd lvm-localpv
        kubectl apply --server-side=true -f deploy/yamls/lvmnode-crd.yaml
        lvm-driver --plugin=controller --endpoint=unix:///plugin/csi.sock --nodeid=node-000000 > lvm-driver.log 2>&1 &
        LMV_DRIVER_PID=$!

        # Terminate the lvm-driver process after we've grabbed some logs
        sleep 5
        kill $LMV_DRIVER_PID

        # Verify CSI driver started on the configured endpoint (proves CSI-specific functionality)
        # Both checks must pass to prove correct CSI initialization
        echo "Verifying CSI driver log output..."

        # Check 1: Verify gRPC server is listening (fails test if not found)
        if ! grep -F 'Listening for connections' lvm-driver.log; then
          echo "FAIL: CSI gRPC server did not start listening"
          echo "Expected: 'Listening for connections' indicating gRPC server started"
          echo "LVM Driver logs:"
          cat lvm-driver.log
          exit 1
        fi

        # Check 2: Verify CSI socket endpoint path is configured (fails test if not found)
        if ! grep -F '/plugin/csi.sock' lvm-driver.log; then
          echo "FAIL: CSI endpoint path not found in logs"
          echo "Expected: '/plugin/csi.sock' proving correct CSI endpoint configuration"
          echo "LVM Driver logs:"
          cat lvm-driver.log
          exit 1
        fi

        echo "SUCCESS: CSI driver initialized and listening on unix:///plugin/csi.sock"

environment:
  contents:
    packages:
      - go-fips-1.25
