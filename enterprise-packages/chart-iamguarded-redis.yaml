package:
  name: chart-iamguarded-redis
  version: "23.0.5"
  epoch: 1
  description: redis iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: redis/${{package.version}}
      expected-commit: de739bd74672bdfccdcac80feacf70fc89d4eb18

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/redis

  - uses: charts/package
    with:
      chart-path: iamguarded/redis

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: redis/
    use-tag: true
    tag-filter-prefix: redis/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /redis
