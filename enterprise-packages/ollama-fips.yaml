package:
  name: ollama-fips
  version: "0.16.0"
  epoch: 0 # go/enterprise-rsc/ollama-fips
  description: Get up and running with Llama 2 and other large language models locally
  copyright:
    - license: MIT
  resources:
    cpu: "5"
    memory: 10Gi

environment:
  contents:
    packages:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ollama/ollama
      tag: v${{package.version}}
      expected-commit: f8dc7c9f54a753d2c6d3410936e73486f9bf463d

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      modroot: .
      packages: .
      output: ollama
      ldflags: |
        -X=github.com/ollama/ollama/version.Version=${{package.version}}
        -X=github.com/ollama/ollama/server.mode=release
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: ollama/ollama
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - uses: test/go-fips-check
    - name: Ensure CLI works
      runs: |
        ollama --version | grep "${{package.version}}"
        ollama --help | grep "Large language model"
    - name: Test if Ollama server works
      runs: |
        HOST_IP=localhost
        PREDEFINED_PORT=9999
        OLLAMA_HOST=$HOST_IP:$PREDEFINED_PORT ollama serve &
        SERVER_PID=$!
        wait-for-it -t 10 --strict $HOST_IP:$PREDEFINED_PORT

        # Check if the server is running
        curl -s $HOST_IP:$PREDEFINED_PORT | grep -q "Ollama is running"

        # Kill the server process
        kill $SERVER_PID
