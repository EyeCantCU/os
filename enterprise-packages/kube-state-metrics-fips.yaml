package:
  name: kube-state-metrics-fips
  version: "2.18.0"
  epoch: 3 # GHSA-j5w8-q4qc-rx2x
  description: Add-on agent to generate and expose cluster-level metrics.
  dependencies:
    runtime:
      - tzdata
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/kube-state-metrics
      tag: v${{package.version}}
      expected-commit: ab562f78ebf4cb97cc2f87c1235e457076035d16

  - uses: go/build
    with:
      go-package: go-fips-md5
      packages: .
      output: kube-state-metrics
      ldflags: |
        -X github.com/prometheus/common/version.Version=v${{package.version}}
        -X github.com/prometheus/common/version.Revision=$(git rev-parse --short HEAD)
        -X github.com/prometheus/common/version.Branch=HEAD
        -X github.com/prometheus/common/version.BuildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')'

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    description: "compat package for iamguarded"
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p /opt/iamguarded/kube-state-metrics/bin/
          ln -sf /usr/bin/kube-state-metrics /opt/iamguarded/kube-state-metrics/bin/kube-state-metrics
      - uses: iamguarded/build-compat
        with:
          package: kube-state-metrics
          version: ${{vars.major-version}}
      - uses: iamguarded/finalize-compat
        with:
          package: kube-state-metrics
          version: ${{vars.major-version}}
    test:
      environment:
        contents:
          packages:
            - curl
        environment:
          KUBERNETES_SERVICE_HOST: "127.0.0.1"
          KUBERNETES_SERVICE_PORT: "32764"
      pipeline:
        - name: Verify compat symlink exists
          runs: |
            set -euo pipefail
            # Verify symlink exists (fails test if missing)
            stat /opt/iamguarded/kube-state-metrics/bin/kube-state-metrics

            # Verify symlink target is valid (fails test if not a symlink)
            test -L /opt/iamguarded/kube-state-metrics/bin/kube-state-metrics || {
              echo "FAIL: Expected symlink at /opt/iamguarded/kube-state-metrics/bin/kube-state-metrics"
              exit 1
            }

            echo "SUCCESS: Compat symlink verified"
        - uses: iamguarded/test-compat
          with:
            package: kube-state-metrics
            version: ${{vars.major-version}}
        - uses: test/kwok/cluster
        - name: Verify daemon works through compat symlink
          uses: test/daemon-check-output
          with:
            start: /opt/iamguarded/kube-state-metrics/bin/kube-state-metrics --kubeconfig=$HOME/.kube/config
            expected_output: |
              Starting kube-state-metrics
              Started metrics server
            timeout: "60"
            post: |
              set -euo pipefail
              # Wait for metrics endpoint to be ready
              wait-for-it localhost:8080 -t 30

              # Verify metrics are being served through the compat symlink (fails test if endpoint fails)
              metrics_output=$(curl -sf http://localhost:8080/metrics)

              # Check for kube_* metrics proving daemon is collecting Kubernetes resources (fails test if missing)
              if echo "$metrics_output" | grep -F "kube_"; then
                echo "SUCCESS: Daemon serves kube_* metrics through compat symlink"
              else
                echo "FAIL: Expected kube_* metrics from daemon started via compat symlink"
                exit 1
              fi

test:
  environment:
    contents:
      packages:
        - curl
    environment:
      KUBERNETES_SERVICE_HOST: "127.0.0.1"
      KUBERNETES_SERVICE_PORT: "32764"
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: kube-state-metrics
    - uses: test/tw/help-check
      with:
        bins: kube-state-metrics
    - uses: test/kwok/cluster
    - name: Test kube-state-metrics daemon with metrics verification
      uses: test/daemon-check-output
      with:
        start: /usr/bin/kube-state-metrics --kubeconfig=$HOME/.kube/config
        expected_output: |
          Starting kube-state-metrics
          Started metrics server
        timeout: "60"
        post: |
          set -euo pipefail
          # Wait for metrics endpoint to be ready
          wait-for-it localhost:8080 -t 30

          # Verify the /metrics endpoint returns Prometheus-format metrics
          metrics_output=$(curl -sf http://localhost:8080/metrics)

          # Check for Prometheus format HELP lines (fails test if missing)
          if echo "$metrics_output" | grep -F "# HELP"; then
            echo "SUCCESS: Found Prometheus HELP lines in metrics output"
          else
            echo "FAIL: Expected Prometheus-format metrics with HELP lines"
            echo "Actual output sample: $(echo "$metrics_output" | head -20)"
            exit 1
          fi

          # Check for Prometheus format TYPE lines (fails test if missing)
          if echo "$metrics_output" | grep -F "# TYPE"; then
            echo "SUCCESS: Found Prometheus TYPE lines in metrics output"
          else
            echo "FAIL: Expected Prometheus-format metrics with TYPE lines"
            exit 1
          fi

          # Verify kube-state-metrics specific metrics are present (fails test if missing)
          if echo "$metrics_output" | grep -F "kube_"; then
            echo "SUCCESS: Found kube_* metrics indicating kube-state-metrics is working"
          else
            echo "FAIL: Expected kube_* metrics from kube-state-metrics"
            exit 1
          fi

update:
  enabled: true
  github:
    identifier: kubernetes/kube-state-metrics
    strip-prefix: v
    tag-filter: v
