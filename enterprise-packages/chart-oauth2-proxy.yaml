package:
  name: chart-oauth2-proxy
  version: "10.1.4"
  epoch: 0
  description: A reverse proxy that provides authentication with Google, Github or other providers
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-dandydeveloper-redis-ha

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/oauth2-proxy/manifests
      tag: oauth2-proxy-${{package.version}}
      expected-commit: f9cc20f768ba03ea931613dc2cd789c143adc688

  - uses: charts/package
    with:
      chart-path: helm/oauth2-proxy
      images: |
        oauth2-proxy:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${pseudo_tag}
        alpine:
          values:
            initContainers:
              waitForRedis:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
      test: |
        values:
          imagePullSecrets:
            - name: pull-secret
        # redis and shellcheck images come from the redis-ha subchart, tested separately
        ignore:
          - public.ecr.aws/docker/library/redis:8.2.4-alpine
          - koalaman/shellcheck:v0.10.0
        cases:
          - name: default
            images: [oauth2-proxy]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: oauth2-proxy/manifests
    strip-prefix: oauth2-proxy-
    use-tag: true
    tag-filter-prefix: oauth2-proxy-
