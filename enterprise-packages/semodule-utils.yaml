package:
  name: semodule-utils
  version: "3.10"
  epoch: 0 # go/enterprise-rsc/semodule-utils
  description: "SELinux policy semodule-utils"
  copyright:
    - license: GPL-2.0-only
  resources:
    cpu: "2"
    memory: 1Gi

environment:
  contents:
    packages:
      - bison
      - busybox
      - coreutils
      - flex
      - gcc
      - gettext
      - glibc-dev
      - libselinux-dev
      - libsemanage-dev
      - libsepol-dev
      - pkgconf-dev
      - python3
  environment:
    SBINDIR: /usr/bin

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/SELinuxProject/selinux.git
      tag: ${{package.name}}-${{package.version}}
      expected-commit: ca10fc4204ed60540d41d2499127c18ad0643f9e

  - uses: autoconf/make-install
    working-directory: ${{package.name}}

  - uses: strip

subpackages:
  - name: "${{package.name}}-doc"
    description: "${{package.name}} documentation"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: SELinuxProject/selinux
    use-tag: true
    tag-filter: semodule-utils-
    strip-prefix: semodule-utils-

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: semodule_link semodule_package semodule_unpackage
