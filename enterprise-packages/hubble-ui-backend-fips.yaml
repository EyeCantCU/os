package:
  name: hubble-ui-backend-fips
  version: "0.13.2"
  epoch: 7
  description: "Observability & troubleshooting for Kubernetes services"
  copyright:
    - license: "Apache-2.0"
  dependencies:
    runtime:
      - ca-certificates-bundle
      - gops

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cilium/hubble-ui
      tag: v${{package.version}}
      destination: hubble-ui
      expected-commit: 17853a928201eab6f1fe5b04420a033ece163b1e

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        github.com/cilium/cilium@v1.17.3
      modroot: hubble-ui/backend

  - uses: go/build
    with:
      packages: .
      output: backend
      modroot: hubble-ui/backend
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: cilium/hubble-ui
    strip-prefix: v

test:
  pipeline:
    - runs: |
        # This is a component of a larger system, ensure it fails to start as
        # expected
        /usr/bin/backend 2>&1 | grep "stat /root/.kube/config: no such file or directory"
