package:
  name: falcoctl-fips
  version: "0.12.1"
  epoch: 0 # CVE-2025-61729
  description: Administrative tooling for Falco
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d35bf927a3c8ae109907183dcefea19ec9e9a054
      repository: https://github.com/falcosecurity/falcoctl
      tag: v${{package.version}}

  - runs: |
      make falcoctl RELEASE=${{package.version}}
      mkdir -p ${{targets.destdir}}/usr/bin
      mv falcoctl ${{targets.destdir}}/usr/bin/

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        falcoctl version
        falcoctl --help

update:
  enabled: true
  github:
    identifier: falcosecurity/falcoctl
    strip-prefix: v
