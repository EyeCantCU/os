package:
  name: falcoctl-fips
  version: "0.12.2"
  epoch: 2 # CVE-2026-22703
  description: Administrative tooling for Falco
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ae89b7462adb8e9eff3b00eabe1da923211562e3
      repository: https://github.com/falcosecurity/falcoctl
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/sigstore/cosign/v3@v3.0.4

  - runs: |
      make falcoctl RELEASE=${{package.version}}
      mkdir -p ${{targets.destdir}}/usr/bin
      mv falcoctl ${{targets.destdir}}/usr/bin/

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: falcoctl
    - uses: test/tw/help-check
      with:
        bins: falcoctl

update:
  enabled: true
  github:
    identifier: falcosecurity/falcoctl
    strip-prefix: v
