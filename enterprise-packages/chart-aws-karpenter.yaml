package:
  name: chart-aws-karpenter
  version: "1.9.0"
  epoch: 0
  description: A Helm chart for Karpenter, an open-source node provisioning project built for Kubernetes.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/karpenter-provider-aws
      tag: v${{package.version}}
      expected-commit: e7e13271922287f916b3d133505205048a74af4b

  # The upstream release process updates Chart.yaml version and appVersion to
  # the release tag version via CI, but does not commit these changes back to
  # the repository. Replicate that here so the packaged chart matches the
  # published OCI chart.
  - runs: |
      yq -i '.appVersion = "${{package.version}}"' charts/karpenter/Chart.yaml

  - uses: charts/package
    with:
      chart-path: charts/karpenter
      images: |
        karpenter-controller:
          values:
            controller:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
      test: |
        values:
          settings:
            clusterName: test-cluster
        cases:
          - name: default
            images: [karpenter-controller]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: aws/karpenter-provider-aws
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
