package:
  name: aws-fsx-csi-driver-fips
  version: "1.8.0"
  epoch: 1 # go/enterprise-rsc/aws-fsx-csi-driver-fips
  description: The Amazon FSx for Lustre Container Storage Interface (CSI) Driver implements CSI specification for container orchestrators (CO) to manage lifecycle of Amazon FSx for Lustre filesystems.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # https://github.com/aws/eks-distro-build-tooling/blob/d1b32849d4ffc72c2ecad7244688d349d03aca7c/eks-distro-base/Dockerfile.minimal-base-csi-ebs#L34-L44
      - blkid
      - blockdev
      - e2fsprogs
      - e2fsprogs-extra
      - lsblk
      - mount
      - umount
      - util-linux
      - util-linux-misc
      - xfsprogs
  resources:
    cpu: "3"
    memory: 8Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/aws-fsx-csi-driver
      tag: v${{package.version}}
      expected-commit: f0aad93c4151f78d6deb5b148ac039e3d9001dc0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd
      output: aws-fsx-csi-driver
      ldflags: |
        -X sigs.k8s.io/aws-fsx-csi-driver/pkg/driver.driverVersion=${{package.version}}
        -X sigs.k8s.io/aws-fsx-csi-driver/pkg/cloud.driverVersion=${{package.version}}
        -X sigs.k8s.io/aws-fsx-csi-driver/pkg/driver.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/aws-fsx-csi-driver/pkg/driver.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")

update:
  enabled: true
  git:
    strip-prefix: v
  ignore-regex-patterns:
    - helm-chart-*

test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: aws-fsx-csi-driver
    - uses: test/tw/ver-check
      with:
        bins: aws-fsx-csi-driver
    - uses: test/go-fips-check
