package:
  name: fluent-plugin-grafana-loki
  version: "1.2.20"
  epoch: 0
  description: Grafana Loki output plugin for Fluentd
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - ruby3.2-fluent-plugin-grafana-loki=${{package.full-version}}
    runtime:
      - ruby3.2-fluentd
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-3.2
      - ruby-3.2-dev

pipeline:
  # The gem lives in the grafana/loki monorepo under clients/cmd/fluentd/
  - uses: git-checkout
    with:
      expected-commit: 90888a0cc737b60f29b8bed880a380731ae1e492
      repository: https://github.com/grafana/loki
      tag: v2.8.0

  - working-directory: clients/cmd/fluentd
    pipeline:
      - uses: ruby/build
        with:
          gem: ${{vars.gem}}
      - uses: ruby/install
        with:
          gem: ${{vars.gem}}
          version: ${{package.version}}
      - uses: ruby/clean

vars:
  gem: fluent-plugin-grafana-loki

# Disabled: gem version (1.2.20) does not match repo tags (Loki release versions)
update:
  enabled: false

test:
  pipeline:
    - runs: |
        ruby -e "require 'fluent/plugin/out_loki'"
