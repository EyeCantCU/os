package:
  name: chart-sigstore-trillian
  version: "0.3.14"
  epoch: 0
  description: Trillian is a log that stores an accurate, immutable and verifiable history of activity.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sigstore/helm-charts
      tag: trillian-${{package.version}}
      expected-commit: a88d277eec328b5e39eb0243f21ff81e7bc4dac7

  - uses: charts/package
    with:
      chart-path: charts/trillian
      images: |
        curl:
          values:
            initContainerImage:
              curl:
                registry: ${registry}
                repository: ${repo}
                version: ${digest}
        netcat:
          values:
            initContainerImage:
              netcat:
                registry: ${registry}
                repository: ${repo}
                version: ${digest}
        db-server:
          values:
            mysql:
              image:
                registry: ${registry}
                repository: ${repo}
                version: ${digest}
        log-server:
          values:
            logServer:
              image:
                registry: ${registry}
                repository: ${repo}
                version: ${digest}
        log-signer:
          values:
            logSigner:
              image:
                registry: ${registry}
                repository: ${repo}
                version: ${digest}
        createdb:
          values:
            createdb:
              image:
                registry: ${registry}
                repository: ${repo}
                version: ${digest}
        cloud-sql-proxy:
          values:
            mysql:
              gcp:
                cloudsql:
                  registry: ${registry}
                  repository: ${repo}
                  version: ${digest}
        scaffold-cloud-sql-proxy:
          values:
            mysql:
              gcp:
                scaffoldSQLProxy:
                  registry: ${registry}
                  repository: ${repo}
                  version: ${digest}
      test: |
        cases:
          - name: default
            images: [netcat, db-server, log-server, log-signer, createdb]
          - name: with-gcp
            images: [netcat, db-server, log-server, log-signer, createdb, cloud-sql-proxy, scaffold-cloud-sql-proxy]
            values:
              mysql:
                gcp:
                  enabled: true
                  instance: test-project:us-central1:test-instance

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: sigstore/helm-charts
    strip-prefix: trillian-
    use-tag: true
    tag-filter-prefix: trillian-
