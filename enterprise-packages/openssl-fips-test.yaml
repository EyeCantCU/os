package:
  name: openssl-fips-test
  version: "0.8"
  epoch: 0
  description: utility for validating an OpenSSL FIPS configuration
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - openssl-dev
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/openssl-fips-test
      tag: v${{package.version}}
      expected-commit: 3ab7caf532ee165bbcbdecde65e3f118ec0a1d8f

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

update:
  enabled: true
  github:
    identifier: chainguard-dev/openssl-fips-test
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
  pipeline:
    - runs: |
        openssl-fips-test
