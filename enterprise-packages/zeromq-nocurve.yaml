package:
  name: zeromq-nocurve
  version: 4.3.5
  epoch: 0
  description: The ZeroMQ messaging library and tools without curvezmq support
  copyright:
    - license: MPL-2.0

environment:
  contents:
    packages:
      - build-base
      - cmake-3
      - libbsd-dev
      - perl
      - util-linux-dev
      - xmlto

pipeline:
  - uses: fetch
    with:
      expected-sha256: 6653ef5910f17954861fe72332e68b03ca6e4d9c7160eb3a8de5a5a913bfab43
      uri: https://github.com/zeromq/libzmq/releases/download/v${{package.version}}/zeromq-${{package.version}}.tar.gz

  - uses: cmake/configure
    with:
      opts: -DENABLE_CURVE=OFF -DWITH_LIBSODIUM=OFF

  - uses: cmake/build

  - uses: cmake/install

  # Install pre-built manpages with autoconf
  - uses: autoconf/configure
    with:
      opts: --with-libsodium=no --disable-Werror

  - uses: autoconf/make
    with:
      dir: doc/
      opts: install-man DESTDIR="${{targets.contextdir}}"

  - uses: strip

subpackages:
  - name: libzmq-nocurve-static
    pipeline:
      - uses: split/static
    description: zeromq-nocurve static

  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: ${{package.name}} manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: zeromq/libzmq
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - gcc
        - glibc-dev
        - zeromq-nocurve-dev
        - pkgconf
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        cat << 'EOF' > test_zeromq.c
        #include <assert.h>
        #include <zmq.h>

        int main()
        {
        zmq_msg_t query;
        assert(0 == zmq_msg_init_size(&query, 1));
        return 0;
        }
        EOF
        gcc -o test_zeromq test_zeromq.c -lzmq
