#nolint:valid-pipeline-fetch-digest
package:
  # body-type-number
  name: NIST-CMVP-4407
  # v1 of nist meta-packages
  version: 1
  epoch: 0
  # Many SCA tools know how to read APK URL
  # URL to the certificate
  url: https://csrc.nist.gov/projects/cryptographic-module-validation-program/certificate/4407
  # Some tools use description
  # body, type, number, certificate name, standard
  description: "NIST CMVP 4407 BoringCrypto (FIPS 140-2) metapackage"
  copyright:
    # NIST information is all public
    - license: NIST-PD
  dependencies:
    runtime:
      - ztunnel-fips-1.25

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      # Note this URL will make it into package SPDX SBOM, and will also make it into APKO SBOM
      uri: https://csrc.nist.gov/projects/cryptographic-module-validation-program/certificate/4407
      # Unstable content, thus no expected checksum and hence the nolint too
      expected-none: true
      extract: false
      delete: true

test:
  pipeline:
    - uses: test/tw/metapackage
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 4407

update:
  enabled: false
  exclude-reason: "This is an empty NIST CMVP certificate SBOM indicator"
