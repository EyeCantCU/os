package:
  name: consul-fips-1.19
  version: 1.19.2
  epoch: 46 # GHSA-4f99-4q7p-p3gh
  description: Consul is a distributed, highly available, and data center aware solution to connect and configure applications across dynamic, distributed infrastructure.
  copyright:
    - license: BUSL-1.1
  dependencies:
    provides:
      - consul-fips=${{package.full-version}}
    runtime:
      - merged-bin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/consul
      tag: v${{package.version}}
      expected-commit: 048f1936f5ab43bb7b5096dfdca81db05a19b9cf
      destination: ${{package.name}}
      cherry-picks: |
        main/e794201d0c618333d81ad775270f7b32801178fb: [GHSA-qh7p-pfq3-677h]

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: consul-fips-1.19/testing/deployer

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: consul-fips-1.19/test/integration/consul-container

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: consul-fips-1.19/test-integ

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v3@v3.0.4
        golang.org/x/oauth2@v0.27.0
        github.com/golang-jwt/jwt/v4@v4.5.2
        golang.org/x/net@v0.38.0
        golang.org/x/crypto@v0.45.0
        github.com/sirupsen/logrus@v1.9.1
      modroot: consul-fips-1.19

  - working-directory: ${{package.name}}
    pipeline:
      - uses: go/remove-cgo-enabled-0
      - runs: |
          make linux
      - runs: |
          mkdir -p ${{targets.destdir}}/usr/bin

          # The docker-entrypoint.sh expects the binary to be in /bin so put it there
          mv ./pkg/bin/linux_*/consul ${{targets.destdir}}/usr/bin/consul
      - uses: strip

subpackages:
  - name: ${{package.name}}-oci-entrypoint
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{package.name}}/.release/docker/docker-entrypoint.sh "${{targets.subpkgdir}}/usr/bin/"
    dependencies:
      provides:
        - consul-fips-oci-entrypoint=${{package.full-version}}
      runtime:
        - ${{package.name}}
        - busybox
        - dumb-init
        - libcap-utils
        - merged-bin
        - su-exec
        - wolfi-baselayout
    test:
      pipeline:
        - name: "Verify entrypoint file by executing consul for version check"
          runs: CONSUL_DISABLE_PERM_MGMT=1 /usr/bin/docker-entrypoint.sh --version | grep ${{package.version}}

  - name: ${{package.name}}-oci-entrypoint-compat
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/local/bin"
          ln -s /usr/bin/docker-entrypoint.sh "${{targets.subpkgdir}}/usr/local/bin/"
    dependencies:
      provides:
        - consul-fips-oci-entrypoint-compat=${{package.full-version}}
      runtime:
        - ${{package.name}}-oci-entrypoint
        - merged-bin
        - wolfi-baselayout
    test:
      pipeline:
        - name: "Verify symlink exists"
          runs: test -L /usr/local/bin/docker-entrypoint.sh

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.19. # Keeping it this because we have other consul tagged versions separately like 1.1
