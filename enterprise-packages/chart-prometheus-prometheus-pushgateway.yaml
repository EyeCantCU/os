package:
  name: chart-prometheus-prometheus-pushgateway
  version: "3.6.0"
  epoch: 0
  description: A Helm chart for prometheus pushgateway
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/helm-charts
      tag: prometheus-pushgateway-${{package.version}}
      expected-commit: a5e8b56cc73ec4f8f16b23c1719e041425e25cfe

  - uses: charts/package
    with:
      chart-path: charts/prometheus-pushgateway
      images: |
        pushgateway:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [pushgateway]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: prometheus-community/helm-charts
    strip-prefix: prometheus-pushgateway-
    use-tag: true
    tag-filter-prefix: prometheus-pushgateway-
