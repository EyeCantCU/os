package:
  name: prometheus-process-exporter
  version: "0.8.7"
  epoch: 8 # go/enterprise-rsc/prometheus-process-exporter
  description: A Prometheus exporter that collects process metrics by mining the /proc filesystem
  copyright:
    - license: MIT
  resources:
    memory: 8Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ncabatoff/process-exporter.git
      tag: v${{package.version}}
      expected-commit: e52ab0a1c03d6baf8ed60154c254ecc0008549f3

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: ./cmd/process-exporter/main.go
      output: process-exporter

update:
  enabled: true
  github:
    identifier: ncabatoff/process-exporter
    strip-prefix: v
    tag-filter: v

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - runs: |
        process-exporter --help
    - uses: test/kwok/cluster
    - name: "Functional test"
      uses: test/daemon-check-output
      with:
        start: /usr/bin/process-exporter
        timeout: 30
        expected_output: |
          Listening on
          TLS is disabled
        post: curl -fsSL localhost:9256/metrics | grep -i "promhttp_metric_handler_requests_total"
