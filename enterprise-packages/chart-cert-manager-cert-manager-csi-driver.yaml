package:
  name: chart-cert-manager-cert-manager-csi-driver
  version: "0.12.0"
  epoch: 0
  description: cert-manager csi-driver enables issuing secretless X.509 certificates for pods using cert-manager
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/csi-driver
      tag: v${{package.version}}
      expected-commit: 17a2bfb3d0e8b8ed0e660e69498f1b1244a21563

  # Replicate upstream's release build: set image defaults and chart version.
  # The source chart uses v0.0.0 placeholders; upstream's Makefile sets these
  # via yq before packaging.
  - runs: |
      chart_dir="deploy/charts/csi-driver"

      # Set image repository and tag (mirrors helm_values_mutation_function in Makefile)
      yq -i '
        .image.repository = "quay.io/jetstack/cert-manager-csi-driver" |
        .image.tag = "v${{package.version}}"
      ' "${chart_dir}/values.yaml"

      # Set prerelease annotation (mirrors upstream helm.mk behavior)
      yq -i '.annotations."artifacthub.io/prerelease" = "false"' "${chart_dir}/Chart.yaml"

      # Add explicit registry and digest fields (commented out upstream but supported by templates)
      for path in ".image" ".nodeDriverRegistrarImage" ".livenessProbeImage"; do
        yq -i "${path}.registry = \"\" | ${path}.digest = \"\"" "${chart_dir}/values.yaml"
      done

  - uses: charts/package
    with:
      chart-path: deploy/charts/csi-driver
      chart-version: v${{package.version}}
      images: |
        cert-manager-csi-driver:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${tag}
              digest: ${digest}
        csi-node-driver-registrar:
          values:
            nodeDriverRegistrarImage:
              registry: ${registry}
              repository: ${repo}
              tag: ${tag}
              digest: ${digest}
        livenessprobe:
          values:
            livenessProbeImage:
              registry: ${registry}
              repository: ${repo}
              tag: ${tag}
              digest: ${digest}
      test: |
        cases:
          - name: default
            images: [cert-manager-csi-driver, csi-node-driver-registrar, livenessprobe]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: cert-manager/csi-driver
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
