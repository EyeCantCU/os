package:
  name: chart-sigstore-scaffold
  version: "0.6.104"
  epoch: 0
  description: Scaffolding the components of the sigstore architecture
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-sigstore-ctlog
      - chart-sigstore-fulcio
      - chart-sigstore-rekor
      - chart-sigstore-trillian
      - chart-sigstore-tsa
      - chart-sigstore-tuf

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sigstore/helm-charts
      tag: scaffold-${{package.version}}
      expected-commit: 1a0265c26de156df5c2514c5c90f1d8590d20643

  - uses: charts/package
    with:
      chart-path: charts/scaffold
      images: |
        copy-secret-job:
          values:
            copySecretJob:
              registry: ${registry}
              repository: ${repo}
              version: ${digest}
      test: |
        cases:
          - name: default
            images: []

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: sigstore/helm-charts
    strip-prefix: scaffold-
    use-tag: true
    tag-filter-prefix: scaffold-
