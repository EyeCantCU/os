package:
  name: chart-sigstore-scaffold
  version: "0.6.103"
  epoch: 0
  description: Scaffolding the components of the sigstore architecture
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-sigstore-ctlog
      - chart-sigstore-fulcio
      - chart-sigstore-rekor
      - chart-sigstore-trillian
      - chart-sigstore-tsa
      - chart-sigstore-tuf

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sigstore/helm-charts
      tag: scaffold-${{package.version}}
      expected-commit: 84a0150115e64c06798397a24538602d47fd0806

  - uses: charts/package
    with:
      chart-path: charts/scaffold
      images: |
        copy-secret-job:
          values:
            copySecretJob:
              registry: ${registry}
              repository: ${repo}
              version: ${digest}
      test: |
        cases:
          - name: default
            images: []

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: sigstore/helm-charts
    strip-prefix: scaffold-
    use-tag: true
    tag-filter-prefix: scaffold-
