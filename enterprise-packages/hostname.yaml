package:
  name: hostname
  description: utility to set/show the host name or domain name
  version: 3.25
  epoch: 0
  copyright:
    - license: GPL-2.0-only
  options:
    no-provides: true
  dependencies:
    replaces:
      - net-tools

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://salsa.debian.org/meskes/hostname.git
      tag: debian/${{package.version}}
      expected-commit: ff42baa88db079a5457444d0f79844ec281e17f1

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: debian/

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: hostname dnsdomainname domainname ypdomainname nisdomainname
    # TODO: Fix help check to allow for non-0-exit code
    # - uses: test/tw/help-check
    #   with:
    #     bins: hostname dnsdomainname domainname ypdomainname nisdomainname
    - name: Check --help
      runs: |
        set -o pipefail
        # All of these fail with exit code 255 on --help even though they actually work
        # This will fail if grep fails, though!
        ( hostname --help || true ) | grep -F -e "Usage: hostname"
        ( dnsdomainname --help || true ) | grep -F -e "Usage: hostname"
        ( domainname --help || true ) | grep -F -e "Usage: hostname"
        ( ypdomainname --help || true ) | grep -F -e "Usage: hostname"
        ( nisdomainname --help || true ) | grep -F -e "Usage: hostname"
    - runs: |
        # IPv4 loopback address
        hostname -I | grep -E -e "[[:digit:]]*\.[[:digit:]]*\.[[:digit:]]*\.[[:digit:]]*"
        # Other functionality requires changing hostname, which breaks docker runner
