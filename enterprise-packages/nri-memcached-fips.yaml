package:
  name: nri-memcached-fips
  version: "2.7.5"
  epoch: 0 # CVE-2025-61731
  description: New Relic Infrastructure memcached Integration (FIPS)
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-memcached
      expected-commit: c799cdeecb6355fb90a376a64f1351df7319a8ee
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-memcached
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-memcached ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-memcached
          install -Dm644 legacy/memcached-definition.yml ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/memcached-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-memcached
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-memcached
    - uses: test/tw/ver-check
      with:
        bins: nri-memcached
        version-flag: "-show_version"
    - name: Test binary execution
      uses: test/daemon-check-output
      with:
        start: |
          nri-memcached
        expected_output: |
          com.newrelic.memcached
          protocol_version
          integration_version
        error_strings: |
          FAIL
          Traceback.*most.recent.call
