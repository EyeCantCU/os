package:
  name: kubernetes-csi-external-provisioner-fips
  version: "6.1.1"
  epoch: 1 # GHSA-9h8m-3fm2-qjrq
  description: A dynamic provisioner for Kubernetes CSI plugins.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-csi/external-provisioner
      expected-commit: 57f2900f91c1b41fa953d22c59e73656d49d36ca
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      packages: ./cmd/csi-provisioner
      output: csi-provisioner
      ldflags: -X main.version=$(git describe --long --tags --match='v*' --dirty)
      go-package: go-fips

  - uses: strip

test:
  environment:
    contents:
      packages:
        - socat
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: csi-provisioner
    - uses: test/kwok/cluster
    - name: Test csi-provisioner startup with mock CSI socket
      runs: |
        set -euo pipefail

        # Setup mock CSI socket
        mkdir -p /run/csi
        socat UNIX-LISTEN:/run/csi/socket,fork EXEC:'sleep 3600' &
        SOCAT_PID=$!

        # Wait for socket to be ready
        timeout 5 sh -c 'while [ ! -S /run/csi/socket ]; do :; done'

        # Start csi-provisioner in background, capturing output
        /usr/bin/csi-provisioner --csi-address=/run/csi/socket --kubeconfig ~/.kube/config > /tmp/provisioner.log 2>&1 &
        PROV_PID=$!

        # Wait for startup and initial connection attempt
        sleep 5

        # Check if "Version" appears in output (per skill guidance for external-provisioner)
        # This proves the binary started and attempted its job
        if grep -F "Version" /tmp/provisioner.log; then
          echo "SUCCESS: csi-provisioner started and reported version info"
        else
          echo "FAIL: Expected 'Version' in output"
          echo "Actual output:"
          cat /tmp/provisioner.log
          exit 1
        fi

        # Cleanup (process may already be dead due to exit-on-disconnect behavior)
        kill $PROV_PID 2>/dev/null || true
        kill $SOCAT_PID 2>/dev/null || true

update:
  enabled: true
  github:
    identifier: kubernetes-csi/external-provisioner
    strip-prefix: v
