package:
  name: py3-torch-tensorrt-cuda-13.1
  version: "2.10.0"
  epoch: 0
  description: PyTorch/TorchScript/FX compiler for NVIDIA GPUs usin TensorRT
  copyright:
    - license: BSD-3-Clause
  target-architecture:
    - x86_64
  resources:
    cpu: 16
    memory: 16Gi
  options:
    no-depends: true

vars:
  cudnn-version: 9
  pypi-package: torch-tensorrt
  import: torch_tensorrt

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.\d+$'
    replace: '$1'
    to: cuda-major-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.(\d+)$'
    replace: 'cu$1$2'
    to: cuda-pyvariant

data:
  - name: py-versions
    items:
      3.12: "312"

environment:
  contents:
    packages:
      - cmake
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - libtorch-cuda-${{vars.cuda-version}}-dev
      - nvcc-${{vars.cuda-version}}-gcc-default
      - py3-supported-build-base-dev
      - py3-supported-torch-cuda-${{vars.cuda-version}}
      - tensorrt-cuda-${{vars.cuda-major-version}}-dev
  environment:
    BUILD_VERSION: ${{package.version}}+${{vars.cuda-pyvariant}}
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
    CMAKE_CUDA_ARCHITECTURES: all
    FORCE_CUDA: 1
    USE_CUDA: 1
    USE_CUDNN: 1
    VERBOSE: 1
    TORCH_CUDA_ARCH_LIST: "7.5 8.0 8.6 9.0 10.0 12.0+PTX"
    TORCH_NVCC_FLAGS: -Xfatbin -compress-all

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/TensorRT
      tag: v${{package.version}}
      expected-commit: 1a1c2e20dce4392c1c2a63d3587e86c9ca637c03

