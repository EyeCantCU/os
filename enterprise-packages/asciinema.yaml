package:
  name: asciinema
  version: "3.1.0"
  epoch: 0
  description: Terminal session recorder
  copyright:
    - license: GPL-3.0-or-later

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/asciinema/asciinema
      tag: v${{package.version}}
      expected-commit: dabc40cf8e97c4041af4bb360c6f37d393e96ebf

  - uses: cargo/build
    with:
      output: asciinema

test:
  environment:
    contents:
      packages:
        - jq
        - python3
        - py3-pexpect
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: asciinema
    - uses: test/tw/ver-check
      with:
        bins: asciinema
    - name: Test record command
      runs: |
        set -euo pipefail
        # Test record with immediate command execution
        asciinema record -c "echo 'Test recording'" /tmp/recorded.cast

        # Verify the recording was created
        test -f /tmp/recorded.cast

        # Verify it's valid JSONL format with expected structure (v3 format)
        head -n1 /tmp/recorded.cast | jq -e '.version == 3'
        head -n1 /tmp/recorded.cast | jq -e '.term.cols'
        head -n1 /tmp/recorded.cast | jq -e '.term.rows'

        # Verify recording contains output events
        grep -F "Test recording" /tmp/recorded.cast
    - name: Test play command
      runs: |
        set -euo pipefail
        python3 test-play.py /tmp/recorded.cast
    - name: Test cat command
      runs: |
        set -euo pipefail
        # Create two minimal asciicast v3 recordings
        tee /tmp/test1.cast << 'EOF'
        {"version":3,"term":{"cols":80,"rows":24},"timestamp":1234567890}
        [0.1, "o", "First recording\r\n"]
        EOF

        tee /tmp/test2.cast << 'EOF'
        {"version":3,"term":{"cols":80,"rows":24},"timestamp":1234567891}
        [0.1, "o", "Second recording\r\n"]
        EOF

        # Concatenate recordings
        asciinema cat /tmp/test1.cast /tmp/test2.cast > /tmp/combined.cast

        # Verify combined file exists and is valid v3 format
        test -f /tmp/combined.cast
        head -n1 /tmp/combined.cast | jq -e '.version == 3'
        grep -F "First recording" /tmp/combined.cast
        grep -F "Second recording" /tmp/combined.cast
    - name: Test convert command
      runs: |
        set -euo pipefail
        asciinema convert /tmp/recorded.cast /tmp/converted.txt

        # Verify converted file exists and contains text
        test -f /tmp/converted.txt
        test -s /tmp/converted.txt

update:
  enabled: true
  github:
    identifier: asciinema/asciinema
    strip-prefix: v
