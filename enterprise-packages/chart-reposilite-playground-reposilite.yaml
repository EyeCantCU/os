package:
  name: chart-reposilite-playground-reposilite
  version: "1.3.25"
  epoch: 0
  description: Lightweight and easy-to-use repository management software dedicated for the Maven based artifacts in the JVM ecosystem
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/reposilite-playground/reposilite-helm
      tag: reposilite-${{package.version}}
      expected-commit: 87b5e21dc3f7f1da4061755691a192dfbe57fb30

  - uses: charts/package
    with:
      chart-path: charts/reposilite
      images: |
        reposilite:
          values:
            image:
              name: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        values:
          imagePullSecrets:
            - name: my-pull-secret
        cases:
          - name: default
            images: [reposilite]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: reposilite-playground/reposilite-helm
    strip-prefix: reposilite-
    use-tag: true
    tag-filter-prefix: reposilite-
