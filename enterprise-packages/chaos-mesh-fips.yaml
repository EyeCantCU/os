package:
  name: chaos-mesh-fips
  version: "2.8.1"
  epoch: 6
  description: A chaos engineering platform for kuberenetes.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "13"
    memory: 27Gi

vars:
  # https://github.com/chaos-mesh/chaos-mesh/blob/v2.8.1/images/build-env/Dockerfile#L14
  nodejs-version: "22"

environment:
  contents:
    packages:
      - build-base
      - go-fips-1.25
      - nodejs-${{vars.nodejs-version}}
      - pnpm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/chaos-mesh/chaos-mesh
      tag: v${{package.version}}
      expected-commit: 9d390d04bca86ad2433a72d3a635ee884c50ebf3

  - uses: go/bump
    with:
      deps: |-
        filippo.io/edwards25519@v1.1.1
        github.com/docker/docker@v28.0.0
        github.com/containerd/containerd@v1.7.29
        github.com/opencontainers/selinux@v1.13.0
        golang.org/x/crypto@v0.45.0

  - name: Build dashboard UI
    working-directory: ui
    runs: |
      pnpm install --frozen-lockfile
      pnpm build

  - name: Embed UI assets
    runs: |
      go run tools/assets_generate/main.go ui_server
      mv assets_vfsdata.go pkg/dashboard/uiserver/embedded_assets_handler.go

  - uses: go/build
    with:
      packages: cmd/chaos-controller-manager/main.go
      output: chaos-controller-manager
      go-package: go-fips

  - uses: go/build
    with:
      packages: cmd/chaos-dashboard/main.go
      output: chaos-dashboard
      go-package: go-fips
      tags: ui_server

subpackages:
  - name: ${{package.name}}-dashboard
    description: Chaos Mesh Dashboard web UI and API server (FIPS)
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/bin"
          mv "${{targets.destdir}}/usr/bin/chaos-dashboard" "${{targets.subpkgdir}}/usr/bin/"
    test:
      environment:
        contents:
          packages:
            - curl
            - jq
            - kubectl
            - wait-for-it
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/ldd-check
        - uses: test/tw/help-check
          with:
            bins: /usr/bin/chaos-dashboard
        - uses: test/kwok/cluster
          with:
            serviceaccount: true
        - name: Install CRDs
          runs: kubectl apply --server-side -f https://raw.githubusercontent.com/chaos-mesh/chaos-mesh/v${{package.version}}/manifests/crd.yaml
        - name: "Test dashboard run"
          uses: test/daemon-check-output
          with:
            start: /usr/bin/chaos-dashboard
            timeout: 30
            expected_output: |
              Chaos Dashboard Version:
              Listening and serving HTTP on 0.0.0.0:2333
              Starting collector
              Starting database TTL controller
            error_strings: |
              no matches for kind "Workflow" in version "chaos-mesh.org/v1alpha1"
            post: |
              set -euo pipefail
              wait-for-it localhost:2333 -t 10
              wait-for-it localhost:2334 -t 10
              curl -sf http://localhost:2333/api/common/config | jq -e '.cluster_mode'
              curl -sf http://localhost:2334/metrics | grep -F "go_goroutines"

  - name: ${{package.name}}-dashboard-compat
    description: Compatibility package for chaos-mesh-fips-dashboard
    dependencies:
      runtime:
        - ${{package.name}}-dashboard
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/local/bin"
          ln -sf ../../bin/chaos-dashboard "${{targets.subpkgdir}}/usr/local/bin/chaos-dashboard"
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}-dashboard
      pipeline:
        - uses: test/tw/symlink-check
        - uses: test/tw/help-check
          with:
            bins: /usr/local/bin/chaos-dashboard

  - name: chaos-mesh-compat-fips
    description: Compatibility package
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/local/bin"
          ln -sf ../../bin/chaos-controller-manager "${{targets.subpkgdir}}/usr/local/bin/chaos-controller-manager"
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
        - uses: test/tw/help-check
          with:
            bins: /usr/local/bin/chaos-controller-manager

test:
  environment:
    contents:
      packages:
        - kustomize
        - kubectl
        - git
        - mkcert
        - nss
        - curl
        - wait-for-it
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: /usr/bin/chaos-controller-manager
    - name: Fetch the testdata from the source repo
      runs: git clone --branch v${{package.version}} --depth=1 https://github.com/chaos-mesh/chaos-mesh
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - name: Install CRDs
      runs: kubectl apply --server-side -f chaos-mesh/manifests/crd.yaml
    - name: "Test manager run"
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /etc/webhook/certs
          mkcert -install
          mkcert -key-file /etc/webhook/certs/tls.key -cert-file /etc/webhook/certs/tls.crt localhost
        start: /usr/bin/chaos-controller-manager --kubeconfig $HOME/.kwok/clusters/kwok/kubeconfig.yaml
        timeout: 30
        expected_output: |
          Controller manager Version:
          Chaos controller manager is running in cluster scoped mode.
          Starting Controller
          Starting workers
        error_strings: |
          no matches for kind "Workflow" in version "chaos-mesh.org/v1alpha1"
        post: |
          set -euo pipefail
          wait-for-it localhost:10080 -t 10
          curl -fsSL http://localhost:10080/metrics | grep -F "go_goroutines"

update:
  enabled: true
  git:
    strip-prefix: v
