#nolint:git-checkout-must-use-github-updates
package:
  name: packagekit
  version: 1.3.1
  epoch: 0
  description: A D-BUS abstraction layer that allows the user to manage packages in a secure way using a cross-distro, cross-architecture API.
  copyright:
    - license: GPL-2.0-only

vars:
  python-version: 3.13

environment:
  contents:
    packages:
      - bash-completion
      - build-base
      - fontconfig-dev
      - glib-dev
      - glib-gir
      - gobject-introspection-dev
      - gst-plugins-base-dev
      - gstreamer-dev
      - gtk-3-dev
      - gtk-doc
      - polkit-dev
      - systemd-dev
      - vala

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/PackageKit/PackageKit.git
      tag: v${{package.version}}
      expected-commit: 0f33069752fe06f6daf3d977cd09665b059494d8

  - uses: meson/configure
    with:
      opts: |
        -Ddbus_services=/usr/share/dbus-1/system-services \
        -Ddbus_sys=/usr/share/dbus-1/system.d \
        -Dgtk_doc=true \
        -Dpythonpackagedir=/usr/lib/python${{vars.python-version}}/ \
        -Dsystemdsystemunitdir=/usr/lib/systemd/system \
        -Dsystemduserunitdir=/usr/lib/systemd/user

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development libraries
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/pkgconf

  - name: ${{package.name}}-doc
    description: ${{package.name}} documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  environment:
    accounts:
      groups:
        - groupname: messagebus
          gid: 65532
      users:
        - username: messagebus
          gid: 65532
          uid: 65532
      run-as: 0
    contents:
      packages:
        - shadow
  pipeline:
    - uses: test/tw/ldd-check
    - name: Smoke tests
      runs: |
        pkcon --help | grep -F -e "PackageKit Console Program"
        pkmon --help | grep -F -e "PackageKit Monitor"
        pkmon --version | grep -F -e "${{package.version}}"
        /usr/libexec/pk-gstreamer-install --help | grep -F -e "Install missing codecs"
    - runs: |
        # Required by PackageKit so it can run actions as a privileged user
        chmod u+s /usr/libexec/dbus-daemon-launch-helper

        # Here we need to process the dbus-daemon --system output and create the users that it complains about
        # So that we can run `dbus-daemon` as system and packagekit can connect to it
        {
          dbus-daemon --system 2>&1 || true
        } | sed \
          -e 's/dbus.*: Unknown username//g' \
          -e 's/in message bus configuration file//g' \
          -e 's/\"//g' \
          -e 's/dbus-daemon.*//' | \
          uniq | \
          xargs -n1 useradd

        mkdir -p /run/dbus

        DBUS_PID=$(dbus-daemon --nopidfile --system --print-pid)

        /usr/libexec/packagekitd --verbose --backend dummy &
        PACKAGEKITD_PID=$!
        trap 'kill -9 "${DBUS_PID}" && kill -9 "${PACKAGEKIT_PID}"' EXIT

        # Sample data from `dummy` backend
        pkcon --version | grep -F -e "${{package.version}}"
        pkcon repo-list | grep -F -e "development"
        pkcon search vips | grep -F -e "vips-doc"
