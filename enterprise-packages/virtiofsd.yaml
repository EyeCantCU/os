package:
  name: virtiofsd
  version: 1.13.3
  epoch: 2 # GHSA-r6v5-fh4h-64xc
  description: A virtio-fs vhost-user device daemon
  copyright:
    - license: Apache-2.0 AND BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cargo-auditable
      - libcap-ng-dev
      - libseccomp-dev
      - rust

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/virtio-fs/virtiofsd
      tag: v${{package.version}}
      expected-commit: bbf82173682a3e48083771a0a23331e5c23b4924

  - uses: rust/cargobump

  - uses: cargo/build
    with:
      output: virtiofsd

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: virtiofsd
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: virtiofsd
        expect-contains: "Usage: virtiofsd"

update:
  enabled: true
  release-monitor:
    identifier: 338726
