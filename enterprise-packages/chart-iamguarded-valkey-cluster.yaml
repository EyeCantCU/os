package:
  name: chart-iamguarded-valkey-cluster
  version: "3.0.24"
  epoch: 0
  description: valkey-cluster iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: valkey-cluster/${{package.version}}
      expected-commit: aece2ce6e4ccefea4ed9542417a5bc6d3ede1494

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/valkey-cluster

  - uses: charts/package
    with:
      chart-path: iamguarded/valkey-cluster

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: valkey-cluster/
    use-tag: true
    tag-filter-prefix: valkey-cluster/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /valkey-cluster
