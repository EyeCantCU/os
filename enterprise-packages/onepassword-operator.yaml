package:
  name: onepassword-operator
  version: "1.11.0"
  epoch: 1 # GHSA-9h8m-3fm2-qjrq
  description: The 1Password Connect Kubernetes Operator provides the ability to integrate Kubernetes Secrets with 1Password.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/1Password/onepassword-operator
      tag: v${{package.version}}
      expected-commit: 26bd34cbe82896910f0947cd67e7aad736edc2c7

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      packages: ./cmd
      output: manager
      ldflags: -X github.com/1Password/onepassword-operator/version.Version=${{package.version}}

  - runs: |
      mkdir -p ${{targets.contextdir}}/config/connect
      cp -r config/connect/* ${{targets.contextdir}}/config/connect/

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility package for ${{package.name}}
    pipeline:
      - runs: |
          # Create symlink at /manager for compatibility
          mkdir -p ${{targets.contextdir}}/
          ln -s ./usr/bin/manager ${{targets.contextdir}}/manager
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
        - runs: |
            /manager --help

update:
  enabled: true
  github:
    identifier: 1Password/onepassword-operator
    strip-prefix: v

test:
  pipeline:
    - runs: |
        # we cannot automate the tests for operator right now since operator needs to be connected to 1password
        # so we have to have at least 1password account and setup the operator with that account
        manager -h
