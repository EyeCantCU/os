package:
  name: chart-dapr-dapr
  version: "1.16.8"
  epoch: 0
  description: A Helm chart for Dapr on Kubernetes
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dapr/dapr
      tag: v${{package.version}}
      expected-commit: 9f4e6018a5eed51ee33a54e5852bb2174c2fec61

  # The source chart uses '0.0.0' placeholders - update all versions to match the release.
  # Also remove the file:// repository refs from dependencies since the subcharts are
  # already present in charts/ - this prevents the vendor step from trying to find them
  # at the root filesystem path.
  - runs: |
      version="${{package.version}}"

      # Update main chart
      yq -i ".version = \"$version\"" charts/dapr/Chart.yaml
      yq -i ".appVersion = \"$version\"" charts/dapr/Chart.yaml

      # Update subchart dependency versions and remove repository field
      # (subcharts are already in charts/ subdirectory)
      yq -i "(.dependencies[]).version = \"$version\"" charts/dapr/Chart.yaml
      yq -i "del(.dependencies[].repository)" charts/dapr/Chart.yaml

      # Update each subchart's version (but not appVersion - upstream uses "1.0" for subcharts)
      for subchart in charts/dapr/charts/*/Chart.yaml; do
        yq -i ".version = \"$version\"" "$subchart"
      done

      # Update default tag in values.yaml (source uses 'edge', release uses version)
      yq -i ".global.tag = \"$version\"" charts/dapr/values.yaml

  - uses: charts/package
    with:
      chart-path: charts/dapr
      # Images can be configured two ways:
      # 1. Per-component via <subchart>.image.name (full image ref with /)
      # 2. Globally via global.registry + global.tag (for images without / in name)
      # We use the per-component approach since it allows full control per image.
      # Users can also set global.registry (e.g., cgr.dev/chainguard) and global.tag
      # to override all images that don't have a / in their name.
      images: |
        operator:
          values:
            dapr_operator:
              image:
                name: ${registry_repo}:${pseudo_tag}
        placement:
          values:
            dapr_placement:
              image:
                name: ${registry_repo}:${pseudo_tag}
        sentry:
          values:
            dapr_sentry:
              image:
                name: ${registry_repo}:${pseudo_tag}
        scheduler:
          values:
            dapr_scheduler:
              image:
                name: ${registry_repo}:${pseudo_tag}
        injector:
          values:
            dapr_sidecar_injector:
              injectorImage:
                name: ${registry_repo}:${pseudo_tag}
        daprd:
          values:
            dapr_sidecar_injector:
              image:
                name: ${registry_repo}:${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [operator, placement, sentry, scheduler, injector, daprd]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: dapr/dapr
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
    tag-filter-contains: .
