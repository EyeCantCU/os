#nolint:git-checkout-must-use-github-updates,valid-pipeline-git-checkout-tag
package:
  name: tritonserver-backend-pytorch-cuda-13.0
  version: 25.11
  epoch: 3
  description: NVIDIA Triton Inference Server Python Backend
  copyright:
    - license: BSD-3-Clause
  target-architecture:
    - x86_64
  options:
    no-depends: true
  dependencies:
    runtime:
      - libjpeg-turbo
      - libpng
      - libtorch-tensorrt-cuda-${{vars.cuda-version}}
      - libtorchvision-cuda-${{vars.cuda-version}}
      - py${{vars.python-version}}-torch-cuda-${{vars.cuda-version}}-bin
      - tritonserver-cuda-${{vars.cuda-version}}

vars:
  python-version: 3.12

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{vars.cuda-version}}
    match: (\d+)\.\d+
    replace: $1
    to: cuda-major-version

environment:
  contents:
    packages:
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libtorch-cuda-${{vars.cuda-version}}-dev
      - libtorch-tensorrt-cuda-${{vars.cuda-version}}-dev
      - libtorchvision-cuda-${{vars.cuda-version}}-dev
      - nvcc-${{vars.cuda-version}}-gcc-default
      - opencv-dev
      - py${{vars.python-version}}-build-base-dev
      - rapidjson-dev
      - triton-inference-server-backend=${{package.version}}
      - triton-inference-server-common=${{package.version}}
      - triton-inference-server-core=${{package.version}}
  environment:
    CUDA_ARCHITECTURES: all
    LIBRARY_PATH: /usr/lib/python${{vars.python-version}}/site-packages/torch/lib

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/triton-inference-server/pytorch_backend
      branch: r${{package.version}}
      expected-commit: cdb637bea6f4471647ddb2833d55095bebf310e1

  - uses: patch
    with:
      patches: |
        0001-Disable-vendoring-of-files-from-other-APKs.patch
        fuser-depracate.patch

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_CUDA_COMPILER=/usr/local/cuda-${{vars.cuda-version}}/bin/nvcc \
        -DTRITON_PYTORCH_ENABLE_TORCHVISION=on \
        -DTRITON_PYTORCH_ENABLE_TORCHTRT=on \
        -DTRITON_PYTORCH_INCLUDE_PATHS="/usr/include/torch;/usr/include/torch/csrc/api/include" \
        -DTRITON_PYTORCH_LIB_PATHS="/usr/lib" \
        -DTRITON_REPO_ORGANIZATION:STRING=file:///usr/src/triton-inference-server \
        -DTRITON_COMMON_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/common.git && git branch --show-current) \
        -DTRITON_CORE_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/core.git && git branch --show-current) \
        -DTRITON_BACKEND_REPO_TAG:STRING=$(cd /usr/src/triton-inference-server/backend.git && git branch --show-current) \
        -DCMAKE_INSTALL_PREFIX=/opt/tritonserver

  - uses: cmake/build

  - uses: cmake/install

  - name: "Remove extraneous files"
    runs: |
      cd ${{targets.contextdir}}/opt/tritonserver
      for file in *; do
        case "$file" in
          backends|lib)
            continue
            ;;
          bin|include)
            rm -rf "$file"
            ;;
          *)
            echo "ERROR: Unexpected file $(pwd)/$file" 1>&2
            exit 1
            ;;
        esac
      done
      cd ${{targets.contextdir}}/opt/tritonserver/lib
      for file in *; do
        case "$file" in
          cmake)
            continue
            ;;
          *.a|pkgconfig|stubs)
            rm -rf "$file"
            ;;
          *)
            echo "ERROR: Unexpected file $(pwd)/$file" 1>&2
            exit 1
            ;;
        esac
      done
      cd ${{targets.contextdir}}/opt/tritonserver/lib/cmake
      for file in *; do
        case "$file" in
          TritonPyTorchBackend)
            continue
            ;;
          GTest|TritonBackend|TritonCommon|TritonCore)
            rm -rf "$file"
            ;;
          *)
            echo "ERROR: Unexpected file $(pwd)/$file" 1>&2
            exit 1
            ;;
        esac
      done

update:
  enabled: false
  exclude-reason: "NVIDIA uses release branches instead of tags or GitHub releases"

test:
  pipeline:
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/opt/tritonserver/lib"
    - name: Triton PyTorch backend minimal startup smoke test (intentional failure to check backend init)
      runs: |
        # Setup dummy model directory
        mkdir -p /tmp/models/resnet50/1
        echo '{}' > /tmp/models/resnet50/1/model.pt
        cat > /tmp/models/resnet50/config.pbtxt <<EOF
        name: "resnet50"
        platform: "pytorch_libtorch"
        max_batch_size: 0
        input [
          {
            name: "input"
            data_type: TYPE_FP32
            dims: [3, 224, 224]
          }
        ]
        output [
          {
            name: "output"
            data_type: TYPE_FP32
            dims: [1000]
          }
        ]
        EOF

        # Start Triton in background and capture logs
        /opt/tritonserver/bin/tritonserver --model-repository=/tmp/models > /tmp/triton.log 2>&1 &
        pid=$!

        # Give it a moment to start
        sleep 5

        # Kill it to avoid test hang
        kill $pid || true

        echo "=== Triton logs ==="
        cat /tmp/triton.log

        # Grep for known successful backend init logs
        if grep -q "TRITONBACKEND_Initialize: pytorch" /tmp/triton.log && \
           grep -q "cuDNN is enabled for model instance 'resnet50'" /tmp/triton.log; then
          echo "Backend initialized"
          exit 0
        fi

        echo "Backend did not initialize as expected"
        exit 1
