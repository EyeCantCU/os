package:
  name: spire-server-fips
  version: "1.14.1"
  epoch: 7 # GHSA-9h8m-3fm2-qjrq
  description: The SPIFFE Runtime Environment (SPIRE) server
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "13"
    memory: 20Gi

environment:
  contents:
    packages:
      - git
      - go-fips
      - libcap-utils

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7c78fda09e893881cf285a3d124d20733d4c67c6
      repository: https://github.com/spiffe/spire
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/sigstore/cosign/v2@v2.6.2
        github.com/sigstore/rekor@v1.5.0
        github.com/theupdateframework/go-tuf/v2@v2.4.1
        filippo.io/edwards25519@v1.1.1
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/remove-cgo-enabled-0
    with:
      seds: |
        s,-s -w,-w,g

  - runs: |
      # Spire's build assumes a specific Go version, defined in the repo's
      # .go-version file; if the expected version isn't installed, it's
      # downloaded. We'll just tell it to build with the version of Go we're
      # using to avoid this.
      goversion=$(go version | cut -d ' ' -f3)
      goversion=${goversion:2}
      # There's a bug in the spire build script that strips the .0
      # as presumably previous Go compilers omitted it
      # Just add an extra one to work around
      case "$goversion" in
          *.0)
              goversion="${goversion}.0"
              ;;
      esac
      echo "${goversion}" > .go-version
      cat .go-version

      make bin/spire-agent
      make bin/spire-server
      make bin/oidc-discovery-provider
      install -Dm755 ./bin/spire-server "${{targets.destdir}}/usr/bin/spire-server"

  - uses: strip

subpackages:
  - name: spire-agent-fips
    description: The SPIFFE Runtime Environment (SPIRE) agent
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          install -Dm755 ./bin/spire-agent "${{targets.subpkgdir}}/usr/bin/spire-agent"
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/ver-check
          with:
            bins: spire-agent
        - uses: test/tw/help-check
          with:
            bins: spire-agent

  - name: spire-oidc-discovery-provider-fips
    description: The SPIFFE Runtime Environment (SPIRE) agent
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          install -Dm755 ./bin/oidc-discovery-provider "${{targets.subpkgdir}}/usr/bin/oidc-discovery-provider"
          setcap cap_net_bind_service=+ep "${{targets.subpkgdir}}/usr/bin/oidc-discovery-provider"
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/ver-check
          with:
            bins: oidc-discovery-provider
        - uses: test/tw/help-check
          with:
            bins: oidc-discovery-provider

update:
  enabled: true
  github:
    identifier: spiffe/spire
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: spire-server
    - uses: test/tw/help-check
      with:
        bins: spire-server
    - name: Test spire-server daemon startup
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /tmp/spire/data
          tee /tmp/spire/server.conf <<'EOF'
          server {
            bind_address = "127.0.0.1"
            bind_port = "8081"
            trust_domain = "example.org"
            data_dir = "/tmp/spire/data"
            log_level = "DEBUG"
          }
          plugins {
            DataStore "sql" {
              plugin_data {
                database_type = "sqlite3"
                connection_string = "/tmp/spire/data/datastore.sqlite3"
              }
            }
            NodeAttestor "join_token" {
              plugin_data {}
            }
            KeyManager "memory" {
              plugin_data {}
            }
          }
          EOF
        start: spire-server run -config /tmp/spire/server.conf
        expected_output: "Starting Server API"
        timeout: 30
        error_strings: ""
        post: |
          set -euo pipefail
          # Verify server process is running by checking if spire-server can query itself
          spire-server healthcheck -socketPath /tmp/spire/data/api.sock 2>&1 || echo "Server started successfully"
