package:
  name: chart-deuxfleurs-garage
  version: "0.9.2"
  epoch: 0
  description: S3-compatible object store for small self-hosted geo-distributed deployments
  copyright:
    - license: AGPL-3.0-only

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/deuxfleurs-org/garage
      tag: v2.2.0
      expected-commit: 582b168b6a985108c68aca45effae1d73203d6c3

  - uses: charts/package
    with:
      chart-path: script/helm/garage
      images: |
        garage:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
        busybox:
          values:
            initImage:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [garage, busybox]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: false
  exclude-reason: >-
    Chart version (0.9.2) does not match git tag version (v2.2.0). Git tags follow the Garage application version, not the helm chart version. No tag pattern maps to chart version. To update manually: clone the repo at the new release tag, check script/helm/garage/Chart.yaml for the new chart version, and update both package.version and the git-checkout tag.
