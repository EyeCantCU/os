package:
  name: crossplane-aws-provider-fips
  version: "0.56.0"
  epoch: 6 # CVE-2025-61730
  description: Crossplane provider-aws is the infrastructure provider for Amazon Web Services (AWS).
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - crossplane-crank

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2bd3cf0e79867faef436f64c45342c3230bd8b03
      repository: https://github.com/crossplane-contrib/provider-aws
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: tools

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      output: crossplane-aws-provider
      packages: ./cmd/provider
      ldflags: |
        -X github.com/crossplane-contrib/provider-aws/pkg/version.Version=v${{package.version}}
      go-package: go-fips-md5

  - runs: |
      crank xpkg extract ghcr.io/crossplane-contrib/provider-aws:v${{package.version}}
      mkdir -p "${{targets.destdir}}"
      gunzip out.gz -c > "${{targets.destdir}}"/package.yaml

subpackages:
  - name: crossplane-aws-provider-compat-fips
    description: Compat package for ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/local/bin"
          ln -sf /usr/bin/crossplane-aws-provider "${{targets.contextdir}}/usr/local/bin/crossplane-aws-provider"
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - kubectl
        - git
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        crossplane-aws-provider --help
    - uses: test/kwok/cluster
    - runs: |
        git clone --branch v${{package.version}} --depth=1 https://github.com/crossplane-contrib/provider-aws.git
    - name: Apply CRDs
      working-directory: provider-aws/package/crds
      runs: |
        kubectl apply -f .
    - uses: test/kwok/cluster
    - name: Start crossplane-aws-provider in cluster
      uses: test/daemon-check-output
      with:
        start: |
          crossplane-aws-provider --debug > /dev/null 2>&1
        timeout: 120
        expected_output: |
          Starting Controller
          Starting EventSource
          Starting workers
          Starting metrics server
        error_strings: |
          FAIL
          FATAL
          Traceback.*most.recent.call
