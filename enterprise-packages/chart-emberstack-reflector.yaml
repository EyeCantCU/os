package:
  name: chart-emberstack-reflector
  version: "10.0.13"
  epoch: 0
  description: A Helm chart to deploy Reflector
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/emberstack/kubernetes-reflector
      tag: v${{package.version}}
      expected-commit: 36e062b60d9508dbed19d828c93a72ab6aa0bc3e

  # The source chart uses '0.1.0' placeholder versions - update appVersion to match the release.
  # (charts/package updates version automatically; appVersion must be patched explicitly.)
  - runs: |
      yq -i ".appVersion = \"${{package.version}}\"" src/helm/reflector/Chart.yaml

  - uses: charts/package
    with:
      chart-path: src/helm/reflector
      images: |
        reflector:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [reflector]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: emberstack/kubernetes-reflector
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
    tag-filter-contains: .
