package:
  name: fluent-operator-fips
  version: "3.6.0"
  epoch: 2 # CVE-2025-68121
  description: Operate Fluent Bit and Fluentd in the Kubernetes way - Previously known as FluentBit Operator
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "6"
    memory: 9Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fluent/fluent-operator
      expected-commit: f7b17bbff96a3c414c5ba239789edc5a3fbcba02
      tag: v${{package.version}}

  - uses: go/build
    with:
      output: manager
      packages: ./cmd/fluent-manager
      go-package: go-fips-md5

update:
  enabled: true
  github:
    identifier: fluent/fluent-operator
    strip-prefix: v
    use-tag: true

subpackages:
  - name: fluent-watcher-fips
    pipeline:
      - runs: |
          # https://github.com/fluent/fluent-operator/blob/v2.8.0/cmd/fluent-watcher/fluentbit/main.go#L24
          mkdir -p "${{targets.contextdir}}"/fluent-bit/config
      - uses: go/build
        with:
          packages: ./cmd/fluent-watcher/fluentbit
          output: fluent-watcher
          go-package: go-fips
    test:
      environment:
        contents:
          packages:
            - fluent-bit
            - fluent-bit-compat
            - fluent-watcher-fips-compat
      pipeline:
        - uses: test/go-fips-check
        - runs: |
            echo "Testing fluent-watcher"
            # Run fluent-watcher in the background and redirect its output to a temporary file
            tempfile=$(mktemp)
            fluent-watcher > "$tempfile" 2>&1 &

            # Capture the PID of fluent-watcher
            FLUENT_WATCHER_PID=$!

            sleep 5

            cat "$tempfile"

            # Use grep to filter the output
            cat "$tempfile" | grep -i "fluent-bit watcher started"

            # Wait for fluent-watcher to finish (optional)
            kill $FLUENT_WATCHER_PID

            # Clean up the temporary file
            rm "$tempfile"

  - name: fluent-watcher-fips-config
    dependencies:
      replaces:
        # A "replaces" must match the package origin's full name. Since we use
        # a version stream for fluent-bit, we must append fluent-bit-3.1
        # exactly.
        #
        # Our automation has no way of linking fluent-operator to
        # fluent-bit updates, so to ensure this doesn't silently fail when
        # fluent-bit rolls forward, we have a test stanza below that ensures
        # fluent-operator can always be installed alongside fluent-bit.
        #
        # When this test fails, that likely means fluent-bit rolled forward to
        # a new version stream anad must be updated in the "replaces" block
        # below
        # https://github.com/fluent/fluent-bit
        # version jumped from 3.x to 4.0
        # this version has to be updated manually
        - fluent-bit-4.2
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/fluent-bit/etc
          cp -af conf/* "${{targets.contextdir}}"/fluent-bit/etc
    test:
      environment:
        contents:
          packages:
            - fluent-bit
      pipeline:
        - runs: |
            cat /fluent-bit/etc/parsers.conf

  - name: fluent-watcher-fips-compat
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/fluent-bit/bin/
          ln -s /usr/bin/fluent-watcher "${{targets.contextdir}}"/fluent-bit/bin/fluent-watcher
          # Create the directory that fluent-watcher monitors for configuration changes
          mkdir -p "${{targets.contextdir}}"/fluent-bit/config/
    test:
      environment:
        contents:
          packages:
            - fluent-watcher
      pipeline:
        - runs: |
            stat $(readlink /fluent-bit/bin/fluent-watcher)

  - name: fluent-watcher-fluentd-fips
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/fluent-watcher/fluentd
          output: fluentd-watcher
          go-package: go-fips
    test:
      environment:
        contents:
          packages:
            - ruby3.2-fluentd-1.19
            - fluent-watcher-fluentd-fips-compat
      pipeline:
        - uses: test/go-fips-check
        - runs: |
            set -euo pipefail
            # Create the config dir and file the watcher expects
            mkdir -p /fluentd/etc /fluentd/plugins
            touch /fluentd/etc/fluent.conf
            tempfile=$(mktemp)
            fluentd-watcher > "$tempfile" 2>&1 &
            sleep 5
            cat "$tempfile"
            cat "$tempfile" | grep -F "Fluentd started"

  - name: fluent-watcher-fluentd-fips-compat
    pipeline:
      - runs: |
          # Symlink matching the upstream entrypoint path
          mkdir -p "${{targets.contextdir}}"/fluentd/bin/
          ln -s /usr/bin/fluentd-watcher "${{targets.contextdir}}"/fluentd/bin/fluentd-watcher
          # The watcher's defaultBinPath is /usr/local/bundle/bin/fluentd (Debian convention);
          # our fluentd binary is at /usr/bin/fluentd
          mkdir -p "${{targets.contextdir}}"/usr/local/bundle/bin/
          ln -s /usr/bin/fluentd "${{targets.contextdir}}"/usr/local/bundle/bin/fluentd
    test:
      environment:
        contents:
          packages:
            - fluent-watcher-fluentd-fips
            - ruby3.2-fluentd-1.19
      pipeline:
        - runs: |
            set -euo pipefail
            stat /fluentd/bin/fluentd-watcher
            stat /usr/local/bundle/bin/fluentd
            stat "$(readlink /fluentd/bin/fluentd-watcher)"
            stat "$(readlink /usr/local/bundle/bin/fluentd)"

test:
  environment:
    contents:
      packages:
        - curl
        - kwok
        - kwokctl
        - kubernetes # has a runtime dependency on kubectl
        - etcd
  pipeline:
    - uses: test/kwok/cluster
    - name: "Test operator"
      uses: test/daemon-check-output
      with:
        timeout: 30
        expected_output: |
          Starting workers
          Starting Controller
          Starting EventSource
        setup: |
          kubectl create ns fluent
          kubectl apply --server-side=true -f https://github.com/fluent/fluent-operator/releases/download/v${{package.version}}/setup.yaml
        start: manager -metrics-bind-address 0.0.0.0:8082
    - uses: test/go-fips-check
