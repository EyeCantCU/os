package:
  name: nats-top-fips
  version: "0.6.3"
  epoch: 13 # GHSA-qrvq-68c2-7grw
  description: A top-like tool for monitoring NATS servers.
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/nats-io/nats-top
      tag: v${{package.version}}
      expected-commit: 812d35cc991232d7606816a15b2ea0b12fb129e7

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        github.com/nats-io/nats-server/v2@v2.11.12

  - uses: go/build
    with:
      packages: .
      output: nats-top
      go-package: go-fips
      ldflags: |
        -X main.version=${{package.version}}
        -X main.commit=$(git rev-parse HEAD)
        -X main.date=$(date -d@${SOURCE_DATE_EPOCH} -u +"%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/local/bin
          ln -s /usr/bin/nats-top "${{targets.contextdir}}"/usr/local/bin/nats-top
    test:
      pipeline:
        - runs: |
            readlink -v /usr/local/bin/nats-top

update:
  enabled: true
  github:
    identifier: nats-io/nats-top
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - nats-server
        - nats
        - script
        - util-linux-misc
        - mkcert
        - openssl
        - python3
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: nats-top
    - name: Set up NATS server
      runs: |
        set -euo pipefail
        nats-server -p 4222 -m 8222 > nats_server.log 2>&1 &
        sleep 2
    - name: Set up NATS subscribers
      runs: |
        set -euo pipefail
        nats sub -s "localhost:4222" client2 > /dev/null 2>&1 &
        sleep 3
        nats sub -s "localhost:4222" client1 > /dev/null 2>&1 &
        sleep 1
    - name: Test and validate nats-top (basic)
      runs: |
        set -euo pipefail
        nats-top -s localhost -b -u -o nats-output-${{package.version}}.txt
        # Verify client1 is listed (fails test if missing)
        grep -F "client1" nats-output-${{package.version}}.txt
        # Verify client2 is listed (fails test if missing)
        grep -F "client2" nats-output-${{package.version}}.txt
        # Verify both connections were polled (fails test if wrong count)
        grep -F "Connections Polled: 2" nats-output-${{package.version}}.txt
    - name: test connection limit (-n)
      runs: |
        set -euo pipefail
        nats-top -n 1 -o nats-output-${{package.version}}.txt
        # Verify connection limit works - only 1 connection should be polled (fails test if not 1)
        grep -F "Connections Polled: 1" nats-output-${{package.version}}.txt
    - name: test sorting options (-sort)
      runs: |
        set -euo pipefail
        nats-top -sort uptime -u -o nats-output-${{package.version}}.txt > out.log 2>&1 &
        sleep 1
        last_line=$(tail -1 nats-output-${{package.version}}.txt)
        # Verify client2 is in the last line when sorted by uptime (fails test if missing)
        if echo "$last_line" | grep -F client2; then
          echo "SUCCESS: client2 found in last line"
        else
          echo "FAIL: Expected client2 in last line when sorted by uptime"
          echo "Got: $last_line"
          exit 1
        fi
    - name: test output with delimiter (-l)
      runs: |
        set -euo pipefail
        nats-top -o nats-output-${{package.version}}.csv -l ","
        if [ ! -s "nats-output-${{package.version}}.csv" ]; then
          echo "Error: CSV File is empty!"
          exit 1
        fi
        # Sanitize the input
        sed -i '/^$/d' nats-output-${{package.version}}.csv
        # Ensure at least one column for each rows
        python -c "import csv; reader = csv.reader(open('nats-output-${{package.version}}.csv', 'r')); [print(row[0]) for row in reader]"
    - name: test setting refresh delay (-d) and refresh count (-r)
      runs: |
        set -euo pipefail
        export TERM=xterm
        script --quiet --return --command "timeout 3 nats-top -d 1 -r 3"
    - name: Generate certs for nats-top in TLS mode
      runs: |
        set -euo pipefail
        mkdir -p certs && cd certs
        # Using mkcert to generate certs
        mkcert -install
        mkcert -cert-file server-cert.pem -key-file server-key.pem localhost 127.0.0.1
        mkcert -client -cert-file client-cert.pem -key-file client-key.pem localhost 127.0.0.1
        cp "$(mkcert -CAROOT)/rootCA.pem" ca-cert.pem
        # Verify server cert is valid (fails test if invalid)
        openssl verify -CAfile ca-cert.pem server-cert.pem
        # Verify client cert is valid (fails test if invalid)
        openssl verify -CAfile ca-cert.pem client-cert.pem
    - name: Set up NATS server in TLS mode
      runs: |
        set -euo pipefail
        pkill nats-server > /dev/null 2>&1 &
        sleep 2
        nats-server -p 4223 --https_port 8223 --tlsverify --tlscert ./certs/server-cert.pem --tlskey ./certs/server-key.pem --tlscacert ./certs/ca-cert.pem > nats_server.log 2>&1 &
        sleep 2
    - name: Set up one NATS subscriber in TLS mode
      runs: |
        set -euo pipefail
        nats sub -s "localhost:4223" --tlscert ./certs/client-cert.pem --tlskey ./certs/client-key.pem --tlsca ./certs/ca-cert.pem "test.subject" > /dev/null 2>&1 &
        sleep 1
    - name: Test NATS top in TLS mode
      runs: |-
        set -euo pipefail
        nats-top -s "localhost" -ms 8223 -u -cert ./certs/client-cert.pem -key ./certs/client-key.pem -cacert ./certs/ca-cert.pem -o nats-output-${{package.version}}.txt
        # Verify test.subject subscription is visible (fails test if missing)
        grep -F "test.subject" nats-output-${{package.version}}.txt
        # Verify connection was polled in TLS mode (fails test if wrong count)
        grep -F "Connections Polled: 1" nats-output-${{package.version}}.txt
