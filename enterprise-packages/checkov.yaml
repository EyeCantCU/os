package:
  name: checkov
  version: "3.2.495"
  epoch: 1
  description: "static code and composition analysis tool for IaC"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-${{vars.python-version}}

vars:
  python-version: '3.12'

environment:
  contents:
    packages:
      - busybox
      - python-${{vars.python-version}}
      - uv

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bridgecrewio/checkov
      tag: ${{package.version}}
      expected-commit: 9ea6d83d477afb3691795eda79d8f4dd56851d4b

  # TODO(kranurag7): remove post https://github.com/chainguard-dev/internal-dev/issues/24574 is fixed
  - uses: auth/uv
    with:
      allow-fallback-indexes: true

  - runs: |
      uv pip install checkov --prefix ${{targets.contextdir}}/usr
      rm -f ${{targets.contextdir}}/usr/.lock

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: checkov
    - uses: test/tw/pip-check
    - uses: test/tw/ldd-check
    - uses: python/import
      with:
        python: python${{vars.python-version}}
        import: checkov

update:
  enabled: true
  git: {}
