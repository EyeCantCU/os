package:
  name: kube-logging-logging-operator-4.1
  version: 4.1.0
  epoch: 28 # CVE-2025-61731
  description: Logging operator for Kubernetes
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.24

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kube-logging/logging-operator
      tag: ${{package.version}}
      expected-commit: f2079b2e9bf3799bb56112f52def7ba89217c090

  - uses: go/bump
    with:
      deps: |-
        google.golang.org/protobuf@v1.33.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0

  - runs: |
      CGO_ENABLED=0 GO111MODULE=on go build -o bin/manager main.go
      mkdir -p ${{targets.destdir}}/usr/bin
      install -Dm755 ./bin/manager ${{targets.destdir}}/usr/bin/manager

  - uses: strip

subpackages:
  - name: "kube-logging-logging-operator-4.1-compat"
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    pipeline:
      - runs: |
          # The helm chart expects the logging-operator binaries to be in / instead of /usr/bin
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/manager ${{targets.subpkgdir}}/manager
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - kube-logging-logging-operator-4.1
      pipeline:
        - uses: test/tw/symlink-check
          with:
            packages: kube-logging-logging-operator-4.1-compat
            allow-absolute: true

update:
  enabled: false
  exclude-reason: |
    since we don't expect any patches for the 4.1.x series, so, disabling updates.

test:
  environment:
    contents:
      packages:
        - curl
    environment:
      KUBERNETES_SERVICE_HOST: "127.0.0.1"
      KUBERNETES_SERVICE_PORT: "32764"
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: manager
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - name: Verify logging operator starts and connects to Kubernetes API
      uses: test/daemon-check-output
      with:
        setup: |
          # Grant cluster-admin for leader election and CRD access
          kubectl create clusterrolebinding test-admin \
            --clusterrole=cluster-admin \
            --serviceaccount=default:default
        start: /usr/bin/manager
        timeout: "30"
        expected_output: "Starting"
        error_strings: ""
