package:
  name: valkey-json
  version: 1.0.2
  epoch: 1 # go/enterprise-rsc/valkey-json
  description: ValkeyJSON - A JSON data structure module for Valkey
  copyright:
    - license: BSD-3-Clause
  resources:
    cpu: "2"
    memory: 15Gi

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/valkey-io/valkey-json
      tag: ${{package.version}}
      expected-commit: c7ecbc7b9dab4d57eb96faecdb555fabaebea958

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_BUILD_TYPE=Release \
        -DBUILD_RELEASE=ON \
        -DENABLE_UNIT_TESTS=OFF \
        -DENABLE_INTEGRATION_TESTS=OFF

  - uses: cmake/build

  - runs: |
      mkdir -p "${{targets.contextdir}}/usr/lib/valkey/modules"
      install -Dm755 output/src/libjson.so "${{targets.contextdir}}/usr/lib/valkey/libjson.so"

  - uses: strip

update:
  enabled: true
  github:
    identifier: valkey-io/valkey-json

test:
  environment:
    contents:
      packages:
        - valkey
        - valkey-cli
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/daemon-check-output
      with:
        setup: cp valkey.conf /tmp/valkey.conf
        start: valkey-server /tmp/valkey.conf
        timeout: 30
        expected_output: |
          Module 'json' loaded
        post: |
          set -euo pipefail

          valkey-cli JSON.SET user:1 $ '{"name":"test","age":30}'
          valkey-cli JSON.GET user:1 | grep -F '"name":"test"'
          valkey-cli JSON.GET user:1 $.name | grep -F '"test"'
          valkey-cli JSON.GET user:1 $.age | grep -F '30'

          valkey-cli JSON.SET arr:1 $ '{"items":[]}'
          valkey-cli JSON.ARRAPPEND arr:1 $.items '"item1"' '"item2"'
          valkey-cli JSON.GET arr:1 $.items | grep -F 'item1'
          valkey-cli JSON.GET arr:1 $.items | grep -F 'item2'

          valkey-cli JSON.TYPE user:1 $ | grep -F 'object'

          valkey-cli JSON.NUMINCRBY user:1 $.age 5
          valkey-cli JSON.GET user:1 $.age | grep -F '35'

          echo "All valkey-json tests passed"
