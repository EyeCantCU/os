package:
  name: ztunnel-fips-1.25
  version: "1.25.5"
  epoch: 8
  description: The `ztunnel` component of istio ambient mesh.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - ztunnel-fips=${{package.full-version}}
    runtime:
      - NIST-CMVP-4407
      - ca-certificates-bundle
      - iptables-nft
      - libmnl
      - libnetfilter_conntrack
      - libnfnetlink

vars:
  boring-version: 853ca1ea1168dff08011e5d42d94609cc0ca2e27

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cargo-auditable
      - clang-20
      - cmake
      - protoc
      - rust

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/istio/ztunnel
      tag: ${{package.version}}
      expected-commit: a2e6168409470b71f5dc82e61e29279ea0810b32

  - uses: rust/cargobump

  # mitigate GHSA-2gh3-rmm4-6rq5
  # created upstream PR to address pprof issue https://github.com/tikv/pprof-rs/pull/264
  # 0.15.0 added fix, updating to that version
  - runs: |
      sed -i 's|pprof = { version = "0.14", features = \["protobuf", "protobuf-codec", "criterion"\] }|pprof = { version = "0.15.0", features = ["protobuf", "protobuf-codec", "criterion"] }|' Cargo.toml

  - runs: |
      # https://github.com/istio/ztunnel/blob/master/README.md#boring-fips
      grep ${{vars.boring-version}} -r vendor/boringssl-fips/
      if [ "${{build.arch}}" = "aarch64" ]; then
        sed 's|x86_64|arm64|' -i .cargo/config.toml
      fi
      export ZTUNNEL_BUILD_buildStatus=clean
      export ZTUNNEL_BUILD_buildGitRevision=$(git rev-parse HEAD)
      export ZTUNNEL_BUILD_buildTag=$(git describe --tags --abbrev=0)
      export ZTUNNEL_BUILD_buildVersion=$(git rev-parse HEAD)
      cargo auditable build --release --no-default-features --features tls-boring --bin ztunnel
      mkdir -p ${{targets.destdir}}/usr/bin
      cp out/rust/release/ztunnel ${{targets.destdir}}/usr/bin/ztunnel

  - uses: rust/build-tree-check
    with:
      allowed-crates: "libboring_sys"
      blocked-crates: "libring"
      allowed-symbols: "boringssl_fips_self_test boring_rustls_provider::tls13::AES_256_GCM_SHA384"
      blocked-symbols: "ring::digest::SHA384 ring::aead::aes_gcm::AES_256_GCM"
      binary: "out/rust/release/ztunnel"

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for ztunnel
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/local/bin
          ln -sf /usr/bin/ztunnel "${{targets.contextdir}}"/usr/local/bin/ztunnel
    dependencies:
      provides:
        - ztunnel-fips-compat=${{package.full-version}}
    test:
      pipeline:
        - runs: |
            readlink -v /usr/local/bin/ztunnel

update:
  enabled: true
  ignore-regex-patterns:
    - '-rc'
    - '-beta'
  github:
    identifier: istio/ztunnel
    tag-filter-prefix: 1.25.
    use-tag: true

test:
  environment:
    contents:
      packages:
        - jq
        - rust-audit-info
  pipeline:
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 4407
        software-version: ${{vars.boring-version}}
    - name: Version information tests
      runs: |
        set -euo pipefail
        VERSION_OUTPUT=$(ztunnel version)
        # Verify version output contains expected fields (each grep fails test if field missing)
        echo "$VERSION_OUTPUT" | grep -F "Version"
        echo "$VERSION_OUTPUT" | grep -F "BuildStatus"
        echo "$VERSION_OUTPUT" | grep -F "GitTag"
        # Verify package version is embedded in binary (fails test if not found)
        echo "$VERSION_OUTPUT" | grep -F "${{package.version}}"
    - uses: test/tw/help-check
      with:
        bins: ztunnel
    - name: Check audit-info
      runs: |-
        set -euo pipefail
        crate=$(rust-audit-info /usr/bin/ztunnel | jq -r '.packages | .[] | select(.name=="ring") | .name')
        if [ "ring" = "$crate" ]; then
          echo "ring is a false positive metadata"
        fi
        crate=$(rust-audit-info /usr/bin/ztunnel | jq -r '.packages | .[] | select(.name=="boring-sys") | .name')
        # Verify boring-sys crate is present (fails test if not found)
        if [ "boring-sys" = "$crate" ]; then
          echo "SUCCESS: boring-sys crate found in binary"
        else
          echo "FAIL: Expected boring-sys crate in binary, got: $crate"
          exit 1
        fi
