package:
  name: grype-fips
  version: "0.99.1"
  epoch: 0 # GHSA-jc7w-c686-c4v9
  description: Vulnerability scanner for container images, filesystems, and SBOMs
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/anchore/grype
      tag: v${{package.version}}
      expected-commit: 6e1807dd7130c9eff23c1bad19a96cc6afef33aa

  - uses: go/bump
    with:
      deps: |-
        github.com/ulikunitz/xz@v0.5.14

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X main.version=${{package.version}}
      output: grype
      packages: ./cmd/grype

update:
  enabled: true
  github:
    identifier: anchore/grype
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        grype --version
        grype --help
        grype cgr.dev/chainguard/wolfi-base | grep -E "(No vulnerabilities found|VULNERABILITY)"
        grype db list
