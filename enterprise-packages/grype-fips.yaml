package:
  name: grype-fips
  version: "0.108.0"
  epoch: 1 # CVE-2025-68121
  description: Vulnerability scanner for container images, filesystems, and SBOMs
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "12"
    memory: 11Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/anchore/grype
      tag: v${{package.version}}
      expected-commit: 425dd9cce9ebbb695bd7ca79d7e0eb22e2b4116a

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X main.version=${{package.version}}
      output: grype
      packages: ./cmd/grype

update:
  enabled: true
  github:
    identifier: anchore/grype
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: grype
    - uses: test/tw/help-check
      with:
        bins: grype
    - name: Test vulnerability scanning functionality
      runs: |
        set -euo pipefail
        # Test scanning a container image for vulnerabilities
        output=$(grype cgr.dev/chainguard/wolfi-base)
        # Check for expected output format (either no vulns or vulns listed)
        if echo "$output" | grep -F "No vulnerabilities found"; then
          echo "SUCCESS: Scan completed - no vulnerabilities"
        elif echo "$output" | grep -F "VULNERABILITY"; then
          echo "SUCCESS: Scan completed - vulnerabilities listed"
        else
          echo "FAIL: Unexpected scan output format"
          echo "Output: $output"
          exit 1
        fi
        # Verify database operations work (fails test if no database info returned)
        grype db list | grep -F "Built"
