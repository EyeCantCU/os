package:
  name: mongo-tools-fips
  version: "100.14.1"
  epoch: 3 # CVE-2025-61732
  description: Tools for MongoDB (FIPS)
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
      - krb5-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mongodb/mongo-tools
      tag: ${{package.version}}
      expected-commit: c37ea81e07ba30acc06c5cf60c7304ed1085519f

  - uses: patch
    with:
      patches: release-platform.patch

  - runs: |
      ./make build
      mkdir -p ${{targets.destdir}}/usr/bin
      mv bin/* ${{targets.destdir}}/usr/bin

  - uses: strip

update:
  enabled: true
  github:
    identifier: mongodb/mongo-tools
    strip-prefix: v
    use-tag: true
    tag-filter: "100"

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: |
          bsondump
          mongodump
          mongoexport
          mongofiles
          mongoimport
          mongorestore
          mongostat
          mongotop
    - uses: test/tw/help-check
      with:
        bins: |-
          bsondump
          mongodump
          mongoexport
          mongofiles
          mongoimport
          mongorestore
          mongostat
          mongotop
