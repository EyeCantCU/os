package:
  name: argo-rollouts-fips
  version: "1.8.4"
  epoch: 1 # CVE-2025-68121
  description: Progressive Delivery for Kubernetes
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      # upstream Dockerfile pins node:18 (https://github.com/argoproj/argo-rollouts/blob/v1.8.4/Dockerfile#L27);
      # using nodejs-20 as the closest available LTS
      - nodejs-20
      - nofips-node
      - yarn

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 55e89ddc5329db9ebd72edff5503f2822d2e80ff
      repository: https://github.com/argoproj/argo-rollouts
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.21.0
        k8s.io/apiserver@v0.29.4
        k8s.io/kubernetes@v1.29.14
        golang.org/x/net@v0.38.0
        github.com/cloudflare/circl@v1.6.1
        golang.org/x/crypto@v0.45.0
      replaces: github.com/whilp/git-urls=github.com/chainguard-dev/git-urls@v1.0.2

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/rollouts-controller
      output: rollouts-controller
      ldflags: |
        -X github.com/argoproj/argo-rollouts/utils/version.version=${{package.version}}
        -X github.com/argoproj/argo-rollouts/utils/version.buildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +"%Y-%m-%dT%H:%M:%SZ")
        -X github.com/argoproj/argo-rollouts/utils/version.gitCommit=$(git rev-parse HEAD)
        -X github.com/argoproj/argo-rollouts/utils/version.gitTreeState=clean

subpackages:
  - name: kubectl-argo-rollouts-fips
    pipeline:
      - working-directory: ui
        runs: |
          yarn install --network-timeout 300000
          NODE_ENV='production' yarn build
          cp -r dist/app/* ../server/static
      - uses: go/build
        with:
          go-package: go-fips
          packages: ./cmd/kubectl-argo-rollouts
          output: kubectl-argo-rollouts
          ldflags: |
            -X github.com/argoproj/argo-rollouts/utils/version.version=${{package.version}}
            -X github.com/argoproj/argo-rollouts/utils/version.buildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +"%Y-%m-%dT%H:%M:%SZ")
            -X github.com/argoproj/argo-rollouts/utils/version.gitCommit=$(git rev-parse HEAD)
            -X github.com/argoproj/argo-rollouts/utils/version.gitTreeState=clean
    test:
      environment:
        contents:
          packages:
            - curl
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: ${{subpkg.name}}
        - uses: test/tw/help-check
          with:
            bins: kubectl-argo-rollouts
        - name: "Verify dashboard UI assets are embedded"
          uses: test/daemon-check-output
          with:
            start: kubectl-argo-rollouts dashboard
            timeout: 30
            expected_output: |
              Argo Rollouts Dashboard
            post: |
              curl -fsSL http://localhost:3100/rollouts | grep -q '<script'

update:
  enabled: true
  github:
    identifier: argoproj/argo-rollouts
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - kubectl-argo-rollouts-fips
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: rollouts-controller
    - uses: test/tw/help-check
      with:
        bins: rollouts-controller
    - name: Verify kubectl plugin
      runs: |-
        kubectl-argo-rollouts version
