package:
  name: kube-vip-fips
  version: "1.0.4"
  epoch: 2 # CVE-2025-61732
  description: Kubernetes Control Plane Virtual IP and Load-Balancer
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ff40ff06a3d6ee2d4452968e46cfa7e5ac4cc456
      repository: https://github.com/kube-vip/kube-vip
      tag: v${{package.version}}

  - uses: go/build
    with:
      ldflags: -X=main.Version=${{package.version}} -X=main.Build=$(git rev-parse HEAD)
      output: kube-vip
      packages: .
      go-package: go-fips

  - uses: strip

subpackages:
  - name: "${{package.name}}-compat"
    # https://github.com/kube-vip/kube-vip/blob/2872256a89a1e39b62c9518728ec22e2f33af4eb/Dockerfile#L19
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/kube-vip ${{targets.subpkgdir}}/kube-vip
    test:
      pipeline:
        - runs: |
            readlink -v /kube-vip

update:
  enabled: true
  github:
    identifier: kube-vip/kube-vip
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-compat
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: kube-vip
    - uses: test/tw/help-check
      with:
        bins: kube-vip
    - name: Verify daemon can initialize
      uses: test/daemon-check-output
      with:
        start: /usr/bin/kube-vip start --controlplane --interface lo --vip 127.0.0.1
        expected_output: "kube-vip"
        timeout: "15"
        error_strings: ""
        post: |
          set -euo pipefail

          # Verify manifest generation works (functional test)
          /usr/bin/kube-vip manifest pod --interface lo --address 127.0.0.1 | grep -F "apiVersion"
