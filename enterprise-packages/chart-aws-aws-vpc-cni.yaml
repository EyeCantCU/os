package:
  name: chart-aws-aws-vpc-cni
  version: "1.21.1"
  epoch: 0
  description: A Helm chart for the AWS VPC CNI
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-charts
      tag: v0.0.219
      expected-commit: f3cf8213d34a674345b535fe124fa3cf138f34ff

  - uses: charts/package
    with:
      chart-path: stable/aws-vpc-cni
      images: |
        amazon-k8s-cni-init:
          values:
            init:
              image:
                override: ${ref}
        amazon-k8s-cni:
          values:
            image:
              override: ${ref}
        aws-network-policy-agent:
          values:
            nodeAgent:
              image:
                override: ${ref}
      test: |
        cases:
          - name: default
            images: [amazon-k8s-cni-init, amazon-k8s-cni, aws-network-policy-agent]
          - name: node-agent-disabled
            images: [amazon-k8s-cni-init, amazon-k8s-cni]
            values:
              nodeAgent:
                enabled: false

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: false
  exclude-reason: >-
    Git tags in aws/eks-charts are generic repo-level versions (v0.0.X) that don't correspond to individual chart versions. The aws-vpc-cni chart version (1.21.x) has no matching tag pattern. To update manually: run 'helm search repo eks/aws-vpc-cni --versions', find the new version, then search 'git log --oneline -- stable/aws-vpc-cni/Chart.yaml' for the commit, and find the first containing tag with 'git tag --contains <commit>'.
