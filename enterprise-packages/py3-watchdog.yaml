# Please note that the last release of this package was in Nov 2024 over pypy
# This project is small and looks complete and has no CVEs as of date
# So we can keep it as it is since it's an requirement for spamcheck image
package:
  name: py3-watchdog
  version: "6.0.0"
  epoch: 1 # go/enterprise-rsc/py3-watchdog
  description: Python library and shell utilities to monitor filesystem events
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "20"
    memory: 13Gi

vars:
  pypi-package: watchdog
  import: watchdog

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-pip
      - py3-supported-python-dev
      - py3-supported-setuptools
      - py3-supported-wheel

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gorakhargosh/watchdog
      tag: v${{package.version}}
      expected-commit: 76c091dc8841de1d1a1cd6511bb509fe4f058de6

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<'EOF'
            from watchdog.observers import Observer
            from watchdog.events import FileSystemEventHandler

            # Test basic imports
            print('Observer imported successfully')
            print('FileSystemEventHandler imported successfully')

            # Test Observer creation
            observer = Observer()
            print('Observer created successfully')
            print('watchdog basic functionality test: PASSED')
            print("All watchdog tests passed!")
            EOF

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            watchmedo --help | grep -q "usage: watchmedo"

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: gorakhargosh/watchdog
    strip-prefix: v
    use-tag: true
