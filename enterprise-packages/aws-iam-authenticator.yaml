package:
  name: aws-iam-authenticator
  version: "0.7.9"
  epoch: 0 # CVE-2025-61725
  description: "Tool to use AWS IAM credentials to authenticate to a Kubernetes cluster"
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/aws-iam-authenticator
      tag: v${{package.version}}
      expected-commit: 19000d354fa0828012e45dc52039c73177f7cde8

  - uses: go/build
    with:
      packages: ./cmd/aws-iam-authenticator
      output: aws-iam-authenticator
      ldflags: -X sigs.k8s.io/aws-iam-authenticator/pkg.Version=v${{package.version}}

  - uses: strip

test:
  pipeline:
    - runs: |
        aws-iam-authenticator version | grep "v${{package.version}}"

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/aws-iam-authenticator
    strip-prefix: v
