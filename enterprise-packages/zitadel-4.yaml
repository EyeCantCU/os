package:
  name: zitadel-4
  version: "4.11.1"
  epoch: 1 # GHSA-9h8m-3fm2-qjrq
  description: Identity infrastructure, simplified for you.
  resources:
    cpu: 33
    memory: 64Gi
  copyright:
    - license: AGPL-3.0
  dependencies:
    provides:
      - zitadel=${{package.full-version}}

vars:
  python-version: 3.13

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - go
      - node-gyp
      - nodejs
      - npm
      - pnpm # for arm64 builds
      - py3-setuptools # To fix `No module named 'distutils'`
      - python3
  environment:
    CGO_ENABLED: "0"
    # PNPM_HOME cannot be in the same directory as the package.json. Otherwise, pnpm can
    # get in an infite loop of trying to update itself.
    PNPM_HOME: /home
    PATH: /usr/local/sbin:/usr/local/bin:/usr/bin:/usr/sbin:/sbin:/bin:home/build/.cache/go/bin

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 288f064e3ca990fde195e9a7ab363616e4fccdf1
      repository: https://github.com/zitadel/zitadel
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        github.com/gorilla/csrf@v1.7.3
        go.opentelemetry.io/otel/sdk@v1.40.0
      tidy: false

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: apps/login/acceptance/samlsp

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: apps/login/acceptance/oidcrp

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: apps/login/acceptance/idp/saml

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: apps/login/acceptance/idp/oidc

  - name: Fix SCSS generate path
    runs: |
      # The go:generate directive in generate.go uses repo-root-relative paths,
      # but go generate sets CWD to the file's directory. Fix to use relative paths.
      sed -i 's|pnpm sass internal/api/ui/login/static/resources/themes/scss/zitadel.scss internal/api/ui/login/static/resources/themes/zitadel/css/zitadel.css|pnpm sass themes/scss/zitadel.scss themes/zitadel/css/zitadel.css|' internal/api/ui/login/static/resources/generate.go

  - name: Configure build tooling
    runs: |
      npm install -g sass
      # Ensure our pnpm version is used
      v=$(pnpm --version)
      sed -i -E "s/(\"packageManager\"*: *\"pnpm@)[^\"]+\"/\1${v}\"/" package.json
      pnpm install

      # We want to build locally:
      # https://nx.dev/docs/reference/nx-cloud/config#disabling-connections-to-nx-cloud
      sed -i '2a\  "neverConnectToCloud": true,' nx.json

  - name: Build the API package tarball (but just install the built binary)
    runs: |
      arch="amd64"
      if [ "${{build.arch}}" = "aarch64" ]; then
        arch="arm64"
      fi
      ZITADEL_VERSION="${{package.version}}" pnpm nx run api:pack-linux-${arch}
      mkdir -p ${{targets.destdir}}/usr/bin
      install -p -m 0755 .artifacts/bin/linux/${arch}/zitadel ${{targets.destdir}}/usr/bin/zitadel

subpackages:
  - name: ${{package.name}}-compat
    dependencies:
      runtime:
        - ca-certificates-bundle
      provides:
        - zitadel-compat=${{package.full-version}}
    pipeline:
      - runs: |
          install -d ${{targets.contextdir}}/app
          ln -s /usr/bin/zitadel ${{targets.contextdir}}/app/zitadel
    test:
      pipeline:
        - uses: test/tw/ldd-check

update:
  enabled: true
  manual: false
  github:
    identifier: zitadel/zitadel
    strip-prefix: v
    tag-filter: v4
    use-tag: true

test:
  environment:
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/test"
      ZITADEL_DATABASE_POSTGRES_HOST: localhost
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: test
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: false
    contents:
      packages:
        # 18 not supported as of 4.3.3: https://github.com/zitadel/zitadel/issues/10712
        - postgresql<18
        - postgresql-client<18
        - ca-certificates-bundle
        - procps
    accounts:
      groups:
        - groupname: build
          gid: 65532
      users:
        - username: build
          gid: 65532
          uid: 65532
  pipeline:
    - name: Verify zitadel installation
      runs: |
        zitadel -v | grep -q "${{package.version}}" || exit 1
        zitadel --help
    - name: "Install and start postgres"
      working-directory: /app
      runs: |
        mkdir -p /var/lib/postgresql/data
        chown build:build /var/lib/postgresql/data

        mkdir -p /var/run/postgresql
        chown build:build /var/run/postgresql

        su build -c "initdb -D /var/lib/postgresql/data" > /dev/null 2>&1
        su build -c "pg_ctl -D /var/lib/postgresql/data -o '-k /var/run/postgresql' start" > /dev/null 2>&1

        su build -c "/usr/bin/psql \
          -h /var/run/postgresql \
          -d postgres \
          -v ON_ERROR_STOP=1 <<-EOSQL
            CREATE ROLE postgres WITH LOGIN SUPERUSER PASSWORD 'postgres';
            CREATE DATABASE test OWNER postgres;
        EOSQL" > /dev/null 2>&1
    - pipeline:
        - name: "Run Zitadel"
          uses: test/daemon-check-output
          with:
            start: zitadel start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled
            timeout: 30
            expected_output: |
              server is listening
