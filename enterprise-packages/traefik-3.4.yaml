package:
  name: traefik-3.4
  version: "3.4.5"
  epoch: 8 # GHSA-g754-hx8w-x2g6
  description: The Cloud Native Application Proxy
  copyright:
    - license: MIT
  dependencies:
    provides:
      - traefik=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - go
      - nodejs-20
      - yarn

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9bf14b67644cb1da14923bda0e3144a0355b4543
      repository: https://github.com/traefik/traefik
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/go-acme/lego/v4@v4.25.2
        golang.org/x/crypto@v0.45.0
        github.com/quic-go/quic-go@v0.57.0

  - working-directory: webui
    runs: |
      yarn install
      yarn build

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/traefik
      output: traefik
      ldflags: |
        -X github.com/traefik/traefik/v3/pkg/version.Version=${{package.version}}
        -X github.com/traefik/traefik/v3/pkg/version.BuildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" '+%Y-%m-%d_%I:%M:%S%p')
        -X github.com/traefik/traefik/v3/pkg/version.Codename=$CODENAME

update:
  enabled: true
  github:
    identifier: traefik/traefik
    strip-prefix: v
    tag-filter: v3.4.

test:
  environment:
    contents:
      packages:
        - curl
        - python3
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: traefik
        version-flag: "version"
    - uses: test/tw/help-check
      with:
        bins: traefik
    - name: Run and test traefik with API and ping verification
      uses: test/daemon-check-output
      with:
        start: traefik --ping=true --ping.entryPoint=traefik --api.insecure=true --log.level=DEBUG
        timeout: 30
        expected_output: |
          Creating middleware
          Setting up redirection
        post: |
          set -euo pipefail
          # wait-for-it is pre-installed by the pipeline
          wait-for-it localhost:8080 -t 30

          # Test ping endpoint (health check)
          echo "Testing ping endpoint..."
          curl -f http://localhost:8080/ping || {
            echo "FAIL: Ping endpoint not responding"
            exit 1
          }
          echo "Ping endpoint OK"

          # Test API endpoint
          echo "Testing API endpoint..."
          curl -f http://localhost:8080/api/rawdata || {
            echo "FAIL: API endpoint not responding"
            exit 1
          }
          echo "API endpoint OK"
    - name: Test HTTP proxying through traefik
      uses: test/daemon-check-output
      with:
        setup: |
          set -euo pipefail
          # Create backend content
          mkdir -p /tmp/backend
          echo "Hello from backend" > /tmp/backend/index.html

          # Start backend HTTP server
          cd /tmp/backend
          python3 -m http.server 9000 > /tmp/backend.log 2>&1 &

          # Wait for backend to be ready
          wait-for-it localhost:9000 -t 10

          # Create traefik dynamic config for routing
          mkdir -p /tmp/traefik
          tee /tmp/traefik/routes.yaml <<'EOF'
          http:
            routers:
              backend:
                rule: "PathPrefix(`/`)"
                entryPoints:
                  - web
                service: backend

            services:
              backend:
                loadBalancer:
                  servers:
                    - url: "http://127.0.0.1:9000"
          EOF
        start: traefik --entryPoints.web.address=:8081 --providers.file.directory=/tmp/traefik --log.level=DEBUG
        timeout: 30
        expected_output: |
          entryPoint
        post: |
          set -euo pipefail
          # Wait for traefik to be ready
          wait-for-it localhost:8081 -t 10

          # Give traefik time to load the configuration
          sleep 2

          # Test proxying - request to traefik should return backend content
          response=$(curl -sf http://localhost:8081/)
          if echo "$response" | grep -F "Hello from backend"; then
            echo "SUCCESS: HTTP proxying through traefik works correctly"
          else
            echo "ERROR: Expected backend response through proxy"
            echo "Response: $response"
            exit 1
          fi
