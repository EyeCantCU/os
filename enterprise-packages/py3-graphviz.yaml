package:
  name: py3-graphviz
  version: 0.21
  epoch: 0
  description: Simple Python interface for Graphviz
  copyright:
    - license: MIT

vars:
  pypi-package: graphviz

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/xflr6/graphviz.git
      tag: ${{package.version}}
      expected-commit: 19b16bf915c49bcc073d2b0c8aa5fc3961e75b47

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        # Directly executes "dot" (and others) at runtime
        - graphviz
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - file
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            dot -c
            python${{range.key}} <<'EOF'
            import graphviz
            dot = graphviz.Digraph(comment='The Round Table')
            dot.node('A', 'King Arthur')
            dot.node('B', 'Sir Bedevere the Wise')
            dot.node('L', 'Sir Lancelot the Brave')

            dot.edges(['AB', 'AL'])
            dot.edge('B', 'L', constraint='false')
            print(dot.source)

            dot.render('doctest-output/round-table.gv').replace('\\', '\/')
            EOF
            stat 'doctest-output/round-table.gv.pdf'
            file 'doctest-output/round-table.gv.pdf' | grep -F -e "PDF document, version"

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
