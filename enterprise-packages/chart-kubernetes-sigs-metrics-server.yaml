package:
  name: chart-kubernetes-sigs-metrics-server
  version: "3.13.0"
  epoch: 0
  description: Metrics Server is a scalable, efficient source of container resource metrics for Kubernetes built-in autoscaling pipelines.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/metrics-server
      tag: metrics-server-helm-chart-${{package.version}}
      expected-commit: 1a64100c33acf2d7dfa4439f20c75bc64d86983f

  - uses: charts/package
    with:
      chart-path: charts/metrics-server
      images: |
        metrics-server:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
        addon-resizer:
          values:
            addonResizer:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [metrics-server]
          - name: with-addon-resizer
            images: [metrics-server, addon-resizer]
            values:
              addonResizer:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/metrics-server
    strip-prefix: metrics-server-helm-chart-
    use-tag: true
    tag-filter-prefix: metrics-server-helm-chart-
