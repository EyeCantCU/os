package:
  name: chart-stevehipwell-kube-proxy
  version: "0.0.8"
  epoch: 0
  description: Helm chart for managing kube-proxy
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/stevehipwell/helm-charts
      tag: kube-proxy-${{package.version}}
      expected-commit: 58574cef004aa97a9ca94a32a3d2e40021863f18

  - uses: charts/package
    with:
      chart-path: charts/kube-proxy
      images: |
        kube-proxy:
          values:
            image:
              repository: ${registry_repo}
              tag: ${tag}
              digest: ${digest}
      test: |
        cases:
          - name: default
            images: [kube-proxy]
            values:
              apiServer:
                endpoint: https://kubernetes.default.svc

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: stevehipwell/helm-charts
    strip-prefix: kube-proxy-
    use-tag: true
    tag-filter-prefix: kube-proxy-
