#nolint:git-checkout-must-use-github-updates,valid-pipeline-git-checkout-tag
package:
  name: triton-inference-server-local-cache
  version: "26.01_git20260205"
  epoch: 0
  description: Triton Inference Server Local Cache
  copyright:
    - license: BSD-3-Clause
      license-path: local_cache.git/LICENSE

var-transforms:
  - from: ${{package.version}}
    match: '^(\d+.\d+).*'
    replace: 'r$1'
    to: triton-branch

environment:
  contents:
    packages:
      - boost-dev
      - build-base
      - busybox
      - cmake
      - git
      - rapidjson-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/triton-inference-server/local_cache
      branch: ${{vars.triton-branch}}
      expected-commit: 0af56eb428d4450e182bbfc8d0d3943a3c2027c8
      destination: local_cache.git

  # git-checkout branch will attempt to reset to the expected-commit
  # if the branch doesn't match. Here we want to fail the build
  # so we can validate and switch to the new commit.
  - name: check if git-checkout had to reset to expected-commit
    working-directory: local_cache.git
    runs: |
      [ "$(git rev-parse origin/${{vars.triton-branch}})" = "$(git rev-parse HEAD)" ]

  - working-directory: local_cache.git
    pipeline:
      - uses: cmake/configure
        with:
          opts: |
            -DCMAKE_INSTALL_PREFIX=/opt/tritonserver \
            -DTRITON_ENABLE_METRICS=ON
      - uses: cmake/build
      - uses: cmake/install
      - runs: |
          rm -r ${{targets.destdir}}/opt/tritonserver/bin

# For some reason the default install targets for this
# package include a slew of static libraries and headers.
# these conflict with the actual triton server core files
# so we'll split them into subpackages.
# The options I found for turning off tests and gmock did not
# seem to work. This package is not build against and should be
# loaded by the main server instance and has a stable interface.
# However the dev package will allow us to check or build against
# the same exact header we used to build in the case that
# triton server moves on and this package is delayed.
subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} dev package
    pipeline:
      - uses: split/dev
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/opt/tritonserver/
          mv ${{targets.destdir}}/opt/tritonserver/lib ${{targets.subpkgdir}}/opt/tritonserver/
    test:
      pipeline:
        - runs: |
            # Verify CMake config files are installed
            test -f /opt/tritonserver/lib/cmake/TritonLocalCache/TritonLocalCacheConfig.cmake
            test -f /opt/tritonserver/lib/cmake/TritonLocalCache/TritonLocalCacheTargets.cmake

test:
  environment:
    contents:
      packages:
        - tritonserver
  pipeline:
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: /opt/tritonserver/lib/

update:
  enabled: true
  git: {}
  schedule:
    period: monthly
    reason: |
      Monthly checks ensure we don't miss updates while avoiding excessive build triggers.
      The upstream project does not publish tags, they have branches that correspond to monthly releases.
      While updating, update version to the corresponding monthly release.
      Also, check on the latest version of CUDA being shipped with tritonserver image and update this manifest accordingly.
  exclude-reason: "No support for untagged release branches yet"
