package:
  name: ruby3.4-fluent-plugin-s3
  version: "1.8.4"
  epoch: 0
  description: Amazon S3 output plugin for Fluentd event collector
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ruby3.4-aws-sdk-s3
      - ruby3.4-aws-sdk-sqs
      - ruby3.4-fluentd
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-3.4
      - ruby-3.4-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c128c8124031b8fe025dd82bbf1cbe97b2f8a5e9
      repository: https://github.com/fluent/fluent-plugin-s3
      tag: v${{package.version}}

  - uses: ruby/unlock-spec

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

update:
  enabled: true
  github:
    identifier: fluent/fluent-plugin-s3
    strip-prefix: v
    use-tag: true

vars:
  gem: fluent-plugin-s3

test:
  environment:
    contents:
      packages:
        - ruby3.4-fluentd
  pipeline:
    - uses: test/tw/gem-check
      with:
        require: fluent/plugin/out_s3
    - runs: |
        ruby -e "require 'fluent/plugin/in_s3'"
        ruby -e "require 'fluent/plugin/out_s3'"
    - name: Validate plugin loads in fluentd
      runs: |
        set -euo pipefail
        tee /tmp/test.conf <<'EOF'
        <source>
          @type forward
          port 24224
        </source>

        <match **>
          @type s3
          s3_bucket test-bucket
          s3_region us-east-1
          path logs/
        </match>
        EOF
        fluentd --dry-run -c /tmp/test.conf
