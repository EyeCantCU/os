package:
  name: fluent-plugin-datadog
  version: "0.15.0"
  epoch: 0
  description: Datadog output plugin for Fluentd
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - ruby3.4-fluent-plugin-datadog=${{package.full-version}}
    runtime:
      - ruby3.4-fluentd
      - ruby3.4-net-http-persistent
  resources:
    cpu: "1"
    memory: 1Gi

vars:
  gem: fluent-plugin-datadog

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - ruby-3.4
      - ruby-3.4-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 26a89ba23d8fbf417741d4f2979d9ca4806ce045
      repository: https://github.com/DataDog/fluent-plugin-datadog
      tag: v${{package.version}}

  - uses: ruby/build
    with:
      gem: ${{vars.gem}}

  - uses: ruby/install
    with:
      gem: ${{vars.gem}}
      version: ${{package.version}}

  - uses: ruby/clean

update:
  enabled: true
  github:
    identifier: DataDog/fluent-plugin-datadog
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - runs: |
        ruby -e "require 'fluent/plugin/out_datadog'"
