package:
  name: dependency-track-apiserver
  version: "4.13.6"
  epoch: 1 # GHSA-6fhj-vr9j-g45r
  description:
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openjdk-21-default-jvm

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - maven
      - openjdk-21-default-jdk
      - wolfi-base
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/DependencyTrack/dependency-track
      tag: ${{package.version}}
      expected-commit: ad29338d270b7f8bb1f51ba52636c2f92e961155

  - uses: patch
    with:
      patches: compressutil.patch

  - uses: auth/maven

  - uses: maven/pombump

  - runs: |
      export LANG=en_US.UTF-8
      # Build the API Server without the bundled UI jars
      mvn clean package -P clean-exclude-wars -P enhance -P embedded-jetty \
        -DskipTests -Dlogback.configuration.file=src/main/docker/logback.xml

      mkdir -p ${{targets.destdir}}/opt/owasp/dependency-track/

      # https://github.com/DependencyTrack/dependency-track/blob/2b67f6b552aaaade27b466ed8462288c75fae5c1/src/main/docker/Dockerfile#L81
      # https://github.com/DependencyTrack/dependency-track/blob/2b67f6b552aaaade27b466ed8462288c75fae5c1/src/main/docker/Dockerfile#L26
      mv target/dependency-track-apiserver.jar ${{targets.destdir}}/opt/owasp/dependency-track/
      mv src/main/docker/logback-json.xml ${{targets.destdir}}/opt/owasp/dependency-track/

update:
  enabled: true
  github:
    identifier: DependencyTrack/dependency-track

test:
  environment:
    contents:
      packages:
        - coreutils
        - curl
  pipeline:
    - name: "Server logs"
      working-directory: /opt/owasp/dependency-track
      runs: |
        export HOME=/tmp
        export DEFAULT_TEMPLATES_OVERRIDE_BASE_DIRECTORY=/data
        export DEFAULT_TEMPLATES_OVERRIDE_ENABLED=false
        # Write a simple config file
        cat <<EOT >> /tmp/application.properties
        alpine.database.url=jdbc:h2:/tmp/db
        EOT

        java -Dlogback.configurationFile=logback.xml -Dalpine.application.properties=/tmp/application.properties -jar dependency-track-apiserver.jar -context / > /tmp/logs.txt 2>&1 &
        PID=$!

        sleep 60 # Hope that enough time is given for the logs to get written
        if ! cat /tmp/logs.txt | grep -i 'Dependency-Track is ready'; then
          cat /tmp/logs.txt
          exit 1
        fi
        kill $PID
