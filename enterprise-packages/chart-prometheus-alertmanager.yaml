package:
  name: chart-prometheus-alertmanager
  version: "1.32.0"
  epoch: 0
  description: The Alertmanager handles alerts sent by client applications such as the Prometheus server.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/helm-charts
      tag: alertmanager-${{package.version}}
      expected-commit: df5ae41bfbb7194c38979f1f50ccca5034075bf6

  - uses: charts/package
    with:
      chart-path: charts/alertmanager
      images: |
        alertmanager:
          values:
            image:
              repository: ${registry_repo}
              tag: ${tag}
        prometheus-config-reloader:
          values:
            configmapReload:
              image:
                repository: ${registry_repo}
                tag: ${tag}
      test: |
        cases:
          - name: default
            images: [alertmanager]
          - name: with-config-reload
            images: [alertmanager, prometheus-config-reloader]
            values:
              configmapReload:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: prometheus-community/helm-charts
    strip-prefix: alertmanager-
    use-tag: true
    tag-filter-prefix: alertmanager-
