package:
  name: perl-date-calc
  version: "6.4"
  epoch: 0
  description: Generic Config Module
  copyright:
    - license: GPL-1.0-or-later AND Artistic-2.0
  dependencies:
    runtime:
      - perl-bit-vector

environment:
  contents:
    packages:
      - build-base
      - perl-bit-vector
      - perl-dev

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/S/ST/STBEY/Date-Calc-${{package.version}}.tar.gz
      expected-sha256: 7ce137b2e797b7c0901f3adf1a05a19343356cd1f04676aa1c56a9f624f859ad

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

update:
  enabled: true
  release-monitor:
    identifier: 2779

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  environment:
    contents:
      packages:
        - perl
  pipeline:
    - name: Smoke test
      runs: |
        set -euo pipefail
        perl <<'EOF'
        use Date::Calc qw(:all);
        # Test date arithmetic - add days to a date
        my ($y, $m, $d) = Add_Delta_Days(2021, 1, 1, 10);
        die "Date arithmetic failed" unless $y == 2021 && $m == 1 && $d == 11;
        # Test date validation - valid date
        my $valid = check_date(2021, 2, 28);
        die "Valid date check failed" unless $valid;
        # Test date validation - invalid date
        my $invalid = check_date(2021, 2, 30);
        die "Invalid date should fail" if $invalid;
        # Test date comparison
        my $cmp = Date_to_Days(2021, 12, 31) - Date_to_Days(2021, 1, 1);
        die "Date comparison failed" unless $cmp == 364;
        print "Date::Calc functional tests passed\n";
        EOF
