#nolint:valid-pipeline-git-checkout-tag
package:
  name: freshclam-cvd
  version: "0_git20260220"
  epoch: 0
  description: Signature database cache
  copyright:
    - license: GPL-2.0-only

environment:
  contents:
    packages:
      - busybox
      - clamav-1.5-freshclam

pipeline:
  - uses: git-checkout
    with:
      # Unused, here to just have an auto-bumped reference
      repository: https://github.com/Cisco-Talos/clamav
      branch: main
      expected-commit: 696424ef361ff0e41cabfcbf269bff1c0bb98e9c
      destination: unused

  - runs: |
      rm -r unused

  - runs: |
      # Ship equivalent of
      # https://github.com/Cisco-Talos/clamav-docker/blob/0d113830f0a480924874cf2bb5a2b638703e5d48/clamav/1.5/debian/scripts/update_db_image.sh#L91
      # Note it is ok to be out of date
      # Currently known to be compatible with all previous versions
      mkdir -p ${{targets.contextdir}}/var/lib/clamav
      freshclam --foreground --stdout --user=$(id -u -n) --datadir=${{targets.contextdir}}/var/lib/clamav --log=`pwd`/freshclam.log
      rm ${{targets.contextdir}}/var/lib/clamav/freshclam.dat
      cat freshclam.log

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: This is a periodic signature database update

test:
  pipeline:
    - runs: |
        ls /var/lib/clamav/main.cvd
        ls /var/lib/clamav/daily.cvd
