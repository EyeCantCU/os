package:
  name: dockerize-fips
  version: "0.10.1"
  epoch: 0 # CVE-2025-61732
  description: Utility to simplify running applications in docker containers
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jwilder/dockerize
      tag: v${{package.version}}
      expected-commit: d4f4a28a6357b7614ba3d8f9ab9a097a655e3c49

  - uses: go/build
    with:
      packages: .
      output: dockerize
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: jwilder/dockerize
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    - runs: |
        dockerize --version
        dockerize --help
    - uses: test/go-fips-check
