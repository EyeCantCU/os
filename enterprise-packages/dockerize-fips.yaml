package:
  name: dockerize-fips
  version: "0.10.0"
  epoch: 0 # CVE-2025-61731
  description: Utility to simplify running applications in docker containers
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jwilder/dockerize
      tag: v${{package.version}}
      expected-commit: c76bfa70f66a2a0c1b38005a61cea4018dda4f71

  - uses: go/build
    with:
      packages: .
      output: dockerize
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: jwilder/dockerize
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    - runs: |
        dockerize --version
        dockerize --help
    - uses: test/go-fips-check
