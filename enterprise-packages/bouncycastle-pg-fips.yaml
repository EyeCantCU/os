package:
  name: bouncycastle-pg-fips
  # renovate: datasource=maven depName=org.bouncycastle:bcpg-fips versioning=maven
  version: "2.1.11"
  epoch: 3
  description: BouncyCastle FIPS OpenPGP/BCPG APIs
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://repo1.maven.org/maven2/org/bouncycastle/bcpg-fips/${{package.version}}/bcpg-fips-${{package.version}}.jar
      expected-sha512: a280aabc57116d18979187b53deaec00551145c718ed80baa5e1d2ec3ada40931e10ebe89e37d3c1447b2fbb3b0dd572af89769ad601777f9a34b96040f4e825
      extract: false

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/java/bouncycastle-fips
      cp bcpg-fips-${{package.version}}.jar ${{targets.destdir}}/usr/share/java/bouncycastle-fips/bcpg-fips.jar

test:
  environment:
    contents:
      packages:
        - openjdk-17-default-jdk
  pipeline:
    - name: Verify JAR file exists
      runs: |
        set -euo pipefail
        # Verify the bcpg-fips JAR is installed (fails test if missing)
        stat /usr/share/java/bouncycastle-fips/bcpg-fips.jar
    - name: Verify JAR is valid Java archive
      runs: |
        set -euo pipefail
        # List JAR contents to verify it's a valid archive (fails if corrupt/invalid)
        jar tf /usr/share/java/bouncycastle-fips/bcpg-fips.jar | grep -F ".class"
    - name: Verify OpenPGP classes can be loaded
      runs: |
        set -euo pipefail
        # Use javap to verify class bytecode is valid and loadable
        # This proves the JAR contains valid Java bytecode (fails if corrupt)
        javap -cp /usr/share/java/bouncycastle-fips/bcpg-fips.jar org.bouncycastle.openpgp.PGPPublicKey | grep -F "class org.bouncycastle.openpgp.PGPPublicKey"
    - uses: java-fips/algorithms
      with:
        java-version: 17

update:
  enabled: false
  exclude-reason: |-
    Please upgrade this always. Note this jar is outside of FIPS
    boundary, and should always be updated to latest published version
    on maven. There is no git repository where one can track version
    numbers for it, as the upstream repo is private. Unless we write a
    maven version tracker.
