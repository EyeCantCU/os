package:
  name: sealed-secrets-fips
  version: "0.36.0"
  epoch: 1
  description: A Kubernetes controller and tool for one-way encrypted Secrets
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "6"
    memory: 13Gi

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+$
    replace: "$1"
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bitnami-labs/sealed-secrets
      tag: v${{package.version}}
      expected-commit: 97e5023c97fa29a5a91706c6d140851fa282bae7

  - uses: go/build
    with:
      packages: ./cmd/controller
      output: controller
      go-package: go-fips
      ldflags: -X main.VERSION=${{package.version}}

subpackages:
  - name: ${{package.name}}-kubeseal
    dependencies:
      provides:
        - kubeseal-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/kubeseal
          output: kubeseal
          go-package: go-fips
          ldflags: -X main.VERSION=${{package.version}}
    test:
      environment:
        environment:
          KUBERNETES_SERVICE_HOST: "127.0.0.1"
          KUBERNETES_SERVICE_PORT: 32764
        contents:
          packages:
            - ${{package.name}}-kubeseal
            - ${{package.name}}
            - curl
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/ver-check
          with:
            bins: kubeseal
        - uses: test/tw/help-check
          with:
            bins: kubeseal
        - uses: test/kwok/cluster
          with:
            serviceaccount: true
        - name: Run sealed-secrets-controller and extract cert
          runs: |
            set -euo pipefail

            # Setup resources for sealed-secrets-controller
            kubectl create -f ./sealedsecrets_crd.yaml
            kubectl create role secrets-admin --verb=get,list,watch,create,update,patch --resource=secrets
            kubectl create clusterrole secrets-admin --verb=get,list,watch,update --resource=secrets,sealedsecrets
            kubectl patch role secrets-admin --type=json --patch-file='role_patch.json'
            kubectl patch clusterrole secrets-admin --type=json  --patch-file='role_patch.json'
            kubectl create rolebinding default-secrets-admin-binding --role=secrets-admin --serviceaccount=default:default
            kubectl create clusterrolebinding default-secrets-admin-binding --clusterrole=secrets-admin --serviceaccount=default:default

            # Run sealed-secrets-controller and extract the public and private keys
            nohup /usr/bin/controller >/dev/null 2>&1 &
            curl --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8080/v1/cert.pem > mycert.pem
            kubectl get secret -lsealedsecrets.bitnami.com/sealed-secrets-key=active -o jsonpath='{.items[].data.tls\.key}' | base64 -d > sealed.key
        - name: Use the cert to seal a secret with kubeseal and verify they don't differ
          runs: |
            set -euo pipefail
            kubeseal --cert mycert.pem < secret.yaml > sealed-secret.json
            kubeseal --recovery-unseal --recovery-private-key sealed.key -o yaml < sealed-secret.json > unsealed_secret.yaml
            diff -q secret.yaml unsealed_secret.yaml

  # Bitnami compatibility package for kubeseal component
  - name: ${{package.name}}-kubeseal-compat
    description: "compat package with bitnami/sealed-secrets-kubeseal image"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: sealed-secrets-kubeseal
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p ${{targets.contextdir}}/opt/bitnami/sealed-secrets-kubeseal/bin/
          mkdir -p ${{targets.contextdir}}/usr/local/bin/
          ln -s /usr/bin/kubeseal ${{targets.contextdir}}/usr/local/bin/kubeseal
          ln -s /usr/bin/kubeseal ${{targets.contextdir}}/opt/bitnami/sealed-secrets-kubeseal/bin/kubeseal
          ln -s /usr/bin/kubeseal ${{targets.contextdir}}/kubeseal
      - uses: iamguarded/finalize-compat
        with:
          package: sealed-secrets-kubeseal
          version: ${{vars.major-version}}
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}-kubeseal
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: sealed-secrets-kubeseal
            version: ${{vars.major-version}}
        - uses: test/tw/ver-check
          with:
            bins: /kubeseal /opt/bitnami/sealed-secrets-kubeseal/bin/kubeseal /usr/local/bin/kubeseal
        - runs: |
            stat /opt/bitnami/sealed-secrets-kubeseal/bin/kubeseal
            stat /kubeseal
            stat /usr/local/bin/kubeseal

  # Bitnami compatibility package for controller component
  - name: ${{package.name}}-compat
    description: "compat package with bitnami/sealed-secrets-controller image"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: sealed-secrets-controller
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p ${{targets.contextdir}}/opt/bitnami/sealed-secrets-controller/bin/
          mkdir -p ${{targets.contextdir}}/usr/local/bin/
          ln -s /usr/bin/controller ${{targets.contextdir}}/usr/local/bin/controller
          ln -s /usr/bin/controller ${{targets.contextdir}}/opt/bitnami/sealed-secrets-controller/bin/controller
          ln -s /usr/bin/controller ${{targets.contextdir}}/controller
      - uses: iamguarded/finalize-compat
        with:
          package: sealed-secrets-controller
          version: ${{vars.major-version}}
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: sealed-secrets-controller
            version: ${{vars.major-version}}
        - uses: test/tw/ver-check
          with:
            bins: /controller /opt/bitnami/sealed-secrets-controller/bin/controller /usr/local/bin/controller
        - runs: |
            set -euo pipefail
            stat /opt/bitnami/sealed-secrets-controller/bin/controller
            stat /controller
            stat /usr/local/bin/controller

update:
  enabled: true
  github:
    identifier: bitnami-labs/sealed-secrets
    strip-prefix: v
  ignore-regex-patterns:
    - ^helm-v.*

# only passes with docker runner
# MELANGE_EXTRA_OPTS="--runner docker" make test/sealed-secrets
test:
  environment:
    contents:
      packages:
        - ${{package.name}}-kubeseal
        - ${{package.name}}
        - curl
        - yq
    environment:
      KUBERNETES_SERVICE_HOST: "127.0.0.1"
      KUBERNETES_SERVICE_PORT: 32764
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: controller
    - uses: test/tw/help-check
      with:
        bins: controller
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - uses: test/daemon-check-output
      with:
        start: /usr/bin/controller
        setup: |
          set -euo pipefail
          # Setup the roles and clusterroles needed to run sealed secrets
          kubectl create -f ./sealedsecrets_crd.yaml
          kubectl create role secrets-admin --verb=get,list,watch,create,update,patch --resource=secrets
          kubectl create clusterrole secrets-admin --verb=get,list,watch,update --resource=secrets,sealedsecrets
          kubectl patch clusterrole secrets-admin --type=json  --patch-file='role_patch.json'
          kubectl create rolebinding default-secrets-admin-binding --role=secrets-admin --serviceaccount=default:default
          kubectl create clusterrolebinding default-secrets-admin-binding --clusterrole=secrets-admin --serviceaccount=default:default
        timeout: 30
        expected_output: |
          Starting sealed-secrets controller
          Searching for existing private keys
          New key written
          HTTP server serving
          HTTP metrics server serving
    - runs: |
        set -euo pipefail
        # Run sealed secrets and extract the key and certs
        nohup /usr/bin/controller >/dev/null 2>&1 &
        curl --retry 10 --retry-all-errors --retry-delay 2 http://localhost:8080/v1/cert.pem > mycert.pem
        kubectl get secret -lsealedsecrets.bitnami.com/sealed-secrets-key=active -o jsonpath='{.items[].data.tls\.key}' | base64 -d > sealed.key
    - name: Use the cert to seal a secret with kubeseal and verify they don't differ
      runs: |
        set -euo pipefail
        # Created a sealed secret in K8s, extract the unsealed secret in k8s, and compare to original
        kubeseal --cert mycert.pem < secret.yaml -o yaml> sealed-secret.yaml
        kubectl create --namespace default -f ./sealed-secret.yaml
        sleep 2 # wait for secret to be available
        kubectl get secret mysecret -o yaml > k8s_secret.yaml
        yq '{"api-key": .data.api-key, "password": .data.password}' secret.yaml > /tmp/original_secret_values.yaml
        yq '{"api-key": .data.api-key, "password": .data.password}' k8s_secret.yaml > /tmp/unsealed_secret_values.yaml
        diff /tmp/original_secret_values.yaml /tmp/unsealed_secret_values.yaml

environment:
  contents:
    packages:
      - go-fips-1.25
