package:
  name: prometheus-statsd-exporter
  version: 0.28.0
  epoch: 15 # GHSA-j5w8-q4qc-rx2x
  description: StatsD exporter for Prometheus
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - build-base
      - curl
      - go
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/statsd_exporter
      expected-commit: c0a390a2c43f77863278615b47d46e886bdca726
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        golang.org/x/crypto@v0.45.0

  - runs: |
      make common-build

  - runs: |
      sed -i '/_ "net\/http\/pprof"/d' main.go
      git diff

  - runs: |
      install -Dm755 statsd_exporter "${{targets.destdir}}"/usr/bin/statsd_exporter

  - uses: strip

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    description: "compat package for iamguarded"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: ${{package.name}}
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /opt/iamguarded/statsd-exporter/bin
          ln -s /usr/bin/statsd_exporter /opt/iamguarded/statsd-exporter/bin/statsd_exporter
      - uses: iamguarded/finalize-compat
        with:
          package: ${{package.name}}
          version: ${{vars.major-version}}
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: ${{package.name}}
            version: ${{vars.major-version}}
        - runs: |
            run-script --version
            run-script --help

update:
  enabled: true
  github:
    identifier: prometheus/statsd_exporter
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - netcat-openbsd
        - curl
        - wait-for-it
  pipeline:
    # AUTOGENERATED
    - name: "Verify binary and version"
      runs: |
        statsd_exporter --version
        statsd_exporter --help
    - name: "Test statsd_exporter basic functionality"
      uses: test/daemon-check-output
      with:
        start: statsd_exporter --statsd.listen-udp=:9125 --web.listen-address=:9102
        timeout: 10
        expected_output: |
          Starting StatsD -> Prometheus Exporter
          Accepting StatsD Traffic
          Accepting Prometheus Requests
        post: |
          wait-for-it 127.0.0.1:9102 -t 10

          # Send a test StatsD metric
          echo "example.metric:1|c" | nc -u -w0 127.0.0.1 9125

          # Short wait for processing
          sleep 2

          # Check that metric shows up in Prometheus endpoint
          curl -sf http://127.0.0.1:9102/metrics | grep "example_metric"
