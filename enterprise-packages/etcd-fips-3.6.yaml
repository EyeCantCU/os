package:
  name: etcd-fips-3.6
  version: "3.6.4"
  epoch: 0
  description: A highly-available key value store for shared configuration and service discovery.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - glibc
    provides:
      - etcd-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - git
      - go-msft-1.24
      - openssl-config-fipshardened

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/etcd-io/etcd
      tag: v${{package.version}}
      expected-commit: 5400cdc39b829ee5dadacb77002256cf86357da1

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      modroot: ./etcdctl
      output: etcdctl
      ldflags: "-X go.etcd.io/etcd/api/v3/version.GitSHA=$(git rev-parse HEAD)"

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      modroot: ./etcdctl
      output: etcdutl
      ldflags: "-X go.etcd.io/etcd/api/v3/version.GitSHA=$(git rev-parse HEAD)"

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      modroot: ./server
      output: etcd
      ldflags: "-X go.etcd.io/etcd/api/v3/version.GitSHA=$(git rev-parse HEAD)"

  - runs: |
      mkdir -p "${{targets.destdir}}"/var/lib/${{package.name}}
      chmod 700 "${{targets.destdir}}"/var/lib/${{package.name}}

update:
  enabled: true
  github:
    identifier: etcd-io/etcd
    strip-prefix: v
    tag-filter-prefix: v3.6
    use-tag: true

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        etcd --help
        etcdctl version
        etcdctl --help
        etcdutl version
        etcdutl --help
    - name: Verify etcd version
      runs: |
        etcd --version | grep "etcd Version: 3.6"
    - name: Start etcd server and perform health check
      runs: |
        # Start etcd in the background
        etcd &
        ETCD_PID=$!
        sleep 5 # Wait for etcd to start
        # Perform a health check
        etcdctl endpoint health
        kill $ETCD_PID
    - name: Set and get a key-value pair
      runs: |
        etcd &
        ETCD_PID=$!
        sleep 5 # Wait for etcd to start
        # Set a key-value pair
        etcdctl put mykey "Hello, etcd"
        # Get the value
        etcdctl get mykey | grep -q "Hello, etcd"
        kill $ETCD_PID
