package:
  name: chart-certmanager-cert-manager-1.17
  version: "1.17.4"
  epoch: 0
  description: A Helm chart for cert-manager
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - busybox
      - curl
      - helm
      - make
      - rsync
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/cert-manager
      tag: v${{package.version}}
      expected-commit: 3f1f3b101850152851e2c5be09a29866bb8c1e15

  # Use upstream's make target to build the helm chart
  # Override tools and their NEEDS_ prerequisites to use our packaged versions
  - runs: |
      make helm-chart VERSION=v${{package.version}} \
        HELM=/usr/bin/helm YQ=/usr/bin/yq \
        NEEDS_HELM= NEEDS_YQ=

  # Uncomment image override fields in values.yaml. The chart has these
  # commented out with example values, but the templates support them and they
  # default to the uncommented values.
  - runs: |
      values="_bin/helm/cert-manager/values.yaml"

      # Add tag and digest fields to each image section (they're commented out upstream)
      for path in ".image" ".webhook.image" ".cainjector.image" ".acmesolver.image" ".startupapicheck.image"; do
        yq -i "${path}.tag = \"\"" "$values"
        yq -i "${path}.digest = \"\"" "$values"
      done

  - uses: charts/package
    with:
      chart-path: _bin/helm/cert-manager
      chart-version: v${{package.version}}
      images: |
        controller:
          values:
            image:
              repository: ${registry_repo}
              tag: ${tag}
              digest: ${digest}
        webhook:
          values:
            webhook:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
        cainjector:
          values:
            cainjector:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
        acmesolver:
          values:
            acmesolver:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
        startupapicheck:
          values:
            startupapicheck:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
      test: |
        values:
          global:
            imagePullSecrets:
              - name: pull-secret
        cases:
          - name: default
            images: [controller, webhook, cainjector, acmesolver, startupapicheck]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: cert-manager/cert-manager
    strip-prefix: v
    use-tag: true
    tag-filter: v1.17.
