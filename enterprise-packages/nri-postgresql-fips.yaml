package:
  name: nri-postgresql-fips
  version: "2.23.0"
  epoch: 1 # CVE-2025-61726
  description: New Relic Infrastructure postgresql Integration (FIPS)
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-postgresql
      expected-commit: 34d788922814f2925c0b2125feb1cec821d2cfc0
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-postgresql
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-postgresql ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-postgresql
          install -Dm644 legacy/postgresql-definition.yml ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/postgresql-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-postgresql
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-postgresql
    - uses: test/tw/ver-check
      with:
        bins: nri-postgresql
        version-flag: "-show_version"
    - name: Test binary execution
      uses: test/daemon-check-output
      with:
        start: |
          nri-postgresql -username=xyz -password=xyz
        expected_output: |
          com.newrelic.postgresql
          protocol_version
          integration_version
        error_strings: |
          FAIL
          Traceback.*most.recent.call
