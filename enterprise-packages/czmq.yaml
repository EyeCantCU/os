package:
  name: czmq
  version: 4.2.1
  epoch: 0
  description: High-level C binding for ZeroMQ
  copyright:
    - license: MPL-2.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - libtool
      - pkgconf
      - zeromq-dev

pipeline:
  - uses: fetch
    with:
      expected-sha256: 5d720a204c2a58645d6f7643af15d563a712dad98c9d32c1ed913377daa6ac39
      uri: https://github.com/zeromq/czmq/releases/download/v${{package.version}}/czmq-${{package.version}}.tar.gz

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers and libraries
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      environment:
        contents:
          packages:
            - czmq-dev
            - gcc
            - glibc-dev
            - pkgconf
            - zeromq-dev
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}
        - name: Compile and run basic czmq program
          runs: |
            set -euo pipefail
            # word splitting is intentional for compiler flags
            gcc -o test_czmq test_czmq.c $(pkg-config --cflags --libs libczmq)
            ./test_czmq | grep -F "CZMQ version:"

update:
  enabled: true
  github:
    identifier: zeromq/czmq
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test zmakecert creates CURVE certificates
      runs: |
        set -euo pipefail
        cd "$(mktemp -d)"
        # zmakecert prompts for name, email, and organization; provide empty lines
        printf '\n\n\n' | zmakecert testcert
        stat testcert
        stat testcert_secret
