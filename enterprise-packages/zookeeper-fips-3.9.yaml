package:
  name: zookeeper-fips-3.9
  version: "3.9.4"
  epoch: 4
  description: Distributed, highly available, robust, fault-tolerant system for distributed coordination
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash # some helper scripts use bash
      - bcfips-policy-140-3-j17
      - grep
      - openjdk-17-default-jvm
      - openssl-config-fipshardened
      - procps
      - sed
      - xmlstarlet
    provides:
      - zookeeper-fips=${{package.full-version}}
      - ${{package.name}}-policy-140-3=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - bcfips-policy-140-3-j17
      - bouncycastle-fips~2.1
      - busybox
      - ca-certificates-bundle
      - curl
      - maven
      - openjdk-17-default-jdk
  environment:
    LANG: en_US.UTF-8
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/zookeeper
      tag: release-${{package.version}}
      expected-commit: 7246445ec281f3dbf53dc54e970c914f39713903

  - uses: maven/pombump
    with:
      properties-file: pombump-properties.yaml
      pom: pom.xml

  - runs: |
      # Patch netty version for CVE-2023-4586 CVE-2023-44487
      # -Dnetty.version=4.1.108.Final
      # Patch commons-io version GHSA-78wr-2p64-hpwj/CVE-2024-47554
      # -Dcommons-io.version=2.14.0 moved from 2.11.0 https://github.com/apache/zookeeper/blob/release-3.9.2/pom.xml#L574C5-L574C52
      mvn install -DskipTests -Dnetty.version=4.1.125.Final -Dcommons-io.version=2.14.0
      tar -xf zookeeper-assembly/target/apache-zookeeper-${{package.version}}-bin.tar.gz
      # Create necessary directories
      mkdir -p ${{targets.destdir}}/usr/share/java/zookeeper
      mkdir -p ${{targets.destdir}}/usr/share/java/zookeeper/conf
      mkdir -p ${{targets.destdir}}/usr/share/java/zookeeper/logs
      # Cleanup Windows files
      rm -rf apache-zookeeper-${{package.version}}-bin/bin/*.cmd
      # Install Zookeeper
      mv apache-zookeeper-${{package.version}}-bin/bin ${{targets.destdir}}/usr/share/java/zookeeper
      mv apache-zookeeper-${{package.version}}-bin/lib ${{targets.destdir}}/usr/share/java/zookeeper
      mv apache-zookeeper-${{package.version}}-bin/conf ${{targets.destdir}}/

      # Load bcfips
      ln -sf /usr/share/java/bouncycastle-fips/*.jar ${{targets.destdir}}/usr/share/java/zookeeper/lib/

subpackages:
  - name: ${{package.name}}-compat
    description: "Compat compat for official zookeeper image"
    dependencies:
      provides:
        - zookeeper-compat-fips=${{package.full-version}}
      runtime:
        - ca-certificates-bundle
        - bash
        - coreutils
        - gosu-fips
        - glibc-locale-en
        - netcat-openbsd
    pipeline:
      - name: "Symlinks as per upstream"
        runs: |
          # Create necessary directories as per upstream packaging
          mkdir -p ${{targets.subpkgdir}}/apache-zookeeper-${{package.version}}-bin
          ln -sf /usr/share/java/zookeeper/bin ${{targets.subpkgdir}}/apache-zookeeper-${{package.version}}-bin
          ln -sf /usr/share/java/zookeeper/lib ${{targets.subpkgdir}}/apache-zookeeper-${{package.version}}-bin
          ln -sf /usr/share/java/zookeeper/conf ${{targets.subpkgdir}}/apache-zookeeper-${{package.version}}-bin
      - uses: git-checkout
        with:
          repository: https://github.com/31z4/zookeeper-docker
          branch: master
      - name: "Copy entrypoints/Drift check"
        runs: |
          # If the directory doesn't exist, this means the current zookeeper package is released in upstream but the Docker image release is still pending.
          install -Dm755 ${{package.version}}/docker-entrypoint.sh ${{targets.subpkgdir}}/docker-entrypoint.sh
      - runs: |
          # Add needed directories
          mkdir -p ${{targets.subpkgdir}}/data
          mkdir -p ${{targets.subpkgdir}}/datalog
          mkdir -p ${{targets.subpkgdir}}/logs
    test:
      environment:
        contents:
          packages:
            - zookeeper-fips=${{package.full-version}}
            - openjdk-17-default-jdk
            - wait-for-it
            - uuidgen
        environment:
          LANG: en_US.UTF-8
          JAVA_HOME: "/usr/lib/jvm/java-17-openjdk"
          JDK_JAVA_OPTIONS: "-Djavax.net.ssl.trustStoreType=BCFKS"
          ZK_HOME: "/apache-zookeeper-${{package.version}}-bin"
      pipeline:
        - runs: |
            stat /docker-entrypoint.sh
            test -x /docker-entrypoint.sh
        - runs: |
            set -euo pipefail

            # Go to installed dir
            cd "${ZK_HOME}"

            # Use sample config
            cp ../conf/zoo_sample.cfg conf/zoo.cfg

            # Start Zookeeper
            bin/zkServer.sh start-foreground > /dev/null 2>&1 &

            # Grab PID
            ZOOKEEPER_PID=$!

            # wait for server
            wait-for-it localhost:2181

            # Start the CLI and check output (fails test if "Welcome to ZooKeeper!" not found)
            bin/zkCli.sh | grep -F "Welcome to ZooKeeper!"

            # Create a node
            bin/zkCli.sh create /test-$(uuidgen) "$(uuidgen)"

            # Kill Zookeeper
            kill "${ZOOKEEPER_PID}"
        - runs: |
            # Installing openjdk-17-default-jvm currently overwrites some files in
            # openjdk-17, breaking javac execution which is required by
            # java-fips/algorithms; fix the package here (ignoring spurious
            # permissions errors), and check javac executes
            apk fix openjdk-17 || false
            /usr/lib/jvm/java-17-openjdk/bin/javac --version
        - uses: java-fips/algorithms
          with:
            java-version: 17

test:
  environment:
    contents:
      packages:
        - curl
        - jq
        - openjdk-17-default-jdk
        - uuidgen
        - wait-for-it
        - zookeeper-fips=${{package.full-version}}
    environment:
      LANG: en_US.UTF-8
      JAVA_HOME: "/usr/lib/jvm/java-17-openjdk"
      PASS: "ZookeeperSSLTest123!"
      ZK_ADMIN_PORT: "8080"
      ZK_CLIENT_PORT: "2183"
      ZK_DATA_DIR: "/tmp/zk-data-tls"
      ZK_PLAIN_PORT: "2181"
      ZK_SECURE_PORT: "2182"
      ZK_TLS_CONF_DIR: "/tmp/zoo-tls-conf"
      ZK_TLS_DIR: "/tmp/zk-tls"
      CLASSPATH: "/usr/share/java/bouncycastle-fips/*:./*:."
      JAVA_TOOL_OPTIONS: "--module-path=/usr/share/java/bouncycastle-fips"
      JDK_JAVA_OPTIONS: "-Djavax.net.ssl.trustStore=/tmp/zk-tls/truststore.bcfks -Djavax.net.ssl.trustStoreType=BCFKS -Djavax.net.ssl.trustStorePassword=ZookeeperSSLTest123!"
      ZK_HOME: "/usr/share/java/zookeeper"
  pipeline:
    - name: "Generate FIPS KeyStore and TrustStore"
      runs: |
        mkdir -p "${ZK_TLS_DIR}"

        # CA keypair (BCFKS)
        keytool -v \
          -keystore ${ZK_TLS_DIR}/ca.bcfks \
          -storetype BCFKS -providername BCFIPS \
          -alias zookeeper-ca \
          -genkeypair -keyalg RSA -keysize 3072 -sigalg SHA256withRSA \
          -dname "CN=ZooKeeper Test CA" \
          -ext bc=ca:true -ext keyUsage=keyCertSign,cRLSign \
          -storepass "${PASS}" -keypass "${PASS}" -validity 3650

        # Export CA cert
        keytool -v \
          -keystore ${ZK_TLS_DIR}/ca.bcfks \
          -storetype BCFKS -providername BCFIPS \
          -alias zookeeper-ca -exportcert -rfc \
          -storepass "${PASS}" \
          -file ${ZK_TLS_DIR}/zookeeper-ca.crt

        # Server keypair (BCFKS)
        keytool -v \
          -keystore ${ZK_TLS_DIR}/zookeeper-keystore.bcfks \
          -storetype BCFKS -providername BCFIPS \
          -alias zookeeper-server \
          -genkeypair -keyalg RSA -keysize 2048 -sigalg SHA256withRSA \
          -dname "CN=localhost" \
          -ext san=dns:localhost \
          -ext eku=serverAuth \
          -ext keyUsage=digitalSignature,keyEncipherment \
          -storepass "${PASS}" -keypass "${PASS}" -validity 365

        # CSR
        keytool -v \
          -keystore ${ZK_TLS_DIR}/zookeeper-keystore.bcfks \
          -storetype BCFKS -providername BCFIPS \
          -alias zookeeper-server -certreq \
          -file ${ZK_TLS_DIR}/zookeeper-server.csr \
          -storepass "${PASS}"

        # CA signs the CSR → server leaf cert
        keytool -v \
          -keystore ${ZK_TLS_DIR}/ca.bcfks \
          -storetype BCFKS -providername BCFIPS \
          -alias zookeeper-ca -gencert \
          -infile ${ZK_TLS_DIR}/zookeeper-server.csr \
          -outfile ${ZK_TLS_DIR}/zookeeper-server.crt \
          -rfc \
          -ext eku=serverAuth \
          -ext san=dns:localhost \
          -ext keyUsage=digitalSignature,keyEncipherment \
          -storepass "${PASS}" -validity 365

        # Import CA cert (as trusted) into server keystore, then signed leaf
        keytool -v \
          -keystore ${ZK_TLS_DIR}/zookeeper-keystore.bcfks \
          -storetype BCFKS -providername BCFIPS \
          -alias zookeeper-ca -importcert -noprompt \
          -file ${ZK_TLS_DIR}/zookeeper-ca.crt \
          -storepass "${PASS}"

        keytool -v \
          -keystore ${ZK_TLS_DIR}/zookeeper-keystore.bcfks \
          -storetype BCFKS -providername BCFIPS \
          -alias zookeeper-server -importcert -noprompt \
          -file ${ZK_TLS_DIR}/zookeeper-server.crt \
          -storepass "${PASS}"

        # Convert JDK cacerts (JKS) → BCFKS truststore
        keytool -importkeystore \
          -srckeystore "${JAVA_HOME}/lib/security/cacerts" \
          -srcstoretype JKS -srcstorepass changeit \
          -destkeystore ${ZK_TLS_DIR}/truststore.bcfks \
          -deststoretype BCFKS -destprovidername BCFIPS \
          -deststorepass "${PASS}"

        # Also trust our internal test CA
        keytool \
          -keystore ${ZK_TLS_DIR}/truststore.bcfks \
          -storetype BCFKS -providername BCFIPS \
          -storepass "${PASS}" \
          -importcert -alias zookeeper-ca \
          -file ${ZK_TLS_DIR}/zookeeper-ca.crt -noprompt
    - runs: |
        set -euo pipefail

        # Go to installed dir
        cd "${ZK_HOME}"

        # Use sample config
        cp /conf/zoo_sample.cfg conf/zoo.cfg

        # Start Zookeeper
        bin/zkServer.sh start-foreground > /dev/null 2>&1 &

        # Grab PID
        ZOOKEEPER_PID=$!

        # wait for server
        wait-for-it "localhost:${ZK_PLAIN_PORT}"

        # Start the CLI and check output (fails test if "Welcome to ZooKeeper!" not found)
        bin/zkCli.sh | grep -F "Welcome to ZooKeeper!"

        # Create a node
        bin/zkCli.sh create /test-$(uuidgen) "$(uuidgen)"

        # Kill Zookeeper
        kill "${ZOOKEEPER_PID}"
    - name: "Test ZooKeeper with TLS/SSL (FIPS BCFKS)"
      uses: test/daemon-check-output
      with:
        setup: |-
          mkdir -p "${ZK_TLS_CONF_DIR}" "${ZK_DATA_DIR}"
          tee "${ZK_TLS_CONF_DIR}/zoo.cfg" << EOF
          dataDir=${ZK_DATA_DIR}
          clientPort=${ZK_CLIENT_PORT}
          secureClientPort=${ZK_SECURE_PORT}
          serverCnxnFactory=org.apache.zookeeper.server.NettyServerCnxnFactory
          ssl.keyStore.location=${ZK_TLS_DIR}/zookeeper-keystore.bcfks
          ssl.keyStore.password=${PASS}
          ssl.keyStore.type=BCFKS
          ssl.trustStore.location=${ZK_TLS_DIR}/truststore.bcfks
          ssl.trustStore.password=${PASS}
          ssl.trustStore.type=BCFKS
          ssl.protocol=TLSv1.2
          ssl.clientAuth=none
          admin.forceHttps=true
          ssl.quorum.keyStore.location=${ZK_TLS_DIR}/zookeeper-keystore.bcfks
          ssl.quorum.keyStore.password=${PASS}
          ssl.quorum.keyStore.type=BCFKS
          ssl.quorum.trustStore.location=${ZK_TLS_DIR}/truststore.bcfks
          ssl.quorum.trustStore.password=${PASS}
          ssl.quorum.trustStore.type=BCFKS
          EOF
        start: |
          env ZOOCFGDIR="${ZK_TLS_CONF_DIR}" "${ZK_HOME}/bin/zkServer.sh" start-foreground
        expected_output: |
          PrepRequestProcessor (sid:0) started
        timeout: 60
        post: |-
          set -euo pipefail
          wait-for-it "localhost:${ZK_SECURE_PORT}"
          export CLIENT_JVMFLAGS="-Dzookeeper.clientCnxnSocket=org.apache.zookeeper.ClientCnxnSocketNetty -Dzookeeper.ssl.trustStore.location=${ZK_TLS_DIR}/truststore.bcfks -Dzookeeper.ssl.trustStore.password=${PASS} -Dzookeeper.ssl.trustStore.type=BCFKS -Dzookeeper.client.secure=true"
          "${ZK_HOME}/bin/zkCli.sh" -server "localhost:${ZK_SECURE_PORT}" | grep -F "Welcome to ZooKeeper!"
          wait-for-it -t 30 "localhost:${ZK_ADMIN_PORT}"
          curl -fsSL --cacert "${ZK_TLS_DIR}/zookeeper-ca.crt" "https://localhost:${ZK_ADMIN_PORT}/commands/ruok" | jq -e '.command == "ruok" and .error == null'

update:
  enabled: true
  ignore-regex-patterns:
    - "-\\d+$"
  github:
    tag-filter: release-3.9.
    identifier: apache/zookeeper
    strip-prefix: release-
    use-tag: true
