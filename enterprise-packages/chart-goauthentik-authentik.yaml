package:
  name: chart-goauthentik-authentik
  version: "2025.12.4"
  epoch: 0
  description: authentik is an open-source Identity Provider focused on flexibility and versatility
  copyright:
    - license: GPL-3.0-only

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/goauthentik/helm
      tag: authentik-${{package.version}}
      expected-commit: 0ba77abf75e0a92b58272507fee922a7ec12e53f

  # Fetch and extract subcharts so charts/package can vendor them via file:// paths.
  # The subchart tgz files are gitignored upstream, so we fetch them with helm.
  - runs: |
      cd charts/authentik
      helm dependency build .
      for tgz in charts/*.tgz; do
        tar xzf "$tgz" -C /
      done
      rm -f charts/*.tgz

  - uses: charts/package
    with:
      chart-path: charts/authentik
      images: |
        authentik-server:
          values:
            global:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
        geoip:
          values:
            geoip:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
      test: |
        values:
          # Disable subcharts for testing
          postgresql:
            enabled: false
          serviceAccount:
            create: false
        cases:
          - name: default
            images: [authentik-server]
          - name: with-geoip
            images: [authentik-server, geoip]
            values:
              geoip:
                enabled: true
                accountId: "123456"
                licenseKey: "test-license-key"

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: goauthentik/helm
    strip-prefix: authentik-
    use-tag: true
    tag-filter-prefix: authentik-20
