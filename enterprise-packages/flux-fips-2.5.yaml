package:
  name: flux-fips-2.5
  version: "2.5.1"
  epoch: 18 # GHSA-37cx-329c-33x3
  description: Open and extensible continuous delivery solution for Kubernetes. Powered by GitOps Toolkit.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - flux-fips=${{package.full-version}}
  resources:
    cpu: "9"
    memory: 16Gi

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - git
      - go-fips
      - kustomize-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8d5f40dca5aa5d3c0fc3414457dda15a0ac92fa4
      repository: https://github.com/fluxcd/flux2
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/cloudflare/circl@v1.6.1
        golang.org/x/crypto@v0.45.0
        github.com/go-git/go-git/v5@v5.16.5
      modroot: tests/integration

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        github.com/golang-jwt/jwt/v4@v4.5.2
        github.com/golang-jwt/jwt/v5@v5.2.2
        golang.org/x/net@v0.38.0
        github.com/cloudflare/circl@v1.6.1
        helm.sh/helm/v3@v3.18.5
        golang.org/x/crypto@v0.45.0
        github.com/go-git/go-git/v5@v5.16.5

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/bin
      make cmd/flux/.manifests.done
      CGO_ENABLED=1 go build -ldflags="-w -X main.VERSION=${{package.version}}" -o ./bin/flux ./cmd/flux
      install -Dm755 bin/flux ${{targets.destdir}}/usr/bin/flux

  - uses: strip

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    dependencies:
      provides:
        - flux-fips-compat=${{package.full-version}}
    pipeline:
      - runs: |
          # The helm chart expects the flux binaries to be in /usr/local/bin instead of /usr/bin
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -sf /usr/bin/flux ${{targets.subpkgdir}}/usr/local/bin/flux
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - name: Verify symlink exists and is functional
          runs: |
            set -euo pipefail
            # Verify symlink exists and points to correct target (fails test if symlink broken)
            readlink -v /usr/local/bin/flux
            # Verify symlink is functional by generating manifests through the compat path (fails test if broken)
            /usr/local/bin/flux install --export > /tmp/flux-compat-test.yaml
            # Verify output was generated (fails test if empty or malformed)
            grep -F "kind:" /tmp/flux-compat-test.yaml

update:
  enabled: true
  github:
    identifier: fluxcd/flux2
    strip-prefix: v
    tag-filter: v2.5.

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-compat
  pipeline:
    # FIPS check must be first for Go FIPS packages
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: flux
    - uses: test/tw/help-check
      with:
        bins: flux
    - name: Test flux manifest generation
      runs: |-
        set -euo pipefail
        # Test that flux can generate manifests (install command with export)
        flux install --export > /tmp/flux-manifests.yaml
        # Verify manifest file was created and has content (fails test if missing)
        stat /tmp/flux-manifests.yaml
        # Verify it contains expected Kubernetes resources (fails test if not found)
        grep -F "kind:" /tmp/flux-manifests.yaml
        grep -F "apiVersion:" /tmp/flux-manifests.yaml
