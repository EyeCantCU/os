package:
  name: perl-xml-sax
  version: "1.02"
  epoch: 1 # go/enterprise-rsc/perl-xml-sax
  description: Simple API for XML
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-xml-namespacesupport
      - perl-xml-sax-base
  resources:
    cpu: "5"
    memory: 1Gi

environment:
  contents:
    packages:
      - perl-xml-namespacesupport
      - perl-xml-sax-base

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/G/GR/GRANTM/XML-SAX-${{package.version}}.tar.gz
      expected-sha256: 4506c387043aa6a77b455f00f57409f3720aa7e553495ab2535263b4ed1ea12a

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install
    with:
      opts: "PERLLIB=blib/lib"

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 3534

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Smoke test
      runs: echo "use XML::SAX;" | perl
    - runs: |
        perl <<'EOF'
        use strict;
        use warnings;
        use XML::SAX;

        # Test that we can access the XML::SAX parser factory
        my $factory = XML::SAX::ParserFactory->new();
        die "Failed to create XML::SAX::ParserFactory" unless defined $factory;
        print "Created XML::SAX::ParserFactory\n";

        # Test that we can get a parser
        my $parser = eval { $factory->parser() };
        if ($@) {
            # It's ok if there's no parser registered yet
            print "No parser registered (expected): $@\n";
        } else {
            die "Failed to get parser" unless defined $parser;
            print "Got parser: " . ref($parser) . "\n";
        }

        # Test that XML::SAX loads successfully
        my $version = $XML::SAX::VERSION;
        die "Failed to get XML::SAX version" unless defined $version;
        print "XML::SAX version: $version\n";

        print "XML::SAX tests passed\n";
        EOF
