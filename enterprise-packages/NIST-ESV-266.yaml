#nolint:valid-pipeline-fetch-digest
package:
  # body-type-number
  name: NIST-ESV-266
  # v1 of nist meta-packages
  version: 1
  epoch: 3 # go/enterprise-rsc/NIST-ESV-266
  # Many SCA tools know how to read APK URL
  # URL to the certificate
  url: https://csrc.nist.gov/projects/cryptographic-module-validation-program/entropy-validations/certificate/266
  # Some tools use description
  # body, type, number, certificate name, standard
  description: "NIST ESV 266 Jentropy Engine (SP 800-90B) metapackage"
  copyright:
    # NIST information is all public
    - license: NIST-PD
  dependencies:
    runtime:
      - bouncycastle-rng-jent
  resources:
    cpu: "1"
    memory: 1Gi

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      # Note this URL will make it into package SPDX SBOM, and will also make it into APKO SBOM
      uri: https://csrc.nist.gov/projects/cryptographic-module-validation-program/entropy-validations/certificate/266
      # Unstable content, thus no expected checksum and hence the nolint too
      expected-none: true
      extract: false
      delete: true

test:
  pipeline:
    - uses: test/tw/metapackage

update:
  enabled: false
  exclude-reason: "This is an empty NIST certificate SBOM indicator"
