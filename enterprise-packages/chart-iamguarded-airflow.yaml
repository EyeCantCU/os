package:
  name: chart-iamguarded-airflow
  version: "25.1.0"
  epoch: 0
  description: Airflow iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common
      # airflow hardocoded dependency on postgresql chart version 16.x.x
      - chart-iamguarded-postgresql~16
      # airflow hardcoded dependency on redis chart version 22.x.x
      - chart-iamguarded-redis~22

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: airflow/${{package.version}}
      expected-commit: c58edb88cb9f39ae12bc06a507050c00b7b1c8cd

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: patch
    with:
      patches: values.patch

  - uses: patch
    with:
      patches: readme.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/airflow

  - uses: charts/package
    with:
      chart-path: iamguarded/airflow

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: airflow/
    use-tag: true
    tag-filter-prefix: airflow/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /airflow
