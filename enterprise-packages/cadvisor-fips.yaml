package:
  name: cadvisor-fips
  version: "0.56.2"
  epoch: 3 # CVE-2025-68121
  description: Analyzes resource usage and performance characteristics of running containers.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
  environment:
    CGO_ENABLED: "1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google/cadvisor
      tag: v${{package.version}}
      expected-commit: 7cbdee9260c4292d5d27d00416ce8a7dc1dc12a0

  - runs: |
      ./build/build.sh

  - runs: |
      install -Dm755 _output/cadvisor "${{targets.destdir}}"/usr/bin/cadvisor

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: cadvisor
    - uses: test/tw/ver-check
      with:
        bins: cadvisor

update:
  enabled: true
  github:
    identifier: google/cadvisor
    strip-prefix: v
    tag-filter: v
