package:
  name: onnxruntime-cuda-12.9
  version: 1.22.2
  epoch: 5
  description: Cross-platform, high performance ML inferencing and training accelerator
  copyright:
    - license: MIT
  options:
    no-depends: true
  resources:
    cpu: 80
    memory: 128Gi
  dependencies:
    replaces:
      # this package is literally just an extension for provider_cuda and provider_tensorrt, other `.so` files should be compatible, including headers
      - onnxruntime
    runtime:
      - abseil-cpp
      - cuda-toolkit-${{vars.cuda_version}}
      - libprotobuf-lite
      - nvidia-cudnn-${{vars.cudnn_version}}-cuda-${{vars.cuda_major_version}}
      - nvidia-nccl-cuda-${{vars.cuda_version}}
      - openvino
      - re2
      - tensorrt-cuda-${{vars.cuda_major_version}}

vars:
  cudnn_version: 9

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda_version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.\d+$'
    replace: '$1'
    to: cuda_major_version

environment:
  contents:
    packages:
      - abseil-cpp-dev
      - build-base
      - busybox
      - cuda-toolkit-${{vars.cuda_version}}-dev
      - eigen-dev
      - nvidia-cuda-cccl-${{vars.cuda_version}}
      - nvidia-cuda-nvcc-gcc-${{vars.cuda_version}}
      - nvidia-cudnn-${{vars.cudnn_version}}-cuda-${{vars.cuda_major_version}}-dev
      - nvidia-nccl-cuda-${{vars.cuda_version}}-dev
      - openvino
      - openvino-dev
      - patch
      - protobuf
      - protobuf-dev
      - py3-build-base-dev
      - py3-numpy-2.2
      - python3
      - re2-dev
      - tensorrt-cuda-${{vars.cuda_major_version}}
      - tensorrt-cuda-${{vars.cuda_major_version}}-dev
      - zlib-dev
  environment:
    # This seems to be required to compile `abseil`
    # FIXME: remove this eventually
    CXXFLAGS: "-fdelete-null-pointer-checks"
    # Necessary to find CUDA headers
    CPATH: /usr/local/cuda-${{vars.cuda_version}}/include:$CPATH

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/microsoft/onnxruntime.git
      tag: v${{package.version}}
      expected-commit: 5630b081cd25e4eccc7516a652ff956e51676794

  # Enable proper handling for TensorRT 10.13+
  - uses: patch
    with:
      patches: 24832.patch

  - runs: |
      # Find system abseil-cpp
      sed 's|ABSL_PATCH_COMMAND}|&\n\ \ \ \ \FIND_PACKAGE_ARGS NAMES absl|g' \
        -i cmake/external/abseil-cpp.cmake

      # Allow building with GCC 15, FIXME: remove this from this package
      # This line got fixed on https://github.com/microsoft/onnxruntime/commit/f7619dc93f592ddfc10f12f7145f9781299163a0
      sed -i 's|#include <unordered_set>|&\n#include <cstdint>|' onnxruntime/core/optimizer/transpose_optimization/optimizer_api.h

  - uses: cmake/configure
    environment:
      # Variables from `build.py`, update according to
      ORT_TENSORRT_MAX_WORKSPACE_SIZE: 1073741824
      ORT_TENSORRT_MAX_PARTITION_ITERATIONS: 1000
      ORT_TENSORRT_MIN_SUBGRAPH_SIZE: 1
      ORT_TENSORRT_FP16_ENABLE: 0
      TENSORRT_HOME: /usr/local/tensorrt
    with:
      output-dir: build
      opts: |
        -Wno-dev \
        --compile-no-warning-as-error \
        -S cmake \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DCMAKE_BUILD_TYPE=None \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -Donnxruntime_ENABLE_PYTHON=OFF \
        -Donnxruntime_BUILD_SHARED_LIB=ON \
        -Donnxruntime_BUILD_UNIT_TESTS=OFF \
        -DBUILD_TESTING=OFF \
        -Donnxruntime_ENABLE_TRAINING=ON \
        -Donnxruntime_ENABLE_LAZY_TENSOR=OFF \
        -Donnxruntime_USE_MPI=ON \
        -Donnxruntime_USE_DNNL=OFF \
        -Donnxruntime_USE_PREINSTALLED_EIGEN=ON \
        -DCMAKE_CXX_STANDARD=17 \
        -Donnxruntime_USE_OPENVINO=ON \
        -Donnxruntime_USE_OPENVINO_GPU=ON \
        -Donnxruntime_USE_OPENVINO_CPU=ON \
        -Donnxruntime_USE_OPENVINO_NPU=ON \
        -DCMAKE_CUDA_STANDARD_REQUIRED=ON \
        -DCMAKE_CXX_STANDARD_REQUIRED=ON \
        -Donnxruntime_NVCC_THREADS=1 \
        -Donnxruntime_USE_CUDA=ON \
        -Donnxruntime_USE_NCCL=ON \
        -Donnxruntime_CUDA_HOME=/usr/local/cuda-${{vars.cuda_version}} \
        -Donnxruntime_CUDNN_HOME=/usr/local/cudnn-${{vars.cudnn_version}} \
        -DCMAKE_CUDA_ARCHITECTURES="52-real;53-real;60-real;61-real;62-real;70-real;72-real;75-real;80-real;86-real;87-real;89-real;90-real;90-virtual" \
        -DCMAKE_CUDA_COMPILER=/usr/local/cuda-${{vars.cuda_version}}/bin/nvcc \
        -Donnxruntime_USE_TENSORRT=ON \
        -Donnxruntime_TENSORRT_HOME=/usr/local/tensorrt \
        -Donnxruntime_USE_TENSORRT_BUILTIN_PARSER=ON

  - uses: cmake/build
    with:
      output-dir: build

  - working-directory: build/_deps
    runs: |
      install -Dpm0644 -t ./date-build/ date-subbuild/cmake_install.cmake
      install -Dpm0644 -t ./cxxopts-build/ cxxopts-subbuild/cmake_install.cmake

  - uses: cmake/install
    with:
      output-dir: build

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development libraries
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/pkgconf

update:
  enabled: true
  github:
    identifier: microsoft/onnxruntime
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - ${{package.name}}
        - onnxruntime-dev
        - build-base
  pipeline:
    - uses: test/tw/ldd-check
    - name: Ensure libraries link and are functional
      runs: |
        set -o pipefail
        tee orttest.cpp <<'EOF'
        #include <iostream>
        #include "onnxruntime_cxx_api.h"
        int main(){
          auto providers = Ort::GetAvailableProviders();
          for (auto provider : providers) {
            std::cout << provider << std::endl;
          }
          std::cout <<  Ort::GetVersionString() << std::endl;
          return 0;
        }
        EOF
        c++ orttest.cpp -o ort_version $(pkgconf --libs libonnxruntime) $(pkgconf --cflags libonnxruntime)
        ldd ./ort_version | grep -F -e "libonnxruntime"
        # No GPU support required since we are in a testing environment
        ./ort_version | grep -F -e "${{package.version}}" -e "CPU" -e "GPU"
