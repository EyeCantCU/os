package:
  name: newrelic-fluent-bit-output-fips
  version: "3.3.0"
  epoch: 1 # CVE-2025-61728
  description: A Fluent Bit output plugin that sends logs to New Relic
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - libpq # New Relic Fluent Bit plugin depends on libpq at runtime otherwise it will fail with "libpq.so.5: cannot open shared object file: No such file or directory"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/newrelic-fluent-bit-output
      tag: v${{package.version}}
      expected-commit: da5dee699d5429c14e57db3791254a3abbc253f0

  - uses: go/bump
    with:
      deps: |-
        github.com/sirupsen/logrus@v1.9.3

  - uses: go/build
    with:
      output: out_newrelic.so
      buildmode: c-shared
      packages: .
      go-package: go-fips

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/fluent-bit/bin/
          # The upstream chart expects the fluent-bit binary to be in /fluent-bit/bin/fluent-bit
          ln -sf /usr/bin/out_newrelic.so ${{targets.contextdir}}/fluent-bit/bin/out_newrelic.so
          ln -sf /usr/bin/fluent-bit ${{targets.contextdir}}/fluent-bit/bin/fluent-bit
    test:
      environment:
        contents:
          packages:
            - fluent-bit
            - ${{package.name}}
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

update:
  enabled: true
  ignore-regex-patterns:
    - "-beta"
  github:
    identifier: newrelic/newrelic-fluent-bit-output
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  environment:
    contents:
      packages:
        - fluent-bit
        - fluent-bit-compat
        - procps
        - ${{package.name}}-compat
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ldd-check
    - name: "Verify plugin binary exists"
      runs: |
        set -euo pipefail
        PLUGIN_PATH="/fluent-bit/bin/out_newrelic.so"
        test -f "$PLUGIN_PATH"
    - name: "Verify plugin loads in fluent-bit"
      runs: |
        set -euo pipefail
        mkdir -p /tmp/fluent-bit-test

        # Create a basic config that loads the plugin
        cat > /tmp/fluent-bit-test/test-load.conf <<EOF
        [SERVICE]
            Flush        1
            Daemon       Off
            Log_Level    info

        [INPUT]
            Name   dummy
            Dummy  {"message": "test"}
            Rate   1

        [OUTPUT]
            Name   stdout
            Match  *
        EOF

        # Test that fluent-bit can load the plugin and check output
        timeout --preserve-status 3 fluent-bit -e /fluent-bit/bin/out_newrelic.so -c /tmp/fluent-bit-test/test-load.conf 2>&1 > output

        echo "=== OUTPUT: START ==="
        cat output
        echo "=== OUTPUT: END ==="

        # Verify plugin loaded successfully - check for either successful load message or no error
        if grep -Eq "(loaded.*plugin|registered|out_newrelic|Fluent Bit.*started)" output; then
          echo "SUCCESS: New Relic plugin loaded successfully"
        elif grep -Eq "(failed|error.*loading|cannot.*load|dlopen.*failed)" output; then
          echo "ERROR: Plugin failed to load"
          exit 1
        else
          # If fluent-bit started without errors, plugin loaded successfully
          echo "SUCCESS: Plugin loaded (fluent-bit started without errors)"
        fi
    - name: "Test plugin with mock New Relic endpoint"
      uses: test/daemon-check-output
      with:
        setup: |
          #!/bin/sh
          mkdir -p /tmp/fluent-bit-test
          # Create config with New Relic output
          cat > /tmp/fluent-bit-test/newrelic-test.conf <<EOF
          [SERVICE]
              Flush        1
              Daemon       Off
              Log_Level    debug

          [INPUT]
              Name   dummy
              Dummy  {"test": "message", "hostname": "test-host", "service": "test-service"}
              Rate   1
              Tag    test.logs

          [OUTPUT]
              Name   newrelic
              Match  *
              licenseKey  test_license_key_12345678901234567890123456789012
              endpoint    https://log-api.newrelic.com/log/v1
          EOF
        start: fluent-bit -e /fluent-bit/bin/out_newrelic.so -c /tmp/fluent-bit-test/newrelic-test.conf
        timeout: 10
        expected_output: |
          Fluent Bit
        post: |
          #!/bin/sh
          # Verify fluent-bit is running with the plugin
          pgrep -f "fluent-bit"
