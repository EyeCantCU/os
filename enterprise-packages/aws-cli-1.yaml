package:
  name: aws-cli-1
  version: "1.43.9"
  epoch: 0
  description: "Universal Command Line Interface for Amazon Web Services"
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '300'

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/aws/aws-cli/archive/${{package.version}}.tar.gz
      expected-sha256: 929a8fa498dc6828c05a93354e424d7df1a1ea9029bc08996bb4777ac4fb4afb

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{package.name}}
    description: ${{package.name}} for python${{range.key}}
    dependencies:
      runtime:
        - groff
        - py${{range.key}}-botocore
        - py${{range.key}}-colorama
        - py${{range.key}}-docutils
        - py${{range.key}}-jmespath
        - py${{range.key}}-rsa
        - py${{range.key}}-s3transfer
        - py${{range.key}}-setuptools
        - py${{range.key}}-pyyaml
      provides:
        - py3-${{package.name}}
        - ${{package.name}}
      provider-priority: ${{range.value}}
    pipeline:
      - name: "Build ${{package.name}} for python${{range.key}}"
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: "Strip ${{package.name}} for python${{range.key}}"
        uses: strip
    test:
      pipeline:
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-${{package.name}}
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: ${{package.name}}

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: aws
    - name: Verify aws-cli-1 installation
      runs: aws help 2>&1 | grep -q "The  AWS  Command  Line  Interface is a unified tool"

update:
  enabled: true
  github:
    identifier: aws/aws-cli
    use-tag: true
    tag-filter: "1."
