package:
  name: chart-iamguarded-sealed-secrets
  version: "2.5.19"
  epoch: 0
  description: sealed-secrets iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: sealed-secrets/${{package.version}}
      expected-commit: f70362c3359d64fc54ff8405c5af56e14eb00262

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/sealed-secrets

  # This patch is used to restore the name "bitnami" in the k8s resouce definitions.
  # This is required because sealed secrets is a bitnami application, and the crd name
  # sealedsecrets.bitnami.com is part of the application.
  - uses: patch
    with:
      patches: iamguarded-sealed-secrets-crd.patch

  - uses: charts/package
    with:
      chart-path: iamguarded/sealed-secrets

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: sealed-secrets/
    use-tag: true
    tag-filter-prefix: sealed-secrets/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /sealed-secrets
        ignored-files: "/sealed-secrets/templates/role.yaml /sealed-secrets/crds/sealed-secrets.yaml /sealed-secrets/templates/clusterrole.yaml"
