#nolint:valid-pipeline-git-checkout-tag
package:
  name: go-discover-fips
  version: "0_git20260127"
  epoch: 1 # go/enterprise-rsc/go-discover-fips
  description: go-discover is a Go (golang) library and command line tool to discover ip addresses of nodes in cloud environments based on meta information like tags provided by the environment.
  copyright:
    - license: MPL-2.0
  resources:
    cpu: "7"
    memory: 19Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/go-discover
      expected-commit: c9daf450621856f81604e3495af612b95db907d5
      branch: master

  - uses: go/build
    with:
      go-package: go-fips
      output: discover
      packages: ./cmd/discover

update:
  enabled: true
  git: {}
  schedule:
    period: daily
    reason: Upstream does not maintain tags or releases

test:
  pipeline:
    - name: Verify help
      runs: |
        discover --help
        discover version
    - uses: test/go-fips-check
