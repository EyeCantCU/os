package:
  name: level-zero
  version: "1.24.2"
  epoch: 0
  description: API Headers, Loader, & Validation Layer based on oneAPI Level Zero Specification v1.13.0
  copyright:
    - license: MIT

vars:
  output-dir: output

environment:
  contents:
    packages:
      - build-base
      - spdlog-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/oneapi-src/level-zero.git
      expected-commit: ff8c99d4abda00fba6d92548a9cb2f721764d9d0
      tag: v${{package.version}}

  - uses: cmake/configure
    environment:
      CXXFLAGS: -DFMT_HEADER_ONLY=1
    with:
      opts: -DSYSTEM_SPDLOG=ON

  - uses: cmake/build

  - uses: cmake/install
    with:
      output-dir: ${{vars.output-dir}}

  - working-directory: ${{vars.output-dir}}
    runs: install -Dpm0755 -t "${{targets.destdir}}/usr/bin" ./bin/zello_world

update:
  enabled: true
  github:
    identifier: oneapi-src/level-zero
    strip-prefix: v

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development libraries
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Ensure libraries are being loaded properly
      runs: |
        set -o pipefail
        {
          zello_world --help || true
        } | grep -F \
          -e "Driver not initialized: ZE_RESULT_ERROR_UNINITIALIZED" \
          -e "Did NOT find matching" -e "GPU"
