package:
  name: envoy-fips-1.35
  version: "1.35.8"
  epoch: 2
  description: Cloud-native high-performance edge/middle/service proxy
  copyright:
    - license: Apache-2.0
  resources:
    cpu: 30
    memory: 60Gi
  dependencies:
    provides:
      - envoy-fips=${{package.full-version}}
    runtime:
      - boringssl-fips-static-${{vars.boringssl}}-tools

environment:
  contents:
    packages:
      - bash
      - bazel-7
      - binutils
      - boringssl-fips-static-${{vars.boringssl}}
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-18
      - cmake
      - coreutils
      - git
      - libtool
      - linux-headers
      - llvm-18
      - llvm-18-dev
      - llvm-libcxx-18
      - llvm-libcxx-18-dev
      - llvm-libcxxabi-18
      - llvm-lld-18~18
      - ncurses~6.4_p20230722
      - openjdk-21-default-jdk
      - patch
      - python3-dev
      - samurai
      - wolfi-baselayout

vars:
  boringssl: "20240407"

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: envoy-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/envoyproxy/envoy
      tag: v${{package.version}}
      expected-commit: 9a0cdcadabcb7baa2348afa1178e083f8d0fe2d7
      destination: envoy

  - uses: patch
    working-directory: envoy
    with:
      patches: |
        ../0001-version-Print-FIPS-module-version.patch
        ../0001-Add-quiche.patch
        ../0001-fips-always-set-ssl_compliance_policy_fips_202205.patch

  - runs: |
      export CARGO_BAZEL_REPIN=true
      mkdir -p .cache/bazel/_bazel_root

      cd envoy
      # The Python interpreter complains about being run as root, there's a flag to pass to disable that warning.
      sed -i 's/envoy_dependencies_extra()/envoy_dependencies_extra(ignore_root_user_error=True)/g' WORKSPACE

      ./bazel/setup_clang.sh /usr
      echo "build --config=clang" >> user.bazelrc

      # Choose boringssl-fips
      # See https://github.com/envoyproxy/envoy/blob/v1.27.0/bazel/BUILD#L475
      echo "build --define=boringssl=fips" >> user.bazelrc

      # Use our pre-built boringssl-fips-static
      echo "build --override_repository=boringssl_fips=/usr/lib/boringssl-fips-static" >> user.bazelrc

      # liburing is built without builtins and fails to link with -ftrivial-auto-var-init=zero
      bazel build --verbose_failures \
        --action_env=LIBURING_CFLAGS="-ftrivial-auto-var-init=uninitialized" \
        -c opt envoy

      mkdir -p ${{targets.destdir}}/usr/bin/
      cp bazel-bin/source/exe/envoy-static ${{targets.destdir}}/usr/bin/envoy

      # We no longer need this cache dir, which has some writable files.
      rm -rf ../.cache/bazel/_bazel_root

  - uses: strip

subpackages:
  - name: envoy-fips-oci-entrypoint-${{vars.envoy-version}}
    description: Entrypoint for using Envoy in OCI containers
    dependencies:
      provides:
        - envoy-fips-oci-entrypoint=${{package.full-version}}
      runtime:
        - busybox
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/var/lib/envoy/init
          cp envoy/distribution/docker/docker-entrypoint.sh ${{targets.subpkgdir}}/var/lib/envoy/init/envoy-entrypoint.sh
          chmod +x ${{targets.subpkgdir}}/var/lib/envoy/init/envoy-entrypoint.sh
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: envoy-fips-oci-entrypoint
            real-pkg-name: ${{subpkg.name}}
        - name: Verify entrypoint script exists and is executable
          runs: |
            set -euo pipefail
            # Verify entrypoint script is installed (fails test if missing)
            stat /var/lib/envoy/init/envoy-entrypoint.sh
            # Verify script is executable (fails test if not)
            test -x /var/lib/envoy/init/envoy-entrypoint.sh || { echo "FAIL: entrypoint script is not executable"; exit 1; }
            echo "SUCCESS: entrypoint script exists and is executable"
        - name: Verify entrypoint script contains valid shell content
          runs: |
            set -euo pipefail
            # Verify script has a valid shebang (fails test if missing)
            head -1 /var/lib/envoy/init/envoy-entrypoint.sh | grep -F "#!/" || { echo "FAIL: missing shebang"; exit 1; }
            # Verify script contains expected envoy-related content
            grep -F "envoy" /var/lib/envoy/init/envoy-entrypoint.sh || { echo "FAIL: script does not contain envoy reference"; exit 1; }
            # Verify script passes shell syntax check
            sh -n /var/lib/envoy/init/envoy-entrypoint.sh || { echo "FAIL: shell syntax error in script"; exit 1; }
            echo "SUCCESS: entrypoint script has valid shell content"

  - name: envoy-fips-config-${{vars.envoy-version}}
    description: Default Envoy configuration
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/etc/envoy
          cp envoy/configs/envoyproxy_io_proxy.yaml ${{targets.subpkgdir}}/etc/envoy/envoy.yaml
    dependencies:
      provides:
        - envoy-fips-config=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: envoy-fips-config
            real-pkg-name: ${{subpkg.name}}
        - name: Verify config file exists
          runs: |
            set -euo pipefail
            # Verify config file is installed (fails test if missing)
            stat /etc/envoy/envoy.yaml
            # Verify file has content (not empty)
            test -s /etc/envoy/envoy.yaml || { echo "FAIL: config file is empty"; exit 1; }
            echo "SUCCESS: config file exists and has content"
        - name: Verify config file contains expected YAML structure
          runs: |
            set -euo pipefail
            # Verify config contains expected Envoy configuration sections
            grep -F "static_resources" /etc/envoy/envoy.yaml || { echo "FAIL: missing static_resources section"; exit 1; }
            grep -F "listeners" /etc/envoy/envoy.yaml || { echo "FAIL: missing listeners section"; exit 1; }
            grep -F "clusters" /etc/envoy/envoy.yaml || { echo "FAIL: missing clusters section"; exit 1; }
            echo "SUCCESS: config file contains expected YAML structure"

update:
  enabled: true
  require-sequential: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.35.

test:
  environment:
    contents:
      packages:
        - curl
        - openssl
  pipeline:
    - runs: envoy --version
    - runs: |
        envoy_version=$(envoy --version | sed -n 's|.*/BoringSSL-FIPS-\(.*\)|\1|p')
        [ "$envoy_version" = "${{vars.boringssl}}" ]
        /usr/bin/bssl-test_fips
        /usr/bin/bssl-test_fips | grep "^Module: 'BoringCrypto', version: ${{vars.boringssl}} hash:$"
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 5104
    - name: "Test TLS ciphers"
      uses: test/daemon-check-output
      with:
        setup: |
          #!/bin/sh -e
          # Generate self-signed certificate for TLS listener
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout serverkey.pem \
            -out servercert.pem \
            -days 1 \
            -subj "/CN=localhost"
        start: envoy --config-path envoy-demo-tls.yaml
        timeout: 30
        expected_output: |
          starting main dispatch loop
          all dependencies initialized
        post: |
          #!/bin/sh -e
          # Test that curl works
          curl --cacert servercert.pem  -o /dev/null https://localhost:10000
          # Force CHACHA20 connection, and ensure it doesn't work
          result=$(echo Q | OPENSSL_CONF=/dev/null openssl s_client -tls1_3 -CAfile servercert.pem -ciphersuites TLS_CHACHA20_POLY1305_SHA256  -connect localhost:10000 2>&1| tail -n1)
          if [ "$result" = "DONE" ]; then
             echo Error: non-approved TLS_CHACHA20_POLY1305_SHA256 connection successful
             exit 1
          fi
