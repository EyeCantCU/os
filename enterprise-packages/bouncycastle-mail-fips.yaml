package:
  name: bouncycastle-mail-fips
  # renovate: datasource=maven depName=org.bouncycastle:bcmail-fips versioning=maven
  version: "2.1.6"
  epoch: 3
  description: BouncyCastle FIPS SMIME Library
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 10

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://repo1.maven.org/maven2/org/bouncycastle/bcmail-fips/${{package.version}}/bcmail-fips-${{package.version}}.jar
      expected-sha512: fa111b4b09da50044fd7a967d8d2038dfd94e1742d3ba4c7fabb392021b8689be8a476c673fc0e0dfd18fa023f1c04780db403d847dad19579858782fcbe69f5
      extract: false

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/java/bouncycastle-fips
      cp bcmail-fips-${{package.version}}.jar ${{targets.destdir}}/usr/share/java/bouncycastle-fips/bcmail-fips.jar

test:
  environment:
    contents:
      packages:
        - openjdk-11-default-jdk
        - bouncycastle-fips
    environment:
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk
  pipeline:
    - name: Verify JAR file exists
      runs: |
        set -euo pipefail
        # Verify the JAR file was installed correctly (fails test if missing)
        stat /usr/share/java/bouncycastle-fips/bcmail-fips.jar
        echo "SUCCESS: bcmail-fips.jar exists at expected location"
    - name: Verify JAR class loading
      runs: |
        set -euo pipefail
        # Verify the JAR is valid and contains expected S/MIME classes
        jar -tf /usr/share/java/bouncycastle-fips/bcmail-fips.jar | grep -F "org/bouncycastle/mail/smime/SMIMEEnvelopedGenerator.class"
        echo "SUCCESS: JAR contains expected SMIMEEnvelopedGenerator class"
    - uses: java-fips/algorithms
      with:
        java-version: "11"

update:
  enabled: false
  exclude-reason: |
    Please upgrade this always. Note this jar is outside of FIPS
    boundary, and should always be updated to latest published version
    on maven. There is no git repository where one can track version
    numbers for it, as the upstream repo is private. Unless we write a
    maven version tracker.
