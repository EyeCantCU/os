package:
  name: siderolabs-kubelet-1.34
  version: "1.34.5"
  epoch: 0
  description: Siderolabs Kubelet meta package with slim dependencies for Talos Linux
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - siderolabs-kubelet=${{package.full-version}}
    runtime:
      - ca-certificates
      - iptables
      - keyutils 
      - libcap-utils
      - mount
      - nftables
      - util-linux

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      cp Dockerfile /tmp/expected-Dockerfile

  - uses: git-checkout
    with:
      repository: https://github.com/siderolabs/kubelet
      tag: v${{package.version}}
      expected-commit: adbe858a86f70e19be6bb8357cc779245c081f11

  - name: Verify upstream Dockerfile hasn't changed
    runs: |
      diff -u /tmp/expected-Dockerfile Dockerfile

test:
  pipeline:
    - uses: test/metapackage

subpackages:
  - name: ${{package.name}}-compat
    description: Siderolabs Kubelet 1.34 compat symlink
    dependencies:
      provides:
        - siderolabs-kubelet-compat=${{package.full-version}}
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/local/bin" "${{targets.subpkgdir}}/var"
          ln -sf /usr/bin/kubelet-1.34 "${{targets.subpkgdir}}/usr/local/bin/kubelet"
    test:
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true
        - runs: |
            stat /usr/local/bin/kubelet

update:
  enabled: true
  github:
    identifier: siderolabs/kubelet
    strip-prefix: v
    tag-filter-prefix: v1.34.
