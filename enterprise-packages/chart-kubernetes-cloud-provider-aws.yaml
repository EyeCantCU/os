package:
  name: chart-kubernetes-cloud-provider-aws
  version: "0.0.10"
  epoch: 0
  description: Installs Cloud Controller Manager for AWS Cloud Provider
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/cloud-provider-aws
      tag: helm-chart-aws-cloud-controller-manager-${{package.version}}
      expected-commit: 059b0b65a5d580c55b3abf9dc9a9490394e744e0

  # Upstream Chart.yaml uses multi-document YAML (trailing ---) which breaks
  # yq extraction in the charts/package pipeline. Normalize it.
  - runs: |
      sed -i '/^---$/d' charts/aws-cloud-controller-manager/Chart.yaml

  - uses: charts/package
    with:
      chart-path: charts/aws-cloud-controller-manager
      images: |
        aws-cloud-controller-manager:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [aws-cloud-controller-manager]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: kubernetes/cloud-provider-aws
    strip-prefix: helm-chart-aws-cloud-controller-manager-
    use-tag: true
    tag-filter-prefix: helm-chart-aws-cloud-controller-manager-
