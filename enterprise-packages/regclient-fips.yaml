package:
  name: regclient-fips
  version: "0.11.2"
  epoch: 0 # CVE-2025-68121
  description: Docker and OCI Registry Client in Go and tooling using those libraries
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      - regclient-regctl-fips # For backwards compatibility

data:
  - name: binaries
    items:
      regbot:
      regctl:
      regsync:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/regclient/regclient
      tag: v${{package.version}}
      expected-commit: 584b70d53427faad17a860e215ce2cd0cb76059f

update:
  enabled: true
  github:
    identifier: regclient/regclient
    strip-prefix: v

subpackages:
  - range: binaries
    name: "regclient-${{range.key}}-fips"
    description: ${{range.value}}
    dependencies:
      provides:
        - ${{range.key}}-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          packages: ./cmd/${{range.key}}
          output: ${{range.key}}
          ldflags: |
            -X github.com/regclient/regclient/internal/version.vcsTag=${{package.version}}
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/help-check
          with:
            bins: ${{range.key}}
        - uses: test/tw/ver-check
          with:
            bins: ${{range.key}}
        - name: Functional test for ${{range.key}}
          runs: |
            set -euo pipefail

            # Running without arguments may return non-zero, but should show available commands
            # This verifies the binary is properly built and can parse arguments
            output=$(${{range.key}} 2>&1 || true)

            # Verify the binary displays available commands structure
            # This confirms proper binary build and CLI functionality
            if echo "$output" | grep -F "Available Commands:"; then
              echo "SUCCESS: ${{range.key}} displays available commands"
            else
              echo "FAIL: Expected 'Available Commands:' in output"
              echo "Actual output: $output"
              exit 1
            fi

            # Test tool-specific functionality
            case "${{range.key}}" in
              regbot)
                # Test config file validation with a minimal valid config
                tee /tmp/regbot-config.yaml <<'EOF'
            version: 1
            creds:
              - registry: docker.io
            defaults:
              parallel: 1
            scripts:
              - script: |
                  return "ok"
            EOF
                # Verify regbot can parse the config structure
                if regbot config check /tmp/regbot-config.yaml 2>&1; then
                  echo "SUCCESS: regbot config validation works"
                else
                  echo "Note: regbot config check may require additional setup"
                fi
                ;;
              regctl)
                # Test registry listing capability (verifies CLI is functional)
                if regctl registry list 2>&1; then
                  echo "SUCCESS: regctl registry list works"
                else
                  echo "Note: No registries configured (expected in test environment)"
                fi
                ;;
              regsync)
                # Test config file validation with a minimal valid config
                tee /tmp/regsync-config.yaml <<'EOF'
            version: 1
            defaults:
              parallel: 1
            sync:
              - source: registry.example.com/library/alpine
                target: mirror.example.com/library/alpine
                type: repository
            EOF
                # Verify regsync can parse the config structure
                if regsync config check /tmp/regsync-config.yaml 2>&1; then
                  echo "SUCCESS: regsync config validation works"
                else
                  echo "Note: regsync config check may require additional setup"
                fi
                ;;
            esac

test:
  pipeline:
    - uses: test/emptypackage
