package:
  name: eck-operator
  version: "3.3.1"
  epoch: 0 # GHSA-j5w8-q4qc-rx2x
  description: Elastic Cloud on Kubernetes
  copyright:
    - license: Elastic-2.0

environment:
  environment:
    LICENSE_PUBKEY: /home/build/public.key

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/elastic/cloud-on-k8s/
      tag: v${{package.version}}
      expected-commit: ee6ca7f5987f5118f578ce8dd0b4e02880484f3e

  - runs: |
      mkdir -p ${{targets.contextdir}}/conf
      install -Dm644 ./config/eck.yaml ${{targets.contextdir}}/conf/eck.yaml

  - runs: go generate -tags release ./...

  - uses: go/build
    with:
      packages: github.com/elastic/cloud-on-k8s/v3/cmd
      output: elastic-operator
      tags: release
      ldflags: |
        -X github.com/elastic/cloud-on-k8s/v3/pkg/about.version=${{package.version}}
        -X github.com/elastic/cloud-on-k8s/v3/pkg/about.buildHash=$(git rev-parse HEAD)
        -X github.com/elastic/cloud-on-k8s/v3/pkg/about.buildDate=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")
        -X github.com/elastic/cloud-on-k8s/v3/pkg/about.buildSnapshot=false
      modroot: .

subpackages:
  - name: "${{package.name}}-compat"
    # https://github.com/elastic/cloud-on-k8s/blob/f84048e03e6fcb7774b284e28d5eb3eabee234c0/build/Dockerfile#L54
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"
          ln -sf /usr/bin/elastic-operator ${{targets.contextdir}}/elastic-operator
    test:
      pipeline:
        - runs: test "$(readlink /elastic-operator)" = "/usr/bin/elastic-operator"

test:
  environment:
    contents:
      packages:
        - eck-operator-compat
        - wait-for-it
        - curl
  pipeline:
    - runs: |
        [ -f /usr/bin/elastic-operator ] && exit 0 || exit 1
        /elastic-operator --version
        elastic-operator --version
    - uses: test/kwok/cluster
    - runs: |
        kubectl create -f https://download.elastic.co/downloads/eck/${{package.version}}/crds.yaml
        kubectl create namespace test
    - uses: test/daemon-check-output
      with:
        start: elastic-operator manager --operator-namespace test --metrics-port 8080
        timeout: 30
        expected_output: |
          Starting the manager
          Starting Controller
          Starting workers
        error_strings: |
          unlicensed
        post: |
          kubectl get pods -n test
          kubectl logs -n test -l control-plane=elastic-operator

          wait-for-it localhost:8080 --timeout=120

          # Check metrics endpoint
          curl -sf http://localhost:8080/metrics | grep -F "workqueue_work_duration_seconds_bucket"

          # Check operator status
          kubectl get elasticsearch -A
          kubectl get kibana -A

update:
  enabled: true
  github:
    identifier: elastic/cloud-on-k8s
    strip-prefix: v
