package:
  name: liberica-23
  version: 23.0.2.9
  epoch: 1
  description: Liberica ${{vars.major-version}} Java development kit
  copyright:
    - license: GPL-2.0-with-classpath-exception
  dependencies:
    runtime:
      - alsa-lib
      - freetype
      - giflib
      - java-cacerts
      - lcms2
      - libfontconfig1
      - libjpeg-turbo
      - libx11
      - libxext
      - libxi
      - libxrender
      - libxtst
      - ttf-dejavu
      - zlib

vars:
  java-home: /usr/lib/jvm/java-23-liberica
  boot-jdk: /usr/lib/jvm/java-23-openjdk

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+.\d+.\d+)\.(\d+)$
    replace: $1+$2
    to: mangled-package-version
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - alsa-lib-dev
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cups-dev
      - file
      - fontconfig-dev
      - freetype-dev
      - giflib-dev
      - lcms2-dev
      - libffi-dev
      - libjpeg-turbo-dev
      - libx11-dev
      - libxext-dev
      - libxi-dev
      - libxrandr-dev
      - libxrender-dev
      - libxt-dev
      - libxtst-dev
      - openjdk-23-default-jdk
      - zip
  environment:
    # This is needed to work around the error date 1970-01-01T00:00:00Z is not within the valid range 1980-01-01T00:00:02Z to 2099-12-31T23:59:59Z
    SOURCE_DATE_EPOCH: 315532900

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/bell-sw/Liberica/releases/download/${{vars.mangled-package-version}}/bellsoft-jdk${{vars.mangled-package-version}}-src-full.tar.gz
      expected-sha512: dc28173259fb116337be855012ba2ef415d67c64df5b0504e4c3908fcfad3cba224bebd37e54f6ffb2c93f6e85480d170a293ae956788e6b1e3b1f459630b270

  - working-directory: /home/build/googletest
    pipeline:
      - uses: fetch
        with:
          uri: https://github.com/google/googletest/archive/v1.15.2.tar.gz
          expected-sha512: 9046841044a2bf7edfd96854ad9c44ffae4fcb9fb59a075b367507c0762a98eb32cb6968d46663228272e26321e96f4dd287c95baa22c6af9bad902b8b6ede4e

  - runs: chmod +x configure

  # Note that despite using --with-extra-cflags, --with-extra-cxxflags, and
  # --with-extra-ldflags, the configure still produces warnings like:
  # https://chainguard.dev/contact/18747
  - uses: autoconf/configure
    with:
      opts: |
        --disable-precompiled-headers \
        --disable-warnings-as-errors \
        --enable-dtrace=no \
        --prefix=${{vars.java-home}} \
        --with-boot-jdk=${{vars.boot-jdk}} \
        --with-debug-level=release \
        --with-extra-cflags="$CFLAGS" \
        --with-extra-cxxflags="$CXXFLAGS" \
        --with-extra-ldflags="$LDFLAGS" \
        --with-freetype=system \
        --with-giflib=system \
        --with-gtest="/home/build/googletest" \
        --with-jtreg=no \
        --with-jvm-variants=server \
        --with-lcms=system \
        --with-libjpeg=system \
        --with-libpng=system \
        --with-native-debug-symbols=internal \
        --with-vendor-bug-url=https://chainguard.dev/contact \
        --with-vendor-name=Chainguard \
        --with-vendor-url=https://chainguard.dev \
        --with-vendor-vm-bug-url=https://chainguard.dev/contact \
        --with-version-opt="cgr-r${{package.epoch}}" \
        --with-version-pre="no" \
        --with-version-string="" \
        --with-zlib=system

  - runs: |
      make jdk-image legacy-jre-image

      mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
      cp -r build/*-server-release/images/jdk/* ${{targets.contextdir}}/${{vars.java-home}}
      rm ${{targets.contextdir}}/${{vars.java-home}}/lib/src.zip

      # copy to shared java cacerts store
      rm -f ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts
      ln -s /etc/ssl/certs/java/cacerts \
        ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts
      # symlink for `java-common` to work (which expects jre in $JAVA_HOME/jre)
      ln -s . ${{targets.contextdir}}/${{vars.java-home}}/jre

subpackages:
  - name: ${{package.name}}-dbg
    description: Liberica ${{vars.major-version}} Java debug symbols
    pipeline:
      - uses: split/debug
    dependencies:
      runtime:
        - ${{package.name}}

  - name: ${{package.name}}-jre
    description: Liberica ${{vars.major-version}} Java runtime environment
    dependencies:
      runtime:
        - alsa-lib
        - freetype
        - giflib
        - java-cacerts
        - libfontconfig1
        - libjpeg-turbo
        - libx11
        - libxext
        - libxi
        - libxrender
        - libxtst
        - ttf-dejavu
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          cp -r build/*-server-release/images/jre/* ${{targets.contextdir}}/${{vars.java-home}}

          # copy to shared java cacerts store
          rm -f ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts
          cp /etc/ssl/certs/java/cacerts \
            ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts

          # symlink for `java-common` to work (which expects jre in ${{vars.java-home}}/jre)
          ln -sf . ${{targets.contextdir}}/${{vars.java-home}}/jre

  - name: ${{package.name}}-jmods
    description: Liberica ${{vars.major-version}} jmods
    dependencies:
      provides:
        - liberica-jmods=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ${{targets.destdir}}/${{vars.java-home}}/jmods \
             ${{targets.contextdir}}/${{vars.java-home}}

  - name: ${{package.name}}-doc
    description: Liberica ${{vars.major-version}} documentation
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ${{targets.destdir}}/${{vars.java-home}}/man \
             ${{targets.contextdir}}/${{vars.java-home}}

  - name: ${{package.name}}-demos
    description: Liberica ${{vars.major-version}} demos
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ${{targets.destdir}}/${{vars.java-home}}/demo \
             ${{targets.contextdir}}/${{vars.java-home}}

  - name: ${{package.name}}-default-jvm
    description: Use the Liberica ${{vars.major-version}} JVM as the default JVM
    dependencies:
      runtime:
        - java-common-jre
        - ${{package.name}}-jre
      provides:
        - liberica-default-jvm=1.${{vars.major-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib/jvm
          ln -s $(basename ${{vars.java-home}}) ${{targets.contextdir}}/usr/lib/jvm/default-jvm

  - name: ${{package.name}}-default-jdk
    description: Use the Liberica ${{vars.major-version}} JVM as the default JVM with the JDK installed
    dependencies:
      runtime:
        - java-common
        - ${{package.name}}
      provides:
        - liberica-default-jdk=1.${{vars.major-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib/jvm
          ln -s $(basename ${{vars.java-home}}) ${{targets.contextdir}}/usr/lib/jvm/default-jvm

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-default-jdk
        - ${{package.name}}-jmods
  pipeline:
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/usr/lib/jvm/java-23-liberica/lib/:/usr/lib/jvm/java-23-liberica/lib/server/"
    # Test a basic Hello World
    - working-directory: basic
      runs: |
        javac HelloWorld.java
        java HelloWorld | grep -qi "Hello World!"
    # Test a basic HTTP connection
    - working-directory: basic
      runs: |
        javac RequestTest.java
        java RequestTest | grep -qi "Successfully connected to example.org"
    # Test modules
    - working-directory: advanced/module-project
      runs: |
        mkdir output
        javac -d output --module-source-path modules $(find modules -name "*.java")

        # Create a jar with the compiled classes
        jar --verbose --create --file app.jar \
          --main-class dev.chainguard.module.main.Main \
          --module-version 1.0 \
          -C output/test.modules . \
          -C output/main.app .

        # Test the jar
        java -jar app.jar

        # Test jlink
        jlink --verbose --module-path "app.jar:$JAVA_HOME/jmods" \
          --add-modules test.modules \
          --output test-project-jre

        # Test custom JRE
        test-project-jre/bin/java -jar app.jar

update:
  enabled: true
  version-transform:
    - match: ^(.+)\+(\d+)$
      replace: $1.$2
  github:
    identifier: bell-sw/Liberica
    tag-filter: 23.
    use-tag: true
