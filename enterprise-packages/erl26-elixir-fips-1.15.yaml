package:
  name: erl26-elixir-fips-1.15
  version: "1.15.8"
  epoch: 2
  description: General-purpose programming language and runtime environment
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: ${{vars.erlMM}}
    runtime:
      - erlang-fips-${{vars.erlMM}}
    provides:
      - elixir-fips=${{package.full-version}}
      - elixir-fips-1.15=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox
      - erlang-fips-${{vars.erlMM}}-dev
  environment:
    # suppresses this message: "the VM is running with native name encoding of latin1 which may cause Elixir to malfunction as it expects utf8. Please ensure your locale is set to UTF-8 (which can be verified by running "locale" in your shell) or set the ELIXIR_ERL_OPTIONS="+fnu" environment variable"
    ELIXIR_ERL_OPTIONS: "+fnu"

var-transforms:
  - from: ${{package.name}}
    match: ^erl(\d\d+)-.*
    replace: $1
    to: erlMM

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 29fdd09c0fcb5f029d43591665de35491f7378dd
      repository: https://github.com/elixir-lang/elixir
      tag: v${{package.version}}

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

update:
  enabled: true
  github:
    identifier: elixir-lang/elixir
    strip-prefix: v
    tag-filter-prefix: v1.15

test:
  environment:
    environment:
      ELIXIR_ERL_OPTIONS: "+fnu"
    contents:
      packages:
        - curl
        - erlang-fips-${{vars.erlMM}}-dev
        - openssl-config-fipshardened
        - erl${{vars.erlMM}}-rebar3
        - wait-for-it
  pipeline:
    - uses: test/virtualpackage
      with:
        real-pkg-name: "${{package.name}}"
        virtual-pkg-name: elixir-fips
    - uses: test/tw/ver-check
      with:
        bins: |
          elixir
          elixirc
          iex
          mix
    - uses: test/tw/help-check
      with:
        bins: mix
    - name: Verify Erlang/OTP compilation
      runs: |
        set -euo pipefail
        # Functional test: verify Elixir was compiled with the correct Erlang version
        # Uses System.otp_release() to get build metadata, not a smoke test
        otp_release=$(elixir -e "IO.puts(System.otp_release())")
        if [ "$otp_release" != "${{vars.erlMM}}" ]; then
          echo "FAIL: Expected OTP release ${{vars.erlMM}}, got $otp_release"
          exit 1
        fi
        echo "SUCCESS: Elixir compiled with OTP $otp_release"
    - name: Ensure FIPS provider functionality
      runs: |
        set -euo pipefail

        # Verify FIPS provider is available using direct map access
        fips_available=$(elixir -e "IO.puts(:crypto.info()[:fips_provider_available])")
        if [ "$fips_available" != "true" ]; then
          echo "FAIL: Expected fips_provider_available to be true, got $fips_available"
          exit 1
        fi
        echo "SUCCESS: FIPS provider is available"

        # Create test script that uses MD5 (not allowed in FIPS mode)
        tee bad_hash.exs <<'EOF'
        :crypto.enable_fips_mode(true)
        :crypto.hash(:md5, "Linky")
        EOF

        # Test that MD5 is rejected in FIPS mode
        set +e
        output=$(elixir ./bad_hash.exs 2>&1)
        rc=$?
        set -e

        if [ "$rc" -eq 0 ]; then
          echo "FAIL: Expected MD5 hash to be rejected in FIPS mode"
          exit 1
        fi

        # Verify the expected FIPS error message (fails test if not found)
        if echo "$output" | grep -F "Bad digest type in FIPS"; then
          echo "SUCCESS: FIPS mode correctly rejected MD5"
        else
          echo "FAIL: Expected 'Bad digest type in FIPS' error message"
          echo "Actual output: $output"
          exit 1
        fi
    - name: Basic script test
      runs: |
        set -euo pipefail
        ELIXIR_FILE="$(mktemp)"
        printf "%s" 'IO.puts("Hello, Wolfi!")' | tee "${ELIXIR_FILE}"

        # Verify script execution produces expected output
        elixir "${ELIXIR_FILE}" | grep -F "Hello, Wolfi!"
    - name: Mix web application test
      runs: |-
        set -euo pipefail
        mkdir -p ./zzz/lib/zzz ./zzz/test

        tee ./zzz/lib/zzz.ex <<'EOF'
        defmodule Zzz.Router do
          use Plug.Router

          plug :match
          plug :dispatch

          get "/" do
            send_resp(conn, 200, "Hello, Elixir!")
          end

          match _ do
            send_resp(conn, 404, "Not Found")
          end
        end
        EOF

        tee ./zzz/mix.exs <<'EOF'
        defmodule Zzz.MixProject do
          use Mix.Project

          def project do
            [
              app: :zzz,
              version: "0.1.0",
              elixir: "~> 1.15",
              start_permanent: Mix.env() == :prod,
              deps: deps()
            ]
          end

          def application do
            [
              extra_applications: [:logger],
              mod: {Zzz.Application, []}
            ]
          end

          defp deps do
            [
              {:plug_cowboy, "~> 2.7"}
            ]
          end
        end
        EOF

        HOST_IP=localhost
        HARDCODED_PORT=8888

        tee ./zzz/lib/zzz/application.ex <<EOF
        defmodule Zzz.Application do
          # See https://hexdocs.pm/elixir/Application.html
          # for more information on OTP Applications
          @moduledoc false

          use Application

          @impl true
          def start(_type, _args) do
            children = [
              {Plug.Cowboy, scheme: :http, plug: Zzz.Router, options: [port: ${HARDCODED_PORT}]}
            ]

            IO.puts("Starting server on http://${HOST_IP}:${HARDCODED_PORT}")
            # See https://hexdocs.pm/elixir/Supervisor.html
            # for other strategies and supported options
            opts = [strategy: :one_for_one, name: Zzz.Supervisor]
            Supervisor.start_link(children, opts)
          end
        end
        EOF

        printf "%s" "ExUnit.start()" | tee ./zzz/test/test_helper.exs

        cd zzz
        mix local.rebar rebar3 /usr/bin/rebar3
        mix deps.get
        mix release
        _build/dev/rel/zzz/bin/zzz daemon
        wait-for-it --strict -t 10 "${HOST_IP}:${HARDCODED_PORT}"
        curl -sf "${HOST_IP}:${HARDCODED_PORT}" | grep -F "Hello, Elixir!"
