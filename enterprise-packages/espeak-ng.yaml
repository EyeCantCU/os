package:
  name: espeak-ng
  version: 1.52.0
  epoch: 2 # go/enterprise-rsc/espeak-ng
  description: eSpeak NG Text-to-Speech
  copyright:
    - license: GPL-3.0-only
  resources:
    cpu: "2"
    memory: 6Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - coreutils
      - libtool

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/espeak-ng/espeak-ng.git
      expected-commit: 4870adfa25b1a32b4361592f1be8a40337c58d6c
      tag: ${{package.version}}

  - runs: ./autogen.sh

  - uses: autoconf/configure

  - uses: autoconf/make
    with:
      opts: src/espeak-ng src/speak-ng

  - uses: autoconf/make-install

update:
  enabled: true
  git: {}

subpackages:
  - name: ${{package.name}}-dev
    description: Headers and dev libraries from ${{package.name}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: speak-ng espeak-ng
    - uses: test/tw/ver-check
      with:
        bins: speak-ng espeak-ng
    # This doesn't do much as there is no audio device for this to go to
    - runs: espeak "aeiou" -p 50
