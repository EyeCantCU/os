package:
  name: tekton-chains-fips
  version: "0.26.1"
  epoch: 0 # GHSA-whqx-f9j3-ch6m
  description: Supply Chain Security in Tekton Pipelines
  copyright:
    - license: Apache-2.0

environment:
  environment:
    CGO_ENABLED: "1"
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips-md5

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6cad4e5754ae8a401649c31b9b75cfd51c0b43a8
      repository: https://github.com/tektoncd/chains
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/in-toto/go-witness@v0.9.1
        github.com/sigstore/fulcio@v1.8.5
        github.com/sigstore/rekor@v1.5.0
        github.com/sigstore/sigstore@v1.10.4
        github.com/theupdateframework/go-tuf/v2@v2.4.1

  - uses: go/build
    with:
      output: tekton-chains
      packages: ./cmd/controller
      go-package: go-fips-md5

update:
  enabled: true
  github:
    identifier: tektoncd/chains
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        tekton-chains --help
    - runs: |
        tekton-chains -h
