package:
  name: workstation-v2-home-mounter
  version: 0.0.1
  epoch: 4
  description: "small helper to mount /home in Chainguard workstations V2"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - busybox
      - curl

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox

pipeline:
  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/bin/
      mkdir -p "${{targets.destdir}}"/usr/lib/systemd/system/
      install -Dm755 ./workstation-v2-home-mounter "${{targets.destdir}}"/usr/bin/workstation-v2-home-mounter
      install -Dm644 ./workstation-v2-home-mounter.service "${{targets.destdir}}"/usr/lib/systemd/system/workstation-v2-home-mounter.service

test:
  pipeline:
    - runs: |
        ls /usr/bin/workstation-v2-home-mounter
        ls /usr/lib/systemd/system/workstation-v2-home-mounter.service

update:
  enabled: false
  exclude-reason: This package does not receive updates from anywhere and has no upstream source.
