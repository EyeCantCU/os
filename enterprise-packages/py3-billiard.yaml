package:
  name: py3-billiard
  version: "4.2.2"
  epoch: 0
  description: Python multiprocessing fork with improvements and bugfixes
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: billiard
  import: billiard

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-python-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/celery/billiard
      tag: v${{package.version}}
      expected-commit: 0642d2e8ab6c4541a2fd6f0e08ddca50871b50c5

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import billiard

            # Test basic imports and classes
            assert hasattr(billiard, 'Pool'), "Pool class not found"
            assert hasattr(billiard, 'Process'), "Process class not found"
            assert hasattr(billiard, 'Queue'), "Queue class not found"

            # Test Process class methods
            assert hasattr(billiard.Process, 'start'), "Process.start method not found"
            assert hasattr(billiard.Process, 'join'), "Process.join method not found"

            # Test Queue functionality
            q = billiard.Queue()
            assert q is not None, "Failed to create Queue"
            assert hasattr(q, 'put'), "Queue.put method not found"
            assert hasattr(q, 'get'), "Queue.get method not found"
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: celery/billiard
    strip-prefix: v
