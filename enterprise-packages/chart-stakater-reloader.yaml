package:
  name: chart-stakater-reloader
  version: "2.2.9"
  epoch: 0
  description: Reloader chart that runs on kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/stakater/Reloader
      tag: chart-v${{package.version}}
      expected-commit: cf37b446586e0575db984bb974293540d3018c90

  - uses: charts/package
    with:
      chart-path: deployments/kubernetes/chart/reloader
      images: |
        reloader:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        values:
          imagePullSecrets:
            - name: my-pull-secret
        cases:
          - name: default
            images: [reloader]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: stakater/Reloader
    strip-prefix: chart-v
    use-tag: true
    tag-filter-prefix: chart-v
