package:
  name: chart-stakater-reloader
  version: "2.2.8"
  epoch: 0
  description: Reloader chart that runs on kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/stakater/Reloader
      tag: chart-v${{package.version}}
      expected-commit: 9aa957c8398544a6c73766b26c8b804bc7f23e89

  - uses: charts/package
    with:
      chart-path: deployments/kubernetes/chart/reloader
      images: |
        reloader:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        values:
          imagePullSecrets:
            - name: my-pull-secret
        cases:
          - name: default
            images: [reloader]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: stakater/Reloader
    strip-prefix: chart-v
    use-tag: true
    tag-filter-prefix: chart-v
