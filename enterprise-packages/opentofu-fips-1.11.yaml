package:
  name: opentofu-fips-1.11
  version: "1.11.5"
  epoch: 3 # GHSA-9h8m-3fm2-qjrq
  copyright:
    - license: MPL-2.0
  dependencies:
    provides:
      - opentofu-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 67fe9db49b7dafd46470cf9ac7f437aaa95f5c40
      repository: https://github.com/opentofu/opentofu
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/cloudflare/circl@v1.6.3
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X 'github.com/opentofu/opentofu/version.dev=no'
      modroot: .
      output: tofu
      packages: ./cmd/tofu

update:
  enabled: true
  ignore-regex-patterns:
    - "rc"
    - "beta"
  github:
    identifier: opentofu/opentofu
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v1.11

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: tofu
    - uses: test/tw/help-check
      with:
        bins: tofu
    - name: tofu Initialization
      runs: |
        set -euo pipefail
        tee example.tf <<'EOF'
        provider "local" {}
        EOF
        tofu init -input=false
    - name: tofu Plan Creation
      runs: |
        set -euo pipefail
        tofu plan -input=false -out=tfplan
    - name: tofu Apply Execution
      runs: |
        set -euo pipefail
        tofu apply -input=false tfplan
