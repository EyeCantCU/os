package:
  name: pluto-fips
  version: "5.22.8"
  epoch: 0 # CVE-2025-68121
  description: A cli tool to help discover deprecated apiVersions in Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/FairwindsOps/pluto
      tag: v${{package.version}}
      expected-commit: 6b3a11386420584390c3d97fe8939b30a37b5483

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/pluto/main.go
      output: pluto
      ldflags: |
        -X main.version=${{package.version}} -X main.commit=$(git rev-parse HEAD)}

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/
          ln -sf ./usr/bin/pluto ${{targets.contextdir}}/pluto
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  github:
    identifier: FairwindsOps/pluto
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: pluto
    - uses: test/tw/help-check
      with:
        bins: pluto
    - uses: test/kwok/cluster
    - name: "Test bash completion script generation"
      runs: |
        set -euo pipefail
        # Generate and verify bash completion script
        # This tests the completion subcommand functionality
        pluto completion bash > /tmp/completion.bash
        # Verify file was created with content (fails if empty or missing)
        test -s /tmp/completion.bash
        # Verify it contains expected completion markers
        grep -F "bash completion" /tmp/completion.bash
    - name: "Detection test"
      runs: |
        set -euo pipefail
        # Create a sample manifest
        tee deprecated.yaml <<EOF
        apiVersion: apps/v1beta1
        kind: Deployment
        metadata:
          name: deprecated-deployment
        spec:
          template:
            spec:
              containers:
              - name: nginx
                image: nginx
        EOF
        # Detect issues - pluto exits 3 when deprecated APIs are found, which is expected
        pluto detect deprecated.yaml --output json > /tmp/pluto-output.json || true
        # Verify deprecated API is detected (fails test if no deprecated items found)
        jq -e '.items[] | select(.deprecated == true)' /tmp/pluto-output.json
    - name: "detect-all-in-cluster"
      runs: |
        set -euo pipefail
        # Create and apply a custom Endpoints object
        tee deprecated-endpoints.yaml <<EOF
        apiVersion: v1
        kind: Endpoints
        metadata:
          name: deprecated-endpoints
        subsets:
        - addresses:
          - ip: 10.0.0.10
          ports:
          - port: 80
            protocol: TCP
        EOF
        kubectl apply -f deprecated-endpoints.yaml
        # Verify detect-all-in-cluster produces output with target-versions (fails test if not found)
        pluto detect-all-in-cluster --output json --ignore-deprecations --ignore-removals | grep -F "target-versions"
    - name: "List Versions"
      runs: |
        set -euo pipefail
        # Verify known API versions are listed (fails test if not found)
        pluto list-versions | grep -F "Deployment"
        pluto list-versions | grep -F "PodSecurityPolicy"
