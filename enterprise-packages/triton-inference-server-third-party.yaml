#nolint:valid-pipeline-git-checkout-tag
package:
  name: triton-inference-server-third-party
  version: "26.01"
  epoch: 0
  description:
  copyright:
    - license: BSD-3-Clause
      license-path: third_party.git/LICENSE

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/triton-inference-server/third_party
      branch: r${{package.version}}
      expected-commit: 84a6bacf4f2982024d1466485e89cb29b8925b6a
      destination: third_party.git

  # git-checkout branch will attempt to reset to the expected-commit
  # if the branch doesn't match. Here we want to fail the build
  # so we can validate and switch to the new commit.
  - name: check if git-checkout had to reset to expected-commit
    working-directory: third_party.git
    runs: |
      [ "$(git rev-parse origin/r${{package.version}})" = "$(git rev-parse HEAD)" ]

  - runs: |
      mkdir -p "${{targets.contextdir}}/usr/src/triton-inference-server"
      cp -a third_party.git "${{targets.contextdir}}/usr/src/triton-inference-server"

update:
  enabled: false
  exclude-reason: No support for untagged release branches yet

test:
  pipeline:
    - uses: test/tw/contains-files
      with:
        dir: "/usr/src/triton-inference-server/"
        name: "*"
