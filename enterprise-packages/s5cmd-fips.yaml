package:
  name: s5cmd-fips
  version: 2.3.0
  epoch: 4
  description: Parallel S3 and local filesystem execution tool.
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips-1.25

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/peak/s5cmd
      expected-commit: 991c9fbc16709341b4bac04513232a1445941f63
      tag: v${{package.version}}

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      output: s5cmd
      ldflags: -X github.com/peak/s5cmd/v2/version.Version=v${{package.version}} -X github.com/peak/s5cmd/v2/version.GitCommit=991c9fbc16709341b4bac04513232a1445941f63

  - uses: strip

update:
  enabled: true
  github:
    identifier: peak/s5cmd
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: s5cmd
    - uses: test/tw/help-check
      with:
        bins: s5cmd
