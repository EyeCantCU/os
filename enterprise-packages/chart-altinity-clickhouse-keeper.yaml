package:
  name: chart-altinity-clickhouse-keeper
  version: "0.1.5"
  epoch: 0
  description: A ClickHouse Keeper chart for Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Altinity/helm-charts
      tag: clickhouse-keeper-sts-${{package.version}}
      expected-commit: 830637fc378e1c55f572c0b319358b2d1ff6ed53

  - uses: charts/package
    with:
      chart-path: charts/clickhouse-keeper-sts
      images: |
        clickhouse-keeper:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [clickhouse-keeper]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: Altinity/helm-charts
    strip-prefix: clickhouse-keeper-sts-
    use-tag: true
    tag-filter-prefix: clickhouse-keeper-sts-
