package:
  name: bouncycastle-pkix-fips
  # renovate: datasource=maven depName=org.bouncycastle:bcpkix-fips versioning=maven
  version: "2.1.10"
  epoch: 3
  description: BouncyCastle FIPS PKIX APIs
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://repo1.maven.org/maven2/org/bouncycastle/bcpkix-fips/${{package.version}}/bcpkix-fips-${{package.version}}.jar
      expected-sha512: 6ff3f1d12fe2bb6a102975f94864f74459523dd7aeb2b1f293bfc76eebd2688ec1cdb5d72cdd2c5bffb0c41e2593c9364b8b15f411c298f5866138ce6c79d6a2
      extract: false

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/java/bouncycastle-fips
      cp bcpkix-fips-${{package.version}}.jar ${{targets.destdir}}/usr/share/java/bouncycastle-fips/bcpkix-fips.jar

test:
  environment:
    contents:
      packages:
        - openjdk-17-default-jdk
  pipeline:
    - name: Verify JAR file exists
      runs: |
        set -euo pipefail
        # Verify bcpkix-fips.jar was installed (fails test if missing)
        stat /usr/share/java/bouncycastle-fips/bcpkix-fips.jar
    - name: Verify JAR validity and PKIX classes
      runs: |
        set -euo pipefail
        # List JAR contents and verify it contains PKIX classes (fails test if invalid JAR or missing classes)
        jar -tf /usr/share/java/bouncycastle-fips/bcpkix-fips.jar | grep -F "org/bouncycastle/pkix"
    - name: Verify Java class loading
      runs: |
        set -euo pipefail
        # Verify a PKIX class can be loaded and is valid bytecode (fails test if class not found or invalid)
        javap -cp /usr/share/java/bouncycastle-fips/bcpkix-fips.jar org.bouncycastle.pkix.PKIXIdentity

update:
  enabled: false
  exclude-reason: |
    Please upgrade this always. Note this jar is outside of FIPS
    boundary, and should always be updated to latest published version
    on maven. There is no git repository where one can track version
    numbers for it, as the upstream repo is private. Unless we write a
    maven version tracker.
