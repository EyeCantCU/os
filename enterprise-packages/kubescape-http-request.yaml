package:
  name: kubescape-http-request
  version: "0.2.16"
  epoch: 3 # CVE-2025-61732
  description: A simple Go HTTP client utility that replaces curl for making HTTP requests
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 3Gi

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubescape/http-request
      tag: v${{package.version}}
      expected-commit: 5ad3f8c76ab20ba32f9849fe09128291b439276d

  - uses: go/build
    with:
      packages: .
      output: http_request

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility package for entrypoint
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"
          ln -sf ./usr/bin/http_request "${{targets.contextdir}}/http_request"
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: http_request
    - name: Test GET request
      runs: |
        set -euo pipefail
        http_request \
          -method GET \
          -scheme https \
          -host httpbin.org \
          -path /get \
          -path-output /tmp/response.json
        jq -e '.url == "https://httpbin.org/get"' /tmp/response.json
    - name: Test POST request with body
      runs: |
        set -euo pipefail
        echo '{"test": "data"}' > /tmp/body.json
        http_request \
          -method POST \
          -scheme https \
          -host httpbin.org \
          -path /post \
          -path-body /tmp/body.json \
          -headers "Content-Type:application/json" \
          -path-output /tmp/response.json
        jq -e '.json.test == "data"' /tmp/response.json
    - name: Test DELETE request
      runs: |
        set -euo pipefail
        http_request \
          -method DELETE \
          -scheme https \
          -host httpbin.org \
          -path /delete \
          -path-output /tmp/response.json
        jq -e '.url == "https://httpbin.org/delete"' /tmp/response.json
    - name: Test custom headers
      runs: |
        set -euo pipefail
        http_request \
          -method GET \
          -scheme https \
          -host httpbin.org \
          -path /headers \
          -headers "X-Custom-Header:test-value;X-Another:another-value" \
          -path-output /tmp/response.json
        jq -e '.headers["X-Custom-Header"] == "test-value"' /tmp/response.json
        jq -e '.headers["X-Another"] == "another-value"' /tmp/response.json
