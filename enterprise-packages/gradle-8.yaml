package:
  name: gradle-8
  version: "8.14.3"
  # For version upgrades check whether patches are still needed.
  # Upstream changes are being tracked in https://github.com/gradle/gradle/issues/25945
  epoch: 6
  description: A Java project management and project comprehension tool.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - gradle=${{ package.full-version }}

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - git
      - libudev
      # note: the comment below is not the case while we evaluate the right way to build gradle we have swapped from
      # using the boostrap gradle to gradlewrapper.
      #
      # The first time this is built, it depends on gradle-stage0.yaml being built first,
      # using pre-built gradle binaries, which `provides` a gradle package at an earlier version.
      # Afterwards it depends on previous versions of this package built from source.
      - openjdk-17
      - patch
      - tini
      - zip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gradle/gradle
      tag: v${{package.version}}
      expected-commit: e5ee1df3d88b8ca3a8074787a94f373e3090e1db

  - uses: patch
    with:
      patches: |
        upgrade-deps.patch
        fix-CVE-2025-4949.patch
        commons-lang3-GHSA-j288-q9x7-2f5v.patch
        0001-Backport-9.1-feature-to-honor-default-keystore-type.patch

  - runs: |
      export JAVA_HOME=/usr/lib/jvm/java-17-openjdk

      # Per https://docs.gradle.org/current/userguide/gradle_daemon.html#sec:daemon_jvm_criteria,
      # the Daemon JVM criteria in gradle/gradle-daemon-jvm.properties take precedence over
      # JAVA_HOME.  We want to use the only available JDK, in JAVA_HOME, so we remove the file.
      rm gradle/gradle-daemon-jvm.properties

      # Do not use the gradle wrapper, ensure we're using the bootstrap version.
      ./gradlew :distributions-full:binDistributionZip

      unzip packaging/distributions-full/build/distributions/gradle-*-bin.zip
      cd gradle-*
      mkdir -p ${{targets.destdir}}/usr/share/java/gradle
      mkdir -p ${{targets.destdir}}/usr/share/java/gradle/bin
      mkdir -p ${{targets.destdir}}/usr/share/java/gradle/lib

      mv lib/* ${{targets.destdir}}/usr/share/java/gradle/lib
      mv bin/* ${{targets.destdir}}/usr/share/java/gradle/bin

      mkdir -p ${{targets.destdir}}/usr/bin
      ln -sf /usr/share/java/gradle/bin/gradle ${{targets.destdir}}/usr/bin/gradle

update:
  enabled: true
  ignore-regex-patterns:
    - -M*
    - -RC*
  github:
    identifier: gradle/gradle
    strip-prefix: v
    use-tag: true
    tag-filter: "v8."

test:
  environment:
    contents:
      packages:
        - openjdk-17-default-jdk
  pipeline:
    - name: Verify gradle installation
      runs: |
        set -euo pipefail
        gradle --version
    - name: Basic Gradle project build
      runs: |
        set -euo pipefail

        tee settings.gradle << 'EOF'
        rootProject.name = 'demo'
        EOF

        tee build.gradle << 'EOF'
        println "gradle works!"
        EOF

        gradle build --no-daemon | grep -F 'gradle works!'
        gradle build --no-daemon | grep -F 'gradle works!'
    - name: Compile Java source code
      runs: |
        set -euo pipefail

        # Create a Java project that compiles actual Java code
        mkdir -p java-compile-test/src/main/java/com/example
        cd java-compile-test

        tee settings.gradle << 'EOF'
        rootProject.name = 'java-compile-test'
        EOF

        tee build.gradle << 'EOF'
        plugins {
            id 'java'
        }

        repositories {
            mavenCentral()
        }
        EOF

        tee src/main/java/com/example/HelloWorld.java << 'EOF'
        package com.example;

        public class HelloWorld {
            public static void main(String[] args) {
                System.out.println("Hello from compiled Java!");
            }

            public static String greet(String name) {
                return "Hello, " + name + "!";
            }
        }
        EOF

        # Compile the Java code
        gradle compileJava --no-daemon

        # Verify the compiled .class file exists
        stat build/classes/java/main/com/example/HelloWorld.class

        # Run the compiled class to verify it executes correctly
        java -cp build/classes/java/main com.example.HelloWorld | grep -F "Hello from compiled Java!"
    - name: Test dependency resolution
      runs: |
        set -euo pipefail

        # Create a project with an external dependency
        mkdir -p dep-test/src/main/java/com/example
        cd dep-test

        tee settings.gradle << 'EOF'
        rootProject.name = 'dep-test'
        EOF

        tee build.gradle << 'EOF'
        plugins {
            id 'java'
            id 'application'
        }

        repositories {
            mavenCentral()
        }

        dependencies {
            implementation 'org.apache.commons:commons-lang3:3.12.0'
        }

        application {
            mainClass = 'com.example.DependencyTest'
        }
        EOF

        tee src/main/java/com/example/DependencyTest.java << 'EOF'
        package com.example;

        import org.apache.commons.lang3.StringUtils;

        public class DependencyTest {
            public static void main(String[] args) {
                // Use commons-lang3 to verify dependency was resolved
                String reversed = StringUtils.reverse("gradle");
                System.out.println("Reversed: " + reversed);
                if ("eldarG".equalsIgnoreCase(reversed)) {
                    System.out.println("Dependency resolution works!");
                }
            }
        }
        EOF

        # Build the project - this will download the dependency and compile
        gradle build --no-daemon

        # Verify the compiled class exists
        stat build/classes/java/main/com/example/DependencyTest.class

        # Run with the dependency on classpath to verify it works
        gradle run --no-daemon | grep -F "Dependency resolution works!"
