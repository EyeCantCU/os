package:
  name: chart-iamguarded-contour
  version: "21.1.4"
  epoch: 0
  description: Contour iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: contour/${{package.version}}
      expected-commit: 2037fe8c7abc53ab8dc6ded563e3a0f1c646d337

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/contour

  - uses: charts/package
    with:
      chart-path: iamguarded/contour

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: contour/
    use-tag: true
    tag-filter-prefix: contour/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /contour
