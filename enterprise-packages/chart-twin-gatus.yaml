package:
  name: chart-twin-gatus
  version: "1.4.5"
  epoch: 0
  description: Automated service health dashboard
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/TwiN/helm-charts
      tag: gatus-${{package.version}}
      expected-commit: ca98ce1bc6631fd4e4a829a388945e57365d9d70

  - uses: charts/package
    with:
      chart-path: charts/gatus
      images: |
        gatus:
          values:
            image:
              repository: ${registry_repo}
              tag: ${tag}
              sha: ${digest}
      test: |
        cases:
          - name: default
            images: [gatus]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: TwiN/helm-charts
    strip-prefix: gatus-
    use-tag: true
    tag-filter-prefix: gatus-
