package:
  name: helm-diff
  description: Helm plugin for upgrade diffs
  version: "3.15.0"
  epoch: 1 # CVE-2025-68121
  copyright:
    - license: Apache-2.0
  scriptlets:
    post-install: |
      #!/bin/sh
      for homedir in /home/*; do
        if [ -d $homedir ]; then
          echo "Providing helm-diff plugin for user: $(basename $homedir)"
          mkdir -p $homedir/.local/share/helm/plugins
          ln -sf /root/${{vars.plugindir}} $homedir/${{vars.plugindir}}
        fi
      done
      echo
      echo "NOTICE: If any users are added after this point, you will need to manually symlink this plugin."
      echo
      echo "To do so:"
      echo "ln -s /root/${{vars.plugindir}} \$HOME/${{vars.plugindir}}"
      echo
    post-deinstall: |
      #!/bin/sh
      echo
      echo "Cleaning up symlinks for helm-diff plugin..."
      echo
      for homedir in /home/*; do
        rm -f $homedir/${{vars.plugindir}}
      done

vars:
  plugindir: '.local/share/helm/plugins/helm-diff'
  repo: 'github.com/databus23/helm-diff'

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 66ecc11e70f6f955d65b79649a285a71bde393dc
      repository: https://${{vars.repo}}
      tag: v${{package.version}}

  - uses: go/build
    with:
      packages: .
      output: diff
      prefix: root/${{vars.plugindir}}
      ldflags: |
        -X ${{vars.repo}}/v3/cmd.Version=${{package.version}}

  - runs: cp plugin.yaml ${{targets.contextdir}}/root/${{vars.plugindir}}/

test:
  environment:
    contents:
      packages:
        - helm
    environment:
      HOME: /root
    accounts:
      run-as: 0
  pipeline:
    - runs: |
        helm plugin list | grep ${{package.version}}
        helm diff upgrade -h

update:
  enabled: true
  git:
    strip-prefix: v
