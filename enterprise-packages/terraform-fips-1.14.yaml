package:
  name: terraform-fips-1.14
  version: "1.14.6"
  epoch: 3
  copyright:
    - license: BUSL-1.1
  dependencies:
    provides:
      - terraform-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/terraform
      tag: v${{package.version}}
      expected-commit: 4e6eef57a47e6293ff18323251f5393a23b14645

  - uses: go/bump
    with:
      deps: |-
        github.com/cloudflare/circl@v1.6.3

  - uses: go/build
    with:
      packages: .
      go-package: go-fips-md5
      output: terraform
      ldflags: -X github.com/hashicorp/terraform/version.dev="no"

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for terraform
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/terraform "${{targets.subpkgdir}}"/usr/local/bin
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
        environment:
          PATH: /usr/local/bin:/usr/local/sbin:/usr/bin:/usr/sbin:/bin:/sbin
      pipeline:
        - name: Verify symlink exists and points to correct target
          runs: |
            set -euo pipefail

            # Verify symlink exists (fails test if missing)
            stat /usr/local/bin/terraform

            # Verify symlink points to correct target (fails test if wrong)
            readlink /usr/local/bin/terraform | grep -F "/usr/bin/terraform"
        - uses: test/tw/ver-check
          with:
            bins: terraform
        - uses: test/tw/help-check
          with:
            bins: terraform

  - name: ${{package.name}}-local-provider-config
    description: Configure Terraform to use local providers
    dependencies:
      provides:
        - terraform-local-provider-config=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/terraform/provider-mirror
          cat > "${{targets.subpkgdir}}"/terraform/.terraformrc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "/terraform/provider-mirror"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - name: Verify terraformrc configuration
          runs: |
            set -euo pipefail

            # Verify config file exists
            stat /terraform/.terraformrc

            # Verify filesystem_mirror configuration is present (fails test if missing)
            grep -F "filesystem_mirror" /terraform/.terraformrc
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: terraform-local-provider-config

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.14

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: terraform
    - uses: test/tw/help-check
      with:
        bins: terraform
    - name: Terraform Initialization
      runs: |
        set -euo pipefail
        echo "provider \"local\" {}" > example.tf
        terraform init -input=false
    - name: Terraform Plan Creation
      runs: |
        set -euo pipefail
        terraform plan -input=false -out=tfplan
    - name: Terraform Apply Execution
      runs: |-
        set -euo pipefail
        terraform apply -input=false tfplan

environment:
  contents:
    packages:
      - go-fips-1.25
