package:
  name: erlang-fips-27
  version: "27.3.4.8"
  epoch: 0
  description: General-purpose programming language and runtime environment
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # mnesia depends on the ca-certificates bundle
      - ca-certificates-bundle
    provides:
      - erlang-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - freetds-dev
      - ncurses-dev
      - openssl-dev
      - perl-dev
      - unixodbc-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/erlang/otp
      tag: OTP-${{package.version}}
      expected-commit: 61633c62611720cc27f92026d075a1f2862ce522

  - runs: |
      export CPPFLAGS="-D_BSD_SOURCE $CPPFLAGS"

      ./otp_build autoconf
      ./configure \
        --prefix=/usr \
        --sysconfdir=/etc \
        --mandir=/usr/share/man \
        --infodir=/usr/share/info \
        --host="$CHOST" \
        --build="$CBUILD" \
        --enable-threads \
        --enable-shared-zlib \
        --enable-ssl=dynamic-ssl-lib \
        --enable-jit \
        --enable-fips

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      mkdir -p "${{targets.destdir}}"/etc/erlang/releases/27
      install -Dm644 sys.config \
        "${{targets.destdir}}"/etc/erlang/releases/27/sys.config

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: "headers for erlang"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
      provides:
        - erlang-fips-dev=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: erlang-fips-dev
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-odbc
    description: "Erlang odbc library"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/erlang/lib
          mv "${{targets.destdir}}"/usr/lib/erlang/lib/odbc-* "${{targets.subpkgdir}}"/usr/lib/erlang/lib
    dependencies:
      runtime:
        - ${{package.name}}
        - freetds
        - unixodbc
      provides:
        - erlang-fips-odbc=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: erlang-fips-odbc
            real-pkg-name: ${{subpkg.name}}
        - name: Verify ODBC module loads
          runs: |
            set -euo pipefail
            # Verify ODBC module can be loaded successfully (fails test if module not found)
            erl -eval '{module, odbc} = code:ensure_loaded(odbc), halt().' -noshell

update:
  enabled: true
  github:
    identifier: erlang/otp
    strip-prefix: OTP-
    tag-filter: OTP-27

test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: |
          ct_run
          dialyzer
          erl
          typer
    - name: Verify FIPS mode is enabled
      runs: |
        set -euo pipefail
        # Verify FIPS mode is enabled in crypto module (critical for FIPS-labeled package)
        output=$(erl -eval 'io:format("FIPS: ~p~n", [crypto:info_fips()]), halt().' -noshell)
        echo "$output"
        echo "$output" | grep -F "enabled" || {
          echo "FAIL: FIPS mode is not enabled"
          exit 1
        }
    - name: Test Erlang compilation and execution
      runs: |
        set -euo pipefail
        tee hello.erl <<'EOF'
        -module(hello).
        -export([hello_wolfi/0]).

        hello_wolfi() -> io:fwrite("hello, wolfi\n").
        EOF

        # Compile Erlang module (fails test if compilation fails)
        erlc hello.erl

        # Execute and verify output (fails test if execution fails)
        erl -noshell -pa . -eval "hello:hello_wolfi()." -s init stop
    - uses: test/tw/ldd-check
