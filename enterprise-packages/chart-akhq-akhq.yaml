package:
  name: chart-akhq-akhq
  version: "0.26.0"
  epoch: 0
  description: Kafka GUI for Apache Kafka to manage topics, topics data, consumers group, schema registry, connect and more...
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tchiotludo/akhq
      tag: ${{package.version}}
      expected-commit: a39a1d0d4af145e9cd4f72399f919bb36b9900a0

  - uses: charts/package
    with:
      chart-path: helm/akhq
      images: |
        akhq:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [akhq]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: tchiotludo/akhq
    use-tag: true
