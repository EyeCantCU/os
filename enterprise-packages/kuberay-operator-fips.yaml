package:
  name: kuberay-operator-fips
  version: "1.5.1"
  epoch: 3 # CVE-2025-61730
  description: A toolkit to run Ray applications on Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 9e8a2c085b7b7c96cf7cc5d857787bc2d78406c6
      repository: https://github.com/ray-project/kuberay.git
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: ray-operator
      packages: .
      output: manager
      ldflags: -X 'main._buildTime_=$(date "+%F %T")' -X 'main._commitId_=$(git rev-parse HEAD)'
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: ray-project/kuberay
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - git
        - curl
        - kustomize
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: manager
    - uses: test/kwok/cluster
    - name: Fetch the kuberay from the source repo
      runs: |
        set -euo pipefail
        git clone --depth=1 https://github.com/ray-project/kuberay
    - name: Test operator with Ray Job
      uses: test/daemon-check-output
      with:
        setup: |
          set -euo pipefail
          # Apply CRDs using kustomize
          kustomize build kuberay/ray-operator/config/crd | kubectl apply --server-side=true -f -
          # Wait for CRDs to be established
          kubectl wait --for=condition=Established crd --all --timeout=60s
        start: /usr/bin/manager --leader-election-namespace=default
        expected_output: "Starting Controller"
        timeout: "60"
        post: |-
          set -euo pipefail

          # Apply a sample RayJob to verify the operator processes CRs correctly
          kubectl apply -f kuberay/ray-operator/config/samples/ray-job.sample.yaml

          # Verify the RayJob CR was created (proves kubectl apply worked)
          kubectl get rayjob -n default || { echo "FAIL: RayJob not created"; exit 1; }

          # Wait for the operator to process the RayJob and create associated pods
          # The operator creates a RayCluster which in turn creates head/worker pods
          sleep 10

          # Verify pods were created by the operator processing the RayJob
          kubectl wait --for=condition=Ready pods --all -n default --timeout=120s || {
            echo "FAIL: Pods not ready - operator may not have processed RayJob correctly"
            kubectl get pods -n default
            kubectl get rayjob -n default -o yaml
            exit 1
          }

          echo "SUCCESS: Operator processed RayJob and pods are ready"
