package:
  name: elastic-agent-9.2
  version: "9.2.5"
  epoch: 1 # CVE-2025-68121
  description: Elastic Agent - single, unified way to add monitoring for logs, metrics, and other types of data to a host.
  copyright:
    - license: Elastic-2.0
  resources:
    cpu: 8
    memory: 16Gi
  dependencies:
    provides:
      - elastic-agent=${{package.full-version}}
    runtime:
      - agentbeat
      - apm-server-${{vars.major-minor-version}}
      - bash # entrypoint uses bash and exec ¯\_(ツ)_/¯
      - cloudbeat-${{vars.major-minor-version}}
      - fleet-server-${{vars.major-minor-version}}
      - opentelemetry-collector
      - tini

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/elastic/elastic-agent
      tag: v${{package.version}}
      expected-commit: 3c8f46f1bc6c30dad5b71525a7768410afeec505

  - uses: go/bump
    with:
      deps: |-
        github.com/expr-lang/expr@v1.17.7

  - uses: go/build
    with:
      packages: ./
      output: elastic-agent
      buildmode: pie
      install-dir: share/elastic-agent/data/elastic-agent-$(git rev-parse --short=6 HEAD)
      ldflags: |
        -X github.com/elastic/elastic-agent/version.commit=$(git rev-parse --short=6 HEAD)
        -X github.com/elastic/elastic-agent/version.buildTime=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

  - name: copy extras
    runs: |
      SHORT_HASH=$(git rev-parse --short=6 HEAD)
      mkdir -p ${{targets.destdir}}/usr/local/bin
      cp dev-tools/packaging/templates/docker/docker-entrypoint.elastic-agent.tmpl ${{targets.destdir}}/usr/local/bin/docker-entrypoint

      mkdir -p ${{targets.destdir}}/usr/share/elastic-agent
      cp elastic-agent.reference.yml ${{targets.destdir}}/usr/share/elastic-agent/elastic-agent.reference.yml
      cp otel.yml ${{targets.destdir}}/usr/share/elastic-agent/otel.yml
      cp elastic-agent.docker.yml ${{targets.destdir}}/usr/share/elastic-agent/elastic-agent.yml

      mkdir -p ${{targets.destdir}}/usr/share/elastic-agent/otel_samples
      cp -r internal/pkg/otel/samples/linux/* ${{targets.destdir}}/usr/share/elastic-agent/otel_samples

      mkdir -p ${{targets.destdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH
      echo "${{package.version}}" | tee "${{targets.destdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/package.version" > /dev/null

      mkdir -p ${{targets.destdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components
      cp specs/apm-server.spec.yml ${{targets.destdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/apm-server.spec.yml
      cp specs/cloudbeat.spec.yml ${{targets.destdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/cloudbeat.spec.yml
      cp specs/fleet-server.spec.yml ${{targets.destdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/fleet-server.spec.yml

      mkdir -p ${{targets.destdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/logs

      # This isn't great, but their entrypoint is a template and is interpreted by mage. We can't re-use the mage function since
      # it builds the entire docker image.
      cp dev-tools/packaging/templates/docker/docker-entrypoint.elastic-agent.tmpl docker-entrypoint
      sed -i 's/{{[[:space:]]*\.BeatName[[:space:]]*}}/elastic-agent/g' docker-entrypoint
      cp docker-entrypoint ${{targets.contextdir}}/usr/local/bin/docker-entrypoint
      chmod 755 ${{targets.contextdir}}/usr/local/bin/docker-entrypoint

  - name: copy licenses
    runs: |
      cp LICENSE.txt ${{targets.destdir}}/usr/share/elastic-agent/LICENSE.txt
      cp NOTICE.txt ${{targets.destdir}}/usr/share/elastic-agent/NOTICE.txt

  - name: symlink files to /usr/share/elastic-agent/data/elastic-agent-hash
    runs: |
      SHORT_HASH=$(git rev-parse --short=6 HEAD)
      mkdir -p ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components

      ln -sf /usr/bin/agentbeat ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/agentbeat
      ln -sf /usr/share/agentbeat/agentbeat.spec.yml ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/agentbeat.spec.yml
      ln -sf /usr/share/agentbeat/module ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/module

      ln -sf /usr/bin/apm-server ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/apm-server
      ln -sf /usr/share/apm-server/apm-server.yml ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/apm-server.yml

      ln -sf /usr/bin/cloudbeat ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/cloudbeat
      ln -sf /usr/share/cloudbeat/cloudbeat.yml ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/cloudbeat.yml

      ln -sf /usr/bin/fleet-server ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/fleet-server

      ln -sf /usr/bin/otelcol ${{targets.contextdir}}/usr/share/elastic-agent/otelcol
      ln -sf /usr/bin/otelcol ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/otelcol

      ln -sf /usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/elastic-agent ${{targets.contextdir}}/usr/share/elastic-agent/elastic-agent
      ln -sf /usr/share/elastic-agent/elastic-agent.yml ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/elastic-agent.yml
      ln -sf /usr/share/elastic-agent/LICENSE.txt ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/LICENSE.txt
      ln -sf /usr/share/elastic-agent/NOTICE.txt ${{targets.contextdir}}/usr/share/elastic-agent/data/elastic-agent-$SHORT_HASH/components/NOTICE.txt

  - uses: strip

update:
  enabled: true
  github:
    strip-prefix: v
    identifier: elastic/elastic-agent
    use-tag: true
    tag-filter-prefix: v9.2.

test:
  pipeline:
    - runs: |
        $(ls -d /usr/share/elastic-agent/data/elastic-agent-*/elastic-agent | tail -n1) version --binary-only
