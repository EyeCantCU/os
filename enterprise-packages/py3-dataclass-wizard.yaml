package:
  name: py3-dataclass-wizard
  version: "0.35.1"
  epoch: 0
  description: A simple, yet elegant, set of wizards to help you convert Python dataclasses to and from JSON/YAML, with full type-hinting and serialization support.
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: dataclass-wizard
  import: dataclass_wizard

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - py3-supported-build-base
      - py3-supported-build-base-dev
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rnag/dataclass-wizard
      tag: v${{package.version}}
      expected-commit: 67ce79753f16901d5e46efa7b712a32937b67e34

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-typing-extensions
        - py${{range.key}}-tzdata
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            wiz --help
            wiz --version

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  git:
    strip-prefix: v
