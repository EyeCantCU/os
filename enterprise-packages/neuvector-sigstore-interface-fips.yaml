#nolint:git-checkout-must-use-github-updates,valid-pipeline-git-checkout-tag
package:
  name: neuvector-sigstore-interface-fips
  version: "0_git20260210"
  epoch: 0 # go/enterprise-rsc/neuvector-sigstore-interface-fips
  description: NeuVector sigstore interface for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openssl-config-fipshardened
  resources:
    cpu: "4"
    memory: 8Gi

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neuvector/sigstore-interface
      branch: main
      expected-commit: 7a92b9b39c0a095ce264980df4e7757ef9548efc

  - uses: go/build
    with:
      modroot: .
      packages: .
      output: sigstore-interface
      prefix: usr/local
      vendor: true
      go-package: go-fips

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        sigstore-interface --help

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: No releases or tags
