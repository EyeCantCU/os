package:
  name: chart-grafana-alloy-operator
  version: "0.4.2"
  epoch: 0
  description: A Helm chart the Alloy Operator, a project to innovate on creating instances of Grafana Alloy.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/alloy-operator
      tag: alloy-operator-${{package.version}}
      expected-commit: f56620536a432a71b15fe36755029e77ad803b1a

  # Remove repository refs from subchart dependencies and extract the vendored
  # alloy-crd tgz to a directory. The subcharts are already vendored in charts/
  # (alloy-crd as tgz, podlogs-crd as dir). Removing repository prevents the
  # vendor step from rewriting them to file:// root paths, and extracting the
  # tgz ensures helm dependency build can find both as local directories.
  - runs: |
      cd charts/alloy-operator
      yq -i 'del(.dependencies[].repository)' Chart.yaml
      tar -xzf charts/alloy-crd-1.0.0.tgz -C charts/
      rm charts/alloy-crd-1.0.0.tgz

  - uses: charts/package
    with:
      chart-path: charts/alloy-operator
      images: |
        alloy-operator:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${tag}
              digest: ${digest}
      test: |
        cases:
          - name: default
            images: [alloy-operator]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: grafana/alloy-operator
    strip-prefix: alloy-operator-
    use-tag: true
    tag-filter-prefix: alloy-operator-
