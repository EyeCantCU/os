package:
  name: rootlesskit-fips
  version: "2.3.6"
  epoch: 4
  description: RootlessKit is a Linux-native implementation of "fake root" using user_namespaces(7).
  copyright:
    - license: Apache-2.0
  dependencies:
    # Let's ensure that we have config. This gets the default, but can also
    # be overriden by users.
    runtime:
      - rootlesskit-config-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rootless-containers/rootlesskit
      expected-commit: a1d6ded184cf5915981a2978c61116013b91189f
      tag: v${{package.version}}

  - uses: go/build
    with:
      output: rootlesskit
      packages: ./cmd/rootlesskit
      go-package: go-fips

  - uses: go/build
    with:
      output: rootlessctl
      packages: ./cmd/rootlessctl
      go-package: go-fips

  - uses: go/build
    with:
      output: rootlesskit-docker-proxy
      packages: ./cmd/rootlesskit-docker-proxy
      go-package: go-fips

subpackages:
  - name: "rootlesskit-config-nonroot-fips"
    description: Rootlesskit config for nonroot user
    dependencies:
      runtime:
        - rootlesskit-fips
      provides:
        - rootlesskit-config-fips=${{package.full-version}}
    pipeline:
      # See https://rootlesscontaine.rs/getting-started/common/subuid/
      - runs: |
          mkdir -p ${{targets.destdir}}/etc
          echo "nonroot:100000:65536" > ${{targets.destdir}}/etc/subuid
          echo "nonroot:100000:65536" > ${{targets.destdir}}/etc/subgid
    test:
      pipeline:
        - name: Verify config files
          runs: |
            set -euo pipefail
            # Verify subuid file exists and has correct content
            stat /etc/subuid
            grep -F "nonroot:100000:65536" /etc/subuid

            # Verify subgid file exists and has correct content
            stat /etc/subgid
            grep -F "nonroot:100000:65536" /etc/subgid

update:
  enabled: true
  github:
    identifier: rootless-containers/rootlesskit
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: |
          rootlesskit
          rootlessctl
    - uses: test/tw/help-check
      with:
        bins: |-
          rootlesskit
          rootlessctl
          rootlesskit-docker-proxy

environment:
  contents:
    packages:
      - go-fips-1.25
