package:
  name: chart-openebs-dynamic-localpv-provisioner
  version: "4.4.0"
  epoch: 0
  description: Helm chart for OpenEBS Dynamic Local PV provisioner
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openebs/dynamic-localpv-provisioner
      tag: v${{package.version}}
      expected-commit: 9d5dad82ad12edb4bf85d30316227194a48c86f5

  # Source chart has "4.4.0-prerelease" placeholders that are replaced at release time
  - runs: |
      yq -i '.version = "${{package.version}}"' deploy/helm/charts/Chart.yaml
      yq -i '.appVersion = "${{package.version}}"' deploy/helm/charts/Chart.yaml
      yq -i '.localpv.image.tag = "${{package.version}}"' deploy/helm/charts/values.yaml

  - uses: charts/package
    with:
      chart-path: deploy/helm/charts
      images: |
        provisioner-localpv:
          values:
            localpv:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${pseudo_tag}
        linux-utils:
          values:
            helperPod:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [provisioner-localpv, linux-utils]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: openebs/dynamic-localpv-provisioner
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
