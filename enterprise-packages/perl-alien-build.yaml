package:
  name: perl-alien-build
  version: "2.84"
  epoch: 0
  description: Build external dependencies for use in CPAN
  copyright:
    - license: Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl-capture-tiny
      - perl-ffi-checklib
      - perl-file-chdir
      - perl-file-which
      - perl-path-tiny

environment:
  contents:
    packages:
      - build-base
      - perl-capture-tiny
      - perl-dev
      - perl-ffi-checklib
      - perl-file-chdir
      - perl-file-which
      - perl-path-tiny
      - pkgconf

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PL/PLICEASE/Alien-Build-${{package.version}}.tar.gz
      expected-sha256: 8e891fd3acbac39dd8fdc01376b9abff931e625be41e0910ca30ad59363b4477

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 15795

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Smoke test
      runs: echo "use Alien::Build;" | perl
    - runs: |
        perl <<'EOF'
        use strict;
        use warnings;
        use Alien::Build;

        # Test that we can create an Alien::Build instance
        my $build = Alien::Build->new();
        die "Failed to create Alien::Build instance" unless defined $build;
        print "Alien::Build instance created successfully\n";

        # Test that we can load Alien::Base::Wrapper
        eval "use Alien::Base::Wrapper";
        die "Failed to load Alien::Base::Wrapper: $@" if $@;
        print "Alien::Base::Wrapper loaded successfully\n";

        print "Alien::Build tests passed\n";
        EOF
