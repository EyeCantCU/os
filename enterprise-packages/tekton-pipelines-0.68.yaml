package:
  name: tekton-pipelines-0.68
  version: 0.68.1
  epoch: 10 # GHSA-fcv2-xgw5-pqxf
  description: A cloud-native Pipeline resource.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - tekton-pipelines=${{package.full-version}}

vars:
  base-package-name: tekton-pipelines

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+.\d+)\.\d+$
    replace: $1
    to: major-minor-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tektoncd/pipeline
      tag: v${{package.version}}
      expected-commit: 1a01f6b169c12df4886ec58f4fc2bad9f173042d

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        github.com/sigstore/sigstore@v1.10.4
      modroot: test/resolver-with-timeout

  - uses: go/bump
    with:
      deps: |-
        github.com/containerd/containerd@v1.7.29
        github.com/go-jose/go-jose/v3@v3.0.4
        github.com/go-jose/go-jose/v4@v4.0.5
        github.com/golang-jwt/jwt/v4@v4.5.2
        github.com/golang-jwt/jwt/v5@v5.2.2
        golang.org/x/net@v0.38.0
        golang.org/x/oauth2@v0.27.0
        github.com/cloudflare/circl@v1.6.1
        golang.org/x/crypto@v0.45.0
        github.com/sigstore/sigstore@v1.10.4
      replaces: github.com/containerd/containerd=github.com/containerd/containerd@v1.7.29 # containerd wasn't getting bumped without this

data:
  - name: cmds
    items:
      controller: controller
      entrypoint: entrypoint
      events: events
      nop: nop
      resolvers: resolvers
      sidecarlogresults: sidecarlogresults
      webhook: webhook
      workingdirinit: workingdirinit

subpackages:
  - range: cmds
    name: ${{vars.base-package-name}}-${{range.key}}-${{vars.major-minor-version}}
    description: tekton pipelines ${{range.key}}
    dependencies:
      provides:
        - ${{vars.base-package-name}}-${{range.key}}=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/${{range.key}}
          output: ${{range.key}}
    test:
      pipeline:
        - runs: |
            if [ ${{range.key}} != "webhook" ]
            then
              ${{range.key}} --help
            fi

  - range: cmds
    name: ${{vars.base-package-name}}-${{range.key}}-${{vars.major-minor-version}}-compat
    description: tekton pipelines ${{range.key}} compat package
    dependencies:
      provides:
        - ${{vars.base-package-name}}-${{range.key}}-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/ko-app
          ln -sf /usr/bin/${{range.key}} ${{targets.contextdir}}/ko-app/${{range.key}}
    test:
      environment:
        contents:
          packages:
            - ${{vars.base-package-name}}-${{range.key}}-${{vars.major-minor-version}}
      pipeline:
        - runs: stat -L /ko-app/${{range.key}}

update:
  enabled: true
  github:
    identifier: tektoncd/pipeline
    strip-prefix: v
    tag-filter: v0.68.

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
