package:
  name: kubernetes-event-exporter-fips
  version: "1.7"
  epoch: 19 # CVE-2025-68119
  description: Export Kubernetes events to multiple destinations with routing and filtering
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/resmoio/kubernetes-event-exporter
      tag: v${{package.version}}
      expected-commit: 2668c4309da33fd47ee0846923b8aa2107b87f88

  - uses: go/bump
    with:
      deps: |-
        github.com/hashicorp/go-retryablehttp@v0.7.7
        google.golang.org/grpc@v1.56.3
        google.golang.org/protobuf@v1.33.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        golang.org/x/crypto@v0.45.0
        github.com/sirupsen/logrus@v1.9.1
      modroot: .

  - uses: go/build
    with:
      modroot: .
      packages: .
      output: kubernetes-event-exporter
      ldflags: -X 'github.com/resmoio/kubernetes-event-exporter/pkg/version.Version=${{package.version}}'
      go-package: go-fips

update:
  enabled: true
  ignore-regex-patterns:
    - kubernetes-e.*t-exporter-* # there are some misspellings in the upstream tags so using a wildcard here
  github:
    identifier: resmoio/kubernetes-event-exporter
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
    environment:
      KUBERNETES_SERVICE_HOST: "127.0.0.1"
      KUBERNETES_SERVICE_PORT: "32764"
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: kubernetes-event-exporter
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - name: Test Kubernetes event exporter with file sink
      uses: test/daemon-check-output
      with:
        setup: |
          # Create ClusterRole for event watching cluster-wide
          kubectl apply -f - <<'EOF'
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRole
          metadata:
            name: event-exporter
          rules:
          - apiGroups: [""]
            resources: ["events"]
            verbs: ["get", "list", "watch"]
          - apiGroups: [""]
            resources: ["configmaps"]
            verbs: ["get", "list", "watch"]
          EOF

          # Create ClusterRoleBinding to grant permissions to default SA
          kubectl apply -f - <<'EOF'
          apiVersion: rbac.authorization.k8s.io/v1
          kind: ClusterRoleBinding
          metadata:
            name: event-exporter
          roleRef:
            apiGroup: rbac.authorization.k8s.io
            kind: ClusterRole
            name: event-exporter
          subjects:
          - kind: ServiceAccount
            name: default
            namespace: default
          EOF

          # Create config with file sink for output verification
          mkdir -p /tmp/event-output
          tee /tmp/event-config.yaml <<'EOF'
          logLevel: info
          route:
            routes:
              - match:
                  - receiver: file-sink
          receivers:
            - name: file-sink
              file:
                path: /tmp/event-output/events.json
                layout: {}
          EOF
        start: /usr/bin/kubernetes-event-exporter -conf /tmp/event-config.yaml
        expected_output: "Registering sink"
        timeout: "60"
        post: |
          # Create a test pod to trigger events in the cluster
          kubectl run test-pod --image=busybox --restart=Never -- sleep 3600

          # Wait for events to be processed and exported to file sink
          sleep 10

          # Verify file sink received exported events
          if [ -s /tmp/event-output/events.json ]; then
            echo "SUCCESS: Events exported to file sink"
            head -5 /tmp/event-output/events.json
          else
            echo "FAIL: No events exported to file sink after pod creation"
            ls -la /tmp/event-output/ || true
            exit 1
          fi
