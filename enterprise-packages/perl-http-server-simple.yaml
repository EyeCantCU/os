package:
  name: perl-http-server-simple
  version: "0.52"
  epoch: 1 # go/enterprise-rsc/perl-http-server-simple
  description: Lightweight HTTP server
  copyright:
    - license: Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl-cgi
  resources:
    cpu: "1"
    memory: 4Gi

environment:
  contents:
    packages:
      - perl-cgi
      - perl-test-pod
      - perl-test-pod-coverage

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/bestpractical/http-server-simple.git
      tag: ${{package.version}}
      expected-commit: 620c6b5a926182cce9f1d1e7ba60294e2c7183ed

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    # package perl-http-server-simple is outdated: current version 0.52, next version 0.45_08 (commit b2ef06ad08b31641dc555e49be5818e4c1aafad2)
    - _\d*
  git: {}

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  environment:
    contents:
      packages:
        - perl
        - wait-for-it
        - curl
  pipeline:
    - name: Smoke test
      runs: echo "use HTTP::Server::Simple;" | perl
    - uses: test/daemon-check-output
      with:
        setup: |
          tee /tmp/server.perl <<'EOF'
          use warnings;
          use strict;
          use HTTP::Server::Simple;
          HTTP::Server::Simple->new()->run();
          EOF
        start: perl /tmp/server.perl
        # Output doesn't seem to be able to be recorded by this pipeline
        # wait-for-it works well enough here, though
        expected_output: " "
        post: |
          wait-for-it localhost:8080
          curl localhost:8080 | grep -F -e "You now have a functional HTTP::Server::Simple::CGI running"
