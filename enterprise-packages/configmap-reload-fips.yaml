package:
  name: configmap-reload-fips
  version: "0.15.0"
  epoch: 6
  description: Simple binary to trigger a reload when a Kubernetes ConfigMap is updated
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+$
    replace: "$1"
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jimmidyson/configmap-reload
      expected-commit: 3f1e9babda3b94b235d203712c17cb88c53d43d8
      tag: v${{package.version}}

  - uses: go/build
    with:
      packages: configmap-reload.go
      output: configmap-reload
      go-package: go-fips

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: configmap-reload
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p "/opt/iamguarded/configmap-reload/bin/"
          ln -s "../../../../usr/bin/configmap-reload" "/opt/iamguarded/configmap-reload/bin/configmap-reload"
      - uses: iamguarded/finalize-compat
        with:
          package: configmap-reload
          version: ${{vars.major-version}}
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: configmap-reload
            version: ${{vars.major-version}}
        - uses: test/tw/symlink-check
        - runs: |
            stat /opt/iamguarded/configmap-reload/bin/configmap-reload

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: configmap-reload
    - name: Verify binary functionality
      runs: |
        set -euo pipefail

        # Create test directory and file to watch
        mkdir -p /tmp/test-volume
        echo "initial-config" > /tmp/test-volume/config.yaml

        # Start configmap-reload in background with timeout
        # Binary will watch for file changes and call webhook
        timeout 3s configmap-reload \
          -volume-dir=/tmp/test-volume \
          -webhook-url=http://localhost:8080/reload \
          -webhook-method=POST \
          > /tmp/output.log 2>&1 &
        PID=$!

        # Give it a moment to start watching
        sleep 1

        # Verify process is running
        stat /proc/$PID/exe

        # Wait for timeout (expected exit code 143 from SIGTERM or 124 from timeout)
        wait $PID || EXIT_CODE=$?
        [ "$EXIT_CODE" -eq 143 ] || [ "$EXIT_CODE" -eq 124 ]

        # Verify it detected the volume directory
        grep -F "/tmp/test-volume" /tmp/output.log

update:
  enabled: true
  github:
    identifier: jimmidyson/configmap-reload
    strip-prefix: v
    tag-filter: v
    use-tag: true
