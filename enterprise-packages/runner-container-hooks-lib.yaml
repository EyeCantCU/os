package:
  name: runner-container-hooks-lib
  version: "0.8.1"
  epoch: 0
  description: Hook library for GitHub Actions runner container hooks
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - nodejs
      - npm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/actions/runner-container-hooks
      tag: v${{package.version}}
      expected-commit: d21e5b430e78919ed73b7690a377723bf2a34d8e

  - name: Install dependencies and build
    runs: |
      # Install dependencies for all packages (bootstrap)
      npm run bootstrap

      # Build all TypeScript packages
      npm run build-all

      # only hooklib
      mkdir -p "${{targets.destdir}}/usr/share/actions-runner-container-hooks/hooklib"
      cp -r packages/hooklib/lib/* "${{targets.destdir}}/usr/share/actions-runner-container-hooks/hooklib/"

  - uses: strip

update:
  enabled: true
  github:
    identifier: actions/runner-container-hooks
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - runs: |
        test -d /usr/share/actions-runner-container-hooks/hooklib
