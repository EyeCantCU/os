package:
  name: azure-functions-nodejs-worker
  version: "3.13.0"
  epoch: 0
  description: Nodejs support for Azure Functions based on Nodejs 18, 20 and 22, serverless hosting on Linux and the Functions 4.0 runtime.
  target-architecture:
    - x86_64
  copyright:
    - license: MIT
    - license: Apache-2.0
    - license: LGPL-2.1
    - license: BSD-2-Clause
    - license: BSD-3-Clause
    - license: ISC

environment:
  contents:
    packages:
      - bash
      - busybox
      - nodejs-22
      - npm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Azure/azure-functions-nodejs-worker.git
      tag: v${{package.version}}
      expected-commit: dd9af28488aebc0c5040174999b8d3963ef0bd6f

  - name: Build Functions Node worker
    runs: |
      npm ci
      npm run build
      npm run webpack

  - name: Install Functions Node worker
    runs: |
      mkdir -p "${{targets.destdir}}"/usr/share/worker-node/dist/src/
      mv Worker.nuspec "${{targets.destdir}}"/usr/share/worker-node
      mv dist/src/nodejsWorker.js "${{targets.destdir}}"/usr/share/worker-node/dist/src/
      mv dist/src/worker-bundle.js "${{targets.destdir}}"/usr/share/worker-node/dist/src/
      mv LICENSE "${{targets.destdir}}"/usr/share/worker-node
      mv NOTICE.html "${{targets.destdir}}"/usr/share/worker-node
      mv package.json "${{targets.destdir}}"/usr/share/worker-node
      mv worker.config.json "${{targets.destdir}}"/usr/share/worker-node

update:
  enabled: true
  github:
    identifier: Azure/azure-functions-nodejs-worker
    strip-prefix: v
  ignore-regex-patterns:
    - types-

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test worker files exist
      runs: |
        test -f /usr/share/worker-node/Worker.nuspec
        test -f /usr/share/worker-node/package.json
        test -f /usr/share/worker-node/worker.config.json
        test -f /usr/share/worker-node/dist/src/nodejsWorker.js
        test -f /usr/share/worker-node/dist/src/worker-bundle.js
