package:
  name: hcl2json-fips
  version: 0.6.8
  epoch: 1 # CVE-2025-68119
  description: Tool to convert from HCL to json
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tmccombs/hcl2json
      tag: v${{package.version}}
      expected-commit: 03ebaebe4aea7739e4e6dd642c693af67b4be3a5

  - uses: go/build
    with:
      packages: .
      output: hcl2json
      ldflags: -X main.version=${{package.version}}
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: tmccombs/hcl2json
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: hcl2json
    - uses: test/tw/help-check
      with:
        bins: hcl2json
    - name: "Functional tests: hcl to json conversion"
      runs: |
        # Create a sample HCL config
        tee test.hcl << 'EOF'
        variable "example" {
          type = string
          default = "hello"
        }
        resource "null_resource" "test" {
          triggers = {
            value = var.example
          }
        }
        EOF

        # Convert HCL to JSON
        hcl2json test.hcl > output.json
        # Verify JSON is valid and contains expected content
        jq -e '.variable.example[0].default == "hello"' output.json
        jq -e '.resource."null_resource".test[0]' output.json
    - name: Test stdin input
      runs: |
        echo 'foo = "bar"' | hcl2json | jq -e '.foo == "bar"'
    - name: "Test simplify"
      runs: |
        # Create a sample HCL config with constant expressions
        tee simplify.hcl << 'EOF'
        value = (1 + 2) * 5
        list  = [1, 2, 3 * 4]
        EOF
        # Convert HCL to JSON with expression simplification enabled
        hcl2json -simplify simplify.hcl > simplify.json
        # Verify expressions were simplified/evaluated
        jq -e '.value == 15' simplify.json
        jq -e '.list[2] == 12' simplify.json
