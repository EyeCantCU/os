package:
  name: chart-apache-airflow
  version: "1.19.0"
  epoch: 0
  description: The official Helm chart to deploy Apache Airflow, a platform to programmatically author, schedule, and monitor workflows
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - helm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/airflow
      tag: helm-chart/${{package.version}}
      expected-commit: f17d6ffb05cc0ffda638b7c0ef5b5d6d12f1c314

  # Extract the already-vendored postgresql subchart so charts/package can
  # vendor it via file:// path. The upstream chart ships the dependency in
  # chart/charts/postgresql-*.tgz. We unpack it to /postgresql/ where the
  # vendoring step expects to find it.
  - runs: |
      mkdir -p /postgresql
      tar xzf chart/charts/postgresql-*.tgz -C /
      rm -f chart/charts/postgresql-*.tgz

  - uses: charts/package
    with:
      chart-path: chart
      images: |
        airflow:
          values:
            defaultAirflowRepository: ${registry_repo}
            defaultAirflowTag: ${tag}
            defaultAirflowDigest: ${digest}
        statsd:
          values:
            images:
              statsd:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        redis:
          values:
            images:
              redis:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        pgbouncer:
          values:
            images:
              pgbouncer:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        pgbouncer-exporter:
          values:
            images:
              pgbouncerExporter:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        git-sync:
          values:
            images:
              gitSync:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        flower:
          values:
            images:
              flower:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [airflow, statsd, redis]
          - name: with-pgbouncer
            images: [airflow, statsd, pgbouncer, pgbouncer-exporter]
            values:
              pgbouncer:
                enabled: true
              redis:
                enabled: false
              executor: LocalExecutor
          - name: with-git-sync
            images: [airflow, statsd, redis, git-sync]
            values:
              dags:
                gitSync:
                  enabled: true
                  repo: https://github.com/apache/airflow.git
                  branch: main
                  subPath: tests/dags
          - name: with-flower
            images: [airflow, statsd, redis, flower]
            values:
              flower:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: apache/airflow
    strip-prefix: helm-chart/
    use-tag: true
    tag-filter-prefix: helm-chart/
