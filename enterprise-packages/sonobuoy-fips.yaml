package:
  name: sonobuoy-fips
  version: "0.57.3"
  epoch: 9
  description: Sonobuoy is a diagnostic tool that makes it easier to understand the state of a Kubernetes cluster by running a set of Kubernetes conformance tests and other plugins in an accessible and non-destructive manner.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/vmware-tanzu/sonobuoy
      expected-commit: a988242e8bbded3ef4602eda48addcfac24a1a91
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        github.com/sirupsen/logrus@v1.9.1

  - uses: go/build
    with:
      packages: .
      output: sonobuoy
      ldflags: -X github.com/vmware-tanzu/sonobuoy/pkg/buildinfo.Version=v${{package.version}}
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: vmware-tanzu/sonobuoy
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: sonobuoy
    - name: "Check sonobuoy version"
      runs: |
        set -euo pipefail
        # Verify version is correctly embedded (fails if version string doesn't match)
        sonobuoy version | grep -F "Sonobuoy Version: v${{package.version}}"
    - uses: test/kwok/cluster
    - name: "Test sonobuoy gen command"
      runs: |
        set -euo pipefail
        sonobuoy gen --e2e-focus="pods" --e2e-skip="" > manifest.yaml
        # Verify manifest contains correct sonobuoy image (fails if image reference wrong)
        grep -F "image: sonobuoy/sonobuoy:v${{package.version}}" manifest.yaml
    - name: "Test sonobuoy gen plugin command"
      runs: |
        set -euo pipefail
        sonobuoy gen plugin --name=test-plugin --image=nginx:latest > plugin.yaml
        # Verify plugin name is set correctly (fails if missing)
        grep -F "name: test-plugin" plugin.yaml
        # Verify plugin image is set correctly (fails if missing)
        grep -F "image: nginx:latest" plugin.yaml
    - name: "Test we can access the cluster"
      runs: |
        sonobuoy get pod

environment:
  contents:
    packages:
      - go-fips-1.25
