package:
  name: cluster-autoscaler-1.31
  version: "1.31.5"
  epoch: 5 # go/enterprise-rsc/cluster-autoscaler-1.31
  description: Autoscaling components for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - cluster-autoscaler=${{package.full-version}}
  resources:
    cpu: "5"
    memory: 8Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go
  environment:
    CGO_ENABLED: 0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/autoscaler
      tag: cluster-autoscaler-${{package.version}}
      expected-commit: f0fb6c4b57c807f7544afbb2819ed2bf351f69c8

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        github.com/opencontainers/runc@v1.2.8
        github.com/opencontainers/selinux@v1.13.0
      modroot: vertical-pod-autoscaler/e2e

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: cluster-autoscaler/cloudprovider/azure/test

  - uses: go/bump
    with:
      deps: |-
        github.com/opencontainers/runc@v1.2.8
        github.com/opencontainers/selinux@v1.13.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        github.com/golang-jwt/jwt/v5@v5.2.2
        github.com/golang-jwt/jwt/v4@v4.5.2
        golang.org/x/crypto@v0.45.0
      modroot: cluster-autoscaler

  - uses: go/build
    with:
      modroot: cluster-autoscaler
      packages: .
      output: cluster-autoscaler
      vendor: true

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}
          # The upstream helm chart assumes the binary is in /.
          ln -sf /usr/bin/cluster-autoscaler ${{targets.subpkgdir}}/cluster-autoscaler
    dependencies:
      provides:
        - cluster-autoscaler-compat=${{package.full-version}}
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: cluster-autoscaler-compat
            real-pkg-name: ${{subpkg.name}}

test:
  pipeline:
    - runs: |
        test -x /usr/bin/cluster-autoscaler
        # the binaries do not have --help/--version
        cluster-autoscaler 2>&1 | grep -qi "Failed to find in-cluster config:"

update:
  enabled: true
  github:
    identifier: kubernetes/autoscaler
    strip-prefix: cluster-autoscaler-
    use-tag: true
    # There are other tags like "cluster-autoscaler-chart-FOO"
    tag-filter: cluster-autoscaler-1.31.
