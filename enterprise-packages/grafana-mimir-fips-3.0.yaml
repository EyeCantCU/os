package:
  name: grafana-mimir-fips-3.0
  version: "3.0.3"
  epoch: 0 # CVE-2025-61732
  description: Grafana Mimir provides horizontally scalable, highly available, multi-tenant, long-term storage for Prometheus.
  copyright:
    - license: AGPL-3.0-or-later
  dependencies:
    provides:
      - grafana-mimir-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/mimir
      tag: mimir-${{package.version}}
      expected-commit: 0b00ebf5d3766c766d319a8c23cd165f5c60a5e5

  # the repo has an ssh://git@github.com URI for mimir-prometheus
  # so just rm the file and default to the https URL for go.mod
  - runs: |
      rm go.sum
      rm .gitconfig

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/mimir
      output: grafana-mimir
      ldflags: "-w"
      go-package: go-fips-md5

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - distributed
    - weekly
  github:
    identifier: grafana/mimir
    strip-prefix: mimir-
    use-tag: true
    tag-filter-prefix: mimir-3.0

test:
  pipeline:
    - runs: |
        grafana-mimir -version
        grafana-mimir --version
    - uses: test/go-fips-check
