package:
  name: step-kms-plugin-fips
  version: "0.16.0"
  epoch: 4 # GHSA-fw7p-63qq-7hpr
  description: step plugin to manage keys and certificates on a cloud KMSs and HSMs
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - pcsc-lite-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/smallstep/step-kms-plugin
      tag: v${{package.version}}
      expected-commit: f947d6503b7900b01f5de47d4ad741ed22410bbd

  - uses: go/bump
    with:
      deps: |-
        filippo.io/edwards25519@v1.1.1

  - uses: go/build
    with:
      packages: .
      output: step-kms-plugin
      ldflags: -X "github.com/smallstep/step-kms-plugin/cmd.Version=${{package.version}}"
      tags: fips,noyubikey
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: smallstep/step-kms-plugin
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: step-kms-plugin
    - uses: test/tw/help-check
      with:
        bins: step-kms-plugin
