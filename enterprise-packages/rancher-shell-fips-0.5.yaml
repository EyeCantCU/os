package:
  name: rancher-shell-fips-0.5
  description: kubectl and helm installer image for Rancher
  epoch: 2
  version: "0.5.1"
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - rancher-shell-fips=${{package.full-version}}
    runtime:
      - bash
      - bash-completion
      - busybox
      - curl
      - gnutar
      - gzip
      - helm-fips
      - jq
      - k9s-fips
      - kubectl-bash-completion-fips-${{vars.kubectl-version}}
      - kubectl-fips-${{vars.kubectl-version}}
      - kubectl-fips-${{vars.kubectl-version}}-default
      - kustomize-fips
      - merged-varrun
      - posix-libc-utils
      - vim

vars:
  kubectl-version: '1.33'

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rancher/shell.git
      expected-commit: 6a06ac6f826c4597098621dadc87819cfb52a369
      tag: v${{package.version}}

  - runs: |
      # Ensure kubectl version is correct
      MK_KUBECTL_VERSION=$(grep "^KUBECTL_VERSION :=" ./hack/make/deps.mk | awk '{print $3}' | tr -d 'v')
      if [ ${MK_KUBECTL_VERSION#${{vars.kubectl-version}}} = $MK_KUBECTL_VERSION ]; then
        echo "kubectl version in Makefile doesn't match buildtime kubectl version!"
        echo "Found: $MK_KUBECTL_VERSION"
        echo "Expected: ${{vars.kubectl-version}}"
        exit 1
      fi

      # Create bashrc
      mkdir -p ${{targets.destdir}}/home/shell
      cat >> ${{targets.destdir}}/home/shell/.bashrc << 'EOF'
      . /etc/profile.d/bash_completion.sh
      alias k="kubectl"
      alias ks="kubectl -n kube-system"
      source <(kubectl completion bash)
      complete -o default -F __start_kubectl k
      LANG=en_US.UTF-8
      PS1="> "
      EOF

      # Install scripts
      install -Dm755 ./package/kustomize.sh ${{targets.destdir}}/home/shell/kustomize.sh
      install -Dm755 ./package/welcome ${{targets.destdir}}/usr/local/bin/welcome
      install -Dm755 ./package/helm-cmd ${{targets.destdir}}/usr/local/bin/helm-cmd

test:
  pipeline:
    - uses: test/go-fips-check
    - name: version and command test
      runs: |
        set -euo pipefail
        # Verify .bashrc was installed (fails test if missing)
        stat /home/shell/.bashrc
        # Verify kustomize.sh was installed (fails test if missing)
        stat /home/shell/kustomize.sh
        # Verify helm-cmd was installed (fails test if missing)
        stat /usr/local/bin/helm-cmd
        # Verify welcome script was installed (fails test if missing)
        stat /usr/local/bin/welcome
    - name: welcome script execution test
      runs: |
        set -euo pipefail
        # Execute welcome script to verify it runs without error (fails test if script crashes)
        /usr/local/bin/welcome
    - name: helm-cmd script execution test
      runs: |
        set -euo pipefail
        # Verify helm-cmd exists (fails test if missing)
        stat /usr/local/bin/helm-cmd
        # Verify helm-cmd is executable (fails test if not)
        test -x /usr/local/bin/helm-cmd || { echo "FAIL: helm-cmd is not executable"; exit 1; }
        # Verify script has valid bash syntax (fails test if syntax errors)
        bash -n /usr/local/bin/helm-cmd
        echo "SUCCESS: helm-cmd is a valid executable script"
    - name: kustomize.sh script execution test
      runs: |
        set -euo pipefail
        # Verify kustomize.sh exists (fails test if missing)
        stat /home/shell/kustomize.sh
        # Verify kustomize.sh is executable (fails test if not)
        test -x /home/shell/kustomize.sh || { echo "FAIL: kustomize.sh is not executable"; exit 1; }
        # Verify script has valid syntax (fails test if syntax errors)
        bash -n /home/shell/kustomize.sh
        echo "SUCCESS: kustomize.sh is a valid executable script"
    - name: bashrc sourcing test
      runs: |
        set -euo pipefail
        # Source bashrc to verify it has no syntax errors (fails test if sourcing fails)
        bash -c "source /home/shell/.bashrc"
        echo "SUCCESS: bashrc sourced without errors"

update:
  enabled: true
  ignore-regex-patterns:
    - .*-rc.*
  github:
    identifier: rancher/shell
    use-tag: true
    strip-prefix: v
    tag-filter: v0.5
