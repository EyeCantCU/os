package:
  name: gemini-cli
  version: "0.30.0"
  epoch: 1
  description: AI agent that brings Google Gemini directly into your terminal
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - nodejs
  resources:
    cpu: "4"
    memory: 12Gi

vars:
  nodejs-version: "20"
  nodejs-variant: "bookworm-slim"

environment:
  contents:
    packages:
      - busybox
      - curl
      - git
      - nodejs
      - npm
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/google-gemini/gemini-cli
      tag: v${{package.version}}
      expected-commit: 176b2baeef17b89c44a2f9d910544eed84851896

  - name: Install dependencies and build CLI and core packages
    runs: |
      npm ci --ignore-scripts
      npm run generate
      npm run build --workspace @google/gemini-cli-core
      npm run build --workspace @google/gemini-cli

  - name: Create core package tarball
    working-directory: packages/core
    runs: |
      npm pack
      mv google-gemini-cli-core-*.tgz /tmp/gemini-core.tgz

  - name: Create cli package tarball
    working-directory: packages/cli
    runs: |
      npm pack
      mv google-gemini-cli-*.tgz /tmp/gemini-cli.tgz

  - name: Install packages globally
    runs: |
      npm install -g \
        --prefix=${{targets.destdir}}/usr \
        --no-optional \
        --omit=dev \
        /tmp/gemini-core.tgz \
        /tmp/gemini-cli.tgz

  - name: Remove prebuilt binaries for non-Linux platforms
    runs: |
      find "${{targets.destdir}}/usr/lib/node_modules" -type d \( -name "darwin-*" -o -name "win32-*" -o -name "fallbacks" \) -exec rm -rf {} +

  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        name: Remove x86_64 prebuilt binaries
        runs: |
          find "${{targets.destdir}}/usr/lib/node_modules" -type d \( -name "linux-x64" -o -name "x64" \) -exec rm -rf {} +
      - if: ${{build.arch}} == 'x86_64'
        name: Remove aarch64 prebuilt binaries
        runs: |
          find "${{targets.destdir}}/usr/lib/node_modules" -type d \( -name "linux-arm64" -o -name "arm64" \) -exec rm -rf {} +

subpackages:
  # Entrypoint script from the official Node.js Docker image.
  # This is necessary because upstream may update the entrypoint script independently.
  # By tracking the SHA256 hash, we detect when the script changes and can review updates.
  # If the hash verification fails, the build exits 1 to alert that the upstream
  # entrypoint has changed and requires review.
  - name: ${{package.name}}-entrypoint-compat
    description: Docker entrypoint script for Node.js container configuration
    dependencies:
      runtime:
        - busybox
    pipeline:
      - runs: |
          set -euo pipefail
          # Fetch entrypoint from pinned Node.js version directory
          ENTRYPOINT_URL="https://raw.githubusercontent.com/nodejs/docker-node/main/${{vars.nodejs-version}}/${{vars.nodejs-variant}}/docker-entrypoint.sh"
          curl -fsSL -o /tmp/docker-entrypoint.sh "$ENTRYPOINT_URL"

          EXPECTED_SHA256="a15ac9589c04baf9da95b08e0e79b5cf1d75ab8dc64e06a5e68e4ceb0ad7c8ea"
          ACTUAL_SHA256=$(sha256sum /tmp/docker-entrypoint.sh | cut -d' ' -f1)
          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "ERROR: docker-entrypoint.sh hash mismatch!"
            echo "Expected: $EXPECTED_SHA256"
            echo "Actual:   $ACTUAL_SHA256"
            echo "Review changes at: https://github.com/nodejs/docker-node/blob/main/${{vars.nodejs-version}}/${{vars.nodejs-variant}}/docker-entrypoint.sh"
            exit 1
          fi

          install -Dm755 /tmp/docker-entrypoint.sh "${{targets.contextdir}}/usr/bin/docker-entrypoint.sh"
    test:
      environment:
        contents:
          packages:
            - nodejs
      pipeline:
        - runs: |
            set -euo pipefail
            stat /usr/bin/docker-entrypoint.sh
            test -x /usr/bin/docker-entrypoint.sh || { echo "ERROR: /usr/bin/docker-entrypoint.sh is not executable"; exit 1; }
            head -1 /usr/bin/docker-entrypoint.sh | grep -F "#!/bin/sh"
        - name: Verify entrypoint passes through commands
          runs: |
            set -euo pipefail
            # Test that entrypoint correctly execs to node
            OUTPUT=$(/usr/bin/docker-entrypoint.sh node -e "console.log('entrypoint-test-passed')")
            echo "$OUTPUT" | grep -F "entrypoint-test-passed"

update:
  enabled: true
  github:
    identifier: google-gemini/gemini-cli
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
    - uses: test/tw/help-check
      with:
        bins: gemini
    - uses: test/tw/ver-check
      with:
        bins: gemini
        version: ${{package.version}}
    - name: Verify CLI requires authentication
      runs: |
        set -euo pipefail

        # Ensure no auth is configured in the test environment
        unset GEMINI_API_KEY GOOGLE_API_KEY GOOGLE_GENAI_USE_VERTEXAI GOOGLE_CLOUD_PROJECT

        # CLI should fail without auth when running an example prompt
        if gemini -p "Say hello from a test prompt"; then
          echo "Expected gemini to fail without authentication, but it succeeded" >&2
          exit 1
        fi
