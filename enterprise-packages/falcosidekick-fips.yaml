package:
  name: falcosidekick-fips
  version: "2.32.0"
  epoch: 7 # CVE-2025-68121
  description: Connect Falco to your ecosystem
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7db37f7118493d261b7d6e622f42c2dc3ccec83d
      repository: https://github.com/falcosecurity/falcosidekick
      tag: ${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        github.com/eclipse/paho.mqtt.golang@v1.5.1

  - runs: |
      make falcosidekick RELEASE=${{package.version}}
      mkdir -p ${{targets.destdir}}/usr/bin
      mv falcosidekick ${{targets.destdir}}/usr/bin/

  - uses: strip

update:
  enabled: true
  github:
    identifier: falcosecurity/falcosidekick
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: falcosidekick
    - uses: test/tw/help-check
      with:
        bins: falcosidekick
    - name: Test configuration validation
      runs: |
        set -euo pipefail

        # Create a minimal config file for testing
        tee /tmp/config.yaml <<'EOF'
        debug: true
        listenaddress: "127.0.0.1"
        listenport: 2801
        EOF

        # Start falcosidekick briefly with config to verify it can parse and start
        falcosidekick --config-file /tmp/config.yaml &
        DAEMON_PID=$!

        # Give it time to start up
        sleep 3

        # Verify the process is still running (didn't crash on config parse)
        if kill -0 $DAEMON_PID 2>/dev/null; then
          echo "SUCCESS: falcosidekick started successfully with config"
          kill $DAEMON_PID 2>/dev/null || true
        else
          echo "FAIL: falcosidekick failed to start with config"
          exit 1
        fi
