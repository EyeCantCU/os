package:
  name: kyverno-policy-reporter-plugins-trivy
  version: "0.4.12"
  epoch: 1 # CVE-2025-61730
  description: Policy Reporter Plugin Trivy
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kyverno/policy-reporter-plugins
      tag: trivy-plugin-v${{package.version}}
      expected-commit: 095e87f714a00ba17bd2f783243b130c4f5f76da

  - uses: go/build
    with:
      output: trivy
      packages: .
      modroot: plugins/trivy

subpackages:
  - name: ${{package.name}}-compat
    description: compatibility symlinks package for kyverno trivy plugin
    pipeline:
      - runs: |
          # Symlink the binary from usr/bin to /ko-app/
          mkdir -p ${{targets.subpkgdir}}/ko-app
          ln -sf /usr/bin/trivy ${{targets.subpkgdir}}/ko-app/trivy
    test:
      pipeline:
        - runs: |
            readlink -v /ko-app/trivy

test:
  pipeline:
    - runs: |
        trivy help

update:
  enabled: true
  git:
    strip-prefix: trivy-plugin-v
    tag-filter-prefix: trivy
