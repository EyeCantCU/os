package:
  name: py3-ifaddr
  version: 0.2.0
  epoch: 1 # go/enterprise-rsc/py3-ifaddr
  description: Enumerate network interfaces/adapters and their IP addresses
  copyright:
    - license: MIT
  resources:
    cpu: "4"
    memory: 13Gi

vars:
  pypi-package: ifaddr

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ifaddr/ifaddr.git
      tag: ${{package.version}}
      expected-commit: fdc3ac75dfb6912ad93d32748e33619ecbdbe725

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
