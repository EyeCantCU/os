package:
  name: libspatialite
  version: 5.1.0
  epoch: 0
  description: Spatial SQL extension for SQLite
  copyright:
    - license: MPL-1.1 OR GPL-2.0-or-later OR LGPL-2.1-or-later

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - geos-dev
      - libtool
      - pkgconf
      - proj-dev
      - sqlite-dev
      - zlib-dev

pipeline:
  - uses: fetch
    with:
      expected-sha256: 43be2dd349daffe016dd1400c5d11285828c22fea35ca5109f21f3ed50605080
      uri: https://www.gaia-gis.it/gaia-sins/libspatialite-sources/libspatialite-${{package.version}}.tar.gz

  - uses: autoconf/configure
    with:
      opts: |
        --disable-freexl \
        --disable-rttopo \
        --disable-minizip \
        --disable-libxml2

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers and libraries
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}

update:
  enabled: false

test:
  environment:
    contents:
      packages:
        - sqlite
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test spatialite extension loading
      runs: |
        set -euo pipefail
        # Verify extension loads and reports version
        sqlite3 :memory: -cmd ".load /usr/lib/mod_spatialite.so.8" "SELECT spatialite_version();"
    - name: Test spatial operations
      runs: |
        set -euo pipefail
        # Verify spatial functions work
        RESULT=$(sqlite3 :memory: -cmd ".load /usr/lib/mod_spatialite.so.8" "SELECT AsText(MakePoint(1.0, 2.0));")
        echo "$RESULT" | grep -F "POINT"
