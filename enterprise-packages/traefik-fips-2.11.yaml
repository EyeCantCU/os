package:
  name: traefik-fips-2.11
  version: "2.11.37"
  epoch: 0 # go/enterprise-rsc/traefik-fips-2.11
  description: The Cloud Native Application Proxy
  copyright:
    - license: MIT
  dependencies:
    provides:
      - traefik-fips=${{package.full-version}}
  resources:
    cpu: "20"
    memory: 21Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7747b40310c2652b975fc8a64a81954beb22baea
      repository: https://github.com/traefik/traefik
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/traefik
      output: traefik
      ldflags: |
        -X github.com/traefik/traefik/v2/pkg/version.Version=${{package.version}}
        -X github.com/traefik/traefik/v2/pkg/version.BuildDate=$(date -u '+%Y-%m-%d_%I:%M:%S%p')
        -X github.com/traefik/traefik/v2/pkg/version.Codename=$CODENAME
      go-package: go-fips

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v2.11.

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
        - curl
        - python3
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: traefik
    - uses: test/tw/help-check
      with:
        bins: traefik
    - name: Test traefik proxy functionality
      uses: test/daemon-check-output
      with:
        setup: |
          # Create backend server content
          mkdir -p /tmp/backend
          echo "Hello from backend" > /tmp/backend/index.html

          # Start backend HTTP server
          cd /tmp/backend
          python3 -m http.server 9000 > /tmp/backend.log 2>&1 &

          # Wait for backend to be ready
          wait-for-it localhost:9000 -t 10

          # Create traefik static configuration
          tee /tmp/traefik.yaml <<'EOF'
          entryPoints:
            web:
              address: ":8080"

          providers:
            file:
              filename: /tmp/traefik-dynamic.yaml

          log:
            level: INFO
          EOF

          # Create traefik dynamic configuration
          tee /tmp/traefik-dynamic.yaml <<'EOF'
          http:
            routers:
              test-router:
                entryPoints:
                  - web
                rule: "PathPrefix(`/`)"
                service: test-service

            services:
              test-service:
                loadBalancer:
                  servers:
                    - url: "http://127.0.0.1:9000"
          EOF
        start: traefik --configFile=/tmp/traefik.yaml
        expected_output: "Configuration loaded from file"
        timeout: "30"
        post: |
          # Wait for traefik to be ready on port 8080
          wait-for-it localhost:8080 -t 10

          # Test proxying through traefik
          response=$(curl -sf http://localhost:8080/index.html)
          echo "$response" | grep -F "Hello from backend" || {
            echo "FAIL: Expected 'Hello from backend' in proxied response"
            echo "Got: $response"
            exit 1
          }

          echo "SUCCESS: Traefik successfully proxied request to backend"
