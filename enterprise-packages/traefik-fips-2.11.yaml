package:
  name: traefik-fips-2.11
  version: "2.11.31"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: The Cloud Native Application Proxy
  copyright:
    - license: MIT
  dependencies:
    provides:
      - traefik-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - git

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 79bb320f4c8cc918b220589a5c44ffe232b23733
      repository: https://github.com/traefik/traefik
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/traefik
      output: traefik
      ldflags: |
        -X github.com/traefik/traefik/v2/pkg/version.Version=${{package.version}}
        -X github.com/traefik/traefik/v2/pkg/version.BuildDate=$(date -u '+%Y-%m-%d_%I:%M:%S%p')
        -X github.com/traefik/traefik/v2/pkg/version.Codename=$CODENAME
      go-package: go-fips

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v2.11.

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        set -o pipefail
        traefik version | grep ${{package.version}}
        traefik --help
