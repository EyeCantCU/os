package:
  name: py3-cssselect2
  version: 0.8.0
  epoch: 1
  description: CSS selectors for Python ElementTree
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0

vars:
  pypi-package: cssselect2
  module-name: cssselect2

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-wheel
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Kozea/cssselect2
      tag: ${{package.version}}
      expected-commit: 774f2769560e22e82239a163690473a33bbe0446

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
      runtime:
        - py${{range.key}}-tinycss2
        - py${{range.key}}-webencodings
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.module-name}}
        - runs: |
            set -euo pipefail

            # Test CSS selector functionality
            python${{range.key}} <<'EOF'
            import cssselect2
            from xml.etree import ElementTree

            # Create a simple HTML/XML tree
            html_string = """
            <html>
              <body>
                <div class="container">
                  <h1 id="title">Hello World</h1>
                  <p class="content">First paragraph</p>
                  <p class="content highlight">Second paragraph</p>
                  <a href="https://example.com">Link</a>
                </div>
              </body>
            </html>
            """

            # Parse the HTML
            tree = ElementTree.fromstring(html_string)

            # Test class selector
            matches = cssselect2.compile_selector_list('.content')
            assert matches is not None, "Should compile class selector"

            # Test ID selector
            matches = cssselect2.compile_selector_list('#title')
            assert matches is not None, "Should compile ID selector"

            # Test element selector
            matches = cssselect2.compile_selector_list('p')
            assert matches is not None, "Should compile element selector"

            # Test attribute selector
            matches = cssselect2.compile_selector_list('[href]')
            assert matches is not None, "Should compile attribute selector"

            # Test complex selector
            matches = cssselect2.compile_selector_list('div.container > p.content')
            assert matches is not None, "Should compile complex selector"

            # Test pseudo-class selector
            matches = cssselect2.compile_selector_list('p:first-child')
            assert matches is not None, "Should compile pseudo-class selector"

            # Test multiple selectors
            matches = cssselect2.compile_selector_list('h1, p, a')
            assert matches is not None, "Should compile multiple selectors"

            print("cssselect2 CSS selector compilation tests passed!")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/byproductpackage
