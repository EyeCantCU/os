package:
  name: traefik-fips-3.6
  version: "3.6.7"
  epoch: 2 # go/enterprise-rsc/traefik-fips-3.6
  description: The Cloud Native Application Proxy
  copyright:
    - license: MIT
  dependencies:
    provides:
      - traefik-fips=${{package.full-version}}
  resources:
    cpu: "9"
    memory: 12Gi

environment:
  contents:
    packages:
      - build-base
      - nodejs-20
      - yarn-berry

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 17283643416ef8e830565ce40d3d3d7cc453e68e
      repository: https://github.com/traefik/traefik
      tag: v${{package.version}}

  - working-directory: webui
    runs: |
      yarn install
      yarn build

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/traefik
      output: traefik
      ldflags: |
        -X github.com/traefik/traefik/v3/pkg/version.Version=${{package.version}}
        -X github.com/traefik/traefik/v3/pkg/version.BuildDate=$(date -u '+%Y-%m-%d_%I:%M:%S%p')
        -X github.com/traefik/traefik/v3/pkg/version.Codename=$CODENAME
      go-package: go-fips

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v3.6.

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
        - curl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: traefik
        version-flag: version
    - uses: test/tw/help-check
      with:
        bins: traefik
    - name: Run and test traefik
      uses: test/daemon-check-output
      with:
        start: traefik --ping=true --ping.entryPoint=traefik --api.insecure=true --log.level=DEBUG
        timeout: 30
        expected_output: |
          Creating middleware
          Setting up redirection
        post: |
          # Wait for Traefik to be fully ready
          sleep 2

          # Test ping endpoint (health check)
          echo "Testing ping endpoint..."
          curl -f http://localhost:8080/ping
          echo "Ping endpoint OK"

          # Test API endpoint
          echo "Testing API endpoint..."
          curl -f http://localhost:8080/api/rawdata
          echo "API endpoint OK"
