package:
  name: py3-lesscpy
  version: 0.15.0
  epoch: 1 # go/enterprise-rsc/py3-lesscpy
  description: Python LESS compiler
  copyright:
    - license: MIT
  resources:
    cpu: "2"
    memory: 5Gi

vars:
  pypi-package: lesscpy

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/lesscpy/lesscpy.git
      tag: ${{package.version}}
      expected-commit: 1172a1693df2f4bc929a88b1bebb920e666c0c9f

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-ply
        - py${{range.key}}-six
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: move usr/bin executables for -bin
        runs: |
          mkdir -p ./cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./cleanup/${{range.key}}/
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - python-${{range.key}}
            - py${{range.key}}-pip
            - py${{range.key}}-${{vars.pypi-package}}
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
    test:
      pipeline:
        - runs: |
            LESS_FILE=$(mktemp)
            tee "${LESS_FILE}" <<EOF
            @width: 10px;
            @height: @width + 10px;

            #header {
              width: @width;
              height: @height;
            }
            EOF
            lesscpy --minify "${LESS_FILE}" | grep -F -e '#header{width:10px;height:20px;}'

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
