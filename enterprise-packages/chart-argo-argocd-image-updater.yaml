package:
  name: chart-argo-argocd-image-updater
  version: "1.0.5"
  epoch: 0
  description: A Helm chart for Argo CD Image Updater, a tool to automatically update the container images of Kubernetes workloads which are managed by Argo CD
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/argoproj/argo-helm
      tag: argocd-image-updater-${{package.version}}
      expected-commit: 7933ec2a0d3a890abf7166053323fe629d2d59d7

  - uses: charts/package
    with:
      chart-path: charts/argocd-image-updater
      images: |
        argocd-image-updater:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        values:
          imagePullSecrets:
            - name: pull-secret
        # Example images in CRD description field, not actual containers
        ignore:
          - docker.io/library/nginx:1.17.10
          - index.docker.io/library/nginx:1.17.10
          - quay.io/prometheus/node-exporter:v1.5.0
        cases:
          - name: default
            images: [argocd-image-updater]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: argoproj/argo-helm
    strip-prefix: argocd-image-updater-
    use-tag: true
    tag-filter-prefix: argocd-image-updater-
