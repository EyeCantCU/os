package:
  name: prometheus-elasticsearch-exporter-fips
  version: "1.10.0"
  epoch: 4 # CVE-2025-61732
  description: Elasticsearch stats exporter for Prometheus
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "1"
    memory: 5Gi

vars:
  PKG: "github.com/prometheus/common"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/elasticsearch_exporter
      tag: v${{package.version}}
      expected-commit: eee51ae24a6c802046077c59aff82f6f65cc220e

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      output: elasticsearch_exporter
      ldflags: |
        -X ${{vars.PKG}}/version.Revision=$(git rev-parse --short HEAD)
        -X ${{vars.PKG}}/version.BuildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')
        -X ${{vars.PKG}}/version.Branch=$(git branch --show-current)
        -X ${{vars.PKG}}/version.Version=v${{package.version}}

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: elasticsearch_exporter
    - uses: test/tw/help-check
      with:
        bins: elasticsearch_exporter

update:
  enabled: true
  github:
    identifier: prometheus-community/elasticsearch_exporter
    strip-prefix: v
