package:
  name: py3-llvmlite
  version: 0.44.0
  epoch: 0
  description: A lightweight Python LLVM binding for writing JIT compilers
  copyright:
    - license: BSD-2-Clause

vars:
  pypi-package: llvmlite
  import: llvmlite
  llvm-version: 15

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      # llvmlite 0.44.0 requires LLVM ${{vars.llvm-version}}.x.x
      - llvm-${{vars.llvm-version}}-dev
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-wheel
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/numba/llvmlite
      tag: v${{package.version}}
      expected-commit: 2c67a6b8deaaa21cf23e6cb59cf66905b63281ba

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - libLLVM-${{vars.llvm-version}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import llvmlite
            import llvmlite.binding as llvm

            # Test basic LLVM functionality
            llvm.initialize()
            llvm.initialize_native_target()
            llvm.initialize_native_asmprinter()

            # Test version information
            version = llvm.llvm_version_info
            assert isinstance(version, tuple), f"Expected tuple, got {type(version)}"
            assert len(version) >= 3, f"Expected version tuple with at least 3 elements, got {len(version)}"

            # Test creating a module
            from llvmlite import ir
            module = ir.Module(name="test_module")
            assert module.name == "test_module"

            print("All tests passed!")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: numba/llvmlite
    strip-prefix: v
