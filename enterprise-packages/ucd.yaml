package:
  name: ucd
  version: "0.4.1"
  epoch: 0
  description: "Undocumented Change Detector"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tstromberg/ucd
      tag: v${{package.version}}
      expected-commit: 21186b1f80ba49306283f560eb47524f68a42f64

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      packages: "."
      output: ucd

test:
  pipeline:
    - name: Verify binary exists and help works
      runs: |
        ucd --help
        which ucd
        # we can't actually use UCD without a Gemini API Key

update:
  enabled: true
  github:
    identifier: tstromberg/ucd
    strip-prefix: v
