package:
  name: chart-prometheus-blackbox-exporter
  version: "11.7.1"
  epoch: 0
  description: Prometheus Blackbox Exporter
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/helm-charts
      tag: prometheus-blackbox-exporter-${{package.version}}
      expected-commit: 39dff3ca9ca95b5e8eae564bdc2daeabfd277bae

  - uses: charts/package
    with:
      chart-path: charts/prometheus-blackbox-exporter
      images: |
        blackbox-exporter:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${tag}
              digest: ${digest}
        config-reloader:
          values:
            configReloader:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${tag}
                digest: ${digest}
      test: |
        values:
          imagePullSecrets:
            - name: my-pull-secret
        cases:
          - name: default
            images: [blackbox-exporter]
          - name: with-config-reloader
            images: [blackbox-exporter, config-reloader]
            values:
              configReloader:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: prometheus-community/helm-charts
    strip-prefix: prometheus-blackbox-exporter-
    use-tag: true
    tag-filter-prefix: prometheus-blackbox-exporter-
