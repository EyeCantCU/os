package:
  name: chart-falcosecurity-falco-exporter
  version: "0.12.2"
  epoch: 0
  description: DEPRECATED Prometheus Metrics Exporter for Falco output events
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/falcosecurity/charts
      tag: falco-exporter-${{package.version}}
      expected-commit: 5b033a204a781f6a9ba4cb5ca44a60e6a20e3a8d

  - uses: charts/package
    with:
      chart-path: charts/falco-exporter
      images: |
        falco-exporter:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [falco-exporter]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: falcosecurity/charts
    strip-prefix: falco-exporter-
    use-tag: true
    tag-filter-prefix: falco-exporter-
