package:
  name: runc-fips
  version: "1.4.0"
  epoch: 3 # CVE-2025-61731
  description: CLI tool for spawning and running containers according to the OCI specification
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
      - go-md2man
      - libseccomp-dev
      - libtool

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/opencontainers/runc
      tag: v${{package.version}}
      expected-commit: 8bd78a9977e604c4d5f67a7415d7b8b8c109cdc4

  - uses: go/bump
    with:
      # Bump to v5.2.0 to avoid crypto/sha1 usage
      deps: github.com/godbus/dbus/v5@v5.2.0

  - runs: |
      rm vendor/github.com/coreos/go-systemd/v22/activation/listeners.go

  - uses: patch
    with:
      patches: |
        0001-vendor-vendor-github.com-pjbgf-sha1cd-as-crypto-sha1.patch
        0002-vendor-sha1cd-do-not-register-as-crypto-hash-impleme.patch
        0003-vendor-cilium-ebpf-use-sha1cd-for-computing-eBPF-pro.patch
        0004-vendor-cilium-ebpf-use-non-crypto-rand-for-kprobe-tr.patch
        0005-vendor-go-selinux-use-non-crypto-rand-for-SELinux-MC.patch

  # According to the runc maintainers, a Go FIPS build that is using a crypto
  # backend relying on libcrypto.so from the host is unsupported [1]:
  #
  #   This compiler results in a binary which forces the use of specific
  #   crypto libraries (which it loads via dlopen during startup). This is
  #   usually done for FIPS compliance.
  #
  #   It does not make sense for runc because runc doesn't use any
  #   cryptographic functions. It also hurts runc because runc init is run
  #   inside a container which may not have libcrypto.so library, like it
  #   happens here.
  #
  # In consequence, compile with the FIPS toolchain so runc-fips and its
  # use in FIPS images does not defy expectations, but also make sure no
  # cryptography is actually being used.
  - uses: go/assert-no-crypto

  - uses: go/build
    with:
      go-package: go-fips
      modroot: .
      packages: .
      output: runc
      tags: seccomp,urfave_cli_no_docs,netgo,osusergo
      ldflags: |
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.version=${{package.version}}

  - runs: |
      make man
      install -Dm644 ./man/man8/* -t "${{targets.destdir}}"/usr/share/man/man8/

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: runc manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: opencontainers/runc
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - name: "Check runc version"
      runs: |
        runc --version
    - name: "Check runc help"
      runs: |
        runc --help
    - name: "Test runc features"
      runs: |
        runc features | grep -q "seccomp"
    - name: "Verify runc binary"
      runs: |
        [ -x "$(command -v runc)" ]
    - name: "Check runc state command"
      runs: |
        runc state non_existent_container || [ $? -eq 1 ]
    - name: "Check runc spec command"
      runs: |
        runc spec --rootless
        [ -f config.json ]
