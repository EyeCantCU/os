package:
  name: py3-pyphen
  version: 0.17.2
  epoch: 1
  description: Pure Python module to hyphenate text
  copyright:
    - license: GPL-2.0-or-later OR LGPL-2.1-or-later OR MPL-1.1
  dependencies:
    provider-priority: 0

vars:
  pypi-package: pyphen
  module-name: pyphen

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-wheel
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Kozea/Pyphen
      tag: ${{package.version}}
      expected-commit: 781cb19a2085c19e125a0519b25409a4f0dabbd0

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.module-name}}
        - runs: |
            set -euo pipefail

            # Test text hyphenation
            python${{range.key}} <<'EOF'
            import pyphen

            # Create a Pyphen object for English
            dic = pyphen.Pyphen(lang='en_US')

            # Test hyphenation on some words
            test_words = [
                ('hyphenation', 'hy-phen-ation'),
                ('beautiful', 'beau-ti-ful'),
                ('dictionary', 'dic-tio-nary'),
                ('wonderful', 'won-der-ful'),
                ('extraordinary', 'ex-traor-di-nary'),
            ]

            for word, expected_pattern in test_words:
                # Get hyphenation positions
                positions = dic.positions(word)
                assert positions is not None, f"Should return positions for '{word}'"
                assert len(positions) > 0, f"'{word}' should have hyphenation points"

                # Get hyphenated word
                hyphenated = dic.inserted(word)
                assert '-' in hyphenated, f"'{word}' should be hyphenated"
                print(f"✓ {word} -> {hyphenated}")

            # Test wrap() method
            long_word = "internationalization"
            wrapped = dic.wrap(long_word, width=10)
            assert len(wrapped) == 2, "Should split long word into two parts"
            assert wrapped[0].endswith('-'), "First part should end with hyphen"
            print(f"✓ Wrapped '{long_word}' at width 10: {wrapped}")

            # Test with different language
            dic_de = pyphen.Pyphen(lang='de_DE')
            german_word = "Schifffahrt"
            hyphenated_de = dic_de.inserted(german_word)
            assert '-' in hyphenated_de, "German word should be hyphenated"
            print(f"✓ German: {german_word} -> {hyphenated_de}")

            print("\npyphen text hyphenation test passed!")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/byproductpackage
