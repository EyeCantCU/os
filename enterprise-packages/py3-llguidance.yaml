package:
  name: py3-llguidance
  version: "1.4.0"
  epoch: 1 # go/enterprise-rsc/py3-llguidance
  description: Bindings for the Low-level Guidance (llguidance) Rust library
  copyright:
    - license: MIT
  resources:
    cpu: "7"
    memory: 11Gi

vars:
  pypi-package: llguidance
  import: llguidance

environment:
  contents:
    packages:
      - build-base
      - busybox
      - maturin
      - py3-supported-maturin
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-wheel
      - rust

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/microsoft/llguidance
      tag: v${{package.version}}
      expected-commit: c1b69da46e2053ce0d40ff4416b6a860f7165143

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import llguidance
            print("llguidance module loaded successfully")
            print("Available attributes:", [attr for attr in dir(llguidance) if not attr.startswith('_')])
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
