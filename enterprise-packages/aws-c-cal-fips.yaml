package:
  name: aws-c-cal-fips
  version: "0.9.13"
  epoch: 2 # go/enterprise-rsc/aws-c-cal-fips
  description: "AWS Crypto Abstraction Layer: Cross-Platform, C99 wrapper for cryptography primitives (FIPS)"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - aws-lc-fips
  resources:
    cpu: "1"
    memory: 6Gi

vars:
  aws-lc-lib-dir: /usr/lib/aws-lc
  aws-lc-include-dir: /usr/include/aws-lc
  aws-lc-crypto-lib: /usr/lib/aws-lc/libcrypto.so

environment:
  contents:
    packages:
      - aws-c-common-dev
      - aws-lc-fips-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - samurai
  environment:
    CMAKE_PREFIX_PATH: ${{vars.aws-lc-lib-dir}}
    CFLAGS: "-I${{vars.aws-lc-include-dir}}"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1cb9412158890201a6ffceed779f90fe1f48180c
      repository: https://github.com/awslabs/aws-c-cal
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: |
        aws-lc-fips-compat.patch

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_PREFIX_PATH=/usr \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_INSTALL_RPATH=${{vars.aws-lc-lib-dir}} \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DUSE_OPENSSL=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux \

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-cal-fips
    description: aws-c-cal-fips dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-dev
        - aws-c-common-dev
        - aws-lc-fips-dev
        - build-base
        - wget
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: "4956"
    - name: Library linkage test
      runs: |
        set -euo pipefail

        # Create a test C file that includes aws_cal.h and links against the library
        tee /tmp/test_linkage.c <<'EOF'
        #include <aws/cal/cal.h>
        #include <stdio.h>

        int main(void) {
            printf("aws-c-cal headers and library linkage test passed\n");
            return 0;
        }
        EOF

        # Compile and link against aws-c-cal (verifies headers and library work)
        gcc /tmp/test_linkage.c -laws-c-cal -laws-c-common \
            -I/usr/include -L/usr/lib \
            -Wl,-rpath,${{vars.aws-lc-lib-dir}} \
            -o /tmp/test_linkage

        # Run the test binary (fails test if linkage broken)
        /tmp/test_linkage | grep -F "linkage test passed"
    - name: Functional crypto test
      runs: |
        set -euo pipefail

        # Create a test C file that exercises crypto operations through the CAL
        tee /tmp/test_crypto.c <<'EOF'
        #include <aws/cal/cal.h>
        #include <aws/cal/hash.h>
        #include <aws/common/allocator.h>
        #include <aws/common/byte_buf.h>
        #include <stdio.h>
        #include <string.h>

        int main(void) {
            /* Initialize the cal library */
            struct aws_allocator *allocator = aws_default_allocator();
            aws_cal_library_init(allocator);

            /* Test SHA-256 hash operation */
            struct aws_hash *hash = aws_sha256_new(allocator);
            if (!hash) {
                fprintf(stderr, "FAIL: Failed to create SHA-256 hash\n");
                aws_cal_library_clean_up();
                return 1;
            }

            /* Hash some test data */
            const char *test_data = "FIPS crypto test data";
            struct aws_byte_cursor input = aws_byte_cursor_from_c_str(test_data);

            if (aws_hash_update(hash, &input) != AWS_OP_SUCCESS) {
                fprintf(stderr, "FAIL: Hash update failed\n");
                aws_hash_destroy(hash);
                aws_cal_library_clean_up();
                return 1;
            }

            /* Finalize the hash */
            uint8_t digest[32];
            struct aws_byte_buf output = aws_byte_buf_from_empty_array(digest, sizeof(digest));

            if (aws_hash_finalize(hash, &output, 0) != AWS_OP_SUCCESS) {
                fprintf(stderr, "FAIL: Hash finalize failed\n");
                aws_hash_destroy(hash);
                aws_cal_library_clean_up();
                return 1;
            }

            aws_hash_destroy(hash);
            aws_cal_library_clean_up();

            printf("SUCCESS: FIPS crypto operations completed successfully\n");
            return 0;
        }
        EOF

        # Compile and link against aws-c-cal and aws-lc
        gcc /tmp/test_crypto.c -laws-c-cal -laws-c-common \
            -I/usr/include -L/usr/lib \
            -L${{vars.aws-lc-lib-dir}} -lcrypto \
            -Wl,-rpath,${{vars.aws-lc-lib-dir}} \
            -o /tmp/test_crypto

        # Run the functional test (fails if FIPS crypto doesn't work)
        /tmp/test_crypto | grep -F "SUCCESS: FIPS crypto operations completed successfully"

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-cal
    strip-prefix: v
    use-tag: true
