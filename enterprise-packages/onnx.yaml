package:
  name: onnx
  version: "1.20.1"
  epoch: 1
  description: Open Neural Network Exchange
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - protobuf-dev
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/onnx/onnx.git
      expected-commit: d3f6b795aedb48eaecc881bf5e8f5dd6efbe25b3
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      output-dir: output
      opts: |
        -DONNX_USE_LITE_PROTO=OFF \
        -DONNX_USE_PROTOBUF_SHARED_LIBS=ON \
        -DPython3_EXECUTABLE=/usr/bin/python3 \
        -DBUILD_SHARED_LIBS=ON

  - working-directory: output
    runs: ninja

  - uses: cmake/build

  - uses: cmake/install

  - runs: install -Dpm0644 -t "${{targets.destdir}}/usr/include/onnx/" "./output/onnx/"*.proto

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: Onnxruntime development includes
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/devpackage

update:
  enabled: true
  github:
    identifier: onnx/onnx
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - build-base
        - onnx-dev
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        TEST_PROG_MAIN="onnxtest.cpp"
        tee "${TEST_PROG_MAIN}" <<'EOF'
        #include <iostream>
        #include "onnx/common/version.h"

        int main() {
          std::cout << ONNX_NAMESPACE::LAST_RELEASE_VERSION;
        }
        EOF
        c++ "${TEST_PROG_MAIN}" -o onnxtest
        ./onnxtest | grep -F -e "$(echo "${{package.version}}" | cut -d. -f1,2)"
