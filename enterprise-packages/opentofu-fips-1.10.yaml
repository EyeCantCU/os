package:
  name: opentofu-fips-1.10
  version: "1.10.5"
  epoch: 1 # CVE-2025-47907
  copyright:
    - license: MPL-2.0
  dependencies:
    provides:
      - opentofu-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 20e08688ca2891c0d9398fbc3714aa4847f2cfb3
      repository: https://github.com/opentofu/opentofu
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/cloudflare/circl@v1.6.1
        github.com/go-viper/mapstructure/v2@v2.3.0

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v3@v3.0.4
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
      modroot: .

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X 'github.com/opentofu/opentofu/version.dev=no'
      modroot: .
      output: tofu
      packages: ./cmd/tofu

update:
  enabled: true
  ignore-regex-patterns:
    - "rc"
    - "beta"
  github:
    identifier: opentofu/opentofu
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v1.10

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        tofu --version
        tofu --help
    - name: tofu Initialization
      runs: |
        echo "provider \"local\" {}" > example.tf
        tofu init -input=false || exit 1
    - name: tofu Plan Creation
      runs: |
        tofu plan -input=false -out=tfplan || exit 1
    - name: tofu Apply Execution
      runs: |
        tofu apply -input=false tfplan || exit 1
