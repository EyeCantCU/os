package:
  name: opentofu-fips-1.10
  version: "1.10.9"
  epoch: 4
  copyright:
    - license: MPL-2.0
  dependencies:
    provides:
      - opentofu-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0de30e8050bc32dfada2c4c978e736239e0ab265
      repository: https://github.com/opentofu/opentofu
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/hashicorp/go-getter@v1.7.9
        github.com/go-viper/mapstructure/v2@v2.4.0
        github.com/ulikunitz/xz@v0.5.15
        golang.org/x/crypto@v0.45.0
        golang.org/x/oauth2@v0.27.0
        github.com/cloudflare/circl@v1.6.3
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X 'github.com/opentofu/opentofu/version.dev=no'
      modroot: .
      output: tofu
      packages: ./cmd/tofu

update:
  enabled: true
  ignore-regex-patterns:
    - "rc"
    - "beta"
  github:
    identifier: opentofu/opentofu
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v1.10

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: tofu
    - uses: test/tw/help-check
      with:
        bins: tofu
    - name: tofu Initialization
      runs: |
        set -euo pipefail
        echo "provider \"local\" {}" > example.tf
        tofu init -input=false
    - name: tofu Plan Creation
      runs: |
        set -euo pipefail
        tofu plan -input=false -out=tfplan
    - name: tofu Apply Execution
      runs: |-
        set -euo pipefail
        tofu apply -input=false tfplan

environment:
  contents:
    packages:
      - go-fips-1.25
