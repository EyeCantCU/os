package:
  name: k8ssandra-client-fips
  version: "0.8.2"
  epoch: 2 # GHSA-4x4m-3c2p-qppc
  description: A kubectl plugin to simplify usage of k8ssandra.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7d02e886e996d90096b6e1fdbf56674e8cc7f1c0
      repository: https://github.com/k8ssandra/k8ssandra-client
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        helm.sh/helm/v3@v3.18.5
        k8s.io/kubernetes@v1.33.4

  - uses: go/build
    with:
      modroot: .
      output: kubectl-k8ssandra
      packages: ./cmd/kubectl-k8ssandra
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: k8ssandra/k8ssandra-client
    strip-prefix: v

test:
  pipeline:
    - runs: |
        kubectl-k8ssandra --help
    - uses: test/go-fips-check
