package:
  name: linux-raspberry-pi-firmware
  version: "1.20250430"
  epoch: 53
  description: "firmware required by raspberry pi to boot"
  copyright:
    - license: GPL-2.0
  dependencies:
    runtime:
      # Ensure we get Chainguard branding in our VMs.
      - chainguard-baselayout
      - merged-lib
      - wolfi-baselayout
  target-architecture:
    - aarch64 # This kernel is specific to the raspberry pi hardware

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - git

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/raspberrypi/firmware
      tag: ${{package.version}}
      expected-commit: bc7f439c234e19371115e07b57c366df59cc1bc7

  - runs: |
      set -x
      # TODO: Figure out how to build these from source...
      # TODO: Until then, the raspberrypi github repo provides these pre-built
      mkdir -p ${{targets.destdir}}/boot/firmware
      cp -a boot/* ${{targets.destdir}}/boot/firmware/
      cp -a extra/Module* ${{targets.destdir}}/boot/
      cp -a extra/System* ${{targets.destdir}}/boot/
      ln -sf firmware/overlays ${{targets.destdir}}/boot/overlays
      cp -af config.txt ${{targets.destdir}}/boot/firmware/
      # Setup linux command line arguments for raspberry pi
      cat > ${{targets.destdir}}/boot/firmware/cmdline.txt <<EOF
      console=serial0,115200 console=tty1 multipath=off dwc_otg.lpm_enable=0 root=PARTLABEL=Chainguard rootfstype=ext4 rootwait fixrtc quiet splash rw
      EOF

subpackages:
  - name: "linux-raspberry-pi-firmware-modules"
    description: "Linux raspberry pi kernel modules"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/modules
          cp -a modules/* ${{targets.subpkgdir}}/usr/lib/modules

test:
  pipeline:
    - name: Ensure files are installed
      runs: |
        ls -alF /boot/firmware/start*.elf
        ls -alF /boot/firmware/fixup*.dat
        ls -alF /boot/firmware/bootcode.bin

update:
  enabled: true
  github:
    identifier: raspberrypi/firmware
    use-tag: true
