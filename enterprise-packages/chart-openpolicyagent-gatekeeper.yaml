package:
  name: chart-openpolicyagent-gatekeeper
  version: "3.21.1"
  epoch: 0
  description: A Helm chart for Gatekeeper
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-policy-agent/gatekeeper
      tag: v${{package.version}}
      expected-commit: ee60035fa8e7283d1f99c7de78f6bf7113cb6f81

  - uses: charts/package
    with:
      chart-path: charts/gatekeeper
      images: |
        gatekeeper:
          values:
            image:
              repository: ${registry_repo}
              release: ${pseudo_tag}
        gatekeeper-crds:
          values:
            image:
              crdRepository: ${registry_repo}
            postInstall:
              labelNamespace:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
            postUpgrade:
              labelNamespace:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
            preUninstall:
              deleteWebhookConfigurations:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        curl:
          values:
            postInstall:
              probeWebhook:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        fake-reader:
          values:
            audit:
              exportSidecar:
                image: ${ref}
      test: |
        cases:
          - name: default
            images: [gatekeeper, gatekeeper-crds, curl]
          - name: with-export-sidecar
            images: [gatekeeper, gatekeeper-crds, curl, fake-reader]
            values:
              enableViolationExport: true
              exportBackend: disk

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: open-policy-agent/gatekeeper
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
    tag-filter-contains: .
