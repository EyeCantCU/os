package:
  name: chart-external-secrets-external-secrets
  version: "2.0.1"
  epoch: 0
  description: External secrets management for Kubernetes
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - busybox
      - chart-bitwarden-sdk-server
      - helm
      - sed
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/external-secrets/external-secrets
      tag: helm-chart-${{package.version}}
      expected-commit: 8da4c674d25a18cefc3bbb725ab3873624d4841e

  # Generate CRD templates from bundle.yaml (upstream does this during release)
  - runs: |
      bash ./hack/helm.generate.sh deploy/crds deploy/charts/external-secrets

  # Upstream Chart.yaml pins a specific bitwarden-sdk-server version that may
  # lag behind our chart-bitwarden-sdk-server package. Read the actual version
  # from the installed chart APK so this stays in sync automatically.
  - runs: |
      cd deploy/charts/external-secrets
      bw_version=$(yq -e '.version' /bitwarden-sdk-server/Chart.yaml)
      yq -i "(.dependencies[] | select(.name == \"bitwarden-sdk-server\")).version = \"$bw_version\"" Chart.yaml

  - uses: charts/package
    with:
      chart-path: deploy/charts/external-secrets
      images: |
        external-secrets:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
        webhook:
          values:
            webhook:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        cert-controller:
          values:
            certController:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [external-secrets, webhook, cert-controller]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: external-secrets/external-secrets
    strip-prefix: helm-chart-
    use-tag: true
    tag-filter-prefix: helm-chart-
