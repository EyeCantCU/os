package:
  name: py3-humanize
  version: 4.13.0
  epoch: 0
  description: Python humanize functions
  copyright:
    - license: MIT

vars:
  pypi-package: humanize

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-hatch-vcs
      - py3-supported-hatchling

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-humanize/humanize.git
      tag: ${{package.version}}
      expected-commit: 0e027051034b7dcb4eb65aded290cf56a89d8aa9

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | tee output.txt
            import humanize
            import datetime as dt
            print(humanize.naturalday(dt.datetime.now()))
            print(humanize.naturaldelta(dt.timedelta(seconds=1001)))
            print(humanize.naturalday(dt.datetime.now() - dt.timedelta(days=1)))
            print(humanize.naturalday(dt.date(2007, 6, 5)))
            print(humanize.naturaldate(dt.date(2007, 6, 5)))
            print(humanize.naturaltime(dt.datetime.now() - dt.timedelta(seconds=1)))
            print(humanize.naturaltime(dt.datetime.now() - dt.timedelta(seconds=3600)))
            EOF

            get_line() {
              sed -n "${1}p" output.txt | grep -E -e "${2}"
            }

            get_line 1 "today"
            get_line 2 "16 minutes"
            get_line 3 "yesterday"
            get_line 4 "Jun 05"
            get_line 5 "Jun 05 2007"
            get_line 6 "a second ago"
            get_line 7 "an hour ago"

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
