package:
  name: exiv2
  version: "0.28.8"
  epoch: 0
  description: Exif and IPTC metadata manipulation library and tools
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - brotli-dev
      - build-base
      - busybox
      - cmake
      - expat-dev
      - inih-dev
      - samurai
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Exiv2/exiv2
      tag: v${{package.version}}
      expected-commit: 2cd987a731236037b6b78cbff897d08685a8ef49

  - uses: cmake/configure
    with:
      opts: |
        -DEXIV2_BUILD_SAMPLES=OFF \
        -DEXIV2_ENABLE_BMFF=ON \
        -DEXIV2_ENABLE_WEBREADY=ON \
        -DEXIV2_ENABLE_BROTLI=ON \
        -DEXIV2_ENABLE_INIH=ON \
        -DEXIV2_BUILD_UNIT_TESTS=OFF

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/tw/docs

  - name: ${{package.name}}-libs
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/lib
          mv "${{targets.destdir}}"/usr/lib/libexiv2.so.* "${{targets.contextdir}}"/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: exiv2
    - uses: test/tw/help-check
      with:
        bins: exiv2
    - name: Basic exiv2 functionality test
      runs: |
        set -euo pipefail
        # Verify exiv2 binary works (version already checked above)
        stat /usr/bin/exiv2
        echo "exiv2 basic test passed"

update:
  enabled: true
  github:
    identifier: Exiv2/exiv2
    strip-prefix: v
