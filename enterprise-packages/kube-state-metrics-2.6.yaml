package:
  name: kube-state-metrics-2.6
  version: 2.6.0
  epoch: 34 # GHSA-j5w8-q4qc-rx2x
  description: Add-on agent to generate and expose cluster-level metrics.
  dependencies:
    runtime:
      - tzdata
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/kube-state-metrics
      tag: v${{package.version}}
      expected-commit: bc3b98558b4a05fec0ca894ce3a83a8762c83e62

  - uses: go/bump
    with:
      deps: |-
        github.com/emicklei/go-restful@v2.16.0
        github.com/prometheus/exporter-toolkit@v0.7.3
        google.golang.org/protobuf@v1.33.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.47.0
        golang.org/x/crypto@v0.45.0
      replaces: golang.org/x/crypto=golang.org/x/crypto@v0.45.0 golang.org/x/text=golang.org/x/text@v0.3.8

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      make build-local
      cp kube-state-metrics ${{targets.destdir}}/usr/bin

  - uses: strip

update:
  enabled: true
  github:
    identifier: kubernetes/kube-state-metrics
    strip-prefix: v
    tag-filter: v2.6
    use-tag: true

test:
  environment:
    contents:
      packages:
        - curl
    environment:
      KUBERNETES_SERVICE_HOST: "127.0.0.1"
      KUBERNETES_SERVICE_PORT: "32764"
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: kube-state-metrics
    - uses: test/tw/help-check
      with:
        bins: kube-state-metrics
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - name: Test kube-state-metrics daemon startup and metrics endpoint
      uses: test/daemon-check-output
      with:
        start: /usr/bin/kube-state-metrics --kubeconfig ~/.kube/config
        expected_output: "Started metrics server"
        timeout: "30"
        post: |
          set -euo pipefail
          # Wait for metrics endpoint to be ready
          wait-for-it localhost:8080 -t 30
          # Verify metrics endpoint is accessible and serving kube metrics
          curl -sf http://localhost:8080/metrics | grep -F "kube_" || {
            echo "FAIL: Expected kube_ metrics in output"
            exit 1
          }
          echo "SUCCESS: Metrics endpoint accessible and serving metrics"
