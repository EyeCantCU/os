package:
  name: policycoreutils
  version: "3.10"
  epoch: 0 # go/enterprise-rsc/policycoreutils
  description: "SELinux policy core utilities"
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      # fixfiles needs these
      - coreutils
      - grep
      - merged-sbin
      - wolfi-baselayout
  resources:
    cpu: "3"
    memory: 15Gi

environment:
  contents:
    packages:
      - busybox
      - coreutils
      - gcc
      - gettext
      - glibc-dev
      - libselinux-dev
      - libsemanage-dev
      - libsepol-dev
      - pkgconf-dev
      - python3
  environment:
    SBINDIR: /usr/bin

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/SELinuxProject/selinux.git
      tag: ${{package.name}}-${{package.version}}
      expected-commit: ca10fc4204ed60540d41d2499127c18ad0643f9e

  - uses: autoconf/make-install
    working-directory: ${{package.name}}

  - uses: strip

  - runs: |
      rmdir ${{targets.destdir}}/etc/pam.d

subpackages:
  - name: "${{package.name}}-doc"
    description: "${{package.name}} documentation"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

  - name: "${{package.name}}-lang"
    description: "${{package.name}} locale files"
    pipeline:
      - uses: split/locales

update:
  enabled: true
  github:
    identifier: SELinuxProject/selinux
    use-tag: true
    tag-filter: policycoreutils-
    strip-prefix: policycoreutils-

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: secon
    - uses: test/tw/help-check
      with:
        bins: semodule
    - runs: |
        # None of these binaries have --help/--version, but they emit a usage: string if called incorrectly
        for b in restorecon_xattr setfiles fixfiles setsebool; do
          $b 2>&1 | grep -qi "usage"
        done

        # these binaries not even give a usage string all of the output have "SELinux"
        for b in newrole secon sestatus load_policy; do
          $b 2>&1 | grep -qi "SELinux"
        done
