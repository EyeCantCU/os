package:
  name: chart-kubernetes-sigs-blob-csi-driver
  version: "1.27.2"
  epoch: 0
  description: Azure Blob Storage CSI driver
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/blob-csi-driver
      tag: v${{package.version}}
      expected-commit: a8521c6d0b5fc745287d9236f8f170245372272b

  - uses: charts/package
    with:
      chart-path: charts/v${{package.version}}/blob-csi-driver
      images: |
        blob-csi:
          values:
            image:
              blob:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        csi-provisioner:
          values:
            image:
              csiProvisioner:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        livenessprobe:
          values:
            image:
              livenessProbe:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        csi-node-driver-registrar:
          values:
            image:
              nodeDriverRegistrar:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        csi-resizer:
          values:
            image:
              csiResizer:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [blob-csi, csi-provisioner, livenessprobe, csi-node-driver-registrar, csi-resizer]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/blob-csi-driver
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
