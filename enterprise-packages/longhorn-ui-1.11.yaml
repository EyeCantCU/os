#nolint:update-identifier-must-match-git-repository
package:
  name: longhorn-ui-1.11
  version: "1.11.0"
  epoch: 0
  description: ui component for Longhorn, a cloud-native distributed block storage system for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - longhorn-ui=${{package.full-version}}
    runtime:
      - gettext
      - iproute2
      - nginx

environment:
  contents:
    packages:
      - bash
      - busybox
      - gettext
      - nodejs-22
      - npm
  environment:
    VERSION: "v${{package.version}}"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/longhorn/longhorn-ui.git
      tag: v${{package.version}}
      expected-commit: bfe2b3c54a8556b55f36d78ddc94da83dbaf7d02

  - name: build
    runs: |
      npm ci
      npm install terser-webpack-plugin@4 --save-dev
      envsubst '${VERSION}' < src/utils/config.js > src/utils/config.js.subst
      mv src/utils/config.js.subst src/utils/config.js
      npm run build

  - name: install
    runs: |
      mkdir -p ${{targets.destdir}}/web
      mkdir -p ${{targets.destdir}}/etc/nginx
      cp -r dist ${{targets.destdir}}/web/
      install -Dm644 nginx.conf.template ${{targets.destdir}}/etc/nginx/nginx.conf.template

  - name: copy script
    runs: |
      mkdir -p ${{targets.destdir}}/usr/local/bin
      install -Dm755 ./scripts/start-nginx.sh ${{targets.destdir}}/usr/local/bin/

# All of the version streamed components of longhorn should follow a single release as shown in https://github.com/longhorn/longhorn
# To align with this, we will watch for releases from the longhorn/longhorn repo.
# The expectation is that should a release/tag be available in the group repo, that release/tag will also be available in the component but not vice versa.
update:
  enabled: true
  github:
    identifier: longhorn/longhorn
    strip-prefix: v
    tag-filter-prefix: v1.11
    use-tag: true
  ignore-regex-patterns:
    - '.*-rc\d+$'
    - ".*-dev-.*"

test:
  environment:
    contents:
      packages:
        - curl
        - nodejs-22
        - npm
        - wait-for-it
        - shadow
    environment:
      LONGHORN_MANAGER_IP: "http://localhost"
      LONGHORN_UI_PORT: 8080
  pipeline:
    - name: "Test Longhorn UI"
      uses: test/daemon-check-output
      with:
        start: "npx http-server /web/dist -p 8080"
        timeout: 60
        expected_output: |
          serving
          Available on
        post: |
          wait-for-it -t 10 --strict localhost:8080 -- echo "Server is up"
          curl -f http://localhost:8080/index.html | grep "DOCTYPE html" # dynamically loads content with react, so we just check that something exists
    - runs: stat /usr/local/bin/start-nginx.sh
    - name: "Test entrypoint script"
      uses: test/daemon-check-output
      with:
        setup: |
          useradd nginx
        start: "start-nginx.sh"
        timeout: 60
        expected_output: |
          No IPv6 address detected
          running in IPv4-only mode
        post: |
          wait-for-it -t 10 --strict localhost:8080 -- echo "Server is up"
          curl -f http://localhost:8080/index.html | grep "DOCTYPE html" # dynamically loads content with react, so we just check that something exists
    - runs: stat /usr/local/bin/start-nginx.sh
