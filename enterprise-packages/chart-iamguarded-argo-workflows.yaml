package:
  name: chart-iamguarded-argo-workflows
  version: 13.0.6
  epoch: 1
  description: Argo Workflows iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common
      - chart-iamguarded-mysql
      - chart-iamguarded-postgresql

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: argo-workflows/${{package.version}}
      expected-commit: fd7712a1bfe3aeb3aeb0f3a69673f3454b718d89

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/argo-workflows

  - uses: charts/package
    with:
      chart-path: iamguarded/argo-workflows

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: argo-workflows/
    use-tag: true
    tag-filter-prefix: argo-workflows/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /argo-workflows
