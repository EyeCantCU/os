package:
  name: pgpool2-4.3
  version: "4.3.19"
  epoch: 1
  description: Middleware that works between PostgreSQL servers and a PostgreSQL database client.
  copyright:
    - license: BSD-3-Clause AND MIT
  dependencies:
    provides:
      - pgpool2=${{package.full-version}}
    runtime:
      - merged-varrun
      - postgresql-17
      - postgresql-17-client

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bison
      - build-base
      - busybox
      - flex
      - gcc-14-default
      - libtool
      - openssl-dev
      - postgresql-dev

var-transforms:
  - from: ${{package.version}}
    match: \.
    replace: _
    to: mangled-package-version
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pgpool/pgpool2
      tag: V${{vars.mangled-package-version}}
      expected-commit: f9087e142bbc0ec489c86a10133b35d733251716

  # Patch to fix compilation errors for pgproto
  - uses: patch
    with:
      patches: /home/build/fix_compile_error.patch

  - uses: autoconf/configure
    with:
      opts: |
        --sysconfdir=/etc/pgpool2 --with-openssl

  # build src/parser explicitly to avoid build failures due to missing parser files with -j flag
  - runs: |
      make -C src/parser V=1

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

  - runs: |
      mkdir -p "${{targets.contextdir}}/run/pgpool"
      mkdir -p "${{targets.contextdir}}/usr/lib/tmpfiles.d"
      echo 'd /run/pgpool 0755 root root' >"${{targets.contextdir}}/usr/lib/tmpfiles.d/${{context.name}}.conf"

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      provides:
        - pgpool2-dev=${{package.full-version}}
      runtime:
        - ${{package.name}}
        - merged-usrsbin
        - wolfi-baselayout
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-compat
    description: "Compatibility package for Upstream pgpool image"
    dependencies:
      provides:
        - pgpool2-compat=${{package.full-version}}
    pipeline:
      - name: "Symlink all pgpool binaries to /opt/pgpool-II/bin"
        runs: |
          mkdir -p ${{targets.subpkgdir}}/opt/pgpool-II/bin
          for bin_path in ${{targets.destdir}}/usr/bin/*; do
            bin=$(basename ${bin_path})
            ln -s "/usr/bin/${bin}" "${{targets.subpkgdir}}/opt/pgpool-II/bin/${bin}"
          done

          # Link sample files
          mkdir -p "${{targets.contextdir}}/opt/pgpool-II/etc"
          # Create symlinks from /etc/pgpool2/* to /opt/pgpool-II/etc/
          for sample_path in ${{targets.destdir}}/etc/pgpool2/*;do
            sample=$(basename ${sample_path})
            ln -s "/etc/pgpool2/${sample}" "${{targets.subpkgdir}}/opt/pgpool-II/etc/${sample}"
          done
    test:
      pipeline:
        - uses: test/tw/contains-files
          with:
            dir: "/opt/pgpool-II/"
            name: "*"
            type: "l"

  # iamguarded variant of pgpool2 with a different confdir, see escalation: https://github.com/chainguard-dev/customer-issues/issues/2821
  - name: ${{package.name}}-iamguarded
    description: "Iamguarded pkg that builds with specific confdir"
    dependencies:
      provides:
        - pgpool2-iamguarded=${{package.full-version}}
      runtime:
        - bash
        - merged-varrun
        - postgresql
        - postgresql-client
    pipeline:
      - uses: autoconf/configure
        with:
          opts: |
            --prefix=/opt/iamguarded/pgpool --sysconfdir=/opt/iamguarded/pgpool/etc --libdir=/opt/iamguarded/pgpool/lib --with-openssl
      # build src/parser explicitly to avoid build failures due to missing parser files with -j flag
      - runs: |
          make -C src/parser V=1
      - uses: autoconf/make
        with:
          opts: "clean" # The binary embeds the sysconfdir path at build time into the binary, so we do a clean rebuild.
      - uses: autoconf/make-install
      - uses: strip
      - runs: |
          mkdir -p "${{targets.contextdir}}/run/pgpool"
          mkdir -p "${{targets.contextdir}}/usr/lib/tmpfiles.d"
          echo 'd /run/pgpool 0755 postgres postgres' >"${{targets.contextdir}}/usr/lib/tmpfiles.d/${{context.name}}.conf"
          mkdir -p ${{targets.contextdir}}/usr/bin/
          # To enable backwards compatibility with existing iamguarded-compat package, we copy binaries to /usr/bin
          cp -p ${{targets.contextdir}}/opt/iamguarded/pgpool/bin/* ${{targets.contextdir}}/usr/bin/
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: "/opt/iamguarded/pgpool/bin/pgpool"

  - name: ${{package.name}}-iamguarded-compat
    description: "Compatibility package for iamguarded variant of pgpool2"
    dependencies:
      provides:
        - pgpool2-iamguarded-compat=${{package.full-version}}
      runtime:
        - busybox
        - coreutils
        - openldap
        - postgresql-client
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: pgpool2
          version: ${{vars.major-version}}
      - name: "Create Symlinks for pgpool binaries"
        runs: |
          mkdir -p "/opt/iamguarded/pgpool/bin"
          # symlink all pgpool, pcp_* binaries to /opt/iamguarded/pgpool/bin
          for bin in \
            pcp_attach_node pcp_detach_node pcp_health_check_stats pcp_node_count \
            pcp_node_info pcp_pool_status pcp_proc_count pcp_proc_info pcp_promote_node \
            pcp_recovery_node pcp_stop_pgpool pcp_watchdog_info \
            pg_enc pg_md5 pgpool pgpool_setup pgproto watchdog_setup wd_cli \
          ; do
            ln -s "/usr/bin/${bin}" "/opt/iamguarded/pgpool/bin/${bin}"
          done

          # copy etc to pgpool/etc
          mkdir -p "/opt/iamguarded/pgpool/etc"
          cp -pr "${{targets.destdir}}/etc/pgpool2/." "/opt/iamguarded/pgpool/etc/"

          # copy etc to pgpool/etc.default
          mkdir -p "/opt/iamguarded/pgpool/etc.default"
          cp -pr "${{targets.destdir}}/etc/pgpool2/." "/opt/iamguarded/pgpool/etc.default/"

          # link postgres binaries to /opt/iamguarded/postgresql/bin
          mkdir -p "/opt/iamguarded/postgresql/bin"
          for bin in \
            pg_dump pg_dumpall pg_restore psql \
          ; do
            ln -s "/usr/bin/${bin}" "/opt/iamguarded/postgresql/bin/${bin}"
          done

          # swap out socket path to /opt/iamguarded/pgpool/tmp/. Only required in pgpool2-4.2 and 4.3
          sed -i "s|#socket_dir = '/tmp'|socket_dir = '/opt/iamguarded/pgpool/tmp'|g" /opt/iamguarded/pgpool/etc/pgpool.conf.sample
          sed -i "s|#pcp_socket_dir = '/tmp'|pcp_socket_dir = '/opt/iamguarded/pgpool/tmp'|g" /opt/iamguarded/pgpool/etc/pgpool.conf.sample
          sed -i "s|#socket_dir = '/tmp'|socket_dir = '/opt/iamguarded/pgpool/tmp'|g" /opt/iamguarded/pgpool/etc.default/pgpool.conf.sample
          sed -i "s|#pcp_socket_dir = '/tmp'|pcp_socket_dir = '/opt/iamguarded/pgpool/tmp'|g" /opt/iamguarded/pgpool/etc.default/pgpool.conf.sample
      - uses: iamguarded/finalize-compat
        with:
          package: pgpool2
          version: ${{vars.major-version}}
    test:
      environment:
        accounts:
          users:
            - username: iamguarded
              uid: 1001
              gid: 0
          run-as: 0
        contents:
          packages:
            - ${{package.name}}
            - busybox
            - coreutils
            - sudo
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: pgpool2
            version: ${{vars.major-version}}
        - runs: |
            test -f /opt/iamguarded/postgresql/bin/psql

update:
  enabled: true
  ignore-regex-patterns:
    - _RPM
  version-transform:
    - match: "_"
      replace: .
  github:
    identifier: pgpool/pgpool2
    strip-prefix: V
    use-tag: true
    tag-filter-prefix: V4_3

test:
  environment:
    contents:
      packages:
        - postgresql~17
        - postgresql-client~17
        - shadow
        - sudo-rs
    environment:
      PGDATA: /tmp/test_db
      PGUSER: wolfi
      PGPASSWORD: custompassword
  pipeline:
    - uses: test/systemd-tmpfiles
    - name: "Test binaries"
      runs: |
        pgpool --version
        pgpool --help
    - name: "Test with postgresql"
      runs: |
        useradd $PGUSER
        sudo -u $PGUSER initdb -D /tmp/test_db
        sudo -u $PGUSER pg_ctl -D /tmp/test_db -l /tmp/logfile start
        createdb customdatabase
        psql customdatabase -c "CREATE TABLE IF NOT EXISTS test_table (id INTEGER, str TEXT); INSERT INTO test_table VALUES(1, 'Test value');"
        # 28b48ce7ae1f2db6539f7ed94728d992 = custompassword
        echo "wolfi:28b48ce7ae1f2db6539f7ed94728d992" >/etc/pgpool2/pcp.conf
        cp /etc/pgpool2/pool_hba.conf.sample /etc/pgpool2/pool_hba.conf
        cat >/etc/pgpool2/pgpool.conf <<EOF
        listen_addresses = '*'
        port = 55432
        backend_hostname0 = 'localhost'
        backend_port0 = 5432
        EOF
        pgpool >/dev/null 2>&1 &
        # connect via pgpool and validate connection ; retry in case pgpool is not up yet
        for attempt in $(seq 1 10) ; do
          if ! psql -Uwolfi -h127.0.0.1 -p55432 customdatabase -c "SELECT * FROM test_table" \
            | grep 'Test value' ; then
            sleep 3
          else
            pkill pgpool
            exit 0
          fi
        done
        echo "Unable to query data"
        exit 1
