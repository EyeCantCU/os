package:
  name: json-exporter-fips
  version: "0.7.0"
  epoch: 1 # CVE-2025-61732
  description: Prometheus exporter for JSON metrics
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/json_exporter
      tag: v${{package.version}}
      expected-commit: 06fb506a4c5d242186f198b9c8bf072212f3a134

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.47.0
        golang.org/x/net@v0.49.0
        golang.org/x/oauth2@v0.34.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      output: json_exporter
      ldflags: |
        -X github.com/prometheus/common/version.Version=v${{package.version}}
        -X github.com/prometheus/common/version.Revision=$(git rev-parse --short HEAD)
        -X github.com/prometheus/common/version.Branch=$(git branch --show-current)
        -X github.com/prometheus/common/version.BuildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: json_exporter
    - uses: test/tw/ver-check
      with:
        bins: json_exporter
    - runs: |
        cat > /tmp/config.yml <<EOF
        modules:
          default:
            metrics:
            - name: test_metric
              path: '{ .value }'
        EOF
        json_exporter --config.file=/tmp/config.yml &
        PID=$!
        wait-for-it localhost:7979 -t 12
        curl -f --max-time 5 http://localhost:7979/metrics
        kill $PID 2>/dev/null || true
