package:
  name: valkey-search-1.1
  version: "1.1.0"
  epoch: 0
  description: High-performance vector similarity search engine module for Valkey
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provides:
      - valkey-search=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - clang-18
      - cmake-3
      - linux-headers
      - openssl-dev
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/valkey-io/valkey-search
      tag: ${{package.version}}
      expected-commit: df918dd23b7f209beb2d5be57539663052cc15aa
      recurse-submodules: true

  - uses: patch
    with:
      patches: fix-spaceship-operator.patch

  - runs: |
      cmake -B build -G Ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_C_COMPILER=clang \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DCMAKE_CXX_STANDARD=20 \
        -DBUILD_TESTS=OFF \
        -DWITH_SUBMODULES_SYSTEM=OFF

  - runs: |
      cmake --build build -j$(nproc)

  - runs: |
      mkdir -p "${{targets.destdir}}/usr/lib/valkey/modules"
      install -m755 build/libsearch.so "${{targets.destdir}}/usr/lib/valkey/libsearch.so"

  - uses: strip

update:
  enabled: true
  github:
    identifier: valkey-io/valkey-search
    use-tag: true

test:
  environment:
    contents:
      packages:
        - valkey
        - valkey-cli
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test module loads in valkey
      runs: |
        set -euo pipefail
        # Start valkey with the search module
        valkey-server valkey.conf

        # Wait for valkey to start
        sleep 2

        # Verify module is loaded
        valkey-cli MODULE LIST | grep -Fi "search"

        # Test basic FT commands are available
        valkey-cli FT._LIST

        # Cleanup
        valkey-cli SHUTDOWN NOSAVE || true
