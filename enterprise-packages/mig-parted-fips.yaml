package:
  name: mig-parted-fips
  version: "0.13.1"
  epoch: 5 # CVE-2025-68121
  description: MIG Partition Editor for NVIDIA GPUs
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - kubectl-fips-latest
      - nvidia-container-toolkit-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/mig-parted
      tag: v${{package.version}}
      expected-commit: 1aa12e58f8b4aa310bfe61c1fb95b1b04f52f551

  - uses: go/build
    with:
      packages: ./cmd/nvidia-mig-parted
      go-package: go-fips
      output: nvidia-mig-parted
      ldflags: |
        -extldflags=-Wl,-z,lazy
        -X github.com/NVIDIA/mig-parted/internal/info.version=${{package.version}}
        -X github.com/NVIDIA/mig-parted/internal/info.gitCommit=$(git rev-parse HEAD)

  - uses: go/build
    with:
      packages: ./cmd/nvidia-mig-manager
      go-package: go-fips
      output: nvidia-mig-manager
      ldflags: |
        -extldflags=-Wl,-z,lazy
        -X github.com/NVIDIA/mig-parted/internal/info.version=${{package.version}}
        -X github.com/NVIDIA/mig-parted/internal/info.gitCommit=$(git rev-parse HEAD)

subpackages:
  - name: ${{package.name}}-compat
    description: mig-parted-fips compat package
    pipeline:
      - runs: install -Dpm0755 -t ${{targets.subpkgdir}}/usr/bin ./deployments/container/reconfigure-mig.sh
    test:
      pipeline:
        - runs: stat /usr/bin/reconfigure-mig.sh | grep "0755"

update:
  enabled: true
  github:
    identifier: NVIDIA/mig-parted
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nvidia-mig-parted nvidia-mig-manager
    - uses: test/tw/ver-check
      with:
        bins: nvidia-mig-parted nvidia-mig-manager
