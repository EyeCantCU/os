package:
  name: chart-hashicorp-vault
  version: "0.32.0"
  epoch: 0
  description: Official HashiCorp Vault Chart
  copyright:
    - license: MPL-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/vault-helm
      tag: v${{package.version}}
      expected-commit: 3e032ad7685f80fc2a021e282a52b6d2fbd37a07

  - uses: charts/package
    with:
      chart-path: .
      images: |
        vault:
          values:
            server:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        vault-k8s:
          values:
            injector:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        vault-agent:
          values:
            injector:
              agentImage:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        vault-csi-provider:
          values:
            csi:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        vault-csi-agent:
          values:
            csi:
              agent:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [vault, vault-k8s, vault-agent]
          - name: with-csi
            images: [vault, vault-k8s, vault-agent, vault-csi-provider, vault-csi-agent]
            values:
              csi:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: hashicorp/vault-helm
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
