package:
  name: dex-k8s-authenticator
  version: 1.4.0
  epoch: 25
  description: Pluggable web app using Dex Identity services
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - git
      - go
      - openssl
      - tini
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mintel/dex-k8s-authenticator
      tag: v${{package.version}}
      expected-commit: 576d1cbe432f5c580d60b16b762174c79a97d56a

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/sys@v0.0.0-20220412211240-33da011f77ad
        golang.org/x/text@v0.3.8
        gopkg.in/yaml.v2@v2.2.8
      replaces: |-
        golang.org/x/crypto=golang.org/x/crypto@v0.35.0

  - runs: |
      mkdir -p "${{targets.destdir}}"/certs

      mkdir -p "${{targets.destdir}}"/app/bin/
      go build -o dex-k8s-authenticator
      mv dex-k8s-authenticator ${{targets.destdir}}/app/bin/

      mv html ${{targets.destdir}}/app/
      mv templates ${{targets.destdir}}/app/

  - runs: |
      mv entrypoint.sh ${{targets.destdir}}/app/
      chmod +x ${{targets.destdir}}/app/entrypoint.sh

  - uses: strip

update:
  enabled: true
  github:
    identifier: mintel/dex-k8s-authenticator
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/contains-files
      with:
        dir: "/app/html/static/"
        name: "*.js"
    - name: Verify binary exists and is executable
      runs: |
        # Check the binary exists and is executable
        stat /app/bin/dex-k8s-authenticator
        test -x /app/bin/dex-k8s-authenticator || {
          echo "ERROR: /app/bin/dex-k8s-authenticator is not executable"
          exit 1
        }
        echo "Binary exists and is executable"
    - name: Verify entrypoint script exists and is executable
      runs: |
        # Check the entrypoint script exists and is executable
        stat /app/entrypoint.sh
        test -x /app/entrypoint.sh || {
          echo "ERROR: /app/entrypoint.sh is not executable"
          exit 1
        }
        # Verify it's a valid shell script with valid syntax
        sh -n /app/entrypoint.sh
        echo "Entrypoint script exists and has valid syntax"
    - name: Test binary execution
      runs: |
        # Run the binary to verify it can execute (expect usage/error output on missing config)
        # The binary should start but fail due to missing configuration
        cd /app
        output=$(./bin/dex-k8s-authenticator 2>&1 || true)

        # Verify the binary actually ran (not a missing library or crash)
        # It should produce output related to the application
        if [ -z "$output" ]; then
          echo "ERROR: Binary produced no output"
          exit 1
        fi
        echo "Binary output: $output"
        echo "Binary executed successfully"
