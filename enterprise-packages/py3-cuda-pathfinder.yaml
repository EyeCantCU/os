package:
  name: py3-cuda-pathfinder
  version: "1.4.0"
  epoch: 0 # go/enterprise-rsc/py3-cuda-pathfinder
  description: Pathfinder for CUDA components
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "2"
    memory: 6Gi

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

vars:
  import: cuda.pathfinder
  pypi-package: cuda-pathfinder

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/cuda-python
      tag: cuda-pathfinder-v${{package.version}}
      expected-commit: 8d0ccdd648152d6d7f89f629394a165c6e3a0806

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.import}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
        working-directory: cuda_pathfinder
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - uses: test/tw/ldd-check

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: NVIDIA/cuda-python
    tag-filter-prefix: cuda-pathfinder-v
    strip-prefix: cuda-pathfinder-v
