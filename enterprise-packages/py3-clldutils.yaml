package:
  name: py3-clldutils
  version: "3.24.3"
  epoch: 0
  description: Utilities for programmatic data curation
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: clldutils

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/clld/clldutils.git
      tag: v${{package.version}}
      expected-commit: 5cbfb757a145e96726e1882bc17ebe15d0207969

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-attrs
        - py${{range.key}}-bibtexparser
        - py${{range.key}}-colorlog
        - py${{range.key}}-lxml
        - py${{range.key}}-markdown
        - py${{range.key}}-markupsafe
        - py${{range.key}}-pylatexenc
        - py${{range.key}}-python-dateutil
        - py${{range.key}}-tabulate
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            tee mycli.py <<'EOF'
            from clldutils.clilib import *

            def main():
                parser, subparsers = get_parser_and_subparsers('mycli')
                parser.add_argument(
                    '-z', '--maxfieldsize',
                    metavar='FIELD_SIZE_LIMIT',
                    type=lambda s: int(s),
                    help='Maximum length of a single field in any input CSV file.',
                    default=10,
                )

                args = parser.parse_args()

                if not hasattr(args, "main"):
                    parser.print_help()
                    return 1

                with contextlib.ExitStack() as stack:
                    stack.enter_context(Logging(args.log, level=args.log_level))
                    try:
                        return args.main(args) or 0
                    except KeyboardInterrupt:
                        return 0
                    except ParserError as e:
                        print(e)
                        return main([args._command, '-h'])

            main()
            EOF
            python${{range.key}} ./mycli.py -h | grep -F -e "show this help message and exit"

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
