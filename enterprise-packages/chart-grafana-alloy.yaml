package:
  name: chart-grafana-alloy
  version: "1.6.0"
  epoch: 0
  description: Grafana Alloy
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/alloy
      tag: helm-chart/${{package.version}}
      expected-commit: 44ddc6937c2a734e603616d9bf22858a82049bfb

  - uses: charts/package
    with:
      chart-path: operations/helm/charts/alloy
      images: |
        alloy:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${tag}
              digest: ${digest}
        prometheus-config-reloader:
          values:
            configReloader:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${tag}
                digest: ${digest}
      test: |
        cases:
          - name: default
            images: [alloy, prometheus-config-reloader]
          - name: without-config-reloader
            images: [alloy]
            values:
              configReloader:
                enabled: false

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: grafana/alloy
    strip-prefix: helm-chart/
    use-tag: true
    tag-filter-prefix: helm-chart/
