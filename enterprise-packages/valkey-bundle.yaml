package:
  name: valkey-bundle
  version: "9.0.1"
  epoch: 0
  description: Empty package to grab entrypoint script for Valkey bundle
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/valkey-io/valkey-bundle
      tag: ${{package.version}}
      expected-commit: e5230d296d940350a39dd5e4f79b45cd387615bc

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility package providing valkey-bundle entrypoint script
    dependencies:
      runtime:
        - dash-binsh
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          install -m755 bundle-docker-entrypoint.sh "${{targets.subpkgdir}}"/usr/local/bin/bundle-docker-entrypoint.sh
    test:
      pipeline:
        - name: Verify entrypoint script exists and is executable
          runs: |
            set -euo pipefail
            stat /usr/local/bin/bundle-docker-entrypoint.sh
            test -x /usr/local/bin/bundle-docker-entrypoint.sh || { echo "ERROR: entrypoint is not executable"; exit 1; }
        - name: Verify entrypoint script syntax
          runs: |
            set -euo pipefail
            sh -n /usr/local/bin/bundle-docker-entrypoint.sh

test:
  pipeline:
    - uses: test/tw/emptypackage

update:
  enabled: true
  github:
    identifier: valkey-io/valkey-bundle
