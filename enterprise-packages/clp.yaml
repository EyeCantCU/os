package:
  name: clp
  version: "1.17.10"
  epoch: 0
  description: Clp (Coin-or linear programming) is an open-source linear programming solver. It is primarily meant to be used as a callable library, but a basic, stand-alone executable version is also available
  copyright:
    - license: EPL-2.0
  dependencies:
    runtime:
      - lib${{package.name}}${{vars.abi}}

vars:
  abi: 1

environment:
  contents:
    packages:
      - build-base
      - busybox
      - coinutils-dev
      - gfortran
      - osi-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/coin-or/Clp
      tag: releases/${{package.version}}
      expected-commit: 9a3efaa9ecefeb2a6088a447c9f66c6f31edbed9

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      mkdir docs
      (cd "${{targets.destdir}}" && tar -c usr/share/coin/doc) > docs.save
      rm -rf ${{targets.destdir}}/usr/share/coin/doc
      # remove one by one so we fail if upstream adds other content
      rmdir ${{targets.destdir}}/usr/share/coin
      rmdir ${{targets.destdir}}/usr/share

  - runs: |
      # Currently fails due to missing test files
      # make -j$(nproc) test

  - uses: strip

subpackages:
  - name: lib${{package.name}}${{vars.abi}}
    description: lib${{package.name}} library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libClp.so.${{vars.abi}} \
            "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libClp.so.${{vars.abi}}.* \
            "${{targets.contextdir}}/usr/lib"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: lib${{package.name}}solver${{vars.abi}}
    description: lib${{package.name}} library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libClpSolver.so.${{vars.abi}} \
            "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libClpSolver.so.${{vars.abi}}.* \
            "${{targets.contextdir}}/usr/lib"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: libosiclp${{vars.abi}}
    description: lib${{package.name}} library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libOsiClp.so.${{vars.abi}} \
            "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libOsiClp.so.${{vars.abi}}.* \
            "${{targets.contextdir}}/usr/lib"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-dev
    description: ${{package.name}} development files
    dependencies:
      runtime:
        - lib${{package.name}}${{vars.abi}}=${{package.full-version}}
        - lib${{package.name}}solver${{vars.abi}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: lib${{package.name}} docs
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"
          (cd "${{targets.contextdir}}" && tar xv) < docs.save
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        clp -?

update:
  enabled: true
  github:
    identifier: coin-or/Clp
    strip-prefix: releases/
