package:
  name: chart-grafana-beyla
  version: "1.12.0"
  epoch: 0
  description: eBPF-based autoinstrumentation HTTP, HTTP2 and gRPC services, as well as network metrics.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/beyla
      tag: beyla-${{package.version}}
      expected-commit: 9faa7ab3d722eb37170371c1d43d36f821465632

  - uses: charts/package
    with:
      chart-path: charts/beyla
      images: |
        beyla:
          values:
            image:
              registry: ${registry}
              repository: ${repo}
              tag: ${tag}
              digest: ${digest}
        beyla-k8s-cache:
          values:
            k8sCache:
              image:
                registry: ${registry}
                repository: ${repo}
                tag: ${tag}
                digest: ${digest}
      test: |
        cases:
          - name: default
            images: [beyla]
          - name: with-k8s-cache
            images: [beyla, beyla-k8s-cache]
            values:
              k8sCache:
                replicas: 1

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: grafana/beyla
    strip-prefix: beyla-
    use-tag: true
    tag-filter-prefix: beyla-
