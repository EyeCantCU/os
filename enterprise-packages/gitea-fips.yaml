package:
  name: gitea-fips
  version: "1.25.4"
  epoch: 4 # GHSA-q9hv-hpm4-hj6x
  description: self-hosted git service
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips-md5
      - nodejs-23
      - npm

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 369830bada2fd8826a5135cb2fc66660a9bef708
      repository: https://github.com/go-gitea/gitea
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/go-git/go-git/v5@v5.16.5
        filippo.io/edwards25519@v1.1.1
        github.com/cloudflare/circl@v1.6.3

  - runs: |
      set -x
      npm install --no-save --yes
      BROWSERSLIST_IGNORE_OLD_DATA=true npx webpack

  - runs: |
      set -x
      CC= GOOS= GOARCH= CGO_ENABLED=1 go generate -tags 'bindata timetzdata sqlite sqlite_unlock_notify' ./...

  - uses: go/build
    with:
      packages: .
      ldflags: -X "main.Version=v${{package.version}}"
      output: gitea
      tags: netgo,osusergo,bindata,timetzdata,sqlite,sqlite_unlock_notify
      go-package: go-fips-md5

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package for working with upstream docs"
    pipeline:
      - runs: |
          set -x
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          cp docker/rootless/usr/local/bin/docker-entrypoint.sh "${{targets.subpkgdir}}"/usr/local/bin
          cp docker/rootless/usr/local/bin/docker-setup.sh "${{targets.subpkgdir}}"/usr/local/bin
          cp docker/rootless/usr/local/bin/gitea "${{targets.subpkgdir}}"/usr/local/bin
          chmod 755 \
            "${{targets.subpkgdir}}"/usr/local/bin/docker-entrypoint.sh \
            "${{targets.subpkgdir}}"/usr/local/bin/docker-setup.sh \
            "${{targets.subpkgdir}}"/usr/local/bin/gitea
          mkdir -p "${{targets.subpkgdir}}"/etc/profile.d
          mkdir -p "${{targets.subpkgdir}}"/etc/templates
          cp docker/rootless/etc/templates/app.ini "${{targets.subpkgdir}}"/etc/templates
          mkdir -p "${{targets.subpkgdir}}"/app/gitea
          ln -sf /usr/bin/gitea "${{targets.subpkgdir}}"/app/gitea/gitea
      - uses: go/build
        with:
          packages: contrib/environment-to-ini/environment-to-ini.go
          prefix: usr/local
          output: environment-to-ini
          go-package: go-fips-md5
    test:
      environment:
        contents:
          packages:
            - gitea-fips # Go fips check fails on the "app/gitea/gitea" symlink otherwise
      pipeline:
        - uses: test/go-fips-check

test:
  pipeline:
    - uses: test/go-fips-check
    - name: Verify Gitea functional operation
      runs: |
        set -euo pipefail
        # Gitea blocks execution as root, so we must run as unprivileged user.
        # User creation may fail if user already exists - this is expected.
        adduser -D giteatest || true

        # CONSTRAINT: Cannot use test/tw/ver-check and test/tw/help-check pipelines
        # because they run as root, but Gitea explicitly blocks root execution.
        #
        # FUNCTIONAL TEST: Generate a secret token using FIPS-compliant crypto.
        # This verifies:
        # 1. The gitea binary executes correctly as non-root user
        # 2. FIPS cryptographic operations work (secret generation uses crypto)
        # 3. The binary is properly linked and functional
        secret=$(su giteatest -s /bin/sh -c "gitea generate secret INTERNAL_TOKEN")

        # Verify a secret was generated (non-empty output indicates success)
        if [ -z "$secret" ]; then
          echo "FAIL: Expected gitea to generate a secret"
          exit 1
        fi
        echo "SUCCESS: Gitea generated secret token, binary is functional"

update:
  enabled: true
  github:
    identifier: go-gitea/gitea
    strip-prefix: v
