package:
  name: chrony_exporter
  version: "0.13.2"
  epoch: 0 # CVE-2025-61732
  description: Prometheus exporter for Chrony NTP
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/SuperQ/chrony_exporter
      tag: v${{package.version}}
      expected-commit: 9760b94aa94ac0486519bb1b14c42cd3c113e680

  - uses: go/build
    with:
      packages: .
      output: chrony_exporter
      ldflags: |
        -X github.com/prometheus/common/version.Version=${{package.version}}
        -X github.com/prometheus/common/version.Revision=$(git rev-parse HEAD)
        -X github.com/prometheus/common/version.Branch=$(git branch --show-current)
        -X github.com/prometheus/common/version.BuildUser=melange
        -X github.com/prometheus/common/version.BuildDate=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: chrony_exporter
    - uses: test/tw/ver-check
      with:
        bins: chrony_exporter
    - name: "Test chrony_exporter metrics endpoint"
      uses: test/daemon-check-output
      with:
        start: chrony_exporter --web.listen-address=:9123
        timeout: 30
        expected_output: |
          Listening on
          TLS is disabled
        post: |
          set -o pipefail

          # Wait for the metrics endpoint to be ready
          wait-for-it localhost:9123 -t 10

          # Verify metrics endpoint is accessible
          curl -sf http://localhost:9123/metrics | grep -F "promhttp_metric_handler_requests_total"

          # Verify exporter build info is present
          curl -sf http://localhost:9123/metrics | grep -F "chrony_exporter_build_info"
