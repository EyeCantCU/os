package:
  name: vunnel
  version: "0.50.0"
  epoch: 1 # go/enterprise-rsc/vunnel
  description: "A tool for fetching, transforming, and storing vulnerability data from a variety of sources. It is used to create the Grype vulnerability database."
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0
  resources:
    cpu: "2"
    memory: 4Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - crane
      - curl
      - glow
      - go
      - py3-supported-fastjsonschema
      - py3-supported-hatch-vcs
      - py3-supported-hatchling
      - py3-supported-pip
      - py3-supported-poetry
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-trove-classifiers
      - py3-supported-untokenize
      - py3-supported-wheel
      - py3-supported-zstandard
      - uv

vars:
  pypi-package: vunnel

data:
  # As of 0.45.2, only supports 3.13.
  # requires-python = "<3.14,>=3.13"
  # https://github.com/anchore/vunnel/blob/v0.45.2/pyproject.toml#L4
  - name: py-versions
    items:
      3.13: '313'

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/anchore/vunnel.git
      tag: v${{package.version}}
      expected-commit: 14d2864d12314ef5369aad3766b1ba09bad98ab8

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - name: "Install uv-dynamic-versioning for the build since uv alone is insufficient"
        runs: |
          pip${{range.key}} install uv-dynamic-versioning
          uv sync --python python${{range.key}} --all-extras
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: move usr/bin executables for -bin
        runs: |
          mkdir -p ./cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./cleanup/${{range.key}}/
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
        - py${{range.key}}-click
        - py${{range.key}}-colorlog
        - py${{range.key}}-cvss
        - py${{range.key}}-dateutil
        - py${{range.key}}-defusedxml
        - py${{range.key}}-iso8601
        - py${{range.key}}-importlib-metadata
        - py${{range.key}}-lxml
        - py${{range.key}}-mashumaro
        - py${{range.key}}-mergedeep
        - py${{range.key}}-orjson
        - py${{range.key}}-packageurl-python
        - py${{range.key}}-pyyaml
        - py${{range.key}}-requests
        - py${{range.key}}-sqlalchemy
        - py${{range.key}}-xsdata
        - py${{range.key}}-xxhash
        - py${{range.key}}-zstandard
        - py${{range.key}}-oras-py
        - oras-fips
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
          # Create symlink for oras CLI where vunnel expects it
          mkdir -p "${{targets.contextdir}}/usr/lib/python${{range.key}}/.tool"
          ln -sf /usr/bin/oras "${{targets.contextdir}}/usr/lib/python${{range.key}}/.tool/oras"
    test:
      pipeline:
        - runs: |
            vunnel --help
            vunnel list | grep wolfi
            vunnel run wolfi
            vunnel clear wolfi
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}-bin

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: true
  manual: false
  github:
    identifier: anchore/vunnel
    use-tag: true
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/byproductpackage
