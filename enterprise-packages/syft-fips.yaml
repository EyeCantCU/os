package:
  name: syft-fips
  version: "1.42.1"
  epoch: 0 # CVE-2025-61732
  description: CLI tool and library for generating a Software Bill of Materials from container images and filesystems
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/anchore/syft
      tag: v${{package.version}}
      expected-commit: 0a3f7bb06ee168495ee54b8b66fccb22a056fe99

  - uses: go/bump
    with:
      deps: |-
        github.com/ulikunitz/xz@v0.5.14
      modroot: syft/pkg/cataloger/golang/test-fixtures/image-not-a-module

  - uses: go/bump
    with:
      deps: |-
        github.com/ulikunitz/xz@v0.5.14
      modroot: syft/pkg/cataloger/golang/test-fixtures/image-small

  # FIXME: Since we don't have go-fips-1.24 as of building this, the workaround was to patch the go.mod to downgrade go version. Let's omit this line once we get go-fips-1.24.
  - name: Check go-fips version
    runs: |
      go version | grep -iq 1.23*

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X main.version=${{package.version}}
      output: syft
      packages: ./cmd/syft

update:
  enabled: true
  github:
    identifier: anchore/syft
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: syft
    - uses: test/tw/help-check
      with:
        bins: syft
    - name: Test SBOM generation
      runs: |
        set -euo pipefail

        # Test default syft-json format
        syft cgr.dev/chainguard/static:latest -o syft-json > sbom-default.json
        # Verify JSON structure has expected artifacts field (fails on empty/invalid)
        jq -e ".artifacts" sbom-default.json

        # Test all-layers scope with syft-json format
        syft cgr.dev/chainguard/static:latest --scope all-layers -o syft-json > sbom-all-layers.json
        # Verify JSON structure has expected artifacts field
        jq -e ".artifacts" sbom-all-layers.json

        # Test SPDX format
        syft cgr.dev/chainguard/static:latest -o spdx-json > sbom-spdx.json
        # Verify SPDX JSON structure has spdxVersion field
        jq -e ".spdxVersion" sbom-spdx.json

        # Test CycloneDX format
        syft cgr.dev/chainguard/static:latest -o cyclonedx-json > sbom-cdx.json
        # Verify CycloneDX JSON structure has bomFormat field
        jq -e ".bomFormat" sbom-cdx.json
