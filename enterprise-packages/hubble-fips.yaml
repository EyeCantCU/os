package:
  name: hubble-fips
  version: "1.18.6"
  epoch: 1 # go/enterprise-rsc/hubble-fips
  description: hubble is a command to list and diagnose Go processes currently running on your system.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "5"
    memory: 8Gi

environment:
  contents:
    packages:
      - build-base
      - busybox
      - git
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cilium/hubble
      tag: v${{package.version}}
      expected-commit: 95622e77ee29730d2ca662b759613ea17e3951f2

  # We need to disable the "-s" ldflags and CGO_ENABLED=0 for the build to be FIPS.
  - uses: go/remove-cgo-enabled-0
    with:
      seds: |
        s,CGO_ENABLED=0[ ]*,,g
        s,-w -s,-w,g

  - runs: |
      DESTDIR=${{targets.destdir}} BINDIR=/usr/bin make install

  - uses: strip

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility package for hubble
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -sf /usr/bin/hubble ${{targets.subpkgdir}}/usr/local/bin/hubble
      - uses: strip
    test:
      pipeline:
        - runs: |
            readlink -v /usr/local/bin/hubble

update:
  enabled: true
  github:
    identifier: cilium/hubble
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: hubble
    - uses: test/tw/help-check
      with:
        bins: hubble
