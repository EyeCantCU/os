package:
  name: karma-fips
  version: "0.124"
  description: "A dashboard for managing alerts from Alertmanager"
  epoch: 0 # CVE-2025-61732
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - ca-certificates-bundle
      - nodejs
      - npm
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prymitive/karma.git
      tag: v${{package.version}}
      expected-commit: 6094fd1ca87eccf2a6c71301a3032f019d8be144

  - name: install-npm-dependencies
    working-directory: ui
    pipeline:
      - runs: |
          mkdir -p node_modules/.bin
          touch node_modules/.install
          npm install --package-lock-only
          npm prune --omit=dev
          npm ci
          cat node_modules/bootstrap/scss/_root.scss | sed s/':root {'/'* {'/ > src/Styles/BootstrapRoot.scss
          npm run build

  - name: Copy build files
    runs: |
      cp -r ui/src ./ui/dist ./ui/mock ./ui/embed.go .

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/karma
      ldflags: -X main.version=${{package.version}}
      output: karma

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: karma
    - uses: test/go-fips-check
    - name: "Check karma health"
      uses: test/daemon-check-output
      with:
        start: "karma"
        timeout: 60
        expected_output: |
          Starting HTTP server
        post: |
          set -euo pipefail
          wait-for-it localhost:8080 -t 30
          curl -sf http://localhost:8080/health | grep -F "Pong"

update:
  enabled: true
  github:
    identifier: prymitive/karma
    strip-prefix: v
