package:
  name: crossplane-provider-kubernetes
  version: "1.2.0"
  epoch: 1 # CVE-2025-61731
  description: Crossplane provider to provision and manage Kubernetes objects on (remote) Kubernetes clusters.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - crossplane-crank

pipeline:
  - uses: git-checkout
    with:
      expected-commit: cc0f44bbd7e93c28aaedaeedd9b247494f6a23ed
      repository: https://github.com/crossplane-contrib/provider-kubernetes
      tag: v${{package.version}}

  - uses: go/build
    with:
      output: crossplane-kubernetes-provider
      packages: ./cmd/provider
      ldflags: |
        -X github.com/crossplane-contrib/provider-kubernetes/internal/version.Version=v${{package.version}}

  - runs: |
      crank xpkg extract xpkg.upbound.io/crossplane-contrib/provider-kubernetes:v${{package.version}}
      mkdir -p "${{targets.destdir}}"
      gunzip out.gz -c > "${{targets.destdir}}"/package.yaml

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/local/bin"
          ln -sf /usr/bin/crossplane-kubernetes-provider "${{targets.contextdir}}/usr/local/bin/crossplane-kubernetes-provider"
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - openssl
        - curl
    environment:
      KUBERNETES_SERVICE_HOST: "127.0.0.1"
      KUBERNETES_SERVICE_PORT: 32764
  pipeline:
    # AUTOGENERATED
    - runs: |
        crossplane-kubernetes-provider --help
    - uses: test/kwok/cluster
    - name: Start crossplane-terraform-provider in cluster
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /tls/server
          openssl req -x509 -newkey rsa:4096 -keyout /tls/server/tls.key -out /tls/server/tls.crt -days 365 -nodes -subj "/CN=localhost"
          chmod 600 /tls/server/tls.key
          chmod 644 /tls/server/tls.crt
        start: |
          crossplane-kubernetes-provider --debug --poll=10s --sync=30s
        timeout: 30
        expected_output: |
          Starting
          Beta feature enabled
        post: |
          curl -sf http://localhost:8080/metrics | grep go_gc_duration_seconds
