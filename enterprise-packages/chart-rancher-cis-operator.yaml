package:
  name: chart-rancher-cis-operator
  version: "8.7.0"
  epoch: 0
  description: The cis-operator enables running CIS benchmark security scans on a kubernetes cluster
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/rancher/cis-operator
      tag: v1.4.7
      expected-commit: b58ebcc884d48074c6b5f9bd34c2691a80fbc134

  - uses: charts/package
    with:
      chart-path: chart
      images: |
        cis-operator:
          values:
            image:
              cisoperator:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        security-scan:
          values:
            image:
              securityScan:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        sonobuoy:
          values:
            image:
              sonobuoy:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        kubectl:
          values:
            global:
              kubectl:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
      test: |
        # The security-scan and sonobuoy images have their repo and tag in separate
        # env vars (SECURITY_SCAN_IMAGE + SECURITY_SCAN_IMAGE_TAG, etc.), so chelm
        # cannot reassemble them into a full image reference. They are still mapped
        # in images: for cg.json metadata. The bare tag values (v0.0.0@sha256:...)
        # are detected as false-positive image refs that must be ignored.
        ignore:
          - v0.0.0@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          - index.docker.io/library/v0.0.0@sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        cases:
          - name: default
            images: [cis-operator, kubectl]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: false
  exclude-reason: Chart version (8.x) does not match git tag version (v1.4.x)
