package:
  name: cadence
  version: "1.3.6"
  epoch: 0
  description: Cadence is a distributed, scalable, durable, and highly available orchestration engine
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cadence-workflow/cadence
      tag: v${{package.version}}
      expected-commit: bd3b3941f9444521734445dd08521c651b37f970

  - uses: go/build
    with:
      packages: ./cmd/tools/cli
      output: cadence
      ldflags: |
        -X github.com/uber/cadence/common/metrics.ReleaseVersion=${{package.version}}

subpackages:
  - name: cadence-server
    description: Cadence server executes units of application logic, Workflows, in a resilient manner
    dependencies:
      runtime:
        - cadence-server-schema
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/server
          output: cadence-server
          ldflags: |
            -X github.com/uber/cadence/common/metrics.ReleaseVersion=${{package.version}}
    test:
      pipeline:
        - runs: |
            cadence-server --help
            cadence-server version

  - name: cadence-server-compat
    description: Compat package for cadence-server image (/usr/local/bin parity with upstream)
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/cadence "${{targets.subpkgdir}}"/usr/local/bin/cadence
          ln -s /usr/bin/cadence-cassandra-tool "${{targets.subpkgdir}}"/usr/local/bin/cadence-cassandra-tool
          ln -s /usr/bin/cadence-server "${{targets.subpkgdir}}"/usr/local/bin/cadence-server
          ln -s /usr/bin/cadence-sql-tool "${{targets.subpkgdir}}"/usr/local/bin/cadence-sql-tool
    test:
      pipeline:
        - runs: |
            readlink -v /usr/local/bin/cadence
            readlink -v /usr/local/bin/cadence-cassandra-tool
            readlink -v /usr/local/bin/cadence-server
            readlink -v /usr/local/bin/cadence-sql-tool

  - name: cadence-cassandra-tool
    description: Cadence Cassandra database utility
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/tools/cassandra
          output: cadence-cassandra-tool
          ldflags: |
            -X github.com/uber/cadence/common/metrics.ReleaseVersion=${{package.version}}
    test:
      pipeline:
        - runs: |
            cadence-cassandra-tool --help

  - name: cadence-sql-tool
    description: Cadence SQL database utility
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/tools/sql
          output: cadence-sql-tool
          ldflags: |
            -X github.com/uber/cadence/common/metrics.ReleaseVersion=${{package.version}}
    test:
      pipeline:
        - runs: |
            cadence-sql-tool --help

  - name: cadence-server-schema
    description: Schema files for Cadence server database setup
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/etc/cadence
          cp -r schema "${{targets.subpkgdir}}"/etc/cadence/
    test:
      pipeline:
        - runs: |
            stat /etc/cadence/schema/cassandra/cadence/versioned
            stat /etc/cadence/schema/mysql/v8/cadence/versioned

  - name: cadence-server-oci-entrypoint
    description: Entrypoint for using Cadence server in OCI containers
    dependencies:
      runtime:
        - bash
        - cadence
        - cadence-cassandra-tool
        - cadence-server
        - cadence-sql-tool
        - curl
        - dockerize
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/etc/cadence/config/dynamicconfig
          mkdir -p "${{targets.subpkgdir}}"/etc/cadence/config/credentials
          cp docker/config_template.yaml "${{targets.subpkgdir}}"/etc/cadence/config/
          cp -r config/dynamicconfig/* "${{targets.subpkgdir}}"/etc/cadence/config/dynamicconfig/
          cp -r config/credentials/* "${{targets.subpkgdir}}"/etc/cadence/config/credentials/
          cp docker/entrypoint.sh "${{targets.subpkgdir}}"/docker-entrypoint.sh
          cp docker/start-cadence.sh "${{targets.subpkgdir}}"/start-cadence.sh
          chmod +x "${{targets.subpkgdir}}"/docker-entrypoint.sh "${{targets.subpkgdir}}"/start-cadence.sh

update:
  enabled: true
  github:
    identifier: cadence-workflow/cadence
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: cadence
    - runs: |
        cadence version
