package:
  name: cadence
  version: "1.3.6"
  epoch: 0
  description: Cadence is a distributed, scalable, durable, and highly available orchestration engine
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cadence-workflow/cadence
      tag: v${{package.version}}
      expected-commit: bd3b3941f9444521734445dd08521c651b37f970

  - uses: go/build
    with:
      packages: ./cmd/tools/cli
      output: cadence
      ldflags: |
        -X github.com/uber/cadence/common/metrics.ReleaseVersion=${{package.version}}

subpackages:
  - name: cadence-server
    description: Cadence server executes units of application logic, Workflows, in a resilient manner
    dependencies:
      runtime:
        - cadence-server-schema
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/server
          output: cadence-server
          ldflags: |
            -X github.com/uber/cadence/common/metrics.ReleaseVersion=${{package.version}}
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - name: Verify cadence-server binary
          runs: |
            set -euo pipefail

            # Test help output
            cadence-server --help

            # Verify start command is available
            cadence-server --help | grep -F "start"

            # Verify version includes release info
            cadence-server --version 2>&1 | grep -F "Release version"

            # Verify SDK version support info
            cadence-server --version 2>&1 | grep -F "Max Support"

  - name: cadence-server-compat
    description: Compat package for cadence-server image (/usr/local/bin parity with upstream)
    dependencies:
      runtime:
        - cadence
        - cadence-cassandra-tool
        - cadence-server
        - cadence-sql-tool
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/cadence "${{targets.subpkgdir}}"/usr/local/bin/cadence
          ln -s /usr/bin/cadence-cassandra-tool "${{targets.subpkgdir}}"/usr/local/bin/cadence-cassandra-tool
          ln -s /usr/bin/cadence-server "${{targets.subpkgdir}}"/usr/local/bin/cadence-server
          ln -s /usr/bin/cadence-sql-tool "${{targets.subpkgdir}}"/usr/local/bin/cadence-sql-tool
    test:
      environment:
        contents:
          packages:
            - cadence
            - cadence-cassandra-tool
            - cadence-server
            - cadence-sql-tool
      pipeline:
        # Absolute symlinks are used to match upstream image structure
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true
        - name: Verify symlinks are functional
          runs: |
            set -euo pipefail

            # Verify symlinks are functional by invoking through /usr/local/bin
            /usr/local/bin/cadence --help
            /usr/local/bin/cadence-server --help
            /usr/local/bin/cadence-cassandra-tool --help
            /usr/local/bin/cadence-sql-tool --help

  - name: cadence-cassandra-tool
    description: Cadence Cassandra database utility
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/tools/cassandra
          output: cadence-cassandra-tool
          ldflags: |
            -X github.com/uber/cadence/common/metrics.ReleaseVersion=${{package.version}}
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - name: Verify cadence-cassandra-tool binary
          runs: |
            set -euo pipefail

            # Test help output
            cadence-cassandra-tool --help

            # Verify version output
            cadence-cassandra-tool --version

            # Test subcommand help for schema operations
            cadence-cassandra-tool setup-schema --help
            cadence-cassandra-tool update-schema --help
            cadence-cassandra-tool create-Keyspace --help

  - name: cadence-sql-tool
    description: Cadence SQL database utility
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/tools/sql
          output: cadence-sql-tool
          ldflags: |
            -X github.com/uber/cadence/common/metrics.ReleaseVersion=${{package.version}}
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - name: Verify cadence-sql-tool binary
          runs: |
            set -euo pipefail

            # Test help output
            cadence-sql-tool --help

            # Verify version output
            cadence-sql-tool --version

            # Test subcommand help for schema operations
            cadence-sql-tool setup-schema --help
            cadence-sql-tool update-schema --help
            cadence-sql-tool create-database --help

            # Verify supported plugins are mentioned
            cadence-sql-tool --help | grep -F "plugin"

  - name: cadence-server-schema
    description: Schema files for Cadence server database setup
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/etc/cadence
          cp -r schema "${{targets.subpkgdir}}"/etc/cadence/
    test:
      pipeline:
        - name: Verify schema directories for all supported databases
          runs: |
            set -euo pipefail

            # Cassandra schemas
            stat /etc/cadence/schema/cassandra/cadence/versioned
            stat /etc/cadence/schema/cassandra/visibility/versioned

            # MySQL schemas
            stat /etc/cadence/schema/mysql/v8/cadence/versioned
            stat /etc/cadence/schema/mysql/v8/visibility/versioned

            # PostgreSQL schemas
            stat /etc/cadence/schema/postgres/cadence/versioned
            stat /etc/cadence/schema/postgres/visibility/versioned

            # SQLite schemas (for testing)
            stat /etc/cadence/schema/sqlite/cadence/versioned
            stat /etc/cadence/schema/sqlite/visibility/versioned

            # Elasticsearch schema
            stat /etc/cadence/schema/elasticsearch

            # Verify schema files contain actual SQL/CQL content
            ls /etc/cadence/schema/cassandra/cadence/versioned/ | grep -F "v0"
            ls /etc/cadence/schema/mysql/v8/cadence/versioned/ | grep -F "v0"
            ls /etc/cadence/schema/postgres/cadence/versioned/ | grep -F "v0"

  - name: cadence-server-oci-entrypoint
    description: Entrypoint for using Cadence server in OCI containers
    dependencies:
      runtime:
        - bash
        - cadence
        - cadence-cassandra-tool
        - cadence-server
        - cadence-sql-tool
        - curl
        - dockerize
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/etc/cadence/config/dynamicconfig
          mkdir -p "${{targets.subpkgdir}}"/etc/cadence/config/credentials
          cp docker/config_template.yaml "${{targets.subpkgdir}}"/etc/cadence/config/
          cp -r config/dynamicconfig/* "${{targets.subpkgdir}}"/etc/cadence/config/dynamicconfig/
          cp -r config/credentials/* "${{targets.subpkgdir}}"/etc/cadence/config/credentials/
          cp docker/entrypoint.sh "${{targets.subpkgdir}}"/docker-entrypoint.sh
          cp docker/start-cadence.sh "${{targets.subpkgdir}}"/start-cadence.sh
          chmod +x "${{targets.subpkgdir}}"/docker-entrypoint.sh "${{targets.subpkgdir}}"/start-cadence.sh
    test:
      pipeline:
        - name: Verify OCI entrypoint files and structure
          runs: |
            set -euo pipefail

            # Verify entrypoint scripts exist and are executable
            stat /docker-entrypoint.sh
            stat /start-cadence.sh
            test -x /docker-entrypoint.sh
            test -x /start-cadence.sh

            # Verify config template exists
            stat /etc/cadence/config/config_template.yaml

            # Verify credentials directory and files
            stat /etc/cadence/config/credentials/client.crt
            stat /etc/cadence/config/credentials/client.key
            stat /etc/cadence/config/credentials/keytest
            stat /etc/cadence/config/credentials/keytest.crt
            stat /etc/cadence/config/credentials/keytest.pub

            # Verify dynamicconfig files
            stat /etc/cadence/config/dynamicconfig/development.yaml
            stat /etc/cadence/config/dynamicconfig/README.md

            # Verify scripts are valid shell scripts (basic syntax check)
            bash -n /docker-entrypoint.sh
            bash -n /start-cadence.sh

            # Check that config template contains expected sections
            grep -F "services:" /etc/cadence/config/config_template.yaml
            grep -F "persistence:" /etc/cadence/config/config_template.yaml

update:
  enabled: true
  github:
    identifier: cadence-workflow/cadence
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - cadence-cassandra-tool
        - cadence-server
        - cadence-server-schema
        - cadence-sql-tool
        - wait-for-it
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: cadence
    - name: Verify cadence CLI version and subcommands
      runs: |
        set -euo pipefail

        # Test version output
        cadence --version

        # Verify release version is reported
        cadence --version 2>&1 | grep -F "Release version"

        # Test subcommand help to ensure CLI is fully functional
        cadence domain --help
        cadence workflow --help
        cadence tasklist --help
        cadence admin --help
        cadence cluster --help

        # Test admin subcommand help
        cadence admin database --help
        cadence admin config --help

        # This command works without server - validates CLI is functional
        cadence admin config listall | grep -F "frontend.rps"
    - name: Database schema setup validation
      runs: |
        set -euo pipefail

        # This test validates the core customer workflow for database initialization
        # Customers run these schema tools before starting Cadence server

        mkdir -p /tmp/cadence-schema-test/data

        # Initialize main Cadence database with SQLite (production would use MySQL/PostgreSQL)
        cadence-sql-tool --plugin sqlite --db /tmp/cadence-schema-test/data/cadence.db setup-schema \
          --schema-file /etc/cadence/schema/sqlite/cadence/versioned/v0.1/base.sql \
          --disable-versioning --overwrite

        # Verify the database was created with expected tables
        stat /tmp/cadence-schema-test/data/cadence.db

        # Initialize visibility database (used for workflow search/listing)
        cadence-sql-tool --plugin sqlite --db /tmp/cadence-schema-test/data/visibility.db setup-schema \
          --schema-file /etc/cadence/schema/sqlite/visibility/versioned/v0.1/base.sql \
          --disable-versioning --overwrite

        # Verify visibility database was created
        stat /tmp/cadence-schema-test/data/visibility.db

        # Test update-schema help to verify migration tooling works
        cadence-sql-tool update-schema --help | grep -F "update sql schema"

        # Verify Cassandra tool can parse schema files (even without Cassandra)
        cadence-cassandra-tool setup-schema --help | grep -F "setup initial version"
    - name: Server integration and domain management test
      uses: test/daemon-check-output
      with:
        timeout: 180
        setup: |
          set -euo pipefail

          # Create directories for Cadence server
          mkdir -p /tmp/cadence/data /tmp/cadence/config /tmp/cadence/blobstore

          # Initialize main Cadence database with SQLite using versioned schema
          # This creates the schema_version table and applies v0.1 schema
          cadence-sql-tool --plugin sqlite --db /tmp/cadence/data/cadence.db setup-schema \
            --version 0.1 --schema-file /etc/cadence/schema/sqlite/cadence/versioned/v0.1/base.sql

          # Initialize visibility database with versioned schema
          cadence-sql-tool --plugin sqlite --db /tmp/cadence/data/visibility.db setup-schema \
            --version 0.1 --schema-file /etc/cadence/schema/sqlite/visibility/versioned/v0.1/base.sql

          # Create Cadence server configuration for v1.3.6
          tee /tmp/cadence/config/development.yaml << 'CONFIGEOF'
          log:
            stdout: true
            level: info

          ringpop:
            name: cadence
            bootstrapMode: hosts
            bootstrapHosts:
              - 127.0.0.1:7933
              - 127.0.0.1:7934
              - 127.0.0.1:7935
              - 127.0.0.1:7939
              - 127.0.0.1:7940
            maxJoinDuration: 30s

          persistence:
            numHistoryShards: 4
            defaultStore: default
            visibilityStore: visibility
            datastores:
              default:
                sql:
                  pluginName: sqlite
                  databaseName: /tmp/cadence/data/cadence.db
                  connectAddr: ""
                  connectProtocol: ""
              visibility:
                sql:
                  pluginName: sqlite
                  databaseName: /tmp/cadence/data/visibility.db
                  connectAddr: ""
                  connectProtocol: ""

          services:
            frontend:
              rpc:
                port: 7933
                grpcPort: 7833
                bindOnIP: "0.0.0.0"
            matching:
              rpc:
                port: 7935
                grpcPort: 7835
                bindOnIP: "0.0.0.0"
            history:
              rpc:
                port: 7934
                grpcPort: 7834
                bindOnIP: "0.0.0.0"
            worker:
              rpc:
                port: 7939
                bindOnIP: "0.0.0.0"
            shard-distributor:
              rpc:
                port: 7940
                bindOnIP: "0.0.0.0"

          clusterGroupMetadata:
            failoverVersionIncrement: 10
            primaryClusterName: test-cluster
            currentClusterName: test-cluster
            clusterGroup:
              test-cluster:
                enabled: true
                initialFailoverVersion: 1
                rpcName: cadence-frontend
                rpcAddress: "127.0.0.1:7933"

          dcRedirectionPolicy:
            policy: noop

          archival:
            history:
              status: disabled
            visibility:
              status: disabled

          domainDefaults:
            archival:
              history:
                status: disabled
              visibility:
                status: disabled

          blobstore:
            filestore:
              outputDirectory: /tmp/cadence/blobstore
          CONFIGEOF

          # Verify config file was created
          stat /tmp/cadence/config/development.yaml
        start: cadence-server --root /tmp/cadence --config config --env development start --services frontend,matching,history,worker
        expected_output: |
          frontend started
          matching started
          history started
        error_strings: |
          panic:
          FATAL
        post: |
          set -euo pipefail

          # Wait for frontend to be ready to accept connections
          wait-for-it -h 127.0.0.1 -p 7933 -t 60

          # Test 1: Register a new domain (namespace for workflows)
          # This is the first step any Cadence user performs
          # Domain name is specified via --domain global flag
          cadence --address 127.0.0.1:7933 --domain test-domain domain register \
            --description "Test domain for package validation"

          # Test 2: Describe the domain to verify it was created correctly
          cadence --address 127.0.0.1:7933 --domain test-domain domain describe

          # Test 3: List all domains - should show our test domain
          cadence --address 127.0.0.1:7933 domain list

          echo "All Cadence server integration tests passed successfully"
