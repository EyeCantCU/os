package:
  name: cadence
  version: "1.3.6"
  epoch: 0
  description: Cadence is a distributed, scalable, durable, and highly available orchestration engine
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cadence-workflow/cadence
      tag: v${{package.version}}
      expected-commit: bd3b3941f9444521734445dd08521c651b37f970

  - uses: go/bump
    with:
      deps: |-
        github.com/golang-jwt/jwt/v5@v5.2.2
        github.com/sirupsen/logrus@v1.9.1
        golang.org/x/crypto@v0.45.0
      # oauth2 is transitive (not in root go.mod)
      replaces: golang.org/x/oauth2=golang.org/x/oauth2@v0.27.0

  - uses: go/build
    with:
      packages: ./cmd/tools/cli
      output: cadence
      ldflags: |
        -X github.com/uber/cadence/common/metrics.ReleaseVersion=${{package.version}}

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for ${{package.name}}
    dependencies:
      runtime:
        - cadence
        - cadence-cassandra-tool
        - cadence-server
        - cadence-sql-tool
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/cadence "${{targets.subpkgdir}}"/usr/local/bin/cadence
          ln -s /usr/bin/cadence-cassandra-tool "${{targets.subpkgdir}}"/usr/local/bin/cadence-cassandra-tool
          ln -s /usr/bin/cadence-server "${{targets.subpkgdir}}"/usr/local/bin/cadence-server
          ln -s /usr/bin/cadence-sql-tool "${{targets.subpkgdir}}"/usr/local/bin/cadence-sql-tool
    test:
      environment:
        contents:
          packages:
            - cadence
            - cadence-cassandra-tool
            - cadence-server
            - cadence-sql-tool
        environment:
          PATH: /usr/local/bin:/usr/bin
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

  - name: ${{package.name}}-server
    description: Cadence server executes units of application logic, Workflows, in a resilient manner
    dependencies:
      runtime:
        - cadence-server-schema
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/server
          output: cadence-server
          ldflags: |
            -X github.com/uber/cadence/common/metrics.ReleaseVersion=${{package.version}}
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-cassandra-tool
    description: Cadence Cassandra database utility
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/tools/cassandra
          output: cadence-cassandra-tool
          ldflags: |
            -X github.com/uber/cadence/common/metrics.ReleaseVersion=${{package.version}}
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-sql-tool
    description: Cadence SQL database utility
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/tools/sql
          output: cadence-sql-tool
          ldflags: |
            -X github.com/uber/cadence/common/metrics.ReleaseVersion=${{package.version}}
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-server-schema
    description: Schema files for Cadence server database setup
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/etc/cadence
          cp -r schema "${{targets.subpkgdir}}"/etc/cadence/

  - name: ${{package.name}}-server-oci-entrypoint
    description: Entrypoint for using Cadence server in OCI containers
    dependencies:
      runtime:
        - bash
        - cadence
        - cadence-cassandra-tool
        - cadence-server
        - cadence-sql-tool
        - dockerize
    pipeline:
      - runs: |
          install -Dm644 docker/config_template.yaml "${{targets.subpkgdir}}"/etc/cadence/config/config_template.yaml
          mkdir -p "${{targets.subpkgdir}}"/etc/cadence/config/dynamicconfig "${{targets.subpkgdir}}"/etc/cadence/config/credentials
          cp -r config/dynamicconfig/* "${{targets.subpkgdir}}"/etc/cadence/config/dynamicconfig/
          cp -r config/credentials/* "${{targets.subpkgdir}}"/etc/cadence/config/credentials/
          install -Dm755 docker/entrypoint.sh "${{targets.subpkgdir}}"/docker-entrypoint.sh
          install -Dm755 docker/start-cadence.sh "${{targets.subpkgdir}}"/start-cadence.sh

update:
  enabled: true
  github:
    identifier: cadence-workflow/cadence
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - cadence-cassandra-tool
        - cadence-server
        - cadence-server-schema
        - cadence-sql-tool
        - wait-for-it
    environment:
      CADENCE_ADDRESS: "127.0.0.1:7933"
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: cadence
    - name: Verify cadence CLI config list (no server required)
      runs: |
        cadence admin config listall | grep -F "frontend.rps"
    - name: Server integration and domain management test
      uses: test/daemon-check-output
      with:
        timeout: 30
        setup: |
          mkdir -p /tmp/cadence/data /tmp/cadence/config
          cadence-sql-tool --plugin sqlite --db /tmp/cadence/data/cadence.db setup-schema \
            --version 0.1 --schema-file /etc/cadence/schema/sqlite/cadence/versioned/v0.1/base.sql
          cadence-sql-tool --plugin sqlite --db /tmp/cadence/data/visibility.db setup-schema \
            --version 0.1 --schema-file /etc/cadence/schema/sqlite/visibility/versioned/v0.1/base.sql
          tee /tmp/cadence/config/development.yaml << 'CONFIGEOF'
          log:
            stdout: true
            level: info

          ringpop:
            name: cadence
            bootstrapMode: hosts
            bootstrapHosts:
              - 127.0.0.1:7933
              - 127.0.0.1:7934
              - 127.0.0.1:7935
              - 127.0.0.1:7939
            maxJoinDuration: 30s

          persistence:
            numHistoryShards: 4
            defaultStore: default
            visibilityStore: visibility
            datastores:
              default:
                sql:
                  pluginName: sqlite
                  databaseName: /tmp/cadence/data/cadence.db
                  connectAddr: ""
                  connectProtocol: ""
              visibility:
                sql:
                  pluginName: sqlite
                  databaseName: /tmp/cadence/data/visibility.db
                  connectAddr: ""
                  connectProtocol: ""

          services:
            frontend:
              rpc:
                port: 7933
                grpcPort: 7833
                bindOnLocalHost: true
            matching:
              rpc:
                port: 7935
                grpcPort: 7835
                bindOnLocalHost: true
            history:
              rpc:
                port: 7934
                grpcPort: 7834
                bindOnLocalHost: true
            worker:
              rpc:
                port: 7939
                bindOnLocalHost: true

          clusterGroupMetadata:
            failoverVersionIncrement: 10
            primaryClusterName: test-cluster
            currentClusterName: test-cluster
            clusterGroup:
              test-cluster:
                enabled: true
                initialFailoverVersion: 1
                rpcName: cadence-frontend
                rpcAddress: "127.0.0.1:7933"

          dcRedirectionPolicy:
            policy: noop

          archival:
            history:
              status: disabled
            visibility:
              status: disabled

          domainDefaults:
            archival:
              history:
                status: disabled
              visibility:
                status: disabled
          CONFIGEOF
          stat /tmp/cadence/config/development.yaml
        start: cadence-server --root /tmp/cadence --config config --env development start --services frontend,matching,history,worker
        expected_output: |
          frontend started
          matching started
          history started
        post: |
          wait-for-it -h 127.0.0.1 -p 7933 -t 60
          cadence --address "${CADENCE_ADDRESS}" --domain test-domain domain register \
            --description "Test domain for package validation"
          cadence --address "${CADENCE_ADDRESS}" --domain test-domain domain describe
          # Allow domain cache to propagate to matching/history before workflow calls
          sleep 5
          cadence --address "${CADENCE_ADDRESS}" --domain test-domain workflow start \
            --workflow_id test-wf-1 --tasklist test-tl --workflow_type test-wt --execution_timeout 60 --input '{}'
          cadence --address "${CADENCE_ADDRESS}" --domain test-domain workflow describe --wid test-wf-1 | grep -F "test-wf-1"
          cadence --address "${CADENCE_ADDRESS}" --domain test-domain workflow cancel --wid test-wf-1
