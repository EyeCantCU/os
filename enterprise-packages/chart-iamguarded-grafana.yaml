package:
  name: chart-iamguarded-grafana
  version: "12.1.8"
  epoch: 0
  description: grafana iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: grafana/${{package.version}}
      expected-commit: 6ff70c6fb0d64e9a35675c248e2aeb72ba4fe5f8

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/grafana

  - uses: charts/package
    with:
      chart-path: iamguarded/grafana

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: grafana/
    use-tag: true
    tag-filter-prefix: grafana/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /grafana
