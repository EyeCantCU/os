package:
  name: authservice-fips
  version: "1.1.5"
  epoch: 3 # CVE-2025-61732
  description: Move OIDC token acquisition out of your app code and into the Istio mesh
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 36bece28d991a0f87010246505a59df4302ff4ad
      repository: https://github.com/istio-ecosystem/authservice
      tag: v${{package.version}}

  - uses: go/build
    with:
      packages: ./cmd
      output: authservice
      go-package: go-fips

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/local/bin"
          ln -s /usr/bin/authservice "${{targets.contextdir}}/usr/local/bin/authservice"
    # test added by a robot (compat)
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            set -euo pipefail
            # Verify symlink exists and points to correct target
            readlink -v /usr/local/bin/authservice
            # Verify symlink target exists (fails if missing)
            stat /usr/local/bin/authservice
            # Verify symlink target is executable (fails if not)
            test -x /usr/local/bin/authservice || { echo "FAIL: symlink target not executable"; exit 1; }

update:
  enabled: true
  github:
    identifier: istio-ecosystem/authservice
    strip-prefix: v

test:
  pipeline:
    # FIPS check must be first for Go FIPS packages
    - uses: test/go-fips-check
