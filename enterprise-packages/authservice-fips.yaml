package:
  name: authservice-fips
  version: "1.1.2"
  epoch: 0
  description: Move OIDC token acquisition out of your app code and into the Istio mesh
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 282c4c557e3ddc64833368e6f7d135636a15cc28
      repository: https://github.com/istio-ecosystem/authservice
      tag: v${{package.version}}

  - uses: go/build
    with:
      packages: ./cmd
      output: authservice
      go-package: go-fips

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/local/bin"
          ln -s /usr/bin/authservice "${{targets.contextdir}}/usr/local/bin/authservice"
    # test added by a robot (compat)
    test:
      pipeline:
        - runs: |
            readlink -v /usr/local/bin/authservice

update:
  enabled: true
  github:
    identifier: istio-ecosystem/authservice
    strip-prefix: v

test:
  pipeline:
    - runs: |
        authservice -v
    - uses: test/go-fips-check
