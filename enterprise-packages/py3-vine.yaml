# Please note the last release of this package was 2 years ago, and seems to be complete and has no CVEs
# this package is needed as runtime dep for celery
package:
  name: py3-vine
  version: "5.1.0"
  epoch: 0
  description: Python promises
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: vine
  import: vine

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-python-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/celery/vine
      tag: v${{package.version}}
      expected-commit: 8c08b391a9f8976153a3a1972c66296e01f60c66

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            from vine import promise

            # Test basic promise creation and execution
            def get_five():
                return 5

            # Create a promise and execute it
            p = promise(get_five)
            result = p()
            assert result == 5, f"Expected 5, got {result}"

            # Test that promise object has expected methods
            assert hasattr(p, 'then'), "Promise missing 'then' method"
            assert callable(p), "Promise is not callable"
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: celery/vine
    strip-prefix: v
