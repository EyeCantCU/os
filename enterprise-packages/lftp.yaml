package:
  name: lftp
  version: "4.9.3"
  epoch: 1
  description: Command-line file transfer client supporting FTP, HTTP, SFTP, FISH, and BitTorrent
  copyright:
    - license: GPL-3.0-or-later

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - coreutils
      - expat-dev
      - gettext-dev
      - gnutls-dev
      - gperf
      - libidn2-dev
      - libtool
      - pkgconf-dev
      - readline-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/lavv17/lftp
      tag: v${{package.version}}
      expected-commit: e2a009cc0254fba780be5de0a0e511398f4acbc7

  # Clone gnulib to $HOME/gnulib - autogen.sh checks this location
  # Use commit from September 2020 (around lftp 4.9.3 release time)
  - runs: |
      git clone --depth=1 https://github.com/coreutils/gnulib.git "$HOME/gnulib"
      cd "$HOME/gnulib"
      git fetch --depth=1 origin 6160ee8e4d2b88d934c3c4c8c5930a75b835723f
      git checkout 6160ee8e4d2b88d934c3c4c8c5930a75b835723f

  - runs: ./autogen.sh

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: Development files for lftp
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: Documentation for lftp
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: lavv17/lftp
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: lftp
        version: ${{package.version}}
    - uses: test/tw/help-check
      with:
        bins: lftp
    - name: Test compiled features
      runs: |
        set -euo pipefail
        # Check TLS support (GnuTLS)
        lftp --version | grep -Fi "GnuTLS"
        # Check IDN support
        lftp --version | grep -Fi "IDN2"
    - name: Test lftp commands
      runs: |
        set -euo pipefail
        # Test internal commands
        lftp -c "set"
        lftp -c "alias"
        lftp -c "bookmark list"
        lftp -c "cache status"
        lftp -c "jobs"
        # Test local operations
        lftp -c "lcd /tmp; lpwd"
    - uses: test/tw/contains-files
      with:
        files: |
          /usr/bin/lftp
          /usr/bin/lftpget
          /etc/lftp.conf
