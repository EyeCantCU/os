package:
  name: perl-test-warn
  version: "0.37"
  epoch: 0
  description: Perl extension to test methods for warnings
  copyright:
    - license: GPL-1.0-or-later OR Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl
      - perl-sub-uplevel

environment:
  contents:
    packages:
      - perl-dev
      - perl-sub-uplevel

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/B/BI/BIGJ/Test-Warn-${{package.version}}.tar.gz
      expected-sha256: 98ca32e7f2f5ea89b8bfb9a0609977f3d153e242e2e51705126cb954f1a06b57

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: Documentation for ${{package.name}}
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  release-monitor:
    identifier: 3425

test:
  pipeline:
    - name: Smoke test
      runs: |
        set -euo pipefail
        perl -e 'use Test::Warn; print "Test::Warn loaded successfully\n"'
