package:
  name: chart-open-policy-agent-gatekeeper
  version: "3.21.1"
  epoch: 0
  description: A Helm chart for Gatekeeper
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-policy-agent/gatekeeper
      tag: v${{package.version}}
      expected-commit: ee60035fa8e7283d1f99c7de78f6bf7113cb6f81

  - uses: charts/package
    with:
      chart-path: manifest_staging/charts/gatekeeper
      images: |
        gatekeeper:
          values:
            image:
              repository: ${registry_repo}
              release: ${pseudo_tag}
        gatekeeper-crds:
          values:
            image:
              crdRepository: ${registry_repo}
        preinstall-crds:
          values:
            preInstall:
              crdRepository:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        postupgrade-label-namespace:
          values:
            postUpgrade:
              labelNamespace:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        postinstall-label-namespace:
          values:
            postInstall:
              labelNamespace:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        postinstall-probe-webhook:
          values:
            postInstall:
              probeWebhook:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        preuninstall-delete-webhook-configs:
          values:
            preUninstall:
              deleteWebhookConfigurations:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        export-sidecar:
          values:
            audit:
              exportSidecar:
                image: ${ref}
      test: |
        values:
          imagePullSecrets:
            - name: my-pull-secret
        cases:
          - name: default
            images: [gatekeeper, preinstall-crds, postinstall-label-namespace, postinstall-probe-webhook]
          - name: with-postupgrade
            images: [gatekeeper, preinstall-crds, postinstall-label-namespace, postinstall-probe-webhook, postupgrade-label-namespace]
            values:
              postUpgrade:
                labelNamespace:
                  enabled: true
          - name: with-preuninstall
            images: [gatekeeper, preinstall-crds, postinstall-label-namespace, postinstall-probe-webhook, preuninstall-delete-webhook-configs]
            values:
              preUninstall:
                deleteWebhookConfigurations:
                  enabled: true
          - name: with-export-sidecar
            images: [gatekeeper, preinstall-crds, postinstall-label-namespace, postinstall-probe-webhook, export-sidecar]
            values:
              enableViolationExport: true
              exportBackend: disk

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: open-policy-agent/gatekeeper
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
