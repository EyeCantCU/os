name: automated-pr-approve

on:
  workflow_dispatch:
  schedule:
    - cron: '12,32,52 * * * *'

permissions:
  contents: read

jobs:
  review-pr:
    runs-on: ubuntu-latest
    if: github.repository == 'chainguard-dev/enterprise-packages'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit
      - name: Check out repository code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check GitHub quota
        continue-on-error: true
        id: quota
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          QUOTA=$(gh api rate_limit --jq '.resources.search.remaining')
          if [ "$QUOTA" -lt 5 ]; then
              echo "Rate limit too low ($QUOTA). Exiting."
              exit 1
          fi
      - name: Slack notification (quota)
        if: steps.quota.outcome == 'failure'
        uses: step-security/action-slack-notify@e04c77a65bae8b6c0373478a1cb8fd7e012637e6 # v2.3.5
        env:
          SLACK_ICON: http://github.com/github.png?size=48
          SLACK_USERNAME: GitHub Actions
          SLACK_WEBHOOK: ${{ secrets.SLACK_ENG_SUS_ALERTS_WEBHOOK }}
          SLACK_CHANNEL: 'eng-sustaining-alerts'
          SLACK_COLOR: '#8E1600'
          MSG_MINIMAL: 'true'
          SLACK_TITLE: '${{ github.workflow }} stopped due to low GitHub API quota'
          SLACK_MESSAGE: |
            For detailed logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: Auto-approve PRs
        id: approve
        if: steps.quota.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/auto-approve-pr.sh ${{ github.repository }}
      - name: Slack notification (failure)
        if: steps.approve.outcome == 'failure'
        uses: step-security/action-slack-notify@e04c77a65bae8b6c0373478a1cb8fd7e012637e6 # v2.3.5
        env:
          SLACK_ICON: http://github.com/github.png?size=48
          SLACK_USERNAME: GitHub Actions
          SLACK_WEBHOOK: ${{ secrets.SLACK_ENG_SUS_ALERTS_WEBHOOK }}
          SLACK_CHANNEL: 'eng-sustaining-alerts'
          SLACK_COLOR: '#8E1600'
          MSG_MINIMAL: 'true'
          SLACK_TITLE: '${{ github.workflow }} failed'
          SLACK_MESSAGE: |
            For detailed logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
