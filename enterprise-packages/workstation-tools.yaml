package:
  name: workstation-tools
  version: 0.0.5
  epoch: 0
  description: "helper tools for workstations"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - chainctl

pipeline:
  - runs: |
      install -Dm755 ./with-auth "${{targets.destdir}}"/usr/bin/with-auth
      install -Dm755 ./apk-repo "${{targets.destdir}}"/usr/bin/apk-repo
      install -Dm755 ./gitsign "${{targets.destdir}}"/usr/local/bin/gitsign

subpackages:
  - name: "workstation-v2-home-mounter"
    description: "small helper to mount /home in Chainguard workstations V2"
    dependencies:
      runtime:
        - xfsprogs-core
        - mount
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/bin/
          mkdir -p "${{targets.contextdir}}"/usr/lib/systemd/system/
          install -Dm755 ./workstation-v2-home-mounter "${{targets.contextdir}}"/usr/bin/workstation-v2-home-mounter
          install -Dm644 ./workstation-v2-home-mounter.service "${{targets.contextdir}}"/usr/lib/systemd/system/workstation-v2-home-mounter.service
    test:
      pipeline:
        - runs: |
            ls /usr/bin/workstation-v2-home-mounter
            ls /usr/lib/systemd/system/workstation-v2-home-mounter.service

  - name: "workstation-chainctl-refresh-service"
    description: "systemd user service for refreshing chainctl auth tokens"
    dependencies:
      runtime:
        - chainctl
    pipeline:
      - runs: |
          # For now, user has to enable this explicitly with:
          #   systemctl --user enable chainctl-auth-refresh.service
          install -Dm644 chainctl-auth-refresh.service "${{targets.contextdir}}"/usr/lib/systemd/user/chainctl-auth-refresh.service

          # This attempt at using via user-preset did not work.
          # echo "enable chainctl-auth-refresh.service" |
          #    install -Dm644 /dev/stdin "${{targets.contextdir}}"/usr/lib/systemd/user-preset/80-chainctl-auth-refresh.service
          # Another option would be to make the symlink
          #    ln -s /usr/lib/systemd/user/chainctl-auth-refresh.service \
          #        /etc/systemd/user/default.target.wants/
    test:
      pipeline:
        - runs: |
            ls /usr/lib/systemd/user/chainctl-auth-refresh.service

test:
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: with-auth
    - runs: |
        [ -x /usr/local/bin/gitsign ]

update:
  enabled: false
  exclude-reason: This package does not receive updates from anywhere and has no upstream source.
