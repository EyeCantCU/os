package:
  name: prometheus-3.6
  version: "3.6.0"
  epoch: 5 # GHSA-j5w8-q4qc-rx2x
  description: The Prometheus monitoring system and time series database.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - prometheus=${{package.full-version}}
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - bash
      - busybox
      - ca-certificates-bundle
      - go
      - nodejs
      - npm

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 491734606591ef8c188f5489c70380805bc868c0
      repository: https://github.com/prometheus/prometheus
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/tools

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: documentation/examples/remote_storage

  - uses: go/bump
    with:
      deps: |-
        github.com/docker/docker@v28.3.3
        github.com/go-viper/mapstructure/v2@v2.4.0
        golang.org/x/crypto@v0.45.0

  - uses: patch
    with:
      patches: disable-pprof.patch

  - runs: |
      GOLDFLAGS="-X github.com/prometheus/common/version.Version=${{package.version}}
        -X github.com/prometheus/common/version.Revision=WolfiLinux
        -X github.com/prometheus/common/version.Branch=master
        -X github.com/prometheus/common/version.BuildUser=$USER@$(hostname)
        -X github.com/prometheus/common/version.BuildDate=$(date -u "+%Y%m%d-%H:%M:%S" ${SOURCE_DATE_EPOCH:+-d @$SOURCE_DATE_EPOCH})
      "
      if [ -n "$LDFLAGS" ]; then
        # LDFLAGS (and only LDFLAGS) should be passed to -extldflags.
        GOLDFLAGS="$GOLDFLAGS -extldflags '$LDFLAGS'"
      fi

      # set -j1 to run things in the correct order in makefile
      # actual go building is still parallel
      make -j1 assets-compress

      go build \
        -trimpath \
        -mod=readonly \
        -ldflags "$GOLDFLAGS" \
        -tags netgo,builtinassets \
        ./cmd/prometheus
      go build \
        -trimpath \
        -mod=readonly \
        -ldflags "$GOLDFLAGS" \
        ./cmd/promtool

  - runs: |
      install -Dm755 prometheus "${{targets.destdir}}"/usr/bin/prometheus
      install -Dm755 promtool "${{targets.destdir}}"/usr/bin/promtool

      install -Dm644 prometheus.confd \
        "${{targets.destdir}}"/etc/conf.d/prometheus

      install -dm644 "${{targets.destdir}}"/var/lib/prometheus/data

      install -Dm644 -t "${{targets.destdir}}"/etc/prometheus \
        documentation/examples/prometheus.yml

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    dependencies:
      runtime:
        - ${{package.name}}
      provides:
        - prometheus-iamguarded-compat=${{package.full-version}}
    description: "compat package for iamguarded"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: prometheus
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /opt/iamguarded/prometheus/bin/
          mkdir -p /opt/iamguarded/prometheus/conf
          mkdir -p /opt/iamguarded/prometheus/data

          chmod g+rwX /opt/iamguarded

          ln -sf /usr/bin/prometheus /opt/iamguarded/prometheus/bin/prometheus
          ln -sf /usr/bin/promtool /opt/iamguarded/prometheus/bin/promtool
          cp -r ${{targets.destdir}}/etc/prometheus/* /opt/iamguarded/prometheus/conf/
          cp -r ${{targets.destdir}}/var/lib/prometheus/data /opt/iamguarded/prometheus/data
      - uses: iamguarded/finalize-compat
        with:
          package: prometheus
          version: ${{vars.major-version}}
    test:
      pipeline:
        - runs: |
            stat /opt/iamguarded/prometheus/bin/prometheus
            stat /opt/iamguarded/prometheus/bin/promtool
            /opt/iamguarded/prometheus/bin/prometheus --version
            /opt/iamguarded/prometheus/bin/promtool --version
        - uses: iamguarded/test-compat
          with:
            package: prometheus
            version: ${{vars.major-version}}

update:
  ignore-regex-patterns:
    - '\+stringlabels' # looks like stringlabels are still experimental, let's stick to the main version stream.
  enabled: true
  github:
    identifier: prometheus/prometheus
    strip-prefix: v
    tag-filter-prefix: v3.6

test:
  environment:
    contents:
      packages:
        - curl
        - jq
  pipeline:
    - name: Check Prometheus Recording Rules
      runs: |
        cat << 'EOF' > rules.example
        groups:
        - name: http
          rules:
          - record: job:http_inprogress_requests:sum
            expr: sum(http_inprogress_requests) by (job)
        EOF
        promtool check rules rules.example
        prometheus --version
        prometheus --help
        promtool --version
        promtool --help
    - name: Check Prometheus Alert Rules
      runs: |
        # Test alert rule validation in addition to recording rules
        cat << 'EOF' > alert_rules.yml
        groups:
        - name: example-alerts
          rules:
          - alert: HighErrorRate
            expr: job:request_errors:rate5m > 0.5
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "High error rate detected"
              description: "Error rate is above 50% for 10 minutes"
          - alert: InstanceDown
            expr: up == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Instance is down"
        EOF
        promtool check rules alert_rules.yml
    - name: Verify Prometheus Server and Complete Monitoring Pipeline
      runs: |
        cat << 'EOF' > prometheus.yml
        global:
          scrape_interval: 5s

        scrape_configs:
          - job_name: "prometheus"
            static_configs:
            - targets: ["localhost:9090"]
        EOF
        prometheus --config.file=./prometheus.yml --web.listen-address=127.0.0.1:9090 > /dev/null 2>&1 &
        PROMETHEUS_PID=$!
        sleep 5

        # Test health endpoint
        curl -s "http://127.0.0.1:9090/-/healthy" | grep -q "Prometheus Server is Healthy."
        echo "Health check passed"

        # Wait a bit longer for initial scrapes to complete
        sleep 10

        # Test complete monitoring pipeline: scraping → storage → query
        # Query the 'up' metric to verify Prometheus is scraping itself
        UP_RESPONSE=$(curl -s "http://127.0.0.1:9090/api/v1/query?query=up")
        echo "Query response: $UP_RESPONSE"

        # Verify the query returned successful status
        echo "$UP_RESPONSE" | jq -e '.status == "success"'
        echo "Query status is success"

        # Verify we got actual metric data from the self-scrape
        UP_VALUE=$(echo "$UP_RESPONSE" | jq -r '.data.result[0].value[1]')
        if [ "$UP_VALUE" = "1" ]; then
          echo "Self-scrape verified: up metric = 1 (target is up)"
        else
          echo "ERROR: Expected up=1 but got up=$UP_VALUE"
          exit 1
        fi

        # Verify the scraped target is prometheus itself
        JOB_NAME=$(echo "$UP_RESPONSE" | jq -r '.data.result[0].metric.job')
        if [ "$JOB_NAME" = "prometheus" ]; then
          echo "Job name verified: $JOB_NAME"
        else
          echo "ERROR: Expected job=prometheus but got job=$JOB_NAME"
          exit 1
        fi

        echo "Complete monitoring pipeline (scraping → storage → query) verified successfully"

        # Clean shutdown
        kill $PROMETHEUS_PID 2>/dev/null || true
