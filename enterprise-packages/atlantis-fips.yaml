package:
  name: atlantis-fips
  version: "0.35.1"
  epoch: 3 # GHSA-jc7w-c686-c4v9
  description: Terraform Pull Request Automation
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - terraform-fips

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
      - libcap-utils
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/runatlantis/atlantis
      tag: v${{package.version}}
      expected-commit: e987e335defc15b290dec0877ec672316b9a6957

  - uses: go/bump
    with:
      deps: |-
        github.com/go-viper/mapstructure/v2@v2.4.0
        github.com/ulikunitz/xz@v0.5.14

  - name: Downgrade Go to 1.23 for FIPS
    runs: |
      # we are using go 1.23 because go-fips-1.24 is not available yet
      sed -i 's/go 1\.24\(\.[0-9]*\)\?/go 1.23/' go.mod
      go mod tidy

  - uses: go/build
    with:
      modroot: .
      packages: .
      output: atlantis
      ldflags: -w -X main.version=${{package.version}} -X main.commit=$(git rev-parse HEAD) -X main.date=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")
      go-package: go-fips-md5

  - uses: strip

  # This must come after strip!
  - runs: |
      setcap "cap_net_bind_service=+ep" "${{targets.destdir}}"/usr/bin/atlantis

update:
  enabled: true
  github:
    identifier: runatlantis/atlantis
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        atlantis version
        atlantis --help
