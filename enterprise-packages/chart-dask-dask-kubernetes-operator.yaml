package:
  name: chart-dask-dask-kubernetes-operator
  version: "2025.7.0"
  epoch: 0
  description: A helm chart for managing the deployment of the dask kubernetes operator and CRDs
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dask/dask-kubernetes
      tag: ${{package.version}}
      expected-commit: 1daa175f33554549a65530a26300f46368083e7e

  # chartpress stamps Chart.yaml version and values.yaml image tag at release time.
  # Replicate that here.
  - runs: |
      cd dask_kubernetes/operator/deployment/helm/dask-kubernetes-operator
      yq -i '.version = "${{package.version}}"' Chart.yaml
      yq -i '.image.tag = "${{package.version}}"' values.yaml

  - uses: charts/package
    with:
      chart-path: dask_kubernetes/operator/deployment/helm/dask-kubernetes-operator
      images: |
        dask-kubernetes-operator:
          values:
            image:
              name: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [dask-kubernetes-operator]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: dask/dask-kubernetes
    use-tag: true
    tag-filter-prefix: "2"
