package:
  name: boring-registry-fips
  version: "0.16.6"
  epoch: 8 # GHSA-9h8m-3fm2-qjrq
  description: Terraform Provider and Module Registry
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - ca-certificates-bundle
  resources:
    cpu: "6"
    memory: 7Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 5bfab3e442b8d1a2e2333a8df6dca1188165ea82
      repository: https://github.com/TierMobility/boring-registry
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        github.com/cloudflare/circl@v1.6.3
        go.opentelemetry.io/otel/sdk@v1.40.0

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: |
        -X github.com/TierMobility/boring-registry/version.Version="${{package.version}}"
        -X github.com/TierMobility/boring-registry/version.Commit="$(git rev-parse --verify HEAD --short)"
        -X github.com/TierMobility/boring-registry/version.Date="$(date -d@${SOURCE_DATE_EPOCH} -u +'%FT%T%z')"
      output: boring-registry
      packages: .

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        boring-registry version
        boring-registry --help

update:
  enabled: true
  manual: false
  github:
    identifier: TierMobility/boring-registry
    strip-prefix: v
