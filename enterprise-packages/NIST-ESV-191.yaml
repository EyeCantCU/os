#nolint:valid-pipeline-fetch-digest
package:
  # body-type-number
  name: NIST-ESV-191
  # v1 of nist meta-packages
  version: 1
  epoch: 2
  # Many SCA tools know how to read APK URL
  # URL to the certificate
  url: https://csrc.nist.gov/projects/cryptographic-module-validation-program/entropy-validations/certificate/191
  # Some tools use description
  # body, type, number, certificate name, standard
  description: "NIST ESV 191 Chainguard CPU Time Jitter RNG Entropy Source (SP 800-90B) metapackage"
  copyright:
    # NIST information is all public
    - license: NIST-PD
  dependencies:
    runtime:
      - libcrypto3>=3.4.0-r2

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      # Note this URL will make it into package SPDX SBOM, and will also make it into APKO SBOM
      uri: https://csrc.nist.gov/projects/cryptographic-module-validation-program/entropy-validations/certificate/191
      # Unstable content, thus no expected checksum and hence the nolint too
      expected-none: true
      extract: false
      delete: true

test:
  pipeline:
    - uses: test/tw/metapackage

update:
  enabled: false
  exclude-reason: "This is an empty NIST certificate SBOM indicator"
