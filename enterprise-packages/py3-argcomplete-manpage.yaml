package:
  name: py3-argcomplete-manpage
  version: 4.7
  epoch: 0
  description: Enumerate network interfaces/adapters and their IP addresses
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: argcomplete-manpage
  import: build_manpages

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/praiskup/argparse-manpage.git
      tag: v${{package.version}}
      expected-commit: 7883becca340aa3ea124143e032848a7b2bdf84b

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-tomli
        - py${{range.key}}-setuptools
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: move usr/bin executables for -bin
        runs: |
          mkdir -p ./cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./cleanup/${{range.key}}/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - man-db
      pipeline:
        - name: Smoke tests
          runs: |
            set -o pipefail
            argparse-manpage --help | grep -F -e "usage: argparse-manpage [-h] (--module MODULE | --pyfile PYFILE)"
        - name: Functionality test
          runs: |
            SAMPLE_PYTHONFILE="$(mktemp)"
            tee "${SAMPLE_PYTHONFILE}" <<EOF
            import argparse
            def get_parser():
                _parser: argparse.ArgumentParser = argparse.ArgumentParser(description="Testing for Argparse Manpage", prog="Example program")

                _parser.add_argument('example-arg',
                                     type=str,
                                     help="String argument")

                return _parser
            EOF
            TEST_MANPAGE="$(mktemp)"
            argparse-manpage \
              --pyfile "${SAMPLE_PYTHONFILE}" \
              --function get_parser \
              --author "Linky \
              --author-email linky@chainguard.dev" \
              --project-name myproject \
              --url "https://github.com/myproject" | tee "${TEST_MANPAGE}"

            # Check if manpage is renderable by man, same as what test/docs is doing
            man -l "${TEST_MANPAGE}">/dev/null

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
