package:
  name: consul-k8s-fips-1.9
  version: "1.9.2"
  epoch: 0 # GHSA-j5w8-q4qc-rx2x
  description: The consul-k8s includes first-class integrations between Consul and Kubernetes.
  copyright:
    - license: MPL-2.0
  dependencies:
    runtime:
      - go-discover-fips
    provides:
      - consul-k8s-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - oldglibc~2.28

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/consul-k8s
      expected-commit: 8f9b00db60c49cb9291dfebb9523f36e9d3bcc66
      tag: v${{package.version}}

  - uses: go/build
    with:
      go-package: go-fips
      modroot: ./control-plane/cni
      output: consul-cni
      packages: .

  - uses: go/build
    with:
      go-package: go-fips
      modroot: ./control-plane
      output: consul-k8s-control-plane
      packages: .

subpackages:
  - name: ${{package.name}}-cli
    description: "CLI for interacting with Consul on Kubernetes"
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          modroot: ./cli
          output: consul-k8s
          packages: .
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: ${{subpkg.name}}
        - name: Verify help
          runs: |
            consul-k8s --help

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.9.

test:
  pipeline:
    - name: Verify help
      runs: |
        consul-cni --help
        consul-k8s-control-plane --help
        consul-cni --version
        consul-k8s-control-plane --version
    - uses: test/go-fips-check
