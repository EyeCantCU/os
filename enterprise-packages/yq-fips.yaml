package:
  name: yq-fips
  version: "4.52.4"
  epoch: 1
  description: "yq is a portable command-line YAML, JSON, XML, CSV and properties processor"
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mikefarah/yq
      tag: v${{package.version}}
      expected-commit: 5a7e72a743649b1b3a47d1a1d8214f3453173c51

  - uses: go/build
    with:
      packages: .
      output: yq
      go-package: go-fips

  - uses: strip

test:
  pipeline:
    - runs: |
        yq --version | grep "version v${{package.version}}"
        yq --help
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: mikefarah/yq
    strip-prefix: v

environment:
  contents:
    packages:
      - go-fips-1.25
