package:
  name: openbao-fips
  version: "2.5.0"
  epoch: 2 # CVE-2025-61732
  description: OpenBao exists to provide a software solution to manage, store, and distribute sensitive data including secrets, certificates, and keys.
  copyright:
    - license: MPL-2.0
  resources:
    cpu: 32
    memory: 64Gi

vars:
  # Node 25 removed util.isRegExp which clean-css needs for ember build
  nodejs-version: 22

environment:
  environment:
    # Fixes: error:0308010C:digital envelope routines::unsupported
    # --max-old-space-size increases Node.js heap for Ember build
    NODE_OPTIONS: "--max-old-space-size=32768 --openssl-legacy-provider"
  contents:
    packages:
      - busybox
      - nodejs-${{vars.nodejs-version}}
      - nofips-node
      - npm
      - openssl-provider-legacy
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openbao/openbao
      tag: v${{package.version}}
      expected-commit: bcbb6036ec2b747bceb98c7706ce9b974faa1b23

  - runs: |
      # JOBS=1 limits Ember build parallelism to avoid memory issues
      # See: https://github.com/ember-cli/ember-cli/blob/master/docs/build-concurrency.md
      export JOBS=1
      make ember-dist

  - uses: go/build
    with:
      tags: openbao,ui
      go-package: go-fips-md5
      packages: .
      output: bao
      ldflags: |
        -X github.com/openbao/openbao/version.fullVersion=${{package.version}}
        -X github.com/openbao/openbao/version.GitCommit='$(git rev-parse HEAD)'
        -X github.com/openbao/openbao/version.BuildDate='$(date -u +"%Y-%m-%dT%H:%M:%SZ")'

update:
  enabled: true
  github:
    identifier: openbao/openbao
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
    environment:
      BAO_ADDR: 'http://127.0.0.1:8200'
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: bao
    - name: "test: bao dev server and UI"
      runs: |
        set -euo pipefail
        # Start bao dev server
        bao server -dev > /dev/null 2>&1 &
        export BAO_SERVER=$!
        wait-for-it 127.0.0.1:8200 -t 30 || (kill $BAO_SERVER; exit 1)

        # Test basic functionality
        bao status
        bao kv put -mount=secret foo user="admin" password="s3cr3t"
        bao secrets enable database > /dev/null 2>&1 &
        bao token create
        bao secrets tune database
        bao monitor > /dev/null 2>&1 &
        export BAO_MONITOR=$!
        kill -9 $BAO_MONITOR
        bao print token
        bao debug
        bao auth enable userpass
        bao auth list

        # Test UI is accessible and contains expected content
        curl -sf http://127.0.0.1:8200/ui/ | grep -F "OpenBao" || (echo "ERROR: UI test failed"; kill -9 $BAO_SERVER; exit 1)

        echo "UI smoke test passed"
        kill -9 $BAO_SERVER
