package:
  name: chart-fluent-fluent-bit
  version: "0.55.0"
  epoch: 0
  description: Fast and lightweight log processor and forwarder for Linux, OSX and BSD family operating systems.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fluent/helm-charts
      tag: fluent-bit-${{package.version}}
      expected-commit: a359bcb5bcc16126b528a10afef8bd26eebd19a8

  - uses: charts/package
    with:
      chart-path: charts/fluent-bit
      images: |
        fluent-bit:
          values:
            image:
              repository: ${registry_repo}
              tag: ${tag}
              digest: ${digest}
        test-framework:
          values:
            testFramework:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
        configmap-reload:
          values:
            hotReload:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
      test: |
        cases:
          - name: default
            images: [fluent-bit]
          - name: with-hot-reload
            images: [fluent-bit, configmap-reload]
            values:
              hotReload:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: fluent/helm-charts
    strip-prefix: fluent-bit-
    use-tag: true
    tag-filter-prefix: fluent-bit-
