package:
  name: chart-kubernetes-sigs-descheduler
  version: "0.35.0"
  epoch: 0
  description: Descheduler for Kubernetes is used to rebalance clusters by evicting pods that can potentially be scheduled on better nodes.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/descheduler
      tag: descheduler-helm-chart-${{package.version}}
      expected-commit: bec9cd38d01eab2d35f1d76b1b9845649e11bffa

  - uses: charts/package
    with:
      chart-path: charts/descheduler
      images: |
        descheduler:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [descheduler]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/descheduler
    strip-prefix: descheduler-helm-chart-
    use-tag: true
    tag-filter-prefix: descheduler-helm-chart-
