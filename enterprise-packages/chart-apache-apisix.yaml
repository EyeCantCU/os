package:
  name: chart-apache-apisix
  version: "2.13.0"
  epoch: 0
  description: A Helm chart for Apache APISIX v3
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - helm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/apisix-helm-chart
      tag: apisix-${{package.version}}
      expected-commit: 9d5ad2a28f7e75490e05f9dd977cd29791f13629

  # Extract vendored subchart tgzs to root-level directories so the pipeline's
  # vendor step can find them at file:///$name paths. The dependencies (etcd and
  # apisix-ingress-controller) are both optional with conditions, so the test
  # pipeline auto-disables them.
  - runs: |
      for tgz in charts/apisix/charts/*.tgz; do
        tar xzf "$tgz" -C /
      done
      rm -f charts/apisix/charts/*.tgz

  - uses: charts/package
    with:
      chart-path: charts/apisix
      images: |
        apisix:
          values:
            image:
              repository: ${registry_repo}
              tag: ${pseudo_tag}
        init-container:
          values:
            initContainer:
              image: ${registry_repo}
              tag: ${pseudo_tag}
      test: |
        cases:
          - name: default
            images: [apisix]

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: apache/apisix-helm-chart
    strip-prefix: apisix-
    use-tag: true
    tag-filter-prefix: apisix-
