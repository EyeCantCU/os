package:
  name: chart-iamguarded-harbor
  version: 27.0.3
  epoch: 1
  description: harbor iamguarded chart
  copyright:
    - license: Apache-2.0

vars:
  # Versions pinned to match upstream Chart.yaml subchart dependencies.
  # Upgrade these when upstream updates their Chart.yaml dependency versions.
  # ref: https://github.com/chainguard-dev/iamguarded-charts/blob/aba584185aa3be7492c4c15ba449806208e48887/bitnami/harbor/Chart.yaml#L28-L41
  # error: "can't get a valid version for 2 subchart(s): "redis" (repository "file:///redis", version "22.x.x"), "postgresql" (repository "file:///postgresql", version "16.x.x")"
  postgresql-version: "16"
  redis-version: "22"

environment:
  contents:
    packages:
      - chart-iamguarded-common
      - chart-iamguarded-postgresql~${{vars.postgresql-version}}
      - chart-iamguarded-redis~${{vars.redis-version}}
      - yq

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: harbor/${{package.version}}
      expected-commit: aa92327659935e8116f5f47e0edb526dbb034957

  - name: Drift check for pinned subchart versions
    runs: |
      set -euo pipefail
      yq '.dependencies[] | select(.name == "postgresql") | .version' bitnami/harbor/Chart.yaml | grep -F "${{vars.postgresql-version}}" || { echo "ERROR: postgresql version drifted, update vars.postgresql-version"; exit 1; }
      yq '.dependencies[] | select(.name == "redis") | .version' bitnami/harbor/Chart.yaml | grep -F "${{vars.redis-version}}" || { echo "ERROR: redis version drifted, update vars.redis-version"; exit 1; }

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/harbor

  - uses: charts/package
    with:
      chart-path: iamguarded/harbor

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: harbor/
    use-tag: true
    tag-filter-prefix: harbor/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /harbor
