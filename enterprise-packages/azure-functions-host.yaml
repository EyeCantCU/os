package:
  name: azure-functions-host
  version: "4.1045.200"
  epoch: 0
  description: Runtime host used by the Azure Functions service.
  target-architecture:
    - x86_64
  copyright:
    - license: MIT
    - license: Apache-2.0
    - license: BSD-3-Clause
    - license: BSD-2-Clause
    - license: MIT
    - license: PROPRIETARY # Proprietary is http://www.microsoft.com/web/webpi/eula/MVC_4_eula_ENU.htm for System.Net.Http.Formatting nuget package runtime dependency, https://www.microsoft.com/web/webpi/eula/aspnetcomponent_rtw_enu.htm for Microsoft.Azure.WebJobs.Script nuget package runtime dependency, https://www.nuget.org/packages/Microsoft.ApplicationInsights.SnapshotCollector/1.4.6/License for Microsoft.ApplicationInsights.SnapshotCollector nuget package runtime dependency
  dependencies:
    runtime:
      - aspnet-8-runtime
      - dotnet-8-runtime

data:
  - name: py-versions
    items:
      3.11:
      3.12:

  - name: py-versions-with-runtime
    items:
      3.13:

environment:
  environment:
    GRPC_PROTOC_PLUGIN: "/usr/bin/grpc_csharp_plugin"
    PROTOBUF_PROTOC: "/usr/bin/protoc"
    PublishWithAspNetCoreTargetManifest: "false"
  contents:
    packages:
      - azure-functions-nodejs-worker
      - bash
      - build-base
      - busybox
      - dotnet-8-sdk
      - git
      - gnupg
      - grpc
      - grpc-dev
      - linux-headers
      - mono
      - protobuf
      - protobuf-dev
      - protoc
      - py3-supported-azure-functions-worker
      - uv
      - wget
      - zlib
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Azure/azure-functions-host
      tag: v${{package.version}}
      expected-commit: ef15b0c233fa26e3039e172fff93f12f11609091
      destination: /home/build/src

  - name: Download nuget.exe CLI
    runs: |
      mkdir -p /home/build/packages
      wget https://dist.nuget.org/win-x86-commandline/latest/nuget.exe

  - working-directory: /usr/share/worker-node
    pipeline:
      - name: Build NodeJs Worker nupkg
        runs: |
          mono /home/build/nuget.exe pack -OutputDirectory /home/build/packages/

  - working-directory: /home/build/src
    pipeline:
      - name: Build and install Azure Functions Host
        runs: |
          # Use the locally built workers
          dotnet nuget add source /home/build/packages/ --name LocalWorker

          # Build the package
          BUILD_NUMBER=$(echo "${{package.version}}" | cut -d'.' -f 3)
          HOST_COMMIT=$(git rev-list -1 HEAD)
          mkdir -p "${{targets.contextdir}}"/azure-functions-host
          dotnet publish --verbosity detailed /p:BuildNumber=$BUILD_NUMBER /p:CommitHash=$HOST_COMMIT src/WebJobs.Script.WebHost/WebJobs.Script.WebHost.csproj -c Release --output "${{targets.contextdir}}"/azure-functions-host --runtime linux-x64

          mv "${{targets.contextdir}}"/azure-functions-host/workers /home/build/temp_workers

subpackages:
  - name: azure-functions-host-nodejs-worker
    description: "NodeJS worker runtime integrated into the Azure Functions Host package."
    pipeline:
      - name: Install Azure Functions NodeJS Worker into the Host package
        runs: |
          mkdir -p "${{targets.subpkgdir}}"/azure-functions-host/workers
          mv /home/build/temp_workers/node "${{targets.subpkgdir}}"/azure-functions-host/workers/
    test:
      pipeline:
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}
        - name: Test worker directory exists
          runs: |
            test -d /azure-functions-host/workers/node

  # Python worker subpackages for 3.11 and 3.12 (worker only)
  - range: py-versions
    name: azure-functions-host-python${{range.key}}-worker
    description: "Python ${{range.key}} worker runtime integrated into the Azure Functions Host package."
    pipeline:
      - name: Install Azure Functions Python ${{range.key}} Worker into the Host package
        runs: |
          # Create directory structure for Python worker
          mkdir -p ${{targets.contextdir}}/azure-functions-host/workers/python/${{range.key}}/LINUX/X64
          mkdir -p ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages

          cp -r /usr/share/azure-functions-python-worker/worker.config.json ${{targets.contextdir}}/azure-functions-host/workers/python/worker.config.json

          # Install additional debug/development packages to match Microsoft's image
          uv venv --python ${{range.key}}
          uv pip install \
            pip \
            ptvsd

          if [ "${{range.key}}" = "3.12" ]; then
            uv pip install \
              debugpy \
              gunicorn \
              objprint \
              orjson \
              packaging \
              psutil \
              vizplugins \
              viztracer
          fi

          # Vendor dependencies to match Microsoft's image structure
          for dep in azure azure_functions_worker azurefunctions dateutil google grpc markupsafe six.py werkzeug worker.py
          do
            cp -r /usr/lib/python${{range.key}}/site-packages/$dep ${{targets.contextdir}}/azure-functions-host/workers/python/${{range.key}}/LINUX/X64/$dep
          done

          # Install system Python dependencies
          cp -r .venv/lib/python${{range.key}}/site-packages/* ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/
    test:
      environment:
        contents:
          packages:
            - py${{range.key}}-azure-functions-worker
      pipeline:
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}
        - name: Test worker directory and files exist
          runs: |
            test -d /azure-functions-host/workers/python
            test -f /azure-functions-host/workers/python/worker.config.json
            test -f /azure-functions-host/workers/python/${{range.key}}/LINUX/X64/worker.py
            test -d /azure-functions-host/workers/python/${{range.key}}/LINUX/X64/azure_functions_worker
        - name: Test worker functionality
          runs: |
            set -euo pipefail
            cd /azure-functions-host/workers/python/${{range.key}}/LINUX/X64

            # Test worker help shows expected options
            python${{range.key}} worker.py --help

            # Test worker can import required modules
            python${{range.key}} -c "
            import azure_functions_worker
            from azure_functions_worker import main, dispatcher
            print('Worker modules imported successfully')
            "

            # Test worker configuration file is valid JSON
            python${{range.key}} -c "
            import json
            with open('/azure-functions-host/workers/python/worker.config.json', 'r') as f:
                config = json.load(f)
                assert 'description' in config
                assert 'defaultExecutablePath' in config['description']
                assert 'language' in config['description']
                assert config['description']['language'] == 'python'
                print('Worker configuration is valid')
            "

  # Python worker subpackages for 3.13 (worker + runtime packages)
  - range: py-versions-with-runtime
    name: azure-functions-host-python${{range.key}}-worker
    description: "Python ${{range.key}} worker runtime integrated into the Azure Functions Host package (includes v2 runtime)."
    pipeline:
      - name: Install Azure Functions Python ${{range.key}} Worker into the Host package
        runs: |
          # Create directory structure for Python worker
          mkdir -p "${{targets.contextdir}}"/azure-functions-host/workers/python/${{range.key}}/LINUX/X64
          mkdir -p ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages

          cp -r /usr/share/azure-functions-python-worker/worker.config.json ${{targets.contextdir}}/azure-functions-host/workers/python/worker.config.json

          # Install additional debug/development packages to match Microsoft's image
          uv venv --python ${{range.key}}
          uv pip install \
            debugpy \
            gunicorn \
            objprint \
            orjson \
            packaging \
            pip \
            psutil \
            ptvsd \
            vizplugins \
            viztracer

          # Copy V1 and V2 runtime workers
          cp -r /usr/lib/python${{range.key}}/site-packages/azure_functions_runtime_v1 \
            ${{targets.contextdir}}/azure-functions-host/workers/python/${{range.key}}/LINUX/X64/azure_functions_runtime_v1
          cp -r /usr/lib/python${{range.key}}/site-packages/azure_functions_runtime \
            ${{targets.contextdir}}/azure-functions-host/workers/python/${{range.key}}/LINUX/X64/azure_functions_runtime

          # Vendor dependencies to match Microsoft's image structure
          for dep in azure azurefunctions google grpc markupsafe proxy_worker six.py uvloop werkzeug worker.py
          do
            cp -r /usr/lib/python${{range.key}}/site-packages/$dep ${{targets.contextdir}}/azure-functions-host/workers/python/${{range.key}}/LINUX/X64/$dep
          done

          # Install system Python dependencies
          cp -r .venv/lib/python${{range.key}}/site-packages/* ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/
    test:
      environment:
        contents:
          packages:
            - py${{range.key}}-azure-functions-worker
      pipeline:
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}
        - name: Test worker directory and files exist
          runs: |
            test -d /azure-functions-host/workers/python
            test -f /azure-functions-host/workers/python/worker.config.json
            test -f /azure-functions-host/workers/python/${{range.key}}/LINUX/X64/worker.py
            test -d /azure-functions-host/workers/python/${{range.key}}/LINUX/X64/proxy_worker
            test -d /azure-functions-host/workers/python/${{range.key}}/LINUX/X64/azure_functions_runtime_v1
            test -d /azure-functions-host/workers/python/${{range.key}}/LINUX/X64/azure_functions_runtime
            # Test vendored dependencies
            test -d /azure-functions-host/workers/python/${{range.key}}/LINUX/X64/werkzeug
            test -f /azure-functions-host/workers/python/${{range.key}}/LINUX/X64/six.py
            test -d /azure-functions-host/workers/python/${{range.key}}/LINUX/X64/markupsafe
            test -d /azure-functions-host/workers/python/${{range.key}}/LINUX/X64/grpc
        - name: Test worker functionality
          runs: |
            set -euo pipefail
            cd /azure-functions-host/workers/python/${{range.key}}/LINUX/X64

            # Test worker help shows expected options
            python${{range.key}} worker.py --help

            # Test worker can import required modules (proxy worker for 3.13+)
            python${{range.key}} -c "
            import proxy_worker
            from proxy_worker import dispatcher
            print('Proxy worker modules imported successfully')
            "

            # Test worker configuration file is valid JSON
            python${{range.key}} -c "
            import json
            with open('/azure-functions-host/workers/python/worker.config.json', 'r') as f:
                config = json.load(f)
                assert 'description' in config
                assert 'defaultExecutablePath' in config['description']
                assert 'language' in config['description']
                assert config['description']['language'] == 'python'
                print('Worker configuration is valid')
            "

            # Test vendored dependencies are importable
            python${{range.key}} -c "
            import werkzeug
            import six
            import markupsafe
            import grpc
            print('Vendored dependencies imported successfully')
            "

  - name: azure-functions-host-compat
    description: "Compatibility package for the Azure Functions image."
    dependencies:
      runtime:
        - bash
        - busybox
        - ca-certificates
    pipeline:
      - uses: git-checkout
        with:
          repository: https://github.com/Azure/azure-functions-docker
          tag: 4.37.1
          expected-commit: d2a9c3e7cf2e5c9f9bfd34ec244e3cf1f12d3966
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/opt/startup
          mv ./host/4/bullseye/base/sharedconfig/install_ca_certificates.sh "${{targets.subpkgdir}}"/opt/startup
          mv ./host/4/bullseye/node/node20/start_nonappservice.sh "${{targets.subpkgdir}}"/opt/startup
          chmod +x "${{targets.subpkgdir}}"/opt/startup/*.sh
    test:
      pipeline:
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}
        - name: Test compat files
          runs: |
            test -f /opt/startup/install_ca_certificates.sh
            test -f /opt/startup/start_nonappservice.sh

update:
  enabled: true
  github:
    identifier: Azure/azure-functions-host
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - azure-functions-host-nodejs-worker
        - curl
        - jq
    environment:
      ASPNETCORE_CONTENTROOT: /azure-functions-host
      FUNCTIONS_WORKER_RUNTIME: node
      HOST_VERSION: ${{package.version}}
      AzureWebJobsScriptRoot: /home/site/wwwroot
      ASPNETCORE_URLS: http://127.0.0.1:8082
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/daemon-check-output
      with:
        start: "/azure-functions-host/Microsoft.Azure.WebJobs.Script.WebHost"
        expected_output: |
          Now listening on: http://127.0.0.1:8082
          Application started
        post: |
          set -euo pipefail
          # Test main homepage response
          RESPONSE=$(curl -f -s http://127.0.0.1:8082)
          echo "$RESPONSE" | grep -iq "Your Functions.*app is up and running"
