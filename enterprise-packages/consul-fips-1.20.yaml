package:
  name: consul-fips-1.20
  version: "1.20.6"
  epoch: 13 # go/enterprise-rsc/consul-fips-1.20
  description: Consul is a distributed, highly available, and data center aware solution to connect and configure applications across dynamic, distributed infrastructure.
  copyright:
    - license: BUSL-1.1
  dependencies:
    provides:
      - consul-fips=${{package.full-version}}
    runtime:
      - merged-bin
      - wolfi-baselayout
  resources:
    cpu: "10"
    memory: 23Gi

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips
      - nodejs-18
      - nofips-node
      - yarn

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/consul
      tag: v${{package.version}}
      expected-commit: a343c51a1b97edc50cf5d49fc659764a099c2a6d
      destination: ${{package.name}}
      cherry-picks: |
        main/e794201d0c618333d81ad775270f7b32801178fb: [GHSA-qh7p-pfq3-677h]

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: consul-fips-1.20/testing/deployer

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: consul-fips-1.20/test/integration/consul-container

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: consul-fips-1.20/test-integ

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        github.com/sirupsen/logrus@v1.9.1
      modroot: consul-fips-1.20

  - working-directory: ${{package.name}}
    pipeline:
      - uses: go/remove-cgo-enabled-0
      - runs: |
          make ui-regen linux
      - runs: |
          mkdir -p ${{targets.destdir}}/usr/bin

          # The docker-entrypoint.sh expects the binary to be in /bin so put it there
          mv ./pkg/bin/linux_*/consul ${{targets.destdir}}/usr/bin/consul
      - uses: strip

subpackages:
  - name: ${{package.name}}-oci-entrypoint
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{package.name}}/.release/docker/docker-entrypoint.sh "${{targets.subpkgdir}}/usr/bin/"
    dependencies:
      provides:
        - consul-fips-oci-entrypoint=${{package.full-version}}
      runtime:
        - ${{package.name}}
        - busybox
        - dumb-init
        - libcap-utils
        - merged-bin
        - su-exec
        - wolfi-baselayout
    test:
      pipeline:
        - name: "Verify entrypoint file by executing consul for version check"
          runs: CONSUL_DISABLE_PERM_MGMT=1 /usr/bin/docker-entrypoint.sh --version | grep -F ${{package.version}}

  - name: ${{package.name}}-oci-entrypoint-compat
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/local/bin"
          ln -s /usr/bin/docker-entrypoint.sh "${{targets.subpkgdir}}/usr/local/bin/"
    dependencies:
      provides:
        - consul-fips-oci-entrypoint-compat=${{package.full-version}}
      runtime:
        - ${{package.name}}-oci-entrypoint
        - merged-bin
        - wolfi-baselayout
    test:
      pipeline:
        - name: "Verify symlink exists"
          runs: test -L /usr/local/bin/docker-entrypoint.sh

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: consul
    - uses: test/tw/help-check
      with:
        bins: consul
    - name: Verify consul agent starts and responds
      uses: test/daemon-check-output
      with:
        start: /usr/bin/consul agent -dev -bind=127.0.0.1
        expected_output: "Consul agent running!"
        timeout: 60
        post: |
          set -euo pipefail
          # Wait for HTTP API to be ready
          wait-for-it localhost:8500 -t 30
          # Verify agent responds to HTTP API (fails test if missing "consul")
          curl -sf http://localhost:8500/v1/agent/self | grep -F "consul"

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.20. # Keeping it this because we have other consul tagged versions separately like 1.1
