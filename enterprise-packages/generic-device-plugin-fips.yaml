#nolint:valid-pipeline-git-checkout-tag
package:
  name: generic-device-plugin-fips
  version: "0_git20260302"
  epoch: 0 # CVE-2025-68121
  description: FIPS-enabled Kubernetes device plugin for scheduling generic Linux devices to pods
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/squat/generic-device-plugin
      expected-commit: 151ce932ba7a884f4d3530a4b4b27a53360e175f
      branch: main

  - uses: go/build
    with:
      packages: .
      output: generic-device-plugin
      go-package: go-fips
      ldflags: -X github.com/squat/generic-device-plugin/version.Version=${{package.version}}

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package to place binary in location expected by upstream Dockerfile
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          # Upstream Dockerfile ENTRYPOINT is /generic-device-plugin
          ln -sf ./usr/bin/generic-device-plugin "${{targets.subpkgdir}}/generic-device-plugin"
    test:
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  git: {}
  schedule:
    period: daily
    reason: Upstream does not maintain tags or releases

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: generic-device-plugin
    - uses: test/tw/help-check
      with:
        bins: generic-device-plugin
    - uses: test/daemon-check-output
      with:
        setup: |
          # Create /dev/null device entry for testing (should exist but ensure it)
          # Use a fake device configuration pointing to /dev/null
          echo "Device plugin test setup"
        start: generic-device-plugin --log-level=debug --domain=test.example.com --device='{"name":"test","groups":[{"paths":[{"path":"/dev/null"}]}]}'
        timeout: 30
        expected_output: "listening"
        post: |
          set -o pipefail
          # Test metrics endpoint
          curl -sf http://localhost:8080/metrics | grep -F "go_info"
