package:
  name: graalvm-25
  version: "25.0.2"
  epoch: 1
  description: GraalVM ${{vars.major-version}} Java development kit
  copyright:
    - license: GPL-2.0-with-classpath-exception
  resources:
    cpu: 65
    memory: 128Gi
  dependencies:
    runtime:
      - ${{package.name}}-ce

vars:
  mxbuild: /home/build/graal/sdk/mxbuild
  # Pinned to latest working version
  # In the future, see: https://github.com/oracle/graal/blob/graal-GRAAL_VERSION/vm/mx.vm/suite.py
  mx-version: 7.67.0
  googletest-version: v1.14.0
  googletest-sha512: 765c326ccc1b87a01027385e69238266e356361cd4ee3e18e3c9d137a5d11fa5d657c164d02dd1be8fe693c8e10f2b580588dbfa57d27f070e2750f50d3e662c
  # https://www.graalvm.org/release-notes/JDK_25
  graal-version: 25.0.0
  graal-commit: 082f26e36e8b0740f9d4805ad97087a707de25d9

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version
  - from: ${{vars.major-version}}
    match: (.*)
    replace: /usr/lib/jvm/java-$1-graalvm
    to: java-home
  - from: ${{vars.major-version}}
    match: (.*)
    replace: /usr/lib/jvm/java-$1-openjdk
    to: boot-jdk

data:
  - name: runtimes
    items:
      ce: ""
      ce-nodejs: " with Node.js"

environment:
  contents:
    packages:
      - alsa-lib-dev
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake-3
      - cups-dev
      - curl
      - curl-dev
      - file
      - fontconfig-dev
      - freetype-dev
      - gfortran
      - giflib-dev
      - glibc-iconv
      - lcms2-dev
      - libffi-dev
      - libjpeg-turbo-dev
      - libx11-dev
      - libxext-dev
      - libxi-dev
      - libxrandr-dev
      - libxrender-dev
      - libxt-dev
      - libxtst-dev
      - maven
      - mx~${{vars.mx-version}}
      - ncurses-dev
      - openjdk-${{vars.major-version}}-default-jdk
      - pcre2-dev
      - readline-dev
      - xz-dev
      - yaml-dev
      - zip
  environment:
    # This is needed to work around the error date 1970-01-01T00:00:00Z is not within the valid range 1980-01-01T00:00:02Z to 2099-12-31T23:59:59Z
    SOURCE_DATE_EPOCH: 315532900

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openjdk/jdk${{vars.major-version}}u
      tag: jdk-${{package.version}}-ga
      expected-commit: 405a5699ebd097464ed3fc9345414b0774a2edc9

  - uses: git-checkout
    with:
      repository: https://github.com/oracle/graal
      tag: vm-${{vars.graal-version}}
      expected-commit: ${{vars.graal-commit}}
      destination: graal

  - uses: patch
    with:
      patches: |
        never-fail-version-check.patch

  - name: Extract the googletest version from the source doc and Verify
    runs: |
      googletest_version=$(sed -n 's/.*https:\/\/github\.com\/google\/googletest\/releases\/tag\/\(v[0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' doc/building.md)
      if [ "$googletest_version" != "${{vars.googletest-version}}" ]; then
        echo "Error: googletest version mismatch. Expected ${{vars.googletest-version}}, got $googletest_version"
        exit 1
      fi

  - working-directory: /home/build/googletest
    pipeline:
      - uses: fetch
        with:
          uri: https://github.com/google/googletest/archive/${{vars.googletest-version}}.tar.gz
          expected-sha512: 765c326ccc1b87a01027385e69238266e356361cd4ee3e18e3c9d137a5d11fa5d657c164d02dd1be8fe693c8e10f2b580588dbfa57d27f070e2750f50d3e662c

  - runs: chmod +x configure

  - uses: autoconf/configure
    with:
      opts: |
        --disable-precompiled-headers \
        --disable-warnings-as-errors \
        --enable-dtrace=no \
        --prefix=${{vars.java-home}} \
        --with-boot-jdk=${{vars.boot-jdk}} \
        --with-debug-level=release \
        --with-freetype=system \
        --with-giflib=system \
        --with-gtest="/home/build/googletest" \
        --with-jtreg=no \
        --with-jvm-variants=server \
        --with-lcms=system \
        --with-libjpeg=system \
        --with-libpng=system \
        --with-native-debug-symbols=internal \
        --with-vendor-bug-url=https://chainguard.dev/contact \
        --with-vendor-name=Chainguard \
        --with-vendor-url=https://chainguard.dev \
        --with-vendor-vm-bug-url=https://chainguard.dev/contact \
        --with-version-opt="cgr-r${{package.epoch}}" \
        --with-version-pre="no" \
        --with-version-string="" \
        --with-zlib=system

  - runs: |
      # Create Graal builder image
      make graal-builder-image

      # Build GraalVM
      cd graal/vm

      # Use graal builder JDK
      export JAVA_HOME="/home/build/build/linux-${{build.arch}}-server-release/images/graal-builder-jdk"

      # Retrieve all Graal projects
      mx --env=ce-complete sforceimports

subpackages:
  # Native image depends on gcc, make, glibc-dev, and zlib-dev
  # Additionally, it requires static libraries to produce native
  # executables so we do not split them away
  - range: runtimes
    name: ${{package.name}}-${{range.key}}
    description: GraalVM ${{vars.major-version}}${{range.value}}
    dependencies:
      runtime:
        - alsa-lib
        - freetype
        - gcc
        - giflib
        - glibc-dev
        - java-cacerts
        - lcms2
        - libfontconfig1
        - libjpeg-turbo
        - libx11
        - libxext
        - libxi
        - libxrender
        - libxtst
        - make
        - ttf-dejavu
        - zlib-dev
    pipeline:
      - working-directory: graal/vm
        runs: |
          # Use graal builder JDK
          export JAVA_HOME="/home/build/build/linux-${{build.arch}}-server-release/images/graal-builder-jdk"

          # Clean tree
          mx clean --aggressive

          # Build GraalVM
          CXXFLAGS="-Wno-template-body" mx --env=${{range.key}} build

          # Find arch-dependent output dir
          arch_dir="${{vars.mxbuild}}/linux-${{build.goarch}}"
          if [ ! -d "$arch_dir" ]; then
            arch_dir="${{vars.mxbuild}}/linux-${{build.arch}}"
          fi

          # Find GraalVM
          # - CE is output to *_COMMUNITY_*
          # - CE + runtime is output to *_CE_*
          for graalvm_dir in \
            "GRAALVM_CE_JAVA${{vars.major-version}}/graalvm-ce-openjdk-${{package.version}}" \
            "GRAALVM_COMMUNITY_JAVA${{vars.major-version}}/graalvm-community-openjdk-${{package.version}}"
          do
            graalvm_dist="${arch_dir}/${graalvm_dir}"
            found_any=""
            for dir in "$graalvm_dist".*; do
                if [ -d "$dir" ]; then
                    if [ -z "$found_any" ]; then
                        mkdir -p "${{targets.contextdir}}/${{vars.java-home}}"
                        found_any="yes"
                    fi
                    cp -r "$dir"/* "${{targets.contextdir}}/${{vars.java-home}}/"
                fi
            done
          done
          rm ${{targets.contextdir}}/${{vars.java-home}}/lib/src.zip

          # copy to shared java cacerts store
          rm -f ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts
          ln -s /etc/ssl/certs/java/cacerts \
            ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts
          # symlink for `java-common` to work (which expects jre in $JAVA_HOME/jre)
          ln -s . ${{targets.contextdir}}/${{vars.java-home}}/jre
      - runs: |
          if [ "${{range.key}}" != "ce-nodejs" ]; then
            # NOOP
            exit 0
          fi

          NODE_MODULES="${{targets.contextdir}}/${{vars.java-home}}/languages/nodejs/npm/node_modules"
          if [ ! -d "$NODE_MODULES" ]; then
            echo "WARNING: missing ${NODE_MODULES}, not doing CVE remediations"
            exit 0
          fi

          echo "Updating vulnerable npm dependencies..."

          # Download and update brace-expansion from 2.0.1 to 2.0.2 (CVE-2025-5889)
          if [ -d "$NODE_MODULES/brace-expansion" ]; then
            cd /tmp
            curl -sL https://registry.npmjs.org/brace-expansion/-/brace-expansion-2.0.2.tgz -o brace-expansion-2.0.2.tgz
            rm -rf "$NODE_MODULES/brace-expansion"
            tar -xzf brace-expansion-2.0.2.tgz
            mv package "$NODE_MODULES/brace-expansion"
            rm brace-expansion-2.0.2.tgz
            echo "Updated brace-expansion to 2.0.2"
          fi

          # Download and update cross-spawn from 7.0.3 to 7.0.6 (CVE-2024-21538)
          if [ -d "$NODE_MODULES/cross-spawn" ]; then
            cd /tmp
            curl -sL https://registry.npmjs.org/cross-spawn/-/cross-spawn-7.0.6.tgz -o cross-spawn-7.0.6.tgz
            rm -rf "$NODE_MODULES/cross-spawn"
            tar -xzf cross-spawn-7.0.6.tgz
            mv package "$NODE_MODULES/cross-spawn"
            rm cross-spawn-7.0.6.tgz
            echo "Updated cross-spawn to 7.0.6"
          fi

          # Download and update diff from 5.0.0 to 5.2.2 (GHSA-73rr-hh4g-fpgx)
          if [ -d "$NODE_MODULES/diff" ]; then
            cd /tmp
            curl -sL https://registry.npmjs.org/diff/-/diff-5.2.2.tgz -o diff-5.2.2.tgz
            rm -rf "$NODE_MODULES/diff"
            tar -xzf diff-5.2.2.tgz
            mv package "$NODE_MODULES/diff"
            rm diff-5.2.2.tgz
            echo "Updated diff to 5.2.2"
          fi

          # Download and update tar to remediate GHSA-8qq5-rm4j-mr97
          tar_filename="tar-7.5.7.tgz"
          tmpdir="$(mktemp -d)"
          tmpfile="${tmpdir}/${tar_filename}"
          curl -sL "https://registry.npmjs.org/tar/-/${tar_filename}" -o "${tmpfile}"
          tar -xzf "${tmpfile}" -C "${tmpdir}"

          for location in "tar" "node-gyp/node_modules/tar" "cacache/node_modules/tar" ; do
            dir="${NODE_MODULES}/${location}"
            package_json_path="${dir}/package.json"
            if [ ! -e "$package_json_path" ] ; then
              echo "WARNING: not updating tar in $dir because missing $package_json_path" >&2
              continue
            fi

            rm -rf "${dir}/*"
            cp -r "${tmpdir}/package/"* "${dir}/"

            echo "INFO: Updated tar in $dir"
          done
          rm -rf "${tmpdir}"
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}-${{range.key}}-default-jdk
            - ${{package.name}}-${{range.key}}-jmods
      pipeline:
        - uses: test/tw/ldd-check
          with:
            extra-library-paths: ${{vars.java-home}}/lib/server
        # Test a basic Hello World
        - working-directory: basic
          runs: |
            javac HelloWorld.java
            java HelloWorld | grep -qi "Hello World!"
        # Test a basic HTTP connection
        - working-directory: basic
          runs: |
            javac RequestTest.java
            java RequestTest | grep -qi "Successfully connected to example.org"
        # Test modules
        - working-directory: advanced/module-project
          runs: |
            mkdir -p output
            javac -d output --module-source-path modules $(find modules -name "*.java")

            # Create a jar with the compiled classes
            jar --verbose --create --file app.jar \
              --main-class dev.chainguard.module.main.Main \
              --module-version 1.0 \
              -C output/test.modules . \
              -C output/main.app .

            # Test the jar
            java -jar app.jar

            # Test jlink
            rm -rf test-project-jre
            jlink --verbose --module-path "app.jar:$JAVA_HOME/jmods" \
              --add-modules test.modules \
              --output test-project-jre

            # Test custom JRE
            test-project-jre/bin/java -jar app.jar
        # Test JVMCI
        - runs: |
            cat > Counter.java <<'EOF'
            public class Counter {
              public static void main(String[] args) throws Exception {
                int sum = 0;
                for (int i = 0; i < 10; i++) sum += i;
                System.out.println(sum);
              }
            }
            EOF
            javac Counter.java
            # Use JVMCI and log compilation
            java -XX:+UnlockExperimentalVMOptions \
                -XX:+UseJVMCICompiler \
                -XX:+UnlockDiagnosticVMOptions \
                -XX:+LogCompilation \
                Counter
        # Test NodeJS
        - runs: |
            if [ ${{range.key}} = "ce-nodejs" ]; then
              node <<'EOF'
            console.log(Polyglot.eval("js", "\"Hello, GraalJS!\""));
            EOF
            fi
        # Test native image
        - runs: |
            cat > Hello.java <<'EOF'
            public class Hello {
              public static void main(String[] args) {
                System.out.println("Hello from native image!");
              }
            }
            EOF
            javac Hello.java
            native-image Hello -H:Name=hello
            ./hello | grep -q "Hello from native image!"

  - range: runtimes
    name: ${{package.name}}-${{range.key}}-dbg
    description: GraalVM ${{vars.major-version}}${{range.value}} Java debug symbols
    pipeline:
      - uses: split/debug
        with:
          package: ${{package.name}}-${{range.key}}
    dependencies:
      runtime:
        - ${{package.name}}-${{range.key}}
    test:
      pipeline:
        - runs: |
            symbols=$(find /usr/lib/debug/${{vars.java-home}} -type 'f' -name "*.debug" | wc -l)
            if [ $symbols -eq 0 ]; then
              echo "No debug symbols found!" && exit 1
            fi
            echo "Debug symbols were found"

  - range: runtimes
    name: ${{package.name}}-${{range.key}}-jmods
    description: GraalVM ${{vars.major-version}}${{range.value}} jmods
    dependencies:
      runtime:
        - binutils
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ${{targets.outdir}}/${{package.name}}-${{range.key}}/${{vars.java-home}}/jmods \
             ${{targets.contextdir}}/${{vars.java-home}}
    test:
      pipeline:
        - runs: |
            jmods=$(find ${{vars.java-home}}/jmods -type 'f' -name "*.jmod" | wc -l)
            if [ $jmods -eq 0 ]; then
              echo "No jmods found!" && exit 1
            fi
            echo "$jmods jmods were found"

  - range: runtimes
    name: ${{package.name}}-${{range.key}}-default-jdk
    description: Use the GraalVM ${{vars.major-version}}${{range.value}} JVM as the default JVM with the JDK installed
    dependencies:
      runtime:
        - ${{package.name}}-${{range.key}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib/jvm
          ln -s $(basename ${{vars.java-home}}) ${{targets.contextdir}}/usr/lib/jvm/default-jvm

          # Symlink binaries provided by GraalVM
          # Substitutes java-common
          mkdir -p ${{targets.contextdir}}/usr/bin
          for path in ${{targets.outdir}}/${{package.name}}-${{range.key}}/${{vars.java-home}}/bin/*; do
            bin=$(basename $path)
            ln -s ../lib/jvm/default-jvm/bin/$bin ${{targets.contextdir}}/usr/bin/$bin
          done
    test:
      pipeline:
        - runs: |
            jvm="$(readlink -f /usr/lib/jvm/default-jvm)"
            echo "Java home: ${{vars.java-home}}"
            echo "Default JVM: $jvm"
            if [ $jvm != "${{vars.java-home}}" ]; then
              echo "Default JVM does not point to correct Java home!"
              exit 1
            fi
            echo "Default JVM set correctly"

  - name: ${{package.name}}-graalpy
    description: GraalPy ${{vars.graal-version}}
    options:
      no-depends: true
      no-provides: true
    dependencies:
      provides:
        - graalpy=${{vars.graal-version}}
      runtime:
        - bash
        - gcc
        - glibc-dev
        - make
        - zlib-dev
    pipeline:
      - working-directory: graalpython
        runs: |
          # Use graal builder JDK
          export JAVA_HOME="/home/build/build/linux-${{build.arch}}-server-release/images/graal-builder-jdk"

          # Clean tree
          mx clean --aggressive

          # Build GraalPy
          CFLAGS="-Wno-maybe-uninitialized -Wno-stringop-overread" mx python-svm

          # Install GraalPy
          mkdir -p ${{targets.contextdir}}/usr/share/graalpy
          if [ -d mxbuild/linux-${{build.goarch}} ]; then
            cp -r mxbuild/linux-${{build.goarch}}/GRAALPY_NATIVE_STANDALONE/* \
              ${{targets.contextdir}}/usr/share/graalpy
          else
            cp -r mxbuild/linux-${{build.arch}}/GRAALPY_NATIVE_STANDALONE/* \
              ${{targets.contextdir}}/usr/share/graalpy
          fi

          # Symlink binaries provided by GraalPy
          mkdir -p ${{targets.contextdir}}/usr/bin
          for path in ${{targets.contextdir}}/usr/share/graalpy/bin/*; do
            bin=$(basename $path)
            ln -s ../share/graalpy/bin/$bin ${{targets.contextdir}}/usr/bin/$bin
          done
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check
          with:
            extra-library-paths: /usr/share/graalpy/lib/llvm-toolchain/lib/${{build.arch}}-unknown-linux-gnu

  - name: ${{package.name}}-graalpy-venv
    description: Default virtual environment for the GraalPy ${{vars.graal-version}} image
    options:
      no-depends: true
      no-provides: true
    dependencies:
      provides:
        - graalpy-venv=${{vars.graal-version}}
      runtime:
        - ${{package.name}}-graalpy
    pipeline:
      - runs: |
          mkdir -p /app
          mkdir -p /usr/share/graalpy

          # Copy GraalPy to rootfs
          cp -r ${{targets.outdir}}/${{package.name}}-graalpy/usr/share/graalpy/* /usr/share/graalpy/

          # Create virtual environment
          /usr/share/graalpy/bin/python3 -m venv create /app/graalenv

          # Install virtual environment
          mkdir -p ${{targets.contextdir}}/app
          mv /app/graalenv ${{targets.contextdir}}/app/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  shared: true
  github:
    identifier: openjdk/jdk25u
    strip-prefix: jdk-
    strip-suffix: -ga
    tag-filter-contains: -ga
    use-tag: true
