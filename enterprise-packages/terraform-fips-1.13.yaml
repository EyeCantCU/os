package:
  name: terraform-fips-1.13
  version: "1.13.5"
  epoch: 6 # CVE-2025-61732
  copyright:
    - license: BUSL-1.1
  dependencies:
    provides:
      - terraform-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/terraform
      tag: v${{package.version}}
      expected-commit: 328813676aec7a4e2a491484f91b5e0b67847b6c

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/legacy

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/s3

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/pg

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/oss

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/oci

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/kubernetes

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/gcs

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/cos

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/consul

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: internal/backend/remote-state/azure

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: .
      go-package: go-fips-md5
      output: terraform
      ldflags: -X github.com/hashicorp/terraform/version.dev="no"

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for terraform
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/terraform "${{targets.subpkgdir}}"/usr/local/bin
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            set -euo pipefail
            # Verify symlink works and reports correct version
            /usr/local/bin/terraform --version | grep -F "${{package.version}}"
            # Verify help works through symlink (functional test of symlink)
            /usr/local/bin/terraform --help | grep -F "Usage:"

  - name: ${{package.name}}-local-provider-config
    description: Configure Terraform to use local providers
    dependencies:
      provides:
        - terraform-local-provider-config=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/terraform/provider-mirror
          cat > "${{targets.subpkgdir}}"/terraform/.terraformrc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "/terraform/provider-mirror"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            grep -F "filesystem_mirror" /terraform/.terraformrc
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: terraform-local-provider-config

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.13

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/ver-check
      with:
        bins: terraform
    - uses: test/tw/help-check
      with:
        bins: terraform
    - name: Terraform Initialization
      runs: |
        set -euo pipefail
        echo "provider \"local\" {}" > example.tf
        terraform init -input=false
    - name: Terraform Plan Creation
      runs: |
        set -euo pipefail
        terraform plan -input=false -out=tfplan
    - name: Terraform Apply Execution
      runs: |-
        set -euo pipefail
        terraform apply -input=false tfplan
