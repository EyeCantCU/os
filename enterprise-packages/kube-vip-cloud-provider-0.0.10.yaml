package:
  name: kube-vip-cloud-provider-0.0.10
  version: "0.0.10"
  epoch: 10 # go/enterprise-rsc/kube-vip-cloud-provider-0.0.10
  description: A general purpose cloud provider for Kube-Vip
  copyright:
    - license: Apache-2.0
  resources:
    cpu: "4"
    memory: 9Gi

environment:
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 482aa23c8158fc0cf69d5ceb853776a412e00fdd
      repository: https://github.com/kube-vip/kube-vip-cloud-provider
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        go.opentelemetry.io/contrib/instrumentation/google.golang.org/grpc/otelgrpc@v0.46.0
        go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc@v1.21.0
        go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp@v0.46.1
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      output: kube-vip-cloud-provider
      packages: .
      ldflags: |
        -w
        -extldflags '-static'
        -X k8s.io/component-base/version.gitVersion=v${{package.version}}

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/kube-vip-cloud-provider ${{targets.subpkgdir}}/kube-vip-cloud-provider
    test:
      pipeline:
        - name: Check symlink
          runs: |
            stat /kube-vip-cloud-provider

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-compat
    environment:
      KUBERNETES_SERVICE_HOST: "127.0.0.1"
      KUBERNETES_SERVICE_PORT: "32764"
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: kube-vip-cloud-provider
    - uses: test/tw/ver-check
      with:
        bins: kube-vip-cloud-provider
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - name: Leader election RBAC and startup verification
      uses: test/daemon-check-output
      with:
        setup: |
          # Grant leader election permissions in kube-system namespace
          kubectl create clusterrole leader-election --verb=get,create,update --resource=leases
          kubectl create clusterrolebinding default-leader-election \
            --clusterrole=leader-election --serviceaccount=default:default
        start: /usr/bin/kube-vip-cloud-provider
        timeout: "30"
        expected_output: "Starting"

update:
  enabled: true
  github:
    identifier: kube-vip/kube-vip-cloud-provider
    strip-prefix: v
    tag-filter: v0.0.10
