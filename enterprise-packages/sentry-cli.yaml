package:
  name: sentry-cli
  version: "3.2.2"
  epoch: 0 # GHSA-434x-w66g-qw3r
  description: A command line utility to work with Sentry
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - openssl-dev
  environment:
    OPENSSL_NO_VENDOR: "1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/getsentry/sentry-cli
      tag: ${{package.version}}
      expected-commit: 9bc64192ec550bfd0359e1ebba5bdf607e383f62

  - uses: rust/cargobump

  - uses: cargo/build
    with:
      output: sentry-cli

update:
  enabled: true
  github:
    identifier: getsentry/sentry-cli
    strip-prefix: v
    use-tag: true

subpackages:
  - name: ${{package.name}}-oci-entrypoint
    description: Entrypoint for using Sentry CLI in OCI containers
    dependencies:
      runtime:
        - dash-binsh
    pipeline:
      - runs: install -Dm755 docker-entrypoint.sh ${{targets.contextdir}}/docker-entrypoint.sh
    test:
      pipeline:
        - runs: |
            test -x /docker-entrypoint.sh
            stat /docker-entrypoint.sh

test:
  # Manual testing is required here as this is meant to directly talk to sentry's platform.
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: sentry-cli
    - uses: test/tw/ver-check
      with:
        bins: sentry-cli
