package:
  name: perl-config-general
  version: "2.67"
  epoch: 0
  description: Generic Config Module
  copyright:
    - license: Artistic-2.0

environment:
  contents:
    packages:
      - busybox
      - perl

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/T/TL/TLINDEN/Config-General-${{package.version}}.tar.gz
      expected-sha256: 473d65127b23dac0e8039c01e28bc4072cb9a6e93e81a1ea4893cea08c698db0

  - uses: perl/make

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: perl/cleanup

update:
  enabled: true
  release-monitor:
    identifier: 2714

test:
  environment:
    contents:
      packages:
        - perl
  pipeline:
    - runs: |
        tee "rcfile" <<'EOF'
        <person hugo gera>
        </person>
        EOF
        perl <<'EOF' | grep -F -e "person"
        use Config::General;
        $conf = Config::General->new("rcfile");
        my %config = $conf->getall;
        print %config
        EOF
