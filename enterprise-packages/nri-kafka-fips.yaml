package:
  name: nri-kafka-fips
  version: "3.15.0"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: New Relic Infrastructure Kafka Integration (FIPS)
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - nrjmx
      - openjdk-11-jre
      - openjdk-bcfips-policy-140-3-j17

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-kafka
      expected-commit: 69c339f8c4543981a1700bcb3f46f24c9bbde8a4
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-kafka
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-kafka ${{targets.subpkgdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-kafka
          install -Dm644 legacy/kafka-definition.yml ${{targets.subpkgdir}}/var/db/newrelic-infra/newrelic-integrations/kafka-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-kafka
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-kafka
    - uses: test/tw/ver-check
      with:
        bins: nri-kafka
        version-flag: "-show_version"
    # This test runs nri-kafka without a Kafka cluster. It verifies that the binary starts correctly
    - name: Test binary execution
      uses: test/daemon-check-output
      with:
        start: nri-kafka
        expected_output: |
          com.newrelic.kafka
          protocol_version
          integration_version
