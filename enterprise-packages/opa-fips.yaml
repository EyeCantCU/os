package:
  name: opa-fips
  version: "1.13.1"
  epoch: 1 # go/enterprise-rsc/opa-fips
  description: Open Policy Agent (OPA) is an open source, general-purpose policy engine.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openssl-config-fipshardened
  resources:
    cpu: "2"
    memory: 8Gi

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-policy-agent/opa
      tag: v${{package.version}}
      expected-commit: 9c3bb906f1ac56903e2754982d66c83f9a9aaa06

  - uses: go/build
    with:
      ldflags: "-X github.com/open-policy-agent/opa/version.Version=${{package.version}}"
      modroot: .
      packages: .
      output: opa
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  github:
    identifier: open-policy-agent/opa
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        opa version
        opa test . -v
