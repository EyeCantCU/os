package:
  name: opentofu-1.6
  version: 1.6.3
  epoch: 14
  copyright:
    - license: MPL-2.0
  dependencies:
    provides:
      - opentofu=${{package.full-version}}

environment:
  environment:
    CGO_ENABLED: 0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7df1a351d8763bc7ed8fc712ca28f166f59b769c
      repository: https://github.com/opentofu/opentofu
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/hashicorp/go-retryablehttp@v0.7.7
        github.com/hashicorp/go-getter@v1.7.5
        google.golang.org/protobuf@v1.33.0
        github.com/cloudflare/circl@v1.3.7
        github.com/hashicorp/go-slug@v0.16.3
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        github.com/golang-jwt/jwt/v4@v4.5.2
        golang.org/x/net@v0.38.0
      modroot: .

  - uses: go/build
    with:
      ldflags: -X 'github.com/opentofu/opentofu/version.dev=no'
      modroot: .
      output: tofu
      packages: ./cmd/tofu

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for opentofu
    dependencies:
      provides:
        - opentofu-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/tofu "${{targets.subpkgdir}}"/usr/local/bin
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            /usr/local/bin/tofu --version | grep -q "${{package.version}}"
            /usr/local/bin/tofu --help
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: "opentofu-compat"
            real-pkg-name: "${{subpkg.name}}"

  - name: ${{package.name}}-local-provider-config
    description: Configure opentofu to use local providers
    dependencies:
      provides:
        - opentofu-local-provider-config=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/opentofu/provider-mirror
          cat > "${{targets.subpkgdir}}"/opentofu/.opentofurc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "/opentofu/provider-mirror"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            grep "filesystem_mirror" /opentofu/.opentofurc
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: "opentofu-local-provider-config"
            real-pkg-name: "${{subpkg.name}}"

update:
  enabled: true
  ignore-regex-patterns:
    - 'rc'
    - 'beta'
  github:
    identifier: opentofu/opentofu
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v1.6

test:
  pipeline:
    - runs: |
        tofu --version
        tofu --help
    - name: tofu Initialization
      runs: |
        echo "provider \"local\" {}" > example.tf
        tofu init -input=false || exit 1
    - name: tofu Plan Creation
      runs: |
        tofu plan -input=false -out=tfplan || exit 1
    - name: tofu Apply Execution
      runs: |
        tofu apply -input=false tfplan || exit 1
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: "opentofu"
        real-pkg-name: "${{package.name}}"
