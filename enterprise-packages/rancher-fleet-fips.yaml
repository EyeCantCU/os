package:
  name: rancher-fleet-fips
  version: "0.14.3"
  epoch: 1 # GHSA-q9hv-hpm4-hj6x
  description: Deploy workloads from Git to large fleets of Kubernetes clusters
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7c2c7e3b2b7c7c90eed31ac71d5dc8d07b6f12a5
      repository: https://github.com/rancher/fleet
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/cloudflare/circl@v1.6.3

subpackages:
  - name: rancher-fleet-agent-fips
    dependencies:
      runtime:
        - busybox
        - gzip
        - posix-libc-utils
    pipeline:
      - uses: go/build
        with:
          ldflags: |
            -X github.com/rancher/fleet/pkg/version.GitCommit=$(git rev-parse HEAD)
            -X github.com/rancher/fleet/pkg/version.Version=${{package.version}}
          output: fleetagent
          packages: ./cmd/fleetagent/main.go
          go-package: go-fips
    test:
      environment:
        environment:
          # required to run any of these tests and the application
          # otherwise panic failures will occur.
          # values referenced here: https://github.com/rancher/fleet/blob/ad5324910e30cf7d2b7ef3ab8893c68c9c9e6baa/charts/fleet/values.yaml#L101
          CATTLE_ELECTION_LEASE_DURATION: 30s
          CATTLE_ELECTION_RENEW_DEADLINE: 25s
          CATTLE_ELECTION_RETRY_PERIOD: 10s
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/ver-check
          with:
            bins: fleetagent
        - uses: test/kwok/cluster
        - name: "Test fleet-agent register functionality"
          uses: test/daemon-check-output
          with:
            setup: |
              kubectl create ns fleet-system
              kubectl create -n fleet-system secret generic fleet-agent-bootstrap \
                --from-literal=apiServerURL=https://127.0.0.1:32764 --from-literal=clusterNamespace=fleet-system
            start: fleetagent register --namespace fleet-system
            timeout: 30
            expected_output: |
              Creating clusterregistration
            error_strings: ""

  - name: rancher-fleet-cli-fips
    pipeline:
      - uses: go/build
        with:
          ldflags: |
            -X github.com/rancher/fleet/pkg/version.GitCommit=$(git rev-parse HEAD)
            -X github.com/rancher/fleet/pkg/version.Version=${{package.version}}
          output: fleet
          packages: ./cmd/fleetcli/main.go
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/ver-check
          with:
            bins: fleet
        - name: Verify completion script
          runs: |
            set -euo pipefail
            # Verify completion script contains expected debug function
            fleet completion bash | grep -F "__fleet_debug"
            fleet completion bash | grep -F "starting completion logic"
        - name: "Setup KWOK cluster"
          uses: test/kwok/cluster
        - name: "Install CRDs"
          runs: |
            kubectl apply -f https://raw.githubusercontent.com/rancher/fleet/refs/tags/v${{package.version}}/charts/fleet-crd/templates/crds.yaml
            kubectl wait --for=condition=Established crd --all --timeout=60s
        - name: "Cleanup cluster registrations"
          runs: |
            fleet cleanup clusterregistration | grep -F "Cleaning up outdated cluster registrations"

  - name: rancher-fleet-controller-fips
    dependencies:
      runtime:
        - openssh-client
        - git
    pipeline:
      - uses: go/build
        with:
          ldflags: |
            -X github.com/rancher/fleet/pkg/version.GitCommit=$(git rev-parse HEAD)
            -X github.com/rancher/fleet/pkg/version.Version=${{package.version}}
          output: fleetcontroller
          packages: ./cmd/fleetcontroller
          go-package: go-fips
    test:
      environment:
        contents:
          packages:
            - curl
        environment:
          CATTLE_ELECTION_LEASE_DURATION: 20s
          CATTLE_ELECTION_RENEW_DEADLINE: 10s
          CATTLE_ELECTION_RETRY_PERIOD: 1s
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/ver-check
          with:
            bins: fleetcontroller
        - uses: test/tw/help-check
          with:
            bins: fleetcontroller
        - name: "Setup KWOK cluster"
          uses: test/kwok/cluster
        - name: "Install CRDs"
          runs: |
            kubectl apply -f https://raw.githubusercontent.com/rancher/fleet/refs/tags/v${{package.version}}/charts/fleet-crd/templates/crds.yaml
            kubectl wait --for=condition=Established crd --all --timeout=60s
            kubectl create ns cattle-fleet-system
        - name: "Start fleet controller daemon"
          uses: test/daemon-check-output
          with:
            start: |
              fleetcontroller \
                --namespace cattle-fleet-system  \
                --kubeconfig ~/.kube/config
            timeout: 30
            expected_output: |
              successfully acquired lease
            post: |
              set -euo pipefail
              # Wait for metrics endpoint to be ready
              wait-for-it localhost:8080 -t 30
              # Check metrics endpoint (verifies controller is functional)
              curl -fsSL http://localhost:8080/metrics | grep -F "leader_election_master_status"

update:
  enabled: true
  github:
    identifier: rancher/fleet
    strip-prefix: v

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
