package:
  name: chart-argo-argo-cd
  version: "9.4.6"
  epoch: 0
  description: A Helm chart for Argo CD, a declarative, GitOps continuous delivery tool for Kubernetes
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-dandydeveloper-redis-ha-4.34~4.34.11

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/argoproj/argo-helm
      tag: argo-cd-${{package.version}}
      expected-commit: dd40956efda0400ff3f4c2e4fd432159915ff9e0

  - uses: charts/package
    with:
      chart-path: charts/argo-cd
      images: |
        argocd:
          values:
            global:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        dex:
          values:
            dex:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        redis:
          values:
            redis:
              image:
                repository: ${registry_repo}
                tag: ${pseudo_tag}
        redis-exporter:
          values:
            redis:
              exporter:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
        extension-installer:
          values:
            server:
              extensions:
                image:
                  repository: ${registry_repo}
                  tag: ${pseudo_tag}
      test: |
        values:
          imagePullSecrets:
            - name: pull-secret
        cases:
          - name: default
            images: [argocd, dex, redis]
          - name: with-redis-exporter
            images: [argocd, dex, redis, redis-exporter]
            values:
              redis:
                exporter:
                  enabled: true
          - name: with-extensions
            images: [argocd, dex, redis, extension-installer]
            values:
              server:
                extensions:
                  enabled: true
                  extensionList:
                    - name: test-extension

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: argoproj/argo-helm
    strip-prefix: argo-cd-
    use-tag: true
    tag-filter-prefix: argo-cd-
