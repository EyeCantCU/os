package:
  name: kustomize-fips
  version: "5.8.1"
  epoch: 0 # CVE-2025-61726
  description: Customization of kubernetes YAML configurations
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/kustomize
      tag: kustomize/v${{package.version}}
      expected-commit: 9790a1c3efd2fd35f1b768d495112834176581c1

  - uses: go/build
    with:
      go-package: go-fips
      modroot: ./kustomize
      packages: .
      output: kustomize
      ldflags: |
        -X sigs.k8s.io/kustomize/api/provenance.version=kustomize/${{package.version}}
        -X 'sigs.k8s.io/kustomize/api/provenance.buildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')'

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/kustomize
    strip-prefix: kustomize/v
    tag-filter: kustomize/v
    use-tag: true
