package:
  name: gmic
  version: "3.7.1"
  epoch: 0
  description: GREYC's Magic for Image Computing - image processing framework
  copyright:
    - license: CECILL-2.1

vars:
  stdlib-version: "366"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cimg-dev
      - cmake
      - curl-dev
      - eigen-dev
      - fftw-dev
      - graphicsmagick-cpp
      - graphicsmagick-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libwebp-dev
      - libx11-dev
      - openexr-dev
      - samurai
      - tiff-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GreycLab/gmic
      tag: v.${{package.version}}
      expected-commit: dac3e2a358b1b70b807137f80721b6769dd559f4

  - uses: fetch
    with:
      uri: https://gmic.eu/gmic_stdlib_community${{vars.stdlib-version}}.h
      expected-sha256: 2d1b28f275b1908cdb6757da898b060dd7711bf46296235c43cdcaee3afc4da3
      extract: false

  - runs: |
      # Copy CImg.h from cimg-dev and stdlib header to src/
      cp /usr/include/CImg.h src/
      mv gmic_stdlib_community${{vars.stdlib-version}}.h src/gmic_stdlib_community.h

  - uses: cmake/configure
    with:
      opts: -DBUILD_LIB=ON -DBUILD_LIB_STATIC=OFF -DBUILD_CLI=ON -DBUILD_MAN=OFF -DBUILD_BASH_COMPLETION=OFF -DENABLE_DYNAMIC_LINKING=ON

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
        - cimg-dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/ver-check
      with:
        bins: gmic
        version: ${{package.version}}
    - name: Test gmic image processing operations
      runs: |
        set -euo pipefail
        # Generate a test image with random noise
        gmic 100,100,1,3 rand 0,255 -o /tmp/test_input.png
        stat /tmp/test_input.png

        # Test blur filter
        gmic /tmp/test_input.png -blur 2 -o /tmp/test_blur.png
        stat /tmp/test_blur.png

        # Test resize operation
        gmic /tmp/test_input.png -resize 50,50 -o /tmp/test_resize.png
        stat /tmp/test_resize.png

        # Test image info command
        gmic /tmp/test_input.png -print

        # Cleanup
        rm -f /tmp/test_*.png
        echo "gmic functional tests passed"

update:
  enabled: true
  github:
    identifier: GreycLab/gmic
    strip-prefix: v.
    tag-filter-prefix: v.
