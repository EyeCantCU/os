package:
  name: perl-alien-build-plugin-download-gitlab
  version: "0.01"
  epoch: 0
  description: Alien::Build plugin to download from GitLab
  copyright:
    - license: Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl-alien-build
      - perl-path-tiny
      - perl-uri

environment:
  contents:
    packages:
      - perl-alien-build
      - perl-path-tiny
      - perl-uri

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PL/PLICEASE/Alien-Build-Plugin-Download-GitLab-${{package.version}}.tar.gz
      expected-sha256: c1f089c8ea152a789909d48a83dbfcf2626f773daf30431c8622582b26aba902

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 293680

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Smoke test
      runs: echo "use Alien::Build::Plugin::Download::GitLab;" | perl
    - runs: |
        perl <<'EOF'
        use strict;
        use warnings;
        use Alien::Build::Plugin::Download::GitLab;

        # Test basic module loading and instantiation
        my $plugin = Alien::Build::Plugin::Download::GitLab->new();
        die "Failed to create plugin instance" unless defined $plugin;
        print "Plugin instance created successfully\n";

        # Verify plugin can be used (basic check)
        die "Plugin is not an object" unless ref($plugin);
        print "Plugin is a valid object: " . ref($plugin) . "\n";

        print "Alien::Build::Plugin::Download::GitLab tests passed\n";
        EOF
