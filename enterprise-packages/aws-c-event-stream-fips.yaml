package:
  name: aws-c-event-stream-fips
  version: "0.5.7"
  epoch: 0
  description: "AWS C99 implementation of the vnd.amazon.eventstream content-type (FIPS)"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - aws-lc-fips
    provider-priority: 20

vars:
  aws-lc-lib-dir: /usr/lib/aws-lc
  aws-lc-include-dir: /usr/include/aws-lc
  aws-lc-crypto-lib: /usr/lib/aws-lc/libcrypto.so

environment:
  contents:
    packages:
      - aws-c-cal-fips-dev
      - aws-c-common-dev
      - aws-c-io-fips-dev
      - aws-checksums-dev
      - aws-lc-fips-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - s2n-tls-fips-dev
      - samurai
  environment:
    CMAKE_PREFIX_PATH: ${{vars.aws-lc-lib-dir}}
    CFLAGS: "-I${{vars.aws-lc-include-dir}}"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/awslabs/aws-c-event-stream
      tag: v${{package.version}}
      expected-commit: 31a44ff9108840a8f3fec54006218f4bc6c505e1

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_PREFIX_PATH=/usr \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_INSTALL_RPATH=${{vars.aws-lc-lib-dir}} \
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING="OFF" \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux \
        -Dcrypto_INCLUDE_DIR=${{vars.aws-lc-include-dir}} \
        -Dcrypto_SHARED_LIBRARY=${{vars.aws-lc-crypto-lib}}

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-event-stream-fips-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-event-stream-fips
      provider-priority: 20
    description: aws-c-event-stream-fips dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-event-stream
    strip-prefix: v
    use-tag: true
