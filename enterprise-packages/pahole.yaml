package:
  name: pahole
  version: "1.31"
  epoch: 0
  description: dwarf manipulation utilities
  copyright:
    - license: GPL-2.0-only

environment:
  contents:
    packages:
      - build-base
      - busybox
      - elfutils-dev
      - libbpf-dev
      - libdwarf-dev
      - linux-headers
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 1f2805b6eef104df3125143c949b391f6122e5b9
      repository: https://git.kernel.org/pub/scm/devel/pahole/pahole.git
      tag: v${{package.version}}

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - runs: |
        codiff --help
        ctracer --help
        dtagnames >/dev/null
        pahole --help
        pdwtags --help
        pfunct --help
        pglobal --help
        test -x $(which prefcnt)
        scncopy --help
        syscse --help
    - uses: test/tw/ldd-check
