package:
  name: gdal-py3.11
  version: 3.10.0
  epoch: 0
  description: GDAL is an open source MIT licensed translator library for raster and vector geospatial data formats.
  copyright:
    - license: MIT

environment:
  environment:
    GDAL_PYTHON_BINDINGS_WITHOUT_NUMPY: "YES"
  contents:
    packages:
      - armadillo-dev
      - arpack-dev
      - autoconf
      - automake
      - basisu-dev
      - bison
      - blosc-dev
      - brunsli-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - curl-dev
      - expat-dev
      - geos-dev
      - glibc-iconv
      - grep
      - lerc-dev
      - libdeflate-dev
      - libgeotiff-dev
      - libpng-dev
      - libtirpc-dev
      - libxml2-dev
      - mariadb-dev
      - nlohmann-json
      - odbc-cpp-wrapper-dev
      - openblas-dev
      - opencl-dev
      - openjpeg-dev
      - openssl-dev
      - pcre2-dev
      - proj-dev
      - py3.11-setuptools
      - python-3.11
      - python-3.11-dev
      - qhull-dev
      - sqlite-dev
      - swig
      - tiff-dev
      - zlib-dev
      - zstd-dev
      - zstd-static

pipeline:
  - uses: fetch
    with:
      expected-sha256: 946ef444489bedbc1b04bd4c115d67ae8d3f3e4a5798d5a2f1cb2a11014105b2
      uri: https://github.com/OSGeo/gdal/releases/download/v${{package.version}}/gdal-${{package.version}}.tar.gz

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: py3.11-gdal-dev
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - runs: |
            gdal-config --version

  - name: py3.11-gdal
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/
          mv ${{targets.destdir}}/usr/lib/python3* ${{targets.subpkgdir}}/usr/lib/

  - name: py3.11-gdal-tools
    pipeline:
      - runs: |
          # Moved from tests below as they don't actually do anything without the repo files
          scripts/detect_printf.sh --version
          scripts/detect_printf.sh --help
          scripts/detect_self_assignment.sh --version
          scripts/detect_self_assignment.sh --help
          scripts/detect_suspicious_char_digit_zero.sh --version
          scripts/detect_suspicious_char_digit_zero.sh --help
          scripts/detect_tabulations.sh --version
          scripts/detect_tabulations.sh --help

          # Move built files to their new locations
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/* ${{targets.subpkgdir}}/usr/bin/
          chmod a+x scripts/*
          mv scripts/* ${{targets.subpkgdir}}/usr/bin/
    test:
      pipeline:
        - runs: |
            set -x
            gdal_contour --help
            gdal_create --version
            gdal_create --help
            gdal_footprint --version
            gdal_footprint --help
            gdal_grid --version
            gdal_grid --help
            gdal_rasterize --version
            gdal_rasterize --help
            gdal_translate --version
            gdal_translate --help
            gdal_viewshed --version
            gdal_viewshed --help
            gdaladdo --version
            gdaladdo --help
            gdalbuildvrt --version
            gdalbuildvrt --help
            gdaldem --help
            gdalenhance --version
            gdalinfo --version
            gdalinfo --help
            gdallocationinfo --version
            gdalmanage --version
            gdalmanage --help
            gdalmdiminfo --version
            gdalmdiminfo --help
            gdalmdimtranslate --version
            gdalmdimtranslate --help
            gdalsrsinfo --version
            gdalsrsinfo --help
            gdaltindex --version
            gdaltindex --help
            gdaltransform --version
            gdaltransform --help
            gdalwarp --version
            gdalwarp --help
            gnmanalyse --version
            gnmmanage --version
            nearblack --version
            nearblack --help
            ogr2ogr --version
            ogr2ogr --help
            ogrinfo --version
            ogrinfo --help
            ogrlineref --help
            ogrtindex --help
            setdevenv.sh --version
            setdevenv.sh --help
            sozip --version
            sozip --help

update:
  enabled: true
  release-monitor:
    identifier: 881
