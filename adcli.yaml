package:
  name: adcli
  version: "0.9.3"
  epoch: 0
  description: A helper library and tools for Active Directory client operations
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - cyrus-sasl-dev
      - docbook-xml
      - krb5-dev
      - libtool
      - libxslt-dev
      - openldap-dev
      - pkgconf-dev
      - xmlto

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.freedesktop.org/realmd/adcli.git
      tag: ${{package.version}}
      expected-commit: 755eab49e05d47e560819ad1ec56762bae3511de

  - uses: autoconf/configure
    with:
      opts: --enable-shared

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/bin
      mv "${{targets.destdir}}"/usr/sbin/* "${{targets.destdir}}"/usr/bin
      rmdir "${{targets.destdir}}"/usr/sbin

subpackages:
  - name: adcli-doc
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: adcli
    - name: Test command help output
      runs: |
        adcli info --help
        adcli join --help
        adcli update --help
        adcli testjoin --help
        adcli preset-computer --help
        adcli reset-computer --help
        adcli delete-computer --help
        adcli show-computer --help
        adcli create-msa --help
        adcli create-user --help
        adcli delete-user --help
        adcli passwd-user --help
        adcli create-group --help
        adcli delete-group --help
        adcli add-member --help
        adcli remove-member --help
    - name: Test adcli info command functionality
      runs: |
        adcli info --verbose nonexistent.domain.test 2>&1 | grep -q "Name or service not known"
    - name: Test adcli join command options
      runs: |
        adcli join 2>&1 | grep -q "Couldn't determine the domain name from host name"
    - name: Test user and group management commands
      runs: |
        adcli create-user wolfi 2>&1 | grep -q "Couldn't determine the domain name from host name"

update:
  enabled: true
  git: {}
