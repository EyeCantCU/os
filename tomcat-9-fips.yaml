package:
  name: tomcat-9-fips
  version: 9.0.93
  epoch: 2
  description: Apache Tomcat Web Server
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - tomcat-fips=${{package.full-version}}
    runtime:
      - openjdk-17-jre
      - openjdk-17-default-jvm
      - ${{package.name}}-policy

environment:
  contents:
    packages:
      - ant
      - build-base
      - busybox
      - ca-certificates-bundle
      - openjdk-17
      - openjdk-8
  environment:
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/tomcat
      tag: ${{package.version}}
      expected-commit: a33d708d9b078e0d7bc8abda91c8634c4f338d99

  - uses: patch
    with:
      patches: Enable-FIPS.patch

  - runs: |
      cat <<EOF > build.properties
      skip.installer=true
      base.path=$PWD
      compile.debug=false
      EOF

  - runs: |
      ant

      mkdir -p ${{targets.destdir}}/usr/share/tomcat
      cp LICENSE ${{targets.destdir}}/usr/share/tomcat/

      mkdir -p ${{targets.destdir}}/usr/share/tomcat/bin
      cp output/build/bin/* ${{targets.destdir}}/usr/share/tomcat/bin

      mkdir -p ${{targets.destdir}}/usr/share/tomcat/conf
      cp output/build/conf/* ${{targets.destdir}}/usr/share/tomcat/conf

      mkdir -p ${{targets.destdir}}/usr/share/tomcat/lib
      cp output/build/lib/* ${{targets.destdir}}/usr/share/tomcat/lib

      mkdir -p ${{targets.destdir}}/usr/share/tomcat/logs
      mkdir -p ${{targets.destdir}}/usr/share/tomcat/temp
      mkdir -p ${{targets.destdir}}/usr/share/tomcat/webapps

subpackages:
  # This package includes the manager and host-manager apps.
  # The apps are not directly usable without copying into the webapps directory.
  # See https://github.com/docker-library/tomcat/pull/181 for more context.
  - name: ${{package.name}}-webapps
    dependencies:
      runtime:
        - ${{package.name}}
      provides:
        - tomcat-webapps-fips=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share/tomcat/webapps.dist
          cp -r output/build/webapps/* ${{targets.subpkgdir}}/usr/share/tomcat/webapps.dist/

  - name: ${{package.name}}-policy-140-2
    description: bcfips 140-2 dependencies
    checks:
      disabled:
        - empty
    dependencies:
      runtime:
        - bcfips-policy-140-2-j17
      # Higher than 140-3
      provider-priority: 10
      provides:
        - ${{package.name}}-policy=${{package.full-version}}

  - name: ${{package.name}}-policy-140-3
    description: bcfips 140-3 dependencies
    checks:
      disabled:
        - empty
    dependencies:
      runtime:
        - bcfips-policy-140-3-j17
      # Lower than 140-2
      provider-priority: 5
      provides:
        - ${{package.name}}-policy=${{package.full-version}}

update:
  enabled: true
  ignore-regex-patterns:
    - '-M\d+$'
  github:
    identifier: apache/tomcat
    use-tag: true
    tag-filter: 9.
