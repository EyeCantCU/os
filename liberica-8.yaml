package:
  name: liberica-8
  version: 8.442.7
  epoch: 1
  description: Liberica ${{vars.major-version}} Java development kit
  copyright:
    - license: GPL-2.0-with-classpath-exception
  dependencies:
    runtime:
      - java-cacerts
      - zlib

vars:
  java-home: /usr/lib/jvm/java-1.8-liberica
  boot-jdk: /usr/lib/jvm/java-1.8-adoptium

var-transforms:
  - from: ${{package.version}}
    match: '^(\d+)\.(\d+)\.(\d+)$'
    replace: $1'u'$2+$3
    to: mangled-package-version
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - adoptium-openjdk-${{vars.major-version}}-default-jdk
      - alsa-lib-dev
      - attr-dev
      - autoconf
      - automake
      - bash
      - build-base
      - ca-certificates
      - cairo-dev
      - coreutils
      - cups-dev
      - expat-dev
      - file
      - findutils
      - fontconfig-dev
      - freetype-dev
      - fribidi-dev
      - gawk
      - gdk-pixbuf-dev
      - giflib-dev
      - glib-dev
      - gtk-2.0-dev
      - harfbuzz-dev
      - krb5-dev
      - lcms2-dev
      - libffi-dev
      - libice-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libtool
      - libx11-dev
      - libxcomposite-dev
      - libxext-dev
      - libxft-dev
      - libxi-dev
      - libxinerama-dev
      - libxrandr-dev
      - libxrender-dev
      - libxslt-dev
      - libxt-dev
      - libxtst-dev
      - linux-headers
      - pango-dev
      - patch
      - pkgconf-dev
      - posix-libc-utils
      - sed
      - util-linux-dev
      - wolfi-base
      - zip
      - zlib-dev
  environment:
    EXTRA_CFLAGS: "-w -O2 -Wall -Wno-complain-wrong-lang -Wformat -Wno-cpp -Wno-error -fno-delete-null-pointer-checks -fno-lifetime-dse -fno-strict-overflow -Wno-address -Wno-sign-compare -Wno-int-conversion -Wno-incompatible-pointer-types"
    EXTRA_CXXFLAGS: "-w -O2 -Wall -Wno-complain-wrong-lang -Wno-cpp -fno-delete-null-pointer-checks -fno-lifetime-dse -fno-strict-overflow"

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/bell-sw/Liberica/releases/download/${{vars.mangled-package-version}}/bellsoft-jdk${{vars.mangled-package-version}}-src-full.tar.gz
      expected-sha512: c05c502a545069aea7b86b993882156ebfa21d0dc823015d7eac38aefc5e55d17db613ffa4956048c4e5d6f7d2066477d736388d51b1a368b5b042d8eb184466

  - uses: patch
    with:
      patches: JDK-8281098.patch fix-as-needed-linking.patch

  - working-directory: /home/build/googletest
    pipeline:
      - uses: fetch
        with:
          uri: https://github.com/google/googletest/archive/v1.13.0.tar.gz
          expected-sha512: 70c0cfb1b4147bdecb467ecb22ae5b5529eec0abc085763213a796b7cdbd81d1761d12b342060539b936fa54f345d33f060601544874d6213fdde79111fa813e

  - runs: chmod +x configure

  - uses: autoconf/configure
    with:
      opts: |
        --with-extra-cflags="$EXTRA_CFLAGS" \
        --with-extra-cxxflags="$EXTRA_CXXFLAGS" \
        --disable-precompiled-headers \
        --prefix=${{vars.java-home}} \
        --with-boot-jdk=${{vars.boot-jdk}} \
        --with-debug-level=release \
        --with-jtreg=no \
        --with-jvm-variants=server \
        --with-native-debug-symbols=internal \
        --with-vendor-bug-url=https://chainguard.dev/contact \
        --with-vendor-name=Chainguard \
        --with-vendor-url=https://chainguard.dev \
        --with-vendor-vm-bug-url=https://chainguard.dev/contact \
        --with-zlib=system \
        --with-giflib=system

  - runs: |
      # Build JDK/JRE images
      make images SHELL=/bin/bash

      # Copy JDK
      mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
      cp -r build/*-server-release/jdk/* ${{targets.contextdir}}/${{vars.java-home}}

      # symlink for `java-common` to work (which expects jre in $JAVA_HOME/jre)
      ln -sf . ${{targets.contextdir}}/${{vars.java-home}}/jre

subpackages:
  - name: ${{package.name}}-dbg
    description: Liberica ${{vars.major-version}} Java debug symbols
    pipeline:
      - uses: split/debug
    dependencies:
      runtime:
        - ${{package.name}}
        - java-common

  - name: ${{package.name}}-jre
    description: Liberica ${{vars.major-version}} Java runtime environment
    dependencies:
      runtime:
        - java-cacerts
        - zlib
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          cp -r build/*-server-release/images/j2sdk-image/jre/* ${{targets.contextdir}}/${{vars.java-home}}

          # Symlink to shared java cacerts store
          rm -rf ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts

          ln -sf /etc/ssl/certs/java/cacerts \
            ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts

          # symlink for `java-common` to work (which expects jre in $JAVA_HOME/jre)
          ln -sf . ${{targets.contextdir}}/${{vars.java-home}}/jre

  - name: ${{package.name}}-doc
    description: Liberica ${{vars.major-version}} documentation
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ./build/*-server-release/images/j2sdk-image/man \
            ${{targets.contextdir}}/${{vars.java-home}}

  - name: ${{package.name}}-demos
    description: Liberica ${{vars.major-version}} demos
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ${{targets.destdir}}/${{vars.java-home}}/demo \
             ${{targets.contextdir}}/${{vars.java-home}}

  - name: ${{package.name}}-default-jvm
    description: Use the Liberica ${{vars.major-version}} JVM as the default JVM
    dependencies:
      runtime:
        - ${{package.name}}-jre
        - java-common-jre
      provides:
        - liberica-default-jvm=1.${{vars.major-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib/jvm
          ln -s $(basename ${{vars.java-home}}) ${{targets.contextdir}}/usr/lib/jvm/default-jvm

  - name: ${{package.name}}-default-jdk
    description: Use the Liberica ${{vars.major-version}} JVM as the default JVM with the JDK installed
    dependencies:
      runtime:
        - ${{package.name}}
        - java-common
      provides:
        - liberica-default-jdk=1.${{vars.major-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib/jvm
          ln -s $(basename ${{vars.java-home}}) ${{targets.contextdir}}/usr/lib/jvm/default-jvm

update:
  enabled: true
  version-transform:
    - match: ^(\d+)'u'(\d+)\.(\d+)$
      replace: $1.$2.$3
  github:
    identifier: bell-sw/Liberica
    tag-filter: 8u
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-default-jdk
  pipeline:
    # Test a basic Hello World
    - working-directory: basic
      runs: |
        javac HelloWorld.java
        java HelloWorld | grep -qi "Hello World!"
    # Test a basic HTTP connection
    - working-directory: basic
      runs: |
        javac RequestTest.java
        java RequestTest | grep -qi "Successfully connected to example.org"
    # Test modules
    - working-directory: advanced/module-project
      runs: |
        mkdir output
        javac -d output -sourcepath modules $(find modules -name "*.java")

        # Create a jar with the compiled classes
        jar cvfe app.jar dev.chainguard.module.main.Main \
          -C output . \
          -C modules/ .

        # Test the jar
        java -jar app.jar
