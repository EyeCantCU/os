package:
  name: apparmor
  version: 4.0.3
  epoch: 0
  description: "Mandatory Access Control (MAC) using Linux Security Module (LSM)"
  copyright:
    - license: GPL-2.0-only

vars:
  python-version: 3.13
  ruby-version: 3.4

environment:
  contents:
    packages:
      - autoconf-archive
      - bash
      - bison
      - build-base
      - busybox
      - coreutils
      - flex
      - gettext
      - libtool
      - linux-headers
      - linux-pam-dev
      - perl-dev
      - py${{vars.python-version}}-setuptools
      - python-${{vars.python-version}}
      - python-${{vars.python-version}}-dev
      - ruby-${{vars.ruby-version}}-dev
      - sed # busybox sed doesn't work
      - swig

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/apparmor/apparmor.git
      tag: v${{package.version}}
      expected-commit: b4dfdf50f50ed1d64161424d036a2453645f0cfe

subpackages:
  - name: libapparmor
    dependencies:
      runtime:
        - py${{vars.python-version}}-legacy-cgi
    pipeline:
      - working-directory: libraries/libapparmor
        pipeline:
          - runs: |
              autoreconf -vfi
          - uses: autoconf/configure
            with:
              opts: |
                --sbindir=/usr/bin \
                --with-perl \
                --with-python \
                --with-ruby
          - uses: autoconf/make
          - uses: autoconf/make-install

  - name: apparmor-utils
    dependencies:
      runtime:
        - bash
        - python-${{vars.python-version}} # give /usr/bin/python3 -> python${{vars.python-version}}
        - py${{vars.python-version}}-libapparmor
        - py${{vars.python-version}}-notify2
        - py${{vars.python-version}}-psutil
        - apparmor-parser
    pipeline:
      - working-directory: utils
        pipeline:
          - uses: autoconf/make
          - uses: autoconf/make-install
    test:
      pipeline:
        - runs: |
            aa-easyprof --help
            aa-audit --help
            aa-autodep --help
            aa-cleanprof --help
            aa-complain --help
            aa-decode --help
            aa-disable --help
            aa-enforce --help
            aa-genprof --help
            aa-logprof --help
            aa-mergeprof --help
            aa-notify --help
            aa-remove-unknown --help
            aa-unconfined --help

  - name: apparmor-pam
    pipeline:
      - working-directory: changehat/pam_apparmor
        pipeline:
          - uses: autoconf/make
          - uses: autoconf/make-install
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: apparmor-binutils
    pipeline:
      - working-directory: binutils
        pipeline:
          - uses: autoconf/make
          - uses: autoconf/make-install
    test:
      pipeline:
        - runs: |
            aa-enabled --help || [ $? == 1 ]
            aa-exec --help
            aa-features-abi --help
            aa-load --help
            aa-status --help
            apparmor_status --help

  - name: libapparmor-dev
    pipeline:
      - uses: split/dev
        with:
          package: libapparmor
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: libapparmor-doc
    pipeline:
      - uses: split/manpages
        with:
          package: libapparmor
    test:
      pipeline:
        - uses: test/docs

  - name: py${{vars.python-version}}-libapparmor
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/
          mv ${{targets.subpkgdir}}/../libapparmor/usr/lib/python* ${{targets.subpkgdir}}/usr/lib/
    test:
      pipeline:
        - uses: python/import
          with:
            imports: import LibAppArmor

  - name: ruby-libapparmor
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/
          mv ${{targets.subpkgdir}}/../libapparmor/usr/lib/ruby ${{targets.subpkgdir}}/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: perl-libapparmor
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv ${{targets.subpkgdir}}/../libapparmor/usr/lib/perl* ${{targets.subpkgdir}}/usr/lib/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: apparmor-binutils-doc
    pipeline:
      - uses: split/manpages
        with:
          package: apparmor-binutils

  - name: apparmor-parser
    pipeline:
      - working-directory: parser
        pipeline:
          - uses: autoconf/make
          - uses: autoconf/make-install
          - name: "Fixup usr merge"
            runs: |
              mkdir -p ${{targets.subpkgdir}}/usr/sbin
              mv ${{targets.subpkgdir}}/sbin/* ${{targets.subpkgdir}}/usr/sbin/
              rmdir ${{targets.subpkgdir}}/sbin/
    test:
      pipeline:
        - runs: |
            # Needs kernel support
            apparmor_parser || [ $? == 1 ]

  - name: apparmor-parser-dev
    pipeline:
      - uses: split/dev
        with:
          package: apparmor-parser

  - name: apparmor-parser-doc
    pipeline:
      - uses: split/manpages
        with:
          package: apparmor-parser

  - name: apparmor-utils-doc
    pipeline:
      - uses: split/manpages
        with:
          package: apparmor-parser

update:
  enabled: true
  git:
    strip-prefix: v
