package:
  name: mattmoor-chainit
  version: 0.0.7
  epoch: 2
  description: Experimental init system implementing apko semantics.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mattmoor/chainit
      tag: v${{package.version}}
      expected-commit: bdd94ed2485a3af6220477110f29a2b7d4bbb670

  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.33.0

  - uses: go/build
    with:
      packages: .
      output: chainit

  - uses: strip

subpackages:
  - name: "${{package.name}}-init"
    description: "Symlinks to make chainit the init system."
    dependencies:
      runtime:
        - mattmoor-chainit
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/etc ${{targets.subpkgdir}}/sbin
          ln -s /usr/bin/chainit ${{targets.subpkgdir}}/init
          ln -s /usr/bin/chainit ${{targets.subpkgdir}}/sbin/init

update:
  enabled: true
  github:
    identifier: mattmoor/chainit
    strip-prefix: v
