package:
  name: mattmoor-chainit
  version: "0.0.9"
  epoch: 23
  description: Experimental init system implementing apko semantics.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - merged-sbin
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mattmoor/chainit
      tag: v${{package.version}}
      expected-commit: 6fa43135006701853fc3616ef857215f5414dadd

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      packages: .
      output: chainit

  - uses: strip

subpackages:
  - name: "${{package.name}}-init"
    description: "Symlinks to make chainit the init system."
    dependencies:
      runtime:
        - mattmoor-chainit
        - merged-sbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/etc ${{targets.subpkgdir}}/usr/bin
          ln -s /usr/bin/chainit ${{targets.subpkgdir}}/init
          ln -s /usr/bin/chainit ${{targets.subpkgdir}}/usr/bin/init

update:
  enabled: true
  github:
    identifier: mattmoor/chainit
    strip-prefix: v
