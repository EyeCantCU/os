package:
  name: kiam
  version: 4.2
  epoch: 30 # CVE-2025-61725
  description: Integrate AWS IAM with Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - iptables

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-1.25

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/uswitch/kiam
      tag: v${{package.version}}
      expected-commit: b795246b4a42200a3d67797dd0507564c0d9d32b

  - uses: patch
    with:
      patches: GHSA-m425-mq94-257g.patch

  - uses: go/bump
    with:
      deps: |-
        github.com/gogo/protobuf@v1.3.2
        github.com/prometheus/client_golang@v1.11.1
        google.golang.org/grpc@v1.56.3
        google.golang.org/protobuf@v1.33.0
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0

  - runs: |
      go build -o ${{targets.destdir}}/usr/bin/kiam ./cmd/kiam

  - uses: strip

subpackages:
  - name: "kiam-compat"
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    pipeline:
      - runs: |
          # The helm chart expects the kiam binaries to be in / instead of /usr/bin
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/kiam ${{targets.subpkgdir}}/kiam
      - uses: strip
    test:
      pipeline:
        - runs: |
            readlink -v /kiam

update:
  enabled: true
  github:
    identifier: uswitch/kiam
    strip-prefix: v

test:
  pipeline:
    - runs: |
        kiam --help
