package:
  name: py3-nvidia-cudnn-frontend-cuda-13.0
  version: "1.17.0"
  epoch: 0
  description: The cuDNN FrontEnd(FE) API is a C++ header-only library and python frontend to the cuDNN C backend API.
  copyright:
    - license: Apache-2.0
  resources:
    memory: 128Gi

vars:
  cudnn-version: 9
  package-name: nvidia-cudnn-frontend
  import: cudnn

var-transforms:
  - from: ${{package.name}}
    match: '.*frontend-cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{vars.cuda-version}}
    match: (\d+)\.\d+
    replace: $1
    to: cuda-major-version

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake-3
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - ninja
      - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}-dev
      - posix-libc-utils
      - py3-supported-build-base-dev
      - py3-supported-pybind11
      - py3-supported-setuptools
      - py3-supported-wheel
  environment:
    CUDAToolkit_ROOT: /usr/local/cuda-${{vars.cuda-version}}
    CUDNN_PATH: /usr/local/cudnn-${{vars.cudnn-version}}
    CXXFLAGS: -Wno-array-bounds
    CFLAGS: -Wno-array-bounds

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/cudnn-frontend
      tag: v${{package.version}}
      expected-commit: b372d39879d44c91a8d5b342022e74802b6a8da2

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.package-name}}-cuda-${{vars.cuda-version}}
    description: python${{range.key}} version of ${{vars.package-name}}
    dependencies:
      runtime:
        - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}
        - py${{range.key}}-torch-cuda-${{vars.cuda-version}}
    pipeline:
      - runs: |
          # By default, upstream will build against the latest available Python
          # version: ensure it builds with the version we're building for
          sed -i 's/Python 3.[0-9]\+/Python ${{range.key}} EXACT/' python/CMakeLists.txt
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.package-name}}-cuda-${{vars.cuda-version}}
    description: meta package providing ${{vars.package-name}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.package-name}}-cuda-${{vars.cuda-version}}
        - py3.11-${{vars.package-name}}-cuda-${{vars.cuda-version}}
        - py3.12-${{vars.package-name}}-cuda-${{vars.cuda-version}}
        - py3.13-${{vars.package-name}}-cuda-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: NVIDIA/cudnn-frontend
    strip-prefix: v
