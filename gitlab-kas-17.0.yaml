package:
  name: gitlab-kas-17.0
  version: 17.0.6
  epoch: 0
  description: GitLab KAS is a component installed together with GitLab. It is required to manage the GitLab agent for Kubernetes.
  copyright:
    - license: MIT
  dependencies:
    provides:
      - gitlab-kas=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/gitlab-org/cluster-integration/gitlab-agent
      tag: v${{package.version}}
      expected-commit: 238cee1fd513d65d6186d27736794a3162f4d89f

  - uses: go/bump
    with:
      deps: github.com/hashicorp/go-retryablehttp@v0.7.7

  - uses: go/build
    with:
      packages: ./cmd/kas
      output: kas
      ldflags: "-w -X gitlab.com/gitlab-org/cluster-integration/gitlab-agent/v17/cmd.Version=v${{package.version}} -X gitlab.com/gitlab-org/cluster-integration/gitlab-agent/v17/cmd.Commit=v${{package.version}}"

update:
  enabled: true
  github:
    identifier: gitlabhq/gitlabhq
    strip-prefix: v
    use-tag: true
    tag-filter: v17.0
