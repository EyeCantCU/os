package:
  name: py3-simple-websocket
  version: "1.1.0"
  epoch: 0
  description: Simple WebSocket server and client for Python
  copyright:
    - license: MIT

vars:
  pypi-package: simple-websocket
  import: simple_websocket

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/miguelgrinberg/simple-websocket
      tag: v${{package.version}}
      expected-commit: d44409d9a76278c3d8ad6dbbcaeb40277f0b8d42

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-flask
        - py${{range.key}}-wsproto
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            from flask import Flask, request
            from simple_websocket import ConnectionClosed, Server as SWServer

            app = Flask(__name__)

            @app.route('/echo', websocket=True)
            def echo():
                ws = SWServer.accept(request.environ)
                try:
                    msg = ws.receive()
                    ws.send(msg)
                except ConnectionClosed:
                    pass
                return ''

            client = app.test_client()

            ws = client.open('/echo', headers=[('Upgrade', 'websocket'),
                                                ('Connection', 'Upgrade'),
                                                ('Sec-WebSocket-Version', '13'),
                                                ('Sec-WebSocket-Key', 'test')])
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: miguelgrinberg/simple-websocket
    strip-prefix: v
