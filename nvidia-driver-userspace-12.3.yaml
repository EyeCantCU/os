#nolint:valid-spdx-license
package:
  name: nvidia-driver-userspace-12.3
  version: 545.23.08
  epoch: 50
  description: NVIDIA driver (userspace)
  copyright:
    - license: LicenceRef-NVIDIA-DRIVER
      license-path: LICENSE
  dependencies:
    provides:
      - nvidia-driver-userspace=${{package.full-version}}
    runtime:
      # require libglvnd explicitly for apko to resolve dependencies ; https://github.com/chainguard-dev/internal-dev/issues/7748
      - libglvnd
      - merged-lib
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: https://developer.download.nvidia.com/compute/cuda/redist/nvidia_driver/linux-sbsa/nvidia_driver-linux-sbsa-${{package.version}}-archive.tar.xz
          expected-sha256: 2a7afa5648131b4ad04c566a6177aa93cd506849d89474f1627bf9fa9d245399
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: https://developer.download.nvidia.com/compute/cuda/redist/nvidia_driver/linux-x86_64/nvidia_driver-linux-x86_64-${{package.version}}-archive.tar.xz
          expected-sha256: cccca4ef72d9e2ac5e61f8c3338b6fc1570bfc9592f99a5f35cfbeffa7a6d893
          timeout: 30

  - working-directory: ${{targets.destdir}}/usr/bin
    runs: |
      mv /home/build/bin/* .

  - working-directory: ${{targets.destdir}}/usr/lib
    runs: |
      mv /home/build/lib/* .
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        runs: |
          rm libnvidia-gtk3.* libnvidia-pkcs11-openssl3.* libnvidia-pkcs11.* libnvidia-wayland-client.*

  - working-directory: ${{targets.destdir}}/usr/share/nvidia
    runs: |
      mv /home/build/etc/nvidia-application-profiles* .

data:
  - name: libs
    items:
      EGL_nvidia: Embedded GL (NVIDIA)
      GLESv1_CM_nvidia: OpenGLES v1 (NVIDIA)
      GLESv2_nvidia: OpenGLES v2 (NVIDIA)
      GLX_nvidia: GLX (NVIDIA)
      cuda: CUDA runtime
      cudadebugger: CUDA debugging
      nvcuvid: Video decoding
      nvidia-allocator: Memory allocation
      nvidia-api: API
      nvidia-cfg: Configuration
      nvidia-egl-gbm: GBM implementation for EGL
      nvidia-egl-wayland: Wayland implementation for EGL
      nvidia-eglcore: EGL core
      nvidia-encode: Video encoding
      nvidia-fbc: Framebuffer capture
      nvidia-glcore: OpenGL core
      nvidia-glsi: OpenGL shader interpreter
      nvidia-glvkspirv: Vulkan SPIR-V shader interpreter
      nvidia-gtk2: GTK2
      nvidia-ml: Machine learning
      nvidia-ngx: NGX
      nvidia-nvvm: LLVM for CUDA
      nvidia-opencl: CUDA/OpenCL bridge
      nvidia-opticalflow: Optical flow
      nvidia-ptxjitcompiler: PTX JIT compiler
      nvidia-rtcore: Runtime core
      nvidia-tls: Thread local support
      nvoptix: Ray-tracing engine
      vdpau_nvidia: NVIDIA VDPAU backend

  - name: stubs
    items:
      EGL: Embedded GL (stub)
      GL: OpenGL (stub)
      GLESv1_CM: OpenGLES v1 (stub)
      GLESv2: OpenGLES v2 (stub)
      GLX: GLX (stub)
      GLdispatch: OpenGL dispatch (stub)
      OpenCL: OpenCL (stub)
      OpenGL: OpenGL (stub)

subpackages:
  - name: nvidia-tools-${{vars.cuda-version}}
    description: Various NVIDIA tools such as nvidia-debugdump
    pipeline:
      - working-directory: ${{targets.subpkgdir}}/usr/bin
        runs: |
          mv /home/build/sbin/* .
    dependencies:
      provides:
        - nvidia-tools=${{package.full-version}}
      runtime:
        - merged-lib
        - merged-usrsbin
        - wolfi-baselayout

  - name: nvidia-firmware-${{vars.cuda-version}}
    description: Firmware for NVIDIA GPUs
    pipeline:
      - working-directory: ${{targets.subpkgdir}}/usr/lib/firmware/nvidia/${{package.version}}
        runs: |
          mv /home/build/firmware/*.bin .
    dependencies:
      provides:
        - nvidia-firmware=${{package.full-version}}
      runtime:
        - merged-lib
        - merged-usrsbin
        - wolfi-baselayout

  - name: nvidia-driver-${{vars.cuda-version}}
    description: Meta-package for NVIDIA driver and firmware
    dependencies:
      runtime:
        - merged-usrsbin
        - merged-lib
        - nvidia-driver-userspace-${{vars.cuda-version}}
        - nvidia-firmware-${{vars.cuda-version}}
        - wolfi-baselayout
      provides:
        - nvidia-driver=${{package.full-version}}

  - name: nvidia-x11-config-${{vars.cuda-version}}
    description: NVIDIA X11 configuration tool
    pipeline:
      - working-directory: ${{targets.subpkgdir}}/usr/bin
        runs: |
          mv ${{targets.destdir}}/usr/bin/nvidia-settings .
          mv ${{targets.destdir}}/usr/bin/nvidia-xconfig .
    dependencies:
      runtime:
        - merged-lib
        - merged-usrsbin
        - wolfi-baselayout

  - range: libs
    name: nvidia-lib${{range.key}}-${{vars.cuda-version}}
    description: NVIDIA ${{range.value}} library
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib/lib${{range.key}}.so.* ${{targets.subpkgdir}}/usr/lib
    dependencies:
      provides:
        - nvidia-lib${{range.key}}=${{package.full-version}}
      runtime:
        - merged-lib
        - merged-usrsbin
        - wolfi-baselayout

  - range: stubs
    name: nvidia-lib${{range.key}}-${{vars.cuda-version}}
    description: NVIDIA ${{range.value}} library
    dependencies:
      replaces:
        - mesa-gl
        - mesa-glx
        - mesa-egl
        - mesa-gles
      runtime:
        - merged-usrsbin
        - merged-lib
        - wolfi-baselayout
    options:
      no-provides: true
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv ${{targets.destdir}}/usr/lib/lib${{range.key}}.so.* ${{targets.subpkgdir}}/usr/lib

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  # TODO(kaniini): Work with NVIDIA to figure out a way to monitor their releases
  # directly.
  enabled: false

test:
  pipeline:
    - uses: test/tw/ldd-check
