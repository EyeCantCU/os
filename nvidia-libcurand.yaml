package:
  name: libcurand
  version: 12.3.101
  epoch: 0
  description: CUDA cuRAND
  copyright:
    - license: PROPRIETARY
environment:
  contents:
    packages:
      - busybox
pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/libcurand/linux-sbsa/libcurand-linux-sbsa-10.3.4.101-archive.tar.xz"
          expected-sha256: "d077c695f4dfe60e7f6b6e2d5cdc8ecd5a7971b0803ea3687071cf46c3162f5c"
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/libcurand/linux-x86_64/libcurand-linux-x86_64-10.3.4.101-archive.tar.xz"
          expected-sha256: "5cae43cdab5a39dc9c31ecdec4765cc47aa3c097eb49c3b4ebe15a9fa2a81a73"
  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/
      ln -s /usr/local/cuda-12.3 ${{targets.destdir}}/usr/local/cuda-12
      ln -s /usr/local/cuda-12.3 ${{targets.destdir}}/usr/local/cuda
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.3/
      mv include ${{targets.destdir}}/usr/local/cuda-12.3/
      mv lib ${{targets.destdir}}/usr/local/cuda-12.3/
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.3/
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/pkgconfig/
      mv pkg-config/* ${{targets.destdir}}/usr/share/pkgconfig/
      sed -i 's|targets/.*-linux/||g' ${{targets.destdir}}/usr/share/pkgconfig/*
update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
