package:
  name: dragonfly
  version: 1.20.1
  epoch: 0
  description: A modern replacement for Redis and Memcached
  copyright:
    - license: BUSL-1.1
  resources:
    cpu: 8
    memory: 16Gi

environment:
  contents:
    packages:
      - autoconf
      - automake
      - bash
      - bison
      - boost
      - boost-dev
      - boost-fiber
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - libunwind-dev
      - libtool
      - libxml2-dev
      - ninja
      - openssl-dev
      - patch
      - python3
      - zstd-dev
  accounts:
    groups:
      - groupname: dfly
        gid: 10000
    users:
      - username: dfly
        uid: 10000

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/dragonflydb/dragonfly
      tag: v${{package.version}}
      expected-commit: 501b7f7b4fb049de2a8a5fff15d945cd7da1046a

  - runs: git submodule update --init --recursive

  - runs: |
      ./helio/blaze.sh -release

  - runs: |
      cd build-opt && ninja dragonfly

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      mv build-opt/dragonfly ${{targets.destdir}}/usr/bin

  - uses: strip

subpackages:
  - name: dragonfly-oci-compat
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv tools/docker/entrypoint.sh ${{targets.subpkgdir}}/usr/bin
          chmod +x ${{targets.subpkgdir}}/usr/bin/entrypoint.sh

          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          mv tools/docker/healthcheck.sh ${{targets.subpkgdir}}/usr/local/bin
          chmod +x ${{targets.subpkgdir}}/usr/local/bin/healthcheck.sh
    dependencies:
      runtime:
        - su-exec
        - redis-cli
        - redis-benchmark-7.2
        # needed for the healthcheck.sh script
        - netcat-openbsd
        - net-tools
        - openssl
        - busybox

update:
  enabled: true
  github:
    identifier: dragonflydb/dragonfly
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - wolfi-base
        - dragonfly-oci-compat
  pipeline:
    - runs: |
        dragonfly --help | grep "dragonfly: a modern in-memory store."
    - runs: |
        # Start in the background
        dragonfly&
        sleep 2
        if pgrep -x "dragonfly" > /dev/null
        then
            echo "Dragonfly is running correctly."
        else
            echo "Dragonfly its not running."
        fi
