package:
  name: nvidia-cuda-nvcc-12.4
  version: 12.4.131
  epoch: 9
  description: CUDA NVCC
  copyright:
    - license: PROPRIETARY

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

vars:
  gcc-major-version: 13

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/linux-sbsa/cuda_nvcc-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "83f130dab0325e12b90fdf1279c0cbbd88acf638ef0a7e0cad72d50855a4f44a"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/linux-x86_64/cuda_nvcc-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "7ffba1ada0e4b8c17e451ac7a60d386aa2642ecd08d71202a0b100c98bd74681"
          timeout: 30

  # Without this patch nvcc will not work with glibc 2.41 an newer, as their
  # recently added C23 math functions conflict with CUDA header definitions.
  # glibc 2.42 introduced the same problem with yet another math function.
  - uses: patch
    with:
      patches: math_functions_glibc_2.41.patch math_functions_glibc_2.42.patch

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv include ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv lib ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE
      mv bin ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv nvvm ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
      - if: ${{build.arch}} == 'aarch64'
        runs: |
          # Override bits/math-vector.h for aarch64 as latest glibc ships symbols that nvcc
          # does not export ; more details:
          # https://bugs.launchpad.net/ubuntu/+source/glibc/+bug/2033747
          # https://github.com/OE4T/meta-tegra/commit/981245c8bf3164f16bd7f52fca6ea9c9fa8c349a
          mkdir -p "${{targets.contextdir}}/usr/local/cuda-12.4/include/bits"
          install -m644 math-vector.h "${{targets.contextdir}}/usr/local/cuda-12.4/include/bits/math-vector.h"
    dependencies:
      runtime:
        - ${{package.name}}

  - name: nvidia-cuda-nvcc-gcc-${{vars.cuda-version}}
    description: ${{package.name}} configured to use compatible gcc
    dependencies:
      runtime:
        - ${{package.name}}
        - gcc-${{vars.gcc-major-version}}
    pipeline:
      - runs: |
          cuda_home="/usr/local/cuda-${{vars.cuda-version}}"
          mkdir -p "${{targets.contextdir}}$cuda_home/bin"
          for cmd in gcc g++; do
            wrapper="${{targets.contextdir}}$cuda_home/bin/$cmd"
            cat > "$wrapper" << EOF
          #!/bin/sh
          exec ${cmd}-${{vars.gcc-major-version}} "\$@"
          EOF
            chmod +x "$wrapper"
          done
    test:
      environment:
        contents:
          packages:
            - nvidia-cuda-cudart-${{vars.cuda-version}}-dev
            - nvidia-cuda-nvcc-${{vars.cuda-version}}-dev
      pipeline:
        - runs: |
            cuda_home="/usr/local/cuda-${{vars.cuda-version}}"
            tmpdir="$(mktemp -d)"
            trap "rm -rf $tmpdir" EXIT
            cd "$tmpdir"
            cat > gcc-version.cu << EOF
            #include <iostream>

            int main() {
              std::cout << __GNUC__ << "\n";
            }
            EOF
            "$cuda_home/bin/nvcc" gcc-version.cu -o gcc-version
            [ "$(./gcc-version)" = "${{vars.gcc-major-version}}" ]

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false

test:
  environment:
    contents:
      packages:
        - gcc-11-default
        - build-base
        - nvidia-cuda-cudart-12.4-dev
        - ${{package.name}}-dev
  pipeline:
    - uses: test/tw/ldd-check
    - name: Test .c files can be compiled
      runs: |
        cat <<EOF >/tmp/test-c.c
        #include <math.h>
        int main() {
          return 0;
        }
        EOF
        /usr/local/cuda-12.4/bin/nvcc -o /tmp/test-c /tmp/test-c.c
        /tmp/test-c
    - name: Test .cu files can be compiled
      runs: |
        cat <<EOF >/tmp/test-cu.cu
        #include <math.h>
        int main() {
          return 0;
        }
        EOF
        /usr/local/cuda-12.4/bin/nvcc -o /tmp/test-cu /tmp/test-cu.cu
        /tmp/test-cu
