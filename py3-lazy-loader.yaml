package:
  name: py3-lazy-loader
  version: 0.4
  epoch: 0
  description: Populate library namespace without incurring immediate import costs
  copyright:
    - license: MIT

vars:
  pypi-package: lazy-loader
  import: lazy_loader

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/scientific-python/lazy-loader.git
      tag: v${{package.version}}
      expected-commit: 4596986a8d276d19e2ad8713ec4fb8329d743a08

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-packaging
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
