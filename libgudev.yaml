package:
  name: libgudev
  version: "238"
  epoch: 0
  description: GObject-based wrapper library for libudev
  copyright:
    - license: LGPL-2.1-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - eudev-dev
      - glib-dev
      - meson

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.gnome.org/GNOME/libgudev.git
      tag: ${{package.version}}
      expected-commit: 145c32a01c22afa13fe20e6b4b6b27153451840d

  - uses: meson/configure
    with:
      opts: |
        -Dtests=disabled \
        -Dintrospection=disabled \
        -Dvapi=disabled \
        -Dgtk_doc=false

  - uses: meson/compile

  - uses: meson/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
        - libudev-dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Verify libgudev library
      runs: |
        set -euo pipefail
        stat /usr/lib/libgudev-1.0.so*
        echo "libgudev library test passed"

update:
  enabled: true
  git:
    strip-prefix: ""
