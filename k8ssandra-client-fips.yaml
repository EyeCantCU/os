package:
  name: k8ssandra-client-fips
  version: "0.8.5"
  epoch: 0 # CVE-2025-61729
  description: A kubectl plugin to simplify usage of k8ssandra.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e18850cdd7902d9be32d8e67e05193fd584a1217
      repository: https://github.com/k8ssandra/k8ssandra-client
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      output: kubectl-k8ssandra
      packages: ./cmd/kubectl-k8ssandra
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: k8ssandra/k8ssandra-client
    strip-prefix: v

test:
  pipeline:
    - runs: |
        kubectl-k8ssandra --help
    - uses: test/go-fips-check
