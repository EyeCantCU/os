package:
  name: k8ssandra-client-fips
  version: "0.8.4"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: A kubectl plugin to simplify usage of k8ssandra.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: bd315c361bf971863da6d60c5e2f86e7cc4e4fc6
      repository: https://github.com/k8ssandra/k8ssandra-client
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      modroot: .
      output: kubectl-k8ssandra
      packages: ./cmd/kubectl-k8ssandra
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: k8ssandra/k8ssandra-client
    strip-prefix: v

test:
  pipeline:
    - runs: |
        kubectl-k8ssandra --help
    - uses: test/go-fips-check
