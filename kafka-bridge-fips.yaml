package:
  name: kafka-bridge-fips
  version: 0.33.1
  epoch: 0
  description: HTTP-based bridge for Apache Kafka using Vert.x framework (FIPS mode)
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - bcfips-policy-140-3-j${{vars.java-version}}
      - ca-certificates-bundle
      - gawk
      - openjdk-${{vars.java-version}}-default-jvm
      - openssl-config-fipshardened

vars:
  java-version: 17

environment:
  contents:
    packages:
      - bcfips-policy-140-3-j${{vars.java-version}}
      - bouncycastle-fips~2.1
      - busybox
      - ca-certificates-bundle
      - maven
      - openjdk-${{vars.java-version}}-default-jdk
      - unzip
  environment:
    JAVA_HOME: /usr/lib/jvm/java-${{vars.java-version}}-openjdk
    MAVEN_OPTS: -Xmx2g

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/strimzi/strimzi-kafka-bridge
      tag: ${{package.version}}
      expected-commit: fc96ea42b24459837f5aebc0ef5dca559a6cee49

  - uses: maven/pombump
    with:
      properties-file: pombump-properties.yaml

  - runs: |
      mvn clean install -DskipTests -Dmaven.javadoc.skip=true

  - runs: |
      mkdir -p "${{targets.destdir}}/opt/strimzi"

      cd "${{targets.destdir}}/opt/strimzi"
      unzip -q /home/build/target/kafka-bridge-${{package.version}}.zip
      cp -r "kafka-bridge-${{package.version}}/." ./
      rm -rf "kafka-bridge-${{package.version}}"

      mkdir -p "${{targets.destdir}}/opt/strimzi/bin/docker"
      cp /home/build/bin/docker/kafka_bridge_run.sh "${{targets.destdir}}/opt/strimzi/bin/docker/"
      cp /home/build/bin/docker/dynamic_resources.sh "${{targets.destdir}}/opt/strimzi/bin/docker/"
      cp /home/build/bin/docker/kafka_bridge_tls_prepare_certificates.sh "${{targets.destdir}}/opt/strimzi/bin/docker/"
      cp /home/build/bin/docker/to_bytes.gawk "${{targets.destdir}}/opt/strimzi/bin/docker/"

      chmod +x "${{targets.destdir}}/opt/strimzi/bin"/*.sh
      chmod +x "${{targets.destdir}}/opt/strimzi/bin/docker"/*.sh
      chmod +x "${{targets.destdir}}/opt/strimzi/bin/docker"/*.gawk

test:
  environment:
    contents:
      packages:
        - curl
        - jq
        - openjdk-${{vars.java-version}}-default-jvm
        - wait-for-it
    environment:
      JAVA_HOME: /usr/lib/jvm/default-jvm
      JDK_JAVA_OPTIONS: "-Djavax.net.ssl.trustStoreType=FIPS"
      LANG: en_US.UTF-8
      STRIMZI_HOME: /opt/strimzi
      HTTP_PORT: "8080"
  pipeline:
    - name: Check installation files
      runs: |
        set -euo pipefail
        stat /opt/strimzi/bin/
        stat /opt/strimzi/libs/
        stat /opt/strimzi/config/

        test -x /opt/strimzi/bin/kafka_bridge_run.sh

        test -f /opt/strimzi/bin/docker/kafka_bridge_run.sh
        test -f /opt/strimzi/bin/docker/dynamic_resources.sh
        test -f /opt/strimzi/bin/docker/kafka_bridge_tls_prepare_certificates.sh
        test -f /opt/strimzi/bin/docker/to_bytes.gawk

        test -f /opt/strimzi/config/application.properties
        test -f /opt/strimzi/config/log4j2.properties

        test -f /opt/strimzi/libs/bc-fips.jar
    - uses: java-fips/algorithms
      with:
        java-version: ${{vars.java-version}}
    - uses: test/daemon-check-output
      with:
        setup: |
          tee /tmp/bridge-config.properties << EOF
          bridge.id=test-bridge-fips
          bridge.metrics=jmxPrometheusExporter
          kafka.bootstrap.servers=localhost:9092
          http.host=0.0.0.0
          http.port=${HTTP_PORT}
          kafka.producer.acks=1
          kafka.consumer.auto.offset.reset=earliest
          EOF
        start: /opt/strimzi/bin/kafka_bridge_run.sh --config-file=/tmp/bridge-config.properties
        timeout: 60
        expected_output: |
          Strimzi Kafka Bridge
          HTTP-Kafka Bridge started and listening on port
          HTTP verticle instance
        post: |
          set -o pipefail
          wait-for-it localhost:${HTTP_PORT} --timeout=30
          sleep 10

          curl -fsS http://localhost:${HTTP_PORT}/ | grep -F bridge_version
          curl -fsS http://localhost:${HTTP_PORT}/metrics | grep -F jvm_memory_used_bytes

update:
  enabled: true
  ignore-regex-patterns:
    - '-rc'
  github:
    identifier: strimzi/strimzi-kafka-bridge
    use-tag: true
