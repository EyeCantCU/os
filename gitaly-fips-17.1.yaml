# source is gitlab so we can't use github updates to get expected commit
# let's still auto create the PR, it will fail as expected commit will be wrong
# however it will be easy to fix
#nolint:git-checkout-must-use-github-updates
package:
  name: gitaly-fips-17.1
  version: 17.1.2
  epoch: 1
  description:
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox
      - go-fips
      - make
  environment:
    CGO_ENABLED: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/gitlab-org/gitaly.git
      tag: v${{package.version}}
      expected-commit: 02bd57433f92c18bd589f3715f210b58642ce458

  - uses: go/bump
    with:
      deps: github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 google.golang.org/grpc@v1.64.1

  - runs: |
      EE=true make install DESTDIR="${{targets.destdir}}" PREFIX=/usr

  - uses: strip

subpackages:
  - name: gitaly-init-cgroups-17.1-fips
    # https://gitlab.com/gitlab-org/build/CNG/-/blob/master/gitaly-init-cgroups/Dockerfile
    description: gitaly-init-cgroups
    dependencies:
      provides:
        - gitaly-init-cgroups-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          packages: .
          modroot: ./tools/gitaly-init-cgroups/
          output: setup_cgroups
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: "^gitaly-init-cgroups"

update:
  enabled: true
  release-monitor:
    identifier: 373181

test:
  pipeline:
    - runs: |
        gitaly -v | grep "${{package.version}}"
        gitaly-blackbox -version | grep "${{package.version}}"
        gitaly-backup -v | grep "${{package.version}}"
    - uses: test/go-fips-check
