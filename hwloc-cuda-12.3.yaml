package:
  name: hwloc-cuda-12.3
  version: "2.12.1"
  epoch: 0
  description: Portable abstraction of hierarchical hardware architectures with CUDA support
  copyright:
    - license: BSD-3-Clause
  dependencies:
    replaces:
      - hwloc
    provides:
      - hwloc=${{package.version}}
    runtime:
      - cairo
      - eudev-libs
      - libxml2
      - merged-usrsbin
      - ncurses
      - numactl
      - nvidia-cuda-cudart-${{vars.cuda-version}}
      - nvidia-libnvidia-ml-${{vars.cuda-version}}
      - wolfi-baselayout
  options:
    no-depends: true

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - cairo-dev
      - eudev-dev
      - libxml2-dev
      - ncurses-dev
      - nvidia-cuda-cudart-${{vars.cuda-version}}
      - nvidia-cuda-cudart-${{vars.cuda-version}}-dev
      - nvidia-cuda-nvcc-${{vars.cuda-version}}
      - nvidia-cuda-nvcc-${{vars.cuda-version}}-dev
      - nvidia-cuda-nvml-dev-${{vars.cuda-version}}
  environment:
    CUDA_HOME: "/usr/local/cuda-${{vars.cuda-version}}"

var-transforms:
  - from: ${{package.version}}
    match: (\d+\.\d+)\.\d+
    replace: $1
    to: mangled-package-version
  - from: ${{package.name}}
    match: .*cuda-(\d+\.\d+)
    replace: $1
    to: cuda-version

pipeline:
  - uses: fetch
    with:
      expected-sha256: 38a90328bb86259f9bb2fe1dc57fd841e111d1e6358012bef23dfd95d21dc66b
      uri: https://download.open-mpi.org/release/hwloc/v${{vars.mangled-package-version}}/hwloc-${{package.version}}.tar.bz2

  - uses: autoconf/configure
    with:
      opts: |
        LDFLAGS="-L/usr/local/cuda-${{vars.cuda-version}}/lib64/" \
        --with-cuda-version=${{vars.cuda-version}} \
        --with-cuda=/usr/local/cuda-${{vars.cuda-version}} \
        --enable-plugins

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      if [[ "${{build.arch}}" == "x86_64" ]]; then
        mkdir -p ${{targets.destdir}}/usr/bin
        mv ${{targets.destdir}}/usr/sbin/* ${{targets.destdir}}/usr/bin
        rmdir ${{targets.destdir}}/usr/sbin
      fi

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
        - merged-usrsbin
        - wolfi-baselayout
      replaces:
        - hwlock-dev
      provides:
        - hwloc-dev=${{package.version}}
    description: hwloc dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    dependencies:
      replaces:
        - hwlock-doc
      provides:
        - hwloc-doc=${{package.version}}
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - uses: split/manpages
    description: hwloc manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  ignore-regex-patterns:
    - -branch$
  github:
    identifier: open-mpi/hwloc
    strip-prefix: hwloc-
    tag-filter-prefix: hwloc-
    use-tag: true

test:
  environment:
    environment:
      CUDA_HOME: "/usr/local/cuda-${{vars.cuda-version}}"
  pipeline:
    - if: ${{build.arch}} == 'x86_64'
      name: hwloc-gather-cpuid version and help tests
      runs: |
        hwloc-gather-cpuid --version
        hwloc-gather-cpuid --help
        hwloc-dump-hwdata --version
        hwloc-dump-hwdata --help
    - name: General version and help tests
      runs: |
        hwloc-ls
        hwloc-annotate --version
        hwloc-annotate --help
        hwloc-bind --version
        hwloc-bind --help
        hwloc-calc --version
        hwloc-calc --help
        hwloc-compress-dir --version
        hwloc-compress-dir --help
        hwloc-diff --version
        hwloc-diff --help
        hwloc-distrib --version
        hwloc-distrib --help
        hwloc-gather-topology --version
        hwloc-gather-topology --help
        hwloc-info --version
        hwloc-info --help
        hwloc-ls --version
        hwloc-ls --help
        hwloc-patch --version
        hwloc-patch --help
        hwloc-ps --version
        hwloc-ps --help
        lstopo --version
        lstopo --help
        lstopo-no-graphics --version
        lstopo-no-graphics --help
    - uses: test/tw/ldd-check
