package:
  name: flux-helm-controller-fips
  version: "1.4.4"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: The GitOps Toolkit Helm reconciler, for declarative Helming
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 2c4a7567cd3913e3134d239bb8dd9d6a16a3e3b4
      repository: https://github.com/fluxcd/helm-controller
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      ldflags: -X main.Version=${{package.version}}
      output: helm-controller
      packages: .
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - api/
  github:
    identifier: fluxcd/helm-controller
    strip-prefix: v
    tag-filter: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - uses: test/kwok/cluster
    - name: Verify helm-controller installation
      runs: |
        sleep 5
        kubectl apply -f https://github.com/fluxcd/flux2/releases/latest/download/install.yaml
        kubectl wait --for=condition=Ready nodes --all
        helm-controller --health-addr :9441 --metrics-addr :8081 > /dev/null 2>&1 & \
        sleep 5; curl -s localhost:8081/metrics  | grep rest_client_requests_total
    - uses: test/go-fips-check
