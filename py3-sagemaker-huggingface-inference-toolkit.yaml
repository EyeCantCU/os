package:
  name: py3-sagemaker-huggingface-inference-toolkit
  version: 2.6.0
  epoch: 0
  description: SageMaker Hugging Face Inference Toolkit is an open-source library for serving Transformers and Diffusers models on Amazon SageMaker
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: sagemaker-huggingface-inference-toolkit
  import: sagemaker_huggingface_inference_toolkit
  java-version: 8

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/sagemaker-huggingface-inference-toolkit.git
      tag: v${{package.version}}
      expected-commit: 69bc5ef978e1acce63386c10aa2fdb97c92c977e

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        # None of PyTorch, TensorFlow >= 2.0, or Flax have been found. Models won't be available and only tokenizers, configuration and file/data utilities can be used.
        # Include pytorch on the image because it can depend on cuda or not
        - py${{range.key}}-huggingface-hub
        - py${{range.key}}-librosa
        - py${{range.key}}-phonemizer
        - py${{range.key}}-pillow
        - py${{range.key}}-pyctcdecode
        - py${{range.key}}-torch-cuda-12.9
        - py${{range.key}}-retrying
        - py${{range.key}}-sagemaker-inference
        - py${{range.key}}-transformers
        - py${{range.key}}-multi-model-server-bin
        - openjdk-${{vars.java-version}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: move usr/bin executables for -bin
        runs: |
          mkdir -p ./cleanup/${{range.key}}/
          mv ${{targets.contextdir}}/usr/bin ./cleanup/${{range.key}}/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/
          mv ./cleanup/${{range.key}}/bin ${{targets.contextdir}}/usr/
    test:
      environment:
        contents:
          packages:
            - curl
            - wait-for-it
            - coreutils
            - openjdk-${{vars.java-version}}-default-jdk
      pipeline:
        - runs: |
            python${{range.key}} <<EOF
            from sagemaker_huggingface_inference_toolkit import serving

            serving.main()
            EOF
            exit 1
        - uses: test/daemon-check-output
          with:
            setup: |
              tee /etc/sagemaker-mms.properties <<EOF
              model_store=/opt/ml/model
              load_models=ALL
              inference_address=http://0.0.0.0:8080
              management_address=http://0.0.0.0:8081
              enable_envvars_config=true
              EOF
              mkdir -p /opt/ml/model
              curl -o - https://s3.amazonaws.com/model-server/model_archive_1.0/squeezenet_v1.1.mar | tar xvf -C /opt/ml/model
            start: env HF_TASK=token-classification serve
            expected_output: |
              Inference API bind to:
              Management API bind to:
            post: |
              wait-for-it localhost:8080
              curl -Lo kitten.jpg https://raw.githubusercontent.com/awslabs/multi-model-server/706aa9c755576e4d8122514358649a0edfbc8992/docs/images/kitten_small.jpg
              curl -X POST http://127.0.0.1:8080/predictions/squeezenet -T kitten.jpg | grep -F -e "Egyptian cat"

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
