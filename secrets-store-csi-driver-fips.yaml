package:
  name: secrets-store-csi-driver-fips
  version: "1.5.4"
  epoch: 3 # CVE-2025-61729
  description: Secrets Store CSI driver for Kubernetes secrets
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - mount
      - umount
      - util-linux-misc

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/secrets-store-csi-driver
      tag: v${{package.version}}
      expected-commit: 08a11d824a310318216c6054c159281acc55c554

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      go-package: go-fips
      modroot: .
      packages: ./cmd/secrets-store-csi-driver
      output: secrets-store-csi
      ldflags: |
        -X sigs.k8s.io/secrets-store-csi-driver/pkg/version.BuildTime=$(date +%Y-%m-%d-%H:%M)
        -X sigs.k8s.io/secrets-store-csi-driver/pkg/version.BuildVersion=v${{package.version}}
        -X sigs.k8s.io/secrets-store-csi-driver/pkg/version.Vcs=$(git rev-parse --short HEAD)

  - uses: strip

update:
  enabled: true
  github:
    identifier: kubernetes-sigs/secrets-store-csi-driver
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        secrets-store-csi --help
    - runs: |
        secrets-store-csi --version
