package:
  name: nvidia-libcufile-12.0
  version: 1.5.1.14
  epoch: 1
  description: CUDA cuFile
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  target-architecture:
    - x86_64
  dependencies:
    provides:
      - nvidia-libcufile=${{package.full-version}}
    runtime:
      - nvidia-cuda-ld-config-${{vars.cuda-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/libcufile/linux-x86_64/libcufile-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "5b4a1d07c2edab0a41e538032e986de21d0b463a676c6da8db1874c1be222c98"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.0/
      mv include ${{targets.destdir}}/usr/local/cuda-12.0/
      mv lib ${{targets.destdir}}/usr/local/cuda-12.0/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.0/${{package.name}}.LICENSE

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/pkgconfig/
      mv pkg-config/* ${{targets.destdir}}/usr/share/pkgconfig/
      sed -i 's|targets/.*-linux/||g' ${{targets.destdir}}/usr/share/pkgconfig/*

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    test:
      pipeline:
        - uses: test/pkgconf

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false

var-transforms:
  - from: ${{package.name}}
    match: .*-(\d+\.\d+).*
    replace: $1
    to: cuda-version
