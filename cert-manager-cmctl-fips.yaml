package:
  name: cert-manager-cmctl-fips
  # This got pulled from the cert-manager repo in the 1.15 release, prior to
  # that it was in the cert-manager/cert-manager repo.
  version: "2.3.0"
  epoch: 7 # GHSA-j5w8-q4qc-rx2x
  description: Automatically provision and manage TLS certificates in Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - cmctl-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 29b59b934c5a6f533b2d278f4541dca89d1eb288
      repository: https://github.com/cert-manager/cmctl
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        helm.sh/helm/v3@v3.18.5
        github.com/containerd/containerd@v1.7.29
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: main.go
      output: cmctl
      ldflags: |
        -X github.com/cert-manager/cert-manager/pkg/util.AppVersion=${{package.version}}
        -X github.com/cert-manager/cert-manager/pkg/util.AppGitCommit=$(git rev-parse HEAD)

update:
  enabled: true
  ignore-regex-patterns:
    - '.*-alpha.*'
    - '.*-beta.*'
    - '.*-rc.*'
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: cmctl
    - uses: test/kwok/cluster
    - name: Install cert-manager CRDs
      runs: |
        set -euo pipefail
        kubectl apply -f https://github.com/cert-manager/cert-manager/releases/latest/download/cert-manager.crds.yaml
    - name: Test completion commands
      runs: |
        cmctl completion bash > /dev/null
        cmctl completion zsh > /dev/null
        cmctl completion fish > /dev/null
    - name: Test convert command
      runs: |
        set -euo pipefail
        tee /tmp/convert-test.yaml << 'EOF'
        apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: convert-test
        spec:
          secretName: convert-test-tls
          issuerRef:
            name: test-issuer
          dnsNames:
            - test.example.com
        EOF
        cmctl convert -f /tmp/convert-test.yaml | grep -F 'creationTimestamp'
