package:
  name: cloud-ssh-keys-fetcher
  version: 0.0.1
  epoch: 0
  description: "small helper to fetch ssh keys from cloud config"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - busybox
      - curl

pipeline:
  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/lib/systemd/system/
      cp cloud-ssh-keys-fetcher "${{targets.destdir}}"/usr/bin/
      cp cloud-ssh-keys-fetcher.service "${{targets.destdir}}"/usr/lib/systemd/system/

update:
  enabled: false
