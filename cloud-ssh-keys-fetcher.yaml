package:
  name: cloud-ssh-keys-fetcher
  version: 0.0.1
  epoch: 7
  description: "small helper to fetch ssh keys from cloud config"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - curl

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      destd=${{targets.destdir}}
      install -Dm755 ./cloud-ssh-keys-fetcher \
          "$destd/usr/bin/cloud-ssh-keys-fetcher"
      # Higher priority than ec2-instance-connect
      install -Dm644 ./40-cloud-ssh-keys-fetcher.conf \
          "$destd/etc/ssh/sshd_config.d/40-cloud-ssh-keys-fetcher.conf"

test:
  environment:
    contents:
      packages:
        - openssh
  pipeline:
    - runs: |
        ssh-keygen -A -q -N ""
        sshd -T
    - runs: |
        [ -x /usr/bin/cloud-ssh-keys-fetcher ]
        [ -e /etc/ssh/sshd_config.d/40-cloud-ssh-keys-fetcher.conf ]

update:
  enabled: false
  exclude-reason: |
    This is the upstream for this package
