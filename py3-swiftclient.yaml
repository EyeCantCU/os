package:
  name: py3-swiftclient
  version: 4.9.0
  epoch: 0
  description: OpenStack Storage (Swift) Client
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

vars:
  pypi-package: python-swiftclient
  module-name: python-swiftclient

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - busybox
      - py3-supported-build-base-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openstack/python-swiftclient
      tag: ${{package.version}}
      expected-commit: d520b2bce952fe262b5e0dd23ebe931724349b33

  - runs: |
      rm -rf releasenotes

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      runtime:
        - py${{range.key}}-urllib3
        - py${{range.key}}-requests
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: swiftclient
        - name: Test client instantiation
          runs: |
            python${{range.key}} << 'EOF'
            from swiftclient import client

            # Test that we can instantiate a Connection object without actually connecting
            # This verifies the API surface is correct
            conn = client.Connection(
                authurl='https://example.com:5000/v3',
                user='test:tester',
                key='testing',
                auth_version='3',
                os_options={'tenant_name': 'test'}
            )
            print("Client instantiation: OK")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

update:
  enabled: true
  git: {}
  ignore-regex-patterns:
    - '^\d{4}\.' # ignore year based tags
    - '.*-eo[ml]$' # ignore -eol and -eom suffixed tags
    - '^[a-z]+-.*' # ignore tags starting with letters like 'zed-eom'

test:
  pipeline:
    - uses: test/emptypackage
