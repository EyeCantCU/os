package:
  name: clickhouse-fips-25.9
  version: "25.9.3.48"
  epoch: 0
  description: ClickHouse is the fastest and most resource efficient open-source database for real-time apps and analytics.
  copyright:
    - license: Apache-2.0
  resources:
    cpu: 65
    memory: 128Gi
  dependencies:
    provides:
      - clickhouse-fips=${{package.full-version}}
    runtime:
      - openssl-config-fipshardened

vars:
  build-dir: build
  clang-version: 19

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version
  - from: ${{package.version}}
    match: ^(\d+\.\d+).*
    replace: $1
    to: major-minor-version
  - from: ${{package.version}}
    match: ^(\d+)\.(\d+)\.(\d+).*
    replace: $3
    to: patch-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ccache
      - clang-${{vars.clang-version}}
      - cmake
      - gawk
      - git
      - gnupg
      - grep
      - jitterentropy-library-dev
      - lld-${{vars.clang-version}}
      - lsb-release-minimal
      - nasm<3
      - openssl-dev
      - perl
      - python3
      - rust
      - rustup
      - samurai
      - wget
      - yasm
  environment:
    RUSTC_BOOTSTRAP: 1
    CLICKHOUSE_BUILD: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ClickHouse/ClickHouse
      tag: v${{package.version}}-stable
      expected-commit: 9a8e40bbf36df38f107e24f8badb0a37b4d2cba4

  - uses: patch
    with:
      patches: |
        allow_cflags.patch
        compatibility.patch
        openssl.patch
        poco.patch

  - runs: |
      git submodule update --init --depth=1 --jobs=$(nproc)

      # Remove bundled OpenSSL to force use of system libraries
      rm -rf contrib/openssl contrib/openssl-cmake

      # Create symlinks for OpenSSL headers in the structure expected by the build
      mkdir -p contrib/openssl/include
      ln -sf /usr/include/openssl contrib/openssl/include/

      # Install stable Rust toolchain
      rustup install stable

      # Modify the CMakeLists.txt to use stable toolchain instead of any nightly version
      sed -i 's/set(Rust_TOOLCHAIN "nightly[^"]*")/set(Rust_TOOLCHAIN "stable")/' contrib/corrosion-cmake/CMakeLists.txt

      # Overwrite VERSION_STRING to properly set the version of the binary.
      sed -i "s|^SET(VERSION_STRING [^)]*)|SET(VERSION_STRING ${{package.version}})|" cmake/autogenerated_versions.txt
      sed -i "s|^SET(VERSION_DESCRIBE [^)]*)|SET(VERSION_DESCRIBE v${{package.version}}-stable)|" cmake/autogenerated_versions.txt
      sed -i "s|^SET(VERSION_PATCH [^)]*)|SET(VERSION_PATCH ${{vars.patch-version}})|" cmake/autogenerated_versions.txt

      # Reference for cmake options: https://github.com/ClickHouse/ClickHouse/blob/master/ci/jobs/build_clickhouse.py
      mkdir -p ${{vars.build-dir}}
      cd ${{vars.build-dir}}

      cmake \
        -DCLICKHOUSE_OFFICIAL_BUILD=1 \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_CXX_FLAGS="-Wno-unused-result -Wno-error=unused-result -Wno-deprecated-declarations -D_GNU_SOURCE" \
        -DCMAKE_C_FLAGS="-D_GNU_SOURCE" \
        -DCMAKE_SHARED_LINKER_FLAGS="-Wl" \
        -DCMAKE_INSTALL_LIBDIR=lib \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -DCOMPILER_CACHE=disabled \
        -DENABLE_EXAMPLES=OFF \
        -DENABLE_OPENSSL_DYNAMIC=ON \
        -DENABLE_RUST=ON \
        -DENABLE_SSL=1 \
        -DENABLE_TESTS=OFF \
        -DNO_ARMV81_OR_HIGHER=1 \
        -DOPENSSL_INCLUDE_DIR=/home/build/contrib/openssl/include \
        -DPARALLEL_COMPILE_JOBS=$(nproc) \
        -DPARALLEL_LINK_JOBS=$(nproc) \
        -DVERSION_STRING=${{package.version}} \
        ..

  - working-directory: ${{vars.build-dir}}
    runs: |
      ninja -j $(nproc) clickhouse
      mkdir -p  ${{targets.contextdir}}/var/log/clickhouse-server
      DESTDIR=${{targets.contextdir}} ninja install
      rm -rf ${{targets.contextdir}}/usr/lib/debug

  - uses: strip

subpackages:
  - name: "${{package.name}}-dev"
    description: "headers for clickhouse"
    pipeline:
      - uses: split/dev

  - name: "${{package.name}}-bash-completion"
    description: "bash completion for clickhouse"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share/bash-completion/completions
          mv ${{targets.destdir}}/usr/share/bash-completion/completions/clickhouse ${{targets.contextdir}}/usr/share/bash-completion/completions

  - name: "${{package.name}}-compat"
    description: "docker compat for clickhouse"
    pipeline:
      - working-directory: ${{vars.build-dir}}
        runs: |
          install -Dm755 ../docker/server/entrypoint.sh ${{targets.contextdir}}/entrypoint.sh
          mkdir -p ${{targets.contextdir}}/etc/clickhouse-server/config.d/
          # users.d dir required by entrypoint script
          mkdir -p ${{targets.contextdir}}/etc/clickhouse-server/users.d/
          cp  ../docker/server/docker_related_config.xml ${{targets.contextdir}}/etc/clickhouse-server/config.d/docker_related_config.xml
    dependencies:
      provides:
        - clickhouse-fips-compat=${{package.full-version}}
    test:
      environment:
        accounts:
          groups:
            - groupname: clickhouse
              gid: 101
            - groupname: nonroot
              gid: 1001
          users:
            - username: clickhouse
              gid: 101
              uid: 101
            - username: nonroot
              gid: 1001
              uid: 1001
          run-as: 0
        contents:
          packages:
            - ${{package.name}}
            - bash
            - coreutils
            - grep
            - procps
            - curl
      pipeline:
        - runs: |
            # Verify entrypoint script exists and is executable
            test -x /entrypoint.sh

            # Verify config directory structure exists
            test -d /etc/clickhouse-server/config.d/
            test -d /etc/clickhouse-server/users.d/

            # Verify docker config file exists
            test -f /etc/clickhouse-server/config.d/docker_related_config.xml

            # Verify docker config file contains expected settings
            grep -q "<listen_host>0.0.0.0</listen_host>" /etc/clickhouse-server/config.d/docker_related_config.xml
        - name: "Test entrypoint script with server startup"
          uses: test/daemon-check-output
          with:
            setup: |
              # Set environment variables that entrypoint.sh expects
              export CLICKHOUSE_CONFIG=./clickhouse-config.xml
              export CLICKHOUSE_USER=default

              # Create required directories and permissions
              # Create required directories and permissions (relative to current directory)
              mkdir -p ./clickhouse-data/lib ./clickhouse-data/log ./clickhouse-data/docker-initdb.d

              # Create a minimal config.xml in the current directory
              cat > ./clickhouse-config.xml << EOF
              <clickhouse>
                  <logger>
                      <level>information</level>
                      <log>./clickhouse-data/log/clickhouse-server.log</log>
                      <errorlog>./clickhouse-data/log/clickhouse-server.err.log</errorlog>
                  </logger>
                  <http_port>8123</http_port>
                  <tcp_port>9000</tcp_port>
                  <path>./clickhouse-data/lib/</path>
                  <tmp_path>./clickhouse-data/lib/tmp/</tmp_path>
                  <user_files_path>./clickhouse-data/lib/user_files/</user_files_path>
                  <format_schema_path>./clickhouse-data/lib/format_schemas/</format_schema_path>
                  <watch_memory_usage_via_cgroups>false</watch_memory_usage_via_cgroups>
              </clickhouse>
              EOF

              # Create users config directory and file
              mkdir -p ./clickhouse-data/users.d
              touch ./clickhouse-data/users.d/default.xml

              chown -R nonroot:nonroot /home/build
            start: /entrypoint.sh clickhouse-su nonroot:nonroot clickhouse-server
            expected_output: |
              Starting ClickHouse
              Ready for connections
            post: |
              # Verify server is accessible
              curl -s --connect-timeout 5 "http://localhost:8123/?query=SELECT%201" | grep -q "1" || {
                echo "Failed to connect to ClickHouse server"
                exit 1
              }

  - name: clickhouse-keeper-fips-${{vars.major-minor-version}}
    description: "clickhouse keeper"
    dependencies:
      provides:
        - clickhouse-keeper-fips=${{package.full-version}}
    pipeline:
      - runs: |
          install -Dm755 ${{targets.destdir}}/usr/bin/clickhouse-keeper ${{targets.contextdir}}/usr/bin/clickhouse-keeper

          # multicall symlinks
          ln -sf /usr/bin/clickhouse-keeper ${{targets.contextdir}}/usr/bin/clickhouse-keeper-converter
          ln -sf /usr/bin/clickhouse-keeper ${{targets.contextdir}}/usr/bin/clickhouse-keeper-client
    test:
      environment:
        contents:
          packages:
            - bash
            - coreutils
            - procps
      pipeline:
        - runs: |
            # Smoke tests for binary existence and basic functionality
            clickhouse-keeper --version | grep ${{package.version}}
            clickhouse-keeper-client --help
            clickhouse-keeper-converter --help
        - name: "Test keeper server and basic operations"
          uses: test/daemon-check-output
          with:
            setup: |
              # Create directory for test configs and data
              mkdir -p keeper-test/logs keeper-test/data

              # Create basic configuration file
              cat > keeper-test/keeper-config.xml << EOF
              <clickhouse>
                  <logger>
                      <level>debug</level>
                      <log>keeper-test/logs/keeper.log</log>
                      <errorlog>keeper-test/logs/keeper.err.log</errorlog>
                      <console>1</console>
                  </logger>
                  <keeper_server>
                      <tcp_port>9181</tcp_port>
                      <server_id>1</server_id>
                      <log_storage_path>keeper-test/data</log_storage_path>
                      <snapshot_storage_path>keeper-test/data</snapshot_storage_path>
                      <listen_host>127.0.0.1</listen_host>
                      <raft_configuration>
                          <server>
                              <id>1</id>
                              <hostname>127.0.0.1</hostname>
                              <port>9234</port>
                          </server>
                      </raft_configuration>
                  </keeper_server>
              </clickhouse>
              EOF
            start: clickhouse-keeper --config keeper-test/keeper-config.xml
            expected_output: |
              Application: Starting ClickHouse Keeper ${{package.version}}
              Quorum initialized
              Ready for connections
            post: |
              # Verify default node exists
              clickhouse-keeper-client --host 127.0.0.1 --port 9181 -q "ls" | grep -q "keeper"

              # Create test node
              clickhouse-keeper-client --host 127.0.0.1 --port 9181 -q "create \"/test-node\" \"test-data\""

              # Verify node exists
              clickhouse-keeper-client --host 127.0.0.1 --port 9181 -q "ls" | grep -q "test-node"

              # Get data from the node
              clickhouse-keeper-client --host 127.0.0.1 --port 9181 -q "get \"/test-node\"" | grep -q "test-data"

test:
  environment:
    accounts:
      groups:
        - groupname: clickhouse
          gid: 101
        - groupname: nonroot
          gid: 1001
      users:
        - username: clickhouse
          gid: 101
          uid: 101
        - username: nonroot
          gid: 1001
          uid: 1001
      run-as: 0
    contents:
      packages:
        - ${{package.name}}-compat
        - bash
        - coreutils
        - curl
        - findutils
        - openssl
        - procps
  pipeline:
    - uses: test/tw/ldd-check
    - name: Check fips test
      runs: |
        openssl-fips-test
    - runs: |
        ch --version
        chc --version
        chl --version
        clickhouse --version
        clickhouse-benchmark --help
        clickhouse-client --version
        clickhouse-compressor --help
        clickhouse-disks --help
        clickhouse-format version
        clickhouse-git-import version
        clickhouse-keeper --version
        clickhouse-keeper-client --help
        clickhouse-keeper-converter --help
        clickhouse-local --version
        clickhouse-obfuscator version
        clickhouse-server --version
        clickhouse-static-files-disk-uploader version
        clickhouse-su --version
    - name: "Test server / basic database operations"
      uses: test/daemon-check-output
      with:
        setup: ./setup-minimal-config.sh
        start: clickhouse-su nonroot:nonroot clickhouse-server -C minimal_config.xml
        expected_output: |
          Starting ClickHouse
          starting up
          Ready for connections
        post: ./test-daemon.sh
    - name: "Test FIPS mode"
      uses: test/daemon-check-output
      with:
        setup: ./setup-fips-tls-test.sh
        start: clickhouse-su nonroot:nonroot clickhouse-server -C test_config.xml
        expected_output: |
          Starting ClickHouse
          starting up
          Ready for connections
        post: ./test-fips-tls.sh

update:
  enabled: true
  ignore-regex-patterns:
    - '-new$'
  git:
    tag-filter-prefix: v25.9.
    strip-prefix: v
    strip-suffix: -stable
