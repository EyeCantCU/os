package:
  name: azure-functions-python-worker
  version: "4.41.0"
  epoch: 0
  description: Python Language Worker for Azure Functions Runtime
  target-architecture:
    - x86_64
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0

vars:
  pypi-package: azure-functions-worker

data:
  - name: py-versions
    items:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - busybox
      - protobuf-dev
      - protoc
      - py3-supported-build-base
      - uv

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Azure/azure-functions-python-worker.git
      tag: ${{package.version}}
      expected-commit: 069be419b2b1a8f451a62605ad5d32e0f552ec2f

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} for python${{range.key}}
    pipeline:
      - working-directory: workers
        runs: |
          # Create environment and install package (includes correct grpcio-tools from pyproject.toml)
          uv venv --python ${{range.key}}
          source .venv/bin/activate

          # Install build deps
          uv pip install . invoke

          # Generate protobuf files with the installed grpcio-tools version
          cd tests
          python${{range.key}} -m invoke -c test_setup build-protos
          cd ..

          uv pip install .

          # Cleanup
          uv pip uninstall invoke
          deactivate

          # Copy the worker configuration
          mkdir -p "${{targets.contextdir}}"/usr/share/azure-functions-python-worker/
          cp ./python/prodV4/worker.config.json ${{targets.contextdir}}/usr/share/azure-functions-python-worker/

          mkdir -p ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages
          cp -r .venv/lib/python${{range.key}}/site-packages/* ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/

          # Use different worker.py based on Python version
          PYTHON_MINOR=$(echo "${{range.key}}" | cut -d'.' -f2)
          if [ "$PYTHON_MINOR" -ge 13 ]; then
            cp ./python/proxyV4/worker.py ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/worker.py
          else
            cp ./python/prodV4/worker.py ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/worker.py
          fi

          # Clean up duplicates and test directories
          rm -rf ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/build
          rm -rf ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/tests
          rm -rf ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/python
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: azure_functions_worker
        - name: Test worker command-line interface
          runs: |
            set -euo pipefail
            cd /usr/lib/python${{range.key}}/site-packages
            python${{range.key}} worker.py --help

  # Supported meta packages
  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage
        - uses: python/import
          with:
            python: python3.11
            import: azure_functions_worker
        - uses: python/import
          with:
            python: python3.12
            import: azure_functions_worker
        - uses: python/import
          with:
            python: python3.13
            import: azure_functions_worker

update:
  enabled: true
  github:
    identifier: Azure/azure-functions-python-worker
  ignore-regex-patterns:
    - ".*[a-z][0-9]+.*" # alpha / beta versions
    - ".*-hotfix.*" # hotfix versions
    - "azure_functions_.*" # prefixed tags
    - "runtimes/.*" # runtime-specific tags

test:
  pipeline:
    - uses: test/tw/byproductpackage
