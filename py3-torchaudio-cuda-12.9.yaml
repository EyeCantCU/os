package:
  name: py3-torchaudio-cuda-12.9
  version: 2.8.0
  epoch: 0
  description: Data manipulation and transformation for audio signal processing
  copyright:
    - license: BSD-2-Clause

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: "$1"
    to: cuda-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.(\d+)$'
    replace: "cu$1$2"
    to: cuda-pyvariant

vars:
  pypi-package: torchaudio

environment:
  contents:
    packages:
      - ccache
      - cmake
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - ninja
      - nvidia-cuda-nvcc-gcc-${{vars.cuda-version}}
      - py3-supported-build-base-dev
      - py3-supported-torch-cuda-${{vars.cuda-version}}-dev
  environment:
    BUILD_SOX: 1
    BUILD_VERSION: ${{package.version}}+${{vars.cuda-pyvariant}}
    CFLAGS: "-Wno-error=nonnull -Wno-nonnull"
    CMAKE_CUDA_ARCHITECTURES: all
    CUDAToolkit_ROOT: "/usr/local/cuda-${{vars.cuda-version}}"
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
    CUDA_NVCC_EXECUTABLE: /usr/local/cuda-${{vars.cuda-version}}/bin/nvcc
    CUDA_VERSION: "${{vars.cuda-version}}"
    CXXFLAGS: "-Wno-error=nonnull -Wno-nonnull"
    FORCE_CUDA: 1
    MAX_JOBS: 16
    PATH: "$PATH:/usr/local/cuda-${{vars.cuda-version}}/bin"
    TORCH_CUDA_ARCH_LIST: "7.0 7.2 7.5 8.0 8.6 8.7 8.9 9.0 9.0a"
    TORCH_NVCC_FLAGS: "-Xfatbin -compress-all"
    USE_CUDA: 1
    USE_CUDNN: 1
    VERBOSE: 1

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/audio.git
      tag: v${{package.version}}
      expected-commit: 6e1c7fe9ff6d82b8665d0a46d859d3357d2ebaaa

  - runs: ccache -F 0 -M 0

subpackages:
  - name: libtorchaudio-cuda-${{vars.cuda-version}}
    description: C++ torchaudio library
    dependencies:
      runtime:
        - libtorch-cuda-${{vars.cuda-version}}
        - sox-ng-dev
        - ffmpeg-dev
    pipeline:
      - uses: cmake/configure
        with:
          opts: |
            -DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda-${{vars.cuda-version}} \
            -DCMAKE_CUDA_COMPILER=/usr/local/cuda-${{vars.cuda-version}}/bin/nvcc \
            -DUSE_SYSTEM_NVTX=1 \
            -DCMAKE_CUDA_ARCHITECTURES="${CMAKE_CUDA_ARCHITECTURES}"
      - uses: cmake/build
      - uses: cmake/install
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib
          mv ${{targets.subpkgdir}}/usr/torchaudio/lib/*.so ${{targets.subpkgdir}}/usr/lib
          rm -rf ${{targets.subpkgdir}}/usr/torchaudio/
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-torch-cuda-${{vars.cuda-version}}
        - py${{range.key}}-${{vars.pypi-package}}-shared
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: move shared libraries
        runs: |
          mkdir -p bin-save/${{range.key}}/torchaudio
          mkdir -p bin-save/${{range.key}}/torio
          mv ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/torchaudio/lib/*.so bin-save/${{range.key}}/torchaudio
          mv ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/torio/lib/*.so bin-save/${{range.key}}/torio
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-shared
    description: Shared objects for compatibility with FFMPeg versions ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    options:
      # These are split up because they link to old versions on FFMPEG
      no-provides: true
    pipeline:
      - name: move shared libraries
        runs: |
          mkdir -p bin-save/${{range.key}}
          mkdir -p ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/torchaudio/lib
          mkdir -p ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/torio/lib
          mv bin-save/${{range.key}}/torchaudio/*.so ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/torchaudio/lib
          mv bin-save/${{range.key}}/torio/*.so ${{targets.contextdir}}/usr/lib/python${{range.key}}/site-packages/torio/lib
      - uses: strip

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
