package:
  # There are detailed notes on some of the issues encountered with this
  # packaage here: https://github.com/chainguard-dev/image-requests/issues/3539
  name: apache-beam-java-17-sdk
  version: 2.57.0
  epoch: 0
  description:
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash # some helper scripts use bashw
      - busybox
      - ca-certificates-bundle
      - curl
      - go # needed to build the boot binary. Unless explicitly specified, installer will download an older version, so use ours here.
      # go-licenses does not seem to work, so we need to install it manually
      # below. Once we figure out what's going on, we should update this.
      # https://github.com/chainguard-dev/enterprise-packages/issues/6507
      # - go-licenses
      - gzip
      # Note that upstream uses version 8, but using our 8 fails, so use this
      # https://github.com/chainguard-dev/enterprise-packages/issues/6508
      - openjdk-11
      - openjdk-11-default-jvm
      - python-3.11 # we just need python to create the licenses.
      - rsync

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/beam
      tag: v${{package.version}}
      expected-commit: e3314d4c942d6fb7c9669e7eb98c5e526b83e1aa

  - runs: |
      # Set the version: https://github.com/apache/beam/issues/21302#issuecomment-1912679793
      ./release/src/main/scripts/set_version.sh ${{package.version}} --release

  - runs: |
      # Create the output directories we need.
      mkdir -p ${{targets.destdir}}/opt/apache/beam/jars
      mkdir -p ${{targets.destdir}}/opt/apache/beam/options
      mkdir -p ${{targets.destdir}}/opt/apache/beam/third_party_licenses

  - uses: go/build
    with:
      packages: .
      modroot: ./sdks/java/container
      prefix: /opt
      install-dir: apache/beam
      output: boot

  - runs: |
      export LANG=en_US.UTF-8

      # Arguments from: https://github.com/apache/beam/blob/master/.github/workflows/build_release_candidate.yml#L288
      # This builds the `beam-sdks-java-harness-{version}.jar` file
      ./gradlew -PisRelease -Pdocker-pull-licenses -Pprune-images --no-daemon  jar

      # And this builds the docker container required base files
      ./gradlew -PisRelease -Pdocker-pull-licenses -Pprune-images --no-daemon :sdks:java:container:java17:build

      cp ./sdks/java/harness/build/libs/beam-sdks-java-harness-${{package.version}}.jar ${{targets.destdir}}/opt/apache/beam/jars/beam-sdks-java-harness.jar

  - runs: |
      # Generate / copy the licenses.

      # Copy LICENSE and NOTICE first
      cp ./LICENSE ${{targets.destdir}}/opt/apache/beam/LICENSE
      cp ./NOTICE ${{targets.destdir}}/opt/apache/beam/NOTICE

      # Generate java licenses. By default it uses python 3.8
      # which we do not have, specify our installed version of 3.11 instead.
      ./gradlew -PpythonVersion=3.11 :sdks:java:container:java17:copyJavaThirdPartyLicenses
      cp -R ./sdks/java/container/java17/build/target/third_party_licenses/* ${{targets.destdir}}/opt/apache/beam/third_party_licenses/

      # Generate go licenses. With our apk package go-licenses does not work
      # so just working around with this for it.
      # https://github.com/chainguard-dev/enterprise-packages/issues/6507
      mkdir /tmp/go
      export GOPATH=/tmp/go
      go install github.com/google/go-licenses@latest

      cp LICENSE sdks/java/container/
      cd sdks/java/container
      /tmp/go/bin/go-licenses save . --save_path=${{targets.destdir}}/opt/apache/beam/third_party_licenses/golang
      go-licenses csv . | tee ${{targets.destdir}}/opt/apache/beam/third_party_licenses/golang/list.csv
      cd ../../../

  - runs: |
      # Generate and copy the java options files.
      ./gradlew :sdks:java:container:java17:copyJdkOptions
      cp ./sdks/java/container/java17/build/target/options/* ${{targets.destdir}}/opt/apache/beam/options

  - runs: |
      # Package the dependent jars
      ./gradlew sdks:java:container:java17:copyDockerfileDependencies

      # There are other jars there that are NOT part of the upstream sdk
      # docker image, so be selective on what we copy from there
      cp ./sdks/java/container/java17/build/target/jamm.jar ${{targets.destdir}}/opt/apache/beam/jars/
      cp ./sdks/java/container/java17/build/target/jcl-over-slf4j.jar ${{targets.destdir}}/opt/apache/beam/jars/
      cp ./sdks/java/container/java17/build/target/slf4j-api.jar ${{targets.destdir}}/opt/apache/beam/jars/
      cp ./sdks/java/container/java17/build/target/slf4j-jdk14.jar ${{targets.destdir}}/opt/apache/beam/jars/
      cp ./sdks/java/container/java17/build/target/open-module-agent.jar ${{targets.destdir}}/opt/apache/beam/jars/
      cp ./sdks/java/container/java17/build/target/log4j-to-slf4j.jar ${{targets.destdir}}/opt/apache/beam/jars/
      cp ./sdks/java/container/java17/build/target/log4j-over-slf4j.jar ${{targets.destdir}}/opt/apache/beam/jars/
      cp ./sdks/java/container/java17/build/target/slf4j-jdk14.jar ${{targets.destdir}}/opt/apache/beam/jars/

test:
  environment:
    contents:
      packages:
        - bash
        - ca-certificates-bundle
        - openjdk-17
        - openjdk-17-default-jvm
  pipeline:
    - runs: /opt/apache/beam/boot --help

update:
  enabled: true
  ignore-regex-patterns:
    - sdks # They prefix all the releases with `sdks-` in addition to just v{version}
    - RC # Ignore release candidates
  github:
    identifier: apache/beam
    strip-prefix: v
