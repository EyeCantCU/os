package:
  name: prometheus-postgres-exporter-0.10
  version: 0.10.1
  epoch: 9
  description: Prometheus Exporter for Postgres server metrics
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - prometheus-postgres-exporter=${{package.full-version}}

environment:
  contents:
    packages:
      - ca-certificates-bundle
      - busybox
      - build-base
      - go
      - curl

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/postgres_exporter
      tag: v${{package.version}}
      expected-commit: 6cff384d7433bcb1104efe3b496cd27c0658eb09

  - runs: |
      # Mitigate CVE-2022-21698 / GHSA-cg3q-j54f-5p7p
      go get github.com/prometheus/client_golang/prometheus/promhttp@v1.11.1
      # Mitigate CVE-2022-46146 / GHSA-7rg2-cxvp-9p7p
      go get github.com/prometheus/exporter-toolkit@v0.7.3
      # Mitigate CVE-2021-43565 / GHSA-gwc9-m7rh-j2ww
      go get golang.org/x/crypto@v0.0.0-20211202192323-5770296d904e
      # Mitigate CVE-2022-27191 / GHSA-8c26-wmh5-6g9v
      go get golang.org/x/crypto@v0.0.0-20220314234659-1baeb1ce4c0b
      # Mitigate CVE-2021-38561 / GHSA-ppp9-7jff-5vj2 and CVE-2022-32149 / GHSA-69ch-w2m2-3vjp
      go get golang.org/x/text@v0.3.8
      # Mitigate CVE-2022-27664 / GHSA-69cg-p879-7622
      go get golang.org/x/net@v0.0.0-20220906165146-f3363e06e74c
      # Mitigate CVE-2022-41723 / GHSA-vvpx-j8f3-3w6h
      # Mitigate CVE-2023-3978 / GHSA-2wrh-6pvc-2jm9
      # Mitigate CVE-2023-39325 / GHSA-4374-p667-p6c8
      # Mitigate CVE-2023-44487 / GHSA-qppj-fm5r-hxr3
      go get golang.org/x/net@v0.17.0
      go get golang.org/x/crypto@v0.17.0
      go mod tidy

  - runs: |
      make build

  - runs: |
      install -Dm755 postgres_exporter "${{targets.destdir}}"/usr/bin/postgres_exporter

  - uses: strip

update:
  enabled: true
  github:
    identifier: prometheus-community/postgres_exporter
    strip-prefix: v
    tag-filter: v0.10.
    use-tag: true
