package:
  name: rancher-fleet-fips
  version: "0.12.1"
  epoch: 0
  description: Deploy workloads from Git to large fleets of Kubernetes clusters
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e6d5f929b5796ef1906628ebe6a894b7ff4bd226
      repository: https://github.com/rancher/fleet
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0
      modroot: pkg/apis

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.29.0
        helm.sh/helm/v3@v3.17.3
        golang.org/x/net@v0.38.0

subpackages:
  - name: ${{package.name}}-agent
    pipeline:
      - uses: go/build
        with:
          ldflags: |
            -X github.com/rancher/fleet/pkg/version.GitCommit=$(git rev-parse HEAD)
            -X github.com/rancher/fleet/pkg/version.Version=${{package.version}}
          output: fleetagent
          packages: ./cmd/fleetagent/main.go
          go-package: go-fips
    test:
      environment:
        environment:
          # required to run any of these tests and the application
          # otherwise panic failures will occur.
          # values referenced here: https://github.com/rancher/fleet/blob/ad5324910e30cf7d2b7ef3ab8893c68c9c9e6baa/charts/fleet/values.yaml#L101
          CATTLE_ELECTION_LEASE_DURATION: 30s
          CATTLE_ELECTION_RENEW_DEADLINE: 25s
          CATTLE_ELECTION_RETRY_PERIOD: 10s
      pipeline:
        - uses: test/go-fips-check
        - name: Verify version output
          runs: |
            fleetagent --version | grep ${{package.version}}
        - uses: test/kwok/cluster
        - name: "Test fleet-agent register functionality"
          uses: test/daemon-check-output
          with:
            setup: |
              mkdir -p /tmp/fleet-test
              kwokctl get kubeconfig > /tmp/fleet-test/kubeconfig
              kubectl create ns fleet-system
              kubectl create secret generic fleet-agent-bootstrap
            start: fleetagent register --kubeconfig /tmp/fleet-test/kubeconfig --namespace fleet-system
            timeout: 30
            expected_output: |
              starting registration on upstream cluster
            error_strings: |
              ERROR
              FATAL
              panic
            post: |
              rm -rf /tmp/fleet-test

update:
  enabled: true
  github:
    identifier: rancher/fleet
    strip-prefix: v
