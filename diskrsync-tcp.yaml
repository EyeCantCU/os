package:
  name: diskrsync-tcp
  version: 0.13.0
  epoch: 0
  description: "diskrsync-tcp"
  copyright:
    - license: AGPL-3.0-only

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/backube/volsync
      tag: v${{package.version}}
      expected-commit: 34b8e30c6354bb8380dc77310ae07ba8687b3e5b

  - uses: go/build
    with:
      ldflags: |
        -X=main.volsyncVersion=v${{package.version}}
      packages: ./diskrsync-tcp
      output: diskrsync-tcp

test:
  pipeline:
    - runs: |
        set -euo pipefail
        diskrsync-tcp --version | grep "${{package.version}}"
        diskrsync-tcp --help | grep -qi 'diskrsync-tcp'