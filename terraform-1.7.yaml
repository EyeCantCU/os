package:
  name: terraform-1.7
  version: 1.7.3
  epoch: 0
  copyright:
    - license: BUSL
  dependencies:
    provides:
      - terraform=${{package.full-version}}
environment:
  environment:
    CGO_ENABLED: 0
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/terraform
      tag: v${{package.version}}
      expected-commit: ebd7d52caaeb01accbe97aa72ed1297bf1a3f951
  - uses: go/bump
    with:
      deps: github.com/cloudflare/circl@v1.3.7
  - uses: go/build
    with:
      packages: .
      output: terraform
      ldflags: -s -w -X github.com/hashicorp/terraform/version.dev="no"
  - uses: strip
subpackages:
  - name: terraform-compat
    description: Compat package for terraform
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/terraform "${{targets.subpkgdir}}"/usr/local/bin
  - name: terraform-local-provider-config
    description: Configure Terraform to use local providers
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/terraform/provider-mirror
          cat > "${{targets.subpkgdir}}"/terraform/.terraformrc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "/terraform/provider-mirror"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF
update:
  enabled: true
  github:
    identifier: hashicorp/terraform
    strip-prefix: v
    tag-filter: v1.7
test:
  environment:
    contents:
      packages:
        - wolfi-base
  pipeline:
    - runs: |
        terraform --version
