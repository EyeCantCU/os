package:
  name: py3-limits
  version: "5.5.0"
  epoch: 0
  description: Rate limiting utilities
  copyright:
    - license: MIT

vars:
  pypi-package: limits
  import: limits

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/alisaifee/limits
      tag: ${{package.version}}
      expected-commit: a5d3f81d1ead51586a42b8c843884603cb19bb7f

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-deprecated
        - py${{range.key}}-packaging
        - py${{range.key}}-typing-extensions
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import limits
            from limits import storage, strategies, parse
            from limits import RateLimitItemPerSecond

            assert hasattr(limits, 'storage')
            assert hasattr(limits, 'strategies')
            assert hasattr(limits, 'parse')

            memory_storage = storage.MemoryStorage()
            assert memory_storage is not None

            limiter = strategies.FixedWindowRateLimiter(memory_storage)
            assert limiter is not None
            assert hasattr(limiter, 'hit')
            assert hasattr(limiter, 'test')
            assert hasattr(limiter, 'get_window_stats')

            one_per_minute = parse("1/minute")
            assert one_per_minute is not None

            one_per_second = RateLimitItemPerSecond(1, 1)
            assert one_per_second is not None

            assert limiter.hit(one_per_minute, "test_namespace", "foo") == True
            assert limiter.hit(one_per_minute, "test_namespace", "foo") == False
            assert limiter.hit(one_per_minute, "test_namespace", "bar") == True
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: alisaifee/limits
