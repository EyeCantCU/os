package:
  name: perl-alien-libxml2
  version: "0.20"
  epoch: 0
  description: Install the C libxml2 library on your system
  copyright:
    - license: Artistic-1.0-Perl
  dependencies:
    runtime:
      - perl-alien-build

environment:
  contents:
    packages:
      - build-base
      - libxml2-dev
      - perl-alien-build
      - perl-alien-build-plugin-download-gitlab
      - perl-dev

pipeline:
  - uses: fetch
    with:
      uri: https://cpan.metacpan.org/authors/id/P/PL/PLICEASE/Alien-Libxml2-${{package.version}}.tar.gz
      expected-sha256: 56aae7b339bbeb02f77c5801f57a821be5791b51f43bf7f9062bb3bfa444c328

  - uses: perl/make

  - uses: autoconf/make

  - runs: make test

  - uses: autoconf/make-install

  - uses: perl/cleanup

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 19537

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/alldocs
    description: ${{package.name}} docs
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - name: Smoke test
      runs: echo "use Alien::Libxml2;" | perl
    - runs: |
        perl <<'EOF'
        use strict;
        use warnings;
        use Alien::Libxml2;

        # Test that we can get libxml2 configuration
        my $alien = Alien::Libxml2->new();
        die "Failed to create Alien::Libxml2 instance" unless defined $alien;
        print "Alien::Libxml2 instance created successfully\n";

        # Test that we can get cflags (compile flags)
        my $cflags = $alien->cflags;
        die "Failed to get cflags" unless defined $cflags;
        print "Cflags: $cflags\n";

        # Test that we can get libs (linker flags)
        my $libs = $alien->libs;
        die "Failed to get libs" unless defined $libs;
        print "Libs: $libs\n";

        print "Alien::Libxml2 tests passed\n";
        EOF
