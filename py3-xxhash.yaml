package:
  name: py3-xxhash
  version: "3.5.0"
  epoch: 0
  description: xxhash is a Python binding for the xxHash library by Yann Collet.
  copyright:
    - license: BSD-2-Clause
  dependencies:
    runtime:
      - xxhash-libs

vars:
  pypi-package: xxhash
  import: xxhash

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - py3-supported-build-base
      - py3-supported-build-base-dev
      - xxhash-dev
      - xxhash-libs
  environment:
    XXHASH_LINK_SO: "1"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ifduyue/python-xxhash
      expected-commit: 665a9f00db107b0f23cf9114ea2fa0e20e68ee5f
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: ifduyue/python-xxhash
    strip-prefix: v
