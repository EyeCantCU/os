package:
  name: flux-image-reflector-controller-fips
  version: "1.0.4"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: GitOps Toolkit controller that scans container registries
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fluxcd/image-reflector-controller
      tag: v${{package.version}}
      expected-commit: 82454c4d88b1b933d5760593709c3cc64fb0e1fa

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: tests/integration

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: .
      output: image-reflector-controller
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - api/
  github:
    identifier: fluxcd/image-reflector-controller
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  environment:
    contents:
      packages:
        - ${{package.name}}
  pipeline:
    - runs: |
        image-reflector-controller -h
    - uses: test/go-fips-check
