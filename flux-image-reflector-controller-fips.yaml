package:
  name: flux-image-reflector-controller-fips
  version: "1.0.2"
  epoch: 0 # CVE-2025-47907
  description: GitOps Toolkit controller that scans container registries
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fluxcd/image-reflector-controller
      tag: v${{package.version}}
      expected-commit: 07c8b98126ed4b6e94bfc3037acd9be6e7827005

  - uses: go/build
    with:
      packages: .
      output: image-reflector-controller
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - api/
  github:
    identifier: fluxcd/image-reflector-controller
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  environment:
    contents:
      packages:
        - ${{package.name}}
  pipeline:
    - runs: |
        image-reflector-controller -h
    - uses: test/go-fips-check
