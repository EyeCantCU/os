package:
  name: cass-operator-fips-no-pvc-delete
  version: 1.18.2
  epoch: 6
  description: Custom cass-operator-fips with PVC auto-deletion code removed
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
      - wolfi-baselayout
  environment:
    CGO_ENABLED: 0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/k8ssandra/cass-operator.git
      tag: v${{package.version}}
      expected-commit: f1f25eb8434876f4eb519a2e5504c171020916ad

  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.17.0 google.golang.org/protobuf@v1.33.0

  - uses: patch
    with:
      patches: remove-pvcdelete.patch

  - uses: go/build
    with:
      modroot: .
      packages: cmd/main.go
      output: ${{package.name}}-manager
      go-package: go-fips

  - uses: strip

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream helm charts"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/bin"
          ln -sf /usr/bin/${{package.name}}-manager ${{targets.subpkgdir}}/usr/bin/manager
          ln -sf /usr/bin/${{package.name}}-manager ${{targets.subpkgdir}}/manager

update:
  enabled: true
  github:
    identifier: k8ssandra/cass-operator
    strip-prefix: v
    tag-filter: v
