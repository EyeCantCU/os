package:
  name: nvidia-libnvshmem-12.9
  version: "3.3.9"
  epoch: 1
  description: NVIDIA Shared Memory
  copyright:
    - license: LicenseRef-NVIDIA-CUDA-nvshmem
      license-path: LICENSE
  dependencies:
    runtime:
      - nvidia-cuda-ld-config-${{vars.cuda-version}}

environment:
  contents:
    packages:
      - busybox
      - openmpi-cuda-${{vars.cuda-version}}
      - rdma-core-dev

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*-(\d+)\..*'
    replace: '$1'
    to: cuda-major-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/nvshmem/redist/libnvshmem/linux-sbsa/libnvshmem-linux-sbsa-${{package.version}}_cuda${{vars.cuda-major-version}}-archive.tar.xz"
          expected-sha256: "62c6c683c5a63386941520e401c419f0299900321c1025906d7e4edd2e3d4c9b"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/nvshmem/redist/libnvshmem/linux-x86_64/libnvshmem-linux-x86_64-${{package.version}}_cuda${{vars.cuda-major-version}}-archive.tar.xz"
          expected-sha256: "72a788ef5723a30d8882b193f0a513f454ecaee3ab5a225a5c43db79d433ef66"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv include ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv lib ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/lib64

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false

test:
  pipeline:
    - uses: test/tw/ldd-check
