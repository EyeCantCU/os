package:
  name: kyverno-1.11
  version: 1.11.5
  epoch: 2
  description: Kubernetes Native Policy Management
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
    provides:
      - kyverno=${{package.full-version}}

environment:
  contents:
    packages:
      - git
      - go
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: c708a20600fb3db591918604a2d8b68e5fa94a77
      repository: https://github.com/kyverno/kyverno
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.23.0 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/go-jose/go-jose/v3@v3.0.3 github.com/cloudflare/circl@v1.3.7 github.com/lestrrat-go/jwx/v2@v2.0.21 github.com/notaryproject/notation-go@v1.0.1 gopkg.in/go-jose/go-jose.v2@v2.6.3 google.golang.org/protobuf@v1.33.0 gopkg.in/go-jose/go-jose.v2@v2.6.3 github.com/hashicorp/go-retryablehttp@v0.7.7 github.com/docker/docker@v26.1.5

  - uses: go/remove-cgo-enabled-0
    with:
      seds: |
        s,-s -w,-w,g

  - runs: |
      make build-all
      mkdir -p ${{targets.destdir}}/usr/bin
      install -Dm755 cmd/kyverno/kyverno ${{targets.destdir}}/usr/bin/kyverno

  - uses: strip

subpackages:
  - name: kyverno-init-container-1.11
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          install -Dm755 cmd/kyverno-init/kyvernopre ${{targets.subpkgdir}}/usr/bin/kyvernopre

  - name: kyverno-reports-controller-1.11
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          install -Dm755 cmd/reports-controller/reports-controller ${{targets.subpkgdir}}/usr/bin/reports-controller

  - name: kyverno-background-controller-1.11
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          install -Dm755 cmd/background-controller/background-controller ${{targets.subpkgdir}}/usr/bin/background-controller

  - name: kyverno-cleanup-controller-1.11
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          install -Dm755 cmd/cleanup-controller/cleanup-controller ${{targets.subpkgdir}}/usr/bin/cleanup-controller

  - name: kyverno-cli-1.11
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          install -Dm755 cmd/cli/kubectl-kyverno/kubectl-kyverno ${{targets.subpkgdir}}/usr/bin/kubectl-kyverno

update:
  enabled: true
  ignore-regex-patterns:
    - "-beta"
    - "-rc"
  github:
    identifier: kyverno/kyverno
    strip-prefix: v
    tag-filter: v1.11.

test:
  pipeline:
    - runs: kyverno --help
