package:
  name: chart-iamguarded-kube-prometheus
  version: "11.3.8"
  epoch: 0
  description: Prometheus Operator iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common
      - chart-iamguarded-kube-state-metrics
      - chart-iamguarded-node-exporter

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: kube-prometheus/${{package.version}}
      expected-commit: 35b34cb2cb9b0709a3f759f302c19489729d4e25

  - runs: |
      cp -r ./bitnami/kube-prometheus/charts/kube-prometheus-crds/crds /kube-prometheus-crds
      cat <<EOF > /kube-prometheus-crds/values.yaml
      exampleValue: kube-prometheus-crds-chart
      EOF

      cat <<'EOF' > /kube-prometheus-crds/Chart.yaml
      annotations:
        category: Analytics
        licenses: Apache-2.0
      apiVersion: v2
      appVersion: 0.1.0
      dependencies:
      description: Prometheus Operator provides easy monitoring definitions for Kubernetes services and deployment and management of Prometheus instances.
      home: https://chainguard.dev
      keywords:
      - prometheus
      - alertmanager
      - operator
      - monitoring
      name: kube-prometheus-crds
      version: 0.1.0
      EOF

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: patch
    with:
      patches: values.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/kube-prometheus

  - uses: charts/package
    with:
      chart-path: iamguarded/kube-prometheus

  - runs: rm ${{targets.contextdir}}/kube-prometheus/charts/kube-prometheus-crds/README.md # to avoid bad words

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: kube-prometheus/
    use-tag: true
    tag-filter-prefix: kube-prometheus/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /kube-prometheus
