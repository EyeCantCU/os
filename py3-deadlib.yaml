package:
  name: py3-deadlib
  version: 3.13.0
  epoch: 0
  description: Python dead batteries redistribution
  copyright:
    # https://peps.python.org/pep-0594/
    # Official PEP for deprecating a few things from the standard library
    # SHOULD follow the same license as the Python Standard library, which is:
    - license: PSF-2.0

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

  # Python versions that py3-audioop-lts doesnt support
  - name: py-versions-old
    items:
      3.10:
      3.11:
      3.12:

  # Python versions that py3-audioop-lts does support
  - name: py-versions-audioop
    items:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/youknowone/python-deadlib.git
      tag: v${{package.version}}
      expected-commit: eb2588610750b9c687d417e72a743314edb107df

subpackages:
  - range: py-versions-old
    name: py${{range.key}}-standard-aifc
    description: aifc installed for python${{range.key}}
    pipeline:
      - working-directory: aifc
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - ffmpeg
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: aifc
        - runs: |
            ffmpeg -f lavfi -i "sine=f=1000:d=2" output.wav
            ffmpeg -i output.wav output.aiff

            python${{range.key}} <<'EOF' | grep -F -e "width: 2, channels: 1"
            import aifc
            import os
            with aifc.open("output.aiff", 'r') as audio_file:
                print(f"width: {audio_file.getsampwidth()}, channels: {audio_file.getnchannels()}")
            EOF

  - range: py-versions-audioop
    name: py${{range.key}}-standard-aifc
    description: aifc installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-audioop-lts
        - py${{range.key}}-standard-chunk
    pipeline:
      - working-directory: aifc
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - ffmpeg
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: aifc
        - runs: |
            ffmpeg -f lavfi -i "sine=f=1000:d=2" output.wav
            ffmpeg -i output.wav output.aiff

            python${{range.key}} <<'EOF' | grep -F -e "width: 2, channels: 1"
            import aifc
            import os
            with aifc.open("output.aiff", 'r') as audio_file:
                print(f"width: {audio_file.getsampwidth()}, channels: {audio_file.getnchannels()}")
            EOF

  - range: py-versions
    name: py${{range.key}}-standard-chunk
    description: chunk installed for python${{range.key}}
    pipeline:
      - working-directory: chunk
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: chunk
        - runs: |
            python${{range.key}} <<'EOF' | grep -F -e "Chunk ID: b'TEST', size: 10"
            import chunk
            import io

            # Arbitrary, dummy file data
            file_data = b'TEST\x00\x00\x00\x0A' + b'0123456789'
            file_obj = io.BytesIO(file_data)

            chunk_obj = chunk.Chunk(file_obj)
            chunk_id = chunk_obj.getname()
            chunk_size = chunk_obj.getsize()
            print(f"Chunk ID: {chunk_id!r}, size: {chunk_size}")

            chunk_obj.close()
            EOF

  - range: py-versions-old
    name: py${{range.key}}-standard-sunau
    description: sunau installed for python${{range.key}}
    pipeline:
      - working-directory: sunau
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - ffmpeg
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: sunau
        - runs: |
            ffmpeg -f lavfi -i "sine=f=1000:d=2" output.wav
            ffmpeg -i output.wav -acodec pcm_mulaw -ar 8000 output.au
            python${{range.key}} <<'EOF' | grep -F -e "channels: 1, sample width: 2"
            import sunau

            with sunau.open("output.au", 'r') as au_file:
              nchannels = au_file.getnchannels()
              sampwidth = au_file.getsampwidth()
              framerate = au_file.getframerate()
              nframes = au_file.getnframes()

              print(f"channels: {nchannels}, sample width: {sampwidth}")
            EOF

  - range: py-versions-audioop
    name: py${{range.key}}-standard-sunau
    description: sunau installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-audioop-lts
    pipeline:
      - working-directory: sunau
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - ffmpeg
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: sunau
        - runs: |
            ffmpeg -f lavfi -i "sine=f=1000:d=2" output.wav
            ffmpeg -i output.wav -acodec pcm_mulaw -ar 8000 output.au
            python${{range.key}} <<'EOF' | grep -F -e "channels: 1, sample width: 2"
            import sunau

            with sunau.open("output.au", 'r') as au_file:
              nchannels = au_file.getnchannels()
              sampwidth = au_file.getsampwidth()
              framerate = au_file.getframerate()
              nframes = au_file.getnframes()

              print(f"channels: {nchannels}, sample width: {sampwidth}")
            EOF

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
