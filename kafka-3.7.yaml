package:
  name: kafka-3.7
  # When bumping check to see if the CVE mitigation can be removed.
  version: 3.7.2
  epoch: 48 # GHSA-7p63-w6x9-6gr7
  description: Apache Kafka is a distributed event streaming platformm
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - kafka=${{package.full-version}}
    runtime:
      - bash # some helper scripts use bash
      - merged-usrsbin
      - openjdk-${{vars.java-version}}-default-jvm
      - wolfi-baselayout

vars:
  java-version: '21'

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - gradle-8
      - openjdk-${{vars.java-version}}-default-jdk
  environment:
    LANG: en_US.UTF-8
    JAVA_HOME: /usr/lib/jvm/default-jvm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/kafka
      tag: ${{package.version}}
      expected-commit: 79a8f2b5f44f9d5a6867190d1dfc463d08d60b82

  - uses: patch
    with:
      patches: |
        GHSA-4g8c-wm8x-jfhw-fix.patch
        GHSA-wxr5-93ph-8wr9-GHSA-j288-q9x7-2f5v.patch
        GHSA-7p63-w6x9-6gr7.patch

  - runs: |
      gradle clean releaseTarGz

      tar -xf core/build/distributions/kafka_2.13-${{package.version}}.tgz

      mkdir -p ${{targets.destdir}}/usr/lib/kafka/logs

      mv kafka_2.13-${{package.version}}/bin ${{targets.destdir}}/usr/lib/kafka
      mv kafka_2.13-${{package.version}}/libs ${{targets.destdir}}/usr/lib/kafka
      mv kafka_2.13-${{package.version}}/config ${{targets.destdir}}/usr/lib/kafka

      # Clean up Windows scripts
      rm -rf ${{targets.destdir}}/usr/lib/kafka/bin/*.bat
      rm -rf ${{targets.destdir}}/usr/lib/kafka/windows

test:
  environment:
    contents:
      packages:
        - uuidgen
        - wait-for-it
    environment:
      JAVA_HOME: /usr/lib/jvm/default-jvm
      LANG: en_US.UTF-8
  pipeline:
    - uses: test/daemon-check-output
      with:
        expected_output: started (kafka.server.KafkaServer)
        post: |
          #!/bin/sh
          set -e

          # Wait for Kafka to be fully ready
          wait-for-it localhost:9092 -t 30

          # Generate unique topic name
          TOPIC_NAME="test-topic-$(uuidgen)"

          # Create a Kafka topic
          /usr/lib/kafka/bin/kafka-topics.sh --create --topic "${TOPIC_NAME}" --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server localhost:9092

          # Produce a test message
          echo "Hello Kafka" | /usr/lib/kafka/bin/kafka-console-producer.sh --broker-list localhost:9092 --topic "${TOPIC_NAME}"

          # Consume the message
          consumed_message=$(timeout 10 /usr/lib/kafka/bin/kafka-console-consumer.sh --bootstrap-server localhost:9092 --topic "${TOPIC_NAME}" --from-beginning --max-messages 1)

          # Verify the message
          if [ "${consumed_message}" = "Hello Kafka" ]; then
            echo "SUCCESS: Message verification passed"
          else
            echo "FAIL: Expected Hello Kafka but got ${consumed_message}"
            exit 1
          fi

          # Clean up the test topic
          /usr/lib/kafka/bin/kafka-topics.sh --delete --topic "${TOPIC_NAME}" --bootstrap-server localhost:9092

          echo "Kafka functional test completed successfully"
        setup: |
          #!/bin/sh
          set -e

          # Start ZooKeeper (Kafka dependency)
          mkdir -p /tmp/zookeeper
          cat > /tmp/zookeeper.properties <<EOF
          dataDir=/tmp/zookeeper
          clientPort=2181
          maxClientCnxns=0
          admin.enableServer=false
          EOF

          /usr/lib/kafka/bin/zookeeper-server-start.sh /tmp/zookeeper.properties > /tmp/zk.log 2>&1 &
          echo "ZooKeeper started, waiting for port 2181..."
          wait-for-it localhost:2181 -t 60
        start: /usr/lib/kafka/bin/kafka-server-start.sh /usr/lib/kafka/config/server.properties
        timeout: "60"

update:
  enabled: true
  github:
    identifier: apache/kafka
    tag-filter: 3.7.
    use-tag: true
