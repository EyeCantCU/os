package:
  name: jbang
  version: "0.134.2"
  epoch: 0
  description: "JBang - Unleash the power of Java for scripting and beyond"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - bash
      - openjdk-${{vars.JAVA_VERSION}}-jre

vars:
  JAVA_VERSION: 17

environment:
  contents:
    packages:
      - bash
      - busybox
      - openjdk-${{vars.JAVA_VERSION}}-default-jdk
  environment:
    JAVA_HOME: /usr/lib/jvm/java-${{vars.JAVA_VERSION}}-openjdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jbangdev/jbang
      tag: v${{package.version}}
      expected-commit: a9a554d8ed41845ad9af5629551826db840aeb8e
      destination: jbang

  - name: Build JBang from source
    working-directory: jbang
    runs: |
      # Set version explicitly since git-versioner plugin needs git tags
      sed -i '/versioner\.apply()/a\
      \
      // Override version set by git-versioner plugin\
      project.version = "'${{package.version}}'"' build.gradle

      ./gradlew --no-daemon clean installDist -x test

      mkdir -p "${{targets.destdir}}/usr/share/jbang"
      cp -r build/install/jbang/* "${{targets.destdir}}/usr/share/jbang/"

      # Create symlink in /usr/bin
      mkdir -p "${{targets.destdir}}/usr/bin"
      ln -sf /usr/share/jbang/bin/jbang "${{targets.destdir}}/usr/bin/jbang"

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - openjdk-${{vars.JAVA_VERSION}}-default-jdk
    environment:
      JAVA_HOME: /usr/lib/jvm/java-${{vars.JAVA_VERSION}}-openjdk
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: jbang
    - uses: test/tw/ver-check
      with:
        bins: jbang
    - name: Test JBang basic functionality
      runs: |
        set -euo pipefail
        mkdir -p /tmp/jbang-test
        cd /tmp/jbang-test

        # Create a simple Hello World script
        tee hello.java <<'EOF'
        public class hello {
            public static void main(String[] args) {
                System.out.println("Hello from JBang!");
            }
        }
        EOF

        # Run the script
        jbang hello.java | grep -F "Hello from JBang!"
