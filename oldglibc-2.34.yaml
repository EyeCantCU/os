package:
  name: oldglibc-2.34
  version: 2.34
  epoch: 2
  description: "the GNU C library"
  copyright:
    - license: GPL-3.0-or-later
  options:
    no-provides: true
  dependencies:
    runtime:
      - linux-headers
    provides:
      - oldglibc=${{package.full-version}}
    replaces:
      - openssf-compiler-options

environment:
  contents:
    packages:
      - binutils
      - bison
      - busybox
      - ca-certificates-bundle
      - flex
      - gawk
      - gcc
      - grep
      - linux-headers
      - make-4.3
      - python3
      - rdfind
      - texinfo
      - wolfi-baselayout
      - zlib
  environment:
    CFLAGS: -fcommon

pipeline:
  - uses: fetch
    with:
      uri: http://ftp.gnu.org/gnu/libc/glibc-${{package.version}}.tar.xz
      expected-sha256: 44d26a1fe20b8853a48f470ead01e4279e869ac149b195dda4e44a195d981ab2

  - name: 'Set up build directory'
    runs: |
      mkdir build

  - name: 'Configure glibc'
    runs: |
      cd build

      ../configure \
        --prefix=/usr/lib/oldglibc \
        --host=${{host.triplet.gnu}} \
        --build=${{host.triplet.gnu}} \
        --disable-werror \
        libc_cv_cxx_link_ok=no \
        --enable-kernel=4.9

  - runs: |
      make -C build -j$(nproc)

  - runs: |
      make -C build -j$(nproc) install DESTDIR="${{targets.destdir}}"

  - name: 'Clean up'
    runs: |
      cd ${{targets.destdir}}/usr/lib/oldglibc
      rm -rf bin sbin etc libexec share var lib/*.o

  - name: 'Toolchain integration'
    runs: |
      cat <<EOF >${{targets.destdir}}/usr/lib/oldglibc/gcc.spec
      *cpp:
      + -I/usr/lib/oldglibc/include

      *link:
      + -L/usr/lib/oldglibc/lib
      EOF

      mkdir -p ${{targets.destdir}}/etc/clang
      cat <<EOF >${{targets.destdir}}/etc/clang/oldglibc.cfg
      -I/usr/lib/oldglibc/include
      -L/usr/lib/oldglibc/lib
      EOF

  - uses: strip

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: false
  exclude-reason: |
    oldglibc-2.34 is a fixed old version of glibc. The version here is
    picked to result in most backwards compatible binaries for
    manylinux wheels. It is glibc supported by Debian Bullseye, Ubuntu
    22.04, RHEL 9.
