package:
  name: nri-haproxy-fips
  version: "3.2.3"
  epoch: 1
  description: New Relic Infrastructure haproxy Integration (FIPS)
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-haproxy
      expected-commit: 283b7c7feffa72a0cf15425eb75dc64c53a4e933
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-haproxy
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-haproxy ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-haproxy
          install -Dm644 legacy/haproxy-definition.yml ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/haproxy-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-haproxy
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-haproxy
    - uses: test/tw/ver-check
      with:
        bins: nri-haproxy
        version-flag: "-show_version"
    - name: "Test binary execution"
      uses: test/daemon-check-output
      with:
        start: |
          nri-haproxy
        expected_output: |
          Must supply a URL pointing to the HAProxy stats page
        error_strings: |
          "FAIL"
          "Traceback.*most.recent.call"
