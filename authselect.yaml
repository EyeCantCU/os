package:
  name: authselect
  version: "1.6.2"
  epoch: 1
  copyright:
    - license: GPL-3.0-only

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext-dev
      - libselinux-dev
      - libtool
      - pkgconf-dev
      - popt-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/authselect/authselect.git
      expected-commit: 257cd1727a5fee2cf4f0b7355da1ce064eaa0acc
      tag: ${{package.version}}

  - uses: autoconf/configure
    with:
      opts: |
        --enable-silent-rules \
        --with-nis-profile

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

update:
  enabled: true
  git:
    strip-prefix: authselect-

subpackages:
  - name: ${{package.name}}-static
    description: ${{package.name}} static libraries
    pipeline:
      - uses: split/static
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-dev
    description: ${{package.name}} development libraries
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/pkgconf

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Smoke tests
      runs: |
        set -euo pipefail
        authselect version | grep -F -e "${{package.version}}"
    - name: Ensure authselect profile selecting works
      runs: |
        set -euo pipefail
        authselect select local --force
        authselect check
        authselect enable-feature "$(authselect list-features local | head -n 1)"
        grep -F -e "local" /etc/authselect/authselect.conf
        authselect opt-out
        [ ! -e /etc/authselect/authselect.conf ] && echo "Successfully opted-out"
