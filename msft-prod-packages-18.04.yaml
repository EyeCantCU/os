package:
  name: msft-prod-packages-18.04
  version: 18.04
  epoch: 0
  description: "Microsoft Packaged Linux Software"
  copyright:
    - license: MIT # https://github.com/microsoft/linux-package-repositories
  dependencies:
    provides:
      - msft-prod-packages=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://packages.microsoft.com/config/ubuntu/${{package.version}}/packages-microsoft-prod.deb
      expected-sha512: 3e2cae36977313daeec178f0f921608a642134e267eb966da8052a68a7fb6995e5835a38fb152b0658a8e7d4ff76c4162138c1857af8466cf6c2996f213d8ccf
      extract: false

  - runs: |
      mkdir -p "${{targets.contextdir}}"/blobfuse-proxy
      mv packages-microsoft-prod.deb "${{targets.contextdir}}"/blobfuse-proxy/packages-microsoft-prod-${{package.version}}.deb
      rm -rf packages-microsoft-prod.deb

update:
  enabled: false
