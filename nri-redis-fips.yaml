package:
  name: nri-redis-fips
  version: "1.12.7"
  epoch: 0
  description: New Relic Infrastructure redis Integration (FIPS)
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-redis
      expected-commit: 75a4684a0c1107718fa2bff61764b3a586035ca2
      tag: v${{package.version}}

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-redis
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-redis ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-redis
          install -Dm644 legacy/redis-definition.yml ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/redis-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-redis
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-redis
    - uses: test/tw/ver-check
      with:
        bins: nri-redis
        version-flag: "-show_version"
    - name: Test binary execution
      uses: test/daemon-check-output
      with:
        start: |
          nri-redis
        expected_output: |
          connect: connection refused
        error_strings: |
          FAIL
          Traceback.*most.recent.call
