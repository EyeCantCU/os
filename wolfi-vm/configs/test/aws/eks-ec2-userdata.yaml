apiVersion: node.eks.aws/v1alpha1
kind: NodeConfig
spec:
  cluster:
    name: standalone
    apiServerEndpoint: 127.0.0.1
    # Throw-away certificate! nodeadm gets unhappy if no value is provided,
    # whereas kubelet only gets unnappy if the provided value is no certificate.
    #   $ openssl req -x509 -newkey rsa:4096 -keyout /dev/null -sha256 -days 365 -nodes -subj '/CN=localhost' 2>/dev/null | base64 -w0
    certificateAuthority: 
    cidr: 10.1.0.0/16
  featureGates:
    # Using the instance ID as node name avoids a call to the DescribeInstances
    # API, which requires an instance role with suitable policy to be attached
    # to the instance.
    InstanceIdNodeName: true
  kubelet:
    config:
      # Avoid talking to the (missing) API server.
      registerNode: false
