version: 1
cloud: aws
data:
  vmuser: ec2-user
vmconfigs:
  x86_64:
    - instance_type: t3.medium
      tests:
        - group: core
        - group: secureboot
        - group: containers
        - group: compliance
  aarch64:
    - instance_type: t4g.medium
      tests:
        - group: core
        - group: secureboot
        - group: containers
        - group: compliance
