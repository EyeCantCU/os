version: 1
cloud: gcp
data:
  vmuser: test
  zone: us-central1-a
vmconfigs:
  x86_64:
    - machine_type: n2-standard-2
      disk_size: 20
      disk_type: pd-balanced
      secondary_disk_name: home
      secondary_disk_size: 10
      metadata: startup-script=printf "hello wolfi" > /tmp/hello-wolfi.txt;enable-oslogin=false
      nested_virt: true
      tests:
        - group: core
        - group: containers
        - group: hypervisor
        - group: gcp
        - name: applications/qemu
    - machine_type: n4-standard-2
      disk_size: 20
      disk_type: hyperdisk-balanced
      secondary_disk_name: home
      secondary_disk_size: 10
      metadata: startup-script=printf "hello wolfi" > /tmp/hello-wolfi.txt;enable-oslogin=false
      nested_virt: true
      tests:
        - group: core
        - group: containers
        - group: hypervisor
        - group: gcp
        - name: applications/qemu
  aarch64:
    - machine_type: t2a-standard-2
      disk_size: 20
      disk_type: pd-balanced
      secondary_disk_name: home
      secondary_disk_size: 10
      metadata: startup-script=printf "hello wolfi" > /tmp/hello-wolfi.txt;enable-oslogin=false
      tests:
        - group: core
        - group: containers
        - group: gcp
    - machine_type: c4a-standard-2
      disk_size: 20
      disk_type: hyperdisk-balanced
      secondary_disk_name: home
      secondary_disk_size: 10
      metadata: startup-script=printf "hello wolfi" > /tmp/hello-wolfi.txt;enable-oslogin=false
      tests:
        - group: core
        - group: containers
        - group: gcp
