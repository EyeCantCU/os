version: 1
cloud: azure
data:
  vmuser: azureuser
  region: eastus
vmconfigs:
  x86_64:
    - vm_size: Standard_F2s_v2
      disk_type: StandardSSD_LRS
      tests:
        - group: core
        - group: azure
        - group: secureboot
        - group: selinux
    # TODO: make this work
    #- vm_size: Standard_F2as_v6
    #  disk_type: StandardSSD_LRS
    #  tests:
    #    - group: core
    - vm_size: Standard_D2_v4
      # The variant of this that includes local storage (Dpdsv6)
      # doesn't supported nested virt which we want to test with
      # hypervisor test, so don't run azure resourcedisk test.
      disk_type: StandardSSD_LRS
      tests:
        - group: core
        - group: hypervisor
        - group: secureboot
        - group: selinux
        - name: azure/routing
        - name: azure/accel_net
  # Don't run azure/resourcedisk on devices with NVME resource disks (which
  # includes ARM machine types)
  # https://github.com/Azure/WALinuxAgent/issues/2885
  aarch64:
    - vm_size: Standard_D2pds_v6
      disk_type: StandardSSD_LRS
      tests:
        - group: core
        - name: azure/routing
        - name: azure/accel_net
        - group: secureboot
        - group: selinux
    - vm_size: Standard_E2pds_v6
      disk_type: StandardSSD_LRS
      tests:
        - group: core
        - name: azure/routing
        - name: azure/accel_net
        - group: secureboot
        - group: selinux
