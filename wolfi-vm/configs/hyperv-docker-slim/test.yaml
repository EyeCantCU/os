version: 1
# Not really, but it works for testing
cloud: azure
data:
  vmuser: linky
  region: eastus
vmconfigs:
  # Just use a single instance type each, we just want to know it works on a Hyper-V
  # system like Azure.
  x86_64:
    - vm_size: Standard_F2s_v2
      disk_type: StandardSSD_LRS
      tests:
        - group: core
        - group: containers
  aarch64:
    - vm_size: Standard_D2ps_v6
      disk_type: StandardSSD_LRS
      tests:
        - group: core
        - group: containers
