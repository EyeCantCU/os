awspub:
  source:
    path: "../../output/aarch64/aws-base/disk.vmdk"
    architecture: "arm64"
  s3:
    bucket_name: "chainguard-marketplace-vms"
  images:
    "chainguard-base-arm64-$BUILD_TIMESTAMP":
      description: "chainguard-base-arm64-$BUILD_TIMESTAMP"
      boot_mode: "uefi"
      public: false
      tpm_support: "v2.0"
      imds_support: "v2.0"
      share:
        # Chainguard Dev Organization unit
        - "arn:aws:organizations::412589716172:ou/o-anih79mrvn/ou-amv9-ndi0nlgq"
        - "677043465004" # chainguard-test-vms
        # Can also list
        # - "12-digit-aws-account-id"
        # - "arn:aws:organizations" for Org or OU
      regions:
        - "us-east-1"
      marketplace:
        entity_id: "prod-bj6ldrl6fyhlg"
        access_role_arn: "arn:aws:iam::607334848609:role/chainguard-marketplace-ami-ingestion"
        version_title: "$BUILD_TIMESTAMP"
        release_notes: "Chainguard Base arm64 $BUILD_TIMESTAMP"
        user_name: "ec2-user"
        scanning_port: 22
        os_name: "OTHERLINUX"
        os_version: "20230214"
        usage_instructions: |
          Connect using ec2-user
        recommended_instance_type: "m7g.large"
        security_groups:
          -
            from_port: 22
            ip_protocol: "tcp"
            ip_ranges:
              - "0.0.0.0/0"
            to_port: 22
