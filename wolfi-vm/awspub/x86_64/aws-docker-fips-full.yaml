awspub:
  source:
    path: "$WOLFI_VM/output/x86_64/aws-docker-fips-full/disk.vmdk"
    architecture: "x86_64"
  s3:
    bucket_name: "chainguard-marketplace-vms"
  images:
    "chainguard-docker-fips-dev-x86_64-$BUILD_TIMESTAMP":
      description: "chainguard-docker-fips-dev-x86_64-$BUILD_TIMESTAMP"
      boot_mode: "uefi"
      public: false
      uefi_data: "$WOLFI_VM/output/x86_64/aws-docker-fips-full/uefi-data.aws"
      tpm_support: "v2.0"
      imds_support: "v2.0"
      share:
        # Chainguard Dev Organization unit
        - "arn:aws:organizations::412589716172:ou/o-anih79mrvn/ou-amv9-ndi0nlgq"
        - "677043465004" # chainguard-test-vms
        # Can also list
        # - "12-digit-aws-account-id"
        # - "arn:aws:organizations" for Org or OU
      regions:
        - "us-east-1"
