name: Config Tests

on:
  # This workflow is intentionally very small, so that it is
  # as obviously correct as possible.  Add complexity to it
  # at your peril!
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  config-valid-test:
    runs-on: ubuntu-8-core

    permissions:
      contents: read

    steps:
      - uses: step-security/harden-runner@df199fb7be9f65074067a9eb93f12bb4c5547cf2 # v2.13.3
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@3e8a2a226fad9e1ecbf2d359b8a7697554a4ac6d # v1.5.10

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: './go.mod'

      # Add a block like this in a separate PR *before* landing tests in a new module.
      - name: Install apko
        run: |
          GOBIN=/usr/local/bin go install chainguard.dev/apko@latest

      - name: Check apko configs
        shell: bash
        run: |
          for i in configs/*/build.yaml; do
            echo "Validating $i ..."
            /usr/local/bin/apko show-config $i 2>/tmp/out
            if [ "$?" -ne 0 ]; then
              echo "Error validating $i"
              cat /tmp/out
              break
            fi
          done
