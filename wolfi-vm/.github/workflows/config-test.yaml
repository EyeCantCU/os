name: Config Tests

on:
  # This workflow is intentionally very small, so that it is
  # as obviously correct as possible.  Add complexity to it
  # at your peril!
  pull_request:
    branches:
      - "main"

permissions: {}

jobs:
  config-valid-test:
    runs-on: ubuntu-8-core

    permissions:
      contents: read

    steps:
      - uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@f632aec66edeebe245ad686a33a0c0a2160cac31 # v1.4.14

      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v3.0.0
        with:
          go-version: '1.24'
          check-latest: true
          cache: false

      # Add a block like this in a separate PR *before* landing tests in a new module.
      - name: Install apko
        run: |
          GOBIN=/usr/local/bin go install chainguard.dev/apko@latest

      - name: Check apko configs
        shell: bash
        run: |
          for i in configs/*/build.yaml; do
            echo "Validating $i ..."
            /usr/local/bin/apko show-config $i 2>/tmp/out
            if [ "$?" -ne 0 ]; then
              echo "Error validating $i"
              cat /tmp/out
              break
            fi
          done
