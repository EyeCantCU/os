name: "Build and push AWS VMs images"

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      notify-slack:
        type: boolean
        required: false
        default: false
        description: Notify slack when the workflow finishes.
      notify-slack-success:
        type: boolean
        required: false
        default: true
        description: Send notifications on success as well as failure.
      publish-to-marketplace:
        type: boolean
        required: true
        description: Publish uploaded and tested AMIs to the AWS Marketplace
      with-compliance-scan:
        type: boolean
        required: true
        description: Generate reports for CIS and STIG compliance

permissions: {}

# awspub locks marketplace listings, thus can only have one of them
# running at a given time.
#
# also last one, gets marked as latest in SSM parameteres, thus best
# to wait for previous run to finish (or get cancelled) before
# starting a new one. To avoid earlier build, finishing later, and
# getting marked as latest.
#
# Allow only one workflow run at a time
concurrency:
  group: 'release-aws'
  cancel-in-progress: false

jobs:
  init:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core
    outputs:
      BUILD_TIMESTAMP: ${{ steps.timestamp.outputs.BUILD_TIMESTAMP }}
    steps:
      - id: timestamp
        run: |
          echo BUILD_TIMESTAMP=$(date --utc "+%Y%m%d-%H%M") >> "$GITHUB_OUTPUT"

  aws-build-push:
    runs-on: ubuntu-8-core
    needs:
      - init

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64
        group:
          - aws-ecs
          - aws-eks
          - aws-main

    env:
      BUILD_TIMESTAMP: ${{ needs.init.outputs.BUILD_TIMESTAMP }}
      VM_ARCH: ${{ matrix.arch }}
      VM_GROUP: ${{ matrix.group }}
      VM_CLOUD: 'aws'
      PUBLISH_TO_MP: ${{ github.event.inputs.publish-to-marketplace || 'on-schedule' }}
      WITH_COMPLIANCE_SCAN: ${{ github.event.inputs.with-compliance-scan || 'true' }}

    steps:
      - uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@b479012116eacde7f895586c17b598f7ba0ee700 # v1.5.9

      - name: Checkout source
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build vms disks
        uses: './.github/actions/build-disks'
        with:
          cg_identity: "ce2d1984a010471142503340d670612d63ffb9f6/381a2db906b88c20"
          vm_group: "${{ matrix.group }}"
          arch: '${{ matrix.arch }}'

      - name: Scan disks
        uses: './.github/actions/scan-disks'
        with:
          vm_group: "aws-${{matrix.group}}"
          arch: '${{ matrix.arch }}'

      - name: add HOME/bin to PATH
        run: |
          # ensure HOME/bin is in PATH
          d="$HOME/bin"
          mkdir -p "$d"
          p="$PATH"
          echo "original-path: $p"
          p="$d:$PATH"
          echo "new-path: $p"
          echo "PATH=$p" >> "$GITHUB_ENV"

      - name: "Setup AWS Creds"
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          # the secret used is the marketplace AWS account id
          # AWS account aws-marketplace
          role-to-assume: arn:aws:iam::607334848609:role/wolfi-vms-github-postsubmit-role
          aws-region: us-east-1
          role-duration-seconds: 7200

      - name: "Install AWS Deps"
        run: |
          if out=$(command -v aws); then
              echo "already had aws: $out"
          else
              curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip awscliv2.zip
              ./aws/install --install-dir $HOME/aws-cli --bin-dir $HOME/bin
          fi
          aws --version

          if ! dpkg-query --show | grep python3-venv ; then
              sudo apt-get install --assume-yes python3-venv
          fi
          mkdir -p $HOME/venvs
          python3 -m venv $HOME/venvs/awspub

          $HOME/venvs/awspub/bin/pip install awspub
          $HOME/venvs/awspub/bin/pip show awspub

          ln -s $HOME/venvs/awspub/bin/awspub $HOME/bin/

      - name: "Create AWS Images"
        run: |
          # The request limit for VM imports on the AWS account in us-east-1
          # is currently 50. Adjust the concurrent upload tasks accordingly.
          num_jobs=$(( 50 / ${{ strategy.job-total }} ))
          [[ -n "$num_jobs" ]] || num_jobs=8
          make -j "$num_jobs" --output-sync=recurse aws-create-${VM_GROUP} BUILD_TIMESTAMP=${BUILD_TIMESTAMP} ARCH=${{ env.VM_ARCH }}

      - name: "Show publish output"
        run: |
          for f in output/${{ matrix.arch }}/awspub/create/*.json; do
            echo == $f ==
            cat $f
            echo
          done

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: awspub-create-${{ matrix.group}}-${{ matrix.arch }}
          path: ./output/${{ matrix.arch }}/awspub/create

      - name: "Setup Test AWS Creds"
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          # AWS account chainguard-test-vms
          role-to-assume: arn:aws:iam::677043465004:role/cg-test-vms-postsubmit-role
          aws-region: us-east-1
          role-duration-seconds: 7200

      - name: "Test AWS Images"
        uses: './.github/actions/vms-test'
        with:
          cloud_provider: "aws"
          vm_group: '${{ matrix.group }}'
          arch: '${{ matrix.arch }}'
          opts: >-
            --
            --launch-group=wolfi-vm-test
            --awspub-inputs=./output/${{ env.VM_ARCH }}/awspub/create/
            --region=us-east-1
          with-compliance-scan: '${{ env.WITH_COMPLIANCE_SCAN }}'

      # Publish to the registry
      - name: Publish AWS images to the registry
        continue-on-error: true
        run: |
          arch="${{ env.VM_ARCH }}"
          make -j$(nproc) --output-sync=recurse publish-registry-${VM_GROUP} ARCH=$arch

      - name: "[ECS+EKS] Refresh Test AWS Creds"
        if: ${{ matrix.group != 'aws-main' }}
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          # AWS account chainguard-test-vms
          role-to-assume: arn:aws:iam::677043465004:role/cg-test-vms-postsubmit-role
          aws-region: us-east-1
          role-duration-seconds: 7200

      - name: "[ECS] AWS ECS Container Instances"
        if: matrix.group == 'aws-ecs'
        uses: './.github/actions/test-ecs-container-instance'
        with:
          aws-region: us-east-1
          artifact-suffix: "-${{ matrix.arch }}-${{ matrix.group }}"
          awspub-inputs-dir: ./output/${{ matrix.arch }}/awspub/create

      - name: "[EKS] AWS EKS Nodes"
        if: matrix.group == 'aws-eks'
        uses: './.github/actions/test-eks-node'
        with:
          aws-region: us-east-1
          artifact-suffix: "-${{ matrix.arch }}-${{ matrix.group }}"
          awspub-inputs-dir: ./output/${{ matrix.arch }}/awspub/create

      - name: "Setup AWS Creds"
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          # the secret used is the marketplace AWS account id
          # AWS account aws-marketplace
          role-to-assume: arn:aws:iam::607334848609:role/wolfi-vms-github-postsubmit-role
          aws-region: us-east-1

      - name: "Share AWS Images"
        run: |
          num_jobs=$(( 50 / ${{ strategy.job-total }} ))
          [[ -n "$num_jobs" ]] || num_jobs=8
          make -j "$num_jobs" --output-sync=recurse aws-share-${VM_GROUP} BUILD_TIMESTAMP=${BUILD_TIMESTAMP} ARCH=${{ env.VM_ARCH }}

      - name: "Publish AWS Images to marketplace"
        shell: bash
        run: |
          if [ "$PUBLISH_TO_MP" = 'on-schedule' ]; then
            # If this is a scheduled run, limit how often the images get published to the AWS Marketplace
            # as there is a limit of 100 version per product (and reducing the number of versions requires
            # coordination with AWS Support). Hand off the decision whether to publish to a helper script
            # (so the script can be tested in isolation). The intention is to publish once on Monday, or
            # whenever the next scheduled build after that succeeds and passes testing (i.e. whenever the
            # last published build is older than 7 days).
            #
            # It is sufficient to look at a single product from this job as all products from the same
            # (group, architecture) tuple are published at the same time. While a publish request for a
            # single product from the group could fail asynchronously, historically that failure is likely
            # to be persistent and need manual intervention. Republishing the entire group when only one
            # of the products needs publishing will quickly exhaust the version limit.

            should_publish=no

            mapfile -t variants < <(make "list-$VM_GROUP")
            for variant in "${variants[@]}"; do
              product_id=$(yq .awspub.images[].marketplace.entity_id awspub/"$VM_ARCH"/"$variant".yaml | head -1)
              if [ "$product_id" = 'null' ]; then
                echo "Variant $variant is not yet being published on the AWS Marketplace. Checking another."
                continue
              fi

              echo "Evaluating $variant ($product_id) for whether the group needs to be published..."
              if should_publish=$(./tools/aws-should-ci-publish "$product_id"); then
                break
              else
                echo "Failed to decide whether to publish variant $variant ($product_id)."
              fi
            done

            case "$should_publish" in
              yes)
                PUBLISH_TO_MP=true
                ;;
              no)
                PUBLISH_TO_MP=false
                ;;
              *)
                echo "Unexpected verdict '$should_publish'."
                exit 1
            esac
          fi

          case "$PUBLISH_TO_MP" in
            true)
              :
              ;;
            false)
              exit 0
              ;;
            *)
              echo "Unexpected value for PUBLISH_TO_MP: '$PUBLISH_TO_MP'. Allowed values: 'true', 'false', 'on-schedule.'"
              exit 1
          esac

          make -j4 --output-sync=recurse "aws-publish-${VM_GROUP}" BUILD_TIMESTAMP=${BUILD_TIMESTAMP} ARCH=${{ env.VM_ARCH }}

      - name: "Setup ONA S3 Creds"
        if: matrix.group == 'aws-ecs'
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: arn:aws:iam::607334848609:role/chainguard-ona-publication
          aws-region: us-east-1

      - name: "Publish ONA Images to S3"
        if: matrix.group == 'aws-ecs'
        run: |
          make bespoke-publish-s3-aws-ecs-request-6943-full PREFIX=chainguard BUILD_TIMESTAMP=${BUILD_TIMESTAMP} ARCH=${{ env.VM_ARCH }} PUBLISH_TARGET=ona
          make bespoke-publish-s3-aws-ecs-immutable-full PREFIX=chainguard BUILD_TIMESTAMP=${BUILD_TIMESTAMP} ARCH=${{ env.VM_ARCH }} PUBLISH_TARGET=ona

      - uses: './.github/actions/notify-slack'
        if: ${{ (inputs.notify-slack-success || !success()) && (github.event_name == 'schedule' || inputs.notify-slack) }}
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_INPUT }}
          title: ${{ github.workflow }} (${{ matrix.arch }}, ${{ matrix.group }}) ${{ job.status }}
          message-color: ${{ job.status == 'success' && '#3fb950' || '#f85149'}}
          text: |
            For detailed logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Or run ./hack/fetch-test-result -c ${{ env.VM_CLOUD }} -r ${{ github.run_id }} -a ${{ matrix.arch }} -f 'test-results-*${{matrix.group}}*'
          unfurl-links: true
