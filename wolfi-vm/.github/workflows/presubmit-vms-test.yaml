name: "Test Harness Pre-submit checks"

on:
  pull_request_target:
    branches:
      - "main"
  push:

permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read # read repo

    strategy:
      fail-fast: true
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable

      - name: Install deps
        working-directory: ./vms-test
        run: |
          ./helpers/install-deps --test-arch="$arch"

      - name: lint
        working-directory: ./vms-test
        run: |
          make gofmt
          make shellcheck

      - name: make runners
        working-directory: ./vms-test
        run: |
          make runners

      - name: make tests
        working-directory: ./vms-test
        run: |
          make tests

      - name: make unit-test
        working-directory: ./vms-test
        run: |
          make unit-test
