name: "Reproducible builds Pre-submit check"

on:
  pull_request_target:
    branches:
      - "main"

permissions: {}

jobs:
  reproducible-check:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    env:
      TARGET_ARCH: ${{ matrix.arch }}

    steps:
      - uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@b479012116eacde7f895586c17b598f7ba0ee700 # v1.5.9

      - uses: chainguard-dev/actions/setup-melange@b479012116eacde7f895586c17b598f7ba0ee700 # v1.5.9

      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: chainguard-dev/setup-chainctl@be0acd273acf04bfdf91f51198327e719f6af978 # v0.4.0
        with:
          identity: "ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849"

      - name: Get apk.cgr.dev token
        shell: bash
        run: |
          chainctl auth login --identity=${CG_IDENTITY} --audience=apk.cgr.dev
          cred=$(chainctl auth token --audience=apk.cgr.dev)
          echo "HTTP_AUTH=basic:apk.cgr.dev:user:$cred" >> $GITHUB_ENV
        env:
          CG_IDENTITY: "ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849"

      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version-file: './go.mod'

      - name: Install deps
        shell: bash
        run: |
          make install-deps

      - name: make clean
        shell: bash
        run: |
          make clean

      - name: make apkoaas
        shell: bash
        run: |
          make apkoaas

      - name: make builder
        shell: bash
        run: |
          make builder/kernel-x86_64 builder/initrd-builder-x86_64

      - name: make disk 1/2
        shell: bash
        run: |
          mkdir run1
          cd run1
          ../apkoaas build --arch="${TARGET_ARCH}" \
            --kernel="../builder/kernel-x86_64" \
            --builder-cpio="../builder/initrd-builder-x86_64" \
            ../configs/test/reproducible/build.yaml
          sudo ../tools/image-summary disk.raw ./summary/

      - name: make disk 2/2
        shell: bash
        run: |
          mkdir run2
          cd run2
          ../apkoaas build --arch="${TARGET_ARCH}" \
            --kernel="../builder/kernel-x86_64" \
            --builder-cpio="../builder/initrd-builder-x86_64" \
            ../configs/test/reproducible/build.yaml
          sudo ../tools/image-summary disk.raw ./summary/
          cd ..

      - name: compare artifacts
        shell: bash
        run: |
          git diff --no-index run1/summary run2/summary
          cmp run*/apko-${TARGET_ARCH}.tar.gz || exit 1
          cmp run*/disk.raw || exit 1

      - name: upload summary results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: disk-summaries-${{ matrix.arch }}
          path: run*/summary/
