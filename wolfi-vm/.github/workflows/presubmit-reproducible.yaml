name: "Reproducible builds Pre-submit check"

on:
  pull_request_target:
    branches:
      - "main"

permissions: {}

jobs:
  reproducible-check:
    if: ${{ github.repository == 'chainguard-dev/wolfi-vm' }}

    runs-on: ubuntu-8-core

    permissions:
      id-token: write # federated identity
      contents: read # read repo

    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64

    steps:
      - uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: chainguard-dev/actions/apt-faster@708219d4822f33611ac1a2653815cc10e1ab54a6 # v1.4.7

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: chainguard-dev/setup-chainctl@f4ed65b781b048c44d4f033ae854c025c5531c19 # v0.3.2
        with:
          identity: "ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849"

      - name: Get apk.cgr.dev token
        shell: bash
        run: |
          chainctl auth login --identity=${CG_IDENTITY} --audience=apk.cgr.dev
          cred=$(chainctl auth token --audience=apk.cgr.dev)
          echo "HTTP_AUTH=basic:apk.cgr.dev:user:$cred" >> $GITHUB_ENV
        env:
          CG_IDENTITY: "ce2d1984a010471142503340d670612d63ffb9f6/bd9fd6bb14892849"

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          check-latest: true

      - name: Install deps
        shell: bash
        run: |
          make install-deps

      - name: make clean
        shell: bash
        run: |
          make clean

      - name: make apkoaas
        shell: bash
        run: |
          make apkoaas

      - name: make builder
        shell: bash
        run: |
          make builder

      - name: make disk 1/2
        shell: bash
        run: |
          mkdir run1
          cd run1 && ../apkoaas build --builder-cpio ../builder/initrd-x86_64 --kernel ../builder/kernel-x86_64 ../configs/test/reproducible/build.yaml
          cd ..

      - name: make disk 2/2
        shell: bash
        run: |
          mkdir run2
          cd run2 && ../apkoaas build --builder-cpio ../builder/initrd-x86_64 --kernel ../builder/kernel-x86_64 ../configs/test/reproducible/build.yaml
          cd ..

      - name: compare artifacts
        shell: bash
        run: |
          cmp run*/apko-x86_64.tar.gz || exit 1
          cmp run*/disk.raw || exit 1
