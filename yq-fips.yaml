package:
  name: yq-fips
  version: "4.49.2"
  epoch: 0
  description: "yq is a portable command-line YAML, JSON, XML, CSV and properties processor"
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mikefarah/yq
      tag: v${{package.version}}
      expected-commit: 7ccaf8e700ce99eb3f0f6cef7f5930a0b3c827cd

  - uses: go/build
    with:
      packages: .
      output: yq
      go-package: go-fips

  - uses: strip

test:
  pipeline:
    - runs: |
        yq --version | grep "version v${{package.version}}"
        yq --help
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: mikefarah/yq
    strip-prefix: v
