package:
  name: yq-fips
  version: 4.44.5
  epoch: 0
  description: "yq is a portable command-line YAML, JSON, XML, CSV and properties processor"
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mikefarah/yq
      tag: v${{package.version}}
      expected-commit: bc5b54cb1d1f720db16c9f75c5b45384d00e5cbf

  - uses: go/build
    with:
      packages: .
      output: yq
      go-package: go-fips

  - uses: strip

test:
  pipeline:
    - runs: |
        yq --version | grep "version v${{package.version}}"
        yq --help
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: mikefarah/yq
    strip-prefix: v
