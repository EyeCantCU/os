package:
  name: yq-fips
  version: "4.46.1"
  epoch: 1
  description: "yq is a portable command-line YAML, JSON, XML, CSV and properties processor"
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mikefarah/yq
      tag: v${{package.version}}
      expected-commit: 1187c954ec44c3a0e62c13ca7dc9dadc1ca80ae7

  - uses: go/build
    with:
      packages: .
      output: yq
      go-package: go-fips

  - uses: strip

test:
  pipeline:
    - runs: |
        yq --version | grep "version v${{package.version}}"
        yq --help
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: mikefarah/yq
    strip-prefix: v
