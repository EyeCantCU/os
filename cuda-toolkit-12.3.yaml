package:
  name: cuda-toolkit-12.3
  version: 12.3
  # version of the the cuda-toolkit and the run-time dependencies are tracked referencing NVIDIA's toolkit versions
  epoch: 0
  description: Meta-package for providing CUDA-toolkit packages
  copyright:
    - license: PROPRIETARY
  dependencies:
    runtime:
      - nvidia-cuda-cudart-12
      - nvidia-cuda-nvcc-12
      - nvidia-cuda-nvml-dev-12
      - nvidia-cuda-nvrtc-12
      - nvidia-cuda-nvtx-12
      - nvidia-libcublas-12
      - nvidia-libcufft-12
      - nvidia-libcurand-12
      - nvidia-libcusolver-12
      - nvidia-libcusparse-12
      - nvidia-libnvjitlink-12
      - nvidia-cudnn-8

update:
  enabled: false
