package:
  name: pypy
  epoch: 0
  version: 7.3.18
  copyright:
    - license: Apache-2.0
  options:
    no-depends: true
    no-provides: true
  dependencies:
    runtime:
      - bzip2-dev
      - ncurses

environment:
  contents:
    packages:
      - autoconf
      - pypy-bootstrap
      - automake
      - build-base
      - busybox
      - bzip2-dev
      - expat-dev
      - gdbm-dev
      - linux-headers
      - ncurses-dev
      - openssl-dev>3
      - perl
      - posix-libc-utils
      - readline-dev
      - rpcgen
      - rsync
      - sqlite-dev
      - tk-dev
      - util-linux-misc
      - wget
      - xz-dev
      - zlib-dev
      - libx11-dev
      - libffi-a
      - tcl-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypy/pypy.git
      tag: release-pypy3.11-v${{package.version}}
      expected-commit: b38de282ceade09de223a35c450387da97e4938b

  - uses: patch
    with:
      patches: pointer.patch signal.patch pyconfig.patch sqlite.patch
  - working-directory: pypy/goal
    runs: |
      /usr/lib/pypy/bin/pypy-c ../../rpython/bin/rpython --opt=jit --shared targetpypystandalone

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/lib/pypy/bin/pypy-c
      mkdir -p ${{targets.contextdir}}/usr/lib/pypy/lib_pypy
      mkdir -p ${{targets.contextdir}}/usr/bin
      install -Dm755 pypy/goal/pypy3.11-c "${{targets.contextdir}}"/usr/lib/pypy/bin/pypy3.11-c
      install -Dm755 pypy/goal/libpypy3.11-c.so "${{targets.contextdir}}"/usr/lib/pypy/bin/libpypy3.11-c.so

      rsync -r --exclude='__pycache__' --exclude='test' --exclude='tests' lib-python/ "${{targets.contextdir}}"/usr/lib/pypy/lib-python/
      rsync -r --exclude='__pycache__' --exclude='*.c' --exclude '*.o' lib_pypy/ "${{targets.contextdir}}"/usr/lib/pypy/lib_pypy/
      rsync -r --include='*.h' -f 'hide,! */' include/ "${{targets.contextdir}}"/usr/lib/pypy/include/

      # # Install symlinks
      ln -s ${{targets.destdir}}/usr/bin/pypy3.11-c  ${{targets.contextdir}}/usr/bin/pypy

update:
  enabled: true
  github:
    identifier: pypy/pypy
    strip-prefix: v
    tag-filter-prefix: release-pypy3.11-v

test:
  pipeline:
    - runs: /usr/lib/pypy/bin/pypy3.11-c --version
