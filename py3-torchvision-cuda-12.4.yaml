package:
  name: py3-torchvision-cuda-12.4
  version: 0.21.0
  epoch: 0
  description: Datasets, Transforms and Models specific to Computer Vision
  copyright:
    - license: BSD-3-Clause
  target-architecture:
    - x86_64
  resources:
    cpu: 16
    memory: 16Gi
  options:
    no-depends: true
  dependencies:
    runtime:

vars:
  cudnn-version: 9
  gcc-version: 12
  torch-version: 2.6
  pypi-package: torchvision
  import: torchvision

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.\d+$'
    replace: '$1'
    to: cuda-major-version
  - from: ${{package.name}}
    match: '.*cuda-(\d+)\.(\d+)$'
    replace: 'cu$1$2'
    to: cuda-pyvariant

data:
  - name: py-versions
    items:
      3.13: "313"

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-15
      - clang-15-default
      - clang-15-dev
      - cmake
      - coreutils
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - gcc-${{vars.gcc-version}}-default
      - git
      - libffi-dev
      - libgomp
      - libjpeg-dev
      - libjpeg-turbo-dev
      - libpng-dev
      - libpng-utils
      - llvm-lld-15
      - llvm15
      - llvm15-dev
      - nvidia-cuda-cccl-${{vars.cuda-version}}
      - nvidia-cuda-profiler-api-${{vars.cuda-version}}
      - nvidia-driver
      - nvidia-nccl-cuda-${{vars.cuda-version}}-dev
      - openmp-17-dev
      - patchelf
      - posix-libc-utils
      - py3-supported-build-base-dev
      - py3-supported-numpy
      - py3-supported-torch-${{vars.torch-version}}-cuda-${{vars.cuda-version}}-dev
      - samurai
  environment:
    BUILD_VERSION: ${{package.version}}+${{vars.cuda-pyvariant}}
    CFLAGS: -Wno-error=nonnull -Wno-nonnull
    CXXFLAGS: -Wno-error=nonnull -Wno-nonnull
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}
    CUDA_NVCC_EXECUTABLE: /usr/local/cuda-${{vars.cuda-version}}/bin/nvcc
    CUDA_VERSION: ${{vars.cuda-version}}
    CMAKE_CUDA_ARCHITECTURES: all
    FORCE_CUDA: 1
    USE_CUDA: 1
    USE_CUDNN: 1
    TORCH_CUDA_ARCH_LIST: "5.2 6.0 6.1 7.0+PTX 8.0 8.6 8.7 8.9 9.0"
    TORCH_NVCC_FLAGS: -Xfatbin -compress-all

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/vision.git
      tag: v${{package.version}}
      expected-commit: 7af698794eded568735f9519593603c1ec889eba

  - runs: env

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-${{vars.cuda-version}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - cuda-toolkit-${{vars.cuda-version}}
        # For some reason this isn't detected
        - libgomp
        - libjpeg-turbo
        - libpng
        - nvidia-cudnn-${{vars.cudnn-version}}-cuda-${{vars.cuda-major-version}}
        - nvidia-nccl-cuda-${{vars.cuda-version}}
        - openmp-17
        - py${{range.key}}-numpy
        - py${{range.key}}-pillow
        - py${{range.key}}-pyyaml
        - py${{range.key}}-torch-${{vars.torch-version}}-cuda-${{vars.cuda-version}}
        - py${{range.key}}-typing-extensions
    options:
      no-depends: true
    pipeline:
      - name: Python Build
        runs: |
          python${{range.key}} setup.py bdist_wheel
          python${{range.key}} -m pip install --verbose \
            --no-index --no-build-isolation --no-deps \
            --force-reinstall --no-compile --prefix=/usr "--root=${{targets.contextdir}}" dist/*.whl
          sitepkgd=$(python${{range.key}} -c 'import site; print(site.getsitepackages()[0])')
          python${{range.key}} -m compileall --invalidation-mode=unchecked-hash -r100 ${{targets.contextdir}}/$sitepkgd
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - runs: |
            python${{range.key}} ./quickstart.py > output.out 2>&1
            grep -E "ERROR|None" output.out && exit 1

  - name: py3-supported-${{vars.pypi-package}}-${{vars.cuda-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.13-${{vars.pypi-package}}-${{vars.cuda-version}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-${{vars.cuda-version}}-libs
    description: Shared C++ torchvision extensions for python${{range.key}}
    dependencies:
      runtime:
        - libstdc++
        - libgomp
        - libjpeg-turbo
        - libpng
        - libtorch-${{vars.torch-version}}-cuda-${{vars.cuda-version}}
    options:
      no-depends: true
    pipeline:
      - name: Build libtorchvision.so
        runs: |
          # These env are re-declared here because in environment.environment, the variable substitution didn't work
          export CUDA_HOME=/usr/local/cuda-${{vars.cuda-version}}
          export CUDA_NVCC_EXECUTABLE=${CUDA_HOME}/bin/nvcc
          export PATH="$PATH:$CUDA_HOME/bin"
          export CMAKE_CUDA_ARCHITECTURES=all
          export CMAKE_CUDA_COMPILER=$CUDA_NVCC_EXECUTABLE
          export CUDACXX=$CUDA_NVCC_EXECUTABLE

          mkdir -p build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCUDA_TOOLKIT_ROOT_DIR=/usr/local/cuda-${{vars.cuda-version}} \
            -DCMAKE_CUDA_ARCHITECTURES="all"  \
            -DCMAKE_PREFIX_PATH="$(python${{range.key}} -c 'import torch; print(torch.utils.cmake_prefix_path)')"
          make -j$(nproc)
          make install DESTDIR="${{targets.contextdir}}"
    test:
      pipeline:
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: pytorch/vision
    strip-prefix: v
    tag-filter: v
