package:
  name: nofips-node
  version: 2
  epoch: 0
  description: "wrapper that executes node, without FIPS, to use during go-fips builds"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/bin
      cat <<"EOF" >${{targets.destdir}}/usr/local/bin/node
      #!/bin/sh
      OPENSSL_CONF=/dev/null exec /usr/bin/node $@
      EOF
      chmod +x ${{targets.destdir}}/usr/local/bin/node

test:
  environment:
    contents:
      packages:
        - nodejs
  pipeline:
    - runs: |
        [ "$(node -e 'console.log(process.env.OPENSSL_CONF)')" = "/dev/null" ]

update:
  enabled: false
  exclude-reason: |
    This package is a native wrapper around node to turn off FIPS
    during build-time of projects that combine go-fips and node. Often
    individual node dependencies are non-fips capable during build
    time.
