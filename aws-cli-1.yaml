package:
  name: aws-cli-1
  version: "1.40.36"
  epoch: 0
  description: "Universal Command Line Interface for Amazon Web Services"
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '300'

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip

pipeline:
  - uses: fetch
    with:
      uri: https://github.com/aws/aws-cli/archive/${{package.version}}.tar.gz
      expected-sha256: bc0b13e95cddd106de5b7e3e9b9b944ecd1a9f4e071c9f21df0b46984111ab7e

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{package.name}}
    description: ${{package.name}} for python${{range.key}}
    dependencies:
      runtime:
        - groff
        - py${{range.key}}-botocore
        - py${{range.key}}-colorama
        - py${{range.key}}-docutils
        - py${{range.key}}-jmespath
        - py${{range.key}}-rsa
        - py${{range.key}}-s3transfer
        - py${{range.key}}-setuptools
        - py${{range.key}}-pyyaml
      provides:
        - py3-${{package.name}}
        - ${{package.name}}
      provider-priority: ${{range.value}}
    pipeline:
      - name: "Build ${{package.name}} for python${{range.key}}"
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - name: "Strip ${{package.name}} for python${{range.key}}"
        uses: strip

test:
  pipeline:
    - name: Verify aws-cli-1 installation
      runs: |
        aws --version || exit 1
        aws help

update:
  enabled: true
  github:
    identifier: aws/aws-cli
    use-tag: true
    tag-filter: "1."
