package:
  name: nvidia-cuda-profiler-api-12.9
  version: "12.9.79"
  epoch: 0
  description: CUDA Profiler API
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-cuda-profiler-api=${{package.full-version}}
    runtime:
      - nvidia-cuda-ld-config-${{vars.cuda-version}}

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_profiler_api/linux-sbsa/cuda_profiler_api-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "e07f47ef3aeb3a3ca995e9070d77d98ad79460216bf2075c9f9018962ae1d03b"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_profiler_api/linux-x86_64/cuda_profiler_api-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "8c50636bfb97e9420905aa795b9fa6e3ad0b30ec6a6c8b0b8db519beb9241ce6"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv include ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE

test:
  pipeline:
    - name: Verify license exists
      runs: |
        if [ ! -f /usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE ]; then
          echo "License file not found!"
          exit 1
        fi
    - name: Verify header files exist
      runs: |
        if [ ! -f /usr/local/cuda-${{vars.cuda-version}}/include/cudaProfiler.h ]; then
          echo "cudaProfiler.h header file not found!"
          exit 1
        fi
        if [ ! -f /usr/local/cuda-${{vars.cuda-version}}/include/cuda_profiler_api.h ]; then
          echo "cuda_profiler_api.h header file not found!"
          exit 1
        fi

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
