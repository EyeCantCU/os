package:
  name: openbao-fips
  version: "2.4.1"
  epoch: 0 # GHSA-2464-8j7c-4cjm
  description: OpenBao exists to provide a software solution to manage, store, and distribute sensitive data including secrets, certificates, and keys.
  copyright:
    - license: MPL-2.0

# NOTE: openbao UI is not enabled for now ; see https://github.com/openbao/openbao/issues/129
# several sections need to be uncommented to embed UI in the tool:
#
# NOTE: uncomment when enabling embedding of UI
# environment:
#   contents:
#     packages:
#       - busybox
#       - ca-certificates-bundle
#       - nodejs
#       - npm
#       - yarn
pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openbao/openbao
      tag: v${{package.version}}
      expected-commit: efb9efa12f550e8322f3cec040862355e966f565

  - runs: |
      # NOTE: uncomment when enabling embedding of UI
      # make ember-dist

  - uses: go/build
    with:
      # NOTE: add "ui" tag when enabling embedding of UI
      tags: "openbao"
      go-package: go-fips-md5
      packages: .
      output: bao
      ldflags: |
        -X github.com/openbao/openbao/version.fullVersion=${{package.version}}
        -X github.com/openbao/openbao/version.GitCommit='$(git rev-parse HEAD)'
        -X github.com/openbao/openbao/version.BuildDate='$(date -u +"%Y-%m-%dT%H:%M:%SZ")'

update:
  enabled: true
  github:
    identifier: openbao/openbao
    strip-prefix: v

test:
  environment:
    environment:
      BAO_ADDR: 'http://127.0.0.1:8200'
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        bao --version
    - name: "test: bao dev server"
      runs: |
        # running with no tls
        # testing binary functionality

        bao server -dev > /dev/null 2>&1 &
        export BAO_SERVER=$!
        sleep 2
        bao kv put -mount=secret foo user="admin" password="s3cr3t"
        bao status
        bao secrets enable database > /dev/null 2>&1 &
        bao token create
        bao secrets tune database
        bao monitor > /dev/null 2>&1 &
        export BAO_MONITOR=$!
        kill -9 $BAO_MONITOR
        bao print token
        bao debug
        bao auth enable userpass
        bao auth list
        kill -9 $BAO_SERVER
