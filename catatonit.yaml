package:
  name: catatonit
  version: 0.2.1
  epoch: 0
  description: A simple container init
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - libtool

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openSUSE/catatonit.git
      tag: v${{package.version}}
      expected-commit: 51cd746253da9d7b948bb95c4b94c4c8bfb15290

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

test:
  pipeline:
    - name: Test basic functionality
      runs: |
        catatonit -h 2>&1 | grep "usage: catatonit"
        catatonit --version | grep ${{package.version}}
    - name: Test container init functionality
      runs: |
        set -euo pipefail
        # Test running as init with a shell command that spawns children
        timeout 5s catatonit -- sh -c 'sleep 0.1 & wait'
    - name: Validate signal forwarding with -g
      runs: |
        catatonit -g -- sh -c 'trap "exit 42" TERM; sleep 10' &
        pid=$!
        sleep 1
        kill -TERM "$pid"
        wait "$pid" || exit_code=$?
        test "$exit_code" -eq 42
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    use-tag: true
    identifier: openSUSE/catatonit
    strip-prefix: v
