version: 1
cloud: azure
data:
  vmuser: root
  launchuser: azureuser
  region: eastus
vmconfigs:
  x86_64:
    - vm_size: Standard_F2s_v2
      disk_type: StandardSSD_LRS
      tests:
        - group: core
        - group: secureboot
    # TODO: make this work
    #- vm_size: Standard_F2as_v6
    #  disk_type: StandardSSD_LRS
    #  tests:
    #    - group: core
    - vm_size: Standard_D2_v4
      disk_type: StandardSSD_LRS
      tests:
        - group: core
        - group: hypervisor
        - group: secureboot
  aarch64:
    - vm_size: Standard_D2ps_v6
      disk_type: StandardSSD_LRS
      tests:
        - group: core
        - group: secureboot
    - vm_size: Standard_E2ps_v6
      disk_type: StandardSSD_LRS
      tests:
        - group: core
        - group: secureboot
