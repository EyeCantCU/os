version: 1
cloud: gcp
data:
  vmuser: testuser
  zone: us-central1-a
vmconfigs:
  x86_64:
    - machine_type: n2-standard-2
      disk_type: pd-balanced
      metadata: startup-script=printf "hello wolfi" > /tmp/hello-wolfi.txt;enable-oslogin=false
      nested_virt: true
      tests:
        - group: core
        - group: secureboot
        - group: hypervisor
        - group: gcp
    - machine_type: n4-standard-2
      disk_type: hyperdisk-balanced
      metadata: startup-script=printf "hello wolfi" > /tmp/hello-wolfi.txt;enable-oslogin=false
      nested_virt: true
      tests:
        - group: core
        - group: secureboot
        - group: hypervisor
        - group: gcp
  aarch64:
    - machine_type: t2a-standard-2
      disk_type: pd-balanced
      metadata: startup-script=printf "hello wolfi" > /tmp/hello-wolfi.txt;enable-oslogin=false
      tests:
        - group: core
        - group: secureboot
        - group: gcp
    - machine_type: c4a-standard-2
      disk_type: hyperdisk-balanced
      metadata: startup-script=printf "hello wolfi" > /tmp/hello-wolfi.txt;enable-oslogin=false
      tests:
        - group: core
        - group: secureboot
        - group: gcp
