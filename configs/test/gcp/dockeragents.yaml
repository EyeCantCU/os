version: 1
cloud: gcp
data:
  vmuser: testuser
  zone: us-central1-a
vmconfigs:
  x86_64:
    - machine_type: n2-standard-2
      disk_type: pd-balanced
      nested_virt: true
      tests:
        - group: core
        - group: containers
        - group: hypervisor
        - name: gcp/routing
    - machine_type: n4-standard-2
      disk_type: hyperdisk-balanced
      nested_virt: true
      tests:
        - group: core
        - group: containers
        - group: hypervisor
        - name: gcp/routing
  aarch64:
    - machine_type: t2a-standard-4
      disk_type: pd-balanced
      tests:
        - group: core
        - group: containers
        - name: gcp/routing
    - machine_type: c4a-standard-4
      disk_type: hyperdisk-balanced
      tests:
        - group: core
        - group: containers
        - name: gcp/routing
