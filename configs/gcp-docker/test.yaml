version: 1
cloud: gcp
data:
  vmuser: root
  zone: us-central1-a

vmconfigs:
  x86_64:
    - machine_type: e2-medium
      disk_type: pd-balanced
      tests:
        - group: core
        - group: containers
    - machine_type: c4-standard-4
      disk_type: hyperdisk-balanced
      nested_virt: true
      tests:
        - group: core
        - group: containers
        - group: hypervisor
  aarch64:
    - machine_type: t2a-standard-4
      disk_type: pd-balanced
      tests:
        - group: core
        - group: containers
    - machine_type: c4a-standard-4
      disk_type: hyperdisk-balanced
      tests:
        - group: core
        - group: containers
