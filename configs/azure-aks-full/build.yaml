archs:
  - amd64
  - arm64
contents:
  build_repositories:
    - https://apk.cgr.dev/chainguard
    - https://apk.cgr.dev/extra-packages
    - https://apk.cgr.dev/chainguard-private
  runtime_repositories:
    - https://virtualapk.cgr.dev/0ac7ff905850c35723a7f376e10d007c958c45c8/chainguard
    - https://virtualapk.cgr.dev/0ac7ff905850c35723a7f376e10d007c958c45c8/extra-packages
  packages:
    - apk-tools
    - azure-configs
    # cni-plugins conflicts because of bridge but I'm hoping I can get
    # away with not having iproute2 for now.
    - azure-vnet-cni
    - bash
    - bash-binsh
    - ca-certificates
    - chainguard-baselayout
    - chrony
    - chrony-azure
    - cloud-init # (Optional) dep for walinuxagent
    # I'm not 100% sure which plugins Azure actually uses
    - cni-plugins-loopback
    - cni-plugins-portmap
    - containerd
    - containerd-service
    - coreutils
    - dbus
    - findutils
    - iproute2
    - kmod
    - kmod-libs
    - kubernetes
    - libpwquality
    - linux-azure-generic-boot-installed
    - linux-pam
    - mount
    - net-tools
    - openssh-pam-config # Login with locked account
    - openssh-server
    - openssh-service
    - openssh-sftp-server
    - polkit
    # AKS sets sysctls and busybox does not seem sufficient
    - procps
    - runc
    - shadow
    - sudo-rs
    - systemd-boot
    - systemd-boot-installed
    - systemd-default-network
    - systemd-init
    - systemd-logind-service
    - systemd-repart-rootfs-xfs
    - udev
    - umount
    - util-linux-misc
    - walinuxagent # Azure cloud agent
    - xfsprogs
