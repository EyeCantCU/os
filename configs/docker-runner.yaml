accounts:
  groups:
    - gid: 125
      groupname: docker
      members:
  run-as: "0"
  users:
annotations: {}
archs:
  - amd64
  - arm64
cmd: ""
contents:
  build_repositories:
    - https://apk.cgr.dev/chainguard-private
  keyring:
    - https://packages.cgr.dev/extras/chainguard-extras.rsa.pub
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.cgr.dev/extras
    - https://packages.wolfi.dev/os
  packages:
    - busybox
    - cloud-ssh-keys-fetcher
    - containerd-service
    - dash
    - docker
    - dockerd
    - dockerd-service
    - e2fsprogs
    - grype
    - iproute2
    - kmod
    - kmod-libs
    - mount
    - openssh-server
    - openssh-service
    - sudo-rs
    - systemd
    - systemd-boot
    - systemd-default-network
    - systemd-init
    - systemd-logind-stub
    - systemd-repart-rootfs
    - umount
    - util-linux-misc
entrypoint:
  command: /usr/lib/systemd/systemd
  services: {}
  shell-fragment: ""
  type: ""
environment:
  PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
include: ""
paths:
stop-signal: ""
vcs-url: ""
volumes:
work-dir: /
