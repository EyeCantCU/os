package:
  name: vgpu-util
  version: 24.02.06
  epoch: 0
  description: NVIDIA vGPU util for gpu-driver-container
  copyright:
    - license: PROPRIETARY // It could be Apache-2 but here this line https://github.com/NVIDIA/gpu-driver-container/blob/81a52fc7cc0133c0b0aa996f03b8dafff3bc7cad/ubuntu22.04/Dockerfile#L114 which also mentions NGC DL makes me wonder if it should belong to extra-packages

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go
      - make
  environment:
    CGO_ENABLED: "0"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/gpu-driver-container
      tag: ${{package.version}}
      expected-commit: 747637e2427c05534306a505b25bb6d7291abd56

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      cd vgpu/src
      go build -o vgpu-util
      mv vgpu-util ${{targets.destdir}}/usr/bin

  - uses: strip

subpackages:
  - name: "${{package.name}}-compat"
    # https://github.com/NVIDIA/gpu-driver-container/blob/747637e2427c05534306a505b25bb6d7291abd56/ubuntu22.04/Dockerfile#L76
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -sf /usr/bin/vgpu-util ${{targets.subpkgdir}}/usr/local/bin

update:
  enabled: true
  github:
    identifier: NVIDIA/gpu-driver-container
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-compat
  pipeline:
    - runs: |
        # It should return NUM_OF_VGPU_DEVICES=0
        vgpu-util count | grep 0
