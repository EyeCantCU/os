package:
  name: nvidia-cuda-cuobjdump-12.1
  version: 12.1.55
  epoch: 1
  description: CUDA's objdump
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-cuda-cuobjdump=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cuobjdump/linux-sbsa/cuda_cuobjdump-linux-sbsa-12.1.55-archive.tar.xz"
          expected-sha256: "8b60ffec9947580dcc8d1b3f6547ddb32d78336e2c2e7e9a5efeaa5a254ec163"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cuobjdump/linux-x86_64/cuda_cuobjdump-linux-x86_64-12.1.55-archive.tar.xz"
          expected-sha256: "78e9404758e923bfa12f0d21ae8eddd035c1f1cab85f4bf0e9623a603afcd0d3"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.1/
      mv bin ${{targets.destdir}}/usr/local/cuda-12.1/
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.1/${{package.name}}.LICENSE

update:
  enabled: false
