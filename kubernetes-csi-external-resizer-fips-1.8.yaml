package:
  name: kubernetes-csi-external-resizer-fips-1.8
  version: 1.8.1
  epoch: 12
  description: Sidecar container that watches Kubernetes PersistentVolumeClaims objects and triggers controller side expansion operation against a CSI endpoint
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - kubernetes-csi-external-resizer-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 369931a9ff639447e6d098dc3152ee6a3d0549c1
      repository: https://github.com/kubernetes-csi/external-resizer
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.23.0 google.golang.org/grpc@v1.56.3 google.golang.org/protobuf@v1.33.0 github.com/golang/protobuf@v1.5.4

  # For FIPS, we need CGO_ENABLED=1. The Makefile does not provide a way to specify.
  # This was contributed upstream but has not (yet) made it into a release.
  # https://github.com/kubernetes-csi/external-resizer/pull/383
  - uses: go/remove-cgo-enabled-0
    with:
      files: release-tools/build.make

  - runs: |
      make build
      mkdir -p ${{targets.destdir}}/usr/bin
      install -Dm755 ./bin/csi-resizer ${{targets.destdir}}/usr/bin/csi-resizer

  - uses: strip

update:
  enabled: true
  github:
    identifier: kubernetes-csi/external-resizer
    strip-prefix: v
    tag-filter: v1.8.

test:
  pipeline:
    - runs: csi-resizer --version
    - uses: test/go-fips-check
