package:
  name: eks-distro-kubernetes-csi-external-provisioner-4.0 # check old style bumps below on new version updates
  version: 4.0.0 # eks-distro v1-25-eks-38: https://github.com/aws/eks-distro/releases/tag/v1-25-eks-38
  epoch: 8
  description: Sidecar container that watches Kubernetes PersistentVolumeClaim objects and triggers CreateVolume/DeleteVolume against a CSI endpoint
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - eks-distro-kubernetes-csi-external-provisioner=${{package.full-version}}

vars:
  eks-project: kubernetes-csi/external-provisioner
  eks-package-version: 1-25-eks-38

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-distro
      tag: v${{vars.eks-package-version}}
      expected-commit: eaa252c665ca550c2ef04b79436597955da6552f

  - uses: eks-distro/build
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      deps: google.golang.org/protobuf@v1.33.0 github.com/golang/protobuf@v1.5.4 golang.org/x/net@v0.23.0 # this won't auto delete on package bumps

  - uses: eks-distro/install
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      binary-target: csi-provisioner

  - uses: strip

update:
  manual: true
