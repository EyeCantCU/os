package:
  name: nvidia-device-plugin-fips
  version: 0.16.2
  epoch: 2
  description: NVIDIA device plugin for Kubernetes
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/k8s-device-plugin
      tag: v${{package.version}}
      expected-commit: 42a0fa92ce166592ab5702a1143ddecd891c8e5e

  - runs: |
      # disable stripping
      sed -i 's/-s / /g' Makefile
      make
      mkdir -p ${{targets.destdir}}/usr/bin
      mv config-manager ${{targets.destdir}}/usr/bin/
      mv nvidia-device-plugin ${{targets.destdir}}/usr/bin/

update:
  enabled: true
  github:
    identifier: NVIDIA/k8s-device-plugin
    strip-prefix: v
    tag-filter: v
