package:
  name: py3-watchdog
  version: "6.0.0"
  epoch: 0
  description: Python library and shell utilities to monitor filesystem events
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

vars:
  pypi-package: watchdog
  import: watchdog

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gorakhargosh/watchdog.git
      tag: v${{package.version}}
      expected-commit: 76c091dc8841de1d1a1cd6511bb509fe4f058de6

  - name: Python Build
    uses: python/build-wheel

  - uses: strip

test:
  environment:
    contents:
      packages:
        - python3
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}
    - name: Test watchdog functionality
      runs: |
        python3 -c "
        from watchdog.observers import Observer
        from watchdog.events import FileSystemEventHandler

        # Test basic imports
        print('Observer imported successfully')
        print('FileSystemEventHandler imported successfully')

        # Test Observer creation
        observer = Observer()
        print('Observer created successfully')

        print('watchdog basic functionality test: PASSED')
        "

update:
  enabled: true
  github:
    identifier: gorakhargosh/watchdog
    strip-prefix: v
    use-tag: true
