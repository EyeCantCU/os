package:
  name: mx
  description: Command-line tool used for the development of Graal projects.
  version: "7.62.1"
  epoch: 0
  copyright:
    - license: GPL-2.0-only
  dependencies:
    runtime:
      - bash
      - git
      - posix-libc-utils
      - python-${{vars.py-version}}

vars:
  # 3.12 is the last version of Python to include 'pipes'
  py-version: '3.12'

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/graalvm/mx
      tag: ${{package.version}}
      expected-commit: 19bd3b58b5790422e3dfdc9e318cf338e3ed82dc
      destination: ${{targets.contextdir}}/usr/share/mx

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/bin
      ln -s /usr/share/mx/mx ${{targets.contextdir}}/usr/bin/mx

update:
  enabled: true
  ignore-regex-patterns:
    - '.*checkstyle.*'
    - '.*jackpot.*'
    - '.*jdk.*'
    - 'findbugs.*'
  git: {}

test:
  pipeline:
    - runs: |
        mx --help
        mx version | grep ${{package.version}}
