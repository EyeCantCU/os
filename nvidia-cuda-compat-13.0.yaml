package:
  name: nvidia-cuda-compat-13.0
  version: "580.82.07"
  epoch: 0
  description: CUDA Runtime (cudart)
  copyright:
    - license: PROPRIETARY
  target-architecture:
    - x86_64
  dependencies:
    runtime:
      - nvidia-cuda-ld-config-${{vars.cuda-version}}

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - uses: fetch
    with:
      uri: "https://developer.download.nvidia.com/compute/cuda/redist/nvidia_driver/linux-x86_64/nvidia_driver-linux-x86_64-${{package.version}}-archive.tar.xz"
      expected-sha256: "290f7fa5b48b153ed9b0711f6deff9075fa39c08348a38a6fc349da1500156c8"
      timeout: 30

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/compat
      cd lib
      ln -s libcuda.so.${{package.version}} libcuda.so.1
      ln -s libcuda.so.1 libcuda.so
      ln -s libcudadebugger.so.${{package.version}} libcudadebugger.so.1
      ln -s libcudadebugger.so.1 libcudadebugger.so
      ln -s libnvidia-nvvm.so.${{package.version}} libnvidia.so.4
      ln -s libnvidia-nvvm.so.${{package.version}} libnvidia.so
      # libnvidia-pkcs11 for old openssl
      for lib in libcuda libcudadebugger libnvidia-nvvm libnvidia-pkcs11-openssl3 libnvidia-ptxjitcompiler ; do
         mv ${lib}.so* ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/compat
      done

update:
  exclude-reason: "TODO(pnasrat): WIP to migrate to version streams"
  enabled: false

test:
  pipeline:
    - uses: test/tw/ldd-check
