package:
  name: camunda-zeebe
  version: "8.6.9"
  epoch: 1
  description: Process Orchestration Framework
  copyright:
    - license: Apache-2.0
    - license: LicenseRef-Camunda-License-1.0
      license-path: licenses/CAMUNDA-LICENSE-1.0.txt
    - license: LicenseRef-Clarification-On-gRPC-Code-Generation
      license-path: licenses/Clarification-on-gRPC-code-generation.txt
  dependencies:
    runtime:
      - libstdc++
      - openjdk-21-default-jvm

environment:
  contents:
    packages:
      - build-base
      - busybox
      - maven
      - openjdk-21-default-jdk
      - protoc
  environment:
    LANG: en_US.UTF-8
    JAVA_HOME: /usr/lib/jvm/java-21-openjdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/camunda/camunda
      tag: ${{package.version}}
      expected-commit: 00edb8198fa9b9954984bd10cfe055bea0f37a64

  - uses: maven/pombump
    with:
      properties-file: pombump-properties-optimize.yaml
      pom: optimize/pom.xml

  - uses: maven/pombump
    with:
      properties-file: pombump-properties-parent.yaml
      pom: parent/pom.xml

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin

      mvn dependency:get -B \
      -DremoteRepositories="https://artifacts.camunda.com/artifactory/zeebe-io/" \
      -DgroupId="io.camunda" -DartifactId="camunda-zeebe" \
      -Dversion="${{package.version}}" -Dpackaging="tar.gz" -Dtransitive=false

      mvn dependency:copy -B \
      -Dartifact="io.camunda:camunda-zeebe:${{package.version}}:tar.gz" \
      -DoutputDirectory=./ \
      -Dmdep.stripVersion=true

      ./mvnw -B -am -pl dist package -T1C -D skipChecks -D skipTests

      mkdir -p ${{targets.destdir}}/usr/share/java
      unzip -d ${{targets.destdir}}/usr/share/java dist/target/${{package.name}}-*.zip
      mv ${{targets.destdir}}/usr/share/java/${{package.name}}-* ${{targets.destdir}}/usr/share/java/${{package.name}}

      mkdir -p ${{targets.destdir}}/usr/share/java/${{package.name}}/data
      mkdir -p ${{targets.destdir}}/usr/share/java/${{package.name}}/logs

      # symlink every file in the bin directory to /usr/bin
      for file in "${{targets.destdir}}"/usr/share/java/${{package.name}}/bin/*; do
        ln -sf /usr/share/java/${{package.name}}/bin/$(basename $file) ${{targets.destdir}}/usr/bin/$(basename $file)
      done

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    dependencies:
      runtime:
        - bash
        - tini
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/usr/bin
          mkdir -p "${{targets.contextdir}}"/usr/local/bin
          install -Dm755 zeebe/docker/utils/startup.sh "${{targets.contextdir}}"/usr/bin/startup.sh
          ln -sf /usr/bin/startup.sh ${{targets.contextdir}}/usr/local/bin/startup.sh
          ln -sf /usr/share/java/${{package.name}} ${{targets.contextdir}}/usr/local/zeebe

update:
  enabled: true
  ignore-regex-patterns:
    - "operate-"
  github:
    identifier: camunda/camunda

test:
  environment:
    contents:
      packages:
        - camunda-zeebe-compat
    environment:
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk
  pipeline:
    # https://github.com/camunda/camunda/blob/main/zeebe/docker/utils/startup.sh
    - name: "test gateway"
      uses: test/daemon-check-output
      with:
        start: "/usr/local/zeebe/bin/gateway"
        timeout: 60
        expected_output: |
          Started StandaloneGateway
          started on port
    - name: "test broker"
      uses: test/daemon-check-output
      with:
        start: "/usr/local/zeebe/bin/broker"
        timeout: 60
        expected_output: |
          TCP server listening for connections
          Started cluster membership service
          Started messaging service
          Server successfully bootstrapped
          All partitions are installed
    - name: "test restore"
      runs: |
        set -e
        /usr/local/zeebe/bin/restore | grep "No backup store configured, cannot restore from backup."
