package:
  name: nvidia-cuda-sanitizer-api-12.1
  version: 12.1.55
  epoch: 1
  description: CUDA Compute Sanitizer API
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-cuda-sanitizer-api=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_sanitizer_api/linux-sbsa/cuda_sanitizer_api-linux-sbsa-12.1.55-archive.tar.xz"
          expected-sha256: "c12bbec61e5a7f7d6119bf496354be5ad3f7e05b4c291e6b90334d6f678d861c"
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_sanitizer_api/linux-x86_64/cuda_sanitizer_api-linux-x86_64-12.1.55-archive.tar.xz"
          expected-sha256: "20a985f25c23840f6d758ddea0fc4cf67ac0dff712c0ece4e857b6d1ae228717"

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.1/
      mv bin ${{targets.destdir}}/usr/local/cuda-12.1/
      mv compute-sanitizer ${{targets.destdir}}/usr/local/cuda-12.1/
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.1/${{package.name}}.LICENSE

subpackages:
  - name: ${{package.name}}-docs
    description: ${{package.name}} docs
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/cuda-12.1/compute-sanitizer
          mv ${{targets.destdir}}/usr/local/cuda-12.1/compute-sanitizer/docs ${{targets.contextdir}}/usr/local/cuda-12.1/compute-sanitizer

  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - nvidia-cuda-sanitizer-api-12.1

update:
  enabled: false
