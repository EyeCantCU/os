package:
  name: sops-fips
  version: 3.9.1
  epoch: 0
  description: Simple and flexible tool for managing secrets
  copyright:
    - license: MPL-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/getsops/sops
      tag: v${{package.version}}
      # There is a second git-checkout in test pipeline we need to update.
      expected-commit: d50fda248047372c79368508e1df479970a52cda

  - uses: go/build
    with:
      go-package: go-fips
      modroot: .
      packages: ./cmd/sops
      output: sops

update:
  enabled: true
  github:
    identifier: getsops/sops
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - gpg
        - gpg-agent
  pipeline:
    - uses: test/go-fips-check
    - uses: git-checkout
      with:
        repository: https://github.com/getsops/sops
        tag: v${{package.version}}
        expected-commit: d50fda248047372c79368508e1df479970a52cda
    - name: run tests
      runs: |
        gpg-agent --daemon
        gpg --import pgp/sops_functional_tests_key.asc

        cd examples/all_in_one
        sops decrypt config/secret.enc.json
