package:
  name: sops-fips
  version: "3.9.4"
  epoch: 2
  description: Simple and flexible tool for managing secrets
  copyright:
    - license: MPL-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/getsops/sops
      tag: v${{package.version}}
      # There is a second git-checkout in test pipeline we need to update.
      expected-commit: e794c79e2fda8b4932cf74aded946868295e291b

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v4@v4.0.5
      modroot: .

  - uses: go/build
    with:
      go-package: go-fips
      modroot: .
      tidy: true
      packages: ./cmd/sops
      output: sops

update:
  enabled: true
  github:
    identifier: getsops/sops
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - gpg
        - gpg-agent
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        sops --version
        sops --help
    - uses: git-checkout
      with:
        repository: https://github.com/getsops/sops
        tag: v${{package.version}}
        expected-commit: e794c79e2fda8b4932cf74aded946868295e291b
    - name: run tests
      runs: |
        gpg-agent --daemon
        gpg --import pgp/sops_functional_tests_key.asc

        cd examples/all_in_one
        sops decrypt config/secret.enc.json
