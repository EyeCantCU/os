package:
  name: sops-fips
  version: 3.9.2
  epoch: 1
  description: Simple and flexible tool for managing secrets
  copyright:
    - license: MPL-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/getsops/sops
      tag: v${{package.version}}
      # There is a second git-checkout in test pipeline we need to update.
      expected-commit: bb710f3d6c34aa1d805c3e42462c33485abc9d2f

  # 3.9.2 update requires a tidy for some reason, we may be able to remove this in a later version.
  # https://github.com/chainguard-dev/enterprise-packages/pull/10382
  - runs: |
      cd cmd/sops
      go mod tidy

  - uses: go/bump
    with:
      deps: golang.org/x/crypto@v0.31.0
      modroot: .

  - uses: go/build
    with:
      go-package: go-fips
      modroot: .
      packages: ./cmd/sops
      output: sops

update:
  enabled: true
  github:
    identifier: getsops/sops
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - gpg
        - gpg-agent
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        sops --version
        sops --help
    - uses: git-checkout
      with:
        repository: https://github.com/getsops/sops
        tag: v${{package.version}}
        expected-commit: bb710f3d6c34aa1d805c3e42462c33485abc9d2f
    - name: run tests
      runs: |
        gpg-agent --daemon
        gpg --import pgp/sops_functional_tests_key.asc

        cd examples/all_in_one
        sops decrypt config/secret.enc.json
