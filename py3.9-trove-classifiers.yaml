package:
  name: py3.9-trove-classifiers
  version: "2025.5.1.12"
  epoch: 0
  description: Canonical source for classifiers on PyPI (pypi.org).
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3.9-build
      - py3.9-installer
      - py3.9-pip
      - py3.9-wheel
      - python-3.9

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/trove-classifiers
      expected-commit: e2b922f3a625ed37ef37108be82aa902240621ac
      tag: ${{package.version}}

  - uses: py/pip-build-install
    with:
      python: python3.9
      dest: ${{targets.contextdir}}

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: trove_classifiers

update:
  enabled: true
  github:
    identifier: pypa/trove-classifiers
