package:
  name: nvidia-cudnn-9.2-11.8
  version: 9.2.0.82
  epoch: 0
  description: CUDA Deep Neural Network Libraries
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-cudnn=${{package.full-version}}
      - nvidia-cudnn-9=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-sbsa/cudnn-linux-sbsa-${{package.version}}_cuda11-archive.tar.xz"
          expected-sha256: "62973737acc11c20f0640e63248a8d988b53b6aad219cf17eaff63a05970853d"
          timeout: 120
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-${{package.version}}_cuda11-archive.tar.xz"
          expected-sha256: "99dcb3fa2bf7eed7f35b0f8e58e7d1f04d9a52e01e382efc1de16fed230d3b26"
          timeout: 120

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cudnn/
      mv include ${{targets.destdir}}/usr/local/cudnn/
      mv lib ${{targets.destdir}}/usr/local/cudnn/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cudnn/${{package.name}}.LICENSE

subpackages:
  - name: nvidia-cudnn-9.2-cuda-11.8
    description: configures cudnn-9.2 with cuda-11.8
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/cuda/lib64
          mkdir -p ${{targets.subpkgdir}}/usr/local/cuda/include
          for f in ${{targets.destdir}}/usr/local/cudnn/lib64/*; do
            ln -sf /usr/local/cudnn/lib64/$(basename $f) ${{targets.subpkgdir}}/usr/local/cuda/lib64/$(basename $f)
          done
          for f in ${{targets.destdir}}/usr/local/cudnn/include/*; do
            ln -sf /usr/local/cudnn/include/$(basename $f) ${{targets.subpkgdir}}/usr/local/cuda/include/$(basename $f)
          done

update:
  enabled: false

test:
  environment:
    contents:
      packages:
        - wolfi-base
        - nvidia-cudnn-9.2-cuda-11.8
  pipeline:
    - runs: |
        # Make sure they're symlinked into the right place for the cuda-12.4 subpackage.
        stat /usr/local/cuda/include/cudnn.h
        stat /usr/local/cuda/lib64/libcudnn.so
