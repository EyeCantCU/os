package:
  name: py3-hf-transfer
  description: Speed up file transfers with the Hub.
  version: 0.1.9
  epoch: 0
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: hf-transfer
  import: hf_transfer

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - maturin
      - openssl-dev
      - perl
      - py3-supported-build-base-dev
      - py3-supported-maturin
      - py3-supported-puccinialin
      - rust

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/huggingface/hf_transfer.git
      expected-commit: 16bbc5045ff4036be9d8bcd0050108d82229a216
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - runs: |
            python${{range.key}} <<'EOF'
            from hf_transfer import download
            download(url="https://raw.githubusercontent.com/wolfi-dev/os/850b26d7772d5a02290e5d7e1421b29fd34ec11e/cowsay/linky.cow", filename="linky.cow", max_files=1, chunk_size=256)
            EOF
            grep "Linky - Chainguard's octopus mascot" ./linky.cow

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  git:
    strip-prefix: v
