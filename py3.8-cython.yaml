package:
  name: py3.8-cython
  version: 3.0.10
  epoch: 0
  description: Cython is an optimising static compiler for both the Python & the extended Cython programming languages.
  copyright:
    - license: Apache-2.0
  options:
    no-provides: true
  dependencies:
    runtime:
      - python-3.8

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3.8-build
      - py3.8-installer
      - py3.8-pip
      - py3.8-wheel
      - python-3.8
      - python-3.8-dev

pipeline:
  - uses: fetch
    with:
      expected-sha256: 00f97476cef9fcd9a89f9d2a49be3b518e1a74b91f377fe08c97fcb44bc0f7d7
      uri: https://github.com/cython/cython/archive/${{package.version}}.tar.gz

  - uses: python/build-wheel

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.8
        import: Cython

update:
  enabled: true
  github:
    identifier: cython/cython
