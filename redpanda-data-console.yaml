package:
  name: redpanda-data-console
  version: "3.0.0"
  description: "Redpanda Console (previously known as Kowl) is a web application that helps you manage and debug your Kafka/Redpanda workloads effortlessly."
  epoch: 0
  copyright:
    - license: "BUSL-1.1"
  resources:
    cpu: 8
    memory: 8Gi
  dependencies:
    runtime:
      - curl

environment:
  contents:
    packages:
      - bun
      - busybox
      - ca-certificates-bundle
      - nodejs-22
      - typescript

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/redpanda-data/console.git
      tag: v${{package.version}}
      expected-commit: cc26d74f773306db0469990403ccaf3c8dcdd4b8

  - name: Build Frontend
    working-directory: frontend
    pipeline:
      - runs: |
          # Migrate from package-lock.json to bun.lock in a separate step, so
          # we can pass `--frozen-lockfile` to `bun install`
          bun pm migrate
          bun install --frozen-lockfile

          REACT_APP_CONSOLE_GIT_SHA=$(git rev-parse --short HEAD)
          REACT_APP_CONSOLE_GIT_REF=$(git rev-parse --abbrev-ref HEAD)
          REACT_APP_BUILD_TIMESTAMP=$(date -u -d "@${SOURCE_DATE_EPOCH:-$(date +%s)}" "+%Y-%m-%dT%H:%M:%SZ")
          REACT_APP_DEV_HINT=true

          bun run build

  - name: Embed frontend into backend
    runs: |
      cp -R frontend/build/* backend/pkg/embed/frontend
      cp -R frontend/node_modules/ backend/pkg/embed/frontend/node_modules
      cp -R frontend/public/ backend/pkg/embed/frontend/public

  - name: Build Backend
    uses: go/build
    with:
      modroot: ./backend
      packages: ./cmd/api
      ldflags: -X github.com/redpanda-data/console/backend/pkg/version.Version=${{package.version}} -X github.com/redpanda-data/console/backend/pkg/version.BuiltAt=$(date +%s)
      output: console

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/app
          ln -sf /usr/bin/console ${{targets.subpkgdir}}/app/console

update:
  enabled: true
  github:
    identifier: redpanda-data/console
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - curl
        - kafka
        - uuidgen
        - ${{package.name}}-compat
    environment:
      JAVA_HOME: "/usr/lib/jvm/default-jvm"
      KAFKA_BROKERS: "localhost:9092"
  pipeline:
    - runs: console -h
    - name: "Test with Kafka"
      uses: test/daemon-check-output
      with:
        setup: |
          export PATH="/usr/lib/kafka/bin:$PATH"

          CLUSTER_ID="$(kafka-storage.sh random-uuid)"
          echo "Using cluster ID: $CLUSTER_ID"

          kafka-storage.sh format -t "$CLUSTER_ID" -c /usr/lib/kafka/config/server.properties.original --standalone

          kafka-server-start.sh /usr/lib/kafka/config/server.properties.original &
          sleep 5

          TOPIC_NAME="test-topic-$(uuidgen)"
          PARTITIONS=1
          REPLICATION_FACTOR=1
          # Create a Kafka topic
          kafka-topics.sh --create --topic "${TOPIC_NAME}" --partitions "${PARTITIONS}" --replication-factor "${REPLICATION_FACTOR}" --if-not-exists --bootstrap-server localhost:9092
          # Produce a test message
          echo "Hello Kafka" | kafka-console-producer.sh --bootstrap-server localhost:9092 --topic "${TOPIC_NAME}"
        start: "/app/console"
        timeout: 15
        expected_output: |
          started Redpanda Console
          successfully connected to kafka cluster
          Server listening on address
        post: |
          #!/bin/sh -e
          url=http://localhost:8080/admin/startup
          response=$(curl -fsS --connect-timeout 5 --max-time 10 --retry 5 --retry-delay 0 --retry-max-time 40 "$url") || {
            echo "curl ${url} failed $?"
            exit 1
          }
          echo "$response" | grep -qi 'isHttpOk.:true' || {
            echo "response from $url did not contain \"isHttpOk\":true"
            echo "response: $response"
            exit 1
          }
          echo "$url had expected output: $response"
