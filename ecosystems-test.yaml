#nolint:git-checkout-must-use-github-updates,valid-pipeline-git-checkout-tag
package:
  name: ecosystems-test
  version: 0.0.1
  epoch: 0
  description: Demonstrates that we can pull private ecosystems repos.
  copyright:
    - license: PROPRIETARY

pipeline:
  - uses: ecosystems/auth
    with:
      repo: chainguard-dev/ecosystems-cassandra

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/ecosystems-cassandra
      branch: fips-4.0.15
      expected-commit: 4d3362860d2b42bc270daba45b1abed81b7ce10d

  - runs: ls

update:
  manual: true
  exclude-reason: Only for testing.
