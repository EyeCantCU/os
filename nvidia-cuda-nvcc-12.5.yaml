package:
  name: nvidia-cuda-nvcc-12.5
  version: 12.5.82
  epoch: 0
  description: CUDA NVCC
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-cuda-nvcc=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/linux-sbsa/cuda_nvcc-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "345a80c87627a414516e1bfdd99ec97f6a02039c9b82b2610bc5a93e035ca954"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvcc/linux-x86_64/cuda_nvcc-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "ded05fe3c8d075c6c1bf892005d3c50bde3eceaa049b879fcdff6158e068e3be"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda/
      mv include ${{targets.destdir}}/usr/local/cuda/
      mv lib ${{targets.destdir}}/usr/local/cuda/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda/${{package.name}}.LICENSE
      mv bin ${{targets.destdir}}/usr/local/cuda/
      mv nvvm ${{targets.destdir}}/usr/local/cuda/

  - runs: |
      # Symlink the binaries onto the normal path
      mkdir -p ${{targets.destdir}}/usr/bin/
      for i in ${{targets.destdir}}/usr/local/cuda/nvcc/bin/*; do
        [ -f "$i" ] && [ -x "$i" ] && ln -sf /usr/local/cuda/nvcc/bin/$(basename "$i") ${{targets.destdir}}/usr/bin/
      done

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - nvidia-cuda-nvcc-12.4

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
