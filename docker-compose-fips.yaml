package:
  name: docker-compose-fips
  version: "2.40.3"
  epoch: 3 # GHSA-j5w8-q4qc-rx2x
  description: Define and run multi-container applications with Docker
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - btrfs-progs-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - containerd-fips
      - coreutils
      - go-fips
      - go-fips-md5
      - libseccomp-dev
      - libtool
      - linux-headers
      - lvm2-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/docker/compose
      tag: v${{package.version}}
      expected-commit: 49b1c1e932aecd3a4843b392162d4bd56021935e

  - uses: go/bump
    with:
      deps: |-
        github.com/containerd/containerd/v2@v2.1.5
        golang.org/x/crypto@v0.45.0

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      DESTDIR=${{targets.destdir}}/usr/bin/ make build

test:
  environment:
    contents:
      packages:
        - docker-cli-fips
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        docker compose --help
        docker-compose --version | grep ${{package.version}}

update:
  enabled: true
  github:
    identifier: docker/compose
    strip-prefix: v
    tag-filter: v
