package:
  name: docker-compose-fips
  version: "2.35.1"
  epoch: 1
  description: Define and run multi-container applications with Docker
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - btrfs-progs-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - containerd-fips
      - coreutils
      - go-fips
      - go-fips-md5
      - libseccomp-dev
      - libtool
      - linux-headers
      - lvm2-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/docker/compose
      tag: v${{package.version}}
      expected-commit: 2d7cd2a999461ddb740fbdd935921648bdff1414

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        github.com/DefangLabs/secret-detector@v0.0.0-20250403165618-22662109213e
        github.com/golang-jwt/jwt/v5@v5.2.2
        gopkg.in/ini.v1@v1.67.0

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      DESTDIR=${{targets.destdir}}/usr/bin/ make build

test:
  environment:
    contents:
      packages:
        - docker-cli-fips
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        docker compose --help
        docker-compose --version | grep ${{package.version}}

update:
  enabled: true
  github:
    identifier: docker/compose
    strip-prefix: v
    tag-filter: v
