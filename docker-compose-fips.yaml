package:
  name: docker-compose-fips
  version: "2.33.1"
  epoch: 0
  description: Define and run multi-container applications with Docker
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - btrfs-progs-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - containerd-fips
      - coreutils
      - go-fips
      - go-fips-md5
      - libseccomp-dev
      - libtool
      - linux-headers
      - lvm2-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/docker/compose
      tag: v${{package.version}}
      expected-commit: da2eff4ba7d95ddae71d6b70323dbe739bbd130b

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/bin
      DESTDIR=${{targets.destdir}}/usr/bin/ make build

test:
  environment:
    contents:
      packages:
        - docker-cli-fips
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        docker compose --help
        docker-compose --version | grep ${{package.version}}

update:
  enabled: true
  github:
    identifier: docker/compose
    strip-prefix: v
    tag-filter: v
