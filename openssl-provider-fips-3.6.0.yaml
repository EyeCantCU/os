#nolint:valid-pipeline-git-checkout-tag
# Status: Draft [Tested Submitted]
# Draft: updates and changes are allowed
# Tested: upgrades should be done only upon request from AtSec
# Submitted: freeze build, fork a new source package, no more updates
package:
  name: openssl-provider-fips-3.6.0
  version: "3.6.0"
  epoch: 1
  description: "the OpenSSL cryptography suite (FIPS provider module)"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - binutils=2.45-r2
      - build-base=1-r9
      - busybox=1.37.0-r50
      - ca-certificates-bundle=20250911-r0
      - curl=8.16.0-r2
      - cyrus-sasl=2.1.28-r44
      - gcc=15.2.0-r2
      - gdbm=1.26-r1
      - git=2.51.1-r1
      - glibc-dev=2.42-r2
      - glibc-locale-posix=2.42-r2
      - glibc=2.42-r2
      - gmp=6.3.0-r8
      - heimdal-libs=7.8.0-r42
      - isl=0.27-r4
      - jitterentropy-library-dev=3.5.0-r0
      - jitterentropy-library=3.5.0-r0
      - jq=1.8.1-r3
      - keyutils-libs=1.6.3-r37
      - krb5-conf=1.0-r7
      - krb5-libs=1.22.1-r1
      - ld-linux=2.42-r2
      - libatomic=15.2.0-r2
      - libbrotlicommon1=1.1.0-r7
      - libbrotlidec1=1.1.0-r7
      - libbz2-1=1.0.8-r21
      - libcom_err=1.47.3-r1
      - libcrypt1=2.42-r2
      - libcrypto3=3.6.0-r0
      - libcurl-openssl4=8.16.0-r2
      - libexpat1=2.7.3-r0
      - libgcc=15.2.0-r2
      - libgo=15.2.0-r2
      - libgomp=15.2.0-r2
      - libidn2=2.3.8-r3
      - libldap=2.6.10-r5
      - libnghttp2-14=1.67.1-r0
      - libpcre2-8-0=10.46-r1
      - libpsl=0.21.5-r6
      - libquadmath=15.2.0-r2
      - libssl3=3.6.0-r0
      - libstdc++-dev=15.2.0-r2
      - libstdc++=15.2.0-r2
      - libunistring=1.4.1-r1
      - libverto=0.3.2-r6
      - libxcrypt-dev=4.4.38-r4
      - libxcrypt=4.4.38-r4
      - libzstd1=1.5.7-r4
      - linux-headers=6.17.3-r0
      - make=4.4.1-r8
      - mpc=1.3.1-r7
      - mpfr=4.2.2-r2
      - ncurses-terminfo-base=6.5_p20250621-r2
      - ncurses=6.5_p20250621-r2
      - nss-db=2.42-r2
      - nss-hesiod=2.42-r2
      - oldglibc-2.34=2.34-r2
      - oniguruma=6.9.10-r1
      - openssf-compiler-options=20240627-r30
      - perl=5.42.0-r1
      - pkgconf=2.5.1-r1
      - posix-cc-wrappers=1-r7
      - readline=8.3-r1
      - scanelf=1.3.8-r5
      - sqlite-libs=3.50.4-r2
      - wolfi-baselayout=20230201-r24
      - zlib=1.3.1-r51
  environment:
    # To support automatic discovery of source code in debug symbols
    # packaged in openssl-dbg, build with debug symbols &
    # file-prefix-map. Also see "Create dbg sourcecode" and
    # split/debug.
    CFLAGS: "-g -ffile-prefix-map=/home/build=/usr/src/${{package.name}}"

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/openssl

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/openssl
      branch: chainguard-${{package.version}}
      expected-commit: 0276ca384e88df2a1cefcaf8a76720e710cb4a99

  - name: Create dbg sourcecode
    runs: |
      SRCDIR=$(mktemp -d)
      cp -r . $SRCDIR/
      mkdir -p ${{targets.destdir}}-dbg/usr/src/
      mv $SRCDIR ${{targets.destdir}}-dbg/usr/src/${{package.name}}
      # Note that mktemp -d created it as 700, whilst the contents
      # inside is 644 for files and 755 for dirs, without this gdb
      # doesn't work for non-root user, fix this up.
      chmod 755 ${{targets.destdir}}-dbg/usr/src/${{package.name}}

  - name: Configure and build
    runs: |
      echo FIPS_VENDOR=Chainguard >> VERSION.dat
      version=${{package.version}}
      fullversion=${{package.full-version}}
      suffix=${fullversion##$version-}
      sed -i "s|\(PRE_RELEASE_TAG=.*\)|\1$suffix|" VERSION.dat

      perl ./Configure \
         linux-${{build.arch}} \
         --prefix=/usr \
         --libdir=lib \
         --openssldir=/etc/ssl \
         enable-fips \
         enable-fips-pedanticonly \
         -DOPENSSL_PEDANTIC_ZEROIZATION \
         disable-fips186-4-ffc \
         enable-fips-jitter \
         enable-ktls \
         enable-jitter \
         shared \
         no-dsa \
         no-des \
         no-zlib \
         no-async \
         no-comp \
         no-idea \
         no-mdc2 \
         no-rc5 \
         no-ec2m \
         no-sm2 \
         no-sm4 \
         no-ssl3 \
         no-seed \
         no-weak-ssl-ciphers \
         -Wa,--noexecstack --debug
      perl configdata.pm --dump
      make -j$(nproc)
      make tests HARNESS_JOBS=10 || true

  - runs: |
      make install_fips DESTDIR="${{targets.destdir}}"

subpackages:
  - name: "${{package.name}}-dbg"
    description: "${{package.name}} debug symbols"
    pipeline:
      - uses: split/debug
      # Regenerate fipsmodule.cnf last, after strip or split/debug
      - runs: |
          rm -f ${{targets.destdir}}/etc/ssl/fipsmodule.cnf
          ./util/wrap.pl ./apps/openssl fipsinstall \
          -pedantic \
          -module ${{targets.destdir}}/usr/lib/ossl-modules/fips.so \
          -out ${{targets.destdir}}/etc/ssl/fipsmodule.cnf

update:
  # Can update, until the build is tested and submitted
  # Flip to frozen, and fork a new source package
  enabled: false
  exclude-reason: |
    Can only upgrade once there is a new submission with atsec.
