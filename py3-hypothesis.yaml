package:
  name: py3-hypothesis
  version: 6.138.3
  epoch: 0
  description: A fast and feature-rich CTC beam search decoder for speech recognitio
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: hypothesis

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/HypothesisWorks/hypothesis.git
      tag: hypothesis-python-${{package.version}}
      expected-commit: 4b8a6b16cc8d9439e7f676a9be6cc7aa0fa0abe1

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-attrs
        - py${{range.key}}-exceptiongroup
        - py${{range.key}}-sortedcontainers
    pipeline:
      - working-directory: hypothesis-python
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: hypothesis-python-

test:
  pipeline:
    - uses: test/emptypackage
