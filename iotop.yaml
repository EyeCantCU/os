package:
  name: iotop
  version: "1.30"
  epoch: 1
  description: A top utility for IO
  copyright:
    - license: GPL-2.0-or-later

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ncurses-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Tomas-M/iotop
      tag: v${{package.version}}
      expected-commit: c3366a8a235f9c8ddc4797625f22cfdf12ba2c36

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: mv ${{targets.destdir}}/usr/sbin ${{targets.destdir}}/usr/bin

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    description: "${{package.name}} manpages"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: Tomas-M/iotop
    strip-prefix: v

test:
  pipeline:
    - runs: iotop --help
    - uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
