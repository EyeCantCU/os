# mysql-8.0 is LTS stream 8.0.x
# mysql-8.4 is future LTS stream 8.4.x
package:
  name: mysql-8.0
  version: "8.0.43"
  epoch: 0
  description: "The MySQL open source relational database"
  copyright:
    - license: GPL-2.0-only # https://downloads.mysql.com/docs/licenses/mysqld-8.0-gpl-en.pdf
  resources:
    cpu: 30
    memory: 60Gi
  dependencies:
    runtime:
      - ${{package.name}}-client
      - merged-usrsbin
      - pwgen
      - wolfi-baselayout

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - libaio-dev
      - libevent-dev
      - libtirpc-dev
      - linux-pam-dev
      - ncurses-dev
      - openssl-dev
      - pcre2-dev
      - readline-dev
      - rpcsvc-proto
      - wolfi-baselayout
      - xz-dev
      - zlib-dev
  environment:
    # newer C versions are more strict regarding standard headers, and require explicit includes
    # but mysql 8 doeesn't do it, and therefore FTBFS
    # force here the inclusion of cstdint
    CXXFLAGS: -include cstdint

pipeline:
  # MySQL requires boost 1.77 and we are not building that version only >1.83, so we are using the existing package for now
  - working-directory: /home/build/boost
    pipeline:
      - uses: fetch
        with:
          uri: https://archives.boost.io/release/1.77.0/source/boost_1_77_0.tar.gz
          expected-sha256: 5347464af5b14ac54bb945dc68f1dd7c56f0dad7262816b956138fc53bcc0131

  - working-directory: /home/build/mysql
    pipeline:
      - uses: fetch
        with:
          uri: https://dev.mysql.com/get/Downloads/${{package.name}}/mysql-${{package.version}}.tar.gz
          expected-sha256: 76250a81015c878f62521cfaf30dff0ea9b250978d2b1dff007408a398d5db93
      - uses: cmake/configure
        with:
          opts: |
            -DWITH_BOOST=/home/build/boost \
            -DWITH_UNIT_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSYSCONFDIR=/etc \
            -DMYSQL_DATADIR=/var/lib/mysql \
            -DMYSQL_UNIX_ADDR=/run/mysqld/mysqld.sock \
            -DDEFAULT_CHARSET=utf8mb4 \
            -DDEFAULT_COLLATION=utf8mb4_general_ci \
            -DENABLED_LOCAL_INFILE=ON \
            -DINSTALL_INFODIR=share/info \
            -DINSTALL_MANDIR=share/man \
            -DINSTALL_PLUGINDIR=lib/${{package.name}}/plugin \
            -DINSTALL_INCLUDEDIR=include/mysql \
            -DINSTALL_DOCREADMEDIR=share/doc/${{package.name}} \
            -DINSTALL_SUPPORTFILESDIR=share/support/${{package.name}} \
            -DINSTALL_MYSQLSHAREDIR=share/${{package.name}} \
            -DINSTALL_DOCDIR=share/doc/${{package.name}} \
            -DWITH_ASAN=OFF \
            -DWITH_JEMALLOC=OFF \
            -DWITH_LIBWRAP=OFF \
            -DWITH_SYSTEMD=OFF \
            -DWITH_SSL=system \
            -DWITH_VALGRIND=OFF \
            -DWITH_ZLIB=system
      - uses: cmake/build
      - uses: cmake/install
      - name: "Remove extras"
        runs: |
          rm -r "${{targets.destdir}}"/usr/mysql-test/

  - uses: strip

subpackages:
  - name: "${{package.name}}-dev"
    description: "headers for mysql"
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - runs: |
            mysql_config --version
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

  - name: "${{package.name}}-client"
    dependencies:
      provides:
        - mysql-client=${{package.full-version}}
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/mysql "${{targets.subpkgdir}}"/usr/bin/

  - name: "${{package.name}}-oci-entrypoint"
    description: Entrypoint for MySQL in OCI containers
    dependencies:
      runtime:
        - bash
        - busybox
        - merged-usrsbin
        - openssl
        - wolfi-baselayout
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin/
          cp docker-entrypoint.sh ${{targets.subpkgdir}}/usr/bin/
          chmod +x ${{targets.subpkgdir}}/usr/bin/docker-entrypoint.sh
    test:
      pipeline:
        - runs: |
            test /usr/bin/docker-entrypoint.sh

  - name: "${{package.name}}-oci-entrypoint-compat"
    pipeline:
      - runs: |
          # Symlink the binary from usr/bin to /
          mkdir -p "${{targets.subpkgdir}}"
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -sf /usr/bin/docker-entrypoint.sh ${{targets.subpkgdir}}/entrypoint.sh
          ln -sf /usr/bin/docker-entrypoint.sh ${{targets.subpkgdir}}/usr/local/bin/docker-entrypoint.sh
    dependencies:
      runtime:
        - merged-usrsbin
        - mysql-8.0-oci-entrypoint
        - wolfi-baselayout
    test:
      pipeline:
        - name: Check symlinks
          runs: |
            test /entrypoint.sh
            test /usr/local/bin/docker-entrypoint.sh

  - name: ${{package.name}}-iamguarded-compat
    dependencies:
      provides:
        - mysql-iamguarded-compat=${{package.full-version}}
      runtime:
        - bash
        - busybox
        - coreutils
        - ini-file
        - merged-usrsbin
        - wolfi-baselayout
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: mysql
          version: ${{vars.major-minor-version}}
      - name: Create symlinks
        runs: |
          mkdir -p "/opt/iamguarded/mysql/bin"
          for file in mysql $(find "${{targets.destdir}}/usr/bin" -type f -exec basename {} \;) ; do
            ln -sf /usr/bin/$file "/opt/iamguarded/mysql/bin/$file"
          done

          mkdir -p "/opt/iamguarded/mysql/lib"
          ln -s /usr/lib/${{package.name}}/plugin "/opt/iamguarded/mysql/lib/plugin"
          ln -s /usr/lib/private "/opt/iamguarded/mysql/lib/private"
          ln -s /usr/share/${{package.name}} "/opt/iamguarded/mysql/share"

          mkdir -p "${{targets.contextdir}}/usr/share/${{package.name}}"
          ln -s /usr/share/${{package.name}} "${{targets.contextdir}}/usr/share/${{package.name}}/${{package.name}}"

          mkdir -p "/opt/iamguarded/mysql/conf/iamguarded"
          install -m644 iamguarded-my.cnf "/opt/iamguarded/mysql/conf/my.cnf"
          cp -pfR "/opt/iamguarded/mysql/conf" "/opt/iamguarded/mysql/conf.default"

          mkdir -p "/opt/iamguarded/mysql/logs"
          ln -sf /proc/1/fd/1 "/opt/iamguarded/mysql/logs/mysqld.log"
      - uses: iamguarded/finalize-compat
        with:
          package: mysql
          version: ${{vars.major-minor-version}}
    test:
      environment:
        accounts:
          users:
            - username: iamguarded
              uid: 1001
              gid: 0
          run-as: 0
        contents:
          packages:
            - ${{package.name}}
            - busybox
            - coreutils
            - sudo
        environment:
          MYSQL_ROOT_PASSWORD: UltraS3cure
          PATH: "/opt/iamguarded/mysql/bin:/opt/iamguarded/common/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          MYSQL_HOME: "/opt/iamguarded/mysql/conf"
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: mysql
            version: ${{vars.major-minor-version}}
        - runs: |
            test -f /opt/iamguarded/mysql/bin/mysql
            test -f /opt/iamguarded/mysql/bin/mysqladmin
            test -f /opt/iamguarded/mysql/bin/mysqld
            test -f /opt/iamguarded/mysql/conf/my.cnf
            test -f /opt/iamguarded/mysql/conf.default/my.cnf
            test -f /opt/iamguarded/mysql/lib/plugin/component_reference_cache.so
            test -f /opt/iamguarded/mysql/share/english/errmsg.sys
            test -f /opt/iamguarded/mysql/share/${{package.name}}/english/errmsg.sys
        - name: "Test entrypoint and run scripts"
          uses: test/daemon-check-output
          with:
            setup: |
              # remove symlink to /proc/1/fd/1 as it does not work for tests runninig in sudo
              rm -f /opt/iamguarded/mysql/logs/mysqld.log
              mkdir -p /iamguarded/data/mysql /opt/iamguarded/mysql/tmp /opt/iamguarded/mysql/run
              chown -fR 1001:0 /iamguarded /opt/iamguarded/mysql
            start: sudo -E -u iamguarded /opt/iamguarded/scripts/mysql/entrypoint.sh /opt/iamguarded/scripts/mysql/run.sh
            post: |
              set -e

              /usr/bin/mysqladmin --user=root -p$MYSQL_ROOT_PASSWORD ping --wait=20
              /opt/iamguarded/mysql/bin/mysqladmin --user=root -p$MYSQL_ROOT_PASSWORD ping --wait=20
              /usr/bin/mysqladmin --user=root -p$MYSQL_ROOT_PASSWORD -h127.0.0.1 ping --wait=20
              /opt/iamguarded/mysql/bin/mysqladmin --user=root -p$MYSQL_ROOT_PASSWORD -h127.0.0.1 ping --wait=20
            expected_output: |
              Installing database
              Configuring authentication
              MySQL setup finished

update:
  enabled: true
  github:
    identifier: mysql/mysql-server
    strip-prefix: mysql-
    use-tag: true
    tag-filter: mysql-8.0.

test:
  environment:
    contents:
      packages:
        - ${{package.name}}
        - ${{package.name}}-client
        - ${{package.name}}-dev
        - gcc
        - make
        - glibc-dev
    environment:
      DBDATA: /var/lib/mysql
  pipeline:
    - uses: test/tw/ldd-check
      with:
        extra-library-paths: "/usr/lib/private/"
    - name: Check versions
      runs: |
        mysql --version |grep "${{package.version}}"
        mysqladmin --version | grep "${{package.version}}"
        comp_err --version
        comp_err --help
        ibd2sdi --version
        ibd2sdi --help
        innochecksum --version
        innochecksum --help
        my_print_defaults --version
        my_print_defaults --help
        myisamchk --version
        myisamchk --help
        myisampack --version
        myisampack --help
        mysql_client_test --help
        mysql_config_editor --version
        mysql_config_editor --help
        mysql_migrate_keyring --version
        mysql_migrate_keyring --help
        mysql_secure_installation --help
        mysql_ssl_rsa_setup --version
        mysql_ssl_rsa_setup --help
        mysql_upgrade --version
        mysql_upgrade --help
        mysqlbinlog --version
        mysqlbinlog --help
        mysqlcheck --version
        mysqlcheck --help
        mysqld --version
        mysqld --help
        mysqld_multi --version
        mysqld_multi --help
        mysqldump --version
        mysqldump --help
        mysqldumpslow version
        mysqldumpslow --help
        mysqlimport --version
        mysqlimport --help
        mysqlpump --version
        mysqlpump --help
        mysqlrouter --version
        mysqlrouter --help
        mysqlrouter_keyring --version
        mysqlrouter_keyring --help
        mysqlrouter_passwd --version
        mysqlrouter_passwd --help
        mysqlrouter_plugin_info --version
        mysqlrouter_plugin_info --help
        mysqlshow --version
        mysqlshow --help
        mysqlslap --version
        mysqlslap --help
        mysqltest --version
        mysqltest --help
        perror --version
        perror --help
    - name: Test
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p "$DBDATA" /var/tmp /var/log/mysql /run/mysqld
          mysqld --initialize-insecure --datadir="$DBDATA"
        start: mysqld --user=root --datadir="$DBDATA"
        post: |
          mysqladmin --user=root ping --wait=5
          mkdir -p /tmp/mysql-test
          cat << 'EOF' > test.c
          #include <mysql/mysql.h>
          #include <stdio.h>
          #include <stdlib.h>

          int main() {
              MYSQL *conn;
              conn = mysql_init(NULL);

              if (conn == NULL) {
                  fprintf(stderr, "mysql_init() failed\n");
                  return EXIT_FAILURE;
              }

              if (mysql_real_connect(conn, "127.0.0.1", "root", "", NULL, 3306, NULL, 0) == NULL) {
                  fprintf(stderr, "mysql_real_connect() failed: %s\n", mysql_error(conn));
                  mysql_close(conn);
                  return EXIT_FAILURE;
              }

              printf("Connected to MySQL server successfully.\n");
              mysql_close(conn);
              return EXIT_SUCCESS;
          }
          EOF
          gcc -o test test.c -lmysqlclient
          ldd ./test | grep libmysqlclient # Verify correct library linkage
          ./test | grep "Connected to MySQL server successfully."
        timeout: 60
        expected_output: |
          starting as process
          ready for connections
