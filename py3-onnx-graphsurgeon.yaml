#nolint:git-checkout-must-use-github-updates
package:
  name: py3-onnx-graphsurgeon
  version: "0.5.8"
  epoch: 1
  description: ONNX GraphSurgeon is a Python library that allows you to create and modify ONNX models
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: onnx-graphsurgeon
  import: onnx_graphsurgeon

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-numpy
      - py3-supported-onnx

pipeline:
  # The latest TensorRT tag contains the latest version of this package, but
  # it uses a different version scheme. We have to consult the source to
  # find this package's version. Example: TensorRT v10.11 contains 0.5.8:
  # https://github.com/NVIDIA/TensorRT/blob/v10.11/tools/onnx-graphsurgeon/onnx_graphsurgeon/__init__.py
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/TensorRT
      tag: v10.11
      expected-commit: 9255eb39e6642787828a4c1f7fc1d09fe004e7a2

  - uses: patch
    with:
      patches: unpin-onnx.patch

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-numpy
        - py${{range.key}}-onnx
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
        working-directory: tools/onnx-graphsurgeon
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  release-monitor:
    identifier: 133004
