package:
  name: apache-tika-fips-3.0
  version: 3.0.0
  epoch: 0
  description: The Apache Tika toolkit detects and extracts metadata and text from over a thousand different file types (such as PPT, XLS, and PDF).
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bcfips-policy-140-3-j${{vars.java-version}}
      - dash-binsh
      - lcms2
      - libjpeg-turbo
      - openjdk-${{vars.java-version}}-default-jvm
      - openssl-config-fipshardened
    provides:
      - apache-tika=${{package.full-version}}

vars:
  java-version: 17

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - coreutils
      - fontconfig-config
      - fontconfig-dev
      - lcms2
      - libfontconfig1
      - libjpeg-turbo
      - maven
      - openjdk-${{vars.java-version}}-default-jdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/tika
      tag: ${{package.version}}
      expected-commit: 9bcb38d6734ed9d5dcff617f316c535e844c68d1

  - uses: patch
    with:
      patches: CVE-2025-54988.patch

  - uses: auth/maven

  - uses: maven/pombump
    with:
      properties-file: pombump-properties.yaml
      pom: tika-parent/pom.xml

  - runs: |
      mvn clean install -am -DskipTests -Dossindex.skip
      mkdir -p "${{targets.contextdir}}"/usr/share/java/
      cp -r tika-server/tika-server-standard/target/tika-server-standard-${{package.version}}.jar "${{targets.contextdir}}"/usr/share/java/tika-server-standard-${{package.version}}.jar

subpackages:
  - name: "${{package.name}}-compat"
    description: "Compatibility package to place binaries in the root folder"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/share/java/tika-server-standard-${{package.version}}.jar ${{targets.subpkgdir}}/tika-server-standard.jar
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

update:
  enabled: true
  github:
    identifier: apache/tika
    use-tag: true
    tag-filter: 3.0.

test:
  environment:
    contents:
      packages:
        - curl
        - ${{package.name}}-compat
        - bcfips-policy-140-3-j${{vars.java-version}}
        - openjdk-${{vars.java-version}}-default-jvm
        - openjdk-${{vars.java-version}}-default-jdk
        - wait-for-it
    environment:
      JAVA_HOME: /usr/lib/jvm/java-${{vars.java-version}}-openjdk
      PASS: "TikaSSLTest123!"
      CLASSPATH: "/usr/share/java/bouncycastle-fips/*:./*:."
      JAVA_TOOL_OPTIONS: "--module-path=/usr/share/java/bouncycastle-fips"
      JDK_JAVA_OPTIONS: "--add-exports=java.base/sun.security.internal.spec=ALL-UNNAMED --add-exports=java.base/sun.security.provider=ALL-UNNAMED -Dorg.bouncycastle.fips.approved.only=true -Djavax.net.ssl.trustStoreType=BCFKS -Djava.security.properties=/usr/lib/jvm/default-jvm/conf/security/java.security"
  pipeline:
    - name: "Verify Tika Installation"
      runs: |
        set -euo pipefail
        # Verify JAR file exists and is readable
        [ -f /tika-server-standard.jar ]
        [ -r /tika-server-standard.jar ]
        # Verify it's a valid JAR
        jar -tf /tika-server-standard.jar > /dev/null
    - name: "Generate FIPS KeyStore and TrustStore"
      runs: |
        set -euo pipefail
        mkdir -p /tmp/tika-tls
        keytool \
          -v -keystore /tmp/tika-tls/tika-keystore.bcfks \
          -storetype BCFKS \
          -providername BCFIPS \
          -alias tika-server \
          -genkeypair -sigalg SHA256withRSA -keyalg RSA -keysize 2048 \
          -dname "CN=localhost" \
          -storepass "$PASS" \
          -keypass "$PASS" \
          -validity 365
        # Export certificate from keystore for curl to trust
        keytool \
          -v -keystore /tmp/tika-tls/tika-keystore.bcfks \
          -storetype BCFKS \
          -providername BCFIPS \
          -alias tika-server \
          -exportcert -rfc \
          -storepass "$PASS" \
          -file /tmp/tika-tls/tika-server.crt
        # Create truststore and import the certificate
        keytool \
          -v -keystore /tmp/tika-tls/tika-truststore.bcfks \
          -storetype BCFKS \
          -providername BCFIPS \
          -alias tika-server \
          -importcert -noprompt \
          -file /tmp/tika-tls/tika-server.crt \
          -storepass "$PASS"
    - name: "Test Tika Server with HTTPS/TLS"
      uses: test/daemon-check-output
      with:
        setup: |-
          tee /tmp/tika-tls/tika-config.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <properties>
            <server>
              <params>
                <port>9999</port>
              </params>
              <tlsConfig>
                <params>
                  <active>true</active>
                  <keyStoreType>BCFKS</keyStoreType>
                  <keyStorePassword>TikaSSLTest123!</keyStorePassword>
                  <keyStoreFile>/tmp/tika-tls/tika-keystore.bcfks</keyStoreFile>
                  <trustStoreType>BCFKS</trustStoreType>
                  <trustStorePassword>TikaSSLTest123!</trustStorePassword>
                  <trustStoreFile>/tmp/tika-tls/tika-truststore.bcfks</trustStoreFile>
                </params>
              </tlsConfig>
            </server>
          </properties>
          EOF
        start: java -jar /tika-server-standard.jar -c /tmp/tika-tls/tika-config.xml
        expected_output: |
          Started Apache Tika server
          https://localhost:9999/
          {ssl
          TLS configuration
        timeout: 10
        post: |-
          set -o pipefail
          wait-for-it -t 10 --strict localhost:9999
          echo "Testing HTTPS endpoint with TLS:"
          curl --cacert /tmp/tika-tls/tika-server.crt -fsSL https://localhost:9999/ | grep -F "Welcome to the Apache Tika"
          echo "Testing text extraction over HTTPS:"
          msg="TLS test file"
          echo "$msg" > /tmp/tls-test.txt
          curl --cacert /tmp/tika-tls/tika-server.crt -X PUT --data-binary @/tmp/tls-test.txt -H "Content-Type: text/plain" https://localhost:9999/tika | grep -F "$msg"
