package:
  name: py3-opentelemetry-api
  version: 1.37.0
  epoch: 0
  description: OpenTelemetry Python API
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-build-base
      - py3-supported-hatchling
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-wheel
      - wolfi-base

data:
  - name: py-versions
    items:
      "3.10": "310"
      "3.11": "311"
      "3.12": "312"
      "3.13": "313"

vars:
  pypi-package: opentelemetry-api

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-python
      tag: v${{package.version}}
      expected-commit: bc413fcf74a380cf62428a130ead61ff1683494a

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-deprecated
        - py${{range.key}}-importlib-metadata
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - working-directory: opentelemetry-api
        pipeline:
          - uses: py/pip-build-install
            with:
              python: python${{range.key}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              from opentelemetry import trace

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          from opentelemetry import trace

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-python
    strip-prefix: v
    use-tag: true
