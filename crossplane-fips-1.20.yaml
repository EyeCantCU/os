package:
  name: crossplane-fips-1.20
  version: "1.20.3"
  epoch: 0
  description: Cloud Native Control Planes
  dependencies:
    provides:
      - crossplane-fips=${{package.full-version}}
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0e76849ac0e666decb25c24257c85101926f0333
      repository: https://github.com/crossplane/crossplane
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - runs: |
      mkdir -p ${{targets.destdir}}/crds
      cp cluster/crds/* ${{targets.destdir}}/crds

      mkdir -p ${{targets.destdir}}/webhookconfigurations
      cp cluster/webhookconfigurations/* ${{targets.destdir}}/webhookconfigurations

  - uses: go/build
    with:
      output: crossplane
      packages: ./cmd/crossplane
      ldflags: -X github.com/crossplane/crossplane/internal/version.version=v${{package.version}}
      go-package: go-fips

subpackages:
  - name: ${{package.name}}-crank
    dependencies:
      provides:
        - crossplane-crank-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          output: crank
          packages: ./cmd/crank
          go-package: go-fips
    test:
      pipeline:
        - uses: test/go-fips-check
        - uses: test/tw/help-check
          with:
            bins: crank

update:
  enabled: true
  github:
    identifier: crossplane/crossplane
    strip-prefix: v
    tag-filter-prefix: v1.20

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: crossplane
    - uses: test/tw/ver-check
      with:
        bins: crossplane
