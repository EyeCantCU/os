package:
  name: py3-py-ulid
  version: "1.0.4"
  epoch: 0
  description: Universally Unique Lexicographically Sortable Identifier (ULID) in Python
  copyright:
    - license: MIT
  dependencies:
    provider-priority: 0

vars:
  pypi-package: py-ulid
  import: ulid

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/itsrainingmani/py-ulid.git
      tag: v${{package.version}}
      expected-commit: bd63902a1297d32b0a264601e20400a8ce20e926

  - name: Python Build
    uses: python/build-wheel

  - uses: strip

test:
  environment:
    contents:
      packages:
        - python3
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: itsrainingmani/py-ulid
    strip-prefix: v
    use-tag: true
