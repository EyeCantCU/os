package:
  name: graalvm-23
  version: "23.0.2"
  epoch: 0
  description: GraalVM ${{vars.major-version}} Java development kit
  copyright:
    - license: GPL-2.0-with-classpath-exception
  dependencies:
    runtime:
      - alsa-lib
      - freetype
      - giflib
      - java-cacerts
      - lcms2
      - libfontconfig1
      - libjpeg-turbo
      - libx11
      - libxext
      - libxi
      - libxrender
      - libxtst
      - ttf-dejavu
      - zlib

vars:
  java-home: /usr/lib/jvm/java-23-graalvm
  boot-jdk: /usr/lib/jvm/java-23-openjdk
  googletest-version: v1.14.0
  googletest-sha512: 765c326ccc1b87a01027385e69238266e356361cd4ee3e18e3c9d137a5d11fa5d657c164d02dd1be8fe693c8e10f2b580588dbfa57d27f070e2750f50d3e662c
  # https://www.graalvm.org/release-notes/JDK_23
  graal-version: 24.1.2
  graal-commit: a50c2ec01ee5bab0702c56b3a1136bae73bb759e

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

environment:
  contents:
    packages:
      - alsa-lib-dev
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - cups-dev
      - curl-dev
      - file
      - fontconfig-dev
      - freetype-dev
      - gfortran
      - giflib-dev
      - glibc-iconv
      - lcms2-dev
      - libffi-dev
      - libjpeg-turbo-dev
      - libtirpc-dev
      - libx11-dev
      - libxext-dev
      - libxi-dev
      - libxrandr-dev
      - libxrender-dev
      - libxt-dev
      - libxtst-dev
      - maven
      - mx
      - ncurses-dev
      - openjdk-${{vars.major-version}}-default-jdk
      - pcre2-dev
      - readline-dev
      - xz-dev
      - yaml-dev
      - zip
  environment:
    # This is needed to work around the error date 1970-01-01T00:00:00Z is not within the valid range 1980-01-01T00:00:02Z to 2099-12-31T23:59:59Z
    SOURCE_DATE_EPOCH: 315532900

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openjdk/jdk${{vars.major-version}}u
      tag: jdk-${{package.version}}-ga
      expected-commit: a13b02ce6f8545b9fce1263f0b5a219b55fb2522

  - uses: git-checkout
    with:
      repository: https://github.com/oracle/graal
      tag: vm-${{vars.graal-version}}
      expected-commit: ${{vars.graal-commit}}
      destination: graal

  - uses: patch
    with:
      patches: never-fail-version-check.patch

  - name: Extract the googletest version from the source doc and Verify
    runs: |
      googletest_version=$(sed -n 's/.*https:\/\/github\.com\/google\/googletest\/releases\/tag\/\(v[0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p' doc/building.md)
      if [ "$googletest_version" != "${{vars.googletest-version}}" ]; then
        echo "Error: googletest version mismatch. Expected ${{vars.googletest-version}}, got $googletest_version"
        exit 1
      fi

  - working-directory: /home/build/googletest
    pipeline:
      - uses: fetch
        with:
          uri: https://github.com/google/googletest/archive/${{vars.googletest-version}}.tar.gz
          expected-sha512: ${{vars.googletest-sha512}}

  - runs: chmod +x configure

  - uses: autoconf/configure
    with:
      opts: |
        --disable-precompiled-headers \
        --disable-warnings-as-errors \
        --enable-dtrace=no \
        --prefix=${{vars.java-home}} \
        --with-boot-jdk=${{vars.boot-jdk}} \
        --with-debug-level=release \
        --with-freetype=system \
        --with-giflib=system \
        --with-gtest="/home/build/googletest" \
        --with-jtreg=no \
        --with-jvm-variants=server \
        --with-lcms=system \
        --with-libjpeg=system \
        --with-libpng=system \
        --with-native-debug-symbols=internal \
        --with-vendor-bug-url=https://chainguard.dev/contact \
        --with-vendor-name=Chainguard \
        --with-vendor-url=https://chainguard.dev \
        --with-vendor-vm-bug-url=https://chainguard.dev/contact \
        --with-version-opt="cgr-r${{package.epoch}}" \
        --with-version-pre="no" \
        --with-version-string="" \
        --with-zlib=system

  - runs: |
      # Create Graal builder image
      make graal-builder-image

      # Build GraalVM
      cd graal/vm

      # Use graal builder JDK
      export JAVA_HOME="/home/build/build/linux-${{build.arch}}-server-release/images/graal-builder-jdk"

      # Build GraalVM
      mx --env=ce build

      # Install GraalVM
      mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
      if [ -d ../sdk/mxbuild/linux-${{build.goarch}} ]; then
        cp -r ../sdk/mxbuild/linux-${{build.goarch}}/GRAALVM_COMMUNITY_JAVA${{vars.major-version}}/graalvm-community-openjdk-${{package.version}}*/* ${{targets.contextdir}}/${{vars.java-home}}
      else
        cp -r ../sdk/mxbuild/linux-${{build.arch}}/GRAALVM_COMMUNITY_JAVA${{vars.major-version}}/graalvm-community-openjdk-${{package.version}}*/* ${{targets.contextdir}}/${{vars.java-home}}
      fi
      rm ${{targets.contextdir}}/${{vars.java-home}}/lib/src.zip

      # copy to shared java cacerts store
      rm -f ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts
      ln -s /etc/ssl/certs/java/cacerts \
        ${{targets.contextdir}}/${{vars.java-home}}/lib/security/cacerts
      # symlink for `java-common` to work (which expects jre in $JAVA_HOME/jre)
      ln -s . ${{targets.contextdir}}/${{vars.java-home}}/jre

subpackages:
  - name: ${{package.name}}-native-image-dev
    description: Dependencies needed by native image for development with GraalVM ${{vars.major-version}}
    dependencies:
      runtime:
        - ${{package.name}}
        - ${{package.name}}-static
        - gcc
        - glibc-dev
        - zlib-dev
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}-default-jdk
      pipeline:
        - runs: |
            cat > Hello.java <<'EOF'
            public class Hello {
              public static void main(String[] args) {
                System.out.println("Hello from native image!");
              }
            }
            EOF
            javac Hello.java
            native-image Hello -H:Name=hello
            ./hello | grep -q "Hello from native image!"

  - name: ${{package.name}}-dbg
    description: GraalVM ${{vars.major-version}} Java debug symbols
    pipeline:
      - uses: split/debug
    dependencies:
      runtime:
        - ${{package.name}}

  - name: ${{package.name}}-static
    description: GraalVM ${{vars.major-version}} static libraries
    pipeline:
      - uses: split/static
    dependencies:
      runtime:
        - ${{package.name}}

  - name: ${{package.name}}-jmods
    description: GraalVM ${{vars.major-version}} jmods
    dependencies:
      provides:
        - graalvm-jmods=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/${{vars.java-home}}
          mv ${{targets.destdir}}/${{vars.java-home}}/jmods \
             ${{targets.contextdir}}/${{vars.java-home}}

  - name: ${{package.name}}-default-jdk
    description: Use the GraalVM ${{vars.major-version}} JVM as the default JVM with the JDK installed
    dependencies:
      runtime:
        - ${{package.name}}
      provides:
        - graalvm-default-jdk=1.${{vars.major-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib/jvm
          ln -s $(basename ${{vars.java-home}}) ${{targets.contextdir}}/usr/lib/jvm/default-jvm

          # Symlink binaries provided by GraalVM
          # Substitutes java-common
          mkdir -p ${{targets.contextdir}}/usr/bin
          for path in ${{targets.destdir}}/${{vars.java-home}}/bin/*; do
            bin=$(basename $path)
            ln -s ../lib/jvm/default-jvm/bin/$bin ${{targets.contextdir}}/usr/bin/$bin
          done

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-default-jdk
        - ${{package.name}}-jmods
  pipeline:
    # Test a basic Hello World
    - working-directory: basic
      runs: |
        javac HelloWorld.java
        java HelloWorld | grep -qi "Hello World!"
    # Test a basic HTTP connection
    - working-directory: basic
      runs: |
        javac RequestTest.java
        java RequestTest | grep -qi "Successfully connected to example.org"
    # Test modules
    - working-directory: advanced/module-project
      runs: |
        mkdir output
        javac -d output --module-source-path modules $(find modules -name "*.java")

        # Create a jar with the compiled classes
        jar --verbose --create --file app.jar \
          --main-class dev.chainguard.module.main.Main \
          --module-version 1.0 \
          -C output/test.modules . \
          -C output/main.app .

        # Test the jar
        java -jar app.jar

        # Test jlink
        jlink --verbose --module-path "app.jar:$JAVA_HOME/jmods" \
          --add-modules test.modules \
          --output test-project-jre

        # Test custom JRE
        test-project-jre/bin/java -jar app.jar
    # Test JVMCI
    - runs: |
        cat > Counter.java <<'EOF'
        public class Counter {
          public static void main(String[] args) throws Exception {
            int sum = 0;
            for (int i = 0; i < 10; i++) sum += i;
            System.out.println(sum);
          }
        }
        EOF
        javac Counter.java
        # Use JVMCI and log compilation
        java -XX:+UnlockExperimentalVMOptions \
             -XX:+UseJVMCICompiler \
             -XX:+UnlockDiagnosticVMOptions \
             -XX:+LogCompilation \
             Counter

update:
  enabled: true
  shared: true
  github:
    identifier: openjdk/jdk23u
    strip-prefix: jdk-
    strip-suffix: -ga
    tag-filter-contains: -ga
    use-tag: true
