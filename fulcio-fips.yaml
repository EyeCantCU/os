package:
  name: fulcio-fips
  version: 1.5.0
  epoch: 1
  description: Sigstore OIDC PKI
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sigstore/fulcio
      tag: v${{package.version}}
      expected-commit: 781fb652c8f9e08dc52903cba0b7680120f82467

  - uses: go/bump
    with:
      deps: google.golang.org/grpc@v1.64.1
      modroot: .

  - uses: go/build
    with:
      packages: ./
      modroot: .
      output: fulcio
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: sigstore/fulcio
    strip-prefix: v
