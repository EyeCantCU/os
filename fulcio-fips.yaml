package:
  name: fulcio-fips
  version: 1.5.1
  epoch: 0
  description: Sigstore OIDC PKI
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/sigstore/fulcio
      tag: v${{package.version}}
      expected-commit: f11344b67252fbfada3774ce17426df9f85b87ae

  - uses: go/build
    with:
      packages: ./
      modroot: .
      output: fulcio
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: sigstore/fulcio
    strip-prefix: v
