package:
  name: corretto-8
  version: "8.452.09.2"
  epoch: 0
  description: Amazon Corretto 8 is a no-cost, multi-platform, production-ready distribution of OpenJDK 8
  copyright:
    - license: GPL-2.0-with-classpath-exception
  dependencies:
    runtime:
      - java-cacerts
      - zlib

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.){3}(\d+)\.\d+$
    replace: "$2"
    to: build-version

environment:
  contents:
    packages:
      - alsa-lib-dev
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cups-dev
      - file
      - fontconfig-dev
      - freetype-dev
      - giflib-dev
      - java-cacerts
      - lcms2-dev
      - libffi-dev
      - libjpeg-turbo-dev
      - libx11-dev
      - libxext-dev
      - libxi-dev
      - libxrandr-dev
      - libxrender-dev
      - libxt-dev
      - libxtst-dev
      - openjdk-7-default-jdk
      - zip
  environment:
    # This is needed to work around the error date 1970-01-01T00:00:00Z is not within the valid range 1980-01-01T00:00:02Z to 2099-12-31T23:59:59Z
    SOURCE_DATE_EPOCH: 315532900

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/corretto/corretto-8
      tag: ${{package.version}}
      expected-commit: 91e4c374033b110ecab03c739e5ee2452aee2514

  - uses: patch
    with:
      patches: fix-as-needed-linking.patch

  - working-directory: /home/build/googletest
    pipeline:
      - uses: fetch
        with:
          uri: https://github.com/google/googletest/archive/v1.13.0.tar.gz
          expected-sha512: 70c0cfb1b4147bdecb467ecb22ae5b5529eec0abc085763213a796b7cdbd81d1761d12b342060539b936fa54f345d33f060601544874d6213fdde79111fa813e

  - runs: chmod +x configure

  # Note that despite using --with-extra-cflags, --with-extra-cxxflags, and
  # --with-extra-ldflags, the configure still produces warnings like:
  # https://github.com/wolfi-dev/os/issues/18747
  - runs: |
      export EXTRA_CFLAGS="-Wno-complain-wrong-lang -Wformat -Wno-cpp -Wno-error -fno-delete-null-pointer-checks -fno-lifetime-dse -fno-strict-overflow"
      export EXTRA_CPP_FLAGS="-Wno-complain-wrong-lang -Wno-cpp -fno-delete-null-pointer-checks -fno-lifetime-dse -fno-strict-overflow"
      CFLAGS='' CXXFLAGS='' LDFLAGS='' \
      bash ./configure \
        --disable-precompiled-headers \
        --prefix=/usr/lib/jvm/java-1.8-amazon-corretto \
        --with-boot-jdk=/usr/lib/jvm/java-1.7-openjdk \
        --with-debug-level=release \
        --with-extra-cflags="$EXTRA_CFLAGS" \
        --with-extra-cxxflags="$EXTRA_CPP_FLAGS" \
        --with-extra-ldflags="$LDFLAGS" \
        --with-jtreg=no \
        --with-jvm-variants=server \
        --with-native-debug-symbols=internal \
        --with-vendor-bug-url=https://github.com/wolfi-dev/os/issues \
        --with-vendor-name=Chainguard \
        --with-vendor-url=https://chainguard.dev \
        --with-vendor-vm-bug-url=https://github.com/wolfi-dev/os/issues \
        --with-zlib=system

  - runs: make images SHELL=/bin/bash

  # Check we built something valid
  - runs: |
      _java_bin="./build/*-server-release/jdk/bin"

      $_java_bin/javac -d . HelloWorld.java
      $_java_bin/java HelloWorld

      # NOTE: Disable flakey tests for now as we're seeing builds hang on aarch64
      # # run the gtest unittest suites
      # make test-hotspot-gtest

  - runs: |
      _java_home="usr/lib/jvm/java-1.8-amazon-corretto"

      mkdir -p "${{targets.destdir}}"/$_java_home
      cp -r build/*-server-release/jdk/* "${{targets.contextdir}}"/$_java_home
      # rm "${{targets.destdir}}"/$_java_home/src.zip

subpackages:
  - name: "${{package.name}}-dbg"
    description: "Corretto 8 Java Debug Symbols"
    pipeline:
      - uses: split/debug
    dependencies:
      runtime:
        - ${{package.name}}
        - java-common

  - name: "${{package.name}}-jre"
    description: "Corretto 8 Java Runtime Environment"
    dependencies:
      runtime:
        - java-cacerts
        - java-common
    pipeline:
      - runs: |
          _java_home="usr/lib/jvm/java-1.8-amazon-corretto"

          mkdir -p "${{targets.subpkgdir}}"/$_java_home
          cp -r build/*-server-release/images/j2sdk-image/jre/* "${{targets.subpkgdir}}"/$_java_home


          # move jre executables expected by java-common
          mkdir -p "${{targets.subpkgdir}}"/$_java_home/bin
          for file in java orbd rmid servertool unpack200 keytool \
                pack200 rmiregistry tnameserv; do
            mv "${{targets.destdir}}"/$_java_home/bin/$file "${{targets.subpkgdir}}"/$_java_home/bin/
          done

          # symlink for `java-common` to work (which expects jre in $_java_home/jre)
          ln -sf . "${{targets.subpkgdir}}/$_java_home/jre"

  - name: "${{package.name}}-doc"
    description: "Corretto 8 Documentation"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/jvm/java-1.8-amazon-corretto
          mv ./build/*-server-release/images/j2sdk-image/man \
            "${{targets.subpkgdir}}"/usr/lib/jvm/java-1.8-amazon-corretto

  - name: "${{package.name}}-demos"
    description: "Corretto 8 Demos"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/jvm/java-1.8-amazon-corretto
          mv "${{targets.destdir}}"/usr/lib/jvm/java-1.8-amazon-corretto/demo \
             "${{targets.subpkgdir}}"/usr/lib/jvm/java-1.8-amazon-corretto

  - name: "${{package.name}}-default-jvm"
    description: "Use the corretto-8 JVM as the default JVM"
    dependencies:
      runtime:
        - ${{package.name}}-jre
      provides:
        - corretto-default-jvm=1.8
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/lib/jvm
          ln -sf java-1.8-amazon-corretto "${{targets.subpkgdir}}"/usr/lib/jvm/default-jvm

  - name: "${{package.name}}-default-jdk"
    description: "Use the corretto-8 JVM as the default JVM with the JDK installed"
    dependencies:
      runtime:
        - ${{package.name}}
        - ${{package.name}}-default-jvm
      provides:
        - corretto-default-jdk=1.8

update:
  enabled: true
  github:
    identifier: corretto/corretto-8
    use-tag: true

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-default-jdk
        - java-common
    environment:
      JAVA_HOME: /usr/lib/jvm/java-1.8-amazon-corretto
  pipeline:
    # Test a basic Hello World
    - working-directory: basic
      runs: |
        javac HelloWorld.java
        java HelloWorld | grep -qi "Hello World!"
    # Test a basic HTTP connection
    - working-directory: basic
      runs: |
        javac RequestTest.java
        java RequestTest | grep -qi "Successfully connected to example.org"
    # Test modules
    - working-directory: advanced/module-project
      runs: |
        mkdir output
        javac -d output -sourcepath modules $(find modules -name "*.java")

        # Create a jar with the compiled classes
        jar cvfe app.jar dev.chainguard.module.main.Main \
          -C output . \
          -C modules/ .

        # Test the jar
        java -jar app.jar
