package:
  name: ta-lib
  version: 0.6.4
  epoch: 0
  description: Technical Analysis Library for financial market data analysis
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/TA-Lib/ta-lib
      tag: v${{package.version}}
      expected-commit: 43f9d5042ecc4bd367941846494ad907bf20ea50

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-static
    description: Static libraries for ${{package.name}}
    pipeline:
      - uses: split/static
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers and libraries
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-dev
        - gcc
  pipeline:
    - uses: test/tw/ldd-check
    - runs: |
        set -euo pipefail

        # Compile the test program
        gcc -o /tmp/ta_test $PWD/test/functions/ta_test.c -lta-lib -lm

        # Run the test
        /tmp/ta_test

update:
  enabled: true
  git:
    strip-prefix: v
