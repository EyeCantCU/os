package:
  name: run-java-sh
  version: "1.3.8"
  epoch: 0
  description: Universal startup script for plain Java applications
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # tw shell-deps show run-java.sh
      - busybox
      - dash-binsh

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0e88ff1770301916b405a166c4a61515de10484b
      repository: https://github.com/fabric8io-images/run-java-sh
      tag: ${{package.version}}

  - runs: install -Dpm0755 fish-pepper/run-java-sh/fp-files/run-java.sh "${{targets.contextdir}}/usr/bin/run-java.sh"

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for run-java.sh at /run-java.sh
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"
          ln -sf ./usr/bin/run-java.sh "${{targets.contextdir}}/run-java.sh"
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  git: {}

test:
  pipeline:
    - name: "Check expected scripts exist"
      runs: |
        stat /usr/bin/run-java.sh
