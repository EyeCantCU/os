package:
  name: tigera-operator-fips-1.34
  version: 1.34.0
  epoch: 0
  description: Kubernetes operator for installing Calico and Calico Enterprise
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      # for fips config & fips-provider
      - openssl-config-fipshardened
      # either melange SCA should provide these
      # or we should make go-fips shared link on these
      - so:libcrypto.so.3
      - so:libssl.so.3

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d841e025d5d2b994df5849588d44e88e9300e8bd
      repository: https://github.com/tigera/operator
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: google.golang.org/protobuf@v1.33.0

  - uses: go/build
    with:
      packages: .
      output: operator
      ldflags: -X github.com/tigera/operator/version.VERSION=v${{package.version}}
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: tigera/operator
    tag-filter-prefix: v1.34.
    strip-prefix: v
