# Creates meta-packages used internally in building other CUDA dependent packages like torch, vllm etc.
package:
  name: cuda-toolkit-12.5
  version: 12.5
  # version of the the cuda-toolkit and the run-time dependencies are tracked referencing NVIDIA's toolkit versions
  epoch: 2
  description: Meta-package for providing CUDA-toolkit packages
  copyright:
    - license: PROPRIETARY
  target-architecture:
    - x86_64
  dependencies:
    runtime:
      - nvidia-cuda-cudart-12.5
      - nvidia-cuda-nvcc-12.5
      - nvidia-cuda-nvml-dev-12.5
      - nvidia-cuda-nvrtc-12.5
      - nvidia-cuda-nvtx-12.5
      - nvidia-libcublas-12.5
      - nvidia-libcufft-12.5
      - nvidia-libcurand-12.5
      - nvidia-libcusolver-12.5
      - nvidia-libcusparse-12.5
      - nvidia-libnvjitlink-12.5

subpackages:
  - name: ${{package.name}}-dev
    description: Meta-package for providing CUDA-toolkit development packages
    dependencies:
      runtime:
        - nvidia-cuda-cudart-12.5-dev
        - nvidia-cuda-nvcc-12.5-dev
        - nvidia-cuda-nvml-dev-12.5
        - nvidia-cuda-nvrtc-12.5-dev
        - nvidia-cuda-nvtx-12.5-dev
        - nvidia-libcublas-12.5-dev
        - nvidia-libcufft-12.5-dev
        - nvidia-libcurand-12.5-dev
        - nvidia-libcusolver-12.5-dev
        - nvidia-libcusparse-12.5-dev
        - nvidia-libnvjitlink-12.5-dev

update:
  enabled: false
  exclude-reason: meta-package
