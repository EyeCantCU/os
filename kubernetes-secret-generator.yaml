package:
  name: kubernetes-secret-generator
  version: "3.4.1"
  epoch: 0
  description: Kubernetes controller for automatically generating and updating secrets
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/mittwald/kubernetes-secret-generator
      tag: v${{package.version}}
      expected-commit: 1bf94b50ad1504926a5478d2618fc57dfb37b735

  - name: upgrade Go to 1.25
    runs: |
      sed -i 's/go 1\.23\(\.[0-9]*\)\?/go 1.25/' go.mod
      go mod tidy

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/crypto@v0.35.0
        golang.org/x/net@v0.38.0
      replaces: |-
        github.com/dgrijalva/jwt-go=github.com/golang-jwt/jwt/v4@v4.5.1

  - uses: go/build
    with:
      packages: ./cmd/manager
      output: manager
      ldflags: -X version.Version=${{package.version}}

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility package for ${{package.name}}
    pipeline:
      - runs: |
          # Create symlink at /manager for compatibility
          mkdir -p ${{targets.contextdir}}/
          ln -s ./usr/bin/manager ${{targets.contextdir}}/manager
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check

update:
  enabled: true
  github:
    identifier: mittwald/kubernetes-secret-generator
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - git
    environment:
      WATCH_NAMESPACE: default
      POD_NAME: dummy
  pipeline:
    - uses: test/kwok/cluster
      with:
        serviceaccount: true
    - runs: |
        git clone --branch v${{package.version}} --depth 1 https://github.com/mittwald/kubernetes-secret-generator.git
    - runs: kubectl apply -f kubernetes-secret-generator/deploy/crds/
    - uses: test/daemon-check-output
      with:
        start: /usr/bin/manager
        setup: |
          kubectl run dummy --image=nginx:stable --port=80
        timeout: 30
        expected_output: |
          Starting workers
