package:
  name: tensorrt-10.13-cuda-12.9
  version: 10.13.0.35
  epoch: 1
  description: TensorRT libraries for NVIDIA GPUs
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    runtime:
      - libnvinfer-${{vars.major-minor}}-cuda-${{vars.cuda-version}}=${{package.full-version}}
      - libnvinfer-bin-${{vars.major-minor}}-cuda-${{vars.cuda-version}}=${{package.full-version}}
      - libnvinfer-dispatch-${{vars.major-minor}}-cuda-${{vars.cuda-version}}=${{package.full-version}}
      - libnvinfer-lean-${{vars.major-minor}}-cuda-${{vars.cuda-version}}=${{package.full-version}}
      - libnvinfer-plugin-${{vars.major-minor}}-cuda-${{vars.cuda-version}}=${{package.full-version}}
      - libnvinfer-vc-plugin-${{vars.major-minor}}-cuda-${{vars.cuda-version}}=${{package.full-version}}
      - libnvonnxparser-${{vars.major-minor}}-cuda-${{vars.cuda-version}}=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: '(\d+\.\d+\.\d+)\.\d+'
    replace: '$1'
    to: mangled-package-version
  - from: ${{package.version}}
    match: '(\d+\.\d+)\.\d+\.\d+'
    replace: '$1'
    to: major-minor
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

environment:
  contents:
    packages:
      - busybox

data:
  # libnvinfer-plugin is split out here because it has an extra dep
  # we can restore it when melange is able to populate our deps
  - name: _libs
    items:
      libnvinfer-dispatch:
      libnvinfer-lean:
      libnvinfer-vc-plugin:
      libnvonnxparser:
      libnvinfer:

  - name: _devs
    items:
      libnvinfer-dispatch:
      libnvinfer-lean:
      libnvinfer-plugin:
      libnvinfer-vc-plugin:
      libnvonnxparser:
      libnvinfer:

pipeline:
  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/${{vars.mangled-package-version}}/tars/TensorRT-${{package.version}}.Linux.x86_64-gnu.cuda-${{vars.cuda-version}}.tar.gz"
      expected-sha256: "899ff39e237f1351fccac7f6891617f68cbab71c13a7d7c703184424bdbbf621"
      timeout: 600

  - if: ${{build.arch}} == 'aarch64'
    uses: fetch
    with:
      uri: "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/${{vars.mangled-package-version}}/tars/TensorRT-${{package.version}}.Linux.aarch64-gnu.cuda-${{vars.cuda-version}}.tar.gz"
      expected-sha256: "b2f7c7ae6da3588729b7a64825246cc59b643adbe373684fb9c5713262ed46c2"
      timeout: 600

  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/local/tensorrt
      mv targets doc lib ${{targets.contextdir}}/usr/local/tensorrt/

subpackages:
  - name: libnvinfer-bin-${{vars.major-minor}}-cuda-${{vars.cuda-version}}
    description: libnvinfer binaries
    options:
      no-depends: true
    dependencies:
      runtime:
        - libstdc++
    pipeline:
      - runs: |
          _bindir=usr/local/tensorrt/targets/$(arch)-linux-gnu/bin
          mkdir -p ${{targets.contextdir}}/$_bindir
          mv ${{targets.destdir}}/$_bindir/* ${{targets.contextdir}}/$_bindir
          mv bin ${{targets.contextdir}}/usr/local/tensorrt
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: libnvinfer-${{vars.major-minor}}-samples-cuda-${{vars.cuda-version}}
    description: libnvinfer samples
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/tensorrt/
          mv samples ${{targets.contextdir}}/usr/local/tensorrt/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - range: _libs
    name: ${{range.key}}-${{vars.major-minor}}-cuda-${{vars.cuda-version}}
    description: ${{range.key}}
    options:
      no-depends: true
    dependencies:
      runtime:
        - libstdc++
        - ${{package.name}}-ldconfig
    pipeline:
      - runs: |
          libname="${{range.key}}"
          _libdir=usr/local/tensorrt/targets/$(arch)-linux-gnu/lib
          mkdir -p ${{targets.subpkgdir}}/$_libdir

          # Replacing hyphens with underscores in libname
          libname_with_underscore="${libname//-/_}"
          mv ${{targets.destdir}}/$_libdir/${libname_with_underscore}.so.* ${{targets.subpkgdir}}/$_libdir

          if [ "$libname" = "libnvinfer" ]; then
            mv ${{targets.destdir}}/$_libdir/${libname_with_underscore}_builder*.so.* ${{targets.subpkgdir}}/$_libdir
          fi

  - name: libnvinfer-plugin-${{vars.major-minor}}-cuda-${{vars.cuda-version}}
    description: libnvinfer-plugin
    options:
      no-depends: true
    dependencies:
      runtime:
        - libstdc++
        - libnvinfer-${{vars.major-minor}}-cuda-${{vars.cuda-version}}
        - ${{package.name}}-ldconfig
    pipeline:
      - runs: |
          libname="libnvinfer-plugin"
          _libdir=usr/local/tensorrt/targets/$(arch)-linux-gnu/lib
          mkdir -p ${{targets.subpkgdir}}/$_libdir

          # Replacing hyphens with underscores in libname
          libname_with_underscore="${libname//-/_}"
          mv ${{targets.destdir}}/$_libdir/${libname_with_underscore}.so.* ${{targets.subpkgdir}}/$_libdir

          if [ "$libname" = "libnvinfer" ]; then
            mv ${{targets.destdir}}/$_libdir/${libname_with_underscore}_builder*.so.* ${{targets.subpkgdir}}/$_libdir
          fi

  - range: _devs
    name: ${{range.key}}-${{vars.major-minor}}-cuda-${{vars.cuda-version}}-dev
    description: ${{range.key}}-dev
    options:
      no-depends: true
    dependencies:
      runtime:
        - ${{range.key}}-${{vars.major-minor}}-cuda-${{vars.cuda-version}}
        - ${{package.name}}-ldconfig
    pipeline:
      - runs: |
          _libdir=usr/local/tensorrt/targets/$(arch)-linux-gnu/lib
          _includedir=usr/local/tensorrt/include

          mkdir -p ${{targets.subpkgdir}}/$_libdir ${{targets.subpkgdir}}/$_libdir/stubs

          libname="${{range.key}}"

          # Replacing hyphens with underscores in libname
          libname_with_underscore="${libname//-/_}"
          mv ${{targets.destdir}}/$_libdir/${libname_with_underscore}.so ${{targets.subpkgdir}}/$_libdir
          mv ${{targets.destdir}}/$_libdir/stubs/${libname_with_underscore}.so ${{targets.subpkgdir}}/$_libdir/stubs/
          mv ${{targets.destdir}}/$_libdir/${libname_with_underscore}_static.a ${{targets.subpkgdir}}/$_libdir

          if [ "$libname" = "libnvonnxparser" ]; then
            mkdir -p ${{targets.subpkgdir}}/$_includedir
            mv ${{targets.destdir}}/$_libdir/libonnx_proto.a ${{targets.subpkgdir}}/$_libdir
            mv include/NvOnnx*.h ${{targets.subpkgdir}}/$_includedir
          fi

          if [ "$libname" = "libnvinfer-plugin" ]; then
            mkdir -p ${{targets.subpkgdir}}/$_includedir
            mv include/NvInferPlugin*.h ${{targets.subpkgdir}}/$_includedir
          fi

          if [ "$libname" = "libnvinfer" ]; then
            mkdir -p ${{targets.subpkgdir}}/$_includedir
            mv $(ls include/NvInfer*.h | grep -v include/NvInferPlugin) ${{targets.subpkgdir}}/$_includedir
          fi
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-dev
    description: tensorrt dev metapackage
    options:
      no-depends: true
    dependencies:
      runtime:
        - libnvinfer-dispatch-${{vars.major-minor}}-cuda-${{vars.cuda-version}}-dev=${{package.full-version}}
        - libnvinfer-lean-${{vars.major-minor}}-cuda-${{vars.cuda-version}}-dev=${{package.full-version}}
        - libnvinfer-plugin-${{vars.major-minor}}-cuda-${{vars.cuda-version}}-dev=${{package.full-version}}
        - libnvinfer-vc-plugin-${{vars.major-minor}}-cuda-${{vars.cuda-version}}-dev=${{package.full-version}}
        - libnvonnxparser-${{vars.major-minor}}-cuda-${{vars.cuda-version}}-dev=${{package.full-version}}
        - libnvinfer-${{vars.major-minor}}-cuda-${{vars.cuda-version}}-dev=${{package.full-version}}
    test:
      pipeline:
        - uses: test/metapackage

  - name: ${{package.name}}-ldconfig
    description: Runtime linker configuration for TensorRT libraries for NVIDIA GPUs
    pipeline:
      - runs: |
          _libdir="/usr/local/tensorrt/targets/$(arch)-linux-gnu/lib"
          mkdir -p "${{targets.contextdir}}"/etc/ld.so.conf.d
          echo "$_libdir" > "${{targets.contextdir}}"/etc/ld.so.conf.d/${{context.name}}.conf

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
