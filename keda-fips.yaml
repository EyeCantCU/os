# See https://github.com/kedacore/keda/blob/main/SECURITY.md#supported-versions for upstream-supported versions
package:
  name: keda-fips
  version: 2.14.0
  epoch: 6
  description: KEDA is a Kubernetes-based Event Driven Autoscaling component. It provides event driven scale for any container running in Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - tzdata
      - so:libcrypto.so.3
      - so:libssl.so.3

environment:
  contents:
    packages:
      - go-fips
      - openssl
      - openssl-config-fipshardened
      - protobuf-dev
      - protoc

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 6681d5ecbc82293626cab693625c9cc9fb453381
      repository: https://github.com/kedacore/keda
      tag: v${{package.version}}

  - runs: |
      # Generate code and protobufs; requires go-fips and openssl
      make generate

  - uses: go/bump
    with:
      deps: github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/hashicorp/go-retryablehttp@v0.7.7

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/operator
      output: keda
      ldflags: -X github.com/kedacore/keda/v2/version.GitCommit=$(git rev-list -1 HEAD) -X github.com/kedacore/keda/v2/version.Version=${{package.version}}

subpackages:
  - name: "keda-adapter-fips"
    description: "Metrics adapter for Keda"
    dependencies:
      runtime:
        - tzdata
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          packages: ./cmd/adapter
          output: keda-adapter
          ldflags: -X github.com/kedacore/keda/v2/version.GitCommit=$(git rev-list -1 HEAD) -X github.com/kedacore/keda/v2/version.Version=${{package.version}}

  - name: "keda-admission-webhooks-fips"
    description: "Webhooks for Keda"
    dependencies:
      runtime:
        - tzdata
    pipeline:
      - uses: go/build
        with:
          go-package: go-fips
          packages: ./cmd/webhooks
          output: keda-admission-webhooks
          ldflags: -X github.com/kedacore/keda/v2/version.GitCommit=$(git rev-list -1 HEAD) -X github.com/kedacore/keda/v2/version.Version=${{package.version}}

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: kedacore/keda
    strip-prefix: v
