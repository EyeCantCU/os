package:
  name: git-lfs-fips
  version: 3.6.0
  epoch: 0
  description: "large file support for git"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - git

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/git-lfs/git-lfs
      tag: v${{package.version}}
      expected-commit: 6340befc60876f4f039f215479d9d5a945f817e1

  - uses: go/build
    with:
      ldflags: -X github.com/git-lfs/git-lfs/v3/config.GitCommit=$(git rev-parse --short HEAD)
      packages: .
      output: git-lfs
      go-package: go-fips

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        git-lfs --version
        git-lfs --help

update:
  enabled: true
  github:
    identifier: git-lfs/git-lfs
    tag-filter: v
    strip-prefix: v
