package:
  name: opentelemetry-proto
  version: 1.8.0
  epoch: 0
  description: OpenTelemetry protocol definitions and language bindings
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-proto
      tag: v${{package.version}}
      expected-commit: c0a98a1847d3124ac5f9ecd02d0e2d2732bbb590

  - runs: |
      # Install proto files to standard location
      mkdir -p "${{targets.contextdir}}"/usr/share/opentelemetry-proto
      cp -r opentelemetry "${{targets.contextdir}}"/usr/share/opentelemetry-proto/

  - uses: strip

test:
  pipeline:
    - runs: |
        # Verify proto files are installed
        stat /usr/share/opentelemetry-proto/opentelemetry/proto/common/v1/common.proto
        stat /usr/share/opentelemetry-proto/opentelemetry/proto/resource/v1/resource.proto
        stat /usr/share/opentelemetry-proto/opentelemetry/proto/trace/v1/trace.proto
        stat /usr/share/opentelemetry-proto/opentelemetry/proto/collector/trace/v1/trace_service.proto

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-proto
    use-tag: true
    strip-prefix: v
