package:
  name: istio-operator-fips-1.19
  version: 1.19.10
  epoch: 1
  description: Istio operator provides user friendly options to operate the Istio service mesh
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - istio-operator-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/istio/istio
      tag: ${{package.version}}
      expected-commit: 745cdaa0dfdbeb31393fed75028a8c629c0f3a36

  - uses: patch
    with:
      patches: bump.patch

  - uses: go/bump
    with:
      deps: github.com/lestrrat-go/jwx@v1.2.29 github.com/go-jose/go-jose/v3@v3.0.3 google.golang.org/protobuf@v1.33.0 github.com/docker/docker@v24.0.9
      replaces: go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp=go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracehttp@v1.19.0 helm.sh/helm/v3=helm.sh/helm/v3@v3.14.2
      go-version: 1.21

  - uses: go/build
    with:
      packages: ./operator/cmd/operator
      output: operator
      go-package: go-fips

  - runs: |
      mkdir -p ${{targets.destdir}}/var/lib/istio
      mv manifests ${{targets.destdir}}/var/lib/istio/manifests

update:
  enabled: true
  github:
    identifier: istio/istio
    tag-filter: 1.19.
    use-tag: true
