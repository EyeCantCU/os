package:
  name: qemu
  version: 9.0.2
  epoch: 0
  description: "fast processor emulator"
  copyright:
    - license: GPL-2.0

environment:
  contents:
    packages:
      - bash
      - bison
      - build-base
      - flex
      - git
      - glib
      - glib-dev
      - glib-static
      - ninja-build
      - ncurses
      - ncurses-dev
      - perl
      - python3
      - py3-packaging
      - py3-pip
      - py3-sphinx
      - samurai
      - wolfi-base
      - zlib-dev
      - zlib-static

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/qemu/qemu
      expected-commit: 5ebde3b5c00e15f560f73055fac4ab31c0cac6d2
      tag: v${{package.version}}

  - runs: |
      mkdir build
      cd build
      ../configure --enable-system --target-list=x86_64-softmmu,aarch64-softmmu --prefix=${{targets.destdir}}/usr
      make -j$(nproc)
      make install
      # Remove this firmware file, which we don't need, but requires so:dld.sl, which we don't have
      rm -f ${{targets.destdir}}/usr/share/qemu/hppa-firmware64.img
      # Can't use strip pipeline; there are some binaries that melange can't strip,
      # causes a failed build, so here we do a lazy strip
      find ${{targets.destdir}}/usr -type f -exec strip {} \; || true

test:
  pipeline:
    - runs: |
        for i in /usr/bin/qemu-system-*; do
          $i --help 2>/dev/null && echo "$i --> OKAY" || echo "$i --> FAIL"
          $i --version 2>/dev/null && echo "$i --> OKAY" || echo "$i --> FAIL"
        done

update:
  enabled: true
  github:
    identifier: qemu/qemu
    use-tag: true
    strip-prefix: v
    tag-filter: v
