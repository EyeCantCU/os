package:
  name: peerdb-flow
  version: 0.30.9
  epoch: 0
  description: "PeerDB flow components for data synchronization"
  copyright:
    - license: Elastic-2.0

environment:
  contents:
    packages:
      - buf
      - build-base
      - busybox
      - ca-certificates-bundle
      - geos-dev
      - go
      - protoc-gen-go
      - protoc-gen-go-grpc
      - wget
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/PeerDB-io/peerdb
      tag: v${{package.version}}
      expected-commit: 3e548f58194eef05aea11250b2cb93c3a34d9af8

  - runs: |
      # generate protos using buf (from package)
      buf generate protos

  - uses: go/build
    with:
      modroot: flow
      packages: .
      output: peer-flow

  - runs: |
      # download AWS RDS CA bundle - required for SSL connections to AWS RDS
      mkdir -p ${{targets.destdir}}/usr/local/share/ca-certificates
      wget -O ${{targets.destdir}}/usr/local/share/ca-certificates/global-aws-rds-bundle.pem \
        https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem

      # verify checksum to ensure contents haven't changed
      echo "5fa49cac7e6e9202ef85331c6f83377a71339d692d5644c9417a2d81406f0c03  ${{targets.destdir}}/usr/local/share/ca-certificates/global-aws-rds-bundle.pem" | sha256sum -c -

  - uses: strip

subpackages:
  - name: peerdb-flow-compat
    description: "Compatibility package for peerdb-flow"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -s /usr/bin/peer-flow ${{targets.subpkgdir}}/usr/local/bin/peer-flow

update:
  enabled: true
  github:
    identifier: PeerDB-io/peerdb
    strip-prefix: v

test:
  pipeline:
    - name: Verify peer-flow binary exists and is executable
      runs: |
        if [ ! -f /usr/bin/peer-flow ]; then
          echo "ERROR: peer-flow binary not found at /usr/bin/peer-flow"
          exit 1
        fi
        if [ ! -x /usr/bin/peer-flow ]; then
          echo "ERROR: peer-flow binary is not executable"
          exit 1
        fi
        echo "SUCCESS: peer-flow binary exists and is executable"
    - name: Verify api subcommand
      runs: |
        # Run api command expecting it to fail due to missing config
        set +e -o pipefail
        output=$(peer-flow api 2>&1)
        if [ $? -ne 2 ]; then
          echo "ERROR: api command exited with unexpected code $?: $output"
          exit 1
        fi
        echo "SUCCESS: api command failed as expected with exit code 2"
    - name: Verify worker subcommand
      runs: |
        # Run worker command expecting it to fail due to missing config
        set +e -o pipefail
        output=$(peer-flow worker 2>&1)
        if [ $? -ne 2 ]; then
          echo "ERROR: worker command exited with unexpected code $?: $output"
          exit 1
        fi
        echo "SUCCESS: worker command failed as expected with exit code 2"
    - name: Verify snapshot-worker subcommand
      runs: |
        # Run snapshot-worker command expecting it to fail due to missing config
        set +e -o pipefail
        output=$(peer-flow snapshot-worker 2>&1)
        if [ $? -ne 2 ]; then
          echo "ERROR: snapshot-worker command exited with unexpected code $?: $output"
          exit 1
        fi
        echo "SUCCESS: snapshot-worker command failed as expected with exit code 2"
    - name: Verify maintenance subcommand
      runs: |
        # Run maintenance command expecting it to fail due to missing config
        set +e -o pipefail
        output=$(peer-flow maintenance 2>&1)
        if [ $? -ne 2 ]; then
          echo "ERROR: maintenance command exited with unexpected code $?: $output"
          exit 1
        fi
        echo "SUCCESS: maintenance command failed as expected with exit code 2"
