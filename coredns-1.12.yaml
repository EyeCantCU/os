package:
  name: coredns-1.12
  version: "1.12.4"
  epoch: 9 # GHSA-cfpf-hrx2-8rv6
  description: CoreDNS is a DNS server that chains plugins
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - coredns=${{package.full-version}}

environment:
  contents:
    packages:
      - libcap-utils
      - make
  accounts:
    # Need to run with privilege to be able to do setcap
    run-as: root

pipeline:
  - uses: git-checkout
    with:
      expected-commit: f32329577fd5e3fe19908f8a9ba5c76aafb45bf6
      repository: https://github.com/coredns/coredns
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
        github.com/quic-go/quic-go@v0.57.0
        github.com/expr-lang/expr@v1.17.7

  - runs: |
      # Generate code and fetch plugins
      GOLANG_VERSION=$(go version | awk '{print $3}' | sed 's/^go//') make gen

  - uses: go/build
    with:
      ldflags: -X github.com/coredns/coredns/coremain.GitCommit=v${{package.version}}
      output: coredns
      packages: .

  - runs: setcap cap_net_bind_service=+ep "${{targets.contextdir}}/usr/bin/coredns"

subpackages:
  - name: ${{package.name}}-compat
    dependencies:
      provides:
        - coredns-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -s /usr/bin/coredns ${{targets.subpkgdir}}/coredns
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            set -euo pipefail
            readlink -f /coredns | grep -F /usr/bin/coredns
            /coredns --version
            /coredns --help

  - name: kuma-coredns-1.12
    description: CoreDNS with plugins used by Kuma
    dependencies:
      provides:
        - kuma-coredns=${{package.full-version}}
    pipeline:
      - runs: |
          # We need to explicitly set the GOLANG_VERSION since it's used by
          # the make file below and if there are mismatches, things go bad.
          # For more details: https://github.com/wolfi-dev/os/pull/36612#issuecomment-2547453359
          export GOLANG_VERSION=`go version | sed -n 's/.*go\([0-9.]*\).*/\1/p'`

          # Build with plugins used by Kuma
          # Plugin list: https://github.com/kumahq/coredns-builds/blob/main/plugin.cfg
          mv kuma-plugin.cfg plugin.cfg
          # Generate code and fetch plugins
          make gen
      - uses: go/build
        with:
          ldflags: -X github.com/coredns/coredns/coremain.GitCommit=v${{package.version}}
          output: coredns
          packages: .
    test:
      environment:
        contents:
          packages:
            - bind-tools
            - libcap-utils
      pipeline:
        - name: Verify version and plugins
          runs: |
            coredns -version
            coredns -plugins
        - name: Verify Kuma-specific plugins are available
          runs: |
            # Kuma requires specific plugins like forward, cache, reload, etc.
            # Verify key plugins are compiled in
            plugins=$(coredns -plugins)
            echo "$plugins" | grep -F "forward" || { echo "FAIL: forward plugin not found"; exit 1; }
            echo "$plugins" | grep -F "log" || { echo "FAIL: log plugin not found"; exit 1; }
            echo "SUCCESS: Kuma-required plugins are present"
        - name: Test DNS server functionality
          runs: |
            set -euo pipefail

            # Create Corefile using template plugin (available in Kuma build)
            tee Corefile <<'EOF'
            .:2053 {
                template IN A kuma.test {
                    answer "{{ .Name }} 60 IN A 10.0.0.1"
                }
                template IN TXT kuma.test {
                    answer "{{ .Name }} 60 IN TXT \"kuma-dns-test\""
                }
                log
                errors
            }
            EOF

            # Start CoreDNS in background
            coredns > /tmp/coredns.log 2>&1 &
            COREDNS_PID=$!
            sleep 2

            # Verify process is running
            if [ ! -d "/proc/$COREDNS_PID" ]; then
              echo "FAIL: CoreDNS failed to start"
              cat /tmp/coredns.log
              exit 1
            fi

            # Test DNS query for TXT record
            result=$(dig @localhost -p 2053 foo.kuma.test TXT +short)
            echo "Query result: $result"
            echo "$result" | grep -F '"kuma-dns-test"' || {
              echo "FAIL: Expected TXT record not found"
              cat /tmp/coredns.log
              kill $COREDNS_PID 2>/dev/null || true
              exit 1
            }

            # Test DNS query for A record
            result=$(dig @localhost -p 2053 service.kuma.test A +short)
            echo "A record result: $result"
            echo "$result" | grep -F "10.0.0.1" || {
              echo "FAIL: Expected A record not found"
              cat /tmp/coredns.log
              kill $COREDNS_PID 2>/dev/null || true
              exit 1
            }

            # Clean up
            kill $COREDNS_PID 2>/dev/null || true
            echo "SUCCESS: DNS server functional test passed"

update:
  enabled: true
  github:
    identifier: coredns/coredns
    strip-prefix: v
    tag-filter: v1.12.
    use-tag: true

# only passes with docker runner: `MELANGE_EXTRA_OPTS="--runner docker"
test:
  environment:
    contents:
      packages:
        - bind-tools
        - libcap-utils
  pipeline:
    - runs: |
        coredns -version
        coredns -plugins
        coredns --version
        coredns --help
    - runs: |
        set -euo pipefail

        tee Corefile <<EOF
        .:1053 {
            file /home/build/db.wolfi.dev
            log
            errors
            cache
        }
        EOF

        tee /home/build/db.wolfi.dev <<'EOF'
        $TTL 3600
        @    IN SOA ns1.wolfi.dev. admin.wolfi.dev. (
                  20240101   ; Serial
                  7200       ; Refresh
                  3600       ; Retry
                  1209600    ; Expire
                  3600 )     ; Negative Cache TTL
        ;
        @    IN NS  ns1.wolfi.dev.
        ;
        foo.wolfi.dev  IN TXT "hi"
        EOF

        coredns > /tmp/coredns.log 2>&1 &
        sleep 2

        # validates intree plugins can be successfully loaded
        dig @localhost -p 1053 foo.wolfi.dev TXT +short | grep -F '"hi"'
    - name: Test file capabilities
      runs: |
        set -euo pipefail
        getcap /usr/bin/coredns | cut -d ' ' -f2 | grep -E '^cap_net_bind_service=ep$'
