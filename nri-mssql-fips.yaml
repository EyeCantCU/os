package:
  name: nri-mssql-fips
  version: "2.25.0"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: New Relic Infrastructure mssql Integration (FIPS)
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/newrelic/nri-mssql
      expected-commit: b0e0b6f176c2907a9b184fc8b5968fadffdc33fe
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      modroot: .
      packages: ./src/
      output: nri-mssql
      go-package: go-fips-md5
      ldflags: |
        -X main.integrationVersion=${{package.version}}
        -X main.gitCommit=$(git rev-parse HEAD)
        -X main.buildDate=$(date -u -d "@$SOURCE_DATE_EPOCH" "+%Y-%m-%dT%H:%M:%SZ")

subpackages:
  - name: ${{package.name}}-compat
    description: "Compatibility package to place binaries in the location expected by newrelic-infrastructure-bundle"
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin
          ln -sf /usr/bin/nri-mssql ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/bin/nri-mssql
          install -Dm644 legacy/mssql-definition.yml ${{targets.contextdir}}/var/db/newrelic-infra/newrelic-integrations/mssql-definition.yml
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: "true"

update:
  enabled: true
  github:
    identifier: newrelic/nri-mssql
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: nri-mssql
    - uses: test/tw/ver-check
      with:
        bins: nri-mssql
        version-flag: "-show_version"
    - name: Test binary execution
      uses: test/daemon-check-output
      with:
        start: |
          nri-mssql
        expected_output: |
          connect: connection refused
        error_strings: |
          "FAIL"
          "Traceback.*most.recent.call"
