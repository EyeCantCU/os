package:
  name: chart-iamguarded-node-exporter
  version: "4.5.11"
  epoch: 0
  description: Node exporter iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: node-exporter/${{package.version}}
      expected-commit: 28181193f440e0bf2debbd7cc3e6ebd4972b4479

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/node-exporter

  - uses: charts/package
    with:
      chart-path: iamguarded/node-exporter

update:
  enabled: false
  manual: true
  schedule:
    period: daily
    reason: Update automation doesn't yet support automating from private repos.
  git:

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /node-exporter
