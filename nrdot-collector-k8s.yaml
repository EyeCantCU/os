package:
  name: nrdot-collector-k8s
  version: "1.5.0"
  epoch: 0
  description: Custom distributions of the OpenTelemetry Collector for New Relic
  copyright:
    - license: Apache-2.0

vars:
  build_folder: _build

environment:
  contents:
    packages:
      - busybox
      - go
      - opentelemetry-collector-ocb

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 0a58b96fb6406240c3c760d30924b3d9b1ba39f6
      repository: https://github.com/newrelic/nrdot-collector-releases
      tag: ${{package.version}}

  - runs: |
      mkdir -p ${{targets.contextdir}}/${{vars.build_folder}}

      # Update the manifest to as we are using ocb 0.138.0 and upstream hasnt updated this yet, they are still using 0.135.0, this causes build failures due to dependency mismatches
      sed -i 's/0\.135\.0/0.138.0/g' ./distributions/nrdot-collector-k8s/manifest.yaml
      sed -i 's/1\.41\.0/1.44.0/g' ./distributions/nrdot-collector-k8s/manifest.yaml

      CGO_ENABLED=0 ocb --skip-compilation=true --config ./distributions/nrdot-collector-k8s/manifest.yaml > ${{targets.contextdir}}/${{vars.build_folder}}/build.log 2>&1
      mv ${{vars.build_folder}}/* ${{targets.contextdir}}/${{vars.build_folder}}

  - uses: go/build
    with:
      output: nrdot-collector-k8s
      packages: .
      modroot: ${{targets.contextdir}}/${{vars.build_folder}}

subpackages:
  - name: ${{package.name}}-compat
    description: ${{package.name}} compatibility libraries
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/nrdot-collector-k8s ${{targets.subpkgdir}}/nrdot-collector-k8s
    test:
      pipeline:
        - runs: |
            test "$(readlink /nrdot-collector-k8s)" = "/usr/bin/nrdot-collector-k8s"

test:
  environment:
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: nrdot-collector-k8s
    - name: Config validation
      runs: |
        cat << 'EOF' > /tmp/config.yaml
        receivers:
          otlp:
            protocols:
              grpc:
        exporters:
          debug:
        service:
          pipelines:
            traces:
              receivers: [otlp]
              exporters: [debug]
        EOF
        nrdot-collector-k8s --config=/tmp/config.yaml validate
    - name: "Test nrdot-collector-k8s runs as a daemon"
      uses: test/daemon-check-output
      with:
        start: nrdot-collector-k8s --config=/tmp/config.yaml
        expected_output: |
          Starting GRPC server
          Starting nrdot-collector-k8s
          Everything is ready
        timeout: 150
        post: |-
          wait-for-it -t 10 --strict localhost:8888
          curl -sf http://localhost:8888/metrics | grep "otelcol_process_uptime"
          netstat -ln | grep ':4317'

update:
  enabled: true
  github:
    identifier: newrelic/nrdot-collector-releases
    use-tag: true
