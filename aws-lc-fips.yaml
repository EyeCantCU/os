package:
  name: aws-lc-fips
  version: "2.0.17"
  epoch: 0
  description: "A general-purpose cryptographic library maintained by the AWS Cryptography team for AWS and their customers"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - samurai
      - go
      - perl
      - clang

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 634f19ab6a4808fae59f3312ca397927653ee27f
      repository: https://github.com/aws/aws-lc
      tag: AWS-LC-FIPS-${{package.version}}
      cherry-picks: |
        main/a72653248b05bd144fb899e2ade139e9f091e5cb: Update bio_info_cb to align with OpenSSL 3.x (#1222)

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_C_COMPILER=clang \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DFIPS=1 \
        -DENABLE_FIPS_ENTROPY_CPU_JITTER=OFF

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-lc-fips-dev
    pipeline:
      - uses: split/dev
    dependencies:
      provides:
        - aws-lc-dev
      provider-priority: 20
    description: aws-lc dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - posix-libc-utils
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: aws/aws-lc
    strip-prefix: AWS-LC-FIPS
    use-tag: true
    tag-filter: AWS-LC-FIPS-2
