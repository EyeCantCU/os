package:
  name: aws-lc-fips
  version: "2.0.0"
  epoch: 0
  description: "A general-purpose cryptographic library maintained by the AWS Cryptography team for AWS and their customers"
  copyright:
    - license: Apache-2.0 AND OpenSSL AND BSD-3-Clause AND ISC

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - clang-18
      - cmake
      - go
      - perl
      - samurai

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 329d23ce93d42b9017502ac24ca073ebdaa7660f
      repository: https://github.com/aws/aws-lc
      tag: AWS-LC-FIPS-${{package.version}}
      cherry-picks: |
        main/b929d749f3d09995aa04848cc6fb24f0aec87da4: Make aes_hw_ctr32_encrypt_blocks handle len=0 correctly (#1690)
        main/013240baa4550afad210b6b5735854f3365545e4: Improving instruction flow in `aes_hw_ctr32_encrypt_blocks` tail len = 0 case (#1774)

  - uses: patch
    with:
      patches: jitterentropy-compile-flags.patch

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_C_COMPILER=clang \
        -DCMAKE_CXX_COMPILER=clang++ \
        -DBUILD_TESTING=OFF \
        -DFIPS=1

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    description: "AWS-LC dev"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-tools
    description: "AWS-LC tools"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr
          mv ${{targets.destdir}}/usr/bin ${{targets.subpkgdir}}/usr
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  environment:
    contents:
      packages:
        - posix-libc-utils
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 4759
        software-version: ${{package.version}}

update:
  enabled: false
  exclude-reason: |
    Version 2.0.0 is the FIPS certified version of aws-lc; only update when a new 2.x.x release is certified.
  github:
    identifier: aws/aws-lc
    strip-prefix: AWS-LC-FIPS-
    use-tag: true
    tag-filter: AWS-LC-FIPS-2
