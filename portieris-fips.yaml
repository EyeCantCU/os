package:
  name: portieris-fips
  version: "0.13.32"
  epoch: 0 # CVE-2025-61725
  description: A Kubernetes Admission Controller for verifying image trust.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/IBM/portieris.git
      tag: v${{package.version}}
      expected-commit: 4b5c3c670749c760f05b822d0216aa02fe2c8c8f

  - uses: go/build
    with:
      packages: "./cmd/portieris"
      ldflags: "-X github.com/IBM/portieris/internal/info.Version=v${{package.version}}"
      tags: containers_image_openpgp
      output: portieris
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: IBM/portieris
    strip-prefix: v

test:
  pipeline:
    - runs: |
        portieris --help
    - uses: test/go-fips-check
