package:
  name: py3-flashinfer-python-cuda-12.9
  version: "0.3.1"
  epoch: 3
  description: Kernel Library for LLM Serving
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: flashinfer
  import: flashinfer

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - py3-supported-build-base
      - py3-supported-torch-cuda-${{vars.cuda-version}}
  environment:
    CUDA_HOME: /usr/local/cuda-${{vars.cuda-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/flashinfer-ai/flashinfer
      tag: v${{package.version}}
      expected-commit: 3c1e8d7dd5700ebbb22c76e677a72ccf24939511

  - uses: patch
    with:
      patches: 0001-Respect-CUDA_HOME-from-the-environment.patch

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-cuda-python-cuda-${{vars.cuda-version}}
        - py${{range.key}}-einops
        - py${{range.key}}-ninja
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-nvidia-cudnn-frontend-cuda-${{vars.cuda-version}}
        - py${{range.key}}-nvidia-nvshmem-cuda-${{vars.cuda-version}}
        - py${{range.key}}-pynvml
        - py${{range.key}}-requests
        - py${{range.key}}-click
        - py${{range.key}}-tabulate
        - py${{range.key}}-tqdm
        - py${{range.key}}-torch-cuda-${{vars.cuda-version}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: test/tw/ldd-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.11-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.12-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.13-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: flashinfer-ai/flashinfer
    strip-prefix: v
