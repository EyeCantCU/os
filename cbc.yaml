package:
  name: cbc
  version: "2.10.12"
  epoch: 1
  description: Cbc (Coin-or branch and cut) is an open-source mixed integer linear programming solver written in C++
  copyright:
    - license: EPL-2.0

vars:
  abi: 3

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cgl-dev
      - coinutils-dev
      - gfortran
      - osi-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/coin-or/Cbc
      tag: releases/${{package.version}}
      expected-commit: 782d275a8efa569eb818551561b424948e19653c

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      mkdir docs
      (cd "${{targets.destdir}}" && tar -c usr/share/coin/doc) > docs.save
      rm -rf ${{targets.destdir}}/usr/share/coin/doc
      # remove one by one so we fail if upstream adds other content
      rmdir ${{targets.destdir}}/usr/share/coin
      rmdir ${{targets.destdir}}/usr/share

  - runs: |
      # Currently fails due to missing test files
      # make test

  - uses: strip

subpackages:
  - name: lib${{package.name}}${{vars.abi}}
    description: lib${{package.name}} library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libCbc.so.${{vars.abi}} \
            "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libCbc.so.${{vars.abi}}.* \
            "${{targets.contextdir}}/usr/lib"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: lib${{package.name}}solver${{vars.abi}}
    description: lib${{package.name}}solver library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libCbcSolver.so.${{vars.abi}} \
            "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libCbcSolver.so.${{vars.abi}}.* \
            "${{targets.contextdir}}/usr/lib"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: libosi${{package.name}}${{vars.abi}}
    description: libosi${{package.name}} library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libOsiCbc.so.${{vars.abi}} \
            "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libOsiCbc.so.${{vars.abi}}.* \
            "${{targets.contextdir}}/usr/lib"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-dev
    description: ${{package.name}} development files
    dependencies:
      runtime:
        - lib${{package.name}}${{vars.abi}}=${{package.full-version}}
        - lib${{package.name}}solver${{vars.abi}}=${{package.full-version}}
        - libosi${{package.name}}${{vars.abi}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: ${{package.name}} docs
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"
          (cd "${{targets.contextdir}}" && tar xv) < docs.save
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - runs: |
        cbc -?

update:
  enabled: true
  github:
    identifier: coin-or/Cbc
    strip-prefix: releases/
