package:
  name: hubble-export-stdout
  version: 1.1.0
  epoch: 0
  description: Export Hubble data to stdout
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cilium/hubble-export-stdout
      expected-commit: 5417edc2d261d9f02c197359ab38f048d744d0db
      tag: v${{package.version}}

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/bin
      install -Dm755 hubble-export-stdout "${{targets.contextdir}}"/usr/bin/hubble-export-stdout

subpackages:
  - name: ${{package.name}}-oci-entrypoint
    dependencies:
      runtime:
        - ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -sf /usr/bin/hubble-export-stdout "${{targets.subpkgdir}}/usr/local/bin/hubble-export-stdout"
    test:
      pipeline:
        - runs: test "$(readlink /usr/local/bin/hubble-export-stdout)" = "/usr/bin/hubble-export-stdout"

test:
  pipeline:
    - runs: |
        touch log.log
        nohup hubble-export-stdout log.log >> nohup.out &
        PID=$!
        sleep 2
        echo "test12345" > log.log
        sleep 2
        kill $PID
        grep -q "test12345" nohup.out

update:
  enabled: true
  github:
    identifier: cilium/hubble-export-stdout
    use-tag: true
    strip-prefix: v
