package:
  name: openmpi-cuda-12.5
  version: 5.0.6
  epoch: 0
  description: Message passing library for high-performance computing
  copyright:
    - license: BSD-3-Clause-Open-MPI AND mpich2
  dependencies:
    replaces:
      - openmpi
    provides:
      - openmpi=${{package.version}}
    runtime:
      - hwloc-cuda-${{vars.cuda-version}}
      - openpmix
      - prrte
      - numactl

var-transforms:
  - from: ${{package.name}}
    match: .*cuda-(\d+\.\d+)
    replace: $1
    to: cuda-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - flex
      - flex-dev
      - gfortran
      - hwloc-cuda-${{vars.cuda-version}}-dev
      - libevent-dev
      - libgomp
      - libtool
      - libxml2
      - libxml2-dev
      - nvidia-cuda-cudart-${{vars.cuda-version}}
      - nvidia-cuda-cudart-${{vars.cuda-version}}-dev
      - nvidia-cuda-nvcc-${{vars.cuda-version}}
      - nvidia-cuda-nvcc-${{vars.cuda-version}}-dev
      - openpmix-dev
      - perl
      - posix-libc-utils
      - prrte-dev
      - py3-recommonmark
      - py3-sphinx-7
      - py3-sphinx-rtd-theme
      - python-3.12-dev
      - zlib-dev
  environment:
    LD_LIBRARY_PATH: "/usr/local/cuda-${{vars.cuda-version}}/lib64:/usr/local/cuda-${{vars.cuda-version}}/lib64/stubs"
    CUDA_HOME: "/usr/local/cuda-${{vars.cuda-version}}"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-mpi/ompi
      tag: v${{package.version}}
      expected-commit: 8a5c2ef25dc8e4528f0d3fd2ec91a6578160af95
      recurse-submodules: true

  - runs: |
      perl autogen.pl
      chmod +x configure
      # workaround for https://github.com/open-mpi/ompi/issues/12257
      # see https://gitlab.archlinux.org/archlinux/packaging/packages/openmpi/-/blob/main/PKGBUILD#L51-54
      sed -i 's|WRAPPER__FCFLAGS|WRAPPER_FCFLAGS|g' configure
      sed -i 's|WRAPPER_EXTRA_FCFLAGS|WRAPPER_FCFLAGS|g' configure
      sed -i 's|"-I/usr/include",||' opal/tools/wrappers/opal_wrapper.c

  - uses: autoconf/configure
    with:
      opts: |
        --with-prefix=/usr \
        --with-libevent=external \
        --with-hwloc=external \
        --with-pmix=external \
        --with-prrte=external

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
    description: openmpi dev

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: openmpi manpages

test:
  environment:
    contents:
      packages:
        - build-base
        - gfortran
        - hwloc-cuda-12.5
        - openjdk-17-default-jdk
        - openpmix-dev
        - ${{package.name}}
        - ${{package.name}}-dev
    environment:
      LD_LIBRARY_PATH: "/usr/local/cuda-${{vars.cuda-version}}/lib64:/usr/local/cuda-${{vars.cuda-version}}/lib64/stubs"
      CUDA_HOME: "/usr/local/cuda-${{vars.cuda-version}}"
  pipeline:
    - uses: git-checkout
      with:
        repository: https://github.com/open-mpi/ompi
        tag: v${{package.version}}
        expected-commit: ca64c52a8227b4b3f3ee255a644ba4686ee9e600
        recurse-submodules: true
      runs: |
        mpiCC --version
        mpiCC --help
        mpic++ --version
        mpic++ --help
        mpicc --version
        mpicc --help
        mpicxx --version
        mpicxx --help
        mpiexec --version
        mpiexec --help
        mpirun --version
        mpirun --help
        ompi_info --version
        ompi_info --help
        oshrun --version
        oshrun --help
    - runs: |
        cd examples
        mpifort --showme
        make

update:
  enabled: true
  github:
    identifier: open-mpi/ompi
    strip-prefix: v
    use-tag: true
