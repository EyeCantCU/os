package:
  name: nvidia-fabric-manager
  version: 550.54.14
  epoch: 1
  description: Intended for hardware containing NvSwitch such as DGX systems.
  copyright:
    - license: PROPRIETARY

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: https://developer.download.nvidia.com/compute/cuda/redist/fabricmanager/linux-sbsa/fabricmanager-linux-sbsa-${{package.version}}-archive.tar.xz
          expected-sha256: 0014ae3ea1d8ba4d8a0feb60b53099dce68d12acdaba5e595fce48a689ac581f
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: https://developer.download.nvidia.com/compute/cuda/redist/fabricmanager/linux-x86_64/fabricmanager-linux-x86_64-${{package.version}}-archive.tar.xz
          expected-sha256: e8637797d0aabf705583c8156131030b37d814eacf0a525d0bc8fdac4ae9db5d
          timeout: 30

  - working-directory: ${{targets.destdir}}/usr/bin
    runs: |
      mv /home/build/bin/* .

  - working-directory: ${{targets.destdir}}/usr/lib
    runs: |
      mv /home/build/lib/* .

  - working-directory: ${{targets.destdir}}/usr/include
    runs: |
      mv /home/build/include/* .

  - working-directory: ${{targets.destdir}}/usr/sbin
    runs: |
      mv /home/build/sbin/* .

  - working-directory: ${{targets.destdir}}/usr/systemd
    runs: |
      mv /home/build/systemd/* .

  - working-directory: ${{targets.destdir}}/usr/etc
    runs: |
      mv /home/build/etc/* .

  - working-directory: ${{targets.destdir}}/usr/share
    runs: |
      mv /home/build/share/* .


  - runs: |
      mkdir -p ${{targets.destdir}}/usr
      mv LICENSE ${{targets.destdir}}/usr/${{package.name}}.LICENSE
      mv third-party-notices.txt ${{targets.destdir}}/usr/${{package.name}}.third-party-notices.txt


update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
