package:
  name: gitlab-cng-ee-fips-17.1
  version: 17.1.1
  epoch: 2
  description: Cloud Native container images per component of GitLab
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - openssl-config-fipshardened
    provides:
      - gitlab-cng-ee-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox
      - py3-pip
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/gitlab-org/build/CNG.git
      tag: v${{package.version}}-ee
      expected-commit: bb8181f1ed3f00cb74b9cd4a2496e8764baf0f7a

data:
  # Used to create all of the *-scripts subpackages from the CNG repo.
  - name: scripts
    items:
      cfssl-self-sign: ./cfssl-self-sign
      container-registry: ./gitlab-container-registry
      exporter: ./gitlab-exporter
      geo-logcursor: ./gitlab-geo-logcursor
      gitaly: ./gitaly
      mailroom: ./gitlab-mailroom
      pages: ./gitlab-pages
      rails: ./gitlab-rails
      shell: ./gitlab-shell
      sidekiq: ./gitlab-sidekiq
      toolbox: ./gitlab-toolbox
      webservice: ./gitlab-webservice
      workhorse: ./gitlab-workhorse

subpackages:
  - range: scripts
    name: "${{package.name}}-${{range.key}}-scripts"
    dependencies:
      provides:
        - "gitlab-cng-ee-fips-${{range.key}}-scripts=${{package.full-version}}"
    pipeline:
      - runs: |
          cd ${{range.value}}
          for x in $(find scripts/ -type f); do
            mkdir -p ${{targets.subpkgdir}}/$(dirname $x)
            cp -r $x ${{targets.subpkgdir}}/$x
          done

  - name: "${{package.name}}-base"
    pipeline:
      - runs: |
          cd ./gitlab-base
          for x in $(find scripts/ -type f); do
            mkdir -p ${{targets.subpkgdir}}/$(dirname $x)
            cp -r $x ${{targets.subpkgdir}}/$x
          done
    dependencies:
      runtime:
        - openssl-config-fipshardened
        - bash
        - busybox
        - ca-certificates-bundle
        - curl
        - gitlab-logger-fips
        - gomplate-fips
        - procps
        - xtail

  - name: "${{package.name}}-certificates"
    pipeline:
      - runs: |
          cd ./certificates
          for x in $(find scripts/ -type f); do
            mkdir -p ${{targets.subpkgdir}}/$(dirname $x)
            cp -r $x ${{targets.subpkgdir}}/$x
          done
          ./scripts/bundle-certificates
    dependencies:
      runtime:
        - ca-certificates
        - gitlab-cng-base
    test:
      pipeline:
        - name: Test bundle-certificates script
          runs: |
            # if bundle-certificates runs correctly, it dereferences symlinks outside of /etc/ssl/certs
            for f in /etc/ssl/certs/*.pem /etc/ssl/certs/*.crt; do
              if [ -L "$f" ]; then
                origin=$(readlink -f "$f")
                originPath=${origin%/*}
                if [ "$originPath" != "/etc/ssl/certs" ]; then
                  echo "Error: $f is a symlink pointing outside of /etc/ssl/certs to $origin"
                  exit 1
                fi
              fi
            done

  - name: "${{package.name}}-gitlab-toolbox"
    dependencies:
      runtime:
        - openssl-config-fipshardened
        - py3-wheel
        - azcopy-fips
        - s3cmd-fips
        - aws-cli-fips-v1
    pipeline:
      - name: Install gsutil
        runs: |
          python -m venv .venv --system-site-packages
          source .venv/bin/activate
          pip install gsutil

          mkdir -p ${{targets.subpkgdir}}/usr/share/gsutil
          mv .venv ${{targets.subpkgdir}}/usr/share/gsutil/

          # edit the venv paths
          sed -i "s|/home/build|/usr/share/gsutil|g" ${{targets.subpkgdir}}/usr/share/gsutil/.venv/bin/*
      - name: Symlink gsutil
        runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          ln -s /usr/share/gsutil/.venv/bin/gsutil ${{targets.subpkgdir}}/usr/bin/gsutil
      - name: Move provided scripts
        runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/ruby/vendor_ruby
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          cp -rf gitlab-toolbox/scripts/lib/* ${{targets.subpkgdir}}/usr/lib/ruby/vendor_ruby/
          cp -rf gitlab-toolbox/scripts/bin/* ${{targets.subpkgdir}}/usr/bin/
    test:
      pipeline:
        - name: Verify tools from gitlab-toolbox
          runs: |
            aws --version
            s3cmd --version
            azcopy --version
            gsutil --version

update:
  enabled: true
  github:
    identifier: gitlabhq/gitlabhq
    strip-prefix: v
    use-tag: true
    tag-filter: v17.1
    strip-suffix: -ee
