package:
  name: py${{vars.py-version}}-transformers
  version: "4.51.1"
  epoch: 0
  description: State-of-the-art Natural Language Processing for TensorFlow 2.0 and PyTorch
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - py${{vars.py-version}}-huggingface-hub
      - py${{vars.py-version}}-numpy
      - py${{vars.py-version}}-regex
      - py${{vars.py-version}}-safetensors

vars:
  py-version: 3.10

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py${{vars.py-version}}-build
      - py${{vars.py-version}}-installer
      - py${{vars.py-version}}-pip
      - py${{vars.py-version}}-wheel
      - python-${{vars.py-version}}

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/t/transformers/transformers-${{package.version}}.tar.gz
      expected-sha512: f7a7afd6fcb2a7b18ec540bc92aebb4404a8a201e98e7754d20b5b3d0825ec0c9c773e1345aa647a5a2358faa5749cf7c71a69b578f61d682e4ac7dadff78d96

  - uses: py/pip-build-install
    with:
      python: python${{vars.py-version}}
      dest: ${{targets.contextdir}}

  - uses: strip

test:
  environment:
    contents:
      packages:
        - curl
        - python-${{vars.py-version}}
        - py${{vars.py-version}}-pip
        - py${{vars.py-version}}-tokenizers
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.py-version}}
        import: transformers
    - name: verify installation
      runs: |
        pip install torch
        pip install parameterized
        curl -O https://raw.githubusercontent.com/huggingface/transformers/refs/heads/main/tests/test_tokenization_common.py
        python3 test_tokenization_common.py

update:
  enabled: true
  release-monitor:
    identifier: 26649
