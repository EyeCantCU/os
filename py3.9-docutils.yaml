package:
  name: py3.9-docutils
  version: "0.22"
  epoch: 0
  description: Documentation Utilities for Python ${{vars.python-version}}
  copyright:
    - license: BSD-2-Clause AND GPL-3.0-or-later AND Python-2.0

vars:
  python-version: '3.9'
  pypi-package: docutils
  import: docutils

environment:
  contents:
    packages:
      - busybox
      - py${{vars.python-version}}-flit-core
      - py${{vars.python-version}}-pip

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/d/docutils/docutils-${{package.version}}.tar.gz
      expected-sha256: ba9d57750e92331ebe7c08a1bbf7a7f8143b86c476acd51528b042216a6aad0f

  - uses: py/pip-build-install
    with:
      python: python${{vars.python-version}}

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import ${{vars.import}}
    - runs: |
        docutils --version
        docutils --help
        rst2html --version
        rst2html --help
        rst2html4 --version
        rst2html4 --help
        rst2html5 --version
        rst2html5 --help
        rst2latex --version
        rst2latex --help
        rst2man --version
        rst2man --help
        rst2odt --version
        rst2odt --help
        rst2pseudoxml --version
        rst2pseudoxml --help
        rst2s5 --version
        rst2s5 --help
        rst2xetex --version
        rst2xetex --help
        rst2xml --version
        rst2xml --help

update:
  enabled: true
  release-monitor:
    identifier: 3849
