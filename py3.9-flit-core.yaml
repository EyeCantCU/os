package:
  name: py3.9-flit-core
  version: 3.10.0
  epoch: 0
  description: "simple packaging tool for simple packages (core)"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - python-3.9

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3.9-installer
      - python-3.9
      - wolfi-base

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/f/flit/flit-${{package.version}}.tar.gz
      expected-sha256: dadca58d5097db62884d25d70b572f104954927daadc8cee449739215b7237fd

  - runs: |
      cd flit_core
      python3.9 build_dists.py

  - runs: |
      cd flit_core
      python3.9 -m installer -d "${{targets.destdir}}" dist/flit_core-${{package.version}}-py3-none-any.whl

  - runs: |
      rm -rf "${{targets.destdir}}"/usr/lib/python3*/site-packages/flit_core/tests

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 44841
