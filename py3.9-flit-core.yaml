package:
  name: py3.9-flit-core
  version: "3.12.0"
  epoch: 0
  description: "simple packaging tool for simple packages (core)"
  copyright:
    - license: BSD-3-Clause
  dependencies:
    runtime:
      - python-3.9

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3.9-installer
      - python-3.9
      - wolfi-base

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/f/flit/flit-${{package.version}}.tar.gz
      expected-sha256: 1c80f34dd96992e7758b40423d2809f48f640ca285d0b7821825e50745ec3740

  - runs: |
      cd flit_core
      python3.9 build_dists.py

  - runs: |
      cd flit_core
      python3.9 -m installer -d "${{targets.destdir}}" dist/flit_core-${{package.version}}-py3-none-any.whl

  - runs: |
      rm -rf "${{targets.destdir}}"/usr/lib/python3*/site-packages/flit_core/tests

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        imports: |
          import flit_core.buildapi

update:
  enabled: true
  release-monitor:
    identifier: 44841
