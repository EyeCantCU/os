package:
  name: py3-segments
  version: 2.3.0
  epoch: 0
  description: Unicode Standard tokenization routines and orthography segmentation
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: segments

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cldf/segments.git
      tag: v${{package.version}}
      expected-commit: cd3a269d7d1526e3c04d7441a0e9a0be8484ee52

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-clldutils
        - py${{range.key}}-csvw
        - py${{range.key}}-regex
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | tee output.txt
            from segments import Profile, Tokenizer
            t = Tokenizer()
            print(t('abcd'))
            prf = Profile({'Grapheme': 'ab', 'mapping': 'x'}, {'Grapheme': 'cd', 'mapping': 'y'})
            t = Tokenizer(profile=prf)
            print(t('abcd'))
            print(t('abcd', column='mapping'))
            EOF

            get_line() {
              sed -n "${1}p" output.txt | grep -E -e "${2}"
            }
            get_line 1 "a b c d"
            get_line 2 "ab cd"
            get_line 3 "x y"

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            set -o pipefail

            segments --help | grep -F -e "Main command line interface of the segments package."

            TEXT="aäaaöaaüaa"
            echo "${TEXT}" | segments tokenize | grep -F -e "a ä a a ö a a ü a a"
            echo "${TEXT}" | segments profile | sed "2s/a/aa/" | tee double-a.prf
            echo "${TEXT}" | segments --profile=double-a.prf tokenize | grep -F -e "� ä aa ö aa ü aa"

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
