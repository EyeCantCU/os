package:
  name: py3-segments
  version: 2.3.0
  epoch: 0
  description: Unicode Standard tokenization routines and orthography segmentation
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: segments

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cldf/segments.git
      tag: v${{package.version}}
      expected-commit: cd3a269d7d1526e3c04d7441a0e9a0be8484ee52

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-clldutils
        - py${{range.key}}-csvw
        - py${{range.key}}-regex
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
