package:
  name: py3.9-pyyaml
  version: 6.0.1
  epoch: 0
  description: "Python3 bindings for YAML"
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.9

vars:
  pypi-package: pyyaml

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3.9-cython
      - py3.9-installer
      - py3.9-pip
      - py3.9-setuptools
      - py3.9-wheel
      - python-3.9-dev
      - yaml-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/yaml/pyyaml
      tag: ${{package.version}}
      expected-commit: c42fa3bff1eabdb64763bb1526d9ea1ccb708479

  # from: https://github.com/yaml/pyyaml/issues/601#issuecomment-1740811121
  - uses: patch
    with:
      patches: pyyaml-cython3.patch

  - uses: py/pip-build-install
    with:
      python: python3.9
      dest: ${{targets.contextdir}}

update:
  enabled: true
  ignore-regex-patterns:
    - dec-*
  github:
    identifier: yaml/pyyaml
    use-tag: true
