package:
  name: prometheus-elasticsearch-exporter
  version: "1.9.0"
  epoch: 44
  description: Elasticsearch stats exporter for Prometheus
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - go

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus-community/elasticsearch_exporter
      tag: v${{package.version}}
      expected-commit: 4301b8d65587ace76803247a7329b5aaba27a574

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0

  - runs: |
      make common-build

  - runs: |
      install -Dm755 elasticsearch_exporter "${{targets.destdir}}"/usr/bin/elasticsearch_exporter

  - uses: strip

subpackages:
  - name: prometheus-elasticsearch-exporter-bitnami-compat
    description: "compat package with bitnami/elasticsearch-exporter image"
    pipeline:
      - uses: bitnami/compat
        with:
          image: elasticsearch-exporter
          version-path: 1/debian-12
      - runs: |
          mkdir -p ${{targets.contextdir}}/opt/bitnami/elasticsearch-exporter/bin
          ln -s /usr/bin/elasticsearch_exporter ${{targets.contextdir}}/opt/bitnami/elasticsearch-exporter/bin/elasticsearch_exporter
    test:
      pipeline:
        - runs: |
            run-script --version
            run-script --help
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

  - name: prometheus-elasticsearch-exporter-iamguarded-compat
    description: "compat package for iamguarded"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: ${{package.name}}
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /opt/iamguarded/elasticsearch-exporter/bin
          ln -s /usr/bin/elasticsearch_exporter /opt/iamguarded/elasticsearch-exporter/bin/elasticsearch_exporter
      - uses: iamguarded/finalize-compat
        with:
          package: ${{package.name}}
          version: ${{vars.major-version}}
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: ${{package.name}}
            version: ${{vars.major-version}}
        - runs: |
            run-script --version
            run-script --help
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

update:
  enabled: true
  github:
    identifier: prometheus-community/elasticsearch_exporter
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        elasticsearch_exporter --version
        elasticsearch_exporter --help
