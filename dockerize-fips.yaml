package:
  name: dockerize-fips
  version: 0.7.0
  epoch: 10
  description: Utility to simplify running applications in docker containers
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jwilder/dockerize
      tag: v${{package.version}}
      expected-commit: c489c4f42d15df111d02d80fce5816bb024278f4

  - uses: go/bump
    with:
      deps: golang.org/x/crypto@v0.17.0 golang.org/x/net@v0.23.0

  - uses: go/build
    with:
      packages: .
      output: dockerize
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: jwilder/dockerize
    strip-prefix: v
    use-tag: true
    tag-filter: v
