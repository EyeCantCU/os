package:
  name: dockerize-fips
  version: "0.9.3"
  epoch: 4
  description: Utility to simplify running applications in docker containers
  copyright:
    - license: MIT

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/jwilder/dockerize
      tag: v${{package.version}}
      expected-commit: 37a64d3f61317a90a342873411b1fae54086098c

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      packages: .
      output: dockerize
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: jwilder/dockerize
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    - runs: |
        dockerize --version
        dockerize --help
