package:
  name: irqbalance
  version: "1.9.5"
  epoch: 0
  description: Distribute hardware interrupts across processors on a multiprocessor system
  copyright:
    - license: GPL-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gcc-14-default
      - glib-dev
      - libtool
      - pkgconf-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Irqbalance/irqbalance
      tag: v${{package.version}}
      expected-commit: cf763968dc221be2ce36e1dce45b6f9d998b40c6

  - uses: autoconf/configure
    with:
      opts: --sbindir=/usr/bin

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: install -Dm0644 misc/irqbalance.service -t ${{targets.destdir}}/usr/lib/systemd/system/

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: "${{package.name}} headers"
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/emptypackage

  - name: ${{package.name}}-doc
    description: "${{package.name}} manpages"
    dependencies:
      runtime:
        - man-db
    pipeline:
      - uses: split/alldocs
    test:
      pipeline:
        - uses: test/tw/docs

update:
  enabled: true
  github:
    identifier: Irqbalance/irqbalance
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - systemd
        - ${{package.name}}-doc
  pipeline:
    - runs: |
        irqbalance # --version exits 1 but no args exits 0
        systemd-analyze verify /usr/lib/systemd/system/irqbalance.service
    - uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
