package:
  name: irqbalance
  version: 1.9.4
  epoch: 42
  description: Distribute hardware interrupts across processors on a multiprocessor system
  copyright:
    - license: GPL-2.0
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gcc-14-default
      - glib-dev
      - libtool
      - pkgconf-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Irqbalance/irqbalance
      tag: v${{package.version}}
      expected-commit: f8b8cddfb54516308cd484c883d930f97c9e12ed

  - uses: autoconf/configure
    with:
      opts: --sbindir=/usr/bin

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: install -Dm0644 misc/irqbalance.service -t ${{targets.destdir}}/usr/lib/systemd/system/

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: "${{package.name}} headers"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

  - name: ${{package.name}}-doc
    description: "${{package.name}} manpages"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

update:
  enabled: true
  github:
    identifier: Irqbalance/irqbalance
    strip-prefix: v
    use-tag: true

test:
  environment:
    contents:
      packages:
        - systemd
        - ${{package.name}}-doc
  pipeline:
    - runs: |
        irqbalance # --version exits 1 but no args exits 0
        systemd-analyze verify /usr/lib/systemd/system/irqbalance.service
    - uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
