package:
  name: nvidia-cuda-nvml-dev
  version: 12.3.101
  epoch: 0
  description: CUDA NVML Headers
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
environment:
  contents:
    packages:
      - busybox
pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvml_dev/linux-sbsa/cuda_nvml_dev-linux-sbsa-12.3.101-archive.tar.xz"
          expected-sha256: "e14f15f6eb8dc25d37872d713bfb40530b67b68e7b8441078310f40a3aec121f"
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_nvml_dev/linux-x86_64/cuda_nvml_dev-linux-x86_64-12.3.101-archive.tar.xz"
          expected-sha256: "34ab12792d46a839012236608ec446a13f6e7775556f9122a7c33bc742b3b29d"
  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.3/
      mv include ${{targets.destdir}}/usr/local/cuda-12.3/
      mv lib ${{targets.destdir}}/usr/local/cuda-12.3/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.3/${{package.name}}.LICENSE
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/pkgconfig/
      mv pkg-config/* ${{targets.destdir}}/usr/share/pkgconfig/
      sed -i 's|targets/.*-linux/||g' ${{targets.destdir}}/usr/share/pkgconfig/*
update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
