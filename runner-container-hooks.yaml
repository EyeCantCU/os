package:
  name: runner-container-hooks
  version: "0.8.0"
  epoch: 0
  description: GitHub Actions runner container hooks
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - runner-container-hooks-docker
      - runner-container-hooks-k8s
      - runner-container-hooks-lib

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - nodejs
      - npm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/actions/runner-container-hooks
      tag: v${{package.version}}
      expected-commit: c03a5fb3c1896123e335cef31dc533ef376191d1

update:
  enabled: true
  github:
    identifier: actions/runner-container-hooks
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - runs: |
        test -d /usr/share/actions-runner-container-hooks/k8s
        test -d /usr/share/actions-runner-container-hooks/docker
        test -d /usr/share/actions-runner-container-hooks/hooklib
