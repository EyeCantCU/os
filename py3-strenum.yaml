package:
  name: py3-strenum
  version: "0.4.15"
  epoch: 0
  description: StrEnum is a Python enum.Enum that inherits from str to complement enum.IntEnum in the standard library
  copyright:
    - license: MIT

vars:
  pypi-package: strenum
  import: strenum

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-versioneer

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/irgeek/StrEnum
      tag: v${{package.version}}
      expected-commit: ab34b770aacac80431cd77f28770a60144679d38

  - runs: |
      # https://github.com/irgeek/StrEnum/issues/38
      # Make sure it is still an issue:
      grep '^    parser = configparser\.SafeConfigParser()' versioneer.py
      # Since it is, move the vendored copy aside
      mv versioneer.py versioneer.py.broken

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: irgeek/StrEnum
    strip-prefix: v
  ignore-regex-patterns:
    - .*-debian-.* # Ignore variant tags like v1.16.6-debian-kafka-1.1
