# Please note the last release of this package was 11 months ago, and seems to be complete and has no CVEs
# this package is needed as runtime dep for celery and kombu
package:
  name: py3-amqp
  version: "5.3.1"
  epoch: 0
  description: Low-level AMQP client for Python
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: amqp
  import: amqp

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-python-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/celery/py-amqp
      tag: v${{package.version}}
      expected-commit: b1f9c2e3d10c35601c9453a074bf8ae8dee9dd5b

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-vine
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import amqp

            # Test basic imports and classes
            assert hasattr(amqp, 'Connection'), "Connection class not found"
            assert hasattr(amqp, 'Message'), "Message class not found"
            assert hasattr(amqp, 'AMQPError'), "AMQPError class not found"

            # Test Connection class methods
            assert hasattr(amqp.Connection, 'channel'), "channel method not found"
            assert hasattr(amqp.Connection, 'drain_events'), "drain_events method not found"

            # Test Message class
            msg = amqp.Message(b'test message')
            assert msg.body == b'test message', "Message body not set correctly"
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: celery/py-amqp
    strip-prefix: v
