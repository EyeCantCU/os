# Generated from https://pypi.org/project/msal-extensions/
package:
  name: py3-msal-extensions
  version: 1.2.0
  epoch: 0
  description: Microsoft Authentication Library extensions (MSAL EX) provides a persistence API that can save your data on disk, encrypted on Windows, macOS and Linux. Concurrent data access will be coordinated by a file lock mechanism.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py3-msal
      - py3-pathlib2
      - py3-portalocker
      - python-3

environment:
  contents:
    packages:
      - ca-certificates-bundle
      - wolfi-base
      - busybox
      - build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/AzureAD/microsoft-authentication-extensions-for-python
      tag: ${{package.version}}
      expected-commit: 6fd4920f20ab36263a55ad228c432265f8d2f2eb

  - name: Python Build
    uses: python/build-wheel

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - '.*b1$'
  github:
    identifier: AzureAD/microsoft-authentication-extensions-for-python
