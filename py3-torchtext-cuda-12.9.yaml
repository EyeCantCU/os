package:
  name: py3-torchtext-cuda-12.9
  version: 0.18.0
  epoch: 0
  description: A PyTorch repo for text loading and utilities to be shared by the PyTorch domain libraries
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: torchtext

environment:
  contents:
    packages:
      - ccache
      - cmake-3
      - libtorch-cuda-${{vars.cuda-version}}-dev
      - ninja
      - py3-supported-build-base-dev
      - py3-supported-torch-cuda-${{vars.cuda-version}}-dev

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: "$1"
    to: cuda-version

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pytorch/text.git
      tag: v${{package.version}}
      expected-commit: 9bed85d7a7ae13cf8c28598a88d8e461fe1afcb4
      recurse-submodules: true

  - runs: ccache -F 0 -M 0

subpackages:
  - name: libtorchtext-cuda-${{vars.cuda-version}}
    description: C++ torchtext library
    dependencies:
      runtime:
        - libtorch-cuda-${{vars.cuda-version}}-dev
    pipeline:
      - uses: cmake/configure
        environment:
          CC: ccache gcc -I/usr/include/torch/csrc/api/include
          CXX: ccache g++ -I/usr/include/torch/csrc/api/include
      - uses: cmake/build
      - uses: cmake/install
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - libtorch-cuda-${{vars.cuda-version}}
        - libtorchtext-cuda-${{vars.cuda-version}}
        - py${{range.key}}-numpy
        - py${{range.key}}-requests
        - py${{range.key}}-torch-cuda-${{vars.cuda-version}}
        - py${{range.key}}-tqdm
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check
          with:
            # Gets loaded at runtime by torchtext's __init__ script
            extra-library-paths: /usr/lib/python${{range.key}}/site-packages/torch/lib
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
