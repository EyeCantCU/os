package:
  name: py3-numba
  version: 0.61.2
  epoch: 0
  description: Just-In-Time Compiler for Numerical Functions in Python
  copyright:
    - license: BSD-2-Clause

vars:
  pypi-package: numba

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-numpy

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/numba/numba.git
      tag: ${{package.version}}
      expected-commit: 1e70d8ceba56a135e046e32e1e7ad2fcd22fd8ab

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-llvmlite
        - py${{range.key}}-numpy
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  ignore-regex-patterns:
    - .*dev.*
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
