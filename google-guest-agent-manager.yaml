# This is a separate package for the google guest agent manager
# and plugin system. It's not packaged inside google guest agent
# since it has it's own repo and update cadence. Eventualy
# they projects will  be combined. See:
# https://github.com/GoogleCloudPlatform/google-guest-agent
# https://github.com/GoogleCloudPlatform/guest-agent?tab=readme-ov-file#overview
#nolint:git-checkout-must-use-github-updates,valid-pipeline-git-checkout-tag
package:
  name: google-guest-agent-manager
  # Upstream has not tagged releases this it the commit I pulled from
  version: "0_git20250128"
  epoch: 0
  description: "google guest agent manager"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - busybox
      - coreutils
      - go
      - protobuf-dev
      - protoc
      - protoc-gen-go
      - protoc-gen-go-grpc

vars:
  google-guest-agent-version: "20250122.00"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GoogleCloudPlatform/google-guest-agent.git
      expected-commit: 7eac13d92c34fb05ef5ad04bee4fa3eddc1e055b

  - runs: |
      VERSION=${{vars.google-guest-agent-version}} make cmd/google_guest_agent/google_guest_agent
      # https://github.com/GoogleCloudPlatform/guest-agent/blob/4dbdb5da9cb233c43adcea8affd01bf5d291b9bd/packaging/google-guest-agent.spec#L65C3-L66C1
      mkdir -p ${{targets.destdir}}/usr/bin/
      install -p -m 0755 cmd/google_guest_agent/google_guest_agent ${{targets.destdir}}/usr/bin/google_guest_agent_manager
      # See https://github.com/GoogleCloudPlatform/guest-agent/blob/4dbdb5da9cb233c43adcea8affd01bf5d291b9bd/packaging/google-guest-agent.spec#L82

test:
  pipeline:
    - runs: |
        google_guest_agent_manager --help

update:
  enabled: false
  exclude-reason: "No branching or tags upstream, manual update"
