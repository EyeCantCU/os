package:
  name: py3-nvidia-modelopt-cuda-12.9
  version: "0.39.0"
  epoch: 0
  description: A Library to Quantize and Compress Deep Learning Models for Optimized Inference on GPUs
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.name}}
    match: '.*cuda-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

vars:
  pypi-package: nvidia-modelopt
  import: modelopt

data:
  - name: py-versions
    items:
      # 3.13 is not supported as of version 0.31.0
      3.10:
      3.11:
      3.12:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cuda-toolkit-${{vars.cuda-version}}-dev
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/TensorRT-Model-Optimizer
      tag: ${{package.version}}
      expected-commit: f329b19d4d0512b4a0774838a94f684e20347cb7

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-ninja
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-nvidia-ml-py
        - py${{range.key}}-packaging
        - py${{range.key}}-pulp
        - py${{range.key}}-pydantic
        - py${{range.key}}-regex
        - py${{range.key}}-rich
        - py${{range.key}}-safetensors
        - py${{range.key}}-scipy
        - py${{range.key}}-torch-cuda-${{vars.cuda-version}}
        - py${{range.key}}-torchprofile-cuda-${{vars.cuda-version}}
        - py${{range.key}}-torchvision-cuda-${{vars.cuda-version}}
        - py${{range.key}}-tqdm
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.11-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
        - py3.12-${{vars.pypi-package}}-cuda-${{vars.cuda-version}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: NVIDIA/TensorRT-Model-Optimizer
