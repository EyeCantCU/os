package:
  name: dependency-track-frontend
  version: "4.13.5"
  epoch: 0
  description: Dependency-Track frontend (static assets)
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - curl
      - docker-nginx
      - jq
      - nginx

environment:
  contents:
    packages:
      - busybox
      - nginx-package-config
      - nodejs-20 # Use Node 20 (LTS) for webpack 4/Vue CLI compatibility; newer Node ≥21 causes ERR_OSSL_EVP_UNSUPPORTED
      - npm
      - openssl-provider-legacy
  environment:
    NODE_OPTIONS: "--openssl-legacy-provider" # Enables legacy OpenSSL provider to avoid ERR_OSSL_EVP_UNSUPPORTED

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/DependencyTrack/frontend.git
      tag: ${{package.version}}
      expected-commit: 623649db6bebca40f5c9ade59b72a253ebd3ec86

  - runs: |
      npm install --ignore-scripts
      npm run build
      mkdir -p "${{targets.destdir}}/opt/owasp/dependency-track-frontend"
      cp -r dist/* "${{targets.destdir}}/opt/owasp/dependency-track-frontend/"

      mkdir -p "${{targets.destdir}}/etc/nginx/templates"
      install -m 0644 docker/etc/nginx/templates/default.conf.template "${{targets.destdir}}/etc/nginx/templates/default.conf.template"

      mkdir -p "${{targets.destdir}}/docker-entrypoint.d"
      install -m 0755 docker/docker-entrypoint.d/30-oidc-configuration.sh "${{targets.destdir}}/docker-entrypoint.d/30-oidc-configuration.sh"

  - name: "Setup nginx runtime directories"
    runs: |
      # Create directories that nginx needs at runtime
      mkdir -p "${{targets.destdir}}/etc/nginx/http.d"
      mkdir -p "${{targets.destdir}}/var/cache/nginx"
      mkdir -p "${{targets.destdir}}/var/log/nginx"
      ln -sf http.d "${{targets.destdir}}/etc/nginx/conf.d"

update:
  enabled: true
  github:
    identifier: DependencyTrack/frontend

test:
  environment:
    contents:
      packages:
        - curl
  pipeline:
    - name: "Static files exist"
      runs: |
        stat /opt/owasp/dependency-track-frontend/index.html
        stat /etc/nginx/templates/default.conf.template
        stat /docker-entrypoint.d/10-listen-on-ipv6-by-default.sh
        stat /docker-entrypoint.d/30-oidc-configuration.sh
    - name: "start the binary"
      uses: test/daemon-check-output
      with:
        setup: |
          if ! id -u "nginx" > /dev/null 2>&1; then
            addgroup -g 101 nginx
            adduser -u 101 -D -G nginx -s /sbin/nologin nginx
          fi
          chown -R nginx:nginx /etc/nginx/conf.d
          chown -R nginx:nginx /var/cache/nginx
          chown -R nginx:nginx /var/log/nginx
        start: /docker-entrypoint.sh nginx -g "daemon off;"
        timeout: 30
        expected_output: |
          Configuration complete; ready for start up
        post: |
          sleep 2
          echo "Testing HTTP endpoint on port 80"
          curl -f -s http://localhost:80/ | grep "Welcome to nginx!"
