package:
  name: bouncycastle-rng-jent
  # renovate: datasource=maven depName=org.bouncycastle:bc-rng-jent versioning=maven
  version: "1.3.6"
  epoch: 1
  description: Bouncy Castle JENT Entropy Provider
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://repo1.maven.org/maven2/org/bouncycastle/bc-rng-jent/${{package.version}}/bc-rng-jent-${{package.version}}.jar
      expected-sha512: 1dbcab6bc64f23e6f3db2de141a116c20e50c79fd9eb18291ce5e3e1295f8b564cfb41ee99d3074494b2c8acc6b33b500aef4e9af091b4354a463ca3b032f3e8
      extract: false

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/java/bouncycastle-fips
      cp bc-rng-jent-${{package.version}}.jar ${{targets.destdir}}/usr/share/java/bouncycastle-fips/bc-rng-jent.jar

update:
  enabled: false
  exclude-reason: |
    Please upgrade this always. Note this jar is outside of FIPS
    boundary, and should always be updated to latest published version
    on maven. There is no git repository where one can track version
    numbers for it, as the upstream repo is private. Unless we write a
    maven version tracker.
