#nolint:valid-pipeline-git-checkout-commit,valid-pipeline-git-checkout-tag,update-identifier-must-match-git-repository
package:
  name: bootupd
  version: 0.2.29
  epoch: 3 # GHSA-xwfj-jgwm-7wp5
  description: Bootloader updater
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - openssl-dev

pipeline:
  - uses: git-checkout
    with:
      #repository: https://github.com/coreos/bootupd
      #tag: v${{package.version}}
      # https://github.com/coreos/bootupd/pull/978
      repository: https://github.com/p5/coreos-bootupd.git
      branch: sdboot-support
      expected-commit: 7db29c74bbb8a494ea142b008307a957061af17d

  - uses: rust/cargobump

  - uses: cargo/build
    with:
      output: bootupd
      opts: |
        --release \
        --features=systemd-boot

  - uses: autoconf/make-install

  - uses: autoconf/make
    with:
      opts: install-grub-static DESTDIR="${{targets.destdir}}"

  - uses: strip

test:
  pipeline:
    - runs: |
        set -o pipefail
        bootupd --help | grep -F -e "Bootupd backend commands"
        bootupd --version | grep -F -e "${{package.version}}"
        bootupctl --help | grep -F -e "Bootupd client application"
        bootupctl --version | grep -F -e "${{package.version}}"

update:
  enabled: false
  exclude-reason: Currently tracking a branch
  github:
    identifier: coreos/bootupd
    strip-prefix: v
