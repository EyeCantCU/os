package:
  name: amazon-ec2-net-utils
  version: "2.5.5"
  epoch: 0
  description: set of utilities for managing elastic network interfaces on Amazon EC2
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - curl
      - iproute2
      - logger
      - systemd
      - udev

environment:
  contents:
    packages:
      - build-base
      - busybox
      - coreutils

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/amazonlinux/amazon-ec2-net-utils
      tag: v${{package.version}}
      expected-commit: 293278c831eddcedd434166551f023f733ffa6e6

  - runs: |
      # We don't yet have /lib-usr-merge
      sed -i 's|/lib/systemd/systemd-networkd-wait-online|/usr/lib/systemd/systemd-networkd-wait-online|' bin/setup-policy-routes.sh

  - uses: autoconf/make-install
    with:
      opts: PREFIX=/usr

test:
  pipeline:
    - runs: |
        # There are no help nor version options
        setup-policy-routes two args

update:
  enabled: true
  github:
    identifier: amazonlinux/amazon-ec2-net-utils
    strip-prefix: v
    tag-filter: v
