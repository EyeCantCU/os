package:
  name: kvm-device-plugin
  version: "0.1.0"
  epoch: 0
  description: "Generic device plugin for Kubernetes configured for KVM device access"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

update:
  enabled: false

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/squat/generic-device-plugin
      expected-commit: 1467dded18ec671be5dbb648943406eaa710eb79

  - uses: go/build
    with:
      packages: "."
      output: kvm-device-plugin
      ldflags: "-s -w"

test:
  pipeline:
    - name: Verify binary functionality
      runs: |-
        kvm-device-plugin --help
        which kvm-device-plugin
