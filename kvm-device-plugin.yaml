#nolint:valid-pipeline-git-checkout-tag
package:
  name: kvm-device-plugin
  version: "0_git20250923"
  epoch: 0
  description: "Generic device plugin for Kubernetes configured for KVM device access"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle

update:
  enabled: false
  exclude-reason: |
    - This is disabled because they don't use release tags and are just releasing a single version. The simplicity of this may mean that its low risk

environment:
  contents:
    packages:
      - bash
      - build-base
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/squat/generic-device-plugin
      branch: main
      expected-commit: 1467dded18ec671be5dbb648943406eaa710eb79

  - uses: go/build
    with:
      packages: "."
      output: kvm-device-plugin

test:
  pipeline:
    - name: Verify binary exists and help works
      runs: |-
        kvm-device-plugin --help
        which kvm-device-plugin
    - name: Test version flag
      runs: |-
        kvm-device-plugin --version
    - name: Test invalid device configuration handling
      runs: |-
        ! kvm-device-plugin --device='invalid-json' 2>/dev/null || echo "Expected failure for invalid JSON"
        ! kvm-device-plugin --device='{}' 2>/dev/null || echo "Expected failure for empty device config"
    - name: Test KVM device configuration specifically
      runs: |-
        # Test the exact KVM configuration we use in production
        KVM_CONFIG='{"name":"kvm","groups":[{"paths":[{"path":"/dev/kvm"}]}]}'
        echo "Testing KVM device config: $KVM_CONFIG"
        kvm-device-plugin --device="$KVM_CONFIG" --help >/dev/null

        # Test KVM config with verbose logging
        kvm-device-plugin --device="$KVM_CONFIG" --log-level=debug --help >/dev/null
