# Policy-Bot Configuration for Stereo
#
# This file mirrors the CODEOWNERS file but with explicit approval logic.
# Policy-bot provides better visibility and features than GitHub's native CODEOWNERS.
#
# Key differences from CODEOWNERS:
# - Explicit OR logic (CODEOWNERS implicitly uses OR for multiple teams)
# - Smart review dismissal (only dismisses when owned files change, not any push)
# - Admin bypass for emergencies
# - Clear approval status in PR checks
#
# How to read this file:
# - Each "approval_rule" defines who can approve changes to specific paths
# - "count: 1" with multiple teams = OR logic (approval from ANY listed team)
# - "if: changed_files" = rule only applies when these paths change
# - All ACTIVE rules must pass (if multiple rules match, ALL must be satisfied)

approval_rules:
  # ==========================================================================
  # Critical Repository Configuration
  # ==========================================================================
  # These files control how the repo works - require approval from repo owners

  - name: "codeowners-file"
    description: "CODEOWNERS changes need OS or VMs team approval"
    # Why: CODEOWNERS defines who reviews what - changes affect repo security
    if:
      changed_files:
        paths:
          - "^CODEOWNERS$"
    requires:
      count: 1  # OR logic: approval from ANY of these teams
      teams:
        - "chainguard-dev/guarded-os-team-write"
        - "chainguard-dev/guarded-vms-team-write"
    options:
      invalidate_on_push: true      # New commits require re-approval
      allow_author: false            # Author can't approve own changes

  - name: "ci-and-repo-config"
    description: "CI/repo configuration requires OS or VMs team approval"
    # Why: .chainguard/, .github/, pre-commit control builds and automation
    # Note: .github/chainguard/ is excluded - handled by platform-specific-config
    if:
      changed_files:
        paths:
          - "^\\.chainguard/.*"
          - "^\\.github/.*"
          - "^\\.pre-commit-config\\.yaml$"
        ignore:
          - "^\\.github/chainguard/.*"
    requires:
      count: 1  # OR logic: approval from ANY of these teams
      teams:
        - "chainguard-dev/guarded-os-team-write"
        - "chainguard-dev/guarded-vms-team-write"
    options:
      invalidate_on_push: true
      allow_author: false

  - name: "platform-specific-config"
    description: "Platform-specific GitHub config requires Platform team"
    # Why: .github/chainguard/ contains Platform-owned automation configs
    if:
      changed_files:
        paths:
          - "^\\.github/chainguard/.*"
    requires:
      count: 1  # Single team ownership
      teams:
        - "chainguard-dev/platform-team-write"
    options:
      invalidate_on_push: true

  # ==========================================================================
  # OS Package Management
  # ==========================================================================
  # Build infrastructure and critical packages for Wolfi OS

  - name: "os-build-infrastructure"
    description: "OS Makefile and pipelines require OS team (Foundations squad)"
    # Why: These control how ALL os/ packages are built
    if:
      changed_files:
        paths:
          - "^os/Makefile$"
          - "^os/pipelines/.*"
    requires:
      count: 1  # Single team ownership
      teams:
        - "chainguard-dev/guarded-os-team-write"
    options:
      invalidate_on_push: true

  - name: "os-critical-packages"
    description: "Critical OS packages require OS team approval"
    # Why: Toolchain, compilers, TLS, language runtimes are high-risk
    # Changes can break entire OS or introduce security issues
    if:
      changed_files:
        paths:
          - "^os/binutils\\.yaml$"
          - "^os/ca-certificates\\.yaml$"
          - "^os/clang-.*\\.yaml$"
          - "^os/gcc.*\\.yaml$"
          - "^os/glibc\\.yaml$"
          - "^os/llvm.*\\.yaml$"
          - "^os/openssf-compiler-options\\.yaml$"
          - "^os/openssf-compiler-options/.*"
          - "^os/openssh\\.yaml$"
          - "^os/openssl\\.yaml$"
          - "^os/perl\\.yaml$"         # Perl transitions aren't automated yet
          - "^os/go-[12]\\..*\\.yaml$" # Go runtime versions
          - "^os/python.*\\.yaml$"     # Python runtime versions
          - "^os/python.*/.*"
          - "^os/php-8\\.5\\.yaml$"
          - "^os/dotnet-.*\\.yaml$"
          - "^os/ruby-.*\\.yaml$"
    requires:
      count: 1  # Single team ownership
      teams:
        - "chainguard-dev/guarded-os-team-write"
    options:
      invalidate_on_push: true
      allow_author: false  # These are too critical for self-approval

  # ==========================================================================
  # Extra Packages
  # ==========================================================================
  # Additional packages beyond core OS

  - name: "extra-packages-infrastructure"
    description: "Extra packages build infrastructure requires OS or VMs team"
    # Why: Controls how extra-packages/ directory is built
    if:
      changed_files:
        paths:
          - "^extra-packages/Makefile$"
          - "^extra-packages/pipelines/.*"
    requires:
      count: 1  # OR logic: approval from ANY of these teams
      teams:
        - "chainguard-dev/guarded-os-team-write"
        - "chainguard-dev/guarded-vms-team-write"
    options:
      invalidate_on_push: true

  - name: "gpu-packages"
    description: "GPU packages require manual testing - OS or VMs team approval"
    # Why: No automated GPU testing yet, requires manual verification
    if:
      changed_files:
        paths:
          - "^extra-packages/py3-torch-cuda-.*\\.yaml$"
    requires:
      count: 1  # OR logic: approval from ANY of these teams
      teams:
        - "chainguard-dev/guarded-os-team-write"
        - "chainguard-dev/guarded-vms-team-write"
    options:
      invalidate_on_push: true
      allow_author: false  # Manual testing required, no self-approval

  # ==========================================================================
  # Enterprise Packages
  # ==========================================================================
  # Customer-facing enterprise packages

  - name: "enterprise-packages-infrastructure"
    description: "Enterprise packages build infrastructure requires OS or VMs team"
    # Why: Controls how enterprise-packages/ directory is built
    if:
      changed_files:
        paths:
          - "^enterprise-packages/Makefile$"
          - "^enterprise-packages/pipelines/.*"
    requires:
      count: 1  # OR logic: approval from ANY of these teams
      teams:
        - "chainguard-dev/guarded-os-team-write"
        - "chainguard-dev/guarded-vms-team-write"
    options:
      invalidate_on_push: true

  - name: "fips-certified-modules"
    description: "FIPS certified modules require FIPS reviewers"
    # Why: CMVP FIPS certification requires careful review
    # These are government-certified cryptographic modules
    if:
      changed_files:
        paths:
          - "^enterprise-packages/bouncycastle-fips\\.yaml$"
          - "^enterprise-packages/bouncycastle-rng-jent\\.yaml$"
          - "^enterprise-packages/openssl-provider-fips\\.yaml$"
          - "^enterprise-packages/openssl-provider-fips-.*\\.yaml$"
          - "^enterprise-packages/boringssl-fips-static-.*\\.yaml$"
          - "^enterprise-packages/aws-lc-fips\\.yaml$"
          - "^enterprise-packages/libgcrypt-al2023-fips\\.yaml$"
          - "^enterprise-packages/NIST-.*\\.yaml$"
    requires:
      count: 1  # Single team ownership - FIPS reviewers only
      teams:
        - "chainguard-dev/fips-reviewers"
    options:
      invalidate_on_push: true
      allow_author: false  # FIPS changes too critical for self-approval

# ==============================================================================
# Approval Policy
# ==============================================================================
#
# How policy-bot evaluates your PR:
#
# 1. Looks at which files you changed
# 2. Finds all rules with matching "if: changed_files" patterns
# 3. Rules without "if" blocks are ALWAYS active
# 4. ALL active rules must pass for PR to be approved
#
# Example scenarios:
#
# Scenario 1: Single file, single rule
#   You change "os/openssl.yaml"
#   - Matches "os-critical-packages" rule
#   - Requires: 1 approval from @guarded-os-team-write
#   - Result: Need OS team review
#
# Scenario 2: Multiple files, same team covers both rules
#   You change "os/openssl.yaml" AND "os/Makefile"
#   - os/openssl.yaml matches "os-critical-packages"
#   - os/Makefile matches "os-build-infrastructure"
#   - Both require OS team, so 1 OS team approval satisfies both
#   - Result: Need OS team review (one approval covers both rules)
#
# Scenario 3: Multiple files, different teams required
#   You change "os/openssl.yaml" AND "enterprise-packages/openssl-provider-fips.yaml"
#   - os/openssl.yaml matches "os-critical-packages" (OS team)
#   - openssl-provider-fips.yaml matches "fips-certified-modules" (FIPS reviewers)
#   - Requires: 1 from OS team AND 1 from FIPS reviewers
#   - Result: Need approvals from BOTH teams (or 1 approval from someone on both)
#
# NOTE: If a path matches MULTIPLE rules, you need to satisfy ALL of them.
# This is different from CODEOWNERS where the last matching pattern wins.

policy:
  approval:
    # All rules are listed here - policy-bot evaluates which are active based on changed files
    - "codeowners-file"
    - "ci-and-repo-config"
    - "platform-specific-config"
    - "os-build-infrastructure"
    - "os-critical-packages"
    - "extra-packages-infrastructure"
    - "gpu-packages"
    - "enterprise-packages-infrastructure"
    - "fips-certified-modules"
