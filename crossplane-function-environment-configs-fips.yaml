package:
  name: crossplane-function-environment-configs-fips
  version: "0.5.0"
  epoch: 0
  description: A function building the environment from EnvironmentConfigs
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - crossplane-crank

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/crossplane-contrib/function-environment-configs.git
      tag: v${{package.version}}
      expected-commit: 49c1ad44683fee0c077b87df8daa6bc26e465a5d

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0
        golang.org/x/oauth2@v0.27.0

  - uses: go/build
    with:
      packages: .
      output: function-environment-configs
      go-package: go-fips

update:
  enabled: true
  git:
    strip-prefix: v

subpackages:
  - name: crossplane-function-environment-configs-compat-fips
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -s /usr/bin/function-environment-configs ${{targets.subpkgdir}}/function
          crank xpkg extract xpkg.upbound.io/crossplane-contrib/function-environment-configs:v${{package.version}} -o out.gz
          gunzip -c ./out.gz | tee ${{targets.subpkgdir}}/package.yaml
    test:
      pipeline:
        - name: "Verify the symlink"
          runs: |
            test "$(readlink /function)" = "/usr/bin/function-environment-configs"
            stat /package.yaml

test:
  environment:
    environment:
      GRPC_PORT: 9443
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - uses: test/go-fips-check
    - name: Smoke tests
      runs: function-environment-configs --help | grep -F -e "A Crossplane Composition Function"
    - name: Test if endpoint works
      runs: |
        function-environment-configs -d --insecure "--address=localhost:${GRPC_PORT}" &
        DAEMON_PID=$!
        trap 'kill -9 "${DAEMON_PID}"' EXIT
        wait-for-it "localhost:${GRPC_PORT}"
        curl "localhost:${GRPC_PORT}" --http0.9 -o - | xxd | grep -F -e "0500 0040"
