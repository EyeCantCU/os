package:
  name: tensorrt-cuda-12
  version: 10.11.0.33
  epoch: 1
  description: TensorRT libraries for CUDA 12.0 to ${{vars.cuda-version}}
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    runtime:
      - libnvinfer-bin-cuda-${{vars.cuda-major-version}}=${{package.full-version}}
      - libnvinfer-cuda-${{vars.cuda-major-version}}=${{package.full-version}}
      - libnvinfer-dispatch-cuda-${{vars.cuda-major-version}}=${{package.full-version}}
      - libnvinfer-lean-cuda-${{vars.cuda-major-version}}=${{package.full-version}}
      - libnvinfer-plugin-cuda-${{vars.cuda-major-version}}=${{package.full-version}}
      - libnvinfer-vc-plugin-cuda-${{vars.cuda-major-version}}=${{package.full-version}}
      - libnvonnxparser-cuda-${{vars.cuda-major-version}}=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: '(\d+\.\d+\.\d+)\.\d+'
    replace: '$1'
    to: mangled-package-version
  - from: ${{package.version}}
    match: '(\d+\.\d+)\.\d+\.\d+'
    replace: '$1'
    to: major-minor
  - from: ${{package.name}}
    match: '.*cuda-(\d+)(?:\.\d+)?'
    replace: '$1'
    to: cuda-major-version

vars:
  # It's versioned for the latest minor version it supports, but is backwards compatible.
  cuda-version: 12.9
  pypi-package: tensorrt
  import: tensorrt

environment:
  contents:
    packages:
      - busybox
      - py3-supported-build-base

data:
  # libnvinfer-plugin is split out here because it has an extra dep
  # we can restore it when melange is able to populate our deps
  - name: _libs
    items:
      libnvinfer-dispatch:
      libnvinfer-lean:
      libnvinfer-vc-plugin:
      libnvonnxparser:
      libnvinfer:

  - name: _devs
    items:
      libnvinfer-dispatch:
      libnvinfer-lean:
      libnvinfer-plugin:
      libnvinfer-vc-plugin:
      libnvonnxparser:
      libnvinfer:

  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - if: ${{build.arch}} == "x86_64"
    uses: fetch
    with:
      uri: "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/${{vars.mangled-package-version}}/tars/TensorRT-${{package.version}}.Linux.${{build.arch}}-gnu.cuda-${{vars.cuda-version}}.tar.gz"
      expected-sha256: "7d9bcccf1b92d38c0f91bd47ad1fd516f2cfb71f655e70ed8f182eaa9842a617"
      timeout: 600

  - if: ${{build.arch}} == "aarch64"
    uses: fetch
    with:
      uri: "https://developer.nvidia.com/downloads/compute/machine-learning/tensorrt/${{vars.mangled-package-version}}/tars/TensorRT-${{package.version}}.Linux.${{build.arch}}-gnu.cuda-${{vars.cuda-version}}.tar.gz"
      expected-sha256: "1e6366ccbec6862a643fb9ed9f98c4a0c3baf3e841ceac51f44536f2e9277d02"
      timeout: 600

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.contextdir}}/usr/local/tensorrt
      mv targets doc lib ${{targets.contextdir}}/usr/local/tensorrt/

subpackages:
  - name: libnvinfer-bin-cuda-${{vars.cuda-major-version}}
    description: libnvinfer binaries
    options:
      no-depends: true
    dependencies:
      runtime:
        - libstdc++
    pipeline:
      - runs: |
          _bindir=usr/local/tensorrt/targets/${{build.arch}}-linux-gnu/bin
          mkdir -p ${{targets.contextdir}}/$_bindir
          mv ${{targets.destdir}}/$_bindir/* ${{targets.contextdir}}/$_bindir
          mv bin ${{targets.contextdir}}/usr/local/tensorrt
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: libnvinfer-samples-cuda-${{vars.cuda-major-version}}
    description: libnvinfer samples
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/tensorrt/
          mv samples ${{targets.contextdir}}/usr/local/tensorrt/
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - range: _libs
    name: ${{range.key}}-cuda-${{vars.cuda-major-version}}
    description: ${{range.key}}
    options:
      no-depends: true
    dependencies:
      runtime:
        - libstdc++
        - ${{package.name}}-ld-config
    pipeline:
      - runs: |
          libname="${{range.key}}"
          _libdir=usr/local/tensorrt/targets/${{build.arch}}-linux-gnu/lib
          mkdir -p ${{targets.subpkgdir}}/$_libdir

          # Replacing hyphens with underscores in libname
          libname_with_underscore="${libname//-/_}"
          mv ${{targets.destdir}}/$_libdir/${libname_with_underscore}.so.* ${{targets.subpkgdir}}/$_libdir

          if [ "$libname" = "libnvinfer" ]; then
            mv ${{targets.destdir}}/$_libdir/${libname_with_underscore}_builder*.so.* ${{targets.subpkgdir}}/$_libdir
          fi

  - name: libnvinfer-plugin-cuda-${{vars.cuda-major-version}}
    description: libnvinfer-plugin
    options:
      no-depends: true
    dependencies:
      runtime:
        - libstdc++
        - libnvinfer-cuda-${{vars.cuda-major-version}}
        - ${{package.name}}-ld-config
    pipeline:
      - runs: |
          libname="libnvinfer-plugin"
          _libdir=usr/local/tensorrt/targets/${{build.arch}}-linux-gnu/lib
          mkdir -p ${{targets.subpkgdir}}/$_libdir

          # Replacing hyphens with underscores in libname
          libname_with_underscore="${libname//-/_}"
          mv ${{targets.destdir}}/$_libdir/${libname_with_underscore}.so.* ${{targets.subpkgdir}}/$_libdir

          if [ "$libname" = "libnvinfer" ]; then
            mv ${{targets.destdir}}/$_libdir/${libname_with_underscore}_builder*.so.* ${{targets.subpkgdir}}/$_libdir
          fi

  - range: _devs
    name: ${{range.key}}-cuda-${{vars.cuda-major-version}}-dev
    description: ${{range.key}}-dev
    options:
      no-depends: true
    dependencies:
      runtime:
        - ${{range.key}}-cuda-${{vars.cuda-major-version}}
        - ${{package.name}}-ld-config
    pipeline:
      - runs: |
          _libdir=usr/local/tensorrt/targets/${{build.arch}}-linux-gnu/lib
          _includedir=usr/local/tensorrt/include

          mkdir -p ${{targets.subpkgdir}}/$_libdir ${{targets.subpkgdir}}/$_libdir/stubs

          libname="${{range.key}}"

          # Replacing hyphens with underscores in libname
          libname_with_underscore="${libname//-/_}"
          mv ${{targets.destdir}}/$_libdir/${libname_with_underscore}.so ${{targets.subpkgdir}}/$_libdir
          mv ${{targets.destdir}}/$_libdir/stubs/${libname_with_underscore}.so ${{targets.subpkgdir}}/$_libdir/stubs/
          mv ${{targets.destdir}}/$_libdir/${libname_with_underscore}_static.a ${{targets.subpkgdir}}/$_libdir

          if [ "$libname" = "libnvonnxparser" ]; then
            mkdir -p ${{targets.subpkgdir}}/$_includedir
            mv ${{targets.destdir}}/$_libdir/libonnx_proto.a ${{targets.subpkgdir}}/$_libdir
            mv include/NvOnnx*.h ${{targets.subpkgdir}}/$_includedir
          fi

          if [ "$libname" = "libnvinfer-plugin" ]; then
            mkdir -p ${{targets.subpkgdir}}/$_includedir
            mv include/NvInferPlugin*.h ${{targets.subpkgdir}}/$_includedir
          fi

          if [ "$libname" = "libnvinfer" ]; then
            mkdir -p ${{targets.subpkgdir}}/$_includedir
            mv $(ls include/NvInfer*.h | grep -v include/NvInferPlugin) ${{targets.subpkgdir}}/$_includedir
          fi
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-dev
    description: tensorrt dev metapackage
    options:
      no-depends: true
    dependencies:
      runtime:
        - libnvinfer-dispatch-cuda-${{vars.cuda-major-version}}-dev=${{package.full-version}}
        - libnvinfer-lean-cuda-${{vars.cuda-major-version}}-dev=${{package.full-version}}
        - libnvinfer-plugin-cuda-${{vars.cuda-major-version}}-dev=${{package.full-version}}
        - libnvinfer-vc-plugin-cuda-${{vars.cuda-major-version}}-dev=${{package.full-version}}
        - libnvonnxparser-cuda-${{vars.cuda-major-version}}-dev=${{package.full-version}}
        - libnvinfer-cuda-${{vars.cuda-major-version}}-dev=${{package.full-version}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-cuda-${{vars.cuda-major-version}}
    description: python${{range.key}} version of ${{vars.pypi-package}}-${{vars.major-minor}} built for CUDA ${{vars.cuda-major-version}}
    dependencies:
      runtime:
    pipeline:
      - name: Check to see if upstream has added builds for python versions we suport
        working-directory: python
        runs: |
          for file in tensorrt-${{package.version}}-*_${{build.arch}}.whl; do
            pytag="$(echo $file | sed -r 's/.*-(cp[0-9]+)-.*/\1/')"
            case $pytag in
              cp38|cp39|cp310|cp311|cp312|cp313)
                ;;
              *)
                echo "Found whl for unexpected Python version $pytag"
                echo "If this is a version we support, please now enable it."
                exit 1
                ;;
            esac
          done
      - working-directory: python
        runs: |
          pytag="cp$(echo ${{range.key}} | tr -d .)-none-linux"
          python${{range.key}} -m pip install --no-deps --root ${{targets.contextdir}} \
            tensorrt-${{package.version}}-${pytag}_${{build.arch}}.whl
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - py${{range.key}}-pip
      pipeline:
        - runs: |
            python${{range.key}} -m pip check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}-cuda-${{vars.cuda-major-version}}
    description: meta package providing ${{vars.pypi-package}}-${{vars.major-minor}} built for CUDA ${{vars.cuda-major-version}} for supported python versions
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-${{vars.major-minor}}-cuda-${{vars.cuda-major-version}}
        - py3.11-${{vars.pypi-package}}-${{vars.major-minor}}-cuda-${{vars.cuda-major-version}}
        - py3.12-${{vars.pypi-package}}-${{vars.major-minor}}-cuda-${{vars.cuda-major-version}}
        - py3.13-${{vars.pypi-package}}-${{vars.major-minor}}-cuda-${{vars.cuda-major-version}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

  - name: ${{package.name}}-ld-config
    description: Runtime linker configuration for TensorRT libraries for NVIDIA GPUs
    pipeline:
      - runs: |
          _libdir="/usr/local/tensorrt/targets/${{build.arch}}-linux-gnu/lib"
          mkdir -p "${{targets.contextdir}}"/etc/ld.so.conf.d
          echo "$_libdir" > "${{targets.contextdir}}"/etc/ld.so.conf.d/${{context.name}}.conf

update:
  enabled: true
  release-monitor:
    identifier: 133035
