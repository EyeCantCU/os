package:
  name: nvidia-nsight-compute-12.1
  version: 2023.1.0.15
  epoch: 1
  description: Nsight Compute
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-nsight-compute=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/nsight_compute/linux-sbsa/nsight_compute-linux-sbsa-2023.1.0.15-archive.tar.xz"
          expected-sha256: "0da9f3ecf8da306f52d0b1590b2eea3eefd6a0f2d505be44abf7e21d644d2bbf"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/nsight_compute/linux-x86_64/nsight_compute-linux-x86_64-2023.1.0.15-archive.tar.xz"
          expected-sha256: "4d33b2f6995221f1eec076623a385e6381c7fa7129ef007217df3121b9106a59"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.1/
      mv bin ${{targets.destdir}}/usr/local/cuda-12.1/
      mv nsight-compute ${{targets.destdir}}/usr/local/cuda-12.1/
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.1/${{package.name}}.LICENSE

update:
  enabled: false
