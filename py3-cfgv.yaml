package:
  name: py3-cfgv
  version: "3.5.0"
  epoch: 0
  description: Validate configuration and produce human readable error messages.
  copyright:
    - license: MIT

environment:
  contents:
    packages:
      - py3-supported-build-base

vars:
  pypi-package: cfgv
  import: cfgv

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/asottile/cfgv
      tag: v${{package.version}}
      expected-commit: c7342120ec8513671fb8dd54d8a14399dc59cd47

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: asottile/cfgv
    strip-prefix: v
    use-tag: true
