package:
  name: nvidia-cuda-vectoradd-12.4
  version: 12.4.1
  epoch: 2
  description: This CUDA Runtime API sample is a very basic sample that implements element by element vector addition. It is the same as the sample illustrating Chapter 3 of the programming guide with some additions like error checking.
  copyright:
    - license: PROPRIETARY
  target-architecture:
    # https://github.com/NVIDIA/cuda-samples/tree/master/Samples/0_Introduction/vectorAdd#supported-cpu-architecture does not include aarch64.
    - x86_64

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - gcc-12-default
      - glibc-locale-posix
      - make
      - nvidia-cuda-cudart-12.4
      - nvidia-cuda-cudart-12.4-dev
      - nvidia-cuda-nvcc-12.4
      - nvidia-cuda-nvcc-12.4-dev
      - nvidia-cuda-nvrtc-12.4
      - nvidia-cuda-nvrtc-12.4-dev
      - nvidia-cuda-nvtx-12.4
      - nvidia-cuda-nvtx-12.4-dev
      - nvidia-libcublas-12.4
      - nvidia-libcublas-12.4-dev
      - nvidia-libcufft-12.4
      - nvidia-libcufft-12.4-dev
      - nvidia-libcurand-12.4
      - nvidia-libcurand-12.4-dev
      - nvidia-libcusolver-12.4
      - nvidia-libcusolver-12.4-dev
      - nvidia-libcusparse-12.4
      - nvidia-libcusparse-12.4-dev
      - nvidia-libnvjitlink-12.4
      - nvidia-libnvjitlink-12.4-dev
      - posix-libc-utils

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/cuda-samples/
      tag: v${{package.version}}
      expected-commit: 5f97d7d0dff880bc6567faa4c5e62e389a6d6999

  - runs: |
      ln -s /usr/local/cuda-12.4 /usr/local/cuda
      export CCFLAGS="$CCFLAGS -I/usr/local/cuda/include"
      cd Samples/0_Introduction/vectorAdd/ && make && ls -alh
      mkdir -p ${{targets.destdir}}/usr/bin
      cp vectorAdd ${{targets.destdir}}/usr/bin/vectorAdd

  - uses: strip

update:
  enabled: true
  github:
    identifier: NVIDIA/cuda-samples
    strip-prefix: v
    tag-filter-prefix: v12.4
