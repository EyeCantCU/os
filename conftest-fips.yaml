package:
  name: conftest-fips
  version: "0.65.0"
  epoch: 0 # GHSA-j5w8-q4qc-rx2x
  description: Write tests against structured configuration data using the Open Policy Agent Rego query language
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - cue-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 8c4cfa62aef2778233882afc3345e3c06dc5a7f2
      repository: https://github.com/open-policy-agent/conftest
      tag: v${{package.version}}

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X github.com/open-policy-agent/conftest/internal/commands.version=${{package.version}}
      modroot: .
      output: conftest
      packages: .

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: open-policy-agent/conftest
    strip-prefix: v
