package:
  name: conftest-fips
  version: "0.58.0"
  epoch: 3
  description: Write tests against structured configuration data using the Open Policy Agent Rego query language
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - cue-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 39bd5fcee10393a902ebd48387920bf89411a5b7
      repository: https://github.com/open-policy-agent/conftest
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.36.0
      modroot: .

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X github.com/open-policy-agent/conftest/internal/commands.version=${{package.version}}
      modroot: .
      output: conftest
      packages: .

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: open-policy-agent/conftest
    strip-prefix: v
