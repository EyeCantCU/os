package:
  name: conftest-fips
  version: "0.62.0"
  epoch: 0
  description: Write tests against structured configuration data using the Open Policy Agent Rego query language
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - cue-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ebb167d2baab1b09ea133e00213aa0d8b026ad8c
      repository: https://github.com/open-policy-agent/conftest
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/go-viper/mapstructure/v2@v2.3.0

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X github.com/open-policy-agent/conftest/internal/commands.version=${{package.version}}
      modroot: .
      output: conftest
      packages: .

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: open-policy-agent/conftest
    strip-prefix: v
