package:
  name: conftest-fips
  version: "0.64.0"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: Write tests against structured configuration data using the Open Policy Agent Rego query language
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - cue-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7d412380dbb79b5ebdf390afa2c67439c7344af3
      repository: https://github.com/open-policy-agent/conftest
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      go-package: go-fips
      ldflags: -X github.com/open-policy-agent/conftest/internal/commands.version=${{package.version}}
      modroot: .
      output: conftest
      packages: .

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: open-policy-agent/conftest
    strip-prefix: v
