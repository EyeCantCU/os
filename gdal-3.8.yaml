package:
  name: gdal-3.8
  version: 3.8.5
  epoch: 12
  description: GDAL is an open source MIT licensed translator library for raster and vector geospatial data formats.
  copyright:
    - license: MIT
  dependencies:
    provides:
      - gdal=${{package.full-version}}

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  environment:
    # IMPORTANT NOTE: WE WANT TO BUILD WITH PYTHON NUMPY BINDINGS. GDAL_PYTHON_BINDINGS_WITHOUT_NUMPY ENV VARIABLE SHOULD ALWAYS BE SET TO "NO".
    GDAL_PYTHON_BINDINGS_WITHOUT_NUMPY: "NO"
  contents:
    packages:
      - armadillo-dev
      - arpack-dev
      - autoconf
      - automake
      - bash
      - basisu-dev
      - bison
      - blosc-dev
      - brunsli-dev
      - build-base
      - ca-certificates-bundle
      - cmake
      - coreutils
      - curl-dev
      - expat-dev
      - geos-dev
      - glibc-iconv
      - lerc-dev
      - libdeflate-dev
      - libgeotiff-dev
      - libpng-dev
      - libtirpc-dev
      - libxml2-dev
      - mariadb-dev
      - nlohmann-json
      - odbc-cpp-wrapper-dev
      - openblas-dev
      - opencl-dev
      - openjpeg-dev
      - openssl-dev
      - pcre2-dev
      - proj-dev
      - py3-supported-numpy-2.2
      - py3-supported-python
      - py3-supported-python-dev
      - py3-supported-setuptools
      - qhull-dev
      - sqlite-dev
      - swig<4.3
      - tiff-dev
      - zlib-dev
      - zstd-dev

pipeline:
  - uses: fetch
    with:
      expected-sha256: 0c865c7931c7e9bb4832f50fb53aec8676cbbaccd6e55945011b737fb89a49c2
      uri: https://github.com/OSGeo/gdal/releases/download/v${{package.version}}/gdal-${{package.version}}.tar.gz

  - uses: git-checkout
    with:
      repository: https://github.com/OSGeo/gdal
      tag: v${{package.version}}
      expected-commit: 1d418c1c1a1655c9f0afc944d6c928a60a7ad99a

  # Preffer gdal's FindZSTD which chooses shared linking, rather than
  # zstd-dev newly shipped cmake module. This preserves shared linking
  # against zstd, like it was done by gdal prior to merge of zstd-dev
  # and zstd-cmake.
  - runs: |
      rm -rf /usr/lib/cmake/zstd

subpackages:
  - range: py-versions
    name: ${{package.name}}-py${{range.key}}
    description: ${{package.name}} for Python ${{range.key}}
    dependencies:
      provides:
        - ${{package.name}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: cmake/configure
        with:
          opts: |
            -DPython_LOOKUP_VERSION=${{range.key}} \
            -DPython_ROOT=/usr/lib/python${{range.key}}
      - uses: cmake/build
      - uses: cmake/install
      - uses: strip
      - runs: |
          cmake \
            --build output \
            --target clean
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - range: py-versions
    name: ${{package.name}}-py${{range.key}}-dev
    description: ${{package.name}}-dev for Python ${{range.key}}
    dependencies:
      provides:
        - ${{package.name}}-dev
      provider-priority: ${{range.value}}
    pipeline:
      - uses: split/dev
        with:
          package: ${{package.name}}-py${{range.key}}
    test:
      pipeline:
        - runs: gdal-config --version
        - uses: test/pkgconf
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}

  - range: py-versions
    name: py${{range.key}}-${{package.name}}
    description: ${{package.name}} installed for Python ${{range.key}}
    dependencies:
      provides:
        - py3-${{package.name}}
      provider-priority: ${{range.value}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/lib/
          mv ${{targets.outdir}}/${{package.name}}-py${{range.key}}/usr/lib/python3* ${{targets.contextdir}}/usr/lib/
    test:
      environment:
        contents:
          packages:
            - py${{range.key}}-numpy-2.2
      pipeline:
        - runs: |
            python${{range.key}} -c "from osgeo import gdal_array"

  - name: py3-supported-${{package.name}}
    description: Meta package providing ${{package.name}} for supported Python versions.
    dependencies:
      runtime:
        - py3.10-${{package.name}}
        - py3.11-${{package.name}}
        - py3.12-${{package.name}}
        - py3.13-${{package.name}}
    test:
      pipeline:
        - uses: test/metapackage

  - range: py-versions
    name: ${{package.name}}-tools-py${{range.key}}
    description: ${{package.name}} tools for Python ${{range.key}}
    dependencies:
      provides:
        - ${{package.name}}-tools
      provider-priority: ${{range.value}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mv ${{targets.outdir}}/${{package.name}}-py${{range.key}}/usr/bin/* ${{targets.contextdir}}/usr/bin/
          chmod a+x scripts/*
          cp -r scripts/* ${{targets.contextdir}}/usr/bin/
    test:
      pipeline:
        - runs: |
            detect_printf.sh --version
            detect_printf.sh --help
            detect_self_assignment.sh --version
            detect_self_assignment.sh --help
            detect_suspicious_char_digit_zero.sh --version
            detect_suspicious_char_digit_zero.sh --help
            detect_tabulations.sh --version
            detect_tabulations.sh --help
            gdal-bash-completion.sh --version
            gdal-bash-completion.sh --help
            gdal_contour --help
            gdal_create --version
            gdal_create --help
            gdal_footprint --version
            gdal_footprint --help
            gdal_grid --version
            gdal_grid --help
            gdal_rasterize --version
            gdal_rasterize --help
            gdal_translate --version
            gdal_translate --help
            gdal_viewshed --help
            gdaladdo --version
            gdaladdo --help
            gdalbuildvrt --version
            gdalbuildvrt --help
            gdaldem --help
            gdalenhance --version
            gdalinfo --version
            gdalinfo --help
            gdallocationinfo --version
            gdalmanage --version
            gdalmanage --help
            gdalmdiminfo --version
            gdalmdiminfo --help
            gdalmdimtranslate --version
            gdalmdimtranslate --help
            gdalsrsinfo --version
            gdalsrsinfo --help
            gdaltindex --version
            gdaltindex --help
            gdaltransform --version
            gdaltransform --help
            gdalwarp --version
            gdalwarp --help
            gnmanalyse --version
            gnmmanage --version
            nearblack --version
            nearblack --help
            ogr2ogr --version
            ogr2ogr --long-usage
            ogrinfo --version
            ogrinfo --help
            ogrlineref --long-usage
            ogrtindex --help
            setdevenv.sh --version
            setdevenv.sh --help
            sozip --help

update:
  enabled: true
  github:
    identifier: OSGeo/gdal
    strip-prefix: v
    use-tag: true
    tag-filter: v3.8.

test:
  pipeline:
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: gdal
