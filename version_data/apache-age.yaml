name: apache-age
additional_prompt: >-
    Split version streams by PostgreSQL major version (14, 15, 16, 17, 18).
    Tags use the format PG{N}/v{version} (e.g. PG17/v1.6.0-rc0).
    Only include release versions, not release candidates.
metadata:
    git_tags:
        - https://github.com/apache/age
    github_release:
        - https://github.com/apache/age
streams:
    - stream: "18"
      versions:
        - version: 1.7.0
          sources:
            - type: github_release
              tag: PG18/v1.7.0-rc0
              tag_uri: https://github.com/apache/age/releases/tag/PG18/v1.7.0-rc0
              published_at: 2026-01-21T20:26:32Z
      apks:
        enterprise-packages:
          aarch64:
            - uri: https://apk.cgr.dev/enterprise-packages/aarch64/aarch64-apache-age-18-1.7.0-r0.apk
          x86_64:
            - uri: https://apk.cgr.dev/enterprise-packages/x86_64/x86_64-apache-age-18-1.7.0-r0.apk
