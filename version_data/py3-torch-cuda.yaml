name: py3-torch-cuda
additional_prompt: |
  This is a cross-product of CUDA streams and PyTorch versions.
  Streams come from cuda-toolkit in chainguard-dev/package-version-metadata (e.g., 13.1, 13.0, 12.9, 12.8, 12.6, 11.8).
  Versions come from PyTorch releases at https://github.com/pytorch/pytorch (tag: v{version}).
  Example structure:
    - stream: "12.8"
      versions:
        - version: 2.9.1
          sources:
            - type: git
              tag: v2.9.1
              tag_uri: https://github.com/pytorch/pytorch/releases/tag/v2.9.1
metadata:
    release_monitor:
        id: 27245
        name: torch
    git_tags:
        - https://github.com/pytorch/pytorch
    github_release:
        - https://github.com/pytorch/pytorch
streams: []
