name: pgvector
additional_prompt: |
    This is a cross-product of PostgreSQL streams and pgvector versions.
    Streams come from postgresql in chainguard-dev/package-version-metadata (e.g., 17, 16, 15, 14).
    Versions come from pgvector releases at https://github.com/pgvector/pgvector (tag: v{version}).
    Example structure:
      - stream: "17"
        versions:
          - version: 0.8.1
            sources:
              - type: git
                tag: v0.8.1
                tag_uri: https://github.com/pgvector/pgvector/releases/tag/v0.8.1
