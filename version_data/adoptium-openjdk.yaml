name: adoptium-openjdk
additional_prompt: |-
    Look at all jdk* repositories in the adoptium organization, do not skip any, and only use tags from there. Only consider the 200 newest tags from a repo.

    To identify GA releases, use the following three-way tag matching:

    1. Find all tags with an _adopt suffix (e.g. jdk-11.0.30+7_adopt).
    2. For each _adopt tag, find the corresponding tag without the _adopt suffix (e.g. jdk-11.0.30+7).
    3. Dereference that non-_adopt tag to its commit SHA.
    4. Check whether a -ga tag for the same x.y.z version (e.g. jdk-11.0.30-ga) points to the same commit.
    5. If the commits match, this is a valid GA release. The version is x.y.z.N where N is the build number from the +N suffix (e.g. jdk-11.0.30+7_adopt becomes 11.0.30.7).
    6. If no -ga tag exists or the commits differ, skip that _adopt tag.

    The initial release for a major version may not include minor and patch versions (e.g. jdk-25-ga, jdk-25+36, jdk-25+36_adopt); minor and patch versions should be injected into the version (e.g. 25.0.0.36).

    Use eclipse-temurin for endoflife data.
