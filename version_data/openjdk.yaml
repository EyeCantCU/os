name: openjdk
additional_prompt: Look at all jdk*u repositories in the openjdk organization. Only consider tags with a -ga suffix, Infill minor and patch versions with zero's if not present (jdk-25-ga = 25.0.0). For OpenJDK 8 use the numeric compoents of the tag to generate the version (jdk8u432-ga = 8.432). Use oracle-jdk for endoflife data.
