# Source is on gitlab so we can't use github for updates
#nolint:git-checkout-must-use-github-updates
package:
  name: gitlab-pages-fips-17.0
  version: 17.0.5
  epoch: 0
  description: GitLab Pages daemon used to serve static websites for GitLab users.
  copyright:
    - license: MIT
  dependencies:
    provides:
      - gitlab-pages-fips=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/gitlab-org/gitlab-pages.git
      tag: v${{package.version}}
      expected-commit: 255bdef5f63f8d6b6f27dd4a20439aaee4cd1e01

  - uses: go/bump
    with:
      deps: golang.org/x/net@v0.23.0 google.golang.org/protobuf@v1.33.0

  - uses: go/build
    with:
      packages: .
      output: gitlab-pages
      tags: continuous_profiler_stackdriver
      ldflags: "-w -X main.VERSION=${{package.version}} -X main.REVISION=${{package.version}}"
      go-package: go-fips

  - runs: |
      mkdir -p ${{targets.contextdir}}/srv/gitlab-pages
      mkdir -p ${{targets.contextdir}}/var/log/gitlab

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: gitlabhq/gitlabhq
    strip-prefix: v
    use-tag: true
    tag-filter: v17.0
