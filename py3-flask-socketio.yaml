package:
  name: py3-flask-socketio
  version: "5.5.1"
  epoch: 0
  description: Socket.IO integration for Flask applications
  copyright:
    - license: MIT

vars:
  pypi-package: flask-socketio
  import: flask_socketio

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/miguelgrinberg/Flask-SocketIO
      tag: v${{package.version}}
      expected-commit: 3dbc92facf99d6bf1e7e354890c6113657c6f8e6

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-flask
        - py${{range.key}}-python-socketio
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import flask_socketio
            from flask_socketio import SocketIO, emit, send
            from flask_socketio import join_room, leave_room, Namespace

            # Test basic Flask-SocketIO functionality
            assert hasattr(flask_socketio, 'SocketIO')
            assert hasattr(flask_socketio, 'emit')
            assert hasattr(flask_socketio, 'send')
            assert hasattr(flask_socketio, 'join_room')
            assert hasattr(flask_socketio, 'leave_room')
            assert hasattr(flask_socketio, 'Namespace')

            # Test that we can create a SocketIO instance
            socketio = SocketIO()
            assert socketio is not None

            # Test SocketIO methods exist
            assert hasattr(socketio, 'on')
            assert hasattr(socketio, 'emit')
            assert hasattr(socketio, 'send')
            assert hasattr(socketio, 'run')
            assert hasattr(socketio, 'init_app')

            # Test Namespace class
            class TestNamespace(Namespace):
                def on_connect(self):
                    pass
                def on_disconnect(self, reason):
                    pass

            namespace = TestNamespace('/test')
            assert namespace is not None
            assert hasattr(namespace, 'on_connect')
            assert hasattr(namespace, 'on_disconnect')
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: miguelgrinberg/Flask-SocketIO
    strip-prefix: v
