#nolint:valid-pipeline-git-checkout-tag
package:
  name: cg
  version: "0_git20251014"
  epoch: 1
  description: Chainguard's internal tool for working with packages, images, and vulnerabilities
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/mono

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/mono
      expected-commit: fdf0df18a6cd71c931138e87f24478c469e10595
      branch: main

  - uses: go/bump
    with:
      deps: |-
        github.com/nwaples/rardecode/v2@v2.2.0
        github.com/mholt/archives@v0.1.5-0.20251009205813-e30ac6010726
      modroot: ./cg

  - uses: go/build
    with:
      ldflags: |
        -X sigs.k8s.io/release-utils/version.gitVersion=${{package.version}}
        -X sigs.k8s.io/release-utils/version.gitCommit=$(git rev-parse HEAD)
        -X sigs.k8s.io/release-utils/version.buildDate=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")
      output: cg
      packages: .
      modroot: ./cg

  - uses: strip

update:
  enabled: false
  manual: true
  schedule:
    period: daily
    reason: Update automation doesn't yet support automating from private repos.
  git:

test:
  pipeline:
    - runs: |
        cg version
