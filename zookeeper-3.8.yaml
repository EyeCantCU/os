package:
  name: zookeeper-3.8
  version: "3.8.5.0"
  epoch: 0
  description: Distributed, highly available, robust, fault-tolerant system for distributed coordination
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash # some helper scripts use bash
      - merged-usrsbin
      - openjdk-17-default-jvm
      - wolfi-baselayout
      - xmlstarlet
    provides:
      - zookeeper=${{package.full-version}}

var-transforms:
  - from: ${{package.version}}
    match: \.(\d+)$
    replace: "-$1"
    to: mangled-package-version
  - from: ${{package.version}}
    match: ^(\d+\.\d+\.\d+)\.\d+$
    replace: "$1"
    to: short-package-version
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - maven
      - openjdk-17-default-jdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/zookeeper
      tag: release-${{vars.mangled-package-version}}
      expected-commit: 19f1842d4b6ee1f82cc8b05284959b26c6ae507d

  - runs: |
      export LANG=en_US.UTF-8
      export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
      # Don't fail the build on warnings, as Zookeeper 3.8 uses netty in a way
      # which generates a deprecation warning in newer versions
      sed -i '/-Werror/d' pom.xml
      mvn install -DskipTests
      tar -xf zookeeper-assembly/target/apache-zookeeper-${{vars.short-package-version}}-bin.tar.gz

      mkdir -p ${{targets.destdir}}/usr/share/java/zookeeper
      mkdir -p ${{targets.destdir}}/usr/share/java/zookeeper/bin
      mkdir -p ${{targets.destdir}}/usr/share/java/zookeeper/lib
      mkdir -p ${{targets.destdir}}/usr/share/java/zookeeper/conf
      mkdir -p ${{targets.destdir}}/usr/share/java/zookeeper/logs

      # Clean up windows files
      rm -rf apache-zookeeper-${{vars.short-package-version}}-bin/bin/*.cmd
      mv apache-zookeeper-${{vars.short-package-version}}-bin/lib/* ${{targets.destdir}}/usr/share/java/zookeeper/lib
      mv apache-zookeeper-${{vars.short-package-version}}-bin/bin/* ${{targets.destdir}}/usr/share/java/zookeeper/bin
      mv apache-zookeeper-${{vars.short-package-version}}-bin/conf/* ${{targets.destdir}}/usr/share/java/zookeeper/conf

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    description: "Compatibility package for iamguarded variant of Zookeeper"
    dependencies:
      provides:
        - zookeeper-iamguarded-compat=${{package.full-version}}
      runtime:
        - busybox
        - coreutils
        - glibc-locale-en
        - merged-usrsbin
        - netcat-openbsd
        - wolfi-baselayout
        - openssl
        - wait-for-port
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: zookeeper
          version: ${{vars.major-minor-version}}
      - runs: |
          mkdir -p /opt/iamguarded/zookeeper/
          mkdir -p /opt/iamguarded/zookeeper/bin
          mkdir -p /opt/iamguarded/zookeeper/conf
          mkdir -p /opt/iamguarded/zookeeper/conf.default
          mkdir -p /opt/iamguarded/zookeeper/logs
          mkdir -p /opt/iamguarded/scripts/zookeeper/

          cp -r ${{targets.destdir}}/usr/share/java/zookeeper/bin/* /opt/iamguarded/zookeeper/bin
          ln -s /usr/share/java/zookeeper/lib /opt/iamguarded/zookeeper/lib
          cp -r conf/* /opt/iamguarded/zookeeper/conf/
          cp -r conf/* /opt/iamguarded/zookeeper/conf.default

          # create symlinks for both /entrypoint.sh and /run.sh to make it compatible with iamguarded/zookeeper helm chart
          ln -sf /opt/iamguarded/scripts/zookeeper/entrypoint.sh ${{targets.contextdir}}/entrypoint.sh
          ln -sf /opt/iamguarded/scripts/zookeeper/run.sh ${{targets.contextdir}}/run.sh
      - uses: iamguarded/finalize-compat
        with:
          package: zookeeper
          version: ${{vars.major-minor-version}}
    test:
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: zookeeper
            version: ${{vars.major-minor-version}}
        - runs: |
            run-script --version
            run-script --help

update:
  enabled: true
  version-transform:
    - match: ^(.+)\-(\d+)$
      replace: $1.$2
  github:
    tag-filter: release-3.8
    identifier: apache/zookeeper
    strip-prefix: release-
    use-tag: true
