package:
  name: chart-iamguarded-cert-manager
  version: "1.4.16"
  epoch: 0
  description: cert-manager iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: cert-manager/${{package.version}}
      expected-commit: 03e13bf81d3c73fbd944e7e8dfce20ecc5076287

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/cert-manager

  - uses: charts/package
    with:
      chart-path: iamguarded/cert-manager

update:
  enabled: false
  manual: true
  schedule:
    period: daily
    reason: Update automation doesn't yet support automating from private repos.
  git:

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /cert-manager
