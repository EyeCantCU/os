package:
  name: py3-nvml
  version: "13.0.1"
  epoch: 0
  description: Python utilities for the NVIDIA Management Library
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: pynvml
  import: pynvml_utils
  ml-py-version-constraint: '<13'

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gpuopenanalytics/pynvml
      tag: ${{package.version}}
      expected-commit: 493a974f22ca8c8b30ee0755ae058365cd7ab76c

  - name: Check nvidia-ml-py version compatibility
    runs: |
      echo "Verifying nvidia-ml-py dependency in upstream pyproject.toml"
      if grep "nvidia-ml-py" pyproject.toml | grep '${{vars.ml-py-version-constraint}}'; then
        echo "nvidia-ml-py version is compatible."
      else
        echo "WARNING: nvidia-ml-py version is not compatible. Please check pyproject.toml and update the ml-py-version-constraint"
        exit 1
      fi

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-nvidia-ml-py${{vars.ml-py-version-constraint}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: gpuopenanalytics/pynvml
    use-tag: true
  ignore-regex-patterns:
    - x.x.x # Bad tag
