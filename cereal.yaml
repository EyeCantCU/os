package:
  name: cereal
  version: 1.3.2
  epoch: 0
  description: A C++11 library for serialization
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - boost-dev
      - build-base
      - busybox
      - doxygen
      - glibc-dev
      - rapidjson-dev
      - tree

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ebef1e929807629befafbb2918ea1a08c7194554
      repository: https://github.com/USCiLab/cereal
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      # Portability test needs 32-bit glibc-dev
      # Werror stuff is because assert statements are broken in release builds:
      # https://github.com/USCiLab/cereal/issues/262
      opts: |
        -DSKIP_PORTABILITY_TEST=ON \
        -DWITH_WERROR=OFF \

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    pipeline:
      - runs: |
          cd output/doc
          sed -i 's,^GENERATE_MAN.*,GENERATE_MAN = yes,' doxygen.cfg
          doxygen doxygen.cfg
          mkdir -p ${{targets.subpkgdir}}/usr/share
          mv man ${{targets.subpkgdir}}/usr/share
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: USCiLab/cereal
    strip-prefix: v

test:
  pipeline:
    - runs: |
        find /usr/include/${{package.name}}/ -name *.h
