package:
  name: opentofu-1.8
  version: 1.8.8
  epoch: 4
  copyright:
    - license: MPL-2.0
  dependencies:
    provides:
      - opentofu=${{package.full-version}}

environment:
  environment:
    CGO_ENABLED: 0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 79ca3090fc0c35359bb11486a49905b2ed860c9c
      repository: https://github.com/opentofu/opentofu
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/hashicorp/go-slug@v0.16.3
        github.com/go-jose/go-jose/v3@v3.0.4
      modroot: .

  - uses: go/build
    with:
      ldflags: -X 'github.com/opentofu/opentofu/version.dev=no'
      modroot: .
      output: tofu
      packages: ./cmd/tofu

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for opentofu
    dependencies:
      provides:
        - opentofu-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/tofu "${{targets.subpkgdir}}"/usr/local/bin
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            /usr/local/bin/tofu --version | grep -q "${{package.version}}"
            /usr/local/bin/tofu --help

  - name: ${{package.name}}-local-provider-config
    description: Configure opentofu to use local providers
    dependencies:
      provides:
        - opentofu-local-provider-config=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/opentofu/provider-mirror
          cat > "${{targets.subpkgdir}}"/opentofu/.opentofurc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "/opentofu/provider-mirror"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - runs: |
            grep "filesystem_mirror" /opentofu/.opentofurc

update:
  enabled: true
  ignore-regex-patterns:
    - 'rc'
    - 'beta'
  github:
    identifier: opentofu/opentofu
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v1.8

test:
  pipeline:
    - runs: |
        tofu --version
        tofu --help
    - name: tofu Initialization
      runs: |
        echo "provider \"local\" {}" > example.tf
        tofu init -input=false || exit 1
    - name: tofu Plan Creation
      runs: |
        tofu plan -input=false -out=tfplan || exit 1
    - name: tofu Apply Execution
      runs: |
        tofu apply -input=false tfplan || exit 1
