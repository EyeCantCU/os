package:
  name: py3-validators
  version: 0.35.0
  epoch: 0
  description: Python Data Validation for Humans™
  copyright:
    - license: MIT

vars:
  pypi-package: validators

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-validators/validators.git
      tag: ${{package.version}}
      expected-commit: 75788ed9e116fe3bf1bb9699f1696e7f7e132067

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | tee output.txt
            import validators
            print(validators.email('someone@example.com'))
            print(validators.ipv4('123.0.0.7'))
            print(validators.url('http://duck.com'))
            print(validators.url('http://example.com/">user@example.com'))
            EOF
            get_line() {
              sed -n "${1}p" output.txt | grep -E -e "${2}"
            }
            get_line 1 "True"
            get_line 2 "True"
            get_line 3 "True"
            get_line 4 "ValidationError"

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
