package:
  name: cgl
  version: "0.60.9"
  epoch: 1
  description: The COIN-OR Cut Generation Library (Cgl) is a collection of cut generators that can be used with other COIN-OR packages that make use of cuts, such as, among others, the linear solver Clp or the mixed integer linear programming solvers Cbc or BCP.
  copyright:
    - license: EPL-2.0
  dependencies:
    runtime:
      - lib${{package.name}}${{vars.abi}}

vars:
  abi: 1

environment:
  contents:
    packages:
      - build-base
      - busybox
      - clp-dev
      - coinutils-dev
      - gfortran
      - osi-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/coin-or/Cgl
      tag: releases/${{package.version}}
      expected-commit: 1d91b9ccb57eafbb7c07e994089a0f124358ffbd

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - runs: |
      mkdir docs
      (cd "${{targets.destdir}}" && tar -c usr/share/coin/doc) > docs.save
      rm -rf ${{targets.destdir}}/usr/share/coin/doc
      # remove one by one so we fail if upstream adds other content
      rmdir ${{targets.destdir}}/usr/share/coin
      rmdir ${{targets.destdir}}/usr/share

  - runs: |
      # Currently fails due to missing test files
      # make test

  - uses: strip

subpackages:
  - name: lib${{package.name}}${{vars.abi}}
    description: lib${{package.name}} library
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libCgl.so.${{vars.abi}} \
            "${{targets.contextdir}}/usr/lib"
          mv ${{targets.destdir}}/usr/lib/libCgl.so.${{vars.abi}}.* \
            "${{targets.contextdir}}/usr/lib"
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-dev
    description: ${{package.name}} development files
    dependencies:
      runtime:
        - lib${{package.name}}${{vars.abi}}=${{package.full-version}}
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: lib${{package.name}} docs
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"
          (cd "${{targets.contextdir}}" && tar xv) < docs.save
    test:
      pipeline:
        - uses: test/docs

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: coin-or/Cgl
    strip-prefix: releases/
