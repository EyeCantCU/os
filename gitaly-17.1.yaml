# source is gitlab so we can't use github updates to get expected commit
# let's still auto create the PR, it will fail as expected commit will be wrong
# however it will be easy to fix
#nolint:git-checkout-must-use-github-updates
package:
  name: gitaly-17.1
  version: 17.1.2
  epoch: 3
  description:
  copyright:
    - license: MIT
  dependencies:
    provides:
      - gitaly=${{package.full-version}}
    runtime:
      - gitaly-backup-${{vars.major-minor-version}}

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - build-base
      - busybox
      - curl-dev
      - expat-dev
      - go
      - openssl-dev
      - pcre2-dev
      - wolfi-base
      - zlib-dev
  environment:
    WITH_BUNDLED_GIT: YesPlease

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/gitlab-org/gitaly.git
      tag: v${{package.version}}
      expected-commit: 02bd57433f92c18bd589f3715f210b58642ce458

  - uses: go/bump
    with:
      deps: github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0 google.golang.org/grpc@v1.64.1

  - runs: |
      make install DESTDIR="${{targets.destdir}}" PREFIX=/usr

  - uses: strip

subpackages:
  - name: gitaly-git-${{vars.major-minor-version}}
    description: Bundled Git for Gitaly
    dependencies:
      provides:
        - gitaly-git=${{vars.major-minor-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/gitaly-git-* ${{targets.contextdir}}/usr/bin

  - name: gitaly-backup-${{vars.major-minor-version}}
    dependencies:
      provides:
        - gitaly-backup=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          mv ${{targets.destdir}}/usr/bin/gitaly-backup ${{targets.contextdir}}/usr/bin/

  - name: gitaly-init-cgroups-${{vars.major-minor-version}}
    # https://gitlab.com/gitlab-org/build/CNG/-/blob/master/gitaly-init-cgroups/Dockerfile
    description: gitaly-init-cgroups
    dependencies:
      provides:
        - gitaly-init-cgroups=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          packages: .
          modroot: ./tools/gitaly-init-cgroups/
          output: setup_cgroups

  - name: gitaly-init-cgroups-compat-${{vars.major-minor-version}}
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    dependencies:
      provides:
        - gitaly-init-cgroups-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/
          ln -sf /usr/bin/setup_cgroups "${{targets.contextdir}}"/setup_cgroups

update:
  enabled: true
  release-monitor:
    identifier: 373181

test:
  pipeline:
    - runs: |
        gitaly -v | grep "${{package.version}}"
        gitaly-blackbox -version | grep "${{package.version}}"
        gitaly-backup -v | grep "${{package.version}}"
