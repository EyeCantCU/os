package:
  name: request-4334
  version: 0
  epoch: 2
  description: Custom Certificate Chain for Danske Certs
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - request-1379=${{package.full-version}}
    runtime:
      - ca-certificates

environment:
  contents:
    packages:
      - apk-tools
      - bash
      - busybox
      - ca-certificates
      - ca-certificates-bundle
      - openssl

pipeline:
  - runs: |
      mkdir -p "${{targets.destdir}}"/etc/apk/
      mkdir -p "${{targets.destdir}}"/usr/bin/
      echo "https://artifactory.danskenet.net/artifactory/remote-alpine-cgr-extras" >> "${{targets.destdir}}"/etc/apk/danske-mirrors
      echo "https://artifactory.danskenet.net/artifactory/remote-alpine-wolfi-packages" >> "${{targets.destdir}}"/etc/apk/danske-mirrors
      cp ./entrypoint.sh "${{targets.destdir}}"/usr/bin/entrypoint.sh

      mkdir -p "${{targets.destdir}}"/usr/local/share/ca-certificates/
      cp ./usr/local/share/ca-certificates/danske-custom-certs.crt "${{targets.destdir}}"/usr/local/share/ca-certificates/danske-custom-certs.crt
      update-ca-certificates

test:
  environment:
    contents:
      packages:
        - bash
        - openssl
        - busybox
        - ca-certificates-bundle
        - ca-certificates
  pipeline:
    - runs: |
        #!/bin/bash
        openssl version

update:
  enabled: false
  manual: true
  exclude-reason: |
    Static Certificate Content for Danske Bank (intended for POV)
