# Adpated from:
package:
  name: azure-init
  version: 0.1.1
  epoch: 40
  description: A reference implementation for provisioning Linux VMs on Azure.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - busybox
      - clang
      - rust

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/Azure/Azure-init.git
      tag: v${{package.version}}
      expected-commit: d5b140be37f2992d55d31123961031637ff3ebb2

  - runs: |
      cargo build --all --release
      mkdir -p ${{targets.destdir}}/usr/bin/
      cp ./target/release/azure-init ${{targets.destdir}}/usr/bin/
      mkdir -p ${{targets.destdir}}/usr/lib/system/systemd/
      cp ./config/azure-provisioning-agent.service ${{targets.destdir}}/usr/lib/system/systemd/

      # In a perfect world this would be in the test section
      # And in fact you *can* install the tests but I don't want to
      # distribute the test binary or make a subpackage
      cargo test --verbose --all-features --workspace

update:
  enabled: true
  github:
    identifier: Azure/azure-init
    use-tag: true
    strip-prefix: v
