#nolint:git-checkout-must-use-github-updates
package:
  name: py3-polygraphy
  version: "0.49.26"
  epoch: 0
  description: A Deep Learning Inference Prototyping and Debugging Toolkit
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: polygraphy
  import: polygraphy

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  # The latest TensorRT tag contains the latest version of this package, but
  # it uses a different version scheme. We have to consult the source to
  # find this package's version. Example: TensorRT v10.11 contains 0.49.22:
  # https://github.com/NVIDIA/TensorRT/blob/v10.11/tools/Polygraphy/polygraphy/__init__.py
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/TensorRT
      tag: v10.11
      expected-commit: 9255eb39e6642787828a4c1f7fc1d09fe004e7a2

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
        working-directory: tools/Polygraphy
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            polygraphy --version
            polygraphy --help

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

# This tracks the latest version from pypi. pypi does not supply
# an sdist, so we can't build from there. Instead, we pull from the
# upstream git repo instead, but it is only updated when upstream does
# a new TensorRT release code dump.
update:
  enabled: true
  release-monitor:
    identifier: 194705
