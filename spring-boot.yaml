package:
  name: spring-boot
  version: "3.5.8"
  epoch: 0
  description:
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:

environment:
  contents:
    packages:
      - bash
      - busybox
      - gradle
      - libudev
      - maven
      - openjdk-17
      - openjdk-17-default-jvm
  environment:
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk
    LANG: en_US.UTF-8

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/spring-projects/spring-boot
      tag: v${{package.version}}
      expected-commit: 17f22c3ccedb419e9a58276c84336a2d0fc70727

  - name: "Remediate CVE-2025-48924"
    runs: |
      # this is already fixed in the main branch of spring-boot, see
      # https://github.com/spring-projects/spring-boot/commit/9ab2f4d08ef7ae0dc0cabb2c51edc8c1c497d768
      # this means in the next upstream release this step is likely to fail,
      # and you will just need to remove this pipeline step.
      sed -i 's/library("Commons Lang3", "3.17.0")/library("Commons Lang3", "3.18.0")/g' \
        spring-boot-project/spring-boot-dependencies/build.gradle

  - runs: |
      mkdir -p "${{targets.destdir}}/home/nonroot/.m2/repository/org/springframework/"
      mkdir -p "~/.m2/repository/org/springframework/boot/"

      export MAVEN_REPO=$(mvn help:evaluate -Dexpression=settings.localRepository -q -DforceStdout)
      ./gradlew publishToMavenLocal
      cp -rp "$MAVEN_REPO/org/springframework/boot/" "${{targets.contextdir}}/home/nonroot/.m2/repository/org/springframework/"

test:
  pipeline:
    - runs: |
        RESULTS=$(find /home/nonroot/.m2/repository/org/springframework/boot/ -iname '*spring-boot-${{package.version}}*.jar')
        if [[ -z "$RESULTS" ]]; then
            echo "Error: No matching files found."
            exit 1
        fi
        echo "Maven install successful"

update:
  enabled: true
  ignore-regex-patterns:
    - -M\d$ # Milestone releeases preceded RCs
    - -RC\d$ # Release candidates
  github:
    identifier: spring-projects/spring-boot
    strip-prefix: v
    use-tag: true
