package:
  name: spring-boot
  version: 3.5.0
  epoch: 0
  description:
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:

data:
  - name: openjdk-versions
    items:
      17: "openjdk-17"
      21: "openjdk-21"

environment:
  contents:
    packages:
      - bash
      - busybox
      - gradle
      - libudev
      - maven
      - openjdk-17
      - openjdk-17-default-jvm
  environment:
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk
    LANG: en_US.UTF-8

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/spring-projects/spring-boot
      tag: v${{package.version}}-M1
      expected-commit: 094693d0cb3414da207e304937cb1374a136452e

  - runs: |
      mkdir -p "${{targets.destdir}}/home/nonroot/.m2/repository/org/springframework/"
      mkdir -p "~/.m2/repository/org/springframework/boot/"

      export MAVEN_REPO=$(mvn help:evaluate -Dexpression=settings.localRepository -q -DforceStdout)
      ./gradlew publishToMavenLocal
      cp -rp "$MAVEN_REPO/org/springframework/boot/" "${{targets.contextdir}}/home/nonroot/.m2/repository/org/springframework/"

test:
  environment:
    contents:
      packages:
        - bash
        - busybox
        - libudev
  pipeline:
    - runs: |
        JARFILE="/home/build/.m2/repository/org/springframework/boot/spring-boot/${{package.version}}/spring-boot-${{package.version}}.jar"
        SNAPSHOT_JARFILE="/home/build/.m2/repository/org/springframework/boot/spring-boot/${{package.version}}-SNAPSHOT/spring-boot-${{package.version}}-SNAPSHOT.jar"
        if [ -f "$JARFILE" ] || [ -f "$SNAPSHOT_JARFILE" ]; then
          echo "Successfully installed spring-boot jars into Maven"
          exit 0
        else
          echo"Maven install was not successful"
          exit 1
        fi

update:
  enabled: true
  github:
    identifier: spring-projects/spring-boot
    strip-prefix: v
    strip-suffix: -M1
    use-tag: true
