package:
  name: prometheus-nats-exporter
  version: "0.17.2"
  epoch: 2
  description: A Prometheus exporter for NATS metrics
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - go
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7ed1b0b90d2cecf7572433337dd087cea67ccd25
      repository: https://github.com/nats-io/prometheus-nats-exporter
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        github.com/nats-io/nats-server/v2@v2.11.1

  - runs: |
      make build
      mkdir -p ${{targets.destdir}}/usr/bin
      install -Dm755 prometheus-nats-exporter ${{targets.destdir}}/usr/bin/

  - uses: strip

update:
  enabled: true
  github:
    identifier: nats-io/prometheus-nats-exporter
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    # AUTOGENERATED
    - runs: |
        prometheus-nats-exporter --version
        prometheus-nats-exporter --help
