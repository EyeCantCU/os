package:
  name: DCGM
  version: "4.4.1"
  epoch: 1
  description: "NVIDIA Data Center GPU Manager"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - fmt~10
      - ld-linux # so:ld-linux-x86-64.so.2 and so:ld-linux-aarch64.so.1=1
      - libboost-filesystem
      # Actually DCGM upstream tries to build both cuda11 and cuda12
      # builds at the same time, force a single build for now.
      # Possibly need DCGM-cuda11 build, which does full build, but
      # then only keeps the compiled 11 code paths.
      - nvidia-cuda-cudart-12.8
      - nvidia-dcgm-libdcgmmoduleprofiling
      - so:libc.so.6
      - so:libdl.so.2
      - so:libgcc_s.so.1
      - so:libm.so.6
      - so:libpthread.so.0
      - so:librt.so.1
      - so:libstdc++.so.6
      - so:libyaml-cpp.so.0.8
  options:
    no-depends: true

environment:
  contents:
    packages:
      - Catch2-2.13-dev
      - Catch2-2.13-static
      - bash
      - boost-dev
      - boost-static
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - coreutils
      - cuda-toolkit-13.0-dev
      - fmt-dev~10
      - gcc~14
      - jsoncpp-dev
      - jsoncpp-static
      - libevent-dev
      - libevent-static
      - nvidia-cuda-cccl-13.0
      - nvidia-cuda-culibos-13.0-dev
      - plog-dev
      - plog-static
      - tclap
      - yaml-cpp-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/NVIDIA/DCGM
      expected-commit: ca755f1487915935447be84e70c45d2d7b050f3c
      tag: v${{package.version}}

  - uses: patch
    with:
      patches: fix-build-update-boost-api.patch fix-build-boost-process-v1.patch fix-build-dont-link-against-boost-system.patch fix-link-ordering.patch coinstallability-workaround.patch

  - runs: |
      # code has unused variables in C code
      sed -i 's|-Werror|-Wno-error|' CMakeLists.txt

      # FindCuda expects a `target/<arch>` part of the path which we don't have
      sed -i '/unset(_Cuda_PATH)/ aset(_Cuda_TARGET_DIR "")' cmake/FindCuda.cmake

      # FindCuda doesn't look in /usr/local, so add it to the set of paths considered
      sed -i '/unset(_Cuda_PATH)/ alist(APPEND _Cuda_PATHS "/usr/local")' cmake/FindCuda.cmake

      # This is a bug in the upstream code. They reset the vector to 0, then try to access a value in a helper function
      # It only shows up in our builds since we build with _GLIBCXX_ASSERTIONS
      sed -i 's|gpuCounts = {};|gpuCounts.assign(gpuInfo.size(), 0);|' dcgmlib/src/DcgmTopology.cpp

  - uses: cmake/configure
    with:
      opts: |
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_INSTALL_PREFIX=/usr \
        -UDCGM_LIB_INSTALL_PREFIX \
        -UDCGM_PACKAGING \
        -UDCGM_PACKAGING_ENGINE \
        -DBUILD_TESTING=OFF \
        -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
        -DCMAKE_CXX_STANDARD=20

  - uses: cmake/build

  - uses: cmake/install

  - runs: |
      # Remove pre-built binaries (native and foreign arch)
      find ${{targets.destdir}}/usr/share/dcgm_tests -type f -executable -name '*_64bit' -delete
      find ${{targets.destdir}}/usr/share/dcgm_tests -type f -executable -name '*_aarch64' -delete
      find ${{targets.destdir}}/usr/share/dcgm_tests -type f -executable -name '*_ppc64le' -delete
      mv ${{targets.destdir}}/usr/sbin/* ${{targets.destdir}}/usr/bin/
      rmdir ${{targets.destdir}}/usr/sbin/

  - name: Remove older CUDA builds, which were built against the latest CUDA
    working-directory: ${{targets.contextdir}}
    runs: |
      for cuda_ver in 11 12; do
        rm usr/bin/dcgmproftester${cuda_ver}
        rm usr/lib/libdcgm_cublas_proxy${cuda_ver}.so*
        rm -r usr/libexec/datacenter-gpu-manager-4/plugins/cuda${cuda_ver}
        rm -r usr/share/dcgm_tests/apps/nvvs/plugins/cuda${cuda_ver}
        _arch=${{build.arch}}; case $_arch in x86_64) _arch="amd64" ;; aarch64) _arch="aarch64" ;; esac
        rm usr/share/dcgm_tests/apps/${_arch}/dcgmproftester${cuda_ver}
        rm usr/share/dcgm_tests/apps/${_arch}/libdcgm_cublas_proxy${cuda_ver}.so*
      done

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/dcgm/sdk_samples
          mv ${{targets.destdir}}/usr/src/datacenter-gpu-manager-4/sdk_samples/c_src ${{targets.contextdir}}/usr/local/dcgm/sdk_samples
          # Move libdcgm_cublas_proxy13.so* to subpackage from mainpackage to optimise main package size
          mv ${{targets.destdir}}/usr/lib/libdcgm_cublas_proxy13.so* ${{targets.contextdir}}/usr/lib/

  - name: ${{package.name}}-tests
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/share
          mv ${{targets.destdir}}/usr/share/dcgm_tests ${{targets.contextdir}}/usr/share

  - name: ${{package.name}}-nvvs
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/libexec
          mv ${{targets.destdir}}/usr/libexec/datacenter-gpu-manager-4 ${{targets.contextdir}}/usr/libexec/datacenter-gpu-manager-4

update:
  enabled: true
  github:
    identifier: NVIDIA/DCGM
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    - uses: test/tw/ver-check
      with:
        bins: "dcgmi nv-hostengine"
    - uses: test/tw/help-check
      with:
        bins: "dcgmi nv-hostengine"
    - uses: test/tw/ldd-check
      with:
        exclude-files: |
          "/bin/dcgmproftester13"
          "/sbin/dcgmproftester13"
          "/usr/bin/dcgmproftester13"
          "/usr/sbin/dcgmproftester13"
    - name: Run and test DCGM
      uses: test/daemon-check-output
      with:
        setup: |
          mkdir -p /var/run
          touch /var/run/nvhostengine.pid
        start: nv-hostengine --no-daemon
        timeout: 30
        expected_output: |
          Started host engine version
        post: |
          #!/bin/sh -e
          set -o pipefail
          dcgmi modules --list | grep -i Success
          dcgmi modules --list | grep -i Loaded
          dcgmi modules --list | grep -i Core
