package:
  name: chart-iamguarded-nginx
  version: "21.1.11"
  epoch: 2
  description: nginx iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: nginx/${{package.version}}
      expected-commit: dca55111ff8de39083ec2a5c298e219cfe39c82e

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/nginx

  - uses: charts/package
    with:
      chart-path: iamguarded/nginx

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: nginx/
    use-tag: true
    tag-filter-prefix: nginx/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /nginx
