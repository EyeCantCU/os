# These variables track the tag and expected commit for GitLab components that
# require manual intervention for updates. Please refer to the variables
# manifest that aligns with the CNG release tag set in the CNG package version
# below. The manifest can be found here:
# - https://gitlab.com/gitlab-org/build/CNG/-/blob/v<PACKAGE VERSION HERE>/ci_files/variables.yml
# Additionally, the latest 'gitaly-backup-fips' package (part of gitaly-fips), must be built first.
vars:
  # Container registry tags: https://gitlab.com/gitlab-org/container-registry/-/tags
  registry-commit: 138e64e2232c9721b6f31483d09cdb99b39dde37
  registry-tag: 'v4.27.0-gitlab'
  # Logger tags: https://gitlab.com/gitlab-org/cloud-native/gitlab-logger/-/tags
  logger-commit: 61e76054e898803f7c2408e7e54dfba96a5085fc
  logger-tag: 'v3.0.0'
  # Shell tags: https://gitlab.com/gitlab-org/gitlab-shell/-/tags
  shell-commit: 88d8b28634df958d51334f5312b46848687e75e7
  shell-tag: 'v14.45.2'
  # Runtime versions
  python-version: '3.9'
  # GitLab directories
  gitlab-home: /srv/gitlab

package:
  name: gitlab-cng-fips-18.4
  version: "18.4.5"
  epoch: 1
  description: Cloud Native container images per component of GitLab
  copyright:
    - license: MIT
  resources:
    cpu: 16
    memory: 24Gi
  dependencies:
    provides:
      - gitlab-cng-fips=${{package.full-version}}
    runtime:
      - openssl-config-fipshardened

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+\.\d+)\.\d+$
    replace: "$1"
    to: major-minor-version

environment:
  contents:
    packages:
      - busybox
      - ca-certificates
      - go-fips
      - heimdal-dev
      - icu-dev
      - py${{vars.python-version}}-pip
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/gitlab-org/build/CNG.git
      tag: v${{package.version}}
      expected-commit: e04e0519d8d75bad1a7e961d38a599cbebd2035b

  - name: Verify all the vars tags are up to date with the upstream
    runs: |
      # Runtime versions
      PYTHON_VERSION=$(yq -r '.variables.PYTHON_VERSION' ./ci_files/variables.yml | awk -F '.' '{print $1"."$2}')

      # Tags
      REGISTRY_TAG=$(yq -r '.variables.GITLAB_CONTAINER_REGISTRY_VERSION' ./ci_files/variables.yml)
      LOGGER_TAG=$(yq -r '.variables.GITLAB_LOGGER_VERSION' ./ci_files/variables.yml)
      SHELL_TAG=$(yq -r '.variables.GITLAB_SHELL_VERSION' ./ci_files/variables.yml)

      check_version() {
        local vars_name=$1
        local expected_value=$2
        local actual_value=$3

        if [ "$expected_value" != "$actual_value" ]; then
          echo "Error: Expected $vars_name: $expected_value but got: $actual_value"
          exit 1
        fi
      }

      # Check runtime versions
      check_version "python-version" "${{vars.python-version}}" "$PYTHON_VERSION"

      # Check tags
      check_version "registry-tag" "${{vars.registry-tag}}" "$REGISTRY_TAG"
      check_version "logger-tag" "${{vars.logger-tag}}" "$LOGGER_TAG"
      check_version "shell-tag" "${{vars.shell-tag}}" "$SHELL_TAG"

data:
  - name: scripts
    items:
      rails: ./gitlab-rails
      workhorse: ./gitlab-workhorse

subpackages:
  - range: scripts
    name: gitlab-${{range.key}}-scripts-fips-${{vars.major-minor-version}}
    dependencies:
      provides:
        - gitlab-${{range.key}}-scripts-fips=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/scripts
          cp -r ${{range.value}}/scripts/* ${{targets.contextdir}}/scripts/
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: gitlab-${{range.key}}-scripts-fips
            real-pkg-name: ${{subpkg.name}}

  - name: gitlab-base-fips-${{vars.major-minor-version}}
    dependencies:
      provides:
        - gitlab-base-fips=${{package.full-version}}
      runtime:
        - bash
        - bash-binsh
        - busybox
        - ca-certificates
        - coreutils
        - curl
        - gawk
        - gitlab-logger-fips-${{vars.major-minor-version}}=${{package.full-version}}
        - gomplate-fips
        - findutils
        - grep
        - less
        - openssl-config-fipshardened
        - procps
        - sed
        - tini
        - tzdata
        - xtail
    pipeline:
      - runs: |
          cd ./gitlab-base
          for script in $(find scripts/ -type f); do
            mkdir -p ${{targets.contextdir}}/$(dirname $script)
            cp $script ${{targets.contextdir}}/$script
          done
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: gitlab-base-fips
            real-pkg-name: ${{subpkg.name}}

  - name: gitlab-container-registry-fips-${{vars.major-minor-version}}
    description: The GitLab Container Registry originated as a fork of the Docker Distribution Registry, now CNCF Distribution, both distributed under Apache License Version 2.0.
    dependencies:
      provides:
        - gitlab-container-registry-fips=${{package.full-version}}
    pipeline:
      - uses: git-checkout
        with:
          repository: https://gitlab.com/gitlab-org/container-registry
          tag: ${{vars.registry-tag}}
          expected-commit: ${{vars.registry-commit}}
          destination: ./container-registry
      - working-directory: ./container-registry
        runs: |
          mkdir -p "${{targets.contextdir}}"/etc/docker/registry
      - uses: go/bump
        with:
          deps: |-
            github.com/go-jose/go-jose/v4@v4.0.5
            github.com/golang-jwt/jwt/v4@v4.5.2
            github.com/go-viper/mapstructure/v2@v2.4.0
            golang.org/x/crypto@v0.45.0
          modroot: ./container-registry
      - uses: go/build
        with:
          packages: ./cmd/registry
          output: registry
          tags: include_oss,include_gcs,continuous_profiler_stackdriver
          ldflags: |
            -X github.com/docker/distribution/version.Version=${{vars.registry-tag}}
            -X github.com/docker/distribution/version.Revision=$(git rev-parse HEAD || echo '<unknown>')
            -X github.com/docker/distribution/version.Package="github.com/docker/distribution"
            -X github.com/docker/distribution/version.BuildTime=$(date -d@${SOURCE_DATE_EPOCH} +%F-%T)
          modroot: ./container-registry
          go-package: go-fips-md5
    test:
      environment:
        contents:
          packages:
            - crane
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: gitlab-container-registry-fips
            real-pkg-name: ${{subpkg.name}}
        - uses: test/go-fips-check
          with:
            package-match: gitlab-container-registry-fips-${{vars.major-minor-version}}
        - runs: |
            #!/bin/bash

            # Create the configuration file
            tee /etc/docker/registry/config.yml <<EOL
            # This config file is a basic configuration using filesystem metadata and blob
            # storage.
            version: 0.1
            log:
              accesslog:
                disabled: false
                formatter: text
              level: info
              formatter: text
              fields:
                service: registry
            storage:
              delete:
                enabled: true
              filesystem:
                # Temp dir, rename if you need persistence.
                # registry/storage/paths.go describes the structure of the data
                # written to this directory
                rootdirectory: "/tmp/registry"
            http:
              # Registry API will be accessible at localhost:5000
              addr: :5000
              debug:
                addr: :5001
                prometheus:
                  enabled: true
                  path: /metrics
                pprof:
                  enabled: true
            EOL

            # Run the Docker registry with the configuration file
            registry serve /etc/docker/registry/config.yml &
            PID=$!

            # Wait for the registry to start
            sleep 5

            # Test the registry
            crane catalog localhost:5000

            # copy the image to the registry
            crane copy cgr.dev/chainguard/busybox:latest localhost:5000/busybox:latest

            # check for the image in the registry
            crane manifest localhost:5000/busybox:latest

            # Stop the registry
            kill $PID

  - name: gitlab-logger-fips-${{vars.major-minor-version}}
    description: GitLab Logger provides a means of wrapping non-structured log files within structure JSON.
    dependencies:
      provides:
        - gitlab-logger-fips=${{package.full-version}}
        - gitlab-logger-fips-compat=${{package.full-version}}
    pipeline:
      - uses: git-checkout
        with:
          repository: https://gitlab.com/gitlab-org/cloud-native/gitlab-logger
          tag: ${{vars.logger-tag}}
          destination: ./logger
      - uses: go/build
        with:
          packages: ./cmd/gitlab-logger
          output: gitlab-logger
          ldflags: |
            -X main.version=${component_version}
            -X main.buildtime=$(date -d@${SOURCE_DATE_EPOCH} +%F-%T)
          modroot: ./logger
          go-package: go-fips
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/bin
          ln -s /usr/bin/gitlab-logger ${{targets.contextdir}}/usr/local/bin/
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: gitlab-logger-fips
            real-pkg-name: ${{subpkg.name}}
        - uses: test/go-fips-check
          with:
            package-match: gitlab-logger-fips-${{vars.major-minor-version}}
        - runs: |
            gitlab-logger -h

  - name: gitlab-shell-fips-${{vars.major-minor-version}}
    description: SSH access for GitLab
    dependencies:
      provides:
        - gitlab-shell-fips=${{package.full-version}}
      runtime:
        - openssh
        - openssl-config-fipshardened
    pipeline:
      - uses: git-checkout
        with:
          repository: https://gitlab.com/gitlab-org/gitlab-shell
          tag: ${{vars.shell-tag}}
          expected-commit: ${{vars.shell-commit}}
          destination: ./shell
      - uses: go/bump
        with:
          deps: |-
            golang.org/x/oauth2@v0.27.0
            golang.org/x/crypto@v0.45.0
          modroot: ./shell
      - working-directory: ./shell
        runs: |
          make build

          BINDIR=${{targets.contextdir}}/srv/gitlab-shell/bin
          mkdir -p "${BINDIR}"

          install -m755 bin/gitlab-shell-check "${BINDIR}/gitlab-shell-check"
          install -m755 bin/gitlab-shell "${BINDIR}/gitlab-shell"
          install -m755 bin/gitlab-shell-authorized-keys-check "${BINDIR}/gitlab-shell-authorized-keys-check"
          install -m755 bin/gitlab-shell-authorized-principals-check "${BINDIR}/gitlab-shell-authorized-principals-check"
          install -m755 bin/gitlab-sshd "${BINDIR}/gitlab-sshd"

          mkdir -p ${{targets.contextdir}}/srv/gitlab-shell/
          cp LICENSE VERSION ${{targets.contextdir}}/srv/gitlab-shell/

          install -d ${{targets.contextdir}}/srv/sshd
          install -d ${{targets.contextdir}}/etc/ssh
          install -d ${{targets.contextdir}}/var/log/gitlab-shell
          touch ${{targets.contextdir}}/var/log/gitlab-shell/gitlab-shell.log
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: gitlab-shell-fips
            real-pkg-name: ${{subpkg.name}}
        - uses: test/go-fips-check
          with:
            package-match: gitlab-shell-fips-${{vars.major-minor-version}}

  - name: gitlab-webservice-ce-fips-${{vars.major-minor-version}}
    description: Webservice for GitLab CE FIPS ${{vars.major-minor-version}}
    dependencies:
      provides:
        - gitlab-webservice-ce-fips=${{package.full-version}}
      # https://gitlab.com/gitlab-org/build/CNG/-/blob/master/gitlab-webservice/Dockerfile
      runtime:
        - gitlab-base-fips-${{vars.major-minor-version}}=${{package.full-version}}
        - gitlab-rails-ce-fips-${{vars.major-minor-version}}
        - gitlab-rails-scripts-fips-${{vars.major-minor-version}}=${{package.full-version}}
        - py3.9-docutils
        - openssl-config-fipshardened
    pipeline:
      - runs: |
          # Install scripts
          mkdir -p ${{targets.contextdir}}/scripts
          cp -r ./gitlab-webservice/scripts/* ${{targets.contextdir}}/scripts/

          # Install configs
          mkdir -p ${{targets.contextdir}}/${{vars.gitlab-home}}/config
          cp -r ./gitlab-webservice/configuration/* ${{targets.contextdir}}/${{vars.gitlab-home}}/config/
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: gitlab-webservice-ce-fips
            real-pkg-name: ${{subpkg.name}}
        - uses: test/daemon-check-output
          with:
            start: /scripts/process-wrapper
            timeout: 30
            expected_output: |
              Puma starting in cluster mode
              Preloading application

  - name: gitlab-sidekiq-ce-fips-${{vars.major-minor-version}}
    description: Sidekiq for GitLab CE FIPS ${{vars.major-minor-version}}
    dependencies:
      provides:
        - gitlab-sidekiq-ce-fips=${{package.full-version}}
      # https://gitlab.com/gitlab-org/build/CNG/-/blob/master/gitlab-sidekiq/Dockerfile
      runtime:
        - cosign-fips
        - gitlab-base-fips-${{vars.major-minor-version}}=${{package.full-version}}
        - gitlab-rails-ce-fips-${{vars.major-minor-version}}
        - gitlab-rails-scripts-fips-${{vars.major-minor-version}}=${{package.full-version}}
        - openssh-client
        - openssl-config-fipshardened
        - py3.9-docutils
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/scripts
          cp -r ./gitlab-sidekiq/scripts/* ${{targets.contextdir}}/scripts/
    test:
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: gitlab-sidekiq-ce-fips
            real-pkg-name: ${{subpkg.name}}
        - uses: test/daemon-check-output
          with:
            start: /scripts/process-wrapper
            timeout: 30
            expected_output: |
              No queues found, you must select at least one queue

  - name: gitlab-toolbox-ce-fips-${{vars.major-minor-version}}
    description: Toolbox for GitLab CE FIPS ${{vars.major-minor-version}}
    options:
      no-provides: true
    dependencies:
      provides:
        - gitlab-toolbox-ce-fips=${{package.full-version}}
      # https://gitlab.com/gitlab-org/build/CNG/-/blob/master/gitlab-toolbox/Dockerfile
      runtime:
        - azcopy
        - gitaly-backup-fips-${{vars.major-minor-version}}
        - gitlab-base-fips-${{vars.major-minor-version}}=${{package.full-version}}
        - gitlab-rails-ce-fips-${{vars.major-minor-version}}
        - gitlab-rails-scripts-fips-${{vars.major-minor-version}}=${{package.full-version}}
        - gnutar
        - jq
        - openssl-config-fipshardened
        - openssl
        - redis-benchmark
        - redis-cli
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}
          # Packaging these would require packaging the Python 3.9 ecosystem again
          # which isn't ideal given Python 3.9 goes EOL in less than two months from
          # the time this has been introduced. When GitLab moves to 3.10, we can use
          # our existing packages
          pip install \
            --ignore-installed \
            --prefix=/usr --root=${{targets.contextdir}} \
            'awscli<2' crcmod gsutil PyOpenSSL s3cmd

          # Install scripts
          mkdir -p ${{targets.contextdir}}/usr/local/bin
          cp -r ./gitlab-toolbox/scripts/bin/* ${{targets.contextdir}}/usr/local/bin

          mkdir -p ${{targets.contextdir}}/usr/lib/ruby/vendor_ruby
          cp -r ./gitlab-toolbox/scripts/lib/* ${{targets.contextdir}}/usr/lib/ruby/vendor_ruby
    test:
      environment:
        environment:
          CONFIG_TEMPLATE_DIRECTORY: /srv/gitlab/config
      pipeline:
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: gitlab-toolbox-ce-fips
            real-pkg-name: ${{subpkg.name}}
        - runs: |
            entrypoint.sh echo "Hello, there!" | grep "Hello, there!"
        - uses: test/tw/ldd-check

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v18.4
  # FIPS tags are intentionally ignored. These are separate branches upstream
  # cuts to build FIPS based UBI images. They don't contain any other differences.
  ignore-regex-patterns:
    - "fips"
    - "-rc"
    - "-rc"
    - "-ubi8"
    - "-ee"

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/go-fips-check
    - uses: test/emptypackage
