package:
  name: chart-iamguarded-logstash
  version: "7.0.5"
  epoch: 2
  description: logstash iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: logstash/${{package.version}}
      expected-commit: 42959c00a308b3b1f155591076b5b6bee9322572

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/logstash

  - uses: charts/package
    with:
      chart-path: iamguarded/logstash

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: logstash/
    use-tag: true
    tag-filter-prefix: logstash/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /logstash
