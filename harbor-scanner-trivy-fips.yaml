package:
  name: harbor-scanner-trivy-fips
  version: 0.31.2
  epoch: 0
  description: Use Trivy as a plug-in vulnerability scanner in the Harbor registry
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - ca-certificates-bundle
      # for fips config & fips-provider
      - openssl-config-fipshardened
      # either melange SCA should provide these
      # or we should make go-fips shared link on these
      - so:libcrypto.so.3
      - so:libssl.so.3

pipeline:
  - uses: git-checkout
    with:
      expected-commit: b1811f7eaf8a99aebaa1702c9d9c1f03ee6b8865
      repository: https://github.com/aquasecurity/harbor-scanner-trivy
      tag: v${{package.version}}

  - uses: go/build
    with:
      packages: ./cmd/scanner-trivy
      output: scanner-trivy
      go-package: go-fips

  - uses: strip

test:
  pipeline:
    - runs: |
        # No version or help info
        scanner-trivy & sleep 3; kill $!

update:
  enabled: true
  github:
    identifier: aquasecurity/harbor-scanner-trivy
    strip-prefix: v
