package:
  name: istio-cni-fips-1.19
  version: 1.19.10
  epoch: 2
  description: Istio Container Network Interface
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - istio-cni-fips=${{package.full-version}}

# This package contains cni binaries. They can be copied out of Wolfi
# onto older host-os During build-time link against an older glibc, to
# ensure go-fips built cni remain ABI compatible with old foreign
# host-os. Majority of regular go-fips binaries/images do not need
# this.
environment:
  contents:
    packages:
      - oldglibc
  environment:
    CGO_CFLAGS: -I/usr/lib/oldglibc/include
    CGO_LDFLAGS: -L/usr/lib/oldglibc/lib

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/istio/istio
      tag: ${{package.version}}
      expected-commit: 745cdaa0dfdbeb31393fed75028a8c629c0f3a36

  - uses: go/bump
    with:
      deps: github.com/lestrrat-go/jwx@v1.2.29 google.golang.org/protobuf@v1.33.0 github.com/go-jose/go-jose/v3@v3.0.3

  - uses: go/build
    with:
      packages: ./cni/cmd/istio-cni
      output: istio-cni
      go-package: go-fips

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          # See https://github.com/istio/istio/blob/1.19.0/cni/deployments/kubernetes/Dockerfile.install-cni
          mkdir -p ${{targets.subpkgdir}}/opt/cni/bin
          ln -sf /usr/bin/istio-cni ${{targets.subpkgdir}}/opt/cni/bin/istio-cni
    dependencies:
      provides:
        - istio-cni-fips-compat=${{package.full-version}}

  - name: istio-install-cni-fips-1.19
    pipeline:
      - uses: go/build
        with:
          packages: ./cni/cmd/install-cni
          output: install-cni
          go-package: go-fips
          subpackage: true
    dependencies:
      provides:
        - istio-install-cni-fips=${{package.full-version}}

  - name: istio-install-cni-fips-1.19-compat
    pipeline:
      - runs: |
          # See https://github.com/istio/istio/blob/1.19.0/cni/deployments/kubernetes/Dockerfile.install-cni
          mkdir -p ${{targets.subpkgdir}}/usr/local/bin
          ln -sf /usr/bin/install-cni ${{targets.subpkgdir}}/usr/local/bin/install-cni
    dependencies:
      provides:
        - istio-install-cni-fips-compat=${{package.full-version}}

update:
  enabled: true
  github:
    identifier: istio/istio
    tag-filter: 1.19.
    use-tag: true
