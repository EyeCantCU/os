package:
  name: vendir-fips
  version: "0.45.0"
  epoch: 0 # CVE-2025-61725
  description: Easy way to vendor portions of git repos, github releases, helm charts, docker image contents, etc. declaratively
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: e26e4678949e10afc83827161b867d998edfc89f
      repository: https://github.com/carvel-dev/vendir
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/vendir
      output: vendir
      ldflags: -X carvel.dev/vendir/pkg/vendir/version.Version=v${{package.version}}

update:
  enabled: true
  github:
    identifier: carvel-dev/vendir
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        vendir --version
        vendir --help
    - name: version check
      runs: |
        vendir version | grep ${{package.version}}
    - uses: git-checkout
      with:
        expected-commit: e26e4678949e10afc83827161b867d998edfc89f
        repository: https://github.com/carvel-dev/vendir
        tag: v${{package.version}}
    - name: run sync
      runs: |
        cd examples/inline
        vendir sync
