package:
  name: step-fips
  version: 0.26.1
  epoch: 0
  description: A zero trust swiss army knife for working with X509, OAuth, JWT, OATH OTP, etc.
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/smallstep/cli
      tag: v${{package.version}}
      expected-commit: 576d8adba7daa388ff24827117bed7c418d7a923

  - uses: go/build
    with:
      modroot: ./cmd/step
      packages: .
      output: step
      ldflags: -X main.Version=${{package.version}}
      go-package: go-fips

update:
  enabled: true
  github:
    identifier: smallstep/cli
    strip-prefix: v
