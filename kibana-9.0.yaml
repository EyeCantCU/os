package:
  name: kibana-9.0
  version: "9.0.6"
  epoch: 0
  description: Your window into the Elastic Stack
  copyright:
    - license: Apache-2.0
    - license: BSD-3-Clause
    - license: Elastic-2.0
    - license: ISC
    - license: MIT
  resources:
    cpu: 30 # max is 48 for arm64
    memory: 48Gi
  dependencies:
    provides:
      - kibana=${{package.full-version}}
    runtime:
      - libnspr # needed for the @kbn/screenshotting-plugin/chromium package
      - libnss # needed for the @kbn/screenshotting-plugin/chromium package
      - merged-usrsbin
      - nodejs-20
      - wolfi-baselayout

# this will be resolved to 9 only
var-transforms:
  - from: ${{package.version}}
    match: ^(\d+)\.\d+\.\d+$
    replace: "$1"
    to: major-version

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - coreutils
      - jq
      - node-gyp
      - nodejs~20.19.4
      - python3
      - wget
      - yarn
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/elastic/kibana
      tag: v${{package.version}}
      expected-commit: 042db7248f4083cb1659298cf6a84625b71fbf58

  - uses: patch
    with:
      patches: node-version-bypass.patch enable-build-as-root.patch

  - runs: |
      export NODE_OPTIONS="--max-old-space-size=32768 --max-semi-space-size=8192"
      yarn install --force-install
      yarn kbn bootstrap --allow-root

      # builds fail in x86_64 CI without upping bazels available memory
      echo "startup --host_jvm_args=-Xmx48g" >> ~/.bazelrc
      node --optimize_for_size --gc-interval=100 scripts/build --release --skip-os-packages --skip-canvas-shareable-runtime --skip-docker-ubi --skip-docker-fips

  - runs: |
      mkdir -p "${{targets.destdir}}"/usr/share/kibana
      tar xf target/kibana-${{package.version}}-linux-*.tar.gz -C ${{targets.destdir}}/usr/share/kibana --strip-components=1

  - runs: |
      rm -rf "${{targets.destdir}}"/usr/share/kibana/node/glibc-217/bin/node
      ln -sf /usr/bin/node "${{targets.destdir}}"/usr/share/kibana/node/glibc-217/bin/node

# kibana should not be using the "strip" pipeline as the only binaries being stripped are
# ones provided by upstream - node and headless_shell browser ; it's better that our binaries
# match upstream content ; also, for headless_shell, modifying it causes kibana to report an
# error about SHA256 mismatch
subpackages:
  - name: ${{package.name}}-bitnami
    description: Your window into the Elastic Stack
    dependencies:
      provides:
        - kibana-bitnami=${{package.full-version}}
      runtime:
        - bash
        - busybox
        - coreutils
        - curl
        - libnss # needed for the @kbn/screenshotting-plugin/chromium package
        - libnspr # needed for the @kbn/screenshotting-plugin/chromium package
        - merged-usrsbin
        - nodejs-20
        - wolfi-baselayout
    pipeline:
      - uses: bitnami/compat
        with:
          image: kibana
          version-path: ${{vars.major-version}}/debian-12
      - runs: |
          # copied from https://github.com/bitnami/containers/blob/main/bitnami/kibana/8/debian-12/rootfs/opt/bitnami/scripts/kibana-env.sh#L79-L109
          mkdir -p ${{targets.contextdir}}/opt/bitnami/kibana
          mkdir -p ${{targets.contextdir}}/opt/bitnami/kibana/config.default
          mkdir -p ${{targets.contextdir}}/opt/bitnami/kibana/tmp
          mkdir -p ${{targets.contextdir}}/opt/bitnami/kibana/plugins.default
          mkdir -p ${{targets.contextdir}}/bitnami/kibana/data
          mkdir -p ${{targets.contextdir}}/bitnami/kibana/conf
          mkdir -p ${{targets.contextdir}}/docker-entrypoint-initdb.d

          cp -r ${{targets.destdir}}/usr/share/kibana/* ${{targets.subpkgdir}}/opt/bitnami/kibana

          # install necessary config
          install -m644 config/kibana.yml ${{targets.contextdir}}/opt/bitnami/kibana/config/kibana.yml
          cp -r config/* ${{targets.contextdir}}/opt/bitnami/kibana/config.default

          # sed all the scripts to use absolute path in the build environment
          find . -iname "*.sh" -exec sed 's#/opt/bitnami#${{targets.contextdir}}/opt/bitnami#g' -i {} \;

          # this script does some magic with env vars, templates, etc. etc.
          # it is easier to run it than figure out everything that it touches
          # the latest release of it, though, forgot to make it executable

          chmod +x ${{targets.contextdir}}/opt/bitnami/scripts/kibana/postunpack.sh
          ${{targets.contextdir}}/opt/bitnami/scripts/kibana/postunpack.sh

          # un-sed everything back to absolute /opt/bitnami prefix
          find ${{targets.contextdir}}/opt/bitnami -type f -exec sed 's#${{targets.contextdir}}##g' -i {} \;

          # Symlink binaries to path
          mkdir -p ${{targets.contextdir}}/usr/bin
          for i in ${{targets.contextdir}}/opt/bitnami/kibana/bin/*; do
            name=$(basename "$i")
            ln -sf /opt/bitnami/kibana/bin/"$name" ${{targets.contextdir}}/usr/bin/"$name"
          done
    test:
      environment:
        environment:
          BITNAMI_APP_NAME: kibana
        contents:
          packages:
            - yq
      pipeline:
        - name: run kibana entrypoint script
          uses: test/daemon-check-output
          with:
            start: /opt/bitnami/scripts/kibana/entrypoint.sh /opt/bitnami/scripts/kibana/run.sh
            timeout: 30
            expected_output: |
              Starting Kibana setup
        - uses: test/tw/ldd-check
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: kibana-bitnami
            real-pkg-name: ${{subpkg.name}}

  - name: ${{package.name}}-iamguarded
    description: Your window into the Elastic Stack
    dependencies:
      provides:
        - kibana-iamguarded=${{package.full-version}}
      runtime:
        - bash
        - busybox
        - coreutils
        - curl
        - libnss # needed for the @kbn/screenshotting-plugin/chromium package
        - libnspr # needed for the @kbn/screenshotting-plugin/chromium package
        - merged-usrsbin
        - nodejs-20
        - wolfi-baselayout
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: kibana
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /opt/iamguarded/kibana
          mkdir -p /opt/iamguarded/kibana/config.default
          mkdir -p /opt/iamguarded/kibana/tmp
          mkdir -p /opt/iamguarded/kibana/plugins.default
          mkdir -p /iamguarded/kibana/data
          mkdir -p /iamguarded/kibana/conf

          cp -r ${{targets.destdir}}/usr/share/kibana/* /opt/iamguarded/kibana

          # install necessary config
          install -m644 config/kibana.yml /opt/iamguarded/kibana/config/kibana.yml
          cp -r config/* /opt/iamguarded/kibana/config.default

          /opt/iamguarded/scripts/kibana/postunpack.sh

          # Symlink binaries to path
          mkdir -p ${{targets.contextdir}}/usr/bin
          for i in /opt/iamguarded/kibana/bin/*; do
            name=$(basename "$i")
            ln -sf /opt/iamguarded/kibana/bin/"$name" ${{targets.contextdir}}/usr/bin/"$name"
          done

          mkdir -p ${{targets.contextdir}}/docker-entrypoint-initdb.d
          chmod -R 775 ${{targets.contextdir}}/docker-entrypoint-initdb.d
      - uses: iamguarded/finalize-compat
        with:
          package: kibana
          version: ${{vars.major-version}}
    test:
      environment:
        accounts:
          groups:
            - groupname: elasticsearch
              gid: 1000
          users:
            - username: elasticsearch
              uid: 1000
              gid: 1000
          run-as: 0
        contents:
          packages:
            - yq
      pipeline:
        - uses: iamguarded/test-compat
          with:
            package: kibana
            version: ${{vars.major-version}}
        - name: run kibana entrypoint script
          uses: test/daemon-check-output
          with:
            start: /opt/iamguarded/scripts/kibana/entrypoint.sh /opt/iamguarded/scripts/kibana/run.sh
            timeout: 30
            expected_output: |
              Starting Kibana setup
        - uses: test/tw/ldd-check
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: kibana-iamguarded
            real-pkg-name: ${{subpkg.name}}

update:
  enabled: true
  github:
    identifier: elastic/kibana
    strip-prefix: v
    tag-filter-prefix: v9.0.

test:
  environment:
    contents:
      packages:
        - jq
  pipeline:
    - runs: |
        export HOME=/usr/share/kibana
        cd $HOME || exit
        ./node/glibc-217/bin/node src/cli/dist.js | head -n 1 | jq -r .config.serviceVersion.value | grep ${{package.version}}
    - uses: test/tw/ldd-check
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: kibana
        real-pkg-name: ${{package.name}}
