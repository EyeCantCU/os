# Creates meta-packages used internally in building other CUDA dependent packages like torch, vllm etc.
package:
  name: cuda-toolkit-11.8
  version: 11.8
  # version of the the cuda-toolkit and the run-time dependencies are tracked referencing NVIDIA's toolkit versions
  epoch: 5
  description: Meta-package for providing CUDA-toolkit packages
  copyright:
    - license: PROPRIETARY
  dependencies:
    runtime:
      - nvidia-cuda-cudart-11.8
      - nvidia-cuda-nvcc-11.8
      - nvidia-cuda-nvrtc-11.8
      - nvidia-cuda-nvtx-11.8
      - nvidia-libcublas-11.8
      - nvidia-libcufft-11.8
      - nvidia-libcurand-11.8
      - nvidia-libcusolver-11.8
      - nvidia-libcusparse-11.8

subpackages:
  - name: ${{package.name}}-dev
    description: Meta-package for providing CUDA-toolkit development packages
    dependencies:
      runtime:
        - nvidia-cuda-cudart-11.8-dev
        - nvidia-cuda-nvcc-11.8-dev
        - nvidia-cuda-nvml-dev-11.8
        - nvidia-cuda-nvrtc-11.8-dev
        - nvidia-cuda-nvtx-11.8-dev
        - nvidia-libcublas-11.8-dev
        - nvidia-libcufft-11.8-dev
        - nvidia-libcurand-11.8-dev
        - nvidia-libcusolver-11.8-dev
        - nvidia-libcusparse-11.8-dev
    test:
      pipeline:
        - uses: test/emptypackage

update:
  enabled: false

test:
  pipeline:
    - uses: test/emptypackage
