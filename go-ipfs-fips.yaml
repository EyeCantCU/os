package:
  name: go-ipfs-fips
  version: "0.34.1"
  epoch: 3
  description: An IPFS implementation in Go
  copyright:
    - license: MIT
  dependencies:
    provides:
      - kubo-fips

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - fuse3
      - go-fips
      - openssl # significantly reduces background CPU usage, but requires CGO and gcc

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 4649554b7120a340af3c141d7010cd1be5a3f231
      repository: https://github.com/ipfs/kubo
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0

  - runs: |
      CGO_ENABLED=1 GOOS=$(go env GOOS) GOARCH=$(go env GOARCH) GOFLAGS=-buildvcs=false make build GOTAGS=openssl
      install -m755 -D ./cmd/ipfs/ipfs "${{targets.destdir}}"/usr/bin/ipfs

  - runs: |
      # create fs-repo directory
      mkdir -p /data/ipfs
      # create mount points
      mkdir /ipfs /ipns

  - uses: strip

update:
  enabled: true
  github:
    identifier: ipfs/kubo
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
