package:
  name: kaniko-fips
  version: "1.24.0"
  epoch: 3
  description: Build Container Images In Kubernetes
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GoogleContainerTools/kaniko
      tag: v${{package.version}}
      expected-commit: 1d2bff595903b1887220a522a5a43c67db2da553

  - uses: go/build
    with:
      output: executor
      packages: ./cmd/executor
      ldflags: -X github.com/GoogleContainerTools/kaniko/pkg/version.Version=v${{package.version}}
      go-package: go-fips-md5

subpackages:
  - name: kaniko-warmer-fips
    pipeline:
      - uses: go/build
        with:
          output: warmer
          packages: ./cmd/warmer
          ldflags: -X github.com/GoogleContainerTools/kaniko/pkg/version.Version=v${{package.version}}
          go-package: go-fips-md5
    test:
      pipeline:
        - uses: test/go-fips-check
        - runs: |
            warmer --help

update:
  enabled: true
  github:
    identifier: GoogleContainerTools/kaniko
    strip-prefix: v
    use-tag: true
    tag-filter: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        executor --help
        executor version
