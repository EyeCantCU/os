package:
  name: py3-librosa
  version: 0.11.0
  epoch: 0
  description: Python package for music and audio analysis.
  copyright:
    - license: ISC

vars:
  pypi-package: librosa

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      # 3.10 fails due to scipy being compiled with older version of numpy
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/librosa/librosa.git
      tag: ${{package.version}}
      expected-commit: af8c839fb15317fa2712ea66e7a22da6a9267b32

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-audioread
        - py${{range.key}}-decorator
        - py${{range.key}}-joblib
        - py${{range.key}}-lazy-loader
        - py${{range.key}}-msgpack
        - py${{range.key}}-matplotlib
        - py${{range.key}}-numba
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-pooch
        - py${{range.key}}-scikit-learn
        - py${{range.key}}-scipy
        - py${{range.key}}-soundfile
        - py${{range.key}}-soxr
        - py${{range.key}}-typing-extensions
        - py${{range.key}}-standard-aifc
        - py${{range.key}}-standard-sunau
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            - file
            - py${{range.key}}-matplotlib
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF'
            import librosa
            import librosa.display
            import matplotlib.pyplot as plt
            import numpy as np
            import os

            # 1. Define the output file path
            output_filename = 'out.png'
            audio_file_key = 'nutcracker' # Using a built-in librosa example track

            # 2. Load the audio file
            y, sr = librosa.load(librosa.ex(audio_file_key))

            # 3. Compute the Mel-Spectrogram
            # n_mels=128 is a common parameter for machine learning tasks
            M = librosa.feature.melspectrogram(y=y, sr=sr, n_mels=128)

            # 4. Convert to a Decibel (dB) scale for visualization
            M_db = librosa.power_to_db(M, ref=np.max)

            # 5. Create a plot figure
            plt.figure(figsize=(10, 4))

            # 6. Display the Mel-Spectrogram
            librosa.display.specshow(M_db, x_axis='time', y_axis='mel', sr=sr, fmax=8000)
            plt.colorbar(format='%+2.0f dB')
            plt.title('Mel-Spectrogram')
            plt.tight_layout()

            # 7. Save the plot to a file
            # The figure is automatically saved to the current working directory
            plt.savefig(output_filename)

            # 8. Close the plot to free up memory (important in loops/batch processing)
            plt.close()

            print(f"Mel-Spectrogram image saved as: {os.path.abspath(output_filename)}")
            EOF
            stat ./out.png
            file ./out.png | grep -F -e "PNG image data, 1000 x 400"

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.pypi-package}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
