package:
  name: py3-librosa
  version: 0.11.0
  epoch: 0
  description: Python package for music and audio analysis.
  copyright:
    - license: ISC

vars:
  pypi-package: librosa

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/librosa/librosa.git
      tag: ${{package.version}}
      expected-commit: af8c839fb15317fa2712ea66e7a22da6a9267b32

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-audioread
        - py${{range.key}}-decorator
        - py${{range.key}}-joblib
        - py${{range.key}}-lazy-loader
        - py${{range.key}}-msgpack
        - py${{range.key}}-numba
        - py${{range.key}}-pooch
        - py${{range.key}}-scikit-learn
        - py${{range.key}}-scipy
        - py${{range.key}}-soundfile
        - py${{range.key}}-soxr
        - py${{range.key}}-typing-extensions
        - py${{range.key}}-standard-aifc
        - py${{range.key}}-standard-sunau
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/emptypackage
