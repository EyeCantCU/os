package:
  name: chart-iamguarded-rabbitmq-cluster-operator
  version: "4.4.34"
  epoch: 0
  description: rabbitmq-cluster-operator iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: rabbitmq-cluster-operator/${{package.version}}
      expected-commit: a9371f09098a7742890b222642885cc7965eeb76

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/rabbitmq-cluster-operator

  - uses: charts/package
    with:
      chart-path: iamguarded/rabbitmq-cluster-operator

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: rabbitmq-cluster-operator/
    use-tag: true
    tag-filter-prefix: rabbitmq-cluster-operator/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: rabbitmq-cluster-operator
