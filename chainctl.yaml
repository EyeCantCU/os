package:
  name: chainctl
  version: "0.2.160"
  epoch: 0 # CVE-2025-47907
  description: Chainguard CLI
  copyright:
    - license: custom

environment:
  contents:
    packages:
      - curl
      - wolfi-base

pipeline:
  - runs: |
      # https://edu.chainguard.dev/chainguard/administration/how-to-install-chainctl/#install-with-curl
      curl -o chainctl "https://dl.enforce.dev/chainctl/${{package.version}}/chainctl_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/aarch64/arm64/')"
      mkdir -p ${{targets.destdir}}/usr/bin
      install -m 0755 chainctl ${{targets.destdir}}/usr/bin

update:
  enabled: false
  exclude-reason: This package does not have public source code and is updated externally via an automated PR bot.

subpackages:
  - name: docker-credential-cgr
    description: Docker credential helper for Chainguard
    dependencies:
      runtime:
        - chainctl
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/bin
          ln -s /usr/bin/chainctl ${{targets.contextdir}}/usr/bin/docker-credential-cgr

          mkdir -p ${{targets.destdir}}/docker
          cp config.json ${{targets.destdir}}/docker
    test:
      environment:
        contents:
          packages:
            - jq
      pipeline:
        - runs: |
            which docker-credential-cgr
            cat /docker/config.json
            jq -r '.credHelpers["cgr.dev"]' < /docker/config.json | grep "^cgr$"

test:
  pipeline:
    - runs: |
        ls -lh /usr/bin/chainctl
        HOME=/home/user chainctl version | grep "^GitVersion:.*${{package.version}}$"
