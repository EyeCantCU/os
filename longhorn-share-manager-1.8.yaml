package:
  name: longhorn-share-manager-1.8
  version: 1.8.2
  epoch: 6 # GHSA-cgrx-mc8f-2prm
  description: Longhorn Share Manager manages NFS exports for RWX volumes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - longhorn-share-manager=${{package.full-version}}
    runtime:
      - blkid
      - blockdev
      - coreutils
      - dash-binsh
      - dbus
      - e2fsprogs
      - e2fsprogs-extra
      - mount
      - nfs-ganesha
      - nfs-utils
      - openssl
      - rpcbind
      - systemd
      - umount
      - util-linux
      - util-linux-misc
      - xfsprogs

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/longhorn/longhorn-share-manager.git
      tag: v${{package.version}}
      expected-commit: 6c69d0d8105e813097b61340f9f7173f9b2e6de8

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.27.0
        k8s.io/kubernetes@v1.32.8
        golang.org/x/net@v0.38.0
        github.com/opencontainers/selinux@v1.13.0

  - uses: go/build
    with:
      packages: .
      output: longhorn-share-manager
      ldflags: |
        -X main.Version=${{package.version}}

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for ${{package.name}}
    dependencies:
      provides:
        - longhorn-share-manager-compat=${{package.full-version}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}"/
          ln -s /usr/bin/longhorn-share-manager "${{targets.contextdir}}"/longhorn-share-manager
    test:
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-dangling: true

test:
  environment:
    contents:
      packages:
        - grpc-health-probe
    environment:
      FAST_FAILOVER: false
      LEASE_LIFETIME: 60
      GRACE_PERIOD: 30
  pipeline:
    - name: "Test binary help"
      uses: test/tw/help-check
      with:
        bins: longhorn-share-manager
    - name: "Functional test for daemon"
      uses: test/daemon-check-output
      with:
        setup: mkdir -p /tmp/test-volume
        start: longhorn-share-manager daemon --volume /tmp/test-volume --data-engine v1 --fs ext4
        expected_output: |
          Listening on share manager gRPC server :9600
        post: |
          grpc-health-probe -addr=localhost:9600 2>&1 | grep -q "SERVING"

update:
  enabled: true
  github:
    identifier: longhorn/longhorn-share-manager
    tag-filter-prefix: v1.8
    strip-prefix: v
    use-tag: true
  ignore-regex-patterns:
    - '.*-rc\d+$'
    - ".*-dev-.*"
