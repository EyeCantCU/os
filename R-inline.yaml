package:
  name: R-inline
  version: 0.3.21
  epoch: 0
  description: Inline C, C++ or Fortran functions in R
  copyright:
    - license: LGPL-2.0-or-later
  dependencies:
    runtime:
      - R
      - R-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cran/inline
      tag: ${{package.version}}
      expected-commit: d617c21c7470ab8aee5f51d45082fb416eac75a8

  - uses: R/build
    with:
      package: inline
      version: ${{package.version}}

  - uses: strip

test:
  pipeline:
    - runs: |
        Rscript -e 'library(inline)'
    - name: Test C function compilation with .C convention
      runs: |
        cat > /tmp/test_c_function.R << 'EOF'
        library(inline)

        # Test C function that squares numbers
        x <- as.numeric(1:10)
        n <- as.integer(10)

        code <- "
          for (int i=0; i < *n; i++) {
            x[i] = x[i] * x[i];
          }"

        squarefn <- cfunction(
          signature(n="integer", x="numeric"),
          code,
          convention=".C"
        )

        result <- squarefn(n, x)$x
        expected <- (1:10)^2

        if (!all(result == expected)) {
          stop("Test failed: C function did not square numbers correctly")
        }

        cat("Test passed: C function works correctly\n")
        EOF

        Rscript /tmp/test_c_function.R | grep -F "Test passed: C function works correctly"
    - name: Test C++ function compilation with .Call convention
      runs: |
        cat > /tmp/test_cpp_function.R << 'EOF'
        library(inline)

        # Test basic .Call convention
        code <- "
          SEXP result;
          PROTECT(result = Rf_allocVector(REALSXP, 1));
          REAL(result)[0] = REAL(x)[0] + REAL(y)[0];
          UNPROTECT(1);
          return result;
        "

        addfn <- cfunction(
          signature(x="numeric", y="numeric"),
          code
        )

        result <- addfn(5.5, 3.2)
        expected <- 8.7

        if (abs(result - expected) > 0.001) {
          stop("Test failed: C++ addition function incorrect")
        }

        cat("Test passed: .Call convention works correctly\n")
        EOF

        Rscript /tmp/test_cpp_function.R | grep -F "Test passed: .Call convention works correctly"
    - name: Test Fortran function compilation with .Fortran convention
      runs: |
        cat > /tmp/test_fortran_function.R << 'EOF'
        library(inline)

        # Test Fortran function that cubes numbers
        x <- as.numeric(1:10)
        n <- as.integer(10)

        code <- "
              integer i
              do 1 i=1, n(1)
            1 x(i) = x(i)**3
        "

        cubefn <- cfunction(
          signature(n="integer", x="numeric"),
          code,
          convention=".Fortran"
        )

        result <- cubefn(n, x)$x
        expected <- (1:10)^3

        if (!all(result == expected)) {
          stop("Test failed: Fortran function did not cube numbers correctly")
        }

        cat("Test passed: Fortran function works correctly\n")
        EOF

        Rscript /tmp/test_fortran_function.R | grep -F "Test passed: Fortran function works correctly"

update:
  enabled: true
  ignore-regex-patterns:
    - 'R-.*'
  github:
    identifier: cran/inline
    use-tag: true
