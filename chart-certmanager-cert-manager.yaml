package:
  name: chart-certmanager-cert-manager
  version: "1.19.2"
  epoch: 0
  description: A Helm chart for cert-manager
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - bash
      - busybox
      - curl
      - helm
      - make
      - yq

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cert-manager/cert-manager
      tag: v${{package.version}}
      expected-commit: 74deaf6232b9d40edf0f615eb0d7c713d121ea87

  # Use upstream's make target to build the helm chart
  # Override tools and their NEEDS_ prerequisites to use our packaged versions
  - runs: |
      make helm-chart VERSION=v${{package.version}} \
        HELM=/usr/bin/helm YQ=/usr/bin/yq \
        NEEDS_HELM= NEEDS_YQ=

  - uses: charts/package
    with:
      chart-path: _bin/helm/cert-manager
      chart-version: v${{package.version}}
      images: |
        controller:
          values:
            image:
              repository: ${registry_repo}
              tag: ${tag}
              digest: ${digest}
        webhook:
          values:
            webhook:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
        cainjector:
          values:
            cainjector:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
        acmesolver:
          values:
            acmesolver:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
        startupapicheck:
          values:
            startupapicheck:
              image:
                repository: ${registry_repo}
                tag: ${tag}
                digest: ${digest}
      test: |
        values:
          global:
            imagePullSecrets:
              - name: pull-secret
        cases:
          - name: default
            images: [controller, webhook, cainjector, acmesolver]
          - name: with-startupapicheck
            images: [controller, webhook, cainjector, acmesolver, startupapicheck]
            values:
              startupapicheck:
                enabled: true

test:
  pipeline:
    - uses: test/chart-standards

update:
  enabled: true
  github:
    identifier: cert-manager/cert-manager
    strip-prefix: v
    use-tag: true
    tag-filter-prefix: v
