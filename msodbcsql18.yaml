#nolint:valid-spdx-license
package:
  name: msodbcsql18
  version: 18.4.1.1
  epoch: 2
  description: "ODBC Driver for Microsoft(R) SQL Server(R)"
  copyright:
    - license: "MICROSOFT SOFTWARE LICENSE"
    - license: "https://odbceula.blob.core.windows.net/eula18/LICENSE18.TXT"
  dependencies:
    runtime:
      - glibc-iconv
    # This overwrites the /etc/odbcinst.ini file.
    provides:
      - unixodbc-config

environment:
  contents:
    packages:
      - busybox
      - curl
      - dpkg-dev
      - gnutar
      - unixodbc # So we can install the file
      - xz

pipeline:
  # Make sure that one of the legs of the `fetch` pipeline is executed.
  # Note we don't extract since we need to use the `dpkg-deb` tool to extract.
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == "x86_64"
        uses: fetch
        with:
          uri: https://packages.microsoft.com/ubuntu/22.04/prod/pool/main/m/msodbcsql18/msodbcsql18_${{package.version}}-1_amd64.deb
          expected-sha256: 4d1036224ed11259bea297158c5e40884f6d24b274997cff5fe0ec53aafbd70c
          extract: false
      - if: ${{build.arch}} == "aarch64"
        uses: fetch
        with:
          uri: https://packages.microsoft.com/ubuntu/22.04/prod/pool/main/m/msodbcsql18/msodbcsql18_${{package.version}}-1_arm64.deb
          expected-sha256: b1a394d00e0629c862257b9b09507ca712cff7cc4d20f486d4e108bfec164255
          extract: false

  - runs: |
      mkdir -p ${{targets.destdir}}/${{package.name}}
      dpkg-deb -x ./*.deb ${{targets.destdir}}

  # Install this as a driver for ODBC.
  - runs: |
      mkdir -p ${{targets.destdir}}/etc
      odbcinst -i -d -f ${{targets.destdir}}/opt/microsoft/msodbcsql18/etc/odbcinst.ini
      mv /etc/odbcinst.ini ${{targets.destdir}}/etc/odbcinst.ini

test:
  environment:
    contents:
      packages:
        - bash
        - mssql-tools18 # for sqlcmd
  pipeline:
    - runs: |
        /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 >/tmp/sqlout 2>&1 || true
        echo "Got the following output from sqlcmd:"
        cat /tmp/sqlout
        grep "A network-related or instance-specific error has occurred while establishing a connection to 127.0.0.1." /tmp/sqlout

update:
  enabled: false
  exclude-reason: "https://github.com/chainguard-dev/internal-dev/issues/1409"
