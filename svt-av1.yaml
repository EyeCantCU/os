package:
  name: svt-av1
  version: 3.1.0
  epoch: 0
  description: The Scalable Video Technology for AV1 (SVT-AV1 Encoder) is an AV1-compliant software encoder library.
  copyright:
    - license: BSD-3-Clause-Clear

environment:
  contents:
    packages:
      - build-base
      - nasm

pipeline:
  - uses: git-checkout
    with:
      repository: https://gitlab.com/AOMediaCodec/SVT-AV1.git
      tag: v${{package.version}}
      expected-commit: cc569c1eb16832b7f1a649cac0b3bd1a8e4a814d

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

update:
  enabled: true
  release-monitor:
    identifier: 24271

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development libraries and headers
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/pkgconf

test:
  pipeline:
    - uses: test/tw/ldd-check
    - name: Smoke tests
      runs: |
        set -o pipefail
        SvtAv1EncApp --help | grep -F -e "Usage: SvtAv1EncApp <options>"
        SvtAv1EncApp --version | grep -F -e "${{package.version}}"
