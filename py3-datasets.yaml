package:
  name: py3-datasets
  version: "4.0.0"
  epoch: 1
  description: Hugging Face datasets
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: datasets
  import: datasets

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/huggingface/datasets
      tag: ${{package.version}}
      expected-commit: b0de7a8d787b83c1fe0780e4960364e2171c8c36

  - runs: |
      # Fail if pins change so we can bump
      grep '"dill>=0.3.0,<0.3.9",  # tmp pin until dill has official support for determinism see https://github.com/uqfoundation/dill/issues/19' setup.py
      grep '"fsspec\[http\]>=2023.1.0,<=2025.3.0"' setup.py
      grep '"multiprocess<0.70.17",  # to align with dill<0.3.9 (see above)' setup.py

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-dill<0.3.9
        - py${{range.key}}-filelock
        - py${{range.key}}-fsspec~2025.3.0
        - py${{range.key}}-huggingface-hub
        - py${{range.key}}-multiprocess<0.70.17
        - py${{range.key}}-numpy<2.0
        - py${{range.key}}-packaging
        - py${{range.key}}-pandas
        - py${{range.key}}-pyarrow
        - py${{range.key}}-pyyaml
        - py${{range.key}}-requests
        - py${{range.key}}-tqdm
        - py${{range.key}}-xxhash
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            datasets-cli --help

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-dill<0.3.9
        - py3.10-fsspec~2025.3.0
        - py3.10-multiprocess<0.70.17
        - py3.11-dill<0.3.9
        - py3.11-fsspec~2025.3.0
        - py3.11-multiprocess<0.70.17
        - py3.12-dill<0.3.9
        - py3.12-fsspec~2025.3.0
        - py3.12-multiprocess<0.70.17
        - py3.13-dill<0.3.9
        - py3.13-fsspec~2025.3.0
        - py3.13-multiprocess<0.70.17
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: huggingface/datasets
