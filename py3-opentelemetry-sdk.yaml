package:
  name: py3-opentelemetry-sdk
  version: 1.37.0
  epoch: 0
  description: OpenTelemetry Python SDK
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3-supported-hatchling
      - py3-supported-pip
      - py3-supported-python
      - py3-supported-setuptools
      - py3-supported-wheel

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

vars:
  pypi-package: opentelemetry-sdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/open-telemetry/opentelemetry-python
      tag: v${{package.version}}
      expected-commit: bc413fcf74a380cf62428a130ead61ff1683494a

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-opentelemetry-api
        - py${{range.key}}-opentelemetry-semantic-conventions
        - py${{range.key}}-typing-extensions
    pipeline:
      - working-directory: opentelemetry-sdk
        pipeline:
          - uses: py/pip-build-install
            with:
              python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              from opentelemetry import sdk
        - name: Test TracerProvider creation
          runs: |
            python${{range.key}} <<'EOF' | grep -F -e "Tracer"
            from opentelemetry.sdk.trace import TracerProvider
            from opentelemetry.sdk.resources import Resource

            # Create a resource
            resource = Resource.create({"service.name": "test-service"})
            tracer_provider = TracerProvider(resource=resource)

            tracer = tracer_provider.get_tracer(__name__)
            print(tracer)
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: open-telemetry/opentelemetry-python
    strip-prefix: v
    use-tag: true
