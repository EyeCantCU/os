package:
  name: aws-ebs-csi-driver-1.18
  version: 1.18.0
  epoch: 16
  description: CSI driver for Amazon EBS.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - blkid
      - blockdev
      - e2fsprogs
      - e2fsprogs-extra
      - lsblk
      - mount
      - xfsprogs
    provides:
      - aws-ebs-csi-driver=1.18

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - go
      - mount
      - umount
      - wolfi-baselayout

pipeline:
  # We can't use go/install because this requires specific ldflags to set the version
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/aws-ebs-csi-driver
      tag: v${{package.version}}
      expected-commit: cfe3673b921dd2f50e023371d54fdb2dd219c7a0

  - runs: |
      go mod edit -droprequire=k8s.io/client-go

  - uses: go/bump
    with:
      deps: google.golang.org/grpc@v1.56.3 google.golang.org/protobuf@v1.33.0 github.com/golang/protobuf@v1.5.4 golang.org/x/net@v0.23.0 k8s.io/kubernetes@v1.27.13
      replaces: k8s.io/apiserver=k8s.io/apiserver@v0.27.13 k8s.io/client-go=k8s.io/client-go@v0.27.13 k8s.io/api=k8s.io/api@v0.27.13 k8s.io/apimachinery=k8s.io/apimachinery@v0.27.13

  - runs: |
      # Our global LDFLAGS conflict with a Makefile parameter
      unset LDFLAGS
      make ARCH=$(go env GOARCH)
      mkdir -p ${{targets.destdir}}/usr/bin
      cp bin/aws-ebs-csi-driver ${{targets.destdir}}/usr/bin/

  - uses: strip

update:
  enabled: false
