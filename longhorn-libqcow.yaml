package:
  name: longhorn-libqcow
  version: "1.0.0"
  epoch: 0
  description: "Longhorn's fork of libqcow"
  copyright:
    - license: LGPL-3.0 AND GPL-3.0

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - fuse2-dev
      - gettext
      - gettext-dev
      - libtool
      - openssl-dev
      - pkgconf
      - pkgconf-dev
      - wolfi-base
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/longhorn/libqcow
      tag: v${{package.version}}
      expected-commit: be16287a2b9691347936be43fcffe93b8f74cf54

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: "longhorn-qcowtools"
    description: "Longhorn's Utilities to work with QEMU Copy-On-Write (QCOW) image files."
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mv "${{targets.destdir}}"/usr/bin/* "${{targets.subpkgdir}}"/usr/bin/
    dependencies:
      runtime:
        - longhorn-libqcow=${{package.full-version}}
    test:
      environment:
        contents:
          packages:
            - qemu
      pipeline:
        - uses: test/tw/ldd-check
        - name: "Test binary help"
          uses: test/tw/help-check
          with:
            bins: qcowinfo qcowmount
        # excluding version checks since they don't match the package.full-version
        - name: "Test with invalid qcow2"
          runs: |
            touch random.qcow2
            qcowinfo random.qcow2 2>&1 | grep "invalid file"
            qcowmount random.qcow2 /tmp/mountpoint 2>&1 | grep "invalid file"
        - name: "Test with valid qcow2"
          runs: |
            qemu-img create -f qcow2 test.qcow2 1M
            qcowinfo test.qcow2 | grep -F "QEMU Copy-On-Write (QCOW) image information"
            # qcowmount requires /dev/fuse which is not available in Docker runner
            # but works with qemu runner
            if [ -c /dev/fuse ]; then
              mkdir -p /tmp/mountpoint
              qcowmount test.qcow2 /tmp/mountpoint | grep qcowmount
              ls /tmp/mountpoint | grep qcow1
            else
              echo "SKIP: qcowmount test (no /dev/fuse)"
            fi

  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    description: "Longhorn's libqcow dev package"
    dependencies:
      runtime:
        - longhorn-libqcow=${{package.full-version}}
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    pipeline:
      - uses: split/manpages
    description: "Longhorn's libqcow manpages"
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  github:
    identifier: longhorn/libqcow
    use-tag: true

test:
  pipeline:
    - uses: test/tw/ldd-check
