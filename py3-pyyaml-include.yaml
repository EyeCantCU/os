package:
  name: py3-pyyaml-include
  version: "2.2"
  epoch: 0
  description: Extend PyYAML with a custom constructor for including YAML files within YAML files.
  copyright:
    - license: GPL-3.0-or-later

vars:
  pypi-package: pyyaml-include
  import: yaml_include

data:
  - name: py-versions
    items:
      # 3.10: '310' # 3.10 requires typing_extensions module and others don't. skip 3.10 build here.
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - py3-supported-build-base
      - py3-supported-build-base-dev
      - python3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/tanbro/pyyaml-include
      tag: v${{package.version}}
      expected-commit: 3e0db562a7b03fa1bf5cbe392c47658042596dd0

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-pyyaml
        - py${{range.key}}-fsspec
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            imports: |
              import ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  git:
    strip-prefix: v
