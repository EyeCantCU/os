# Although NVIDIA DCGM is open sourced, a particular shared library libdcgmmoduleprofiling.so is proprietary
# It can be only accessed through downloading from NVIDIA mirrors and is needed for Profiling metrics in DCGM-exporter image
# For reference: https://github.com/NVIDIA/DCGM/issues/71#issuecomment-1502364022
package:
  name: nvidia-dcgm-libdcgmmoduleprofiling
  version: 4.1.1
  epoch: 0
  description: NVIDIA Data Center GPU Manager (DCGM) Profiling module
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true

environment:
  contents:
    packages:
      - binutils
      - busybox
      - dpkg
      - wget

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/sbsa/datacenter-gpu-manager-4-proprietary_${{package.version}}_arm64.deb"
          expected-sha512: "8350a4ec063fdd148d4feb0e1e0c8d7d6bf8bffa3a6220d81abef50a9bbfc6b4652ae1bdc4adc39928800e259f7e70b3ea8a0f64523c3e87334e62bec032d6de"
          extract: false
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64/datacenter-gpu-manager-4-proprietary_${{package.version}}_amd64.deb"
          expected-sha512: "e0c207c72db667e0458d691b7a340b41790cbb86851346a21620eeee0dcceba5293648b7b0c5faed6accd0482a0f6e9d124e164fed746788fbe3ab022b5cb0b7"
          extract: false
          timeout: 30

  - runs: |
      mkdir -p /tmp/arch
      if [[ "${{build.arch}}" == "aarch64" ]]; then
        ar x datacenter-gpu-manager-4-proprietary_${{package.version}}_arm64.deb
      else
        ar x datacenter-gpu-manager-4-proprietary_${{package.version}}_amd64.deb
      fi

      tar -xf data.tar.gz -C /tmp/arch

      mkdir -p ${{targets.destdir}}/usr/lib
      cp -a /tmp/arch/usr/lib/${{build.arch}}-linux-gnu/libdcgmmoduleprofiling.so.* "${{targets.destdir}}/usr/lib/"
      cp -a /tmp/arch/usr/lib/${{build.arch}}-linux-gnu/libnvperf_dcgm_host.so "${{targets.destdir}}/usr/lib/"

test:
  pipeline:
    - runs: |
        # Check for library
        stat /usr/lib/libdcgmmoduleprofiling.so.4

update:
  enabled: true
  manual: true
  github:
    identifier: NVIDIA/DCGM
    strip-prefix: v
    tag-filter: v
    use-tag: true
