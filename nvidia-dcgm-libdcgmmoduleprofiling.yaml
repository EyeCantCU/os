# Although NVIDIA DCGM is open sourced, a particular shared library libdcgmmoduleprofiling.so is proprietary
# It can be only accessed through downloading from NVIDIA mirrors and is needed for Profiling metrics in DCGM-exporter image
# For reference: https://github.com/NVIDIA/DCGM/issues/71#issuecomment-1502364022
package:
  name: nvidia-dcgm-libdcgmmoduleprofiling
  version: 4.4.1
  epoch: 0
  description: NVIDIA Data Center GPU Manager (DCGM) Profiling module
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true

environment:
  contents:
    packages:
      - binutils
      - busybox
      - dpkg
      - wget

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/sbsa/datacenter-gpu-manager-4-proprietary_${{package.version}}-1_arm64.deb"
          expected-sha512: "bbb6b4654990d4e41360262c4016a30f31095ada5ff9b91d2b9678686f92b0f65ad52e566442bed23447a6dc0cc7ab71a72d0fc11966967202081b1379806049"
          extract: false
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64/datacenter-gpu-manager-4-proprietary_${{package.version}}-1_amd64.deb"
          expected-sha512: "9a2f93514fb791ce32d121f6a67e224a355c0c56517895c76487bb367c4212b54b520d98eee797c60e5e22813a86a7c5d537f642544fec4a0af807735c696c45"
          extract: false
          timeout: 30

  - runs: |
      mkdir -p /tmp/arch
      if [[ "${{build.arch}}" == "aarch64" ]]; then
        ar x datacenter-gpu-manager-4-proprietary_${{package.version}}-1_arm64.deb
      else
        ar x datacenter-gpu-manager-4-proprietary_${{package.version}}-1_amd64.deb
      fi

      tar -xf data.tar.gz -C /tmp/arch

      mkdir -p ${{targets.destdir}}/usr/lib
      cp -a /tmp/arch/usr/lib/${{build.arch}}-linux-gnu/libdcgmmoduleprofiling.so.* "${{targets.destdir}}/usr/lib/"
      cp -a /tmp/arch/usr/lib/${{build.arch}}-linux-gnu/libnvperf_dcgm_host.so "${{targets.destdir}}/usr/lib/"

test:
  pipeline:
    - runs: |
        # Check for library
        stat /usr/lib/libdcgmmoduleprofiling.so.4

update:
  enabled: true
  github:
    identifier: NVIDIA/DCGM
    strip-prefix: v
    tag-filter: v
    use-tag: true
