# Although NVIDIA DCGM is open sourced, a particular shared library libdcgmmoduleprofiling.so is proprietary
# It can be only accessed through downloading from NVIDIA mirrors and is needed for Profiling metrics in DCGM-exporter image
# For reference: https://github.com/NVIDIA/DCGM/issues/71#issuecomment-1502364022
package:
  name: nvidia-dcgm-libdcgmmoduleprofiling
  version: 3.3.8
  epoch: 1
  description: NVIDIA Data Center GPU Manager (DCGM) Profiling module
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true

environment:
  contents:
    packages:
      - busybox
      - wget
      - dpkg
      - binutils

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/sbsa/datacenter-gpu-manager_${{package.version}}_arm64.deb"
          expected-sha256: "0861d732fc38afee80361733a1941ad0b05328fc3f49ef885074a4226348ee8a"
          extract: false
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2204/x86_64/datacenter-gpu-manager_${{package.version}}_amd64.deb"
          expected-sha256: "dd852f6c87461d19495fff686ce55e556b212f8e80889e3e55d126ef7fe71a79"
          extract: false
          timeout: 30

  - runs: |
      mkdir -p /tmp/arch
      if [[ "${{build.arch}}" == "aarch64" ]]; then
        ar x datacenter-gpu-manager_${{package.version}}_arm64.deb
      else
        ar x datacenter-gpu-manager_${{package.version}}_amd64.deb
      fi

      tar -xf data.tar.gz -C /tmp/arch

      mkdir -p ${{targets.destdir}}/usr/lib
      cp -a /tmp/arch/usr/lib/${{build.arch}}-linux-gnu/libdcgmmoduleprofiling.so.* "${{targets.destdir}}/usr/lib/"
      cp -a /tmp/arch/usr/lib/${{build.arch}}-linux-gnu/libnvperf_dcgm_host.so "${{targets.destdir}}/usr/lib/"

test:
  pipeline:
    - runs: |
        # Check for library
        stat /usr/lib/libdcgmmoduleprofiling.so.3

update:
  enabled: true
  manual: true
  github:
    identifier: NVIDIA/DCGM
    strip-prefix: v
    tag-filter: v
    use-tag: true
