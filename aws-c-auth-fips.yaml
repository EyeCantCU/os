package:
  name: aws-c-auth-fips
  version: "0.9.0"
  epoch: 0
  description: "C99 library implementation of AWS client-side authentication: standard credentials providers and signing (FIPS)"
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - aws-c-auth=${{package.full-version}}
    provider-priority: 20

environment:
  contents:
    packages:
      - aws-c-cal-fips-dev
      - aws-c-common-dev
      - aws-c-compression-dev
      - aws-c-http-fips-dev
      - aws-c-io-fips-dev
      - aws-c-sdkutils-dev
      - aws-lc-fips-dev
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - s2n-tls-fips-dev
      - samurai
  environment:
    CMAKE_PREFIX_PATH: /usr/lib/aws-lc
    CFLAGS: "-I/usr/include/aws-lc"

pipeline:
  - uses: git-checkout
    with:
      expected-commit: cd9d6afcd42035d49bb2d0d3bef24b9faed57773
      repository: https://github.com/awslabs/aws-c-auth
      tag: v${{package.version}}

  - uses: cmake/configure
    with:
      opts: |
        -DBUILD_SHARED_LIBS=True \
        -DCMAKE_BUILD_TYPE=None \
        -DBUILD_TESTING=OFF \
        -DCMAKE_SYSTEM_NAME=Linux \
        -DCMAKE_HOST_SYSTEM_NAME=Linux

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: aws-c-auth-fips-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - aws-c-auth-fips
      provides:
        - aws-c-auth-dev=${{package.full-version}}
      provider-priority: 20
    description: aws-c-auth-fips dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

test:
  pipeline:
    - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: awslabs/aws-c-auth
    strip-prefix: v
    use-tag: true
