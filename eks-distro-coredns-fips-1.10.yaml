package:
  name: eks-distro-coredns-fips-1.10
  version: 1.10.1
  epoch: 5
  description: CoreDNS is a DNS server that chains plugins
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - eks-distro-coredns=${{package.full-version}}
    runtime:
      # for fips config & fips-provider
      - openssl-config-fipshardened
      # either melange SCA should provide these
      # or we should make go-fips shared link on these
      - so:libcrypto.so.3
      - so:libssl.so.3

vars:
  eks-package-version: 1-28-eks-20

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips
      - libcap-utils

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-distro
      tag: v${{vars.eks-package-version}}
      expected-commit: 5697d7e049cb4de4a374acaf5604cce6558e22e6

  - runs: make makes-binaries-coredns_coredns

  - uses: go/bump
    with:
      deps: github.com/quic-go/quic-go@v0.42.0 google.golang.org/protobuf@v1.33.0 golang.org/x/net@v0.23.0
      modroot: projects/coredns/coredns/coredns/

  - working-directory: projects/coredns/coredns/coredns
    pipeline:
      - uses: go/build
        with:
          packages: .
          output: coredns
          ldflags: -buildid= -extldflags -static -X github.com/coredns/coredns/coremain.GitCommit=$(git rev-parse HEAD)
          go-package: go-fips

  - uses: strip

  # This MUST run after strip, which strips capabilities too!
  - runs: setcap cap_net_bind_service=+ep "${{targets.destdir}}/usr/bin/coredns"

update:
  manual: true # we need to manually update because melange bump doesn't yet handle pipeline mutations for var transforms

# https://github.com/wolfi-dev/os/blob/ce0282bf093f601e13edb0c408c6f1e25d50bb78/coredns.yaml#L56
test:
  environment:
    contents:
      packages:
        - bind-tools
  pipeline:
    - runs: |
        coredns -version
        coredns -plugins
    - runs: |
        cat > Corefile <<EOF
        .:1053 {
            file /home/build/db.wolfi.dev
            log
            errors
            cache
        }
        EOF

        cat > /home/build/db.wolfi.dev <<'EOF'
        $TTL 3600
        @    IN SOA ns1.wolfi.dev. admin.wolfi.dev. (
                  20240101   ; Serial
                  7200       ; Refresh
                  3600       ; Retry
                  1209600    ; Expire
                  3600 )     ; Negative Cache TTL
        ;
        @    IN NS  ns1.wolfi.dev.
        ;
        foo.wolfi.dev  IN TXT "hi"
        EOF

        coredns &
        sleep 2

        # validates intree plugins can be successfully loaded
        dig @localhost -p 1053 foo.wolfi.dev TXT +short | grep -q '"hi"'
