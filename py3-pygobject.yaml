package:
  name: py3-pygobject
  version: "3.54.5"
  epoch: 0
  description: Python3 bindings for GObject based libraries
  copyright:
    - license: LGPL-2.1-only
  dependencies:
    provider-priority: 0
    runtime:
      - gio
      - glib-gir
      - gobject-introspection
      - libffi

vars:
  pypi-package: pygobject
  import: gi.repository.GObject

data:
  - name: py-versions
    items:
      3.10: "310"
      3.11: "311"
      3.12: "312"
      3.13: "313"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gio
      - glib
      - glib-gir
      - gobject-introspection
      - gobject-introspection-dev
      - libffi
      - libffi-dev
      - meson
      - pkgconf
      - py3-pytest
      - py3-supported-build-base-dev
      - py3-supported-cairo
      - py3-supported-meson-python
      - python3
      - pythoncapi-compat

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gnome/pygobject.git
      expected-commit: da2717480488ed93f1038ea106c7a9c394059e1d
      tag: ${{package.version}}

  - runs: |
      mkdir -p ./subprojects/pythoncapi-compat
      cp /usr/include/pythoncapi-compat/pythoncapi_compat.h ./subprojects/pythoncapi-compat/

  # Upstream includes a patch to generate a meson build file for pythoncapi-compat
  # Usually executed by the meson subproject hooks, but since we use our own copy
  # of pythoncapi-compat we need to apply the patch too.
  - uses: patch
    working-directory: ./subprojects/pythoncapi-compat
    with:
      patches: ../packagefiles/pythoncapi-compat-meson.diff

  - uses: meson/configure
    with:
      opts: |
        -Dtests=false # TODO run upstream tests. Requires gobject-introspection-tests, currently unpackaged.

  - uses: meson/compile

  - uses: meson/install

  - runs: |
      # python-version-specific files will be provided by subpackages
      rm -rf ${{targets.destdir}}/usr/lib/python*

  - uses: strip

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - glib-gir
        - gobject-introspection
        - gio
        - libffi
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - uses: test/tw/ldd-check
          with:
            packages: ${{subpkg.name}}
      environment:
        contents:
          packages:
            - py3-supported-${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  git: {}
  ignore-regex-patterns:
    - PYG.* # Bad tags
    - pygtk.* # Bad tags
    - GNOME.* # Bad tags
    - python.* # Bad tags
    - short-class-names-branch-anchor # Bad tag
    - sigc1_1_before_patch # Bad tag
