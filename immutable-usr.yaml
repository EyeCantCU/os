package:
  name: immutable-usr
  version: 0.0.1
  epoch: 0
  description: Systemd unit to remount /usr read-only
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - systemd

environment:
  contents:
    packages:
      - busybox

pipeline:
  - runs: |
      install -Dm644 ./usr.mount \
          "${{targets.destdir}}/usr/lib/systemd/system/usr.mount"

test:
  pipeline:
    - runs: test -f /usr/lib/systemd/system/usr.mount

update:
  enabled: false
  exclude-reason: |
    This is the upstream for this package
