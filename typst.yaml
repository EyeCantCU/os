package:
  name: typst
  version: 0.14.0
  epoch: 0
  description: A markup-based typesetting system that is powerful and easy to learn.
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - openssl-dev

vars:
  binary-name: typst

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/typst/typst
      tag: v${{package.version}}
      expected-commit: dd1e6e94f73db6a257a5ac34a6320e00410a2534

  - name: Configure and Build
    uses: cargo/build
    with:
      output: ${{vars.binary-name}}

  - uses: strip

update:
  enabled: true
  github:
    identifier: typst/typst
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - file
        - binutils
  pipeline:
    - uses: test/tw/help-check
      with:
        bins: ${{vars.binary-name}}
    - uses: test/tw/ver-check
      with:
        bins: ${{vars.binary-name}}
    - name: verify dynamic linking of openssl
      runs: |
        readelf --dynamic /usr/bin/typst | grep NEEDED | grep -E 'libssl|libcrypto'
        readelf --dyn-syms /usr/bin/typst | grep OPENSSL
        nm --dynamic /usr/bin/typst | grep 'U SSL_.*@OPENSSL_'
    # Tests based on features from: https://github.com/typst/typst#readme
    - name: Test Typst compilation and features
      runs: |
        set -euo pipefail

        # Test basic compilation with key features: markup, math, scripting, tables
        tee /tmp/test.typ << 'EOF'
        = Test
        *Bold* and $a^2 + b^2 = c^2$

        #let x = 5
        #table(columns: 2, [n], [n²], [1], [#(x)])
        EOF

        ${{vars.binary-name}} compile /tmp/test.typ /tmp/test.pdf
        test -f /tmp/test.pdf
        file /tmp/test.pdf | grep -F "PDF document"
