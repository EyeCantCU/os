# Creates meta-packages used internally in building other CUDA dependent packages like torch, vllm etc.
package:
  name: cuda-toolkit-12.8
  version: 12.8
  # version of the the cuda-toolkit and the run-time dependencies are tracked referencing NVIDIA's toolkit versions
  epoch: 1
  description: Meta-package for providing CUDA-toolkit packages
  copyright:
    - license: LicenseRef-NVIDIA-CUDA
      license-path: LICENSE
  dependencies:
    runtime:
      - nvidia-cuda-cudart-12.8
      - nvidia-cuda-nvcc-12.8
      - nvidia-cuda-nvml-dev-12.8
      - nvidia-cuda-nvrtc-12.8
      - nvidia-cuda-nvtx-12.8
      - nvidia-libcublas-12.8
      - nvidia-libcufft-12.8
      - nvidia-libcurand-12.8
      - nvidia-libcusolver-12.8
      - nvidia-libcusparse-12.8
      - nvidia-libnvjitlink-12.8

subpackages:
  - name: ${{package.name}}-dev
    description: Meta-package for providing CUDA-toolkit development packages
    dependencies:
      runtime:
        - nvidia-cuda-cudart-12.8-dev
        - nvidia-cuda-nvcc-12.8-dev
        - nvidia-cuda-nvrtc-12.8-dev
        - nvidia-cuda-nvml-dev-12.8
        - nvidia-cuda-nvtx-12.8-dev
        - nvidia-libcublas-12.8-dev
        - nvidia-libcufft-12.8-dev
        - nvidia-libcurand-12.8-dev
        - nvidia-libcusolver-12.8-dev
        - nvidia-libcusparse-12.8-dev
        - nvidia-libnvjitlink-12.8-dev
    test:
      pipeline:
        - uses: test/emptypackage

update:
  enabled: false
  exclude-reason: meta-package

test:
  pipeline:
    - uses: test/emptypackage
