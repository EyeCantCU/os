package:
  name: nvidia-libcurand-12.4
  version: 10.3.5.147
  epoch: 1
  description: CUDA cuRAND
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-libcurand=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/libcurand/linux-sbsa/libcurand-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "ee337fa4c53136e336f974ba5d1a9be2a1ec5da674be3bb972a8d645051bbfae"
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/libcurand/linux-x86_64/libcurand-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "f3752abef1ffae7bc9180bd9885905e971cc9c28d7f4d5860731a012e07638a3"

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda/
      mv include ${{targets.destdir}}/usr/local/cuda/
      mv lib ${{targets.destdir}}/usr/local/cuda/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda/${{package.name}}.LICENSE

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/share/pkgconfig/
      mv pkg-config/* ${{targets.destdir}}/usr/share/pkgconfig/
      sed -i 's|targets/.*-linux/||g' ${{targets.destdir}}/usr/share/pkgconfig/*

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - nvidia-libcurand-12.4

update:
  # No release-monitoring support for the multi-arch "enterprise" driver, only
  # for x86-only consumer release train.
  enabled: false
