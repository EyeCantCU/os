# Generated from https://pypi.org/project/msal/
package:
  name: py3-msal
  version: 1.27.0
  epoch: 0
  description: The Microsoft Authentication Library (MSAL) for Python library enables your app to access the Microsoft Cloud by supporting authentication of users with Microsoft Azure Active Directory accounts (AAD) and Microsoft Accounts (MSA) using industry standard OAuth2 and OpenID Connect.
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - py3-cryptography
      #- py3-mock
      - py3-pyjwt
      - py3-requests
      - python-3

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 7e045199798adbe5309034de12c64b1816d23489
      repository: https://github.com/AzureAD/microsoft-authentication-library-for-python
      tag: ${{package.version}}

  - name: Python Build
    uses: python/build-wheel

  - uses: strip

update:
  # The azure repo has some tags that have a bN suffix, which
  # is not a valid version, so ignore those.
  ignore-regex-patterns:
    - b
  enabled: true
  github:
    identifier: AzureAD/microsoft-authentication-library-for-python
    use-tag: true
