package:
  name: tomcat-9
  version: 9.0.91
  epoch: 0
  description: Apache Tomcat Web Server
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - tomcat=${{package.full-version}}

environment:
  contents:
    packages:
      - ant
      - build-base
      - busybox
      - ca-certificates-bundle
      - openjdk-17
      - openjdk-8
  environment:
    JAVA_HOME: /usr/lib/jvm/java-17-openjdk

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/tomcat
      tag: ${{package.version}}
      expected-commit: acef3172d41f18b5272fdf81da88db745669442e

  - runs: |
      cat <<EOF > build.properties
      skip.installer=true
      base.path=$PWD
      compile.debug=false
      EOF

  - runs: |
      ant

      mkdir -p ${{targets.destdir}}/usr/share/tomcat
      cp LICENSE ${{targets.destdir}}/usr/share/tomcat/

      mkdir -p ${{targets.destdir}}/usr/share/tomcat/bin
      cp output/build/bin/* ${{targets.destdir}}/usr/share/tomcat/bin

      mkdir -p ${{targets.destdir}}/usr/share/tomcat/conf
      cp output/build/conf/* ${{targets.destdir}}/usr/share/tomcat/conf

      mkdir -p ${{targets.destdir}}/usr/share/tomcat/lib
      cp output/build/lib/* ${{targets.destdir}}/usr/share/tomcat/lib

      mkdir -p ${{targets.destdir}}/usr/share/tomcat/logs
      mkdir -p ${{targets.destdir}}/usr/share/tomcat/temp
      mkdir -p ${{targets.destdir}}/usr/share/tomcat/webapps

subpackages:
  # This package includes the manager and host-manager apps.
  # The apps are not directly usable without copying into the webapps directory.
  # See https://github.com/docker-library/tomcat/pull/181 for more context.
  - name: ${{package.name}}-webapps
    dependencies:
      runtime:
        - tomcat-9
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/share/tomcat/webapps.dist
          cp -r output/build/webapps/* ${{targets.subpkgdir}}/usr/share/tomcat/webapps.dist/

  - name: ${{package.name}}-jdk8
    description: tomcat-9 with jdk 8
    dependencies:
    pipeline:
      - runs: |
          export JAVA_HOME=/usr/lib/jvm/java-1.8-openjdk

          # tidy up jdk 17 build
          rm -rf output/build
          # skip build.xml version check
          ant -Dskip.build.java.version=true

          mkdir -p ${{targets.subpkgdir}}/usr/share/tomcat
          cp LICENSE ${{targets.subpkgdir}}/usr/share/tomcat/

          mkdir -p ${{targets.subpkgdir}}/usr/share/tomcat/bin
          cp output/build/bin/* ${{targets.subpkgdir}}/usr/share/tomcat/bin

          mkdir -p ${{targets.subpkgdir}}/usr/share/tomcat/conf
          cp output/build/conf/* ${{targets.subpkgdir}}/usr/share/tomcat/conf

          mkdir -p ${{targets.subpkgdir}}/usr/share/tomcat/lib
          cp output/build/lib/* ${{targets.subpkgdir}}/usr/share/tomcat/lib

          mkdir -p ${{targets.subpkgdir}}/usr/share/tomcat/logs
          mkdir -p ${{targets.subpkgdir}}/usr/share/tomcat/temp
          mkdir -p ${{targets.subpkgdir}}/usr/share/tomcat/webapps

          mkdir -p ${{targets.subpkgdir}}/usr/share/tomcat/webapps.dist
          cp -r output/build/webapps/* ${{targets.subpkgdir}}/usr/share/tomcat/webapps.dist/

update:
  enabled: true
  ignore-regex-patterns:
    - '-M\d+$'
  github:
    identifier: apache/tomcat
    use-tag: true
    tag-filter: 9.
