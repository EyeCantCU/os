package:
  name: cracklib
  version: 2.10.3
  epoch: 40
  description: CrackLib Library and Dictionaries
  copyright:
    - license: LGPL-2.1
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - build-base
      - busybox
      - gettext
      - gettext-dev
      - libtool

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cracklib/cracklib
      tag: v${{package.version}}
      expected-commit: e73d5db1789d198b5f9ec44b68b9c775c3e6c042

  - uses: autoconf/configure
    working-directory: src
    with:
      opts: |
        --with-default-dict /usr/share/dict/cracklib-small \
        --sbindir=/usr/bin \

  - uses: autoconf/make
    working-directory: src

  - uses: autoconf/make-install
    working-directory: src

  - uses: strip

subpackages:
  - name: ${{package.name}}-dicts
    description: "${{package.name}} default dictionary"
    pipeline:
      - runs: |
          install -Dm0644 src/dicts/cracklib-small ${{targets.subpkgdir}}/usr/share/dict/cracklib-small
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

  - name: ${{package.name}}-dev
    description: "${{package.name}} headers"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - name: ${{package.name}}-doc
    description: "${{package.name}} manpages"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

update:
  enabled: true
  github:
    identifier: cracklib/cracklib
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
