package:
  name: consul-fips-1.17
  version: 1.17.4
  epoch: 1
  description: Consul is a distributed, highly available, and data center aware solution to connect and configure applications across dynamic, distributed infrastructure.
  copyright:
    - license: BUSL-1.1
  dependencies:
    provides:
      - consul-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/consul
      tag: v${{package.version}}
      expected-commit: 3e2302b19153f9f21588fd2e62242f4a27458af3
      destination: ${{package.name}}

  - uses: go/bump
    with:
      deps: github.com/coredns/coredns@v1.11.2 github.com/go-jose/go-jose/v3@v3.0.3 github.com/hashicorp/go-retryablehttp@v0.7.7
      modroot: ${{package.name}}

  - working-directory: ${{package.name}}
    pipeline:
      - uses: go/bump
        with:
          deps: golang.org/x/net@v0.23.0
      - uses: go/remove-cgo-enabled-0
      - runs: |
          make linux
      - runs: |
          mkdir -p ${{targets.destdir}}/bin

          # The docker-entrypoint.sh expects the binary to be in /bin so put it there
          mv ./pkg/bin/linux_*/consul ${{targets.destdir}}/bin/consul
      - uses: strip

subpackages:
  - name: ${{package.name}}-oci-entrypoint
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          mv ${{package.name}}/.release/docker/docker-entrypoint.sh "${{targets.subpkgdir}}/usr/bin/"
    dependencies:
      provides:
        - consul-fips-oci-entrypoint=${{package.full-version}}
      runtime:
        - ${{package.name}}
        - busybox
        - dumb-init
        - su-exec
        - libcap-utils

  - name: ${{package.name}}-oci-entrypoint-compat
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}/usr/local/bin"
          ln -s /usr/bin/docker-entrypoint.sh "${{targets.subpkgdir}}/usr/local/bin/"
    dependencies:
      provides:
        - consul-fips-oci-entrypoint-compat=${{package.full-version}}
      runtime:
        - ${{package.name}}-oci-entrypoint

test:
  pipeline:
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: hashicorp/consul
    strip-prefix: v
    tag-filter: v1.17. # Keeping it this because we have other consul tagged versions separately like 1.1
