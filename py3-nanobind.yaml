package:
  name: py3-nanobind
  version: "2.9.1"
  epoch: 0
  description: tiny and efficient C++/Python bindings
  copyright:
    - license: BSD-3-Clause

vars:
  pypi-package: nanobind
  import: nanobind

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - py3-supported-build-base
      - py3-supported-scikit-build-core
      - samurai
  environment:
    VERBOSE: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wjakob/nanobind
      tag: v${{package.version}}
      expected-commit: f703fd403aed32cd903f5cfdff414bdfd13f6430
      recurse-submodules: true

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: wjakob/nanobind
    strip-prefix: v
    tag-filter-prefix: v
    use-tag: true
