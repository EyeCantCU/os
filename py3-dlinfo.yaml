package:
  name: py3-dlinfo
  version: 2.0.0
  epoch: 0
  description: Python wrapper for libc’s dlinfo
  copyright:
    - license: MIT

vars:
  pypi-package: dlinfo

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/fphammerle/python-dlinfo.git
      tag: v${{package.version}}
      expected-commit: 2ce5cf71bc657da65c8f8e7cff00175b53236946

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
