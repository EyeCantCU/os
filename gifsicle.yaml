package:
  name: gifsicle
  version: 1.96
  epoch: 0
  description: "A CLI tool to create, manipulate, and optimize GIF images & animations"
  copyright:
    - license: GPL-2.0

environment:
  contents:
    packages:
      - build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kohler/gifsicle
      tag: v${{package.version}}
      expected-commit: a08e0f6686d467bb8b9e4715b1f1835f12984fb0

  - uses: autoconf/configure
    with:
      opts: --disable-gifview

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-doc
    description: "gifsicle documentation"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - imagemagick
  pipeline:
    - name: Test basic functionality
      runs: |
        gifsicle --help
        gifsicle --version | grep -q "${{package.version}}"

        gifdiff --help
        gifdiff --version | grep -q "${{package.version}}"
    - name: Create simple test GIFs using ImageMagick
      runs: |
        magick -size 16x16 xc:red red.gif
        magick -size 16x16 xc:blue blue.gif

        # Test GIF information display
        gifsicle --info red.gif | grep -q "16x16"
        gifsicle --info blue.gif | grep -q "16x16"

        # Test GIF optimization
        gifsicle -O2 red.gif > optimized.gif
        test -f optimized.gif

        # Test creating animation from multiple GIFs
        gifsicle --delay=50 --loop red.gif blue.gif > animation.gif
        gifsicle --info animation.gif | grep -q "2 images"

        # Test frame extraction
        gifsicle animation.gif '#0' > frame0.gif
        test -f frame0.gif
        gifsicle --info frame0.gif | grep -q "1 image"

        # Test batch mode with delay modification
        cp animation.gif test_batch.gif
        gifsicle -b --delay=100 test_batch.gif

        # Test gifdiff functionality
        # Should return exit code 1 (different images)
        if gifdiff red.gif blue.gif; then
          echo "ERROR: gifdiff should detect different images"
          exit 1
        fi

        # Should return exit code 0 (identical images)
        gifdiff red.gif red.gif

        # Test color reduction
        gifsicle --colors=8 red.gif > reduced.gif
        test -f reduced.gif

        # Test interlacing
        gifsicle --interlace red.gif > interlaced.gif
        test -f interlaced.gif
