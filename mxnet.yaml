package:
  name: mxnet
  version: 1.9.1
  epoch: 0
  description: Apache MXNet is a deep learning framework designed for both efficiency and flexibility.
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: mxnet
  import: mxnet
  # Needs to be this so that mxnet python build can find the .so file
  output-dir: build

environment:
  contents:
    packages:
      - cmake-3
      - gfortran
      - openblas-dev
      - opencv-dev
      - perl
      - py3-supported-build-base-dev
      - py3-supported-pip
      - py3-supported-python-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/mxnet.git
      tag: ${{package.version}}
      expected-commit: 3f8f3be9987e259491ddc5a78aa9c6903e0b21e3
      recurse-submodules: true

  - environment:
      CFLAGS: -w
      CXXFLAGS: -w
    uses: cmake/configure
    with:
      output-dir: ${{vars.output-dir}}
      opts: |
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DCMAKE_POLICY_VERSION=3.5 \
        -DUSE_CUDA=false

  - uses: cmake/build
    with:
      output-dir: ${{vars.output-dir}}

  - uses: cmake/install
    with:
      output-dir: ${{vars.output-dir}}

  - runs: sed -i 's/graphviz<0.9.0,>=0.8.1/graphviz/g' ./python/setup.py

  - name: Make Numpy bindings compatible with 2.x
    runs: |
      # Patches old numpy.bool invocations
      find python/ -type f -iname "*.py" -print0 | \
        xargs -I{} -n1 sed -i \
          -e 's/np\.bool_/np\.bool/' \
          -e 's/np\.bool/np\.bool_/' \
          -e 's/np\.Inf/np\.inf/' \
          -e 's/np\.sometrue/np\.any/' \
          -e 's/np\.round_/np\.round/' {}

      sed -i \
        -e "s/PZERO.*=.*/PZERO = 0.0/g" \
        -e "s/NZERO.*=.*/NZERO = 0.0/g" \
        -e "s/NINF.*=.*/NINF = onp.inf/g" \
        -e "s/PINF.*=.*/PINF = onp.inf/g" \
        -e "s/NAN.*=.*/NAN = onp.nan/g" \
        -e "s/NaN.*=.*/NaN = onp.nan/g" \
        "python/mxnet/numpy/utils.py"

      sed -i \
        -e "/mirr/d" \
        -e "/msort/d" \
        -e "s/alltrue = .*/alltrue = onp.all/g" \
        -e "/ppmt/d" \
        -e "/pmt/d" \
        -e "/npv/d" \
        -e "/pv/d" \
        -e "/rate/d" \
        "python/mxnet/numpy/fallback.py"

      sed -i \
        -e "/round_/d" \
        -e "/product/d" \
        -e "/sometrue/d" \
        "python/mxnet/numpy_dispatch_protocol.py"

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development libraries
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-graphviz
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-setuptools
        - py${{range.key}}-requests
        - mxnet
    pipeline:
      - working-directory: python
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: rm -rf "${{targets.subpkgdir}}/usr/mxnet"
      - runs: ln -s "/usr/lib/libmxnet.so" "${{targets.subpkgdir}}/usr/lib/python${{range.key}}/site-packages/mxnet/libmxnet.so"
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - name: Gluton vision model training
          runs: |
            python${{range.key}} <<'EOF' 2>&1 | tee output.log
            import mxnet as mx
            from mxnet import nd
            from mxnet.gluon import nn

            net = nn.Sequential()
            with net.name_scope():
                net.add(nn.Dense(10, activation='relu'))
                net.add(nn.Dense(2))

            ctx = mx.cpu()
            net.initialize(mx.init.Xavier(), ctx=ctx)

            # Create a dummy input NDArray: batch_size=1, features=3
            X = nd.random.uniform(shape=(1, 3), ctx=ctx)

            output = net(X)

            print(f"Input shape (features=3): {X.shape}")
            print(f"Output shape (classes=2): {output.shape}")
            print(f"Output value:\n{output}")
            EOF

            grep -E -e "Input.*(1, 3)" output.log
            grep -E -e "Output.*(1, 2)" output.log
            grep -E -e "[[0\.5.*  0\.4.*]]" output.log
        - name: Numpy-specific tests
          # This is here because we are patching so much numpy functionality
          runs: |
            python${{range.key}} <<EOF 2>&1 | tee output.txt
            import mxnet.ndarray as nd
            import mxnet.context as ctx

            # Create an NDArray on the CPU
            x = nd.array([[1, 2], [3, 4]])
            print(f"NDArray on CPU:\n{x}")

            # Create an NDArray on a specific context (e.g., GPU 0)
            # Use 'ctx.cpu(0)' for CPU explicitly
            try:
                y = nd.ones((2, 2), ctx=ctx.gpu(0))
                print(f"\nNDArray on GPU 0:\n{y}")
            except Exception as e:
                # Fallback if no GPU is available
                print(f"\nCould not create NDArray on GPU 0 (error: {e}). Using CPU instead.")
                y = nd.ones((2, 2))
                print(f"NDArray on CPU fallback:\n{y}")

            # Element-wise operations
            z = x + 2
            w = x * y
            print(f"\nElement-wise addition (x + 2): {z}")
            print(f"Element-wise multiplication (x * y): {w}")

            # Dot product (matrix multiplication)
            m = nd.dot(x, y)
            print(f"\nMatrix multiplication (x dot y): {m}")
            EOF
            grep -F -e "Could not create NDArray on GPU" ./output.txt
            grep -F -e "[[1. 2.]" ./output.txt
            grep -F -e "[[3. 3.]" ./output.txt

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/ldd-check
