package:
  name: mxnet
  version: 1.9.1
  epoch: 1
  description: Apache MXNet is a deep learning framework designed for both efficiency and flexibility.
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: mxnet
  import: mxnet
  cuda-version: 12.9
  # Needs to be this so that mxnet python build can find the .so file
  output-dir: build

environment:
  contents:
    packages:
      - gfortran
      - openblas-dev
      - opencv-dev
      - py3-supported-build-base-dev
      - py3-supported-pip
      - py3-supported-python-dev

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/apache/mxnet.git
      tag: ${{package.version}}
      expected-commit: 3f8f3be9987e259491ddc5a78aa9c6903e0b21e3
      recurse-submodules: true

  - runs: |
      sed -i "/numpy/d ; s@DEPENDENCIES \= \[@&\n\ \ \ \ \"numpy\"\,@" ./tools/pip/setup.py
      sed -i "s/graphviz<0.9.0,>=0.8.1/graphviz/g" ./tools/pip/setup.py
      sed -i "s/graphviz<0.9.0,>=0.8.1/graphviz/g" ./python/setup.py
      sed -i "s/numpy<2.0.0,>1.16.0/numpy/g" ./python/setup.py
      sed -i "s/numpy>1.16.0,<2.0.0/numpy/g" ./python/setup.py
      cat ./python/setup.py

  - environment:
      CFLAGS: -w
      CXXFLAGS: -w
    uses: cmake/configure
    with:
      output-dir: ${{vars.output-dir}}
      opts: |
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
        -DUSE_CUDA=false

  - uses: cmake/build
    with:
      output-dir: ${{vars.output-dir}}

  - uses: cmake/install
    with:
      output-dir: ${{vars.output-dir}}

  - runs: |
      # Patches old numpy.bool invocations
      find python/ -type f -iname "*.py" -print0 | xargs -I{} -n1 sed -i 's/np\.bool_/np\.bool/' {}
      find python/ -type f -iname "*.py" -print0 | xargs -I{} -n1 sed -i 's/np\.bool/np\.bool_/' {}

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development libraries
    pipeline:
      - uses: split/dev
    test:
      pipeline:
        - uses: test/tw/ldd-check

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-graphviz
        - py${{range.key}}-numpy-2.2
        - py${{range.key}}-setuptools
        - py${{range.key}}-requests
        - mxnet
    pipeline:
      - working-directory: python
        uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - runs: ln -s "/usr/lib/libmxnet.so" "${{targets.subpkgdir}}/usr/lib/python${{range.key}}/site-packages/mxnet/libmxnet.so"
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/ldd-check
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  git: {}

test:
  pipeline:
    - uses: test/tw/ldd-check
