package:
  name: adoptium-openjdk-11
  version: 11.0.28.5
  epoch: 27
  description: Adoptium OpenJDK 11
  copyright:
    - license: GPL-2.0-with-classpath-exception
  dependencies:
    runtime:
      - adoptium-openjdk-11-jre

var-transforms:
  - from: ${{package.version}}
    match: ^(11\.\d+\.\d+)\.(\d+)$
    replace: $1+$2
    to: tag-version

environment:
  contents:
    packages:
      - alsa-lib-dev
      - autoconf
      - automake
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - cups-dev
      - file
      - fontconfig-dev
      - freetype-dev
      - gcc-14-default
      - giflib-dev
      - lcms2-dev
      - libffi-dev
      - libjpeg-turbo-dev
      - libx11-dev
      - libxext-dev
      - libxi-dev
      - libxrandr-dev
      - libxrender-dev
      - libxt-dev
      - libxtst-dev
      - openjdk-10-default-jdk
      - zip

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/adoptium/jdk11u
      tag: jdk-${{vars.tag-version}}_adopt
      expected-commit: fdc1040f03c9137ff7f61af0db39c381db48f9c3

  - uses: patch
    with:
      patches: FixNullPtrCast.patch

  - runs: chmod +x configure

  - uses: autoconf/configure
    with:
      opts: '--with-extra-cflags="$CFLAGS" \

        --with-extra-cxxflags="$CXXFLAGS" \

        --with-extra-ldflags="$LDFLAGS" \

        --with-boot-jdk=/usr/lib/jvm/java-10-openjdk \

        --prefix=/usr/lib/jvm/java-11-adoptium \

        --with-vendor-name=wolfi \

        --with-vendor-url=https://wolfi.dev \

        --with-vendor-bug-url=https://github.com/wolfi-dev/os/issues \

        --with-version-opt="wolfi-r${{package.epoch}}" \

        --disable-warnings-as-errors \

        --disable-precompiled-headers \

        --enable-dtrace=no \

        --with-zlib=system \

        --with-debug-level=release \

        --with-native-debug-symbols=internal \

        --with-jvm-variants=server \

        --with-jtreg=no  \

        --with-libpng=system \

        --with-jvm-variants=server \

        --with-libjpeg=system \

        --with-giflib=system \

        --with-lcms=system \

        --with-version-string="" \

        --disable-hotspot-gtest

      '

  - runs: make jdk-image

  - runs: '_java_bin="./build/*-server-release/images/jdk/bin"


      $_java_bin/javac -d . HelloWorld.java

      $_java_bin/java HelloWorld

    '

  - runs: '_java_home="usr/lib/jvm/java-11-adoptium"


      mkdir -p "${{targets.destdir}}"/$_java_home

      cp -r build/*-server-release/images/jdk/* "${{targets.destdir}}"/$_java_home

      rm "${{targets.destdir}}"/$_java_home/lib/src.zip

    '

subpackages:
  - name: ${{package.name}}-dbg
    description: OpenJDK 11 Java Debug Symbols
    pipeline:
      - uses: split/debug
    dependencies:
      runtime:
        - adoptium-openjdk-11

  - name: ${{package.name}}-jre
    description: OpenJDK 11 Java Runtime Environment
    dependencies:
      runtime:
        - alsa-lib
        - freetype
        - giflib
        - lcms2
        - libfontconfig1
        - libjpeg-turbo
        - libxext
        - libxrender
        - libxtst
        - libxi
        - adoptium-openjdk-11-jre-base
    pipeline:
      - runs: "_java_home=\"usr/lib/jvm/java-11-adoptium\"\n\nmkdir -p \"${{targets.subpkgdir}}\"/$_java_home/lib\nmv \"${{targets.destdir}}\"/$_java_home/lib/libawt_xawt.so \\\n    \"${{targets.destdir}}\"/$_java_home/lib/libfontmanager.so \\\n    \"${{targets.destdir}}\"/$_java_home/lib/libjavajpeg.so \\\n    \"${{targets.destdir}}\"/$_java_home/lib/libjawt.so \\\n    \"${{targets.destdir}}\"/$_java_home/lib/libjsound.so \\\n    \"${{targets.destdir}}\"/$_java_home/lib/liblcms.so \\\n    \"${{targets.destdir}}\"/$_java_home/lib/libsplashscreen.so \\\n    \"${{targets.subpkgdir}}\"/$_java_home/lib\n"
    test:
      pipeline:
        - uses: test/tw/ldd-check
          with:
            extra-library-paths: /usr/lib/jvm/java-11-adoptium/lib/:/usr/lib/jvm/java-11-adoptium/lib/server/

  - name: ${{package.name}}-jre-base
    description: OpenJDK 11 Java Runtime Environment (headless)
    dependencies:
      runtime:
        - java-common
        - java-cacerts
    pipeline:
      - runs: "_java_home=\"usr/lib/jvm/java-11-adoptium\"\n\nmkdir -p \"${{targets.subpkgdir}}\"/$_java_home\nmv \"${{targets.destdir}}\"/$_java_home/lib \\\n   \"${{targets.subpkgdir}}\"/$_java_home\n\nmkdir -p \"${{targets.subpkgdir}}\"/$_java_home/bin\nfor i in java \\\n          jfr \\\n          jrunscript \\\n          keytool \\\n          rmiregistry; do\n  mv \"${{targets.destdir}}\"/$_java_home/bin/$i \"${{targets.subpkgdir}}\"/$_java_home/bin/$i\ndone\n\nmv \"${{targets.destdir}}\"/$_java_home/legal \"${{targets.subpkgdir}}\"/$_java_home\nmv \"${{targets.destdir}}\"/$_java_home/conf \"${{targets.subpkgdir}}\"/$_java_home\nmv \"${{targets.destdir}}\"/$_java_home/release \"${{targets.subpkgdir}}\"/$_java_home\ncp ASSEMBLY_EXCEPTION \\\n    LICENSE \\\n    README.md \\\n   \"${{targets.subpkgdir}}\"/$_java_home\n\n# symlink to shared java cacerts store\nrm -f \"${{targets.subpkgdir}}\"/$_java_home/lib/security/cacerts\nln -sf /etc/ssl/certs/java/cacerts \\\n  \"${{targets.subpkgdir}}\"/$_java_home/lib/security/cacerts\n\n# symlink for `java-common` to work (which expects jre in $_java_home/jre)\nln -sf . \"${{targets.subpkgdir}}/$_java_home/jre\"\n"

  - name: ${{package.name}}-jmods
    description: OpenJDK 11 jmods
    dependencies:
      provides:
        - adoptium-openjdk-jmods=${{package.full-version}}
    pipeline:
      - runs: "mkdir -p \"${{targets.subpkgdir}}\"/usr/lib/jvm/java-11-adoptium\nmv \"${{targets.destdir}}\"/usr/lib/jvm/java-11-adoptium/jmods \\\n   \"${{targets.subpkgdir}}\"/usr/lib/jvm/java-11-adoptium\n"

  - name: ${{package.name}}-doc
    description: OpenJDK 11 Documentation
    pipeline:
      - runs: "mkdir -p \"${{targets.subpkgdir}}\"/usr/lib/jvm/java-11-adoptium\nmv \"${{targets.destdir}}\"/usr/lib/jvm/java-11-adoptium/man \\\n   \"${{targets.subpkgdir}}\"/usr/lib/jvm/java-11-adoptium\n"

  - name: ${{package.name}}-demos
    description: OpenJDK 11 Demos
    pipeline:
      - runs: "mkdir -p \"${{targets.subpkgdir}}\"/usr/lib/jvm/java-11-adoptium\nmv \"${{targets.destdir}}\"/usr/lib/jvm/java-11-adoptium/demo \\\n   \"${{targets.subpkgdir}}\"/usr/lib/jvm/java-11-adoptium\n"

  - name: ${{package.name}}-default-jvm
    description: Use the adoptium-openjdk-11 JVM as the default JVM
    dependencies:
      runtime:
        - adoptium-openjdk-11-jre
      provides:
        - default-jvm=1.11
        - default-jvm-lts=1.11
    pipeline:
      - runs: 'mkdir -p "${{targets.subpkgdir}}"/usr/lib/jvm

          ln -sf java-11-adoptium "${{targets.subpkgdir}}"/usr/lib/jvm/default-jvm

        '

  - name: ${{package.name}}-default-jdk
    description: Use the adoptium-openjdk-11 JVM as the default JVM with the JDK installed
    dependencies:
      runtime:
        - adoptium-openjdk-11-default-jvm
        - adoptium-openjdk-11
      provides:
        - default-jdk=1.11

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-default-jdk
    environment:
      JAVA_HOME: /usr/lib/jvm/java-11-adoptium
  pipeline:
    - name: Java version Test
      runs: 'java -version

      '
    - name: Create Hello World File
      working-directory: basic
      runs: "cat <<EOL > HelloWorld.java\npublic class HelloWorld {\n  public static void main(String[] args) {\n    System.out.println(\"Hello World!\");\n  }\n}\nEOL\n"
    - name: Compile and Run Hello World
      working-directory: basic
      runs: 'javac HelloWorld.java

        java HelloWorld | grep -qi "Hello World!"

      '

update:
  enabled: true
  git:
    strip-prefix: jdk-
    strip-suffix: _adopt
  ignore-regex-patterns:
    - ^[^1].*
    - ^1[^1].*
    - ^11[^.].*
  version-transform:
    - match: ^(11\.\d+\.\d+)\+(\d+)$
      replace: $1.$2
