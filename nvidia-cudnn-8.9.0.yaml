package:
  name: nvidia-cudnn-8.9.0
  version: 8.9.0.131
  epoch: 2
  description: CUDA Deep Neural Network Libraries
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-cudnn=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-sbsa/cudnn-linux-sbsa-8.9.0.131_cuda11-archive.tar.xz"
          expected-sha256: "3e50e31833718a9d755c0ae8f126e9f0f62213d9d2b0a545a6bc2dcafda2386f"
          timeout: 120
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-8.9.0.131_cuda11-archive.tar.xz"
          expected-sha256: "3cb82c50723f14b41d43523f222cd52cc9d50b3ad67c380f4be51bd1133daa2d"
          timeout: 120

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cudnn-8.9.0/
      mv include ${{targets.destdir}}/usr/local/cudnn-8.9.0/
      mv lib ${{targets.destdir}}/usr/local/cudnn-8.9.0/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cudnn-8.9.0/${{package.name}}.LICENSE

subpackages:
  - name: nvidia-cudnn-8.9.0-cuda-12.1
    description: configures cudnn-8.9.0 with cuda-12.1
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/cuda-12.1/lib64
          mkdir -p ${{targets.subpkgdir}}/usr/local/cuda-12.1/include
          for f in ${{targets.destdir}}/usr/local/cudnn-8.9.0/lib64/*; do
            ln -sf /usr/local/cudnn-8.9.0/lib64/$(basename $f) ${{targets.subpkgdir}}/usr/local/cuda-12.1/lib64/$(basename $f)
          done
          for f in ${{targets.destdir}}/usr/local/cudnn-8.9.0/include/*; do
            ln -sf /usr/local/cudnn-8.9.0/include/$(basename $f) ${{targets.subpkgdir}}/usr/local/cuda-12.1/include/$(basename $f)
          done

update:
  enabled: false

test:
  environment:
    contents:
      packages:
        - wolfi-base
        - nvidia-cudnn-8.9.0-cuda-12.1
  pipeline:
    - runs: |
        # Make sure they're symlinked into the right place for the cuda-12.1 subpackage.
        stat /usr/local/cuda-12.1/include/cudnn.h
        stat /usr/local/cuda-12.1/lib64/libcudnn.so
