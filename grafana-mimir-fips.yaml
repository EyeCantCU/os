package:
  name: grafana-mimir-fips
  version: "2.15.1"
  epoch: 1
  description: Grafana Mimir provides horizontally scalable, highly available, multi-tenant, long-term storage for Prometheus.
  copyright:
    - license: AGPL-3.0-or-later

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/grafana/mimir
      tag: mimir-${{package.version}}
      expected-commit: 0c1e06f13b90434e0e4da6118dcc2191ea23e8d7

  # the repo has an ssh://git@github.com URI for mimir-prometheus
  # so just rm the file and default to the https URL for go.mod
  - runs: |
      rm .gitconfig

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.36.0
        github.com/golang-jwt/jwt/v5@v5.2.2
      modroot: .

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/mimir
      output: grafana-mimir
      ldflags: "-w"
      go-package: go-fips-md5

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - distributed
    - weekly
  github:
    identifier: grafana/mimir
    strip-prefix: mimir-

test:
  pipeline:
    - runs: |
        grafana-mimir -version
        grafana-mimir --version
    - uses: test/go-fips-check
