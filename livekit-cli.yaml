package:
  name: livekit-cli
  version: "2.5.1"
  epoch: 0
  description: Command line interface to LiveKit
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/livekit/livekit-cli
      tag: v${{package.version}}
      expected-commit: f44e2052ac7b4d52170bb979ca1585d8e3bed411

  - uses: go/build
    with:
      packages: ./cmd/lk
      output: lk
      ldflags: |
        -X github.com/livekit/livekit/version.Version=${{package.version}}

update:
  enabled: true
  github:
    identifier: livekit/livekit-cli
    strip-prefix: v
    use-tag: true

test:
  pipeline:
    - name: "Basic CLI functionality"
      runs: |
        lk --version | grep "${{package.version}}"
        lk --help
    - name: "Core LiveKit commands"
      runs: |
        lk token --help
        lk room --help
        lk project --help
    - name: "Token generation test"
      runs: |
        # Test token creation with valid format
        lk token create --api-key API123456789 --api-secret secret123456789 --join --room test-room --identity test-user --valid-for 10m
