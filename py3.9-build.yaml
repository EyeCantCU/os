package:
  name: py3.9-build
  version: 1.2.1
  epoch: 1
  description: A simple, correct Python build frontend
  copyright:
    - license: MIT
  options:
    no-provides: true
  dependencies:
    runtime:
      - py3.9-packaging
      - py3.9-tomli
      - py3.9-pyproject-hooks
      - python-3.9

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - py3.9-flit-core
      - py3.9-gpep517
      - py3.9-installer
      - py3.9-pip
      - py3.9-setuptools
      - python-3.9
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/pypa/build
      tag: ${{package.version}}
      expected-commit: 1e67c062e9d1b1a6d5ffed621f4b29902bb764e5

  - runs: |
      python3.9 -m gpep517 build-wheel --wheel-dir dist --output-fd 1
      python3.9 -m installer -d "${{targets.destdir}}" dist/*.whl
      find ${{targets.destdir}} -name "*.pyc" -exec rm -rf '{}' +

  - uses: strip

update:
  enabled: true
  github:
    identifier: pypa/build
    use-tag: true
    strip-suffix: .post1

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: build
