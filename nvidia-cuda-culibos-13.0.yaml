package:
  name: nvidia-cuda-culibos-13.0
  version: "13.0.39"
  epoch: 0
  description: CUDA culibos
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-cuda-culibos=${{package.full-version}}
    runtime:
      - nvidia-cuda-ld-config-${{vars.cuda-version}}

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_culibos/linux-sbsa/cuda_culibos-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha512: "57353b2597cf90aaaf6b33c91bc87dd9366dc9a1a4a3dfa9db8946f7704191812f6756c9c243b18e41234a3ab6ee201ddd8c0e0717527c7ad59c95182a454c51"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_culibos/linux-x86_64/cuda_culibos-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha512: "f04325fe07229fe10d3085bb9ef5313043d620b86e7d1087efdef55a772d9a56207e03703a3f4a8003d9c77dfe6208f40b01a369650838bd37e9ae0eb062910e"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv lib ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/${{package.name}}.LICENSE

subpackages:
  - name: ${{package.name}}-dev
    description: ${{package.name}} development headers
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: nvidia-cuda-culibos
        real-pkg-name: ${{package.name}}

update:
  enabled: false
  exclude-reason: NVidia/CUDA packages aren't handled by the regular update mechanism
