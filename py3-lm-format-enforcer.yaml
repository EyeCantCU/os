package:
  name: py3-lm-format-enforcer
  version: "0.11.3"
  epoch: 0
  description: Enforce the output format (JSON Schema, Regex etc) of a language model
  copyright:
    - license: MIT

vars:
  pypi-package: lmformatenforcer
  import: lmformatenforcer

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-poetry-core

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/noamgat/lm-format-enforcer
      tag: v${{package.version}}
      expected-commit: 05c7dc3a46305e39c1a67c8622c433d8deda48a2

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-packaging
        - py${{range.key}}-pydantic
        - py${{range.key}}-pyyaml
        - py${{range.key}}-interegular
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: noamgat/lm-format-enforcer
    strip-prefix: v
