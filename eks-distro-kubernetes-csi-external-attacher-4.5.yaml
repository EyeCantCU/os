package:
  name: eks-distro-kubernetes-csi-external-attacher-4.5
  version: 4.5.0 # eks-distro v1-25-eks-33: https://github.com/aws/eks-distro/releases/tag/v1-25-eks-33
  epoch: 1
  description: Sidecar container that watches Kubernetes VolumeAttachment objects and triggers ControllerPublish/Unpublish against a CSI endpoint
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - eks-distro-kubernetes-csi-external-attacher=${{package.full-version}}

vars:
  eks-project: kubernetes-csi/external-attacher
  eks-package-version: 1-25-eks-33

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-distro
      tag: v${{vars.eks-package-version}}
      expected-commit: 341dc64e52fa9b1ef732643ce2db7df67684d7ed

  - uses: eks-distro/build
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}

  - uses: eks-distro/install
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      binary-target: csi-attacher

  - uses: strip

update:
  manual: true
