package:
  name: nvidia-cuda-gdb-12.1
  version: 12.1.55
  epoch: 1
  description: CUDA GDB
  copyright:
    - license: PROPRIETARY
  dependencies:
    provides:
      - nvidia-cuda-gdb=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_gdb/linux-sbsa/cuda_gdb-linux-sbsa-12.1.55-archive.tar.xz"
          expected-sha256: "d31f9bd5f4091af3ef6cf173dd6fd6f9ac131e88accc296bb27cf3c7382a8e65"
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/cuda_gdb/linux-x86_64/cuda_gdb-linux-x86_64-12.1.55-archive.tar.xz"
          expected-sha256: "938c49827e3b175e7cb7d5673dc0a71de3f75e6cae9373917def831e1e88e763"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-12.1/
      mv bin ${{targets.destdir}}/usr/local/cuda-12.1/
      mv share ${{targets.destdir}}/usr/local/cuda-12.1/
      mv LICENSE ${{targets.destdir}}/usr/local/cuda-12.1/${{package.name}}.LICENSE

subpackages:
  - name: ${{package.name}}-extras
    description: ${{package.name}} extras
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/cuda-12.1/
          mv extras ${{targets.contextdir}}/usr/local/cuda-12.1/

update:
  enabled: false
