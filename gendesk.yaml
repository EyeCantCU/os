package:
  name: gendesk
  version: "1.0.10"
  epoch: 2 # CVE-2025-47910
  description: Generate .desktop files and download .png icons by specifying a minimum of information
  copyright:
    - license: BSD-3-Clause

pipeline:
  - uses: git-checkout
    with:
      expected-commit: bf8d00538824141b40fc3c005ab25f6de693c955
      repository: https://github.com/xyproto/gendesk
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      output: gendesk
      packages: .
      vendor: true

update:
  enabled: true
  github:
    identifier: xyproto/gendesk
    strip-prefix: v

test:
  pipeline:
    - runs: |
        APP_NAME="myapp"
        EXEC_PATH="/usr/bin/myapp"
        ICON_PATH="/usr/share/icons/myapp.png"
        CATEGORIES="Utility;Development"

        gendesk -n \
          --pkgname "$APP_NAME" \
          --exec "$EXEC_PATH" \
          --icon "$ICON_PATH" \
          --categories "$CATEGORIES" \
          --name "My Application" \
          --comment "A simple demo application"

        # Check that the .desktop file was created
        DESKTOP_FILE="${APP_NAME}.desktop"
        if [ ! -f "$DESKTOP_FILE" ]; then
          echo "Error: $DESKTOP_FILE was not created"
          exit 1
        fi
