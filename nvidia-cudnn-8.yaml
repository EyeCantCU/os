package:
  name: nvidia-cudnn-8
  version: 8.9.7.29
  epoch: 1
  description: CUDA Deep Neural Network Libraries
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-cudnn=${{package.full-version}}
environment:
  contents:
    packages:
      - busybox
pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-sbsa/cudnn-linux-sbsa-8.9.7.29_cuda12-archive.tar.xz"
          expected-sha256: "e98b7c80010785e5d5ca01ee4ce9b5b0c8c73587ea6f8648be34d3f8d1d47bd1"
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-8.9.7.29_cuda12-archive.tar.xz"
          expected-sha256: "475333625c7e42a7af3ca0b2f7506a106e30c93b1aa0081cd9c13efb6e21e3bb"
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cudnn-8.9/
      mv include ${{targets.destdir}}/usr/local/cudnn-8.9/
      mv lib ${{targets.destdir}}/usr/local/cudnn-8.9/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cudnn-8.9/${{package.name}}.LICENSE
subpackages:
  - name: nvidia-cudnn-8-cuda-12
    description: configures cudnn-8 with cuda-12
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/local/cuda-12/lib64
          mkdir -p ${{targets.subpkgdir}}/usr/local/cuda-12/include
          for f in ${{targets.destdir}}/usr/local/cudnn-8.9/lib64/*; do
            ln -sf /usr/local/cudnn-8.9/lib64/$(basename $f) ${{targets.subpkgdir}}/usr/local/cuda-12/lib64/$(basename $f)
          done
          for f in ${{targets.destdir}}/usr/local/cudnn-8.9/include/*; do
            ln -sf /usr/local/cudnn-8.9/include/$(basename $f) ${{targets.subpkgdir}}/usr/local/cuda-12/include/$(basename $f)
          done
update:
  enabled: false
test:
  environment:
    contents:
      packages:
        - wolfi-base
        - nvidia-cudnn-8-cuda-12
  pipeline:
    - runs: |
        # Make sure they're symlinked into the right place for the cuda-12 subpackage.
        stat /usr/local/cuda-12/include/cudnn.h
        stat /usr/local/cuda-12/lib64/libcudnn.so
