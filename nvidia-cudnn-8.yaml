package:
  name: nvidia-cudnn-8
  version: 8.9.7.29
  epoch: 0
  description: CUDA Deep Neural Network Libraries
  copyright:
    - license: PROPRIETARY
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-cudnn=${{package.full-version}}
environment:
  contents:
    packages:
      - busybox
pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-sbsa/cudnn-linux-sbsa-8.9.7.29_cuda12-archive.tar.xz"
          expected-sha256: "e98b7c80010785e5d5ca01ee4ce9b5b0c8c73587ea6f8648be34d3f8d1d47bd1"
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cudnn/redist/cudnn/linux-x86_64/cudnn-linux-x86_64-8.9.7.29_cuda12-archive.tar.xz"
          expected-sha256: "475333625c7e42a7af3ca0b2f7506a106e30c93b1aa0081cd9c13efb6e21e3bb"
  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cudnn-8.9/
      mv include ${{targets.destdir}}/usr/local/cudnn-8.9/
      mv lib ${{targets.destdir}}/usr/local/cudnn-8.9/lib64
      mv LICENSE ${{targets.destdir}}/usr/local/cudnn-8.9/${{package.name}}.LICENSE
update:
  enabled: false
