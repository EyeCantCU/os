package:
  name: databricks-cli
  version: "0.257.0"
  epoch: 1
  description: Databricks CLI for interacting with Databricks services
  copyright:
    - license: custom

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/databricks/cli
      tag: v${{package.version}}
      expected-commit: 388f37dfc73310e659e485623f5e45230a4c72d9

  - uses: go/build
    with:
      packages: .
      ldflags: |
        -X github.com/databricks/cli/internal/build.buildProjectName=databricks
        -X github.com/databricks/cli/internal/build.buildVersion=${{package.version}}
        -X github.com/databricks/cli/internal/build.buildBranch=$(git rev-parse --abbrev-ref HEAD)
        -X "github.com/databricks/cli/internal/build.buildTimestamp=$(date -u -d "@${SOURCE_DATE_EPOCH:-$(date +%s)}" +%s)"
      output: databricks

update:
  enabled: true
  github:
    identifier: databricks/cli
    strip-prefix: v

subpackages:
  - name: ${{package.name}}-compat
    description: Compatibility package for databricks CLI
    pipeline:
      - runs: |
          mkdir -p ${{targets.contextdir}}/app
          ln -sf /usr/bin/databricks ${{targets.contextdir}}/app/databricks
    test:
      pipeline:
        - runs: |
            test "$(readlink -fv /app/databricks)" = "/usr/bin/databricks"

test:
  pipeline:
    - runs: |-
        databricks --version
        databricks --help
