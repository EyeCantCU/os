package:
  name: chart-iamguarded-mysql
  version: "13.0.0"
  epoch: 0
  description: MySQL iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: mysql/${{package.version}}
      expected-commit: 98a47b5384cc63899673169e0768dd7bf0997271

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/mysql

  - uses: charts/package
    with:
      chart-path: iamguarded/mysql

update:
  enabled: false
  manual: true
  schedule:
    period: daily
    reason: Update automation doesn't yet support automating from private repos.
  git:

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /mysql
