package:
  name: chart-iamguarded-apisix
  version: "6.0.2"
  epoch: 3
  description: Apache Apisix iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common
      - chart-iamguarded-etcd

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: apisix/${{package.version}}
      expected-commit: 507b735b7f934374cfeca788bdc8b4786cd8dc6b

  - uses: patch
    with:
      patches: |
        iamguarded.patch
        values.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/apisix

  - uses: charts/package
    with:
      chart-path: iamguarded/apisix

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: apisix/
    use-tag: true
    tag-filter-prefix: apisix/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /apisix
