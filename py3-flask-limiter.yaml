package:
  name: py3-flask-limiter
  version: "4.1.1"
  epoch: 0
  description: Rate limiting for flask applications
  copyright:
    - license: MIT

vars:
  pypi-package: flask-limiter
  import: flask_limiter

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base
      - py3-supported-hatch-vcs
      - py3-supported-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/alisaifee/flask-limiter
      tag: ${{package.version}}
      expected-commit: e9c14643bb0bd7f3c2c12546d8b9d4b407cc7554

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-flask
        - py${{range.key}}-limits
        - py${{range.key}}-ordered-set
        - py${{range.key}}-rich~13
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import flask_limiter
            from flask_limiter import Limiter
            from flask_limiter.util import get_remote_address

            # Test basic Flask-Limiter functionality
            assert hasattr(flask_limiter, 'Limiter')
            assert hasattr(flask_limiter, 'RateLimitExceeded')
            assert hasattr(flask_limiter.util, 'get_remote_address')

            # Test that we can create a Limiter instance
            limiter = Limiter(
                key_func=get_remote_address,
                default_limits=["100 per day"],
                storage_uri="memory://"
            )
            assert limiter is not None

            # Test limiter methods exist
            assert hasattr(limiter, 'limit')
            assert hasattr(limiter, 'exempt')
            assert hasattr(limiter, 'shared_limit')
            assert hasattr(limiter, 'request_filter')

            print("All Flask-Limiter tests passed!")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: alisaifee/flask-limiter
