package:
  name: libsrtp
  version: "2.7.0"
  epoch: 0
  description: Implementation of the Secure Real-time Transport Protocol (SRTP)
  copyright:
    - license: BSD-3-Clause

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cmake
      - gcc
      - glibc-dev
      - libpcap-dev
      - meson
      - openssl-dev
      - pkgconf-dev

pipeline:
  - uses: git-checkout
    with:
      expected-commit: ee1a77c9f9dc02c42bda9901038c500c5efe4cfa
      repository: https://github.com/cisco/libsrtp
      tag: v${{package.version}}

  - uses: meson/configure
    with:
      opts: |
        -Dtests=disabled \
        -Dcrypto-library=openssl \
        -Dpcap-tests=enabled

  - uses: meson/compile

  - runs: meson test --no-rebuild --print-errorlogs -C output

  - uses: meson/install

  - uses: strip

update:
  enabled: true
  github:
    identifier: cisco/libsrtp
    use-tag: true
    tag-filter: v
    strip-prefix: v

test:
  pipeline:
    - uses: test/pkgconf
    - uses: test/tw/ldd-check
