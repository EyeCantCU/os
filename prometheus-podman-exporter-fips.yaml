package:
  name: prometheus-podman-exporter-fips
  version: "1.19.0"
  epoch: 6 # CVE-2025-61729
  description: Prometheus exporter for podman environments exposing containers, pods, images, volumes and networks information.
  copyright:
    - license: Apache-2.0
  dependencies:
    # REMOVE_POST_USRMERGE - https://github.com/orgs/wolfi-dev/discussions/40270
    provides:
      - ${{package.name}}-compat=${{package.full-version}}
    runtime:
      - merged-bin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - btrfs-progs-dev
      - gpgme-fips-dev
      - libgcrypt-al2023-fips

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/containers/prometheus-podman-exporter
      tag: v${{package.version}}
      expected-commit: c85036a47e30f0d00fd941b1e81a89590c51d802

  - uses: go/bump
    with:
      deps: |-
        github.com/opencontainers/runc@v1.3.3
        github.com/opencontainers/selinux@v1.13.0
        golang.org/x/crypto@v0.45.0
      replaces: |-
        github.com/cyphar/filepath-securejoin=github.com/cyphar/filepath-securejoin@v0.5.1

  - uses: go/build
    with:
      packages: .
      ldflags: |
        -X github.com/containers/prometheus-podman-exporter/cmd.buildVersion=${{package.version}}
        -X github.com/containers/prometheus-podman-exporter/cmd.buildRevision=${{package.epoch}}
        -X github.com/containers/prometheus-podman-exporter/cmd.buildBranch=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)
      tags: remote,containers_image_openpgp
      go-package: go-fips
      output: podman_exporter

update:
  enabled: true
  github:
    identifier: containers/prometheus-podman-exporter
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
    - uses: test/tw/help-check
      with:
        bins: podman_exporter
    - uses: test/go-fips-check
