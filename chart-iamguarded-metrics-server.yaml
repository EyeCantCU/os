package:
  name: chart-iamguarded-metrics-server
  version: "7.4.10"
  epoch: 0
  description: metrics-server iamguarded chart
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: metrics-server/${{package.version}}
      expected-commit: e708b4912bff42962da399fa67a0fb5ed3721e8d

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/metrics-server

  - uses: charts/package
    with:
      chart-path: iamguarded/metrics-server

update:
  enabled: true
  github:
    identifier: chainguard-dev/iamguarded-charts
    strip-prefix: metrics-server/
    use-tag: true
    tag-filter-prefix: metrics-server/

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /metrics-server
