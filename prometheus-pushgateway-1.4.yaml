package:
  name: prometheus-pushgateway-1.4
  version: 1.4.3
  epoch: 49 # GHSA-j5w8-q4qc-rx2x
  description: Push acceptor for ephemeral and batch jobs.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - go

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/pushgateway
      tag: v${{package.version}}
      expected-commit: f9dc1c8664050edbc75916c3664be1df595a1958

  - uses: go/bump
    with:
      deps: |-
        github.com/prometheus/exporter-toolkit@v0.7.3
        google.golang.org/protobuf@v1.33.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        golang.org/x/crypto@v0.45.0

  - runs: |
      make build

  - runs: |
      install -Dm755 pushgateway "${{targets.destdir}}"/usr/bin/pushgateway

  - uses: strip

update:
  enabled: true
  github:
    identifier: prometheus/pushgateway
    strip-prefix: v
    tag-filter: v1.4.

test:
  pipeline:
    - runs: |
        pushgateway --version
        pushgateway --help
