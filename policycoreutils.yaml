package:
  name: policycoreutils
  version: "3.8"
  epoch: 0
  description: "SELinux policy core utilities"
  copyright:
    - license: GPL-2.0-only

environment:
  contents:
    packages:
      - busybox
      - coreutils
      - python3
      - gcc
      - glibc-dev
      - libsepol-dev
      - libselinux-dev
      - libsemanage-dev
      - gettext

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/SELinuxProject/selinux.git
      tag: ${{package.name}}-${{package.version}}
      expected-commit: 71aec30d068789e856e7cc429b620ae1cfa890f1

  - uses: autoconf/make-install
    working-directory: ${{package.name}}

update:
  enabled: true
  github:
    identifier: SELinuxProject/selinux
    use-tag: true
    tag-filter: policycoreutils-
    strip-prefix: policycoreutils-

test:
  pipeline:
    - runs: |
        test -x /sbin/restorecon
        test -x /sbin/restorecon_xattr
        test -x /sbin/setfiles
        test -x /usr/bin/newrole
        test -x /usr/bin/secon
        test -x /usr/bin/sestatus
        test -x /usr/sbin/fixfiles
        test -x /usr/sbin/load_policy
        test -x /usr/sbin/semodule
        test -x /usr/sbin/setsebool
    - uses: test/ldd-check
      with:
        packages: ${{package.name}}
    - runs: |
        semodule --help
