# Please note that the last release of this package was in Sept 2020 over pypy
# They have't cut tags on Github since 4 years.
# This project is small and looks complete and has no CVEs as of date
# So we can keep it as it is since it's an requirement for spamcheck image
package:
  name: py3-ulid-py
  version: "1.1.0"
  epoch: 0
  description: Universally Unique Lexicographically Sortable Identifier (ULID) in Python
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: ulid-py
  import: ulid

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-pip
      - py3-supported-python-dev
      - py3-supported-setuptools
      - py3-supported-wheel
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ahawker/ulid.git
      tag: v${{package.version}}
      expected-commit: c07998bd51ec06d557172975385aa188abb91a6d

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} -c "import ulid; s=str(ulid.new()); assert len(s)==26 and s.isalnum(), f'unexpected ULID: {s}'; print('Generated ULID:', s); print('All tests passed!')"

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  github:
    identifier: ahawker/ulid
    strip-prefix: v
    use-tag: true
