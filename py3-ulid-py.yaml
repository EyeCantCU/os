package:
  name: py3-ulid-py
  version: "1.1.0"
  epoch: 0
  description: Universally Unique Lexicographically Sortable Identifier (ULID) in Python
  copyright:
    - license: Apache-2.0
  dependencies:
    provider-priority: 0

vars:
  pypi-package: ulid-py
  import: ulid

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-pip
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/ahawker/ulid.git
      tag: v${{package.version}}
      expected-commit: c07998bd51ec06d557172975385aa188abb91a6d

  - name: Python Build
    uses: python/build-wheel

  - uses: strip

test:
  environment:
    contents:
      packages:
        - python3
  pipeline:
    - uses: python/import
      with:
        python: python3
        imports: |
          import ${{vars.import}}

update:
  enabled: true
  github:
    identifier: ahawker/ulid
    strip-prefix: v
    use-tag: true
