#nolint:git-checkout-must-use-github-updates,valid-pipeline-git-checkout-tag
# This version stream exists because it is the last version that
# supported numpy<2
package:
  name: py3-opencv-python-headless-4.11
  version: "4.11.0.86"
  epoch: 4
  description: python bindings for opencv
  copyright:
    - license: MIT

var-transforms:
  - from: ${{package.version}}
    match: '.*\.(\d+)$'
    replace: '$1'
    to: opencv-python-version

vars:
  pypi-package: opencv-python-headless
  import: cv2

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - clang
      - cmake
      - libjpeg-dev
      - libjpeg-turbo-dev
      - lld
      - openblas-dev
      - opencl-dev
      - py3-supported-build-base-dev
      - py3-supported-distro
      - py3-supported-numpy-2.2
      - py3-supported-scikit-build
      - samurai
  environment:
    CFLAGS: -g1 # lifted from opencv.yaml
    CXXFLAGS: -g1 # lifted from opencv.yaml
    CC: clang
    CXX: clang++
    ENABLE_HEADLESS: 1
    VERBOSE: 1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/opencv/opencv-python
      tag: ${{vars.opencv-python-version}}
      expected-commit: 255564a37c4a23275485e827abbe19031347d458
      recurse-submodules: true

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-4.11
    description: python${{range.key}} version of ${{vars.pypi-package}}-4.11
    dependencies:
      runtime:
        - py${{range.key}}-numpy-2.2
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}

  - name: py3-supported-${{vars.pypi-package}}-4.11
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}-4.11
        - py3.11-${{vars.pypi-package}}-4.11
        - py3.12-${{vars.pypi-package}}-4.11
        - py3.13-${{vars.pypi-package}}-4.11
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  release-monitor:
    identifier: 46367
    version-filter-prefix: 4.11.
