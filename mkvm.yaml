contents:
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  repositories:
    - https://packages.wolfi.dev/os
    - https://apk.cgr.dev/extra-packages
  packages:
  # We need an init system to invoke our entrypoint.
  - mattmoor-chainit-init

  # We need a shell
  - dash-binsh
  # We need tar, truncate, and other posix tools.
  - coreutils
  # We use tar to unpack the rootfs.
  - gnutar

  # We use sfdisk to partition disk.
  - sfdisk

  # We need this for mkfs.fat
  - dosfstools
  # We need this for mkfx.xfs
  - xfsprogs

  # debug editing
  - sed

  # We mount and unmount the filesystems after we've formatted them.
  - mount
  - umount

entrypoint:
  command: /bin/sh
cmd: |
  -c "
  set -e
  diffup() {
    i1=${1%.*}${1#*.}
    i2=${2%.*}${2#*.}
    d=$((i2-i1))
    s=${d%??}
    echo $s.${d#$s}
  }
  msg() { echo $*; }
  vr() { echo \"$@\" ; \"$@\"; }

  read startup idle < /proc/uptime
  read cmdline < /proc/cmdline
  echo up at $startup.
  echo /proc/cmdline: $cmdline
  workmp=/workload
  tag=workload
  entrypoint=entry-point
  for t in $cmdline; do
    case $t in
      entry=*) entrypoint=${t#*=};;
      workload=*) tag=${t#*=};;
      env=*) vr export ${t#env=};;
      mp=*)
        m=${t#*=}
        if [ ! -d $m ]; then
           vr mkdir $m
        fi
        vr mount -t 9p -otrans=virtio -oversion=9p2000.L $m /$m
        ;;
    esac
  done
  vr mkdir $workmp
  vr mount -t 9p -otrans=virtio -oversion=9p2000.L $tag $workmp
  rc=0
  read startep idle < /proc/uptime
  export WORKMP=$workmp
  vr $workmp/$entrypoint || rc=$?
  echo $rc > $workmp/result
  read finish idle </proc/uptime
  delta=$(diffup $startep $finish)
  tot=$(diffup $startup $finish)
  echo startup=$startup finish=$finish startep=$startep finish-startup=${tot}s
  echo $entrypoint exited $rc in ${delta}s
  "
# no arch is specified because this is exclusively used with build-cpio which defaults to the host architecture.
