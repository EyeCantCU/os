#nolint:git-checkout-must-use-github-updates,valid-pipeline-git-checkout-tag
package:
  name: neuvector-sigstore-interface-fips
  version: "0_git20251117"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: NeuVector sigstore interface for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openssl-config-fipshardened

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neuvector/sigstore-interface
      branch: main
      expected-commit: 220071a3c8ce88d8bee6f07d19dd7da596778e15

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0
      modroot: .

  - uses: go/build
    with:
      modroot: .
      packages: .
      output: sigstore-interface
      prefix: usr/local
      vendor: true
      go-package: go-fips

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        sigstore-interface --help

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: No releases or tags
