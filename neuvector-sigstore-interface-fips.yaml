#nolint:git-checkout-must-use-github-updates,valid-pipeline-git-checkout-tag
package:
  name: neuvector-sigstore-interface-fips
  version: "0_git20250630"
  epoch: 0
  description: NeuVector sigstore interface for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openssl-config-fipshardened

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neuvector/sigstore-interface
      branch: main
      expected-commit: 838ee1133ca0020368f154adc40510a50a9c9d31

  - uses: go/build
    with:
      modroot: .
      packages: .
      output: sigstore-interface
      prefix: usr/local
      vendor: true
      go-package: go-fips

  - uses: strip

test:
  pipeline:
    - runs: |
        sigstore-interface --help

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: No releases or tags
