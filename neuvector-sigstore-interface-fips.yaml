#nolint:git-checkout-must-use-github-updates,valid-pipeline-git-checkout-tag
package:
  name: neuvector-sigstore-interface-fips
  version: 0_git20250409
  epoch: 0
  description: NeuVector sigstore interface for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openssl-config-fipshardened

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neuvector/sigstore-interface
      expected-commit: c5aa541fc12772d92886b0ea65f510d27f432a65

  - uses: go/bump
    with:
      deps: |-
        github.com/hashicorp/go-retryablehttp@v0.7.7
      modroot: .

  - uses: go/build
    with:
      modroot: .
      packages: .
      output: sigstore-interface
      prefix: usr/local
      vendor: true
      go-package: go-fips

  - uses: strip

test:
  pipeline:
    - runs: |
        sigstore-interface --help

update:
  manual: true
  exclude-reason: No releases or tags
