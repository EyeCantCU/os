#nolint:git-checkout-must-use-github-updates,valid-pipeline-git-checkout-tag
package:
  name: neuvector-sigstore-interface-fips
  version: "0_git20251212"
  epoch: 1 # GHSA-whqx-f9j3-ch6m
  description: NeuVector sigstore interface for the SUSE NeuVector Container Security Platform
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openssl-config-fipshardened

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/neuvector/sigstore-interface
      branch: main
      expected-commit: 6e18947e3fefe787071c3e89518be069a7b92114

  - uses: go/bump
    with:
      deps: |-
        github.com/sigstore/cosign/v3@v3.0.4

  - uses: go/build
    with:
      modroot: .
      packages: .
      output: sigstore-interface
      prefix: usr/local
      vendor: true
      go-package: go-fips

  - uses: strip

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        sigstore-interface --help

update:
  enabled: true
  git: {}
  schedule:
    period: weekly
    reason: No releases or tags
