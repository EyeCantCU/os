package:
  name: eks-distro-kubernetes-csi-external-provisioner-3.6 # when upgrading check if old style go bumps can be removed
  version: 3.6.0 # eks-distro v1-23-eks-33: https://github.com/aws/eks-distro/releases/tag/v1-23-eks-33
  epoch: 8
  description: Sidecar container that watches Kubernetes PersistentVolumeClaim objects and triggers CreateVolume/DeleteVolume against a CSI endpoint
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - eks-distro-kubernetes-csi-external-provisioner=${{package.full-version}}

vars:
  eks-project: kubernetes-csi/external-provisioner
  eks-package-version: 1-23-eks-33

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-distro
      tag: v${{vars.eks-package-version}}
      expected-commit: a200cc89c4a4b8579602fad959065f51baf714d3

  - uses: eks-distro/build
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      # Mitigate CVE-2023-3978, CVE-2023-39325 / CVE-2023-44487 (grpc)
      deps: golang.org/x/net@v0.17.0 google.golang.org/grpc@v1.56.3 google.golang.org/protobuf@v1.33.0 github.com/golang/protobuf@v1.5.4 golang.org/x/net@v0.23.0

  - uses: eks-distro/install
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      binary-target: csi-provisioner

  - uses: strip

update:
  manual: true
