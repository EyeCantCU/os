package:
  name: libcgroup
  version: 3.1.0
  epoch: 40
  description: libcgroup is a library that abstracts the control group file system in Linux
  copyright:
    - license: LGPL-2.1
  dependencies:
    runtime:
      - merged-usrsbin
      - wolfi-baselayout

environment:
  contents:
    packages:
      - bison
      - build-base
      - busybox
      - flex
      - libtool
      - linux-pam-dev
      - systemd-dev

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/libcgroup/libcgroup
      tag: v${{package.version}}
      expected-commit: 16a657c60f9459dda9af1a6f186a8394fe6d785e

  - uses: autoconf/configure
    with:
      opts: --sbindir=/usr/bin

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    description: "${{package.name}} headers"
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

  - name: ${{package.name}}-doc
    description: "${{package.name}} manpages"
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs
    dependencies:
      runtime:
        - merged-usrsbin
        - wolfi-baselayout

update:
  enabled: true
  github:
    identifier: libcgroup/libcgroup
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/ldd-check
      with:
        packages: ${{package.name}}
