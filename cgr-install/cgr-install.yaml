package:
  name: cgr-install
  version: 0.0.1
  epoch: 0
  description: "chainguard disk installer"
  copyright:
    - license: TBD
  dependencies:
    runtime:
      - busybox
      - coreutils
      - cryptsetup
      - dosfstools
      - e2fsprogs
      - efitools
      - findutils
      - gnutar
      - grep
      - harden-vm
      - libfaketime
      - losetup
      - mount
      - mtools
      - openssl
      - partx
      - py3.13-pyuefivars-bin
      - py3.13-virt-firmware-bin
      # Create various EFI signature lists
      # switch to edk2 once available https://github.com/wolfi-dev/os/pull/68037
      - qemu-edk2-aarch64
      - qemu-edk2-x86_64
      - sed
      - sfdisk
      - stampdalf
      - systemd-systemctl
      - systemd-sysusers-standalone
      - umount
      - xfsprogs
      - xfsprogs-extra

environment:
  contents:
    packages:
      - busybox

pipeline:
  - name: install
    runs: |
      install -Dm755 scripts/cgr-install "${{targets.contextdir}}"/usr/bin/cgr-install
      install -Dm755 -t "${{targets.contextdir}}"/usr/lib/cgr-install scripts/builder*

update:
  enabled: false
  exclude-reason: |
    This is the upstream for this package
