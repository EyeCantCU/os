package:
  name: nvidia-gpu-driver
  version: 550.54.14
  epoch: 0
  description: Provision NVIDIA GPU Driver as a Container.
  copyright:
    - license: PROPRIETARY
  dependencies:
    runtime:
      - bash
      - build-base
      - busybox
      - ca-certificates-bundle
      - curl
      - elfutils
      - elfutils-dev
      - file
      - kmod
      - libelf
      - libglvnd-dev
      - nvidia-display-driver
      - nvidia-display-driver-compat
      - nvidia-fabric-manager
      - nvidia-libnvidia-nscq
      - pkgconf
      - pkgconf-dev
      - vgpu-util
      - vgpu-util-compat

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox

pipeline:
  - runs: |
      mkdir -p "${{targets.destdir}}"/
      mkdir -p "${{targets.destdir}}"/usr/local/bin

      cp NGC-DL-CONTAINER-LICENSE "${{targets.destdir}}"/
      cp nvidia-driver "${{targets.destdir}}"/usr/local/bin

# need to manually update the nvidia-driver script from here for now https://github.com/NVIDIA/gpu-driver-container/blob/24.02.06/ubuntu22.04/nvidia-driver
update:
  enabled: false
