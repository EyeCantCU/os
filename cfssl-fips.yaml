package:
  name: cfssl-fips
  version: 1.6.5
  epoch: 0
  description: Cloudflare's PKI and TLS toolkit
  copyright:
    - license: BSD-2-Clause

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/cloudflare/cfssl
      tag: v${{package.version}}
      expected-commit: 96259aa29c9cc9b2f4e04bad7d4bc152e5405dda

data:
  - name: binaries
    items:
      cfssl-bundle:
      cfssl-certinfo:
      cfssl-newkey:
      cfssl-scan:
      cfssljson:
      mkbundle:
      multirootca:

subpackages:
  - range: binaries
    name: ${{package.name}}-${{range.key}}-fips
    pipeline:
      - uses: go/bump
        with:
          deps: google.golang.org/protobuf@v1.33.0 golang.org/x/net@v0.23.0
      - uses: go/build
        with:
          packages: ./cmd/${{range.key}}
          output: ${{range.key}}
          ldflags: -s -w -X github.com/cloudflare/cfssl/cli/version.version=${{package.version}}
          vendor: true
          subpackage: true
          go-package: go-fips
    test:
      pipeline:
        - runs: |
            echo "Testing ${{range.key}}"
            ${{range.key}} -h

update:
  enabled: true
  github:
    identifier: cloudflare/cfssl
    strip-prefix: v
