package:
  name: php-8.2-maxminddb
  version: "1.13.1"
  epoch: 0
  description: PHP ${{vars.phpMM}} MaxMind DB Reader extension - PECL
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - php-${{vars.phpMM}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - libmaxminddb-dev
      - php-${{vars.phpMM}}-bcmath
      - php-${{vars.phpMM}}-dev

var-transforms:
  - from: ${{package.name}}
    match: ^php-(\d+\.\d+)-.*$
    replace: "$1"
    to: phpMM

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/maxmind/MaxMind-DB-Reader-php
      tag: v${{package.version}}
      expected-commit: 2194f58d0f024ce923e685cdf92af3daf9951908

  - name: build/install
    working-directory: ext
    pipeline:
      - uses: pecl/phpize
      - uses: autoconf/make
      - uses: pecl/install
        with:
          extension: maxminddb
      - uses: strip

test:
  environment:
    contents:
      packages:
        - curl
        - wget
  pipeline:
    - runs: |
        php -m | grep -q "maxminddb"

        # Check extension version info
        php -r "
        if (extension_loaded('maxminddb')) {
          echo 'MaxMind DB extension is loaded and working';
        } else {
          echo 'MaxMind DB extension failed to load';
          exit(1);
        }"
    - runs: |
        # Download a test database
        wget https://github.com/maxmind/MaxMind-DB/raw/main/test-data/GeoIP2-City-Test.mmdb

        # Create test script
        cat > test.php << 'EOF'
        <?php
        use MaxMind\Db\Reader;
        $reader = new Reader('GeoIP2-City-Test.mmdb');
        $result = $reader->get('81.2.69.160');
        echo json_encode($result['city']['names']['en']);
        ?>
        EOF

        # Run the test and validate output
        output=$(php test.php)
        if [[ "$output" == '"London"' ]]; then
          echo "Basic functionality test passed: $output"
        else
          echo "Basic functionality test failed: $output"
          exit 1
        fi

update:
  enabled: true
  git:
    strip-prefix: v
