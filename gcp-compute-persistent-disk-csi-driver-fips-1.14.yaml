package:
  name: gcp-compute-persistent-disk-csi-driver-fips-1.14
  version: "1.14.5"
  epoch: 2
  description: The Google Compute Engine Persistent Disk (GCE PD) Container Storage Interface (CSI) Storage Plugin.
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - blkid
      - blockdev
      - btrfs-progs
      - busybox
      - ca-certificates
      - dbus-libs
      - device-mapper
      - e2fsprogs
      - e2fsprogs-extra
      - e2fsprogs-libs
      - glibc
      - json-c
      - kmod-libs
      - libacl1
      - libblkid
      - libbsd
      - libcap
      - libcom_err
      - libcrypto3
      - libgcc
      - libgcrypt
      - libgpg-error
      - liblz4-1
      - libmd
      - libmount
      - libnvme-dev
      - libpcre2-8-0
      - libstdc++
      - libsystemd
      - libuuid
      - mount
      - ncurses
      - nvme-cli
      - readline
      - systemd
      - umount
      - userspace-rcu
      - util-linux
      - util-linux-misc
      - xfsprogs
      - xz
      - zlib

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes-sigs/gcp-compute-persistent-disk-csi-driver
      tag: v${{package.version}}
      expected-commit: c2bf47cd006f04eb3d539f730160c27f481e4abb

  - uses: go/bump
    with:
      deps: |-
        google.golang.org/grpc@v1.64.1
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0

  - uses: go/build
    with:
      go-package: go-fips
      packages: ./cmd/gce-pd-csi-driver/main.go
      ldflags: |
        -X main.version=v${{package.version}}
      output: gce-pd-csi-driver

test:
  pipeline:
    - uses: test/go-fips-check
    - name: help message
      runs: |
        /usr/bin/gce-pd-csi-driver -help

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.14
