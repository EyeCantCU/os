package:
  name: linux-jitterentropy
  version: "6.15.8"
  epoch: 0
  description: "linux jitterentropy object files"
  copyright:
    - license: GPL-2.0

vars:
  objects: crypto/jitterentropy.o crypto/jitterentropy-kcapi.o crypto/jitterentropy-testing.o crypto/sha3_generic.o
  object-cmds: crypto/.jitterentropy.o.cmd crypto/.jitterentropy-kcapi.o.cmd crypto/.jitterentropy-testing.o.cmd crypto/.sha3_generic.o.cmd
  sources: crypto/jitterentropy.c crypto/jitterentropy-kcapi.c crypto/jitterentropy-testing.c crypto/sha3_generic.c
  headers: crypto/jitterentropy.h

var-transforms:
  - from: ${{package.name}}
    match: 'linux-(.*)'
    replace: '$1'
    to: flavor
  - from: ${{package.name}}
    match: 'linux-(.*)'
    replace: '${{package.full-version}}-$1'
    to: version-flavor
  - from: ${{package.version}}
    match: '^(\d+[.]\d+)[.]0$'
    replace: '$1'
    to: mangled-package-version

environment:
  environment:
    KBUILD_BUILD_USER: noreply
    KBUILD_BUILD_HOST: chainguard.dev
    KBUILD_BUILD_VERSION: Chainguard

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/gregkh/linux
      tag: v${{vars.mangled-package-version}}
      expected-commit: e8af141440cebccb6554fc23f8d21ce063b976a1

  - uses: kernel/patch

  - uses: kernel/config
    with:
      make-targets: hardening.config
      flavor: ${{vars.flavor}}
      version-flavor: ${{vars.version-flavor}}

  - uses: kernel/build
    with:
      make-targets: ${{vars.objects}}
      version-flavor: ${{vars.version-flavor}}

  - runs: |
      for i in ${{vars.objects}} ${{vars.object-cmds}} ${{vars.sources}} ${{vars.headers}}; do
        install -Dm 0644 "$i" "${{targets.destdir}}/usr/lib/${{package.name}}-${{package.version}}/$i"
      done
      install -Dm 0644 "config-${{vars.flavor}}" "${{targets.destdir}}/usr/lib/${{package.name}}-${{package.version}}/config"

test:
  environment:
    contents:
      packages:
        - binutils
        - grep
  pipeline:
    - runs: |
        strings /usr/lib/${{package.name}}-${{package.version}}/crypto/jitterentropy.o | grep "${{package.version}}"
        strings /usr/lib/${{package.name}}-${{package.version}}/crypto/jitterentropy.o | grep "${{package.version}}" | grep -vE "(dirty|\+)$"

update:
  enabled: true
  github:
    identifier: gregkh/linux
    use-tag: true
    strip-prefix: v
    tag-filter: v
  ignore-regex-patterns:
    # skip mainline (x.y) release tags, wait for stable (x.y.z) release tags
    - ^\d+[.]\d+$
  version-transform:
    # mainline release tag x.y to kernel version x.y.0
    - match: ^(\d+[.]\d+)$
      replace: $1.0
