package:
  name: py3.9-typing-extensions
  version: "4.15.0"
  epoch: 0
  description: Backported and Experimental Type Hints for Python 3.7+
  copyright:
    - license: PSF-2.0
  dependencies:
    runtime:
      - python-3.9

vars:
  pypi-package: typing-extensions
  module_name: typing_extensions

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3.9-build
      - py3.9-installer
      - py3.9-pip
      - py3.9-wheel
      - python-3.9
      - wolfi-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python/typing_extensions
      tag: ${{package.version}}
      expected-commit: 9d1637e264b5c1a6b7acee3e907015f89b20c2c9

  - uses: python/build-wheel

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        python: python3.9
        import: typing_extensions

update:
  enabled: true
  github:
    identifier: python/typing_extensions
    strip-prefix: v
