package:
  name: bcfips-policy-140-2
  version: 1
  epoch: 0
  description: Java security policy using BouncyCastle FIPS 140-2
  copyright:
    - license: MIT

data:
  - name: java-versions
    items:
      11: ""
      17: ""

environment:
  contents:
    packages:
      - busybox

pipeline:
  - name: Package policy
    runs: |
      mkdir -p "${{targets.contextdir}}/usr/lib/jvm/jdk-fips-config"
      cp java.policy "${{targets.contextdir}}/usr/lib/jvm/jdk-fips-config"

  - name: Package test suite
    runs: |
      mkdir -p ${{targets.contextdir}}/usr/lib/${{package.name}}/
      cp Test.java test.sh ${{targets.contextdir}}/usr/lib/${{package.name}}/

subpackages:
  - range: java-versions
    name: ${{package.name}}-j${{range.key}}
    description: Java ${{range.key}} security policy using BouncyCastle FIPS 140-2
    dependencies:
      runtime:
        - bcfips-policy-140-2
        - bouncycastle-fips-1.0~1
      replaces:
        - openjdk-${{range.key}}-jre-base
    pipeline:
      - name: Create the FIPS configuration
        runs: |
          _java_home="usr/lib/jvm/java-${{range.key}}-openjdk"
          mkdir -p "${{targets.contextdir}}/$_java_home/conf/security"
          cp java.security "${{targets.contextdir}}/$_java_home/conf/security"

  - range: java-versions
    name: ${{package.name}}-additional-sun-providers-j${{range.key}}
    description: "Java ${{range.key}} security policy using BouncyCastle FIPS 140-2"
    dependencies:
      runtime:
        - bcfips-policy-140-2
        - bouncycastle-fips-1.0~1
      replaces:
        - openjdk-${{range.key}}-jre-base
    pipeline:
      - name: Create the FIPS configuration
        runs: |
          _java_home="usr/lib/jvm/java-${{range.key}}-openjdk"
          mkdir -p "${{targets.contextdir}}/$_java_home/conf/security"
          cp additional-sun-providers-java.security "${{targets.contextdir}}/$_java_home/conf/security"

test:
  environment:
    contents:
      packages:
        - bash
        - bcfips-policy-140-2-j11
        - bcfips-policy-140-2-j17
        - openjdk-11
        - openjdk-17
  pipeline:
    - name: Test openjdk
      runs: |
        cd $(mktemp -d)
        cp /usr/lib/bcfips-policy-140-2/* .

        _java_home="/usr/lib/jvm/java-11-openjdk"
        JAVA_HOME="$_java_home" ./test.sh

        _java_home="/usr/lib/jvm/java-17-openjdk"
        JAVA_HOME="$_java_home" ./test.sh

update:
  manual: true
  exclude-reason: |
    Auxiliary package maintained in this enterprise-packages.
