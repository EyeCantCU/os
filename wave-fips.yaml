package:
  name: wave-fips
  version: 0.10.0
  epoch: 0
  description: Kubernetes configuration tracking controller
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - openssl-config-fipshardened

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/wave-k8s/wave
      tag: v${{package.version}}
      expected-commit: 43372fa66848b555e2f962ea5ef7fef6d6d4fdc2

  - uses: go/build
    with:
      packages: ./cmd/manager
      output: wave
      ldflags: -w -X main.VERSION=${{package.version}}
      go-package: go-fips

  - uses: strip

update:
  enabled: true
  ignore-regex-patterns:
    - "wave-"
  github:
    identifier: wave-k8s/wave
    strip-prefix: v

test:
  pipeline:
    - runs: wave --version
    - runs: wave 2>&1 | grep -qi "try setting KUBERNETES_MASTER environment variable"
