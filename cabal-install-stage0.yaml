package:
  name: cabal-install-stage0
  version: "3.10.3.0"
  epoch: 0
  description: "Bootstrap package for Haskell cabal tool"
  copyright:
    - license: "BSD-3-Clause"
  dependencies:
    runtime:
      - ghc<9.10
      - gmp
      - libffi
      - numactl
      - zlib
    provides:
      - cabal-install=3.10.3.0

environment:
  contents:
    packages:
      - build-base
      - busybox
      - dpkg

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://snapshot.debian.org/archive/debian/20250201T205739Z/pool/main/h/haskell-cabal-install/cabal-install_3.10.3.0-1+b1_amd64.deb"
          expected-sha256: "40247df2eb862a05b0571fe0918a029a1d8cfd3f581880a4eeb5409df7583f9d"
          extract: false
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          uri: "https://snapshot.debian.org/archive/debian/20250214T024623Z/pool/main/h/haskell-cabal-install/cabal-install_3.10.3.0-1+b1_arm64.deb"
          expected-sha256: "e73cc1c860d048c05a8f87dfa31bccbb179e3a7d72706fb841313c921a4b41c7"
          extract: false

  - runs: dpkg-deb --fsys-tarfile *.deb | tar -C "${{targets.destdir}}" -xf - ./usr/bin/cabal

  - uses: strip

update:
  enabled: false
  exclude-reason: "don't auto update stage 0 packages"

test:
  pipeline:
    - runs: cabal --version
    - uses: test/tw/ldd-check
