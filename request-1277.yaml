package:
  name: request-1277
  version: 0.1.87
  epoch: 1
  description: RESTful / Secure Management Sidecar for Apache Cassandra with customizations
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - maven
      - openjdk-11
      - openjdk-11-default-jvm

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/k8ssandra/management-api-for-apache-cassandra
      expected-commit: 30be84dcdbfd39314ab320366a08710ad80a9b92
      tag: v${{package.version}}

  - uses: maven/pombump

  - uses: maven/pombump
    with:
      pom: management-api-server/pom.xml
      properties-file: pombump-properties-server.yaml

  - uses: maven/pombump
    with:
      pom: management-api-agent-5.0.x/pom.xml
      properties-file: pombump-properties-management-api-agent-5.0.x.yaml

  - runs: |
      mvn xml-format:xml-format
      MAAC_PATH="${{targets.destdir}}"/opt/management-api
      mkdir -p "${{targets.destdir}}"/usr/local/bin
      mkdir -p "${{targets.destdir}}"/opt/management-api
      export JAVA_HOME=/usr/lib/jvm/java-11-openjdk
      mvn -q -ff package -Dskip.surefire.tests -DskipTests -DskipOpenApi -Dlicense.skip=true

      cp ./cassandra/scripts/docker-entrypoint.sh "${{targets.destdir}}"/usr/local/bin/
      find . -type f -name "datastax-*.jar" -exec mv -t $MAAC_PATH -i '{}' +
      chmod +x "${{targets.destdir}}"/usr/local/bin/docker-entrypoint.sh

      cp -r ./scripts "${{targets.destdir}}"/scripts

update:
  enabled: true
  github:
    identifier: k8ssandra/management-api-for-apache-cassandra
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - management-api-for-apache-cassandra-compat
        - openjdk-11
        - openjdk-11-default-jvm
  pipeline:
    - runs: |
        java -jar /opt/management-api/datastax-mgmtapi-server.jar --help
