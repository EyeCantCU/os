# https://github.com/GoogleCloudPlatform/guest-oslogin/blob/master/packaging/google-compute-engine-oslogin.spec
package:
  name: google-compute-engine-oslogin
  version: "20240701.00"
  epoch: 0
  description: "OS Login Guest Environment for Google Compute Engine"
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - google-guest-agent
      - linux-pam
      - nss
      - systemd
      - policycoreutils

environment:
  contents:
    packages:
      - autoconf
      - automake
      - boost-dev
      - boost-regex
      - build-base
      - busybox
      - curl-dev
      - json-c-dev
      - linux-pam-dev
      - make
      - systemd

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GoogleCloudPlatform/guest-oslogin.git
      tag: ${{package.version}}
      expected-commit: 2170de85a8a11c3eabd4d853940b7810a677560b

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

  - name: "Fixup location for usr merge"
    runs: |
      mv ${{targets.destdir}}/lib/systemd ${{targets.destdir}}/usr/lib/

test:
  pipeline:
    - runs: |
        # Check critical files existence
        test -f /usr/lib/systemd/system/google-oslogin-cache.service
        test -f /usr/bin/google_oslogin_nss_cache
        test -f /usr/lib/security/pam_oslogin_admin.so
        test -f /usr/lib/security/pam_oslogin_login.so

        # Validate binary execution
        google_oslogin_nss_cache --help

        # Check if systemd unit file is properly formatted
        systemd-analyze verify /usr/lib/systemd/system/google-oslogin-cache.service
    - uses: test/tw/ldd-check

update:
  enabled: false
  exclude-reason: |
    Upstream does unusual things with releases. See http://go/google-guest-agent-tag-problem
    These same problems apply to this package as well.
    To check for the latest release, run ./google-guest-common/google_update.sh --latest --package google-compute-engine-oslogin
