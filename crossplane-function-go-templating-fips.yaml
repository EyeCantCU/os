package:
  name: crossplane-function-go-templating-fips
  version: "0.11.0"
  epoch: 2
  description: A Go templating composition function
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - crossplane-crank

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/crossplane-contrib/function-go-templating.git
      tag: v${{package.version}}
      expected-commit: edbf2e70dc44602e17ea7743f89b721ef0069ec9

  - uses: go/build
    with:
      packages: .
      output: function-go-templating
      go-package: go-fips

subpackages:
  - name: crossplane-function-go-templating-compat-fips
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -s /usr/bin/function-go-templating ${{targets.subpkgdir}}/function
          crank xpkg extract xpkg.upbound.io/crossplane-contrib/function-go-templating:v${{package.version}} -o out.gz
          gunzip -c ./out.gz | tee ${{targets.subpkgdir}}/package.yaml
    test:
      pipeline:
        - name: "Verify the symlink"
          runs: |
            test "$(readlink /function)" = "/usr/bin/function-go-templating"
            stat /package.yaml

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    environment:
      GRPC_PORT: 9443
    contents:
      packages:
        - curl
        - wait-for-it
  pipeline:
    - uses: test/go-fips-check
    - name: Smoke tests
      runs: function-go-templating --help | grep -F -e "A Crossplane Composition Function"
    - name: Test if endpoint works
      runs: |
        function-go-templating -d --insecure "--address=localhost:${GRPC_PORT}" &
        DAEMON_PID=$!
        trap 'kill -9 "${DAEMON_PID}"' exit
        wait-for-it "localhost:${GRPC_PORT}"
        curl "localhost:${GRPC_PORT}" --http0.9 -o - -q 2>/dev/null | xxd | grep -F -e '0500 0040' # just an @ and the http0.9 header as the response
