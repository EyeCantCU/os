package:
  name: py3-marko
  version: "2.2.2"
  epoch: 0
  description: Markdown parser with high extensibility.
  copyright:
    - license: MIT

vars:
  pypi-package: marko

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-pdm-backend

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/frostming/marko.git
      tag: v${{package.version}}
      expected-commit: 88e65f1f51c1e88e9e06a8f0b855200122578b28

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            python${{range.key}} <<'EOF' | tee output.txt
            import marko
            text = '''
            # Title
            ## Title2
            ### Title the Third
            Yeah!
            '''
            print(marko.convert(text))
            EOF

            get_line() {
              sed -n "${1}p" output.txt | grep -E -e "${2}"
            }

            get_line 1 "<h1>Title</h1>"
            get_line 2 "<h2>Title2</h2>"
            get_line 3 "<h3>Title the Third</h3>"
            get_line 4 "<p>Yeah!</p>"

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Commands for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - runs: |
            set -o pipefail
            marko --help | grep -F -e "The document to convert"

            marko > text.html <<'EOF'
            # Title
            ## Title2
            ### Title the Third
            Yeah!
            EOF

            get_line() {
              sed -n "${1}p" text.html | grep -F -e "${2}"
            }

            get_line 1 "<h1>Title</h1>"
            get_line 2 "<h2>Title2</h2>"
            get_line 3 "<h3>Title the Third</h3>"
            get_line 4 "<p>Yeah!</p>"

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
