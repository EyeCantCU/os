package:
  name: py3-marko
  version: 2.2.0
  epoch: 0
  description: Markdown parser with high extensibility.
  copyright:
    - license: MIT

vars:
  pypi-package: marko

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-pdm-backend

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/frostming/marko.git
      tag: v${{package.version}}
      expected-commit: 6113ad8cb1a454675d609a5b8495a663bdaf0f29

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
