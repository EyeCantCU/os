package:
  name: crossplane-provider-terraform-fips
  version: "1.0.3"
  epoch: 1 # GHSA-j5w8-q4qc-rx2x
  description: A Crossplane provider for Terraform
  copyright:
    - license: Apache-2.0
  dependencies:
    runtime:
      - bash
      - busybox
      - ca-certificates-bundle
      - curl
      - terraform-compat
      - terraform-fips

environment:
  contents:
    packages:
      - bash
      - build-base
      - busybox
      - crossplane-crank

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d0d02de9da9a666563dba0e4a01d197277394e3f
      repository: https://github.com/crossplane-contrib/provider-terraform
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      output: crossplane-terraform-provider
      packages: ./cmd/provider
      ldflags: |
        -X github.com/crossplane-contrib/provider-terraform/internal/version.Version=v${{package.version}}
      go-package: go-fips

  - runs: |
      crank xpkg extract xpkg.upbound.io/crossplane-contrib/provider-terraform:v${{package.version}}
      mkdir -p "${{targets.destdir}}"
      gunzip out.gz -c > "${{targets.destdir}}"/package.yaml

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for ${{package.name}}
    pipeline:
      - runs: |
          mkdir -p "${{targets.contextdir}}/usr/local/bin"
          ln -sf /usr/bin/crossplane-terraform-provider "${{targets.contextdir}}/usr/local/bin/crossplane-terraform-provider"
    test:
      environment:
        contents:
          packages:
            - ${{package.name}}
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true

update:
  enabled: true
  git:
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - kubectl
        - git
  pipeline:
    # AUTOGENERATED
    - uses: test/go-fips-check
    - runs: |
        crossplane-terraform-provider --help
    - uses: test/kwok/cluster
    - name: Fetch provider-terraform source
      runs: git clone --branch v${{package.version}} --depth=1 https://github.com/crossplane-contrib/provider-terraform.git
    - name: Apply CRDs
      working-directory: provider-terraform/package/crds
      runs: |
        kubectl apply -f .
    - name: Start crossplane-terraform-provider in cluster
      uses: test/daemon-check-output
      with:
        start: |
          crossplane-terraform-provider --debug --poll=10s --sync=30s --timeout=2m
        timeout: 30
        expected_output: |
          Starting Controller
          Starting EventSource
          Starting workers
          Starting metrics server
        post: |
          curl -sf http://localhost:8080/metrics | grep go_gc_duration_seconds
