package:
  name: chart-iamguarded-fluent-bit
  version: 3.1.2
  epoch: 3
  description: Fluent Bit Iamguarded Chart
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - fluent-bit=${{package.full-version}}

environment:
  contents:
    packages:
      - chart-iamguarded-common

pipeline:
  - uses: auth/github
    with:
      repo: chainguard-dev/iamguarded-charts

  - uses: git-checkout
    with:
      repository: https://github.com/chainguard-dev/iamguarded-charts
      tag: fluent-bit/${{package.version}}
      expected-commit: 412517d16ac16572752b4f142991d26693da4d55

  - uses: patch
    with:
      patches: iamguarded.patch

  - uses: iamguarded/prepare
    with:
      chart-path: iamguarded/fluent-bit

  - uses: charts/package
    with:
      chart-path: iamguarded/fluent-bit

update:
  enabled: false
  manual: true
  schedule:
    period: daily
    reason: Update automation doesn't yet support automating from private repos.
  git: {}

test:
  pipeline:
    - uses: auth/github
      with:
        repo: chainguard-dev/iamguarded-charts
    - uses: iamguarded/validate
      with:
        chart-name: /fluent-bit
