package:
  name: pandoc
  version: "3.8.3"
  epoch: 0
  description: "The universal markup converter"
  copyright:
    - license: "GPL-2.0-or-later AND BSD-3-Clause AND MIT"

environment:
  contents:
    packages:
      - build-base
      - busybox
      - cabal-install
      - libffi-dev
      - zlib-dev

pipeline:
  - uses: git-checkout
    with:
      repository: "https://github.com/jgm/pandoc"
      destination: "${{package.name}}"
      tag: "${{package.version}}"
      expected-commit: 568dab14533940ecee16824097400f1eabf13869

  # When updating to a new version, uncomment this and follow its instructions:
  # - working-directory: "${{package.name}}"
  #   uses: haskell/record-dependencies
  #
  - uses: haskell/fetch-dependencies

  - working-directory: "${{package.name}}"
    runs: cabal install -j"$(nproc)" --installdir="${{targets.destdir}}/usr/bin" --install-method=copy pandoc-cli

  - working-directory: "${{package.name}}"
    runs: cabal test -j"$(nproc)"

  - working-directory: "${{package.name}}"
    uses: haskell/install-cabal-freeze

  - uses: strip

update:
  enabled: true
  manual: true
  exclude-reason: "Requires manual updates using haskell/record-dependencies"
  github:
    identifier: jgm/pandoc

test:
  pipeline:
    - runs: pandoc --version
    - uses: test/tw/ldd-check
