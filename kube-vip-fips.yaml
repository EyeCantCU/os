package:
  name: kube-vip-fips
  version: "1.0.0"
  epoch: 1 # CVE-2025-47907
  description: Kubernetes Control Plane Virtual IP and Load-Balancer
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - go-fips

pipeline:
  - uses: git-checkout
    with:
      expected-commit: d8877072d4a1dcb2fde2ccd22b97dbf65a1c2a73
      repository: https://github.com/kube-vip/kube-vip
      tag: v${{package.version}}

  - uses: go/build
    with:
      ldflags: -X=main.Version=${{package.version}} -X=main.Build=$(git rev-parse HEAD)
      output: kube-vip
      packages: .
      go-package: go-fips

  - uses: strip

subpackages:
  - name: "${{package.name}}-compat"
    # https://github.com/kube-vip/kube-vip/blob/2872256a89a1e39b62c9518728ec22e2f33af4eb/Dockerfile#L19
    description: "Compatibility package to place binaries in the location expected by upstream Dockerfile"
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"
          ln -sf /usr/bin/kube-vip ${{targets.subpkgdir}}/kube-vip

update:
  enabled: true
  github:
    identifier: kube-vip/kube-vip
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - ${{package.name}}-compat
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        kube-vip version
        kube-vip --help
    - runs: |
        kube-vip -h
        /kube-vip -h
