package:
  name: msft-prod-packages-22.04
  version: 22.04
  epoch: 1
  description: "Microsoft Packaged Linux Software"
  copyright:
    - license: MIT # https://github.com/microsoft/linux-package-repositories

environment:
  contents:
    packages:
      - busybox

pipeline:
  - uses: fetch
    with:
      uri: https://packages.microsoft.com/config/ubuntu/${{package.version}}/packages-microsoft-prod.deb
      expected-sha512: f4ad514c37f668c01d65973b83fb7d003324178b2f50eeafcc9266b204a951f55d12d7caf60ab099225c3d4194a6947716c0d40639263c2be3a4f42f56421b91
      extract: false

  - runs: |
      mkdir -p "${{targets.contextdir}}"/blobfuse-proxy
      install -Dm644 packages-microsoft-prod.deb "${{targets.contextdir}}"/blobfuse-proxy/packages-microsoft-prod-${{package.version}}.deb
      rm -rf packages-microsoft-prod.deb

update:
  enabled: false

test:
  pipeline:
    - runs: |
        stat "/blobfuse-proxy/packages-microsoft-prod-${{package.version}}.deb" > /dev/null 2>&1 || {
          echo "File /blobfuse-proxy/packages-microsoft-prod-${{package.version}}.deb not found";
          exit 1;
        }
