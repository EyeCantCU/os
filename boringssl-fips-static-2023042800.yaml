package:
  name: boringssl-fips-static-2023042800
  version: 2023042800
  epoch: 1
  description: FIPS validated BoringSSL static libraries
  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - binutils
      - build-base
      - busybox
      - coreutils
      - curl
      - gcc-12-default
      - git
      - libstdc++-12-dev
      - libtool
      # Even though this is the latest version, our solver does not pick it up.
      - ncurses~6.4_p20230722
      - patch
      - perl
      - python3-dev<3.13

vars:
  clang: 16.0.0
  go: 1.21.1
  ninja: 1.11.1
  cmake: 3.27.4

pipeline:
  - runs: mkdir -p clang go ninja cmake boringssl

  - if: ${{build.arch}} == 'aarch64'
    uses: fetch
    with:
      uri: https://github.com/llvm/llvm-project/releases/download/llvmorg-${{vars.clang}}/clang+llvm-${{vars.clang}}-aarch64-linux-gnu.tar.xz
      expected-sha256: b750ba3120e6153fc5b316092f19b52cf3eb64e19e5f44bd1b962cb54a20cf0a
      directory: clang

  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://github.com/llvm/llvm-project/releases/download/llvmorg-${{vars.clang}}/clang+llvm-${{vars.clang}}-x86_64-linux-gnu-ubuntu-18.04.tar.xz
      expected-sha256: 2b8a69798e8dddeb57a186ecac217a35ea45607cb2b3cf30014431cff4340ad1
      directory: clang

  - if: ${{build.arch}} == 'aarch64'
    uses: fetch
    with:
      uri: https://dl.google.com/go/go${{vars.go}}.linux-arm64.tar.gz
      expected-sha256: 7da1a3936a928fd0b2602ed4f3ef535b8cd1990f1503b8d3e1acc0fa0759c967
      directory: go

  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://dl.google.com/go/go${{vars.go}}.linux-amd64.tar.gz
      expected-sha256: b3075ae1ce5dab85f89bc7905d1632de23ca196bd8336afd93fa97434cfa55ae
      directory: go

  - uses: fetch
    with:
      uri: https://github.com/ninja-build/ninja/archive/refs/tags/v${{vars.ninja}}.tar.gz
      expected-sha256: 31747ae633213f1eda3842686f83c2aa1412e0f5691d1c14dbbcc67fe7400cea
      directory: ninja

  - if: ${{build.arch}} == 'aarch64'
    uses: fetch
    with:
      uri: https://github.com/Kitware/CMake/releases/download/v${{vars.cmake}}/cmake-${{vars.cmake}}-linux-aarch64.tar.gz
      expected-sha256: 45538d394bd4ef2a423fa78dff5cad16bcf437a4a6dc655e999177170632b039
      directory: cmake

  - if: ${{build.arch}} == 'x86_64'
    uses: fetch
    with:
      uri: https://github.com/Kitware/CMake/releases/download/v${{vars.cmake}}/cmake-${{vars.cmake}}-linux-x86_64.tar.gz
      expected-sha256: 186c53121cf6ef4e48b51e88690e6ef84f268611064a42e5a2e829c3d6b2efde
      directory: cmake

  - uses: fetch
    with:
      uri: https://commondatastorage.googleapis.com/chromium-boringssl-fips/boringssl-a430310d6563c0734ddafca7731570dfb683dc19.tar.xz
      expected-sha256: 2d5339b756dbf1ceb4fdc4b1c8f19e32ded055292dc57827a6592f15ca9d359f
      directory: boringssl

  # This comes from envoyproxy/envoy/blob/main/bazel/external/boringssl_fips.genrule_cmd
  # with a few mods to make old Clang works w/ newer cstdlib.
  #
  # This script is based on the BoringSSL Security policy and update stream documentation as described in:
  # https://csrc.nist.gov/CSRC/media/projects/cryptographic-module-validation-program/documents/security-policies/140sp4953.pdf
  # https://boringssl.googlesource.com/boringssl/+/refs/heads/main/crypto/fipsmodule/FIPS.md#update-stream
  #
  # A package with this much of version pinning is not very suitable for our
  # infrastructures & tools, because we prefer getting newer/better versions for more
  # security. However, this narrow qualification is somewhat called out in the doc, so
  # we do what needs to be done here.
  - runs: |
      # Older Clang does not know about standard C++ headers locations for newer stdlibc++.
      # We need to be explicit here.
      GCC_INCLUDE=$(find /usr/lib/gcc/${{host.triplet.gnu}} -path '/usr/lib/gcc/*/include/c++' -type d)
      export CPLUS_INCLUDE_PATH=$CPLUS_INCLUDE_PATH:$GCC_INCLUDE:$GCC_INCLUDE/${{host.triplet.gnu}}

      # Since the Envoy binary is compiled with -fPIC, we need to do the same
      # for these libraries, or else they won't link, like the errors reported here
      # https://github.com/envoyproxy/envoy/issues/23784
      export CFLAGS="-fPIC"
      export CPPFLAGS="$CFLAGS"
      export CXXFLAGS="$CFLAGS"

      OS=`uname`
      ARCH=`uname -m`

      # Override $PATH for build tools, to avoid picking up anything else.
      export PATH="/usr/bin:/bin"

      # Sadly, this pre-compiled Clang was compiled w/ libtinfo 5. However,
      # during this build, the ncurses/terminfo libs didn't matter.
      #
      # We create a symlink here so that Clang does not panic, but we
      # probably need to create a separate version stream for ncurses-5, if
      # we want to make this less apalling. However, as the passing test
      # suite suggests this makes no difference.
      ln -sf /usr/lib/libtinfo.so.6 /usr/lib/libtinfo.so.5

      export HOME="$PWD"
      printf "set(CMAKE_C_COMPILER \"clang\")\nset(CMAKE_CXX_COMPILER \"clang++\")\n" > ${HOME}/toolchain
      export PATH="$PWD/clang/bin:$PATH"

      if [ `clang --version | head -1 | awk '{print $3}'` != "${{vars.clang}}" ]; then
        echo "ERROR: Clang version doesn't match."
        exit 1
      fi

      export GOPATH="$PWD/gopath"
      export GOROOT="$PWD/go"
      export PATH="$GOPATH/bin:$GOROOT/bin:$PATH"

      if [ `go version | awk '{print $3}'` != "go${{vars.go}}" ]; then
        echo "ERROR: Go version doesn't match."
        exit 1
      fi

      # Ninja
      cd ninja
      python3 ./configure.py --bootstrap

      export PATH="$PWD:$PATH"

      if [ `ninja --version` != "${{vars.ninja}}" ]; then
        echo "ERROR: Ninja version doesn't match."
        exit 1
      fi
      cd ..

      # CMake
      export PATH="$PWD/cmake/bin:$PATH"

      if [ `cmake --version | head -n1` != "cmake version ${{vars.cmake}}" ]; then
        echo "ERROR: CMake version doesn't match."
        exit 1
      fi

      # Build BoringSSL.
      cd boringssl
      mkdir build && cd build && cmake -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib -GNinja -DCMAKE_TOOLCHAIN_FILE=${HOME}/toolchain -DFIPS=1 -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-fPIC" -DCMAKE_CXX_FLAGS="-fPIC" ..
      ninja

      ninja run_tests

      # Verify correctness of the FIPS build.
      if [ `./tool/bssl isfips` != "1" ]; then
        echo "ERROR: BoringSSL tool didn't report FIPS build."
        exit 1
      else
        echo "PASSED: BoringSSL tool reported FIPS build."
      fi

      # Verify Module version
      ./util/fipstools/test_fips | grep '^Module version: ${{package.version}}$'

      DESTDIR=${{targets.destdir}} ninja install

subpackages:
  # Since the location of crypto/libcrypto.a and ssl/libssl.a overlaps
  # with what openssl-dev provides, in some cases we want to put them
  # in a different location (for example cilium-fips) to avoid conflicts.
  - name: ${{package.name}}-compat
    description: "crypto/libcrypto.a and ssl/libssl.a in non-default locations"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/lib/boringssl-fips-static
          cp -r ${{targets.destdir}}/usr/include ${{targets.subpkgdir}}/usr/lib/boringssl-fips-static
          cp -r ${{targets.destdir}}/usr/lib/libcrypto.a ${{targets.subpkgdir}}/usr/lib/boringssl-fips-static
          cp -r ${{targets.destdir}}/usr/lib/libssl.a ${{targets.subpkgdir}}/usr/lib/boringssl-fips-static
          cp BUILD WORKSPACE ${{targets.subpkgdir}}/usr/lib/boringssl-fips-static

  - name: ${{package.name}}-tools
    description: "ship test tools"
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr
          mv ${{targets.destdir}}/usr/bin ${{targets.subpkgdir}}/usr
          cp boringssl/build/util/fipstools/test_fips ${{targets.subpkgdir}}/usr/bin/bssl-test_fips

test:
  pipeline:
    - uses: test/cmvp-fips-certification-check
      with:
        certificate-number: 4953
        software-version: ${{package.version}}

update:
  enabled: false
  exclude-reason: |
    There is no way we can auto update this. We can manually update once in a while when there is a new validation doc for OpenSSL.
