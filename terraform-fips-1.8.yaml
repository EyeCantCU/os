package:
  name: terraform-fips-1.8
  version: 1.8.5
  epoch: 1
  copyright:
    - license: BUSL-1.1
  dependencies:
    provides:
      - terraform-fips=${{package.full-version}}

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/terraform
      tag: v${{package.version}}
      expected-commit: 8f2d640b719872f9661d46deb628d1f14d0fc135

  - uses: go/bump
    with:
      deps: google.golang.org/protobuf@v1.33.0 github.com/hashicorp/go-retryablehttp@v0.7.7 github.com/hashicorp/go-getter@v1.7.5 github.com/golang-jwt/jwt/v4@v4.5.1

  - uses: go/build
    with:
      packages: .
      go-package: go-fips
      output: terraform
      ldflags: -X github.com/hashicorp/terraform/version.dev="no"

subpackages:
  - name: ${{package.name}}-compat
    description: Compat package for terraform
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/local/bin
          ln -s /usr/bin/terraform "${{targets.subpkgdir}}"/usr/local/bin

  - name: ${{package.name}}-local-provider-config
    description: Configure Terraform to use local providers
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/terraform/provider-mirror
          cat > "${{targets.subpkgdir}}"/terraform/.terraformrc <<EOF
          provider_installation {
            filesystem_mirror {
              path    = "/terraform/provider-mirror"
              include = ["*/*"]
            }
            direct {
              exclude = ["*/*"]
            }
          }
          EOF

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v1.8

test:
  pipeline:
    - uses: test/go-fips-check
    - name: Terraform Initialization
      runs: |
        echo "provider \"local\" {}" > example.tf
        terraform init -input=false || exit 1
        terraform --version
        terraform --help
    - name: Terraform Plan Creation
      runs: |
        terraform plan -input=false -out=tfplan || exit 1
    - name: Terraform Apply Execution
      runs: |
        terraform apply -input=false tfplan || exit 1
