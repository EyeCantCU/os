package:
  name: beats-8
  version: 8.16.1
  epoch: 1
  description: >
    The Beats are lightweight data shippers, written in Go, that you install  on your servers to capture all sorts of operational data (logs, metrics,  network data). They send the data to Elasticsearch directly or via Logstash.

  copyright:
    - license: Apache-2.0

environment:
  contents:
    packages:
      - mage

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/elastic/beats
      tag: v${{package.version}}
      expected-commit: f17e0828f1de9f1a256d3f520324fa6da53daee5

  - uses: go/bump
    with:
      deps: golang.org/x/crypto@v0.31.0

subpackages:
  - name: metricbeat-8
    pipeline:
      - uses: go/build
        with:
          packages: ./metricbeat
          output: metricbeat
      - runs: "mkdir -p \"${{targets.subpkgdir}}\"/usr/bin\nmkdir -p \"${{targets.subpkgdir}}\"/usr/share/metricbeat/modules.d\nmkdir -p \"${{targets.subpkgdir}}\"/usr/share/metricbeat/module\ncp LICENSE.txt \"${{targets.subpkgdir}}\"/usr/share/metricbeat/LICENSE.txt\ncp NOTICE.txt \"${{targets.subpkgdir}}\"/usr/share/metricbeat/NOTICE.txt\ncd metricbeat\ncp metricbeat.docker.yml \"${{targets.subpkgdir}}\"/usr/share/metricbeat/metricbeat.yml\ncp metricbeat.reference.yml \"${{targets.subpkgdir}}\"/usr/share/metricbeat/metricbeat.reference.yml\ncp README.md \"${{targets.subpkgdir}}\"/usr/share/metricbeat/README.md\nmv ../x-pack/metricbeat/module/ \"${{targets.subpkgdir}}\"/usr/share/metricbeat/\nmv ../x-pack/metricbeat/modules.d/ \"${{targets.subpkgdir}}\"/usr/share/metricbeat/\n\nmage dashboards\nmv build/kibana \"${{targets.subpkgdir}}\"/usr/share/metricbeat/\n\nln -sf /usr/bin/metricbeat  \"${{targets.subpkgdir}}\"/usr/share/metricbeat/metricbeat \nmkdir -p \"${{targets.subpkgdir}}\"/usr/share/metricbeat/data \"${{targets.subpkgdir}}\"/usr/share/metricbeat/logs\nchown -R root:root \"${{targets.subpkgdir}}\"/usr/share/metricbeat && \\\n  find \"${{targets.subpkgdir}}\"/usr/share/metricbeat -type d -exec chmod 0755 {} \\; && \\\n  find \"${{targets.subpkgdir}}\"/usr/share/metricbeat -type f -exec chmod 0644 {} \\; && \\\n  chmod 0755 \"${{targets.subpkgdir}}\"/usr/share/metricbeat/metricbeat && \\\n  chmod 0775 \"${{targets.subpkgdir}}\"/usr/share/metricbeat/modules.d && \\\n  chmod 0775 \"${{targets.subpkgdir}}\"/usr/share/metricbeat/data \"${{targets.subpkgdir}}\"/usr/share/metricbeat/logs\n"
      - uses: strip
    test:
      pipeline:
        - runs: |
            metricbeat version
            cd /usr/share/metricbeat
            metricbeat modules list
            metricbeat --help

  - name: metricbeat-8-oci-entrypoint
    dependencies:
      runtime:
        - tini
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          cd metricbeat
          sed 's/{{ \.BeatName }}/metricbeat/g' ../dev-tools/packaging/templates/docker/docker-entrypoint.tmpl > "${{targets.subpkgdir}}"/usr/bin/docker-entrypoint
          chmod 755 "${{targets.subpkgdir}}"/usr/bin/docker-entrypoint

  - name: filebeat-8
    pipeline:
      - uses: go/build
        with:
          packages: ./filebeat
          output: filebeat
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          mkdir -p "${{targets.subpkgdir}}"/usr/share/filebeat/modules.d
          mkdir -p "${{targets.subpkgdir}}"/usr/share/filebeat/module
          cp LICENSE.txt "${{targets.subpkgdir}}"/usr/share/filebeat/LICENSE.txt
          cp NOTICE.txt "${{targets.subpkgdir}}"/usr/share/filebeat/NOTICE.txt
          cd filebeat
          cp filebeat.docker.yml "${{targets.subpkgdir}}"/usr/share/filebeat/filebeat.yml
          cp filebeat.reference.yml "${{targets.subpkgdir}}"/usr/share/filebeat/filebeat.reference.yml
          cp README.md "${{targets.subpkgdir}}"/usr/share/filebeat/README.md
          mv ../x-pack/filebeat/module/ "${{targets.subpkgdir}}"/usr/share/filebeat/
          mv ../x-pack/filebeat/modules.d/ "${{targets.subpkgdir}}"/usr/share/filebeat/
          ln -sf /usr/bin/filebeat "${{targets.subpkgdir}}"/usr/share/filebeat/filebeat
          mkdir -p "${{targets.subpkgdir}}"/usr/share/filebeat/data "${{targets.subpkgdir}}"/usr/share/filebeat/logs
          chown -R root:root "${{targets.subpkgdir}}"/usr/share/filebeat && \
            find "${{targets.subpkgdir}}"/usr/share/filebeat -type d -exec chmod 0755 {} \; && \
            find "${{targets.subpkgdir}}"/usr/share/filebeat -type f -exec chmod 0644 {} \; && \
            chmod 0755 "${{targets.subpkgdir}}"/usr/share/filebeat/filebeat && \
            chmod 0775 "${{targets.subpkgdir}}"/usr/share/filebeat/modules.d && \
            chmod 0775 "${{targets.subpkgdir}}"/usr/share/filebeat/data "${{targets.subpkgdir}}"/usr/share/filebeat/logs
      - uses: strip
    test:
      pipeline:
        - runs: |
            filebeat version
            cd /usr/share/filebeat
            filebeat modules list
            filebeat --help

  - name: filebeat-8-oci-entrypoint
    dependencies:
      runtime:
        - tini
    pipeline:
      - runs: |
          mkdir -p "${{targets.subpkgdir}}"/usr/bin
          cd filebeat
          sed 's/{{ \.BeatName }}/filebeat/g' ../dev-tools/packaging/templates/docker/docker-entrypoint.tmpl > "${{targets.subpkgdir}}"/usr/bin/docker-entrypoint
          chmod 755 "${{targets.subpkgdir}}"/usr/bin/docker-entrypoint

update:
  enabled: true
  github:
    strip-prefix: v
    tag-filter: v8.
    identifier: elastic/beats
