package:
  name: nvidia-nsight-compute-12.0
  version: 2022.4.1.6
  epoch: 1
  description: Nsight Compute
  copyright:
    - license: LicenseRef-NVIDIA-SLA
      license-path: LICENSE
  options:
    no-depends: true
  dependencies:
    provides:
      - nvidia-nsight-compute=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox

var-transforms:
  - from: ${{package.name}}
    match: '.*-(\d+\.\d+).*'
    replace: '$1'
    to: cuda-version

pipeline:
  - assertions:
      required-steps: 1
    pipeline:
      - if: ${{build.arch}} == 'aarch64'
        uses: fetch
        with:
          # SBSA = ARM Server Base System Architecture (now called SystemReady)
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/nsight_compute/linux-sbsa/nsight_compute-linux-sbsa-${{package.version}}-archive.tar.xz"
          expected-sha256: "ffe9a0ab066d507b6842eadb6742cf96809d040b94cc8290b5d385622b0e1a44"
          timeout: 30
      - if: ${{build.arch}} == 'x86_64'
        uses: fetch
        with:
          uri: "https://developer.download.nvidia.com/compute/cuda/redist/nsight_compute/linux-x86_64/nsight_compute-linux-x86_64-${{package.version}}-archive.tar.xz"
          expected-sha256: "956e33a364c05c241119ad516e3f60bedafa3153e3e9c0767d339e991cb7834e"
          timeout: 30

  # Setup version symlinks
  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/

  - runs: |
      mkdir -p ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv bin ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/
      mv nsight-compute ${{targets.destdir}}/usr/local/cuda-${{vars.cuda-version}}/

test:
  environment:
    contents:
      packages:
        - bash
  pipeline:
    - name: Verify installation and binaries
      runs: |
        test -x /usr/local/cuda-${{vars.cuda-version}}/bin/ncu
        test -x /usr/local/cuda-${{vars.cuda-version}}/bin/ncu-ui
    - name: Test binary functionality
      runs: |
        # Create symlinks for the nsight-compute version
        ln -s /usr/local/cuda-${{vars.cuda-version}}/nsight-compute/2022.4.1 /usr/local/cuda-${{vars.cuda-version}}/nsight-compute-2022.4.1

        /usr/local/cuda-${{vars.cuda-version}}/bin/ncu --version
        /usr/local/cuda-${{vars.cuda-version}}/bin/ncu --list-sections

update:
  enabled: false
