awspub:
  source:
    path: "$WOLFI_VM/output/x86_64/aws-squid-hardened-slim/disk.vmdk"
    architecture: "x86_64"
  s3:
    bucket_name: "chainguard-marketplace-vms"
  images:
    "chainguard-squid-slim-hardened-x86_64-$BUILD_TIMESTAMP":
      description: "chainguard-squid-slim-hardened-x86_64-$BUILD_TIMESTAMP"
      boot_mode: "uefi"
      public: false
      uefi_data: "$WOLFI_VM/output/x86_64/aws-squid-hardened-slim/uefi-data.aws"
      tpm_support: "v2.0"
      imds_support: "v2.0"
      share:
        # Chainguard Dev Organization unit
        - "arn:aws:organizations::412589716172:ou/o-anih79mrvn/ou-amv9-ndi0nlgq"
        - "677043465004" # chainguard-test-vms
      regions:
        - "us-east-1"
