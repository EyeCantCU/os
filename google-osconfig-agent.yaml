# Adapted from: https://github.com/GoogleCloudPlatform/osconfig/blob/master/packaging/google-osconfig-agent.spec
package:
  name: google-osconfig-agent
  version: "20251028.00"
  epoch: 4 # GHSA-j5w8-q4qc-rx2x
  description: "google osconfig agent"
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/GoogleCloudPlatform/osconfig.git
      tag: ${{package.version}}
      expected-commit: 6ee0a9ad50eb1569431b70a2e50232c7052445db

  - uses: go/bump
    with:
      deps: |-
        github.com/opencontainers/selinux@v1.13.0
        github.com/containerd/containerd@v1.7.29
        golang.org/x/crypto@v0.45.0

  - uses: go/build
    with:
      packages: .
      output: google_osconfig_agent

  - runs: |
      install -d ${{targets.destdir}}/var/lib/google_osconfig_agent
      install -d ${{targets.destdir}}/usr/lib/systemd/system/
      install -d ${{targets.destdir}}/usr/lib/systemd/system-preset/
      install -p -m 0644 ${{package.name}}.service ${{targets.destdir}}/usr/lib/systemd/system/
      install -p -m 0644 ${{package.name}}.conf ${{targets.destdir}}/usr/lib/systemd/system/
      install -p -m 0644 90-${{package.name}}.preset ${{targets.destdir}}/usr/lib/systemd/system-preset/

test:
  pipeline:
    - runs: |
        google_osconfig_agent --help

update:
  enabled: false
  exclude-reason: |
    Upstream does unusual things with releases. See http://go/google-guest-agent-tag-problem
    These same problems apply to this package as well.
    To check for the latest release, run ./google-guest-common/google_update.sh --latest --package google-osconfig-agent
