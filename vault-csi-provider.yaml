package:
  name: vault-csi-provider
  version: "1.5.1"
  epoch: 1
  description: CSI (Container Storage Interface) plugin for HashiCorp Vault
  copyright:
    - license: BUSL-1.1
  dependencies:
    provides:
      # REMOVE_POST_USRMERGE - https://github.com/orgs/wolfi-dev/discussions/40270
      - ${{package.name}}-compat=${{package.full-version}}
    runtime:
      - merged-bin
      - wolfi-baselayout

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/vault-csi-provider
      tag: v${{package.version}}
      expected-commit: f6d0e49c0d273a10bf53e8e65e51c7e924bb1bfb

  - uses: go/build
    with:
      packages: .
      modroot: .
      output: vault-csi-provider
      ldflags: -X 'github.com/hashicorp/vault-csi-provider/internal/version.BuildVersion=${{package.version}}' -X 'github.com/hashicorp/vault-csi-provider/internal/version.GoVersion=$(go version)' -X 'github.com/hashicorp/vault-csi-provider/internal/version.BuildDate=$(date ${SOURCE_DATE_EPOCH:+ -d@${SOURCE_DATE_EPOCH}} "+%Y-%m-%dT%H:%M:%SZ")'

update:
  enabled: true
  github:
    identifier: hashicorp/vault-csi-provider
    strip-prefix: v

test:
  pipeline:
    - runs: |
        vault-csi-provider --version
        vault-csi-provider --help
