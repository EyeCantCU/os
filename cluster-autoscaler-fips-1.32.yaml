package:
  name: cluster-autoscaler-fips-1.32
  version: "1.32.1"
  epoch: 5
  description: Autoscaling components for Kubernetes
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - cluster-autoscaler-fips=${{package.full-version}}
    runtime:
      # for fips config & fips-provider
      - openssl-config-fipshardened
      # either melange SCA should provide these
      # or we should make go-fips shared link on these
      - so:libcrypto.so.3
      - so:libssl.so.3

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kubernetes/autoscaler
      tag: cluster-autoscaler-${{package.version}}
      expected-commit: 68fefc9fee7056ccfc78717c72cfa9f6c3c5071b

  - uses: go/bump
    with:
      deps: |-
        k8s.io/kubernetes@v1.32.6
      modroot: vertical-pod-autoscaler/e2e

  - uses: go/bump
    with:
      deps: |-
        github.com/Azure/azure-sdk-for-go/sdk/azidentity@v1.6.0
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        github.com/golang-jwt/jwt/v4@v4.5.2
        github.com/golang-jwt/jwt/v5@v5.2.2
        golang.org/x/net@v0.38.0
        k8s.io/kubernetes@v1.32.6
      modroot: cluster-autoscaler

  - uses: go/build
    with:
      modroot: cluster-autoscaler
      packages: .
      output: cluster-autoscaler
      vendor: true
      go-package: go-fips

subpackages:
  - name: ${{package.name}}-compat
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}
          # The upstream helm chart assumes the binary is in /.
          ln -sf /usr/bin/cluster-autoscaler ${{targets.subpkgdir}}/cluster-autoscaler
    dependencies:
      provides:
        - cluster-autoscaler-fips-compat=${{package.full-version}}

test:
  pipeline:
    - name: Check binary help output
      runs: |
        # Check that the help output contains a usage message
        # Returns exit code 2 for some reason; this appears to be expected though so we ignore it.
        cluster-autoscaler --help > /tmp/help.txt 2>&1 || true
        if ! grep -q "Usage of cluster-autoscaler:" /tmp/help.txt; then
          echo "Usage not found in help output" >&2
          exit 1
        fi
        echo "Cluster Autoscaler help output valid."
    - uses: test/go-fips-check

update:
  enabled: true
  github:
    identifier: kubernetes/autoscaler
    strip-prefix: cluster-autoscaler-
    use-tag: true
    # There are other tags like "cluster-autoscaler-chart-FOO"
    tag-filter: cluster-autoscaler-1.32.
