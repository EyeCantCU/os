package:
  name: py3-wsproto
  version: "1.2.0"
  epoch: 0
  description: WebSockets state-machine based protocol implementation
  copyright:
    - license: MIT

vars:
  pypi-package: wsproto
  import: wsproto

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - build-base
      - busybox
      - py3-supported-build-base

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/python-hyper/wsproto
      tag: ${{package.version}}
      expected-commit: 7f5a75597ec5d47aa84fda2eeccc0b8532ce76c6

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: python${{range.key}} version of ${{vars.pypi-package}}
    dependencies:
      runtime:
        - py${{range.key}}-h11
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - name: Test basic functionality
          runs: |
            python${{range.key}} <<-EOF
            import wsproto
            from wsproto import WSConnection, ConnectionType
            from wsproto.events import Request, AcceptConnection, CloseConnection, TextMessage, BytesMessage, Ping, Pong

            assert hasattr(wsproto, 'WSConnection')
            assert hasattr(wsproto, 'ConnectionType')

            assert hasattr(ConnectionType, 'CLIENT')
            assert hasattr(ConnectionType, 'SERVER')

            assert hasattr(WSConnection, '__init__')
            assert hasattr(WSConnection, 'send')
            assert hasattr(WSConnection, 'receive_data')
            assert hasattr(WSConnection, 'events')

            ws_client = WSConnection(ConnectionType.CLIENT)
            assert ws_client is not None

            ws_server = WSConnection(ConnectionType.SERVER)
            assert ws_server is not None

            assert hasattr(Request, '__init__')
            assert hasattr(AcceptConnection, '__init__')
            assert hasattr(CloseConnection, '__init__')
            assert hasattr(TextMessage, '__init__')
            assert hasattr(BytesMessage, '__init__')
            assert hasattr(Ping, '__init__')
            assert hasattr(Pong, '__init__')

            request = Request(host='example.com', target='/')
            assert request is not None
            assert hasattr(request, 'host')
            assert hasattr(request, 'target')

            accept = AcceptConnection()
            assert accept is not None

            close = CloseConnection(code=1000, reason='Normal closure')
            assert close is not None
            assert hasattr(close, 'code')
            assert hasattr(close, 'reason')
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

test:
  pipeline:
    - uses: test/emptypackage

update:
  enabled: true
  git:
    strip-prefix: v
