package:
  name: nmap
  version: "7.97"
  epoch: 0
  description: "network discovery and security auditing tool"
  # Custom license, but we can distribute under the 'mere aggregation' GPL
  # clause. Ref: https://github.com/nmap/nmap/issues/2199#issuecomment-2127278266
  copyright:
    - license: LicenseRef-Nmap-Public-Source-License
      license-path: LICENSE

environment:
  contents:
    packages:
      - autoconf
      - automake
      - build-base
      - busybox
      - ca-certificates-bundle
      - libcap-utils
      - openssl-dev

pipeline:
  - uses: fetch
    with:
      uri: https://nmap.org/dist/nmap-${{package.version}}.tar.bz2
      expected-sha256: af98f27925c670c257dd96a9ddf2724e06cb79b2fd1e0d08c9206316be1645c0

  - uses: autoconf/configure

  - uses: autoconf/make

  - uses: autoconf/make-install

  - uses: strip

  - runs: |
      setcap cap_net_raw,cap_net_admin,cap_net_bind_service+eip "${{targets.destdir}}"/usr/bin/nmap

update:
  enabled: true
  release-monitor:
    identifier: 2096

subpackages:
  - name: nmap-doc
    description: nmap documentation
    pipeline:
      - uses: split/manpages
    test:
      pipeline:
        - uses: test/docs

test:
  environment:
  pipeline:
    - runs: |
        ncat --version
        nping --version
        ncat --help
        nping --help
