package:
  name: prometheus-blackbox-exporter-fips
  version: "0.27.0"
  epoch: 0
  description: Blackbox prober exporter
  copyright:
    - license: Apache-2.0

var-transforms:
  - from: ${{package.version}}
    match: ^(\d+).*
    replace: $1
    to: major-version

vars:
  PKG: "github.com/prometheus/common"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/prometheus/blackbox_exporter
      tag: v${{package.version}}
      expected-commit: 46ea0224f57b708fdff317f8872765a77ef64034

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      output: blackbox_exporter
      ldflags: |
        -X ${{vars.PKG}}/version.Version=v${{package.version}}
        -X ${{vars.PKG}}/version.Revision=$(git rev-parse --short HEAD)
        -X ${{vars.PKG}}/version.Branch=$(git branch --show-current)
        -X ${{vars.PKG}}/version.BuildDate=$(date -d@${SOURCE_DATE_EPOCH} -u +'%Y-%m-%dT%H:%M:%SZ')

  - runs: |
      install -Dm644 blackbox.yml "${{targets.destdir}}"/etc/blackbox_exporter/config.yml

subpackages:
  - name: ${{package.name}}-iamguarded-compat
    description: "iamguarded compat package for ${{package.name}}"
    pipeline:
      - uses: iamguarded/build-compat
        with:
          package: prometheus-blackbox-exporter
          version: ${{vars.major-version}}
      - runs: |
          mkdir -p /opt/iamguarded/blackbox-exporter/bin
          ln -sf /usr/bin/blackbox_exporter /opt/iamguarded/blackbox-exporter/bin/blackbox_exporter
      - uses: iamguarded/finalize-compat
        with:
          package: prometheus-blackbox-exporter
          version: ${{vars.major-version}}
    test:
      pipeline:
        - runs: stat /opt/iamguarded/blackbox-exporter/bin/blackbox_exporter
        - uses: iamguarded/test-compat
          with:
            package: prometheus-blackbox-exporter
            version: ${{vars.major-version}}

update:
  enabled: true
  github:
    identifier: prometheus/blackbox_exporter
    strip-prefix: v

test:
  pipeline:
    - uses: test/go-fips-check
    - runs: |
        blackbox_exporter --version
        blackbox_exporter --help
