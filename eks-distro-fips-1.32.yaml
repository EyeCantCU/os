package:
  name: eks-distro-fips-1.32
  version: "1.32.26"
  epoch: 0 # CVE-2025-47907
  description: EKS Distro FIPS 1.32 components
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - eks-distro-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - libcap-utils
  environment:
    BUILD_ARTIFACTS: "true" # New Makefile changes in 2025/07 need this to checkout the repo properly

# Transform the full version that EKS talks about. They use a form:
# 1-30-eks-12, where 1-30 is the k8s version, 12 is the eks-distro release.
var-transforms:
  - from: ${{package.version}}
    match: '\.'
    replace: '-'
    to: package-version
  - from: ${{vars.package-version}}
    match: '(\d+-\d+-)(\d+)'
    replace: '$2'
    to: eks-version
  - from: ${{vars.package-version}}
    match: '(\d+-\d+)(-\d+)'
    replace: '$1-eks$2'
    to: mangled-package-version
  - from: ${{vars.package-version}}
    match: '(\d+-\d+)-\d+'
    replace: '$1'
    to: kubernetes-version
  - from: ${{package.version}}
    match: '(\d+\.\d+)(\.\d+)'
    replace: '$1'
    to: kubernetes-major-minor

# There are also things like kubectl, kubeadm, kubelet at least.
# But there are no eks-distro containers for them, nor releases,
# so we don't build them yet.
data:
  - name: kubernetes-components
    items:
      kube-scheduler:
      kube-proxy:
      kube-controller-manager:
      kube-apiserver:

vars:
  # Projects
  coredns: "coredns/coredns"
  kubernetes: "kubernetes/kubernetes"

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-distro
      tag: v${{vars.mangled-package-version}}
      expected-commit: e1a3b89fe3ea02c9416b8d43b43ab72da7afc26c

  # Patch the bootstrap script to use local files instead of AWS S3
  - uses: patch
    with:
      patches: patch-bootstrap-use-local.patch

  # Checkout EKS distro projects
  - runs: |
      export RELEASE_BRANCH="${{vars.kubernetes-version}}"
      projectdir="$(pwd)/projects"
      for project in "${{vars.kubernetes}}" "${{vars.coredns}}"; do
        # Go to project
        cd "${projectdir}/${project}"
        # Checkout and patch project
        make checkout-repo
        # Return to projects dir
        cd "${projectdir}"
      done

  # Keep all the go/bump steps together for easier package update
  - uses: go/bump
    with:
      deps: |-
        golang.org/x/oauth2@v0.28.0
        golang.org/x/crypto@v0.37.0
        golang.org/x/net@v0.39.0
      modroot: ./projects/kubernetes/kubernetes/kubernetes

  - uses: go/bump
    with:
      deps: |-
        github.com/golang-jwt/jwt/v4@v4.5.2
      modroot: ./projects/coredns/coredns/coredns

subpackages:
  - range: kubernetes-components
    name: eks-distro-${{range.key}}-fips-${{vars.kubernetes-major-minor}}
    dependencies:
      provides:
        - eks-distro-${{range.key}}-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          packages: ./cmd/${{range.key}}
          output: ${{range.key}}
          modroot: ./projects/${{vars.kubernetes}}/kubernetes
          go-package: go-fips
      - runs: |
          mkdir -p ${{targets.contextdir}}/usr/local/bin
          ln -s /usr/bin/${{range.key}} ${{targets.contextdir}}/usr/local/bin/${{range.key}}
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: "^eks-distro-${{range.key}}-fips-${{vars.kubernetes-major-minor}}"
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: eks-distro-${{range.key}}-fips
            real-pkg-name: ${{subpkg.name}}

  - name: eks-distro-coredns-fips-${{vars.kubernetes-major-minor}}
    dependencies:
      provides:
        - eks-distro-coredns-fips=${{package.full-version}}
    pipeline:
      - uses: go/build
        with:
          packages: .
          output: coredns
          modroot: ./projects/${{vars.coredns}}/coredns
          go-package: go-fips
      - runs: |
          setcap cap_net_bind_service=+ep ${{targets.subpkgdir}}/usr/bin/coredns
          ln -s /usr/bin/coredns ${{targets.contextdir}}/coredns
    test:
      pipeline:
        - uses: test/go-fips-check
          with:
            package-match: "^eks-distro-coredns-fips-${{vars.kubernetes-major-minor}}"
        - uses: test/virtualpackage
          with:
            virtual-pkg-name: eks-distro-coredns-fips
            real-pkg-name: ${{subpkg.name}}

update:
  enabled: true
  version-transform:
    - match: 'eks-'
      replace: ''
    - match: '-'
      replace: '.'
  github:
    identifier: aws/eks-distro
    strip-prefix: v
    tag-filter: v1-32

# Based on package contents inspection, it was found that this origin package is empty apart from its own SBOM and this test was added to confirm it is empty and will fail if the package is no longer empty (contains more than an SBOM)
test:
  pipeline:
    - uses: test/emptypackage
    - uses: test/virtualpackage
      with:
        virtual-pkg-name: eks-distro-fips
