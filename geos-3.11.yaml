package:
  name: geos-3.11
  version: "3.11.5"
  epoch: 0
  description: GEOS is a library providing OpenGIS and JTS spatial operations in C++.
  copyright:
    - license: LGPL-2.1-or-later
  dependencies:
    provides:
      - geos=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - cmake
      - samurai

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/libgeos/geos
      tag: ${{package.version}}
      expected-commit: da523da63adc2b2b14f83bad1d49062f2b309911

  - uses: cmake/configure

  - uses: cmake/build

  - uses: cmake/install

  - uses: strip

subpackages:
  - name: ${{package.name}}-dev
    pipeline:
      - uses: split/dev
    dependencies:
      runtime:
        - ${{package.name}}
      provides:
        - geos-dev=${{package.full-version}}
    description: geos dev
    test:
      pipeline:
        - uses: test/pkgconf
        - uses: test/tw/ldd-check

update:
  enabled: true
  github:
    identifier: libgeos/geos
    tag-filter: 3.11

test:
  pipeline:
    - uses: test/tw/ldd-check
