package:
  name: volcano-fips
  version: "1.13.0"
  epoch: 0
  description: A Cloud Native Batch System
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 943b8c23d402462b63f1e21f7f7a39129ba8d63c
      repository: https://github.com/volcano-sh/volcano
      tag: v${{package.version}}

  - uses: go/bump
    with:
      deps: |-
        google.golang.org/grpc@v1.68.1
        k8s.io/kubernetes@v1.33.4

subpackages:
  - name: vc-scheduler-fips
    description: subpackage for volcano scheduler
    pipeline:
      - uses: go/build
        with:
          ldflags: |
            -X 'volcano.sh/volcano/pkg/version.GitSHA=$(git rev-parse HEAD)'
            -X 'volcano.sh/volcano/pkg/version.Built=$(date -u -d "@$SOURCE_DATE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ')'
            -X 'volcano.sh/volcano/pkg/version.Version=${{package.version}}'
          packages: ./cmd/scheduler
          go-package: go-fips
          output: vc-scheduler
      - runs: |
          mkdir -p "${{targets.contextdir}}"/
          ln -sf /usr/bin/vc-scheduler ${{targets.contextdir}}/vc-scheduler
    test:
      environment:
        contents:
          packages:
            - vc-scheduler-fips
            - curl
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true
        - uses: test/kwok/cluster
        - uses: test/daemon-check-output
          with:
            setup: |
              kubectl create ns volcano-system
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/batch.volcano.sh_cronjobs.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/batch.volcano.sh_jobs.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/bus.volcano.sh_commands.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/nodeinfo.volcano.sh_numatopologies.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/scheduling.volcano.sh_podgroups.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/scheduling.volcano.sh_queues.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/topology.volcano.sh_hypernodes.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/charts/jobflow/crd/bases/flow.volcano.sh_jobflows.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/charts/jobflow/crd/bases/flow.volcano.sh_jobtemplates.yaml
            start: vc-scheduler --kubeconfig $HOME/.kwok/clusters/kwok/kubeconfig.yaml
            timeout: 30
            expected_output: |
              successfully acquired lease volcano-system/volcano

  - name: vc-controller-manager-fips
    description: subpackage for volcano controller manager
    pipeline:
      - uses: go/build
        with:
          ldflags: |
            -X 'volcano.sh/volcano/pkg/version.GitSHA=$(git rev-parse HEAD)'
            -X 'volcano.sh/volcano/pkg/version.Built=$(date -u -d "@$SOURCE_DATE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ')'
            -X 'volcano.sh/volcano/pkg/version.Version=${{package.version}}'
          packages: ./cmd/controller-manager
          go-package: go-fips
          output: vc-controller-manager
      - runs: |
          mkdir -p "${{targets.contextdir}}"/
          ln -sf /usr/bin/vc-controller-manager ${{targets.contextdir}}/vc-controller-manager
    test:
      environment:
        contents:
          packages:
            - vc-controller-manager-fips
            - curl
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true
        - uses: test/kwok/cluster
        - uses: test/daemon-check-output
          with:
            setup: |
              kubectl create ns volcano-system
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/batch.volcano.sh_cronjobs.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/batch.volcano.sh_jobs.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/bus.volcano.sh_commands.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/nodeinfo.volcano.sh_numatopologies.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/scheduling.volcano.sh_podgroups.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/scheduling.volcano.sh_queues.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/topology.volcano.sh_hypernodes.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/charts/jobflow/crd/bases/flow.volcano.sh_jobflows.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/charts/jobflow/crd/bases/flow.volcano.sh_jobtemplates.yaml
            start: vc-controller-manager --kubeconfig $HOME/.kwok/clusters/kwok/kubeconfig.yaml
            timeout: 30
            expected_output: |
              JobTemplateController is running
              JobFlowController is running
              CronJobController is running
              JobController is running

  - name: vc-webhook-manager-fips
    description: subpackage for volcano webhook-manager
    pipeline:
      - uses: go/build
        with:
          ldflags: |
            -X 'volcano.sh/volcano/pkg/version.GitSHA=$(git rev-parse HEAD)'
            -X 'volcano.sh/volcano/pkg/version.Built=$(date -u -d "@$SOURCE_DATE_EPOCH" +'%Y-%m-%dT%H:%M:%SZ')'
            -X 'volcano.sh/volcano/pkg/version.Version=${{package.version}}'
          packages: ./cmd/webhook-manager
          go-package: go-fips
          output: vc-webhook-manager
      - runs: |
          mkdir -p "${{targets.contextdir}}"/
          ln -sf /usr/bin/vc-webhook-manager ${{targets.contextdir}}/vc-webhook-manager
    test:
      environment:
        contents:
          packages:
            - vc-webhook-manager-fips
            - openssl
            - curl
            - helm
      pipeline:
        - uses: test/tw/symlink-check
          with:
            allow-absolute: true
        - uses: test/kwok/cluster
        - uses: test/daemon-check-output
          with:
            setup: |
              mkdir -p certs
              openssl req -x509 -newkey rsa:2048 -sha256 -days 365 \
                -keyout certs/tls.key -out certs/tls.crt -nodes \
                -subj "/CN=localhost/O=fake" \
                -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

              cp certs/tls.crt certs/ca.crt

              helm repo add volcano-sh https://volcano-sh.github.io/helm-charts
              helm repo update

              helm template volcano volcano-sh/volcano \
              --version ${{package.version}} \
              --namespace volcano-system \
              --show-only templates/webhooks.yaml \
              --set custom.admission_enable=true \
              --set-string custom.enabled_admissions="/jobs/mutate\,/jobs/validate\,/podgroups/mutate\,/podgroups/validate\,/queues/mutate\,/queues/validate\,/hypernodes/validate\,/cronjobs/validate\,/pods/validate\,/pods/mutate" \
              | kubectl apply -f -

              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/batch.volcano.sh_cronjobs.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/batch.volcano.sh_jobs.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/bus.volcano.sh_commands.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/nodeinfo.volcano.sh_numatopologies.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/scheduling.volcano.sh_podgroups.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/scheduling.volcano.sh_queues.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/crd/bases/topology.volcano.sh_hypernodes.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/charts/jobflow/crd/bases/flow.volcano.sh_jobflows.yaml
              kubectl apply -f https://raw.githubusercontent.com/volcano-sh/volcano/refs/tags/v${{package.version}}/installer/helm/chart/volcano/charts/jobflow/crd/bases/flow.volcano.sh_jobtemplates.yaml

              cat <<'EOF' > volcano-admission.conf
              plugins:
                - name: mutatepod
                  path: /pods/mutate
                  type: MutatingAdmissionWebhook
                - name: validatepod
                  path: /pods/validate
                  type: ValidatingAdmissionWebhook
                - name: mutatequeue
                  path: /queues/mutate
                  type: MutatingAdmissionWebhook
                - name: validatequeue
                  path: /queues/validate
                  type: ValidatingAdmissionWebhook
                - name: mutatepodgroup
                  path: /podgroups/mutate
                  type: MutatingAdmissionWebhook
                - name: validatepodgroup
                  path: /podgroups/validate
                  type: ValidatingAdmissionWebhook
                - name: mutatejob
                  path: /jobs/mutate
                  type: MutatingAdmissionWebhook
                - name: validatejob
                  path: /jobs/validate
                  type: ValidatingAdmissionWebhook
                - name: validatehypernode
                  path: /hypernodes/validate
                  type: ValidatingAdmissionWebhook
                - name: validatecronjob
                  path: /cronjobs/validate
                  type: ValidatingAdmissionWebhook
              EOF
            start: |
              vc-webhook-manager \
                --tls-cert-file=certs/tls.crt \
                --tls-private-key-file=certs/tls.key \
                --ca-cert-file=certs/ca.crt \
                --kubeconfig $HOME/.kwok/clusters/kwok/kubeconfig.yaml \
                --admission-conf=volcano-admission.conf \
                --webhook-namespace=default \
                --webhook-service-name=fake-webhook \
                --enable-healthz \
                --healthz-address=":11251"
            timeout: 40
            # webhook-manager doesn't log anything helpful after running the binary
            # writing maxprocs just to bypass the lint check
            expected_output: maxprocs
            post: |
              curl --cacert certs/ca.crt https://localhost:11251/healthz | grep ok

update:
  enabled: true
  github:
    identifier: volcano-sh/volcano
    strip-prefix: v

test:
  environment:
    contents:
      packages:
        - vc-scheduler-fips
        - vc-controller-manager-fips
        - vc-webhook-manager-fips
  pipeline:
    - uses: test/go-fips-check
    - uses: test/tw/help-check
      with:
        bins: vc-scheduler vc-controller-manager
    - uses: test/tw/help-check
      with:
        bins: vc-webhook-manager
        help-flag: -h
    - uses: test/tw/ver-check
      with:
        bins: vc-scheduler vc-controller-manager vc-webhook-manager
