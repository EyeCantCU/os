package:
  name: py3-puccinialin
  description: Install rust into a temporary directory to support rust-based builds.
  version: 0.1.5
  epoch: 0
  copyright:
    - license: Apache-2.0 AND MIT

vars:
  pypi-package: puccinialin
  import: puccinialin

data:
  - name: py-versions
    items:
      3.10:
      3.11:
      3.12:
      3.13:

environment:
  contents:
    packages:
      - py3-supported-build-base-dev
      - py3-supported-hatchling

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/konstin/puccinialin.git
      expected-commit: f5c60cce5f79d1a7066bcf2ef1a53173498e2775
      tag: v${{package.version}}

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-httpx
        - py${{range.key}}-platformdirs
        - py${{range.key}}-tqdm
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            # Not strictly required at runtime since this package is just rust tooling
            - build-base
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.pypi-package}}
        - runs: |
            mkdir -p /tmp/rustinstall
            mkdir -p helloworld/src
            tee helloworld/Cargo.toml <<'EOF'
            [package]
            name = "helloworld"
            version = "0.1.0"
            edition = "2024"

            [dependencies]
            EOF
            tee helloworld/src/main.rs <<'EOF'
            fn main() {
              println!("Hello, Linky!");
            }
            EOF

            cd helloworld
            python${{range.key}} <<'EOF'
            import os
            from subprocess import check_call

            from puccinialin import setup_rust

            extra_env = setup_rust("/tmp/rustinstall")
            check_call(["cargo", "build"], env={**os.environ, **extra_env})
            EOF

  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}-bin
    description: Executable binaries for ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provider-priority: ${{range.value}}
      provides:
        - py3-${{vars.pypi-package}}
        - py3-${{vars.pypi-package}}-bin
      runtime:
        - py${{range.key}}-${{vars.pypi-package}}
    pipeline:
      - uses: split/bin
    test:
      pipeline:
        - uses: test/tw/help-check
          with:
            bins: puccinialize
        - runs: |
            puccinialize | tee out.txt
            grep -E -e "PATH.*/root/.cache" out.txt
        - uses: test/tw/help-check
          with:
            bins: /root/.cache/puccinialin/cargo/bin/cargo

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
