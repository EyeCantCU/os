package:
  name: kyverno-policy-reporter-plugins-kyverno
  version: 0.5.0
  epoch: 0
  description: Policy Reporter Plugin Kyverno
  copyright:
    - license: Apache-2.0

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/kyverno/policy-reporter-plugins
      tag: kyverno-plugin-v${{package.version}}
      expected-commit: 0c7b5b46d661eb65660db47804f699f4b3dc17fe

  - uses: go/bump
    with:
      modroot: plugins/kyverno
      deps: |-
        github.com/go-viper/mapstructure/v2@v2.4.0

  - uses: go/build
    with:
      go-package: go
      output: kyverno-plugin
      packages: .
      modroot: plugins/kyverno

test:
  pipeline:
    - runs: |
        kyverno-plugin --help

subpackages:
  - name: ${{package.name}}-compat
    description: compatibility symlinks package for kyverno-plugin Dockerfile
    pipeline:
      - runs: |
          # Symlink the binary from usr/bin to /ko-app/
          mkdir -p ${{targets.subpkgdir}}/ko-app
          ln -sf /usr/bin/kyverno-plugin ${{targets.subpkgdir}}/ko-app/kyverno-plugin

update:
  enabled: true
  git:
    strip-prefix: kyverno-plugin-v
    tag-filter-prefix: kyverno
