package:
  name: py${{vars.py-version}}-safetensors
  version: 0.5.2
  epoch: 0
  description: Simple, safe way to store and distribute tensor
  copyright:
    - license: Apache-2.0

vars:
  py-version: 3.10

environment:
  contents:
    packages:
      - build-base
      - busybox
      - maturin
      - py${{vars.py-version}}-build
      - py${{vars.py-version}}-installer
      - py${{vars.py-version}}-maturin
      - py${{vars.py-version}}-pip
      - py${{vars.py-version}}-wheel
      - python-${{vars.py-version}}
      - rust

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/f4/4f/2ef9ef1766f8c194b01b67a63a444d2e557c8fe1d82faf3ebd85f370a917/safetensors-${{package.version}}.tar.gz
      expected-sha512: f59dd80358397896f2fc48ce9f6679fb2ec7600f981dd64ffd388e26e887db17d2060afe8295842e78ce63ec69e076e34e8786c795749316af671755a09ab667

  - uses: py/pip-build-install
    with:
      python: python${{vars.py-version}}
      dest: ${{targets.contextdir}}

  - uses: strip

test:
  environment:
    contents:
      packages:
        - curl
        - python-${{vars.py-version}}
        - py${{vars.py-version}}-numpy
        - py${{vars.py-version}}-pip
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.py-version}}
        import: safetensors
    - name: verify installation
      runs: |
        pip install torch
        curl -O https://raw.githubusercontent.com/huggingface/safetensors/refs/heads/main/bindings/python/tests/test_simple.py
        python3 test_simple.py

update:
  enabled: true
  release-monitor:
    identifier: 291110
