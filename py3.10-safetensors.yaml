package:
  name: py${{vars.py-version}}-safetensors
  version: "0.5.3"
  epoch: 0
  description: Simple, safe way to store and distribute tensor
  copyright:
    - license: Apache-2.0

vars:
  py-version: 3.10

environment:
  contents:
    packages:
      - build-base
      - busybox
      - maturin
      - py${{vars.py-version}}-build
      - py${{vars.py-version}}-installer
      - py${{vars.py-version}}-maturin
      - py${{vars.py-version}}-pip
      - py${{vars.py-version}}-wheel
      - python-${{vars.py-version}}
      - rust

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/s/safetensors/safetensors-${{package.version}}.tar.gz
      expected-sha512: 6c0545982605711a4912c2bc6dca6387a2f7518afc8faca5e461f9916c37105602aa78f75da43cd0477a62a09bb3d7d250e17787f2161e227573515655c06fb3

  - uses: py/pip-build-install
    with:
      python: python${{vars.py-version}}
      dest: ${{targets.contextdir}}

  - uses: strip

test:
  environment:
    contents:
      packages:
        - curl
        - python-${{vars.py-version}}
        - py${{vars.py-version}}-numpy
        - py${{vars.py-version}}-pip
  pipeline:
    - uses: python/import
      with:
        python: python${{vars.py-version}}
        import: safetensors
    - name: verify installation
      runs: |
        pip install torch
        curl -O https://raw.githubusercontent.com/huggingface/safetensors/refs/heads/main/bindings/python/tests/test_simple.py
        python3 test_simple.py

update:
  enabled: true
  release-monitor:
    identifier: 291110
