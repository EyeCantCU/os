package:
  name: py3-sagemaker-inference
  version: 1.10.1
  epoch: 0
  description: Serve machine learning models within a Docker container using Amazon SageMaker
  copyright:
    - license: Apache-2.0

vars:
  pypi-package: sagemaker-inference
  import: sagemaker_inference
  java-version: 17

environment:
  contents:
    packages:
      - py3-supported-build-base-dev

data:
  - name: py-versions
    items:
      # Scipy is compiled with an older version of numpy which conflicts with numpy 2.2+
      3.11:
      3.12:
      3.13:

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/sagemaker-inference-toolkit.git
      tag: v${{package.version}}
      expected-commit: d05801ff35040cb21ef404e828632fc002d1ef57

  - runs: sed -i 's/retrying>=.*,<.*.[[:digit:]]/retrying/g' ./setup.py

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      runtime:
        - py${{range.key}}-boto3
        - py${{range.key}}-botocore
        - py${{range.key}}-setuptools
        - py${{range.key}}-psutil
        - py${{range.key}}-retrying
        - py${{range.key}}-scipy
        - py${{range.key}}-six
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      environment:
        contents:
          packages:
            # Only required for this entrypoint, not necessary for basic package functionality
            - py${{range.key}}-multi-model-server-bin
            # Java version for multi-model-server (arbitrary choice)
            - openjdk-${{vars.java-version}}-default-jdk
            - curl
            - wait-for-it
            - jq
      pipeline:
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.import}}
        - uses: test/daemon-check-output
          with:
            setup: |
              tee mms-entrypoint.py <<'EOF'
              # Copyright 2019-2020 Amazon.com, Inc. or its affiliates. All Rights Reserved.
              #
              # Licensed under the Apache License, Version 2.0 (the "License"). You
              # may not use this file except in compliance with the License. A copy of
              # the License is located at
              #
              #     http://aws.amazon.com/apache2.0/
              #
              # or in the "license" file accompanying this file. This file is
              # distributed on an "AS IS" BASIS, WITHOUT WARRANTIES OR CONDITIONS OF
              # ANY KIND, either express or implied. See the License for the specific
              # language governing permissions and limitations under the License.

              import shlex
              import subprocess
              from subprocess import CalledProcessError
              import sys
              from time import sleep

              from sagemaker_inference import default_handler_service
              from sagemaker_inference import model_server

              HANDLER_SERVICE = default_handler_service.__name__


              def _retry_if_error(exception):
                  return isinstance(exception, CalledProcessError)


              def _start_model_server():
                  sleep(5)
                  model_server.start_model_server(handler_service=HANDLER_SERVICE)

              _start_model_server()
              EOF
            start: python${{range.key}} ./mms-entrypoint.py
            expected_output: |
              Inference API
            post: |
              wait-for-it localhost:8080
              # If API is up and returns non-broken JSON, we can be quite confident that anything that uses this library should be fine
              curl localhost:8080 | jq -rc .message | grep -F -e "Requested method is not allowed"

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/metapackage
        - uses: python/import
          with:
            python: python3.10
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.11
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.12
            import: ${{vars.import}}
        - uses: python/import
          with:
            python: python3.13
            import: ${{vars.import}}

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/emptypackage
