package:
  name: packer-fips
  version: 1.11.2
  epoch: 0
  copyright:
    - license: BUSL-1.1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/packer
      tag: v${{package.version}}
      expected-commit: 85d7c1a9b2f64bf673809ee356e9dc743e3ddddb

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      output: packer
      ldflags: -X github.com/packer/version.GitCommit=$(git rev-parse HEAD)

update:
  enabled: true
  github:
    identifier: hashicorp/packer
    strip-prefix: v

test:
  pipeline:
    - name: Verison Check
      runs: |
        packer version
        packer --version
        packer --help
    - uses: test/go-fips-check
