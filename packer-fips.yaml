package:
  name: packer-fips
  version: "1.14.2"
  epoch: 0 # GHSA-jc7w-c686-c4v9
  copyright:
    - license: BUSL-1.1

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/hashicorp/packer
      tag: v${{package.version}}
      expected-commit: e703473a9baf87dfd62ea1c9a3dc6200decd5e32

  - uses: go/build
    with:
      go-package: go-fips
      packages: .
      output: packer
      ldflags: -X github.com/packer/version.GitCommit=$(git rev-parse HEAD)

update:
  enabled: true
  github:
    identifier: hashicorp/packer
    strip-prefix: v

test:
  pipeline:
    - name: Verison Check
      runs: |
        packer version
        packer --version
        packer --help
    - uses: test/go-fips-check
