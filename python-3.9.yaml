package:
  name: python-3.9
  version: 3.9.18
  epoch: 5
  description: "the Python programming language"
  copyright:
    - license: PSF-2.0
  dependencies:
    runtime:
    provides:
      - python3=${{package.full-version}}
      - python-3=${{package.full-version}}

environment:
  contents:
    packages:
      - busybox
      - ca-certificates-bundle
      - build-base
      - bzip2-dev
      - expat-dev
      - gdbm-dev
      - libffi-dev
      - linux-headers
      - mpdecimal-dev
      - ncurses-dev
      - openssl-dev
      - readline-dev
      - sqlite-dev
      - xz-dev
      - zlib-dev

pipeline:
  - uses: fetch
    with:
      uri: https://www.python.org/ftp/python/${{package.version}}/Python-${{package.version}}.tar.xz
      expected-sha256: 01597db0132c1cf7b331eff68ae09b5a235a3c3caa9c944c29cac7d1c4c4c00a

  - name: Force use of system libraries
    runs: |
      rm -rf Modules/expat \
        Modules/_ctypes/darwin* \
        Modules/_ctypes/libffi*

  - uses: patch
    with:
      patches: CVE-2023-27043.patch

  - uses: patch
    with:
      patches: CVE-2023-27043-enable-disable.patch

  - name: Configure
    runs: |
      ./configure \
         --host=${{host.triplet.gnu}} \
         --build=${{host.triplet.gnu}} \
         --target=${{host.triplet.gnu}} \
         --prefix=/usr \
         --enable-ipv6 \
         --enable-loadable-sqlite-extensions \
         --enable-optimizations \
         --enable-shared \
         --without-lto \
         --with-computed-gotos \
         --with-dbmliborder=gdbm:ndbm \
         --with-system-expat \
         --with-system-ffi \
         --with-system-libmpdec \
         --without-ensurepip \
         --with-lto

  - uses: autoconf/make

  - uses: autoconf/make
    with:
      opts: altinstall DESTDIR="${{targets.destdir}}"

  - runs: |
      find ${{targets.destdir}}/usr/lib -type f -name '*.pyc' -exec rm -rf '{}' +
      find ${{targets.destdir}}/usr/lib -type f -name '*.pyo' -exec rm -rf '{}' +
      find ${{targets.destdir}}/usr/lib -type f -name 'libpython*.a' -exec rm -rf '{}' +
      find ${{targets.destdir}}/usr/lib -type d -name 'test' -exec rm -rf '{}' +
      find ${{targets.destdir}}/usr/lib -type d -name 'tests' -exec rm -rf '{}' +
      find ${{targets.destdir}}/usr/lib -type d -name 'idle_test' -exec rm -rf '{}' +

      cd ${{targets.destdir}}/usr/bin
      rm -f python3 pydoc3 idle3* 2to3*
      rm ${{targets.destdir}}/usr/lib/libpython3.so

      # Drop site-packages README.txt to avoid SCA dep on python3~3.M
      cd ${{targets.destdir}}/usr/lib/python3.9
      rm site-packages/README.txt
      rmdir site-packages

  - uses: strip

test:
  pipeline:
    - runs: |
        python3.9 CVE-2023-27043-unittest.py

subpackages:
  - name: "python-3.9-default"
    description: "python-3.9 as /usr/bin/python3"
    dependencies:
      provides:
        - python3=${{package.full-version}}
        - python-3=${{package.full-version}}
      runtime:
        - python-3.9
    pipeline:
      - runs: |
          mkdir -p ${{targets.subpkgdir}}/usr/bin
          ln -sf python3.9 "${{targets.subpkgdir}}"/usr/bin/python3
          ln -sf pydoc3.9 "${{targets.subpkgdir}}"/usr/bin/pydoc3
          ln -sf python3 "${{targets.subpkgdir}}"/usr/bin/python

  - name: "python-3.9-doc"
    description: "python3.9 documentation"
    pipeline:
      - uses: split/manpages

  - name: "python-3.9-dev"
    description: "python3.9 development headers"
    pipeline:
      - uses: split/dev
      - runs: |
          mkdir -p "${{targets.destdir}}"/usr/include/python3.9
          mv "${{targets.subpkgdir}}"/usr/include/python3.9/pyconfig.h "${{targets.destdir}}"/usr/include/python3.9
    dependencies:
      runtime:
        - python-3.9

update:
  enabled: true
  github:
    identifier: python/cpython
    strip-prefix: v
    tag-filter: v3.9
    use-tag: true
