package:
  name: eks-distro-kubernetes-csi-livenessprobe-2.12
  version: 2.12.0 # eks-distro v1-25-eks-38: https://github.com/aws/eks-distro/releases/tag/v1-25-eks-38
  epoch: 9
  description: A sidecar container that can be included in a CSI plugin pod to enable integration with Kubernetes Liveness Probe.
  copyright:
    - license: Apache-2.0
  dependencies:
    provides:
      - eks-distro-kubernetes-csi-livenessprobe=${{package.full-version}}

vars:
  eks-project: kubernetes-csi/livenessprobe
  eks-package-version: 1-25-eks-38

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/aws/eks-distro
      tag: v${{vars.eks-package-version}}
      expected-commit: eaa252c665ca550c2ef04b79436597955da6552f

  - uses: eks-distro/build
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      deps: google.golang.org/protobuf@v1.33.0 github.com/golang/protobuf@v1.5.4 golang.org/x/net@v0.23.0

  - uses: eks-distro/install
    with:
      eks-project: ${{vars.eks-project}}
      eks-package-version: ${{vars.eks-package-version}}
      binary-target: livenessprobe

  - uses: strip

update:
  manual: true
