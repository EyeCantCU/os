package:
  name: traefik-fips-3.2
  version: 3.2.5
  epoch: 13
  description: The Cloud Native Application Proxy
  copyright:
    - license: MIT
  dependencies:
    provides:
      - traefik-fips=${{package.full-version}}

environment:
  contents:
    packages:
      - build-base
      - nodejs-20
      - yarn

pipeline:
  - uses: git-checkout
    with:
      expected-commit: 03c170f2642ee690ad9d41c2a5889b4834d4652c
      repository: https://github.com/traefik/traefik
      tag: v${{package.version}}

  - working-directory: webui
    runs: |
      yarn install
      yarn build

  - uses: go/bump
    with:
      deps: |-
        github.com/go-jose/go-jose/v4@v4.0.5
        golang.org/x/crypto@v0.35.0
        golang.org/x/oauth2@v0.27.0
        golang.org/x/net@v0.38.0
        github.com/golang-jwt/jwt/v4@v4.5.2
        github.com/golang-jwt/jwt/v5@v5.2.2
        github.com/redis/go-redis/v9@v9.6.3
        github.com/go-viper/mapstructure/v2@v2.3.0
      modroot: .

  - uses: go/build
    with:
      modroot: .
      packages: ./cmd/traefik
      output: traefik
      ldflags: |
        -X github.com/traefik/traefik/v3/pkg/version.Version=${{package.version}}
        -X github.com/traefik/traefik/v3/pkg/version.BuildDate=$(date -u '+%Y-%m-%d_%I:%M:%S%p')
        -X github.com/traefik/traefik/v3/pkg/version.Codename=$CODENAME
      go-package: go-fips

update:
  enabled: true
  git:
    strip-prefix: v
    tag-filter-prefix: v3.2.

test:
  environment:
    contents:
      packages:
        - openssl-config-fipshardened
  pipeline:
    - runs: |
        set -o pipefail
        traefik version | grep ${{package.version}}
        traefik --help
    - name: Run and test traefik
      uses: test/daemon-check-output
      with:
        start: traefik --ping=true --ping.entryPoint=traefik --api.insecure=true --log.level=DEBUG
        timeout: 30
        expected_output: |
          Creating middleware
          Setting up redirection
