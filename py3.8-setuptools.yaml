# Generated from https://pypi.org/project/setuptools/
package:
  name: py3.8-setuptools
  version: 75.3.0
  epoch: 0
  description: Easily download, build, install, upgrade, and uninstall Python packages
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.8

environment:
  contents:
    packages:
      - busybox
      - python-3.8

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/s/setuptools/setuptools-${{package.version}}.tar.gz
      expected-sha256: fba5dd4d766e97be1b1681d98712680ae8f2f26d7881245f2ce9e40714f1a686

  - name: Python Build
    runs: python setup.py build

  - name: Python Install
    runs: python setup.py install --prefix=/usr --root="${{targets.destdir}}"

  - uses: strip

test:
  pipeline:
    - uses: python/import
      with:
        imports: import setuptools

update:
  enabled: true
  release-monitor:
    identifier: 4021
