# Generated from https://pypi.org/project/setuptools/
package:
  name: py3.8-setuptools
  version: 74.1.1
  epoch: 0
  description: Easily download, build, install, upgrade, and uninstall Python packages
  copyright:
    - license: MIT
  dependencies:
    runtime:
      - python-3.8

environment:
  contents:
    packages:
      - busybox
      - python-3.8

pipeline:
  - uses: fetch
    with:
      uri: https://files.pythonhosted.org/packages/source/s/setuptools/setuptools-${{package.version}}.tar.gz
      expected-sha256: 2353af060c06388be1cecbf5953dcdb1f38362f87a2356c480b6b4d5fcfc8847

  - name: Python Build
    runs: python setup.py build

  - name: Python Install
    runs: python setup.py install --prefix=/usr --root="${{targets.destdir}}"

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 4021
