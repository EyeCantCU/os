package:
  name: py3-pydyf
  version: "0.12.1"
  epoch: 0
  description: A low-level PDF generator
  copyright:
    - license: BSD-3-Clause
  dependencies:
    provider-priority: 0

vars:
  pypi-package: pydyf
  module-name: pydyf

data:
  - name: py-versions
    items:
      3.10: '310'
      3.11: '311'
      3.12: '312'
      3.13: '313'

environment:
  contents:
    packages:
      - build-base
      - busybox
      - ca-certificates-bundle
      - py3-supported-flit-core
      - py3-supported-pip
      - py3-supported-wheel

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/CourtBouillon/pydyf
      tag: v${{package.version}}
      expected-commit: 99582dbe5f2544628212c864d8e4093544b7e307

subpackages:
  - range: py-versions
    name: py${{range.key}}-${{vars.pypi-package}}
    description: ${{vars.pypi-package}} installed for python${{range.key}}
    dependencies:
      provides:
        - py3-${{vars.pypi-package}}
      provider-priority: ${{range.value}}
    pipeline:
      - uses: py/pip-build-install
        with:
          python: python${{range.key}}
      - uses: strip
    test:
      pipeline:
        - uses: test/tw/virtualpackage
          with:
            virtual-pkg-name: py3-${{vars.pypi-package}}
        - uses: test/tw/pip-check
        - uses: python/import
          with:
            python: python${{range.key}}
            import: ${{vars.module-name}}
        - runs: |
            set -euo pipefail

            # Test basic PDF generation
            python${{range.key}} <<'EOF'
            import pydyf
            from io import BytesIO

            # Create a simple PDF document
            pdf = pydyf.PDF()

            # Create a simple stream with some content
            stream = pydyf.Stream()

            # Add a page with the stream
            pdf.add_page(pydyf.Dictionary({
                'Type': '/Page',
                'MediaBox': pydyf.Array([0, 0, 200, 200]),
                'Contents': stream,
            }))

            # Generate PDF bytes
            output = BytesIO()
            pdf.write(output)
            pdf_bytes = output.getvalue()

            # Verify it's a valid PDF
            assert pdf_bytes.startswith(b'%PDF-'), "Output should be a PDF"
            assert b'%%EOF' in pdf_bytes, "PDF should have proper ending"

            print("pydyf basic PDF generation test passed!")
            EOF

  - name: py3-supported-${{vars.pypi-package}}
    description: meta package providing ${{vars.pypi-package}} for supported python versions.
    dependencies:
      runtime:
        - py3.10-${{vars.pypi-package}}
        - py3.11-${{vars.pypi-package}}
        - py3.12-${{vars.pypi-package}}
        - py3.13-${{vars.pypi-package}}
    test:
      pipeline:
        - uses: test/tw/metapackage

update:
  enabled: true
  git:
    strip-prefix: v

test:
  pipeline:
    - uses: test/tw/byproductpackage
